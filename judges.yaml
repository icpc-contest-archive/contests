# Online judges where ICPC problems can be solved (or were). Referenced by id from
# `judge:` on judge_page sources (series/*.yaml) and from problem judge links
# (problemsets/*.yaml). Add an entry before using a new id; validate.py checks.
judges:
- id: kattis
  name: Kattis
  short: Kattis
  url: https://open.kattis.com/
  problem_url: https://open.kattis.com/problems/{id}
  contest_url: https://open.kattis.com/problem-sources/{id}
  status: active
  statements: true
  submissions: true
  notes: Problem-source pages list a contest's problems; short names are the problem ids.
- id: livearchive
  name: ICPC Live Archive
  short: Live Archive
  url: https://onlinejudge.org/
  problem_url: https://onlinejudge.org/index.php?option=com_onlinejudge&Itemid=8&page=show_problem&problem={id}
  contest_url: https://onlinejudge.org/index.php?option=com_onlinejudge&Itemid=8&category={id}
  status: active
  statements: true
  submissions: true
  notes: Formerly icpcarchive.ecs.baylor.edu (same ids); category pages hold one contest each.
- id: baekjoon
  name: Baekjoon Online Judge
  short: Baekjoon
  url: https://www.acmicpc.net/
  problem_url: https://www.acmicpc.net/problem/{id}
  contest_url: https://www.acmicpc.net/category/detail/{id}
  status: closed
  closed: '2026-04-28'
  statements: true
  submissions: false
  notes: Service ended 2026-04-28 (서비스 종료); pages survive only in Wayback snapshots before that date.
- id: codeforces
  name: Codeforces Gym
  short: Codeforces
  url: https://codeforces.com/gyms
  problem_url: https://codeforces.com/gym/{id}
  contest_url: https://codeforces.com/gym/{id}
  status: active
  statements: true
  submissions: true
  notes: Gym pages need a login to view; ids are gym number (+ problem letter).
- id: qoj
  name: QOJ / Universal Cup
  short: QOJ
  url: https://qoj.ac/
  problem_url: https://qoj.ac/problem/{id}
  contest_url: https://qoj.ac/contest/{id}
  status: active
  statements: true
  submissions: true
  notes: 'The ICPC category tree (https://qoj.ac/category/2: World Finals, championships, regionals of
    all eight regions; 534 contests on 2026-11-12) is public but behind a Cloudflare browser check: readable
    from a normal browser, 403 to curl/WebFetch. Contest pages (/contest/{id}) and their problem lists
    redirect to a login behind a human-verification step, so per-problem links need a logged-in browser
    session; single problem pages (/problem/{id}) and the problem list (/problems) are public. Standings
    are Universal Cup replays, never the original results. Imported by tools/import_qoj_tree.py (reports/qoj-tree-2026-11-12.md).'
- id: aoj
  name: Aizu Online Judge (AOJ)
  short: AOJ
  url: https://onlinejudge.u-aizu.ac.jp/
  problem_url: https://onlinejudge.u-aizu.ac.jp/problems/{id}
  contest_url: https://onlinejudge.u-aizu.ac.jp/challenges/sources/ICPC/Regional/{id}
  status: active
  statements: true
  submissions: true
  notes: Hosts every ICPC Asia Japan regional 1998-2024 (one 'challenge day' per year, ids 49-325) plus
    Japan Domestic qualifiers (ICPC/Prelim, not catalogue) and JAG practice contests (not catalogue).
    Old judgeapi.u-aizu.ac.jp returns 410 Gone; the live JSON API is https://onlinejudge.u-aizu.ac.jp/api/
    (e.g. /api/challenges, /api/challenges/cl/ICPC/Regional, /api/problems?page=0&size=N). 2025 Yokohama
    regional not yet listed as of 2026-11-03.
- id: beecrowd
  name: beecrowd (ex URI Online Judge)
  short: beecrowd
  url: https://judge.beecrowd.com/
  problem_url: https://judge.beecrowd.com/en/problems/view/{id}
  status: active
  statements: true
  submissions: true
  notes: 'The judge itself needs an account for every page (free sign-up), but each statement is public
    at https://resources.beecrowd.com/repository/UOJ_{id}_en.html (UOJ_{id}.html for Portuguese) from
    a normal browser (Cloudflare 403 to curl), with a "By <author or contest>" line. Problems 1000-3499
    read that way 2026-11-14 (2,489 exist) and matched by title, English or Portuguese, to the catalogue:
    Maratona first phase 2007-2019 and 2022, Latin America 2007-2022, South America 2002-2005, World Finals
    2011-2015 and 2017, NCPC 2005-2019, ACPC 2004-2006. No contest pages.'
- id: codechef
  name: CodeChef
  short: CodeChef
  url: https://www.codechef.com/
  problem_url: https://www.codechef.com/problems/{id}
  contest_url: https://www.codechef.com/{id}
  status: active
  statements: true
  submissions: true
  notes: 'Hosts ICPC India (Asia West) regionals: online first rounds / preliminaries 2010-2016 and onsite
    mirror/replay contests 2012-2019 and 2025. Public APIs: past list https://www.codechef.com/api/list/contests/past?sort_by=START&sorting_order=desc&offset=N&mode=all
    (20/page, 2198 contests back to 2009; no search param) and per-contest https://www.codechef.com/api/contests/{code}
    (problems with names). 2020-2024 ICPC India rounds were NOT found in the past-contest API (codes unknown;
    probably not in the public list). Replay/mirror contests contain the official onsite problem set.'
- id: dmoj
  name: DMOJ
  short: DMOJ
  url: https://dmoj.ca/
  problem_url: https://dmoj.ca/problem/{id}
  contest_url: https://dmoj.ca/problems/?search={id}
  status: active
  statements: true
  submissions: true
  notes: 'Canadian judge. HTML is behind Cloudflare for curl but the public API works: https://dmoj.ca/api/v2/problems?page=N
    (5275 problems) and /api/v2/contests (506 contests, no ICPC mirrors). Problem group "ICPC" + name
    prefix "ICPC <contest> <letter> - <title>" gives complete sets for ECNA 2016, NAQ 2016, PACNW 2016,
    SWERC 2017, ECNA 2005, CTU Open 2017/2018, partial ECNA 2000, NEERC 2010 and singles. No contest pages;
    the "contest_url" is a problem-list search.'
- id: eolymp
  name: Eolymp (ex e-olymp)
  short: Eolymp
  url: https://eolymp.com/
  problem_url: https://basecamp.eolymp.com/en/problems/{id}
  problem_url: https://eolymp.com/problems/{id}
  contest_url: https://eolymp.com/contests/{id}
  status: active
  statements: true
  submissions: true
  notes: 'Public REST API https://api.eolymp.com/spaces/00000000-0000-0000-0000-000000000000/contests?size=100&offset=N
    lists 1317 public contests (name, startsAt, problemCount). Contest problem lists and statements require
    sign-in (API /contests/{id}/problems -> unauthenticated), so matches are by contest name/date only.
    Hosts the Ukrainian ICPC chain: UCPC Stage I (1/8 final, Sept/Oct), Stage II (1/4 final = catalogue
    ukraine-YYYY), Stage III (1/2 final, Dec) 2020-2026, plus 2012-2014-era mirrors of many regionals
    (GNY/ECNA/MCPC/NCNA/RMC/SCUSA/NAQ 2013, NWERC 2013, BAPC 2013, CTU Open 2013, NCPC 2013, SEERC 2003/2009/2013,
    NEERC 2006/2011, Latin America 2012/2013, Tokyo 2012, Aizu 2013, Tehran 2007, Maratona 2010) and NERC
    2019/2022, SWERC 2011/2020. Azerbaijan contests on eolymp are school olympiads/qualifications, not
    the ICPC regional.'
- id: hdu
  name: HDU Online Judge (acm.hdu.edu.cn)
  short: HDU
  url: https://acm.hdu.edu.cn/
  problem_url: https://acm.hdu.edu.cn/showproblem.php?pid={id}
  contest_url: https://acm.hdu.edu.cn/contests/contest_show.php?cid={id}
  status: active
  statements: true
  submissions: true
  notes: GBK-encoded. STD contest list https://acm.hdu.edu.cn/contests/contest_list.php?page=N&type= (36
    pages, 618 contests). Public 重现赛/题目重现 re-runs of China regionals 2013-2017 (Hangzhou/Chengdu/Nanjing
    2013, Anshan/Beijing/Guangzhou 2014, Shenyang/Changchun/Hefei/Shanghai 2015, Shenyang/Dalian/Qingdao
    2016, Shenyang 2017); 'Online' preliminaries are Private (login). contest_show.php lists problems
    for ended public contests without login; /contest/problems?cid= redirects. Regional sets also live
    in the main archive (problems 4xxx-6xxx, Source field) but source search returned nothing. Server
    flaky (connection resets).
- id: luogu
  name: Luogu 洛谷 (Luògǔ)
  short: Luogu
  url: https://www.luogu.com.cn/
  problem_url: https://www.luogu.com.cn/problem/{id}
  contest_url: https://www.luogu.com.cn/contest/{id}
  status: active
  statements: true
  submissions: true
  notes: Official-team (洛谷官方团队) 重现赛 (chóngxiànsài, replay) mirrors of ICPC China regionals / EC-Final
    with original data (credit 计蒜客 Jisuanke), run 2023-2026 and ongoing (new one roughly weekly). Contest
    list JSON is embedded in <script id=lentille-context> on /contest/list?page=N (1404 contests, 71 pages);
    contest pages embed contestProblems with pid (P1xxxx) and titles. Some mirrors (Nanjing 2022-24, Jinan
    2023, Kunming inv.) carry Chinese-translated titles. Statements viewable without login; submitting
    needs account.
- id: nowcoder
  name: NowCoder 牛客竞赛 (Niúkè, 'cow guest')
  short: NowCoder
  url: https://ac.nowcoder.com/
  problem_url: https://ac.nowcoder.com/acm/contest/{id}
  contest_url: https://ac.nowcoder.com/acm/contest/{id}
  status: active
  statements: true
  submissions: true
  notes: 'Official judge for the 45th/46th ICPC China regionals (2020 Jinan, Nanjing, Shanghai, Kunming;
    2021 Shenyang, Shanghai, Kunming) and 重现赛 mirrors of 2018 EC-Final, 2019 EC-Final/Shanghai, 2020 Shenyang.
    Problem list JSON: https://ac.nowcoder.com/acm/contest/problem-list?id={id} (public, no login). Contest
    search https://ac.nowcoder.com/acm-heavy/acm/contest/search?searchName=... is capped at ~10-15 hits;
    ended-contest list /acm/contest/vip-end-index?topCategoryFilter=13&categoryFilter=22 (比赛真题 ''real
    past contests'') is mostly provincial contests. Problem statements need login? -> statements render
    for anonymous users on /acm/contest/{id}/{letter}.'
- id: omegaup
  name: omegaUp
  short: omegaUp
  url: https://omegaup.com/
  problem_url: https://omegaup.com/arena/problem/{id}/
  contest_url: https://omegaup.com/arena/{id}/
  status: active
  statements: true
  submissions: true
  notes: 'Mexican judge used by ICPC Mexico. /api/contest/list/ returns only current contests to anonymous
    callers (no past list), /api/contest/problems/ needs login; /api/contest/publicDetails/?contest_alias=X
    works for public contests. /api/problem/list/?tag[]=problemTagICPC lists 41 public problems incl.
    the full ICPCMX2021 set (alias prefix ICPCMX2021-). Contest "Concurso Regional #ICPCMX2021" (alias
    ICPCMX2021, 2022-04-02) confirmed. Other years'' aliases not guessable; TCMM/Gran Premio contests
    not found.'
- id: pintia
  name: PTA 拼题A (Pīntí A, 'puzzle-piece problem A', pintia.cn), home of the ZOJ problem set
  short: PTA
  url: https://pintia.cn/
  problem_url: https://pintia.cn/problem-sets/91827364500/exam/problems/type/7?problemSetProblemId={id}
  status: active
  statements: true
  submissions: true
  notes: 'Hosts the old ZOJ (Zhejiang University Online Judge) archive as the public "ZOJ Problem Set"
    (set 91827364500; 3,179 problems, ZOJ numbers 1001-4179): statements open without an account, submitting
    needs one. ZOJ number N has the address id 91827364500 + N - 1001 while numbers run unbroken; the
    list is https://pintia.cn/api/problem-sets/91827364500/exam-problem-list?problem_type=PROGRAMMING&page=0&limit=100
    (send Accept: application/json). The set keeps no source field, so the 135 regional sets found there
    2026-11-14 were matched by title in runs of neighbouring ZOJ numbers. PTA''s own contest sets (the
    China regionals it ran) stay visible only to enrolled accounts; /api/competitions/public lists XCPC
    scoreboards.'
- id: timus
  name: Timus Online Judge
  short: Timus
  url: https://acm.timus.ru/
  problem_url: https://acm.timus.ru/problem.aspx?space=1&num={id}
  contest_url: https://acm.timus.ru/problemset.aspx?space={id}
  status: active
  statements: true
  submissions: true
  notes: 'Ural FU judge. Past-contest archive at /archive.aspx (110 contests, each with a problem "space");
    the main problem set (/problemset.aspx?space=1&page=all, 1243 problems) has a Source column naming
    the origin contest (NEERC 2000-2002 finals, NEERC Central/Northern/Eastern subregionals). ICPC-relevant:
    NEERC Eastern (Ural) subregional 2006-2014 live online versions, Central subregional (Rybinsk) 2001-2003,
    plus NEERC 2000-2002 and Central 2000 / Northern 2001 problems in the main set. Since 2015 Timus only
    hosts the Ural *qualifier* rounds, not the regional itself.'
- id: poj
  name: PKU JudgeOnline (POJ)
  short: POJ
  url: http://poj.org/
  problem_url: http://poj.org/problem?id={id}
  contest_url: http://poj.org/searchproblem?field=source&key={id}
  status: active
  statements: true
  submissions: true
  notes: 'Peking University judge. Every problem carries a Source string ("Northeastern Europe 2003, Far-Eastern
    Subregion", "Tehran 2004", "CTU Open 1999"); the source search is the only per-contest view (no contest
    pages). Problem lists read 2026-11-13 through the vjudge.net mirror (2,989 problems); matched to catalogue
    contests by the harvest classification (_hunt/problems-2026-11-13/agents-out/).'
- id: cats
  name: CATS (Far Eastern Federal University)
  short: CATS
  url: https://imcs.dvfu.ru/cats/
  problem_url: https://imcs.dvfu.ru/cats/static/problem_text-cpid-{id}.html
  contest_url: https://imcs.dvfu.ru/cats/problems?cid={id}
  status: active
  statements: true
  submissions: true
  notes: 'The judge the Far Eastern subregional (Vladivostok) runs on. A contest''s problem list (problems?cid=)
    and its statements (static/problem_text-cid-<id>.html) are readable without an account (checked 2026-11-13).
    Taking part needs an account; the site offers registration, and submitting to a past contest was not tried.
    The scoreboard of a contest is rank_table_content?cid= with the same id.'
- id: bailian
  name: Bailian 百练 (Bǎiliàn, 'hundred drills'; OpenJudge, Peking University)
  short: Bailian
  url: http://bailian.openjudge.cn/
  problem_url: http://bailian.openjudge.cn/practice/{id}
  status: active
  statements: true
  submissions: true
  notes: 'Peking University''s OpenJudge practice set. Problems 1000-2999 carry the same numbers and
    statements as POJ (checked 2026-11-14: 471 of the 485 linked titles are identical on both), so it
    is a second place to solve the POJ-era regional sets; each problem names its source contest. Statements
    open without an account. Problem lists read 2026-11-14 through vjudge.net (source search), matched
    by title within one source. No contest pages.'
- id: tlx
  name: TLX (TOKI Learning Center, Indonesia)
  short: TLX
  url: https://tlx.toki.id/
  problem_url: https://tlx.toki.id/problems/{id}
  contest_url: https://tlx.toki.id/problems/{id}
  status: active
  statements: true
  submissions: true
  notes: 'Ikatan Alumni TOKI''s judge; the home of the ICPC Asia Jakarta regional. Its problem archive
    has one problem set per regional, icpc-jakarta-<year> (2017-2025 seen 2026-11-14), with the contest
    letters as problem ids: /problems/icpc-jakarta-2021/C. Statements open without an account. Read through
    vjudge.net, which had only 6 of the 13 problems of 2024. Also hosts Indonesian provincial rounds (IDEAFUSE
    Sumatra) that are not catalogue contests.'
- id: vnoj
  name: VNOJ (VNOI Online Judge, Vietnam)
  short: VNOJ
  url: https://oj.vnoi.info/
  problem_url: https://oj.vnoi.info/problem/{id}
  status: active
  statements: true
  submissions: true
  notes: 'The Vietnamese olympiad community''s judge (a DMOJ fork). Hosts the ICPC Vietnam chain 2019-2024
    with one code per problem: icpc<yy>_regional_<letter> (the Asia regional held in Vietnam that season),
    icpc<yy>_national_<letter> (Vietnam National), and icpc<yy>_mb/_mt/_mn_<letter> for the northern, central
    and southern provincial rounds (miền Bắc / Trung / Nam; not catalogue contests). Titles read "ICPC
    2022 vòng Regional - A: Aqua" (vòng = round, Quốc gia = national). The site answers a Cloudflare human
    check to both curl and a browser (2026-11-14), so the problem addresses were built from the codes
    vjudge.net lists and were not opened.'
- id: loj
  name: LibreOJ (loj.ac)
  short: LOJ
  url: https://loj.ac/
  problem_url: https://loj.ac/p/{id}
  status: active
  statements: true
  submissions: true
  notes: 'Chinese open judge. Has ICPC World Finals 2017-2025 and CERC 2018 as tagged problem groups;
    only World Finals 2017 and CERC 2018 keep English titles and are linked (2026-11-14, via vjudge.net).
    World Finals 2018-2025 are there under Chinese titles (97 problems, numbers from 6405) and are not
    linked yet: they need matching by letter.'
- id: hackerrank
  name: HackerRank
  short: HackerRank
  url: https://www.hackerrank.com/contests
  problem_url: https://www.hackerrank.com/contests/{id}
  contest_url: https://www.hackerrank.com/contests/{id}/challenges
  status: active
  statements: true
  submissions: true
  notes: 'Ran the official practice/replay contests of several 2014 regionals (NWERC, CERC, SEERC, NAQ,
    Mid-Central, North Central) and of the Arab Collegiate contest 2013 and 2015; two "ACM ICPC warmup
    2015" rounds reuse the Greater NY 2014 and ACPC 2014 sets. A problem is /contests/<contest>/challenges/<challenge>;
    statements open without an account. Found 2026-11-14 through vjudge.net, matched by title within
    one contest.'
- id: sgu
  name: SGU / acm.sgu.ru (Saratov State University archive, on Codeforces)
  short: SGU
  url: https://codeforces.com/problemsets/acmsguru
  problem_url: https://codeforces.com/problemsets/acmsguru/problem/99999/{id}
  status: active
  statements: true
  submissions: true
  notes: 'The old acm.sgu.ru archive, kept alive as a Codeforces problem set (opens in a browser; Cloudflare
    403 to curl). Saratov hosts the NEERC Southern Subregional, and the archive holds its 2002, 2003 and
    2004 sets and the Northern Subregional 2002 as runs of neighbouring numbers; the source string of
    each problem names the contest (read 2026-11-14 through vjudge.net). Nothing says a run is the whole
    contest: 2003 skips number 189.'
- id: spoj
  name: SPOJ (Sphere Online Judge)
  short: SPOJ
  url: https://www.spoj.com/
  problem_url: https://www.spoj.com/problems/{id}/
  status: active
  statements: true
  submissions: true
  notes: 'Polish judge with a large user-added classical archive; each problem has a free-text "Resource"
    line that often names the contest it came from (CERC, ECNA, Mid-Central, World Finals, ACPC, AMPPZ,
    Argentina''s TAP). Cloudflare 403 to curl; opens in a browser. The 6,289 classical problems vjudge.net
    lists were read 2026-11-13 and matched by title within one resource string. National sub-sites exist
    (br.spoj.com for Brazil, pl.spoj.com for Poland) and are separate archives.'
- id: spoj-br
  name: SPOJ Brasil
  short: SPOJ Brasil
  url: https://br.spoj.com/
  problem_url: https://br.spoj.com/problems/{id}/
  status: active
  statements: true
  submissions: true
  notes: 'Brazilian SPOJ sub-site, a separate archive from www.spoj.com. Categories "regionais" (Primeira
    Fase da Maratona de Programação 2005-2011) and "sulamericana" (the South American final 2006-2011),
    in Portuguese; each problem has an "Origem" line naming the contest. Read 2026-11-14 in Chrome
    (Cloudflare blocks curl).'
- id: szkopul
  name: Szkopuł
  short: Szkopuł
  url: https://szkopul.edu.pl/
  problem_url: https://szkopul.edu.pl/problemset/problem/{id}/site/
  status: active
  statements: true
  submissions: true
  notes: Judge of the Polish Olympiad in Informatics (SIO2). Its task archive has an AMPPZ section, https://szkopul.edu.pl/task_archive/amppz/,
    with the 2011-2014 and 2023 problems (Polish statements); problem ids are opaque keys. Read 2026-11-14.
