name: Contest intake pilot

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
  workflow_run:
    workflows: [CI]
    types: [completed]

concurrency:
  group: contest-intake-pilot
  cancel-in-progress: false

permissions:
  contents: read
  deployments: read

jobs:
  sync:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Mint restricted GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.PILOT_GITHUB_APP_ID }}
          private-key: ${{ secrets.PILOT_GITHUB_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r pilot/requirements.txt
      - name: Poll queue and reconcile GitHub/Pages state
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          PILOT_SHEET_ID: ${{ secrets.PILOT_SHEET_ID }}
          PILOT_REVIEWERS: ${{ secrets.PILOT_REVIEWERS }}
          PILOT_APPROVAL_HMAC_SECRET: ${{ secrets.PILOT_APPROVAL_HMAC_SECRET }}
        run: python3 tools/pilot_sync.py run
