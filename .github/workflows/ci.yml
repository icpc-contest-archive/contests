name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r pilot/requirements.txt
      - run: python3 -m unittest tests.test_pilot_sync -v
      - run: python3 tools/pilot_sync.py validate-config
      - run: python3 tools/validate.py

  build-site:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pyyaml
      - run: python3 tools/build_site.py --out site
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: build-site
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
