  - 'U Delaware (B. David Saunders) ''Programming Contests'' history page (1990s (live)): 1997-98 season
    entry (22nd Annual ACM Collegiate Programming Contest): ''Professor Keith Decker was the contact person
    for the programming contest in 1997-98. Again this year U. Delaware was a site of the Mid-Atlantic
    con — https://www.eecis.udel.edu/~saunders/prog-contest.html [existence hunt 2026-10-22]'
  - 'Virginia Tech ''Spectrum'' Vol 18 No 17, 18 Jan 1996 (1996-01-18): Context for the series: 1995 ACM
    Mid-Atlantic Regional had 74 teams (''largest number of teams ever''), 8 problems; Virginia Tech won
    (coach Sallie Henry; team Adam Florence, Nathan Fink, Nick Loehr) and ''has placed first  — https://scholar.lib.vt.edu/vtpubs/spectrum/sp960118/7a.html
    [existence hunt 2026-10-22]'
  - 'U Delaware 1998 Mid-Atlantic regional team page (1998): Negative/context: the page UDel links as
    ''The 1997 Delaware teams'' is actually the 1998 contest (coach Ken Samuel; Pangaea 15th of 101, UDel-A
    35th of 101) — no 1997 content. — https://www.eecis.udel.edu/~saunders/regional98/UDteams.html [existence
    hunt 2026-10-22]'
  - ICPC Problem Archive progress sheet (2026-11-01)
