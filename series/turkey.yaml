  - 'SEERC 2010 final report (2010): ''There were 57 programming teams registered, from Bulgaria, Macedonia,
    Moldova, Serbia, Romania, Turkey and Ukraine''; 52 accepted from 28 universities; contest Saturday
    16 Oct 2010 at Politehnica Bucharest; country table — https://seerc.icpc.global/2010/report.htm [existence
    hunt 2026-10-22]'
  - 'SEERC 2011 final report (2011): 77 teams from 7 countries at two sites (Bucharest 39, Vinnytsia 38);
    Turkey had 4 teams at each site; the report describes no subregional/national qualification for Turkey.
    — https://seerc.icpc.global/2011/report.htm [existence hunt 2026-10-22]'
  - 'METU news (2019-08-24): TPC 2019 (Istanbul, 13-15 Sept 2019) described as the Turkey leg of ICPC
    and ''a first of its kind, multi-tiered and team based competition''; no mention of any earlier Turkish
    ICPC contest. — https://haber.metu.edu.tr/en/2019/08/countdown-to-turkish-programming-contest/ [existence
    hunt 2026-10-22]'
  - 'AGIR Univers Ingineresc (2010): SEERC 2010 at UPB 15-17 Oct 2010: 53 teams from 37 universities in
    7 countries incl. Turkey; top 3 Ukrainian teams. (Independent confirmation of Turkish participation
    in Bucharest, not of a Turkish site.) — https://www.agir.ro/univers-ingineresc/numar-20-2010/a-35-a-editie-a-competitiei-internationale-de-programare-batalia-creierelor_3119.html
    [existence hunt 2026-10-22]'
  notes: 'Q1 2026-09-07: CMS shows 21 registered/18 accepted teams and date 2010-09-13 - indicates (does
    not prove) it ran; no webpage, results or wayback trace found; inzva''s 2019 ''first official Turkish
    contest'' claim may simply not know of it'
