    [existence hunt 2026-10-22]'
  - 'comp.org.acm: Glenn Crocker reply (1991-11-11): ''We had to do a Pascal comment remover (or something
    like that) last year'' — a problem from ECNA 1990; also ''At East Central''s regionals (which were
    2 weeks ago)'' dates ECNA 1991 to ~1991-10-26 (6 problems, 5 hours). — https://groups.google.com/g/comp.org.acm/c/iWNmyMGVexU
    [existence hunt 2026-10-22]'
