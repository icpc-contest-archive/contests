    Problem set as a PDF of 12 pages, in English, with seven problems A to G (Chess, Spin, Vertex, Cube, Rename, Compress, Logic). The page header reads '1993-4 ACM International Collegiate Programming Contest, Western European Regional at University College Swansea'. Each problem has a statement with input and output format and an example, and tells the team which file name to submit, ending in .c for C or .p for Pascal. Problems take one or two pages each, and problem B has diagrams of the puzzle. No results, test data or solutions.

