  description: |-
    Category page of the ICPC Live Archive judge, as it was on 17 October 2021, for Regionals 1992 :: Europe - Northwestern. It lists eight problems with their archive numbers 5570 to 5577: Permalex, Caesar Cypher, Orchard Trees, Bandwidth, Bridge Hands, Student Grants, Amazing and All Squares. For each it gives the total submissions and the solving percentage, and the number of users and their solving percentage.

    The page holds the titles and statistics only; the statements are behind links that are not in our copy. The page also carries the site menu and a login form.
