  description: |-
    Problem set of the Western European Regional of the ACM Scholastic Programming Contest, a PDF of 15 pages with the date 15 November 1992 repeated in the header of every problem. It has eight problems A to H, each starting on its own page with a statement in English, an input and output description and a sample: Permalex, Caesar Cypher, Orchard Trees, Bandwidth, Bridge Hands, Student Grants, Amazing and All Squares.

    There is no cover page, test data or solutions. Mathematical formulas and diagrams in some statements, for example in Permalex and Orchard Trees, do not show in the extracted text.
