  description: |-
    Home page of the Chinese-language website of the Ningbo site, hosted by Zhejiang University Ningbo Institute of Technology, titled ACM第34届国际大学生程序设计竞赛亚洲区预选赛（宁波赛区） (ACM dì-34 jiè guójì dàxuéshēng chéngxù shèjì jìngsài Yàzhōu qū yùxuǎnsài, Níngbō sàiqū; "34th ACM International Collegiate Programming Contest, Asia regional, Ningbo site"). The page is a list of news items: the date of the online round (12 September 2009), the national invitational contest held 24 to 26 April 2009 at the host institute (45 participating schools, schedule, a closing report naming a Fudan University team as winner, a highlights item), a call for sponsors with a sponsorship plan as DOC and PDF downloads, the start of preparations, and an introduction to the host's ACM training team.

    Image links lead to ten inner pages of the site and to an English version; none of them is in our copy, which holds this one page with its images and style sheet. It has no results table and no problems.
