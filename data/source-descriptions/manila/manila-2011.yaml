  description: |-
    Copy of the website of the Mathematics Department of Ateneo de Manila University, in English, which holds the contest page for the 2011 ACM ICPC Asia-Manila Site, December 1 to 2, 2011, at UPITTC, UP-Diliman, Quezon City. The contest page gives registration fees (2,250 pesos per person for Filipino participants from Metro Manila, 1,750 from outside, 70 US dollars for foreign participants), the deadlines of 15 November for online registration and 18 November for payment of fees, both marked as extended, the dates (opening and practice on 1 December, the onsite contest on 2 December), links to the contest rules, the hardware and software specification of the contest machines (Ubuntu 11.04, Java, C/C++, editors and Eclipse), hotel information, the contest director's contact details, and a link to the Updated Team Ranking of 8 December 2011.

    Our copy holds 149 files, 117 of them pages, and apart from the contest page and the ranking PDF they belong to the department's own site: home, faculty, courses, undergraduate and graduate programs, facilities, seminars, announcements, lecture notes and personal pages of faculty, and a brochure of the Philippine Mathematical Olympiad. Only two files concern this contest: the contest page and the ranking PDF. The contest page's menu of program, problems, final standing, results and photos still links to pages of the 2009 contest, which are not in our copy, and the invitation PDF it links to is not in our copy either.
