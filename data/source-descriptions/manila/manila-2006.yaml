  description: |-
    Website of the 2006 Asia Programming Contest - Manila, held 26 and 27 October 2006 at the Holiday Inn Hotel in Ortigas, Metro Manila, hosted by Ateneo de Manila University and organized by its Department of Information Systems and Computer Science, sponsored by IBM. The main page is in English and lists Contest Problems (a link to the problem PDF), Test Data (named but not linked), Results (a link to the ICPC standings page), a Video link and 90 photo links. It gives the contest statistics: a single site, 82 teams (22 foreign, 60 local), 40 schools and universities, 9 countries, and a table of problems A to J with the number of teams that solved each, from 0 (problem B) to 29 (problem E).

    Our copy holds 5 pages: the main page, the problem PDF, and a page of the 2005 contest announcement (28 and 29 October 2005, with welcome message, venue, languages and registration steps), plus two identical copies of a one-line welcome page of a personal website, and 3 images. The photos and the pages behind the Results link are not in our copy.
