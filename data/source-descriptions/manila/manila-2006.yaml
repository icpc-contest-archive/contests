  description: |-
    Problem set as handed out at the contest: a PDF of 17 pages in English. The first page is a cover naming the Association for Computing Machinery International Collegiate Programming Contest, Asia Regional Finals, Manila, 2006 October 27, hosted by Ateneo de Manila University and sponsored by IBM, with instructions to the teams (five hours, input from standard input, output to standard output). Ten problems A to J follow, each with a statement, an input and output description and a sample input and output: Nuevo-Romano, Connect the Dots, Boundary Points, AGTC, Oreon, Period of an Infinite Binary Expansion, Wordfish, Take a Walk, Gaussian Prime Factors and 20-Four. Pages 2 to 17 carry a footer with the problem letter and the page number out of 17. No test data or solutions.

    The file in our copy is damaged: it has no cross-reference table or trailer and no font objects, so ordinary PDF readers do not open it, and a repaired copy shows only a banner image on pages 2 to 8 with the text missing. The text is still present in the page contents.
