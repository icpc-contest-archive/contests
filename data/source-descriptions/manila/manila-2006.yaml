    Standings of The 2006 ACM Asia Programming Contest - Manila, sponsored by IBM, as one table with the columns Rank, Team, Citation, #Solved and Time. It lists 82 teams as institution and team name. The top 43 teams carry a rank, a citation (first place and Best Foreign Team, then places up to forty-third, with the three best local teams marked) and the number of problems solved, from 8 down to 0. The other 39 teams are listed under Honorable Mention without rank or solved count. The Time column is empty for the 43 ranked teams and the Honorable Mention rows have no time cell, so there are no times, and there is no per-problem detail.
