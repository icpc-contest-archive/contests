    Standings of the 2025 ICPC Asia Manila Regional Contest: 37 teams with rank, team name, institution, problems solved, total time, medal and citation. Gold medals go to the first three teams, silver to places four to six and bronze to places seven to nine. Citations run from First Place to Twentieth Place, and 17 teams are listed as Honorable Mention. There is no per-problem detail. PCkomachi of National Taiwan University is first with 12 problems solved.
