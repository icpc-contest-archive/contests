  pages: 11
  description: |-
    Website of the 2025 ICPC Asia-Manila Programming Contest, hosted by the Ateneo de Manila University through its Department of Information Systems and Computer Science, in English. Our copy holds 11 pages; the home page is saved under two addresses and shows the site title and a short menu with a Home link. The about page presents the contest as one of the qualifiers for the 2026 ICPC World Finals. The schedule covers Tuesday 9 December 2025 (registration, opening ceremony, practice session) and Wednesday 10 December 2025 (contest proper from 10:00 AM to 3:00 PM at The Loft, Areté, awarding and closing ceremony, closing dinner). Other pages give the registration period (10 October to 10 November 2025, with payments accepted until 15 November) and fees for foreign and Philippine teams, the contest rules, partner hotels with special rates, local information and a shirt size guide.

    The downloads page and the scoreboard page in our copy are those of the 2022 edition, not 2025. The menu entries for downloads and scoreboard are commented out on the 2025 pages.
