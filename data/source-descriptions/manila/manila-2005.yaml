  description: |-
    Single-problem statement PDF of 2 pages, headed "3332 - Mayday! Mayday!" and the region line "Asia - Manila - 2005/2006", in English. The statement is a story of a stranded ship in 3D space, using a recursive division of space into eight octants (with a figure of the numbered octants), and asks for the 3-byte code, in hexadecimal, of the region containing the ship after eight divisions. It has input and output sections and ends with a sample input and sample output.
