  description: |-
    Single-problem statement PDF of 2 pages, headed "3328 - From Rational to Factorial" and the region line "Asia - Manila - 2005/2006", in English. The statement defines a factorial number with a sign part, a whole part and a fractional part, and asks for the factorial-number form of each rational number n/d given, printed in the format "Case #N" followed by the three parts. It has input and output sections and ends with a sample input and sample output.
