  description: |-
    Single-problem statement PDF of 2 pages, headed "3333 - Check to Check" and the region line "Asia - Manila - 2005/2006", in English. The statement asks which chess pieces (king, queen, bishop, rook, knight) on an 8 by 8 board check which other pieces, with the list printed sorted by position, or the line "All pieces safe." if none does; the sample has three cases. It has input and output sections and ends with a sample input and sample output.
