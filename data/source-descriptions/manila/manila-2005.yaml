  description: |-
    Standings of The 2005 ACM Asia Programming Contest - Manila, sponsored by IBM, as a single table with the columns Rank, Team, Citation, #Solved and Time. It lists 99 teams, each as institution and team name. The top 19 teams carry a rank, a citation (Champion and Best Foreign Team for first place, then second to nineteenth place, with Best Local Team and runner-up marks) and a number of problems solved, from 8 down to 3. The remaining 80 teams are listed alphabetically by institution with the citation Honorable Mention, without rank or solved count. The Time column is empty for the 19 ranked teams and the Honorable Mention rows have no time cell, so there are no times, and there is no per-problem detail.
