  problems: 1
  pages: 2
  description: |-
    Single-problem statement PDF of 2 pages, headed "3335 - Counting Symbols" and the region line "Asia - Manila - 2005/2006", in English. The statement defines a language over the five symbols L, I, N, U, X with rules for which symbol may follow which, and asks how many times each symbol appears at the n-th position among the allowable sentences of length n that begin with the given symbols, for n up to 30. It has input and output sections and ends with a sample input and sample output.
