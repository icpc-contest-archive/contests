    Single-problem statement PDF of 2 pages, headed "3329 - Right-Heavy Tree" and the region line "Asia - Manila - 2005/2006", in English. The statement defines a right-heavy binary tree and asks for a program that builds it from a sequence of integers and prints the inorder, preorder and postorder traversals, with a sample of three cases. It has input and output sections and ends with a sample input and sample output.
