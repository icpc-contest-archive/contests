  description: |-
    Single-problem statement PDF of 2 pages, headed "3334 - Gotcha!" and the region line "Asia - Manila - 2005/2006", in English. The statement tells of a series of bank robberies in which each next bank is chosen as the closest one on the lists of connected banks obtained from the banks already robbed, and asks for the code of the next bank to be robbed given a network of banks and distances. It has input and output sections and ends with a sample input and sample output.
