    Single-problem statement PDF of 2 pages, headed "3331 - Any Relation?" and the region line "Asia - Manila - 2005/2006", in English. The statement defines reflexive, symmetric, antisymmetric and transitive relations and their union, intersection, difference, composition and square, and asks for a program that reports which of these properties given relations or combinations of relations on given sets have. It has input and output sections and ends with a sample input and sample output.
