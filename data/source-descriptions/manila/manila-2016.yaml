  description: |-
    Problem set of the contest: a PDF of 29 pages in English. Page 1 is a cover image headed Problem Set for the 2016 Asia-Manila Regional Programming Contest, December 14-16, 2016, Ateneo de Manila University, with sponsor logos. A contents page and a page of notes follow (fast input and output are suggested; the problems are solvable in C, C++ and Java, with no guarantee for Python), then twelve problems A to L: AdoraBalls, Balloon Distribution, Convex Quadrilateral, Disco Dance Debacle, Expression, Frog Pushers, Go Go Go Special Action Force!, Handbags, Imelda's Shopping Spree, Jack and Jill and Joe, Off the Rails and LoL Tournament. Each problem has a statement with a time limit, an input and output description and a sample input and output. Pages 2 to 29 carry a footer with ACM-ICPC Manila 2016 and the page number. No test data or solutions.
