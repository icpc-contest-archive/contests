    Official scoreboard of the 2016 ACM-ICPC Asia-Manila Regional Contest at Ateneo De Manila University, headed December 14-16, 2016 and last updated Thu Dec 15 15:00:50 PHT 2016. One table of 40 teams with rank, team name, problems solved, time, one cell for each of the twelve problems A to L of the form n/m (for example 1/38, and 0/-- when not solved), and total attempts and solved. A bottom row gives, per problem, the counts submitted, 1st yes and total yes. A legend explains marks for first to solve, solved, attempted and pending judgement. Ties share a rank (six teams with no problems solved share rank 35). There is no institution column. The first two teams solved 6 problems each.

    The style sheet and images the page links to are not in our copy, so the legend colours do not show.
