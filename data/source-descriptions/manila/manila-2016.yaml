    Page of the Baekjoon Online Judge (Korean interface) for the category 2016 ACM-ICPC Asia-Manila Regional Programming Contest, filed under ACM-ICPC Regionals, Asia, Philippines. A table of 21 problems gives for each the problem number (15372 to 15392), a label, the title, an info column (marks such as special judge, source and multilingual), the number of solvers, submissions and the acceptance ratio. Twelve are the contest problems A to L, from AdoraBalls to LoL Tournament; nine more are labelled PA to PI (for example A Simple Problem. and The Grand Noi and ICPC Battle). Problems H and PI have no submissions. The statements themselves are on separate pages that are not in our copy.
