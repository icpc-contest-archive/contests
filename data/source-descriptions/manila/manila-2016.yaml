  title: 2016 ACM ICPC Asia-Manila Regional Contest
  language:
  - en
  contest_date: '2016-12-15'
  description: |-
    Official website of the 2016 ACM ICPC Asia-Manila Regional Contest, in English, hosted by Ateneo de Manila University. It announces the contest for 14 to 16 December 2016 at the Ateneo campus in Loyola Heights, Quezon City, and says the winners qualify for the 2017 World Finals in South Dakota. The front page repeats the registration information (fees of USD 150 for foreign teams and PHP 6000 for local teams, regular registration from 1 October to 30 November 2016) and the eligibility rules. Separate pages cover contest rules, prizes (four laptops), location, hotel accommodations, a program flow for Wednesday 14 December (registration, opening ceremony, practice), Thursday 15 December (contest proper and closing ceremony) and Friday 16 December (optional excursion), the excursion tour of Manila, an account of the regionals with the organising committee, external links, sponsors and a CHED endorsement.

    Our copy holds 15 pages. It contains no results or problem documents. The register page is only a heading, and the sponsors and CHED endorsement pages hold only headings, because their logos and the endorsement PDF are not in our copy. No images or style sheets were kept.
