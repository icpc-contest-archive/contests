  description: |-
    Website of the 2009 ACM ICPC Asia-Manila Site, 22 and 23 October 2009 at Ateneo de Manila University, in English. The front page gives registration fees (2,000 pesos per person for Filipino participants from Metro Manila, 1,500 from outside, 60 US dollars for foreign participants), the deadlines of 5 October for online registration and 9 October for payment of fees, the dates (opening and practice sessions on 22 October, the onsite contest on 23 October), links to the contest rules, and the contest director's contact details. A second page repeats this and adds a menu: program, messages from the Asia contests director and the Manila contest director, problems, final standing, results, board of judges, team registration and photos.

    Our copy holds 5 pages: the front page (saved under two addresses), the second page, an invitation poster as a one-page PDF (hosted by Ateneo de Manila University and organised by its Grid and High Performance Computing Group together with the Computing Society of the Philippines; it gives the same fees and deadlines and calls 22 October the Philippine National Onsite Contest), and the final standing page, a scoreboard of 55 teams. The other menu entries, such as problems and results, are links to a blog and are not in our copy.
