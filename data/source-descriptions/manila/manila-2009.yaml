  description: |-
    Standings of the 2009 ACM-ICPC Asia Manila Regional Contest with the columns Rank, Team, Institution, Solved, Time and Citation. It lists 69 teams. 28 of them carry a rank (from 1 to 55, with gaps) and a citation (Champion for first place, then ordinal places); the other 41 have no rank or citation and show 0 solved and 0 time. The top six teams solved 10 problems; the first place team is from the University of the Philippines - Diliman. There is no per-problem detail.
