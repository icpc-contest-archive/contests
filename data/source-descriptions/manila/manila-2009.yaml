  description: |-
    Scoreboard produced by PC^2 (version 9.1.3), last updated 24 October 2009 and linked from the contest website as the final standing: 55 teams ranked 1 to 55, each with a team name, problems solved (from 10 down to 1), total time, and one cell for each of the ten problems A to J of the form n/m (for example 1/55, and 0/-- when not solved). A last column gives total attempts and solved, and a bottom row gives, per problem, the counts submitted, 1st yes and total yes. The top six teams solved all ten problems. Many team names begin with an institution abbreviation; no institution or country column is shown.
