    Problem statement of 4580, Typhoon Ondoy, as a one-page PDF in English with the line "Asia - Manila - 2009/2010" under the title. The statement opens with the 26 September 2009 typhoon and lists storm-signal areas, then gives the wind-speed classes (tropical depression, tropical storm, typhoon, super typhoon). The task is to read wind speeds from 1 to 255 and display the class, or "No classification" for 1 to 29 kph. It has a sample of eight speeds. It ends with the line "Manila 2009-2010".
