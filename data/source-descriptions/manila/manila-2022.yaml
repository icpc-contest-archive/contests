  description: |-
    Website of the 2022 ICPC Asia-Manila Programming Contest, with payee details naming Ateneo de Manila University, in English. Our copy holds two pages. One is the registration page: how to register on the ICPC web site and pay, the registration period (22 October to 15 November 2022), fees for foreign and Philippine teams, what the fee includes, bank payment instructions and a reference to the ICPC regional rules. No other page of this site is in our copy.

    The second page is a scoreboard shell titled Nice ICPC-style Scoreboard that is headed December 14-15, 2019, with no team rows. It is a page of the 2019 contest, not of this edition.
