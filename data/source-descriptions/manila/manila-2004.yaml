    Single-problem statement PDF of 2 pages, headed "3102 - Prize Hop" and the region line "Asia - Manila - 2004/2005", in English. The statement describes a game with boxes in a row, each with a height and a cash value, where each next pick must be to the right of and no taller than the previous one, and asks for the maximum total cash prize per game. It has input and output sections and ends with a sample input and sample output.
