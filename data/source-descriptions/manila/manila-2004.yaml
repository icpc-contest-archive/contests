  description: |-
    Standings of the 2004 ACM Asia Programming Contest - Manila, sponsored by IBM, as a View Standings page. The first table is the Final Round: 77 teams with rank, university and team name and citation; 31 teams hold a place from First to Twenty-sixth, with ties, and 46 are listed as Honorable Mention without a rank. Solved count and time are shown for the top six teams only (the first, a University of Tokyo team, has 7 solved and time 1013). Two more tables list the preliminary sites: Local Teams (65 teams, with a Philippine Champion mark) and Foreign Teams (13 teams, with a Manila Site Champion mark). No team from the Hong Kong University of Science and Technology appears on the page.
