    Single-problem statement PDF of 2 pages, headed "3101 - Loaded Dice" and the region line "Asia - Manila - 2004/2005", in English. The statement introduces honest and loaded dice with relative probability lists of 4 to 20 sides, and asks for the most probable sum of a set of dice and its probability to three decimal places, listing all sums on a tie. It has input and output sections and ends with a sample input and sample output.
