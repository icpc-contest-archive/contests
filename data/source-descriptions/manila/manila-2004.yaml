    Single-problem statement PDF of 2 pages, headed "3105 - Prime Graphing" and the region line "Asia - Manila - 2004/2005", in English. The statement describes graphing a set of primes against a vertical series of multiples of a step up to a maximum, and asks for the number of elements of the vertical series that have at least one horizontal line drawn to them, for each test case. It has input and output sections and ends with a sample input and sample output.
