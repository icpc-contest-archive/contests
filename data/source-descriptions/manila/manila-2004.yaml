  description: |-
    Site of the 2004 ACM-ICPC Asia Regionals, Manila site, run by the Institute of Information Technology Studies (IITS) of the University of Asia and the Pacific. One long page has sections for general information on ICPC and IBM's support, the computer environment (HP Vectra machines, Windows 2000, PC^2 version 8.5d), the schedule (registration and briefing on 10 November, practice and trial run on 11 November, contest day on 12 November 2004), registration fees and deadline, contacts, hotel and accommodation, and airport transport. A menu entry Scores leads to a page that is not in our copy. A separate page lists online reference materials for the contest (Java documentation and the Standard Template Library).

    Our copy holds 99 pages, captured at different dates between 2002 and 2012, most of them the institute's own pages (about, news, curriculum, faculty and student pages). The same address also holds the 2003 contest pages (page1.htm and an index titled acm Manila 2003). No results or problems are on the site.
