    Single-problem statement PDF of 2 pages, headed "3106 - Longest Subsequence" and the region line "Asia - Manila - 2004/2005", in English. The statement concerns reassembling DNA fragments (strings over A, C, G, T) by overlapping their ends, and asks for all longest sequences that can be built using each given string once, in alphabetical order. It has input and output sections and ends with a sample input and sample output.
