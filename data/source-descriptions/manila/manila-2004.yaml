    Single-problem statement PDF of 2 pages, headed "3100 - String Scanner" and the region line "Asia - Manila - 2004/2005", in English. The statement asks for a frequency table of how often each of up to 1000 search patterns (1 to 7 letters) occurs, overlaps allowed, in a main string given as run-length-encoded segments of repeated substrings, with patterns listed alphabetically. It has input and output sections and ends with a sample input and sample output.
