    Single-problem statement PDF of 2 pages, headed "3104 - Shortest find Path" and the region line "Asia - Manila - 2004/2005", in English. The statement explains Unix absolute pathnames and the find command and asks, for a file hierarchy and a set of files to be searched, for the least number of starting pathnames that cover exactly those files, printed in alphabetical order. It has input and output sections and ends with a sample input and sample output.
