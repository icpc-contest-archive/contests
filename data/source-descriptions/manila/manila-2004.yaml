  description: |-
    Single-problem statement PDF of 3 pages, headed "3107 - Joining Tables" and the region line "Asia - Manila - 2004/2005", in English. The statement defines relational tables and the equijoin operation and refers to tables (1), (2) and (3) and to example equijoins, and asks, for a set of tables and a result table, whether each column of the result table belongs to a valid equijoin, printed as true or false per column. It has input and output sections and ends with a sample input and sample output. The example tables the text refers to are not in our copy: only blank space follows each reference.
