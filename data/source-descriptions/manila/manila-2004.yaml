    Single-problem statement PDF of 2 pages, headed "3103 - Pattern Matching" and the region line "Asia - Manila - 2004/2005", in English. The statement defines a pattern language with symbols for a digit, a punctuation mark, a letter and a null pattern, and asks for a program that checks a robot's list of matched entries against the pattern, printing which entries it should not have printed or did not print. It has input and output sections and ends with a sample input and sample output.
