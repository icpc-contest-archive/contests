  contest_date: '2003-11-07'
  description: |-
    Pages of the site of the Institute of Information Technology Studies (IITS), University of Asia and the Pacific, Manila, including an information page for the 2003 ACM-ICPC Asia Regional Contest, Manila site. That page has general information on ICPC and IBM's support, the computer environment (HP Vectra machines, Windows 2000, PC^2 version 8.5), the schedule (registration and briefing on 5 November, practice and trial run on 6 November, the contest on 7 November), registration fees, contacts and the host's address. The ICPC Baylor site is given for registration.

    Our copy holds 99 pages, captured at different dates between 2002 and 2012, most of them the institute's own pages (about, news, curriculum, faculty, student pages and personal pages). Other pages under the contest address show the 2004 Manila site: general information, computer environment, a schedule for 10 to 12 November 2004, fees, contacts and hotels; one is titled Contest Standings and has a Scores link to pages that are not in our copy. No 2003 results or problems are on the site.
