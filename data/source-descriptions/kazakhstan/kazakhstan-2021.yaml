  description: |-
    Standings of 65 teams with rank, team name, institution, number solved and penalty time. The first 18 teams carry a citation from First Place to Eighteenth Place and the other 47 are marked Honorable Mention. SuperNoVa of International IT University is first with 9 solved and 1083 penalty minutes. The teams come from nine institutions, the largest groups being International IT University (17 teams), Kazakh-British Technical University (12), Astana IT University (9) and Nazarbayev University (8). There are no per-problem results.
