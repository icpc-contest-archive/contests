  title: Northern Eurasia Contests
  language:
  - en
  description: |-
    Pages of the Northern Eurasia Contests archive site, in English: the archive index and the year pages for 2021 and 2022 (each in two versions), listing the finals of that year (standings, problems, jury archive, tutorial) and the regional contests with links to their standings, statements and tutorials. All versions of the 2021 and 2022 pages that list the regional contests show Kazakhstan with a Standings link.

    Our copy holds 150 pages, 113 HTML pages and 37 PDF files, many of them the same page under both http and https addresses. Besides the year pages they include the standings pages of the Northern Eurasia finals for 2021 and 2022, standings pages of regional contests for 2021 and 2022 (Armenia, Azerbaijan, Georgia, Taurida, Ural, Uzbekistan, North-Western Russia), PDFs of problem statements and tutorials, and a Kazakhstan standings page for each year from 2003 to 2025. The one in the 2021 directory is the scoreboard of the ICPC 2021-2022 Kazakhstan Regional Contest, 65 teams and 14 problems A to N.

    Only HTML and PDF files are in our copy: no style sheets or images, and not the zip and 7z archives (jury archives, runs) that the year pages link to.
