  description: |-
    Final scoreboard of the ICPC 2021-2022 Kazakhstan Regional Contest in the Northern Eurasia contest archive format: 65 teams, 14 problems labelled A to N. Each team row gives rank, team name (institution and team name) with the names of its members, then for each problem a mark with attempts and time (+ solved, - unsuccessful attempts, . not tried), the number solved and the penalty time. The page header reads 5:00:00 of 5:00:00, status over. Four team names begin with an asterisk, which the page does not explain; the last five teams share rank 61 with 0 solved.

    International IT U: SuperNoVa is first with 9 solved and 1083 penalty minutes. Five summary rows at the bottom give per problem the total runs, accepted, rejected, first accept time and last accept time.
