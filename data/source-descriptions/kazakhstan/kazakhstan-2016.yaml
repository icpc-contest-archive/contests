  description: |-
    Final standings of the 2016 Kazakhstan Subregional Contest: 108 teams listed with rank, team name, institution, number solved and time, and a citation. No per-problem results. The first 54 places carry an ordinal citation (First Place to Fifty-fourth Place) and the other 54 teams are listed as Honorable Mention; 87 teams solved at least one problem. Kazakh-British Technical University 1 is first with 10 problems solved in 1110 minutes. The page names no contest date.
