  description: |-
    Part of the Northern Eurasia Contests archive site (NEERC): the NEERC 2016 page lists the final standings, problem statements, tests, jury archive and problem review of the Northern Eurasia finals, and links to the regional contests, among them Kazakhstan. Our copy holds 150 saved pages, many of them the same page saved under several web addresses (62 distinct addresses). The Kazakhstan subregional standings of 2016 are in it, with the Kazakhstan standings of every year from 2003 to 2018.

    The rest is the 2016 and 2017 archive pages, the standings pages of the other subregional contests of those years, the finals standings for 2016 and 2017, and PDFs: the 2016 finals problem statements (15 pages), a 49-page problems review dated December 4, 2016, and a 2017 problem analysis (14 pages). It is in English. No style sheets or images are saved.
