  teams: 141
  problems: 11
  times: true
  tries: true
  description: |-
    Final standings of the Kazakhstan Subregional Contest 2016-2017, as a table of 141 teams. Columns are rank, team (with member names in parentheses, two or none for some teams), problems A to K, the number solved and penalty time. Each problem cell gives a plus or minus sign, the number of extra attempts and the solve time in minutes; a dot marks a problem not tried. The first team to solve a problem is marked in ten problems; problem E is unsolved. Ranks run to 93, with ties among the teams that solved nothing; 92 teams solved at least one problem. First place is Kazakh-British Technical University 1 with 10 problems. A footer gives total runs, accepted, rejected, first accept and last accept per problem. The page states the contest is over at 5:00:00 of 5:00:00.

    The page's script that toggles the display of solve times is present in our copy.
