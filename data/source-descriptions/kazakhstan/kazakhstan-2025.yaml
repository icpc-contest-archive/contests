  description: |-
    Website of the Competitive Programming Federation of Kazakhstan (CPFED), in Kazakh. Our copy holds 26 pages: the home page, about pages (federation, management, presidium, team, documents, representatives, contacts), project pages for its tournaments (ICPC semi-final, quarter-final and 1/8 final, teachers, CodeGirls, setters, IOAI) and for training camps, login and registration pages, and a PDF of volunteer rules in Russian. The news, ratings, contests and lectures pages hold only the site menu and footer.

    The ICPC pages describe the stages of the 2025-2026 season. The 1/8 final page lists the dates: 1/8 final on 26 October 2025, quarter-final on 15 November 2025 in universities across Kazakhstan, semi-final on 15 to 17 December 2025 in Almaty. The semi-final page gives a schedule for 16 and 17 December. No results or problems of the 2025 Kazakhstan regional contest are in our copy.
