  description: |-
    Final scoreboard titled "ICPC 2025–2026, Kazakhstan Regional Contest", with the contest clock at 5:00:00 of 5:00:00 and status "over". It lists 156 teams, each as an institution abbreviation, team name and three member surnames in parentheses, against twelve problems A to L. A solved problem shows a plus, the number of wrong attempts if any, and the solve time in minutes; an unsolved problem with attempts shows a minus and their number; a dot means no attempt. Then follow the number of problems solved and the penalty time. Below the teams are summary rows with total runs, accepted, rejected, first accept and last accept per problem. Rank 1 to 121 are used; 36 teams with no problem solved share rank 121. The first place is held by a Kazakh-British TU team with 8 problems and 775.

    The page has "Show time" and "Auto refresh" controls.
