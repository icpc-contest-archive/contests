  description: |-
    Part of the Northern Eurasia Contests archive site, in English: the page for NEERC 2009 with its list of resources for the Northeastern European finals and a section per regional contest, among them Northwestern Russia, Southern and Volga Russia, Ural, Moscow, Uzbekistan, Kazakhstan, Armenia and Georgia. The Kazakhstan entry of that page has one link, to its final standings.

    Our copy holds 150 saved pages and files: 125 HTML pages, 23 PDFs and 2 slide files (the same .pps file saved twice), many of them the same page saved under http, https and port-80 addresses (66 different addresses). It has the 2009 and 2010 year pages, the final standings of the 2009 and 2010 finals, the standings of the sixteen 2009 regional contests, problems.pdf of the 2009 finals (13 pages, headed ACM ICPC 2009-2010, Northeastern European Regional Contest, with the date November 11, 2009), the 2010 problem and review PDFs, the .pps presentation of the 2009 analysis, and the Kazakhstan standings page for each year from 2003 to 2025, with the 2024 statements and handbooks. The only problem statements under a Kazakhstan address are those of 2024; there are none for the 2009 Kazakhstan contest.
