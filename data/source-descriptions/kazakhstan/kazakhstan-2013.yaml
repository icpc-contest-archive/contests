  description: |-
    Scoreboard of the Kazakhstan Subregional Contest, headed "ACM ICPC 2013-2014, NEERC, Kazakhstan Subregional Contest", with the clock at 5:00:00 of 5:00:00 and status "over". 92 teams are listed with rank, team name (followed by member names in brackets; one row has an empty name and empty brackets), twelve problem columns A to L, the number solved (=) and total time. Each problem cell shows a plus with the number of earlier failed tries and the minute of acceptance, a minus with the number of failed tries, or a dot for no attempt. IITU 1 is first with 9 solved and 1125 minutes. Below the teams are summary rows per problem (total runs, accepted, rejected, first accept, last accept); problems C, I and L have no accepted run. The page has a Show time checkbox.
