  title: Northern Eurasia Contests
  language:
  - en
  description: |-
    Pages of the Northern Eurasia Contests archive of the NEERC site, in English, as they stand for the 2013 and 2014 seasons. The archive page for 2013 lists the finals standings, problems in PDF, official tests and jury solutions, and a standings link for each regional contest including Kazakhstan; the 2014 page has the same layout with additional entries such as Taurida, analysis and runs. Our copy holds 150 files, 147 of them pages, with many addresses saved in more than one form (http, https, port 80).

    Of the Kazakhstan 2013 subregional contest the copy holds one page, its standings, a scoreboard of 92 teams with problems A to L. It also holds the Kazakhstan standings page of every year from 2003 to 2025, the standings of the other regional contests of 2013 and 2014, the finals standings, review PDFs and problem PDFs of those two seasons.

    No problem statements, team list or announcement of the Kazakhstan 2013 contest are in it.
