  description: |-
    Part of the Northern Eurasia Contests archive site, in English: the page for NEERC 2008 with its list of resources for the Northeastern European finals and a section per regional contest, among them Northwestern Russia, Southern and Volga Russia, Ural, Moscow, Uzbekistan, Kazakhstan, Armenia and Georgia. The Kazakhstan entry of that page has one link, to its final standings.

    Our copy holds 150 saved pages and files: 136 HTML pages, 12 PDFs and 2 slide files (the same .pps file saved twice), many of them the same page saved under http, https and port-80 addresses (64 different addresses). It has the 2008 and 2009 year pages, the final standings of the 2008 finals, the standings of the sixteen 2008 regional contests, problems.pdf of the 2008 finals (14 pages, headed ACM ICPC 2008-2009, Northeastern European Regional Contest, with the date November 26, 2008) and of the 2009 finals, and the Kazakhstan standings page for each year from 2003 to 2025, with the 2024 statements and handbooks. The only problem statements under a Kazakhstan address are those of 2024; there are none for the 2008 Kazakhstan contest.
