  description: |-
    Archive site of the Northern Eurasia Contests (NERC), in English with some Russian labels. The first page of the crawl is the archive page for NERC 2023: it links the standings, problems, analysis and brochure of the Northern Eurasia finals and, for each regional contest, its standings; under Kazakhstan it has a single link, to the contest standings.

    Our copy holds 150 saved files, 90 HTML pages and 60 PDFs, covering 74 distinct addresses; most were fetched under both http and https. They include pages for 2023 and 2024, and the Kazakhstan standings page of every year from 2003 to 2025. For this edition it holds the 2023 Kazakhstan regional standings (a scoreboard of 138 teams) and the 2023 archive page; the other 2023 material is the finals and other regionals (standings, statements, tutorials, brochure). The 2024 Kazakhstan statements, handbooks in English and Russian and qualification standings are headed ICPC 2024-2025 and belong to the next edition.

    The crawl holds only HTML pages and PDFs: no style sheets or images are part of our copy, and most other pages of the site are not in it.
