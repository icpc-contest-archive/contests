  description: |-
    Scoreboard of the 2023 Kazakhstan regional, as published on the Northern Eurasia (NERC) archive site and headed ICPC 2023-2024, Kazakhstan Regional Contest, with the clock at 5:00:00 of 5:00:00 and status over. It lists 138 teams, each as institution, team name and member names in brackets, against thirteen problems A to M. Accepted cells carry a plus sign, the number of earlier rejected runs when there are any, and the time as minutes and seconds; rejected cells carry a minus sign and a number; untried problems show a dot. The last columns, headed = and Time, give problems solved and total time. Ranks run from 1 to 129 with ties sharing a rank. Twelve team names carry a leading star, and four teams are named Unrated 1 to 4; the page does not explain the star. The first row is IITU: KAZAKHSTAN with 10 problems solved. Summary rows at the bottom give total runs, accepted, rejected, first accept and last accept per problem. An option shows or hides the times. Team and member names mix Latin and Cyrillic script.
