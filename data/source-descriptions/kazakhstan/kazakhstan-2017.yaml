  description: |-
    Final standings of the Kazakhstan Subregional Contest 2017-2018 with 122 teams. Columns are rank, team (with member names in parentheses; three teams list two names), problems A to L, the number solved and penalty time. Each problem cell gives a plus or minus sign, the number of extra attempts and the solve time in minutes; a dot marks a problem not tried. First-to-solve marks appear on all twelve problems. Ranks run to 93, with ties among the teams that solved nothing; 92 teams solved at least one problem. First place is Kazakh-British Technical University 1 with all 12 problems. A footer gives total runs, accepted, rejected, first accept and last accept per problem. The page states the contest is over at 5:00:00 of 5:00:00.
