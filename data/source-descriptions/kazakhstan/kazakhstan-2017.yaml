    Final standings of the 2017 Kazakhstan Subregional Contest: 97 teams listed with rank, team name, institution, number solved and time, and a citation. No per-problem results. The first 48 places carry an ordinal citation (First Place to Forty-eighth Place) and the other 49 teams are listed as Honorable Mention; 86 teams solved at least one problem. Kazakh-British Technical University 1 is first with 12 problems solved in 1172 minutes. The page names no contest date.
