  title: Northern Eurasia Contests
  language:
  - en
  description: |-
    Part of the Northern Eurasia Contests archive site (NEERC): the NEERC 2017 page lists the final standings, problem statements, tests, jury archive and problem analysis of the Northern Eurasia finals, and links to the regional contests, among them Kazakhstan. Our copy holds 149 saved pages plus one zip file, many of them the same page saved under several web addresses (66 distinct addresses). It has the Kazakhstan subregional standings page of every year from 2003 to 2025, including 2017, and, filed under the 2017 Kazakhstan path, a problem set PDF headed Northern Subregional Contest, St Petersburg.

    The rest is the 2017 and 2018 archive pages, the standings pages of the other subregional contests of those years, the finals standings, statements and analysis PDFs for 2017 and 2018, two contestant handbooks (English and Russian) for the 2024 Kazakhstan qualification and a statements PDF of the 2024 Kazakhstan regional contest, and a zip of the 2018 finals runs. The pages are in English; one of the two handbooks is in Russian. No style sheets or images are saved.
