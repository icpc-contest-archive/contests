  description: |-
    Final scoreboard titled "ICPC 2026–2027 Kazakhstan Regional Contest", with the contest clock at 5:00:00 of 5:00:00 and status "over". It lists 171 teams, each as an institution abbreviation, team name and three member surnames in parentheses, against fourteen problems A to N. A solved problem shows a plus, the number of wrong attempts if any, and the solve time in minutes; an unsolved problem with attempts shows a minus and their number; a dot means no attempt. Then follow the number of problems solved and the penalty time. Ranks run from 1 to 139 and 33 teams with no problem solved share rank 139. The first place is held by a Kazakh-British TU team with 10 problems and penalty 984.

    Below the teams are summary rows with total runs, accepted, rejected, first accept and last accept per problem. The page has a "Show time" control. Its style sheet is kept with our copy.
