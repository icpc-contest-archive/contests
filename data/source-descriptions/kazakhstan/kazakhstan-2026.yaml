  description: |-
    Website of the Northern Eurasia Contests, in English with some Russian, centred on its page for the Kazakhstan Regional Contest. That page names Kazakhstan as the participating region and the Kazakhstan Competitive Programming Federation's site as home page, lists two contest dates, 14 Nov 26 and 18 Oct 26, and gives the contacts of the organisers. Its archive section links standings for every year from 2003 to 2026, plus qualification standings, statements, contestant handbooks, run logs and photo galleries for some years.

    For 2026 our copy holds the final standings of the ICPC 2026–2027 Kazakhstan Regional Contest (status over after 5:00:00): 171 teams, given as institution, team name and members, against fourteen problems A to N, with attempts and solve times per problem, problems solved and total time, and rows of total runs, accepted, rejected, first and last accept per problem. Kazakh-British TU's team Master ka4ka is first with 10 problems. One team is marked with an asterisk that the page does not explain. The 2026 qualification standings and statements are links to another site and are not in our copy.

    Our copy holds 91 pages, many saved twice under the site's two addresses: the standings of the earlier Kazakhstan contests, the 2024 statements and handbooks as PDFs, the pages of the other subregions and of the Northern Eurasia Finals. Some pages under the second address timed out, and three sponsor logos are missing.
