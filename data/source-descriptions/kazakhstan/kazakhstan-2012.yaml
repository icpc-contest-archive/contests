    Final standings of the 2012 Kazakhstan Subregional Contest: 90 teams with rank, team, institution, problems solved, penalty time, medal and citation, and a column for site citations. The top four teams carry gold medals, the next four silver and the next four bronze; the teams below them carry ordinal place names only, and the 45 teams from 46th place on are marked Honorable Mention. IITU 1 of the International IT University is first with 7 solved and 783 minutes and has the site citation Champion of Kazakhstan Subregional Contest. There are no per-problem results.
