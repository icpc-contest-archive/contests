  description: |-
    Pages of the Northern Eurasia Contests archive of the NEERC site, in English, as they stand for the 2012 and 2013 seasons. The archive page for 2012 lists the finals standings, problems in PDF, official tests and jury solutions, and a standings link for each regional contest including Kazakhstan; the 2013 page is laid out the same way. Our copy holds 150 files, 144 of them pages, with many addresses saved in more than one form (http, https, port 80).

    Of the Kazakhstan 2012 subregional contest the copy holds one page, its standings, a scoreboard of 112 teams with problems A to L. It also holds the Kazakhstan standings page of every year from 2003 to 2025, the standings of the other regional contests of 2012 and 2013, the finals standings and the review and problem PDFs of those two seasons.

    No problem statements, team list or announcement of the Kazakhstan 2012 contest are in it.
