  description: |-
    Part of the Northern Eurasia Contests archive site, in English: the page for NEERC 2010 with its list of resources for the Northeastern European finals (standings, problems, statement sources, official tests, test generators and jury solutions) and a section per regional contest, among them Northwestern Russia, Southern and Volga Russia, Ural, Moscow, Uzbekistan, Kazakhstan, Armenia and Georgia. The Kazakhstan entry of that page has one link, to its final standings.

    Our copy holds 150 saved pages and files: 125 HTML pages and 25 PDFs, many of them the same page saved under http, https and port-80 addresses (66 different addresses). It has the 2010 and 2011 year pages, the final standings of the 2010 finals, the standings of the fourteen 2010 regional contests, the 2010 finals problem set (13 pages, headed ACM ICPC 2010-2011, Northeastern European Regional Contest, with the date November 24, 2010), a 15-page problem review of the 2010 finals, a 10-page analysis in Russian and an 80-page analysis presentation of the Northern subregional contest, some 2011 PDFs, and the Kazakhstan standings page for each year from 2003 to 2025, with the 2024 statements and handbooks. The only problem statements under a Kazakhstan address are those of 2024; there are none for the 2010 Kazakhstan contest.
