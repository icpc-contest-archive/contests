  description: |-
    Final scoreboard of the ICPC 2022-2023 Kazakhstan Regional Contest in the Northern Eurasia contest archive format: 86 teams, 14 problems labelled A to N. Each team row gives rank, team name (institution and team name) with member names (some teams list fewer than three), then for each problem a mark with attempts and time (+ solved, - unsuccessful attempts, . not tried), the number solved and the penalty time. The page header reads 5:00:00 of 5:00:00, status over. Eleven team names begin with an asterisk, which the page does not explain; the last 14 teams share rank 73 with 0 solved.

    Kazakh-British TU: DeoxyriboNucleic Acid is first with 9 solved and 831 penalty minutes. Five summary rows at the bottom give per problem the total runs, accepted, rejected, first accept time and last accept time.
