  copy: kazakhstan/kazakhstan-2022/website/2026-09-05-wayback-88d7fcfd
  title: Northern Eurasia Contests
  language:
  - en
  description: |-
    Pages of the Northern Eurasia Contests archive site, in English: the archive index and the year pages for 2022 and 2023 (each in two versions), listing the finals of that year (standings, problems, tutorial) and the regional contests with links to their standings, statements and tutorials. The 2022 year pages that list regional contests show Kazakhstan with a Standings link, and so does the 2023 page.

    Our copy holds 150 pages, 111 HTML pages and 39 PDF files, many of them the same page under both http and https addresses. Besides the year pages they include the standings pages of the finals for 2022 and 2023 (for 2023 also the Astana, Siberian and St Petersburg sites and the Open Championship of Southern Caucasus), standings pages of regional contests (2022: Armenia, Azerbaijan, Georgia, Taurida, Ural, Uzbekistan, North-Western Russia; 2023: Armenia, Azerbaijan, Taurida, Ural, North-Western Russia), PDFs of statements and tutorials and a 2023 brochure, and a Kazakhstan standings page for each year from 2003 to 2025. The one in the 2022 directory is the scoreboard of the ICPC 2022-2023 Kazakhstan Regional Contest, 86 teams and 14 problems A to N.

    Only HTML and PDF files are in our copy: no style sheets or images, and not the zip and 7z archives (jury archives, runs) that the year pages link to.
