    Standings of 86 teams with rank, team name, institution, number solved and penalty time. The first 43 teams carry a citation from First Place to Forty-third Place and the other 43 are marked Honorable Mention. DeoxyriboNucleic Acid of Kazakh-British Technical University is first with 9 solved and 831 penalty minutes. The teams come from twelve institutions; Kazakh-British Technical University and Nazarbayev University have 20 teams each. There are no per-problem results.
