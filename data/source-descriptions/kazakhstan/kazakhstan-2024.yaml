  description: |-
    Pages of the Northern Eurasia Contests archive site, mostly in English with some Russian link labels and Russian PDFs: the year pages for 2024 and 2025 (each in two versions), listing the finals of that year and the regional contests with links to their qualification standings, standings, statements, contestant handbooks and photos. On the 2024 year page the Kazakhstan entry links the qualification standings, the qualification statements and the contestant handbook (the last two in English and in Russian), the contest standings, the contest statements and a runs archive.

    Our copy holds 150 pages, 81 HTML pages and 69 PDF files, many of them the same page under both http and https addresses. Besides the year pages they include standings pages of the 2024 and 2025 finals, pages and PDFs of other regional contests (Armenia, Azerbaijan, Taurida, Ural, North-Western Russia, and for 2025 also Georgia, Tajikistan, Turkmenistan, Uzbekistan), and a Kazakhstan standings page for each year from 2003 to 2025. For 2024-2025 the Kazakhstan pages are the contest scoreboard of 180 teams and 13 problems A to M, the qualification standings of 92 teams and 14 problems A to N, the 14-page English statements of the contest, the English and Russian statements of the qualification (16 pages each) and the English and Russian contestant handbooks of the qualification (4 pages each).

    Only HTML and PDF files are in our copy: no style sheets or images, and not the runs archive (a zip file) that the 2024 year page links to.
