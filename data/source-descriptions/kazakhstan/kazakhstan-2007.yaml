  description: |-
    Part of the Northern Eurasia Contests archive site, in English: the page for NEERC 2007 with its list of resources (standings, problems, tests and jury solutions, runs) for the Northeastern European finals and a section per regional contest, among them Northwestern Russia, Southern and Volga Russia, Ural, Moscow, Uzbekistan, Kazakhstan, Armenia and Georgia. The Kazakhstan entry of that page has one link, to its final standings.

    Our copy holds 150 saved pages and files: 135 HTML pages and 15 PDFs, many of them the same page saved under http, https and port-80 addresses (63 different addresses). It has the 2007 and 2008 year pages, the final standings of the 2007 and 2008 finals, the standings of the regional contests of those two years, problems.pdf of each final (the 2007 one is 14 pages, headed ACM ICPC 2007-2008, Northeastern European Regional Contest, with the date November 28, 2007), and the Kazakhstan standings page for each year from 2003 to 2025, with the 2024 statements and handbooks. The only problem statements under a Kazakhstan address are those of 2024; there are none for the 2007 Kazakhstan contest.
