  copy: kazakhstan/kazakhstan-2020/website/2026-09-05-wayback-88d7fcfd
  title: Northern Eurasia Contests
  language:
  - en
  description: |-
    Pages of the Northern Eurasia Contests archive site, in English: the archive index and the year pages for 2020 and 2021 (the 2020 page in two versions, the 2021 page in two versions), each listing the finals of that year (standings, problems, jury archive, tutorial) and the regional contests with links to their standings, statements and tutorials. The 2020 year pages have no Kazakhstan entry; one version of the 2021 page lists Kazakhstan with a Standings link, the other says no information is available for it.

    Our copy holds 150 pages, 112 HTML pages and 38 PDF files, many of them the same page under both http and https addresses. Besides the year pages they include the standings pages of the Northern Eurasia finals and of the North-Western Russia regional contest for 2020 and 2021, standings pages of other regional contests (Armenia, Georgia, Taurida, Ural, Azerbaijan, Uzbekistan), PDFs of problem statements and tutorials, and a Kazakhstan standings page for each year from 2003 to 2025. The one in the 2020 directory is the scoreboard of the ICPC 2020-2021 Kazakhstan Regional Contest, 81 teams and 14 problems A to N.

    Only HTML and PDF files are in our copy: no style sheets or images, and not the zip and 7z archives (jury archives, runs) that the year pages link to.
