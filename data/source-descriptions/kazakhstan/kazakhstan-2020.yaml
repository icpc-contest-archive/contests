  description: |-
    Final scoreboard of the ICPC 2020-2021 Kazakhstan Regional Contest in the Northern Eurasia contest archive format: 81 teams, 14 problems labelled A to N. Each team row gives rank, team name (institution and team number) with the names of its members, then for each problem a mark with attempts and time (+ solved, - unsuccessful attempts, . not tried), the number solved and the penalty time. The page header reads 5:00:00 of 5:00:00, status over.

    SDU: 2 is first with 10 solved and 746 penalty minutes. Five summary rows at the bottom give per problem the total runs, accepted, rejected, first accept time and last accept time.
