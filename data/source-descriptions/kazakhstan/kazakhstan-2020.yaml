    Standings of 81 teams with rank, team name, institution, number solved and penalty time. Every team carries the citation Honorable Mention. SDU 2 of SDU University is first with 10 solved and 746; the teams come from SDU University, International IT University, Kazakh-British Technical University, Nazarbayev University, Al-Farabi Kazakh National University, Astana IT University and others. There are no per-problem results and no problem labels.
