  description: |-
    Pages of the Northern Eurasia Contests archive of the NEERC site, in English, as they stand for the 2015 and 2016 seasons. The archive page for 2015 lists the finals standings, problems in PDF, official tests, a jury archive and a standings link for each regional contest including Kazakhstan; the 2016 page has the same layout and adds a link to a problems review. Our copy holds 150 files, all of them pages, with many addresses saved in more than one form (http, https, port 80).

    Of the Kazakhstan 2015 subregional contest the copy holds one page, its standings, a scoreboard of 79 teams with problems A to L. It also holds the Kazakhstan standings page of every year from 2003 to 2022, the standings of the other regional contests of 2015 and 2016, and the finals standings, problem PDFs and review PDFs of those two seasons.

    No problem statements, team list or announcement of the Kazakhstan 2015 contest are in it.
