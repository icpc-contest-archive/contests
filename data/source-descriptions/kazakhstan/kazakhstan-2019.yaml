  description: |-
    Final standings of the Kazakhstan Regional Contest 2019-2020 with 142 teams. Columns are rank, team (with member names in parentheses; some teams list fewer than three), problems A to M, the number solved and penalty time. Each problem cell gives a plus or minus sign, the number of extra attempts and the solve time in minutes; a dot marks a problem not tried. First-to-solve marks appear on 11 problems; C and F are unsolved. Ranks run to 104, with ties among the teams that solved nothing; 103 teams solved at least one problem. First place is International IT University 1 with 11 problems. One team, AcmAcademy in second place, has the Russian words "в не конкурса" in its name (apparently "out of competition") and is ranked with the others. A footer gives total runs, accepted, rejected, first accept and last accept per problem. The page states the contest is over at 5:00:00 of 5:00:00.
