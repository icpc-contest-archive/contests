  description: |-
    Part of the Northern Eurasia Contests archive site (NEERC): under the heading NERC 2019, the 2019 page lists the final standings, problem statements, jury archive and problem analysis of the finals, then the regional contests. On our copy of that page the Kazakhstan entry reads "No information is available", but the Kazakhstan standings page of 2019 is in our copy. Our copy holds 150 saved pages, many of them the same page saved under several web addresses (70 distinct addresses). It has the Kazakhstan standings page of every year from 2003 to 2025.

    The rest is the 2019 and 2020 archive pages, standings pages of other subregional contests, the finals standings for 2019 and 2020 and a geographic standings page for 2019, the finals statement and tutorial PDFs for 2019 and 2020, and statements, tutorials and a qualifier page of the Northwestern Russia contests. The pages are in English; the two 2024 Kazakhstan contestant handbooks are in English and Russian. No style sheets or images are saved.
