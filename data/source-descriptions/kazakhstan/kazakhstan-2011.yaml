  description: |-
    Part of the Northern Eurasia Contests archive site, in English: the page for NEERC 2011 with its list of resources for the Northeastern European finals and a section per regional contest, among them Northwestern Russia, Southern and Volga Russia, Ural, Moscow, Uzbekistan, Kazakhstan, Armenia and Georgia. The Kazakhstan entry of that page has one link, to its final standings.

    Our copy holds 150 saved pages and files: 127 HTML pages, 20 PDFs and 3 XML files (one 2012 standings file saved three times), many of them the same page saved under http, https and port-80 addresses (68 different addresses). It has the 2011 and 2012 year pages, the final standings of the 2011 and 2012 finals, the standings of the sixteen 2011 regional contests, the 2011 finals problem set (16 pages, headed ACM ICPC 2011-2012, Northeastern European Regional Contest, with the date November 27, 2011), a 13-page analysis of the 2011 finals, the 2012 problem and review PDFs, and the Kazakhstan standings page for each year from 2003 to 2025, with the 2024 statements and handbooks. The only problem statements under a Kazakhstan address are those of 2024; there are none for the 2011 Kazakhstan contest.
