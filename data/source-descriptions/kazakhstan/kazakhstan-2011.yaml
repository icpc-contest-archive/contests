  description: |-
    Standings of the Kazakhstan Subregional Contest, titled The 2011 Kazakhstan Subregional Contest and marked ICPC year 2012: 55 teams with rank, team, institution, problems solved, total time, medal, citation and site citation. There are no per-problem columns. Kazakh-British TU 1 is first with eight problems solved and a time of 831.

    Four teams carry gold medals, four silver and four bronze. The citation column reads First Place to Twenty-seventh Place for the top 27 ranks, then Honorable Mention for 26 teams. Two teams, AGTU and SDU07, have no rank, no solved problems and the site citation Champion of Kazakhstan Subregional Contest; seven teams in all solved nothing.
