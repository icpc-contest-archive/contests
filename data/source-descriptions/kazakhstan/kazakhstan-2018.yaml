  description: |-
    Part of the Northern Eurasia Contests archive site (NEERC): the NEERC 2018 page lists the final standings, problems, jury archive, analysis, review slides and runs of the Northern Eurasia finals, and links to the regional contests, among them Kazakhstan. Our copy holds 149 saved pages plus one zip file, many of them the same page saved under several web addresses (68 distinct addresses). It has the Kazakhstan subregional standings page of every year from 2003 to 2025, including 2018.

    The rest is the 2018 and 2019 archive pages, the finals standings pages of both years, the standings pages of other subregional contests, the finals statement, analysis and review PDFs for 2018 and statement and tutorial PDFs for 2019, statement, analysis and tutorial PDFs of the Northern subregional (North-Western Russia) contest and its qualification round for 2018 and 2019 with the standings page of the 2019 qualification round, a zip of the 2018 finals runs, and, for the 2024 Kazakhstan contest, a statements PDF and two contestant handbooks (English and Russian). The pages are in English, except that two 2019 standings pages are mostly in Cyrillic script; five of the PDFs are wholly or mainly in Russian. No style sheets or images are saved.
