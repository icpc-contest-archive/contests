    Scoreboard headed "ACM ICPC 2014-2015, NEERC, Kazakhstan Subregional Contest, Practice Session", with the clock at 5:00:00 of 5:00:00 and status "over". 99 teams are listed with rank, team name (94 of the 99 names are followed by member names in brackets), eleven problem columns A to K, the number solved (=) and total time. Each problem cell shows a plus with the number of earlier failed tries and the minute of acceptance, a minus with the number of failed tries, or a dot for no attempt. Nazarbayev University 2 is first with 7 solved and 617 minutes. Below the teams are summary rows per problem (total runs, accepted, rejected, first accept, last accept); problems C, E, F and H have no accepted run. The page has a Show time checkbox.
