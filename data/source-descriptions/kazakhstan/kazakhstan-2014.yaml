  description: |-
    Pages of the Northern Eurasia Contests archive of the NEERC site, in English, as they stand for the 2014 and 2015 seasons. The archive page for 2014 lists the finals standings, problems in PDF and a standings link for each regional contest including Kazakhstan; the 2015 page is laid out the same way. Our copy holds 150 files, all of them pages, with many addresses saved in more than one form (http, https, port 80).

    Of the Kazakhstan 2014 subregional contest the copy holds one page, its standings, a scoreboard of 99 teams with problems A to K. It also holds the Kazakhstan standings page of every year from 2003 to 2023, the standings of the other regional contests of 2014 and 2015, the finals standings, review PDFs and statements PDFs of those two seasons.

    No problem statements, team list or announcement of the Kazakhstan 2014 contest are in it.
