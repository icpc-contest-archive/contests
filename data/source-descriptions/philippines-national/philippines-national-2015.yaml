  description: |-
    Blog of ACM ICPC Philippines, the coordinating body for ACM ICPC contests in the Philippines. Our copy holds 6 saved addresses, which are one post and its blog archive listings: a post titled "Announcement, 9 July 2015" (updated 7 October 2015) at two addresses, and the 2015 and July 2015 archive pages, each at two addresses and each showing only that one post.

    The post gives the 2015 schedule: the National Programming Contest (onsite final round) on 19 October 2015 at the University of St. Louis, Tuguegarao City, and four preliminary invitational contests (Visayas on 5 September, Southern Luzon on 13 September, Metro Manila on 19 September, Mindanao on 3 October), each with host and contest director contact. It also lists eleven numbered mechanics: teams of three students and a coach, registration on the ICPC website, at most two invitationals per team, priority registration for the top ten teams of each invitational, a four-hour invitational with eight problems, a five-hour national contest with 11 problems, PC^2 as contest software, and C, C++ and Java as languages. It ends with the national coordinator's contact details.

    No results, team list or problems are in our copy.
