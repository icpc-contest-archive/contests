    Student newspaper article from The GUIDON, published 11 November 2014, on the Ateneo Programming Varsity teams at the national level of the ACM-ICPC held at the Ateneo de Naga University on 6 September. It names the teams in first (Fuchsia Moth), second (Operator), fourth (Carmiel) and fifth (Bumblebee) place, and says the results earned the Loyola Schools the Top Performing School title over 12 other schools. It describes the contest as five hours and 10 problems, ranked by problems solved and time with 20 minutes added per incorrect submission, and says the winners solved all 10 problems in 537 contest minutes. The rest covers the team's training and members, with photos of the teams. It gives no full ranking.

