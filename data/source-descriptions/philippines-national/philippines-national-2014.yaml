  description: |-
    News item on the GMA News Online site, published 8 October 2014 in its Community Bulletin Board section and credited as a press release from Ateneo de Manila University. It reports that four teams of the Ateneo Programming Varsity won places at the 2014 ACM-ICPC Philippine National Programming Competition held at the Ateneo de Naga University, ahead of 31 other teams. The contest ran five hours with 10 problems. The article names first place (Fuschia Moth, 10 of 10 solved in 2 hours), second (Operator, 10 of 10), fourth (Carmiel, 8 of 10) and fifth (Bumblebee, 8 of 10), lists their members and coaches, and does not name the third-place team. It is not a full ranking.

