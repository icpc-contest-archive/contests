  contest_date: '1996-02-17'
  description: |-
    Multi-year page headed 'The Early Years - World Finals Champions', dated as of 7 December 2007, with 21 entries, one for each World Finals from 1977 to 1997. Each entry gives the city and, except for 1985, the date, usually the finals director, and the top places: the number of places varies from one (1978) to ten (1997), and team members are listed for some of the teams. The 1996 entry, dated February 17, 1996 in Philadelphia, Pennsylvania, lists places 1 to 6: University of California at Berkeley, Harvard University, University of Waterloo, University of Sophia St. Kliment Ohridski, Massachusetts Institute of Technology and University of Queensland. The page asks readers to send a photocopy of a plaque or other evidence to fill gaps.
