    Finalist list of the 1996 ACM International Programming Contest Finals sponsored by Microsoft, a plain-text page. It states that 1001 teams competed in the regional contests and that 43 teams advanced to the finals held on February 17, 1996, as part of the ACM Computing Week Conference. A table of 26 numbered rows gives rank, place, university and number of problems solved, with University of California, Berkeley first. Penalty times are given only for the first ten rows; the other rows have none. Sixteen further universities are listed under Honorable Mention in alphabetical order, so the page lists 42 teams although it states 43.
