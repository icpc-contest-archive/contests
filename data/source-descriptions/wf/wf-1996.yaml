  description: |-
    Final standings of the 20th Annual ACM International Collegiate Programming Contest, sponsored by Microsoft, headed Philadelphia, Pennsylvania, February 1996. A table of 26 ranked rows gives rank, university, problems solved and penalty time; ranks 1 to 4 have six problems solved (University of California, Berkeley first), and ranks 7 and 17 are shared by ten teams each. Below it, 17 more universities are listed as Honorable Mention in random order, without results, so 43 teams appear in all. No per-problem detail.

    The first six universities are linked to team photographs, which are in our copy.
