    Standings of the 2011 World Finals on the Competitive Programming Hall of Fame site: 105 teams with rank, country, team name with the three members' names, score (problems solved), penalty and prize. The header box gives the date as May 30, 2011, the venue as the Peabody Orlando Hotel in Orlando, a duration of 300 minutes and 11 problems, with a link to the official results page. Ranks run from 1 to 100, four teams share "101 - 104" with no solved problems, and one last team from Amirkabir University of Technology is listed as "qualified" instead of a rank.

    The prize column names the World Champion and six regional champions (Asia, North America, Europe, Latin America, Africa and the Middle East, South Pacific), and gives dollar amounts for 15 teams. There is no per-problem detail. Site menus and many links to country, university and profile pages lead outside our copy.
