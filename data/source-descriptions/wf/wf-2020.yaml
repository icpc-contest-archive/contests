  description: |-
    Final scoreboard of the World Finals in Moscow, a DOMjudge page headed "ICPC World Finals Moscow final standings". It lists 117 teams with the institution, the number of problems solved and the total penalty time (the rank cell is blank for the last two teams), and one column for each of the 15 problems A to O. Each problem cell gives the solve time in minutes and the number of tries, or only the tries for an unsolved problem. Seven teams carry a region label beside the name, such as Northern Eurasia or Asia Pacific. Four teams are marked with each of the gold, silver and bronze awards. A summary row at the bottom gives per-problem totals, a legend explains the cell colours, and the page states that it was last updated on 5 October 2021 at 20:38 MSK.

    Nizhny Novgorod State University is first with 12 problems solved. Institution logos and the style sheets are kept with our copy.
