    Problem set of the 2020 World Finals as a PDF of 30 pages, in English. It has no cover page: it opens directly on Problem A, Cardiology, and runs through the 15 problems A to O, each starting on its own page with its title and time limit, ranging from 1 to 20 seconds; every problem takes two pages. Fourteen statements have an input and an output section and sample input and output; the page footers read "ICPC World Finals 2020 Problem A: Cardiology" and so on, with page numbers 1 to 30. Problem H, QC QC, is interactive: it has an Interaction section in place of input and output, two sample interactions and notes on interactive judging. The document holds statements only, with no test data or solutions.
