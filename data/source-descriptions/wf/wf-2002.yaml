    Problem set of the 2002 World Finals: a PDF of 18 pages, in English, with nine problems A to I (Balloons in a Box, Undecodable Codes, Crossing the Desert, Ferries, Island Hopping, Toil for Oil, Partitions, Silly Sort, Merrily, We Roll Along!). The header names the contest as the 26th annual ACM International Collegiate Programming Contest World Finals sponsored by IBM. Each problem has a statement with input and output description, an input file name, and a sample input and output. The first page carries the header and problem A; no date or place is printed, and the PDF holds no test data and no solutions.
