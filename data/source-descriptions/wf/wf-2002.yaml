  title: Tour
  language:
  - en
  description: |-
    Crawl of the ICPC website of Baylor University, a general site of the contest series rather than a site of the 2002 World Finals alone. It was started from the photo pages of the ICPC Tour 2003 in Beverly Hills: 81 of the captured addresses are those pages (65 distinct addresses), grouped by event such as arriving, opening ceremony, practice session, the finals and award ceremony. The captures were made in different years, between 2002 and 2019; the tour pages date from 2005 to 2007. Our copy holds 150 files, 133 of them pages; 22 of the files are short stubs that only ask the reader to enable JavaScript.

    For 2002 it holds the results page of the World Finals 2002 (the order of the 64 teams by university, Shanghai JiaoTong University as 2002 World Champions, honorable mentions and regional champions), a history page of the 2002 World Finals in Honolulu (64 teams advancing from 3,082 teams at over 1,300 universities in 67 countries, held on 23 March 2002), and a fact sheet dated 11 February 2002 as a PDF. The matching results and history pages for 2003 are in it too, and so are the site's home, compete and community pages and an XML file of the standings of the 2008 World Finals. Navigation menus lead to pages that are not in our copy.
