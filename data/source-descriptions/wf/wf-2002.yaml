  description: |-
    Final standings page titled "2001 ACM ICPC World Finals" in its title bar, with the heading "The 26th Annual ACM-ICPC World Finals sponsored by IBM" and the line "Honolulu, Hawaii March 23, 2002"; Shanghai JiaoTong University is named as 2002 World Champions. It lists 40 ranked teams by rank and university only, in two side-by-side columns, with shared ranks for ties (1 Shanghai JiaoTong University, 2 Massachusetts Institute of Technology, 3 University of Waterloo; ranks run to 27). Below are an unranked "Honorable Mention" list of 24 universities and a "Regional Champions" table of six regions (Asia, North America, Europe, Latin America, South Pacific, Africa and the Middle East) with their champions. No problem counts, times or per-problem results.
