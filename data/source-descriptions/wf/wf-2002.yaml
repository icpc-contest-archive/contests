  description: |-
    Final standings of the 2002 World Finals as rendered by the Competitive Programming Hall of Fame website, not an original contest page: 64 teams with rank, country, university and team name, number of problems solved (score), penalty and a prize column that marks the World Champion and the regional champions. For ten teams the members are named. Shanghai Jiao Tong University is first with 6 problems and a penalty of 831. Ranks 1 to 56 are given one per team; the eight teams with no solved problem share the rank 57 - 64. A header gives the date, venue (Hilton Hawaiian Village, Honolulu), duration of 300 minutes and 9 problems. There is no per-problem detail.
