  contest_date: '2001-03-10'
  description: |-
    Crawl of the ICPC site at Baylor University, which includes its page Results World Finals 2001. Our copy holds 150 files, 133 of them pages; 45 of those pages are empty shells of a script-driven site (the body is filled in by JavaScript and is blank here) and 3 are redirect stubs. The Results World Finals 2001 page gives the 2001 World Finals results in English: 47 ranked teams with rank, name, number solved and penalty (the 10 top-ranked rows have a penalty, the other 37 have none), 17 teams under Honorable Mention, and the champion of each of six super-regions. A History - ICPC 2001 page reports that sixty-four teams from 2,700 competed and that the finals were held on 10 March 2001 in Vancouver, Canada. A 12-page PDF fact sheet for 2001 and a 2001 World Finals announcement page whose menu lists earlier standings are also inside; the linked standings pages are not in the crawl.

    The crawl mostly holds other material: results, history and fact sheet pages for 2002, front pages, the compete and community pages, and pages from later years. One file in it is a standings XML of the 2008 ACM-ICPC World Finals, generated by the CSUS Programming Contest System, which is not of this contest.
