  description: |-
    Problem set as a scan of 6 pages, in English, with four problems labelled A to D: Peg Puzzles (pages 1 to 3, including a table of the 36 potential moves), Repeating Decimals (page 4), Embedded Arabic to Roman (page 5) and Speedometer Corrections (page 6). The first page of each problem is headed "1979 NATIONAL SCHOLASTIC PROGRAMMING CONTEST". Each statement describes the task, the input on cards where given, and the output required; Peg Puzzles has a sample input and output, and Repeating Decimals and Embedded Arabic to Roman have examples. No place or date of the contest is printed on the pages, and there is no test data or solutions.

    The pages are images with no text layer.
