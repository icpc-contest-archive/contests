  description: |-
    Page titled 'The Early Years - World Finals Champions' from the ICPC site, compiled as of 7 December 2007, with a request for photocopies of plaques or other evidence of old contests and standings. It gives one entry for each ACM Contest Finals from 1977 to 1997, with the city and, for every year but 1985, the date, and the top-placed universities, some with team members, coaches and finals directors.

    The 1979 entry reads February 21, 1979, Dayton, Ohio and lists four places: Washington University, St. Louis, with four team members named, then Michigan State University, Purdue University and New York University. It gives no solved counts or times. Our copy holds the one page.
