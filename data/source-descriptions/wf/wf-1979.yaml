  description: |-
    Single page, "The Early Years - World Finals Champions", marked "as of 7 Dec 2007", of the ICPC website. It has one entry for each World Finals from 1977 to 1997 (21 entries), each with the city of the finals and, except for 1985, the date, followed by the top-placed institutions, with team members' names for some years. The page asks readers to send evidence such as a photocopy of a plaque to fill in missing teams and standings.

    The 1979 entry covers the ACM Contest Finals of 21 February 1979 in Dayton, Ohio, and names four institutions in order: Washington University, St. Louis (with four team members' names), Michigan State University, Purdue University and New York University. It has no results beyond those four places and no problems.
