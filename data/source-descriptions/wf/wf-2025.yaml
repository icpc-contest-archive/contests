    Final scoreboard produced by PC^2 (version 9.11), generated 7 September 2025: 139 teams and twelve problems labelled A to L. Each row gives rank, a number followed by the institution name, problems solved, total time, and for each problem attempts and time in the form attempts/time, followed by total attempts and solves. St. Petersburg State University is first with 11 problems. A last row gives per problem the submissions, the time of the first yes and the total yes count (headed Submitted/1st Yes/Total Yes). A legend marks gold, silver and bronze medalists, honors levels, solved, first to solve, pending and wrong cells. Links lead to sub-standings for eight regions and to a PDF per problem. The linked sub-standings and problem PDFs are not in our copy; the style sheet and images of the page are.
