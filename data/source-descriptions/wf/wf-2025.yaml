    Standings page of the 2025 World Finals. It lists 139 teams with team name, institution, problems solved and time. A Medal column gives gold medals to four teams, silver to four and bronze to four, then Highest Honors (5 teams), High Honors (22), Honors (49) and Honorable (51). Eighty-eight teams carry a rank and an ordinal place citation; the 51 Honorable teams have neither. A Site citation column names a regional champion (Northern Eurasia, Asia Pacific, Asia East, North America, Europe, Asia West, Latin America, Africa and Arab) for eight teams. No per-problem results and no tries are given.
