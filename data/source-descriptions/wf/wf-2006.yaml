  description: |-
    Official standings of the 30th Annual ACM-ICPC World Finals, sponsored by IBM, held in San Antonio, Texas on April 12, 2006, as published on the ICPC website. A heading names Saratov State University as the 2006 World Champions. A table ranks 55 institutions by problems solved, from 6 solved down to 2, with times given only for the 12 teams ranked 1 to 12. Tied teams share a rank (for example 17 teams are ranked 39).

    Below the table, 28 further universities are listed as Honorable Mention in two alphabetical columns, without rank or results. A last table names the champion of each of six regions: Africa and the Middle East, Asia, Europe, Latin America, North America and South Pacific. There are no per-problem results and no attempt counts. Two images are saved with the page.
