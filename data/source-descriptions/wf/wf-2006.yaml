    Standings of the 2006 ACM Programming Contest World Finals: 83 teams with rank, team name, institution, problems solved and time. Further columns give the medal (gold, silver or bronze for places 1 to 12), a citation with the place reached (First Place down to Eighty-second Place, with some spellings as printed) and a site citation naming the regional champions. Tied teams share a rank, and the final two teams are ranked 82. The page states 83 teams for World Finals year 2006.

    There are no per-problem results, no attempt counts, no country column and no contest date on the page.
