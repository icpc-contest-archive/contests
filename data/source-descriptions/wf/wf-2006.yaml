  description: |-
    Final standings of the 2006 World Finals on the Competitive Programming Hall Of Fame site: 83 teams with rank, country, institution and team name, the three team members, score (problems solved), penalty time and a prize column. The prize column marks the World Champion and the champions of six regions: Europe, Asia, North America, Latin America, South Pacific, and Africa and the Middle East. Teams on equal scores and penalty share a rank (two pairs, ranked 64 - 65 and 82 - 83). There are no per-problem results.

    A box above the table gives the date (April 12, 2006), the venue (Baylor University, San Antonio, Texas), the duration of 300 minutes and the scoring (10 problems), with a link to the official results page. The site menu and links to team members' profile pages are also on the page.
