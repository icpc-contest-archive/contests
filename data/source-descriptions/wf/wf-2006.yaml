  description: |-
    News page on the ICPC News site, headed The 2006 World Champions. A single paragraph says that 83 teams competed at the 30th Annual ACM International Collegiate Programming Contest World Finals, sponsored by IBM, on April 12, 2006, hosted by Baylor University, out of 5,606 teams from 1,737 universities in 84 countries at 183 sites. It names Saratov State University as the winner, with its three contestants and coach.

    Four links lead to the standings, a photo gallery, the problems and a video; they point to other addresses and are not part of our copy. Only the champions are named, so the page gives no further order of teams.
