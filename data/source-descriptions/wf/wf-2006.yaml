    ICPC Live Archive category page for World Finals 2006 - San Antonio, dated Tuesday, 30 November 2021 on the page. It lists ten problems numbered 3561 to 3570: Low Cost Air Travel, Remember the A La Mode!, Ars Longa, Bipartite Numbers, Bit Compressor, Building a Clock, Pilgrimage, Pockets, Degrees of Separation and Routing. For each it gives total submissions with the solving percentage and total users with the solving percentage. The problems carry no letter labels.

