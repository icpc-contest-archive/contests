    Problem set of the 47th ICPC World Championship, World Finals in Luxor, hosted by AASTMT: a PDF of 22 pages with eleven problems, A to K. Problems A to I and K take two pages each; problem J takes one page, followed by a page marked as intentionally left blank. Every page carries a running header naming the championship and the host, and a footer with the problem letter and title and "ICPC Foundation" as copyright holder. Each problem gives its time limit (1 to 20 seconds), a statement in English and sample input and output. Problems B to K have Input and Output sections; problem A is interactive, has an Interaction section and shows its two samples as interactions. There is no separate cover page, no contest date in the headers and no solutions or test data.
