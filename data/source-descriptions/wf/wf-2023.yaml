  description: |-
    Interactive scoreboard of the ICPC World Finals 2023, a script-driven page with a favorites function, a timeline for viewing earlier scoreboard states and a what-if view for unsolved problems. Our copy holds the page with its scripts and style sheet and two data files: a list of 130 teams (institution names) and a log of 1,906 submission events for the 11 problems A to K, each with team, problem, result mark, attempt count and time in seconds. The data marks the contest as finished and not frozen, with a length of 300 minutes. The most problems solved by any team in the log is nine.

    The scoreboard table is filled in by the scripts when the page is opened; the page file itself holds no table rows. 129 of the 130 teams have at least one submission in the log.
