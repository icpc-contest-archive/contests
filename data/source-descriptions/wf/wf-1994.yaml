    Final results of the ACM International Collegiate Programming Contest Finals of March 9, 1994 in Phoenix, Arizona, as a preformatted text table: 35 teams, each with rank, university, number of problems solved and total elapsed time. The University of Waterloo is first with 6 problems solved. Two teams share rank 20 and rank 21 is skipped; the other teams have ranks 1 to 35 in sequence. A note under the table says ranking is by problems solved and then by total elapsed time, and that the ranking handed out at the Finals did not use elapsed time for places 7 to 35, so places 7 to 14 were listed as 7th, 15 to 24 as 15th, 25 to 31 as 25th and 32 to 34 as 32nd. No per-problem detail.
