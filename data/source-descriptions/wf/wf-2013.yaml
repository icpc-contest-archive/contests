    News page on the ICPC News site announcing the 2013 World Champions: St. Petersburg National Research University of IT, Mechanics and Optics, with its three contestants and coach named. The text places the 37th Annual ACM International Collegiate Programming Contest World Finals in St. Petersburg, Russia on July 3, 2013, sponsored by IBM and hosted by ITMO, and says the champions came from among 120 teams, chosen from 29,826 contestants at 2,322 universities in 91 countries.

    The page links to the standings, a photo gallery, the problems, a video playlist, the contest data and a live video playlist. Our copy holds this one page only; the linked documents are not part of it.
