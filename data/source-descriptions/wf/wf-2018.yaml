  tries: true
  description: |-
    Final scoreboard produced by DOMjudge, headed "ACM ICPC World Finals 2018 final standings": 140 teams with rank, institution (logo and name), number of problems solved and penalty time, and one cell for each of the problems A to K. A solved cell gives the solve time in minutes and the number of tries; unsolved attempts show only the tries. Nine solved cells, first solves of a problem, are highlighted, and eight teams carry a badge naming a region (for example Asia East). A summary row at the bottom gives total problems solved and, for each problem, the numbers of accepted, rejected and pending submissions and the time of the first solve. The last two teams, both with no problem solved, share one rank.

    The first place is Moscow State University with 9 problems and 1427 minutes. The page ends with a colour legend and the stamp "Last Update: Thu 19 Apr 2018 18:07:29 CST".
