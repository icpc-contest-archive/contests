- url: http://icpc2018.pku.edu.cn/
  read: '2026-11-16'
  rubric: 1
  copy: wf/wf-2018/website/2026-09-05-wayback-f39103cb
  title: Peking University
  language:
  - en
  contest_date: '2018-04-19'
  description: |-
    Website of the 2018 World Finals hosted by Peking University and the Children and Youth Science Center of CAST, in English, headed "Peking University welcomes you to Beijing." Its menus cover About, Competition, For Participants, About Beijing, Donate and Supporters.

    Our copy holds 12 distinct pages (103 files with images, style sheets and scripts): the home page, the About pages on the ICPC, its history, qualification and prizes (the prizes page only points to the ICPC website), a news list of 11 entries from December 2017 to March 2018, and four news items: two retrospectives on 2017, a report on grants from Chinese technology companies for the Finals (15 to 20 April 2018) and a press release announcing 140 teams. The About overview and Donate pages hold only the menus. The About the ICPC page says the Finals are conducted on 19 April 2018.

    The Competition, For Participants, About Beijing and Supporters pages are linked from the menus but are not in our copy, so it has no schedule, team list, rules, results or problems. It also holds a 47-page Chinese-language PDF ranking of 2,163 teams (school, team, problems solved, total time) that is not about the 2018 finals.
