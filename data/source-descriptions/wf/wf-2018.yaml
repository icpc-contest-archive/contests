  description: |-
    Standings page of the Competitive Programming Hall Of Fame for the ACM-ICPC 2018 World Finals. A header block gives the date (April 19, 2018), the venue (Peking University's Khoo Teck Puat Gymnasium, Beijing, China), a duration of 300 minutes and 11 problems, and links to the official results page.

    The table lists 140 teams with rank, country, institution with team name and the three team members, score (problems solved), penalty and prize. The prize column holds the world champion and regional champion titles and dollar amounts for some teams. The last two teams share rank 139-140. There is no per-problem detail. The first place is Moscow State University with 9 solved and a penalty of 1427.
