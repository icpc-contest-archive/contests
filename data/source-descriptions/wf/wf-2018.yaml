  description: |-
    Final standings of the 42nd Annual World Finals of the International Collegiate Programming Contest: 140 teams with rank, team name, institution, problems solved, time, medal, citation and site citation. There are 4 gold, 4 silver and 5 bronze medals for places 1 to 13, with citations First Place to Thirteenth Place. From the fourteenth place on, teams with the same number of solved problems share one rank (17 teams share rank 14, 25 share rank 31, 43 share rank 56), and 42 teams are listed as Honorable without a rank. The site citation column names eight regional champions.

    The first place is Moscow SU Red Panda from Moscow State University with 9 solved and a time of 1427. There is no per-problem detail.
