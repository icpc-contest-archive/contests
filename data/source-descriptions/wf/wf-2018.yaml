  description: |-
    Problem set as a PDF of 22 pages in English, holding eleven problems labelled A to K in order: Catch the Plane, Comma Sprinkler, Conquer The World, Gem Island, Getting a Jump on Crime, Go with the Flow, Panda Preserve, Single Cut of Failure, Triangles, Uncrossed Knight's Tour and Wireless is the New Fiber. Each problem starts with its title and time limit, followed by the statement, input and output specification and sample input and output, with figures in some. The page footers read "ACM-ICPC World Finals 2018 Problem" followed by the letter and name of the problem.

    The PDF begins directly with Problem A and has no cover page, contest date or host. Page 8 is blank ("This page is intentionally left blank."). No test data or solutions.
