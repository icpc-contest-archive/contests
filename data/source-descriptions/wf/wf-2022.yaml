  description: |-
    Problem set of the 46th ICPC World Championship as a PDF of 22 pages, with eleven problems labelled P to Z, in English. Each page carries a header naming the World Finals, ICPC 2023 Luxor, the 46th Annual ICPC World Championship and AASTMT as host, and a footer with the problem letter and title and the ICPC Foundation copyright. Each problem has a time limit (1 to 5 seconds), a statement with input and output format, and at least one sample; problem W is interactive, with five rounds of questions to the judge and two sample interactions. Some statements carry figures. There is no separate cover page: the first page begins with problem P, Turning Red, page 8 reads "This page is intentionally left blank", and the last page ends with problem Z, Archaeological Recovery. No test data or solutions.
