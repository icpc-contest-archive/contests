    Standings of the ICPC 2022 World Finals as listed by the Competitive Programming Hall of Fame site: 124 teams in rank order 1 to 124, with country, institution and team name followed by the team members, score (problems solved, 10 for the first team), penalty and a prize column. Seventeen teams have an entry in the prize column, the champion titles and prize money in US dollars; Peking University is first. No per-problem results.

    A box above the table gives the date as April 18, 2024, the venue as Jolie Ville Resort & SPA Kings Island in Luxor, Egypt, 300 minutes and 11 problems, and links to the official scoreboard page. The site's menus, links to team and member profile pages and a footer surround the table.
