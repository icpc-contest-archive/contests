  description: |-
    Scoreboard page of the World Finals 2022, built as a browser application. The HTML itself holds only the title, a help box (favorites, timeline, what-if standings), a timer and an empty table; the table is filled in by scripts. Our copy holds those scripts and the two data files they load: a list of 124 teams (institution name, with three member handles for 87 teams and none for the other 37) and the log of the contest, 2,132 events from all 124 teams, each with team, problem (eleven problems, P to Z), a mark of +, - or ?, an attempt number and a time. The data ends at 300 of 300 minutes and is not marked as frozen.

    The scoreboard table does not appear in our copy unless the scripts run in a browser; read as plain HTML the page shows only its help text.
