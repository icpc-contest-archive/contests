  description: |-
    Crawl of the ICPC site at Baylor University, seeded at its page Results World Finals 2000. Our copy holds 150 files, 132 of them pages; 43 of those pages are empty shells of a script-driven site (the body is filled in by JavaScript and is blank here) and 3 are redirect stubs. The seed page gives the 2000 World Finals results in English: gold, silver and bronze medal teams, the regional champions, a ranking of 43 teams by place with no solved counts, and 17 teams under Honorable Mention. A History - ICPC 2000 page reports that sixty teams from 2,400 teams competed and that the finals were held on 18 March 2000 in Orlando, Florida. Also inside are a 26-page PDF fact sheet for 2000 containing the call for participation of 1 September 1999, and a 2001 World Finals announcement page whose menu lists the 2000 standings; the linked standings page is not in the crawl.

    The crawl covers the whole ICPC host and mostly holds other material: results, history and fact sheet pages for 2001, front pages, the compete, community and regionals menus, and results pages from later years up to 2012. One file in it is a standings XML of the 2008 ACM-ICPC World Finals, generated by the CSUS Programming Contest System, which is not of this contest.
