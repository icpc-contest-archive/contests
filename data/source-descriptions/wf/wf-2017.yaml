  description: |-
    Final scoreboard of the World Finals, a snapshot of the contest-time board: 128 teams with rank, institution, number solved, penalty time and, for each of the problems A to L, the number of attempts and the minute of the solving submission (or attempts only for unsolved problems). Start 24 May 2017 08:45 MDT, end 13:45 MDT, and the page says the contest is over. St. Petersburg ITMO University is first with 10 solved and 1093 minutes. Cells are coloured for first solve, solved, attempted and pending, and the board marks super region leaders. Footer rows give solved over tries, average tries and average tries to solve for each problem. Five further institutions are listed at the end without rank or results. Problem letters link to problem pages on an online judge, which lead outside our copy.
