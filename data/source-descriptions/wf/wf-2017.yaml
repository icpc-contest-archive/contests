  title: The 2017 World Champions
  language:
  - en
  contest_date: '2017-05-24'
  description: |-
    Page from the ICPC website announcing the 2017 World Champions, St. Petersburg ITMO University, at the Annual ACM International Collegiate Programming Contest World Finals, sponsored by IBM, held on 24 May 2017 in Rapid City, South Dakota. It states that 133 teams of three took part, chosen from 46,381 contestants at 2,948 universities in 103 countries, and names the winning team, its coach and its contestants. Links lead to the final standings, the problem set, the input and output data and official photos and video; the site menu also covers the schedule, rules, local information and past problems.

    Our copy holds 17 files but only two pages: this page and a PDF of the ICPC Policies and Procedures of 16 April 2018 (6 pages), which is not about this contest. The rest are 15 images; the linked results, problem and data pages are not in our copy.
