  description: |-
    Standings of the 2017 World Finals on the Competitive Programming Hall Of Fame website: 133 teams with rank, country, university, team name and the names of its members, score (problems solved), penalty and prize. The page header gives the date May 24, 2017, the venue Rushmore Plaza Civic Center in Rapid City, a duration of 300 minutes and 12 problems. The prize column holds the champion titles (World Champion, continental champions) and prize money in dollars, starting at $15000 for first place. St. Petersburg ITMO University is first with 10 problems and penalty 1093. Six teams at the bottom carry the rank 'qualified' with a score of 0 and no penalty. There is no per-problem detail.

    The page belongs to a third-party site; many links on it lead to the site's own country, university and profile pages, which are not part of our copy.
