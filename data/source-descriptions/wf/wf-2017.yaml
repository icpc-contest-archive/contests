  description: |-
    Final scoreboard of the 2017 World Finals, with the contest timer showing the contest as over (start 2017-05-24 08:45 MDT, end 13:45 MDT, five hours). It lists 133 teams by university: 128 ranked rows with rank, team, number solved, penalty time and, for each of the twelve problems A to L, the number of attempts and the solve time in minutes (or attempts marked with -- when unsolved), and five more universities at the bottom with no rank and no results. First solves are marked (11 cells), as are super region leaders. St. Petersburg ITMO University is first with 10 problems and 1093 minutes.

    A footer gives, per problem, solved and tries counts, average tries and average tries to solve. The problem letters link to the problems on another server, which are not part of our copy.
