  title: The 2017 World Champions
  language:
  - en
  contest_date: '2017-05-24'
  description: |-
    Page of the ICPC website about the 2017 World Finals, announcing the champions: St. Petersburg ITMO University, from 133 teams of three chosen from 46,381 contestants at 2,948 universities in 103 countries. It names the 41st Annual ACM International Collegiate Programming Contest World Finals, sponsored by IBM, held on May 24, 2017, in Rapid City, South Dakota. Below the champion team it has links to Final Standings, Problem Set, Input/output Data and Official Photos/Video. The page is stamped as last modified on June 7, 2017, and carries the site's menus for World Finals, Regionals, Compete and Community.

    Our copy holds two pages: this one and a 6-page PDF of the ICPC Policies and Procedures dated April 16, 2018, which is not about this edition. The linked results, problem set and data files are not part of our copy. Besides the two pages, our copy holds 15 image files (banner and photo gallery pictures of the site), but not the champions photograph shown on the page.
