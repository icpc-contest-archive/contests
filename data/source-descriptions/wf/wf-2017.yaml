    Official World Finals results page from the ICPC website. A table of the top twelve teams gives place, institution, problems solved, penalty time and the minute of the last solved problem; St. Petersburg ITMO University is first with 10 solved and 1093. A second table lists 97 further ranked teams by place and number solved only, from 13th place with 7 solved down to 56th with 4, and an unranked Honorable mention list of 24 institutions follows. The page also lists the champion of each of six regions and a table headed Problem, Team and Time that gives a team and a minute for eleven of the 12 problems; the last, Scenery, is marked not solved. Teams are named by institution only; no per-team, per-problem results.
