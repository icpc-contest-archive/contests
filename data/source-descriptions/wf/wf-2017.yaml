  title: Results 2017
  language:
  - en
  teams: 133
  problems: 12
  description: |-
    Official results page of the 2017 World Finals on the ICPC website. A table of the twelve ranked teams, places 1 to 12, gives place, university, problems solved, total time and the minute of the last solved problem; St. Petersburg ITMO University is first with 10 problems and 1093 minutes. A second table lists 97 more universities from place 13 to place 56, grouped by number of problems solved (7 down to 4), without times. An Honorable mention list names 24 more universities, giving 133 teams in all.

    The page also has a table of the champion of each of six regions (Africa and the Middle East, Asia, Europe, Latin America, North America, South Pacific) and a table of the first team to solve each problem with its time in minutes; 11 problems have a first solver and Scenery is marked Not solved. The page ends with 'Last modified on 17:26 PM May 24, 2017'.
