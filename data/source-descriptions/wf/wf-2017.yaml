    Standings of the World Finals on the Competitive Programming Hall Of Fame, a third-party site, not the organisers: 133 teams with rank, country, institution, team name and its three members, problems solved, penalty and prize. The top five solved 10 problems. The prize column gives money amounts (the winner, St. Petersburg ITMO University, is marked World Champion and Europe Champion with $15000) and continent champion marks. 127 teams carry a numeric rank; the last six teams have 'qualified' in place of a rank and 0 solved. A box gives the date 24 May 2017, the venue Rushmore Plaza Civic Center in Rapid City, a duration of 300 minutes and 12 problems. No per-problem results. Links lead to the site's own profile pages and are not in our copy.
