  title: The Early Years - World Finals Champions
  language:
  - en
  contest_date: '1997-03-02'
  description: |-
    Multi-year page headed 'The Early Years - World Finals Champions', dated as of 7 December 2007, with 21 entries, one for each World Finals from 1977 to 1997. Each entry gives the city and, except for 1985, the date, usually the finals director, and the top places: the number of places varies from one (1978) to ten (1997), and team members are listed for some of the teams. The 1997 entry, dated March 2, 1997 in San Jose, California, lists places 1 to 10: Harvey Mudd College, University of Washington, University of Queensland, National Taiwan University, University of Waterloo, Umea University, Comenius University Bratislava, St. Petersburg State University, Massachusetts Institute of Technology and Korea Advanced Institute of Science and Technology. The page asks readers to send a photocopy of a plaque or other evidence to fill gaps.
