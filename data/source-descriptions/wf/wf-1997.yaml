  title: 1997 ACM Programming Contest World Finals Final Standings - March 2, 1997, San Jose, California
  language:
  - en
  contest_date: '1997-03-02'
  teams: 50
  description: |-
    Final standings of the 1997 ACM Programming Contest World Finals, San Jose, California, March 2, 1997. A table of 27 ranked rows gives rank, team, problems solved and penalty; Harvey Mudd College is first with six problems and 900 penalty, and the University of Washington and the University of Queensland share second place. Penalty is given only for ranks 1 to 10; the teams ranked 11 (five) and 16 (twelve) have none. Below the table 23 more universities are listed in alphabetical order as Honorable Mention without results, so 50 teams appear in all. No per-problem detail.

    The first four teams are linked to pages of the finals tour, which are not part of our copy.
