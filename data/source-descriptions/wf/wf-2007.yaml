    Final scoreboard of the 2007 World Finals: 88 teams, each row giving rank, a team column holding the institution name, one cell for each of problems A to J, the number solved and the total time. A solved problem is shown with a plus sign, the number of earlier wrong attempts when there were any, and the minute of the accepted run; an unsolved problem with attempts shows a minus sign and the number of attempts, and a dot marks a problem not tried. The first row is Warsaw University with 8 solved. Two teams share rank 18 and three share rank 86.

