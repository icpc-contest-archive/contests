    News page on the ICPC News site, headed The 2007 World Champions. A single paragraph says that 88 teams competed at the 31st Annual ACM International Collegiate Programming Contest World Finals, sponsored by IBM, on March 15, 2007, hosted by the ACM Japan Chapter and IBM Tokyo Research Lab, out of 6,099 teams from 1,756 universities in 82 countries at 205 sites. It names Warsaw University as the winner, with its three contestants and two coaches.

    Four links lead to the standings, a photo gallery, the problems and a video playlist; they point to other addresses and are not part of our copy. Only the champions are named, so the page gives no further order of teams.
