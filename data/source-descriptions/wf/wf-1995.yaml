  description: |-
    Page covering the World Finals from 1977 to 1997, 21 contests in year order, each with its date and host city and the universities that placed highest, in order; how many places are listed varies by year, and for some years the members of the winning team are named. The 1995 entry, dated March 1, 1995 in Nashville, Tennessee, gives places 1 to 6: Freiburg, University of California at Berkeley, Technical University Delft, Harvard University, California Institute of Technology and Virginia Tech. The page says it is compiled as of 7 December 2007 and asks readers to send evidence of results of the early contests. Only the top places are given, no scores.
