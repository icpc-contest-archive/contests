  description: |-
    Final results of the 1995 World Finals of the ACM International Collegiate Programming Contest, headed as sponsored by Microsoft, on a short page: 38 teams with rank, team name in short form (Freiburg, UC Berkeley, TU Delft), number of problems solved and total time in minutes. Freiburg is first with 6 solved and 991 minutes, ahead of UC Berkeley with 6 and 995. Ranks 7, 11, 19, 28 and 37 each cover a group of teams that share the rank. No per-problem detail and no date on the page.
