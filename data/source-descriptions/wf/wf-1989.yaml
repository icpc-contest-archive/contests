  description: |-
    Page titled "The Early Years - World Finals Champions", one list for the ACM Contest Finals of 1977 to 1997 (21 yearly entries), with a note that it was compiled as of 7 Dec 2007 and an invitation to send in plaques or other evidence to fill gaps. Each entry gives the date and city of the finals, a finals director in 19 of the 21, and the top places by university, with team members named for some of the winners.

    The 1989 entry (22 February 1989, Louisville, Kentucky) ranks six universities: University of California at Los Angeles, Rensselaer Polytechnic Institute (Troy, NY), Texas Tech, Duke University, Rice University and Carnegie-Mellon University. Team members are listed for the first three. No problems solved or times are given. Our copy is the text of the page only.
