  description: |-
    Problem set as a scan of 13 pages in English, with no text layer. Each problem opens under the heading "1989 ACM Scholastic Programming Contest". It holds eight problems, A to H: Finger Walks, Communicating Boats, The Thief of Bagdad, Star Painters, Network Routing, Twistin' and Turnin', Find A Word and Data Dependency Analysis. Each problem has a statement; several give input and output specifications and example input and output. There is no cover page, date or place, and no test data or solutions.

