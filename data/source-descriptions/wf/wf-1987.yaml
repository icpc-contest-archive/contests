  description: |-
    Page headed "The Early Years - World Finals Champions", a single list of the ACM Contest Finals of 1977 to 1997 (21 years), compiled as of 7 December 2007, with a request to send plaques or other evidence of old teams and standings. The 1987 entry reads "1987 ACM Contest Finals, February 18, 1987, St. Louis, Missouri" and lists six places: Stanford University; University of Central Florida; Johns Hopkins University (printed "John Hopkins University"); California Institute of Technology; Carleton College; Michigan State University. Members are named for the first two teams only. No scores, problems solved or times are given.

    Only the top six are listed, so this is a partial ranking of the finals, in a page that covers other years as well.
