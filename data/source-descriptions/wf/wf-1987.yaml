  description: |-
    Problem set of 10 PDF pages, a scan with no text layer, in English. Each problem starts with a header "1987 ACM Scholastic Programming Contest XI", the problem title with its letter, and the names of the source file to hand in, for Pascal and for FORTRAN.

    Eight problems A to H: Anagram Dictionary, Chess, Splay Crossings, Quick and Dirty Message Encryption, Illegal Transmissions, Integer Decompositions, Word Ladders and Refinery Pipes. Problems A and B run onto a second page and the other six take one page each; examples appear in at least problems A, D and F. No solutions or test data.
