  description: |-
    Category page of the ICPC Live Archive online judge for the World Finals 2005 in Shanghai, captured on 26 September 2021. It lists ten problems with archive numbers 3269 to 3278 (Eyeball Benders through Zones), each with total submissions, solving percentage, number of users and the share of users who solved it. Only the names and statistics are on the page; the statements are behind links that are not in our copy. The page also carries the site's menu and login box.
