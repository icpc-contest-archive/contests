  title: Tour
  language:
  - en
  description: |-
    Crawl of the ICPC website of Baylor University, a general site of the contest series and not a site of the 2005 World Finals alone. It starts at the photo pages of the ICPC Tour 2005 in Shanghai, grouped by event (city of Shanghai, opening ceremony, cyber cafe, parallel challenge, contest, awards ceremony and others); 46 captured addresses are such pages, 37 of them distinct. The captures were made in different years, between 2005 and 2019; the tour pages date from 2005 to 2007. Our copy holds 150 files, 127 of them pages; 29 of the files are short stubs that only ask the reader to enable JavaScript.

    For 2005 it holds a results page (the 2005 World Champions, Shanghai Jiaotong University, then 40 universities with rank, solved and, for ranks 1 to 12 only, time; ranks run from 1 to 29 with shared places; then 38 honorable mentions and the regional champions) and a history page that announces the results and the champion team, with links to final standings, the problem set and photos and video. Pages for 2006, two fact sheets as PDFs (dated December 2004 and December 2005) and the site's home pages are in it too.
