  description: |-
    Final standings of the 2005 World Finals as rendered by the Competitive Programming Hall of Fame website, not an original contest page: 78 teams with rank, country, university and team name, number of problems solved (score), penalty time and a prize column marking the World Champion and the regional champions. For 18 teams the members are named. Shanghai Jiao Tong University is first with 8 problems and a penalty of 1517; the next five teams solved 7. Ranks 1 to 76 are given one per team; the two teams with no solved problem share the rank 77 - 78. A header gives the date, venue (Pudong Shangri-La Hotel, Shanghai), duration of 300 minutes and 10 problems. There is no per-problem detail.
