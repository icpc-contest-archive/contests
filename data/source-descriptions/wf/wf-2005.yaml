    Problem set of the 2005 World Finals: a PDF of 18 pages, in English, with ten problems A to J (Eyeball Benders, Simplified GSM Network, The Traveling Judges Problem, cNteSahruPfefrlefe, Lots of Sunlight, Crossing Streets, Tiling the Plane, The Great Wall Game, Workshops, Zones). Each problem starts with its letter, title and input file name and has a statement with input and output description and a sample input with its output. There is no cover page naming the contest, and no test data or solutions.
