    Problem set of the ICPC World Finals 2019 as a PDF of 22 pages, in English, with eleven problems labelled A to K: Azulejos, Beautiful Bridges, Checks Post Facto, Circular DNA, Dead-End Detector, Directing Rainfall, First of Her Name, Hobson's Trains, Karel the Robot, Miniature Golf and Traffic Blights. There is no cover page: the file opens directly with Problem A. Each problem starts on its own page with the time limit (from 1 second to 15 seconds), the statement, input and output format and sample input and output, and most take two pages. Problems A and J fit on one page and are followed by a page marked as intentionally left blank. Several problems have figures. No test data or solutions.
