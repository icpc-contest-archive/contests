  title: 'ICPC Tour 2003: Beverly Hills, California'
  language:
  - en
  contest_date: '2003-03-25'
  description: |-
    Pages of the ICPC website from icpc.baylor.edu, in English, that cover the 2003 World Finals in Beverly Hills and also the 2004 World Finals in Prague. Our copy holds 148 saved pages (two further files are empty application shells), many of them the same page under several addresses. Most are the photo galleries of the 2003 and 2004 events, in 14 sections for 2003 (arrival, IBM welcome, opening ceremony, practice session, the finals, award ceremony and others) and 10 for 2004, with a few photo captions and counts of images but no text about the contest.

    Four pages are articles. The 2003 history page announces the results from Beverly Hills with Warsaw University as World Champion, and says that seventy teams, chosen from 3,850 teams of 1,329 universities in 68 countries at 106 sites, are competing in the 27th contest to be held on March 25, 2003, with links to standings, problem set and photos. The 2003 results page lists the teams' universities by place in groups, the honorable mentions and the six regional champions, with no scores. The 2004 history and results pages are the same kind of pages for the next contest.

    The photographs themselves are not in our copy, only the pages that point to them.
