  description: |-
    Page headed "The Early Years - World Finals Champions", a single list of the ACM Contest Finals of 1977 to 1997 (21 years), compiled as of 7 December 2007, with a request to send plaques or other evidence of old teams and standings. The 1983 entry reads "1983 ACM Contest Finals, February 16, 1983, Melbourne, Florida" and lists the four top places: University of Nebraska, Lincoln; University of California at Los Angeles; North Carolina State University; Rensselaer Polytechnic Institute (Troy, NY). Members are named for the first two teams only. No scores, problems solved or times are given.

    Only the top four are listed, so this is a partial ranking of the finals, in a page that covers other years as well.
