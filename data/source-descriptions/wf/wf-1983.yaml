  description: |-
    Problem set of 13 PDF pages, a typewritten scan with no text layer, in English. The first page is headed "1983 ACM NATIONAL SCHOLASTIC PROGRAMMING CONTEST - CONTEST PROBLEMS - February 16, 1983" and gives general instructions: programs may be written in FORTRAN or Pascal, with the input and output conventions of each. The instructions say the booklet contains six problems, but eight are printed.

    The eight statements are numbered 1 to 8: Mousetrap, Spanning Trees, Table Manipulation, Inscribed Figures, Data Dictionary, Log Cabins, Polynomial Multiplication and Binary Game Trees. Problem 8 comes before problem 7 in the document. Several statements include sample input or output. No solutions or test data.
