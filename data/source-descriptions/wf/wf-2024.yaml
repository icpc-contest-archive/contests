  description: |-
    Problem set of the 48th ICPC World Championship: a PDF of 24 pages with twelve problems, A to L, from Billboards to Where Am I Now?. Problems A to C, E to I, K and L take two pages each; problems D and J take one page each, each followed by a page marked as intentionally left blank (pages 8 and 20). There is no cover page: page 1 starts with problem A, and every page that is not blank carries a footer with the problem letter and title and "ICPC Foundation" as copyright holder. Each problem gives its time limit (1 to 6 seconds), a statement in English and at least one sample. Problems A to K have Input and Output sections; problem L is interactive, has an Interaction section and shows three sample interactions. The footers state no contest date, and the document has no solutions or test data.
