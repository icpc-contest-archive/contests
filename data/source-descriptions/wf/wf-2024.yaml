  description: |-
    Website of the 48th Annual World Championship of the ICPC, the World Finals in Astana, Kazakhstan, banner dated 15-20 September 2024. The home page carries a video and names the host and organizers (the Kazakhstan Competitive Programming Federation, Freedom Holding Corp. and the Ministry of Digital Development, Innovations and Aerospace Industry), sightseeing in Astana, sponsor and affiliated-university sections and a media accreditation notice. The counters for attendees, contestants, universities and countries read 0 in our copy.

    Our copy holds eight distinct pages, in English (the home page is saved under two addresses): home, About ICPC, For participants (visa information and links to a pocket guide and a brochure), Challenge (the ICPC Challenge powered by Huawei on Tuesday, 17 September 2024, a three-hour contest on allocating a model on a computer cluster, with prizes), Astana, Venue (EXPO International Exhibition Center, Congress Center and Presidential Center), Excursions (a guided tour of the Nur Alem Future Energy Museum on 17 September) and Host and Organizers.

    The site has no scoreboard, standings, team list or problems. The schedule and gallery links lead to other servers, and the pocket guide and brochure PDFs are not in our copy. Images, style sheet, scripts and the home page video are in our copy.
