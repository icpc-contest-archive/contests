  description: |-
    Interactive scoreboard of the ICPC World Finals 2024, a script-driven page with a favorites function, a timeline for viewing earlier scoreboard states and a what-if view for unsolved problems. Our copy holds the page with its scripts and style sheet and two data files: a list of 141 teams (institution names) and a log of 3,109 submission events for the 12 problems A to L, each with team, problem, result mark, attempt count and time in seconds. The data marks the contest as not frozen, with a length of 300 minutes. Every one of the 141 teams has at least one submission in the log, and the most problems solved by any team in the log is nine.

    The scoreboard table is filled in by the scripts when the page is opened; the page file itself holds no table rows. A note for browsers without scripts points to another scoreboard address.
