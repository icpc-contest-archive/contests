    Problem set as a PDF of 22 pages, in English: 11 problems labelled A to K, each with its title, the statement, the input and output specification and a sample input with its output. The problems are A A Careful Approach, B My Bad, C The Return of Carl, D Conduit Packing, E Fare and Balanced, F Deer-Proof Fence, G House of Cards, H The Ministers' Major Mess, I Struts and Springs, J Subway Timing, K Suffix-Replacement Grammars.

