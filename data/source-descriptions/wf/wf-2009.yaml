  description: |-
    Frozen scoreboard page of an unofficial scoreboard script, which says it is experimental and not official. A banner says that ICPC 2009 is over, links to the final official results and states that the results below are frozen 1 hour before the end. The page's script holds 99 teams and 11 problems labelled A to K, named in the data by balloon colour (yellow, dark purple, blue and so on). For each team and problem it gives whether it was solved, the number of attempts and the time, and 9 cells are marked pending. The highest score in it is 7 problems.

    The table is built by script when the page is opened. In the HTML text itself only the banner and the refresh and history controls are visible.
