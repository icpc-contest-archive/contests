  description: |-
    Standings of the 2009 World Finals on the Competitive Programming Hall of Fame site. A header table gives the date April 21, 2009, the venue KTH - Royal Institute of Technology in Stockholm, a duration of 300 minutes and 11 problems. The standings table has 100 rows with rank, country, team, score (problems solved), penalty and prize; each team is shown as institution, team name and its three members. 67 teams are ranked 1 to 67 with a score; a penalty is shown for ranks 1 to 13 only and a question mark stands in its place for the other 54. The other 33 rows are marked finalist and show a question mark for score and penalty. The prize column gives dollar amounts and the world and regional champion titles. First place is St. Petersburg National Research University of IT, Mechanics and Optics with 9 solved and penalty 1381. No per-problem results. The links to country, university and member pages lead to other pages of that site, which are not in our copy.
