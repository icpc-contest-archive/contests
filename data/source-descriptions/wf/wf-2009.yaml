  copy: wf/wf-2009/website/2026-09-05-wayback-b5b3fe36
  title: Welcome to ACM ICPC World finals in Stockholm 2009
  language:
  - en
  description: |-
    Website of the 2009 World Finals in Stockholm, made by the host, KTH Royal Institute of Technology, in English. Our copy holds 68 files, 40 of them pages. The pages welcome visitors to the 33rd ACM-ICPC Finals, sponsored by IBM, on 18-22 April; give a preliminary event schedule (registration and symposia from 18 April, the contest on Tuesday 21 April, the award ceremony that evening); describe three hotels and extending a stay; give travel and visa information; and have pages on Stockholm and KTH, a contact page, a call for volunteers and an ICPC Live page. The problem set is inside as a PDF of 22 pages with 11 problems A to K.

    Of the organisers' wiki only the main page is saved, a list of internal topics such as budget, venues, logo and ICPC Live production. The PDFs uploaded to it are in our copy: four campus floor plans, an ICPC Live system diagram, a process flow, a one-page graphic headed World Finals ICPC 2009 Stockholm, a file named Logo-sketches, a four-page hotel quotation in Swedish for 18-19 April 2009 and a one-page hotel's terms in English. The live scoreboard linked from the ICPC Live page is on another server and is not part of our copy.
