  description: |-
    Final scoreboard of the World Finals in Dhaka, a DOMjudge page headed "ICPC World Finals Dhaka final standings". It lists 132 teams with the institution, the number of problems solved and the total penalty time (the rank cell is blank for the last seven teams), and one column for each of the 12 problems A to L. Each problem cell gives the solve time in minutes and the number of tries, or only the tries for an unsolved problem. Eight teams carry a region label beside the name, such as North America or Asia East. Four teams are marked with each of the gold, silver and bronze medals. A summary row at the bottom gives per-problem totals, a legend explains the cell colours, and the page states that it was last updated on 10 November 2022 at 20:56 (+06).

    Massachusetts Institute of Technology is first with 11 problems solved. Institution logos and the style sheets are kept with our copy.
