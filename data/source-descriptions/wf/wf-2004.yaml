  title: 'ICPC Tour 2004: Prague, Czech Republic'
  language:
  - en
  contest_date: '2004-03-31'
  description: |-
    Pages of the ICPC website from icpc.baylor.edu, in English, that cover the 2004 World Finals in Prague and also the 2005 World Finals. Our copy holds 143 saved pages, four further files being empty application shells, and three JPEG files that are one picture in three sizes, named for the 2005 champions. Most pages are the photo galleries of the 2004 and 2005 events, each in ten sections (for 2004: the city of Prague, pre-contest social, opening ceremony, the contest, awards ceremony, celebration and others), many saved under several addresses; they hold photo captions and image counts and little other text.

    Four pages are articles. The 2004 history page says seventy-three teams, from 3,150 teams of 1,411 universities in 75 countries at 127 sites, competed in the 28th contest on March 31, 2004, at the Obecni Dum in Prague, hosted by Czech Technical University in Prague, and names St. Petersburg State University of IT, Mechanics, and Optics as World Champion. The 2004 results page lists the teams' universities by place in groups, the honorable mentions and the six regional champions, with no scores. The 2005 history and results pages do the same for the next contest; its results page gives rank, name, problems solved and time.

    The problem set PDF that the 2004 history page links to is not in our copy.
