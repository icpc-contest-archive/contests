    Final standings of the 2008 ACM Programming Contest World Finals: 97 teams with rank, team name, institution, number of problems solved, total time, medal, citation and site citation. Four teams carry a gold medal, four silver and four bronze. The citation column gives the place name (First Place, Thirteenth Place, Forty-seventh Place and so on), and 33 teams are listed as Honorable Mention. The site citation column names the world champion and the champions of five regions (North America, Asia, Latin America, Africa and the Middle East, South Pacific). First place is SPb IFMO 1 of St. Petersburg ITMO University with 8 solved in 1187. There is no per-problem detail.
