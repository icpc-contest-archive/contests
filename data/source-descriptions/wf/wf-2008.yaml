  title: Results World Finals 2008
  language:
  - en
  description: |-
    Pages of the ACM-ICPC website at icpc.baylor.edu, in English. Our copy holds 134 pages saved from the whole site, so most of it is not about 2008. The pages about this edition are a results page, a history page and a fact sheet. The results page lists 64 teams ranked 1 to 47 with solved count (time is shown for the first 12 only), then 36 teams under Honorable Mention, and the champion of each of six regions. The history page names the winning team and says that the 32nd World Finals were sponsored by IBM and hosted by the University of Alberta in Banff, on April 4-6, 2008. The fact sheet is a PDF of 5 pages dated 29 January 2008 that describes the contest and gives the Finals dates as April 6-10 at the Fairmont Banff Springs. One scoreboard address of the site holds an XML standings file from the CSUS Programming Contest System (PC2) timed 12:19 on 9 April 2008, with 97 teams and 11 problems; its leading team has 6 problems solved, fewer than the 8 shown on the results page.

    The rest is other material: results and history pages of the 2009 World Finals, pages on competing, the 2009 ICPC Challenge, and the menus common to all pages. 38 of the HTML pages are empty shells of a later script-driven version of the site that show no content, and two are redirects.
