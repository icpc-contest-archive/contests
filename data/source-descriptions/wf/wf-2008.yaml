    Problem set as a PDF of 22 pages, in English: 11 problems labelled A to K, each with its title, the name of its input file (ducts.in for A to steam.in for K), the statement, the input and output specification and one sample input with its output. The problems are A Air Conditioning Machinery, B Always an Integer, C Conveyor Belt, D The Hare and the Hounds, E Huffman Codes, F Glenbow Museum, G Net Loss, H Painter, I Password Suspects, J The Sky is the Limit, K Steam Roller.

    There is no cover page: page 1 opens directly with Problem A, and the text names no contest, host or date. No test data or solutions.
