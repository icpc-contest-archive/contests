  description: |-
    Final standings of the 2008 World Finals on the Competitive Programming Hall of Fame site. A header table gives the date April 9, 2008, the venue Fairmont Banff Springs Hotel in Banff, a duration of 300 minutes and 11 problems. The standings table has 100 rows with rank, country, team, score (problems solved), penalty and prize. Each team is shown as institution, team name and its three members. The prize column gives dollar amounts and the world and regional champion titles. 97 teams are ranked, down to a shared rank of 90 to 97 with no problems solved; the last three rows are marked qualified, with score 0 and no penalty or prize. First place is St. Petersburg National Research University of IT, Mechanics and Optics with 8 problems solved and penalty 1187. No per-problem results. The links to country, university and member pages lead to other pages of that site, which are not in our copy.
