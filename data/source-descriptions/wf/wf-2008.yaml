  description: |-
    Scoreboard page of an unofficial scoreboard script by zibada, which says it is experimental and not official. The data is in the page's script: 97 teams and 11 problems labelled A to K (Air Conditioning Machinery to Steam Roller). For each team and problem it gives whether it was solved, the number of attempts and the time, with the team's score and penalty. The state is the finished contest with 300 minutes played and no freeze, and a history list of 242 entries, each with a team, a problem, a time and two values, is included.

    The table is built by script when the page is opened. In the HTML text itself only the header, the refresh and history controls and a link to the official results are visible.
