    Problem set as handed out at the contest: a scan of 8 pages in English, with no text layer, with eight problems A to H: Air Traffic Control, Candlepin Bowling Scoring, Monkey Business, Multicomputer Processor Status, Pluviometrics, Pretty Printing, Tree Recovery and Window Manager. Each problem is headed "1988 ACM Scholastic Programming Contest"; two problems fill each odd page. Several statements have input and output specifications and a worked example. There is no cover page, date or place, and no test data or solutions.

