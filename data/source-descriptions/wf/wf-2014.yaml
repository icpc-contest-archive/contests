  description: |-
    Website of the 2014 ACM ICPC World Finals, hosted by Ural Federal University in Ekaterinburg, in English and Russian. Our copy holds 76 pages, in both languages. The main sections are about the contest (history, qualification rules and prizes, news), the competition (ICPC Zone, transportation, schedule, events for guests, teams, rules, video), information for participants (visas, hospitality, hotels, transfers), the city of Ekaterinburg, and the organisers.

    The schedule page runs from 21 to 26 June and gives Wednesday 25 June as World Finals day. The news items of 25 June report that the results table is frozen, the leaders at the middle of the contest and the winners: St. Petersburg State University took the cup, followed by Moscow State University, Peking University and National Taiwan University, with the gold, silver and bronze medal winners listed. The teams page lists the finalist teams by region with institution, team name, coach and contestants. A brochure and pocket guide are announced for download.
