  description: |-
    Final standings of the 2014 World Finals on the Competitive Programming Hall Of Fame site. A header box gives the date as June 25, 2014, the venue (Palace of Team Sports, Yekaterinburg, Russia), a duration of 300 minutes and 12 problems. The table has 121 rows with rank, country, team with its institution, team name and the three contestants, score, penalty and prize. Places 1 to 102 are ranked singly; 19 further teams share the rank 103 - 122. There are no per-problem results.

    The prize column holds cash amounts for places 1 to 12 and for places 79 and 81 (the first place, with the title World Champion, receives $13050), and marks the continental champions. St. Petersburg State University is first with 7 problems and 1359 penalty, then Moscow State University and Peking University.
