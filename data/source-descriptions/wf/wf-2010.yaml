  title: Results World Finals 2010
  language:
  - en
  contest_date: '2010-02-05'
  description: |-
    Website of the ACM International Collegiate Programming Contest (icpc.baylor.edu), in English. Our copy holds 150 saved files, of which 38 are empty application shells. The 2010 pages are a results page, a history page and a fact sheet. The results page lists 61 ranked teams with place, name, solved, time and last problem, then 42 institutions under Honorable Mention, then the champion of each of six regions. The history page reports the 34th World Finals of 5 February 2010, sponsored by IBM and hosted by Harbin Engineering University, with Shanghai Jiaotong University as World Champion. The fact sheet is a PDF of 6 pages dated 7 January 2010. A page on the 2010 ICPC Challenge describes the game IcyPC and names the top four of its tournament.

    The copy is not limited to 2010. It also holds the results, history and fact sheet pages of the 2011 World Finals, several pages of the 2011 ICPC Challenge, front pages of the site from several years, and the Compete and Community menu pages. The scoreboard page in it carries standings data of the 2008 World Finals, not of 2010. Several saved addresses of the form ?page=... show the front page instead of the page they name.
