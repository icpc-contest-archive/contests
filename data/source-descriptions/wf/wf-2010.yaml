    Final standings of the 2010 ICPC World Finals on the Competitive Programming Hall Of Fame site: 103 teams, each with rank, country, team name with its institution and the three members, problems solved (Score), penalty time and prize. A header block gives the date (5 February 2010), the venue (Harbin Engineering University, Harbin, China), a duration of 300 minutes and 11 problems. Shanghai Jiao Tong University is first with 7 problems and penalty 778, Moscow State University second with 7 and 940. The last nine teams share the range 95 - 103 with no problem solved. The prize column shows amounts in dollars and titles such as World Champion and regional champions. There is no per-problem detail.
