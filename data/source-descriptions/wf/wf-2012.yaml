  description: |-
    News page of ICPC about the 2012 World Finals, in English, headed "The 2012 World Champions". It states that the top one hundred and twelve teams, from over 8,000 teams selected from 2,219 universities in 85 countries, competed at the 36th Annual ACM International Collegiate Programming Contest World Finals, sponsored by IBM, on May 17, 2012, in Warsaw, Poland, hosted by University of Warsaw. It names the winning team, St. Petersburg State University of IT, Mechanics and Optics, with its three contestants and its coach.

    The page has six links, labelled standings, photo, problems, video, contest data and live. They lead to other addresses and are not part of our copy, which is this single page.
