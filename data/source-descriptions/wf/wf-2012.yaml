    Scoreboard of the 2012 World Finals on a page of the ACM/ICPC信息站 site (ACM/ICPC xìnxī zhàn, "ACM/ICPC information station"), in Chinese, headed ICPC 2012 世界总决赛 排行榜 (shìjiè zǒngjuésài páihángbǎng, "World Finals ranklist"). It lists 112 teams with country code, rank, team name, Slv. and Time, and one column for each of the twelve problems A to L. A problem cell shows attempts and a time separated by a slash, or only a number of attempts when the problem was not solved; each problem header carries two numbers (A 2/51, B 110/202, and so on). The page gives "Start: 2012/5/17 16:00" and has a legend for first to solve, solved, attempted and pending judgement. St. Petersburg State University of IT, Mechanics and Optics is first with 9 solved and Time 1170. Team names are in English, except that 19 Chinese teams are named in Chinese.

