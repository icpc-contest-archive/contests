    Standings page of the Competitive Programming Hall of Fame (cphof.org), titled "Standings for ACM-ICPC 2012 World Finals". A box gives date May 17, 2012, venue University of Warsaw in Warsaw, a duration of 300 minutes, 12 problems, and a link to the official results page. The table has 112 ranked teams with rank, country, institution with team name and the names of its members, score (problems solved), penalty and prize. Prize holds titles such as World Champion and continental champion and, for some teams, a prize amount in dollars. No per-problem results. First place is St. Petersburg National Research University of IT, Mechanics and Optics with 9 solved and 1170.

