  description: |-
    Single news page on the ICPC News site, headed "World Finals 2012" ("The 2012 World Champions"). It states that the top 112 teams, chosen from over 8,000 teams from 2,219 universities in 85 countries, competed at the 36th Annual ACM International Collegiate Programming Contest World Finals, sponsored by IBM, on May 17, 2012, in Warsaw, Poland, hosted by the University of Warsaw, and names St. Petersburg State University of IT, Mechanics and Optics as champion.

    The page holds six links: standings, photo gallery, problems, video playlist, contest data and the live stream. All lead to other addresses and are not part of our copy, which is this one page.
