    Standings of the 2012 World Finals on the Competitive Programming Hall Of Fame site: 112 teams with rank, country, team, score, penalty and a prize column. The team cell gives the institution, the team name in parentheses and the names of the team's members. Seventeen rows carry prize money amounts, and six rows carry champion labels (World, Europe, Asia, North America, South Pacific, Latin America, and Africa and the Middle East). The header block gives the date, May 17, 2012, the venue, University of Warsaw in Warsaw, Poland, a duration of 300 minutes, a scoring line of 12 problems and a link to an official page. St. Petersburg National Research University of IT, Mechanics and Optics is first with score 9 and penalty 1170. No per-problem results.

    The page also has the site's navigation and links to country, university and profile pages of the site, which are not part of our copy.
