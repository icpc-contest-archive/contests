  description: |-
    Final standings of the 36th Annual World Finals: 112 teams with rank, team name, institution, solved, time, medal, citation and site citation. Twelve teams have medals, four gold, four silver and four bronze, at ranks 1 to 12. The citation column reads First Place to Twelfth Place for ranks 1 to 12, then Thirteenth Place (rank 13), Eighteenth Place (rank 18) and Thirty-sixth Place (rank 36), each shared by several teams, and Honorable Mention for 49 teams at ranks 64, 80 and 101. Six teams carry a regional champion note in the site citation column (Europe, Asia, North America, Latin America, South Pacific, Africa and the Middle East). The first place is SPbSU ITMO 1, St. Petersburg ITMO University, with 9 solved and time 1170. No per-problem results.
