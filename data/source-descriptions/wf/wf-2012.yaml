    Final standings page of the 36th Annual World Finals, with links at the top to two mirrors (Baylor University and Scrool). It is a scoreboard of 112 teams: rank, team name, Slv., Time, and for each of the twelve problems A to L the number of tries with a time in small type; a problem that was tried and not solved shows the tries and "--". Each team row also has a country flag and a school logo next to the team name, and six teams are marked as super region leaders. Below the table are three rows of per-problem totals: Monkey Stats (two counts and a percentage), Average tries and Average tries to solve. A legend marks super region leader, first to solve, solved, attempted and pending judgement.

    Our copy holds the page and its header image, but only 18 of the 37 flag images and 43 of the 112 school logo images.
