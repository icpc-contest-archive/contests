    Problem set as a scan of 5 pages, in English, with four problems numbered 1 to 4: Large Integers, Virtual Brick Walls, Security Codes and Knight's Tour Simulation. Each statement is typed, with a number and title above it, and describes the task, its input (data on cards) and the output required. Large Integers, Virtual Brick Walls and Knight's Tour Simulation give a sample or example with its output; Security Codes gives a worked example of a check character in its text. Virtual Brick Walls runs over two pages. No contest name, date or place is legible in the scan, and there is no test data or solutions.

    The pages are images with no text layer, and the print is poor in places.
