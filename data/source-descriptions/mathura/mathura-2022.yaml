  description: |-
    Team list of the preliminary online contest on the site of the ICPC Mathura-Kanpur Site: the teams selected for the on-site round, headed tentative and, the page says, sorted alphabetically by institute. 151 teams are listed with team name, institute name and the city of the on-site round, 101 in Mathura and 50 in Kanpur. A second table gives a waiting list of 15 teams with team name, institute and, for the first eight, the allotted city; the page says waiting-list teams are to be notified by 29 March 2023. The page gives no scores, ranks or problem counts of the preliminary contest. It links to the rules of the preliminary contest.
