  title: Important Dates – ICPC Mathura-Kanpur Site
  language:
  - en
  contest_date: '2023-04-08'
  description: |-
    Website of the ICPC Mathura-Kanpur Site, in English, jointly hosted by GLA University, Mathura and CSJM University, Kanpur, for the contest held on 8 and 9 April 2023. The home page describes the contest and the two-tier format and names the winner of the Mathura-Kanpur Regional Contest 2022. The Important Dates page gives registration from 26 February 2023, a preliminary online contest on 18 March 2023, and the on-site contest on 8 and 9 April 2023. Further pages cover registration (team formation rules, fees, how to register), people (honorary chairs, patron, steering committee, regional contest director and associate directors, with their institutions) and contact details. Two pages give results: the on-site round results and the preliminary online contest result, a list of selected and waiting-list teams.

    The pages link to the problem set, travel directions to both universities, the program schedules of both centres and the preliminary contest rules as PDF files on another address. Our copy holds seven distinct pages, reachable under 13 addresses because six of them are available in two address forms.
