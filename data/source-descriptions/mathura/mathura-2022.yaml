  description: |-
    Standings of The 2022 ICPC Asia Mathura Kanpur Regional Contest: 144 teams, each with rank, team name, institution, problems solved, time and a citation. The citations are ordinal places from First Place to Seventy-first Place for ranks 1 to 71, then Honorable Mention for the 73 teams from rank 72 to 144. First place is AuditPass of the Indian Institute of Technology, Delhi with nine problems, second is facelessmen3.0 of the Indian Institute of Technology, Kanpur with nine. No per-problem detail. The page lists 144 teams, two fewer than the on-site results page of the contest website.
