  description: |-
    Problem set of the ICPC Mathura-Kanpur Programming Contest of 9 April 2023: a PDF of 20 pages in English. The cover is dated 09th April, 2023 and the next page gives the instructions: eleven problems in five hours, submission through the CodeDrills platform, ranking by problems solved and then total time with 20 penalty minutes per rejected run, and 25 pages of printed material allowed. Problems A to K follow, from Binary Digit Escaping to Gotta Catch 'Em All. Each has a statement with input and output specification, and a sample input and its output. No test data or solutions.
