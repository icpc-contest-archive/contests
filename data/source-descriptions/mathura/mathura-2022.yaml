  description: |-
    Results of the on-site round on the website of the ICPC Mathura-Kanpur Site, as standings: 146 teams in one table. The first 15 rows are the ranked teams, with rank, problems solved, penalty, team name, institute name and cash prize in rupees; places 1 and 2 solved nine problems and places 3 to 15 solved seven. A row headed Honorable Mention Teams starts the other 131 teams, listed without a rank or prize, roughly in alphabetical order of institute, with problems solved, penalty, team name and institute. First place is AuditPass of the Indian Institute of Technology, Delhi. There is no per-problem detail. The menu of the site is part of the page.
