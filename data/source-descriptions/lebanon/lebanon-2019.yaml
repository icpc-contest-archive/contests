  description: |-
    News item on the Beirut Arab University website, dated 04 October 2019, reporting that the Faculty of Science at the Debbieh campus hosted the Lebanese Collegiate Programming Competition (LCPC) on October 4, 2019, under the patronage of the Minister of Telecommunications. It describes the contest as the first of three annual stages, followed by the Arab and Africa regional ACPC and then the ICPC, and as organised since 2009. It states that thirty-seven teams from eleven Lebanese universities competed for two days, that LAU and AUB teams placed first and second and BAU sixth (third among Lebanese universities), and that two BAU computer science teams qualified for the ACPC, which took place at the end of November in Sharm El-Sheikh, Egypt. The rest of the article reports the opening ceremony and the speeches by university and ministry officials and sponsors.

    Our copy is the single news page with the university's site menus around it; it has no results table or problem list.
