  description: |-
    Official Results page of the LCPC 2011 site: the first three places, American University of Beirut (Laban), American University of Science & Technology (AUST-Stallions) and Lebanese American University (LAU-Backtrackers), each with its team members and coach. It then lists four special awards with their winning teams: Extreme Programmers (first successful run), Steadfast Gurus (last successful run), Solid Programmers (most problems solved without penalties, shared by two teams) and Relentless Programmers (a problem solved after the most wrong submissions). It does not list the other teams. A link to the final scoreboard leads to the summary page.
