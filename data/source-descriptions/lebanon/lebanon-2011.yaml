  description: |-
    Website of the Third Lebanese Collegiate Programming Contest, LCPC 2011, organised by the Computer Science Department of the American University of Science & Technology (AUST) on 1 and 2 July 2011 at its Beirut campus, in English. Our copy holds 10 pages: the home page with participation and eligibility rules, the organising committee and sponsors, registration, important dates, the program of the two days, the participants page listing 15 teams, the official results page, a scoreboard page that only links to a live scoreboard, a summary scoreboard, and an archive page.

    The archive page links the first and second LCPC editions held at LAU and a zip file with the problem set, solutions and final ranking; the zip file and the live scoreboard are not in our copy.
