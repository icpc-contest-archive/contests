  description: |-
    Scoreboard of the 2022 ICPC Lebanese Collegiate Programming Contest, produced by PC^2 (version 9.8): 34 team rows with rank, team name with affiliation in brackets, problems solved and penalty time, followed by fourteen problem columns A to N. Each problem cell gives the number of attempts and, when solved, the minute of the accepted run (a dash otherwise); colour keys mark first solves, solved problems, attempted problems and problems pending judgement, and each problem column is headed by a colour name. A last column gives total attempts and solved count per team, and a bottom row gives submissions, first-solve minute and total solves per problem. Thirty teams solved at least one problem; the four with none share rank 31.

    The board is stamped as last updated on 8 October 2022 at 15:56 and 58 problem cells carry the pending-judgement colour, so it may not be the final state. First place is AIM (AU Beirut).
