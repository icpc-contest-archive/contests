  description: |-
    Event page of the Syndicate of Computer Science in Lebanon announcing the 14th Lebanese Collegiate Programming Contest (LCPC-2022), organised with the LCPC steering committee and hosted by the Department of Computer Science of the American University of Beirut on 7 and 8 October 2022. The text gives the programme: registration and opening ceremony on Friday 7 October with a keynote talk, a technical session on the rules and a practice session, then the contest on Saturday 8 October with a lunch buffet and an award ceremony. It describes LCPC as the national qualifier for the Arab and African regional ICPC contest.

    Our copy holds this single page (the site menu is in Arabic, the event text in English). It has no results, team list or problems.
