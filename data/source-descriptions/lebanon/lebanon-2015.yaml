  language:
  - en
  contest_date: '2015-09-19'
  description: |-
    Website of the 7th Lebanese Collegiate Programming Contest (LCPC 2015), published by the Arab Open University (AOU), in English. The home page says the contest is organised by AOU's department of Information Technology and Computing on 18 and 19 September 2015 and is supervised by ACM-ICPC, and announces the results and award ceremony of 19 September at a hotel in Hamra. Other pages cover the contest (the Badaro venue and online team registration with a deadline), the organising, IT and steering committees, the rules (eligibility, C, C++ and Java, a five-hour contest), the two-day program, the list of 22 participating teams with institution, coach and contestants, and the results table.

    Our copy holds 7 pages. The News page linked from the menus is not in it (the capture returned an error for it), and the images, style sheets and scripts were not kept, so the sponsor logos on the home page are missing.
