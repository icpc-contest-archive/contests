  description: |-
    Website of the 7th Lebanese Collegiate Programming Contest (LCPC 2015), hosted by the Arab Open University (AOU) on 18 and 19 September 2015, in English. The home page announces the results and award ceremony at the Golden Tulip Hamra on 19 September at 8 PM and carries sections on the contest, the organizing committee and sponsors.

    Our copy holds seven pages: home, about, committees, a participants page listing 22 teams with institution, coach and three contestants each, the contest rules (in line with the ACPC and ICPC regional rules), the program (registration, opening ceremony, technical session and practice on Friday, the contest from 8:00 AM to 2:00 PM on Saturday), and a results page with the final table of 22 teams. No problem statements are on the site. Style sheets and images are not in our copy.
