  contest_date: '2014-09-27'
  description: |-
    Website of the 6th Lebanese Collegiate Programming Contest (LCPC 2014), published by the Computer Science department of the American University of Beirut, in English. The home page announces the contest for 26 and 27 September 2014 at the American University of Beirut and says it is supervised by ACM-ICPC. Other pages cover the organizing and steering committees, registration (a closed form with team, coach and student fields), important dates, the contest rules (eligibility, C, C++ and Java, a five-hour contest from 9:00 to 14:00), the two-day program, an Archive page that reads "Coming Soon", the list of 21 participating teams, and the official results table.

    Our copy holds 9 distinct pages of the site (the home page is saved under two addresses), with its images, style sheet and scripts. Problem statements are not on the site.
