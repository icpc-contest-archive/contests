    Official results scoreboard from the LCPC 2014 website: 21 teams ranked by problems solved and time, with columns for solved, time and ten problems A to J. Each problem cell gives attempts and solve time (for example 1/247), the problem columns are also labelled with colour names (Blue for A, Yellow for B, and so on to Rose for J), and a last column gives total attempts and solved. A closing row totals submissions, first solve time and number of solves per problem. First place is Tribonacci from the American University of Beirut with 7 problems solved. Team names are followed by an abbreviation of the institution in parentheses (empty for one team).
