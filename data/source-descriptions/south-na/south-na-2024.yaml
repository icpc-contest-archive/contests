  contest_date: '2024-11-16'
  description: |-
    Front page of the South Central North America regional website, headed "South Central NA Regional Contest 2024 – 2025 Regional Programming Contest" and announcing the contest for Saturday, November 16, 2024, for teams from Louisiana, Oklahoma and Texas. Registration deadline, site locations, environment and fees are still marked TBD and the Register button reads "Coming Soon". It also carries the team registration instructions and the site menu (NA Home, SCUSA Home, useful information, divisions, Big South, FAQ, Staff and Supporters).

    Most of the page is left over from the previous contest, the Big South regional of February 24, 2024, which South Central, Southeast and Mid-Atlantic ran together with a Division I and a Division II problem set on Kattis. It names the four sites of that contest, lists four teams moving on to NAC, links Kattis standings, problem sets and judges' slides, and keeps that contest's calendar, Zoom timeline and fee text. Further down it carries a call for sites for the contest of November 16 and the duties of a site director.

    Our copy holds this one page. The menu items and the links to Kattis and other sites lead to pages that are not part of it.
