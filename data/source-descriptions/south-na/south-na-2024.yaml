  description: |-
    Standings of the Mid-Atlantic USA regional, titled "The 2024 ICPC Mid-Atlantic USA Regional Contest": 127 teams listed with rank, team, institution, problems solved, time, medal, citation and site citation. Ranks run from 2 to 128 and the row for rank 1 is not in our copy. The best listed team solved 13 problems; the last row, with 0 solved, is marked Honorable Mention.

    Division 1 and Division 2 teams are in the same table. The medal column is filled for seven teams: two Division 1 medals, three Division 2 medals and two site medals. 60 teams carry "Division 2" in the citation column, and the site citation column holds site medals and state champion marks. There is no per-problem detail and no count of attempts. One team name is shown as a single replacement character in our copy.
