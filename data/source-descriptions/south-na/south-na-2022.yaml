  description: |-
    Standings of Division 1 on Kattis (ICPC NAS 2022 - Division 1), shown after the contest ended: 152 teams and 13 problems labelled A to M. Each team has a rank, solved count and total time, and for every problem the number of attempts and, when solved, the minute of the accepted run; unsolved problems with attempts show a dash. The page states that the contest ran from 12:00 to 17:00 CST on 2023-02-25 and is over. Georgia Tech Pandas are first with 12 problems solved in 1669 minutes. Nine teams are listed at the bottom with no solved problem, sharing rank 144.

    The page has a menu to filter the standings by conference: the Mid-Atlantic USA, South Central USA and Southeast USA regions, each with its sites, and a legend for first-to-solve, solved, attempted and pending cells. Our copy holds the view of all teams.
- url: https://icpc.global/regionals/finder/Mid-Atlantic-USA-2023/standings
