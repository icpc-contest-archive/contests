  title: The 2022 ICPC Mid-Atlantic USA Regional Contest
  language:
  - en
  teams: 125
  description: |-
    Standings of the 2022 ICPC Mid-Atlantic USA Regional Contest: 125 teams with rank, team, institution, problems solved and time, of which 78 teams are marked Division 1 and 45 Division 2. Further columns give a medal, a citation (First Place, Second Place and so on, and Honorable Mention for 41 teams) and a site citation naming the division and the host site, such as Division 1, Johns Hopkins site, or Division 2, Virginia Tech site; two teams have no site citation. Three teams without a rank carry Honorable Mention in the medal column. The first three are UMD RED, UMD WHITE and UMD YELLOW from the University of Maryland; the best result is 10 problems solved. Eleven teams, all with 0 solved, have an empty rank column. No per-problem results or attempts are given.

    This is the Mid-Atlantic part of the contest only: the teams of the other regions that shared the problem set are not on it.
