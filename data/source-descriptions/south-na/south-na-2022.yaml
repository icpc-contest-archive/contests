  copy: south-na/south-na-2022/website/2026-09-05-wayback-e95ff144
  title: 2022 ICPC South Central USA Regional Contest - Southern Conference
  language:
  - en
  contest_date: '2023-02-25'
  description: |-
    Website of the 2022 ICPC South Central USA Regional Contest (Southern Conference), in English, held on Saturday 25 February 2023. The front page carries a contest report (five sites, 42 teams, two divisions, a coaches' roundtable) and two scoreboards with position, team name, university, number solved, time and the letters of the problems solved: Division II with 5 teams and Division I with 36 teams. It links to recordings of the two resolvers, to the Kattis scoreboards of both divisions, to the problem sets and to the judges' notes of both divisions.

    The rest of the page holds practical information: registration, a description of the Southern Conference (the South Central, South East and Mid Atlantic regionals sharing one problem set and a merged scoreboard), a description of the two divisions, the practice contest, a FAQ, the contest day timeline, a calendar of dates and three mailed announcements.

    Our copy holds five pages: the front page and four PDFs, the Division I and Division II problem sets and the Division I and Division II judges' notes. The resolver recordings (mp4 files) and the Kattis scoreboards are not part of it. The report gives 42 teams while the two scoreboards on the page list 41.
