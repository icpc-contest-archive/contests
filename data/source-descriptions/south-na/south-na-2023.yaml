  description: |-
    Standings of the 2023 ICPC Mid-Atlantic USA Regional Contest: 123 teams with rank, team, institution, problems solved and time, a medal, a citation and a site citation. The 67 Division 1 teams come first, ranked 1 to 67, then 46 Division 2 teams ranked from 68, then 10 teams with the citation Honorable Mention, all sharing rank 114. The medal column names Gold, Silver and Bronze Medal for the first three of Division 1 and Division 2 Gold, Silver and Bronze Medal for the first three of Division 2; the site citation, filled for 38 teams, holds awards such as state champion and site medals. UMD WHITE of the University of Maryland are first with 11 problems solved in 1143 minutes. No per-problem results or attempts are given.

    This is the Mid-Atlantic part of the contest only: the teams of the other regions that shared the problem set are not on it.
