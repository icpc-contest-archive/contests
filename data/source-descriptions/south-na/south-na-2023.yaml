    Standings of Division 1 on Kattis (ICPC NA Big South 2023 - Division 1), shown after the contest ended: 138 teams and 13 problems labelled A to M. Each team has a rank, solved count and total time, and for every problem the number of attempts and, when solved, the minute of the accepted run; unsolved problems with attempts show a dash. The page states the contest start as 2024-02-24 20:00 CET and the end as 01:06 CET (5 hours 6 minutes), and that it is over. UMD WHITE are first with 11 problems solved in 1143 minutes. Teams with no solved problem are listed at the bottom, five teams sharing rank 134.

    The page has a menu to filter the standings by conference: the Mid-Atlantic USA, South Central USA and Southeast USA regions, each with its sites, and a legend for first-to-solve, solved, attempted and pending cells. Our copy holds the view of all teams.
