  contest_date: '2024-02-24'
  description: |-
    Website of the Mid-Atlantic Regional ACM Programming Contest, in English, on a Radford University server. The front page announces the 2023-24 contest for Saturday 24 February 2024 at seven sites (Christopher Newport University, James Madison University, Johns Hopkins, UNC Chapel Hill, Virginia Tech, Washington College tentatively, Wilkes University), in Division 1 and Division 2, sharing problem sets and contest time with the South and Southeast regions. It also gives dated updates, general information on the contest and its rules, contacts, and the schedule of a contest day. A problem-set page lists the problems and scoreboards of the 2023 contest (held February 2024) and of earlier years as links to Kattis.

    The site also holds other editions. The front page reports the 2022-23 regional of 25 February 2023, with its five advancing teams. A 2021-22 information page, a registration page in two versions (for the 2022 contest, held February 2023, and for the 2024 contest of 16 November 2024), a map page of the sites and a Johns Hopkins page for the contest of 2024-Nov-16 are in our copy as well. The pages were captured at different dates.

    Our copy holds 150 files, of which 76 are pages. Only seven pages belong to the contest site itself; the other pages are 50 pages of C++ and Java reference documentation and two text files kept under the site, the front pages of 15 other Radford University sites, and two course PDFs. The Kattis scoreboards and problem links lead outside our copy.
