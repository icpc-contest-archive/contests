  title: The 2023 ICPC Asia Seoul Regional Contest — standings
  language:
  - en
  teams: 74
  description: |-
    Final standings of the 2023 ICPC Asia Seoul Regional Contest: 74 teams with rank, team name, institution, problems solved, total time and a citation. Places 1 to 37 carry a named place from First Place to Thirty-seventh Place; the remaining 37 teams are listed as Honorable Mention, and the last two, with no problem solved, share rank 73. First place is Penguins of KAIST with 10 problems solved. No per-problem results.
