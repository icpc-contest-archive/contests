    Notice on the ICPC Korea site dated 25 November 2023, in English, headed 'Problemset, Standings' with a last-update stamp of 27 November 10:50. It gives four links, to the problem set PDF, the scoreboard, the mirror contest on a DOMjudge server and the mirror results, and a note that the main contest runs 10:00 to 15:00 and the mirror contest 10:30 to 15:30.

    The page holds no problems and no results itself; the linked documents are not part of our copy.
