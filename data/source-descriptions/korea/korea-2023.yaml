  description: |-
    Page of the ICPC Korea Regional Site for the 2023 Seoul Regional, with menu and headings in English and announcement titles in Korean and English. It gives the schedule of the Seoul onsite contest as Friday 24 to Saturday 25 November 2023, followed by a list headed announcements (gongji sahang) with 26 dated entries from 2 September 2023 to 2 January 2024.

    The entries cover the schedule, the internet preliminary round and its results, the list of finalist teams, registration including foreign teams, the mirror contest, a post with the problem set and standings, test data, award winners, and a notice about teams advancing to the 2024 ICPC Asia Pacific Championship. Only titles are shown. Our copy holds this one page; the announcements and linked documents are not part of it.
