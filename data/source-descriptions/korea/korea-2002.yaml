  contest_date: '2002-11-02'
  problems: 8
  description: |-
    Website of the 2002 ACM ICPC Asia Regional - Taejon contest, in English; the on-line preliminary contest introduction, rules and most of its statements are in Korean. The menu leads to the contest rules, the schedule (registration and practice on Friday 1 November, the contest on Saturday 2 November 2002, awards ceremony and banquet), the computer environment, hotel accommodations, the problem set, the final standing and photos. The final standing page lists 27 ranked teams with solved count and penalty and 33 honorable mention teams.

    Problem material: PDF statements for contest problems A to H (Nearest Common Ancestors, Multiply and so on, as in the file names ancestor, multiply, liar, gift, twomount, digion, kleague, lazy) and two practice problems, plus seven PDFs for the on-line preliminary contest (two practice and five contest problems). The on-line contest has its own pages: rules, a final standing with 74 teams and a list of the 57 teams that qualified.

    Our copy holds 76 pages: 41 of the 2002 site and 35 from other parts of the same host, namely the 2003 ACM ICPC Asia Regional - Seoul site (rules, schedule, problems, final standing, on-line contest) and four pages of the 2001 site. The pictures on the photo pages and the zip of all problems are not in our copy. The front page shows a PHP warning about a file the server could not open.
