  description: |-
    Final standings with 29 ranked teams, each with rank, school, team name, number solved and penalty. Only six teams have a result: the first place has 7 solved with penalty 646 (Seoul N.U., team Mokdong), the others 6, 5, 5, 4 and 3 solved; the other 23 ranked teams, ranks 6 to 11, show a dash instead of a result. A box lists one team as Best Women's Team, and a second table lists 25 teams, in order of school name, as Honorable mention, also with dashes. In all 54 teams. No per-problem detail and no attempt counts.
