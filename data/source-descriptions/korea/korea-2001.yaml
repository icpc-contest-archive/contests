  title: 'Regional Contest Information: The 2001 ACM Asia Programming Contest - Taejon sponsored by IBM'
  language:
  - en
  problems: 8
  description: |-
    Contest page of The 2001 ACM Asia Programming Contest - Taejon, sponsored by IBM and hosted by the Korea Advanced Institute of Science and Technology, as it stood in the ICPC past-regionals section. The front page gives the contest dates, 3 - 4 November 2001, a short note on the World Finals in Honolulu, and links to the team roster, the standings and the problems.

    Our copy holds 30 files, 13 of them pages: the front page, a problem set page, and 11 problem PDFs (three practice problems and contest problems A to H, each of one or two pages). The problem set page also links the judge input and output files for A to H and a zip of all contest problems; the 16 input and output files and the zip are in our copy. The pages that the roster and standings links point to are not in our copy.
