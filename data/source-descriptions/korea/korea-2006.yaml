    Category page of the Baekjoon Online Judge, in Korean, for Asia Regional - Seoul 2006. A table lists ten problems labelled A to J, each with a judge problem number, a title, and counts of accepted and total submissions with an acceptance rate. Only A (digital clock) and B (DNA) have titles and links; C to J are marked as deleted, with no title and zero submissions. The page does not hold statements.
