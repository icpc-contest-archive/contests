  title: The 2006 ACM Asia Programming Contest - Seoul sponsored by IBM
  language:
  - en
  contest_date: '2006-11-03'
  teams: 63
  description: |-
    Standings page of the 2006 ACM Asia Programming Contest - Seoul, in three tables. The Final Round, the on-site regional contest of 11/3/2006, lists 63 teams as institution and team name with a citation, and for the ranked teams the number solved and penalty time; the first 35 are ranked (First Place to Twenty-fifth Place, with ties) and the other 28 are listed unranked as Honorable Mention. Seoul National University's team is first with 8 solved. There is no per-problem detail.

    The page also gives the Preliminary Site table of the Nationwide Internet Contest of 9/23/2006, with 201 teams in the same layout, and a short table of six Asia-Foreign Team teams from the Seoul registration site of 11/3/2006, all Honorable Mention.
