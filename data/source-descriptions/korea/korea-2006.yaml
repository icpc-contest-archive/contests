  description: |-
    Page of the ICPC Korea regional site for the 2006 Seoul Regional. The page body is short: the date given as 2006. 11. 01 – 02, a link to the problem set (a zip file) and a link to the standings, which leads to another server. A side column links to the ICPC World Site, the ICPC Asia blog and ICPC Asia Pacific, and the site menu links to the current regional rules and to the site's contest archive.

    Our copy holds this one page. The sponsor logos and menu items belong to the current version of the site, not to 2006.
