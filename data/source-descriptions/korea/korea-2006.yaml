  description: |-
    Forum post on the ACM ICPC Seoul site, posted 2006/11/7 under the heading 2006 ACM Asia Programming Contest - Seoul Regional Result. A table gives rank, school name, team name, number solved and penalty for 35 ranked teams, ranks 1 to 25 with ties; Seoul National University's team is first with 8 solved. Below it the 28 Honorable Mention teams are listed by school and team name only, 63 teams in all. No per-problem detail.

    The post has two replies, one pointing out that the school and team columns were swapped and one saying it was fixed. Our copy also holds the forum's page frame and its images.
