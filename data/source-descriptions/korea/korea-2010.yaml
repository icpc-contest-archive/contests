  - ko
  description: |-
    Pages from the ACM-ICPC Korea site at KAIST, in English and Korean. The first page is a redirect notice titled ACM-ICPC Korea Site: Daejeon Regional that points to a newer site. Behind it are an older phpBB forum (87 pages), a later phpBB board and portal headed ACM ICPC Asia Regional - Daejeon (10 pages; one of them is headed Asia Regional - Seoul), and static pages of the contests of 2000 to 2005 and 2007 with rules, team lists, standings and 18 problem PDFs of 2004.

    For the 2010 Daejeon Regional the board and portal list two announcements by title: a schedule topic posted on 2010-08-23 and a registration notice with the post date 2010-10-08, which later pages title as a 2011 notice. The board's menu names pages for the 2010 contest, its problems and its final standings. The texts of those announcements and those pages are not in our copy, and neither are results or problems of the 2010 contest. Our copy holds 147 pages, nine of them empty; the rest concerns other editions, including a 2011 schedule announcement.
