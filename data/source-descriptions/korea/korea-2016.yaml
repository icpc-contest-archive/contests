  description: |-
    Category page of the Baekjoon Online Judge titled Asia Regional - Daejeon 2016, in Korean, filed under the source ACM-ICPC Regionals, Asia, Korea. A table lists the twelve problems, labelled A to L, with their judge problem numbers 13559 to 13570, the title (in Korean for three problems and in the original English for nine), and columns for information marks, accepted count, submissions and acceptance ratio. Seven problems (A, D, E, F, H, J, L) are marked as still being prepared for grading and show no submissions; problem K carries a special judge mark.

    The page lists the problems only; their statements are on other pages that are not in our copy.
