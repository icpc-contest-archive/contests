  contest_date: '2016-11-05'
  description: |-
    Website of the 2016 Daejeon Regional on the ICPC Korea regional site, in English with some Korean. Our copy holds six distinct pages: the front page, announcements, teams, contest environment, venue and accommodation, and schedule.

    The front page gives the dates of the online preliminary (1 October 2016) and of the on-site contest (4 to 5 November 2016) and has a results block with links to the problems, a scoreboard, standings, a ceremony video and photos; it holds no results table itself. The teams page lists 85 teams by university and team name. The schedule page puts registration, the opening ceremony and a practice session on Friday 4 November and the contest on Saturday 5 November from 10:00 to 15:00 at the Munji Campus of KAIST in Daejeon. The other pages cover what a team may bring, the online documentation and the contest computers' operating system, editors and compiler options, and travel and hotels. The announcement page is a list of dated headlines, mostly in Korean, including the announcement of the teams advancing to the contest.

    The linked scoreboard, problem set, standings, video, photos and the foreign team registration page are not among these pages.
