  description: |-
    Problem set of the Asia Regional in Daejeon, an English PDF of 26 pages. The cover reads The 41st Annual ACM International Collegiate Programming Contest, ASIA Regional - Daejeon, Problem Set, and lists twelve problems A to L with their page counts: Bridge Park, Football, House Rental, Independent Edges, Memory Cell, Meteorites, Percolation, Power Supply, Robot, Room, Rounding and Virus. It asks the team to check that it has 12 problems and 25 sheets besides the cover, and states that the memory limit is 512MB for all twelve problems.

    Each problem has a time limit (1 or 2 seconds), a statement, input and output format, and between two and five numbered sample inputs with their outputs. There is no test data and there are no solutions.
