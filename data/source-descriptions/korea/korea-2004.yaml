    Zip file of nine PDF statements, problems A to I, 13 pages in all (two pages each for C, F, G and I, one page for each of the others). Each statement is in English and starts with a header naming the 29th Annual ACM International Collegiate Programming Contest ASIA Regional - Seoul, the problem letter and title (A is Circular Sequence, C Circle Dance, D Secret Sharing, G Fair Share, H Weak Key, I Depth Order), then the input file name, the task, input and output formats and a sample input with its output. No test data or solutions.
