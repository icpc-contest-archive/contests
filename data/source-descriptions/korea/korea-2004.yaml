  contest_date: '2004-11-11'
  description: |-
    Standings page of the ICPC site headed 'The 2004 ACM Asia Programming Contest - Seoul sponsored by IBM', with three tables. The Final Round (Asia - Seoul, 11/11/2004) has 58 teams: 35 with place, citation (First Place to Twenty-fourth Place), solved and penalty, and 23 as Honorable Mention without results. Seoul National University's team is first with 6 solved and a penalty of 689.

    The Preliminary Site table for the Korea Nationwide Internet Competition has 97 teams: 96 ranked with solved and penalty and one Honorable Mention. A third table, Preliminary Site Asia - Seoul - Foreign Teams (11/11/2004), lists four teams as Honorable Mention. Teams are written as university=>team name. No per-problem detail.
