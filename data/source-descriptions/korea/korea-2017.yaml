  contest_date: '2017-11-11'
  description: |-
    Website of the ICPC Korea regional site for the 2017 Daejeon regional contest, in English with Korean announcement titles. The front page lists the contest as an onsite event on 10 and 11 November 2017 and has menus for announcements, foreign-team registration, teams, contest environment, venue and accommodation, and schedule, plus a results block (problems, final scoreboard, test data, photos of the practice session and the main contest) and links to the ICPC world site and the ICPC Asia blog.

    Our copy holds five pages (the front page, the announcement list and the schedule, the last two twice under http and https). The announcement page lists ten dated notices from June to November 2017, among them notices on the schedule, the contest environment and system, foreign-team registration, additional finalist teams and finalist registration. The tentative schedule gives a practice session on Friday 10 November and the contest on Saturday 11 November from 10:00 to 15:00 at the Munji Campus of KAIST, Daejeon, followed by the award ceremony and banquet.

    The results pages themselves (problems, scoreboard, test data, photos) are linked but are not among the five pages.
