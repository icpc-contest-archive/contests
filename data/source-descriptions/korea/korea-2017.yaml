    Final standings of the 2017 ACM-ICPC Asia Daejeon Regional Contest, rendered by the archive from the ICPC global public API data: 86 teams with rank, team name, institution, number of problems solved, total time and a citation column. First place is MolaMola of Seoul National University with 12 solved and a time of 812. The 71 teams ranked 1 to 43 carry citations from First Place to Forty-third Place; the other 15 teams, ranked 44 to 56, have no citation, and the last teams have 1 problem solved. There is no per-problem detail.

    The page is not the original publication but a table generated from the API archive, with a header giving the contest, the ICPC year 2018 and the team count.
