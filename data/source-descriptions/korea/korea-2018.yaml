  title: 2018 Seoul Regional – ICPC Korea Regional Site
  language:
  - en
  - ko
  contest_date: '2018-11-02'
  description: |-
    Website of the 2018 Seoul Regional of ICPC Korea (ICPC Korea Regional Site), in English and Korean. Our copy holds 11 saved pages, which are six distinct pages: the main page and five subpages, each of the five saved under both its http and its https address. The subpages are an announcements list (ten dated notice titles from 18-07-04 to 18-11-03, nearly all in Korean), a schedule (registration, opening ceremony and practice session on 2 November 2018; check-in, contest, judge committee, award ceremony and banquet on 3 November, at Sejong University, Seoul; marked tentative), the team list, contest environment (what teams may bring, team notebook rules, Linux 16.04 LTS with the listed editors and compilers) and venue and accommodation (Sejong University Convention Center, directions from Incheon Airport).

    The main page carries a Results block with links to the problem set, the final scoreboard and a test data archive, followed by a standings table of 50 ranked teams (rank, team name with institution, solved, time) and a list of 40 more teams under Honorable Mentions. The linked problem set, scoreboard and test data are not part of this copy. The menu on every page also links to the 2026 editions and to the contest archive of the site.
