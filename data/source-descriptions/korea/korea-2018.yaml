    Standings of The 2018 ICPC Asia Seoul Regional Contest: 90 teams, each with rank, team name, institution, number of problems solved and total time. The first 50 rows (ranks 1 to 28) also carry a Citation, from First Place to Twenty-eighth Place; the remaining 40 teams are listed with ranks 29 to 57 and no citation. First place is 789 of Seoul National University with 11 problems. Institutions include Korean universities and a few from Japan, Taiwan and Hong Kong. There is no per-problem detail and no marking of unofficial teams.
