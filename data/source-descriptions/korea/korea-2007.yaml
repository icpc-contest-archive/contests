  title: 'ACM ICPC :: View topic - Problem Solving Statistics'
  language:
  - en
  - ko
  description: |-
    Forum of the ACM ICPC Asia Regional - Seoul contest (a phpBB board), in English and Korean. Our copy holds 78 pages, captured at various dates between 2006 and 2009. The board has sections for the Seoul regional and the internet competition of each year from 2004 to 2008, news and announcements, problem discussion, team introductions and off-topic talk. Many pages are therefore about other years, and others are forum pages such as login, search and member list; there is also a short page for the 2003 regional.

    For the 2007 regional it holds the section's topic list (photos, contest problem set, statistics, final standing, schedule, hotel and contest environment among the titles), the Problem Solving Statistics post of 2007/11/7, a post of 2008/7/10 with the final standing, and the post on getting from Incheon Airport to the contest place, the Kim Koo Museum and Library Convention Hall. The statistics post gives submissions by programming language, the number of teams that solved each of problems A to J, and correct and incorrect submissions per problem. The final standing lists 28 ranked teams with solved count and penalty, then Honorable Mention teams and three entries marked Disqualified, No Show and Incomplete.

    The 2007 posts for the schedule, the problem set and the photos are not in our copy.
