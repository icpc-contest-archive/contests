  language:
  - en
  contest_date: '2007-11-02'
  teams: 63
  description: |-
    Standings page of the 2007 ACM Asia Programming Contest - Seoul, in four tables. The Final Round, the on-site regional contest of 11/2/2007, lists 63 teams as institution and team name with a citation, and for the ranked teams the number solved and penalty time. The first 28 are ranked (First Place to Seventeenth Place, with ties) and 35 are Honorable Mention without a rank. Seoul National University's team is first with 8 solved. There is no per-problem detail.

    The other three tables are preliminary sites: the Nationwide Internet Contest of 9/15/2007 with 280 teams, the Soongsil University Campus Programming Contest of 9/8/2007 with 48 teams, all Honorable Mention, and five teams of the Asia-Foreign Team registration site of 11/2/2007.
