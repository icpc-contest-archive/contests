  title: The 2005 ACM Asia Programming Contest - Seoul sponsored by IBM
  language:
  - en
  contest_date: '2005-11-04'
  description: |-
    Standings page of the ICPC site headed 'The 2005 ACM Asia Programming Contest - Seoul sponsored by IBM', with three tables. The Final Round (Asia - Seoul On Site Contest, 11/4/2005) has 63 teams: 45 with place, citation, solved and penalty, and 18 as Honorable Mention without results. A Shanghai Jiao Tong University team is first with 7 solved and a penalty of 484.

    The Preliminary Site table for the nationwide Internet competition lists 171 teams, all as Honorable Mention without results. A third table, the foreign team Seoul registration site, lists eight teams, also all Honorable Mention. Teams are written as university=>team name. No per-problem detail.
