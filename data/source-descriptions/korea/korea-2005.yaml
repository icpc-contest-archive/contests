    Single page of the ICPC Korea regional site headed 2005 Seoul Regional, with the date 2005. 11. 02 - 03. Under the heading it links to the problems (a zip file), the standings (the ICPC site) and three outside sites: the ICPC World site, the ICPC Asia blog and ICPC Asia Pacific. It has the site menu (home, regional rules, 2026 preliminary, 2026 Seoul regional, contest archive), a contact address and a row of sponsor logos. Our copy holds this one page; the other pages of the site and the linked files are not part of it.
