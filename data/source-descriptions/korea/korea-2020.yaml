  - en
  problems: 12
  description: |-
    Codeforces gym dashboard of the 2020-2021 ACM-ICPC, Asia Seoul Regional Contest, marked Finished. It lists 12 problems A to L with time limit (0.5 to 2 seconds), a 512 MB memory limit and the number of solvers. Links under contest materials point to Statements (en) and Tutorial (ko). The page also has the virtual participation and practice notices and the form for asking questions about problems. The statements themselves are on other pages not in our copy.
