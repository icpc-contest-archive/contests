  language:
  - en
  problems: 12
  pages: 24
  description: |-
    Problem set of the 2020 ACM ICPC Asia Regional in Seoul: a PDF of 24 pages in English. The first page is a contents list saying the set has 12 problems over 24 pages, with A. Autonomous Vehicle through L. Two Buildings. Each problem starts on its own page with its time limit and has a statement, input and output format and sample input and output; problems A to K take two pages each and problem L takes one. Many statements include figures, for example A, B, C, D, H, J and K. No test data or solutions.
