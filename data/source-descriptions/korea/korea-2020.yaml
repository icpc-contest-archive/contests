  description: |-
    QOJ.ac contest dashboard for the 2020-2021 ICPC Asia Pacific - Seoul Regional, in the Contest Category under ICPC, Regionals, Asia Pacific, Korea. It lists 12 problems A to L by name. The sidebar gives the ICPC ruleset, a 20 minute penalty, a limit of 1000 submissions per problem and an attachment named Statements (en). The notice and questions tables are empty. The statements and the standings are on other pages not in our copy.
