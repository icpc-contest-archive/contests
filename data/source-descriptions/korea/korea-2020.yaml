  title: 2020 Seoul Regional – ICPC Korea Regional Site
  language:
  - ko
  - en
  description: |-
    Page of the ICPC Korea Regional Site (a WordPress site) for the 2020 Seoul Regional, mostly in Korean with some English. It lists eight dated announcements under the heading 공지 사항 (gongji sahang, "notices"): the English schedule, the internet preliminary and how to take part in it, the environment and system notice, the announcement of finalist teams with registration status, an official letter requesting participation, the onsite schedule and contest rules, a post titled "Problemset, Final Standings, Test Data", and the list of award winners.

    Our copy holds only this one page. The announcements are links to other pages on the site, and those pages are not in our copy.
