  title: The 2020 ICPC Asia Seoul Regional Contest — standings
  language:
  - en
  teams: 59
  description: |-
    Standings of the 2020 ICPC Asia Seoul Regional Contest: 59 teams with rank, team name, institution, number of problems solved, total time and a citation. Seoul National University's team Let Us Win ICPC WF is first with 12 problems and time 1218. The citations run from First Place through Sixteenth Place, and the lower teams are listed under Honorable Mention. Several teams share a rank number although their solved counts and times differ (five teams are ranked 2). There is no per-problem detail and no attempt counts.
