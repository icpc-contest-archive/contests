  description: |-
    Category page of the Baekjoon Online Judge, in Korean, titled Asia Regional - Seoul 2020 and placed under ICPC Regionals, Asia Pacific, Korea. A table lists 12 problems A to L (Autonomous Vehicle to Two Buildings) with the judge's problem numbers 20169 to 20180, and for each the number of users who solved it, the number of submissions and the acceptance rate. Problems J and K carry a special judge mark. The statements are on separate pages that are not in our copy.
