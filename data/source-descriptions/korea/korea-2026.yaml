  copy: korea/korea-2026/teams/20261116-live-6ba0ca52/page.html
  title: Foreign Teams Registration - Result
  language:
  - en
  teams: 7
  description: |-
    Notice of ICPC Korea dated 24 October 2026, in English, on the registration of foreign teams for the 2026 Seoul Regional Contest. It lists the seven accepted teams with team name, institution and country (teams from Taiwan, Japan, Thailand and Singapore), states that 9 teams had registered and that registration is closed, and says the next team in the queue is invited if an accepted team declines. It also advises accepted teams on documents for on-site registration and invitation letters.
- url: https://static.icpckorea.net/2026/regional/problemset.pdf
  read: '2026-11-16'
  rubric: 1
  copy: korea/korea-2026/problemset/20261116-live-a2196e4d/problemset.pdf
  title: Problem Set
  language:
  - en
  problems: 13
  pages: 28
  description: |-
    Problem set as a PDF of 28 pages in English, with two cover pages (the second holds the contents list stating 13 problems A to M): Baduk Solitaire, Boss Raid Log, Chemistry Experiment, Circuit X, Drones, Erin Needs Cake, Glowing Devices, Last Jump, Potion Shop, Safe, Stepping Numbers, Summoning Triangle and Workbench. Each problem has a statement with a time limit; twelve of them have input and output format and sample input and output. Problem F is interactive: its statement describes the interaction and gives a sample interaction instead of sample input and output. The pages carry the footer ICPC 2026 Asia Regional - Seoul, and statements run one to four pages each. No test data or solutions.
- url: https://static.icpckorea.net/2026/regional/writeups.pdf
  read: '2026-11-16'
  rubric: 1
  copy: korea/korea-2026/editorial/20261116-live-24b8c257/writeups.pdf
  title: ICPC Asia Seoul Regional Contest 2026 Solutions Presentation
  language:
  - en
  problems: 13
  pages: 32
  description: |-
    Solutions presentation as a PDF of 32 slides in English, covering all 13 problems A to M. After the cover, the problems come in a non-alphabetical order, starting with K, G and D, and take one to four slides each. The slides of each problem name the proposer and the setter and give a short problem statement, the solution idea and the complexity, and in some cases an observation, a figure or pitfalls. The last slide thanks the proposers and setters by name, and the people behind the contest, including volunteers.
