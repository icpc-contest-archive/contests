  read: '2026-11-16'
  rubric: 1
  copy: korea/korea-2026/website/2026-11-16-live-17114915
  title: 2026 Seoul Regional Contest – ICPC Korea
  language:
  - ko
  - en
  contest_date: '2026-11-13'
  description: |-
    Website of ICPC Korea, entered at its page for the 2026 Seoul Regional Contest: schedule (Friday 13 to Saturday 14 November 2026, venue KINTEX, Gyeonggi-do) and ten dated notices from 15 June to 15 November 2026, in Korean, English or both. They cover the contest schedule, the APAC Championship rules, registration and the result of foreign team registration, the list of 74 teams promoted from the first round, staff recruitment, an official letter, rules, environment and system, a mirror contest with an LLM track and a general track, and a post of 15 November that links the problem set, the final scoreboard, mirror contest scoreboards, the live stream and the solutions presentation (dataset and photos are marked TBD). The page of the 2026 first round (online, 16 to 17 October 2026) is also in our copy.

    Our copy holds 150 files, 142 of them pages. Besides 2026 it holds the regional pages for each year from 2001 to 2026, first round or online round pages for each year from 2002 to 2026, the contest archive page and 87 numbered notice pages, those of 2026 and of earlier years. About 170 further older notice pages and the files they link to, such as earlier problem sets, are not in our copy, nor are the scoreboards, stream and mirror site on other addresses.
- url: https://icpckorea.org/archives/3515/
  read: '2026-11-16'
  rubric: 1
  copy: korea/korea-2026/teams/20261116-live-e2411e73/page.html
  title: 2026 ICPC Seoul Regional 본선 진출팀 공지 (List of Teams to Participate in 2026 ICPC Seoul Regional)
  language:
  - ko
  - en
  teams: 74
  description: |-
    Notice of ICPC Korea dated 22 October 2026, in Korean with an English version, listing the 74 teams that go on from the first round to the Seoul Regional Contest at KINTEX, Goyang. Each team is given as institution and team name, in alphabetical order of institution, without results. The text states that 213 teams registered for the first round and 189 solved at least one problem, and gives the three selection steps: the top 30 teams, then the best team of each affiliation with at least two problems solved, then the next teams by rank, 74 in all. It also states that only currently enrolled students may take part.
