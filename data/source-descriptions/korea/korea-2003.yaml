    Final Standing page of the Seoul regional contest with a table of rank, school name, team name, number solved and penalty. 30 teams are ranked 1 to 19 (shared ranks); KAIST's team unKnown is first with 9 solved and a penalty of 810. A further row lists a Shanghai Jiaotong U. team as 2nd place (by reference), with a footnote that it won first prize at the Beijing site. Below that, 27 teams are listed by school under Honorable Mention without results, and two footnotes name teams that were disqualified for an incomplete team and that did not show up. There are no per-problem columns.
