  title: ACMICPC 2002 Asia Regional - Taejon Site
  language:
  - en
  - ko
  contest_date: '2003-11-07'
  problems: 9
  description: |-
    Website of the 2003 ACM ICPC Asia Regional contest in Seoul, in English with several Korean pages. Our copy holds 88 files: 29 HTML pages, 14 PDFs, 16 input and output files, 28 images and one XML file. The home page is a frame set saying the contest is over, with links to photos, problems and final standings. Other pages give the schedule (practice 6 November 2003, contest 7 November 2003), the contest place (Sky City Convention Center), the computer environment, hotels and the online preliminary contest, plus the Asia regional rules (draft of 15 April 2003), the preliminary's rules and selection rules, a PC2 installation guide and an oath form.

    Results: the regional's final standing (rank, school, team, solved, penalty, with an Honorable Mention list); the online preliminary's final standing (103 teams, 29 ranked with solved and penalty, 74 in an Honorable Mention list); a standings table of 112 teams identified by team number (rank, solved, score); and a list of 54 qualified teams. The problem page lists two practice problems and problems A to I, but our copy holds PDF statements only for practice A and B and contest problems A, B, E and H. The preliminary's problem page (two practice problems, A to F) has seven PDF statements, all but contest problem C, and input and output files for all eight.

    The '2002 Site' link leads to a frame set of which our copy holds only the menu, banner and a short home page. Only some photos of the two photo pages are in our copy.
