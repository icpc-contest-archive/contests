  contest_date: '2003-11-07'
  description: |-
    Standings page of the ICPC site headed 'The 2003 ACM Asia Programming Contest - Seoul sponsored by IBM', with three tables. The Final Round (Asia - Seoul, 11/7/2003) has 60 rows: 30 teams with place, citation (First Place to Nineteenth Place), solved and penalty, one Shanghai Jiaotong University team marked 2nd place by reference with 9 solved and 894 penalty, and 29 teams as Honorable Mention without results. Korea Advanced Institute of Science & Technology's unKnown is first with 9 solved and 810.

    The Preliminary Site table for the Korea Nationwide Internet Competition (9/21/2003) has 112 rows: 22 teams with solved and penalty, 90 Honorable Mention. A third table, Preliminary Site Asia - Seoul - Foreign Teams (11/7/2003), lists seven teams as Honorable Mention. Teams are written as university=>team name. No per-problem detail.
