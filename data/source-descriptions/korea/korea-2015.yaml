  description: |-
    Problem set of the Asia Regional in Daejeon, an English PDF of 21 pages. The cover reads The 40th Annual ACM International Collegiate Programming Contest, ASIA Regional - Daejeon, Problem Set, and lists twelve problems A to L with their page counts: Coin Swap, Equilibrium State, Grid, Kernel, Log Jumping, Odd Cycle, Path, Polynomial, Stock, 3-Primes Problem, Tree Edit and Wheel of Numbers. It asks the team to check that it has 12 problems and 20 sheets.

    Each problem has a time limit (from 0.01 to 1.5 seconds), a statement, input and output format, and one sample input with its output. Eight problems (A to G and K) include figures. There is no test data and there are no solutions.
