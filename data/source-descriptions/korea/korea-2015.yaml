    Scoreboard of the 2015 ACM-ICPC Daejeon Regional in the Spotboard format; the footer names Spotboard and the CSUS Programming Contest System Version 9. It lists 80 teams in rank order with rank, team name, institution, number of problems solved and penalty time, and twelve problem cells per team marked with counts such as +11 and -1. The cells carry no solve times. The first place is KAIST with 11 solved and a penalty of 1595.

    The clock reads 05:00. A recent-events list gives the last 100 judged runs, from minute 286 to minute 300, each with team, result (6 YES, 94 NO) and problem letter.
