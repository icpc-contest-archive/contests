  description: |-
    Website of the 2015 Daejeon Regional on the ICPC Korea regional site, in English with some Korean. Our copy holds seven distinct pages: the front page, announcements, registration, teams, contest environment, venue and accommodation, and schedule.

    The front page gives the dates of the online preliminary (3 October 2015) and of the on-site contest (6 to 7 November 2015) and has a results block with links to the problems, a scoreboard, a ceremony video and photos. Below it is a standings table of 72 teams with rank, university, team name, solved and time, followed by eight honorable mention teams listed without results. The teams page lists 80 teams. The schedule page puts registration, the opening ceremony and a practice session on Friday 6 November and the contest on Saturday 7 November from 10:00 to 15:00 at the Munji Campus of KAIST in Daejeon. The other pages cover foreign team registration (one team per foreign university, no fee), what a team may bring and the contest computers, and travel and hotels. The announcement page is a list of dated headlines, mostly in Korean.

    The scoreboard, problem set, video and photos are linked and are not among these pages.
