  description: |-
    Category page of the Baekjoon Online Judge titled Asia Regional - Daejeon 2015, in Korean, filed under the source ACM-ICPC Regionals, Asia, Korea. A table lists the twelve problems, labelled A to L, with their judge problem numbers 11493 to 11504, the title (in Korean for seven problems and in the original English for five), and columns for information marks, accepted count, submissions and acceptance ratio. Problems B, F, G and J carry a special judge mark, and problem B is marked as still being prepared for grading, with no submissions.

    The page lists the problems only; their statements are on other pages that are not in our copy.
