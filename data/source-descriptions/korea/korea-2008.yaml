    Page of the ICPC Korea regional site for the 2008 Seoul Regional. The page body is short: the date given as 2008. 11. 05 – 06, a link to the problem set (a PDF) and a link to the standings, which leads to another server. A side column links to the ICPC World Site, the ICPC Asia blog and ICPC Asia Pacific, and the site menu links to the current regional rules and to the site's contest archive.

