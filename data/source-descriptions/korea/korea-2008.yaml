  description: |-
    Problem set as a PDF of 17 pages in English, headed with the 33rd Annual ACM International Collegiate Programming Contest, ASIA Regional - Seoul. It holds ten problems A to J: Heptathlon, MCS, Homing, Cycle, Archery, Processor, Guess, Salesmen, Hubble Space Telescope and Metal. Each starts on a new page with the statement, input and output format and a sample input with its output; some problems continue on a second page.

    The text of problem H comes out garbled with doubled letters when extracted from the PDF. No test data or solutions.
