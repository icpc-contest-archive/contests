  description: |-
    Page of the ICPC Korea regional site for the 2024 Seoul Regional. It gives the schedule (Seoul onsite contest, Friday 22 to Saturday 23 November 2024, venue KINTEX) and a list of eleven dated announcements from 9 September to 28 November 2024, with titles in Korean, in English, or in both: eligibility, registration of foreign teams, the list of teams advancing to the onsite contest, rules for the 2024-2025 APAC Championship, contest environment and timeline, a mirror contest, the list of award winners, and one post whose title lists Problemset, Scoreboard, Stream, Dataset, Write-up, Certificate and Photos.

    Our copy holds this one page only. The announcements are linked but their pages are not in our copy; the menu also links to the rules, the 2026 pages and the contest archive.
