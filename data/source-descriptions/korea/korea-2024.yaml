  language:
  - ko
  - en
  problems: 12
  pages: 111
  description: |-
    Solution slides in Korean, a PDF of 111 pages made with LaTeX Beamer. The title slide reads "ICPC Asia Seoul Regional Contest 2024 Solutions Presentation" and gives the date November 23, 2024.

    All 12 problems are covered, in the order A, L, B, J, C, E, F, I, H, K, D, G, from A Bottles to G Palindromic Length, with 5 to 13 slides each; problem B is headed "Cards Flipping". The first slide of each problem names its proposer and setter and restates the task under 문제 (munje, "problem") before the solution. The deck ends with the last slide of problem G, with no closing slide.
