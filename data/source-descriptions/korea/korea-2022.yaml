  description: |-
    Page of the ICPC Korea Regional Site for the 2022 Seoul Regional, with menu and headings in English and announcement titles in Korean and English. It gives the schedule of the Seoul onsite contest as Friday 18 to Saturday 19 November 2022 and a Results section linking to the problems, the final scoreboard of the main contest, the final scoreboard of the mirror contest, and photos.

    Below that is a list of 13 dated announcements, 25 July to 30 November 2022: schedule, venue, registration, the list of finalist teams, the mirror contest, publication of test data and of some official solutions, and the award winners. Only the titles are shown. Our copy holds this one page; the announcements and linked documents are not part of it.
