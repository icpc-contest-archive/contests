  problems: 12
  times: true
  tries: true
  description: |-
    Final scoreboard of the 2022 ICPC Seoul Regional Mirror Contest, a DOMjudge public scoreboard: 72 team rows and twelve problems labelled A to L. Each row has rank, team name with affiliation where one is given, problems solved and penalty time, and, for each problem the team tried, the solve time in minutes and the number of tries. Solved cells are coloured and first solves are marked; a summary row gives 136 solved in total and, for each problem, the counts of correct, incorrect and pending submissions and the fastest solve time. Last update is stamped Sunday 20 November 2022 15:43:27 KST.

    Only 22 of the 72 teams solved a problem; the first two have ten solved. The other 50 have zero solved, and many of them have placeholder or test-like names. Rank is printed for 23 rows; the other 49 have none. Nothing on the page marks official, unofficial or test teams. The problem headings link to statements on another server, which are not part of our copy. The style sheets, scripts and country flag images the page refers to are not in our copy.
