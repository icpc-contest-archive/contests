  description: |-
    Category page of the Baekjoon Online Judge, in Korean, titled Asia Regional - Seoul 2021 and placed under ICPC Regionals, Asia Pacific, Korea. A table lists 12 problems A to L (Ant Colonies to Trio) with the judge's problem numbers 23566 to 23577, and for each the number of users who solved it, the number of submissions and the acceptance rate. Problem J carries a special judge mark. The statements are on separate pages that are not in our copy.
