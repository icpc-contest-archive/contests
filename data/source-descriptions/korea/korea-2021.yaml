  read: '2026-11-16'
  rubric: 1
  copy: korea/korea-2021/website/2026-09-04-live-c72e10bc
  title: 2021 Seoul Regional – ICPC Korea Regional Site
  language:
  - ko
  - en
  description: |-
    Page of the ICPC Korea Regional Site (a WordPress site) for the 2021 Seoul Regional, mostly in Korean with some English. It lists nine dated announcements under the heading 공지 사항 (gongji sahang, "notices"): the schedule, the environment and system notice, the announcement of finalist teams with registration status, the onsite schedule and contest rules, an official letter requesting participation, a post covering the problem set, scoreboard and notices, the release of test data, the list of award winners, and a posted collection of achievements of the contest.

    Our copy holds only this one page. The announcements are links to other pages on the site, and those pages are not in our copy.
- url: https://icpc.global/regionals/finder/Seoul-2022/standings
  read: '2026-11-16'
  rubric: 1
  copy: korea/korea-2021/standings/api-20261113/standings.html
  title: The 2021 ICPC Asia Seoul Regional Contest — standings
  language:
  - en
  teams: 73
  description: |-
    Standings of the 2021 ICPC Asia Seoul Regional Contest: 73 teams with rank, team name, institution, number of problems solved, total time, medal, citation and site citation. Seoul National University's team FSM is first with 10 problems and time 1369, ahead of KAIST's DO Solve with 10 and 1591. The citations run from First Place through Thirty-sixth Place, and the lower teams are marked Honorable Mention. The Medal and Site citation columns are empty for 72 teams. No per-problem detail and no attempt counts.

    The row of rank 10 has an empty Solved cell and holds 7 in Time, KAIST in Medal and 200 in Site citation.
