  title: 2021-2022 ICPC Asia Pacific - Seoul Regional - Dashboard - Contest - QOJ.ac
  language:
  - en
  problems: 12
  description: |-
    QOJ.ac contest dashboard for the 2021-2022 ICPC Asia Pacific - Seoul Regional, in the Contest Category under ICPC, Regionals, Asia Pacific, Korea. It says the contest is also known as Moscow International Workshop 2021, Day 4, Korean Contest. It lists 12 problems A to L by name. The sidebar gives the ICPC ruleset, a 20 minute penalty, a limit of 1000 submissions per problem, and attachments: two statement files in English, a link to an official website, and tutorials in Korean and English. The notice and questions tables are empty. The statements and standings are on other pages not in our copy.
