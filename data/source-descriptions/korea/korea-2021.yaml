  language:
  - en
  problems: 12
  pages: 7
  description: |-
    Editorial in English written by Maksim Gorokhovskii and Ramazan Rakhmatullin for the Moscow workshop, dated November 2021: a PDF of 7 pages. It has one section for each of the 12 problems A to L, from Ant Colonies to Trio, describing the solution idea and often the time complexity. Problem C is a single line. No code.
