  description: |-
    Problem set of the ICPC 2021 Asia Regional in Seoul: a PDF of 24 pages in English. The first page carries an in-memory-of dedication to a professor and a contents list saying the set has 12 problems over 24 pages, A. Ant Colonies through L. Trio. Each problem starts on its own page with its time limit and has a statement, input and output format and sample input and output; problem E takes one page and the others two. No test data or solutions.
