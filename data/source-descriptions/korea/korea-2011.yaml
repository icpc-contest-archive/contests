  teams: 442
  description: |-
    Standings of the 2011 ACM-ICPC Asia Daejeon Regional Contest: 442 teams with team, institution, problems solved, time, a rank column and a citation column. Only 49 rows carry a rank, from 1 to 26; the other 393 rows have it blank. The citation gives a place in words for 63 teams (the 49 ranked ones and 14 unranked ones, up to Seventy-seventh Place) and reads Honorable Mention for 377; one citation cell is garbled and one is empty. First in the list is SUNG.. from Seoul National University with 11 solved and time 1110. No per-problem detail.

    In places the place named in the citation differs from the rank, for example four teams ranked 10 carry Ninth Place or Eleventh Place.
