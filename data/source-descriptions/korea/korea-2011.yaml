  title: 'ACM-ICPC Korea Site: Daejeon Regional'
  language:
  - en
  - ko
  description: |-
    Pages from the ACM-ICPC Korea site at KAIST, in English and Korean, spanning many years. The first page is a redirect notice titled ACM-ICPC Korea Site: Daejeon Regional that points to a newer site. Two pages of 2012 follow: a photo page of the 2012 Asia Regional - Daejeon, and the problem page of the 2012 Daejeon National First Round (ten problems). The rest is an older phpBB forum (85 pages), a later phpBB3 board and portal headed ACM ICPC Asia Regional - Daejeon (10 pages; one of them is headed Asia Regional - Seoul), and static pages of the contests of 2000 to 2005 and 2007 with rules, team lists, standings and 18 problem PDFs of 2004.

    For the 2011 Daejeon Regional the portal carries the announcement ACM-ICPC 2011 Asia Daejeon Regional Schedule, posted on 2011-08-22, and the announcements forum lists its title. It gives registration deadlines, the dates of the domestic first round (30 September and 1 October), and the on-site regional contest on 4 to 5 November at the ICC Campus of KAIST in Daejeon, with the venue marked tentative. No results or problems of the 2011 regional are in our copy. It holds 147 pages, nine of them empty.
