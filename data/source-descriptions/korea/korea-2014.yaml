    Baekjoon Online Judge category page, with Korean interface text, listing the twelve problems A to L of Asia Regional - Daejeon 2014 with the judge's problem numbers 10446 to 10457. Each row gives the title, an information mark, the number of accepted solutions, the number of submissions and the acceptance ratio. Seven problems are listed with their English titles; B, D, E, G and L have no title and are marked as deleted. Problem J carries the mark for special judge. The page lists problems only, with no statements.
