    Contest page on the QOJ.ac online judge for "The 2025 ICPC Asia Seoul Regional Contest", filed under ICPC / Regionals / Asia Pacific / Korea. It lists 13 problems, A to M, by letter and title, from A Adventurer Dabi to M Triple Fairness, and gives the contest settings: ICPC ruleset, 20-minute penalty, scoreboard frozen after 4:00:00, with a virtual contest open to start. Under Attachments it links "Statements (en)" and "Tutorials (en)"; the statements themselves are not part of our copy, only the problem names.
