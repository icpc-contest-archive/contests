  contest_date: '2025-11-21'
  description: |-
    Page of the ICPC Korea regional site for the 2025 Seoul Regional. It gives the schedule (Seoul onsite contest, Friday 21 to Saturday 22 November 2025, venue BEXCO Exhibition 2 Hall 5A, Busan) and a list of 13 announcements from 24 August to 28 November 2025, with titles in Korean, in English, or in both: eligibility and the eligibility decision diagram, AI usage rules, registration of foreign teams, the list of teams advancing to the onsite contest, rules for the 2025-2026 APAC Championship, contest environment and timeline, a mirror contest, bringing own equipment, an official letter, recruitment of contest staff, and one post whose title lists Problemset, Scoreboard, Stream, Dataset, Solutions, Certificate and Photos.

    Our copy holds this one page only. The announcements are linked but their pages are not in our copy; the menu also links to the rules, the 2026 pages and the contest archive.
