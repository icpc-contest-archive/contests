  description: |-
    Problem set as a PDF of 30 pages in English, with two cover pages (the second holds the contents list stating 13 problems A to M): Adventurer Dabi, Badge Relay, Bay, Bookshelf, Clean Arrangements, CPEquivalence, Extraterrestrial Creatures, Fair Problemset, Magic Door, Mex Culpa, Quadrants, Segments and Triple Fairness. Each problem has a statement with a time limit; problems B to M have input and output format and sample input and output. Problem A is an interactive problem: its statement describes the interaction and commands and gives one sample interaction instead. Statements run one to five pages each. No test data or solutions.
