  description: |-
    Standings of the 2025 ICPC Asia Seoul Regional Onsite Contest: 82 teams, each with rank, team name, institution, number of problems solved (from 10 down to 1), total time and a citation. The first 50 places carry the citations First Place to Fiftieth Place and the other 32 teams are listed as Honorable Mention. First place is Just use CRT of Seoul National University with 10 problems. There is no per-problem detail and no per-problem attempts.
