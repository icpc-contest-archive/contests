  - en
  contest_date: '2025-11-22'
  problems: 13
  pages: 19
  description: |-
    Solutions presentation as a PDF of 19 slides in English, dated 22 November 2025, covering all 13 problems A to M. The problems are taken in a non-alphabetical order, starting with M, L and C; problems C, K and H run over two or three slides. Each problem slide names the proposer and the setter and gives a short problem statement and the solution idea; a complexity is given for every problem except A, and some problems also have pitfalls or pro-tips. The last slide thanks the proposers, setters, reviewers and system operators by name.

    The first slide also carries a stray text reading 'The 2024 ICPC Asia Seoul Regional Con'.
