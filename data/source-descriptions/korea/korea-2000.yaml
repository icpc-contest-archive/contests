  description: |-
    Contest information page for The 2000 ACM Asia Programming Contest, Seoul-Taejon, sponsored by IBM and hosted by Korea Advanced Institute of Science and Technology, dated 5 - 6 November 2000. It says the contest drew students from colleges and universities throughout Asia and that winners of the regional contests went on to the World Finals in Vancouver, B.C. In English.

    Our copy holds 4 pages: this page, the team roster (55 teams), the standings (Rank, Team, Citation) and Problems.pdf, a PDF of the 13-page problem set. The page also links to the regional contest's own home page and to a contact address for the regional contest director; the home page link leads outside our copy.
