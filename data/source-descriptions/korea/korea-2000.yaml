  description: |-
    Problem set as a PDF of 13 pages in English, headed 'The 25th Annual ACM International Collegiate Programming Contest ASIA Regional - Taejon'. Each problem starts on a new page. Two practice problems (A, Compute a Partial Sum; B, Cross a Creek) come first, followed by eight contest problems A to H: Car Racing, Work at a library is tough, Moving Pegs, Rectangle Coloring, Match Maker, Taekwondo, Lost Lists and Coins.

    Each of the ten has a statement with the name of its input file, input and output format and one sample input with its output; some have figures. The pages carry no date. No test data or solutions.
