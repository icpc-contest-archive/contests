  title: The 2019 ICPC Asia Seoul Regional Contest
  language:
  - en
  teams: 90
  description: |-
    Standings of The 2019 ICPC Asia Seoul Regional Contest: 90 teams, each with team name, institution, number of problems solved and total time. The first 69 rows carry a rank (1 to 23) and a Citation from First Place to Twenty-third Place; the other 21 teams follow without rank or citation. First place is Cafe Mountain of Seoul National University with 12 problems. Institutions include Korean universities and a few from Japan, Taiwan and Hong Kong. There is no per-problem detail and no marking of unofficial teams.
