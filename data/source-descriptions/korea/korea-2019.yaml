  description: |-
    Official problem set of the ICPC Asia Seoul Regional Contest, as a PDF of 24 pages. The cover reads ICPC Asia Pacific & Southeast Regionals 2019 and shows the ICPC logos and the ICPC global programming tools sponsor. The second page lists the twelve problems A to L (A Fire on Field, B Gene Tree, C Islands, D Ladder Game, E Network Vulnerability, F Quadrilaterals, G Same Color, H Strike Zone, I Thread Knots, J Triangulation, K Washer, L What's Mine is Mine) with their page counts, and states a memory limit of 512 MB for all twelve. Each problem has an English statement with a time limit, input and output format, and sample input and output. No test data or solutions.
