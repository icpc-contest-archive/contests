  - ko
  contest_date: '2019-11-08'
  description: |-
    Website of the 2019 Seoul Regional of ICPC Korea (ICPC Korea Regional Site), in English and Korean. Our copy holds six saved pages, which are four distinct pages: the main page, an announcements list, a schedule and a venue page, with the announcements and schedule each saved under both an http and an https address. The announcements list has 14 dated notices from 19-09-07 to 19-11-13 (registration, the list of teams that advanced, compiler and JDK upgrades, a mirror contest, helper recruitment, the certificate upload). The schedule gives 8 and 9 November 2019 at Sejong University, Seoul: registration, opening and practice session on the Friday, contest from 10:00 to 15:00, judging and awards on the Saturday; it is marked tentative. The venue page gives the address of the Sejong University Convention Center and directions from Incheon Airport.

    The main page has a Results block with links to the problem set, final scoreboards of the main contest and of the mirror contest, a test data archive and a photo album. These documents are not part of this copy, and there is no team list or standings table on the site pages we hold.
