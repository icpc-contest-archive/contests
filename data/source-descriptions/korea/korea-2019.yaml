    Problem list of the Baekjoon Online Judge for the category Asia Regional - Seoul 2019, with the site's Korean interface. A table gives 12 problems labelled A to L, numbered 17968 to 17979 on the judge, with title, info marks, number of users who solved each, number of submissions and acceptance ratio. All twelve are marked as multilingual and two (C and D) as special judge. The page links to the problems on the judge; the statements themselves are not on this page.
