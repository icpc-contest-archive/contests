  description: |-
    Order No. 955 of the Ministry of Education and Science of Ukraine, dated 11 July 2013, on the results of the All-Ukrainian student olympiad of the 2012/2013 academic year, as a Word document. It approves the results of the second stage of the olympiad and awards diplomas of the first, second and third degree to the winners. Appendix 1 lists the winners by subject and appendix 2 by field of study and speciality, each with place, student and university; informatics appears in both, and appendix 2 also has computer science and system programming. The order does not mention the programming contest or its team scoreboard.
