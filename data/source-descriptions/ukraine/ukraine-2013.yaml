- url: https://vntu.edu.ua/images/aucpc2/report.pdf
  read: '2026-11-16'
  rubric: 1
  copy: ukraine/ukraine-2013/website/2026-11-15-wayback-e8f17c21
  language:
  - uk
  - en
  description: |-
    Website of Vinnytsia National Technical University (VNTU) with the pages of its ACM ICPC section, in Ukrainian with an English menu. The pages for 2013 are an organising committee page (members and their roles), a sponsors page naming Sitecore Ukraine, Gemicle, RabotaLux and the online shop Nadiyno as providers of prizes (Sitecore Ukraine also organised a reception for participants and organisers), and a results page. The results page lists 15 teams in five groups, with university, team name, members and coach: technical universities (6 teams), pedagogical (3), natural sciences (1), economic (2) and school teams (3). Places are numbered within each group; it gives no solved counts, times or problems. An undated preliminary programme page describes a one-day olympiad (registration, opening, contest from 10:00 to 15:00, problem discussion, awards ceremony). The site's menu files these pages under the first stage of the All-Ukrainian olympiad.

    Our copy holds 150 saved files: 118 pages and PDFs, 28 Word documents and four pages that are only a database error message, the first of them the front page. Most of it is not about this contest: the all-university menu and admission documents, registration forms, pages of the second stage in 2014 (report, results by site, problem set), and pages of the South-Eastern European Programming Contest 2013 and 2014 as held at the Ukrainian site in Vinnytsia (organisers, sponsors, problems, standings, photos). The second-stage 2013 pages hold only the site menu.
