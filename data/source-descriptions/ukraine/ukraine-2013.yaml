  description: |-
    Standings table of 5 pages, headed Standings [5:00:00], with the note that the last success was at 4:58:37 on problem G. It lists 139 teams, each with place, a region tag in brackets (KYIV 20 teams, EAST 33, SOUTH 31, WEST 29, CENTER 26) and team name, then ten problems A to J, number solved and penalty time. A solved problem shows a plus sign, with the number of earlier failed attempts if any, and the time of the solve in hours and minutes; an unsolved problem with attempts shows a minus sign and their number. Four teams have 8 problems solved; the top place is BZFlags (KYIV) with penalty 645. Places 1 to 75 are ranked by solved count and penalty, and the 64 teams with no solved problem all share place 76 to 139. There is no institution column, and a few team names carry an asterisk or hash sign that the table does not explain.
