  description: |-
    Scoreboard of the 2nd stage of the All-Ukrainian Collegiate Programming Contest, 15 September 2018, headed Standings [5:00:00]: 236 teams with user name, region and problems A to O. Each solved problem cell gives the number of extra attempts when there were any and the time as h:mm, for example +9 (4:12); an unsolved problem shows a minus and the number of attempts, and untried problems are blank. At the end are rows for Submissions, Accepted and percent per problem. A table above it gives teams per region (North 33, East 45, Western 32, School 26, South 39, SouthWest 32, Center 29), the average number of problems solved and average place of the top 10 teams, and the number solved by the 10th team. The page also carries contest control fields and buttons (start time, contest speed, penalty for wrong submission, Start, Finish, Pause).

    The Place, Total, Penalty and Dirt columns are empty for every team in our copy, so ranks and totals are not shown. Twenty-five team names end with an asterisk and one carries a question mark, none explained on the page.
