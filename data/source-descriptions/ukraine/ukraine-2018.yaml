    News item from the Faculty of Information Technology pages of the website of the National University of Life and Environmental Sciences of Ukraine, in Ukrainian, dated 15 September 2018, on the second stage of the All-Ukrainian student programming olympiad held at the faculty that day (Northern region). It states that teams of three had five hours and one computer, that the contest had 13 problems in Ukrainian and English, that C, C++ and Java were allowed and that solutions were checked on ejudge, and that 41 teams from 20 institutions (15 universities and 5 schools) registered. It names a sponsor, mentions the opening speakers and an interview video, and ends with a table of the top seven teams by rank, university, problems solved and time; the first place solved 13 problems. The rest of the page is the menus of the university site.
