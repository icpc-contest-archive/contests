  description: |-
    Word document (.doc) containing an order of the Ministry of Education and Science of Ukraine, dated 13 August 2018, no. 902, in Ukrainian. It approves the lists of winners of the second stage of the All-Ukrainian student olympiad of the 2017/2018 academic year, by academic disciplines and by specialities, and orders that the winners receive diplomas. The two lists give place, winner and institution under a heading for each discipline or speciality. The word programming occurs only in four such headings (for example Programming and IT project management, Internet olympiad); the document does not mention the September 2018 programming contest.
