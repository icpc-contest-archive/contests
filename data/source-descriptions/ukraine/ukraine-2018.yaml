  description: |-
    Report on the second stage of the All-Ukrainian Collegiate Programming Contest of 15 September 2018, on the website of Vinnytsia National Technical University, in English, headed CONTEST SITES: 6. A summary table covers the six super-region sites (Eastern, Central, Southern, South-Western, Western, Northern) with teams, institutions, cities, number of school teams and, for the top 10 teams, average problems solved, average place and problems solved; its total row gives 210 teams, 119 institutions and 36 cities.

    Each site then has its own section: host institution, regions covered and number of teams, tables of tries and successes for problems A to O, a table of how many teams solved each number of problems, and a table of region winners with rank, team, university, problems solved and time (penalty in the Eastern section). Five sections, all but Eastern, also have a school division with its own winners and statistics tables; the Western school statistics table is empty. Most sections add notes on sponsors, accommodation and events, and the Eastern and Southern ones state prize funds. Only the top teams of each site are listed, not all teams. The summary table and the site sections give different team counts for every site (for example Eastern 45 and 47).
