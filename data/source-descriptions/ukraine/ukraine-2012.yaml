  description: |-
    Website of the All-Ukrainian student programming olympiad (pc-ua.com.ua), the series site rather than a site of the 2012 edition alone, in Russian, Ukrainian and English. The front page in our copy, in Russian, states the mission and aim of the olympiad, its place in the qualifying rounds of the ACM-ICPC World Finals, and its three stages (first in regional centres, second in five geographic regions, third in two leagues, the first league being a semifinal of the world contest).

    A news page carries two items from 2012. The first announces the final, a semifinal of the ACM-ICPC at Vinnytsia National Technical University on 11 to 14 October. The second reports the winners: 41 teams in Vinnytsia, among them 32 Ukrainian teams chosen from about 600 that started the first stage, and 78 teams in all counting a parallel site in Bucharest. The site maps list entries for 2012, but those pages are not in our copy. Most other pages are about earlier years, mainly 2004 and 2005, with a few results reports for 2006 and 2008: rules, programme, participating teams, winners, jury, venue and problem statements.

    Our copy holds 150 files: captures of the site's pages made between 2006 and 2016, plus a few from 2018 to 2023 (robots.txt files, domain-for-sale pages, a privacy policy page and an advertising page for an online casino) that have nothing to do with the contest.
