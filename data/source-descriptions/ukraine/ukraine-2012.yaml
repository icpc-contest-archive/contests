  description: |-
    Standings of The 2012 All-Ukrainian Collegiate Programming Contest: 132 teams with rank, team, institution, number solved, penalty time and a citation. Places run from 1 to 116; 66 teams are marked Honorable Mention, with tied places; the last place, 116, is shared by 17 teams with no problem solved. First place is BZFlags from Taras Shevchenko National University of Kyiv with 9 problems solved and a time of 1176. No medal marks and no per-problem detail.
