  description: |-
    Standings of The 2010 All-Ukrainian Programming Contest: 30 teams with rank, team, institution, number solved and penalty time. No team is left unranked and there are no medal marks. The first five places, from Taras Shevchenko National University of Kyiv (two teams), Donetsk National University, the National Technical University of Ukraine "Kiev Polytechnic Institute" and V.I. Vernadsky Crimean Federal University, solved 11 problems each; the first place has a time of 1024 minutes. No per-problem detail.
