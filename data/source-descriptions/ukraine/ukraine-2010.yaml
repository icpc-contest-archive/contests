  title: All-Ukrainian Collegiate Programming Contest
  language:
  - en
  - ru
  - uk
  description: |-
    Website of the All-Ukrainian Collegiate Programming Contest, the series site rather than a site of the 2010 edition alone, in English, Russian and Ukrainian. The English front page states the aims of the contest, its three stages (a first stage in universities, a second stage in five regional sites, a final in two leagues, the first league run inside the South-Eastern European Regional Contest of the ACM-ICPC) and that in 2011, 598 teams of 120 universities from 39 cities took part in the first stage.

    A news page reports the tenth All-Ukrainian Olympiad, held at Vinnytsia National Technical University from 7 to 12 September 2010: 32 teams that had won four regional semifinals, out of 146 teams (426 students) from 66 universities in 30 cities, with more than 2000 students in the first stage. The site maps list entries for 2010 (schedule, participants, standings, problems, sponsors, photos), but those pages are not in our copy. Most other pages are about earlier years, mainly 2004 and 2005, with a few results reports for 2006 and 2008: rules, programme, participating teams, winners, jury, venue, problem statistics and trial-round problem statements.

    Our copy holds 150 files: captures of the site's pages made between 2006 and 2016, plus a few from 2018 to 2023 (robots.txt files, domain-for-sale pages, a privacy policy page and an advertising page for an online casino) that have nothing to do with the contest.
