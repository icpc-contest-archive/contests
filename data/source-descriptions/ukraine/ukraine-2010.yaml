  description: |-
    Category page of the Baekjoon Online Judge for AUCPC 2010, in Korean. It lists twelve problems, A to L (Lucky Controller to Game on Chessboard), each with the judge's problem number (7491 to 7502), its title, tags (a source tag and multi-language for all, special judge for one), the number of users who solved it, the number of submissions and the acceptance rate. The category sits under ACM-ICPC, Regionals, Europe, Southeastern European Regional Contest, All-Ukrainian Collegiate Programming Contest. Our copy holds only this list page, with no problem statements.
