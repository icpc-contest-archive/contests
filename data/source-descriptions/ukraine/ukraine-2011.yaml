  description: |-
    Standings of The 2011 All-Ukrainian Collegiate Programming Contest: 151 teams with rank, team, institution, number solved and penalty time, plus medal, citation and site citation columns. Twelve teams carry medals (four gold, four silver, four bronze) and every team has a citation such as First Place or Honorable Mention; places run from 1 to 132, the last place shared by the teams with no problem solved. Five teams have a site citation naming them champion of a Ukrainian region (Southern, Kyiv, Western, Eastern, Central). First place is Akai from V.I. Vernadsky Crimean Federal University with 11 problems solved. No per-problem detail.
