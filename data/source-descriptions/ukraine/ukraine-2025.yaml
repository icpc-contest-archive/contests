  title_en: All-Ukrainian Student Programming Olympiad 2025
  language:
  - uk
  - en
  description: |-
    Website of the Ukrainian national student programming olympiad of 2025, run on the Algotester platform together with Ivan Franko National University of Lviv. The home page announces three stages: stage 1 on 11-12 October and stage 2 on 8-9 November, both online (it reports them as held on 12 October and 9 November), and stage 3 on 12-14 December in Lviv, the national final that also served as the ICPC SEERC 2025 semifinal. It states how many teams took part in each stage (635, 252 and 37), lists the prizes, sponsors and the programme of the final days in Lviv, the software installed on the contest machines, and links to a university news article, a photo gallery and a video.

    Our copy holds 57 files, 33 of them pages: the home page in Ukrainian and in English (the text is Ukrainian in both), the general help page of the Algotester platform in English and Ukrainian, login and inquiry-form pages, three official documents as PDFs (the 10-page regulations of the olympiad, a one-page letter from the Ministry of Education and Science announcing the semifinal, and a 4-page list of base universities and coordinators for stages 1 and 2), and scoreboard pages of several contests of the olympiad.

    The scoreboard pages in our copy show only the column headings and no team rows; the rows are loaded by script and are absent. Links to the SEERC scoreboard site, to the archived problems and to the university's news and gallery pages lead outside our copy.
