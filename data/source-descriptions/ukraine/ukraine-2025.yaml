  description: |-
    Problem set of stage 2 as a PDF of 17 pages in English. Every page carries the running header 'Ukrainian National Programming Contest 2025, Stage 2 - November 9, 2025'. It holds 12 problems, A to L (A Pet Friendly Office through L Light), each with a time and memory limit, a statement with input, output and constraints, and a sample with input and output; most are set in a Tom and Jerry story. Problem E is interactive and gives an example of the interaction instead of a sample table. No test data or solutions.
