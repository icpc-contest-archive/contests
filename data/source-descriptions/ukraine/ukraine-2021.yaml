  description: |-
    Report on the second qualifying tour of the ICPC-Ukraine 2021 contest, held online on 16 October 2021 on six super regional sites: a PDF of 6 pages in English. The opening states that 224 university and college teams and 59 high school teams took part and describes a DDoS attack during the third hour, after which teams could not test their solutions; all solutions were judged at the five-hour mark and those accepted received a 220 point penalty. It lists the top six university teams and the top six school teams overall. Then for each of the Eastern, Southern, Southwestern, Western, Northern and Central sites it gives the number of teams, how many teams solved each number of problems, and tables of the site's best university teams and school division winners. Four sites (Eastern, Southwestern, Western, Central) also give tries and successes per problem A to K; Northern gives success percentages only and Southern gives neither. Sponsors are named for the Eastern, Southern and Western sites.
