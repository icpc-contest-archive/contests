    Scoreboard of the second stage of the All-Ukrainian Collegiate Programming Contest, a five-hour contest of 282 teams and twelve problems A to L. Each row gives the team name, its region (School 68 teams, South 44, Center 43, South-West 41, West 38, North 24, East 22, and 2 marked Unofficial) and one cell per problem showing a plus sign with the number of extra wrong attempts and the solve time in hours and minutes, or a minus sign with the number of failed attempts when unsolved. The first row is LNU Stallions.

