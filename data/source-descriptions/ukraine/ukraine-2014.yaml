    Overall scoreboard of the contest as a PDF of 7 pages, headed RESULTS [5:00:00], with the line Last success: 4:57:22, KhNUE_K.O.S., D. It lists 134 teams from the five sites, with place, team, region (Kyiv 24 teams, West 33, South 22, East 27, Center 28), twelve problems A to L, number solved (column headed Problems) and penalty. Each problem cell shows a plus sign with the number of earlier failed attempts, if any, and the solve time in hours and minutes, or a minus sign and the number of attempts when unsolved. Six teams solved all twelve problems; first place is Unicon (Kyiv) with penalty 746. Four teams with no solved problem share the last place. The closing rows, headed Total, Success and %, give a figure per problem for each row, with the Success row adding up to 654 and the % row in percent.
