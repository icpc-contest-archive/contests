  description: |-
    Scoreboard of the second stage of the All-Ukrainian Collegiate Programming Contest: 261 team rows and twelve problems A to L. Each row gives the team name, a region (East, West, North, South, SouthWest, Center, School, and one team marked Unofficial) and, for each problem, a plus or minus sign with the number of wrong attempts and, for an accepted problem, the time of the solution. A summary table at the top gives the number of teams per region and the average problems solved and average place of each region's top ten teams. The last three rows give submissions, accepted solutions and acceptance percentage per problem. The page shows a clock of 5:00:00 beside the heading Standings, and a filter by region.

