  description: |-
    Contest information page for the 2001 ACM Asia Programming Contest - Singapore, sponsored by IBM and hosted by Nanyang Technological University, School of Computer Engineering. It gives the date as 29 - 30 November 2001 and says that regional winners advance to the World Finals in Honolulu, Hawaii. It links to the team roster, the standings and the problems.

    Our copy holds 3 pages: this page, a Problem Sets page that offers the problem sets as downloads, and the 24-page PDF of the problem sets with 8 problems; the Word version of the problem sets linked from the Problem Sets page is also in our copy. The roster and the standings are linked but lead to other addresses and are not part of this copy.
