    Statement of one problem as a PDF of 3 pages, headed "4106 - ACORN" with the region line "Asia - Singapore - 2007/2008" below it; the text also carries the line "Singapore 2007-2008" and, on the later pages, the page numbering. Jayjay the flying squirrel descends oak trees of equal height collecting acorns and loses f feet of height each time he flies to another tree; the task is the maximal number of acorns he can collect. A figure shows an example with three trees. Input and output format and a sample input and output are included.
