  description: |-
    Statement of one problem as a PDF of 2 pages, headed "4109 - USHER" with the region line "Asia - Singapore - 2007/2008" below it; the text also carries the line "Singapore 2007-2008" and, on the later pages, the page numbering. A collection box with capacity c dollar coins passes between parishioners, who add coins by rule, and a light-fingered usher who removes one coin each time it reaches him; the task is the maximal possible gain for the usher when parishioners always choose the rule leading to the biggest gain. Input and output format and a sample input and output are included.
