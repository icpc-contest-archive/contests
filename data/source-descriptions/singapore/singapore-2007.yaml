    Problem set as handed to teams: a PDF of 18 pages. The cover reads "2007 ACM Asia Programming Contest Singapore", "14 December 2007" and "Contest Problems", with sponsor and organiser logos as pictures. Pages 2 to 4, "Before You Start", list the seven problems A to G (MODEX, JONES, ACORN, TUSK, SKYLINE, USHER, RACING), allow C, C++ and Java, and explain the judges' responses, the scoring with 20 penalty minutes per incorrect submission, and clarifications. The seven problems follow on pages 5 to 18, each with a statement in English, input and output sections and a sample input and output; several have figures. Every page after the cover carries a footer with the contest name and page number.
