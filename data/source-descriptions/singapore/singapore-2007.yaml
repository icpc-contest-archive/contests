    Statement of one problem as a PDF of 3 pages, headed "4107 - TUSK" with the region line "Asia - Singapore - 2007/2008" below it; the text also carries the line "Singapore 2007-2008" and, on the later pages, the page numbering. For a set of points in the plane with no three on a line, a k-set is a split of the points by a line into a part of k points and the rest; the task is to compute the number of different k-sets. A picture of a tusk cross-section is included. Input and output format and a sample input and output are included.
