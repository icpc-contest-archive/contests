    Statement of one problem as a PDF of 4 pages, headed "4105 - JONES" with the region line "Asia - Singapore - 2007/2008" below it; the text also carries the line "Singapore 2007-2008" and, on the later pages, the page numbering. Indiana Jones crosses a river on a line of stones that may sink and resurface minute by minute, hopping at most 1.5 meters at the start of each minute; the task is the fastest crossing, with an output of -1 when there is none. A figure shows an example of sinking stones and the fastest route, and a note explains the sample. Input and output format and a sample input and output are included.
