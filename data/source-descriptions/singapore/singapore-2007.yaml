    Statement of one problem as a PDF of 2 pages, headed "4108 - SKYLINE" with the region line "Asia - Singapore - 2007/2008" below it; the text also carries the line "Singapore 2007-2008" and, on the later pages, the page numbering. A skyline is built from buildings given back to front by left and right endpoint and height; the overlap of a building is the total horizontal length where it is at least as high as the skyline behind it, and the output is one integer per dataset, the amount of overlap in the proposal (the note gives overlaps of 6, 4 and 4 for the three sample buildings and the sample output is 14). A figure illustrates the skyline. Input and output format and a sample input and output are included.
