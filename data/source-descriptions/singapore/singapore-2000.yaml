  description: |-
    Contest information page for the 2000 ACM Asia Programming Contest, Singapore, sponsored by IBM and hosted by Nanyang Technological University, School of Applied Science. It gives the contest dates as 5 to 7 December 2000 and says that winners of regional contests advance to the World Finals in Vancouver. It links to the regional contest's own home page, the team roster, the standings and the problems.

    Our copy holds 4 pages: this page, the roster of 30 teams, the standings page (ranks and citations, no solved counts) and the 23-page PDF of the contest problem sets with 8 problems. The link to the regional contest home page leads to another server and is not part of our copy.
