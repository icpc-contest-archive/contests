    Final scoreboard on the Kattis site of the 2018 ICPC Asia Singapore Regional Contest, marked "Contest is over": 50 teams ranked 1 to 50. Columns are team, number solved, total time and the twelve problems A to L; each problem cell gives the number of attempts and the minute of the accepted solution, or the number of attempts followed by a dash when unsolved, and cells are empty where a team made no attempt. Platelet and Send Bobs to Alice each solved eleven problems, Platelet with the lower time. The header gives the contest as 2018-12-13, 02:00 to 07:00 CET (five hours). Each team row carries a country flag and an institution logo as images; no institution names appear as text.
