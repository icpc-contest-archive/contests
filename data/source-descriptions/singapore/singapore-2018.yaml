  description: |-
    Our copy holds 10 pages, all of them the home page of the School of Computing (NUS Computing) of the National University of Singapore, saved under several host names. They show the page at different times: three older pages titled NUS::School of Computing, two titled School of Computing - NUS, four NUS Computing pages with news items from May to December 2018 (each with a list of upcoming events), and a fifth whose menu has a COVID19 entry. It is the school's general site, not a site for the Singapore regional contest.

    Only the page with news up to 5 December 2018 touches on ICPC: a news item of 23 November 2018 says that school teams placed in the 2018 ICPC Jakarta and Nakhon Pathom regional contests, with links to the Nakhon Pathom results and to the Jakarta contest site. The Singapore regional contest is not mentioned in any of the ten pages.
