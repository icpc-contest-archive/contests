  title: Northern Eurasia Contests
  language:
  - en
  description: |-
    Pages of the Northern Eurasia Contests archive (NEERC), in English, not a site of the Taurida contest alone. Our copy holds 150 saved pages, which are 57 distinct pages, several of them saved under both http and https addresses. They are the 2014 and 2015 archive index pages (links to standings, problem statements, tests, analysis and runs for the finals and the regional contests), final standings of the 2014 and 2015 finals, and the 2014-2015 and 2015-2016 problem statements and problems review PDFs of the finals, together with standings pages of sixteen other subregional contests for each of 2014 and 2015.

    The Taurida pages are twelve standings pages, one for each year from 2014 to 2025, and one statements PDF for 2024. The 2014 Taurida page is the scoreboard of the 2014-2015 Taurida Subregional Contest. The Northern subregional statements and analysis PDFs for 2014 and 2015 are also in our copy. Many pages of the site linked from these pages (tests, archives, runs) are not in our copy.
