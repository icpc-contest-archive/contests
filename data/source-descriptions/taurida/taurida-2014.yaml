  description: |-
    Final scoreboard of the Taurida Subregional Contest of ACM ICPC 2014-2015 (NEERC), headed Practice Session, with a clock reading 5:00:00 of 5:00:00 and status over. It lists 37 teams with rank, team name and institution with a team number and three team members, a column for each of the eleven problems A to K, the number of problems solved and the penalty time. Each problem cell gives the minute of the accepted run with a plus sign and the number of earlier rejected runs, or the number of rejected runs with a minus sign, or a dot for no attempt. Five teams share rank 33 with no problem solved.

    The table ends with rows for total runs, accepted, rejected, first accept and last accept per problem. Taurida V.I. Vernadsky National University is in first place with nine problems and penalty time 1419. The page carries no date and no medal marks.
