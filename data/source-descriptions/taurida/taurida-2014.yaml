  description: |-
    Problem set as a PDF of 14 pages, in English, headed ACM ICPC 2014-2015, NEERC, Northern Subregional Contest, St Petersburg, November 8, 2014. It holds eleven problems, A Alarm Clock to K Kebab House. Each problem gives the input and output file names, a time limit (2 seconds, except 10 seconds for one problem) and a memory limit, the statement, the input and output format and one or more examples. The cover names the Northern subregional contest and not Taurida; the eleven problem titles are the same as the problem column titles of the Taurida scoreboard. No test data or solutions.
