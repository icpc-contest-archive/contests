  title: Northern Eurasia Contests
  language:
  - en
  description: |-
    Pages of the Northern Eurasia Contests website (the NERC archive), in English with some Russian labels. Our copy holds 150 files, 81 HTML pages and 69 PDFs; many pages are saved under both an http and an https address. They are the archive index, the year pages 1996 to 2001, the year pages of 2024 and 2025 listing the regional contests of each season with links to standings, statements, analyses and handbooks, the standings of the 2024 and 2025 Northern Eurasia Finals, standings of regional contests of 2024 and 2025, and statements, tutorials and handbooks as PDFs.

    For the Taurida Regional Contest the copy has a standings page for each year from 2014 to 2025 (the 2014 page is headed as a practice session) and a statements PDF for 2024. The 2024 year page links the Taurida standings, statements and a file of all runs; the 2025 year page links standings and runs. The run files are not in our copy. The site covers all regions and is not specific to Taurida.

    The 2024 brochure PDF and five statements PDFs (Azerbaijan 2024 in English and in Russian, Kazakhstan 2024 qualification in Russian, Northwestern Russia 2024 qualification in English and in Russian) stop at 1 MiB or 5 MiB and cannot be opened.
