  title: ТНУ им. В.И. Вернадского. Система ejudge
  language:
  - ru
  - en
  description: |-
    Website of the ejudge system at V.I. Vernadsky Crimean Federal University, in Russian and English. Our copy holds 71 pages. The page of the 2025 Taurida Regional Contest is headed ICPC 2025-2026, The 2025-2026 Northern Eurasia Programming Contests, Taurida Regional Contest, 15 november 2025, Simferopol. It gives a practice round from 11:00 to 11:45 and the contest from 12:00 to 17:00, a link to a contestant handbook PDF, links to the standings of the Taurida contest, eight other regional contests and an all-regions board, and a list of 17 registered teams with university, coach and contestants. The handbook PDF is not in our copy and the standings links lead to another server.

    The site also keeps a page of the same kind for each year from 2014 to 2024, eleven pages in all; the one headed 8 November 2014 carries a results table of teams with solved problems and time. The remaining pages belong to other events of the host: the municipal and regional stages of the school olympiad in informatics, team olympiads of Crimean schools, an institute championship of 2024 and student olympiad stages of 2013, with ejudge standings pages for some of them.

    Another 50 saved addresses, registration and client pages of the system, hold only an access denied or service unavailable message and are not counted as pages.
