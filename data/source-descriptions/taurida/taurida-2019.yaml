  read: '2026-11-16'
  rubric: 1
  copy: taurida/taurida-2019/website/2026-09-05-wayback-88d7fcfd
  title: Northern Eurasia Contests
  language:
  - en
  description: |-
    Pages of the Northern Eurasia Contests archive (headed NERC on the 2019 and 2020 year pages), in English, shared by many contests; it is not a site of the Taurida contest alone. Our copy holds 150 pages (HTML and PDF), many of them the same address fetched under http, https and port 80. The 2019 year page lists material of the Northern Eurasia finals (standings, problems, jury archive, analysis) and of the North-Western Russia regional contest and its qualifier; for Taurida and the other regions it says no information is available. The 2020 year page is nearly empty: a single heading for North-Western Russia reading no information is available.

    Even so, the copy holds the Taurida standings pages for 2014 (a practice session) through 2025, among them the 2019-2020 board (thirteen problems A to M, 17 teams). Beside them are the standings of other regional contests of 2019 and 2020, statements PDFs for the 2019 finals, the 2019 North-Western Russia qualifier and regional contest, the 2020 finals (online and onsite) and the 2020 North-Western Russia regional contest, tutorials for several of these, and a 2024 Taurida statements PDF.

    Year pages for 1996 to 2016 are also held; those for 2017, 2018 and 2021 to 2025 are not in our copy.
