  title: Northern Eurasia Contests
  language:
  - en
  - ru
  description: |-
    Archive site of the Northern Eurasia Contests (title: Northern Eurasia Contests), in English with a few Russian labels, covering the whole Northern Eurasia regional system and not the Taurida contest alone. The page of the NERC 2022 season exists in two captures that differ. The later one lists the final standings, problems in PDF, problem analysis, jury archive and runs for the final, and under Regional Contests the standings of Armenia, Azerbaijan, Georgia, Kazakhstan, Northwestern Russia, Taurida, Ural and Uzbekistan, with the contestant handbook, opening announcements, qualifier material and the statements, tutorials, tests and runs of the Northwestern Russia contest; the earlier one lists only Northwestern Russia, Ural, Taurida, Kazakhstan and Armenia with standings, with no handbook and no Uzbekistan.

    Our copy holds 150 files, many of them saved under both http and https addresses. They are the archive index pages from 1996 to 2025, the season pages of 2022 and 2023 and, under them, standings of the regional contests, statements and tutorial PDFs and a 2023 brochure, and the Taurida standings pages for 2014 to 2025 with a statements PDF for 2024. For this edition the Taurida part is one standings page, saved under two addresses: the standings of the ICPC 2022-2023 Taurida Regional Contest, with 4 teams and problems A to N. The site's own Taurida page is not in our copy, and no page of our copy has a registration, schedule or team list for it.
