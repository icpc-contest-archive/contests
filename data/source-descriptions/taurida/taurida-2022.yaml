  description: |-
    Final scoreboard of the ICPC 2022-2023 Taurida Regional Contest, with the clock at 5:00:00 of 5:00:00 and status over: 4 teams, all labelled Crimean FU with a team name and three member names, and 14 problems A to N. Per problem a team has a plus with the time of the accepted run in minutes and seconds (and the number of earlier rejected runs after the plus), a minus with the number of rejected runs when unsolved, or a dot when it made no runs. The last columns give problems solved and penalty time; first place solved 5 problems with 395. The third team's name is preceded by an asterisk that the page does not explain.

    Below the teams, summary rows give per problem the total runs, accepted, rejected, first accept time and last accept time. Problems A, B, C, L and N have accepted runs, D, K and M have only rejected runs, and the other six problems have no runs. No institution column and no medals.
