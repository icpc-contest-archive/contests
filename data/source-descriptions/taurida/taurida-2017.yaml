    Final scoreboard of the Taurida Subregional Contest, in the NEERC scoreboard format: 25 teams, twelve problems A to L, with rank, team name, a cell per problem showing accepted or rejected runs and the time of acceptance, the number solved and the penalty time. The clock reads 5:00:00 of 5:00:00 and the status is over. The first-place team, from V.I. Vernadsky Crimean Federal University, solved 8 problems with 985 penalty minutes; the other teams come from that university, Sevastopol State University and Crimean Engineering-Pedagogical University, and three teams share rank 23 with no problem solved. Below the teams, rows give total runs, accepted, rejected, first accept and last accept per problem. A Show time control switches the times on and off.
