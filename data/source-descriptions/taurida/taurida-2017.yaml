    Problem set as a PDF of 12 pages in English, with twelve problems A to L (A Auxiliary Project to L Little Difference). Every page carries the running header for the ICPC 2017-2018 NEERC Northern Subregional Contest, St Petersburg, November 4, 2017, which names that contest and not Taurida. Each problem gives its input and output file names, time limit and memory limit, a statement, input and output formats, and at least one sample. No test data or solutions.
