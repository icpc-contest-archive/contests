- url: https://neerc.ifmo.ru/subregions/taurida.html
  read: '2026-11-16'
  rubric: 1
  copy: taurida/taurida-2017/website/2026-09-05-wayback-88d7fcfd
  title: Northern Eurasia Contests
  language:
  - en
  description: |-
    Pages of the Northern Eurasia Contests archive (NEERC), in English, shared by many contests; it is not a site of the Taurida contest alone. Our copy holds 149 pages (HTML and PDF), many of them the same address fetched under http, https and port 80. The year index pages for 2017 and 2018 link to the final standings, problem statements, tests, jury archive and analysis of the Northern Eurasia Finals and to the standings and files of the regional contests; index pages for 1996 and 1997 are also held.

    For Taurida it holds the standings pages for 2014 (a practice session) through 2025, among them the 2017 board in NEERC scoreboard format (twelve problems A to L, 25 teams), and a statements PDF for 2024. Beside them are the standings of other regional contests of 2017 and 2018, a 14-page problem set and a 14-page analysis of the 2017-2018 Northern Eurasia Finals, the 2018 Finals statements, analysis and a 101-page review, and Northern Subregional statements and analyses for 2017 and 2018, the analyses partly in Russian.

    The 2018 jury archive zip and the index pages for 1998 to 2009 are not in our copy. One copy of the 2017 Northern analysis PDF is cut short at 1048576 bytes; another copy, of 61 pages, is complete.
