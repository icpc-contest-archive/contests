  copy: taurida/taurida-2018/website/2026-09-05-wayback-88d7fcfd
  title: Northern Eurasia Contests
  language:
  - en
  description: |-
    Pages of the Northern Eurasia Contests archive (NEERC, headed NERC on the 2018 and 2019 year pages), in English, shared by many contests; it is not a site of the Taurida contest alone. Our copy holds 149 pages (HTML and PDF), many of them the same address fetched under http, https and port 80. The 2018 year page lists, for the Northern Eurasia finals, links to standings, problems, jury archive, analysis, review slides and runs, and for the regional contests a block per region; its Taurida block has only a Standings link. The 2019 year page lists only regional contests and says no information is available for Taurida. Year pages for 1996 to 2006 are also held.

    For Taurida the pages hold standings for 2014 (a practice session) through 2025, among them the 2018-2019 board (twelve problems A to L, 25 teams), and a statements PDF for 2024. Beside them are standings of other regional contests of 2018 and 2019, the 2018 finals statements, analysis and a 101-page review, the 2019 finals statements and tutorial, and Northern Subregional statements and analysis for 2018.

    The 2018 jury archive zip and the year pages for 2007 to 2017 are not in our copy.
