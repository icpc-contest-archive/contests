  description: |-
    Problem set as a PDF of 13 pages in English, with twelve problems A to L (A Accumulator Battery to L LED-led Paths). Every page carries the running header for the ICPC 2018-2019 NEERC Northern Subregional Contest, St Petersburg, October 27, 2018, which names that contest and not Taurida. Each problem gives a time limit and memory limit, a statement and at least one example; eleven give input and output formats, and problem I is interactive and gives an interaction protocol instead. No test data or solutions.
