  title: Standings
  language:
  - en
  teams: 7
  problems: 14
  times: true
  tries: true
  description: |-
    Final scoreboard of the ICPC 2021-2022 Taurida Regional Contest, with the clock at 5:00:00 of 5:00:00 and status over: 7 teams, all labelled Crimean FU with a team name and three member names, and 14 problems A to N. Per problem a team has a plus with the time of the accepted run in minutes and seconds (and the number of earlier rejected runs after the plus), a minus with the number of rejected runs when unsolved, or a dot when it made no runs. The last columns give problems solved and penalty time; first place solved 4 problems with 173.

    Below the teams, summary rows give per problem the total runs, accepted, rejected, first accept time and last accept time. Only problems A, B, H and L have accepted runs; C, K and N have only rejected runs, and the other seven problems have no runs. No institution column and no medals.
