- url: https://neerc.ifmo.ru/subregions/taurida.html
  read: '2026-11-16'
  rubric: 1
  copy: taurida/taurida-2021/website/2026-09-05-wayback-88d7fcfd
  title: Northern Eurasia Contests
  language:
  - en
  - ru
  description: |-
    Archive site of the Northern Eurasia Contests (title: Northern Eurasia Contests), in English with a few Russian labels, covering the whole Northern Eurasia regional system and not the Taurida contest alone. The page of the NERC 2021 season exists in two captures that differ. The later one lists the final standings, problems in PDF, jury archive, problem analysis and runs for the final, and under Regional Contests the standings of Armenia, Azerbaijan, Georgia, Kazakhstan, Northwestern Russia, Taurida and Ural, with the contestant handbook, opening announcements and statements, tutorials, tests and runs of the Northwestern Russia contest; the earlier one has no handbook and gives no information for Georgia.

    Our copy holds 150 files, many of them saved under both http and https addresses. They are the archive index pages from 1996 to 2025, the season pages of 2021 and 2022 and, under them, the standings of the regional contests, statements and tutorial PDFs, and the Taurida standings pages for 2014 to 2025 with a statements PDF for 2024. For this edition the Taurida part is one standings page, saved under two addresses: the standings of the ICPC 2021-2022 Taurida Regional Contest, with 7 teams and problems A to N. The site's own Taurida page is not in our copy, and no page of our copy has a registration, schedule or team list for it.
- url: https://nerc.itmo.ru/archive/2021/taurida/standings.html
  read: '2026-11-16'
  rubric: 1
