  description: |-
    Statements of 14 problems A to N as a PDF of 20 pages in English, headed on every page ICPC 2021-2022 North-Western Russia Regional Contest, Online, December 11, 2021; the name Taurida does not occur in it. Each problem has time and memory limits, the statement and sample tests; thirteen have input and output format sections and problem I, which is interactive, has an interaction protocol instead. The problem names are Anno Domini 2022, Boris and Berta, Clean Up! and so on to New White-Black Tree.
