    Standings of the 2021 ICPC Taurida Regional Contest: 7 teams, each with rank, team name, institution, problems solved, time and a citation. All seven are teams of V.I. Vernadsky Crimean Federal University. The first three carry the citations First Place, Second Place and Third Place and the other four Honorable Mention; the first three each solved 4 problems and are ordered by time, the first with 173. No per-problem results.
