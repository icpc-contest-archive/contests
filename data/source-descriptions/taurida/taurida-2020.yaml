  description: |-
    Statements of 14 problems A to N as a PDF of 18 pages in English, headed on every page ICPC 2020-2021 North-Western Russia Regional Contest, Russia, St Petersburg, November 14, 2020; the name Taurida does not occur in it. Each problem has time and memory limits, the statement and sample tests; twelve have input and output format sections and the two interactive problems, C and L, have an interaction protocol instead. Problem A opens with a list of the winners of the St Petersburg regional contest from 1995 to 2019. The problem names are Archivist, Bicycle, Corrupted Sort, Display and so on to Nunchucks Shop.
