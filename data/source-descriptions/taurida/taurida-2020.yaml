  - en
  contest_date: '2020-11-14'
  description: |-
    Website of the Ejudge system of V.I. Vernadsky Crimean Federal University (КФУ им. В.И. Вернадского. Система ejudge), mostly in Russian. It holds the page of the ICPC 2020-2021 Taurida Regional Contest, part of the Northern Eurasia Programming Contests, held on 14 November 2020 in Simferopol: a schedule (video-conference gathering, practice round, contest 12:00 to 17:00, problem analysis by ITMO at 18:00), links to the contest rules, the contestant handbook and the standings, and a table of the 8 registered teams with university, coach and contestants.

    Our copy holds 150 files from the whole host, and most of them have nothing to do with this contest: 65 pages of the 2020 municipal stage of the school olympiad in informatics (results per city and district), the regional stage of the school olympiad of 2020 and 2021, school team rounds, semester course results, and pages from 2013 to 2018. The Taurida page of 2021 (11 December 2021, with its own team list) and an English contestant handbook of 4 pages for the 2021 edition are also in it, as are Taurida pages of 2014 and 2015. The links on the 2020 Taurida page to the standings and the rules lead to other servers, and its handbook file is not in our copy.
