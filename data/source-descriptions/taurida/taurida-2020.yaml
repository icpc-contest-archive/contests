  description: |-
    Final scoreboard of the ICPC 2020-2021 Taurida Regional Contest, with the clock at 5:00:00 of 5:00:00 and status over: 8 teams, all labelled CFUV with a number and three member names, and 14 problems A to N. Per problem a team has a plus with the time of the accepted run in minutes and seconds (and the number of earlier rejected runs after the plus), a minus with the number of rejected runs when unsolved, or a dot when it made no runs. The last columns give problems solved and penalty time; first place solved 8 problems with 830.

    Below the teams, summary rows give per problem the total runs, accepted, rejected, first accept time and last accept time. Problems G, H, J, K and L have no runs and problem E has no accepted run. No institution column and no medals.
