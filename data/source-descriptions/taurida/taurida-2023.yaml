  copy: taurida/taurida-2023/website/2026-09-05-wayback-88d7fcfd
  title: Northern Eurasia Contests
  language:
  - en
  description: |-
    Pages of the Northern Eurasia Contests website (the NERC archive), in English with some Russian labels. Our copy holds 150 files, 90 HTML pages and 60 PDFs; many pages are saved under both an http and an https address. They are the archive index, the year pages 1996 to 2008, the year pages of 2023 and 2024 listing the regional contests of each season with links to standings, problems, analyses and a brochure, the standings of the 2023 and 2024 Northern Eurasia Finals, the 2023 standings of the Astana, Siberian and St Petersburg sites of the finals and of the Open Championship of Southern Caucasus, and standings of regional contests, with statements, tutorials and handbooks as PDFs.

    For the Taurida Regional Contest the copy has a standings page for each year from 2014 to 2025 (the 2014 page is headed as a practice session) and a statements PDF for 2024. The 2023 year page links only the standings of Taurida; the 2024 year page also links statements and a file of all runs, which is not in our copy. The site covers all regions and is not specific to Taurida.

    The two brochure PDFs (2023 and 2024) and five statements PDFs of regional contests (Azerbaijan 2024 in English and in Russian, Kazakhstan 2024 qualification in Russian, Northwestern Russia 2024 in English and in Russian) stop at 1 MiB or 5 MiB and cannot be opened.
