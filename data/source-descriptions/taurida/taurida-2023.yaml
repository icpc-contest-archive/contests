  description: |-
    Problem set as a PDF of 13 pages in English, headed ICPC 2023-2024 Northwestern Russia Regional Contest, St Petersburg, November 5, 2023: thirteen problems A to M, from Axis-Aligned Area to Missing Vowels, one statement each with time and memory limits and at least one example. Twelve problems give input and output formats; problem I is interactive and gives an interaction protocol instead. No test data or solutions. The cover names the Northwestern Russia contest, not Taurida.
