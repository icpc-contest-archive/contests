  description: |-
    Final scoreboard of the Taurida Subregional Contest of ACM ICPC 2015-2016 (NEERC), with a clock reading 5:00:00 of 5:00:00 and status over. It lists 30 teams with rank, institution with a team number and three team members, a column for each of the twelve problems A to L, the number of problems solved and the penalty time. Each problem cell gives the minute of the accepted run with a plus sign and the number of earlier rejected runs, or the number of rejected runs with a minus sign, or a dot for no attempt. Three teams share rank 28 with no problem solved.

    The table ends with rows for total runs, accepted, rejected, first accept and last accept per problem. The first place goes to a team of V.I. Vernadsky Crimean Federal University with eight problems and penalty time 937. The page carries no date and no medal marks. Team names are not shown, only the institution and number.
