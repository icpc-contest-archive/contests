  description: |-
    Problem set as a PDF of 12 pages, in English, headed Regional Olympiad of Students, St Petersburg, October 24, 2015. It holds twelve problems, A Alex Origami Squares to L Lucky Chances. Each problem gives the input and output file names, a time limit of 2 seconds, a memory limit, the statement, the input and output format and one or more examples. The cover names a St Petersburg olympiad and not Taurida; the twelve problem titles are the same as the problem column titles of the Taurida scoreboard. No test data or solutions.
