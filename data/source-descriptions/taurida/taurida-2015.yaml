    Standings of the 2015 Taurida Subregional Contest: 29 teams with rank, team name, institution, problems solved, time and a citation. Places 1 to 14 carry the citations First Place to Fourteenth Place and the other 15 teams are marked Honorable Mention; two teams share rank 28 with no problem solved. The team in first place is Taurida #1 of V.I. Vernadsky Crimean Federal University with 8 problems and time 937. There is no per-problem detail. It lists one team fewer than the scoreboard of the same contest.
