  title: Northern Eurasia Contests
  language:
  - en
  description: |-
    Pages of the Northern Eurasia Contests archive (NEERC), in English, not a site of the Taurida contest alone. Our copy holds 150 saved pages, which are 59 distinct pages, several of them saved under both http and https addresses. They are the 2016 and 2017 archive index pages (links to standings, problem statements, tests, analysis and runs for the finals and the regional contests), final standings of the 2016 and 2017 finals, statements, review and analysis PDFs of the finals for those years, and standings pages of sixteen other subregional contests for each of 2016 and 2017.

    The Taurida pages are twelve standings pages, one for each year from 2014 to 2025, and one statements PDF for 2024. The 2016 Taurida page is the scoreboard of the 2016-2017 Taurida Subregional Contest. The Northern subregional statements and analysis PDFs for 2016 and 2017 are also in our copy. Many pages of the site linked from these pages (tests, archives, runs) are not in our copy.
