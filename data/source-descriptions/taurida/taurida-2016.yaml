  description: |-
    Problem set as a PDF of 12 pages, headed on every page "ACM ICPC 2016–2017, NEERC, Northern Subregional Contest" and "St Petersburg, October 22, 2016". It holds eleven problems, A to K: Anniversary Cake, Boys and Girls, CodeCoder vs TopForces, Digital Addition, Easy Reading, Folding, Gangsters in Central City, Hard Cuts, Integral Polygons, Java2016 and King’s Heir. Each problem has a statement in English, the input and output file names, a time limit of 2 seconds and a memory limit, input and output format, and one or more examples; the pages are numbered "Page N of 12". No solutions or test data.

    The copy names the Northern Subregional Contest in St Petersburg and does not mention Taurida.
