  description: |-
    Final scoreboard of the Taurida Subregional Contest of ACM ICPC 2016-2017 (NEERC). It lists 30 teams with rank, institution with a team number and team members, a column for each of the eleven problems A to K, the number of problems solved and the penalty time. Each problem cell gives the minute of the accepted run with a plus sign and the number of earlier rejected runs, or the number of rejected runs with a minus sign, or a dot for no attempt. Eight teams share rank 23 with no problem solved.

    The table ends with rows for total runs, accepted, rejected, first accept and last accept per problem. The first place goes to a team of Sevastopol State University with six problems and penalty time 957. The page carries no date and no medal marks. Team names are not shown, only the institution and number.
