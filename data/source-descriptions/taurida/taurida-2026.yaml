  description: |-
    Page of the Taurida Regional Contest on the Northern Eurasia Contests website, in English, with the rest of that site. Our copy holds 125 pages (113 HTML pages and 12 PDFs). The Taurida page gives the participating regions (the Republic of Crimea and the city of federal importance Sevastopol), the contest date as "14 Nov, 26", the host university (V.I. Vernadsky Crimean Federal University), a link to its home page, contacts of the contest director and chief judge, and an archive from 2014 to 2026 with a link to the standings of each year, the 2024 statements and the runs of 2024 and 2025.

    The other pages are shared by all regions: the contest rules, a page of regional quotas, the page of each of the other 17 regional contests, pages of the Northern Eurasia Finals and of the earlier NEERC contests from 1995, the archive page of each year from 1996 to 2026, and the standings of the Taurida contest for each year from 2014 to 2026. The runs of 2024 (zip) and 2025 (7z) are in our copy, with 11 other PDFs: statements of the Northern Eurasia Finals and of the earlier NEERC contest, 2015 to 2025.

    Ten addresses were not found when saved: six sponsor logos, two contact photos and two 2026 archive addresses. Our copy has no problem statements of the 2026 Taurida contest.
