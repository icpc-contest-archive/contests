  description: |-
    Problem 4666, 'Airport', as a two-page statement PDF with the region line 'Asia - Hefei - 2009/2010'. Spherical aircraft with given radii, start and destination points, start times and speeds move in straight lines in 3D; the task is to output when the first collision happens, to two decimals, or the word Never (up to 1000 aircraft). The statement has input and output formats and a sample with five cases. No problem letter is printed. The statement ends with the line 'Hefei 2009-2010'.
