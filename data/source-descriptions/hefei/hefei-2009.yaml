  title: 4669 - Laser in Cuboids
  language:
  - en
  problems: 1
  pages: 1
  description: |-
    Problem 4669, 'Laser in Cuboids', as a one-page statement PDF with the region line 'Asia - Hefei - 2009/2010'. A laser beam runs between opposite vertices of an a x b x c cuboid made of unit cubes, and the task is to count the unit cubes it passes through, with edge lengths below 10^6. The statement has a figure of the cuboid, input and output formats, and a sample with three cases. No problem letter is printed. The statement ends with the line 'Hefei 2009-2010'.
