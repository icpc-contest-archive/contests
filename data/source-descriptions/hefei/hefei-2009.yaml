  description: |-
    Final standings of the on-site contest as published on the USTC site, in Chinese and English: 102 teams with school rank, rank, school, team name, problems solved, time and award. Ten teams have a Gold Medal, 20 a Silver Medal, 30 a Bronze Medal and 35 an Honorable Mention; seven teams marked with an asterisk in the rank column have no award. The first place is Sun Yat-sen University's SYSU_Blover with six problems. No per-problem results and no attempt counts.
