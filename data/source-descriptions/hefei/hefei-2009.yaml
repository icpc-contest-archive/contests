  title: 4667 - Mersenne Prime
  language:
  - en
  problems: 1
  pages: 1
  description: |-
    Problem 4667, 'Mersenne Prime', as a one-page statement PDF with the region line 'Asia - Hefei - 2009/2010'. After a short introduction to Mersenne numbers and primes, the task is to say for each given exponent n (below 258) whether 2^n - 1 is prime, printing Prime or NotPrime after the number. The statement has input and output formats and a sample with four exponents. No problem letter is printed. The statement ends with the line 'Hefei 2009-2010'.
- url: https://icpcarchive.ecs.baylor.edu/external/46/4668.pdf
  read: '2026-11-23'
  rubric: 1
  copy: hefei/hefei-2009/judge-livearchive/20150309-wayback-7ceab387/4668.pdf
  title: 4668 - Bubble Breaker
  language:
  - en
  problems: 1
  pages: 2
  description: |-
    Problem 4668, 'Bubble Breaker', as a two-page statement PDF with the region line 'Asia - Hefei - 2009/2010'. It explains the rules of the mobile-phone bubble-breaking game and a colour-priority strategy; given a board of up to 16 rows and 11 columns with five colours, the task is to compute the final score that strategy reaches. The statement has input and output formats and a sample with two cases. No problem letter is printed. The statement ends with the line 'Hefei 2009-2010'.
