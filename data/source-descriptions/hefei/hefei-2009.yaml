  read: '2026-11-23'
  rubric: 1
  copy: hefei/hefei-2009/judge-livearchive/20150309-wayback-13eb4676/4670.pdf
  title: 4670 - Dominating Patterns
  language:
  - en
  problems: 1
  pages: 1
  description: |-
    Problem 4670, 'Dominating Patterns', as a one-page statement PDF with the region line 'Asia - Hefei - 2009/2010'. Given up to 150 lowercase patterns and a long text (up to 10^6 characters), the task is to output the highest number of occurrences and the pattern or patterns reaching it, in input order. The statement has input and output formats and a sample with two cases. No problem letter is printed. The statement ends with the line 'Hefei 2009-2010'.
- url: https://icpcarchive.ecs.baylor.edu/external/46/4671.pdf
  read: '2026-11-23'
  rubric: 1
  copy: hefei/hefei-2009/judge-livearchive/20150309-wayback-0d3d2738/4671.pdf
  title: 4671 - K-neighbor substrings
  language:
  - en
  problems: 1
  pages: 1
  description: |-
    Problem 4671, 'K-neighbor substrings', as a one-page statement PDF with the region line 'Asia - Hefei - 2009/2010'. It defines the Hamming distance and K-neighbor strings; given K and two strings A and B over the letters a and b (length up to 100,000), the task is to count the distinct substrings of A that are K-neighbors of B. The statement has input and output formats and a sample with three cases. No problem letter is printed. The statement ends with the line 'Hefei 2009-2010'.
- url: https://icpcarchive.ecs.baylor.edu/external/46/4672.pdf
  read: '2026-11-23'
  rubric: 1
  copy: hefei/hefei-2009/judge-livearchive/20150309-wayback-9e2c6640/4672.pdf
  title: 4672 - New Game
  language:
  - en
  problems: 1
  pages: 2
  description: |-
    Problem 4672, 'New Game', as a two-page statement PDF with the region line 'Asia - Hefei - 2009/2010'. Two players take turns in a directed acyclic graph whose nodes hold non-negative integers, each move taking 1 from a node with a positive integer and adding it to a successor; given the graph and the required sum of all integers, the task is to count the assignments of integers for which the first player cannot win, modulo 1,000,000,007. The statement has input and output formats and a sample with three cases. No problem letter is printed. The statement ends with the line 'Hefei 2009-2010'.
