  contest_date: '2009-10-11'
  description: |-
    Website of the Hefei site of the 2009 Asia regional contest, in Chinese, hosted by the University of Science and Technology of China (the map page shows its campus). Our copy holds 12 pages and one Word file linked as the registration form for the online round. The front page is a news list from 29 July to 12 October 2009: the online round on 6 September from 12:00 to 17:00, the on-site contest on 9 to 11 October, registration instructions with a deadline of 2 September, a note for teams outside mainland China, the list of qualified schools, and the announcement that the results are out. Other pages cover an introduction to the ICPC, the environment (Linux, Java and C/C++, PC^2 judge), the schedule (the on-site contest on 11 October from 08:30 to 13:30, marked as provisional), a map, sponsors and contact details.

    The results are on a separate page, rank.htm, which holds the final standings table. The problems page and the results page of the menu say only that they will be published after the contest, and the page of qualified schools that the front page links to is not in our copy. The site has no problem statements.
