  read: '2026-11-23'
  rubric: 1
  copy: hefei/hefei-2009/judge-livearchive/20150309-wayback-e24fee43/4673.pdf
  title: 4673 - Chinese Paper Cutting
  language:
  - en
  problems: 1
  pages: 5
  description: |-
    Problem 4673, 'Chinese Paper Cutting', as a five-page statement PDF with the region line 'Asia - Hefei - 2009/2010'. It opens with a quotation about paper cutting and a story, then defines the fold and cut instructions of a machine working on a paper up to 100 by 100; the task is to print the final cut design as rows of '@' and '.'. The statement has figures, input and output formats, and a sample with three cases. No problem letter is printed. The statement ends with the line 'Hefei 2009-2010'.
- url: https://icpcarchive.ecs.baylor.edu/external/46/4674.pdf
  read: '2026-11-23'
  rubric: 1
  copy: hefei/hefei-2009/judge-livearchive/20150309-wayback-ab87c537/4674.pdf
  title: 4674 - Post offices
  language:
  - en
  problems: 1
  pages: 2
  description: |-
    Problem 4674, 'Post offices', as a two-page statement PDF with the region line 'Asia - Hefei - 2009/2010'. Villages lie along a highway; at most M post offices (M up to 100) may be built in N villages (N up to 20,000), each with a building cost and a service radius, and an unserved village without a post office costs a compensation. The task is to find the minimum total cost. The statement has input and output formats and a sample with two cases. No problem letter is printed. The statement ends with the line 'Hefei 2009-2010'.
- url: https://icpcarchive.ecs.baylor.edu/external/46/4675.pdf
  read: '2026-11-23'
  rubric: 1
  copy: hefei/hefei-2009/judge-livearchive/20150309-wayback-b652ad54/4675.pdf
  title: 4675 - Super squares
  language:
  - en
  problems: 1
  pages: 2
  description: |-
    Problem 4675, 'Super squares', as a two-page statement PDF with the region line 'Asia - Hefei - 2009/2010'. The towns of a kingdom form a tree of highways with lengths and populations; the task is to choose M mutually connected towns (N up to 2000, M up to 500) for gathering squares so that the total distance all residents travel to the nearest chosen town is as small as possible. The statement has input and output formats and a sample with two cases. No problem letter is printed. The statement ends with the line 'Hefei 2009-2010'.
