  description: |-
    Standings of the Hefei regional contest, in English: 951 teams with rank, team, institution, problems solved, time and citation. The first place is SYSU_Blover of Zhongshan (Sun Yat-sen) University with six problems. 95 teams have a rank, with citations from First Place down to the 66th place; the other 856 teams are listed without a rank and with the citation Honorable Mention, and 858 of the 951 teams solved no problem. The page gives no per-problem results and no attempt counts, and the time column shows 0 for 65 of the 95 ranked teams.
