  title: 4271 - Necklace
  language:
  - en
  problems: 1
  pages: 2
  description: |-
    Problem 4271, 'Necklace', as a two-page statement PDF with the region line 'Asia - Hefei - 2008/2009'. It defines a necklace in an undirected graph as a sequence of edge-disjoint cycles in which adjacent cycles share exactly one vertex and non-adjacent cycles share none; given a graph (up to 10,000 vertices and 100,000 edges) and two vertices S and T, the task is to print YES or NO for whether a necklace between them exists. The statement has input and output formats and a sample with three cases. No problem letter is printed. The end of the statement carries the line 'Hefei 2008-2009' followed by problemsetter and special-thanks credits.
