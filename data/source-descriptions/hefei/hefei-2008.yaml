  title_en: ACM ICPC'08 - Hefei site, China
  language:
  - zh
  - en
  contest_date: '2008-11-16'
  problems: 8
  description: |-
    Website of the University of Science and Technology of China (USTC) for its Hefei site of the 2008 Asia regional contest, in Chinese. Our copy holds 143 pages from the whole acm.ustc.edu.cn host. The 2008 site is there twice: an earlier version of 13 pages whose pages mostly hold only a heading or a few words (the rules page says "to be added", the results page says results follow after the contest), and a later version at the top level. The later one gives news (results and on-site problem download announced), the schedule (online round on 29 September 2008, on-site contest on 16 November 2008 from 09:00 to 14:00 at the West Campus student activity centre), the environment (OpenSolaris, PC^2, Java and C/C++), the rules for allocating on-site slots, and a results page of 103 teams with school order, team order, school, team, problems solved, time and award.

    The problem set is a PDF, The 33rd ACM International Collegiate Programming Contest Asia Regional Contest - Hefei: 15 pages, eight problems A to H, cover dated Nov. 16, 2008.

    Our copy also holds 12 pages and a Word registration form of the 2009 Hefei site, three pages of the 2015 site, a page of a 2012 USTC contest for its own students, 90 pages of the USTC online judge (70 of them forum pages), three pages of a phpBB board and four pages about campus phone apps. Style sheets and images of the contest pages are not in our copy.
