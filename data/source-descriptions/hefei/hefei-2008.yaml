  description: |-
    Scoreboard of the online round of the Hefei regional contest, in Chinese, on a site whose menu lists ranklist pages for contests held in China from 2008 to 2012, some marked as missing. It is marked as last updated 2008-9-29 18:01:16. 598 teams are listed with rank (running from 2 to 599; there is no row for rank 1), team name, problems solved, and for each of problems 1001 to 1009 a time in hours:minutes:seconds with the number of tries in brackets (0:0:0 where unsolved), then a time column and a Total column that adds up the tries. The problem headings carry two numbers each, for example 1001(63/223). Team names are team plus a number; 120 are teamextra plus a number. Problem 1009 has no solves. 209 teams solved at least one problem, and the most any team solved is seven.
