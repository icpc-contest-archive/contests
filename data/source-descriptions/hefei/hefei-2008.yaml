  language:
  - en
  problems: 1
  pages: 1
  description: |-
    Problem 4269, 'A Simple Game', as a one-page statement PDF with the region line 'Asia - Hefei - 2008/2009'. Two players each pick one of N integers at random (N up to 30,000); they win if the product of the two picks is strictly greater than a target T, and the task is to print the winning probability as a reduced fraction a/b. The statement has input and output formats and a sample with two cases. No problem letter is printed. The end of the statement carries the line 'Hefei 2008-2009' followed by problemsetter and special-thanks credits.
