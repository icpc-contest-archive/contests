  title: 4273 - Post Offices
  language:
  - en
  problems: 1
  pages: 2
  description: |-
    Problem 4273, 'Post Offices', as a two-page statement PDF with the region line 'Asia - Hefei - 2008/2009'. Villages lie along a straight highway; at most M post offices (M up to 100) may be built in N villages (N up to 10,000), each with a building cost and a service radius, and an unserved village without a post office costs a compensation. The task is to find the minimum total cost. The statement has input and output formats and a sample with two cases. No problem letter is printed. The end of the statement carries the line 'Hefei 2008-2009' followed by problemsetter and special-thanks credits.
