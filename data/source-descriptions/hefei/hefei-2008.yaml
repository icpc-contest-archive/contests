  problems: 1
  pages: 1
  description: |-
    Problem 4275, 'Rational Number Approximation', as a one-page statement PDF with the region line 'Asia - Hefei - 2008/2009'. Given a fraction a/b and a bound N, the task is to find two fractions with denominators at most N, one not above and one not below a/b, whose difference is as small as possible, printed in lowest terms. The statement has input and output formats and a sample with two cases. No problem letter is printed. The end of the statement carries the line 'Hefei 2008-2009' followed by problemsetter and special-thanks credits.
