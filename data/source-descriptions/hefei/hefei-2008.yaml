  title: 4274 - Programmers
  language:
  - en
  problems: 1
  pages: 2
  description: |-
    Problem 4274, 'Programmers', as a two-page statement PDF with the region line 'Asia - Hefei - 2008/2009'. Each of up to 1000 programmers has a daily work interval given as hh:mm-hh:mm, possibly spanning midnight; two can talk only if their intervals overlap, and the task is to find the largest group in which any two can talk. The statement has input and output formats and a sample with two cases. No problem letter is printed. The end of the statement carries the line 'Hefei 2008-2009' followed by problemsetter and special-thanks credits.
