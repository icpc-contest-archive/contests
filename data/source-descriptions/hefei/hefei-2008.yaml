  problems: 1
  pages: 1
  description: |-
    Problem 4270, 'Discrete Square Roots', as a one-page statement PDF with the region line 'Asia - Hefei - 2008/2009'. Given x, a modulus N below 1,000,000,000 and one known square root r of x modulo N, the task is to list all discrete square roots of x in increasing order. The statement has input and output formats and a sample with two cases. No problem letter is printed. The end of the statement carries the line 'Hefei 2008-2009' followed by problemsetter and special-thanks credits.
