  read: '2026-11-23'
  rubric: 1
  copy: hefei/hefei-2008/judge-livearchive/20150309-wayback-44eda13e/4272.pdf
  title: 4272 - Polynomial-time Reductions
  language:
  - en
  problems: 1
  pages: 2
  description: |-
    Problem 4272, 'Polynomial-time Reductions', as a two-page statement PDF with the region line 'Asia - Hefei - 2008/2009'. Given a network of N problems (up to 100) and M explicit reductions between them (up to 10,000), the task is to find the smallest number of explicit reductions that keeps exactly the same reductions explicit or implicit. The statement has input and output formats and a sample with two cases. No problem letter is printed. The end of the statement carries the line 'Hefei 2008-2009' followed by problemsetter and special-thanks credits.
