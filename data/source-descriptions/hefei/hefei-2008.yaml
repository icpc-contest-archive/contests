  description: |-
    Problem 4276, 'Triangles', as a one-page statement PDF with the region line 'Asia - Hefei - 2008/2009'. Given red, green and blue points in the plane (up to 100 of each, no three collinear), the task is to count the triangles of blue points that contain more red than green points and those that contain more green than red points. The statement has input and output formats and a sample with two cases. No problem letter is printed. The end of the statement carries the line 'Hefei 2008-2009' followed by problemsetter and special-thanks credits.
