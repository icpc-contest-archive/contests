  title_en: The 40th International Collegiate Programming Contest, Asia Regional, Hefei site
  language:
  - zh
  description: |-
    Website of the Hefei site of the 40th ICPC Asia regional contest, in Chinese, with the copyright line of the University of Science and Technology of China. Our copy holds 6 pages: two versions of the home page, the announcements list and three announcements, all published in September 2015, before the contest. The menu names information, services, results and account list entries; all but the account list lead nowhere in our copy.

    The announcements are: the rules of the online round (27 September 2015, 12:00 to 17:00, on the online judge hdoj, problems set by USTC, account requests by e-mail to the organizers, a code similarity check after the round); a list of 144 numbered account requests with school, coach, e-mail address in part masked, and number of accounts; and a note of 19 September on the on-site contest, which has 97 places because of the venue, extra places for the schools setting problems for other sites and supporting the online round, no invited teams, and the ICPC rule on how slots are allocated. The site has no problems, no scoreboard and no on-site results.
