  description: |-
    Scoreboard of the on-site contest, on a site whose pages cover ranklists of Chinese regional contests: 97 team rows with school rank, team rank, school and team name, problems solved, time, and for each of problems A to J the attempts and the time of the solving run (-/- where untried, and attempts with no time where unsolved), then a total of solved and attempted. Of the 97 rows, 94 are ranked 1 to 94; three (two from the University of Science and Technology of China and one named JiSuanKe, each with an asterisk before the team name) show -- in place of both ranks. The header row gives, for each problem, two counts such as 8/35, and a total solved count of 193. A legend marks gold, silver and bronze places and first solves. The first place is Tsinghua University's Excited with seven problems; 89 of the 94 ranked teams solved at least one problem. The page is marked as last updated on 8 November 2015 at 14:10:10.
