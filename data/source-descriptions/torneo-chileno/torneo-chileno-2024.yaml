    News item of 24 October 2024 on the site of the Departamento de Ciencia de la Computación of the Pontificia Universidad Católica de Chile (UC), in Spanish. It says the 5th Torneo Chileno de Programación was held on 5 October at five sites across Chile with 26 teams from eight universities, and names four UC teams with their places: first, third, fifteenth and twenty-first. It adds that the tournament prepares competitors for the ICPC regional on 8 and 9 November in Coquimbo. Only the UC teams are ranked; no other results are given.

