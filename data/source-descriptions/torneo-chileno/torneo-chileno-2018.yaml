  description: |-
    Announcement of the Torneo Chileno de Programación (TCP) on the website of UCM EICI (the Escuela de Ingeniería Civil Informática of the Universidad Católica del Maule), in Spanish. It says the tournament runs together with the Torneo Argentino de Programación on Saturday 29 September 2018, with registration from 10 to 22 September 2018 and a link to the ICPC regional finder page. It covers teams of three students from one institution, the languages C, C++, Java and Python, the eligibility rule (higher studies begun in 2014 or later, or born in 1995 or later), free but compulsory registration, certificates for participants and for the best-ranked teams, and the Talca site address at the Campus San Miguel.

    Our copy holds this one page. It has no schedule, problems or results; the other pages of the site, reached from its menus, are not in our copy.
