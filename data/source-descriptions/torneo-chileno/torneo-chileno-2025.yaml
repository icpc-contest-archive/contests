  contest_date: '2025-10-04'
  description: |-
    News item of 8 October 2025 on the news site of the Universidad Austral de Chile (UACh), in Spanish. It reports that UACh's Instituto de Informática hosted a site of the Torneo Chileno de Programación (TCP 2025) on Saturday 4 October, with three UACh teams and one team from the Universidad de Los Lagos. It quotes the local coordinator that more than 40 teams took part nationally and that two UACh teams solved 4 problems, and says the tournament leads to the ICPC regional of 7 and 8 November in Santiago. It gives no ranking of teams.

    Our copy is the page with the site's menus and a list of other news headlines; the links lead to other pages that are not in our copy.
