  title: ACM ICPC Asia Regional Contest - Shanghai
  language:
  - en
  - zh
  description: |-
    Website of the Asia Regional Contest Shanghai, hosted by Shanghai University, in English with Chinese (GB-encoded) versions of many pages. The front page says the contest had been held on October 21-22, 2000, that 51 teams took part, and names the teams in the first five places. Menu sections cover the regional contest rules, registration, software downloads, links and a call for problems. A Past Years section has one page per edition with team information and final standings for 1996 to 1999, and a 2000-2001 page that holds the final standings in English and Chinese and a detailed standings table.

    The site also holds a problem archive: PDF problem sets of the Shanghai regionals of 1996 to 1999, pages for other ICPC regionals and World Finals, and the 2000 IOI. Our copy has 118 HTML pages and six PDFs. The 2000 problem set (a zip file) and the 2000 team information page are not in it, nor are the About page and the downloadable PC2 software files; some images and offsite links are missing too.
