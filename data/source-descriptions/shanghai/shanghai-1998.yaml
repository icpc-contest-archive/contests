  language:
  - en
  contest_date: '1998-11-28'
  problems: 8
  description: |-
    Problem set as one HTML page, the text of the contest booklet: the header names the 1998-99 ACM International Collegiate Programming Contest sponsored by IBM, Asia Regional Contest/Shanghai, Shanghai University, 28 November 1998, and says the set has eight problems on seventeen numbered pages. Problems A to H follow (Card Shuffling, Puzzle, Container, The Dream Team, Data Mining, Simple Expression, TETRIS, Scoring of the Contest). Each has a statement in English with input and output descriptions and a sample, and each names its input file. No test data or solutions.

    The page title is only 'Problem A'. In seven places a character is replaced by a replacement mark in the page itself, and the ten images the page refers to are not in our copy.
