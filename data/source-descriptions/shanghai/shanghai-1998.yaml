  title: ACM ICPC Asia Regional Contest Shanghai 1998
  language:
  - en
  - zh
  description: |-
    Website of the ACM ICPC Asia Regional Contest in Shanghai, in English; the Past Years pages also exist in a Chinese-language version. The Past Years 1998-1999 section has, for the 1998 contest, a teams page (university, coach and team members), a final standings page (15 ranked teams with team number, problems solved and points, followed by an alphabetical Honorable Mention list of 19 universities) and a page of links to the contest problems. The same standings are on a news page last updated 29 November 1998; the Past Years pages are dated April 1999. The section covers the 1999 contest in the same way, with a photo page, and has pages for the 1997-1998 Shanghai regional.

    Other parts of the site hold problem archives of the ICPC World Finals 1998 and 1999, the IOI 1998 and 1999 and several other regionals (South Pacific, Dhaka, Tokyo, Taipei, Kyoto, Kanpur, Tehran), plus a downloadable GNU Pascal package. Our copy holds 150 files captured at dates from 1999 to 2017: 93 HTML pages, 7 PDFs, 49 images and the package. The problems page for Shanghai 1998 is in our copy, but the problem statements it links to are not, and the Software, Links and Registration pages are missing.
