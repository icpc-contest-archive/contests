  description: |-
    Standings of the Shanghai site as a single HTML page of space-aligned lines, not a table: rank, team number, school, number of problems solved and time used for 15 teams. Korea Advanced Institute of Science and Technology is first with 6 solved and 1026; Tsinghua University, Zhongshan University and the Shanghai Juvenile Science Technology Center each solved 5, and the last team solved 2. Rank numbers run from 1 to 14; the Shanghai Juvenile Science Technology Center line carries no rank number. The list is followed by an alphabetical list of 19 universities under Honorary Participation, without results. No per-problem detail.
