- url: https://icpcarchive.github.io/Asia-East-Continent/Shanghai/The-2025-ICPC-Asia-Shanghai-Regional-Contest/tutorials_zh-cn.pdf
  read: '2026-11-23'
  rubric: 1
  copy: shanghai/shanghai-2025/editorial/20261123-live-5d3cc615/tutorials_zh-cn.pdf
  title: 2025 ICPC 国际大学生程序设计竞赛亚洲区域赛（上海站）
  title_en: 2025 ICPC International Collegiate Programming Contest Asia Regional (Shanghai Site)
  language:
  - zh
  problems: 13
  pages: 29
  description: |-
    Editorial slides in Chinese, a PDF of 29 pages made with LaTeX Beamer. The cover gives the title 2025 ICPC 国际大学生程序设计竞赛亚洲区域赛（上海站） (2025 ICPC International Collegiate Programming Contest Asia Regional, Shanghai Site), the name 清华大学 (Qīnghuá Dàxué, Tsinghua University) and the date November 26, 2025; every slide repeats the university's name and the contest title.

    An overview slide compares the expected order of difficulty (D < GH < BIJ < AE < KLM < CF) with the actual one (DH < AGJ < BI < EK < FLM < C). The solutions follow in that expected order and cover all 13 problems A to M, from a single slide (B, D, G, I, J) to six slides (K); they state the key observations and the algorithm, mostly with its complexity, in prose and formulas without code. The slides for A give two solutions, the second randomised, and the first slide for F describes the original problem from which F was cut down.
