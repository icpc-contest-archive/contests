    Final scoreboard on the XCPCIO board, headed 第 46 届 ICPC 国际大学生程序设计竞赛亚洲区域赛（上海）正式赛 (dì 46 jiè ICPC guójì dàxuéshēng chéngxù shèjì jìngsài Yàzhōu qūyùsài (Shànghǎi) zhèngshì sài, "46th ICPC Asia Regional Contest (Shanghai), official contest"), marked FINISHED after 5:00:00. Thirteen problems A to M, each column head giving the number of teams that solved it; per team it gives place, institution (with the institution's own rank before its first team), team name, solved, penalty, and tries and time per problem, plus Dirt and SE columns. First solves are marked, and tabs switch between all teams, official teams and unofficial (starred) teams. Below the grid are per-problem totals of submissions, attempts and accepted runs and first and last solve times. Tsinghua University's team 重启征途 (Chóngqǐ zhēngtú, "Restart the journey") is first with all 13 problems.

    Our copy shows only the first 32 teams: the remaining rows of the table are empty, as the board fills them in by script. Three of the board's style sheets are missing from our copy. The header prints the start as 2021-11-27 21:00:00 CST and the end as 2021-11-28 02:00:00 CST.
