  description: |-
    Editorial slides in Chinese, a PDF of 67 pages titled 2021 ICPC(上海) 试题分析 (shìtí fēnxī, "problem analysis"), with 11月28日 ("28 November") on the title slide. It covers all 13 problems A to M, from A Strange Functions to M Harmony in Harmony, with problem L titled Three,Three,Three.

    Each problem opens with a title slide headed 2021 ICPC(Shanghai) that names the techniques involved (for A, computational geometry and half-plane intersection), followed by a restatement of the task and the solution with formulas, proofs and complexity. The last slides give the closed-form answer to problem M. No author is printed on the slides.
