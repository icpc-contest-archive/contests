  description: |-
    Final standings of the 2001-2002 Asia Regional Contest Shanghai, on the host site's Past Years page, with the site's menu and links to the teams information, the contest problems and a Chinese version; last updated November 18, 2001. The table is the same as on the stand-alone copy: 38 teams with rank, team name, number of problems solved and penalty, with a solved count for 18 teams and a penalty for eleven. The best women team and a list of 20 honorable mention teams follow. One difference: team ATO is given here as University of Science and Technology of China, where the other page gives University of Shanghai for Science and Technology. The page title still reads 2000-2001 Finalstandings. The teams information page it links to is not in our copy.
