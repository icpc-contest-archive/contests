    Problem set as a Microsoft Word file whose document properties give the title Problem Set for ACMICPC/Shanghai and the author Shanghai University ACM/ICPC Team. It has the same eight problems A to H as the PDF problem set, from Gnome Tetravex to Fishing Net, each with an input file name, a statement, an input and output description and a sample input with its output, and a page header naming Shanghai University, China, November 18, 2001 and IBM as sponsor. Figures are embedded as pictures. Our copy is the binary Word file as it was served.
