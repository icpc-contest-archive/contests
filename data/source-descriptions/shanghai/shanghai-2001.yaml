- url: http://acm.shu.edu.cn/
  read: '2026-11-16'
  rubric: 1
  copy: shanghai/shanghai-2001/website/2026-10-20-wayback-7a4fe814
  title: ACM ICPC Asia Regional Contest - Shanghai
  language:
  - en
  - zh
  description: |-
    Website of the ACM International Collegiate Programming Contest Asia Regional Contest Shanghai, hosted by Shanghai University, in English with a Chinese version of the pages. The front page, last updated November 20, 2001, reports that the contest was held on November 17-18, 2001 with 58 teams, names the first three places and the best women team, and links the final standings and the contest problem set. Our copy holds 127 pages and seven images; sixteen further addresses returned errors.

    The site also has the Asia-specific regional contest rules dated July 1, 2001, an online registration page, a software download page, a list of internet links and a call for problems. Past Years pages cover the Shanghai contests of 1996 to 1999, each with a page of teams and team members, final standings and problems. A problem archive collects problem sets of ICPC World Finals, of regional contests in Asia, North America and other regions, and of other contests; the 2001 problem set is a Word file.

    The About page, the teams information page of 2001 and the PC^2 software archives linked from the software page are not in our copy.
