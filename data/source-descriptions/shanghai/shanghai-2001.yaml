  description: |-
    Page titled View Standings and headed The 2001 ACM Asia Programming Contest - Shanghai sponsored by IBM: 60 teams in three columns, rank, team (institution, then team name) and citation. The 35 teams with a rank carry a number from 1 to 12; the citation names First to Twelfth Place for 16 of them, Best Women Team for one and a dash for 18. 25 further teams have no rank and are marked Honorable Mention. Tsinghua University, team Tsinghua LML, is first. There are no solved counts or times. Two team names are written in Chinese characters.
