  description: |-
    Final standings page headed 2001-2002 ACM/ICPC Asia Regional Contest Shanghai, Final Standings, as a stand-alone page without the site's menu: 38 teams with rank, team name (institution and team), number of problems solved and penalty. Tsinghua University - LML is first with 7 problems solved. The rank column carries a number from 1 to 12 on some rows and a dash on others. Eighteen teams have a solved count and eleven of them a penalty; the others show dashes. Below the table are the best women team and an alphabetical honorable mention list of 20 more teams without results. There is no per-problem detail.
