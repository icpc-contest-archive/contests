  description: |-
    Standings of The 2004 ACM Asia Programming Contest - Shanghai, sponsored by IBM, in three tables. The Final Round of 12/5/2004 lists 67 teams with rank, institution and team name and a citation: 36 teams have a rank (First to Twenty-sixth Place) with number of problems solved and time, and 31 more are listed as Honorable Mention without a rank or results. Shanghai Jiaotong University, team Accelerator, is first with 6 problems and 774. Two preliminary-site tables follow, Nationwide Preliminaries with 242 teams and Foreign-Non-Mainland Teams with 12, all marked Honorable Mention and given without results.
