  rubric: 1
  copy: shanghai/shanghai-2004/website/2026-09-05-wayback-fb6cfa45
  title: Shanghai Jiao Tong University ACM-ICPC Homepage
  language:
  - zh
  - en
  contest_date: '2004-12-05'
  description: |-
    Website of the Shanghai Jiao Tong University ACM-ICPC team, the host of the 29th ACM International Collegiate Programming Contest Asia-Shanghai Regional Contest, mostly in Chinese. Our copy holds 110 pages, captured on different dates from 2004 to 2026. The pages of 2004 cover the contest: rules (one page also in English), the organising committee, the schedule of December 3 to 6, the computer environment, the registration procedure, contact details, directions to the campus, news lists, and a results page of 70 teams (36 ranked, 34 honorable mention) with rank, school, team, problems solved and time.

    A problem archive page links the problems and test data of the preliminary and final rounds, with their standings. Our copy holds the standings of the final round (70 teams) and of the preliminary round (268 teams with solved count, score and attempts and time for problems A to H), a zip archive for each round with the problem PDF and test data (the final round archive also has solutions), and material of a 2004 university programming contest of the team: a 2-page PDF paper test, a zip archive of round 2 and its standings.

    Most other pages are of later years: the ACM Class pages (introduction, news, courses), pages on the team's history and photographs, an online judge, course pages and a web server default page.
