  description: |-
    Statement of one problem, headed "3262 - Different Digits" with the line "Asia - Shanghai - 2004/2005", as a PDF of one page. The task is to find, for a given n below 65536, the smallest multiple of n that uses the fewest different decimal digits; a line with 0 ends the input. It has the input and output format and a sample input and output, and a running footer with the problem number and title and the page count (the page also reads "Shanghai 2004-2005"). No problem letter is printed.
