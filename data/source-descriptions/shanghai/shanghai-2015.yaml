  contest_date: '2015-11-22'
  description: |-
    Website of the East China University of Science and Technology (ECUST) for the 2015 ACM-ICPC Asia Regional Contest in Shanghai, in Chinese. Its home page is headed Kuark Finance Cup ACM/ICPC (Shanghai) 2015 Asia Regional Contest @Shanghai and holds an introduction to the contest, its history, short rules and an explanation of regional contests and the World Finals. Our copy has two versions of the home page: an earlier one with a notice dated 2015-09-28 (invitation and registration form, allocation of onsite places) and a later one marked as ended on 2015-11-22, with links to the final board, a photo archive of the award ceremony, a photo archive of the contest hall and a news item.

    The contest pages in our copy are the final board of the onsite contest (199 teams, problems A to L, per-team attempts and times; ECUST's own page), an information page for the earlier Shanghai Metropolitan Contest of May 2015 (participation details and registration), and that contest's PC^2 scoreboard (200 teams, problems A to J). The home page also links to a page of the ECUST ACM team.

    Our copy holds 139 pages. Five of the pages belong to the contest's ACM section; most of the others are pages of the ECUST computer science department's own site (news, notices, staff and teaching pages). The photo archives and the invitation file linked from the home page are not in our copy, and the team page and the news item are not either.
