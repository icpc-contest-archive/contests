  description: |-
    Final scoreboard of the onsite contest: 199 teams, ranked 1 to 199, with problems A to L. Each row gives school, team name with a number in parentheses, problems solved, penalty time, and for each problem the number of attempts and the minute of the first accepted run (for example 4/101). The header of each problem column shows its totals as solved/submitted. An S# column is numbered on 117 rows, blank on 79 and starred on 3 (the starred teams include the one in first place).

    The page states a time of 2015/11/23 11:14:01 with the start 2015-11-22 09:00 and says that gold, silver and bronze medals are 20, 40 and 60. A legend marks first solves, solved problems, attempted problems and pending judgement. A menu at the top lists boards of other contests from 2008 onward; those links lead outside our copy. Style sheets and scripts are kept with the page.
