  description: |-
    Results page for Region 2 of the 1996 ACM Asian Programming Contest, in English. A table of 8 ranked teams gives team number, institute, score, number solved and rank; Korea Advanced Institute of Science and Technology is first with 6 solved, Shanghai Jiao Tong University 2 is second with 5, and the six teams at ranks 3 to 8 each have 4 solved. The Score column is not in the order of the ranks. There are no per-problem results.

    A second table lists 16 honorary participants by team number and institute, without score or rank. A caption says the teams in the regional contest were selected from the winning teams in the local programming contests. The page links back to the ACM Asia Programming Contest home page.
