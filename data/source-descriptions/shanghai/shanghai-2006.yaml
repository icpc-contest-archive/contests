  description: |-
    Problem set as handed out at the contest: a PDF of 20 pages, a cover page naming the contest as sponsored by IBM and hosted by Shanghai University on November 22, 2006, followed by ten problems in English, from ACM Team Selection to John's Canonical Difference Bound Matrices, whose titles run in alphabetical order from A to J (Balancing the Scale, Contestants Division, Distant Galaxy and Escape Plan among them). Each has an input file name, a statement with input and output description, and a sample input with its output. Some problems contain figures and formulas. No test data or solutions.
