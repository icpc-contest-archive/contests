  description: |-
    Official standings of the Shanghai site of the 2006 ACM-ICPC Asia Programming Contest, sponsored by IBM and hosted by Shanghai University, dated November 22, 2006. It names the champions (Tsinghua University, team Mobile Robot) and the best women's team, then ranks 71 teams by institution and team name, number solved and time; the 20 teams at rank 30 show a solved count of 2 and no time. A table of 40 further teams is headed Honorable Mention, 111 teams in all. A note explains that official ranks count the top team of each university first and give other teams of the same university the rank of the next team from another university. There is no per-problem detail.
