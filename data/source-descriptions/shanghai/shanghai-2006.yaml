  title: ACM ICPC Asia Regional Contest - Shanghai
  language:
  - en
  - zh
  description: |-
    Website of the ACM ICPC Asia Regional Contest Shanghai, run by Shanghai University, in English with pages of a Chinese version. Our copy holds 103 pages captured between 1999 and 2016, so it shows the site over many years and not its state at the 2006 contest. The pages about the 2006 edition are a short front page of 2007 that links the official standings and the problem set of the contest, and those two documents themselves: standings dated November 22, 2006 and a PDF problem set.

    The rest is older: front pages of earlier years (one reports the 27th contest, held October 27, 2002, with 91 teams), the Asia regional rules of 2001, registration, software and links pages, and a problem archive with the Shanghai contests of 1996 to 1999 as HTML and PDF. Frame pages of an online contest system with a menu (Home, Register, Problems, Submit, Status, Standing, Statistics) are present; the page that should list contests shows PHP program code in our copy in place of the list.
