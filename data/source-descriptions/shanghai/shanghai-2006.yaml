    Standings of The 2006 ACM Asia Programming Contest - Shanghai, sponsored by IBM, as a View Standings page with 1731 teams, with columns for rank, institution and team name, citation, number solved and time. Only 26 teams have a rank (First to Eighteenth Place) with solved count and time; Tsinghua University, team Mobile Robot, is first with 7 problems and 617. The other 1705 teams are listed as Honorable Mention without rank or results, many of them several teams from one university. In 289 rows the institution is written in Chinese characters, in 258 rows the team name.
