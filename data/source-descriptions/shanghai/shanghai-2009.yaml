  contest_date: '2009-10-25'
  description: |-
    Website of the 34th ACM/ICPC Asia Regional Shanghai (Donghua University), in English and Chinese. Our copy holds 75 pages. The front page in our copy is the 2016 home page of the Donghua University Online Judge (DHUOJ), listing 2016 contests, so it does not belong to 2009; other pages of the judge site are mixed in.

    Behind it are the English "DHU-ACM" pages of the 2009 contest, each with a Chinese counterpart: introduction, organisation committee, schedule (online contest on 20 September 2009, onsite contest on 23 to 25 October 2009 at the Stadium of Songjiang Campus, Donghua University), registration guide, rules, traffic maps, contact, environment, FAQ and news. It also holds the onsite and online ranklists of the regional, a school rankings page, ranklists of a 30 May 2009 Shanghai Invitational contest, a problem set PDF and an onsite team list in Excel format.
