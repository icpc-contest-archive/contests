  title: ACM ICPC Asia Regional Contest Shanghai 1999
  language:
  - en
  - zh
  contest_date: '1999-11-28'
  description: |-
    Website of the ACM ICPC Asia Regional Contest in Shanghai, in English; the Past Years pages also exist in a Chinese-language version. The Past Years 1999-2000 section for the 1999 contest has a teams page (university, coach and team members), a final standings page (23 ranked teams with team number, problems solved and points, then an alphabetical Honorable Mention list of 24 teams; last updated 30 November 1999), a photo page that lists the winners and links 44 team photos, and a link to the contest problems. The problems page for Shanghai 1999 is in our copy with the contest and practice problems as PDF files, which carry the date 28 November 1999. The section index is dated 5 December 1999.

    The Past Years pages for the 2000 contest (index, standings, a full standings page and a zip file) are also in the copy, so the site is shared by two editions. Other parts hold problem archives for the ICPC World Finals 1999 and 2000, the IOI 1999 and 2000 and many other 1999 regionals, plus a downloadable GNU Pascal package. Our copy holds 150 files captured at dates from 2000 to 2017: 81 HTML pages, 23 PDFs, 44 photos, the package and the zip file.
