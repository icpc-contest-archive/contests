  description: |-
    Standings of the ACM ICPC Malaysia al-Khawarizmi National Programming Contest 2014: 60 teams, one row each, with rank, team name, institution, number of problems solved, time and citation. There is no per-problem detail. The citation column names the first 30 places (First Place to Thirtieth Place) and gives Honorable Mention to the other 30 teams. Thirteen teams solved no problem and share rank 48. The team KitKat of Universiti Tunku Abdul Rahman is first with 9 problems and a time of 1078; the most problems solved by any other team is 7.
