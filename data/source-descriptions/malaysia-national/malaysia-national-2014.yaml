  problems: 10
  description: |-
    News article of Universiti Tunku Abdul Rahman (UTAR), headed "UTAR tops ACM-ICPC National Programming Contest", on its team KitKat winning the ACM-ICPC Malaysia National Programming Contest, hosted by Universiti Teknologi Petronas in Seri Iskandar, Perak, on 27 and 28 September 2014. It gives the top three: KitKat (UTAR) with nine problems solved, EPSILON (Universiti Malaya) with seven and Andalusia (International Islamic University Malaysia) with six, and says each team had ten problems to solve in five hours. The rest is an account of the winning team's preparation with quotes from the team and its coach, and a short paragraph on the contest as the national preliminary round for the Asia regionals. No full standings.

    The two photographs and the university logo are not in our copy.
