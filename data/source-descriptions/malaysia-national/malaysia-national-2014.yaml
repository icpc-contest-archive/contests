  description: |-
    News item on the website of the Faculty of Informatics and Computing of Universiti Sultan Zainal Abidin (UniSZA), in Malay, about the faculty's two teams at the ACM-ICPC Malaysia Al-Khawarizmi National Programming Contest 2014. It states that the contest was held at Universiti Teknologi PETRONAS, Tronoh, Perak, on 27 and 28 September 2014 (Saturday and Sunday), and that UniSZA sent two teams, Error 404 and Imperial, each with a team leader and three members. It gives their results as place 21 of 61 teams, described as the best result in the faculty's history, and place 25 of 61. The item is dated 1 October 2014.

    The rest of the page is the faculty's menus and footer. There is no list of other teams.
