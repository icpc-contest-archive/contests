  description: |-
    Codeforces gym dashboard of the 2019 ICPC Malaysia National, marked as finished. It lists eleven problems, A to K, from Mental Rotation to Help The Support Lady, with time limits from 1 to 15 seconds, a memory limit of 256 MB and a count of solving users for each. Below the table are four entries under questions about problems: one announcement that test data of problem D is broken, and three questions with answers. Our copy holds this dashboard page only.
