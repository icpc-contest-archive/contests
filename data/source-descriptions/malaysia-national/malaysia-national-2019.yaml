  description: |-
    Website of the ICPC Malaysia al-Khawarizmi National Programming Contest 2019, made by the Kulliyyah of ICT, International Islamic University Malaysia. The home page gives the dates (26th and 27th April 2019), the venue, the registration fee and period, and a short text on ICPC and the university. Further pages cover how to register, mode of payment, program schedule, system configuration, contest rules, accommodation, campus map, contact details and a final scoreboard page with 36 teams. The schedule, system configuration and rules pages link to PDF versions that are not in our copy. The menu also names registered teams, problem set and problem set analysis; the registered teams link leads to the ICPC site and the problem set entries are not links to files.

    The address was reused later in the year: a regional subsite for the ICPC Asia Kuala Lumpur Regional Contest 2019 (8 to 10 November 2019) sits under it. Our copy holds its pages (home, schedule, rules, payment and others), its final standings page of the DOMjudge contest and a 16-page PDF of its problem statements. In total our copy holds 21 distinct pages and files, many saved under several addresses.
