  description: |-
    Final scoreboard produced by DOMjudge, dated 27 April 2019: 36 teams with rank, team name and university, number of problems solved and total time. It has eleven problem columns, a to k, named after the problems (a-mental-rotation to k-help-the-support-lady). Each solved cell shows the minute of the solution and the number of tries; unsolved attempts show tries only. A summary row gives the total solved and, per problem, the accepted, rejected and pending submissions and the minute of the first solution, and a legend marks first solved, solved, tried but incorrect and untried. First place is a team from International Islamic University Malaysia with 8 problems solved.
