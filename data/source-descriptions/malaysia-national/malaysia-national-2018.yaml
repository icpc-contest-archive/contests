  title: ACM ICPC Malaysia al-Khawarizmi National Programming Contest 2018
  language:
  - en
  contest_date: '2018-05-11'
  description: |-
    Website of the ACM ICPC Malaysia al-Khawarizmi National Programming Contest 2018, organised by the Kulliyyah of ICT, International Islamic University Malaysia, Kuala Lumpur. The home page gives the dates (11th and 12th May 2018), the venue, the registration fee (RM 200 per team) and the registration period. Other pages cover how to register, mode of payment, rules, accommodation and a campus map. The pages for the program schedule, system configuration and final scoreboard hold only a heading and a link to a PDF; of these PDFs only the scoreboard is in our copy. The menu also lists registered teams, problem set, problem set analysis and photos.

    Our copy holds 11 pages: nine web pages and two PDFs, the final scoreboard and the problem set analysis. The problem set is linked as a zip file that is not in our copy. The registered teams, photo and video links lead to other servers.
