  title: Scoreboard Al-Khawarizmi National Programming Contest 2018
  language:
  - en
  problems: 10
  pages: 1
  description: |-
    Final scoreboard of the Al-Khawarizmi National Programming Contest 2018 as a one-page PDF holding a single tall image of the table, with columns for rank, team and score followed by ten problem columns. A summary row at the bottom gives attempts and accepted runs per problem, and a legend explains cell colours and the categories Participants, Observers and Untried.

    The table is an image without a text layer, so the cells cannot be searched and are hard to read in our copy.
