  copy: malaysia-national/malaysia-national-2018/judge-baekjoon/20201025-wayback-89f93008/page.html
  title: Al-Khawarizmi National Programming Contest 2018
  language:
  - ko
  - en
  problems: 10
  description: |-
    Baekjoon Online Judge category page for the Al-Khawarizmi National Programming Contest 2018, filed under ICPC Regionals, Asia Pacific, Malaysia. It lists ten problems, A to J, with Baekjoon problem numbers 15832 to 15841 and English titles from Aku Negaraku to Virus Outbreak. For each problem the table gives the number of users who solved it, the number of submissions and the acceptance ratio. The site interface is in Korean.
- url: http://www.iium.edu.my/acmicpc/2018/files/problemanalysis2018.pdf
  read: '2026-11-16'
  rubric: 1
  copy: malaysia-national/malaysia-national-2018/editorial/20180613-wayback-2a2fadea/problemanalysis2018.pdf
  title: Problem Set Analysis
  language:
  - en
  contest_date: '2018-05-11'
  problems: 10
  pages: 6
  description: |-
    Problem set analysis of the 2018 contest as a six-page PDF in slide form, headed with the dates 11th to 12th May 2018. It covers the ten problems A to J and has four tables: the problem setters per problem, the difficulty level with number of attempts and accepted runs, a one-line solving approach per problem (for example minimum spanning tree for problem D and dynamic programming for C and J), and the team that first solved each problem with the minute. Problem I was not solved by any team. There are no full solution write-ups or code.

    One slide header reads "ACM ICPC Al-Khawarizmi 2013".
