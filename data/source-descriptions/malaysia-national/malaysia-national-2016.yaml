  description: |-
    Category page of the Baekjoon Online Judge for the Al-Khawarizmi National Programming Contest 2016, with the site's menus in Korean. The breadcrumb places it under ICPC Regionals, Asia Pacific, Malaysia, Malaysia National Programming Contest. A table lists 10 problems, A to J, with the judge's problem numbers 14533 to 14542, English titles (Financial Tsunami, String Permutation, Birthday Graph, Bricks on the Wall, Street Light Pole, Connectivity Potential, Grid Pattern, Railway Station, Speed Limit, Outer Triangle Sum), the number of users who solved each, the number of submissions and the acceptance ratio. Each title links to the problem page on the judge.

    The statements themselves are on the linked problem pages and are not part of this page.
