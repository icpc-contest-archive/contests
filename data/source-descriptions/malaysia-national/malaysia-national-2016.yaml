  title: ACM ICPC Malaysia al-Khawarizmi National Programming Contest 2016
  language:
  - en
  description: |-
    Website of the ACM ICPC Malaysia al-Khawarizmi National Programming Contest 2016, in English, from the Kulliyyah of ICT, International Islamic University Malaysia. The home page gives the dates (7 and 8 October 2016, Friday and Saturday), the venue (International Islamic University Malaysia, Kuala Lumpur), the registration fee of RM 200 per team and the registration period of 30 August to 30 September. Further pages cover how to register, the mode of payment (bank transfer, cash or cheque, purchase order), the rules (a five-hour contest with ten or eleven problems, PC^2, limits on printed material), accommodation with six suggested hotels, transportation (a placeholder saying that information will follow), a campus map and a page for photos.

    Our copy holds 14 saved addresses: the home page (saved under three addresses), ten other pages and an 8-page PDF fact sheet about the ICPC and the 2016 World Finals with its 128 finalist teams. The pages for the final scoreboard, the program schedule and the system configuration each consist of a heading, a link to a PDF and embedded images (two on the scoreboard page, one on each of the others). Those PDFs, the problem sets archive, the photos, the style sheet and the images are not in our copy, so it holds no results of this contest and no problem statements.
