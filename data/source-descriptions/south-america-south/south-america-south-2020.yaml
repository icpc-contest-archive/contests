  description: |-
    Scoreboard of ICPC LATAM - 2020 (in 2021) as produced by BOCA, shared by all Latin American sites, not only South America/South. A row of group links (Global, brbr, centroamerica, caribe, mxmx, north, south and per-site groups such as soar, sobo, soch and sope) selects a view, and our copy lists the rows of all views one after another, so each team appears two or three times, with a rank on each row. In all, 302 distinct team ids appear, with group prefixes such as brbr, mxmx, noco, cbcu, casv and soar. The four South America/South site groups soar, sobo, soch and sope hold 79 teams (the soch group appears as socl in team ids).

    Each row gives rank, a team id ending in a two-letter site code, the team name, one cell per problem A to N with attempts and time in minutes (an unsolved but attempted problem shows a dash for time), and the total as problems solved with penalty time in brackets. The page links to a statistics page, run list, clarifications, a tasks list, an info sheet, the contest problem set PDF, a time limits PDF and a BOCA package; none of them is part of our copy.
