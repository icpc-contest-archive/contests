  description: |-
    Website of the 2008 South America / South regional contest, published by the Departamento de Computacion of the Universidad de Buenos Aires inside its Plone site, in English and Spanish. The front page names the sites Lima, Punta Arenas, Cochabamba and Buenos Aires, the geographic area (Argentina, Bolivia, Chile, Paraguay, Peru, Uruguay) and the contest date, 15 Nov 2008. Its menu covers news, general information, rules and site rules, the contest environment (software on the contest machines), problems, standings, travel information, photos, staff and contacts. A main page also announces the internal contest of the university, held on 2008-10-18, and links the poster.

    The problems page is a list of links to online judges and to archives of earlier World Finals and South American regional problem sets; it holds no problems of this edition. The standings page links the standings of this and earlier years, and the standings file of 2008 (an HTML table, with XML and ODS versions linked) is in our copy, as is the one-page poster. Our copy holds 66 files, 59 of them pages, many of them the same page under different addresses or with and without a trailing slash; the university's news sidebar on 35 of the files carries news items dated 2011 to 2016, after the contest.
