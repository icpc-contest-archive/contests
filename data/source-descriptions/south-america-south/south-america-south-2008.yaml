    Scoreboard of the 2008 South America / South regional contest as an HTML table: 115 teams with rank, team name, country, number solved and total time, then one column for each of the problems A to K. A problem cell gives the number of tries and the time of the accepted run (for example 1/171); an unsolved problem shows 0/-- or a number of tries followed by --. The first team solved 7 problems with a total of 1003, and 12 teams solved none. Teams with equal results share a rank (the last teams are all ranked 104). The page has no title, heading or date of its own and does not say whether it is final.
