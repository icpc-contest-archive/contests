    Poster of one page, in Spanish, inviting teams to the 33rd ACM International Collegiate Programming Contest, South American regional. It gives the date 15/11/08, the Argentine site (Departamento de Computacion, Facultad de Ciencias Exactas y Naturales, Universidad de Buenos Aires), registration from 22/9/08, the address of the contest web page, and the World Finals in Stockholm in April 2009. It also says that Accenture will award airline tickets to the winning team of the Argentine site. It lists no teams and no results.
