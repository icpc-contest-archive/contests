    Judge's list of problems of the 2008 South American regional contests on the Baekjoon Online Judge, filed under ACM-ICPC Regionals, Latin America: 13 problems with the judge's problem number, the contest label (A to K, plus warm-up problems PA and PB), the title, and the judge's counts of accepted and total submissions and its acceptance rate. The site's interface is in Korean; seven titles are shown in Korean and six in English (Electricity, Pole Position, Higgs Boson, Traveling Shoemaker Problem, Bora Bora, He is offside!). The page holds no statements, only the list; the counts are those of the judge, not of the contest.
