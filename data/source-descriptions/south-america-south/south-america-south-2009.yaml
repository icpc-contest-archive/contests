    Problem set of the contest session as a PDF of 20 pages, marked Version 6. The cover reads "ACM International Collegiate Programming Contest 2009, Latin American Regional Contests, October 23rd-24th, 2009, Contest Session", states that the set has 11 problems on pages numbered 1 to 19, and lists the countries hosting simultaneous contests with it: Argentina, Bolivia, Brazil, Chile, Colombia, Cuba, Peru, Mexico and Venezuela.

