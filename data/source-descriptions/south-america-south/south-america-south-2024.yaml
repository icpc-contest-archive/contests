  description: |-
    Final scoreboard of The 2024 ICPC Latin America Contests, produced by BOCA. One table of 1913 rows with the columns rank, user/site (an account code and a country code such as /AR, /BO, /BR, /CO, /MX), team name with a bracketed institution tag, tries/time in minutes for each of problems A to L, and the number solved with total penalty. Each team's row is repeated once for every view it belongs to, and a menu at the top switches between the views by script: Global, Global+CCL, one per country or sub-region (Brasil, Central America, Caribbean, Mexico, South America North, South America South), and Female_Teams, among others. The 1913 rows cover 516 distinct team accounts; 22 of them carry a [CCL] tag in the team name.

    The first row of the global board is a Brazilian team with 9 problems solved. The header also links the warmup and contest information sheets, problem sets and time limits, the contest editorial and the BOCA contest packages; those files are not part of our copy. Team accounts link to team photos; 48 of those photo files are not in our copy.
