    Judge's list of problems of the 2012 Latin America regional contests on the Baekjoon Online Judge, filed under ACM-ICPC Regionals, Latin America: 12 problems with the judge's problem number, the label (A to J, plus PA and PB), the title, and the judge's counts of accepted and total submissions and acceptance rate. The site's interface is in Korean; nine titles are in English (Arranging Heaps, Boxes and Stones, Cellphone Typing, Environment Protection, Fix the Pond, Game of Tiles, Joining Couples, Hot Dogs, Tornado!) and three, D, H and I, are given in Korean. The page holds no statements, only the list; the counts are the judge's, not those of the contest.
