  description: |-
    Standings of the 2012 South America / South regional contest: 151 teams with rank, team name, institution, number of problems solved and total time, and three further columns, medal, citation and site citation. The first twelve teams carry medals (four gold, four silver, four bronze); 75 teams carry a place as citation and the other 76 are marked Honorable Mention. Four teams carry a site citation as champion of their country's site (Argentina - Buenos Aires, Peru - Lima, Chile, Bolivia). The team in first place solved 8 problems in 1291; 14 teams solved none, and ranks run without ties from 1 to 151. No per-problem results and no number of problems are given.
