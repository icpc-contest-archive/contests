  description: |-
    Final scoreboard of the ICPC Latin America Regionals 2025, produced by BOCA. One table of 2218 rows with the columns rank, user/site (an account code and a country code such as /AR, /BO, /BR, /CO, /EC), team name with a bracketed institution tag, tries/time in minutes for each of problems A to L, and the number solved with total penalty. Each team's row is repeated once for every view it belongs to, and a menu at the top switches between the views by script: Global, Global+CCL, Female_Teams, Brasil, Caribbean, Central America, Mexico, North, South (with Argentina, Bolivia, Chile and Peru and its Arequipa and Lima sites) and others. The rows cover 593 distinct team accounts; 28 carry a [CCL] tag in the team name, and 44 carry the note "Qualified for Programadores de America in Chile" beside the name.

    The header links the warmup and contest information sheets, problem sets and time limits, an editors and machines report and the BOCA contest packages; those files are not part of our copy. Five of the linked team photos are missing from our copy.
