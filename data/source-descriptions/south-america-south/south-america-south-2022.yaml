    Final Scoreboard of the whole ICPC Latin America regional contest in the BOCA judging system, headed 'ICPC-LATAM - Latin America - Regional 2022'. Thirteen problems, A to M, are shown against every team as tries/minutes of the accepted run (for example 1/88), or tries and a dash when unsolved, with a total of problems solved and penalty time. The table has 855 rows for 329 distinct teams, identified by login and site, with a bracketed tag before the team name (mostly a university abbreviation). Every team is listed two or three times, because the page repeats the teams across its views; a menu names views for Global, Brasil, CentroAmerica, Caribbean, Mexico, North and South (with the logins soar, sobo, soch and sope), and for Global-CCL, Brasil-CCL, Caribbean-CCL, Mexico-CCL and South-CCL. The logins of the four south countries account for 105 distinct teams; 20 further teams have logins beginning with ccl, and 16 of the teams carry the tag CCL in their names.

    Links to the warmup and contest information sheets, problem sets, time limits, an editorial and package files are present, but those files are not part of our copy.
