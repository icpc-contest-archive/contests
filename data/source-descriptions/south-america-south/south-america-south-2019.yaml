    Dashboard of the Codeforces gym contest 2019-2020 ACM-ICPC Latin American Regional Programming Contest, marked as finished. It names the authors of the problems, lists 13 problems, A to M, with time limits from 1 to 6 seconds, a 1024 MB memory limit and the number of users who solved each, and offers virtual participation and practice. A link to the statements as an English PDF is on the page; the PDF itself is not part of this page.
