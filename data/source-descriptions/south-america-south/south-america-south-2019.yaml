    Problem set of the 2019 Latin American Regional Contests, a PDF of 22 pages in English. The cover gives the dates November 8th-9th, 2019 and "Contest Session", says the set has 13 problems on pages numbered 1 to 20, and lists the countries whose simultaneous contests used it: Argentina, Bolivia, Brasil, Chile, Colombia, Costa Rica, Cuba, Ecuador, El Salvador, México, Perú, República Dominicana and Venezuela. A page of general rules on program names, input and output follows.

