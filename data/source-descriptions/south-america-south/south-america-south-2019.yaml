  description: |-
    Final Scoreboard of ICPC LATAM 2019 as produced by BOCA, shared by all Latin American sites, not only South America/South. A row of group links (global, cbrd, cbcu, caribe, mxmx, cacr, caes, centroamerica, noco, novz, north, soar, sobv, soch, sope, south, brbr and several ccl groups) selects a view, and our copy lists the rows of all views one after another, so each team appears two to four times, with a rank on each row. In all, 368 distinct team ids appear, with site codes for Brazil, Mexico, Colombia, Argentina, Chile, Cuba, Peru, Bolivia, El Salvador, Costa Rica, Venezuela and the Dominican Republic. The four site groups soar, sobv, soch and sope hold 117 teams.

    Each row gives rank, a team id ending in a two-letter site code, the team name, one cell per problem A to M with attempts and time in minutes (an unsolved but attempted problem shows a dash for time), and the total as problems solved with penalty time in brackets. Teams from clubs marked CCL are mixed in with the others. The page links to LATAM statistics, clarifications and run lists, which are not part of our copy.
