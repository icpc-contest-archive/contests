    Problem set of the contest session as a PDF of 17 pages, marked v1.0. The cover reads "ACM International Collegiate Programming Contest 2010, Latin American Regional Contests, October 22nd-23rd, 2010, Contest Session", states that the set has 11 problems on pages numbered 1 to 15, and lists the countries hosting simultaneous contests with it: Argentina, Bolivia, Brazil, Chile, Colombia, Cuba, Peru, Mexico and Venezuela. A page of general information on input and output follows.

