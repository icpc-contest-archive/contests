    Standings of the 2011 South America / South regional contest: 151 teams with rank, team name, institution, number of problems solved and total time, and three further columns, medal, citation and site citation. The first twelve teams carry medals (four gold, four silver, four bronze); 79 teams carry a place as citation and the other 72 are marked Honorable Mention. Four teams carry a site citation as champion of their country's site (Peru - Lima, Argentina - Buenos Aires, Bolivia, Chile). The team in first place solved 7 problems in 1021; 35 teams solved none, and the last teams share rank 114. No per-problem results and no number of problems are given.
