  description: |-
    Scoreboard of the Regional Sudamericana - Sur (South America / South) 2011, in Spanish, as a single HTML page: 152 teams with position, team name, site (Argentina 23 teams, Bolivia 59, Chile 30, Peru 40), number of problems solved and total time, one column for each of the problems A to K, and a last column headed Int./Res. (for example 14/7). A problem cell gives the number of tries and the time of the accepted run (for example 1/71); unsolved problems show 0/-- or tries followed by --, and rows are coloured by site. The first team, from Peru, solved 7 problems in 1021; 36 teams solved none and the last teams share position 114. A small table above the scoreboard lists a time for each of the four sites, all on 06/11/2011.
