  description: |-
    Contest page of the 2014 ACM-ICPC South America/South Finals on the ICPC regional finder, with subpages. The main page gives the contest dates as 7 Nov 2014 - 8 Nov 2014, registration from 21 Sep to 31 Oct 2014, IBM as sponsor, and the teams grouped by site (Argentina - Buenos Aires, Bolivia, Chile, Peru - Lima): 164 teams, each with institution, team name, coach and contestants. Links lead to the rules, a local page, and tabs for Teams, Standings, Results and Problems.

    Our copy holds 8 files; two of them are empty application shells that only ask for JavaScript. The rest are the main page (captured twice), a teams page with four tables of 164 team rows in all (institution, country, team, status), and the standings page in three captures, each with 164 teams (place, institution and country, team, problems solved, total time, last solution); two captures carry the switch for including or excluding provincial, national and unofficial sites. The Results tab leads to the standings page; the Problems tab links to a file on Google Drive, which is not in our copy.
