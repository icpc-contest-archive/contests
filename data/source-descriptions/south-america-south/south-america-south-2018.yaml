  description: |-
    Problem set of the contest session as a PDF of 18 pages, marked v1.2. The cover reads "ACM International Collegiate Programming Contest 2018, Latin American Regional Contests, November 9th-10th, 2018, Contest Session", states that the set has 13 problems on pages numbered 1 to 16, and lists the countries hosting simultaneous contests with it: Argentina, Bolivia, Brasil, Chile, Colombia, Costa Rica, Cuba, El Salvador, México, Panamá, Perú, República Dominicana and Venezuela. A page of general information on program names, input and output follows.

    The problems are A A Symmetrical Pizza, B Building a Field, C Cheap Trips, D Database of Clients, E Escape, Polygon!, F Fantastic Beasts, G Gathering Red-Black Fruits, H Highway Decommission, I Ink Colors, J Jeopardized Election, K KryptoLocker Ate my Homework, L Looking for the Risk Factor and M Mount Marathon, each in English with input and output sections and numbered sample inputs and outputs. No test data or solutions.
