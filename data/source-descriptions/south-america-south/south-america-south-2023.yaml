  description: |-
    Final Scoreboard of the whole ICPC Latin America regional contest in the BOCA judging system, headed 'LATAM Regional 2023'. Thirteen problems, A to M, are shown against every team as tries/minutes of the accepted run (for example 1/38), or tries and a dash when unsolved, with a total of problems solved and penalty time. The table has 1557 rows for 424 distinct teams, identified by login and site, with a bracketed tag before the team name (mostly a university abbreviation). Every team is listed three or four times, because the page repeats the teams across its views; a menu names views for Global, Global+CCL, Brasil, Central America (El Salvador, Costa Rica, Guatemala), the Caribbean (Antigua and Barbuda, Trinidad and Tobago, Puerto Rico, Dominican Republic, Cuba), Mexico, North (Colombia, Venezuela), South (Argentina, Bolivia, Chile, Peru) and CCL. The logins of the four south countries account for 152 distinct teams; 20 further teams have logins beginning with ccl, and 17 of them carry the tag CCL in their names.

    Links to the warmup and contest information sheets, problem sets, time limits, an editorial and package files are present, but those files are not part of our copy.
