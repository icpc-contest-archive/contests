  description: |-
    Final scoreboard of the South Pacific Divisionals 2019, produced by DOMjudge and last updated on 21 September 2019. It shows every team against thirteen problems, A to M, with country flag, team name, institution, solved count and penalty time. For each problem the cell gives the minute of the solve and the number of tries, or the tries alone when unsolved, coloured for first solve, solved and tried. Within each group the best-placed team of each category (Central, East, West; Unofficial in the second group) carries a category label, and a legend lists the four categories.

    The main table ranks 74 teams 1 to 74 from Australian and New Zealand universities, with the University of Auckland team in first place at 12 solved. A second table lists five unofficial teams with their own ranks 1 to 5. Each table ends with a summary row of per-problem totals. The board covers all three divisions together.

    The style sheets, scripts and flag images the page refers to are not in our copy.
