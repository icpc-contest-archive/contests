  description: |-
    Final scoreboard of the Central Division, headed "Central Division Scoreboard, Final Standings" and marked "Last Update: 2 Sep 2014 using DOMjudge": 30 teams in 27 ranks (four teams share rank 27 with no problems solved). Columns are rank, affiliation (shown as institution and country icons, not text), team, solved, total time, and one column for each of the eleven problems A to K. Each problem cell gives the number of attempts and, for a solved problem, the solve time in minutes plus the penalty in parentheses; the cell colours mark first solves, solves, failed attempts and untried problems. A summary row at the bottom gives three figures for each problem. YujOHappyBot is first with 10 problems solved. The team names link to a DOMjudge server address that is not part of our copy; the style sheet and the institution icons are not in our copy either.
