  title: ACM South Pacific Region
  language:
  - en
  contest_date: '2014-08-30'
  description: |-
    Website of the ACM South Pacific Region, in English, built on Joomla. Our copy holds 92 saved files, 78 of them pages: the home page with a history of the contest in the region, pages for the regional contests of 2012 to 2017, champions pages for 16 years between 1991 and 2011, and World Finals results pages for 1990 to 2014. The 2014 pages cover this edition. The 2014 Central Division page says the contest was held at Brisbane, Canberra and Sydney, links its scoreboard, photo gallery and problem set, and lists the four teams that qualified for the Regional Final in Sydney. The 2014 contests page says the divisional contests, sponsored by IBM, were held on Saturday 30th August at 13 sites, and lists the qualifiers from the Western, Central and Eastern Divisions. Other 2014 pages are the problem sets page, the Regional Final page with the winning teams, a presentations page and photo galleries.

    The files are HTML pages only: the linked scoreboards, problem set PDFs and sample data files are not in our copy, and the 2014 Regional Finals teams page holds only an error message from its photo gallery script.
