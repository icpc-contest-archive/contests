    Standings of the Central Division: 30 teams with rank, team, institution, problems solved, total time, medal, citation and site citation. Ranks run from 1 to 27, with four teams sharing rank 27 on zero problems. YujOHappyBot of UNSW Sydney is first with 10 problems solved. Four teams carry "Qualify" in the medal column; the citation column names places First to Fourteenth, and the other 16 teams are marked Honourable Mention. Three teams carry a site citation (Sydney, Canberra and Brisbane Site Champions). The teams come from seven institutions. No per-problem results.
