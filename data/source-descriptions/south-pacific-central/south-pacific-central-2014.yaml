    Problem set of the 2014 South Pacific Region Central Division Programming Contest of Saturday 30 August 2014: a PDF of 24 pages in English. The cover page is followed by notes saying that the time limit of each problem is stated in its header and naming those who contributed the problems and the reference solutions. Eleven problems A to K follow, from A (Hunger Games) to K (Particle Man), each with its time limit, a statement, input and output format and a sample input and output. No test data or solutions are in the document.
