    Final scoreboard of the Central Division, headed "Central Division Scoreboard, Final Standings" and marked "Last Update: Sun 23rd August 2015 using DOMjudge": 26 teams ranked 1 to 26. Columns are rank, affiliation (a country flag icon), team (with the university named under the team name), solved, total time and the eleven problems A to K. A solved problem shows two figures separated by a slash, the first the number of attempts; a problem tried without success shows only the number of attempts, and an untried one shows 0. A summary row gives a total of 29 teams, 85 problems solved and two figures for each problem, and legends explain the cell colours (first solve, solved, tried incorrect, untried) and the categories Qualifiers and Participants. The first team solved 8 problems.
