  title: ACM South Pacific Region
  language:
  - en
  contest_date: '2015-08-22'
  description: |-
    Website of the ACM South Pacific Region, in English, built on Joomla. Our copy holds 118 saved files, 112 of them pages: the home page with the history of the contest in the region, the 2014 and 2015 pages of the three divisions, the Regional Final and the problem sets, contest listings for 2015 to 2017, champions pages and regional contest reports back to 1991, World Finals results pages, and general pages on rules, registration, sites, training, FAQ and contact.

    The 2015 pages cover this edition. The 2015 Central Divisional Contest page is a report by the division's contest director: the contest was held on August 22 at three sites (Brisbane, Canberra, Sydney), with 26 teams from 8 universities working on 11 problems, the winner, the four teams qualifying for the Regional Final, and a note that it ran on DOMjudge. The 2015 South Pacific Region Contests page reports the divisional contests of Saturday 22nd August (13 sites, 73 teams), the Regional Final in Auckland on 25-27 September with its top four, and the qualifiers of the three divisions. The 2015 problem sets page links the problem sets, solution outlines and data of each division.

    The files are HTML pages and feeds only: the scoreboards, problem set PDFs, solution outlines and data files linked from the pages are not in our copy.
