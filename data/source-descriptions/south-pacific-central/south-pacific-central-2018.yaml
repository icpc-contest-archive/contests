  description: |-
    Problem set of the ICPC South Pacific Divisionals of October 20, 2018: a PDF of 26 pages with twelve problems, A to L, from Australian vs American to Love Actually. The cover lists the problems and gives definitions used across them (error tolerance, results modulo m, lexicographic order, letter case). Each problem has a statement in English with time limit, input and output format and sample input and output; the PDF holds 35 sample blocks. No test data or solutions. The last page carries only the note that it is intentionally left (almost) blank.
