  description: |-
    Standings of the South Pacific Central Division (headed ICPC year 2019): 43 teams with rank, team name, institution, number of problems solved and time. Further columns give a medal, a citation and a site citation; the medal and site citation read Honourable mention for every team, and the citation column names the first place of the divisional contest and the second and third places of a Western Division. UNSW Sydney is in first place with 12 solved and a time of 1027. Teams are ranked 1 to 35; the last eight teams, all with 0 solved, share rank 100. One row is named test. There is no per-problem detail.
