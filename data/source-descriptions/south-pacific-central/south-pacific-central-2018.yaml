  description: |-
    Website of the South Pacific ACM programming contests, in English. Our copy holds 118 files, 112 of them pages. It has the site's menu pages (eligibility and rules, training and preparation, where to compete, World Finals, regional contests, FAQ, registration, useful links, contact), champions pages for sixteen years between 1991 and 2011, regional contest reports for 1999 to 2002, and pages for the 2014 and 2015 contests (divisional contests, problem sets, presentations, awards, photo galleries). Contest schedule pages for 2015, 2016 and 2017 list dates, organisers and links to problem sets, editorials and scoreboards; the links go to other sites and are not part of our copy.

    The rules page describes three divisional contests (Western, Central and Eastern) held in October and a regional final in November, and the Central Division page gives Saturday 14th October 2017 as its date. Nothing in our copy mentions results or a date for the 2018 Central Division contest. Pages that were not fetched, such as some of the World Finals results pages, are missing.
