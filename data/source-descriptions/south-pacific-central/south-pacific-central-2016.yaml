  description: |-
    Website of the ACM South Pacific Region, in English, built on Joomla. Our copy holds 8 pages, all of the 2016 contests: the "2016 South Pacific Region Contests" page, the Regional Final page, the problem sets page, pages for the Western, Central and Eastern Divisions, and two photo galleries.

    The main page carries the report of the regional contest director on the divisional contests of Saturday 8th October at 13 sites, with three divisions but one problem set, names the first four teams, and lists the teams that qualified for the Regional Final in two steps. The Central Division page lists three qualifying teams with their members. The Regional Final page says it was held at the University of New South Wales in Sydney from 25 to 27 November and names the winners. The problem sets page links the divisional and Regional Final problem sets, data and analyses; the links to the scoreboards and problem sets lead to files that are not in our copy, and the gallery pages hold only album names.
