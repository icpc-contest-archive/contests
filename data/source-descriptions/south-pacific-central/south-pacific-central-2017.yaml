    Final scoreboard titled "Divisional Contest 2017", marked "Last Update: 17 Oct 2017 using DOMjudge": 63 team rows from the divisional contests on one board, with the university named under the team name and a country flag (Australia, Fiji or New Zealand) in the affiliation column. Columns are rank, affiliation, team, solved, total time and the twelve problems A to L. A solved problem shows two figures separated by a slash, the first the number of attempts; an unsolved one shows its number of attempts, 0 when untried. A summary row gives 63 total teams, 241 problems solved and two figures for each problem. Legends separate qualifying teams, other Central, Eastern and Western Division teams and an unofficial team by row colour, and explain the problem cell colours; there is no division column. The last row, a University of Otago team in the colour of the Unofficial team category, sits below rank 62 and shows rank 1. The first team, of the University of New South Wales, solved 12 problems.
