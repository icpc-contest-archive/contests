  title: ICPC 2012
  language:
  - en
  contest_date: '2012-10-17'
  description: |-
    Website of the 2012 ICPC contests hosted by BINUS University, in English: the Indonesia National Contest, an online preliminary round on 30 September 2012, and the Asia Jakarta Regional Contest, onsite from 16 to 18 October 2012. The menu covers about pages for both contests, registration for Indonesian and for foreign teams, important dates, a run-down of each contest, rules, the top 50 teams of the national contest, directions to BINUS, visa information, accommodation, transportation, an excursion page and contact details. The news list links to the scoreboard, the problem set and a report on the contest.

    Our copy holds 31 pages: 20 HTML pages (the home page is held under two addresses) and 11 PDFs. The PDFs are the report (2 pages) and the ten problem statements A to J, each of two pages with sample input and output. Two of the HTML pages are scoreboards of the regional contest: a frozen one stamped 13:05:22 and the final one stamped 14:12:28. Images of the site are in our copy too.
