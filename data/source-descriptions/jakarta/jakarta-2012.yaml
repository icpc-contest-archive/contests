  - en
  contest_date: '2012-10-17'
  pages: 2
  description: |-
    Report on the Jakarta 2012 regional contest, a PDF of two pages in English. It tells that the final round was held on 17 October 2012 at BINUS University with 63 teams (13 foreign, 50 national), that 58 teams were present, and that the national contest of 30 September had 456 teams. It then goes through the opening ceremony, practice session, final round, awarding ceremony and the excursion of 18 October. It names the top three teams (+1ironwood from National Taiwan University with 10 of 10 problems, Dongskar Pedongi from Institut Teknologi Bandung and Eternia from the National University of Singapore with 7 each) and the three best national teams. The text names no author.
