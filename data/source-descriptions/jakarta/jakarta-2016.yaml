  description: |-
    Website on the competition portal of BINUS University for the 2016 ACM-ICPC Asia Jakarta Regional Contest, in English. The ICPC 2016 pages cover the two contest parts (the Indonesia National Contest, online on 9 October 2016, and the regional contest on 5 to 7 November 2016), the run-down of 6 and 7 November 2016, rules, the list of the 50 Indonesian teams that advanced, how to get to BINUS, housing, excursion, a registration receipt form and contact details. The final scoreboard, the twelve problem PDFs A to L (icpc16jak-a to icpc16jak-l) and a two-page PDF report of the contest are in our copy.

    The same host's portal also holds the sites of other BINUS events: INC 2016 and INC 2017 with their scoreboards and problem pages, the ICPC 2017 site with its own final scoreboard, and the BNPCHS 2016, BNPCHS 2017 and BNSC 2017 sites. Our copy holds 138 pages in all, not counting one error page; the pages of these other events are part of that count.
