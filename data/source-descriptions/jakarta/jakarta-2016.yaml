  description: |-
    Final scoreboard of the regional contest as printed by DOMjudge under the heading "ICPC 2016 Jakarta - Contest final standings": 66 teams ranked by solved problems and penalty time, with institution and a country flag per team, and twelve problem columns A to L. Each problem cell gives the number of tries and the solving time, or only the number of tries when unsolved, and the problem letters link to the statement PDFs. The leader, a team from National Taiwan University, solved all 12 problems. A summary row gives totals per problem, and the page carries a colour legend (solved first, solved, tried incorrect, untried) and a last-update line of 7 November 2016. Flag images and style sheets are in our copy.
