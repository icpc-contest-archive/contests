  description: |-
    Final standings of the regional contest: 65 teams with rank, team name, institution, number solved, total time, medal and citation, and no per-problem detail. The first three places are labelled Champion, 1st Runner Up and 2nd Runner Up, the fifth place is labelled Best National, places 4 and 6 to 32 carry a place name, and the 33 teams from rank 33 down are marked Honorable Mention. The top place went to a team from National Taiwan University with 12 problems solved; two teams share rank 64 with zero solved.
