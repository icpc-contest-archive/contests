  description: |-
    Website of the 2018 ICPC Asia Jakarta Regional Contest, made by BINUS University, in English. Our copy holds 27 pages of the ICPC 2018 site (the front page is saved under two addresses): the front page with a news list, about the Indonesia National Contest and about the regional contest, registration for Indonesian and for foreign teams, important dates, run-downs, rules, a finalist list, accommodation, directions to the campus and contact. The regional run-down covers 10 to 12 November 2018 at the Anggrek Campus, with the programming contest on the second day, 11 November, from 10.00 to 15.00.

    The site also holds the final scoreboard and the problem statements as twelve PDF files, prob-A to prob-L. One captured address under the site, named after icpc.baylor.edu, holds only a page-not-available message inside the site layout.
