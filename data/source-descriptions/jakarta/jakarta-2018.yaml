    Final standings of the regional contest: 74 teams with rank, team name, institution, number solved, total time, medal and citation, and no per-problem detail. Ranks run from 1 to 27, with some ranks shared by several teams, and the place is repeated in the citation column. The medal column has Gold Medal (3 teams), Silver Medal (4, one of them also marked Best National Team) and Bronze Medal (5), then National Gold Medalist (3), National Silver Medalist (4) and National Bronze Medalist (5); the other 50 teams have no medal label. The top place went to a team from KAIST with 11 problems solved.
