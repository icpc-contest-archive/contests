  description: |-
    Final scoreboard of the regional contest as printed by DOMjudge under the heading "2018 ICPC Asia Jakarta Regional Contest final standings": 75 teams ranked by solved problems and penalty time, with institution and a country flag per team, and twelve problem columns A to L that link to the statement PDFs. Each problem cell gives the number of tries and the solving time, or only the number of tries when unsolved. The leader, a team from the Korea Advanced Institute of Science and Technology, solved 11 of the 12 problems. A summary row gives totals per problem, the colour legend has a "tried, pending" entry, and the last-update line reads 11 November 2018. Flag images and style sheets are in our copy.
