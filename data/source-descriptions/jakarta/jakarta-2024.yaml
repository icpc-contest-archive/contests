  title: The 2024 ICPC Asia Jakarta Onsite Regional Contest
  language:
  - en
  teams: 80
  description: |-
    Standings of the 2024 ICPC Asia Jakarta Onsite Regional Contest: 80 teams with rank, team, institution, problems solved, total time, medal, a place citation such as First Place, and a site citation. Fifty teams carry a rank: twelve with a medal (three gold, four silver, five bronze) and 38 marked Ranked; the citations run from First Place to Fortieth Place, then Honorable Mention for ten teams. The other 30 teams have no rank and are marked Honorable. The site citation is filled for two teams only: Foreign Participants (the team in first place) and National Participants (the team in tenth place). First place is std_abs of National Taiwan University with 12 problems solved and a time of 1581. There is no per-problem detail.
