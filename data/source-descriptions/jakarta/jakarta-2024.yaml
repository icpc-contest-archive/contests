  title: ICPC 2024
  language:
  - en
  contest_date: '2024-12-01'
  description: |-
    Website of the 2024 ICPC Asia Jakarta Regional Contest, in English, made by BINUS University. The home page announces the Indonesia National Contest (INC) 2024, held online on 26 and 27 October 2024, and the onsite regional contest on 30 November and 1 December 2024, with 55 local teams and 25 registered foreign teams, and explains how local teams qualified.

    Our copy holds 16 pages: the contest and INC descriptions, registration instructions for Indonesian and foreign teams, important dates, the rundown of the onsite days at BINUS Anggrek Campus (with an excursion on 2 December), housing, contact details, three versions of the regional contest rules and the INC rules as PDFs, the final scoreboard page, and a 17-page problem analysis PDF. The problem statements are not part of the site.

    Some of the team pictures linked from the scoreboard page are not in our copy.
- url: https://competition.binus.ac.id/icpc2024/final.html
  read: '2026-11-16'
  rubric: 1
  copy: jakarta/jakarta-2024/scoreboard/2026-09-01-live-f08268f7/final.html
  title: Scoreboard icpc-2024 - DOMjudge
  language:
  - en
  teams: 80
  problems: 13
  times: true
  tries: true
  description: |-
    Final scoreboard of the 2024 ICPC Asia Jakarta Regional Contest as a DOMjudge page: 80 teams against thirteen problems, A to M. Each row gives rank, team name, institution, a score of problems solved and total time, and per problem the solve minute and number of tries. Teams are labelled Foreign Participants (25 teams) or National Participants (55 teams). National Taiwan University's std_abs is first with 12 problems solved in 1581 minutes; 74 teams carry a rank, the last six have none, and seven teams solved nothing. Gold, silver and bronze medals are marked on twelve teams. Clicking a team opens a popup with its category, affiliation, country, location and a team picture. A summary row totals each problem, and a legend explains the cell colours (solved first, solved, tried incorrect, tried pending, untried).

    The style sheet, flags and institution logos are not in our copy, and neither are the team pictures.
