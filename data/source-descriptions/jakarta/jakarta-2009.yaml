  title: ICPC 2009
  language:
  - en
  contest_date: '2009-10-21'
  description: |-
    Website of the 2009 ACM-ICPC Asia Jakarta Regional Contest and the Indonesia National Contest, in English, with a copyright line of BINUS University. The menu covers about pages for the two contests, how to register, important dates (registration 1 July to 1 October 2009, national contest 4 October, regional contest 20 and 21 October), run-downs of both contests, a floor map, the Top 50 of the national contest, rules, how to get to BINUS, visa information, hotel recommendations and contact details. A Latest News list runs from 16 July to 22 November 2009 and points to the final result, the contest problems, a report and the photos.

    Our copy holds 24 different pages (the home page is saved twice), two PDFs and 79 JPEG files. The pages include the final scoreboard, the problems PDF (17 pages), the report PDF (2 pages), and nine photo pages: two of team photos captioned by institution and team name, seven of event photos. Of the 324 photos named on those pages, the full-size image of only 39 is in our copy, nearly all on the first event photo page. The floor map page shows server-side script source in place of its table of rooms and teams. Three saved files are 'page not available' notices.
