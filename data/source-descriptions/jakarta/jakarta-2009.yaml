  contest_date: '2009-10-21'
  pages: 2
  description: |-
    Report on the 2009 ACM ICPC Asia Jakarta Regional Contest, 20 to 21 October 2009, a PDF of 2 pages in English, linked from the contest site of the host, BINUS University. It states that the final round on 21 October ran from 9:00 AM to 2:00 PM with 67 teams, 17 foreign and 50 national, from 11 non-Indonesian and 17 Indonesian universities, and that a national contest on 4 October with 77 teams chose the top 50. It tells of the opening ceremony, the practice session on 20 October, the final round run on PC^2 and the awarding ceremony, and names the three best teams (UESTC_floyd, dota, Dongskar Pedongi) and three best national teams. It has no problem solutions.
