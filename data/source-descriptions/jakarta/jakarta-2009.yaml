    Scoreboard of ACM-ICPC Jakarta 2009 marked 'Last Update: Wed Oct 21 14:18:23 ICT 2009': 67 teams with ranks from 1 to 67 (ties share a rank), each with rank, a Team Name column giving the team name followed by its institution, problems solved, time, and for each of problems A to J a cell of attempts and solve time (for example 1/4, and 13/-- where the problem was not solved), plus a total of attempts and solves per team. A last row gives the totals per problem. One team solved nothing. First place is UESTC_floyd of the University of Electronic Science and Technology of China with 8 solved; two teams have 8. The page is headed 'Last standing' and shows no first-solve or medal marks.
