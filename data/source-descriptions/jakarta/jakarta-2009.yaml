    Standings of the 2009 ACM-ICPC Asia Jakarta Regional Contest: 94 teams from 34 institutions, each with team name, institution, number of problems solved, time and a citation. The first 67 teams are ranked 1 to 67; the top places carry a citation (Champion for the first, then 2nd Place and so on), the other ranked teams are marked Honorable Mention (47 teams). The last 27 teams have no rank and no citation and all have 0 solved. First place is UESTC_floyd (University of Electronic Science and Technology of China) with 8 solved. There are no per-problem columns.
