  description: |-
    Statement of the problem numbered 7217, "An ICPC Problem without Statement", as a 2-page PDF. A running head on page 2 reads "ACM-ICPC Live Archive: 7217 - An ICPC Problem without Statement" with the page number. It has the story, Input, Output, Note (explanations of the four sample cases) and Sample Input and Sample Output sections. The story refers to the Jakarta 2015 regional and asks for K integers, with K between A and B, chosen from N integers in the range -2 to 2 so that their product is as large as possible; the output lists the chosen indexes. No contest name and no problem letter are printed.
