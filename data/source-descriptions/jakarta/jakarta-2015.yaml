  problems: 12
  description: |-
    Website of the 2015 ACM-ICPC Asia Jakarta Regional Contest, published by BINUS University under the title ICPC 2015, in English. The front page announces the Indonesia National Contest, an online contest on 11 October 2015, and the Asia Jakarta Regional Contest, an onsite contest on 7 to 9 November 2015 for the top 50 of INC 2015, the top 5 of CompFest 2015, the top 5 of Ideafuse 2015 and all Asian teams. A news list gives dated updates from August to November 2015.

    Our copy holds 33 pages, 13 of them PDFs, besides images and style sheets. They cover the two contests (about pages, registration for Indonesian and for foreign teams, important dates, a rundown of each contest, rules) and practical pages for visitors (getting to BINUS, visa, accommodation, transportation, excursion, contact).

    Results and problems are in the copy: a scoreboard with 73 teams and problems A to L, a problem set page linking twelve problem PDFs of two pages each, and a two-page report on the event.
