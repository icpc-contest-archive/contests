    Statement of the problem numbered 7214, "Arithmetical CAPTCHA", as a 2-page PDF. A running head on page 2 reads "ACM-ICPC Live Archive: 7214 - Arithmetical CAPTCHA" with the page number. It has the story, Input, Output, Note (an explanation of the 4th sample case) and Sample Input and Sample Output sections. The task is to put the operators +, - or = between four given integers so that the line is a correct arithmetic statement with at least one equality. No contest name and no problem letter are printed.
