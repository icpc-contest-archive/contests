  description: |-
    Report on the 2015 ACM-ICPC Asia Jakarta Regional Contest, a PDF of 2 pages in English, published on the BINUS website. It states that the final round was held on 8 November 2015 at BINUS University with 78 teams, 19 foreign and 59 national, of which 73 were present, after a national contest on 11 October with 417 teams. It goes through the opening ceremony, the practice session, the final round (10:00 to 15:00, which it says ran without problems on pc^2), the awarding ceremony with a sponsor presentation, and the excursion of 9 November to Bogor.
