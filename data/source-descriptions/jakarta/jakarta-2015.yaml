    Statement of the problem numbered 7221, "Harvest Season", as a 2-page PDF. A running head on page 2 reads "ACM-ICPC Live Archive: 7221 - Harvest Season" with the page number. It has the story, Input, Output, Note (an explanation of the 2nd sample case) and Sample Input and Sample Output sections. The task is to find the minimum total energy for N machines on the x-axis to pick M apples at given coordinates, with separate costs A and B for moving a machine and for picking; the example is shown in Figures 1 and 2. No contest name and no problem letter are printed.
