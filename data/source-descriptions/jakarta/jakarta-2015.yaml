    Statement of the problem numbered 7219, "Problem on Group Trip", as a 2-page PDF. A running head on page 2 reads "ACM-ICPC Live Archive: 7219 - Problem on Group Trip" with the page number. It has the story, Input, Output, Note (an explanation of the 2nd sample case, with a table) and Sample Input and Sample Output sections. The task is to find the total time N people need to use three stations (toilet, shower, wash basin), each by one person at a time, when the waiting person with the smallest number goes first; the statement includes a table simulating the usage in 5-minute steps. No contest name and no problem letter are printed.
