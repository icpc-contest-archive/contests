    Statement of the problem numbered 7222, "National Disaster", as a 2-page PDF. A running head on page 2 reads "ACM-ICPC Live Archive: 7222 - National Disaster" with the page number. It has the story, Input, Output, Note (explanations of the first three sample cases) and Sample Input and Sample Output sections. The task concerns N ministers at given coordinates whose reports say who can see whom; the program outputs the square of the visibility (the smallest value that gives the fewest false reports) and that number of false reports. No contest name and no problem letter are printed.
