    Statement of the problem numbered 7224, "Amplified Energy", as a 2-page PDF. A running head on page 2 reads "ACM-ICPC Live Archive: 7224 - Amplified Energy" with the page number. It has the story, Input, Output, Note (explanations of the 1st, 3rd and 4th sample cases) and Sample Input and Sample Output sections. The task is to choose a continuous run of cubes, with up to K special cubes replacing existing ones, so that the product of their energies, given as fractions, is the highest; the output gives the range and the replaced cubes. No contest name and no problem letter are printed.
