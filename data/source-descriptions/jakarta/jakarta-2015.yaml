  description: |-
    Statement of the problem numbered 7215, "Udin and Ucok", as a 2-page PDF. A running head on page 2 reads "ACM-ICPC Live Archive: 7215 - Udin and Ucok" with the page number. It has the story, Input, Output, Note (explanations of the 1st and 2nd sample cases) and Sample Input and Sample Output sections. The task is a two-player stone-removal game on a row of N stones, where a move removes a chosen stone and its neighbours; the program says whether Udin or Ucok has a sure win. The story includes a worked play for N = 6 with figures. No contest name and no problem letter are printed.
