    Statement of the problem numbered 7220, "Dungeon Trap", as a 2-page PDF. A running head on page 2 reads "ACM-ICPC Live Archive: 7220 - Dungeon Trap" with the page number. It has the story, Input, Output, Note (explanations of the first three sample cases) and Sample Input and Sample Output sections. The task is a grid puzzle in which obstacles of cost 1 to 9 tokens are added to stop an imp reaching the goal; the program gives the worst number of tokens a player can spend. No contest name and no problem letter are printed.
