  description: |-
    Website of the 2013 ACM-ICPC Asia Jakarta Regional Contest, published by BINUS University under the title ICPC 2013, in English. The front page announces two contests: the Indonesia National Contest, an online contest on 13 October 2013, and the Asia Jakarta Regional Contest, an onsite contest on 23 to 25 October 2013 for the top 50 of the national contest and all Asian teams. It carries a news list with dated updates.

    Our copy holds 43 pages, 12 of them PDFs, besides images and style sheets. They cover the two contests (about pages, registration for Indonesian and for foreign teams, important dates, a rundown of each contest, rules), the list of the top 50 teams of the national contest, and practical pages for visitors (getting to BINUS, visa, accommodation, transportation, excursion, contact).

    The results are in the copy: a scoreboard of the regional contest with 63 teams and problems A to J, a problem set page linking ten problem PDFs of two pages each, a problem set page of the national contest linking ten problems A to J as web pages, a two-page report on the event, and a one-page invitation letter to the coaches of the top 50 teams.
