  description: |-
    Report on the 2013 ACM-ICPC Asia Jakarta Regional Contest, a PDF of 2 pages in English, published on the BINUS website. It states that the final round was held on 24 October 2013 at BINUS University with 63 teams, 12 foreign and 51 Indonesian, after a national contest on 13 October with 495 teams, and that 61 teams were present on the day. It then goes through the opening ceremony, the practice session, the final round (09:30 to 14:30), the awarding ceremony and the excursion of 25 October. It names the top three teams: ThanQ (National University of Singapore, 8 of 10 problems solved), Kirino :P (National Taiwan University, 7) and Runes of Champion (FPT University, 7), and Vidina 2.0 of the University of Indonesia as best national team.
