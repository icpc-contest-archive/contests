  description: |-
    Website of the 2014 ACM-ICPC Asia Jakarta Regional Contest, published by BINUS University under the title ICPC 2014, in English. The front page announces the Indonesia National Contest, an online contest on 9 November 2014, and the Asia Jakarta Regional Contest, an onsite contest on 4 to 6 December 2014 for the top 50 of INC 2014, the top 5 of CompFest 2014, the top 5 of Ideafuse 2014 and all Asian teams. Its news list still shows items dated 2013 above those of 2014.

    Our copy holds 35 pages, 14 of them PDFs, besides images and style sheets. They cover the two contests (about pages, registration for Indonesian and for foreign teams, important dates, a rundown of each contest, rules) and practical pages for visitors (getting to BINUS, visa, accommodation, transportation, excursion, contact).

    Results and problems are in the copy: a scoreboard with 73 teams and problems A to K, a problem set page linking eleven problem PDFs of two pages each, and a two-page report on the 2014 event. The copy also holds the 2013 report PDF and a one-page invitation letter to coaches of top teams. The page listing the top 50 national teams is the 2013 list, and the national contest's problem set page links to ten problem pages that are not in our copy.
