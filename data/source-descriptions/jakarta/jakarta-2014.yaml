  description: |-
    Report on the 2014 ACM-ICPC Asia Jakarta Regional Contest, a PDF of 2 pages in English, published on the BINUS website. It states that the final round was held on 5 December 2014 at BINUS University with 70 teams, 15 foreign and 55 national, of which 69 were present, after a national contest on 9 November with 307 teams. It goes through the opening ceremony, the practice session, the final round (13:30 to 18:30), the awarding ceremony and the excursion of 6 December. It names ThanQ (National University of Singapore), Team X (Korea University) and Java# (VNU University of Engineering and Technology), each with 11 of 11 problems solved, as the top three, and BerinGAS of the University of Indonesia as best national team.
