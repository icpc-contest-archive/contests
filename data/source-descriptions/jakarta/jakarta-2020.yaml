  copy: jakarta/jakarta-2020/scoreboard/2026-09-01-live-4bcb199e/final.html
  title: Scoreboard - ICPC 2020
  language:
  - en
  teams: 62
  problems: 13
  times: true
  tries: true
  description: |-
    Scoreboard of 62 teams and thirteen problems A to M. Each row gives rank, team name with institution, number solved and total time, and for each solved problem the solve time in minutes with the number of tries; unsolved problems that were tried show only the tries. The first place is MLG (National University of Singapore) with 9 solved and 1132 minutes. A summary row gives per-problem totals. A legend explains the cell colours (solved first, solved, tried incorrect, tried pending, untried). The problem letters in the header link to the problem PDFs. The page does not say whether it is final or frozen in its table; the site's news list announces it as "Scoreboard Final".
