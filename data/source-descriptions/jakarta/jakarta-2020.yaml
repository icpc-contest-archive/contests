  description: |-
    Team list from the contest website, headed "Finalists of ICPC Asia Jakarta": 63 teams in three tables of team name and university. The first table has 40 finalists numbered 1 to 40, three of them marked with an asterisk as withdrawn from the competition; the second has 11 teams invited so that at least one team from each university takes part; the third has 12 wild-card teams (rank 41 and above). It has no results. Our copy holds the page with its style sheet and script.
