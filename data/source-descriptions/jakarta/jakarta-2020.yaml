  language:
  - en
  contest_date: '2020-12-18'
  description: |-
    Website of BINUS University for the 2020 ICPC Asia Jakarta Regional Contest, an online contest on 18 to 20 December 2020 (technical briefing and practice on the 18th, contest on the 20th), and for the Indonesia National Contest (INC) 2020 of 28 and 29 November 2020. Its pages cover the two contests, registration for Indonesian and foreign teams, important dates, the rundown of each event, the rules, a finalist page and contact details. The home page lists who takes part: 60 local teams and 90 registered foreign teams.

    The site holds the final scoreboard and the problem statements as thirteen PDFs of two pages each, A.pdf to M.pdf, and a 4-page PDF of the online competition rules (last updated 4 December 2020) that requires Zoom monitoring with camera feeds. The site is in English. Our copy holds 27 pages with a style sheet and a script.
