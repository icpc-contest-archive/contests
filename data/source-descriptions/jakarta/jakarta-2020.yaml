    Final standings: 75 teams with rank, team name, institution, problems solved, total time, medal and citation. The medal column has 3 Gold, 4 Silver and 5 Bronze medalists and also 3 National Gold, 4 National Silver and 5 National Bronze medalists; the other 51 teams have none. The citation column gives the place name (First Place, Second Place and so on). The first place is MLG (National University of Singapore) with 9 solved. Teams that solved nothing share the last place. There are no per-problem results.
