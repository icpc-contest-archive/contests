  description: |-
    Website of the 2017 ACM-ICPC Asia Jakarta Regional Contest, made by BINUS University, in English. Our copy holds 16 pages of the ICPC 2017 site (the front page is saved under two addresses): the front page with a news list, about the Indonesia National Contest and about the regional contest, registration for Indonesian and for foreign teams, important dates, run-downs, rules, directions to the campus, accommodation, excursion and contact. The run-down covers 11 to 13 November 2017 at the Anggrek Campus: opening and technical briefing on day 1, the programming contest on 12 November, and an excursion on day 3.

    Two pages hold results material: the final scoreboard, and a list of 62 finalist teams with their universities. One more saved address, named after icpc.baylor.edu, holds only a page-not-available message inside the site layout. Three images the excursion page refers to are not in our copy.
