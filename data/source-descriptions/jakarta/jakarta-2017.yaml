    Final scoreboard of the regional contest as printed by DOMjudge under the heading "ACM-ICPC 2017 JAKARTA REGIONAL final standings": 80 teams ranked by solved problems and penalty time, with institution and a country flag per team, and twelve problem columns A to L. Each problem cell gives the number of tries and the solving time, or only the number of tries when unsolved. The leader, a team from the National University of Singapore, solved 9 of the 12 problems. A summary row gives totals per problem, the colour legend has a "tried, pending" entry, and the page ends with a last-update line of 13 November 2017. Flag images and style sheets are in our copy.
