  - en
  contest_date: '2022-11-27'
  problems: 13
  description: |-
    Website of BINUS University for the 2022 ICPC Asia Jakarta Regional Contest, in English. The front page announces the regional as an onsite contest on 26 and 27 November 2022, with a COVID protocol of antigen tests for every team member and coach, and the Indonesia National Contest (INC) 2022 of 12 and 13 November 2022, online. It lists 60 local teams (the top 50 of INC 2022, the top 5 of CompFest 2022 and the top 5 of Ideafuse 2022) and 20 registered foreign teams from the Asia Pacific region, with five named countries excluded. Our copy holds 29 pages, HTML and PDF.

    The HTML pages cover the two contests, registration for Indonesian and foreign teams, important dates, the rundown of each contest (the regional's two days, with venues at the Anggrek Campus of BINUS University and an awarding ceremony), rules, housing at BINUS Square with room rates, and contact details. The PDFs are the regional rules (4 pages), the INC rules (2 pages), a 10-page problem analysis, and the problem statements A.pdf to M.pdf, one two-page PDF per problem. The final scoreboard is the page final.html, with 60 teams and problems A to M.

    Links to the ICPC registration site and to the contest system used for the national contest lead outside our copy.
