    Final standings of the 2022 ICPC Asia Jakarta Onsite Regional Contest: 60 teams with rank, team name, institution, problems solved, total time and citation. 41 teams carry a rank; the citation names the places First to Thirty-third, and the next eight ranked teams are marked "Honorable Mention". The other 19 teams, all with no problem solved, are listed without a rank or citation. Universitas Indonesia's "stack.py" is first with eight problems solved and a time of 1164. There is no per-problem detail and no number of tries, and no medal column.
