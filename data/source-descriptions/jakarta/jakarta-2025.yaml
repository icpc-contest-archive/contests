  description: |-
    Problem analysis slides of the 2025 ICPC Asia Jakarta Regional Contest, dated 24 November 2025, in English: a PDF of 80 pages whose slide counter runs to 48, with builds repeating slide numbers. Each of the 13 problems A to M has an opening slide with the total number of solves, the first solver with team, institution and solve time, and the problem's author, followed by the problem restated and the solution step by step with complexity remarks. The last slide says thank you.
