  title: ICPC 2025
  language:
  - en
  contest_date: '2025-11-23'
  description: |-
    Website of the 2025 ICPC Asia Jakarta Regional Contest, published by BINUS University in English. The home page announces the Indonesia National Contest 2025 (online, 25 to 26 October 2025) and the regional contest (onsite, 22 to 24 November 2025), the qualification route for local teams, the number of registered foreign teams, and the sponsors. Other pages cover the two contests, how Indonesian and foreign teams register, important dates, how to get to the university, housing, contact details, and an hour-by-hour rundown of the three event days.

    Our copy holds 17 pages and PDFs: three dated versions of the regional contest rules (5, 4 and 5 pages), the rules of the national contest (3 pages), the final DOMjudge scoreboard, and the problem analysis slides as a PDF. The problems themselves are only linked, to an archive on another server, and are not in our copy.
