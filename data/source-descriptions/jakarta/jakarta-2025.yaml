    Problem list of the 2025 ICPC Asia Jakarta Regional Contest on the Baekjoon Online Judge: 13 contest problems A to M (Nihilation to Predisposed) with the judge's problem number, title, a note where a special judge is used, and the counts of users who solved it, submissions and the acceptance ratio. A second table lists a practice session of four problems, PA to PD. Each title links to the problem's page on the judge, which is not in our copy. The page's menus and footer are partly in Korean, with the problem titles in English.
