  description: |-
    Final standings of the 2025 ICPC Asia Jakarta Onsite Regional Contest: 51 teams with rank, team, institution, problems solved, time, medal, citation and site citation. The medal column marks 3 gold, 4 silver and 5 bronze; every other team, rank 2 included, carries an honors grade (Highest Honors, High Honors, Honors); the citation column gives a place name for each rank and Honorable Mention from rank 32 on. Only teams with at least one solved problem are listed, so the 16 teams on the scoreboard with no solved problem do not appear. There is no per-problem detail.
