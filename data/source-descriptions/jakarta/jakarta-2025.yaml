    Final scoreboard produced by DOMjudge for the 2025 ICPC Asia Jakarta Regional Contest: 67 teams with rank, team name, institution, number of problems solved and total penalty time, then one column for each of the 13 problems A to M showing the time of the accepted run and the number of tries. A summary row gives per-problem counts and the time of the first solve. Sixteen of the 67 teams have no problem solved. Cells are coloured for solved first, solved, tried and incorrect, tried and pending, and untried, and the first team to solve each problem is marked. Each team also has a detail box in the page with its category, members, coach, affiliation, country and location. The page states it was last updated on 24 November 2025 at 16:49 WIB. Our copy holds the page with its style sheets, scripts and images.
