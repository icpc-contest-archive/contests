    Category page of the Baekjoon Online Judge for the 2021 ICPC Asia Jakarta Regional Contest, with the site's menus in Korean. A table lists the 13 problems A to M with their English titles (XOR Pairs to Maxdifficent Group), the judge's problem number, an information column (multilingual, and special judge for some), and per problem the number of users who solved it, the number of submissions and the acceptance rate. A second table headed 연습 세션 (yeonseup sesyeon, "practice session") lists four problems PA to PD with the same columns.

    Only the list is in our copy: the problem statements are on pages the list links to, and the counts are those of the capture date.
