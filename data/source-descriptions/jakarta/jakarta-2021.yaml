- url: http://competition.binus.ac.id/icpc2021
  read: '2026-11-16'
  rubric: 1
  copy: jakarta/jakarta-2021/website/2026-09-04-live-7163e129
  title: The 2021 ICPC Asia Jakarta Regional Contest
  language:
  - en
  contest_date: '2021-11-21'
  problems: 13
  description: |-
    Website of BINUS University for the 2021 ICPC Asia Jakarta Regional Contest, in English. The front page announces the regional as an online contest on 20 and 21 November 2021 and the Indonesia National Contest (INC) 2021 of 30 and 31 October 2021. It lists 60 local teams (the top 50 of INC 2021, the top 5 of CompFest 2021 and the top 5 of Ideafuse 2021) and 20 registered foreign teams from the Asia Pacific region. Our copy holds 32 pages, HTML and PDF.

    The HTML pages cover the two contests, how Indonesian and foreign teams register, important dates, the rundown of the national contest and of the regional (two days, ending with the awarding ceremony), rules, a list of finalist teams and contact details. The PDFs are the regional rules (version 1.2 and version 1.3, four pages each, with a second identical copy of 1.3), the INC rules (two pages), a 40-page technical briefing, an 8-page problem analysis, and the problem statements A.pdf to M.pdf, one PDF of two or three pages per problem. The final scoreboard is the page final.html, with 62 teams and problems A to M.

    The registration pages link to the ICPC registration site, and the important dates page links to the contest system used for the national contest; neither is in our copy.
