  copy: jakarta/jakarta-2021/scoreboard/2026-09-01-live-dea64564/final.html
  title: Scoreboard - ICPC 2021
  language:
  - en
  teams: 62
  problems: 13
  times: true
  tries: true
  description: |-
    Final scoreboard of the 2021 ICPC Asia Jakarta Regional Contest: 62 teams against 13 problems labelled A to M. Each team row gives rank, team name, a country flag and institution logo, the number of problems solved and the total penalty time, then one cell per problem. A solved cell shows the solving time in minutes and the number of tries; an unsolved cell shows the number of tries only, and untried problems are empty. National University of Singapore's "7 Halim" is first with nine problems and a penalty of 1124.

    At the bottom a summary row gives the total number solved and, per problem, the counts of accepted, rejected and pending submissions and the time of the first solution. A colour legend marks cells as solved first, solved, tried and incorrect, tried and pending, or untried. Links on the problem letters lead to the problem PDFs on the same site. Images used by the page are in our copy.
