  language:
  - en
  teams: 62
  description: |-
    Final standings of the 2021 ICPC Asia Jakarta Regional Contest: 62 teams with rank, team name, institution, problems solved, total time, medal and citation. Ranks 1 to 12 carry four gold, four silver and four bronze medals; 21 more teams are marked "Ranked" and share ranks 13, 17 and 23 as ties. The remaining 29 teams are listed without a rank and marked "Honorable". The citation column gives the place (First, Second and so on) for the ranked teams. National University of Singapore's "7 Halim" is first with nine problems solved and a time of 1124. There is no per-problem detail and no number of tries.
