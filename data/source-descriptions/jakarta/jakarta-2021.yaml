    Problem set as a PDF of 27 pages with the 13 problems A to M, in English: XOR Pairs, Bicycle Tour, Energy Generation, Uniform Maker, Concerto de Pandemic, Not One, Greedy Knapsack, Cell Game, Stable Planetary System, Feeder Robot, White-Black Tree, Happy Travelling and Maxdifficent Group. Each problem has a statement with input and output format and sample input and output, and an explanation of at least one sample; the footer of each page names the contest and the problem. There is no cover page, and no test data or solutions.
