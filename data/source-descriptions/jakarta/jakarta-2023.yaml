    ZIP archive with a folder of thirteen problem statements as PDFs, A.pdf to M.pdf, each of 2 pages, in English. Each statement carries the problem letter and title (A is Easy as ABC, M is Triangle Construction), the problem text, input and output specification and sample input and output, mostly with explanations of the samples. Problem C is interactive: it has an interaction section and a sample interaction in place of the input and output sections. The running footer names The 2023 ICPC Asia Jakarta Regional Contest. No test data or solutions.
