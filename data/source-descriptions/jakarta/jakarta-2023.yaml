  description: |-
    Website of the 2023 ICPC Asia Jakarta Regional Contest, in English, made by BINUS University. The home page announces the Indonesia National Contest (INC) 2023, held online on 4 and 5 November 2023, and the onsite regional contest on 2 and 3 December 2023, with 55 local teams and 25 registered foreign teams, and explains how the local teams qualified. A list of dated news items records updates up to 4 December 2023.

    Our copy holds 28 pages. They cover the descriptions of the INC and of the regional contest, registration instructions and fees for Indonesian and foreign teams, important dates, the rundown of the onsite contest (2 to 4 December at Anggrek Campus, BINUS University, ending with an excursion day), the INC rules, housing at BINUS Square with room rates, contact details, and the regional contest rules as a 4-page PDF.

    The results and problem material is inside the site: a final scoreboard page, the thirteen problem statements A to M as separate 2-page PDFs, and a 13-page problem analysis PDF. The INC problems are not here; the home page says they were archived elsewhere.
