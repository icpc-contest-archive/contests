  description: |-
    Final scoreboard of the 2023 ICPC Asia Jakarta Regional Contest: 80 teams against thirteen problems, A to M. Each row gives rank, team name, institution with its logo and country flag, a score of problems solved and total time, and for each problem the solve minute and the number of tries. A summary row at the bottom totals each problem. National University of Singapore's team absinthe is first with 11 problems solved in 1501 minutes; six teams at the bottom solved nothing.

    The page has a legend of cell colours (solved first, solved, tried incorrect, tried pending, untried) and of gold, silver and bronze medals, and the problem letters in the header link to the statements. Our copy holds the page with its images.
