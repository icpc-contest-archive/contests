  description: |-
    Standings of the 2023 ICPC Asia Jakarta Onsite Regional Contest: 80 teams with rank, team, institution, problems solved, total time, a medal column and a citation column. Ranks run from 1 to 41 for 47 teams, tied teams share a rank, and the citations name the places (First Place to Thirty-fourth Place, then Honorable Mention for the seven teams at rank 41). Three teams are marked Gold Medal, four Silver Medal and five Bronze Medal; the other 35 ranked teams are marked Ranked. The remaining 33 teams have no rank and no citation and are marked Honorable in the medal column. First place is absinthe of National University of Singapore with 11 problems solved in 1501 minutes. There is no per-problem detail.
