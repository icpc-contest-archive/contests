  description: |-
    Report on the Jakarta 2010 regional contest, a PDF of two pages in English. It tells that the final round was held on 1 December 2010 at BINUS University with 66 teams (16 foreign, 50 national), that 60 teams were present, and that the national contest of 7 November 2010 had 220 teams. It then goes through the opening ceremony, practice session, final round and awarding ceremony, and names the top three teams (+1ironwood from National Taiwan University, Halo from Shanghai Jiaotong University, ManiAC from the Chinese University of Hong Kong, each with 9 of 10 problems), the three best national teams and the best all-female team. The text names no author.
