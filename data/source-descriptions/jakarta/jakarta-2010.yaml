  - en
  contest_date: '2010-12-01'
  description: |-
    Website of the 2010 ICPC contests hosted by BINUS University, in English: the Indonesia National Contest, an online preliminary round held on 7 November 2010, and the Asia Jakarta Regional Contest, held onsite on 30 November and 1 December 2010. The menu covers about pages for both contests, how to register, important dates, a run-down of each contest, a floor map, the regional rules, the list of the top 50 teams of the national contest, directions to BINUS, visa information, hotel recommendations, housing, an excursion page and contact details. The front page lists news items that link to the final result, the problem set (a PDF) and a report on the contest (a PDF), and the run-down of the regional contest gives the programme of the two days.

    Our copy holds 20 pages: 18 HTML pages (the home page is held under two addresses) and 2 PDFs, with the images and style sheets of the site. The final result page is the scoreboard of the regional contest. On the floor map page the seating tables are empty: the page shows script code in place of the lists of teams per room.
