  - en
  problems: 1
  pages: 1
  description: |-
    Statement of problem 4144, 'Greatest K-Palindrome Substring': for a lowercase string S and an integer k, find the length of the longest substring that can be made a palindrome by changing at most k characters. It has input and output sections and a sample with three cases. A PDF of 1 page in English, with the region line 'Asia - Jakarta - 2008/2009' under the title and 'Jakarta 2008-2009' at the end.
