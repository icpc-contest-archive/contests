  title: 4139 - Bonus Treasure
  language:
  - en
  problems: 1
  pages: 2
  description: |-
    Statement of problem 4139, 'Bonus Treasure': a master sequence of parenthesis strings S1 = (), S2 = (()) and so on; given N, K and M, output the substring of the N-th term of length M starting after K characters. It has input and output sections and a sample with five cases. A PDF of 2 pages in English, with the region line 'Asia - Jakarta - 2008/2009' under the title and 'Jakarta 2008-2009' at the end.
- url: https://icpcarchive.ecs.baylor.edu/external/41/4140.pdf
  read: '2026-11-23'
