  title: ICPC Regional Contest Indonesia Site
  language:
  - en
  description: |-
    Home page of the 2008 ACM ICPC Asia Regional Contest, Jakarta Site, titled 'ICPC Regional Contest Indonesia Site', with a copyright line of BINUS University. The splash image states 20-21 October 2008, hosted by the Computer Science Department of BINUS University, and has an Enter button. A Latest News list of 12 dated entries runs from 1 June 2008 (site launched) to 1 December 2008, plus one entry headed 05 January 2008 at the top. The entries announce the addition or update of pages on overview, rules, schedule, registration, hotel and travel, excursion, contest, contest team, contest photos and teams to the world final. The three links at the foot (the committee, contact, privacy and policy) point to anchors on the same page.

    Our copy holds this home page saved under its http and https addresses, a style sheet, a script and the splash image. The script loads the site menu and pages from files that are not in our copy, and none of the pages named in the news are in it.
