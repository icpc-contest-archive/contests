  language:
  - en
  problems: 1
  pages: 2
  description: |-
    Statement of problem 4141, 'Disjoint Paths': in a connected graph of N nodes and N - 1 weighted edges, choose up to K mutually disjoint paths so that the sum of edge weights is the largest. It has a figure of two configurations, input and output sections and a sample with two cases. A PDF of 2 pages in English, with the region line 'Asia - Jakarta - 2008/2009' under the title and 'Jakarta 2008-2009' at the end.
