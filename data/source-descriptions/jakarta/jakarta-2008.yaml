  problems: 1
  pages: 2
  description: |-
    Statement of problem 4145, 'Hyper-Mod': the hyper operator a(n)b, with n = 1, 2 and 3 corresponding to addition, multiplication and exponentiation; the task is to compute a(n)b modulo m. It has input and output sections and a sample with four cases. A PDF of 2 pages in English, with the region line 'Asia - Jakarta - 2008/2009' under the title and 'Jakarta 2008-2009' at the end.
