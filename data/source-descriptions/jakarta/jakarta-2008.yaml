  copy: jakarta/jakarta-2008/judge-livearchive/20150309-wayback-ff6e7b4b/4140.pdf
  title: '4140 - Panda Land 7: Casino Island'
  language:
  - en
  problems: 1
  pages: 2
  description: |-
    Statement of problem 4140, 'Panda Land 7: Casino Island': a betting game in which bets must match a prefix of the master sequence announced by the game owner of L numbers and prizes depend on bet length; the task is to find the master sequence with the smallest total prize, the lexicographically first if there are several. It has a worked example, input and output sections and a sample with two cases. A PDF of 2 pages in English, with the region line 'Asia - Jakarta - 2008/2009' under the title and 'Jakarta 2008-2009' at the end.
