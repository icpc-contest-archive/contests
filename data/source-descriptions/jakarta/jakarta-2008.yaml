  description: |-
    Scoreboard of ACM-ICPC Jakarta 2008 marked 'Last Update: Wed Oct 21 15:00:15 ICT 2008' and, in red, 'Last standing': 49 teams ranked 1 to 41 (ties share a rank). Each row has rank, a Team Name column giving the team name followed by its institution, problems solved, time, and for each of problems A to J a cell of attempts and solve time (for example 1/30, and 14/-- where the problem was not solved), plus a total of attempts and solves per team. A last row gives the totals per problem and overall. Nine teams solved nothing. The first row is Joy Shanghai Jiaotong University with 8 solved; three teams have 8. The page shows no first-solve or medal marks.
