  title: 4143 - Free Parentheses
  language:
  - en
  problems: 1
  pages: 1
  description: |-
    Statement of problem 4143, 'Free Parentheses': given an expression of non-negative numbers joined by + and - signs, count how many different values can be obtained by inserting parentheses. It lists the six values for 1 - 2 + 3 - 4 - 5, then input and output sections and a sample with three expressions. A PDF of 1 page in English, with the region line 'Asia - Jakarta - 2008/2009' under the title and 'Jakarta 2008-2009' at the end.
