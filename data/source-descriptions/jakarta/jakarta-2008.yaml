  title: 4142 - Expert Enough?
  language:
  - en
  problems: 1
  pages: 2
  description: |-
    Statement of problem 4142, 'Expert Enough?': a database of car makers with lowest and highest prices; for each query price, print the maker whose range contains it, or UNDETERMINED if none or more than one does. It has input and output sections and a sample with one case of four queries. A PDF of 2 pages in English, with the region line 'Asia - Jakarta - 2008/2009' under the title and 'Jakarta 2008-2009' at the end.
