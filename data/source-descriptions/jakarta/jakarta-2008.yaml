  title: 4146 - ICPC Team Strategy
  language:
  - en
  problems: 1
  pages: 2
  description: |-
    Statement of problem 4146, 'ICPC Team Strategy': a three-person team with one computer, 280 working minutes and a rule that nobody codes two problems in a row; given each member's time per problem, find the maximum number of problems they can solve. It has input and output sections, explanations of the two sample cases and a sample with two cases. A PDF of 2 pages in English, with the region line 'Asia - Jakarta - 2008/2009' under the title and 'Jakarta 2008-2009' at the end.
