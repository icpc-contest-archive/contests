  copy: jakarta/jakarta-2008/judge-livearchive/20150309-wayback-a37ca9e6/4138.pdf
  title: 4138 - Anti Brute Force Lock
  language:
  - en
  problems: 1
  pages: 2
  description: |-
    Statement of problem 4138, 'Anti Brute Force Lock': a safe lock with up to N four-digit keys that can be unlocked in any order, with a JUMP button to a key already unlocked; the task is the minimum number of digit rolls to unlock all keys. It has input and output sections, a worked explanation of the second sample case and a sample with four cases. A PDF of 2 pages in English, with the region line 'Asia - Jakarta - 2008/2009' under the title and 'Jakarta 2008-2009' at the end.
- url: https://icpcarchive.ecs.baylor.edu/external/41/4139.pdf
  read: '2026-11-23'
