  title: ICPC 2019 (The 2019 ICPC Asia Jakarta Regional Contest)
  language:
  - en
  contest_date: '2019-10-27'
  description: |-
    Website of BINUS University for the 2019 ICPC Asia Jakarta Regional Contest, held onsite at BINUS University on 26 to 28 October 2019, and for the Indonesia National Contest (INC) 2019, the online round of 6 October 2019 that fed it. Its pages cover the two contests, how to register for Indonesian and foreign teams, important dates, the rundown of the three days (practice session, contest on 27 October, awards, excursion), the rules, how to get to the campus, housing and contact details. A finalist page lists the invited teams, and a scoreboard page holds the final standings.

    A PDF of 35 slides for the technical briefing (schedule, contest area, items allowed in the room, workstation setup, DOMjudge) is also in the site. The site is in English. Our copy holds 16 pages (15 web pages and the briefing PDF), with images and style sheets; one further address, a link to the ICPC registration site, returns a "page not available" notice.
