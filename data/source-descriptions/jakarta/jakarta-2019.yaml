  description: |-
    Final scoreboard produced by DOMjudge: 80 teams, twelve problems A to L. Each row gives rank, team name with institution, number solved, total time, and for each problem the number of attempts and the solve time in minutes. The first place is Send Bobs to Alice (National University of Singapore) with 10 solved and 1199 penalty minutes. A summary row at the bottom totals the attempts and solves per problem. A legend explains the cell colours (solved first, solved, tried incorrect, tried pending, untried). The page states it was last updated Mon 28 Oct 2019 09:12:51 WIB.

    Images are kept beside the page in our copy.
