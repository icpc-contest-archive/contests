  description: |-
    Team list from the contest website, headed "Finalists of ICPC Asia Jakarta": 70 teams in four tables, each with team name and university. The first table has 40 finalists numbered 1 to 40; the second has 16 teams invited so that at least one team from each university takes part; the third has 12 wild-card teams (rank 41 and above); the fourth has 2 teams admitted directly as winners of a provincial contest (Ideafuse 2019), with the contest named per team. It has no results. The page shares the site's menu and news list, and our copy holds the page with its style sheet and script.
