  description: |-
    Problem analysis of the contest: a PDF of 10 pages in English, headed "Problem Analysis", with the numbered footer "The 2019 ICPC Asia Jakarta Regional Contest – Problem Analysis" on every page. A short disclaimer says the analysis gives the general idea of possible solutions and leaves implementation details to the reader; a table then lists the twelve problems A to L with the problem author and the analysis author of each. The rest explains the solution of each problem in turn, from A Copying Homework to L Road Construction, in prose with formulas and time complexities. No contest date is printed.
