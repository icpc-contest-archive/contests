  description: |-
    Final standings: 80 teams with rank, team name, institution, problems solved, total time, medal and citation. The medal column holds Gold, Silver and Bronze medals and also National Gold, Silver and Bronze medals, with a Best National Team mark added to the third-placed team's Gold Medal. The citation column gives the place name (First Place, Second Place and so on); the 15 teams at the bottom with no solved problems carry Honorable Mention instead. The first place is Send Bobs to Alice (National University of Singapore). There are no per-problem results or attempt counts.
