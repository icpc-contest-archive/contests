    Problem set as a PDF of 17 pages, in English, kept in the results folder of the contest site. The cover page names the 30th Annual ACM International Collegiate Programming Contest, sponsored by IBM, the Arab and North African Eighth Regional Contest, Kuwait University and other sponsors, and gives 1 December 2005 as the date; it says the problem set is made of 16 numbered pages. These hold ten problems A to J, from The Earth is Flat! to It's All About Three, each starting on its own page with the program name, the input file name and a balloon colour, followed by a description, input format, output format and a sample input and output. Problems A, B, C, E, F and G run over two pages. The PDF holds no test data or solutions.
