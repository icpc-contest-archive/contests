  title: acm International Collegiate Regional Programming Contest. ANARC 2005
  language:
  - en
  contest_date: '2005-12-01'
  description: |-
    Website of the eighth ACM Arab and North African Regional Programming Contest (ANARC), organized by Kuwait University, in English. The 2005 pages cover an overview of the ICPC and of the event, team eligibility and contest format, registration (coach account, deadline 15 November 2005, travel support, accommodation, visa), the itinerary from 29 November to 2 December 2005 with the contest on Thursday 1 December from 10:00 to 15:00, advice for getting contestants ready, and a list of changes from the previous year.

    Results are inside: a live scoreboard page from the contest day, a final scoreboard and a final standings page, and the problem set as a 17-page PDF. There is also a PC2 contestant's guide (8 pages) and PDFs of the problem sets of the 1998 to 2004 contests.

    Our copy holds 106 files, 82 of them pages. Besides the 2005 pages it holds pages of the 2004 and 2003 editions of the site and a page of Kuwait University in Arabic. Images and style sheets are present; two addresses of the 2004 site could not be fetched.
