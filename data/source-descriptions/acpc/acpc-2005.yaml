    Problem page on Baekjoon Online Judge for "The Earth is Flat!", which asks for the flattening of nested repeat expressions. The statement is in English (problem, input, output) with one sample input and output, under the judge's Korean page frame with a time limit of 1 second, a memory limit of 128 MB and submission counts. The source line credits it as problem A of the 2005 Arab Collegiate Programming Contest and links to the ACM-ICPC Live Archive copy.

    The formulas are written in TeX notation for a script that is loaded from another server and is not in our copy, so they show as raw TeX.
