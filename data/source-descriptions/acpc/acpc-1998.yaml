  description: |-
    Regional Contest Information page for the 1998 ACM Arab and African Programming Contest, sponsored by IBM and hosted by Al Akhawayn University, Morocco. It gives the contest date, 15 November 1998, and a short text saying that the contest draws students from Africa and the Middle East and that winners go on to the World Finals in Eindhoven. It names four universities for a 1-4 finish, each followed by a number: Al Akhawayn University in Ifrane 2, Institut des Postes et Télécommunications 2, University of Witwatersrand 1 and American University in Cairo 1.

    The page links to a standings page and a problems page. Our copy holds two pages: this one and the problems page, which has the full statements of seven problems. The standings page is not in our copy, and the link to the host university's contest site leads outside it.
