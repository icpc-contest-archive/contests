  description: |-
    Index page of the problem set of the first ACM Arab and African Regional Programming Contest (AARC'98). A table lists seven problems, numbered 1 to 7: Parkinson, Ellie and The Factorial, Sofian Numbers, Mapping the Swaps, Find The Base, Lines and Points, and Perfect Cubes. Each title links to a statement page and each row names a suggested solution file in C.

    Only the index page is in our copy; the linked statements and solution pages are not.
