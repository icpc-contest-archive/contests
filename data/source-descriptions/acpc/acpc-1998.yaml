  description: |-
    Problem set on one web page: the statements of seven problems, in the order Parkinson, Ellie and The Factorial, Sofian Numbers, Mapping the Swaps, Find The Base, Lines and Points and Perfect Cubes. Problems are not lettered. Each statement names its source file and an output file, and six of the seven also name an input file (Perfect Cubes has none). Each gives the task with input and output format; five of the seven have a sample input, while Sofian Numbers and Perfect Cubes have none, the latter showing the first part of its output instead. The last problem states a time limit of two minutes. The page is in English. Our copy has no test data or solutions.
