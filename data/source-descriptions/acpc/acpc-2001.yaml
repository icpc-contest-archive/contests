  description: |-
    Contest information page for the 2001 ACM Africa and Arab Programming Contest sponsored by IBM. It names The American University in Cairo as host and gives 1 - 4 November 2001 as the dates, with a short paragraph saying that winners of regional contests on six continents will advance to the World Finals in Honolulu, Hawaii. It links to the team roster, the standings and the problems.

    Our copy holds 2 pages: this page and the problem set, a 15-page PDF with nine problems. The roster and the standings linked from the page are not part of this copy.
