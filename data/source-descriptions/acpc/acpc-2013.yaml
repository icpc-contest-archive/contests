  description: |-
    Problem set of the 2013 Arab Collegiate Programming Contest as handed out: a PDF of 19 pages in English. Every page is headed with the contest name and "Egypt, Sharm El Sheikh, November 23rd, 2013". It holds 12 problems, A (The Alphabet Sticker) to L (Omar's Bug). Each statement starts with the program file name, the input file name and a balloon colour, and has an input section, an output section and an examples table with sample input and output.
