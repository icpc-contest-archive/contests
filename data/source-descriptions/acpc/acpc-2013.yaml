  description: |-
    Final standings of the 2013 ACM ACPC as a scoreboard: 81 teams ranked by problems solved and then total time, with problems A to L as columns. Each problem cell gives a number of attempts and a time, or the attempts and a dash when the problem was attempted and not solved; unattempted cells are empty. Each team row has a university logo whose tooltip names the institution. The page has a colour legend (first problem solved, solved problem, first to solve problem, attempted problem), a row of per-problem statistics (a count over the number of attempts, with a percentage) and a "show unofficial" checkbox that is unchecked in our copy. The team in first place is ++Neutrinos, with 9 problems solved.

    The style sheet is not part of our copy, so the page appears without its layout.
