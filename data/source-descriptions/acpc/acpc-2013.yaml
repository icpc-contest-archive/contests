- url: http://acmacpc.org
  read: '2026-11-16'
  rubric: 1
  copy: acpc/acpc-2013/website/2026-09-05-wayback-1219c4e0
  title: Archive – 2013 | ACM ACPC
  language:
  - en
  description: |-
    Website of the Arab Collegiate Programming Contest (ACM ACPC), in English, seen through its 2013 archive page. That page says the sixteenth contest was hosted in Sharm El Sheikh, Egypt, on 21-25 November 2013 by the Arab Academy for Science & Technology, with 88 teams from 48 universities and 12 problems. It lists the problem titles A to L, the first three places and four special awards, the champion of each sub-region (Maghreb, Gulf, Levant, Nile), and a table of the first team to solve each of ten problems, with the time.

    The site also holds the 2013 scoreboard page, the contest's problem set as a PDF of 19 pages, a call for participation PDF for the 2013 contest, and a final standings page for ECPC 2013. Pages and PDFs of other years are in it too: the archive pages for 2014 and later years, a 2014 summary table, problem set PDFs for 2004 to 2015 and 2018, and older pages on the contest's history, rule book and training. Judges' input and output archives (zip files) are held for the 2013 problems A to L, for 2010 problems A to F and for 2014 problems A to H; the others were not saved.

    Our copy holds 149 saved files, 69 of them pages (HTML or PDF), many of them the same page under several addresses.
