    Scoreboard of the 2013 ACM ACPC on the contest's own site: 88 teams with rank, team name, problems solved and total time, and problems A to L as columns. Each problem cell shows a number of attempts and a time, with a dash in place of the time for an attempted problem that was not solved. Seven teams carry an icon titled "Unofficial Team" and are ranked among the others; the remaining 81 teams carry a university logo whose tooltip names the institution. The third place is an unofficial team. The page has the same colour legend (first problem solved, solved problem, first to solve problem, attempted problem) and a per-problem statistics row.

    It carries the site's menu for the other contest years but no final or frozen label.
