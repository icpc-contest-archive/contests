  description: |-
    Statement of the problem "Einbahnstrasse" as a two-page PDF, numbered 4366 and headed "Africa and the Middle East - Africa and Arab - 2008/2009". Tow trucks leave a garage to collect broken cars in a given order over a city of one-way and two-way roads, and the program must report the total distance driven; the statement has a figure, the three road formats, the input and output format, and a sample with four locations and five roads. In English; no test data or solution.
