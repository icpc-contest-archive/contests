    Statement of the problem "Adding up Triangles" as a two-page PDF, numbered 4364 and headed "Africa and the Middle East - Africa and Arab - 2008/2009". A triangle of up to 400 rows of unit triangles holds integer values, and the program must find the sub-triangle with the largest sum; the statement has a figure, a table of sub-triangle counts for N = 1 to 4, the input and output format, and a sample of two triangles. In English; no test data or solution.
