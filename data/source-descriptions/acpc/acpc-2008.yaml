  description: |-
    Problem 4903 on Baekjoon Online Judge, with the site's menus in Korean and the statement in English. The statement, written as a dialogue about the order of goals in a half-time score, asks whether the number of possible goal orders equals the sum of the score, and gives the input and output format and one sample; the page credits it to the 2008 Arab Collegiate Programming Contest as problem E and links to the same problem on the ACM-ICPC Live Archive and HDU Online Judge. Above the statement are the limits (1 second, 128 MB) and the judge's counts at the time: 111 submissions, 51 accepted, 43 users who solved it.
