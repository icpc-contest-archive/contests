  description: |-
    Problem 4905 on Baekjoon Online Judge, with the site's menus in Korean and the statement in English. Banks owe each other money given as a matrix, and the program must print the cash needed to settle all debts before and after reducing the debts; the statement has three figures (a) to (c) of an example with four banks, the input and output format, and one sample. The page credits it to the 2008 Arab Collegiate Programming Contest as problem G, links to the same problem on the ACM-ICPC Live Archive, Sphere Online Judge and HDU Online Judge, and shows the limits (1 second, 128 MB) and the judge's counts at the time: 1 submission, 1 accepted.
