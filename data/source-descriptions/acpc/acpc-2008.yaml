    Statement of the problem "Tobo or not Tobo" as a two-page PDF, numbered 4361 and headed "Africa and the Middle East - Africa and Arab - 2008/2009". A 3 by 3 board of numbered cells has four dials that rotate the cells around them, and the program must find the fewest rotations that bring a shuffled board back to its standard arrangement within a given limit; the statement has figures (a) to (c), the input and output format, and a sample of two boards. In English; no test data or solution.
