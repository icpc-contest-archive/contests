  description: |-
    Statement of the problem "A Day at the Races" as a two-page PDF, numbered 4370 and headed "Africa and the Middle East - Africa and Arab - 2008/2009". From the top eight drivers of each Grand Prix of a Formula One season, with drivers able to change teams, the program must compute the drivers' and the teams' standings under the stated points and tie rules; the statement gives the input and output format and a sample season of two Grands Prix of 2006. In English; no test data or solution.
