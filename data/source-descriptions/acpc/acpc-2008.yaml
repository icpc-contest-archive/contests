  description: |-
    Archive page of the ANARC site for the 2008 contest, in English. It states that the 11th Arab and North Africa Regional Contest was hosted by the Arab Academy for Science and Technology in Alexandria on 22 to 24 November 2008, and that 46 teams from 27 universities in nine countries took part. It lists the ten problems A to J by name, says which were solved by almost all teams and which by none or by two teams, and notes that C, C++ and Java were supported.

    The results section names the first three places and the holders of five special awards, with team members and coaches; it gives no full ranking. A section on the RCD Appreciation Award names two recipients. Links to the roster, the problem set, the final and detailed results and other reports are on the page but are not part of it. The style sheet and three of the four images the page uses are in our copy; the photo 2008-archive.jpg is not.
