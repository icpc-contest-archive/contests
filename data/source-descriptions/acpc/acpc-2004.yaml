  language:
  - en
  problems: 1
  pages: 2
  description: |-
    Statement of the problem "Chop Ahoy!" as a two-page PDF from the ICPC Live Archive, numbered 3248 and headed "Africa and the Middle East - Africa and Arab - 2004/2005". A number is chopped into parts whose squares are added, step after step, and the program must find the fewest steps (at most eight) that turn one number into another; the statement works through 506 to 119 and gives the input and output format and a sample of two cases. In English; no test data or solution.
