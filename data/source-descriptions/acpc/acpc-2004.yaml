  title: 3249 - Give me a break!
  language:
  - en
  problems: 1
  pages: 2
  description: |-
    Statement of the problem "Give me a break!" as a two-page PDF from the ICPC Live Archive, numbered 3249 and headed "Africa and the Middle East - Africa and Arab - 2004/2005". For each dictionary of up to 50,000 words the program must count the words that split into two or more other words of the same dictionary, none shorter than three letters; the statement gives the input and output format and a sample of two dictionaries. In English; no test data or solution.
- url: https://icpcarchive.ecs.baylor.edu/external/32/3250.pdf
