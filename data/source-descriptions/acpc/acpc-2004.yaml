  title: 3246 - Geometry?! Why Not??
  language:
  - en
  problems: 1
  pages: 2
  description: |-
    Statement of the problem "Geometry?! Why Not??" as a two-page PDF from the ICPC Live Archive, numbered 3246 and headed "Africa and the Middle East - Africa and Arab - 2004/2005". A path of up and right steps is given as a string of U and R letters, and the program must compute the area between the path and the straight line from the origin to its end; the statement has a figure, the input and output format, and a sample of two paths. In English; no test data or solution.
