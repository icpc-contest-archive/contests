  description: |-
    Statement of the problem "Da Vinci's Cryptex" as a two-page PDF from the ICPC Live Archive, numbered 3242 and headed "Africa and the Middle East - Africa and Arab - 2004/2005". It asks for the secret word of a cryptex made of rings of 26 letters, given the unlocking word and one known letter of the secret word, and gives a worked example with five rings, the input and output format, and a sample with two test cases. In English; no test data or solution.
