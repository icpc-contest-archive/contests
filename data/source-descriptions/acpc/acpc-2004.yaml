  problems: 1
  pages: 2
  description: |-
    Statement of the problem "F of a and b to the k" as a two-page PDF from the ICPC Live Archive, numbered 3243 and headed "Africa and the Middle East - Africa and Arab - 2004/2005". Given pairs V and K, the program must find a, b and k such that the k-th application of a function f to a and b equals V, or report that there is no solution; the statement gives the definition of f, the input and output format and a sample of five pairs. In English; no test data or solution.
