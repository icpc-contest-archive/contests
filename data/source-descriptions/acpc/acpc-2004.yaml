  description: |-
    Website of the Arab and North African Regional Programming Contest (ANARC) at Kuwait University, in English. The 2004 pages cover the contest overview, the outline of the event (the seventh regional contest, starting 1 December 2004 with the contest itself on 2 December), the event itinerary from 30 November to 3 December, registration and travel, how to get contestants ready, changes from the previous year, and contact details. The 2004 results are on a PC^2 scoreboard page, and the 2004 problem set and the problem sets of 1998 to 2003 are PDFs.

    The address was reused: our copy holds 84 pages and also holds the 2003 site, and a full 2005 site (ANARC 2005) with its own scoreboard, results and problem set. The seed page of our copy is the 2005 cover page. One of the pages is the Kuwait University home page in Arabic.
