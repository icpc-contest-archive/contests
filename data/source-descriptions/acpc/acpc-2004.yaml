  language:
  - en
  problems: 1
  pages: 2
  description: |-
    Statement of the problem "Indistinguishable Blocks" as a two-page PDF from the ICPC Live Archive, numbered 3247 and headed "Africa and the Middle East - Africa and Arab - 2004/2005". The program must count the ways to arrange N identical blocks into piles, for N up to 120; the statement shows the arrangements for N = 3 and N = 4 as pictures and gives the input and output format and a sample of three values. In English; no test data or solution. The sample output is headed "Sample Input" in the document itself.
