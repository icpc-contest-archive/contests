  description: |-
    Statement of the problem "The Long Divide" as a two-page PDF from the ICPC Live Archive, numbered 3244 and headed "Africa and the Middle East - Africa and Arab - 2004/2005". The program must print every step of a long division in an exact layout; the statement lists six formatting rules and gives a sample of four divisions with their laid-out output. In English; no test data or solution.
