  problems: 1
  pages: 2
  description: |-
    Statement of the problem "Partial Overlapping" as a two-page PDF from the ICPC Live Archive, numbered 3245 and headed "Africa and the Middle East - Africa and Arab - 2004/2005". Two copies of a grid of letters are slid over each other, and the program must print the overlapped shape with the most shared letters; the statement has a figure, the input and output format, and a sample of three grids with their output. In English; no test data or solution.
