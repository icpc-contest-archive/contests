  title: 3250 - One for all. All for there exists.
  language:
  - en
  problems: 1
  pages: 3
  description: |-
    Statement of the problem "One for all. All for there exists." as a three-page PDF from the ICPC Live Archive, numbered 3250 and headed "Africa and the Middle East - Africa and Arab - 2004/2005". Given a boolean function of up to nine variables as a string of T and F values, the program must decide queries built from for-all and there-exists quantifiers; the statement works through an example function of three variables and gives the input and output format and a sample of two test cases with nine queries. In English; no test data or solution.
