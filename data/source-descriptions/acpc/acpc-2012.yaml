  title: Archive – 2012 | ACM ACPC
  language:
  - en
  contest_date: '2012-12-12'
  description: |-
    Website of the ACM Arab Collegiate Programming Contest (ACM ACPC), in English, covering several editions. The 2012 archive page reports the Fifteenth ACM Arab Collegiate Programming Contest, hosted by the Princess Sumaya University for Technology in Amman, Jordan, 9-12 December 2012: 91 teams from 49 universities, ten problems A to J with their titles, remarks on how many teams solved which problem, and the first three places and four special awards. It links to a scoreboard page and to the judges' problem set PDF, both in our copy.

    The site also holds archive and scoreboard pages for 2013, pages for the 2014 to 2017 contests, an older version of the site, a judges and problem contributors guide and a volunteering call for 2012, and a results page of the Jordan Collegiate Programming Contest 2012.

    Our copy holds 72 pages, 65 of them distinct: several pages are saved more than once under http, https, www and port 80 addresses.
