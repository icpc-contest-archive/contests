  title: ACPC 2025 Qualified Teams List
  language:
  - en
  teams: 84
  description: |-
    Codeforces blog post titled "ACPC 2025 Qualified Teams List", written after the Egyptian Collegiate Programming Contest (ECPC) 2025 had concluded; it says ACPC will be held at the beginning of December and invites qualified teams to post their details for addition to the list. Three tables follow. University Teams (Details) lists 78 teams with country, university, team name and three members, from Egypt, Jordan, Lebanon, Morocco, Oman, Palestine, Syria, Tunisia and the United Arab Emirates. University Teams (Ratings) gives a team rating for each of the 78 teams. Teens teams lists 6 teams with country, team name, two members and team rating, from Egypt, Lebanon, Syria and Tunisia. Members are given by Codeforces handles.

    A comment thread follows the post. It is a list of teams only, with no results. The page also carries Codeforces menus and sidebars.
