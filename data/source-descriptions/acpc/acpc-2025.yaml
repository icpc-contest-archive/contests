  teams: 150
  description: |-
    Final standings of the 2025 ICPC Africa & Arab Collegiate Programming Championship: 150 teams, each with rank, team name, institution, problems solved, time and a citation. The first 86 teams carry an ordinal citation (First Place and so on) and the other 64 are marked Honorable Mention; tied teams share a rank, so the ranks run to 148. First place is El-Coach Tooor ICPC por favor of Mansoura University - Faculty of Engineering with 10 solved and time 1144.

    There is no per-problem detail and no attempt counts. The page gives the number of teams in its header and refers to the ICPC year 2026.
