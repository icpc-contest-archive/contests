  title: Regional Contest Information
  language:
  - en
  description: |-
    Contest information page for the 2000 ACM Africa and Arab Programming Contest sponsored by IBM. It names Al Akhawayn University, Morocco as host and gives 17 - 19 November 2000 as the dates, with a short paragraph saying that winners of regional contests on six continents advanced to the World Finals in Vancouver. It links to a regional contest home page, the team roster, the standings and the problems.

    Our copy holds 4 pages: this page, the roster (37 team entries, each with institution, team name and coach, and for most the contestants, headed 'Teams as of 1/22/2002'), the standings (34 teams: places 1 to 10 and 24 Honorable Mentions) and the problem set, a 10-page PDF with eight problems. The link to the host university's own contest site leads outside our copy.
