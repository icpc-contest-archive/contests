  description: |-
    Problem set as handed out at the contest: a PDF of 10 pages. The cover names the ACM International Collegiate Programming Contest 2000/2001 sponsored by IBM, the Arab and North African Regional Contest supported by Medi telecom, RAM, BP and EMO, Al Akhawayn University in Ifrane, Morocco, and November 19th, 2000. Eight problems follow, A to H: Convert, Text Justification/Wrapping, Logic World, Maze, Merkle-Hellman Knapsack Public Key Cryptosystem, Arithmetic Progressions, Pseudo Randoms and Sigma. Each has a statement in English with the source, input and output file names; seven of them (all but D, Maze, which gives an example of its input file) have a sample input and output.
