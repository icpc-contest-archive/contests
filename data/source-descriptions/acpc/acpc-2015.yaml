  title: ACM ACPC 2015 | ACM ACPC
  language:
  - en
  description: |-
    Website of the Arab Collegiate Programming Contest (ACM ACPC), in English. Its 2015 contest page announces that the 2015 contest is to be held at Sharm El Sheikh from 20 to 23 November, and the 2015 archive page says it was hosted there on 21-24 November 2015 under the supervision of the Arab Academy for Science & Technology, with 94 teams from 53 universities in 10 countries. That archive page lists the 11 problem titles A to K, the first three places, four special awards, and a short account of which problems were solved.

    The site also holds the 2015 summary scoreboard, the 2016 contest page and a 2014 contest page, older pages on the contest's history, rule book and training, a document on the contest as a multi-tiered competition, and problem set PDFs of other years (2004 to 2014 and 2018).

    Our copy holds 72 saved files, 42 of them pages (HTML or PDF), many of them the same page under several addresses. The 2015 problem set PDF and some other pages did not load when the site was captured and are not in our copy.
