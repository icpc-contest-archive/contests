  description: |-
    Scoreboard of the 2015 Arab Collegiate Programming Contest produced by CSUS PC^2 (version 9.3), with a footer "Last updated Sun Nov 22 14:56:25 EET 2015": 90 teams with rank, name, in most rows followed by a short institution name in brackets, problems solved and total time. Problems A to K are columns, each headed by its letter and below it a colour name (Pink, Silver, Red and so on). Each cell reads two numbers separated by a slash, the second being a dash when the problem is unsolved, and a last column gives total attempts/solved per team. A final row gives, per problem, submissions, time of the first yes and total yes. The nine teams with no solved problem share rank 82. The first place is New Folder (Alexandria U) with 8 problems solved and a time of 1090.
