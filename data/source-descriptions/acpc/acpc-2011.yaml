  title: The 2011 Arab Collegiate Programming Contest — standings
  language:
  - en
  teams: 67
  description: |-
    Standings of the 2011 Arab Collegiate Programming Contest: 67 teams with rank, team, institution, problems solved, time and a citation. Ranks 1 to 10 are single teams; after that teams with the same number of problems solved share a rank: 17 teams at rank 11, 20 at rank 28, five at rank 48 and 14 at rank 54 (none solved a problem), with one team at rank 53. The citation gives the place in words for 33 teams and reads Honorable Mention for the other 34. First place is Neutrinos of the German University in Cairo with 6 problems and time 679. No per-problem detail.
