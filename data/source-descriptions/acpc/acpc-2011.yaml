  title: LAU | The ACM Chapter — Welcome to the 14th ACM Arab Collegiate Programming Contest
  language:
  - en
  description: |-
    Pages of the Lebanese American University's ACM chapter site about the 14th ACM Arab Collegiate Programming Contest (ACM-ACPC), in English. The home page says the Computer Science and Mathematics Department hosts the contest on 26 to 30 November 2011, as a qualifier for the ICPC World Finals in Warsaw in spring 2012, and describes the Beirut campus and the chapter. A registration page explains the three steps for coaches on the ICPC website, with an embedded video, and a travel and accommodation page lists room rates and booking details for three hotels, all with check-in on 27 November and check-out on 30 November.

    The contest information page says only Coming Soon. The rest of the site is the chapter's own pages: council, programming contests, tutorials, events. No results, team list or problems are in it. Our copy holds 11 pages, two of them the same events page under two address spellings, plus a registration form page; the logos and photos the pages refer to are not in it.
