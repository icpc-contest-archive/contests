  title: Summary - The 2024 ICPC Africa and Arab Collegiate Programming Championship
  language:
  - en
  teams: 133
  problems: 14
  times: true
  tries: true
  description: |-
    Scoreboard produced by PC^2 (CSUS PC^2 9.11, installed and configured by ACPC), showing the state when it was last updated, Sun Dec 08 14:11:25 GMT 2024: 142 problem cells are still marked as pending judgement, so it is a frozen scoreboard, not the final result. It lists 133 teams with rank, team name with institution in parentheses, problems solved and time. Ranks run from 1 to 110, and the 24 teams with no solved problem share rank 110 as the last group.

    Fourteen problems A to N each have a column giving attempts and the time of the accepted solution (for example 3/123), followed by a total of attempts and solved problems. The problem columns carry colour names in a second header row (Yellow, Blue, Gold and so on). A legend marks first-to-solve, solved, attempted and pending cells, and a bottom row labelled Submitted/1st Yes/Total Yes gives three figures per problem. Damascus U is in first place with 10 solved. No medals or citations are shown.
