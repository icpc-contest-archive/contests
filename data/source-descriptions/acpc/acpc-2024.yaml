  title: The 2024 ICPC Africa & Arab Collegiate Programming Championship — standings
  language:
  - en
  teams: 112
  description: |-
    Final standings of the 2024 ICPC Africa & Arab Collegiate Programming Championship: 112 teams, each with rank, team name, institution, problems solved, time and a citation. The first 56 teams carry an ordinal citation (First Place and so on) and the other 56 are marked Honorable Mention. First place is El Tor 3ada wna 3al M5da of Cairo University - Faculty of Computers and Artificial Intelligence with 10 solved and time 1030.

    There is no per-problem detail and no attempt counts. The page gives the number of teams in its header and refers to the ICPC year 2025.
