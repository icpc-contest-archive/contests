  description: |-
    Page ACPC2024 of the ACPC website (the Africa and Arab Collegiate Programming Championship, with its name also given in Arabic). It is an information page for the 2024 championship held at the Jolie Ville Kings Island resort in Luxor, Egypt: a short text on Luxor, a description of the resort and tips for the stay, and a note that ACPC is a qualifying round for the ICPC and that its winners qualify to the ICPC World Finals.

    Our copy holds this one page. The menu links to rules, online contests, gallery, calendar, schedule and registration lead to pages that are not in our copy, and there are no results or problems on the page.
