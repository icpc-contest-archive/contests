  copy: tunisia/tunisia-2024/standings/20261020-live-4baed207/page.html
  title: ACPC 2024 qualified teams list
  language:
  - en
  teams: 67
  description: |-
    Codeforces blog post titled "ACPC 2024 qualified teams list", written by a Codeforces user as a list of teams qualified for ACPC. The post says ACPC is supposed to be in December and asks teams to comment if they are missing or if their details are wrong. It holds two tables: University Teams with 56 teams (country, university, team name, three members, team rating) from Egypt, Ethiopia, Jordan, Palestine, Syria and Tunisia, and Teens Teams with 11 teams (country, team name, two members, team rating) from Egypt, Lebanon and Saudi Arabia. Members are given by Codeforces handles. Teams are ordered by team rating. The comment thread below the post is also in our copy, with teams asking for corrections or adding their own details. It is a list of teams only, with no results.

    The page also carries Codeforces site elements such as menus and sidebars, and our copy keeps its stylesheets and images.
