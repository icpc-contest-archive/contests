  description: |-
    Scribd page for a 14-page document titled The 27th Annual ACM International Collegiate Programming Contest, uploaded under the file name anarc2002. Its summary says the document describes programming problems on anagram chains, reconstructing a crossword from a grid and a word list, and renumbering the streets and buildings of a city (City of Flatland), matching the first three problems of the contest's problem set.

    Our copy holds the Scribd page with this summary and the site's menus; the pages of the document itself are not in it.
