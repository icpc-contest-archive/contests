  description: |-
    Problem set of the Arab and North African 5th Regional Contest, a PDF of 14 pages in English. The cover names the 27th Annual ACM International Collegiate Programming Contest, sponsors IBM and Microsoft, the American University in Cairo and 2 November 2002, and states a 120 second limit per submission.

    Eight problems follow, labelled A to H: Anagrams, Crossing the Words, City of Flatland, Pushing Carts, Palindromes, Why Johnny Can't Count, Snakes & Ladders and Prime Spiral. Each has a description, input and output format and a sample input and output, with the program and file names to use. No test data or solutions.
