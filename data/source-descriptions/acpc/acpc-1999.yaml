    Final standings on a plain web page: 16 teams with rank, team name (university or school with a team number), number of problems solved and total time. American University in Cairo1 is first with 3 problems and 699, followed by Al Akhawayn University in Ifrane 2 with 3 and 734. Eleven ranks are given from 1 to 11; the last five teams, with no problems solved, share rank 12. There is no per-problem detail.
