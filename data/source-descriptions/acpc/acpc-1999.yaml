  description: |-
    Small website of the 1999 ACM Arab and African Regional Programming Contest (AARC'99). The home page, headed as the official Arab and North-African Regional Contest (AARC'99) homepage, says the contest is over, congratulates the winners, shows sponsor logos and links to Standings, Problem Set and Pictures.

    Our copy holds twelve addresses, of which three are pages: the home page, the final standings page (16 teams with rank, solved and total time) and the problem set as a PDF of nine pages with seven problems. Seven logo images are saved beside them; one sponsor logo is missing. The Pictures page is linked but not in our copy.
