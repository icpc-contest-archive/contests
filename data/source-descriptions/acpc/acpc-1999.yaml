  language:
  - en
  contest_date: '1999-11-21'
  problems: 7
  pages: 9
  description: |-
    Problem set as handed out at the contest: a PDF of nine pages. The cover names the ACM International Collegiate Programming Contest 1999/Y2K, sponsored by IBM, the Arab and African Regional Contest supported by Omnidata, RAM, BP and EMO, Al Akhawayn University in Ifrane, Morocco, and 21 November 1999, and states that the set holds seven problems.

    The problems are numbered 1 to 7: Converter, Factorial, Job Processing, Rectangular Patterns, Windows, Sequence and Activity Scheduling. Each has a statement in English with the source, input and output file names and the input and output format. Six have Sample Input and Sample Output sections; Sequence gives an example input line and output lines instead. No test data or solutions.
