    Statement of problem 4970, "A Knights' Tale", as a PDF of two pages, headed "Africa and the Middle East - Africa and Arab - 2010/2011" and footed "Africa and Arab 2010-2011". N knights on an unbounded chess board must reach N target squares, and the program must find the fewest knight moves; the statement has a figure of the knight's move, the input and output format, and a sample of one case. In English; the PDF does not give the problem's letter in the contest.
