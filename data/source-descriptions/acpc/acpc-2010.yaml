  description: |-
    Statement of problem 4969, "World of cubes", as a PDF of two pages, headed "Africa and the Middle East - Africa and Arab - 2010/2011" and footed "Africa and Arab 2010-2011". N equal axis-parallel cubes centred on given focal points must fill a box-shaped hall, and the program must find the smallest edge length; the statement has the input and output format and a sample of two cases, and the second page holds only the footer. In English; the PDF does not give the problem's letter in the contest.
