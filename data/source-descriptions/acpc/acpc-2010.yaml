  description: |-
    Statement of problem 4966, "Normalized Form", as a PDF of two pages, headed "Africa and the Middle East - Africa and Arab - 2010/2011" and footed "Africa and Arab 2010-2011". The program must evaluate a boolean expression given as an AND/OR tree in parenthesised form, with T and F as leaves; the statement has an example tree, the input and output format, and a sample of three expressions. In English; the PDF does not give the problem's letter in the contest.
