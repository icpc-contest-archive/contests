  description: |-
    Statement of problem 4968, "Sometimes, a penalty is good!", as a PDF of two pages, headed "Africa and the Middle East - Africa and Arab - 2010/2011" and footed "Africa and Arab 2010-2011". Given the number of groups, teams per group, teams advancing from each group and teams advancing directly, the program must count the games of a World Cup style tournament and the teams to add so that the knockout stage has a power of two; the statement has the input and output format and a sample of two cases. In English; the PDF does not give the problem's letter in the contest.
