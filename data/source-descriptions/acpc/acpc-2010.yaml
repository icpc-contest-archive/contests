  description: |-
    Statement of problem 4964, "What's Next?", as a PDF of one page, headed "Africa and the Middle East - Africa and Arab - 2010/2011" and footed "Africa and Arab 2010-2011". Given three successive members of a sequence, the program must tell whether it is an arithmetic or a geometric progression and print the next member; the page has the input and output format and a sample of two cases. In English; the PDF does not give the problem's letter in the contest.
