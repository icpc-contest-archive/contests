  title: 'ACM/ICPC/ACPC: Arab Collegiate Programming Contest'
  language:
  - en
  description: |-
    Website of the ACM/ICPC Arab Collegiate Programming Contest (ACPC), in English. The home page carries news items from July 2010: the 2010 call for authors, the contest's new name and domain, and the 2010 eligibility rules. Other pages cover the contest, a rulebook with its section list, training pointers, a community page and an archive with year pages from 1998 to 2010.

    The 2010 archive page describes the thirteenth contest, hosted by the Lebanese American University in Beirut on 25-27 November 2010: 54 teams from 31 universities in twelve countries, nine problems A to I, a note on the programming languages used, the winners and special awards, and links to a roster, final and detailed results, a summary of solved problems, and per-problem input and output files. Those linked documents are not in our copy. The archive pages for 2005 to 2009 also hold content, and our copy has the 2008 and 2009 problem-set PDFs and the eligibility rules as PDF. Our copy holds 31 pages, eight of them under-construction notices: the search and sitemap pages and the archive pages for 1998, 1999 and 2001 to 2004.
