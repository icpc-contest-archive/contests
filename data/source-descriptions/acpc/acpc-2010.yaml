  description: |-
    Statement of problem 4972, "The Cyber Traveling Salesman", as a PDF of two pages, headed "Africa and the Middle East - Africa and Arab - 2010/2011" and footed "Africa and Arab 2010-2011". A variant of the travelling-salesman problem: the program must find the cheapest cycle of roads through up to eight cities when every crossing of roads away from a city adds a bridge cost; the statement has the input and output format and a sample of two cases. In English; the PDF does not give the problem's letter in the contest.
