  description: |-
    Statement of problem 4965, "Sum the Square", as a PDF of three pages, headed "Africa and the Middle East - Africa and Arab - 2010/2011" and footed "Africa and Arab 2010-2011". Repeatedly summing the squares of a number's digits leads into one of two cycles, and the program must find the fewest numbers to generate from two starting values until their sequences meet; the second and third pages hold the two figures of numbers falling into the 89 cycle and the 1 cycle, then a sample of three cases. In English; the PDF does not give the problem's letter in the contest.
