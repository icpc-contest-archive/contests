  description: |-
    Statement of problem 4971, "Jumping Beans", as a PDF of two pages, headed "Africa and the Middle East - Africa and Arab - 2010/2011" and footed "Africa and Arab 2010-2011". Beans in a line jump by swapping places to the right under the stated rules, and the program must print their order after T seconds; the statement works through an example with four beans and has the input and output format and a sample of two cases. In English; the PDF does not give the problem's letter in the contest.
