  description: |-
    Statement of problem 4967, "Tri graphs", as a PDF of two pages, headed "Africa and the Middle East - Africa and Arab - 2010/2011" and footed "Africa and Arab 2010-2011". The program must find the cheapest path from the top-middle to the bottom-middle vertex of a graph of N rows and three columns whose costs sit on the vertices; the statement has an example figure for N = 4, the input and output format, and a sample of one case. In English; the PDF does not give the problem's letter in the contest.
