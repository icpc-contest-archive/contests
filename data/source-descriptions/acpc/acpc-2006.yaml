  copy: acpc/acpc-2006/website/2026-09-05-wayback-a8d09f5c
  title: ACM International Collegiate Programming Contest, Ninth Arab and North Africa Regional Contest, Al Akhawayn University in Ifrane, 30 November - 3 December, 2006
  language:
  - en
  contest_date: '2006-12-02'
  description: |-
    Website of the Ninth Arab and North Africa Regional Contest, hosted by Al Akhawayn University in Ifrane and run by an organizing committee, in English. Its contest pages cover the about section (outline, contest format, eligibility, expenses and financial support), registration (coach account, deadline 15 November 2006, trip planning, travel support, visa to Morocco, accommodation options in Ifrane), the event itinerary from 30 November to 3 December with the contest on Saturday 2 December from 10:00 to 15:00, a news page, a contact page and a list of sponsors (ACM, IBM, ANRT, Royal Air Maroc). The contest format page states a five-hour contest with six to nine problems; an eligibility decision tree is included as a PDF.

    Our copy holds 120 files saved from 122 addresses of the university's web server, of which only 18 are contest pages: 17 pages and the eligibility decision tree PDF. The others are pages of other university offices and units (the president's cabinet, registrar, financial aid, careers, an incubator, alumni and similar). The contest's standings page is linked from the menu but is not part of our copy, and no problem statements or results are inside. The contest pages carry no images or style sheets.
