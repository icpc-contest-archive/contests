  description: |-
    Final standings from the contest's own pages, under the heading of the Ninth Arab and North Africa Regional Contest at Al Akhawayn University in Ifrane, 30 November to 3 December 2006, with the site menu. A first table gives 22 ranked teams with name and institution in brackets and problems solved: places 1 to 12 carry a time, and ten teams tied at ranks 13 and 16 are listed with solved only. Brainiacs (AAST) lead with 8 solved and a time of 1253. Below it a list headed Honorable Mention names 20 further teams without rank or results, and a last table gives a region and champion. In all 42 teams are listed. There is no per-problem detail. The page was produced by PC2 and links to a problem set and a photos page that are not part of this document.
