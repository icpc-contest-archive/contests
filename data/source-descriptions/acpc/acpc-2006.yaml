  description: |-
    Standings page headed "The 2006 ACM Arab & North Africa Programming Contest sponsored by IBM". It lists 44 teams with rank, team (institution followed by the team name), a citation such as First Place, number solved and total time. Forty teams are ranked, from Brainiacs of the Arab Academy for Science and Technology (8 solved, time 1253) in first place; ranks 24 and 25 do not appear, and three teams with no problem solved share rank 40. Four further teams are listed at the end as Honorable Mention, without rank, solved count or time. There is no per-problem detail.
