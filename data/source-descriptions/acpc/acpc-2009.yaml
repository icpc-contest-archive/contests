  title: 'ACM/ICPC/ANARC: 2009 Archive'
  language:
  - en
  description: |-
    Website of the Arab and North Africa Regional Contest (ANARC), in English. The 2009 archive page states that the 12th contest was hosted by the Arab Academy for Science and Technology in Alexandria on 22 to 24 November 2009, with 45 teams from 29 universities in nine countries registered, and lists the ten problems A to J by name. It names the first three places, the special awards and the RCD appreciation awards. The home page in our copy was last updated on 27 November 2009 and carries site news including the three teams advancing to the 2010 World Finals. The PC2 results pages for 2009 (summary, full list and reports) are inside, as are the rules, scoring, appeals, eligibility, registration and training pages.

    As the series site, our copy of 136 pages also holds the archive pages and results of other years, including 2005 to 2008 and 2010, and problem set PDFs for 1998 to 2007 and 2010. Seven of the 136 pages are unrelated Japanese-language pages from captures of the domain in 2015 and 2016. The 2009 problem set PDF, the judges' input and output archives and the roster are linked from the 2009 archive page but are not in our copy.
