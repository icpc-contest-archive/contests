  title: ANARC 2007
  language:
  - en
  contest_date: '2007-12-03'
  description: |-
    Website of the Arab and North African Regional Contest (ANARC), in English. The 2007 contest site as it stood in December 2007 is represented by its home page for ANARC 2007 (hosted by the Arab Academy for Science and Technology in Alexandria, with a notice of 14 September 2007 that registration is open) and a travel information page; the pages its menu links to (rules, registration and fees, schedule and others) are not in our copy.

    The copy also holds the 2007 archive pages of the series site: an account of the contest with the ten problems, results and special awards, a second page headed ANARC 2007 with a narrative of the contest, the PC2 results pages for 2007 (summary with attempts and times per problem, full list, text reports) and the 2007 problem set as a PDF.

    As the series site, our copy of 136 pages also holds pages of other editions: archive and PC2 results pages for 2005, 2006, 2008, 2009 and 2010, problem set PDFs for 1998 to 2002, 2005 and 2010, two 2008 newsletter pages, general pages on rules, eligibility and training, and student forum pages. Some pages are stored under several addresses.
