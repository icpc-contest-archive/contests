  description: |-
    Archive page of the ANARC site for the 2007 contest, in English. It states that the 10th Arab and North Africa Regional Contest was hosted by the Arab Academy for Science and Technology in Alexandria on 3 to 5 December 2007, and that 44 teams from 27 universities in nine countries took part. It lists the ten problems A to J by name and tells which were solved or not attempted, and that C, C++ and Java were supported. The results section names the first three places and the holders of four special awards, with the team members and coaches, and links to the final and detailed results. The roster and the other reports are linked, not part of this page.
