  description: |-
    Final standings of the 2007 ACM Arab & North Africa Programming Contest, as shown by the ICPC regional standings page: 45 teams with rank, institution and team name, a citation (First Place to Forty-second Place), number of problems solved and total time. Cairo University is first with 7 problems solved. Four teams share forty-second place with no problems solved. There is no per-problem detail.
