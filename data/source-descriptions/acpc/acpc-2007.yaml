    Scoreboard summary produced by PC² (the footer reads "Created by CSUS PC^2 8.7" and "Last updated Wed Dec 05 15:56:47 EET 2007"): 45 teams against ten problems A to J, each column also labelled with a colour name (Red, Yellow, Blue and so on). Each row gives rank, team name with its institution in parentheses, problems solved, total time, attempts and solve time for every problem, and total attempts and solved. A last row headed "Submitted/1st Yes/Total Yes" gives, per problem, the submissions, the time of the first accepted run and the total accepted. FCI-Cairo Univ. 1 (Cairo U - FCI) is first with seven problems; ranks 24 and 42 are shared.
