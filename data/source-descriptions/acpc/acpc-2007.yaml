  description: |-
    Problem set as handed out at the contest: a PDF of 15 pages. The cover names the 32nd Annual ACM International Collegiate Programming Contest, sponsored by IBM, the Arab and North Africa Tenth Regional Contest, the Arab Academy for Science and Technology and Maritime Transport in Alexandria, Egypt, and December 2007, and says the set has 14 numbered pages. Ten problems follow, A to J, each with program and input file names, a balloon colour and a sample input and output. Nine have a description with input format and output format sections; problem D is written as a dialogue and has no such sections. The statements are in English.
