  contest_date: '2003-12-04'
  problems: 9
  pages: 17
  description: |-
    Problem set as handed out at the contest: a PDF of 17 pages, a cover page and 16 numbered pages. The cover names the 28th Annual ACM International Collegiate Programming Contest, the Arab and North Africa 6th Regional Contest, Kuwait University, 4 December 2003, with Kuwait University, the Kuwait Foundation for the Advancement of Science, IBM, NCS and GBM as sponsors, and states a limit of 60 seconds per submission. Nine problems follow, labelled A to I: Isomorphic Numbers, Macrosoft Word, Johnny the Taxi Driver, In Memory of Denis Roskin, The Game of Nubble, Traffic Control, Who Is the Real Second, The Game of Yazoo and XML+XPATH=XSLT. Each has a description in English, input and output format, the program and input file names and a sample input and output. No test data or solutions.
