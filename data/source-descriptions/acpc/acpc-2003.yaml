  description: |-
    Category page of the ACM-ICPC Live Archive online judge for Regionals 2003, Africa/Middle East, Africa and Arab. It lists nine problems with archive numbers 2975 to 2983: Isomorphic Numbers, Macrosoft Word, Johnny the Taxi Driver, In Memory of Denis Roskin, The Game of Nubble, Traffic Control, Who Is the Real Second, The Game of Yazoo and XML+XPATH=XSLT. For each it shows total submissions and total users with the solving percentage; the date shown on the page is 9 March 2015. Each title links to a problem page that is not in our copy, so only the titles are held, not the statements. The contest letters are not shown. The rest of the page is the judge's menu and login form.
