  read: '2026-11-16'
  rubric: 1
  copy: acpc/acpc-2003/website/2026-09-04-wayback-d5d30ede
  title: acm International Collegiate Regional Programming Contest. ANARC 2003
  language:
  - en
  contest_date: '2003-12-04'
  description: |-
    Website of the Arab and North African Regional Programming Contest (ANARC) 2003, organised by Kuwait University, in English. Its pages cover an overview of the ACM contest, the outline of the event, team eligibility, contest format, registration (last day 28 November 2003), travel support of US$500 per institute, accommodation and visas, the itinerary from 2 to 5 December 2003 with the contest on Thursday 4 December from 10:00 to 15:00, the keynote speaker, tips for training, the contest environment (Windows XP, C, C++ and Java, PC^2 8.5) and contact details. The PC^2 scoreboard summary and the problem set PDF of this edition are in our copy.

    The address was reused for later years. Our copy holds 108 files: 58 HTML pages, 25 PDFs, 20 images, 4 style sheets and a Java archive. Besides the 2003 pages it holds the 2004 and 2005 editions of the site, with a 2004 results page and a 2005 results page, and the previous problem sets of 1998 to 2004 as PDFs. It also holds a front page with links to a score board and two webcams of the contest halls, and an Arabic-language page headed Kuwait University. Many pages exist under several addresses.

    Several images of the 2003 pages (banner, cover picture, some photos) are not in our copy, and the links to the score board, webcams and other outside sites lead outside it.
