  description: |-
    Website of the ACM programming contests run by the Faculty of Computers and Information, Cairo University, in English, built from frames. Our copy holds 57 pages (30 HTML pages and 27 PDF documents), several saved twice under two forms of the same address. The menu pages cover an overview of the ICPC, team registration (a form for 2006 and a notice that registration ended on 7 November 2007), advice for contestants, and contact details. Two event pages give the schedules of ANARC 2005 (18 to 20 November 2006) and ANARC 2007 (11 November 2007). The event results page links a 32-page PDF of team slides and shows a summary table of 50 teams for problems A to I.

    The archive page lists the Egyptian National Contest by year, from 2009 back to 2000, with columns for problem set, judge I/O, scoreboard and analysis. For 2008 it links the problem set (the Seventh Egyptian National Contest PDF) and a summary page: a scoreboard of 47 teams with rank, problems solved, time, and for each problem A to I attempts and time of the solve, or -- when unsolved. The site also holds problem sets of the Arab and North Africa regional contest for 1998 to 2008 and other national contest problem sets and summaries, so it covers more editions than 2008. The test data archives listed on the archive page are not in our copy.
