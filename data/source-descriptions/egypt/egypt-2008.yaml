  description: |-
    Problem set: a PDF of 17 pages with a cover naming the Seventh ACM Egyptian National Programming Contest, the Faculty of Computers and Information, Cairo University, and 8 November 2008, a short note to contestants, and a table of nine problems A to I (Party, Scales, BF, Highlights, Palindrome, Shortcut, Kings, Subset, Primes) with time limit and balloon colour. Each problem has a statement in English with the program and input file names, input and output specification and sample input and output. No test data or solutions.
