  description: |-
    Frozen scoreboard of the 2026 ICPC Egyptian Collegiate Programming Contest, produced by PC^2. The banner reads "Scoreboard is frozen" with elapsed time 5:00:00, and the footer says "Last updated: Sun Aug 23 13:49 UTC 2026". Submissions made during the blind period are shown as pending. Our copy holds four pages of the same scoreboard under four group tabs: All groups with 348 teams, ECPC with 345, Official summary with 345, and Unofficial with 3 teams.

    Each page has a photo column, rank, team name with the institution abbreviation in brackets, problems solved and penalty, and one cell per problem A to O, named in the header (A. Training Camp to O. AASTMT Cycles), with attempts and solve time. A row at the bottom gives submissions, first yes and total yes per problem. The first place team in All groups has 11 problems solved. The three teams of the Unofficial tab are also ranked among the others in All groups; the ECPC and Official summary pages leave them out.

    The stylesheet, script and logo are in our copy. The team photos the pages link to are not in our copy.
