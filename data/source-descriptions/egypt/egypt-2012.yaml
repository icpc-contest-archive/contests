  description: |-
    Website of the Egyptian Collegiate Programming Contest (title 'Egyptian Collegiate Programming Contest'), in English. The home page says the 2012 contest is hosted by the Arab Academy for Science, Technology & Maritime Transport in Alexandria on 1 and 2 November 2012, and carries notices of the 2012 call for authors and call for volunteers (both dated October 20, 2012) and a few short items about the orientation session, hardware preparation and decoration. The other pages are About (history of the Arab Collegiate Programming Contest and the ICPC), Rules (general rules, rules for the contest hall, eligibility, appeals, contest format, awards and the PC^2 judging system), Register (how contestants, coaches and volunteers register through ICPC), Training (pointers and links to earlier problem sets), Schedule and Contacts (a contact form and the address in Alexandria). The Schedule page has no schedule in it, and the pages carry template filler text in their side columns.

    Our copy holds 24 files: seven distinct pages of the site (the home page is saved three times), a placeholder page, and 14 PDFs. Two are 2012 notices: a 3-page guide for judges and problem contributors for the 2012 ACM Arab Collegiate Programming Contest, which names Princess Sumya University for Technology in Amman, Jordan as host of that contest, and a one-page flyer inviting volunteers. The other twelve are problem sets of earlier Arab regional contests, anarc1999 to anarc2009 and acpc2010, of 9 to 17 pages each. The 2003 file is cut short and does not open. No results or team list for 2012 are in the copy.
