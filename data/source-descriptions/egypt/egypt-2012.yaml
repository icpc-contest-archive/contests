  description: |-
    Standings of the 2012 Egyptian Collegiate Programming Contest: 94 teams with rank, team name, institution, problems solved and total time. Ranks run from 1 to 78 with ties shared; six teams that solved nothing at the end of the list carry no rank. First place is Supercalifragilistic of Alexandria University - Faculty of Engineering with 8 solved. No per-problem detail.
