  contest_date: '2023-03-16'
  description: |-
    Website of the Tehran site of the ICPC Asia region, with the Department of Computer Engineering of Sharif University of Technology named in its footer, in English with some Persian. It is the site of the 2022 Tehran regional contest and carries this online contest as the 19th Iran Internet Programming Contest, 16 March 2023, with a page linking problems, rankings and test cases. The registration page sets a deadline of 9 March 2023, says only teams with a solved problem go on to the regional, and gives a limit of 75 teams. Other pages cover general information, committees, contact, schedule, and an archive of Tehran regional contests from 1999 to 2022 (no 2021 entry) and internet contests from 2002 to 2007.

    The online contest's scoreboard has 396 teams against problems A to J, with solved, total time and per-problem minutes and tries; 115 teams solved nothing. Its problem set is a Persian PDF of 13 pages with ten problems A to J. The regional contest has a scoreboard of 62 teams (problems A to K), an English problem set of 19 pages with judging notes and 11 problems, a one-page quota table and a one-page Persian registration form.

    Our copy holds 78 files, 35 of them saved pages and documents, many kept under both http and https; one is a "Not found" page. The online contest's poster PDF is cut off at 1048576 bytes and does not open. The photos page lists albums; none of the 62 pictures of the Teams album is in our copy.
