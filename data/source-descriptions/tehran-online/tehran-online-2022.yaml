    Contest page on QOJ.ac for the 2022-2023 ICPC Asia West - Tehran Online Regional Contest, filed under ICPC, Regionals, Asia West Continent, Iran. It lists ten problems A to J with Persian titles and links a Persian statements attachment. The page shows the contest as ended, with the ICPC ruleset, a 20 minute penalty, a limit of 1000 submissions per problem, and a scoreboard frozen after 4:00:00. The notice and questions sections are empty.

    Only this page is in our copy: the statements attachment and the standings are not.
