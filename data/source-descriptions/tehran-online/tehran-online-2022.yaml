  description: |-
    Problem set in Persian: a PDF of 13 pages with ten problems, A to J. The first page of each problem carries the header "نوزدهمین مسابقه‌ی اینترنتی برنامه‌سازی دانشجویی ایران" (19th Iran Student Internet Programming Contest), followed by lines naming the West Asia regional preliminary, Tehran site, at Sharif University of Technology, on 25 Esfand 1401 (16 March 2023).

    Each problem has its statement, input, output and constraints sections, and two or three sample inputs with their outputs. Problems D, F and I take two pages each, the others one; a footer gives the problem letter and page.
