    Statement of one problem as a PDF of 2 pages, headed "5835 Flood-it!"; page 2 carries the line "ACM-ICPC Live Archive: 5835 – Flood-it!" with the page number. It describes the Flood-it puzzle on an N × N board of six colours (N from 2 to 8) and asks for the minimal number of steps to turn the board a single colour. Input and output format and a sample input and output are included, with two figures as pictures.
