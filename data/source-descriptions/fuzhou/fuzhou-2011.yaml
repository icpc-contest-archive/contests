  description: |-
    Statement of one problem as a PDF of 2 pages, headed "5836 Running relay"; page 2 carries the line "ACM-ICPC Live Archive: 5836 – Running relay" with the page number. Team members run a relay track of length L, each at least d meters, with a time per meter in a good mood and one that is at least as large in a bad mood; the task is to minimise the total time T in good moods subject to the total time S in bad moods not exceeding W, or print "No solution". Input and output format, a hint and a sample input and output are given.
