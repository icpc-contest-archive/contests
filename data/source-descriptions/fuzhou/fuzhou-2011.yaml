    Statement of one problem as a one-page PDF with no heading, number or contest name printed. The story is about a race on a tree of N houses joined by N − 1 roads with lengths: for each query Q, find the maximum number of consecutively numbered starting houses such that the difference between the longest and the shortest distance run is at most Q. Input and output format and one sample input and output are given.
