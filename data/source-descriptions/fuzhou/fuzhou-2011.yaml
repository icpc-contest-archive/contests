    Statement of one problem as a PDF of 3 pages, headed "5829 Xiangqi"; pages 2 and 3 carry the line "ACM-ICPC Live Archive: 5829 – Xiangqi" with the page number. It explains the Xiangqi rules needed (the 10 × 9 board, general, chariot, cannon and horse) and asks whether a position with a black general and red general, chariots, cannons and horses is checkmate, answering YES or NO for each of up to 40 test cases. Input and output format, a hint on the first two situations and a sample input and output are given. The figures of the pieces are pictures in the PDF.
