    Statement of one problem as a one-page PDF with no heading, number or contest name printed. It concerns porcelain exhibitions in the provinces of China, modelled as the faces of a connected planar graph, with limits on how many porcelains may cross each boundary; the output is the maximal number of porcelains that can be exhibited, or -1. Input and output format and a sample input and output are given.
