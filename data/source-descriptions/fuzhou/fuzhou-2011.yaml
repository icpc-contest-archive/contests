    Statement of one problem as a PDF of 3 pages, headed "5832 My World Cup"; pages 2 and 3 carry the line "ACM-ICPC Live Archive: 5832 – My World Cup" with the page number. It explains a two-player board game played with a six-sided dice and cards of four types (foul, offense, defense, attack), the turn rules and extra time, and asks for the probability that Alice wins. Input and output format and a sample input and output are included.
