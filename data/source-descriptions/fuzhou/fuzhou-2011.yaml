    Standings of the Fuzhou regional: 133 teams from 83 institutions, each with rank, institution, number of problems solved, time and a citation. Ranks run from 1 to 79 with ties; 95 teams carry a place citation ("First Place" and so on) and the 38 teams from rank 68 to 79 carry "Honorable Mention". Y.E.S of Tsinghua University is first with 7 problems and 1147 and machinator of Tsinghua is second with 7 and 1298. 17 teams solved no problem. No per-problem results or attempts are given.
