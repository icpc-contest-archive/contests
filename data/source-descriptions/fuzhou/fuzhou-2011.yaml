    Statement of one problem as a PDF of 2 pages, headed "5830 Alice’s mooncake shop"; page 2 carries the line "ACM-ICPC Live Archive: 5830 – Alice’s mooncake shop" with the page number. It describes a 24-hour mooncake shop where the cost of making a mooncake varies by hour and storing one costs a fixed amount per hour for a limited storage life, and asks for the minimum cost of filling a list of dated orders. Input and output format, a hint and one sample input and output are given.
