    Statement of one problem as a PDF of 2 pages, headed "5834 Genghis Khan the Conqueror"; page 2 carries the line "ACM-ICPC Live Archive: 5834 – Genghis Khan the Conqueror" with the page number. A story about cities joined by roads where guarders must be set up at minimal total cost so that every two cities are connected; one road's cost may rise, and the output is the expected new minimal total cost. Input and output format, a hint and a sample input and output are given. The figure of the map is a picture in the PDF.
