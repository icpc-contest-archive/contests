  description: |-
    Scoreboard of the on-site contest in Fuzhou, headed ICPC 2011 福州赛区现场赛 排行榜 (ICPC 2011 Fuzhou regional on-site contest ranklist), with the line "Last updated: 2011/11/28 13:12:21 (Start: 2011/11/20 09:00)" and a note that gold, silver and bronze medals number 15, 28 and 43. It lists 142 team rows with school number, school (in Chinese), rank, team name, problems solved and penalty time. Problems A to J each show attempts and time of the accepted run (for example 2/81); an unsolved problem with attempts shows the attempt count only. The column heads carry a pair of totals per problem (A 123/538). The first place, Seraphim of Shanghai Jiao Tong University, solved 7 problems in 987. A legend names three kinds of problem cell (first to solve, solved, attempted), and the page has links labelled on-site photos and contest problems that lead outside our copy.

    Nine rows carry an asterisk in place of the school number, and the page does not explain it. Sixteen teams solved no problem. The page also lists links to boards of other regional contests from 2011 and 2012, which lead outside our copy.
