  description: |-
    Online judge of Fujian Normal University, in English and Chinese, not a site of the 2011 Fuzhou regional. Our copy holds 145 pages captured between 2007 and 2016: the front page, problem list and 54 problem pages (one of them a "Problem is not available" page), status and ranking pages, a user list with 31 user profile pages, a web board, a photo album, and a contest list and 16 contest pages for the university's own training sessions and contests of 2014 to 2016, titled for example GoldCoder Run. 33 of the pages carry a banner link with a Chinese caption meaning "ACM Asia qualifier, Fuzhou regional, advancement round"; the page it points to is not in our copy.

    Apart from that banner and a link on the front page headed with the Chinese words for "official site of the ACM Asia qualifier, Fuzhou regional", the only statement about the regional is on a 2016 team page of the university, which says the university hosted the 36th ACM-ICPC Asia regional (Fuzhou) in 2011. No scoreboard, team list or problems of that contest are in our copy.
