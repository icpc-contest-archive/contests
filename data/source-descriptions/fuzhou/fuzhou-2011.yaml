    Statement of one problem as a one-page PDF with no heading, number or contest name printed. A fleet of one battle-cruiser (a 3D convex hull) and several spherical magnetic shields casts shadows on the ground plane under parallel radiation; the task is to output the area of the shadow rounded to four decimal places. Input and output format and one sample input and output are given.
