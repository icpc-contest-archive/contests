  description: |-
    Front page of the 2010 Fuzhou regional's website, in Chinese, with the copyright line of the School of Mathematics and Computer Science of Fuzhou University. A menu leads to the contest introduction, organisation, rules, environment, schedule, registration, results and an English version. The page shows a table of important dates (online round registration from 27 August to 30 September, online round on 10 October, on-site registration deadline 25 October, on-site registration 19 November, on-site contest 20 to 21 November), a list of eight news items, contact details, a sponsors heading, links to Fuzhou University and a personal blog, and travel and hotel guides. The news items include the on-site problems download, the on-site photos download, the results, the warm-up and out-of-competition ranking address, the invitation letter and the rules for advancing from the on-site contest.

    Our copy holds this one page only; the pages the menu and news items link to are not part of it.
