  description: |-
    Scoreboard of the on-site contest in Fuzhou, headed ICPC 2010 福州赛区现场赛 排行榜 (ICPC 2010 Fuzhou regional on-site contest ranklist) and stamped "Last updated Sun Nov 21 14:33:58 CST 2010". It lists 153 team rows with school rank, school (in Chinese), overall rank, team name with team number, problems solved and penalty time. Problems A to J each show a number of attempts and a time (for example 1/243), or attempts and -- when no time is given (0/-- or 11/--), with a colour name under each problem letter and a total of attempts and solved problems per team. The first place, Luminer of Shanghai Jiao Tong University, solved all ten problems in 1208. A bottom row, labelled Submitted/1st Yes/Total Yes, gives three numbers per problem.

    In the school rank column 96 rows carry a school rank, 14 rows carry an asterisk, and 43 rows are blank; the page does not explain the asterisk. Ten teams solved no problem. The page also lists links to boards of other regional contests from 2008 to 2012, which link outside our copy.
