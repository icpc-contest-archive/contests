  description: |-
    Problem set of the Myanmar Collegiate Programming Contest 2017 as handed out at the contest: a PDF of 15 pages, with the University of Computer Studies, Yangon named in the page footers. The cover page dated October 26, 2017 asks the reader to check for 10 problems and 15 sheets, lists problems A to J with a balloon colour for each, from A, Spinster, to J, Numbers Conversion, and notes that all input and output is standard input and output.

    The following pages hold the ten statements in English, each with input and output format and a sample input and output. No test data or solutions.
