  description: |-
    Announcement page of the Myanmar Collegiate Programming Contest 2017 (MCPC 2017) by the University of Computer Studies, Yangon (UCSY), in English and Burmese. The English part describes ACM-ICPC and says UCSY hosts the Myanmar national contest in October 2017 and the 2017 ACM-ICPC Asia-Yangon Regional Contest, for which teams qualify in the national contest. It gives the registration period (21 August to 21 September 2017), the contest environment (Ubuntu 16.04.1 LTS, Eclipse, Netbeans, gedit, Java and C++), a contact address and the dates: rehearsal day 25 October and contest day 26 October 2017.

    The Burmese part, in the older Zawgyi encoding, sets out the rules: who may take part and how teams are formed, ranking by problems solved and then total time, judging with the "PC 2 Auto Judging System" and a penalty of 20 minutes per wrong submission (none for compilation errors), what may be brought into the hall, and printing. There is no results or problem list. Our copy holds this one page.
