  description: |-
    Page of the University of Computer Studies, Yangon (UCSY) announcing the 2018 Myanmar Collegiate Programming Contest, the national contest held before the 2018 ACM-ICPC Asia-Yangon Regional. It gives the registration period (1 June to 15 July 2018), a contest day of 11 August 2018, the team registration fee, the computer environment (Ubuntu 16.04, Java, C and C++ compilers, PC2 as the judging system), and the contest rules: permitted items, team reference document, scoring and ranking, and the scoreboard freeze about one hour before the end. The menu links to Home, Registration, Environment, Problem Set and Scoreboard.

    Our copy holds this one page only; the linked Problem Set and Scoreboard pages are separate addresses, not part of it.
