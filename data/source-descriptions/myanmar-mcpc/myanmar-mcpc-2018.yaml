  description: |-
    Final standing produced by PC^2 and headed "Myanmar Collegiate Programming Contest 2018 (MCPC2018)", hosted by University of Computer Studies, Yangon, 18 August 2018. The table lists 71 teams with rank, team name, number solved, total time, and for each of the ten problems A to J the number of attempts and the time of the accepted run ("--" where unsolved), plus a total of attempts and solved per team. First place is Team18_nah with 8 problems solved; the last three teams share rank 69 with none solved. A final row gives, per problem, submissions, time of the first yes, and total yes. The page ends with the time of its last update.
