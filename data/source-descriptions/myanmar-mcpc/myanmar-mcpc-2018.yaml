  description: |-
    Problem set in a PDF of 14 pages in English. The cover lists ten problems A to J with a balloon colour for each (A Taxi Driver, B Binary Match Encryption, C Pattern Matching, D Round Robin Tournament, E Adventure in a Maze, F Alphabet Symmetry, G Brace Matching, H Gold Mining, I Babylonian Numbers, J Need for Speed), notes that all problems use standard input and output, and is dated 18 August 2018. Every page carries the University of Computer Studies, Yangon in its header. Each of the ten problems has a statement with input and output description and a sample. No test data or solutions.
