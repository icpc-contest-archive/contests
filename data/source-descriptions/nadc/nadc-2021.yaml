    Scoreboard of the Central Division from the Kattis contest site, shown with the note "Contest is over": 42 teams against 13 problems labelled A to M. Each row gives rank, team name, problems solved, total time, and for each problem the number of attempts and the minute of the accepted run (a dash instead of a minute where the problem is unsolved; blank where there were no attempts). The legend marks first to solve, solved, attempted and pending judgement, and the page has tabs for the Central, East, South and West divisions; only the Central board is in our copy. The first-place team solved 8 problems, and the last team has none.
