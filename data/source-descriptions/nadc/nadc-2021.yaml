  description: |-
    Standings of the 2020-21 ICPC North America Division Championships: 171 teams in one table, with team name, institution, problems solved and total time. The first 105 teams carry a rank and the other 66 are listed unranked as Honorable. The Medal column marks four gold, four silver and four bronze medals, the other ranked teams being marked Ranked. A Citation column gives place names, and a Site citation column names one team for each of the four division championships (East, South, West and Central). MIT ZEROONE from the Massachusetts Institute of Technology is first with 13 solved in 935 minutes. No per-problem detail.
