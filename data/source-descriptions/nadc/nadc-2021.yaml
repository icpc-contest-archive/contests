  title: ICPC North America Division Championship
  language:
  - en
  contest_date: '2021-04-22'
  description: |-
    Page of the ICPC Foundation website for the 2021 ICPC North America Division Championships (NADC), with the Central, East, South and West divisions. It gives the schedule of events (two practice sessions on 17 and 18 April, each with an opening ceremony, and the contest on Thursday 22 April, all times Pacific), the contest contacts and directors of each division, the team list of each division as institution and team name, and a Details button per division. It also tells teams to use the contest site on Kattis for the practice contests and the contest, explains the VCSS contest machines and the compilers used, covers souvenir shirts, and sets out a code of conduct for the contest. Headings for Problems, Data, Solutions and Explanations and a link to team and individual photos are present, with the links leading to other servers.

    Our copy holds 15 files: 13 pages of the ICPC Foundation site (the division page twice, and pages on training camps, World Finals, region championships, the North America qualifier and regional contests, news, newsletters and others, which concern other ICPC activities) and two PDF files linked from the newsletters page. Both PDFs are cut short in our copy and cannot be opened. Division details, the Kattis site and the photos are not in our copy.
