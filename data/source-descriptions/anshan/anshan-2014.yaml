  description: |-
    Standings of the 2014 ACM-ICPC Asia Anshan Regional Contest: 154 teams, each with rank, team name, institution, number of problems solved, total time and a citation. Ranks run from 1 to 101 and tied teams share a rank. The citation names the place (First Place and so on) for 119 teams and reads Honorable Mention for the other 35. First place is Valkyrie, Peking University, with 7 problems solved. No per-problem columns and no attempt counts. The page gives no contest day.
