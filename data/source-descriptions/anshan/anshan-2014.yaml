    Scoreboard of the Anshan on-site contest in Chinese, a ranklist page headed ICPC 2014 鞍山赛区现场赛 排行榜 (ICPC 2014 Anshan regional on-site contest ranklist). It lists 167 teams with school rank (S#, filled for 102 of them, nine of those marked with an asterisk), school, rank, team name (with a number in brackets), problems solved, total time, and for each of the 12 problems A to L the number of attempts, with the solve time after a slash where the team solved it. Each problem head carries a pair of totals such as 0/1 for A and 50/495 for B. A legend explains the colours for first solve, solved, attempted and pending judgement. The header reads 2014/10/19 20:42:34 (Start: 2014-10-19 09:00) and states the medals as 15 gold, 31 silver and 45 bronze.

    The page also carries a menu linking to the ranklist pages of the series' contests from 2008 to 2014, some of them marked as missing, and a contact box. Our copy holds the HTML page with eight asset files.
