  description: |-
    Contest page of the problem list on HDU Online Judge, titled in Chinese 题目重现 (tímù chóngxiàn, "problem replay") of the 2014 ACM/ICPC Asia Anshan Regional Contest on-site round. It states a start of 2014-10-22 12:00:00 and an end of 2014-10-22 17:00:00, public contest, status Ended. The table lists 12 problems with IDs 1001 to 1012 and the titles Twelve Months, Chat, Coprime, Galaxy, Hatsune Miku, Random Inversion Machine, Memory, NAND, Osu!, Square, Colorful Toy and Trie, each with a solved mark column and an accepted/submitted ratio. A notice says problem 1004 has been rejudged after a bug in the special judge.

    Our copy holds only the list page. The links to the individual statements lead to pages that are not part of it.
