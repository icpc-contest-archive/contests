  description: |-
    Final scoreboard on XCPCIO, headed ICPC 2014 鞍山赛区现场赛 (ICPC 2014 Ānshān sàiqū xiànchǎngsài, "ICPC 2014 Anshan regional onsite contest"), with Chinese team and university names and English column heads. Twelve problems A to L carry the number of accepted submissions in their heads; per team it gives place, organization with a second rank among organizations, team name and number, solved, penalty, attempts and time per problem, and the columns Dirt and SE. Tabs switch between all teams, official teams and starred (unofficial) teams, and footer rows count submissions, accepted runs and first and last solve times per problem. The header gives the start as 2014-10-18 20:00 CDT and a length of five hours.

    The table has 167 team rows, but in our copy only the first 32 are filled in, from 北京大学 (Peking University) team Valkyrie in first place down to place 32; the other 135 rows are empty.
