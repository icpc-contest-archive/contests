    Website of MAPCOM Technologies, an IT company, in French, entered at its programming contests page. Our copy holds 135 saved pages, of which 81 are distinct: the same page was fetched under several addresses. Most are company pages such as products and services, training, articles, partners and contacts. The contest page presents the national programming contest as an ACM-type event preparing students for the regional contest and lists its objectives. The contest sub-pages it has buttons for (rules, calendar and registration, previous editions, gallery, problems and results) are not in our copy: their addresses hold the company's home page under another title.

    Two PDFs for the Togolese contest are in our copy: an 8-page problem set with six problems, A to F, and a 1-page contest report giving the date, place, number of teams and the winning team. No scoreboard page is in our copy.
