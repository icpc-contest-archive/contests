  description: |-
    Final scoreboard of the Western Division produced by DOMjudge: 28 teams shown and eleven problems A to K. Each row gives rank, an affiliation column of icons, team name, problems solved, total time and, for each problem, the number of tries, with two numbers in parentheses joined by a plus sign for solved problems. The first team, mikelback, solved 6 problems with a total time of 781; a summary row gives per-problem totals and states 31 teams in all, but three further team rows are present only inside commented-out markup and are not displayed.

    Rows are shaded by category, with a key for Qualifiers and Wild Card, and cells are coloured for first solve, solved, tried and untried. The page states it was last updated on 2 Sep 2014 11:53. Team names link to a judging server outside our copy, and the icons in the affiliation column are not in our copy.
