  title: ACM South Pacific Region
  language:
  - en
  description: |-
    Website of the ACM ICPC South Pacific Region contests, in English, holding pages from many years. Our copy holds 92 saved files, 78 of them pages. The first page is the Western Division page, which carries the date Saturday 8th October 2016, so it belongs to a later edition than 2014; the pages of the 2014 edition are separate articles.

    The 2014 South Pacific Region Contests page says the Divisional Contests were held on Saturday 30th August at 13 sites, names the teams that qualified for the Regional Final from the Western, Central and Eastern Divisions, and names the winners of the Regional Final in Sydney on 26th September. A 2014 Western Divisional Contest page names its four sites (Adelaide, Hobart, Melbourne and Perth), the qualifying teams with their members, and links to the scoreboard and the problem set. There are also 2014 Eastern and Central Division pages, a 2014 problem sets page with a problem set and sample data link for each division and the Regional Finals, and 2014 Regional Final and contest presentations pages. The four 2014 photo pages (gallery, finals, awards ceremony, finals teams) show an error message in place of photos.

    The rest of the site holds the 2015, 2016 and 2017 contest pages, 2012 and 2013 regional contest pages, champions pages for many years between 1991 and 2011, and World Finals results pages for 1990 to 2014.
