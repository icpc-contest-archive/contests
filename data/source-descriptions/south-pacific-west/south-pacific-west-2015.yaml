  description: |-
    Final scoreboard of the Western Division of the 2015 South Pacific divisional contest, produced by DOMjudge and last updated 23 August 2015. It lists 35 teams with rank, team name and institution, number solved, total penalty time, and tries and time for each of the eleven problems A to K. First place is Monash Pi of Monash University with 7 solved.

    A legend marks qualifiers, participants, school teams (unofficial) and unofficial teams, and cells are coloured for first solve, solved and tried incorrect. Unofficial and school teams are listed at the end with their own ranks, and a summary row gives totals per problem. A link labelled Western Division Results Page leads to the 2015 Western Division page of the region's site.
