  description: |-
    Crawl of the general website of the ACM ICPC South Pacific Region, in English, captured mostly in March 2017. Our copy holds 112 pages for all years rather than for this contest alone: champions pages for single years between 1991 and 2011, contest reports for 1999 to 2002, world finals results, rules, contest sites, FAQ and registration, and the contest pages for 2014 to 2017. The seed page is a 2003 champions page.

    The pages for the 2015 edition are a region page, Eastern, Central and Western Division pages, a problem sets page, a regional final photo gallery page and a celebration page. The region page reports that the divisional contests were held on 22 August 2015 at 13 sites with 73 teams, run on DOMjudge, and names the regional final in Auckland on 25 to 27 September. The Western Division page says 35 teams from 9 universities competed at four sites, Perth, Adelaide, Melbourne and Hobart, and names the four qualifying teams. The problem sets page links to a problem set, solution outlines and data for each of the three divisions, and to a problem set and data for the regional finals.

    The linked PDFs, data archives and scoreboards are not part of the crawl.
