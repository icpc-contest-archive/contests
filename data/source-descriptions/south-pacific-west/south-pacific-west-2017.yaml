  description: |-
    Final scoreboard of the 2017 South Pacific divisional contest, DOMjudge, one board for the Central, Eastern and Western Divisions: 63 teams with rank, team name, university, country flag, a score (problems solved and total time) and one cell for each of the twelve problems A to L. A solved cell gives the number of tries and the minute of the accepted run; an unsolved cell gives the number of failed tries, or 0 if the team did not try. First solves are marked by colour. Colours mark qualifying teams and the other teams of each division. One team, from the University of Otago, is marked as unofficial and is listed at the end. A summary row gives the number submitted and the number correct for each problem, and the page ends with a last-update line of 17 October 2017. AbishforesT from the University of New South Wales is first with 12 problems.
