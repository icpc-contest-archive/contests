  contest_date: '2017-10-14'
  description: |-
    Website of the ACM ICPC South Pacific Region, in English, as it stood for 2017. The 2017 pages cover the Divisional Contest of Saturday 14th October at 12 sites, with a report from the chief judge and the teams advancing to the Regional Final (selected in two steps); a page for each of the Western, Central and Eastern Divisions with its qualifying teams; a problem sets page; a Regional Final page (University of New South Wales, Sydney, 24 to 26 November) with the winners; a 2017 contest calendar; World Finals results for 2017; and a photo gallery.

    The site also carries older pages: champions pages for 1991 to 1998, 2002 and 2003, regional contest reports for 1999 to 2003, World Finals results pages for 1989 to 1995 and 2013 to 2017, and a few pages from 2014 to 2016 (the 2014 and 2016 Regional Finals, the 2015 contest list, report and problem sets). The scoreboard, problem set PDFs and data files are linked but are not in our copy.

    Our copy holds 150 saved files, 127 of them pages; several pages are saved more than once under different menu addresses. It also has 17 JPEG images.
