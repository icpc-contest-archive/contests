  description: |-
    Problem set of the 2018 South Pacific Divisionals as a PDF of 26 pages, in English. The cover gives the date of 20 October 2018 and lists the twelve problems A to L, among them Australian vs American, Cryptic Clues and Love Actually. The second page states the rule for answers with an error tolerance and defines answers modulo m, lexicographic order and letter cases. Each problem has a time limit, input and output sections and sample input and output. Statements only: no test data or solutions. The last page reads "intentionally left (almost) blank".
