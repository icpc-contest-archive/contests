    Standings of the Western Division: 22 teams, each with rank, team name, institution, number of problems solved and total time, followed by Medal, Citation and Site citation columns. O(1/n) of the University of Melbourne is first with 11 solved in 851 minutes; WhereIsAnand of the University of Melbourne and Max Ward of the University of Western Australia follow, also with 11. The Citation column gives the first three places and Honourable mention for the rest; the Site citation column marks the champions of the Melbourne, Perth and Adelaide sites. The Medal column reads Honourable mention in all 22 rows. There is no per-problem detail.
