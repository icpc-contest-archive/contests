  description: |-
    Website of the ACM ICPC South Pacific Region, in English, with a home page headed Contests 2018. It is a calendar for 2018: the World Finals in Beijing in April, ANZAC rounds 1 to 4 from September to October with links to scoreboards, problem sets and an editorial, the South Pacific Divisional Contests on 20 October with links for registration, rules and sites, and the Regional Final in Sydney on 23 and 24 November. It has no results for the divisional contest.

    The division pages in our copy (Western, Central and Eastern) still give the date Saturday 14th October 2017. The site also holds pages of other years: contest pages for 2014 to 2017, World Finals results for 1989 to 1995 and 2013 to 2017, champions pages for 1991 to 1998, 2002 and 2003, regional contest reports for 1999 to 2003, plus rules, FAQ, registration and links pages.

    Our copy holds 125 saved files, 96 of them pages; many pages are saved more than once under different addresses.
