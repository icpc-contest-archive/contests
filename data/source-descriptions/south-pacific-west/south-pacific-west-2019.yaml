  description: |-
    Final scoreboard of the 2019 South Pacific divisional contest, DOMjudge, one board for the Central, East and West Divisions: 79 teams with rank, team name, university, a score (problems solved and total time) and one cell for each of the thirteen problems A to M: 74 ranked teams, then a summary row, then five teams under the heading Unofficial with ranks of their own, then a second summary row. A solved cell gives the minute of the accepted run and the number of tries; an unsolved cell gives only the number of tries. First solves are marked by colour. The page ends with a last-update line of 21 September 2019. The team from the University of Auckland is first with 12 problems.

    The style sheets and country flag images the page refers to are not in our copy, so it shows without its styling and flags. Links to the problems and to team pages lead to servers that are not part of it.
