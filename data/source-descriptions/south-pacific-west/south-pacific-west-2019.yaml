  description: |-
    Problem set of the 2019 South Pacific Divisionals as a PDF of 30 pages, in English. The cover gives the date of 21 September 2019 and lists the thirteen problems A to M, among them Array Index, Codenames and Marvelous Marble Machine. The second page states the rule for answers with an error tolerance and defines answers modulo m, lexicographic order, letter cases and distance. Each of the thirteen problems has a time limit, input and output sections and sample input and output. Statements only: no test data or solutions. The last page reads "intentionally left (almost) blank".
