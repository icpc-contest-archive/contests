  contest_date: '2016-10-08'
  description: |-
    Section of the South Pacific regional contest website for 2016, in English. The front page has a report from the regional contest director on the Divisional Contest, held on Saturday 8th October at 13 sites with three divisions but a single problem set, and names the first four teams. It lists the twelve teams that qualified for the Regional Final in two steps, and links to the scoreboard, problems and a photo gallery.

    Our copy holds 8 pages: the front page, a page for each of the Western, Central and Eastern Divisions (each listing its qualifying teams), the problem sets page, the Regional Final page (held at the University of New South Wales, Sydney, 25 to 27 November, with the winners), and two photo gallery pages. The scoreboard, problem set and data files are linked from these pages but are not among the 8 pages.
