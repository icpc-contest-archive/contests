    Problem set of the 2016 South Pacific Divisionals as a PDF of 28 pages, in English. The cover gives the date of 8 October 2016 and lists the twelve problems A to L, among them Analysis of Advanced Analytics, Balloon Connect-the-Dots and Loading Cargo. The inside cover says twelve teams advance to the Regional Finals, explains the error tolerance for real-valued answers and names the judging team. Each problem has a time limit, an input and an output section and sample input and output. Statements only: no test data or solutions. The last page reads "intentionally left (almost) blank".
