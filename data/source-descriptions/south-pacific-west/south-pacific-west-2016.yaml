  description: |-
    Final scoreboard of the 2016 South Pacific divisional contest, DOMjudge, one board for all three divisions: 69 teams with rank, team name, university, a score (problems solved and total time) and one cell for each of the twelve problems A to L. A solved cell gives the number of tries and the minute of the accepted run; an unsolved cell gives the number of failed tries, or 0 if the team did not try. First solves are marked by colour, and a legend marks qualifying teams and other official teams. A summary row at the bottom gives the number submitted and the number correct for each problem. The page ends with a last-update line of 14 October 2016. UNSW's AbishforesT is first with 12 problems.
