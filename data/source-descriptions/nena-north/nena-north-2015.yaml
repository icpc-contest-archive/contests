  description: |-
    Announcement page of the Clarkson student chapter of the ACM for its preliminary programming contest for the ICPC, in English. It gives the date and time as October 17, 2015, 11:00 am to 5:30 pm, and the place as the Applied Computing Labs, Science Center 334-336, Clarkson University. It says that teams register at the Baylor site by October 12th, that the fee is 50 USD per team, that participation is limited to ten teams with two teams per school if space allows, that official ICPC rules apply and that C, C++ and Java are allowed. The schedule is announced as to be updated.

    Our copy is this one page, with the chapter's menu links (home, officers, bylaws, about, alumni, history) that lead outside it. It has no results or problems.
