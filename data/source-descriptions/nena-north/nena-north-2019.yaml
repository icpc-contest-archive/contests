  description: |-
    Contest site on Kattis for the 2019 ICPC NENA (Quebec) Regional Qualifier, in English. The front page gives the start (2019-10-26 15:00 CEST), the length (6 hours), the list of eight problems A to H (Stats, Paranoid, Decreasing Paths, 3D Food Maker, Word Morph, Voting Club's Election, Match-Finding in DNA Sequences, Roller Coasters are Fun Fun Fun (But Waiting is Not)), and the scoring rule: pass/fail per problem, ranked by problems solved with 20 minutes of penalty per wrong submission.

    Our copy holds 24 pages: the front page, the standings, the problem list, the team list, the rules, the eight problem statement pages, seven pages on the allowed languages (C, C++, Java, Kotlin, Python 2 and Python 3, plus the overview) and four pages of single teams. The statement page for problem A carries the full text with sample input and output.
