  description: |-
    Problem set of the 2026 ICPC North America Championship as a PDF of 28 pages, in English. It holds 13 problems labelled A to M, from Acorn Quarrels to Maki Conveyor Belt, one to three pages each. Each problem starts with its time limit and memory limit, followed by the statement and input and output format; eleven have sample input and output, and problems H (Heist of the Century) and L (Leaking Santa's Secrets) are interactive and have sample interactions. Some statements carry illustrations. Pages 8 and 16 are blank pages marked as intentionally left blank; every other page is footed with the contest name, problem letter and title, and page number. No test data or solutions.
