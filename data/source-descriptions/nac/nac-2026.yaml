  description: |-
    Final scoreboard produced by PC^2, headed "NAC 2026 Final Scoreboard" with the note "The contest has ended": 52 teams against 13 problems labelled A to M. Each row gives rank, team number with institution name, problems solved, total time, and for each problem the number of attempts and the minute of the first accepted run ("--" where unsolved). The last column gives total attempts and number of problems solved (27/11 for the first row), and a closing row gives submitted, first yes and total yes per problem. Rows are coloured for gold, silver and bronze medals and for High Honors and Honors, first solves are marked, and a legend explains the colours (it also lists Highest Honors). A note says the 18 teams above the dark blue line advance to the 2026 ICPC World Finals. Massachusetts Institute of Technology is first with 11 solved.

    The problem letters link to problem PDFs and four divisional standings pages (East, West, South, Central) are linked; none of these are part of our copy.
