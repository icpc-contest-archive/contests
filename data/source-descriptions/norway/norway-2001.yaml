  description: |-
    Final results page, in Norwegian: 69 teams with team name and institution abbreviation, a column for each of the problems A to H, number solved, total time and final position. A solved problem shows the time at which it was solved, and a number of asterisks after the time gives the number of wrong submissions. Teams are ordered by problems solved and then time; ties share a position, and 7 teams that solved nothing show 0 solved, 00:00:00 and position 63. First place is Wrong Input of NTNU with five problems.

    A note under the table says the contest had 69 teams with 162 participants in total; it links to the participant list.
