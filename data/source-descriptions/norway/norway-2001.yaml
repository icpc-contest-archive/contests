  problems: 8
  description: |-
    Website of the Norwegian programming championship (Norgesmesterskapet) 2001, in Norwegian. Our copy holds 49 saved files, 41 of them pages: the front page, an invitation, the full results page, the list of participants, problem statements as PDF for five of the eight problems (A, C, D, G and H, two or three pages each), and for all eight problems A to H the test input and output and a jury solution (seven in C, one in Java, with a second solution in C++ for problem E). Seven problems have a page of comments.

    The front page says the contest was held on 29 September at seven sites: Høgskolen i Molde, Stavanger, Høgskolen i Sør-Trøndelag, NTNU, Bergen, Oslo and Tromsø. It shows the top twelve teams with solve times per problem, says the national champions and the best teams from four institutions went to the semifinal, and gives an excerpt of the semifinal results from Darmstadt on 3 and 4 November, where 45 teams took part. The invitation covers who may take part, prizes and background.

    Statements for problems B, E and F, a complete problem set PDF, the rules page and the photographs are not in our copy.
