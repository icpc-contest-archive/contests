  description: |-
    Website of the Norwegian programming championship (Norgesmesterskapet) 2000, in Norwegian, with an English-language rules page. Our copy holds 26 pages: the front page, an invitation, the rules, the problem set as a PDF, the full results page, and for each of the seven problems A to G a jury solution (six in C, one in Java) with input and output test files.

    The front page says the contest was held on 21 October at the universities of Bergen and Oslo, Stavanger University College and NTNU in Trondheim. It gives a short comment on each problem, the top ten teams with solve times per problem, and says the four best teams went on to the semifinal in Darmstadt on 18 and 19 November. The invitation, which also names Tromsø among the sites, covers who may take part, prizes and the ACM contest background. The results page lists 51 teams.
