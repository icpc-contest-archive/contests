  description: |-
    Final results page, in Norwegian, headed Sluttstillingen (final standings): 51 teams with number (only the first 34 carry one), team name, institution, a column for each of the problems A to G, number solved and total time. Solved problems show a time; unsolved cells are empty, and attempts are not shown. Teams are ordered by problems solved and then time; 18 teams at the bottom solved nothing and carry 0 and 0.00. First place is Programmeringsgruppa of HiSør-Trøndelag with four problems.

    A note under the table says that local technical problems gave several teams, NoSuchTeamNameException in particular, a lower placing than their effort deserved.
