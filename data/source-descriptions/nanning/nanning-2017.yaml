  description: |-
    Contest page on Luogu for a replay of the 2017 Nanning regional, held on 9 August 2026 from 13:00 to 18:00 and titled [ICPC2017 Nanning R] ICPC 2017 区域赛南宁站重现赛 (qūyùsài Nánníng zhàn chóngxiànsài, "regional Nanning station replay contest"). The text says it uses the original problems and data of the on-site contest with Chinese statements, supplied with the help of Jisuanke, and that it is run under ICPC rules with a 20-minute penalty, teams of one to three, and the board locked for the last hour. The page says no rating is computed.

    The page lists thirteen problems, A to M, from Abiyoyo (A) to The Maximum Unreachable Node Set (M). The statements are on separate problem pages that are not in our copy.
