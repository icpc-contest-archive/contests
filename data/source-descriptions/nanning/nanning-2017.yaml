  title: The 2017 ACM-ICPC Asia Nanning Regional Contest - Ranklist
  language:
  - en
  - zh
  description: |-
    Pages of the Guangxi University programming contest site as captured in 2017, plus later captures of the same address. Our copy holds 49 files, of which 15 are HTML pages from 2017. The main one is the board of the 2017 ACM-ICPC Asia Nanning Regional Contest: 228 teams and thirteen problems A to M, with an S# number, school, rank, team name, problems solved, time, and for each problem the attempts and minute of the solve or the number of attempts without a solve. Rows are marked gold (23), silver (46) and bronze (69), first solves are marked, and no cell is pending, although a banner says the board freezes in the last hour.

    The other 2017 pages are in Chinese. The page of the 2017 Guangxi Invitational Programming Contest (26 and 27 August 2017, Nanning) says it also selects teams for the regional: every participating university gets one place and some get one or two more by invitational result. A page for the online round of the regional (24 September 2017, 12:00 to 17:00, on Jisuanke) explains how coaches apply for accounts and lists applications by school. A registration page lists teams of GXCPC2017, 20 teams shown, numbered between 213 and 192, all marked Accepted. There are also a registration notice and login and sign-up forms.

    The later captures (2018 to 2024) are a domain-parking notice, an empty application shell titled OnlineJudge (it is also what the robots.txt and favicon addresses returned) and an empty application shell of a later platform. They hold nothing on the contest.
