  description: |-
    Scoreboard of the Nanning on-site contest with a Chinese interface: 228 team rows and thirteen problems A to M. Each row gives school rank (S#, filled only for the best team of each of 141 schools), school, rank, team name (Chinese with the English name in parentheses), problems solved, time, and per problem the attempts and minute of the solve or the number of attempts without a solve. Tied teams share a rank (209 distinct ranks). Each problem heading carries two counts, for example A 227/238. The school-rank cells of 23 rows are marked gold, 46 silver and 69 bronze, first solves are marked, and a line says medals are estimated at 10, 20 and 30 percent for reference only, with the official awards deciding.

    A header line shows the stamp 12/5/2017 08:15:44 PM and a start time of 2017-11-19 09:00. A side menu lists boards of ICPC and CCPC contests from 2008 to 2017, some marked as missing.
