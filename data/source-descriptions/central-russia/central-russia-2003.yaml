  description: |-
    Website of the Northern Eurasia Contests (NEERC) archive, in English. Our copy holds 150 files, 149 of them pages (HTML, PDF or PostScript), most of them belonging to the 2003 and 2004 seasons, with a front page for each other year of the archive from 1996 onwards. The NEERC 2003 page links the final standings, the problems of the NEERC final (a PDF of 13 pages dated 26 November 2003, with problem A "Alternative Scale of Notation"), a jury archive, a picture gallery and the regional contests, among them Central Russia, whose entry links one page, its final standings.

    That Central Russia standings page is in our copy: the table of the 2003 Central Subregion, 34 teams with problems A to I. Our copy also has the standings of the other subregional contests of 2003 and 2004 and of the 2004-2005 final.
