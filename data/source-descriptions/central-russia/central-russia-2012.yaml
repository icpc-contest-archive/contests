  description: |-
    Part of the Northern Eurasia Contests (NEERC) archive website, in English. Our copy holds 150 files, 144 of them pages (the same addresses are saved under more than one form of the address), and starts from the year pages for 2012 and 2013. The 2012 year page lists the resources of the finals held that year (standings, problems, official tests, test generators and jury solutions) and links the standings of the regional contests, among them Central Russia.

    The copy also holds the finals standings and problem PDFs for 2012 and 2013, review PDFs for both years, the standings pages of the regional contests of both years, and the year pages for 1996 to 2015.

    For this edition it holds the Central Russia 2012 standings page, headed "NEERC Central Subregional 2012", and the 20-page problem set PDF of the contest. The 2013 Central standings page is in the copy as well.
