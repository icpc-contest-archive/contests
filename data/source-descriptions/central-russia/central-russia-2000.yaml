  - ru
  description: |-
    Website of the Northern Eurasia Contests (NEERC) archive, in English with some pages in Russian. Our copy holds 150 files, 144 of them pages (HTML, PDF or text), covering the 2000 and 2001 contests and the archive pages of other years from 1996 to 2024. The page for the 2000 Central Subregional Contest gives the host (Rybinsk SAAT), the date (4 October 2000), the regions that take part, and a results table of 30 teams with seven problems A to G, with per-problem marks (+ solved, a number after it for extra tries, - for unsuccessful tries, a dot for no attempt), number solved, total time and rank. The page says teams proceeding to the semifinal are marked with green. A Russian page of the Rybinsk host lists sections on the course of the contest, the final table, winners, problems (an archive of 481 Kb) and other material.

    Our copy also holds the pages of the other 2000 and 2001 subregional contests, the final standings of the NEERC 2000 contest, links to its problems in PDF and HTML, and archives of tests and problems (rar and zip files).

    The Central Subregional page has no problem statements; its problems section is commented out in the page source.
