  description: |-
    Standings of the 2011 Central Subregional Contest: 48 teams with rank, team name, institution, problems solved and total time. The first twelve places carry a medal (four gold, four silver, four bronze); each place up to twenty-third has a citation naming the place, and 24 teams are listed as Honorable Mention. The first-place team also carries the citation "Champion of Central Subregional Contest". There is no per-problem detail and no count of attempts.
