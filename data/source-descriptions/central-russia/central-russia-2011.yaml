  description: |-
    Part of the Northern Eurasia Contests (NEERC) archive website, in English. Our copy holds 150 files, 147 of them pages (the same addresses are saved under more than one form of the address), and starts from the year pages for 2011 and 2012. The 2011 year page lists the resources of the finals held that year (standings, problems, statement sources, tests, analysis presentation, jury archive) and links the standings of the regional contests, among them Central Russia.

    The copy also holds the finals standings and problem PDFs for 2011 and 2012, an analysis PDF for 2011 and a review PDF for 2012, the standings pages of the regional contests of both years, and the year pages for 1996 to 2018.

    For this edition the site holds the Central Russia 2011 standings page, headed "NEERC Central Subregional Contest 2011"; it has no problem statements or other pages specific to this subregional contest. The Central standings page of 2012 and a Central problem set PDF for 2012 are in the copy as well.
