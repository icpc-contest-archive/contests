  description: |-
    Website of the ICPC Central Russia Regional Contest hosted at Yaroslavl, in Russian. The front page announces the contest for 26-27 October 2024 together with the regional school teams' olympiad held on the same days, and says the next stage is the semifinal of the Northern Eurasia region. Further pages give the organising committee and jury with their posts and universities, the timetable (registration, opening and trial rounds on 26 October; start of the contest at 10:30 and awards at 17:00 on 27 October), the venue, hotels, payment of the entry fee, selection of qualification sites, the qualification round starting 28 September 2024 with its list of sites, the main round, and a problem archive page that links to the 2018 contest on Codeforces.

    Our copy holds 36 saved files, 27 of them pages, saved at different dates from 2018 to 2025. Besides the 2024 pages it holds pages of earlier editions: the 2018 edition (announcement of 26-28 October 2018, qualification round of 6 October 2018, main round) and the 2019 edition (front page for 25-27 October 2019, qualification round of 5 October 2019). It has no results, team list or problem statements.
