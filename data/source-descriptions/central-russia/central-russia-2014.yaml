  description: |-
    Final scoreboard of the 5-hour contest (clock shows 5:00:00 of 5:00:00, status over): 38 teams ranked, with eleven problems labelled A to K. Each row gives the rank, the team name (an institution with a team number) followed by the names of its three members in parentheses, one cell per problem showing + (solved) or - (not solved) with the number of tries and the accepted time, or a dot where there was no attempt, the number solved and the total time. Yaroslavl SU 1 is first with nine problems solved. Summary rows at the bottom give total runs, accepted and rejected runs, and the first and last accepted time for each problem; no team solved D or E. The page is headed "Central Subregional 2014".
