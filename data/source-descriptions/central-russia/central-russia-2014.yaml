  description: |-
    Part of the Northern Eurasia Contests (NEERC) archive website, in English. Our copy holds 150 files, all 150 of them pages (the same addresses are saved under more than one form of the address), and starts from the year pages for 2014 and 2015. The 2014 year page lists the resources of the finals held that year (standings, problems, official tests, generators and jury solutions, statement sources, runs) and links the standings of the regional contests, among them Central Russia.

    The copy also holds the finals standings for 2014 and 2015, the problem PDFs of both years, review PDFs for both years, the standings pages of the regional contests of both years, and the year pages for 1996 to 2009 and for 2014 and 2015.

    For this edition the site holds the Central Russia 2014 standings page, headed "Central Subregional 2014"; it has no problem statements or other pages specific to this subregional contest. The Central standings page of 2015 is in the copy as well.
