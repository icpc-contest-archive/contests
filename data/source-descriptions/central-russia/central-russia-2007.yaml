  description: |-
    Website of the Northern Eurasia Contests archive, in English, with a page for each year from 1996 to 2025. Our copy holds 150 files, which are 69 distinct addresses; several pages are saved under http, https and port-80 forms of the same address. The 2007 page links, for the finals, the standings, the problems in PDF format, the tests and jury solutions, all runs made during NEERC 2007 and a history file that allows watching the contest in progress, and for each regional contest, including Central Russia, its final standings. The tests, runs and history files are not in our copy. The copy also holds the finals and regional standings of 2008 and problem PDFs for 2007 and 2008.

    The Central Russia 2007 contest has one page on this site, its standings. The 2007 finals problem set is a 14-page PDF; the Northwestern Russia statements are a separate 11-page PDF, and another 11-page PDF is linked from the Georgia and Uzbekistan entries. No problem set specific to Central Russia is in our copy. The site also covers other editions and other regions.
