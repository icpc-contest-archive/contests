  description: |-
    Archive website of the Northern Eurasia Contests (NERC), in English. Its page for NERC 2019 lists the final standings, problems in PDF, jury archive and problem analysis, followed by the regional contests; for Central Russia the page says no information is available, while for Northwestern Russia it lists standings, statements, tutorials and runs.

    Our copy holds 150 pages, many of them the same address saved under http, https and port-80 variants (75 distinct addresses). They are the year index pages from 1996 to 2025, the NERC 2019 and 2020 final and online standings, the 2019 and 2020 statement and tutorial PDFs, and standings pages of regional contests: 16 for 2019, among them the Central Russia 2019 standings, and 8 for 2020. Apart from the index pages, nothing is held for years other than 2019 and 2020.
