    Final scoreboard of the Central Russia Regional Contest 2019: a table of 42 teams against eleven problems A to K, with the clock shown as 5:00:00 of 5:00:00 and status over. Each problem cell shows + with the time of the accepted run (and the number of earlier rejected attempts when there were any), - with a number of rejected attempts, or a dot when nothing was submitted; the last columns give the number solved and total time. Each team name is followed by its three members in brackets. The first-ranked team is VyatkaSU 1 with seven problems. Below the table are summary rows per problem: total runs, accepted, rejected, first accept and last accept.
