  description: |-
    Website of the Northern Eurasia Contests archive, in English, with a page for each year from 1996 to 2023. Our copy holds 150 files, which are 70 distinct addresses; several pages are saved under http, https and port-80 forms of the same address. The 2009 page links, for the finals, the standings, the problems in PDF and PostScript format, statement sources in TeX, tests and jury solutions and a monitor program, and for each regional contest, including Central Russia, its final standings; Northwestern Russia also has problem statements, tests, an archive, runs and an analysis presentation. The tests, jury, runs and monitor archives are not in our copy; the 2009 analysis presentation is, as a .pps file. The copy also holds the finals and regional standings of 2009 and 2010, problem PDFs for both years, a 15-page problem review PDF for 2010 and the Northwestern Russia 2010 analysis in two PDFs.

    The Central Russia 2009 contest has one page on this site, its standings. The 2009 finals problem set is a 13-page PDF and the Northwestern Russia problem statements are a separate 14-page PDF; no problem set specific to Central Russia is in our copy. The site also covers 2010 and other editions, and other regions.
