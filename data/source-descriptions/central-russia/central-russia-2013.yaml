  description: |-
    Part of the Northern Eurasia Contests (NEERC) archive website, in English. Our copy holds 150 files, 147 of them pages (the same addresses are saved under more than one form of the address), and starts from the year pages for 2013 and 2014. The 2013 year page lists the resources of the finals held that year (standings, problems, official tests) and links the standings of the regional contests, among them Central Russia.

    The copy also holds the finals standings for 2013 and 2014, the problem PDF of 2013 and the statements PDF of 2014, review PDFs for both years, the standings pages of the regional contests of both years, and the year pages for 1996 to 2014.

    For this edition the site holds the Central Russia 2013 standings page, headed "Central Subregional 2013"; it has no problem statements or other pages specific to this subregional contest. The Central standings page of 2014 is in the copy as well.
