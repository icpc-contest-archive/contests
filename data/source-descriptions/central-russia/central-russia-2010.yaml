  title: Правила соревнований четвертьфинала командного чемпионата мира АСМ 2010-2011гг. Центральный регион России
  title_en: Rules of the quarterfinal of the ACM team world championship 2010-2011, Central Region of Russia
  language:
  - ru
  description: |-
    Documents from the website of the host university, the Rybinsk State Academy of Aviation Technology (RGATA), in Russian. Our copy holds 34 files: 16 Word documents, 8 PDFs, 4 PowerPoint files, 4 RTF files, one spreadsheet and one PHP page; a few are saved twice. It is a set of files, not the site's navigation pages.

    Four of them belong to the 2010 contest. The rules of the ACM quarterfinal of the Central Region of Russia, 12 to 14 October 2010 in Rybinsk: five hours, 6 to 11 problems, statements in English, one computer per team of three. The results of the student tournament: 41 teams with problems A to J, giving per problem the attempts and, for solved problems, the solve time, then solved count, total time and a division mark D1, D2 or D3; five teams with no solved problem share rank 37. The results of the separate school tournament: 14 teams with problems A to H. No problem statements are in our copy.

    The rules and results for the 2011-2012 contest are also in the copy. The other files are university documents on other subjects, such as admissions notices, an open-day flyer, a schedule of specialty days, competition application forms, ministry orders on olympiads, a licence scan and a national standard.
