    Final standings of the ACM ICPC 2008-2009 NEERC Central Subregional Contest: 33 teams, ten problems A to J. The page shows status "over" at 5:00:00 of 5:00:00. Each row gives the team, a cell per problem (+ for solved, a number after the plus for extra attempts, a minus and a number for unsolved attempts, a dot for none), the number solved, the total time and the rank. Penalty time is given per team only. First place is Rybinsk SAAT#2 with 9 solved; two teams share rank 18. No medals, no site marks.
