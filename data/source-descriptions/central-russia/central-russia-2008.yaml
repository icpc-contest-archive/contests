  contest_date: '2008-10-16'
  description: |-
    General website of the Rybinsk State Academy of Aviation Technology (RGATA), the host institution, in Russian. Our copy holds 150 files: 128 HTML and PHP pages, 15 Word documents, 3 RTF files and 4 PDFs. Most pages are news, admissions, structure and other university pages. One page, headed "Чемпионат мира по программированию. Четвертьфинал Центрального региона" ("World Programming Championship. Central Region Quarterfinal"), has a section for each year from 2004 to 2008 with links to information letters, rules and results.

    For 2008 our copy holds the information letters to universities and to schools (the contest is held in Rybinsk on 14 to 16 October 2008, with the contest itself on 16 October), the rules (five hours, 6 to 11 problems, statements in English), and two results documents as RTF files: the student tournament, 33 teams with problems A to J, and a separate school tournament, 11 teams with problems A to H. Each gives per problem the attempts and, for solved problems, the solve time, with solved count and total time. The problem statements of the 2008 contest are not among the files, and the documents linked for 2004 to 2007 are not in our copy.

    The copy also holds documents of 2009 and contest monitor pages for 2007-2008, 2011-2012 and a regional school olympiad.
