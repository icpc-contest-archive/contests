  title: Northern Eurasia Contests
  language:
  - en
  description: |-
    Website of the Northern Eurasia contests (NEERC archive), a series site that covers the finals and the regional and subregional contests of many years, not this subregional alone. The seed page is the 2017 archive page: for the 2017 finals it links standings, problems in PDF, official tests and the jury archive, and for each regional contest, Central Russia among them, a link to its final standings (Northwestern Russia also lists problem statements, tests, a jury archive, analysis and runs). Our copy holds 150 saved files; many pages are saved more than once, under http, https and port 80 addresses. They are the year pages from 1996 to 2025, the final standings pages of the finals and of 17 regional contests for 2017 and ten standings pages for 2018, and several PDFs: the 2017 finals problem statements (14 pages) and analysis (14 pages), the 2018 statements, analysis and review, and the Northwestern Russia statements and analyses, plus a zip of the 2018 runs.

    For this contest the site holds the Central Subregional 2017 standings page, which is also a source of its own. Pages are in English.
