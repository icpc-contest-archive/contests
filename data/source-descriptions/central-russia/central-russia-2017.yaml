    Problem page of Codeforces Gym for problem A, "Normal Magic Square", in the gym contest "2017-2018 ICPC Central Quarter Final of Northeastern European Regional Collegiate Programming Contest". The full statement in English is given on the page with a figure of the 3 by 3 magic square, together with input and output sections and two samples with their outputs; the time limit is 1 second and the memory limit 256 megabytes. The task asks for the sum of the first row of a normal magic square of order n. The page's sidebar links the contest's English statements as a PDF attachment, which is not part of our copy.
