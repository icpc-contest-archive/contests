    Contest page on Codeforces Gym titled 2017-2018 ICPC Central Quarter Final of Northeastern European Regional Collegiate Programming Contest, marked finished, listing twelve problems A to L: Normal Magic Square, Rectangles, Magic football, 38 parrots, Black Box, Spying Game, Alice And Bob, Exam, Hole Punch, Multidimensional Points, Tower of Hanoi and Fence. Each uses standard input and output, with limits of 1 s and 256 MB (2 s for Magic football), and has a count beside it. The page also has the Codeforces menus and forms for questions and announcements.

