  description: |-
    Website of the Northern Eurasia Contests archive, in English, with a page for each year from 1996 to 2025 and, for 2006 and 2007, standings and problem PDFs. Our copy holds 150 files, which are 69 distinct addresses; several pages are saved under http, https and port-80 forms of the same address. The 2006 page links, for the finals, the standings, the problems in PDF format and the tests and jury solutions, and for each regional contest, including Central Russia, its final standings; Northwestern Russia also has problem statements and tests. The tests and jury solutions archives are not in our copy.

    The Central Russia 2006 contest has one page on this site, its standings. The 2006 finals problem set is a 15-page PDF, and the Northwestern Russia problem statements are a separate 15-page PDF; no problem set specific to Central Russia is in our copy. The site also covers 2007 and other editions, and other regions.
