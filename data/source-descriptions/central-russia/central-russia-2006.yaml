    Final standings of the ACM ICPC 2006-2007 NEERC Central Subregion: 39 teams, ten problems A to J. The page shows status "over" at 5:00:00 of 5:00:00. Each row gives the team, a cell per problem (+ for solved, a number after the plus for extra attempts, a minus and a number for unsolved attempts, a dot for none), the number solved, the total time and the rank. Penalty time is given per team only, not per problem. First place is Vologda SPU#1 with 9 solved; the last two teams are tied at rank 38 with no solved problems. No medals, no site marks.
