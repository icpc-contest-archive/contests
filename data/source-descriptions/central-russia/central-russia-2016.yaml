  title: Northern Eurasia Contests
  language:
  - en
  description: |-
    Website of the Northern Eurasia contests (NEERC archive), a series site that covers the finals and the regional and subregional contests of several years, not this subregional alone. The seed page is the 2016 archive page: for the 2016 finals it links standings, problems in PDF, official tests and the jury archive, and for each regional contest, Central Russia among them, a link to its final standings (Northwestern Russia also lists problem statements, tests, a jury archive, analysis and runs). Our copy holds 150 saved files; many pages are saved more than once, under http, https and port 80 addresses. They are the archive pages for 1996 to 2004, 2016 and 2017, the final standings pages of the finals and of 17 regional contests for each of 2016 and 2017, and several PDFs: the 2016 finals problem statements (15 pages, dated 4 December 2016), the 2016 review, the 2017 statements and analysis, and the Northwestern Russia statements and analyses.

    For this contest the site holds the Central Subregional 2016 standings page, which is also a source of its own. Pages are in English. Pages for 2005 to 2015 and for 2018 onward are linked from the menus but are not in our copy.
