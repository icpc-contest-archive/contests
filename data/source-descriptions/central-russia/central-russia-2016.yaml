  description: |-
    Contest page on Codeforces Gym titled 2016-2017 ACM-ICPC, NEERC, Central Subregional Contest, marked finished, with a list of eleven problems A to K: Fried Fish, Hanoi tower, Desktop, Weather Station, Cupcakes, Vitamins, Sphenic numbers, Non-random numbers, Land Division, Architect of Your Own Fortune and Polymorphic code. Each is read from input.txt and written to output.txt, with a limit of 1 s and 64 MB, and has a count beside it. The page also has the Codeforces menus and forms for questions and announcements.

    Only the names are in our copy: the link to the English statements PDF and the links to the single problem pages lead to the Codeforces server and are not part of it.
