  description: |-
    Contest page of the UK & Ireland Programming Contest for 2019, on the series' website. It states that the contest ran on Saturday 19th October 2019, 11:00 to 16:00, with around 570 students from 23 universities in 191 teams at 17 locations around the UK and Ireland.

    The page has a Key Links section (a download link for problems, source code, data samples and a solutions video and slides, and a link to the final scoreboard), an embedded YouTube broadcast and an embedded map of the contest locations, and lists 18 universities by name, though the page itself speaks of 23. The menu at the top links to the series' other pages, including a 2025 page, practice events and local clubs. Our copy is this one page; the downloads and the scoreboard are separate documents.
