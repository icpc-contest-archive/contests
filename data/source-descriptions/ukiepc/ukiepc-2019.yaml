  description: |-
    Final scoreboard of the contest, a web page with the heading 'final standings': 191 teams, each with rank, team name, university, country flag, number solved and penalty time, and for each of the thirteen problems A to M the solve time in minutes and the number of tries. The last 16 teams have no rank. A summary row at the bottom gives total solved, and per problem the accepted and rejected submissions and the time of the first solve. The team in first place is Treeniceratops of the University of Cambridge with 13 problems solved. Team names link to team pages on the site, which are not part of our copy; the page also links to the 2018 and 2020 scoreboards.
