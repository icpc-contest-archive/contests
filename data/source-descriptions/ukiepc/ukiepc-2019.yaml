  description: |-
    Problem set of the contest: a PDF of 28 pages in English. The cover page names the United Kingdom and Ireland Programming Contest 2019, without a date, and lists the thirteen problems A to M (Automatic Accountant, Ballpark Estimate, Crooked Dealing, Dome Construction, Estate Agent, Feeding Seals, Grand Central Station, Hat Stand, Integral Pyramid, Jammed Gym, Knocked Ink, Low Effort League, Mosaic Mansion). It says the problems are not ordered by difficulty; pages 2 and 28 read "intentionally left (almost) blank".

    Problems A to L take two pages each, from page 3 to page 26, and problem M page 27. Each has a statement, input and output format and one or more sample input and output pairs. No test data or solutions.
