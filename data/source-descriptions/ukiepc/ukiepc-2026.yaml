  description: |-
    Contest dashboard on the QOJ online judge, filed under ICPC, Regionals, Europe, Northwestern Europe, UK & Ireland Programming Contest. It lists 13 problems A to M by name, from A Austere Sign to M Mid Clocking. The page marks the contest as ended and offers a virtual contest; it gives the ruleset as ICPC with a 20-minute penalty and a scoreboard frozen after 4:00:00, and links to Submissions, Standings and External Standings. Its Attachments box links to Statements (en) only; the notice and question boxes are empty.
