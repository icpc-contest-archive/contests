  contest_date: '2026-10-17'
  description: |-
    Website of the UK & Ireland Programming Contest, the page for the 2026 contest, in English. It states that more than 900 students in 350 teams from 35 universities took part at 25 locations across the UK and Ireland, and gives the schedule of the day (arrival and team check-in, introduction video, start at 11:00 BST, scoreboard freeze at 15:00, end at 16:00, solutions and results about 16:10), the programming languages with versions (Python, Java, C++, C, Kotlin, Rust), the rule that LLMs and code-generating AI are not allowed, a section for gold sponsors with messages from Jane Street and Capital One, an embedded map of the locations, and a list of participating universities with a local contact for each, last updated 7 October 2026. Links lead to the standings, the contest server, the problem set, the solution slides and a video of the solutions.

    Our copy holds 50 files, but 49 of them are the same page: the general UKIEPC home page, which presents UKIEPC 2026 (17th October), explains what the UKIEPC is and lists the past contests from 2013 on. Apart from that, our copy has only the 2026 page itself. The embedded video and map and the linked downloads are not part of our copy.
