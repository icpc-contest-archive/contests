  description: |-
    Scoreboard of The 2026 UK & Ireland Programming Contest as shown by Kattis: 364 teams with rank, team name, country flag, institution logo, number solved and penalty time, and for each of the thirteen problems A to M the number of tries and the minute of the first correct solution (a dash where the problem was not solved). The top team has 12 problems solved. The page carries a banner stating that the results are unfinalized and that the scoreboard will be updated, and shows the contest as over, from 12:00 to 17:00 CEST on 2026-10-17. Tabs offer a view of all sites, an ICPC view and one for each of 25 host sites; our copy holds the all-teams view.

    In the all-teams view, no mark separates ICPC teams from the others.
