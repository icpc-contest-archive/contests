    Codeforces gym dashboard of the 2026 United Kingdom and Ireland Programming Contest (UKIEPC 2026), marked Finished. It lists thirteen problems, A to M (Austere Sign to Mid Clocking), each with its time and memory limit and the number of solvers, and links to three contest materials in English: statements (PDF), samples (ZIP) and solutions (PPTX), as well as to the contest website. It also offers virtual participation and practice. Our copy holds the dashboard page and its style files; the linked PDF, ZIP and PPTX files are not part of it.
