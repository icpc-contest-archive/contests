  description: |-
    Final scoreboard of UKIEPC 2017 with 194 team rows and twelve problems labelled A to L. Each row gives the team name, its institution, a country flag, the score as number solved and penalty time, and for every problem the number of tries and the minute of the solving submission (for example 2/101), or just the number of tries when the problem is unsolved. Ranks 1 to 164 are shown for 164 rows, led by a team from the University of Cambridge with 12 problems; the other 30 rows have no rank and no solved problems. A summary row at the bottom gives totals per problem.

    Links lead to the scoreboards of the 2016 and 2018 contests. Our copy holds the page with its style sheets and images.
