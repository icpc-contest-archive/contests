  description: |-
    Page of the UK & Ireland Programming Contest (UKIEPC) website for the 2017 edition, in English. It states that the contest was held on Saturday 21 October 2017, 11:00 to 16:00, with around 500 students from 23 universities in 190 teams at 13 locations in the UK and Ireland. It links to the final scoreboard and to a shared folder with the problems, source code, data samples and a solutions video and slides, links to the ICPC information page, embeds a YouTube broadcast and a map of the contest locations, and lists the 13 host sites with the local contact at each.

    Our copy is this single page, with the navigation menu of the series site as it is today. Style sheets and images (including the pictures of the host sites) are not in our copy, and the scoreboard and the shared folder are not part of it.
