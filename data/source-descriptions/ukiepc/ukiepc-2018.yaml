  description: |-
    Contest page of the UK & Ireland Programming Contest for 2018, on the series' website. It states that the contest ran on Saturday 20th October 2018, 11:00 to 16:00, with around 550 students from 26 universities in 200 teams at 20 locations around the UK and Ireland.

    The page has a Key Links section (a download link for problems, source code, data samples and a solutions video and slides; a link to the final scoreboard; a link to ICPC information), an embedded YouTube broadcast and an embedded map of the contest locations, and lists the participating universities, 18 under their own names and seven more under "Other Participating Universities". The menu at the top links to the series' other pages, including a 2025 page, practice events and local clubs. Our copy is this one page; the downloads and the scoreboard are separate documents.
