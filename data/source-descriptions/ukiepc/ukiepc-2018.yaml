  description: |-
    Problem set of the contest: a PDF of 26 pages in English. The cover page names the United Kingdom and Ireland Programming Contest 2018 and 20th October 2018 and lists the twelve problems A to L (Analogue Cluster, Bus Logic, Code Word, Dynamo Wheel, Evenly Divided, Fibonacci Compression, Garden Variety Vampire, Hamster Ball, Internet Upload, Jackpot, Kings, Last Word). It says the problems are not ordered by difficulty, and page 2 reads "intentionally left (almost) blank".

    Each problem takes two pages, from page 3 to page 26, with a statement, input and output format and one or more sample input and output pairs. No test data or solutions.
