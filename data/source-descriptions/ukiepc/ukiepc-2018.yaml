  description: |-
    Final scoreboard of the contest, a web page with the heading 'final standings': 179 team rows, each with rank, team name, university, country flag, number solved and penalty time, and for each of the twelve problems A to L the solve time in minutes and the number of tries. A summary row at the bottom gives total solved, and per problem the accepted and rejected submissions and the time of the first solve. The team in first place is Triniceratops of the University of Cambridge with 12 problems solved.

    The main table holds 174 teams; 25 of them have no rank: the last 24, all with no problems solved, and one team with one problem solved among the 137th to 149th places. After it comes a separate block of five more teams, ranked 1 to 5 among themselves and shown with a coloured background, with no heading or label explaining the block. The page has links to the 2017 and 2019 scoreboards.
