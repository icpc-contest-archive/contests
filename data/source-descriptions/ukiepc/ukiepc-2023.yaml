  - en
  contest_date: '2023-10-21'
  description: |-
    Page of the UK & Ireland Programming Contest (UKIEPC) for 2023, with the date Saturday 21st October. It states that more than 500 students in more than 200 teams from 23 universities took part at 20 sites across the UK and Ireland. It gives the timetable of the day (arrival 10:00, contest 11:00 to 16:00, scoreboard freeze at 15:00, solutions and results at about 16:10), the rules based on NWERC, the programming languages and versions (Python 3.8, Java 17, C++20, C17), the prize from the sponsor Huawei for the winning team at each site with more than one team, embedded maps of the contest locations and a list of participating universities. Links lead to the final standings, the contest server, the introduction video, the solution slides and a downloads page; the video, the maps and the downloads are on other servers and are not part of our copy.

    Our copy holds 55 saved pages, but only the first is the 2023 page. The other 54 are the same page, the general UKIEPC homepage (it announces UKIEPC 2026 and explains the contest and the ICPC), saved from addresses below the 2023 address. The style sheet and the images of the page are not in our copy.
