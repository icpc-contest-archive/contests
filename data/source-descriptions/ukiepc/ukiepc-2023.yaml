  tries: true
  description: |-
    Final scoreboard of UKIEPC 2023 in one table: 247 teams, each with country flag, team name, university, number solved, total time and one column for each of the 14 problems a to n. 184 ranks are printed; the last 63 teams have no rank. A solved problem shows the time of the solution and the number of tries, with a first-solve mark on some cells; an unsolved problem with attempts shows only the number of tries. 183 teams solved at least one problem and 64 solved none. NewJeans of the University of Oxford is first with 13 solved. A Summary row under the 247 teams gives the total solved, and for each problem the numbers of accepted, rejected and pending submissions and the time of the first solution.

    Below that Summary row the same table holds one more team, the Generative AI Team of the University of Nottingham, with rank 1, two problems solved and its own Summary row; it is not counted among the 247 teams. The page has links to the scoreboards of 2022 and 2024. Style sheets and flag images are kept with our copy.
