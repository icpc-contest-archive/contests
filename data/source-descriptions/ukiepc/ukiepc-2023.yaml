  description: |-
    Editorial slides as a PDF of 31 pages, titled "UKIEPC 2023 Summary and solution outlines"; no author is named. After a title slide and a "Problem Solutions" divider come two slides for each of the 14 problems, in order from Assessment (Disruption) to Naming Wine Bottles: an overview of the task with the number of correct solutions, then a slide listing the techniques used and the algorithm. The last slide, "Final Standings", only gives the address of the contest's standings.

    The problem letters are not printed. The first-solve time is left as "??:??" and the solving team as "??" on the overview slides, with two exceptions: International Travel is marked as 0 correct and not solved, and Journey of Recovery gives a solve time of 02:53 although it counts 0 correct.
