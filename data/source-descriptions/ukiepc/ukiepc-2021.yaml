  description: |-
    Final scoreboard of UKIEPC 2021: 136 teams, ranked 1 to 136, each with team name, university and a country flag. The columns are rank, team, score (number solved and penalty time) and the 12 problems a to l; each cell gives the solve time in minutes and the number of tries, or only the tries for an unsolved problem, and first solves are marked. 128 teams solved at least one problem; the last 8 solved none, six of them with failed attempts and two with none. The first place is a University of Cambridge team with 12 problems solved. The page links to the 2020 and 2022 scoreboards. Our copy holds the page with its style sheets and flag images.
