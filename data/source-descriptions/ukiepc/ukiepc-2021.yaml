    Baekjoon Online Judge page for the category UKIEPC 2021, in Korean, filed under ICPC Regionals, Europe, Northwestern European Regional Contest, The UK & Ireland Programming Contest. A table lists 12 problems labelled A to L, Arm Coordination to Lopsided Lineup, with Baekjoon's problem numbers, marks such as special judge, the number of users who solved each, the number of submissions and the acceptance ratio. Problems E and G are marked as grading being prepared and show no submissions. The statements are on the linked problem pages, which are not part of our copy.
