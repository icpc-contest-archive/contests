  contest_date: '2021-10-30'
  description: |-
    Contest page of UKIEPC 2021, the UK and Ireland programming contest, in English. It says the contest ran on Saturday 30 October 2021 from 12:00 to 5:00pm, with around 400 students in 140 teams from 20 universities, some online and some at one of 8 in-person sites, under NWERC online or covid rules with one computer per person. It links to the final scoreboard and to a downloads page for problems, source code, data samples and the solutions video and slides, shows an embedded YouTube broadcast and a map of contest locations, and lists 11 participating universities, each with a contact, and a Participate Online entry.

    Our copy holds this one page. The video and the map are not in it, and the downloads are links to another server.
