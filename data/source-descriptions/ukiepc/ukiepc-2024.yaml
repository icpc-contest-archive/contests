  description: |-
    Final scoreboard of UKIEPC 2024 in one table: 247 teams, each with country flag, team name, university, number solved, total time and one column for each of the 12 problems a to l. 219 ranks are printed; the last 28 teams, which solved nothing, have no rank. A solved problem shows the time of the solution and the number of tries, with a first-solve mark on some cells; an unsolved problem with attempts shows only the number of tries. 219 teams solved at least one problem and 28 solved none. The first team, from the University of Cambridge, has 11 solved. A Summary row under the 247 teams gives the total solved, and for each problem the numbers of accepted, rejected and pending submissions and the time of the first solution.

    Below that Summary row the same table holds three more teams, each with two problems solved and ranked 1 to 3 among themselves, followed by their own Summary row; they are not counted among the 247 teams. The page has links to the scoreboards of 2023 and 2025. Style sheets and flag images are kept with our copy.
