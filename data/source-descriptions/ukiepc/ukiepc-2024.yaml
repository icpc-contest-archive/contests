  contest_date: '2024-10-19'
  description: |-
    Page of the UK & Ireland Programming Contest (UKIEPC) for 2024, with the date Saturday 19th October. It states that more than 700 students in about 250 teams from 29 universities took part at 24 sites across the UK and Ireland. It gives the timetable of the day (arrival 10:00, contest 11:00 to 16:00, scoreboard freeze at 15:00, solutions and results at about 16:10), the programming languages and versions (Python 3.9.18 with PyPy 7.3.15, Java 21, C++20, C17), a section saying that LLMs, ChatGPT, Co-Pilot and all other code-generating AI are not allowed, embedded maps of the contest locations and a list of participating universities. Links lead to the final standings, the introduction video, the video of the solutions and winners, the solution slides and a downloads page; the videos, the maps and the downloads are on other servers and are not part of our copy.

    Our copy holds 53 saved pages, but only the first is the 2024 page. The other 52 are the same page, the general UKIEPC homepage (it announces UKIEPC 2026 and explains the contest and the ICPC), saved from addresses below the 2024 address. The style sheet and the images of the page are not in our copy.
