  times: true
  tries: true
  description: |-
    Final scoreboard of UKIEPC 2020: 188 participants, each listed under a name with a university and a country flag, who took part as individuals. 170 solved at least one problem and are ranked by number solved and penalty time; 18 solved none, of which the first is ranked 171 and the other 17 are listed at the bottom without a rank. The columns are rank, team, score (number solved and penalty time) and the 13 problems A to M; each cell gives the solve time in minutes and the number of tries, or only the tries for an unsolved problem, and first solves are marked. A summary row at the bottom gives the total number solved and, for each problem, accepted, rejected and pending submissions and the time of the first solve. The first place is a participant from the University of Oxford with 12 problems solved.

    The page carries navigation links labelled 2019 and 2021. Our copy holds the page with its style sheets and flag images.
