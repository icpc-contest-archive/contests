  description: |-
    Solution slides of UKIEPC 2020 in English, 30 pages. For each of the 13 problems A to M there is an overview slide with an author credit and a solution slide (Kleptocrat has two) with techniques and an outline of the algorithm. The overview slides carry placeholders ("??") where the number of correct solutions and the first solve would be shown. The second page notes that many problems this year are shared with BAPC, and the last slide is headed Final Standings and holds a web address and an image.
