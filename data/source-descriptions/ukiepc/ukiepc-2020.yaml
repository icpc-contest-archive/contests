  title: UKIEPC 2020
  language:
  - en
  contest_date: '2020-12-12'
  description: |-
    Contest page of UKIEPC 2020, the UK and Ireland programming contest, in English. It explains that the contest was held on Saturday 12 December 2020, two months later than usual because of COVID-19, as an individual contest that people could enter from any location, with 250 remote, virtual and individual contestants registered. The page gives the schedule of the day (introduction video at 10:30, contest 11:00 to 16:00, scoreboard freeze at 14:00 with a note that it was frozen early), links to the contest server, the final scoreboard, a downloads page for problems, source code, data samples and the solutions video and slides, and two 2020 FAQ entries. It also lists 13 universities as registration sites, each with a contact, a Participate Online entry, and ten more universities that had teams.

    Our copy holds this one page. The embedded videos and the map are not in it, the downloads are links to another server, and the menu also links to other years' pages.
