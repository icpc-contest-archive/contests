  description: |-
    Final scoreboard of UKIEPC 2015 on the contest website, headed final standings: 157 team rows, each with a country flag, rank, team name and institution, number of problems solved, penalty time and one cell for each of the thirteen problems A to M. A solved problem shows tries and time (2/266); an unsolved problem shows the number of wrong tries, or 0. The first 96 rows carry ranks 1 to 96, followed by 50 rows without a rank; a shaded block of 11 rows at the end has ranks 1 to 8 and three rows without a rank. Eight team names contain "spare". A summary row at the end gives submitted and correct counts per problem and states 168 teams in total, eleven more than the rows in our copy. First place: EE Dragons of the University of Cambridge with 10 solved and penalty time 1718. Links lead to the 2014 and 2016 scoreboards.

    The list of categories and the colour legend are not in our copy. The eleven teams missing from the rows all appear in the other scoreboard of this contest, and all have spare in their names.
