  description: |-
    Single page of the UKIEPC website for the 2015 edition. It gives the date and time (Saturday 24th October 2015, 10:00 to 15:00 BST) and states that around 400 students from 20 universities, in 150 teams at 12 locations around the UK and Ireland, took part. Twelve participating universities are listed: Nottingham, Bath, Imperial, DCU, Portsmouth, Aberdeen, Exeter, Cambridge, Aberystwyth, Manchester, St Andrews and Liverpool. Under Final Standings it shows an image of the top ten that links to the final scoreboard on the same site; the image file is not in our copy. Key Links point to the final scoreboard, to a download folder with problems, source code, data samples, solutions, video and slides, and to ICPC information; the download folder and the ICPC page are on other servers. A YouTube broadcast and a map of contest locations are embedded from other servers, and the sponsors section holds two logo images that are not in our copy.

    Our copy holds this one page.
