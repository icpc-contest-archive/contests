  description: |-
    Final scoreboard of UKIEPC 2022: 123 teams, each with a team name and, for most, a university; 113 carry a country flag and 10 have none. The columns are rank, team, score (number solved and penalty time) and the 12 problems a to l; each cell gives the solve time in minutes and the number of tries, or only the tries for an unsolved problem, and first solves are marked. The rank cell holds the team's position from 1 to 123, but is empty for 15 teams with one problem solved that have the same penalty as the team above them. Beside 15 team names a badge shows a site name, such as University of Oxford (Oxford teams only). The first place is a University of Oxford team with 11 problems solved. The page links to the 2021 and 2023 scoreboards. Our copy holds the page with its style sheets and flag images.
