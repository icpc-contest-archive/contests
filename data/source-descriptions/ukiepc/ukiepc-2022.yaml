  description: |-
    Problem set of the United Kingdom and Ireland Programming Contest 2022 as a PDF of 28 pages, in English. A cover page lists 12 problems A to L (Alpine Pass to Lasso Tool) with the note that they are not ordered by difficulty and must not be opened before the contest. Each problem has a full statement with input and output sections and two or three sample input and output pairs.
