  description: |-
    Final standings page headed "Scoreboard UKIEPC 2022", with links to the 2021 scoreboard and a "2023" label. A single table lists 123 teams with rank, country flag, team name and university, a score (two numbers per team, 11 and 947 for the first row), and one column for each of the 12 problems A to L. Each solved problem shows a number and the count of tries, such as "132 1 try"; unsolved attempts show only the tries. Rank numbers run from 1 to 123, and 15 teams, all in the lower half, carry no rank number; the page does not say why. Fifteen team names carry a label naming one university and the sites it applies to, such as "University of Oxford (Oxford teams only)". The page has no contest date.

    Our copy is the page alone: the style sheet and flag images are not saved, and the last team row ends after its first two problem cells.
