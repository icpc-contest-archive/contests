- url: https://ukiepc.info/2025/
  read: '2026-11-16'
  rubric: 1
  copy: ukiepc/ukiepc-2025/website/2026-09-05-live-10cfcbae
  title: UKIEPC
  language:
  - en
  contest_date: '2025-10-18'
  description: |-
    Website of the UK & Ireland Programming Contest, the page for the 2025 contest, in English. It states that more than 800 students in 310 teams from 27 institutions took part at 20 locations across the UK and Ireland, and gives the schedule of the day (arrival, introduction video, start at 11:00 BST, scoreboard freeze at 15:00, end at 16:00, solutions and results about 16:10), the programming languages (Python, Java, C++20, C17, Kotlin, Rust), the rule that LLMs and code-generating AI are not allowed, an embedded map of the locations and a list of participating universities with a local contact for each, last updated 25 September 2025. Links lead to the final standings, the problem set, the solution slides and a video of the solutions.

    Our copy holds 55 files, but 54 of them are the same page: the general UKIEPC home page, which presents UKIEPC 2026 (17th October) and explains what the UKIEPC is, a preliminary contest for NWERC held since 2013 and spread over several host universities. Apart from that, our copy has only the 2025 page itself. The embedded video and map and the linked downloads are not part of our copy.
