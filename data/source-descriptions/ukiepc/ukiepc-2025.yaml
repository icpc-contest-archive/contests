    Codeforces gym dashboard of the 2025 United Kingdom and Ireland Programming Contest (UKIEPC 2025), marked Finished. It lists thirteen problems, A to M (Arboreal Challenge to Motorway Stops), each with its time and memory limit and the number of solvers, and links to three contest materials: samples (ZIP), statements (PDF) and solution slides (PDF), all in English. It also offers virtual participation and practice. Our copy holds the dashboard page and its style files; the linked ZIP and PDF files are not part of it.
