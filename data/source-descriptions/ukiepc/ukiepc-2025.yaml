  read: '2026-11-16'
  rubric: 1
  copy: ukiepc/ukiepc-2025/scoreboard/2026-09-01-live-2d2fc377/page.html
  title: Scoreboard UKIEPC 2025
  language:
  - en
  teams: 248
  problems: 13
  times: true
  tries: true
  description: |-
    Final scoreboard of UKIEPC 2025: 248 team rows with rank, team name, institution and country flag, number solved, penalty time, and for each of the thirteen problems a to m the time of the first correct solution and the number of tries, or the number of tries alone for unsolved problems. 225 teams carry a rank; 23 rows have no rank (19 of them with no problem solved, four with one or two). The leading teams are from the University of Cambridge and the University of Oxford, with 12 problems solved. A last row summarises each problem with totals. A link leads to the 2024 scoreboard.

    The page lists all sites together, with no mark that separates official from unofficial teams.
