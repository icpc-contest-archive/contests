    Standings of The 2025 ICPC UK & Ireland Programming Contest: 240 teams with rank, team, institution, number solved and penalty time, plus a medal column, a citation column and a site citation column. 134 teams are marked Ranked and carry a place from 1 to 135, with a citation such as First Place; 106 teams are marked Honorable and have no rank. The site citation column is filled for 18 teams, with a site name such as "Cambridge University (Cambridge teams only)". First place is Unity from the University of Cambridge with 12 problems solved. No per-problem detail.
