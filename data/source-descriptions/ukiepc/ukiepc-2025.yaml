    Category page of the Baekjoon Online Judge for UKIEPC 2025, in Korean. It lists thirteen problems, A to M (Arboreal Challenge to Motorway Stops), each with the judge's problem number, its title, tags (special judge for four of them, multi-language for all), the number of users who solved it, the number of submissions and the acceptance rate. The category is placed under ICPC, Regionals, Europe, Northwestern European Regional Contest, The UK & Ireland Programming Contest. Our copy holds only this list page, with no problem statements.
