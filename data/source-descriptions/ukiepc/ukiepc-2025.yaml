  title: United Kingdom and Ireland Programming Contest 2025
  language:
  - en
  problems: 13
  pages: 30
  description: |-
    Problem set as a PDF of 30 pages in English. The cover, headed "United Kingdom and Ireland Programming Contest 2025" and carrying an image, lists the 13 problems A to M (A Arboreal Challenge, B Brickwork, C Colourful Captcha, D Depot, E Enclosure, F Fell Walking, G Get Good, H Hybrid Search, I Itsy Bits, J Joust Sort, K Klaus, L Last Orders, M Motorway Stops) and notes that they are not ordered by difficulty.

    Each problem starts on an odd page with its statement, input and output sections and one to five numbered samples of input and output; A, B, H and K have numbered figures. Five pages are left "(almost) blank". No time limits, date, test data or solutions are printed.
