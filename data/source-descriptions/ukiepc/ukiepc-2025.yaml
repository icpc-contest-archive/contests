    Solution slides of UKIEPC 2025, by the jury, dated 18th October 2025: a PDF of 39 slides in English. Each of the thirteen problems, A to M, gets a short statement summary followed by solution slides with the key observations, the approach and keywords such as binary search, dynamic programming or ad-hoc. Hybrid Search takes the longest treatment, thirteen slides.
