  description: |-
    Single page of the UKIEPC website for the 2014 edition. It gives the date and time (Saturday 4th October 2014, 10:00 to 15:00 BST) and says the contest ran in 9 locations around the UK and Ireland; nine participating universities are listed: Nottingham, Bath, Imperial, DCU, Portsmouth, Aberdeen, Aston, Exeter and Aberystwyth. Under Final Standings it shows an image of the standings that links to the final scoreboard on Kattis; the image file is not in our copy. Key Links point to the problem set, slides describing solutions, the judges' input and output and the judges' solutions, which the page credits to NCPC, and to ICPC information. These are links to other files and servers, not part of the page. A map of contest locations is embedded from another server, and the sponsors section holds three logo images that are not in our copy.

    Our copy holds this one page.
