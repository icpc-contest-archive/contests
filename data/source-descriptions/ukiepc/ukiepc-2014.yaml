    Final standings of the 2014 UK & Ireland Programming Contest: 87 teams with rank, team name, institution, number solved, total time and a citation. The first places are named First Place to Twelfth Place, tied teams share a rank and a place name (fifteen teams share Thirteenth Place), twenty-three teams share Twenty-eighth Place, and the 37 teams from rank 51 on are marked Honorable Mention; 26 of them solved nothing and share rank 62. The teams come from 20 institutions. First place: DoCtors of Imperial College London with 11 solved and time 1417. No per-problem results.
