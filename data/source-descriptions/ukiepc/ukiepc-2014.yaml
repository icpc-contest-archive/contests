  description: |-
    Final scoreboard of the 2014 UK & Ireland Programming Contest on Kattis: 87 teams, each with rank, team name, number solved, total time and one cell for each of the eleven problems A to K. A problem cell gives the number of attempts and the minute of the solving run, or attempts and a dash for an unsolved problem. The page shows the contest as over, with start 2014-10-04 11:00 CEST and end 16:00 CEST (five hours), and has a site filter for Great Britain and Ireland and for the universities; a legend marks first to solve, solved, attempted and pending judgement.

    61 teams solved at least one problem and 26 solved none; the zero-solve teams share rank 62, and 17 team names contain "spare" (for example Imperial-Spare2); no separate marking of unofficial teams is shown. First place: DoCtors with 11 solved.
