  contest_date: '2016-10-29'
  description: |-
    Page of the UK & Ireland Programming Contest (UKIEPC) website for the 2016 edition, in English. It states that the contest was held on Saturday 29 October 2016, 11:00 to 16:00, with around 500 students from 26 universities in 180 teams at 13 locations in the UK and Ireland. It has links to the final scoreboard and to a shared folder with the problems, source code, data samples and a solutions video and slides, a link to the ICPC information page, an embedded YouTube broadcast and an embedded map of the contest locations, and a list of the 13 host sites with the name of the local contact at each.

    Our copy holds 59 pages, all HTML. Only the first is the 2016 page; the other 58 are identical copies of the series homepage as it stood when we fetched it, which presents UKIEPC 2026 and explains what the contest is, how to take part and how to host a site. Style sheets and images are not in our copy, and the scoreboard and the shared folder are not part of it.
