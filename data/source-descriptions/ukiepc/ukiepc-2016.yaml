  tries: true
  description: |-
    Final scoreboard of UKIEPC 2016 with 210 team rows and twelve problems labelled A to L. Each row gives the team name, its institution, a country flag, the score as number solved and penalty time, and for every problem the number of tries and the minute of the solving submission (for example 2/105), or just the number of tries when the problem is unsolved. The main table has 206 rows; ranks 1 to 160 are shown for 158 of them, led by Catz CS Society (1) of the University of Oxford with 10 problems, and the other 48 rows have no rank. A second group of four teams, from Prague, Kyiv, Kaunas and Lund, follows with its own ranks 1 to 4 and no label. A summary row at the bottom gives totals per problem.

    Links lead to the scoreboards of the 2015 and 2017 contests. Our copy holds the page with its style sheets and images.
