  contest_date: '2013-10-05'
  description: |-
    Single page of the UKIEPC website for the 2013 edition. It gives the date and time of the contest (Saturday 5th October 2013, 10:00 to 15:00 BST), says it took place around the UK and Ireland, and lists five participating universities: Nottingham, Bath, Dublin, Imperial and Wolverhampton. Under Key Links it points to the contest standings, ICPC information and photos, all of which lead to other servers; it also has sections for site sponsors, a YouTube broadcast and a map of contest locations, the last two embedded from other servers.

    The page wears the site's current menu (practice events, local clubs, past contests, FAQs). Our copy holds this one page.
