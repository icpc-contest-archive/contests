  description: |-
    Problem set of the Nordic Collegiate Programming Contest (NCPC) 2013: a PDF of 24 pages. The cover is headed NCPC 2013, 5th October 2013 and lists eleven problems A to K (Planting Trees, Boiling Vegetables, Number Trick, Robert Hood, Virus Replication, Timebomb, Erase Securely, Pinball, Dance Reconstruction, Dartboard, Cliff Walk), followed by general advice on submissions. Each problem has a statement in English with input and output format and sample input and output: nine problems have two samples, one has three and one has four. No test data or solutions.

    The document names NCPC, not UKIEPC.
