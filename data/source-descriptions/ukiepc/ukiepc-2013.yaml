  description: |-
    Kattis problem-source page for the Nordic Collegiate Programming Contest (NCPC) 2013: a table of 11 problems with, for each, the fastest run time, shortest solution, number of authors, full solves, ratio, difficulty rating and languages (all English). The names are the same eleven as in the NCPC 2013 problem set. The page links to each problem; the statements themselves are not on this page. The counts reflect Kattis as of the day of our copy.
