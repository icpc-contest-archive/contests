  description: |-
    Website of the 2020 contest of teams of computer science students of Croatian universities, in Croatian, held on Sunday 29 November 2020 (10:00 to 15:00, as the announcement page states) at the universities of Zagreb, Osijek, Rijeka and Pula. Our copy holds 5 pages plus a script, an Excel file for the application and a ZIP file: the front page, an application page (applications by 25 November, teams of three students from one university, 8 to 12 problems in 5 hours, Python, C/C++ and Java), an announcement page listing the 18 participating teams with their members, a results page and the problem statements as a PDF.

    The announcement says the best teams earn the right to play in CERC 2020 in Prague. Teams 15 to 18, made up of primary and secondary school pupils, take part outside the official competition. The ZIP file holds one C++ solution per problem, A to K, and a PDF of algorithm descriptions. The test data archive linked from the front page is not in our copy.
