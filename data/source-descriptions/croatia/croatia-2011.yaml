  description: |-
    Report of the contest in Croatian, a PDF of 4 pages headed Zagreb, FER, 15 October 2011. It states that the contest ran from 10:00 to 15:00 at the Faculty of Electrical Engineering and Computing, with 9 problems in 5 hours in Pascal, C and C++ on Linux, in cooperation with HSIN's association X.fer, and that a record 30 teams registered, all from the University of Zagreb.

    A table lists the 30 teams by rank with team number, each member's year of study and faculty, the number of problems solved and a total time; there are no per-problem results. It ends by saying that the two best teams earned the right to compete at the CERC regional contest in Prague, and names the committee and organisers.
