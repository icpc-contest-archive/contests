  description: |-
    Small website of the 2011 contest of teams of computer science students of Croatian universities, held in Zagreb on 15 October 2011, in Croatian. Our copy holds seven pages and the files they link to. The front page is a menu linking to registration, the announcement, instructions for contestants, the problems, test data, the results and the report.

    The registration page states the rules: a team is three students of one university, teams had to register by 5 October, and the contest is held at the Faculty of Electrical Engineering and Computing in Zagreb. The announcement lists the 30 competing teams with members and faculties. A 2-page PDF of instructions gives the time and place, the workstation software and the conduct rules. The results page is a scoreboard of the 30 teams; the problem statements are a 12-page PDF, and a 4-page PDF is the organisers' report. Our copy also holds 60 image files, which are 30 team photographs and their 30 thumbnails. The test data zip was too large to be fetched and is not in our copy.
