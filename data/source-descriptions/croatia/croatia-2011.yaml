  description: |-
    Problem set of the contest as handed out: a PDF of 12 pages in Croatian, headed with the contest name and the date 15 October 2011. A first page lists the nine problems in a table (ANADROM, BANANE, HAKER, IZLET, STRUJA, TELEFON, TETRIS, VANZEMALJCI, ZONE) with input and output as standard input and output, time limits of 0.5 to 5 seconds per problem, and a memory limit of 128 MB.

    Each problem then has a statement with input and output format and a section of sample test data. No test data or solutions are in the document.
