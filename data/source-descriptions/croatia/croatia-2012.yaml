  description: |-
    Final scoreboard of the contest in Zagreb on 28 October 2012, a page in Croatian. It lists 27 teams with rank, team number and the names of its three members, then one column for each of the nine problems A to I (named Agresor, Kreditna, Kvadrati, Lubenice, Matematika, Permutacije, Restorani, Tartufi and Virus) and a total. A solved problem shows the time of the accepted solution and the number of wrong tries in brackets; an unsolved problem with wrong tries shows only the bracketed number. The total gives problems solved and penalty time, and an explanation above the table says 20 minutes are added for each wrong try before the accepted one. Seven problems were solved by the first-placed team, TIM 15.

    One team, TIM 27, is marked with an asterisk, which a footnote explains as an unofficial team of secondary-school students competing outside the competition; it still has a place (fifth) in the table. The last team in the table is marked as not having appeared. Team photographs are linked from the page.
