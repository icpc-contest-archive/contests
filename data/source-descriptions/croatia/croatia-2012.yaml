  description: |-
    Problem set of the student contest held in Zagreb on 28 October 2012, a PDF of 12 pages in Croatian. The first page is a cover table of the nine problems A to I with their names (Agresor, Kreditna, Kvadrati, Lubenice, Matematika, Permutacije, Restorani, Tartufi, Virus), input and output via standard streams, and the time limit of each problem (one to five seconds) and a memory limit of 128 MB.

    Each of the nine problems then has a statement with input format, output format and a sample section with sample input and output; some also have an explanation of the first sample. Test data and solutions are not part of this PDF.
