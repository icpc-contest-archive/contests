  description: |-
    Registration page of the 2012 student team contest of Croatian universities, in Croatian. It announces the contest for Sunday 28 October 2012 from 10:00 to 15:00 at the Faculty of Electrical Engineering and Computing in Zagreb, with registration open until 23 October. A team has three students from the same university; the page lists the data to send for each member. The contest is 9 problems in 5 hours in Pascal, C/C++ or Java on Linux, and at most two teams earn the right to compete at CERC 2012 in Krakow. It names the problem-setting and organising committee and links to earlier contests' problems.

    No list of teams is on this page; the team list is on the announcement page of the same site.
