  description: |-
    Website of the 2012 contest of student teams of Croatian universities, held in Zagreb on 28 October 2012, published by the Croatian Informatics Association (HSIN). It is in Croatian. Our copy holds 7 pages: a front page with links, the registration notice, the announcement with the list of 27 teams, a 2-page PDF of instructions for contestants, the problem set PDF, the results page with the scoreboard, and a 5-page PDF report on the contest. Also in our copy are a ZIP archive of test data with a folder of input and output files for each of the nine problems, and 27 team photographs, each with a thumbnail.

    The front page also names a solutions item, but it is plain text without a link, and no solutions are in our copy.
