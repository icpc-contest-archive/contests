    The report contains a ranked table of 26 teams with team number, the three members with their faculty, problems solved and total time. It then explains the penalty rule, states that the contest was 9 problems in 5 hours, and says the first three teams earned the right to compete at CERC 2012 in Krakow. It closes with the list of those who ran the contest.
