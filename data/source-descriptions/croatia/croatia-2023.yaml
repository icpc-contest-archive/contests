  description: |-
    Website of the 2023 contest of teams of computer science students of Croatian universities, in Croatian, held online on Sunday 19 November 2023 (10:00 to 15:00, as the application and announcement pages state), with teams from the universities of Zagreb, Rijeka and Pula. Our copy holds 5 pages plus a script, an Excel file for the application and a ZIP file: the front page, an application page (applications by 15 November, teams of three students from one university, 8 to 12 problems in 5 hours, Python, C/C++ and Java), an announcement page listing 18 teams with their members, a results page and the problem statements as a PDF.

    The announcement says the best teams earn the right to play in CERC 2023 in Ljubljana. Teams 15 to 18, made up of secondary school pupils, take part outside the official competition. The ZIP file holds one C++ solution per problem, A to L. The test data archive linked from the front page is not in our copy.
