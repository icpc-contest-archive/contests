  description: |-
    Small website of the 2010 contest of teams of computer science students of Croatian universities, held in Zagreb on 6 November 2010, in Croatian. Our copy holds five pages and the files they link to. The front page is a menu linking to registration, the announcement, the problems, test data, solutions and the results.

    The registration page states that a team is three students of one university, that teams had to register by 3 November, and that the contest is 8 to 10 problems in 5 hours in Pascal, C/C++ or Java on Linux. The announcement names the Faculty of Electrical Engineering and Computing in Zagreb as venue and lists the 25 competing teams with their members. The results page is a scoreboard of the 25 teams, and the problem statements are a 13-page PDF. Our copy also holds the solutions zip (nine C++ source files and a PDF of solutions) and 50 image files, which are 25 team photographs and their 25 thumbnails; the test data zip was too large to be fetched and is not in our copy.
