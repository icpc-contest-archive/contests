  description: |-
    Website of the 2019 contest of teams of computer science students of Croatian universities, in Croatian, held on Sunday 27 October 2019 at the universities of Zagreb, Osijek, Rijeka and Pula. Our copy holds 5 pages plus a style sheet, a script and a ZIP file: the front page, an application page (a team of three students from one university, applications by 23 October, the contest from 10:00 to 15:00, 8 to 12 problems in 5 hours, Python, C/C++ and Java), an announcement page listing the 30 participating teams with their members, a results page and the problem statements as a PDF.

    The announcement says the best teams earn the right to play in CERC 2019 in Prague. Teams 27 to 30, made up of primary and secondary school pupils, take part outside the official competition. The ZIP file holds one solution source file per problem, A to J (two for E, C++ and Python), and a PDF of algorithm descriptions. The test data archive linked from the front page is not in our copy.
