  description: |-
    Scoreboard of 30 teams and ten problems, A to J, in Croatian. Each row gives rank, team number with the city or school type in brackets, the members, problems solved and total penalty time, then per problem the number of attempts and, for solved problems, the time of the accepted solution. Unsolved problems with attempts show only the attempt count. The page explains that ties are broken by penalty and that each wrong run adds 20 minutes.

    The first-placed team is Tim 12 from Zagreb with 7 problems solved. Four teams (27 to 30) carry the bracket label SŠ or OŠ, and a note below the table says teams made up of primary and secondary school pupils competed outside the official ranking.
