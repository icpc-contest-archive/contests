  description: |-
    Website of the 2016 contest of student teams from Croatian universities, in Croatian, held on Sunday 23 October 2016 at the universities of Zagreb, Osijek, Dubrovnik, Rijeka and Pula. The front page links to five items: registration, an announcement, the problems, the test data and the results.

    Our copy holds 5 pages: the front page, a registration page with the call for teams (three students from one university per team, deadline 19 October, 5 hours, Python, C/C++ and Java), an announcement page that lists 35 teams, 33 of them with their city and two marked SS, the results page with a scoreboard, and the problem set as a PDF of 14 pages. The announcement and registration pages state that the best teams earn the right to play in CERC 2016 in Zagreb. The test data link leads to a zip file that is not in our copy. The results page shows a photo for each team; 34 of the 35 photos, and their thumbnails, are in our copy, and the one for team 30 is missing.
