  description: |-
    Registration page of the contest, in Croatian: a call for teams of three students from the same university, to be sent in by Wednesday 19 October with each member's name, phone, e-mail, year of birth, year of enrolment and study programme. It states that the contest runs on Sunday 23 October 2016 from 12:00 to 17:00, with 8 to 10 problems in 5 hours, in Python, C/C++ or Java on Linux, and that the organiser may set entry criteria if there are too many teams.

    The page says the best teams earn the right to play at CERC 2016 in Zagreb on 18 to 20 November 2016, and names the scientific committee and the organisers. It gives no list of teams.
