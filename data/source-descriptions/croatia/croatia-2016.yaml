  description: |-
    Scoreboard on the contest website, in Croatian: 35 teams ranked by problems solved and then by penalty time, with ten problem columns named BLOKADA, CAKI, GORIVO, KOCKA, MARICA, OGRADA, PČELE, ROJ, RUDAR and VJEROJATNOST, and a total column with solved count and penalty. Each team is listed as a numbered team with its three members and a photo that links to a larger picture. Each problem cell gives the solve time and a number in brackets; an unsolved problem shows a dash, or only a bracketed number. A note above the table explains the penalty rule of 20 minutes for each incorrect submission before the correct one.

    Teams 34 and 35, made up of secondary-school students, competed unofficially; a note under the table says so and their rows are marked with asterisks. Team 2 is first with 8 problems solved. The photo of team 30 is missing from our copy.
