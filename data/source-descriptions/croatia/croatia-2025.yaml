    Our copy holds five pages and two more files: the registration page (teams of three students from one university, online contest on 26 October, 8 to 12 problems in 5 hours, Python, C/C++ and Java allowed, the best teams qualify for CERC 2025 in Wroclaw), the announcement page (the list of 14 teams with their three members, teams 11 to 14 being secondary school teams outside the official competition), the problem PDF with 12 problems A to L, and the results page with the final table of 11 teams. The registration form (an Excel file) is saved too.

    The test data archive linked from the front page is not in our copy.
