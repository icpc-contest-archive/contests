  contest_date: '2017-10-22'
  description: |-
    Registration page of the contest, in Croatian: a call for teams of three students from the same university, to be sent in by Thursday 19 October with each member's name, phone, e-mail, year of birth, year of enrolment and study programme. It states that the contest runs on Sunday 22 October 2017 from 10:00 to 15:00, with 8 to 10 problems in 5 hours, in Python, C/C++ or Java on Linux, that printed reference material of at most 25 A4 pages is allowed this year, and that the organiser may set entry criteria if there are too many teams.

    The page says the best teams earn the right to play at CERC 2017 in Zagreb on 17 to 19 November 2017, and names the scientific committee and the organisers. It gives no list of teams.
