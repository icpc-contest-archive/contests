  description: |-
    Scoreboard on the contest website, in Croatian: 31 teams ranked by problems solved and then by penalty time, with ten problem columns named ASFALT, COD, KAKTUS, KALENDAR, LETOVI, NKD, PLOČA, PRESJEK, SRETAN and STABLO, and a total column with solved count and penalty. Each team is listed as a numbered team with its three members and a photo that links to a larger picture. Each problem cell gives the solve time and a number in brackets; an unsolved problem shows a dash, or only a bracketed number when there were attempts. A note above the table explains the penalty rule of 20 minutes for each incorrect submission before the correct one.

    Teams 29, 30 and 31, made up of secondary-school students, competed unofficially; a note under the table says so and their rows are marked with asterisks, but they are ranked in the table among the others (team 31 is fourth). Team 15 is first with 9 problems solved. The photo of team 24 is missing from our copy.
