  contest_date: '2017-10-22'
  description: |-
    Website of the 2017 contest of student teams from Croatian universities, in Croatian, held on Sunday 22 October 2017 at Zagreb, Osijek, Rijeka and Pula. The front page links to six items: registration, an announcement, the problems, the test data, the solutions and the results.

    Our copy holds 5 pages: the front page, a registration page with the call for teams (three students from one university per team, deadline 19 October, 5 hours, Python, C/C++ and Java, printed reference material of up to 25 A4 pages allowed), an announcement page that lists 31 teams, 28 of them with their city and three marked SS, the results page with a scoreboard, and the problem set as a PDF of 12 pages. The solutions link leads to a zip file of 10 source files, one per problem, which is in our copy. The test data link leads to a zip file that is not in our copy. The results page shows a photo for each team; 30 of the 31 photos, and their thumbnails, are in our copy, and the one for team 24 is missing.
