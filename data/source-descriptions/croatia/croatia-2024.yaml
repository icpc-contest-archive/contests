  description: |-
    Website of the 2024 competition of teams of computer science students of Croatian universities, in Croatian, held on Sunday 10 November 2024 and announced for Zagreb, Rijeka, Pula and Osijek. The front page links to registration, the announcement, the problems, test data, solutions and results.

    Our copy holds five pages and three files: the registration page (teams of three students from one university, online contest on 10 November, 8 to 12 problems in 5 hours, Python, C/C++ and Java allowed, the best teams qualify for CERC 2024 in Wroclaw), the announcement page (the list of 15 teams with their three members, teams 12 to 15 being secondary school teams outside the official competition), the problem PDF with 11 problems A to K, and the results page with the final table of 15 teams. The solutions archive is also in our copy and holds ten C++ files, A.cpp to J.cpp. The registration form (an Excel file) is saved too.

    The test data archive linked from the front page is not in our copy.
