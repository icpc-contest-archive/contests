  description: |-
    Small website of the 2009 contest of teams of computer science students of Croatian universities, held in Zagreb on 17 October 2009, in Croatian. Our copy holds five pages and the files they link to. The front page is a menu linking to the announcement, the problems, test data, solutions, the report with results, and the results page.

    The announcement names the venue, the Faculty of Electrical Engineering and Computing in Zagreb, and lists the 15 competing teams of three students each. It gives the rules: a minimum of 7 problems in 5 hours, in Pascal, C or C++, and the winning team earns the right to compete at the Central European regional contest in Wroclaw. The results page is a scoreboard of the 15 teams with nine problem columns; the report is a two-page PDF with the same results, and the problem statements are a 17-page PDF. Our copy also holds the solutions zip (24 C++ source files and a presentation file) and 30 image files, which are 15 team photographs and their 15 thumbnails; the test data zip was too large to be fetched and is not in our copy.
