    Report of the contest in Croatian, a PDF of 2 pages dated Zagreb, 19 October 2009. The first part states the date and time, 10:00 to 15:00 on Saturday 17 October 2009, the venue at the Faculty of Electrical Engineering and Computing, 15 teams, and 9 problems in 5 hours in Pascal, C and C++ on one Linux computer. It says that the two best teams earned the right to compete at the Central European regional contest in Wroclaw.

    The results are a scoreboard of the 15 teams, with team members, rank, nine problem columns labelled ZAD1 to ZAD9, solve times and bracketed wrong tries, and the number solved with total penalty time. The end of page 2 names the programme leader, the authors of the problems and the organisers.
