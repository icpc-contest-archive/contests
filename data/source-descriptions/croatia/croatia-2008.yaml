  contest_date: '2008-10-25'
  description: |-
    Small website of the 2008 competition of teams of computer science students of Croatian universities, held in Zagreb on 25 October 2008, in Croatian. Our copy holds four pages: a home page with links, an announcement, the results page and the problem statements PDF. The announcement gives the time (10:00 to 15:00 on Saturday), the venue at the Faculty of Electrical Engineering and Computing, the fifteen participating teams with their three members each, and the statement that at most three of the best teams earn the right to play at CEPC in Wrocław on 28 to 30 November 2008. It names the Croatian Informatics Association (HSIN) programme and the Ministry of Science, Education and Sports as the framework.

    Our copy also holds the 15 team photos linked from the results page, each as a thumbnail and a full-size picture (30 image files), and two zip archives linked from the home page: the test data (358 entries, split into sample test data and official test data with a folder for each problem) and the solutions (nine C++ programs and nine Word documents describing the algorithms).
