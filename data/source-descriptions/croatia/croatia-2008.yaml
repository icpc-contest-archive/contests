    Scoreboard in Croatian: fifteen teams, each identified by the names of its three members, ranked by place (MJESTO) against nine problems, BOMBONI, CESTE, CESTICE, IGRA, PREKIDAC, RIVA, RSA, TROKUT and ZMIJA. A solved problem shows the time of the accepted run as hours:minutes:seconds followed by a number in brackets; an unsolved problem shows a dash, or only a number in brackets. The last column (UKUPNO) gives problems solved and total time. A note above the table explains that teams tied on problems solved are ranked by penalty time, with 20 minutes added for each wrong run before the accepted one. The first team solved eight problems and twelve teams solved at least one; links to team photos are on the page.
