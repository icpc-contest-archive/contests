  description: |-
    Website of the 2013 contest of student teams of Croatian universities, held in Zagreb on 26 October 2013, published by the Croatian Informatics Association (HSIN). It is in Croatian. Our copy holds 6 pages: a front page with links, the registration notice, the announcement with the list of 17 teams, a 2-page PDF of instructions for contestants, the problem set PDF, and the results page with the scoreboard. Team photographs linked from the results page are also in our copy.

    The front page links an archive of test data, but it was too large to be saved and is not in our copy. A solutions item on the front page is plain text without a link, and no solutions are in our copy.
