  description: |-
    Final scoreboard of the contest in Zagreb on 26 October 2013, a page in Croatian. It lists 17 teams with rank, team number and the names of its three members, then one column for each of the nine problems A to I (named Arhimed, Formula, Haker, HNL, Ivo, Mnogokut, Sort, Umnozak and Zvonimir) and a total. A solved problem shows the time of the accepted solution and the number of wrong tries in brackets; an unsolved problem with wrong tries shows only the bracketed number. The total gives problems solved and penalty time, and an explanation above the table says 20 minutes are added for each wrong try before the accepted one.

    The first-placed team, TIM 8, solved seven problems. The last three teams solved none. Team photographs are linked from the page.
