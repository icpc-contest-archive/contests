    Problem list of the contest 'CPC 2013' on Baekjoon Online Judge, in Korean. The page names its origin as ICPC Regionals, Europe, Central European Regional Contest, The Croatian Programming Contest. A table lists nine problems labelled A to I (Arhimed to Zvonimir) with Baekjoon problem numbers 14101 to 14109, and for each the number of users who solved it, the number of submissions and the acceptance ratio. At the time of this copy only problems D and H had been submitted to: D with 2 submissions, 2 accepted, and H with 2 submissions, 1 accepted.

