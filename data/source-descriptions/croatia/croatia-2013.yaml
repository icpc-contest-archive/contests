  description: |-
    Problem set of the student contest held in Zagreb on 26 October 2013, a PDF of 12 pages in Croatian. The first page is a cover table of the nine problems A to I with their names (Arhimed, Formula, Haker, HNL, Ivo, Mnogokut, Sort, Umnozak, Zvonimir), input and output via standard streams, the time limit of each problem (0.5 to 2 seconds) and a memory limit of 128 MB.

    Each of the nine problems then has a statement with input format, output format and a sample section with sample input and output; some also have an explanation of the samples. Test data and solutions are not part of this PDF.
