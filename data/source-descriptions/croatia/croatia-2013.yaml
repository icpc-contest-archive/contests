  description: |-
    Registration page of the 2013 student team contest of Croatian universities, in Croatian. It announces the contest for Saturday 26 October 2013 from 10:00 to 15:00 at the Faculty of Electrical Engineering and Computing in Zagreb, with registration open until 24 October. A team has three students from the same university; the page lists the data to send for each member and says that if too many teams register, the organiser may give priority to those who competed internationally before. The contest is 9 problems in 5 hours in Pascal, C or C++ on Linux, and the three best teams earn the right to compete at CERC 2013 in Krakow. It names the problem-setting and organising committee.

    No list of teams is on this page; the team list is on the announcement page of the same site.
