  description: |-
    Registration page of the competition, in Croatian. It announces the competition for Sunday 25 October 2015, 10:00 to 15:00, and sets the registration deadline at Monday 12 October. A team has three students from the same university and each member's data must be sent in; the competition has 8 to 10 problems in 5 hours, in C/C++ or Java on Linux. If too many teams register, the organiser reserves the right to set criteria for taking part. The best teams earn the right to compete at CERC 2015 in Zagreb, 13 to 15 November 2015. The page also names the scientific committee, the implementation and evaluation committee and the organisers, and links to examples from earlier years. It lists no teams.
