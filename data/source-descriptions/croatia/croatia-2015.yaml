    Scoreboard of the competition, in Croatian: 22 teams ranked by problems solved and then by penalty time, with one column for each of the ten problems Bitovni, Kratki, Luhn, Lutrija, Parada, Piramida, R9K, Sjeckanje, Slika and Tablica. Each team row gives the team number with its three members' names and a team photo; a solved problem shows the time of the accepted solution with the number of earlier wrong submissions in brackets, and an unsolved one shows a dash or only the bracketed number of attempts. The last column gives problems solved and total penalty time. The page explains that 20 minutes are added for each wrong submission before the accepted one.

    Team 22 is marked with stars and ranked fourth; a footnote says it consisted of secondary-school students and competed unofficially. First place is Team 5 with nine problems.
