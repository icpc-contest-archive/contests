  description: |-
    Website of the student team competition held on Sunday 25 October 2015 at the universities of Zagreb, Osijek and Dubrovnik, in Croatian. The front page links to registration, an announcement, the problems, test data, solutions and results. Our copy holds five pages: the front page, the registration page, the announcement page, the problem-statement PDF (14 pages) and the results page. The announcement lists 21 competing teams, three students each, and gives the rules (eight to ten problems in five hours, C/C++ and Java on Linux). The registration page sets the deadline at 12 October and says the best teams earn a place at CERC 2015 in Zagreb.

    The solutions archive is in our copy; the test data archive is linked but was too large to be saved.
