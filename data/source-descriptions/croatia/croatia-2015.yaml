    Problem set of the competition, a PDF of 14 pages in Croatian. The first page is a table of the ten problems Bitovni, Kratki, Luhn, Lutrija, Parada, Piramida, R9K, Sjeckanje, Slika and Tablica with input and output (standard input and output), time limit and memory limit for each; the memory limit is 512 MB for every problem. Each problem then has its own statement with input format, output format and sample test data; Piramida, R9K and Sjeckanje each run onto a second page. The header gives the competition name and the date, 25 October 2015. Only the sample inputs and outputs are given; there are no full test data and no solutions in the PDF.
