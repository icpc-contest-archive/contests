  description: |-
    Small website of the 2007 competition of teams of computer science students of Croatian universities, held in Zagreb on 20 October 2007, in Croatian. Our copy holds four pages: a home page with links, an announcement, the results page and the problem statements PDF. The announcement gives the time (10:00 to 15:00 on Saturday), the venue at the Faculty of Science, Mathematics Department, the eight participating teams with their three members each, and the statement that the best teams earn the right to play at CERC in Prague on 9 to 12 November 2007. It names the Croatian Informatics Association (HSIN) programme and the Ministry of Science, Education and Sports as the framework.

    Three zip archives linked from the home page are also in our copy: the test data (263 files in nine problem folders), the solutions (ten C++ programs and a PDF describing the algorithms) and a bundle holding the problems PDF with both of those.
