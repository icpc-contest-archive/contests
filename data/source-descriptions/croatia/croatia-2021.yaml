  description: |-
    Website of the 2021 contest of teams of computer science students of Croatian universities, in Croatian, held online on Sunday 12 December 2021 (10:00 to 15:00, as the application and announcement pages state), with teams from the universities of Zagreb, Osijek, Rijeka and Pula. Our copy holds 5 pages plus a script and an Excel file for the application: the front page, an application page (applications by 8 December, teams of three students from one university, 8 to 12 problems in 5 hours, Python, C/C++ and Java), an announcement page listing the 24 participating teams with their members, a results page and the problem statements as a PDF.

    The announcement says the best teams earn the right to play in CERC 2021 in Ljubljana. Teams 16 to 24, made up of primary and secondary school pupils, take part outside the official competition. The test data archive linked from the front page is not in our copy.
