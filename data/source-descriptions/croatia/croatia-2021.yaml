    Scoreboard of 24 teams and ten problems, A to J, in Croatian. Each row gives place, team number with the city or school type in brackets, the surnames of the members, then for each problem a number or a dash, and a last column UKUPNO (total) holding a count followed by a second figure; the page gives no legend for these numbers.

    The first-placed team is Tim 9 from Zagreb. A note below the table says that teams 16 to 24, made up of primary and secondary school pupils, took part outside the official competition; their rows carry the bracket label SŠ or OŠ. The last four rows, all teams from Pula, show a dash for every problem and 0 in the total column.
