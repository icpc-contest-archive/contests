    Category page of the Baekjoon Online Judge for the first round of the Croatian Programming Contest 2014, in Korean. It lists the nine problems with the judge's problem number, label A to I and title (Bitstock, Četverokut, Dvaput, Hyperloop, Lijepi Putevi, Parket, Prosjek, RAM, Šetnja), and for each the number of users who solved it, submissions and accepted ratio. The page places the category under ACM-ICPC, Regionals, Europe, Central European Regional Contest and The Croatian Programming Contest. It holds the list only; the titles link to the judge's own problem pages, which are not in our copy.
