  contest_date: '2014-10-19'
  description: |-
    Website of the student team competition held at the Faculty of Electrical Engineering and Computing (FER), University of Zagreb, in two rounds on 19 and 26 October 2014, in Croatian. The front page links to registration, an announcement, instructions for contestants, and for each round the problem statements, test data, solutions and results, plus a combined result page. Our copy holds nine pages: the front page, the registration page, the announcement page, the instructions PDF (2 pages), the two problem-statement PDFs, the two round results pages and the combined results page.

    The announcement lists 17 competing teams with each member's faculty (FER, PMF-MO, PMF-FO or FBF), the rules (eight to ten problems in five hours, Pascal, C and C++ on Linux) and the organising committees. The registration page states that the three best teams earn a place at CERC 2014 in Krakow. The solutions archive of each round is in our copy; the two test data archives are linked but were too large to be saved.
