  description: |-
    Registration page of the competition, in Croatian. It announces the two rounds at the Faculty of Electrical Engineering and Computing in Zagreb on Sunday 19 and 26 October 2014, 10:00 to 15:00, and sets the registration deadline at 9 October. A team has three students from the same university and each member's data must be sent in; each round has 8 to 10 problems in 5 hours, in Pascal, C or C++ on Linux. An online preliminary round on 12 October is announced for the case that too many teams register. The three best teams win the right to compete at CERC 2014 in Krakow, Poland, 14 to 16 November 2014. The page also names the scientific committee, the implementation and evaluation committee and the organisers, and links to examples from earlier years. It lists no teams.
