  contest_date: '2018-10-28'
  description: |-
    Website of the 2018 contest of student teams from Croatian universities, in Croatian, held on Sunday 28 October 2018 at Zagreb, Osijek, Rijeka and Pula. The front page links to six items: registration, an announcement, the problems, the test data, the solutions and the results.

    Our copy holds 5 pages: the front page, a registration page with the call for teams (three students from one university per team, deadline 25 October, 5 hours, Python, C/C++ and Java, printed reference material of up to 25 A4 pages allowed), an announcement page that lists 41 teams, 37 of them with their city and four marked SS, the results page with a scoreboard, and the problem set as a PDF of 11 pages. The solutions link leads to a zip file of 11 files, in our copy: one source file for each of the ten problems and a PDF titled 'Opisi algoritama' (descriptions of algorithms). The test data link leads to a zip file that is not in our copy. The site's style sheet and script are in our copy; the pages hold no team photos, and the logo image they show is not in our copy.
