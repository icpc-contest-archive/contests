  description: |-
    Scoreboard on the contest website, in Croatian: 40 teams with rank, team number and city (or the label SS 1 to SS 4), the three members, number of problems solved, a penalty figure, and ten problem columns labelled A to J. A solved problem shows a number and, in brackets, the solve time; an unsolved problem shows a number alone, or a dash. Teams are ranked by solved count and then by penalty, and the last two teams share rank 39. A note above the table explains the penalty rule of 20 minutes for each incorrect submission before the correct one.

    Four teams of secondary-school students, labelled SS 1 to SS 4, competed unofficially, as a note under the table states; they appear in the table among the others and the team in second place is one of them. Team 8 from Zagreb is first with 8 problems solved. The announcement page lists 41 teams; team 32 from Rijeka is not in the table.
