  language:
  - hr
  contest_date: '2018-10-28'
  description: |-
    Registration page of the contest, in Croatian: a call for teams of three students from the same university, to be sent in by Thursday 25 October with each member's name, phone, e-mail, year of birth, year of enrolment and study programme. It states that the contest runs on Sunday 28 October 2018 from 10:00 to 15:00, with 8 to 10 problems in 5 hours, in Python, C/C++ or Java on Linux, that printed reference material of at most 25 A4 pages is allowed, and that the organiser may set entry criteria if there are too many teams.

    The page says the best teams earn the right to play at CERC 2018 in Prague on 30 November to 3 December 2018, and names the scientific committee and the organisers. It gives no list of teams.
