    Final standings of the 2021 ICPC Uzbekistan Regional Contest: 53 teams with rank, team name, institution, number solved and total time, plus Medal, Citation and Site citation columns. The Medal column holds First Award for 2 teams, Second Award for 4 and Third Award for 4; the other 43 teams have none. Citations are ordinal places for 26 teams and Honorable Mention for 27. The Site citation column is filled for two teams, Uzbekistan Champion (rank 1) and Tajikistan Champion (rank 3). There are no per-problem results.
