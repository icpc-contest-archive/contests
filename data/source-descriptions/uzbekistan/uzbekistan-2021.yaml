  description: |-
    Website of the Northern Eurasia Contests archive (NERC), seeded at its Uzbekistan subregion page. It is a series site, not a site of the Uzbekistan contest alone. Our copy holds 150 saved files, 78 distinct addresses once the http, https and port-80 copies are merged: year pages for 1996 to 2017, 2021 and 2022, final standings of the 2021 and 2022 finals, standings pages of other subregions, and 14 PDFs (statements and tutorials of the 2021 and 2022 finals and of the northern regional contests, and one 2025 Uzbekistan tutorial).

    For this edition it holds the standings page titled Uzbekistan Regionals 2021, a scoreboard of problems A to O. The site also has an Uzbekistan standings page for each archive year from 2003 to 2022, so other editions are inside, and a six-page English tutorial of the 2025 Uzbekistan Regional Contest. The 2021 year page lists regional resources for other subregions and none for Uzbekistan; one copy of it says no information is available for Uzbekistan.

    The site is mostly in English; the 2021 year page also has Russian link texts.
