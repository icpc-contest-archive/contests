  description: |-
    Final scoreboard of the Uzbekistan Regionals 2021: 66 rows with rank, team name and members, one column for each of the fifteen problems A to O, the number solved and the penalty time. Each problem cell gives the minutes of the accepted run and the number of rejected runs before it, or only rejected runs for an unsolved problem. The header shows 5:00:00 of 5:00:00 and status over. A Qual column is in the header and empty in every row.

    Twelve rows have a name starting with an asterisk, among them the second and fourth places; the page does not explain the asterisk. Only seven of the fifteen problems (A, D, E, F, G, H and N) were solved by any team. Below the rows are summary rows per problem: total runs, accepted, rejected, first accept and last accept. First place is MSU Tashkent #1 with seven problems solved.
