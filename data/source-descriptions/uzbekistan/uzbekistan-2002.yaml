  description: |-
    Pages of the Northern Eurasia Contests website (NEERC archive), in English, taken from a crawl that starts at its 2002 page and reaches other years. Our copy holds 150 files, 149 of them pages; 20 are addresses under the 2002 archive, 46 under 2003, and the rest are the archive index and single year pages from 1996 to 2025. The Uzbekistan contest is the Middle Asia Subregion page of ACM ICPC 2002-2003, NEERC: it names Tashkent University of Information Technologies as host and Uzbekistan as the country, and gives the final standings of 33 teams, with a plus or minus attempt mark for each of nine problems A to I, number solved, time and rank. Ten teams have solved problems; the other 23 share rank 11 with none solved. The page gives no date for the contest.

    Besides it the 2002 pages hold the NEERC final (standings, an index of problems with four problem statements, an archive of tests and a history archive) and the Central, Eastern, Northern and Southern regional pages of the same year, which belong to other contests.
