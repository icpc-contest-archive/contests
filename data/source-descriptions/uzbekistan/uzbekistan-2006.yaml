  description: |-
    Pages of the Northern Eurasia Contests site, in English, built around its NEERC 2006 archive page. That page lists the year's own resources (final standings, problems in PDF, tests and jury solutions) and then the regional contests of the series, each with a link to its standings. Uzbekistan has a standings link only; Azerbaijan is marked as having no information. It is the series-level site for all regional contests, not a site of the Uzbekistan contest alone.

    Our copy holds 150 saved files that make up 57 distinct addresses, several of them stored more than once (http, https, port 80). They include the archive pages of 2006 and 2007, the NEERC final standings of both years, standings of many regional contests of both years (Northern, Southern, Moscow, Ural and others), PDF problem sets of the 2006 final, the 2006 Northern subregional, and the 2007 final, Light and Northern contests, and the Uzbekistan standings pages of every edition from 2003 to 2022. Nothing in it is specific to the Uzbekistan contest except its standings: no announcement, rules, team list or problem statements are linked for 2006.
