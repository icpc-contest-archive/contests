  description: |-
    Archive pages of the Northern Eurasia Contests (NEERC) site, in English: a list of years from 1996 to 2020 and, for each year, the final contest, the regional contests and the files published for them (standings, problem statements in PDF, tests, jury archives, analysis, runs). Our copy holds 150 saved files, most of them the same page saved under http, https and port-80 addresses, so that they come from 64 different addresses, 8 of which are PDFs.

    The pages that belong to this contest are the Uzbekistan subregional standings of the 2014-2015 season, a final scoreboard of 67 teams for problems A to K. The rest is the 2014 and 2015 archive pages, the NEERC 2014 and 2015 final standings, statements and review PDFs, the Northern Subregional 2014 and 2015 statements and analysis PDFs, standings of the other regional contests of both seasons, and one Uzbekistan standings page for each of the years 2003 to 2022 other than 2014 and 2015. The pages of the other years are of other editions.

    The Uzbekistan 2014 problem statements are not a separate file in our copy; the 2014 archive page links to the Northern Subregional statements.
