  description: |-
    Pages of the Northern Eurasia Contests site, in English, built around its NEERC 2008 archive page. That page lists the year's own resources (final standings, problems in PDF and PostScript, statement sources in TeX, tests and jury solutions) and then the regional contests of the series, each with a link to its standings. Uzbekistan has a standings link only. It is the series-level site for all regional contests, not a site of the Uzbekistan contest alone.

    Our copy holds 150 saved files that make up 58 distinct addresses, several of them stored more than once (http, https, port 80). They include the archive pages of 2008 and 2009, the NEERC final standings of both years, standings of many regional contests of both years (Northern, Southern, Moscow, Ural and others), PDF problem sets of the 2008 and 2009 finals and of the 2009 Northern subregional, an analysis presentation of 2009, and the Uzbekistan standings pages of the editions from 2003 to 2022. Nothing in it is specific to the Uzbekistan contest except its standings.
