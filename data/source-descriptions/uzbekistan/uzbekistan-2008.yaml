    Problem set as a PostScript document of 13 pages, in English, headed ACM ICPC 2008-2009, NEERC, Northern Subregional Contest, St Petersburg, November 1, 2008. It holds 11 problems A to K (Access Control Lists, Billboard, Class, Deposits, Enchanted Mirror, Fenwick Tree, Ground Works, Holes, Important Wires, Just Too Lucky, Key to Success). Each has a statement with input and output file names, a time limit of 3 seconds, a memory limit of 256 megabytes, input and output format and an example. No test data or solutions.

