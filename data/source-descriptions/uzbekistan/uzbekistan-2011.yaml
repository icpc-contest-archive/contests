  description: |-
    Pages of the Northern Eurasia Contests (NEERC) archive website, in English. Its menu links one page per year from 1996 to 2020; the 2011 page lists the finals and each regional contest, with a link to final standings for each of them, including Uzbekistan. It also links problem statements, official tests, jury solutions and an analysis presentation for the finals, and problem statements, tests, a jury archive, runs and a log for the Northwestern Russia contest.

    Our copy holds 150 saved files, which are 62 distinct addresses once the http, https and port-80 copies of the same page are merged. They are the archive pages for 2011 and 2012, final and regional standings for 2011 and 2012 (the 2011 set includes the Uzbekistan standings), Uzbekistan standings for every year from 2003 to 2022, problem statement PDFs for the 2011 finals and Northern Subregional contest and for the 2012 finals, Central and Northern Subregional contests, a 2011 analysis and a 2012 review as PDFs, and one XML standings file. It holds no style sheets or images.
