    Final standings of the Uzbekistan Subregional Contest, ACM ICPC 2011-2012, NEERC, as a scoreboard with 55 teams and 11 problems A to K. Each row gives rank, team name, the outcome of each problem with the number of rejected tries and the time of acceptance, the number solved and the total time. The status line reads 5:00:00 of 5:00:00, status over. Rows at the foot give total runs, accepted, rejected, first accept and last accept per problem.

    RSU Tashkent OG 1 is first with 6 problems solved. Problems E, G, H, I and K have no accepted run. One team solved nothing. Each team cell holds the team name, which often includes the institution, followed by the members' surnames in brackets; there is no separate institution or country column.
