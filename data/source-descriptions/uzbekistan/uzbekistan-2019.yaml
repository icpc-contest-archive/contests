  description: |-
    Website of the Northern Eurasia Contests archive (NERC), seeded at its Uzbekistan subregion page. It is a series site, not a site of the Uzbekistan contest alone. Our copy holds 150 saved files, 65 distinct addresses once the http, https and port-80 copies are merged: year pages for 2019 and 2020 listing the resources of the finals and of the regional contests, final standings of the 2019 and 2020 finals, standings pages of other subregions, and 15 PDFs (statements and tutorials of the 2019 and 2020 finals and of the northern regional contests, and the 2025 Uzbekistan tutorial).

    For this edition it holds the standings page titled Uzbekistan Regional Contest 2019, a scoreboard of problems A to M. The site also has an Uzbekistan standings page for each archive year from 2003 to 2022, so other editions are inside, and a six-page English tutorial of the 2025 Uzbekistan Regional Contest. The 2019 year page itself says no information is available for Uzbekistan.

    The site is in English.
