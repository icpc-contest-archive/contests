    Final scoreboard of the Uzbekistan Regional Contest 2019: 74 teams with rank, institution, team name and member names, one column for each of the thirteen problems A to M, the number solved and the penalty time. Each problem cell gives the minutes of the accepted run and the number of rejected runs before it, or only rejected runs for an unsolved problem. The header shows 5:00:00 of 5:00:00 and status over.

    Below the teams are summary rows per problem: total runs, accepted, rejected, first accept and last accept. Problem M has no runs. The team in first place is MSU Tashkent 1 Awesome Team of Moscow SU - Tashkent with twelve problems solved. One team, at rank 56, has an asterisk before its name; the page does not explain it.
