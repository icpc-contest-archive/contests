  description: |-
    Pages of the Northern Eurasia Contests site, in English, built around its NEERC 2007 archive page. That page lists the year's own resources (final standings, problems in PDF, tests and jury solutions, runs, a download for watching the contest in progress) and then the regional contests of the series. Uzbekistan has three entries: standings, problem statements in PDF and tests with jury solutions. It is the series-level site for all regional contests, not a site of the Uzbekistan contest alone.

    Our copy holds 150 saved files that make up 57 distinct addresses, several of them stored more than once (http, https, port 80). They include the archive pages of 2007 and 2008, the NEERC final standings of both years, standings of many regional contests of both years (Northern, Southern, Moscow, Ural and others), the PDF problem sets of the 2007 final, Light and Northern contests and of the 2008 final, and the Uzbekistan standings pages of the editions from 2003 to 2022. The archive of tests and jury solutions linked for Uzbekistan is not in our copy.
