    Scoreboard of the main round of the Uzbekistan and Tajikistan Regional 2020 on Yandex Contest, in Russian: first page of three, ranks 1 to 50. Each row gives rank, participant, problems A to M, points and penalty. Each problem heading carries two counts, for example 94 / 126. A solved cell gives the time of the accepted run and the number of rejected runs before it; an unsolved cell with attempts gives the number of rejected runs and a time; an untried cell shows a dash. Of the 50 rows, 18 have a name starting with an asterisk followed by a personal name instead of a team name; the page does not explain the asterisk. The page also shows the last accepted and last submitted run, and links to the practice round and the school round. Our copy holds this first page only; pages 2 and 3 are linked but are not in it.
