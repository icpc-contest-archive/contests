  description: |-
    Final scoreboard of the Uzbekistan and Tajikistan Regional 2020: 70 rows with rank, institution, team name and member names, one column for each of the thirteen problems A to M, the number solved and the penalty time. Each problem cell gives the minutes of the accepted run and the number of rejected runs before it, or only rejected runs for an unsolved problem. The header shows 5:00:00 of 5:00:00 and status over. A Qual column is in the header and is empty in every row.

    Nine rows have a name starting with an asterisk, among them three placeholder names of the form uz2020regional followed by a number; the page does not explain the asterisk. Below the rows are summary rows per problem: total runs, accepted, rejected, first accept and last accept. First place is MathX of Tashkent University of Information Technologies with eleven problems solved.
