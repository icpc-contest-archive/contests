  description: |-
    Website of the Northern Eurasia Contests archive (NERC), seeded at its Uzbekistan subregion page. It is a series site, not a site of the Uzbekistan contest alone. Our copy holds 150 saved files, 78 distinct addresses once the http, https and port-80 copies are merged: year pages for 1996 to 2015, 2020 and 2021, final standings of the 2020 and 2021 finals, standings pages of other subregions, and 15 PDFs (statements and tutorials of the 2020 and 2021 finals and of the northern regional contests, and one 2025 Uzbekistan tutorial).

    For this edition it holds the standings page titled Uzbekistan and Tajikistan Regional 2020, a scoreboard of problems A to M. The site also has an Uzbekistan standings page for each archive year from 2003 to 2022, so other editions are inside, and a six-page English tutorial of the 2025 Uzbekistan Regional Contest. The 2020 year page does not mention Uzbekistan.

    The site is in English.
