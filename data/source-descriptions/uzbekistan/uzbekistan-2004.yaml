  description: |-
    Pages of the Northern Eurasia Contests website (NEERC archive), in English, taken from a crawl that starts at the Uzbekistan subregion entry and reaches the archives of 2004 and other years. Our copy holds 150 files: 60 addresses of 2004, 59 of 2005, and one to two for each other year from 2003 to 2022.

    The 2004 archive page describes the NEERC final with links to its standings, problems in PDF, a jury archive, a history file, all runs and picture galleries, and lists the regional contests of that year: Northwestern Russia, Southern and Volga Russia, Ural, Central Russia, Belarus and Baltics, Moscow, West Siberian, East Siberian, Far Eastern Russia, Uzbekistan, Kazakhstan, Armenia, Georgia and Kyrgyzstan, each with a link to its final standings. The Uzbekistan standings page of 2004 is in our copy, with the standings pages of the other regional contests and the Uzbekistan standings pages of later years. Among the regionals of 2004, only Northwestern Russia is listed with problem statements, tests and jury solutions.
