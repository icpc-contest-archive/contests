  description: |-
    Archive pages of the Northern Eurasia Contests (NEERC) site, in English: a list of years and, for each year, the final contest, the regional contests and the files published for them (standings, problem statements in PDF, tests, jury archives, analysis, runs). Our copy holds 150 saved files, most of them the same page saved under http, https and port-80 addresses, so that they come from 60 different addresses, 11 of which are PDFs.

    The page that belongs to this contest is the Uzbekistan subregional standings headed Uzbekistan Subregional 2017, a final scoreboard for problems A to L. The rest is mostly the 2017 and 2018 archive pages with the standings of the other regional contests of those two years, the NEERC 2017 and 2018 PDFs (statements, analysis, review), the Northern Subregional 2017 and 2018 statements and analysis PDFs, a Kazakhstan 2017 statement PDF, and one Uzbekistan standings page for each of the other years from 2003 to 2022. The pages of the other years are of other editions.
