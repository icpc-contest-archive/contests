  description: |-
    Pages of the Northern Eurasia Contests (NEERC) archive website, in English. Its menu links one page per year from 1996 to 2020; the 2013 page lists the finals and each regional contest, with a link to final standings for the regional contests, including Uzbekistan. The finals entry links standings, problems and official tests with generators and jury solutions; the Northwestern Russia entry links problem statements, tests, a jury archive, a statements-source archive and a run log in XML.

    Our copy holds 150 saved files, which are 63 distinct addresses once the http, https and port-80 copies of the same page are merged. They are the archive pages for 2013 and 2014, final and regional standings for 2013 and 2014 (the 2013 set includes the Uzbekistan standings), Uzbekistan standings for every year from 2003 to 2022, problem statement and review PDFs for the 2013 and 2014 finals, Northern Subregional statements for 2013 and 2014 with a 2014 Northern analysis, and one XML standings file for the 2013 Northern Subregional contest. It holds no style sheets or images.
