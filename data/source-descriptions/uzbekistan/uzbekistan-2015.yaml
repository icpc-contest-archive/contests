  description: |-
    Archive pages of the Northern Eurasia Contests (NEERC) site, in English: a list of years from 1996 to 2020 and, for each year, the final contest, the regional contests and the files published for them (standings, problem statements in PDF, tests, jury archives, analysis, runs). Our copy holds 150 saved files, most of them the same page saved under http, https and port-80 addresses, so that they come from 64 different addresses, 8 of which are PDFs.

    The page that belongs to this contest is the Uzbekistan subregional standings of the 2015-2016 season, a final scoreboard of 68 teams for problems A to L. The rest is mostly the 2015 and 2016 archive pages with the standings of the other regional contests of those two seasons, the NEERC 2015 and 2016 PDFs, the Northern Subregional 2015 statements and analysis PDFs, and one Uzbekistan standings page for each of the other years from 2003 to 2022. The pages of the other years are of other editions.
