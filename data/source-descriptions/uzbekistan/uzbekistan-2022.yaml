  pages: 150
  description: |-
    Crawl of the Northern Eurasia Contests (NERC) archive site, in English with some Russian. It is the site of the Northern Eurasia finals and its regional contests, not a site of the Uzbekistan contest alone. The 2022 archive page lists the Uzbekistan regional contest among Armenia, Azerbaijan, Georgia, Kazakhstan, Northwestern Russia, Taurida and Ural, each with a link to its final standings; the Uzbekistan link leads to the scoreboard of this edition.

    Our copy holds 150 files, 120 HTML pages and 30 PDFs; many pages were saved twice, under their http and https addresses, so the files have 99 different contents. Besides the 2022 and 2023 archive pages it has standings of the other regional contests of those two seasons, statements and tutorials of the Northwestern Russia contest and of the finals, and Uzbekistan standings pages for every year from 2003 to 2022 and a 2025 tutorial PDF. The pages of the finals list standings, problems, analysis, jury archive and runs as links.

    Some archive pages of other years were not fetched; the 2023 brochure PDF is cut off at 1 MiB and cannot be opened; and the Polygon packages and run files linked from the archive pages are not in our copy.
