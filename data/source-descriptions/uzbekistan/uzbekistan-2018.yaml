    Final standings of the 2018 Uzbekistan Subregional Contest: 132 teams with rank, team name, institution, number solved and total time, plus Medal and Citation columns. The Medal column is filled for two teams only, Champion of Uzbekistan (rank 1) and Champion of Tajikistan (rank 8). Citations are First Award (7 teams), Second Award (11), Third Award (18) and Honorable Mention (66); the other 30 teams carry a citation naming their place, from Thirty-seventh to Sixty-sixth. Rank 127 is shared by the six teams with no solved problem. There are no per-problem results.
