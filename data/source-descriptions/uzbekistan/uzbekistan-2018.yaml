  description: |-
    Final scoreboard of the Uzbekistan Subregional 2018: 132 teams with rank, team name and, for all but one team, the member names, one column for each of the twelve problems A to L, the number solved and the penalty time. Each problem cell gives the minutes of the accepted run and the number of rejected runs before it, or only rejected runs for an unsolved problem. The header shows 5:00:00 of 5:00:00 and status over.

    Below the teams are summary rows per problem: total runs, accepted, rejected, first accept and last accept. A Qual column is present and empty for every team. The team in first place is TUIT Urgench Branch #1 with nine problems solved. One team name contains the word Reserved; no team is marked as unofficial.
