  title: Northern Eurasia Contests
  language:
  - en
  description: |-
    Website of the Northern Eurasia Contests archive (NERC), seeded at its Uzbekistan subregion page. It is a series site, not a site of the Uzbekistan contest alone. Our copy holds 150 saved files, 62 distinct addresses once the http, https and port-80 copies are merged: year pages for 2018 and 2019 listing the resources of the finals and of each regional contest, final standings for the finals of those years, standings pages of many other subregions, and PDFs of the 2018 and 2019 finals (statements, analysis, review slides, tutorial) and of the northern regional contests.

    For this edition it holds the standings page titled Uzbekistan Subregional 2018, a scoreboard of problems A to L. The site also has an Uzbekistan standings page for each archive year from 2003 to 2022, so other editions are inside. The 2018 year page itself says no information is available for Uzbekistan.

    The site is in English. The jury archive of the 2018 finals (a ZIP file) is not in our copy; the ZIP of runs of the 2018 finals is.
