  description: |-
    Final scoreboard of the Uzbekistan and Tajikistan Subregional 2018: 141 team rows with place, team name and members, problems A to L, total solved, time, and two further columns headed Dirt and SE. Each problem cell gives the time of the accepted run and the number of rejected runs; each problem heading carries two counts, for example 131/231. Places run to 136-141 for the teams with no solved problem. The top three are TUIT Urgench Branch #1, TUIT: ALVA and MSU Tashkent 1.

    The text above the table says that teams solving seven or more problems are invited to the Regionals in Almaty (blue list), that the best team of each university solving five or more is invited as well (red list), that teams in green are on a waiting list, and that no more than four teams from one university may go. Six of the rows have names containing Reserved; they are not marked apart from their names. The footer gives submits sent, accepted and dirt per problem.
