  description: |-
    Pages of the Northern Eurasia Contests (NEERC) archive website, in English. Its menu links one page per year from 1996 to 2020; the 2010 page lists the finals and each regional contest, with links to final standings for most of them, including Uzbekistan. The Northwestern Russia entry also links problem statements, official tests, a jury archive, runs and analyses (in Russian), and two regions, Kyrgyzstan and Azerbaijan, are marked "No information is available".

    Our copy holds 150 saved pages, which are 60 distinct pages once the http, https and port-80 addresses of the same page are merged. They are the 2010 and 2011 archive pages, final and regional standings for 2010 and 2011, the 2010 Northern Subregional problem statements with a Russian-language analysis and presentation, the 2010 finals problems and problem review, a few 2011 PDFs, and Uzbekistan standings pages for every year from 2003 to 2022, among them the 2010 Uzbekistan standings. It holds no style sheets or images.
