  description: |-
    Archive pages of the Northern Eurasia Contests (NEERC) site, in English: a list of years and, for each year, the final contest, the regional contests and the files published for them (standings, problem statements in PDF, tests, jury archives, analysis, runs). Our copy holds 150 saved files, most of them the same page saved under http, https and port-80 addresses, so that they come from 62 different addresses, 10 of which are PDFs.

    The page that belongs to this contest is the Uzbekistan subregional standings of the 2016 archive year, a final scoreboard for problems A to J. The rest is mostly the 2016 and 2017 archive pages with the standings of the other regional contests of those two years, the NEERC 2016 and 2017 PDFs, the Northern Subregional 2016 and 2017 statements and analysis PDFs, a Kazakhstan 2017 statement PDF, and one Uzbekistan standings page for each of the other years from 2003 to 2018. The pages of the other years are of other editions.
