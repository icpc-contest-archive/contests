    Problem set in a PDF of 14 pages, in English, headed ACM ICPC 2009-2010, NEERC, Northern Subregional Contest, St Petersburg, October 17, 2009. It holds 11 problems A to K (Auxiliary Question of the Universe, Bureaucracy, Circles on a Screen, Dragon's Question, Enigmatic Device, Four Points, Grand Theft Auto Wheel, Homo or Hetero?, Image Recognition, Jealous Numbers, Kripke Model). Each has a statement with input and output file names, a time limit of 3 seconds, a memory limit of 256 megabytes, input and output format and an example. No test data or solutions.

