    Final scoreboard of the Uzbekistan subregional of NEERC 2009-2010 (the page reads 5:00:00 of 5:00:00, status over): 60 teams, ranked, against 11 problems A to K, with the number solved and the penalty time per team. Each team name is followed by its members in parentheses. A cell shows a minus sign and a count for rejected runs on an unsolved problem, a plus sign (with a count of rejected runs when there were any) for a solved one, or a dot when the team made no run; the solving minute is shown by default and a Show time box hides it. The first team to solve each solved problem is marked. MSU Tashkent 1 is first with 8 problems solved, the 29 teams with none share rank 32, and eight of the eleven problems were solved by at least one team. Footer rows give total, accepted and rejected runs per problem and the minutes of the first and last accepted run.
