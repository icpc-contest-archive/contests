  copy: uzbekistan/uzbekistan-2005/scoreboard/20260904-live-b7d5880f/standings.html
  title: ACM ICPC 2005-2006, NEERC, Uzbekistan Subregional Contest
  language:
  - en
  teams: 90
  problems: 11
  times: true
  tries: true
  description: |-
    Final standings of the Uzbekistan Subregional Contest of ACM ICPC 2005-2006, NEERC, in English: 90 teams, each with rank, team name given as institution and team, an attempt mark for each of the 11 problems A to K (with a time after the plus sign for accepted problems), number solved and time. The header reads 5:00:00 of 5:00:00 with status over, and a Show time checkbox, ticked in our copy, hides or shows the solve times. Twenty-three teams solved at least one problem, and the team TUIT7 of the Tashkent University of Information Technologies is first with two solved and a time of 125. The other 67 teams solved none and share rank 24.

    Five summary rows at the end give total, accepted and rejected runs per problem, and the first and last accepted run. Only problems C (23 accepted runs) and F (4) were solved by any team.
