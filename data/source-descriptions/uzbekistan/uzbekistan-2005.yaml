  description: |-
    Pages of the Northern Eurasia Contests website (NEERC archive), in English, taken from a crawl that starts at the Uzbekistan subregion entry and reaches the archives of 2005 and other years. Our copy holds 150 files: 59 addresses of 2005, 55 of 2006, and two for each other year from 2003 to 2022.

    The 2005 archive page describes the NEERC final with links to its standings, problems in PDF and PostScript, tests and jury solutions and a history file, and lists the regional contests of that year: Northwestern Russia, Southern and Volga Russia, Ural, Central Russia, Belarus and Baltics, Moscow, West Siberian, East Siberian, Far Eastern Russia, Uzbekistan, Kazakhstan, Armenia, Georgia, Kyrgyzstan and Azerbaijan, each with a link to its final standings. Only Northwestern Russia also has statements, tests and jury solutions. The Uzbekistan standings page of 2005 is in our copy, with the standings pages of the other regional contests and the Uzbekistan standings pages of other years.
