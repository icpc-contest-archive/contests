  description: |-
    Pages of the Northern Eurasia Contests website (NEERC archive), in English, taken from a crawl that starts at the Uzbekistan subregion entry and reaches the archive of 2003 and later years. Our copy holds 150 files: 46 addresses of 2003, 60 of 2004, and two or three for each year from 2005 to 2022.

    The 2003 archive page describes the NEERC final with links to its standings, problems in PostScript and PDF, a jury archive and a picture gallery, and lists the regional contests of that year: Northwestern Russia, Southern and Volga Russia, Ural, Central Russia, Belarus and Baltics, Moscow, West Siberian, East Siberian, Far Eastern Russia, Uzbekistan and Kazakhstan, each with a link to its final standings. The Uzbekistan entry links only to its standings. That standings page is in our copy, as are the standings pages of the other regional contests of 2003 and the Uzbekistan standings pages of later years.
