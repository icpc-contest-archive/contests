  description: |-
    Contest page of the 2013 ACM-ICPC North American Qualification Contest, an online contest held on October 5, 2013, 2:00-7:00 PM Central Time on Kattis, in English. It reports that 597 teams submitted something and 581 solved at least one problem, with 7169 submissions in the five hours, and gives three small tables: teams by number of problems solved (1 to 11), submissions per problem, and accepted submissions per problem. It lists the twelve registration sites (the eleven North American regions plus one site for ICPC-ineligible contestants), a question-and-answer section on registration and use of the results, the scoring rules (20 penalty minutes for most kinds of rejected submission), thanks to problem writers, reviewers and the hosts of the contest system, and a note for problem-writers. There is no team-by-team scoreboard.

    Our copy holds three pages: the contest page, the problem statements PDF (14 pages, 11 problems) and a 10-page problem creation guide PDF. Two zip files are also saved: the judge's test data and a problem package skeleton. The registration links lead to the ICPC registration system and are not part of our copy.
