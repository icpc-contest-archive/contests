  contest_date: '2014-09-27'
  problems: 11
  description: |-
    Contest page of the 2014 ACM-ICPC North America Qualification Contest, an online contest held on September 27, 2014, 2:00-7:00 PM Central Time, in English. It states that 679 teams signed in, 636 solved something, and 6538 submissions were made in five hours. It gives two tables: the number of teams by number of problems solved (0 to 11), and for each of the 11 problems A to K solved over tries, average tries and average tries to solve. It lists the 11 problems with links to Open Kattis, thanks to problem writers, reviewers and judges, registration information, basic details and scoring rules (20 penalty minutes for most kinds of rejected submission), and a note for problem-writers. There is no team-by-team scoreboard.

    Our copy holds three pages: the contest page, the problem statements PDF (22 pages, 11 problems) and a 10-page problem creation guide PDF. It also holds two zip files and a style sheet. The links to Open Kattis lead outside our copy.
