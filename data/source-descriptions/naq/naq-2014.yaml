    Standings of the North America Qualifier, ICPC year 2015: 1023 teams with rank, team name, institution, number of problems solved, time and a citation. The first 248 rows carry a named place (First Place, Second Place, and so on, with tied teams sharing a rank, for example ten teams at rank 13); the other 775 teams are listed as Honorable Mention, with ranks from 249 down to 637, and 387 of them have 0 solved and share rank 637. First place is Umich 9 of the University of Michigan at Ann Arbor with 11 problems solved and a time of 812, followed by UW Taupe of the University of Waterloo and Berkserkers of the University of California, Berkeley. No per-problem detail.
