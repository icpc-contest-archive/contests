  description: |-
    Standings of the 2017 North America Qualifier: 686 teams, one row each, with rank, team name, institution, number of problems solved, time, medal, citation and site citation. Teams are in rank order with ties sharing a rank. The first twelve rows carry medals (four gold, four silver, four bronze); the rest are marked Ranked, and 417 of them carry the citation Honorable Mention. Twelve teams solved all 13 problems, with Columbia3 of Columbia University in first place. The site citation column names a site for 12 of the teams. There is no per-problem detail and no attempts column.
