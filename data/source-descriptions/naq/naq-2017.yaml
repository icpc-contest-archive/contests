    Kattis standings page of the ICPC North America Qualifier 2017, as saved with the affiliation filter set to Oklahoma Christian University, so it shows one team row: rank 1, solved 3, time 618, with cells for problems A to M (thirteen problem columns). Cells show the number of attempts and, for solved problems, the minute of the solve. The page also lists the affiliations available in the filter and states the contest ran from 18:00 to 23:00 CEST on 2017-10-07.

    The rows of all other teams are not in our copy.
