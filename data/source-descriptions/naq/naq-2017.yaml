  title: 2017 ACM-ICPC North America Qualifier Contest
  language:
  - en
  contest_date: '2017-10-07'
  problems: 13
  description: |-
    Contest page for the 2017 North America Qualifier, an online contest held on Kattis, kept on a Baylor University computer science web server; the page says it was last updated January 10, 2018. A wrap-up part links the problem set, the judges' explanation slides and the judges' test data, and points to the official standings and the open division standings on Kattis. Its statistics give 891 participating individuals, 728 teams submitting, 683 teams solving at least one problem and 7846 submissions, with a table of how many teams solved 1 to 13 problems, and a thank-you list of judges, reviewers and staff.

    A contest-week part covers what the Qualifier is, registration through 12 sites (links by region), basic details such as the date and hours, scoring, and instructions for problem writers with the Kattis problem format and problem tools.

    Our copy holds three distinct pages: this page, the problem set PDF and the judges' slides PDF. The test data archive, the problem skeleton and the problem tools package are linked but are not in our copy, and neither are the Kattis standings pages.
