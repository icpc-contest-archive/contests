    QOJ contest dashboard headed "The 2017 ICPC North America Qualifier", filed under ICPC / Regionals / North America. It lists 13 problems, A Birthday Cake to M Umbral Decoding, by letter and title. The page states the ICPC ruleset, a penalty of 20 minutes, a limit of 1000 submissions per problem and a scoreboard frozen after 4:00:00, and offers a virtual contest; the Notice and Questions sections are empty. Under Attachments it links "Statements (en)" and "Tutorials (en)"; those files are not part of our copy of the page.
