    Kattis standings page of the ICPC North America Qualifier 2015, marked Contest is over, with a scoreboard table of 6 teams: rank, team name, problems solved, total time, and for each problem A to K the number of tries with the minute of the accepted run, or tries with a dash for an unsolved problem. The six teams are Cornell Empire (4 solved, 256), Cornell Clones, Cornell Hope, Coe College, Cornell Menace and Cornell Jedi (2 solved, 567). The page also holds a filter list of institutions under Qualifiers. The table holds only these six teams; none solved more than four problems, while the contest page reports 27 teams that solved all 11.
