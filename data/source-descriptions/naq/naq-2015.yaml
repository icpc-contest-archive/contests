  language:
  - en
  contest_date: '2015-10-03'
  problems: 11
  description: |-
    Contest page of the 2015 ACM-ICPC North America Qualification Contest, in English, announcing the online contest on Kattis for October 3, 2015, 11:00 to 16:00 CDT, with login instructions. It reports registration and participation figures (1221 teams registered, 977 users on 702 teams signed in, 642 teams submitted something, 609 solved at least one problem) and 6733 submissions over five hours. It gives tables of teams by number of problems solved (0 to 11), per-problem solved over tries, average tries and average tries to solve for problems A to K, and the distribution of judging delay. It links the eleven problems on Open Kattis, thanks to problem writers, reviewers, judges and the registration and Kattis teams, and holds registration notes, basic details, scoring rules, and notes for problem-writers on the Kattis problem format and problem tools. There is no team-by-team scoreboard.

    Our copy holds two pages: the contest page and the problem set PDF (22 pages, 11 problems). It also holds two zip files, a Debian package of the problem tools, an image and a style sheet. The links to Open Kattis lead outside our copy.
