  description: |-
    Standings page of the ICPC North America Qualifier 2018 on Kattis, filtered to one affiliation, Augsburg University: 10 teams with rank, team name, problems solved (Slv.), total time, and one column for each of the 13 problems A to M. Solved problems show the number of attempts and the minute of the accepted run; unsolved attempts show the attempts with a dash. The top team of the filter solved two problems with 511 minutes; two teams solved one; the other seven solved none and share rank 4. The page says the contest is over and gives the start as 2018-10-06 18:00 CEST and the end as 23:00 CEST. A drop-down lists the other affiliations, but our copy holds only the Augsburg University view.
