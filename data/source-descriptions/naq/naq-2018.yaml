  description: |-
    Standings of the 2018 North America Qualifier: 1367 teams with rank, team name, institution, number of problems solved, total time, medal, citation and site citation. 669 teams have a rank, from 1 to 621 with ties; the other 698 solved nothing, have no rank and are marked Honorable in the medal column. The first place is Big Red Magician of Cornell University with 11 problems solved in 1006 minutes. The medal column has 4 gold, 4 silver and 4 bronze; the citation column gives a place for 342 teams and Honorable Mention for 327. There is no per-problem detail and there are no attempt counts.
