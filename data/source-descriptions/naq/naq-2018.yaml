- url: http://cs.baylor.edu/~hamerly/icpc/qualifier_2018/
  read: '2026-11-16'
  rubric: 1
  copy: naq/naq-2018/website/2026-09-04-live-daa4ce55
  title: 2018 ICPC North America Qualifier
  language:
  - en
  contest_date: '2018-10-06'
  description: |-
    Website of the 2018 ICPC North America Qualifier on the Baylor University computer science site, in English. It is a single long page with sections About, Results, Register, FAQ, Write Problems and Contact. The Results section links to the official and open division standings and the contest problems on Kattis, to the judges' solution slides, to the problem set PDF and to the judges' data (an 18 MB tar.xz). It states statistics for the official contest: 832 Kattis users submitted, 117 universities and 694 teams took part, 669 teams solved at least one problem, 6839 submissions in five hours, and a table of teams by number of problems solved (1 to 11). The contest is described as an online contest on Kattis on October 6, 2018, 11:00 to 16:00 CDT, run as one contest with 12 sites (11 regions plus a site for ineligible contestants), with contest-week instructions on Kattis accounts and passwords, and a table of links to the 12 sites.

    The rest of the page is for problem authors: a schedule for problem development, and notes on the Kattis problem format and problemtools.

    Our copy holds two pages: the page itself and the judges' solution slides (a PDF of 59 pages). The folder also holds the judges' data archive, a sample problem package, a Kattis problemtools installer package and the logo. The problem set PDF linked from the page is not among the files saved with the site, and the links to the Kattis contest pages lead to another server.
