    Kattis standings page of the ICPC North America Qualifier 2020, saved with the filter set to the affiliation Arcadia University, so it shows one team: AURed, with three problems solved and a total time of 230. It has columns for team, problems solved, time and problems A to H, each cell giving the number of attempts and the minute of the accepted run (problem H shows 8 attempts and no solve). The page also states that the contest is over, a start of 2021-02-12 02:00 CET and an end of 05:00 CET (3 hours), and that the first team to solve each of B, E, G and H gets a prize. The affiliation filter lists 105 universities.

    The teams of the other universities are not in our copy.
