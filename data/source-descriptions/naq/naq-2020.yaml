    Baekjoon Online Judge category page for the ICPC North America Qualifier 2020, in Korean. It places the category under ICPC Regionals, North America, "North America Qualification Contest". A table lists eight problems labelled A to H with the judge's problem number, title, a note on whether it has a special judge and multiple languages, and the counts of users who solved it, submissions and the acceptance ratio. Five titles are in English (Cantina of Babel, Drawing Circles, Perfect Path Patrol, Sky's the Limit, Using Digits) and three (C, D, F) are in Korean. The statements are on linked problem pages, which are not part of this copy.
