- url: https://www.icpc.org/icpc-north-america-qualifier
  read: '2026-11-16'
  rubric: 1
  copy: naq/naq-2020/website/2026-09-05-wayback-7f83eb7e
  title: 'ICPC North America Qualifier | ICPC Foundation Home (page heading: 2020-21 ICPC North America Qualifier)'
  language:
  - en
  contest_date: '2021-02-11'
  description: |-
    Page of the ICPC Foundation website for the 2020-21 ICPC North America Qualifier, in English. It describes the NAQ as an online pre-regional contest on Kattis, held on 11 February 2021, 8 to 11 pm ET, that does not itself qualify any team. It gives the registration rules (12 sites, 11 regions plus one for ineligible contestants; registration closed 8 February 2021), a FAQ, and a post-contest section: the contest was cut from five to three hours and had eight problems, four new (B, E, G, H) and four from earlier NAQs. The statistics given are 677 contestants, 382 teams, 89 universities and 3444 submissions, with a list of how many teams solved each number of problems from 1 to 8, the first solvers of the four new problems (prizes courtesy of Upsilon Pi Epsilon), and acknowledgments to judges and volunteers.

    The post-contest section links to the official and open standings and the problems on Kattis, a PDF of the four new problems, solution slides and judge data; none of those targets is in our copy.

    Our copy holds 149 files. Besides the qualifier page it has other pages of the same site (North America overview, practice contests, regional contests, division championships, world finals). It also holds 46 pages of an unrelated old website of a Vancouver college, the Royal Canadian Institute of Technology.
