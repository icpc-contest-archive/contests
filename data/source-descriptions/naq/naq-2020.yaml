  description: |-
    Solution outlines of the 2020 North American Qualifier, by The Judges, dated 11 February 2021: slides in a PDF of 18 pages. After a title page, a note says that only the original problems developed for this contest are discussed, as four of the problems come from earlier NAQ contests. The four problems covered are Using Digits, Perfect Path Patrol, Drawing Circles and Sky's the Limit. Each has slides with a summary of the problem, the time it was first solved and an outline of the solution (two solutions and a note for Sky's the Limit); the slides build up step by step, so several pages repeat the same heading. The problem author is named on each slide.
