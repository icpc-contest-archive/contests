  description: |-
    Solution outlines of the 2021 North American Qualifier, by The Judges, dated 22 January 2022: slides in a PDF of 43 pages, ordered by the time of the first correct solution. It covers 14 problems, from Eye of Sauron (first solved at 0:01) to Venn Intervals (first solved at 2:46). Most problems have a problem summary followed by solution notes, and every slide names the problem author. The single slide for Common Factors has a problem author but says the slides for the problem are not yet completed. The slides call the problem Alien Numbers, where the problem set pages call it Alien Integers.
