  title: 'NAQ 2021-22 | ICPC NA (page heading: ICPC North America Qualifier 22 January 2022)'
  language:
  - en
  contest_date: '2022-01-22'
  description: |-
    Website of ICPC North America (the NAQ pages of the North America site), in English. The page for this edition is headed "ICPC North America Qualifier 22 January 2022": the 2021 NAQ, delayed from the fall, held online on Kattis from 1 to 6 pm CT. It has the registration rules (12 sites, registration closed 19 January 2022), a FAQ, and post-contest results: 14 problems in the 5-hour format, 1339 contestants, 703 registered teams, 156 universities, 560 teams with at least one solve and 8,825 submissions, plus the number of teams that solved each problem A to N. Links to the official, Open and Sunday standings on Kattis, the problem set, judges' slides and judges' data lead outside our copy.

    The site is a series site, and our copy also holds the pages of the 2022-23 NAQ (4 February 2023, with problem set and outlines PDFs) and the 2023-24 NAQ (30 September 2023 and 27 January 2024), which is what the NAQ address shows. Most of the 66 pages are other ICPC North America pages: practice contests, sponsoring, regional contests of several regions, and some blog posts.
