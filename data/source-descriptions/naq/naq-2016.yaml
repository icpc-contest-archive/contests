  description: |-
    Problem set PDF of 24 pages with twelve problems A to L (A New Alphabet, Arcade!, Big Truck, Brackets, Dots and Boxes, Free Desserts, Inverse Factorial, Nine Packs, Primonimo, Quick Estimates, Robotopia, Unusual Darts), each starting on an odd page. Each problem has a statement in English with input and output format and one or more samples; some carry a photo. Every page has the header North America Qualifier 2016 and a footer with the problem letter and name and the page number; five pages are marked as intentionally left blank. There is no cover page, test data or solutions.
