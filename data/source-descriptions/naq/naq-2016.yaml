    Kattis page listing the twelve problems of the 2016 ICPC North American Qualifier Contest, A New Alphabet to Unusual Darts, in a table with fastest and shortest solution, number of authors, full solves, solve ratio, difficulty rating and available languages. The figures are those of the day the page was fetched, not of the contest. Each problem name links to its Kattis statement page.

    Our copy is this list only: the statements behind the links are not part of it.
