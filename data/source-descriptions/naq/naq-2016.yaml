  title: 2016 ACM-ICPC North America Qualification Contest
  language:
  - en
  contest_date: '2016-09-24'
  problems: 12
  description: |-
    Contest page for the 2016 North America Qualifier, an online contest held on Kattis, kept on a Baylor University computer science web server. It has a post-contest part and a pre-contest part. The post-contest part links the problem set, the final standings (on a Kattis site), the judges' explanations and the judges' test data, explains that some teams logged into the open division instead of the official contest and that their submissions were moved to the official contest afterwards, and gives statistics: 924 participants and 752 teams submitting, 714 teams solving at least one problem, 8462 submissions, and a table for problems A to L with solved/tries, average tries and average tries to solve. It also thanks the problem authors, reviewers and the Kattis team.

    The pre-contest part covers what the Qualifier is, the official contest and the open division, registration through 12 sites (the 11 regions of North America plus one for ineligible contestants), basic details such as the date and hours, scoring, and instructions for problem writers with the Kattis problem format and problem tools.

    Our copy holds three pages: this page, the problem set PDF and the explanations PDF. It also holds a style sheet, the test data archive (1012 entries), a Kattis problem skeleton zip and a Debian package of the Kattis problem tools. The links to the standings, the official contest and the open division lead to Kattis and are not in our copy.
