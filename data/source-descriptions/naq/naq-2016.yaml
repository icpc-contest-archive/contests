  description: |-
    Problem set of the North America Qualifier 2016: a PDF of 24 pages, in English, with twelve problems labelled A to L, from A New Alphabet to Unusual Darts. There is no cover page; the document starts with Problem A. Each problem has a statement with input and output format and at least one sample input and output. Nineteen pages are headed 'North America Qualifier 2016' and footed with the contest name and the problem; five pages (8, 14, 16, 20 and 22) read 'This page is intentionally left blank.' No test data or solutions.
