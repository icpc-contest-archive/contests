  title: 2016 ACM-ICPC North America Qualification Contest
  language:
  - en
  contest_date: '2016-09-24'
  description: |-
    Website of the 2016 ACM-ICPC North America Qualification Contest, an online contest on Kattis held on 24 September 2016, 11:00 to 16:00 CDT. The front page was last updated 25 September 2016 and has a post-contest part with links to the problem set, the final standings, the judges' explanations and the judges' test data, and a note on the open division versus the official contest. It gives statistics (924 participants, 752 teams submitting, 714 teams solving at least one problem, 8462 submissions) and a table per problem A to L of solved over tries, average tries and average tries to solve. Pre-contest parts cover registration (twelve sites), basic details and scoring, a call for problem writers and the Kattis problem format, and a thanks list of authors, reviewers and the Kattis team.

    Our copy holds seven files: the front page, its style sheet, the problem set PDF, the judges' explanations PDF, the test data archive (a tar.gz with folders for the twelve problems), a Kattis problem skeleton zip and a Kattis problemtools Debian package. The link to the standings and the links to Kattis pages lead to other servers and are not part of it.
- url: https://icpc.global/regionals/finder/North-America-Qualifier-2017/standings
  read: '2026-11-16'
  rubric: 1
  copy: naq/naq-2016/standings/api-20261113/standings.html
  title: The 2016 North America Qualifier — standings
  language:
  - en
  teams: 714
  description: |-
    Final standings of 714 teams, rendered from the public icpc.global API archive. Each row gives rank, team name, institution, problems solved, time, medal, citation and site citation. The first twelve places carry medals (four gold, four silver, four bronze); the other 702 teams have the medal entry Ranked, ties share a rank, and the last rank is 651. The citation column gives ordinal places for most teams and Honorable Mention for 476 teams, from rank 239 on. First place is Waterloo 19 from the University of Waterloo with 12 problems solved. There is no per-problem detail.

    The page is a re-rendering of archived API data made for our archive, not a page of the contest itself.
