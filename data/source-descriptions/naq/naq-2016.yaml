  description: |-
    Standings of the 2016 North America Qualifier: 714 teams, one row each, with rank, team name, institution, number of problems solved, time, medal, citation and site citation. Teams are in rank order with ties sharing a rank. The first twelve rows carry medals (four gold, four silver, four bronze); the rest are marked Ranked, and 476 of them carry the citation Honorable Mention. The best result is 12 problems solved, by Waterloo 19 of the University of Waterloo, in first place. There is no per-problem detail and no attempts column.
