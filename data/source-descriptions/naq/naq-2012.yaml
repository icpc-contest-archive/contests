  - en
  contest_date: '2012-09-29'
  problems: 11
  description: |-
    Page of the 2012 ACM-ICPC North American Qualification Contest, the first qualifying contest for the North American regions, on a Baylor University computer science server. It gives the contest as 2:00 PM Central Time on Saturday 29 September 2012, five hours, run on the Kattis system, with a practice contest in the preceding week. After the contest it reports 730 teams submitting something, 665 teams solving at least one problem and 8395 submissions, and it lists the time limits of the 11 problems (memory limit 2048 MB for all). It links to the problem statements, the test data and final standings for each institution, and states the scoring: most problems solved, then least time, with 20-minute penalties for runtime error, time limit, wrong answer, output limit and memory limit verdicts and none for compile errors.

    The opening lines give 1138 teams from 164 institutions registered as of 26 September. The older sections cover registration: one qualifier per North American region (11 in all) with an ICPC-eligible site and an other-teams site each, followed by a list of questions and answers. It also thanks the people and organisations that helped.

    Our copy holds the page, the statements PDF and the test data archive (262 files: input and answer files for each of the 11 problems). The standings, the Kattis server and the registration links lead outside the copy.
