    Standings page of the ICPC North America Qualifier 2019 on Kattis, filtered to one affiliation, Appalachian State University: 3 teams with rank, team name, problems solved (Slv.), total time, and one column for each of the 13 problems A to M. Solved problems show the number of attempts and the minute of the accepted run; unsolved attempts show the attempts with a dash. The first team solved four problems with 416 minutes, the second three problems with 419 minutes, and the third none. The page says the contest is over and gives the start as 2019-10-05 20:00 CEST and the end as 2019-10-06 01:00 CEST. A drop-down lists the other affiliations, but our copy holds only the Appalachian State University view.
