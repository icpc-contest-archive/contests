  title: 2019 ICPC North America Qualifier
  language:
  - en
  contest_date: '2019-10-05'
  description: |-
    Website of the 2019 ICPC North America Qualifier on the Baylor University computer science site, in English. It is a single long page with sections About, Results, Register, FAQ, Write (or Review) Problems and Contact. The Results section links to the official and open division standings and the contest problems on Kattis, to the problem set PDF, to the judges' solution slides and to the judges' data (a 34 MB tar.xz). It states statistics for the official contest: 827 Kattis users submitted, 89 universities and 734 teams took part, 688 teams solved at least one problem, 8480 submissions in five hours, and a table of teams by number of problems solved (1 to 13). The page describes an online contest on Kattis on October 5, 2019, 13:00 to 18:00 CDT, run as one contest with 12 sites (11 regions plus a site for ineligible contestants), gives contest-week instructions on Kattis accounts and passwords, and lists links for the 12 sites. The rest is for problem authors and reviewers: a development schedule and notes on the Kattis problem format and problemtools.

    Our copy holds three pages: the page itself, the problem set (a PDF of 28 pages) and the judges' solution slides (a PDF of 53 pages), with the logo and a sample problem package. The judges' data archive is not in our copy, and the links to the Kattis contest pages lead to another server.
