  title: The 2012 ACM-ICPC Asia Kanpur Regional Contest
  language:
  - en
  teams: 65
  description: |-
    Standings of the 2012 ACM-ICPC Asia Kanpur Regional Contest: 65 teams with rank, team name, institution, number solved, time, medal, citation and site citation. Ranks run from 1 to 60 with ties; the first team, Deadly Army of AUT from Amirkabir University of Technology, solved 5 problems, which is the most on the page.

    The medal column names a winner, a first runner-up and a second runner-up for the top three. The citation column gives the place (First Place to Thirty-first Place) and then Honorable Mention for the remaining teams; only the first team has a site citation, Champion of Asia Kanpur On-site Regional Contest. The time column reads 300 for every team. No per-problem results or attempts.
