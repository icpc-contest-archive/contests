  description: |-
    Problem set as handed out at the Kanpur site contest of 13 December 2012: a PDF of 18 pages in English. The opening page gives the instructions (eleven problems in five hours, submission through PC2, ranking by problems solved and then least total time, 20 penalty minutes per rejected run), followed by eleven problems labelled A to K, from Data Compression to Crossword.

    Each problem has a statement with input and output description and a sample input and sample output. No test data or solutions.
