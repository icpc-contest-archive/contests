  title: ACM-ICPC Kanpur Site 2012
  language:
  - en
  teams: 59
  description: |-
    Home page of the ACM-ICPC Kanpur Site 2012, by IIT Kanpur, which hosts the site. It gives the schedule (registration from 27 August to 24 October 2012, online contest on 3 November, Kanpur site contest on 12 and 13 December), the team rules (at most three contestants and a coach, six to eight problems in five hours, C, C++ or Java), and the result of the Kanpur site contest.

    The result lists 33 ranked teams with institute, team name and rank, from Amirkabir University of Technology, Iran (Deadly Army of AUT) in first place down to rank 31, where three teams are tied. A second table, Honorable Mention, lists 26 more teams with institute and team name and no rank. No solved counts, times or per-problem results. Menu links lead to contact, people and registration pages, which are not part of this page.
