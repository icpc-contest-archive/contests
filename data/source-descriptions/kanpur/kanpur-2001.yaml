  description: |-
    Regional Contest Information page of the ICPC site for the 2001 ACM Asia Programming Contest - Kanpur, sponsored by IBM and hosted by the Indian Institute of Technology - Kanpur, with the contest date given as 5 - 6 December 2001. A short paragraph says the contest draws students from colleges and universities throughout Asia and that regional winners advance to the World Finals in Honolulu, Hawaii. Links lead to the team roster, the standings and the problems, and a mail link to the regional contest director.

    Our copy holds 2 pages: this page and the problems PDF of 22 pages (rules and eight problems). The roster and standings links lead to pages that are not part of it.
