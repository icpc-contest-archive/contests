  description: |-
    Website of the ICPC Asia Region Kanpur Site, hosted by the University Institute of Engineering and Technology, CSJM University, Kanpur. The home page in our copy announces the 2022 round (preliminary online contest on the CodeDrills platform on 4 September 2022, regional round in the last week of September 2022). Its list of updates names the Result of Kanpur-Mathura Site Contest-2021, the Report from Regional Contest Director-2021 and the Kanpur-Mathura Regional Contest Problems-2021, but none of those three files is in our copy. A page headed Result of Preliminary Online Contest lists 70 ranked teams with team name and institute.

    The copy also holds pages and PDFs of other editions of the site. From 2019: pages (selected teams, important dates, registration, people, contact) and PDFs (the ranklist of the 2019 site contest, program schedule, travel guide, preliminary online contest rules, an invitation letter). From 2023: the Mathura-Kanpur problem set (11 problems, 9 April 2023), program schedule, travel guide and preliminary rules. From 2024: pages on important dates, registered teams, selected teams and the onsite contest results, team selection rules, and a 69-page list of teams with online-contest user names. Several addresses hold a later home page announcing a 2025 ranklist. Our copy has 50 pages in all, with style sheets and images saved beside them.
