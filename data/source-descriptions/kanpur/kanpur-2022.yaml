  copy: kanpur/kanpur-2022/website/2026-09-04-wayback-a32e7545
  title: Home | ICPC Kanpur Site | CSJMU, Kanpur
  language:
  - en
  description: |-
    Website of the ICPC Kanpur Site at CSJM University, Kanpur, in English. The same address served the site of several years in turn, so our copy mixes editions: the 2019 site (important dates, registration, people, contact, selected teams), a home page announcing the December 2023 onsite round, the 2024 pages (important dates, registered teams, selected teams, and the results of the Kanpur onsite contest 2024 with rank, team name, institution, problems solved, total time and penalty), and the 2025 home page with a link to a tentative onsite ranklist.

    For the contest of April 2023 the home page links the problem set as "Onsite Round Problem Set 2022", a PDF of 11 problems that is in our copy, and our copy holds the rules for the preliminary online contest of 18 March 2023, a two-page PDF that also gives the procedure for selecting teams for the onsite contest at Mathura and Kanpur. Further PDFs belong to other years: the 2023 problem set, program schedules, travel directions, rules and rank lists.

    Our copy holds 150 files, 49 of them pages; several addresses return the 2025 home page. Images are saved; some style sheets of the site theme are not.
