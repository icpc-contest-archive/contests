  description: |-
    Problem set as handed to the teams: a PDF of 20 pages. The cover page is titled Mathura - Kanpur Contest Problems (11 Problems) and dated 09th April, 2023; a page of instructions headed ICPC Mathura-Kanpur Programming Contest, April 09, 2023 follows (eleven problems, five hours, submission through the CodeDrills platform, ranking by problems solved and then total time with 20 penalty minutes per rejected run). Eleven problems A to K follow in English, from A "Binary Digit Escaping" to K "Gotta Catch 'Em All". Each has a statement with input and output format and a sample input with its sample output. No test data or solutions.
