  title: Report from the Contest Director
  language:
  - en
  contest_date: '2004-12-15'
  description: |-
    Report by the contest director of the 6th ACM International Collegiate Programming Contest, Asia Region Kanpur Site, held at the Indian Institute of Technology Kanpur with IBM and VERITAS as industry sponsors. It tells that an online round on 6 November had 130 registered teams, of which 70 participated and solved 5 questions in 5 hours, and that the top 31 teams from India were invited to the second round on 14th-15th December 2004, together with one team each from Japan, Korea, Singapore and Bangladesh. It gives the schedule (practice session on 14 December, five-hour contest starting 9:30 AM on 15 December), says 16 teams solved at least one problem, and names the National University of Singapore (NUS@SOC) as winner, eligible for the World Finals in Shanghai in April 2005.

    Our copy holds 2 pages: the report and the page with the results table.
