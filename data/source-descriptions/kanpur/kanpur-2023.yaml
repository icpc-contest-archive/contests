  contest_date: '2023-12-23'
  description: |-
    Website of the ICPC Kanpur Site, organised by the University Institute of Engineering and Technology, CSJM University, Kanpur, in English. The home page announces a preliminary online contest (tentatively 04 November 2023) and the Kanpur regional round on 22-23 December 2023, and links the program schedule, directions for reaching the university, the team selection criteria, the list of selected teams, the registered teams and the 2022 problem set.

    Our copy holds a two-page program schedule (practice session on 22 December, main contest on 23 December 2023 from 10:00 AM to 03:00 PM, with hospitality and bus schedules), two-page directions, the two-page rules of the preliminary online contest (held on 26 November 2023), the 21-page problem set of the 2023 onsite round, and a four-page ranklist PDF with rank, name, score, total time, penalty and institution that names no contest.

    It is a series site: the same address also serves 2024 pages (important dates, registered teams, selected teams, results of the onsite round), the 2025 home page, and a People page and feeds that still carry the 2019 title. Our copy holds 102 files, 32 of them pages.
