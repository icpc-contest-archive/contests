  description: |-
    Home page of the ACM ICPC at IIT Kanpur website for the contest of 6 - 7 December, 2002. It describes the ACM ICPC and the Asian regional contests (eight sites in the Asia region, the winner of each site eligible for the world finals) and says IIT Kanpur is hosting for the fourth time in a row. A line announces that the Indian Institute of Technology Bombay (team IIT Bombay) won the 27th ACM ICPC 2002 Kanpur Site Contest, and a note says the contest is over and points to the Contest Director's Report. Links lead to the problem set, contest result, schedule, reports and photographs, and the menu offers Home, People, Contest, Links, Archive and Contact. The page is stamped as last updated on 10 December 2002.

    Our copy holds this one page; the linked pages are not part of it.
