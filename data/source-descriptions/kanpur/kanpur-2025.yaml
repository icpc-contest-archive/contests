  contest_date: '2025-12-22'
  description: |-
    Website of the Kanpur regional site, run by CSJM University, Kanpur, in English. The address now serves the 2026 edition's page (registration, dates, three onsite centres Kanpur, Gandhinagar and Pune), and below it a subsite of the 2025 edition: home, official ranklist 2025, gallery, onsite round program schedule, FAQ for the onsite round, how to reach the university, list of teams selected for the onsite round, registration, team selection criteria, important dates, people and contact. It also holds a results page for 2024. Our copy has 150 files, of which 53 addresses are pages (many are http and https duplicates of the same page).

    The ranklist page shows 101 teams with rank, institution, score, total time, penalty and a tick or dash per problem for the eleven problems, which are headed by short codes. Documents of the 2025 edition inside the site: a ranklist PDF of 4 pages (101 teams, problems A to K), a problem statement PDF of 22 pages with eleven problems A to K, and a 2-page report from the contest director. Older problem sets (2022, 2023, 2024) and a 2024 director report are also linked and held. The gallery page lists 136 photos; our copy holds 66 of them.
