    Standings of the 2025 ICPC Asia Kanpur Regional Contest: 101 teams with rank, team name, institution, number solved, time and a citation. Ranks 1 to 59 carry place names from First Place to Fifty-ninth Place, and the last 42 teams are marked Honorable Mention. No per-problem detail. Div4Maxxer (Indian Institute of Technology - Kharagpur) is first with 9 solved.
