  teams: 59
  description: |-
    Results of the 1999 Kanpur Site Contest as a plain web page: 59 teams with rank, number of problems solved, penalty, team name and institute. The top 20 teams are ranked, led by BUET LOOPERS (Bangladesh University of Engineering and Technology, Dhaka) with 6 solved; the other 39 are listed under the heading Honorable Mention in alphabetical order by institute, without rank, solved count or penalty. Most teams are from Indian institutions, with others from Bangladesh and Iran. No per-problem results are given.
- url: http://acm.win.tue.nl/icpc/archive/ProblemSetArchive/B_VV_Asian/1999/Kanpur.html
  read: '2026-11-16'
  rubric: 1
  copy: kanpur/kanpur-1999/problemset/20001214-wayback-63bf4d57/Kanpur.html
  title: 'ACM ICPC-1999: Contest Problems'
  language:
  - en
  problems: 8
  description: |-
    Problem statements of the 1999 ACM Asia Programming Contest, Kanpur Site, on one web page in English: eight problems, not lettered in our copy and given in this order: Bank Loan, Counting Triangles, Area of a Polygon, Convoy, Crossword Puzzle, Numerical Scrabble, Train Shunting and A Game of Strategy. Each has a statement with input and output description; all but the last also have a sample input and output (a possible output for Crossword Puzzle and Numerical Scrabble). A Game of Strategy is interactive, and the page ends with notes on flushing output for C, C++, Java and Pascal programs. No test data or solutions.

    The two figures of the page, the crossword grid and the track layout of Train Shunting, are not in our copy.
