    Standings of the 2019 ICPC Asia Kanpur Regional Contest: 92 teams with rank, team name, institution, number solved, time, citation and site citation. Ranks run from 1 to 81 with ties; Cogito Ergo Error (IIIT-Delhi) is first with 9 solved. The citation column gives First Place to Forty-sixth Place for 57 teams and Honorable Mention for the other 35; every team has the site citation Asia Kanpur Onsite. No per-problem results or attempts.
