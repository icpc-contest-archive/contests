  title: ICPC Asia Region Kanpur Site 2019 - Organized by UIET, CSJM University, Kanpur
  language:
  - en
  contest_date: '2019-12-30'
  description: |-
    Website of the ICPC Asia Region Kanpur Site 2019, organised by UIET, CSJM University, Kanpur. The home page describes the contest (online preliminary on 18 October 2019, site contest on 30 and 31 December 2019, teams of at most three contestants and a coach, six to eight problems in five hours) and links to the list of selected teams, important dates, registration, people and contact pages. A few PDFs of that edition are in our copy: the ranklist of the site contest, a program schedule, a travel guide and an invitation letter. The links to the problem set and to the regional contest director's report are on the home page, but those two files are not in our copy.

    The address was reused for later editions, and our copy also holds pages and PDFs from them: the 2023 Mathura-Kanpur problem set (11 problems, 9 April 2023) and preliminary rules, a 2023 program schedule and travel guide, 2024 team selection rules, a 69-page list of teams with 2024 online-contest user names, and a later home page that announces a 2025 ranklist. Our copy has 48 pages in all, with style sheets and images saved beside them; eight of those addresses, named like PDFs, a style sheet and a script, hold the same later home page instead of the named file.
