  description: |-
    Home page of the ICPC Kanpur Site, hosted by the University Institute of Engineering and Technology, CSJM University, Kanpur, in English. The menu lists Home, Result of Kanpur Onsite 2024, List of Selected Teams for Kanpur Onsite Round 2024, Registered Teams, Important Dates, Registration, People and Contact Us. Under Important Updates it links the result of the 2024 onsite round, the report from the contest director, the 2024 problem set, the list of selected teams, the ICPC India preliminary rank list, the team selection criteria and the problem sets of 2023 and 2022.

    The introduction explains the two-tier ICPC structure and team rules, and still gives the dates of the 2023 round: preliminary online contest on 04 November 2023 (tentative) and regional round on 22-23 December 2023.

    Our copy holds this one page only, not the pages and PDFs it links. Style sheets and images are not in our copy.
