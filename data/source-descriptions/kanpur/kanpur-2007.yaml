    Statement of one problem, headed "3843 - Expression" with the line "Asia - Kanpur - 2007/2008", as a PDF of two pages. Given a set of letters and a binary operation table, the task is to determine, for strings of letters and at most two variables, the equivalence of their left-to-right (LR) and right-to-left (RL) expressions; the output line for each test case gives a count k and k strings in lexicographic order. It has the input and output format and a sample input and output, and a footer on each page with the problem number, title and page count; the last page also carries the line "Kanpur 2007-2008". No problem letter is printed.
