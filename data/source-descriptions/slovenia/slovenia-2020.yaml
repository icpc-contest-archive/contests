  description: |-
    Website of the competition portal, titled "ACM Tekmovanja" (ACM Competitions), in Slovenian. It covers several competitions, among them the school contest Bober, RTK, Pišek and the University Programming Marathon (UPM). Our copy holds 149 HTML pages saved at different dates from 2016 to 2026, most of them about other competitions or years; images, style sheets and linked PDF files are not in it.

    The UPM 2020 pages are an archive page, a results page with an overall table and a grid for each round, a team list, a sponsors page with five logo images, and a page of solution descriptions whose PDF files are not in our copy. The team list shows registrations as of 8 October 2020: 46 teams and 127 contestants by site (Koper 4 teams, Ljubljana 32, Maribor 10), with members and their schools.

    The UPM start page, saved in August 2020, carries news items announcing the practice round of 3 April, the 1st round of 16 April and the 2nd round of 7 May 2020, all online, and a separate page "UPM in koronavirus" (UPM and the coronavirus) gives the changed rules for the online rounds. The page "Finale UPM 2020" reports the final of Saturday 10 October 2020: 15 finalists out of 46 teams, nine tasks in five hours, held separately at three universities.
