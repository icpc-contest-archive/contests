  title: 2019 | ACM Tekmovanja
  language:
  - sl
  description: |-
    Website of the competition portal, titled "ACM Tekmovanja" (ACM Competitions), in Slovenian. The portal covers several competitions, among them the school contest Bober, RTK, Pišek and the University Programming Marathon (UPM), whose menu links rules, technical instructions, FAQ, sponsors, teams, registration, results, tasks and solutions. Our copy holds 149 pages saved at different dates from 2016 to 2026, and most of them belong to other competitions or other years.

    The pages of the 2019 UPM edition are an archive page for 2019 and one announcement page for each of the four rounds. The 1st round was moved to Wednesday 24 April at 16:00 with four hours of solving time. The 2nd round was on Thursday 9 May, and its page lists the seating of teams in Ljubljana rooms and points to a solutions page and to the judge system. The 3rd round was on Thursday 3 October, with rooms in Koper, Maribor and Ljubljana. The Finale page says the final took place on Saturday 12 October in Ljubljana, that the first 31 teams of the total results qualified, that final tasks count double, and it gives the day's schedule from 8:15 to 18:00. The UPM start page and FAQ are also in our copy.

    The results page, team list and tasks of 2019 are not pages of this site copy. Pages saved from other years are also in it.
