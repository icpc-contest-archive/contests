  description: |-
    Website of ACM Slovenia's competitions (ACM Tekmovanja), in Slovenian, with sections for Bober, Pišek, RTK and UPM, the Univerzitetni programerski maraton (university programming marathon). Our copy holds 150 files, captured at different dates between 2016 and 2026, so it mixes several school years: most are front pages, news items and results of the school competitions and of other years.

    For this edition it holds the news items for the trial round (8 April 2022, 3 hours, on site in Ljubljana, Maribor and Koper) and for the first round (14 April 2022, with the seating of the Ljubljana teams), the 2022 solutions page, which lists solution write-ups for rounds 1 to 3 and slides for the final as linked attachments that are not in our copy, the UPM FAQ, and a page about CERC 2022 in Ljubljana. The results and team lists of the 2020 and 2021 UPM are in the copy as well; the 2022 results page itself is not.

    The page at the seed address is not in our copy.
