  description: |-
    Results page of the 2022 Univerzitetni programerski maraton (UPM) on the ACM Slovenia competitions site, in Slovenian. A total table ranks 23 teams, each with its city (Ljubljana, Maribor or Koper), points and total time; the leader is Segment Trio with 26 points.

    Below it are one grid for each of the four rounds: the final with 11 teams and nine named problems, the third round with 12 teams and six problems, the second round with 17 teams and six problems, and the first round with 22 teams and six problems. Problems are named, not lettered. Each cell holds a tick for a solved problem, a cross or is empty, and each row ends with points and a total time. There are no attempt counts or per-problem times. Each round heading links to its results on the judge system.
