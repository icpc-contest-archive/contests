  description: |-
    Pages of the ACM Tekmovanja site, in Slovenian, mostly about the Bober school competition and other ACM competitions. Our copy holds 150 files. For the UPM (Univerzitetni programerski maraton) of 2014 it holds the registration page, a form for teams of up to three members with a choice of Ljubljana, Maribor or Koper, in a version of June 2014 and a later one where submissions are closed, and the site front page as it stood in July 2014 (news of the announcement, the warm-up round and rounds 1 and 2) and in November 2014 (news of the third round and of the final in Koper on 11 October 2014, with the top three teams; the list of university champions is cut off in that item).

    There are no UPM 2014 pages for rules, schedule, teams or tasks in our copy. The other UPM pages in it are of other years.
