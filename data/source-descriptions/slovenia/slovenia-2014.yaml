  description: |-
    Results page of the UPM 2014 (Univerzitetni programerski maraton) on the ACM Tekmovanja site, in Slovenian, with five tabs. The first, Skupne točke ("total points"), is the overall standings: 53 teams with rank, team name with its city (Ljubljana, Maribor or Koper), points and time; first place is Programatorji (Ljubljana) with 18 points.

    The other four tabs are scoreboards of single events, each with a column per problem named by its title, a check mark or a cross or an empty cell per team and problem, and the team's points and time: Finale with 21 teams and eight problems (Cenzura to Sosedski odnosi), 3. kolo with 35 teams and six problems, 2. kolo with 46 teams and six problems, and 1. kolo with 48 teams and six problems. There are no per-problem times or numbers of attempts.

    Style sheets and images are kept with our copy.
