  description: |-
    Task list of the Putka judge system of the UPM competition for the contest Finale 2011. It gives ten task entries without letters: Beljakovine, Binomski koeficienti, Ceste, DDV v Čudežni deželi (two entries with this name and separate links), Gozdar, Kitajci, Moduli, Padajoča podzaporedja and Računovodstvo. Each name links to its own task page; those pages are not part of our copy, so no statements, samples or test data are held. The page is in Slovenian and shows the judge's menu and the editor group upmorg.
