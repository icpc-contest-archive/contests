  - sl
  contest_date: '2011-04-14'
  description: |-
    Website of the Univerzitetni programerski maraton (UPM, "University Programming Marathon"), in Slovenian, mainly as it stood in 2011. The front page reports the second round: a table of the top six teams with the number of tasks solved (up to 6), and the first round, in which 34 teams took part, with a table of six teams that solved at least three tasks. Other pages give the presentation of the 2011 contest (warm-up round, three rounds, and a final planned for the end of October at the University of Ljubljana), the schedule with the dates 7 April, 14 April and 12 May 2011 and the rooms in Ljubljana, Koper and Maribor, rules, a registration page, instructions for contestants, sponsors, and a page for the 2010 contest that only redirects to another address. The 2011 list of registered teams says that it will be published later. The rules page links a PDF of the rules, ten pages, in Slovenian.

    Our copy holds 41 files. The pages for tasks and results only redirect to the judge system, which is not part of the copy. The copy also holds pages from earlier years: a news page and schedule from 2009 (including the 2008 final), a forum index from 2008, five task statement pages without a date, and login forms.
