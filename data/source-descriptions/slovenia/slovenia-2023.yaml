  description: |-
    Website of ACM Slovenia's competitions (ACM Tekmovanja), in Slovenian, with sections for Bober, Pišek, RTK and UPM, the Univerzitetni programerski maraton (university programming marathon). Our copy holds 150 files, captured at different dates between 2016 and 2026, so it mixes several school years: most are front pages, news items and results of the school competitions and of other years.

    For this edition it holds the UPM news page with the report on the 2023 final (21 October 2023 at FERI in Maribor; 28 teams and 80 contestants in the three qualifying rounds, 12 teams in the final, 10 problems in five hours, with the first three teams named) and the announcement of the trial round of 7 April 2023. Results and team pages of the 2020 and 2021 editions are in the copy as well; the 2023 results page itself is not.

    The page at the seed address is not in our copy.
