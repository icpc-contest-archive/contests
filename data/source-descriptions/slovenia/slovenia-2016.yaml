  description: |-
    Results page of the UPM 2016 (Univerzitetni programerski maraton) on the ACM Tekmovanja site, in Slovenian. It has five tables. The overall table "Skupne točke" (total points) ranks 62 teams with rank, team name with its city (Ljubljana, Maribor or Koper), points and total time; teams with zero points share the last rank.

    Four tables follow, one per round, each marking every problem as solved, attempted and not solved, or blank: the Finale with 25 teams and nine problems (from "Beli bloki" to "Tipkarska napaka"), the 3rd round with 40 teams and six problems, the 2nd round with 56 teams and six problems, and the 1st round with 62 teams and six problems. Each round table also gives points and time per team. The page gives no number of attempts and no solve time per problem.
