  description: |-
    Website of the competition portal "ACM Tekmovanja" (ACM Competitions), in Slovenian. The portal covers several competitions, among them the school contest Bober, RTK, Pišek and the University Programming Marathon (UPM). Our copy holds 149 pages saved at different dates from 2016 to 2026, and most of them belong to other competitions or other years.

    For the 2016 edition of UPM it holds the team registration form "Prijave na UPM 2016" (two saved versions, from April 2016): team name, user name on the judge system, site (Ljubljana, Maribor or Koper), a captain and two further members with school or faculty and year of study, and the number of members wanting a vegetarian sandwich. Three front-page snapshots from 2016 carry short news items on the trial round and the first, second and third rounds of UPM 2016 and on the final in Ljubljana on 15 October, with its schedule and the qualification thresholds; the October snapshot mentions the results page. The site also holds the UPM registration form for 2017 and pages on UPM from 2019, 2020 and 2021, among them the UPM overview and FAQ, a page on UPM and the coronavirus and pages on the 2020 and 2021 finals. The results and problems of UPM 2016 are not among these pages.
