  description: |-
    Website of the competition portal "ACM Tekmovanja" (ACM Competitions), in Slovenian. The portal covers several competitions, among them the school contest Bober, RTK, Pišek and the University Programming Marathon (UPM). Our copy holds 149 pages saved at different dates from 2016 to 2026, and most of them belong to other competitions or other years.

    For the 2017 edition of UPM it holds the team registration form "Prijave na UPM 2017" (one saved version, from July 2017): team name, user name on the judge system, site (Ljubljana, Maribor or Koper), a captain and two further members with school or faculty and year of study, and the number of members wanting a vegetarian sandwich. A calendar page from July 2017 gives the dates and venues of the UPM trial round, rounds and final for 2016, 2017 and 2018, and a front page from October 2017 carries news items on the 2017 trial round and third round. The site also holds the UPM registration form for 2018 and pages on UPM from 2019, 2020 and 2021, among them the UPM overview and FAQ, a page on UPM and the coronavirus and pages on the 2020 and 2021 finals. The results and problems of UPM 2017 are not among these pages.
