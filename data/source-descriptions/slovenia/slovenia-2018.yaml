  description: |-
    Results page of the UPM 2018 (Univerzitetni programerski maraton) on the ACM Tekmovanja site, in Slovenian. It has five tables. The overall table "Skupne točke" (total points) ranks 52 teams with rank, team name with its city (Ljubljana, Maribor or Koper), points and total time; teams with zero points share the last rank.

    Four tables follow, one per round, each marking every problem as solved, attempted and not solved, or blank: the Finale with 16 teams and nine problems (from "Alkani" to "Zemljiški kataster"), the 3rd round with 33 teams and six problems, the 2nd round with 47 teams and six problems, and the 1st round with 50 teams and six problems. Each round table also gives points and time per team. The page gives no number of attempts and no solve time per problem.
