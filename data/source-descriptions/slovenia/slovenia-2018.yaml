    Judge system page "Naloge – UPM sodnik" (Tasks – UPM judge), in Slovenian, listing the nine tasks of the Finale 2018 by name: Alkani, Arbitraža, Fruit Ninja, Gusarji, Kvadrat števil, Odločitveni seznam, Plezalne smeri, Tabela and Zemljiški kataster. Each name links to a task page on the judge system. Our copy holds only this list: the tasks are not labelled with letters and no statements, samples or test data are on it.
