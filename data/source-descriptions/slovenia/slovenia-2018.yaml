  description: |-
    Website of the competition portal "ACM Tekmovanja" (ACM Competitions), in Slovenian. The portal covers several competitions, among them the school contest Bober, RTK, Pišek and the University Programming Marathon (UPM). Our copy holds 149 pages saved at different dates from 2016 to 2026, and most of them belong to other competitions or other years.

    For the 2018 edition of UPM it holds the team registration form "Prijave na UPM 2018" (one saved version, from July 2018): team name, user name on the judge system, site (Ljubljana, Maribor or Koper), a captain and two further members with school or faculty and year of study, and the number of members wanting a vegetarian sandwich. A calendar page from July 2018 gives the dates of the UPM trial round, rounds and final for 2018 and 2019. The UPM start page, saved in July 2019, still carries the news items of 2018 on the second round, the third round and the final of 9 problems in Maribor on 13 October, with the schedule of the final. The site also holds pages on UPM from 2019, 2020 and 2021, among them the FAQ, a page on UPM and the coronavirus and pages on the 2020 and 2021 finals. The results and problems of UPM 2018 are not among these pages.
