  description: |-
    Pages of the ACM Tekmovanja site, in Slovenian, mostly about the Bober school competition and other ACM competitions. Our copy holds 150 files. For the UPM (Univerzitetni programerski maraton) of 2015 it holds the site front page as it stood in September 2015, with the announcement of the contest, the warm-up round and the news of rounds 1 and 2, and a later version of March 2016 with the news of round 3 and of the final in Maribor on 10 October 2015, where the item on the final leads into a list of the top three teams in the overall standings, but the list itself is cut off in our copy.

    There are no UPM 2015 pages for rules, schedule, teams or tasks in our copy. The registration page in it is for UPM 2016, and the other UPM pages are of other years.
