  description: |-
    Results page of the UPM 2015 (Univerzitetni programerski maraton) on the ACM Tekmovanja site, in Slovenian, with five tabs. The first, Skupne točke ("total points"), is the overall standings: 70 teams with rank, team name with its city (Ljubljana, Maribor or Koper), points and time; first place is Programatorji (Ljubljana) with 22 points.

    The other four tabs are scoreboards of single events, each with a column per problem named by its title, a check mark or a cross or an empty cell per team and problem, and the team's points and time: Finale with 20 teams and nine problems (Begunci to Trikotnik), 3. kolo with 38 teams and six problems, 2. kolo with 54 teams and six problems, and 1. kolo with 64 teams and six problems. There are no per-problem times or numbers of attempts.

    Style sheets and images are kept with our copy.
