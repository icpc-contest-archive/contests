  description: |-
    Website of the competition portal, titled "ACM Tekmovanja" (ACM Competitions), in Slovenian. It covers several competitions, among them the school contest Bober, RTK, Pišek and the University Programming Marathon (UPM). Our copy holds 149 HTML pages saved at different dates from 2016 to 2026, most of them about other competitions or years; images and style sheets are not in it.

    The UPM 2021 pages are an archive page for 2021, a results page with an overall table and a grid for each of the four rounds, a team list, a sponsors page with logo images, the announcement of the practice round of 2 April 2021 (online), and the page "Finale UPM 2021". The team list shows registrations as of 14 April 2021: 43 teams and 123 contestants by site (Koper 5 teams, Ljubljana 26, Maribor 12), with members and their schools.

    The Finale page reports the final of Saturday 16 October 2021 in Ljubljana: 22 finalists out of 43 teams, nine tasks in five hours, with the first three places and the champions of the three universities. It says the first two rounds were online and the third round was held at the three universities. Pages of 2020 and 2022 are also in our copy.
