  description: |-
    Pages of the ACM Tekmovanja site, in Slovenian, mostly about the Bober school competition, with news on other ACM competitions. Our copy holds 150 files. For the UPM (Univerzitetni programerski maraton) of 2013 it holds only the site's front page with news items up to 30 July 2013, among them news of the first round (11 April 2013) and second round (9 May 2013) and a list of upcoming events naming the third round (3 October 2013) and the final (19 October 2013), and a registration page for UPM 2014. The other UPM pages in it are of later years.

    There are no UPM 2013 pages for rules, schedule, teams or tasks in our copy.
