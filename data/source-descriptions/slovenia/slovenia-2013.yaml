  description: |-
    Results page of the UPM 2013 (Univerzitetni programerski maraton) on the ACM Tekmovanja site, in Slovenian, with five tabs. The first, Skupne točke ("total points"), is the overall standings: 51 rows with rank, team name with its city (Ljubljana, Maribor or Koper), points and time; the first row is Pitoni++ (Ljubljana) with 20 points, and one name, Spacemen (Maribor), appears in two rows.

    The other four tabs are scoreboards of single events, each with a column per problem named by its title, a check mark or a cross or an empty cell per team and problem, and the team's points and time: Finale with 25 teams and nine problems (Arbitraža to Vzporedno urejanje), 3. kolo with 31 teams and six problems, 2. kolo with 42 teams and six problems, and 1. kolo with 45 teams and six problems. There are no per-problem times or numbers of attempts.

    Style sheets and images are kept with our copy.
