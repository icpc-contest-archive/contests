  description: |-
    Standings of the 2016 Jordanian Collegiate Programming Contest: 83 teams with rank, team name, institution, number of problems solved, total time and a citation. Ranks run 1 to 78. The first 41 places carry the citations First Place to Forty-first Place, the other 42 teams are marked Honorable Mention, and the 6 teams with no problem solved share rank 78. First place is H2A (JUST) of Jordan University of Science and Technology with seven problems, ahead of four other teams that also solved seven. No per-problem results.
