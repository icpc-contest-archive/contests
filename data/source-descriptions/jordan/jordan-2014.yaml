  description: |-
    Standings of the 2014 Jordanian Collegiate Programming Contest: 96 teams with rank, team name, institution, number of problems solved, total time and a citation. Ranks run 1 to 63. The 50 teams in the upper part carry the citations First Place to Forty-eighth Place (tied teams share a place), the other 46 teams are marked Honorable Mention, and the 32 teams with no problem solved share rank 63. First place is the team 42 of Princess Sumaya University for Technology with seven problems, ahead of 3G of the same university, also with seven. No per-problem results.
