  description: |-
    Official site of the ACM Jordanian Collegiate Programming Contest (JCPC) for the 2013 edition, in English. The front page announces the contest at Applied Sciences University (ASU) on 15 and 16 November 2013, has Hosted by and Sponsored By headings, links a registration form (a Word file that is in our copy) and gives contact details of the steering committee head and the site director. Behind it are pages for About (a local copy of the ACM ICPC, open to Jordanian university students), Rules and Regulations, Time Line (nominations due 8 November, training session 15 November, contest 16 November 2013), Organizers (steering committee members from Jordanian universities and the ACPC organising team), Links (World Finals and Arab problems archives and online judges) and Contact Us.

    A site archive page links the 2012 and 2011 editions, and the results summaries of those two editions are in our copy. The main page still carries text for the 2011 contest. Our copy holds 12 pages; it has no results, team list or problems of 2013. The logos and other images of the pages and the problem-set zip files linked from the archive page are not in our copy.
