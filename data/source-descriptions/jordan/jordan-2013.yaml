  description: |-
    Standings of the 2013 Jordanian Collegiate Programming Contest: 79 teams with rank, team name, institution, number of problems solved, total time and a citation. Ranks run 1 to 71. The first 39 places carry the citations First Place to Thirty-ninth Place, the other 40 teams are marked Honorable Mention, and the nine teams with no problem solved share rank 71. First place is Need for Speed of Princess Sumaya University for Technology with eight problems. No per-problem results.
