  description: |-
    Scoreboard of the 2025 ICPC Jordanian Collegiate Programming Contest from a PC^2 scoreboard page, frozen: its legend has a "Frozen (Blind Hour)" entry and a "Pending" mark, and many cells show a question mark in place of a result. It lists 96 teams, with rank, team name followed by the institution in brackets (abbreviated for most teams), solved, time, and one cell for each of the 15 problems A to O giving attempts and solve time, plus a total of attempts and solves. Each problem column is headed by a colour name. Three Musketeers (JUST) is first with 11 solved and time 862; 94 teams have solved at least one problem and the last two, both ranked 95, have none. A final row gives submissions, time of first yes and total yes for each problem. The page states it was last updated on Sat Sep 27 13:49:47 GMT 2025.

    The page's style sheets and the team logo image it refers to are not in our copy.
