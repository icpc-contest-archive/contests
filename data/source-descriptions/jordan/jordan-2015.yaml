  description: |-
    Standings of the 2015 Jordanian Collegiate Programming Contest: 92 teams with rank, team name, institution, number of problems solved, total time and a citation. Ranks run 1 to 70. The first 46 teams carry the citations First Place to Forty-sixth Place, the other 46 teams are marked Honorable Mention, and the 21 teams with no problem solved share rank 70. First place is EarlGrey (PSUT) of Princess Sumaya University for Technology with seven problems. No per-problem results.
