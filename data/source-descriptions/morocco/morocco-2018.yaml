  description: |-
    Standings of the 2018 Moroccan Collegiate Programming Contest: 67 teams, each with rank, team name, institution, number of problems solved, time and a citation. First place went to Top 10 sad anime TLEs of Faculté des Sciences - FES and second to Shushi of Al Akhawayn University, both with 5 problems solved.

    The citation column names places from First Place to Thirty-third Place (two teams share the Thirty-third); the other 33 teams are marked Honorable Mention, and the last three of them solved nothing. The page gives no per-problem results and no attempts.
