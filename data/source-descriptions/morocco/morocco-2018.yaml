  description: |-
    News item on the website of ENSIAS, the national school of computer science and systems analysis in Rabat, with a French title and an English body text. It explains that the Moroccan Collegiate Programming Contest is a qualifying round for the ACM Arab Collegiate Programming Contest and follows ICPC rules, and reports that ENSIAS entered 5 teams in the 2018 edition. One of them, Beginners Luck, ranked second at the competition and qualified for the ACPC; it was the first MCPC for all its members.

    The page is the school's article page with its menus, lists of announcements and footer. It gives no results table, no list of teams and no date for the contest. Our copy holds the page with its style sheets and images.
