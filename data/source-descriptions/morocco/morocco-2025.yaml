  description: |-
    Scoreboard produced by PC^2 (version 9.11) for the 2025 ICPC Moroccan Collegiate Programming Contest, with a legend that includes Frozen (Blind Hour) and a footer showing it was last updated on 21 September 2025. It lists 44 teams with rank, team name followed by an abbreviation of the institution, number solved and time. Thirteen problems A to M follow, each column headed by its letter with a colour name beneath it, and each cell gives the number of tries and the solve time. In 97 cells the time is replaced by a question mark. A last column gives total attempts over problems solved, and a final row gives submissions, time of first solve and total solves per problem.

    The leader is alfari9 alkhari9 (133CS) with 10 solved, as is the second team, Emordnilap (EMI). Links to two group boards, MCPC Teens and UM6P, are on the page; those pages are not in our copy. The photo column refers to team images, and these, the style sheets and the scripts are not in our copy.
