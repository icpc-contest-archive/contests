  description: |-
    Final standings of the South Pacific ICPC Regional Finals as a DOMjudge scoreboard, in two categories. Official Participants lists 13 teams and Unofficial Participants lists 7, each ranked separately. Problems are A to K; each row gives the team name, institution with its logo and country flag, number solved and total time, then for every problem the minutes of the solve and the number of tries, or the tries alone when unsolved. First place among the official teams is W[3]-Complete (UNSW Sydney) with 10 problems solved.

    Each category has a summary row giving, per problem, the number of solves, tries, pending submissions and the fastest solve time, and a legend explains the cell colours. The page was last updated on 18 Oct 2026. The page also holds a detail panel for each team with its affiliation, country, category and member names. Our copy is one self-contained file.
