    Standings of the 2026 ICPC South Pacific Independent Regional Contest: 13 teams with rank, team, institution, problems solved, total time (one figure per team), medal and citation. Places 1 and 2 carry Gold Medals, 3 and 4 Silver and 5 and 6 Bronze; places 7 to 13 have no medal. The citations are Regional Champion, Second Place and Third Place for the first three and Regional Finalist for the rest. First place is W[3]-complete (UNSW Sydney) with 10 solved and a total time of 1103. There is no per-problem detail, and the unofficial teams of the scoreboard are not listed.
