    Standings of the Australian teams in the 1998 South Pacific region, as a single web page in English. It opens with a table of the top ten Australian teams, then gives one table for each of seven sites: Adelaide, Brisbane, Canberra, Melbourne, Perth, Sydney and Tasmania. The site tables list 60 teams, one of them marked Withdrew; four Perth teams have no position. Each row gives position, team, institution, accepted solutions and time taken. No per-problem detail. New Zealand teams are not on the page.
