  description: |-
    Standings of the 1998 South Pacific regional contest, a scanned PDF of 4 pages with no text layer, read by OCR. One combined list of 96 teams from Australian and New Zealand institutions, with position, team name, institution, number of problems accepted and time. Ranks run from 1 to 79; the 18 teams with no accepted problem all share rank 79, and two teams tie at rank 37. No per-problem detail.

    The list is ordered by accepted problems and then time. The page footer on the last page reads Saturday, 3 October 1998 with the page number.
