  description: |-
    Regional top 10 of the 1999 South Pacific contest, as a single web page. It names the three teams going to Florida (Australian Champions, Wild Card and New Zealand Champions), thanks IBM for prizes, and gives a table of ten teams with position, team, institution, accepted solutions and time taken; two teams share rank 9. Links lead to separate Australian and New Zealand results pages, which are not part of this page. No per-problem detail.
