  description: |-
    Homepage of the School of Computer and Information Science, Auckland University of Technology, as it stood in October 2008 (the seed page says it was last updated 13 August 2008). Our copy holds 93 files, 79 of them pages: the seed page, pages of a Bachelor of Business course with modules 1 to 9, assignments and exercises, two pages for the Bachelor of Applied Science: Software Development, and directory listings of a CTAN mirror with 13 zip files and four text file lists from it.

    The seed page has a section headed ACM Programming Contests with links to contest information and to an NZ Programming Contest page, but those pages are not in our copy. Nothing in our copy is about the 1999 South Pacific contest.
- url: https://sppcontests.org/archive/1999-icpc-results/
  read: '2026-11-16'
  rubric: 1
  copy: south-pacific/south-pacific-1999/standings/2026-09-01-live-08dda00f/page.html
  title: 1999 ICPC Results - South Pacific Competitive Programming Association
  language:
  - en
  contest_date: '1999-09-18'
  teams: 10
  description: |-
    Archive page of the South Pacific Competitive Programming Association for the 1999 ICPC contest. The Contest Report says the regional contest was held on Saturday 18 September at 9 sites, 7 in Australia and 2 in New Zealand, and names the three teams going to the World Finals: the Australian and Regional Champions (University of Queensland, Bitter, Cynical and Coding), the New Zealand Champions (University of Waikato, Team X) and the Wild Card (University of Melbourne, Mathematician, Lawyer, Physicist). It then gives short accounts from eight of the sites: Tasmania, Dunedin, Auckland, Adelaide, Sydney, Brisbane, Perth and Canberra.

    The Contest Results table ranks the regional top 10 teams with institution, accepted solutions and time taken. Two teams share rank 9. The other teams are not listed, and there is no per-problem detail.
