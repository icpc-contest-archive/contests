    Problem set of the 1999 South Pacific regional contest as one web page in English, with a row of links to Problems A to H at the top and again before each statement. The statements are: Logical Line Counting, Australian Voting, Resistance is Facile, Derivative Arithmetic, Juggling Trams, Type Inference, Isotope Composition and The Game of Tarot. Each of the eight statements gives the input and output rules and a sample input with its sample output; Problem D also shows an alternative sample output. No test data or solutions.
