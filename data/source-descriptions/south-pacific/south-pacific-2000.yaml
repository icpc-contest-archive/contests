    Home page of the South Pacific regional contest, a single short page. It states that the regional contest is now over and offers links to the main ACM contest page, the South Pacific information, history and local rules pages, and the Australian and New Zealand home pages. Only this page is in our copy; the pages it links to are not, and it gives no results, dates or problems.
