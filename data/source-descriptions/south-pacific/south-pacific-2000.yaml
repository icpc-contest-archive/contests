  teams: 10
  description: |-
    Results page of the South Pacific Competitive Programming Association for the 2000 contest: a table of the top 10 teams with position, team, institution, accepted solutions and time taken. Gamma of the University of New South Wales is first with 4 solved in 438; places 2 to 6 also have 4 solved, and places 7 to 10 have 3. It shows no per-problem results and no attempts.

    Below the table is a contest report on the nine sites (seven in Australia, two in New Zealand), which says PC Squared was used for the first time. It lists the Australian champions, the New Zealand champions and two wild cards by university with team members, then gives short accounts from the sites at Adelaide, Auckland, Brisbane, Dunedin, Launceston and Sydney. The page sits inside the association's website, with its menu, a "Proudly sponsored by" line with logos and a photo credit around the text.
