    Problem set of the 2000 South Pacific regional contest: a PDF of 11 pages with eight problems labelled SP2000-A to SP2000-H, in English. They are Most wanted word, Tag Checker, Bouncy Balls, Best Image Layout, Swiss Draw, Calypso, Four in a Line and Discrete Digital Tomography. Each has a statement with input and output format; seven of the eight give a sample input and output under the headings Sample Input and Sample Output, and problem F gives its example under the headings Input and Output. No test data or solutions.
