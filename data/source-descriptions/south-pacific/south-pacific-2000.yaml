    Final standings of the 2000 ACM South Pacific Programming Contest sponsored by IBM as shown on the Baylor ICPC site: 91 teams with rank, institution and team name, and a citation. University of New South Wales (UNSW Express) is Regional Champions. Ranks run 1 to 10 (rank 2 is shared by two teams, so there is no rank 3), then 26 teams share rank 11, 24 teams share rank 37, and 31 teams are listed without a rank as Honorable Mention. Citations also mark site champions for Melbourne, Auckland, Canberra, Adelaide, Launceston, Brisbane and Perth, and the New Zealand champions. It gives no solved counts, times or per-problem results.
