  description: |-
    Section of the ICPC past-regionals pages of the Baylor site for the 2000 ACM South Pacific Programming Contest sponsored by IBM. The front page names the nine host sites (Flinders University in Adelaide, AUT in Auckland, QUIT in Brisbane, as printed, the ANU in Canberra, the University of Otago in Dunedin, RMIT in Melbourne, Murdoch University in Perth, the University of Sydney and the University of Tasmania), gives the contest date as 15 - 16 September 2000, and says winners advance to the World Finals in Vancouver. It links to the regional contest's own home page, which is outside our copy.

    Our copy holds four pages: the front page, a team roster of 91 teams grouped by site, a standings page of 91 teams, and a problem set PDF of 11 pages with eight problems.
