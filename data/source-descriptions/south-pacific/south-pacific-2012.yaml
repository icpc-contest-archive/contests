    Problem set of the 2012 South Pacific programming contest: a PDF of 24 pages, every page an image with no text layer. The cover page notes that different time limits are used for different problems and lists problems A to K with a time limit for each. Problem A takes page 3 and each of B to K takes two pages, 5 to 24; pages 2 and 4 are blank. Each problem has a story, input and output sections and a sample input and output, in English. No test data or solutions.
