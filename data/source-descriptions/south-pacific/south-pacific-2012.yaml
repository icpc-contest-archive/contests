    Final standings of the 2012 South Pacific Programming Contest: 86 teams with rank, team, institution, problems solved and time, plus a Citation column and a Site citation column. The citation column names the places from Regional Contest Winners and Second Place down to Twenty-ninth Place (29 teams) and gives Honourable Mention to the other 57; a few cells have stray letters or the spelling Honorable. Eleven teams carry a Site citation naming a site winner (Sydney, Christchurch, Hobart, Perth, Wellington, Auckland, Melbourne, Brisbane, Adelaide, Dunedin and Invercargill). First place is Brogrammers of The University of Sydney with 8 solved. There is no per-problem detail.
