    Page '2012 ICPC Results' of the South Pacific Competitive Programming Association website, with a short account above the scoreboard: the contest was held at 11 sites across Australia and New Zealand, Brogrammers from the University of Sydney won, and they and The Four Milkmen from the University of New South Wales, in second place, advance to the 2013 World Finals. The account gives the date as Saturday September 18th.

    The scoreboard has 86 teams with rank, team, institution (From), site code, points, time and a cell for each of the problems A to K with two numbers separated by a slash (attempts and, for solved problems, time), then a total. A last row, Submitted/1st Yes/Total Yes, gives counts for each problem. A footnote says the summary data includes school teams as well as regional teams and that the page was last updated Friday, 21 September 2012. The page also carries the association's menu and a sponsor line.
