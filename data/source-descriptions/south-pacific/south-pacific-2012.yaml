  copy: south-pacific/south-pacific-2012/website/2026-09-05-wayback-e3b5da7f
  title: 'ACM South Pacific Region: Index'
  language:
  - en
  description: |-
    Website of the ACM South Pacific Region, captured at many different dates. Our copy holds 150 files, 111 of them pages (HTML and PDF); the others are images, style sheets and icons, and three files (the front address, one image address and the 2012 problems page) hold only an advertising or redirect page with no site content. The home page captured in June 2012 describes the contest, names IBM as sponsor, gives Saturday September 15th as the date of the 2012 Regional Contest and says the 2012 World Finals will be in Warsaw. A home page captured in December 2013 announces the 2013 contest instead. The menu links to results and rules pages, which are not in our copy.

    For 2012 the copy holds the scoreboard page of the Regional Contest, a table of 86 teams with columns A to K. The rest is other years: 55 problem PDFs of the 2002 to 2008 contests (some held twice), a 2002 standings page, a 2010 provisional scoreboard, and 2013 results and scoreboard pages, besides FAQ, preparation, registration, links and newsroom pages and photographs.

    The problems page links to problem sets of 2009 and earlier years; those pages are not in our copy, and for 2009 it holds only two images.
