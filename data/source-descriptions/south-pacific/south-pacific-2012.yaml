    Scoreboard of the 2012 South Pacific regional contest, a page that says it was modified from summary files created by PC^2: 86 teams with rank, team, institution (From), site code, Points (problems solved), Time, and for each of the eleven problems A to K a cell of two numbers separated by a slash, the number of attempts and, where the problem was solved, the time, then a Total column. The last row, Submitted/1st Yes/Total Yes, gives counts for each problem. First place is Brogrammers of Sydney U with 8 problems solved.

    A footnote says the summary data includes school teams as well as regional teams, and the page was last updated Friday, 21 September 2012. Links at the top lead to a results page, outside our copy, and to a school scoreboard, which is not in our copy. The style sheet and masthead image are in our copy.
