  tries: true
  description: |-
    Results page of the South Pacific Competitive Programming Association for 2016, in English. It holds two scoreboards. The Regional Final scoreboard lists 12 teams with rank, team, institution, a score (problems solved, then total time) and, for problems A to K, the number of attempts and the time of the accepted run (a bare number for unsolved attempts, 0 for untried). A summary row follows. Cells are marked as solved first, solved, tried but incorrect or untried, and every team is in the category ICPC (Official). The first place goes to AbishforesT of the University of New South Wales with 11 problems.

    The Divisional Finals scoreboard has the same layout for 69 teams and 12 problems, A to L, with teams that qualified for the Regional Final marked separately from other official teams.

    Above the first scoreboard the page gives the names of the three winning teams and a link to the problem set PDF. Between the two scoreboards it carries the regional director's report and the list of the 12 teams that qualified for the Regional Final.
