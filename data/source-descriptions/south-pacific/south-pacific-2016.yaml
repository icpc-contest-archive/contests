  description: |-
    Problem set of the 2016 South Pacific Regional contest: a PDF of 24 pages in English. The cover reads ACM ICPC South Pacific Regionals, November 26, 2016, and lists eleven problems, A to K, from Anticlockwise Motion to Kiwis vs Kangaroos. It states that the top teams advance to the ACM-ICPC World Finals 2017 and names the judging team of twelve people.

    Each problem has its own statement with a time limit, input and output description and sample input and output, and problems A, B, C and I have figures. The PDF holds statements only: no test data and no solutions.
