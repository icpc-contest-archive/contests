  description: |-
    Website of the South Pacific region's ACM ICPC contests for 2016, in English. Our copy holds 8 pages: the overview page, the Regional Final page, the Western, Central and Eastern Division pages, a problem sets page, and two photo gallery pages (one for the divisional contests, one for the Regional Final).

    The overview page states that the Regional Final took place in Sydney on 25-27th November, sponsored by IBM and WiseTech Global, and that the Divisional Contests were held on Saturday 8th October at 13 sites with three divisions and one problem set. It carries a report from the regional contest director and lists the six teams that qualified from the divisions and the next six that qualified from the scoreboard. The Regional Final page names the first three teams. Each division page lists the teams that qualified from it. The problem sets page links to the divisional and regional problem sets, test data and analyses.

    The scoreboards, problem set files, data files, videos and gallery images are links to other addresses or files that are not part of our copy.
