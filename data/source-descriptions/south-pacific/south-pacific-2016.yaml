  description: |-
    Page of the regional ACM ICPC site for the 2016 Regional Final, in English. It states that the final was held at the University of New South Wales, Sydney, from November 25th to 27th. It names the three top teams in order: AbishforesT and nevered, both of the University of New South Wales, and Monash Epsilon of Monash University, with team members and coaches. The first and third place teams are marked as representing the region at the 2017 World Finals.

    The page links to the scoreboard, the regional contest results, the problems, a photo gallery and four videos (opening, teams, contest, awards). There is no full results table on the page, and the linked scoreboard is not part of our copy.
