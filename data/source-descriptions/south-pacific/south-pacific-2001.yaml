  title: Regional Contest Information
  language:
  - en
  description: |-
    Contest information page of the ICPC regional website for the 2001 ACM South Pacific Programming Contest sponsored by IBM. It names the nine host sites (Flinders University in Adelaide, AUT in Auckland, QUIT in Brisbane, The ANU in Canberra, University of Otago in Dunedin, RMIT in Melbourne, Murdoch University in Perth, University of Sydney, University of Tasmania), gives the contest date as 14 - 15 September 2001, and has links to the team roster, the standings and the problems, plus the regional contest director's contact address.

    Our copy holds three pages: this page, a problem-set page headed '2001 South Africa Regional Problem Set' and a PDF of 12 pages titled 'Third Southern African Regional ACM Collegiate Programming Competition, Problem Set'. The page's problems link leads to these two South African documents, not to the South Pacific problems. The roster and standings links lead outside our copy. Two zip files of test data (from the South African problem set) are also stored.
