  copy: south-pacific/south-pacific-2001/standings/2026-09-01-live-478cb8e9/page.html
  title: 2001 ICPC Results - South Pacific Competitive Programming Association
  language:
  - en
  teams: 15
  description: |-
    Results page of the South Pacific Competitive Programming Association for the 2001 ICPC regional: a contest report followed by results. The report opens with a regional summary (nine sites, seven in Australia and two in New Zealand, the PC Squared contest system, a live scoreboard at seven sites, IBM sponsorship) and names the Australian and New Zealand champions. It then has site reports from Adelaide, Auckland, Brisbane, Canberra, Dunedin, Launceston, Perth and Sydney, some with local result lists.

    The Contest Results table lists the top 10 teams with position, team, institution, accepted solutions and time taken; the winner is Cogitatio of the University of New South Wales with 7 solutions and a time of 926. A second table lists the top five teams of the Perth site (team, university, solutions, time), so 15 teams in all appear in tables. The rest of the field is not listed.
