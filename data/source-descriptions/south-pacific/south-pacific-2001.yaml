  description: |-
    Standings of the 2001 ACM South Pacific Programming Contest sponsored by IBM, as published on the Baylor ICPC site: 87 teams, each with rank, institution and team name, and a citation. 83 teams carry a rank (tied teams share the best rank, for example 11, 15, 29, 52 and 72) and four teams at the end, with no rank, are marked Honorable Mention. Citations name the regional winners, the New Zealand champions and the site champions (Launceston, Melbourne, Canberra, Brisbane, Auckland, Adelaide, Perth), and give the place for others. The first place is the University of New South Wales team UNSW Cogitatio. There are no solved counts, times or per-problem results.
