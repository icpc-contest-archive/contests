  description: |-
    Problem set page of the 2001 South Pacific regional with the judges' commentary. It opens with a general note and a table of the number of teams by problems solved (0 to 7) and a statement that 87 teams made 255 correct submissions, then has one section per problem, P1 to P9, each giving correct solutions, attempts, percent correct and percent of teams solving. Problems 1 to 4 have a short description of what was easy or tricky; problems 5 to 9 say 'To follow - page under construction' in place of the description.

    The problem statements are not on the page; links to the problem PDFs point to files on the author's own disk and lead nowhere. The page has one image.
