  description: |-
    Scoreboard of the 2007 regional contest, produced by CSUS PC^2: 91 teams with rank, team name prefixed by a site code, number solved, total time, and for each of the nine problems A to I the number of attempts and the solve time in minutes (a dash when unsolved). Most team names are followed by the institution in brackets; the 25 Adelaide-site teams have none. First place is AK:UA: Thursday (U Auckland) with 6 problems solved in 1164 minutes. 13 teams solved nothing, and tied teams share a rank. A last row gives submissions, first yes and total yes per problem.

    The page sits inside the navigation of the association's current website, with menu links that lead outside our copy.
