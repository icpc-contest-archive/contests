    Problem set of the 2007 South Pacific contest as one PDF of 21 pages, dated 15/09/2007 in the page footers. A cover page thanks the volunteers who contributed problems and reviewed statements and says the problems are not in order of difficulty. Nine problems A to I follow: Text Formatting, Rating Points Exchange, Self-divisible Numbers, Challenging "Butts", A Fitting Advertisement!, The Zits Code, DNA Chopper, Automatic Marking and Mr. Thompson's Problem. Each has a statement in English with input and output descriptions and example input and output. No test data or solutions.
