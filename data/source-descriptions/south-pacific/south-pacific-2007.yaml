  title: 'ACM South Pacific Region: Regional Results'
  language:
  - en
  contest_date: '2007-09-15'
  problems: 9
  description: |-
    Website of the ACM South Pacific Region, in English. Our copy holds 150 files, 110 of them pages (HTML pages and PDFs), many of them present two or three times under slightly different addresses. It covers the 2007 contest and the 2008 contest, plus pages of the Auckland site for 2007 and 2008 and their photo albums.

    The 2007 part has a report on the contest of Saturday 15 September 2007, held at 10 sites across Australia and New Zealand with 91 teams, including a message from the regional director and a section for each of the ten sites; a results page with champions, the regional top 10 and special recognition; a scoreboard page of 91 teams with rank, team, solved, time and tries/time for problems A to I; a problem set page with statistics for each of the nine problems A to I and a short comment on some of them; the nine problem statements as PDFs; a five-page contest instruction PDF (Team Talk 2007); and a page on the 2007 World Finals in Tokyo.

    Of the Auckland photo albums only the index pages are in our copy; none of their photos or thumbnails is.
