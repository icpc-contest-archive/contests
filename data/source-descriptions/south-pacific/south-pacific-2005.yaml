  description: |-
    Results page of the South Pacific Competitive Programming Association for the 2005 contest, in English. It states that the contest was held on Saturday 17 September at 9 sites across Australia and New Zealand with 87 teams, followed by the regional director's account of the day and photos of the two champion teams. Six site reports follow (Adelaide, Auckland, Canberra, Dunedin, Launceston, Melbourne); the page notes that none came from Brisbane, Perth and Sydney.

    The page ends with a scoreboard of the first ten teams only: rank, name, solved, time, problems A to I and a Total att/solv column. First place is CIA of the University of Auckland with 6 solved and time 580. The remaining teams are not listed.
