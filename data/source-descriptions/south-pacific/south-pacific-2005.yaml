  title: 'ACM South Pacific Region: Regional Results'
  language:
  - en
  contest_date: '2005-09-17'
  problems: 9
  description: |-
    Website of the ACM South Pacific Region contest, in English. For the 2005 contest it has a results page (the Australian and New Zealand champions, a regional top 10 with place, team, university, solutions and time, and a note on the best first-year and second-year teams); a report page with the regional director's note and site reports for seven of the nine sites (none for Perth and Sydney); and a problem set page for the nine problems Dice, Abbreviations, Contest, Orchards, Paths, Rankings, Sudoku (spelled Soduku on the page), Robots and Polycubes, each with submission and solution counts, fastest solution time (blank for Robots and Polycubes, which nobody solved) and a short description, plus a general analysis stating that 87 teams solved a total of 253 problems. The nine statements are PDFs.

    It also holds a provisional final scoreboard with columns A to I, a roster of the 87 teams with coaches, contestants and contact details as of 26 September 2005, and an Auckland section with the Auckland results for 2005. The same site carries the matching pages for 2006, including ten problem PDFs.

    Our copy holds 150 files, of which 107 are pages or PDFs (59 PDF, 45 HTML, 3 HTM); many pages are saved more than once under variant addresses.
