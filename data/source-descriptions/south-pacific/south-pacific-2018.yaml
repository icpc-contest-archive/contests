  description: |-
    Problem set as handed out at the Regional Final: a PDF of 26 pages in English. The cover page is headed ICPC South Pacific Regionals, November 24, 2018, lists the twelve problems A to L from Aligned Typesetting to Laps, and is followed by notes on how answers with a numeric error and results modulo m are judged and by three definitions.

    Each problem starts on its own page with its title and time limit and holds a statement with input and output format and one or more sample inputs and outputs. Eight pages, each following a problem, are marked as intentionally left almost blank. No test data or solutions.
