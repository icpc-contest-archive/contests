    Problem list from Baekjoon Online Judge for the category 2018 ACM South Pacific Programming Contest, filed under ACM-ICPC Regionals, South Pacific. It has 12 problems labelled A to L, numbered 16612 to 16623 on the site, with English titles from Aligned Typesetting to Laps; the site's menus and column headings are in Korean. For each problem the page gives the number of users who solved it, the number of submissions and the acceptance ratio. Statements are not on this page and the linked problem pages are not part of our copy.
