  description: |-
    Results page of the 2018 South Pacific ICPC contests on the website of the South Pacific Competitive Programming Association, in English. It opens with a judges' report on the Regional Finals, then gives the Regional Finals scoreboard: 12 teams and 12 problems A to L, with rank, team, institution, problems solved, total time, and tries per problem with the minute of the solve for solved problems, a summary row, and a legend with the categories World Finals Qualifiers and ICPC Teams. First place is FJCVTZS of the University of New South Wales with 11 problems solved. Download links lead to the regional problem set, the regional editorial and the divisional problem set.

    Under the heading Divisional Finals the page gives the divisional scoreboard in the same format: 81 team rows, seven of them without a rank, with the categories Central, East, West, Unofficial and Self-Registered. The linked files are not part of this page.
