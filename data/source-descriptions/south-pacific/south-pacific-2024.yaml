  title: 2024 ICPC Results - South Pacific Competitive Programming Association
  language:
  - en
  contest_date: '2024-10-20'
  description: |-
    Results page of the South Pacific Competitive Programming Association website for 2024, headed "2024 ICPC Results", in four parts. The Preliminary Finals Report covers the contest of August 31, 2024 and gives the winners of the Level A and Level B problem sets and the Boersen Prize. It is followed by the list of 15 teams invited to the Regional contest of October 20, 2024 at UNSW Sydney, with the basis for qualifying given for several of them.

    The Regional Finals Report says fifteen teams from eight universities competed on October 20 and names the top three: W[3]-Complete (UNSW Sydney) with 11 problems solved, Habibi (University of Melbourne) with 10 and Sunshine Sleepers (University of Melbourne) with 9. The page links the preliminary problem sets and scoreboards, the regional problem set, a full scoreboard and an archived live blog. There is no standings table on the page itself.

    Our copy holds this one page with the site menu; the linked documents are separate files.
