    Standings of the 2024 ICPC South Pacific Independent Regional Contest: 15 teams with rank, team, institution, problems solved, total time (one figure per team), medal and citation. Places 1 to 4 carry Gold, 5 to 8 Silver and 9 to 15 Bronze. The citations name the Regional Champions and the 2025 World Finalists (first and second place), then Third to Seventh Place, Honorable Mention, and Boersen Prize Winners for one team. First place is W[3]-complete (UNSW Sydney) with 11 solved and a total time of 1568. There is no per-problem detail.
