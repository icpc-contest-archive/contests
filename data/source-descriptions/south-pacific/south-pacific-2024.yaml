  description: |-
    Problem set: a PDF of 32 pages in English. The cover is headed "ICPC South Pacific Regional Finals, August 31, 2024" and lists twelve problems A to L, followed by a page of sponsor logos and definitions for answer tolerance, modulo results, lexicographic order, letter case and distance. Each problem has a statement with time limit, input and output format and sample input and output. Several pages, the last one included, carry only a note that they are intentionally left almost blank. No test data or solutions.

    The date on the cover, 31 August 2024, is the date the host's results page gives for the preliminary contest; the host's results page gives 20 October 2024 for the regional finals.
