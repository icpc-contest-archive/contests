    Page of the South Pacific Competitive Programming Association website headed 1994 ICPC Results. It names the New Zealand champion (University of Auckland, The Masked Interrupts, 6 points) with its three members, and the Australian champion (University of Melbourne, 5 points, team name unknown), for which it says the team members are not known and gives two alternative trios of names. A Download link under Contest Results leads to the results PDF. There is no results table.

