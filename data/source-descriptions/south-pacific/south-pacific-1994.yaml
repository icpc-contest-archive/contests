    Problem set as a scanned PDF of 10 pages, each headed "South Pacific Regional Programming Competition 3/12/94". It holds eight problems A to H: Solving puzzles, Erdös numbers, Bacterial Identification, Plumbing Costs, Recurrences, Traffic Lights, Unrandomising Numbers and Bad Luck. Each has a statement in English with input and output description and an example; input is read from files named PROBLEMA.DAT and so on. No test data or solutions.

