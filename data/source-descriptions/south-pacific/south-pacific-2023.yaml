  description: |-
    Standings of the 2023 ICPC South Pacific Independent Regional Contest: 12 teams with rank, team, institution, problems solved, total time (one figure per team), medal and citation. Gold, Silver and Bronze medals go to places 1 to 3 (citations Regional Champion, Second Place, Third Place); places 4 to 12 have no medal and the citation Regional Finalist. First place is Hell Hunt again? (UNSW Sydney) with 11 solved and a total time of 1139. There is no per-problem detail.
