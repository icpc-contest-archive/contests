  description: |-
    Problem set: a PDF of 26 pages in English. The cover page is headed "ICPC South Pacific Regionals, October 1, 2023" and lists twelve problems A to L, followed by definitions for answer tolerance, modulo results, lexicographic order, letter case and distance. Each problem starts on a new page with a statement, time limit, input and output format and sample input and output. Problem L ends on the last page. Two pages carry only a note that they are intentionally left almost blank. No test data or solutions.
