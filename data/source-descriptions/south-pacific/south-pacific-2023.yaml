  description: |-
    Scoreboard produced by DOMjudge, titled "ICPC Regional Contest 2023 preliminary results - not final": 12 teams ranked by problems solved and total time, with problems A to L. Each row gives the team name, institution with a country flag (Australia or New Zealand), the number solved and the time, then for each problem the minutes of the solve and the number of tries, or the tries alone when unsolved. First place is Hell Hunt again? (UNSW Sydney) with 11 problems solved.

    A summary row shows, per problem, the number of solves, tries, pending submissions and the fastest solve time, and a legend explains the cell colours. The page was last updated on 29 Jan 2024. Our copy holds the page with its style sheets and flag images.
