  description: |-
    Results page of the South Pacific Competitive Programming Association website for 2023, headed "2023 ICPC Results". It is an index of downloads in two groups: for the Preliminary Contest, a scoreboard and a problem set PDF for Level A and for Level B; for the Regional Finals, one scoreboard, one problem set PDF and a link to a contest blog. It states no date, place or results itself.

    Our copy holds this one page with the site menu; the linked scoreboards, PDFs and blog are separate documents.
