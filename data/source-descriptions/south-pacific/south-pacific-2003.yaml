  title: 2003 ICPC Results - South Pacific Competitive Programming Association
  language:
  - en
  contest_date: '2003-09-20'
  teams: 96
  description: |-
    Results page of the South Pacific Competitive Programming Association (a later website, not the 2003 original) for the 2003 contest, held on Saturday 20 September at 9 sites in Australia and New Zealand with 96 teams. It names the Australian and New Zealand champions, UNSW-G of the University of New South Wales and The Pumpkin Lemma of the University of Otago, with team members and coaches.

    The page carries the contest report, with sections from eight of the nine sites (Adelaide, Auckland, Canberra, Dunedin, Launceston, Melbourne, Perth and Sydney; none for Brisbane), and a table of 96 teams with rank, team name, university, number solved and score. UNSW-G is first with 8 solved. No per-problem results. The menus and links of the current site are part of our copy.
