- url: http://www.SPPContest.org
  read: '2026-11-16'
  rubric: 1
  copy: south-pacific/south-pacific-2003/website/2026-09-05-wayback-7c7829cc
  title: ACM South Pacific Regional Planning Meeting 2003
  language:
  - en
  description: |-
    Website of the ACM South Pacific Programming Contest, in English, made by the regional organisers. Our copy was captured from the Wayback Machine in snapshots dated October 2003 to 2013 and holds 150 files, 115 of them pages (HTML or PDF; several addresses are saved more than once). The seed page is a photo page of the planning meeting held at the Auckland University of Technology on 20 and 21 June 2003.

    For 2003 it has the results page with the Australian and New Zealand champions, a top ten and special recognition, the final scoreboard (rank, name, solved, score) and a version that adds the university, a contest report with site reports from eight sites (Adelaide, Auckland, Canberra, Dunedin, Launceston, Melbourne, Perth and Sydney; Brisbane is marked as having no report), the problem set page with statistics for problems 1 to 9, the nine statement PDFs and a directory index of the 2003 folder. There are also Auckland site pages for 2003.

    For 2004 it has a results page, a contest report, a problem set page, nine statement PDFs and Auckland site pages, one of them a summary table of attempts and times per problem. Some photo files are held (18 JPEG images), but others, such as the Auckland 2004 photos 9 and the thumbnails, were not fetched.
