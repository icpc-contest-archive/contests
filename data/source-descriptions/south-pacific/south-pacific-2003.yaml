    Page of the ICPC Live Archive online judge, as saved on 17 October 2021, listing the nine problems of the category Regionals 2003, South Pacific: Wacmian Numbers, CD Titles, Caesar Cipher, Water Tanks, Spots, Mobile Phones, Colour Grids, Postal Vans and Tricky Trees, numbered 2731 to 2739. For each it shows total submissions, solving percentage, number of users and the users' solving percentage. Names and judge statistics only: no statements or test data, and the page also holds the archive's menu and login form.
