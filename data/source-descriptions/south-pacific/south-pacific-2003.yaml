  description: |-
    Problem set of the contest as a PDF of 18 pages in English: nine problems, each on two pages. Each has a statement, input format, output format, and a sample input and output. The page footers give the problem number, ACM SPPC and the date Saturday 20 September 2003. The problems start with Wacmian Numbers and CD Titles. There is no cover page, no test data and no solutions.
- url: http://www.sppcontest.org/2003/problems2003.html
  read: '2026-11-16'
  rubric: 1
  copy: south-pacific/south-pacific-2003/problemset/20031008-wayback-1ced4772/problems2003.html
  title: Problem Set 2003
  language:
  - en
  problems: 9
  description: |-
    Problem set page of the regional organisers, in English, last updated September 2003. For each of the nine problems it gives the number of submissions and solutions, the fastest solution, the share of correct submissions and of teams that solved it, a short description of the task and a link to the statement as a PDF. Problem 1, base 6 number conversion, was solved by every team; problem 7, coloured grids, by none.

    A general analysis states 96 registered teams plus one unregistered team in the statistics, a table of teams by number of problems solved, and an average of 3.7 solutions per team. The statement PDFs are separate files and are not part of this page.
