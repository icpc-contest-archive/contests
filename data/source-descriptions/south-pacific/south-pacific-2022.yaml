    Problem set: a PDF of 26 pages in English. The cover page is headed "ICPC South Pacific Regional Finals, December 17, 2022" and lists twelve problems A to L, followed by definitions for answer tolerance, modulo results, lexicographic order, letter case and distance. Each problem has a statement with time limit, input and output format and sample input and output. The last page holds only a note that it is intentionally left almost blank. No test data or solutions.
