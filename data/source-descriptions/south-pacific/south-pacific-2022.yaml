  description: |-
    Results page of the South Pacific Competitive Programming Association website for 2022, under the heading "2022 ICPC Results". It states that the regional finals were hosted by UNSW on Saturday, December 17, 2022, and offers downloads for the schedule, the scoreboard, the problem set, and an archived live blog with photos.

    A report from the Regional Contest Director gives the top three teams of the Level A and Level B divisional finals with institutions and team members, the top all-women team, and a list of the 13 teams invited to the regionals. The Level A and Level B divisional scoreboards and problem sets are linked as downloads. There is no standings table on the page.

    Our copy holds this one page with its site menu; the linked documents are separate files.
