    Standings of the 2022 ICPC South Pacific Independent Regional Contest: 10 teams with rank, team, institution, problems solved, total time (one figure per team), medal and citation. The top three carry First, Second and Third Place medals with the citations South Pacific Champions, Runners Up and World Finalists; places 4 to 10 have no medal and the citation Honourable Mention. First place is Hell Hunt (UNSW Sydney) with 12 solved and a total time of 1338. There is no per-problem detail.
