  description: |-
    Scoreboard produced by DOMjudge, titled "ICPC 2022 South Pacific Regional Finals preliminary results - not final": 10 teams ranked by problems solved and time, with problems A to L. Each team row gives its institution and, per problem solved, the minutes taken and the number of tries; unsolved problems that were tried show their tries. First place is Hell Hunt (The University of New South Wales) with all 12 problems solved.

    A summary at the bottom gives four rows of per-problem totals (including the fastest solve time in minutes), and a legend explains the cell colours (solved first, solved, tried incorrect, pending, untried). The page was last updated on 17 Dec 2022 at 22:21 AEDT. It is a single page printed from a browser.
