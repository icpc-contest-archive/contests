  description: |-
    Editorial for the South Pacific Regional Finals 2019 as slides: a PDF of 24 pages in 16:9 format, in English, with a title slide and slides for all eleven problems A to K, in the order A, D, B, I, J, K, H, C, G, E, F. Each problem has one slide of statistics, an image with no text layer, headed by the problem name and showing counts of submissions, correct submissions, teams attempted and teams correct, judging results and submissions over time, followed by a text slide with the solution as bullet points.

    Eight of the eleven solution slides state the question; problems K, G and F do not. Five give a complexity (I, K, G, E, F). The solution of problem F runs over two slides.
