  description: |-
    Final scoreboard of the South Pacific Regional Final 2019, produced by DOMjudge: 12 teams ranked with team name, institution, number solved and penalty time, then one column for each of the eleven problems A to K. A cell of a solved problem gives the minute of the accepted run and the number of tries; a cell of an attempted but unsolved problem gives the tries only. First place is the University of Western Australia team with 9 problems solved; the total solved over all teams is 72.

    Below the teams a summary row gives, for each problem, the numbers of accepted, rejected and pending submissions and the minute of the first solve. Under the table are a legend of cell colours and a legend of categories (Qualifiers, Other Finalists). The page states that it was last updated on Sat 23 Nov 2019. The problem letters in the header and the results link lead to other servers and are not part of our copy; the style sheets of the page are not in our copy either.
