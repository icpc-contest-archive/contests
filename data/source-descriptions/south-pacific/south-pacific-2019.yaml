    Problem set: a PDF of 24 pages in English. The cover page lists the eleven problems A to K (Amazing Sushi, Bubble Bucket Sort, Cartography, Divisionals Spelling, Entering Rectangles, Fabulous Photos, Grid City, Heroic Heist, Iguana Instructions, Jumping Junipers, Karaoke Meetup), states that the contest has eleven problems over 24 pages and gives the date November 23, 2019. It also holds general definitions, among them error tolerance, modulo answers, lexicographic order and distance.

