  description: |-
    Problem set page of the 2002 South Pacific regional, headed 'ACM South Pacific Region: Regional Results', with a section for each of nine problems. Each section gives submissions, solutions, fastest solution, percent of submissions correct and percent of teams solving, a one or two sentence description of the task and a link to the problem text as a PDF. Problem 1 (house numbers in binary) has 136 submissions and 91 solutions; problem 9 (cuts in a rectangular block of wood) has 7 submissions and 3 solutions. The PDFs themselves are not part of this page; the page's menu links lead elsewhere.
