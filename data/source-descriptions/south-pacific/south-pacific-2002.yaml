- url: http://www.SPPContest.org
  read: '2026-11-16'
  rubric: 1
  copy: south-pacific/south-pacific-2002/website/2026-09-05-wayback-7c7829cc
  title: ACM South Pacific Regional Planning Meeting 2003
  language:
  - en
  problems: 9
  description: |-
    Website of the ACM South Pacific regional contest, holding material of both the 2002 and the 2003 edition. For 2002 it has a results page (Australian and New Zealand champions, regional top 10 and special recognition awards), the final standings (80 ranked teams with solved count and penalty, then 21 teams listed as honourable mentions without figures), a contest report with reports from seven of the nine sites (Adelaide, Auckland, Brisbane, Canberra, Dunedin, Launceston, Sydney; Melbourne and Perth are listed in its menu without a report), and a problem set page with submission statistics and a short description for each of the nine problems. The nine problem statements are in our copy as PDFs. There is also an Auckland site page with a site report and results, a set of Auckland pages with team photos, and a few pages with photos of champion teams.

    The 2003 edition is also in it: planning-meeting pages, results, final standings and scoreboards, a report, a problem set page and nine problem PDFs, and a directory listing of the 2003 files.

    Our copy holds 150 saved files, 109 of them pages (HTML or PDF), many of them saved under two addresses. A few photos linked from the Auckland pages are not in it.
