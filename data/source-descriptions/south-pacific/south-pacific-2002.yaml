  language:
  - en
  teams: 101
  description: |-
    Standings of the 2002 ACM South Pacific Programming Contest sponsored by IBM, from the Baylor ICPC site: 101 teams, each with rank, institution and team name, and a citation. 81 teams carry a rank (tied teams share the best rank) and the last 20 are marked Honorable Mention without a rank. Citations name the Australian champions and runners up, the New Zealand champions and the site champions, and give the place for others. First place is the University of New South Wales team UNSW-ADA. There are no solved counts, times or per-problem results.
