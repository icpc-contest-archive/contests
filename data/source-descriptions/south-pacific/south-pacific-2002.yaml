  title: 2002 ICPC Results - South Pacific Competitive Programming Association
  language:
  - en
  teams: 101
  description: |-
    Results page of the South Pacific Competitive Programming Association for the 2002 ICPC regional: it names the Australian champions (University of New South Wales, team ADA) and the New Zealand champions (University of Auckland, team void), then gives a contest report with seven site reports (Adelaide, Auckland, Brisbane, Canberra, Dunedin, Launceston and Sydney); the Sydney report describes technical problems at that site.

    The Contest Results table lists 101 teams with rank, name (written as site: team), problems solved and penalty. The first three teams each solved 7 problems; ranks are shared between tied teams, and the last three teams solved none.
