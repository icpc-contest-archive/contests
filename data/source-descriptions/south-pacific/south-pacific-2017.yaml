  description: |-
    Results page of the 2017 South Pacific ICPC contests on the website of the South Pacific Competitive Programming Association, in English. It opens with a Judges' Report and the selection steps by which 12 teams qualified for the Regional Final, then gives the Regional Finals scoreboard: 11 teams and 12 problems A to L, with rank, team, institution, solved, total time, and tries and minutes per problem, a summary row, and a legend for official and unofficial categories. First place is AbishforesT of the University of New South Wales.

    Under the heading Divisional Finals the page lists the qualifying teams of the Western, Central and Eastern divisions and the divisional scoreboards in the same format: West with 24 teams, East with 11 and Central with 28. Links to the problem set downloads and the site menu lead to other pages that are not part of our copy.
