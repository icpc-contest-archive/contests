  title: Scoreboard ICPC South Pacific Regional Finals 2017
  language:
  - en
  teams: 11
  problems: 12
  times: true
  tries: true
  description: |-
    Final scoreboard of the Regional Finals, produced by DOMjudge: 11 teams and 12 problems labelled A to L. Each row gives rank, team and institution, the number of problems solved with total time, and for each problem the number of tries and, for solved problems, the minute of the solve (an unsolved problem with attempts shows the number of tries only); cells are coloured by a legend of solved first, solved, tried (incorrect) and untried. A last row, labelled Summary, gives two numbers per problem. A legend distinguishes the categories ICPC (Official) and Unofficial, and the last of the 11 rows has no rank printed. First place is AbishforesT of the University of New South Wales with 10 problems solved. The page ends with the line "Last Update: Tue 28 Nov 2017".

    Team and problem names link to the judging server, which is not part of our copy.
