  copy: south-pacific/south-pacific-2017/website/2026-09-05-wayback-142bade0
  title: 2017 South Pacific Region Contests
  language:
  - en
  description: |-
    Website section for the 2017 South Pacific Region Contests on the organisers' site, in English. Our copy holds 7 pages: the overview page, the Regional Final page, the problem sets page, one page each for the Eastern, Central and Western divisions, and a photo gallery page.

    The overview page reports the Divisional Contest held on Saturday 14th October at 12 sites in three divisions with one problem set, a note from the chief judge on the fastest team, and the two selection steps by which 12 teams qualified for the Regional Final. The Regional Final page says it was held at the University of New South Wales, Sydney, on 24th to 26th November and shows the top four places with team members and coaches. Each divisional page names the cities where the division competed and the teams that qualified. The problem sets page links the divisional and regional problem sets (PDF), their data (zip) and an analysis of the divisional set. The gallery page, headed Albums, shows four albums: Opening, Teams, Contest and Presentation.

    The scoreboards, problem set files and photographs are linked to other addresses and are not part of our copy; the report links lead back to the overview page. Images and style sheets are not saved with the pages.
