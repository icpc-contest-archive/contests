    Category page of the ICPC Live Archive online judge, Root :: Regionals 2006 :: South Pacific, as it was on 27 September 2021. It lists ten problems (2068 PC^3, 2069 Birds of a feather should not play together, 2070 Simple Encryption, 2071 Safe Packing, 2072 The Flat Cupboard, 2073 Wiring Assistant, 2074 Word Find, 2186 Software Dispatcher, 2187 Video Watcher, 2188 The Prank), each with total submissions, solving percentage, total users and solving percentage. The titles link to problem pages that are not in our copy, so no statements are held here. Around the table are the site's menu and a login form.
