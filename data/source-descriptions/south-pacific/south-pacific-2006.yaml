    Scoreboard of the 2006 South Pacific regional contest, headed South Pacific Regional Results, 2006 Regional Contest: 80 teams ranked 1 to 68 (tied teams share a rank), with solved count, total time, and for each of the ten problems A to J the attempts and the solving time, with a dash where there is none. Team names start with a two-letter code and a colon (AD, AK, BR, CN, DN, LA, ML, PE, SY), and some add the university in brackets. A final column headed Total att/solv gives attempts and solutions per team, and a last row gives submitted, first yes and total yes per problem. First place is AD:Team QK with 8 solved and time 756; 13 teams solved nothing. The page says it was created by merging site scoreboards and last updated Friday, 22 September 2006.
