  title: 'ACM South Pacific Region: Regional Results'
  language:
  - en
  contest_date: '2006-09-16'
  problems: 10
  description: |-
    Website of the ACM South Pacific Region contest, in English. For the 2006 contest it has a results page (the Australian and New Zealand champions, a regional top 10 with place, team, university, solutions and time, and a note that the top first-year and second-year teams will be recognised once known); a report page stating that the contest was held on Saturday 16 September at 9 sites with 80 teams, with the regional director's note on the rejudging of five problems and the final top five, a table of eight site winners, and site reports from three sites (Auckland, Brisbane, Launceston) while the other six say no report yet; and a problem set page for the ten problems from PC^3 to The prank, each with submission and solution counts, fastest solution time (blank for Wiring assistant, which nobody solved) and a short description, plus a general analysis of 80 teams solving 236 problems in 1039 attempts. The ten statements are PDFs.

    It also holds a final scoreboard of 80 teams with columns A to J, last updated 4 October 2006; a page on the 2006 World Finals in San Antonio; a Team Talk PDF with guidelines for the teams; and an Auckland section with the Auckland results for 2006. The same site carries pages for 2007, including a report, results, a problem set and nine problem PDFs.

    Our copy holds 150 files, of which 114 are pages or PDFs (55 PDF, 50 HTML, 9 HTM); many are saved more than once under variant addresses.
