    Standings of The 2006 ACM South Pacific Programming Contest sponsored by IBM: 80 teams with university and team name, a citation, number solved and time. 67 teams carry a rank (tied teams share one) and the last 13 are listed as Honorable Mention without rank, solved count or time. The citations name the regional contest winners, the New Zealand winners and the site winners (Sydney, Perth, Brisbane and others) and spell out the place of the other ranks. First place is the University of Adelaide team Team QK with 8 solved and time 990. There are no per-problem results.
