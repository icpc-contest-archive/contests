  description: |-
    Final scoreboard of the Regional Finals produced by DOMjudge: 13 teams, nine problems A to I. Each row gives rank, the team (shown by its university; the two University of Western Australia teams are told apart by team name in brackets), the number solved and the penalty time, then for every problem the number of attempts and, where solved, the solve time with penalty minutes. Ranks run from 1 to 12, with two teams tied at 12. The first-place team is Australian National University with 6 solved. A summary row gives totals per problem, a legend explains the cell colours (solved first, solved, tried incorrect, untried), and the page shows a last-update stamp of 27 Sep 2014 18:14.

    The flag and logo images are in our copy. The links to team pages and to the regional results page lead to other servers.
