  description: |-
    Results page of the South Pacific Competitive Programming Association for 2014. It opens with an account of the Regional Finals: thirteen teams qualified and met in Sydney on 26th September; the winners are Australian National University, runners-up University of New South Wales, third University of Western Australia. The 13 qualifying teams are listed by name and university. The page's only scoreboard is the Eastern Division scoreboard, under a collapsible heading "Regional Scoreboard": 16 team rows (15 ranked 1 to 15, plus one yellow-marked School Team (Unofficial) row ranked 1 on its own), problems A to K, per problem attempts and time, a summary row, a categories legend (Qualifiers, Participants, School Team (Unofficial)), and a note that one qualifier could not attend and was replaced by another team. It is a DOMjudge scoreboard with last update Sun 23rd August 2015.

    The Divisional Contest section has Western, Central and Eastern parts: where each was held, the teams that qualified for the Regional Final (members and coach listed for all but one team), photos, and links to the three divisional problem sets. The Regional Finals scoreboard itself is not on the page, and there is no results table for the Western and Central divisions.
