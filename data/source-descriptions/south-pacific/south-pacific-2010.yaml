  description: |-
    Results page of the South Pacific Competitive Programming Association with two scoreboards produced by CSUS PC^2 9.1.2. One scoreboard lists 59 teams on nine problems A to I; the other lists 5 teams on eleven problems A to K. Each row gives rank, team name, points, time, tries and time for every problem, and a total; most team names carry a site prefix such as SY or PE (two begin with RMIT instead), and many add the institution in brackets. A summary row gives submissions, first solution time and total solutions per problem. First place in the nine-problem board is Macrohard (UNSW) with 8 points and time 834; two teams share rank 58 with no solutions.

    The heading "Regional Contest Scoreboard" sits above the five-team board (A to K, last updated 11 September 2010) and the heading "School Contest Scoreboard" above the 59-team board (A to I, last updated 15 September 2010). The page also carries the association's site menu and sponsor and photo credits.
