  description: |-
    Problem set as a PDF of 18 pages, a scan without a text layer, with the year 2010 in the page headers. It holds nine problems A to I: Sudoku Checker, Time to Balance, Golfing with the Stars, Farmland Redistribution, Cheap Tours, Mt Convenient, Drink Orders, to Sir, with Love and eDoor. Each problem takes two pages. Statements are in English and give the task, the input format and the output format; each of the nine problems has a sample input and output. No test data or solutions.

    Our copy is a scan; the text could only be read by OCR, which is rough in places.
