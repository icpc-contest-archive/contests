    Standings of the 2010 South Pacific Programming Contest: 59 teams with rank, team name, institution, number of problems solved, total time and a citation. Tied teams share a rank (nine teams at 11th place, eleven at 20th, two at 58th). The citation column names the regional winners (Macrohard, UNSW Sydney, 8 problems, time 834), site champions for Perth, Hobart, Auckland, Brisbane, Wellington and Melbourne, New Zealand champions, and otherwise the place in words. No per-problem detail.
