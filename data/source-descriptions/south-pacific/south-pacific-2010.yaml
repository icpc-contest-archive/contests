  description: |-
    Results page of the ACM South Pacific regional contest 2010, in English, stating that the results have been declared final. It names the regional winners and Australian champions (Macrohard, University of New South Wales) and the New Zealand champions (Chimera, University of Canterbury), with team members and coach, and notes that wild cards are issued by ACM in December. A Regional Top 10 table gives place, team, university, solutions and time for ten teams, the first with 8 solutions and time 834. A Special Recognition section names the top first-year team, and a Schools Contest section reports an unofficial contest of 5 secondary-school teams.

    The page links to a scoreboard, official standings, contest report, problem set and school scoreboard, and to other pages of the contest site; those pages are not part of our copy, which holds this one page with its images and style sheet.
