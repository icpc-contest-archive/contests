  description: |-
    One-page scan of the results of the 1993 South Pacific contest, headed "ACM Scholastic Programming Contest, sponsored by AT&T Computer Systems" and "ACM - South Pacific 1993 RESULTS". It lists 16 teams with placing, team number, university, team name, number of questions answered correctly and time in minutes. Otago's Dream Team is first with four questions; Monash is second with four. Two teams share 12th place. No per-problem detail.

    Our copy is an image with no text layer.
