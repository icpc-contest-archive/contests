  description: |-
    Results page of the South Pacific Competitive Programming Association for the 2015 South Pacific ICPC Regional Contest. It says the Regional Final was held on Saturday, September 26, 2015 at AUT's Tech Central, with 12 teams and 11 problems A to K, and that divisional rounds were held on August 23, 2015. It shows a top-three table and a full Regional Final standings table of 12 teams with rank, team, university, country, solved and time. First place is TheNorthernLine of the University of New South Wales with 5 solved. Photos of the Regional Final are included.

    The Divisional Preliminaries section covers the Central division (26 teams), the Eastern division (16 teams) and the Western division (34 teams), each with a table of its top ten teams and a list of the universities taking part. A list of participating universities by country, a contest statistics block (76 teams in the divisional rounds in total) and download links for the regional and the three divisional problem sets close the page.
