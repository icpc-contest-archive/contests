  description: |-
    Final scoreboard of the South Pacific Regional Contest produced by DOMjudge: 12 teams, 11 problems A to K. Each row gives rank, a heart mark, the team name with its university, the number solved and the penalty time, then for every problem the number of attempts and, for solved problems, the solve time. Ranks run from 1 to 12; first place is TheNorthernLine of the University of New South Wales with 5 solved. A summary row gives totals per problem, a legend explains the cell colours, and the page ends with a last-update stamp of Sat 26 Sep 2015 21:42:26 NZST.

    The page has a link to a regional final results page, links to the team pages and a link for problem A on the judging server; those are outside our copy.
