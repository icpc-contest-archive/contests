  description: |-
    Results page of the South Pacific Competitive Programming Association website for the 1992 contest: a table of 13 teams with position, university, team number, number solved and time. Otago NZ 4 is first with 3 problems solved in 623. The other twelve teams solved two or one problem. There is no per-problem detail.

