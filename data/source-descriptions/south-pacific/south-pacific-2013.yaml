  description: |-
    Problem set of the 2013 South Pacific programming contest: a PDF of 25 pages with a text layer. Two cover pages come first: a table of problems A to L with a time limit in seconds for each (SecurePINs, The Large Family, Start-up Network, Clock Splitter, Neocortex order, Some Pretty Peculiar Cells, Mealy's Memoirs, Ninja Pizza, Count the Squares, Yet Another Newspaper Puzzle, Encyclopaedia, Solar Powered Ants), and a list of the messages the contest system DOMJudge gives for a submission. Then come the twelve statements, A on one page (page 3) and each of B to L on two pages (pages 4 to 25); problem K is headed Encyclopaedia of Equality inside. Each statement has input and output sections and a sample input and output. No test data or solutions.
