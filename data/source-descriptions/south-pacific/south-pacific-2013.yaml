  description: |-
    Scoreboard of the 2013 South Pacific regional contest: 88 teams with rank, team name, institution (From), site code, points, time, and one cell for each of the twelve problems A to L. Each problem cell gives two numbers separated by a slash: the number of attempts and, where the problem was solved, the time. A final column gives totals and the last row, Submitted/1st Yes/Total Yes, gives counts for each problem. First place is UNSW1 of U New South Wales with 7 points. Teams from 12 site codes appear.

    The page says it was modified from summary files created by DOMJudge and was last updated Tuesday, 22 October 2013. Links at the top lead to a regional contest page, outside our copy, and to a school contest scoreboard, which is not in our copy.
