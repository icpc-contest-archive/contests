  description: |-
    Website of the ACM South Pacific Region, captured at many different dates. Our copy holds 150 files, 110 of them pages (HTML and PDF); the others are images, style sheets and icons, and two files (the front address and one image address) hold only an advertising or redirect page with no site content. The home page captured in December 2013 says the 2013 Regional Contest takes place on Saturday September 21st and that the 2013 World Finals took place in St Petersburg; the FAQ and registration pages captured in October 2013 also refer to the 2013 contest. The menu links to results and rules pages, which are not in our copy.

    For 2013 the copy holds a results page with the winning teams and a top 10 table, and a scoreboard page from a DOMjudge system hosted at the University of Canterbury, last updated 22 Sep 2013, with 88 regional teams, 2 school teams and 5 guest teams, each section ranked separately. The rest is other years: 55 problem PDFs of the 2002 to 2008 contests (some held twice), a 2002 standings page, a 2010 provisional scoreboard, and FAQ, preparation, registration, links and newsroom pages and photographs.

    The 2013 problems page linked from the results page is not in our copy.
