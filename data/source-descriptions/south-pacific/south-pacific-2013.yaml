    The contest results table has 88 teams with rank, team, institution (From), site code, points, time and a cell for each of the problems A to L with two numbers separated by a slash (attempts and, for solved problems, time), then a total, and a last row, Submitted/1st Yes/Total Yes, with counts for each problem. The page says the data was modified from summary files created by DOMJudge and was last updated Tuesday, 22 October 2013. It also carries the association's menu and a sponsor line.
