  description: |-
    Scoreboard of the 2008 regional contest, modified from PC^2 summary files and last updated 18 September 2008: 88 teams with rank, team name prefixed by a site code and most followed by the institution in brackets, points, total time, and for each of the nine problems A to I the number of attempts and the solve time in minutes (a dash when unsolved). First place is ME:Hi Pat (U Melbourne) with 8 points in 813 minutes. A last row gives submitted, first yes and total yes per problem.

    Above the table, a message from the regional director says the contest was held on Saturday 13 September at 11 sites and that 89 teams competed, and congratulates the Melbourne and Canterbury teams, who go to the World Finals in Stockholm. The page sits inside the navigation of the association's current website, with menu links that lead outside our copy.
