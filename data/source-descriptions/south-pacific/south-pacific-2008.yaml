  contest_date: '2008-09-13'
  problems: 9
  description: |-
    Website of the ACM South Pacific Region, in English, as it stood in May 2010. Our copy holds 150 files, 99 of them HTML pages and PDFs, many saved twice under slightly different addresses. It covers the 2008 and 2009 contests, with pages for the Auckland site.

    The 2008 part has a report on the contest of Saturday 13 September 2008, held at 11 sites across Australia and New Zealand, with the regional director's message and a section for each of the eleven sites; a results page with the champions, the regional top 10 and special recognition; a problem set page with statistics for the nine problems A to I and a short comment on problems A to C; the nine problem statements as PDFs; an archive of the problems with sample data and sample answers; per-site results for Auckland; and a page on the 2008 World Finals in Banff. The confirmed final scoreboard of 88 teams is in the copy as a separate summary page.

    The 2009 pages (report, results, scoreboard, problem set, high school contest summary, Stockholm World Finals page) are in the same copy. Some photo files were not fetched.
