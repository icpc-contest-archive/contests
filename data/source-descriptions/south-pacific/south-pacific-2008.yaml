    Problem set of the 2008 South Pacific contest as one PDF of 23 pages, with the footer ACM-SPPC and the date 13/09/2008 on each page and no cover page. Nine problems A to I follow one another: Being Late, Money Lesson, Explorer's Diary, Pattern Finder, Takeshi Castle, Balanced Races, Smoker's Walk, P2P Currency Service and Currency Shopping. Each has a statement in English with input and output formats and input-output examples. No test data or solutions.
