  description: |-
    Standings of the 2011 South Pacific Programming Contest: 57 teams with rank, team name, institution, number of problems solved, total time, a citation and a site citation. Tied teams share a rank. The citation column names the regional winners (13337 ViSu4L B451c PWN3RZ!11!, UNSW Sydney, 10 problems, time 1025), second and third place, the New Zealand champions and otherwise the place in words; the site citation names the champions of the Sydney, Brisbane, Christchurch, Wellington, Auckland, Perth, Hobart, Melbourne and Adelaide sites. No per-problem detail, and it has fewer teams than the scoreboard of 79.
