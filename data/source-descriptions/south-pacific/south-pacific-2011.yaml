  - en
  teams: 10
  description: |-
    Results page of the ACM South Pacific regional contest 2011, in English, stating that the results are final. It names the regional winners and Australian champions (13337 ViSu4L B451c PWN3RZ!11!, University of New South Wales) and the New Zealand champions (Funrolled Loops, University of Canterbury), with team members and coach, and notes that wild cards are issued by ACM in December. A Regional Top 10 table gives place, team, university, solutions and time for ten teams, the first with 10 solutions and time 1025. A Special Recognition section names the top first-year team, and a Schools Contest section reports an unofficial contest of 3 secondary-school teams.

    The page links to a scoreboard, official standings, a team list, the contest report, the problem set and a school scoreboard; those pages are not part of this page in our copy.
