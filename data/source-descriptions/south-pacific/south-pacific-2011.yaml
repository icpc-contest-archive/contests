  title: 'ACM South Pacific Region: Index'
  language:
  - en
  contest_date: '2011-09-10'
  problems: 11
  description: |-
    Website of the ACM South Pacific Region programming contest, in English, as it stood after the 2011 contest. Our copy holds 115 pages and PDFs (two further saved addresses are a redirect page and an empty placeholder, and several of the pages are bare directory listings of the server), plus 33 images and style sheets. The home page gives the contest format, IBM as sponsor, important dates, ACM chapters and contacts; other pages cover the FAQ, preparation, registration (closed) and a newsroom.

    The 2011 folder holds a results page with the regional top 10, a contest report with notes from the regional director and the chief judge and site reports from nine sites (the Perth and Sydney entries are headings only), a problem set page with submission statistics and a one-line description for each of problems A to K, scoreboards for the regional contest and the schools contest, an Auckland site page, a report on the 2011 World Finals, and eleven problem statement PDFs of one to three pages each. The sample data archive named in the problems directory listing is not in our copy.

    The rest is the series site over several years: 37 problem PDFs from 2002 to 2006, a 2002 standings page and site champion pages for 2002 and 2007, pages of the 2010 folder, and a 2012 scoreboard.
