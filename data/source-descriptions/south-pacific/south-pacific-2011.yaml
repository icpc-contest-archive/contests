  description: |-
    Results page of the South Pacific Competitive Programming Association with the final scores of the contest held on Saturday 10 September 2011: a scoreboard of 79 teams on eleven problems A to K, giving rank, team name, site code, points, time, tries and time for each problem, and a total, with a summary row of submissions, first solution time and total solutions per problem. First place is 13337 ViSu4L B451c PWN3RZ!11! with 10 points and time 1025. A second scoreboard of 3 teams uses the same columns.

    The page also holds the regional director's note, the chief judge's report with the number of teams solving at least one to nine or more problems, and reports on the top teams from the sites. The introduction says 79 teams competed, while the statistics in the chief judge's report refer to 82 teams.
