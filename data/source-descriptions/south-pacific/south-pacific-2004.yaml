    Problem set as a PDF of 18 pages with nine problem statements numbered 3003 to 3011: Jelly, Change, Necklaces, Graphics, Shopping, Trees, Monks, Squares and Colours, in English. The first page of each problem is headed with the region and years (Oceania, South Pacific, 2004/2005), and every page carries a footer with the problem number and title and a page marker. The statements run from one page (Graphics) to three pages (Colours) and give input and output formats and sample input and output. There are no letter labels, no test data and no solutions.

    Our copy is a scan with no text layer; we read it by OCR.
