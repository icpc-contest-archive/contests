  contest_date: '2004-09-18'
  problems: 9
  description: |-
    Website of the ACM South Pacific Region contest, in English, as it stood after the 2004 and 2005 contests. For 2004 it has a results page (Australian and New Zealand champion teams, a regional top 10 with place, team, university, solutions and time, and a note on the best first-year and second-year teams); a report page (regional director's note, a table of the nine site winners, and site reports for eight of the nine sites, none for Perth); and a problem set page for the nine problems Jelly, Change, Necklaces, Graphics, Shopping, Trees, Monks, Squares and Colours, each with submissions, solutions, fastest solution time and a short description, plus a general analysis of how many teams solved how many problems. The nine statements are PDFs of two pages each, except Colours with four.

    The same site holds the matching 2005 pages (results, report, problem set with nine PDFs, a provisional final scoreboard, a team roster) and an Auckland section with the site results for 2004 and 2005, a 2004 Auckland scoreboard with columns A to I, and photo album index pages. The report page states that 100 teams competed on Saturday 18 September at 9 sites across Australia and New Zealand.

    Our copy holds 150 files, 101 of them HTML files or PDFs (47 HTML, 54 PDF), many being the same page saved under variant addresses. The menu pages (home, rules, sites, newsroom) are not in our copy, and the links to the official standings and roster lead to the ICPC site.
