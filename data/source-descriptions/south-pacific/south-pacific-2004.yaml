  description: |-
    Results page of the South Pacific Competitive Programming Association for the 2004 contest, in English. It opens with a note that the contest was held on Saturday 18 September at 9 sites across Australia and New Zealand with 100 teams, followed by the regional director's account of the day. It then shows the Australian and New Zealand champion teams with photos, a table of the nine site winners (site, university, team name, coach, team members), site reports for Adelaide, Auckland, Brisbane, Canberra, Dunedin, Hobart, Melbourne and Sydney, and a scoreboard of the regional top 10 only (place, team, university, solutions, time). First place is UNSW-D of the University of New South Wales with 9 solutions and time 829. The other teams are not listed.
