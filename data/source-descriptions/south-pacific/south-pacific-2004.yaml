  description: |-
    Standings of The 2004 ACM South Pacific Programming Contest sponsored by IBM: 100 teams, each with its university and team name, a citation, the number solved and the total time. 89 teams carry a rank (tied teams share one, for example five teams tied for 11th are followed by rank 16); the last 11 teams are listed without rank, solved count or time and are marked Honorable Mention. The citations name champions and site champions (Australian Champions, Perth Site Champions, Brisbane Site Champions and so on) and spell out the place of lower ranks. First place is the University of New South Wales team with 9 problems solved and time 829. There are no per-problem results and no attempt counts.
