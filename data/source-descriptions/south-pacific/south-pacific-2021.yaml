  description: |-
    Problem set: a PDF of 28 pages in English. The cover page is dated December 11, 2021 and lists the twelve problems A to L (Antiwork, Brand New PC, Cardinal Lanterns, Dog Catcher, Explosive Wiring 2, Fantasy Hockey Trades, Gungle 2, Handy Printer, Incredibly Average, Jack and Jill Jotting Notes, Keyboard, Laser Turrets; problem G is titled Gungle Expert on its own page), stating twelve problems over 28 pages. It opens with a note on answer tolerance and general definitions for modulo answers, lexicographic order, letters and distance.

    Each of the twelve problems has a statement with time limit, input and output format and sample input and output. No test data or solutions.
