    Standings of the 2021 ICPC South Pacific Independent Regional Contest: 16 teams with team name, institution, problems solved and total time. Fifteen teams carry a rank; the last, Trie-O of the University of Auckland, is listed without rank, solved count or time. The first team, Celestial Interface from UNSW Sydney, solved 10 problems. The Medal column gives gold, silver and bronze to the first three teams, and the Citation column names them the South Pacific Regional Champions, Runner Up and Third Place, with Regional Finalist for the others. No per-problem detail.
