  description: |-
    Report on the South Pacific Programming Contest Regional Final of 11 December 2021, a PDF of 3 pages in English, signed by the Regional Contest Director. The text says that 15 teams from 2 countries and 11 universities competed, some on site at universities and some online, with a problem set of twelve problems A to L. It tells the course of the contest: the early leader, the order in which the main teams solved problems, the last hour, and the final order. The winner was the team Celestial Interface (UNSW), followed by Runtime Terror (UNSW) and fightUsUNSW (University of Melbourne).

    Page 2 holds an image of the final scoreboard with rank, team, institution, score and one column for each of the problems A to L, showing tries and minutes, with a summary row. Page 2 and 3 also have photographs of the first three teams with captions. The scoreboard is an image with no text layer.
