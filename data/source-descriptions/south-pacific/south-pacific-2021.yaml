  description: |-
    Page of the South Pacific Competitive Programming Association website with the organisers' report on the Divisional Contest of 16 October 2021. It says that 86 teams from 15 universities in Australia and New Zealand and a number of high schools took part from several countries and formats, that the problem set had 13 problems and every team solved at least two. It names Agents Smith (University of Western Australia) as winner, having solved the whole set in under three hours, and lists the 16 teams that qualified for the Regional Final of December 11, 2021.

    The Regional Finals section has download links for the report and scoreboard and for the problem set; the Divisional Contest section has the report text and download links for its scoreboard and problem set. The page holds no results table.
