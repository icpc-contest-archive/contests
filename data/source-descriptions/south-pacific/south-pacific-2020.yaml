  description: |-
    Website of the South Pacific Programming Contest, in English. Our copy holds 2 pages. The Calendar 2020 page lists the ANZAC competitions of the year (ANZAC 1 to 6), notes that the ICPC World Finals in Moscow are postponed, and gives the South Pacific Regional Contest as October 17 in two divisions: Division 1 is eligible for the World Finals and teams must be on site, Division 2 may register off site and has no World Finals place. It adds that there will be no Regional Final this year because of travel restrictions. The menu links to registration, rules, preparation, schedule, sites, results, winners, history and universities pages, which are not in our copy.

    The second page is the scoreboard of the 2016 Central Division, a DOMjudge board of 21 teams and problems A to L, which belongs to another edition.
