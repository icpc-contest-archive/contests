    Standings of the 2020 ICPC South Pacific Independent Regional Contest: 21 teams with rank, team name, institution, problems solved and total time. The first team, TLE on test case 2020 from UNSW Sydney, solved 11 problems. The Medal column reads Honourable mention for every team. The Citation column gives Regional Contest Winners and 2nd, 3rd and 4th Place to the first four teams and Honourable mention to the other 17; the Site citation column names site winners for Melbourne, Adelaide, Brisbane and Auckland and Honourable mention for the other 17. The teams are those of the Division 1 scoreboard, so the table covers Division 1 only. No per-problem detail.
