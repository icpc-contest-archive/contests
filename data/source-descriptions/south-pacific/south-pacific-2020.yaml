  description: |-
    Problem set of Division 1: a PDF of 26 pages in English. The cover page is dated January 23, 2021 and lists the twelve problems A to L (Allocating Shares, Bartering Stonks, Card Folding, Dank Invader, Encrypting Intervals, Flip Tool, Golden Grove, Hedge Maze, Iguana Date, Judge's Dogged Divination, Keeping Social Distance, Legendary Walking Trails), stating twelve problems over 26 pages. It opens with a note on answer tolerance and six general definitions (modulo answers, lexicographic order, letters, distance, positive numbers, expected value).

    Each of the twelve problems has a statement with time limit, input and output format and sample input and output. No test data or solutions.
