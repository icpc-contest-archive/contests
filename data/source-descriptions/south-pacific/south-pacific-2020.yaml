  description: |-
    Page of the South Pacific Competitive Programming Association website with the organisers' short account of the 2020 contest. It says that in the COVID-19 year there was one large contest with a Division 1 and a Division 2 in place of a divisional contest and a regional contest, and congratulates the teams TLE on test case 2020 (UNSW) and taxiOverflow (University of Melbourne) as the teams to represent the region at the World Finals. The University of Adelaide is mentioned for fielding the most teams.

    Under Regional Finals the page has download links for the scoreboard and problem set of each division. It holds no results table.
