  description: |-
    Problem set as a PDF of 14 pages, in English, headed ACM International Collegiate Programming Contest 2004 México and Central America Region. It holds seven numbered statements: IP Address, Boolean Expressions, Gear Profiles, Lazy Pianist, Grouping Tuples, Power of Cryptography and Factors in Bin-packing Instances. Each statement names the source and input and output files and has an input and output description with examples. No test data or solutions. The same file is on the chapter's website for this contest.
