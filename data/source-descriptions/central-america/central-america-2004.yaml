  description: |-
    Website of the ACM student chapter at ITESM Campus Querétaro, which hosted a site of the Mexico and Central America regional contest, in Spanish. The front pages in our copy are those of the 2006 edition (news, rules, requirements, venues, costs, a schedule for 4 and 5 November 2006, local contest, a 2006 results page and a photo album of the November 2006 contest). The 2004 edition is present as four pages: a table headed Resultado del Concurso Regional de Programación ACM 2004 (89 teams, problems A to G, tries and time per problem), a results report by the regional director on the ninth contest held on Sunday the 7th at four sites, the seven problem statements in English with a PDF version, and an older home page announcing a local contest on 27 March 2004.

    Our copy holds 141 pages. Most of them belong to other sites on the same server (a server manual and further personal and course sites), not to the contest.
