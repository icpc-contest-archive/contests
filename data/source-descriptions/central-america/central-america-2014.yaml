  description: |-
    Blog "ICPC ITESO" (Comunidad de Programación Competitiva del ITESO) of ITESO, Universidad Jesuita de Guadalajara, which hosted the Mexico & Central America regional contest in 2014, written in Spanish. Our copy holds 150 files: 144 pages and 6 images. 26 distinct pages (many saved under both http and https addresses) belong to the ICPC blog; the rest are pages of other ITESO blogs (architecture, environment, the Agora learning blog), including the page the capture starts from, which is unrelated to the contest.

    Five posts of 2014 describe the three stages of the 2014 cycle (programming tournaments from January to October, the Programmers' Battle on 13 September, and the regional contest on 7 and 8 November 2014 at ITESO, held together with the other Latin American regions), the agenda of the Battle, the programming environment (Linux, BOCA 1.5.9, Java and C/C++), payment instructions and the benefits of taking part. A larger group of pages covers the 2015 cycle: host calls, dates, sponsors, agendas, prizes and venues. The menu of the pages also lists later editions up to 2020.

    No results, team list or problem statements of the 2014 contest are in our copy.
