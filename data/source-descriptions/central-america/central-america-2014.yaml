  description: |-
    Problem set of the contest session, a PDF of 16 pages in English. The cover gives November 7th-8th, 2014, states that the set has 11 problems on pages numbered 1 to 14, and lists the countries where the set was used in simultaneous contests, among them México and Panama; it is marked v1.0. A page of general information on program names, input and output follows.

    The eleven problems run from A, Automated Checking Machine, to K, Knights of the Round Table. Each gives its author and the author's university, a statement with input and output sections, and one or more sample inputs with their outputs. No test data or solutions. The selectable text of the cover page is scrambled and does not match the printed cover; the text of the other pages matches the print.
