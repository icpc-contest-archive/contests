    Standings of the 2014 ACM-ICPC Mexico and Central America Finals: 61 teams with rank, team name, institution, number of problems solved, time, medal and citation. Four teams each are marked Gold Medal, Silver Medal and Bronze Medal (ranks 1 to 12); the first place is Peludos of Universidad Autónoma de Aguascalientes with seven problems solved and time 860. Every team has an ordinal citation, First Place to Sixtieth Place; teams with equal results share a rank, so the last rank is 60. There is no per-problem detail.
