  description: |-
    Unofficial final scoreboard of the ICPC Latin-America contest of 08 November 2014 from the BOCA system (release of 09 November 2014): 404 teams from Latin American countries against eleven problems A to K. Each cell gives the number of attempts and the time of the accepted run, with a dash in place of the time for a problem that was tried and not solved; the last column gives problems solved with penalty time in brackets. The first place, [USP] I am Root, solved ten problems; 6 teams solved none.

    The page names 15 tabs: General, Caribbean, NorthRegion, SouthRegion, Mexico_CostaRica and one for each of Brasil, Colombia, Venezuela, Panama, Argentina, Bolivia, Chile, Peru, Cuba and RepDominicana. They are not working links in our copy, and all rows are in one table of 1093 rows: 285 teams appear three times and 119 twice. Teams carry a country code after the user number; 61 of the 404 carry MEXCRC.
