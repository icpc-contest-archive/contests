    Standings page made by the ACM student chapter of ITESM Campus Queretaro for the 6th Annual ACM Central America Programming Contest of October 7, 2001. It lists 54 teams in order of problems solved and then total time, with team number, team name (or institution), total time, number of problems solved and site code (CdM, Mty, Qro, Tor). The leader solved 5 problems in 13:43; the rest solved 4 down to 1, and every listed team solved at least one. Column heads are in Spanish.

