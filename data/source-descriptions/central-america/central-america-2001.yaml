  description: |-
    Standings page for the 2001 ACM Mexico and Central America Programming Contest sponsored by IBM, as named in its heading: 83 teams, each with rank, institution and team name (written as institution=>team name) and a place citation written out in words (First Place to Fifty-fifth Place). Ranks run from 1 to 55 with some ties; the last 30 teams all share rank 55. Top of the list is Instituto Tecnologico de Ciudad Madero (Tec Madero), then ITESM Campus Monterrey (Los Pericos Brujos) and Universidad Autonoma de Nuevo Leon (FCFM1).

