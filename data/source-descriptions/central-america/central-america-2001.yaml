  description: |-
    Contest page from the ICPC past-regionals section of the Baylor site for the 2001 ACM Mexico and Central America Programming Contest, sponsored by IBM, in English. It names the hosts (ITESM Campus Queretaro, Instituto Tecnologico de Cd. Madero, ITESM Campus Mty and Universidad Iberoamericana Plantel Laguna), gives the contest date as 6 - 7 October 2001 and explains that winners advance to the World Finals in Honolulu. It links to the team roster, the standings and the problems.

    Our copy holds 8 files: the front page, the problems page with links to six problem statements as Word documents (all six are in our copy). The roster and standings links lead to other addresses and are not part of it.
