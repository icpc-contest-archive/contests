    Standings of the 2012 Mexico & Central America Regional Contest: 163 teams with rank, team name, institution, number of problems solved, time, medal, citation and a site citation. The first three teams, each with five problems solved, are marked Gold, Silver and Bronce in the medal column; the leading team is Escoders of Escuela Superior De Computo Instituto Politecnico Nacional with time 514. The citation column gives ordinal places and, for 82 teams, Honorable Mention; 30 teams solved no problem and share rank 134. The site citation names the place within a site (for example First Place ITESO) and is filled in for 18 teams only. There is no per-problem detail.
