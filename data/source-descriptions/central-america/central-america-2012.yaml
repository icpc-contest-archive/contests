    Problem set of the ACM ICPC 2012 Latin American Regional Contests, dated November 9th-10th 2012: a PDF of 19 pages, version v1.0, headed Contest Session. The cover says the set contains 10 problems and is used in simultaneous contests in Argentina, Bolivia, Brasil, Chile, Colombia, Cuba, Peru, Mexico, Dominican Republic and Venezuela, so it is shared by all of those regionals.

    A page of general information on program names, input and output follows, then problems A to J, from Arranging Heaps to Joining Couples. Each problem has an English statement with input and output description and a sample input and output. No test data or solutions.
