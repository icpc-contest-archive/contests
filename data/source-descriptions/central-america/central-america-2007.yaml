  - en
  description: |-
    Website of the ACM programming contest of the Mexico and Central America region, run from the computer science faculty (Facultad de Informatica) of the Universidad Autonoma de Queretaro, in Spanish. The first page is headed Regional 2007 and links to the contest results, the contest problems and sample input and output files. The site also has a history of the contest, rules and eligibility, registration, fees, hotel, venue and contact pages and photo albums.

    The results page for 2007 (Ganadores Regional 2007, 'Regional 2007 winners') names the first three places, then gives a position list of 150 teams with university, team name, problems solved and time; 99 teams have a position and the other 51 are listed after them without figures. The problems page links seven PDFs, which are not in our copy. The six problem PDFs that are in our copy are headed 2006, and the agenda, fees and venue pages carry 2008 dates, so the site also covers other editions; it also has the 2009 final ranking.

    Our copy holds 48 pages, a few of them from a survey section of the same server that is unrelated to the contest.
