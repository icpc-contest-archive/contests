  language:
  - en
  teams: 149
  description: |-
    Final standings headed 'The 2007 ACM Mexico and Central America Programming Contest sponsored by IBM': 149 teams, each with rank, institution and team name, citation, number of problems solved and time. The first place is Universidad de Guadalajara (U de G ACM Problem Solvers) with 6 problems solved and time 1142, the second Universidad de Guanajuato with 6 and 1570.

    The citation column spells out the place (First Place, Second Place and so on, up to Sixty-first Place); 16 rows carry a site-level citation instead, such as 4th Place Queretaro Sede. The 89 teams with no problem solved share rank 61 and have no time. There is no per-problem detail and no count of attempts.
