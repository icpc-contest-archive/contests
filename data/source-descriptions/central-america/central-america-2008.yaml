  description: |-
    Website of the ACM programming contest of the Mexico and Central America region, run from the computer science faculty (Facultad de Informatica) of the Universidad Autonoma de Queretaro, in Spanish. The first page is titled 2008 ACM ICPC Mexico y Centro America. For the 2008 regional it has the venues page (Regional 2008, five host sites: ITESO, UAQ Facultad de Informatica, ITESM Campus Queretaro, Instituto Tecnologico de Durango and ITESM Campus Puebla), the agenda for Saturday 1 and Sunday 2 November 2008, fees, registration and hotel pages. It also has a history of the contest, rules and eligibility, and contact pages.

    The results and problem pages in our copy belong to other years: the results page is the 2007 position list, the contest page links the final ranking of the 2009 contest and a PDF problem set of 20 pages for the 2009 Latin American Regional Contests (11 problems), and six problem PDFs are headed 2006. There are no 2008 results or problems on the site in our copy.

    Our copy holds 48 pages, a few of them from a survey section of the same server that is unrelated to the contest.
