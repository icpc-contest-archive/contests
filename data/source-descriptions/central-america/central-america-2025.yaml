  description: |-
    Final scoreboard of the ICPC Latin America Regionals 2025 contest, produced by BOCA. For each team it gives user and site code with country, name with institution tag, tries and time for each of problems A to L, and the total: number solved followed by a number in parentheses. The page repeats teams in many views (Global, Global+CCL, Female Teams, Brasil, Caribbean, CentroAmerica with Costa Rica, Guatemala and El Salvador, Mexico, North, South, CCL and others), so the table has 2218 rows for 593 distinct team accounts; 51 of them are Central America accounts. Thirty-four accounts have ids beginning with ccl; twenty-eight of them have names tagged [CCL]. The names of 44 accounts carry a note that the team qualified for Programadores de America in Chile. Teams that solved nothing are listed at the end.

    The page links to the warmup and contest information sheets, problem sets, time limits, an editors and machines report and BOCA package files. Our copy holds the page with its images and style sheets.
