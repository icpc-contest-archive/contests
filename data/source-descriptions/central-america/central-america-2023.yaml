  description: |-
    Final scoreboard of the 2023 Latin American Regional (LATAM Regional 2023) as produced by the BOCA system: one shared board for all Latin American finals, with 424 distinct teams, 20 of them with logins starting "ccl" (17 of these with names marked [CCL]). Each row gives rank, team login with country code, team name with institution, one cell per problem A to M with attempts and time (or attempts and a dash when unsolved), and total solved with penalty time. The first row is the [CCL] team Atropelamos o Beto, rank 1 with 12 problems solved.

    The page lists the available scores as Global, Global+CCL, Brasil, CentroAmerica (El Salvador, Costa Rica, Guatemala), Caribbean, Mexico, North, South and CCL, and each team appears in the same table three or four times (1557 rows in all), once per view. It links to the information sheets, problem sets, time limits, editorial and BOCA packages of the contest, which are not part of our copy.
