  language:
  - en
  teams: 115
  description: |-
    Final ranking headed 'The 2009 ACM Mexico and Central America Programming Contest Final Ranking': 115 teams, each with rank, a name made of the host site and the team name (itesm, iteso, uaqfi and cuba sites), problems solved and time. The first place is Los punteros of the itesm site with 8 problems solved and time 1089.

    Ranks run from 1 to 115, and tied teams share a rank (for example three teams at rank 81 and two at 111, with none at 112). Every team listed has solved at least one problem; teams with none are not listed. There is no per-problem detail and no count of attempts.
