  description: |-
    Problem set of the 2009 Latin American Regional Contests, Contest Session, version 6, as a PDF of 20 pages in English. The cover gives 23 and 24 October 2009, says the set has 11 problems and is used in simultaneous contests in Argentina, Bolivia, Brazil, Chile, Colombia, Cuba, Peru, Mexico and Venezuela.

    The 11 problems are labelled A to K: Another Crisis, Brothers, Code Lock, Dinner Hall, Electric Bill, File Recover, Grapevine, Hooligan, Isosceles Triangles, Jingle Composing and Klingon Levels. Each has a statement with input and output description and a sample input with its output. No test data or solutions.
