  title: ACM ICPC México y Centro América
  language:
  - es
  - en
  description: |-
    Website of the ACM programming contest of the Mexico and Central America region, run from the computer science faculty (Facultad de Informatica) of the Universidad Autonoma de Queretaro, in Spanish. Its first page is a frame page titled ACM ICPC México y Centro América that has no text of its own in our copy; the contest page (Resultados, Problemas del concurso, Ejemplos de archivos de entradas y salidas) links to the 2009 results. For 2009 the site holds the final ranking page (115 teams with site, team name, problems solved and time) and the 2009 Latin American Regional Contests problem set as a PDF of 20 pages with 11 problems.

    The site also keeps earlier material: a history of the contest, rules and eligibility, registration, fees, venue and hotel pages dated 2008, the 2007 results page, six problem PDFs headed 2006, photo albums, and pages on preparation contests with venues dated 2013. The sample input and output archive linked from the contest page is not in our copy, and the 2007 problems page links seven PDFs that are not in it either.

    Our copy holds 48 pages, a few of them from a survey section of the same server that is unrelated to the contest.
