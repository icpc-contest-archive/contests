  description: |-
    Category page of the Baekjoon Online Judge (acmicpc.net) titled Latin America Regional Contests 2009, with the site's menus in Korean. A table of 13 problems gives the judge's problem number, the contest label, the title, and the counts of accepted and submitted solutions with the acceptance ratio. Eleven rows are labelled A to K (Another Crisis through Klingon Levels) and two are labelled PA and PB (one titled Hexagonal Tiles). Problem E and PA carry Korean titles.

    The page lists the problems only; the statements are on separate pages that are not in our copy.
