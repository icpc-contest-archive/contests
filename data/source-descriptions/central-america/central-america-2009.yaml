  description: |-
    Standings of the 2009 Mexico & Central America Contest: 163 teams, each with rank, team name, institution, problems solved, time and citation. The first place is Los punteros of ITESM Campus Queretaro with 8 problems solved and time 1089, followed by Hausdorff of Universidad de Guanajuato (7 in 720) and UCLV1 of Universidad Central Marta Abreu de Las Villas (7 in 1061).

    The citation column gives the place for the ranked teams, and 64 teams carry the citation Honorable Mention; of these, 48 share rank 116 with no problem solved. There is no per-problem detail and no count of attempts.
