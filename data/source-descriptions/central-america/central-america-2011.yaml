    Problem set of the ACM ICPC 2011 Latin American Regional Contests, dated November 4th-5th 2011: a PDF of 22 pages, marked v1.1. The cover says the set contains 11 problems and is used in simultaneous contests in Argentina, Bolivia, Brazil, Chile, Colombia, Cuba, Peru, Mexico and Venezuela, so it is shared by all of those regionals, not only this one.

    A page of general input and output conventions is followed by problems A to K, from Army buddies to King's Poker. Each has a statement in English with input and output description and a sample input and output. No test data or solutions.
