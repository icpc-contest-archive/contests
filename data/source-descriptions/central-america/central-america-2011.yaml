  description: |-
    Final scoreboard from the BOCA contest system, headed "Latin America Scoreboard - Mexico": 160 teams against eleven problems A to K. Each problem cell gives the number of attempts and the time of the accepted run; a dash in place of the time marks a problem that was tried and not solved, and untried problems are empty. The last column gives problems solved with total penalty time in brackets. The first place solved six problems with penalty time 789.

    Every team is listed twice: once in the overall ranking and once with its rank within its site, so the table has 320 rows. Above the table are entries for Mexico, GDL, QRO, MTY and ZAM, which are not working links in our copy. Team names carry the site as a suffix, and 57 teams with no solved problem are shown as 0 (0).

    The images of the page are not in our copy.
