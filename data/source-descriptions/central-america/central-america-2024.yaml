    Standings of the Central America finals: 45 teams with rank, team name, institution, number of problems solved, time, medal and citation. The first four teams carry Gold Medal, the next four Silver Medal and the next four Bronze Medal; ranks 1 to 22 have an ordinal place as citation and ranks 23 to 44 Honorable Mention. The last two teams, with no problem solved and no time, share rank 44. First place is Todo Es mental of the Alajuela campus of the Instituto Tecnologico de Costa Rica with 4 problems solved. The teams represent 13 institutions. There is no per-problem detail.
