  description: |-
    Final scoreboard of The 2024 ICPC Latin America Contests, produced by BOCA. For each team it gives user and site code with country, name with institution tag, tries and time for each of problems A to L, and the total: number solved followed by a number in parentheses. The page repeats teams in many views (Global, Global+CCL, Brasil, CentroAmerica with Costa Rica, El Salvador and Guatemala, Caribbean, Mexico, SouthAmerica North and South, Female Teams, CCL and others), so the table has 1913 rows for 516 distinct team accounts from 16 countries; 45 of them are Central America accounts. Twenty-two accounts have ids beginning with ccl and names tagged [CCL]. Teams that solved nothing are listed at the end.

    The page links to the warmup and contest information sheets, problem sets, time limits, a PDF of solution sketches and BOCA package files. Our copy holds the page with its images and style sheets.
