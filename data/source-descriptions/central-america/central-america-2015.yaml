  description: |-
    Problem set of the contest session, a PDF of 17 pages in English. The cover gives November 13th-14th, 2015, states that the set has 11 problems on pages numbered 1 to 15, and says it was used in simultaneous contests in eleven countries: Argentina, Bolivia, Brasil, Chile, Colombia, Cuba, México, Panamá, Perú, República Dominicana and Venezuela; it is marked v1.0. A page of general information on program names, input and output follows.

    The eleven problems run from A, At most twice, to K, Keep it energized. Each gives its author, a statement with input and output sections, and between two and five sample inputs with their outputs. No test data or solutions.
