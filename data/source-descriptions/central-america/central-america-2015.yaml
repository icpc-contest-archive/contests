  contest_date: '2015-11-14'
  description: |-
    Website of ICPC ITESO, the competitive programming community of ITESO (Universidad Jesuita de Guadalajara), written in Spanish. Our copy holds 148 pages. Of these, 97 are captures of 36 addresses of the ICPC ITESO blog taken between 2016 and 2020; the other 51 are pages of other ITESO blogs (architecture, Agora and others) that have nothing to do with the contest.

    For the 2015 Mexico and Central America regional contest it has an agenda for Friday 13 and Saturday 14 November 2015 (registration, IBM Day with talks and a Bluemix challenge, a practice contest, the regional contest from 11:00 to 16:00 on the Saturday, preliminary results at 18:00), a page naming the two sites (ITESO in Guadalajara and the Sede Interuniversitaria Alajuela in Costa Rica), the programming environment, payment information, sponsors and a page of prizes. The prize page lists awards for first, second and third place, the fastest team and the winner of the Bluemix challenge; it says the first-place team gets a direct pass to the World Finals in Phuket and the second-place team a wildcard pass. It gives no team names.

    The site also has pages for the 2016 cycle (the Gran Premio qualifying contests, participating teams, a page headed standing of the Gran Premio 2016 that holds no table in our copy, rules for qualifying to the 2016 regional, the 2016 regional site at ESCOM IPN) and a menu of later editions up to 2020. No scoreboard of the 2015 regional is in our copy.
