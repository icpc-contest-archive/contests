    Category page of the Baekjoon Online Judge (acmicpc.net) titled Latin America Regional Contests 2010, with the site's menus in Korean. A table of 13 problems gives the judge's problem number, the contest label, the title, and the counts of accepted and submitted solutions with the acceptance ratio. Eleven rows are labelled A to K and two are labelled PA and PB. Several titles are in Korean (C, D, G, PA, PB) and problem F is titled Tautogram, which differs from the title in the contest's own problem set.

    The page lists the problems only; the statements are on separate pages that are not in our copy.
