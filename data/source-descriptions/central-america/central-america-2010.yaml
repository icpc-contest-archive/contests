  description: |-
    Standings of the 2010 Mexico & Central America Regional Contest: 199 teams, each with rank, team name, institution, problems solved, time and citation. The first place is Manowar of Universidad de Guanajuato - CIMAT with 8 problems solved and time 1176, followed by Olimpo of Universidad de las Ciencias Informaticas (6 in 855) and UH++ of Universidad de La Habana (5 in 416).

    The citation column gives the place for the ranked teams, and 100 teams carry the citation Honorable Mention; 56 of them solved one problem and 44 share rank 156 with none solved. There is no per-problem detail and no count of attempts.
