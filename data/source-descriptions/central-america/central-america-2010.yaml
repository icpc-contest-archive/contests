  description: |-
    Problem set of the 2010 Latin American Regional Contests, Contest Session, version 1.0, as a PDF of 17 pages in English. The cover gives 22 and 23 October 2010, says the set has 11 problems and is used in simultaneous contests in Argentina, Bolivia, Brazil, Chile, Colombia, Cuba, Peru, Mexico and Venezuela. A page of general information on input conditions comes before the problems.

    The 11 problems are labelled A to K: Ants Colony, Bingo!, Cocircular Points, Digits Count, Electric Needs, Flowers Flourish from France, Growing Strings, Hyperactive Girl, Ingenious Metro, Jollo and Kids' Wishes. Each has a statement with a sample input and its output. No test data or solutions.
