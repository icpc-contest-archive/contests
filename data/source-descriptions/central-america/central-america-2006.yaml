  contest_date: 2006-11
  problems: 6
  description: |-
    Website of the ACM programming contest of the Mexico and Central America region, run from the computer science faculty (Facultad de Informatica) of the Universidad Autonoma de Queretaro, in Spanish. It has a welcome page, a history of the contest, rules and team eligibility, registration, fees, hotel and venue pages, an agenda, a contact page, and photo albums of the local contest of 30 September 2006 and of the regional contest of 4 and 5 November 2006.

    For the 2006 edition it holds the final results (Resultados FINALES, Noviembre 2006) with a note on corrections, a page of the six problems with a PDF per problem, and a page of the local contest results of September 2006. The site was kept up in later years: the agenda, fees and venues pages give 2008 dates (1 and 2 November 2008), and it also holds the final ranking of the 2009 contest, a PDF problem set of 11 problems for the 2009 Latin American Regional Contests, and pages on preparation contests with venues dated 2013.

    Our copy holds 48 pages, including a few pages of a survey section of the same server that have nothing to do with the contest. Some pages say they are under construction.
