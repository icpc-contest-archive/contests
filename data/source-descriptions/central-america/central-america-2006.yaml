  description: |-
    Final results page of the host site, headed Resultados FINALES Noviembre 2006 (Final results, November 2006), with a link to a note on changes and a credit to CSUS PC^2 version 8.7. It lists 133 teams with rank, team name (often with an institution abbreviation), number of problems solved and time. The first place is poor dogs : UTM with 5 problems and time 696.

    Ranks run from 1 to 85; the 49 teams with no problems solved share rank 85. There is no per-problem detail and no count of attempts. The linked note (not part of this copy) says the global results were generated again after teams found that solved counts and times differed from their local site results, and that the figures shown are the corrected ones.
