    Problem set as a PDF of 10 pages, in English. Each of the six problems opens with the heading 11th México and Central America, ACM International Collegiate Programming Contest 2006 and its number and title: Encrypting Passwords, Football Foundation (FOFO), Similar Structures, Medium Size Summations (R2D2), The Inheritance and The Explorer. Each has a full statement with input and output description, the name of the input file, and a sample input and output. No test data or solutions.
