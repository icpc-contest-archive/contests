  title: The 2006 ACM Mexico and Central America Programming Contest
  language:
  - en
  teams: 126
  description: |-
    Final standings headed 'The 2006 ACM Mexico and Central America Programming Contest sponsored by IBM': 126 rows, each with rank, institution and team name, citation, number of problems solved and time. The first row is Universidad Tecnologica de la Mixteca (Poor Dogs) with 5 problems solved and time 696.

    Ranks run from 1 to 85, with ties sharing a rank. The first 77 rows carry a citation naming the place (First Place up to Seventy-ninth Place); 44 rows have a rank but no citation, among them the 41 teams that solved no problem and share rank 85. The last five rows have no rank and the citation Honorable Mention. There is no per-problem detail and no count of attempts.
