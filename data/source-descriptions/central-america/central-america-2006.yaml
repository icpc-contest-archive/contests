    Global results page of the Central America regional contest, in Spanish, on the site of the ITESM Campus Querétaro host (heading "Resultados Concurso Regional :: Sede ITESM Campus Querétaro :: Resultados Globales"). One table of 126 team rows with rank, team (university and team name), citation, number solved and time. First place is Universidad Tecnologica de la Mixteca (5 solved, time 696); ranks 2 to 11 solved 4. Citations name places from First to Seventy-ninth; 41 teams with 0 solved and 0 time share rank 85. The last five rows have no rank and are marked Honorable Mention, one of them with the institution given as Prueba (Spanish for 'test'). No per-problem detail. A note says the results were supplied by the central site and complaints go to that site. The page heading names no year.
