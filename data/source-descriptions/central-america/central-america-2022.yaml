  description: |-
    Final scoreboard of the ICPC-LATAM - Latin America - Regional 2022 contest, produced by BOCA. For each team it gives user and site code with country, name with institution tag, tries and time for each of problems A to M, and the total: number solved followed by a number in parentheses. The page repeats teams in several views (Global, Brasil, CentroAmerica, Caribbean, Mexico, North, South, and separate views for teams tagged CCL), so the table has 855 rows for 329 distinct team accounts from 14 countries; seven of them are Central America accounts (sites cacr and cael). Twenty accounts have ids containing ccl; fifteen of them have names tagged [CCL]. Teams that solved nothing are listed at the end.

    The page links to the contest and warmup information sheets, problem sets, time limits, the editorial and BOCA package files. Our copy holds the page and its images and style sheets.
