  description: |-
    Final Scoreboard produced by BOCA, headed LATAM ACM ICPC November 2017, for the Latin American regional contest held jointly by the sites of many countries. It lists 443 distinct teams with rank, a column headed Country User/Site (a user code ending in a country code), team name, thirteen problem columns A to M and a total of problems solved with penalty time in parentheses. Each problem cell shows attempts and the time of the accepted run, or attempts and a dash when unsolved.

    Tabs select Global, regional groups (Caribbean, MexicoCA, NorthRegion, SouthRegion) or one country; all views are in one table, so each team appears in two or three rows: three for most teams, two for the 72 Brazilian teams. Teams are tagged with codes BRA (72 teams), BOL (55), MEX (50), COL (47), ARG (36), CUB (35), PER (34), CHI (32), DOM (26), CRC (18), VEN (16), SAL (16) and PAN (6). The first team in the list, from Brazil, solved 11 problems.
