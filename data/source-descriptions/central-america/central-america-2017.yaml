  contest_date: '2017-11-11'
  description: |-
    Website of ICPC ITESO, the competitive programming community of ITESO (Universidad Jesuita de Guadalajara), in Spanish. Our copy holds 150 files, 135 of them pages. 88 of the pages are captures of 48 addresses of the ICPC ITESO blog taken between 2010 and 2025; the other 47 are pages of unrelated ITESO blogs and home pages. The remaining files are images and sitemaps.

    For the 2017 Mexico and Central America cycle it has the page of the second phase, the regional contest (the seed page), which says the contest runs jointly with the rest of Latin America, with one site per country: Mexico at ITESO, Costa Rica at the Sede Interuniversitaria Alajuela, El Salvador at the Universidad Centroamericana, and Panama. Further pages give the agenda for 10 and 11 November 2017 in Guadalajara, the programming environment (BOCA, with a common problem set and an integrated scoreboard for Latin America), two hotels, payment information, prizes, the steering committee and rules, and the Gran Premio qualifying contests with qualification rules and a page headed cumulative result.

    The site also holds pages for the 2018 cycle of the Mexico region and nine posts from 2009. No scoreboard of the 2017 regional and no problem statements are in our copy.
