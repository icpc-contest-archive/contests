  description: |-
    Page of the ICPC Caribe website, in Spanish, on the ACM regional contests of Mexico and Central America from 1997 to 2016: one section for each of 20 editions, headed 'The 1997 ACM Central America Programming Contest' through 'The 2016 ACM-ICPC Mexico and Central America Finals'. Each section gives the regional director, a podium list that runs down to the last team qualified for the World Finals, and in some cases the problem set, the contest software and remarks.

    The 1997 section is short: the regional director, and one podium entry, the Instituto Tecnologico y de Estudios Superiores de Monterrey, Campus Monterrey (Nuevo Leon, Mexico), with the number solved shown as a question mark and qualified for the 1998 World Finals in Atlanta. It has no scoreboard, problems or full list of teams.
