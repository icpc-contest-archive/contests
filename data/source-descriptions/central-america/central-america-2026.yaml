    Open final scoreboard of the 2026 ICPC Latin America Regional Finals, on a page headed MOJ that also holds the contest facts: start and end on 2026-11-07 (17:00 to 22:00, five hours), ICPC mode, 20 minutes penalty per rejected attempt, freeze at 240 minutes, 563 teams and 6195 submissions. A table lists the 13 problems A to M, Antonia's Ants to Moving Mountains, with the author of each and a link to its statement, and three links lead to PDFs of the problem set, the judging environment and the time limits.

    The scoreboard has 563 rows for all sites: rank, team name with institution tag, tries and time for each of problems A to M, total solved and penalty. Thirty-five rows are teams tagged [CCL] and marked guest; they carry a dash in place of a rank. Some cells carry a star mark, and 83 rows carry a note that the team qualified for the 2027 ICPC Latin America Championship in Monterrey, Mexico, with a reason in parentheses such as performance, country, region, reserve or host. The page notes that the board is open and that the frozen view is on another page.

    Our copy holds this one page with its images. The runs, clarifications, statistics, frozen scoreboard, qualified list and statement pages and the PDFs it links to are not part of it.
