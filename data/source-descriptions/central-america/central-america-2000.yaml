  description: |-
    Page of the ICPC organisation's past-regionals section for the 2000 ACM Central America Programming Contest, sponsored by IBM, in English. It names ITESM Campus Queretaro, Instituto Tecnologico de Cd. Madero and ITESM Campus Mty. as hosts, gives the contest dates as 6 to 8 October 2000, and says the contest drew students from colleges and universities throughout Mexico and Central America, with winners advancing to the World Finals in Vancouver. It links the regional contest's own home page, the team roster, the standings and the problems.

    Our copy holds 4 pages: this page, the roster (teams listed by contest site with their members and coaches, stamped 7/5/2002 5:05 PM Central Time), the standings page and the 8-page problems PDF. The link to the regional home page leads outside the copy.
