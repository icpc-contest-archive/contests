  description: |-
    Scoreboard produced by BOCA, headed Scoreboard - ACM-ICPC LATAM Nov/2016, for the Latin American regional contest in which the sites of many countries took part together. It lists 401 distinct teams with rank, user name (team number and country code), team name, one column for each of ten problems (A to D and F to K, there is no E column) and a total of problems solved with penalty time in parentheses. Each problem cell shows the number of attempts and the time of the accepted run, or attempts and a dash when unsolved.

    Tabs select General, regional groups (Caribbean, NorthRegion, SouthRegion, MexicoCA) or one country; all of these views are in one table, so most teams appear three times in the page's rows (once in each of three views) and the 58 Brazilian teams twice. Teams are tagged with country codes MEX (65 teams), BRA (58), BOL (55), PER (40), COL (37), ARG (33), CUB (28), CHL (25), CRI (24), VEN (17), DOM (15) and PAN (4). The first team, UH++ from Cuba, solved 10 problems.
