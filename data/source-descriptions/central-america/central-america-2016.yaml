  title: ICPC ITESO Comunidad de Programación Competitiva del ITESO
  title_en: ICPC ITESO, Competitive Programming Community of ITESO
  language:
  - es
  description: |-
    Website of ICPC ITESO, the competitive programming community of ITESO (Universidad Jesuita de Guadalajara), in Spanish. Our copy holds 143 pages. Of these, 103 are captures of 52 addresses of the ICPC ITESO blog taken between 2010 and 2024; the other 40 are pages of unrelated ITESO blogs and home pages. The seed page is the 2017 regional phase page; the blog pages mix the 2016 and 2017 cycles with nine posts from 2009 and a front page from 2010 of the earlier ACM ITESO site.

    For the 2016 Mexico and Central America cycle it has pages on the Gran Premio qualifying contests (dates, platforms, coordinators), how teams register, the host sites, a page headed standing to date of the Gran Premio 2016, the steering committee, the rules for qualifying to the regional, and a page headed Sitio del Regional 2016 - Sede México: ESCOM IPN that holds only a link. The qualification page names ESCOM IPN and the Sede Interuniversitaria Alajuela as hosts. The prizes page lists awards for first, second and third place and the fastest team; first place gets a direct pass to the World Finals in Rapid City, second place a wildcard pass.

    No scoreboard of the 2016 regional and no problem statements are in our copy.
