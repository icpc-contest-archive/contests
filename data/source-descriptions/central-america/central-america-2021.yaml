  description: |-
    Scoreboard headed ICPC LATAM - 2021, a BOCA page: 273 distinct teams in selectable views. The view list has Global, Brasil, ccl, Centro America (Costa Rica, El Salvador), Caribe (Cuba and its sites, Dominican Republic), Mexico (mxmx and site codes, four of them marked CCL), North (Venezuela, Colombia) and South (Argentina, Bolivia, Chile, Peru). Per team it gives a user and site id, the name with the institution in brackets, thirteen problem columns A to M with attempts and solve time in minutes, and a total of problems solved with penalty. Teams repeat in several views, so the table holds 756 rows in all. The header links to statistics, runs, clarifications and task lists, and to PDFs for the info sheet, the problem set information, the problem set and the time limits; none of those are part of our copy.
