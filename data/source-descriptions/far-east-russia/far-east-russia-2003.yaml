  description: |-
    Website of the Northern Eurasia (NEERC) contests, in English and Russian: our copy holds 69 distinct pages (150 saved files, because many pages were saved under more than one address), not counting the home address, which only redirects. The page for NEERC 2003 links the final standings, the problems in PostScript and PDF, the jury archive with sample tests and generators, checkers and sample solutions, and a picture gallery (the gallery pages are not in our copy), and lists the regional contests of 2003. One entry on it is Far Eastern Russia, with its final standings; the standings pages of eleven other 2003 regional contests are in our copy as well.

    The site also holds the archive index pages for the years 1996 to 2025 and the 2004 pages with the standings of that year's regional contests. The problems PDF of 2003 is a 13-page document headed ACM ICPC 2003-2004, Northeastern European Regional Contest, dated 26 November 2003, with eleven problems A to K: it belongs to the finals, not to the Far Eastern subregional contest, and no Far Eastern problem statements are in our copy.
