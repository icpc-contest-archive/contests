  description: |-
    Pages of CATS, the programming-contest and teaching system of Far Eastern Federal University, in Russian: 150 pages in our copy, of which 147 are the system's about page saved with different contest numbers, two are its start page (as it stood in 2015 and in 2017) and one lists compilers. Every page carries the system's menu (login, tournaments or courses, problems, console, modules, compilers, keywords, registration). The about and start pages give a welcome text, the length of the judging queue, the number of problems in the system and, except on the 2015 start page, the number of active judging computers. The pages are stamped with last-updated dates from 2015 to 2026.

    No page mentions the year 1998. The 2015 and 2017 start pages say only that ACM championships of the Far Eastern region are held on the system, without naming a contest or a year.
