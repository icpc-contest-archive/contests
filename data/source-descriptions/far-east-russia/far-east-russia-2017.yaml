  description: |-
    Final scoreboard headed Far Eastern Subregional 2017, with the clock at 5:00:00 of 5:00:00 and status over: 28 team rows, eleven problems A to K. Each row gives rank, team name, one cell per problem, the number of problems solved and the total time; team members are not listed. A cell shows a plus with the number of earlier tries (if any) and the time of the accepted run, a minus with the number of rejected tries, or a dot. First place goes to NEFU1 with eight problems solved and a total time of 1618. Teams with the same result share a rank; two teams are ranked 27 with nothing solved.

    Below the table are summary rows per problem, including rejected runs, first accept and last accept.
