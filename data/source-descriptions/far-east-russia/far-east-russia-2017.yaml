  title: Northern Eurasia Contests
  language:
  - en
  description: |-
    Website of the Northern Eurasia Contests (NEERC) archive, in English; it is the series archive, not a site of the Far Eastern contest alone. Our copy holds 150 files, 72 distinct addresses, several of them saved more than once as http, https and port 80 variants. They are a redirect stub for the front address, the archive index, one year page for each year from 1996 to 2025, and the standings pages and PDFs of the 2017 and 2018 seasons; the other years have only their year page.

    The 2017 year page lists the NEERC final and each regional contest, among them Far Eastern Russia, with a link to its standings; for Far Eastern Russia that is the only link. Our copy holds 18 standings pages for 2017, the final and 17 subregional contests including Far Eastern Subregional 2017, and 10 for 2018, the final and 9 subregional contests. The PDFs are the statements and analysis of the 2017 final (14 pages each), the statements (15 pages), analysis (11 pages) and a 101-page problems review of the 2018 final, a zip file of runs of the 2018 final, and Northern and Kazakhstan subregional statements and analyses. No problem statements of the Far Eastern contest are in our copy.
