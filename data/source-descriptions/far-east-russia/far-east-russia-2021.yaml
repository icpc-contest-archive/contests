  description: |-
    Page of the Digital Economy School of the Far Eastern Federal University, in Russian, announcing the ICPC Far Eastern Russia Regional 2021. It gives the regional round as 28 November 2021 at the university campus in Vladivostok, with a qualifier on 17 October 2021, the schedule of both rounds with a practice session and a main round, and notes on how teams qualify, remote participation and the use of the CATS judge. Links on it lead to the CATS judge, the NEERC contest rules and the official ICPC and NEERC sites, which are outside our copy.

    The site is the school's, not the contest's own: our copy holds 59 pages, mostly its master's programmes (cybersecurity, VR and AR, artificial intelligence, remote sensing, digital art), admissions, projects and events. Besides the 2021 version of the ICPC page it holds older versions of the same page for the 2019 and 2020 contests, each with its own dates and instructions to teams. No scoreboard or problem statements are among the pages.
