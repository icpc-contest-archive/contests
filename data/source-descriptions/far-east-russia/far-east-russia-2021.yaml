  description: |-
    Scoreboard of the contest on the CATS judge of the Far Eastern Federal University, titled ICPC 2021, with the interface in Russian. It lists 27 teams in rank order, 22 with the prefix Far Eastern FU, three with Far Eastern STU and two with Vladivostok SUES. Each team has twelve problem columns A to L showing the solve time and the number of failed tries, then problems solved, total time and place; every team has its own place. The best two teams solved eight problems. The status column marks two teams as Gold, three as Silver and two as Bronze. A row above the teams gives successful attempts out of all attempts for each problem. Links to show out-of-contest and virtual participants are present, but our copy shows the view with both hidden. The team rows are written into the page by a script, so the table is filled in only when the page runs scripts. Style sheet and script files are kept with the page.
