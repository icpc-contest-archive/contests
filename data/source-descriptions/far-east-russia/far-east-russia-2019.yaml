  description: |-
    Archive site of the Northern Eurasia Contests (NERC), in English. The 2019 year page lists the finals resources (standings, problems in PDF, jury archive, analysis) and the regional contests, and says that no information is available for Far Eastern Russia and every other subregion listed except Northwestern Russia. Our copy holds 150 files, many of them the same page under http and https addresses. They cover the 2019 finals with standings, a statements PDF and a tutorial PDF, the standings pages of sixteen 2019 subregional contests including a Far Eastern page, Northwestern Russia statements and tutorials, the 2020 year with its standings, statements and tutorials, and the index pages of other years from 1996 to 2025.

    The Far Eastern part is one standings page, titled Far Eastern Regionals 2019, saved under both its http and https addresses.
