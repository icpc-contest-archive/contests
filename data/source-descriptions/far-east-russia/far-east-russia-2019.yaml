  description: |-
    Final standings page titled Far Eastern Regionals 2019, with the contest clock shown as 5:00:00 of 5:00:00 and status over. It is a scoreboard of 40 teams with columns Rank, Team, A to K, solved and time. Each team name is followed by three contestant names in parentheses. A solved problem shows a plus, with the number of earlier rejected tries if there were any, and the solve time; an unsolved problem with tries shows a minus and their number; an untried problem shows a dot. Below the teams are summary rows for total runs, accepted, rejected, first accept and last accept per problem, and a Show time checkbox. The best team solved eight problems, and every team has its own rank. Teams come from Far Eastern FU (26), Far Eastern STU (3), Maritime SU (2), KnASU (1) and eight teams with no prefix. A style sheet is kept with the page.
