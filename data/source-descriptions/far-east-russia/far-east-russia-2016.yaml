  description: |-
    Final scoreboard headed Far Eastern Subregional 2016, with the clock at 5:00:00 of 5:00:00 and status over: 31 team rows, ten problems A to J. Each row gives rank, team name with its three members in brackets, one cell per problem, the number of problems solved and the total time. A cell shows a plus with the number of earlier tries (if any) and the time of the accepted run, a minus with the number of rejected tries, or a dot. First place goes to Far Eastern S Transport U 1 with five problems solved and a total time of 495. Teams with the same result share a rank.

    Below the table are summary rows per problem, including rejected runs, first accept and last accept.
