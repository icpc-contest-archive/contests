  description: |-
    Website of the Northern Eurasia Contests (NEERC) archive, in English; it is the series archive, not a site of the Far Eastern contest alone. Our copy holds 150 files, 59 distinct addresses, several of them saved more than once as http, https and port 80 variants. They are a redirect stub for the front address, the archive index, the year pages for 1996 to 2004, 2016 and 2017, and the standings pages and PDFs of the 2016 and 2017 seasons.

    The 2016 year page lists the NEERC final and each regional contest, among them Far Eastern Russia, with a link to its standings; for Far Eastern Russia that is the only link. Our copy holds 18 standings pages for each of 2016 and 2017, the final and 17 subregional contests, including Far Eastern Subregional 2016 and 2017. The PDFs are the problem statements of the 2016 and 2017 finals (15 and 14 pages), a 49-page problems review of the 2016 final, a 14-page analysis of the 2017 final, and Northern and Kazakhstan subregional statements and analyses. No problem statements of the Far Eastern contest are in our copy.
