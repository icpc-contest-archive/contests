  description: |-
    Website of the Northern Eurasia (NEERC) contests, in English and Russian: our copy holds 71 distinct pages (150 saved files, because many pages were saved under more than one address), not counting the home address, which only redirects. The page for NEERC 2005 links the final standings, the problems in PDF and PostScript, sample tests with sample jury solutions and history data for replaying the contest (these archive files are not in our copy), and lists the 2005 regional contests, among them Far Eastern Russia with its final standings. The standings pages of fifteen other regional contests of 2005 are in our copy as well.

    The site also holds the archive index pages for the years 1996 to 2025 and the 2006 pages with the regional standings of that year. The 2005 problems PDF is a 14-page document headed ACM ICPC 2005-2006, Northeastern European Regional Contest, dated 30 November 2005, with eleven problems A to K: it belongs to the finals, not to the Far Eastern subregional contest, and no Far Eastern problem statements are in our copy.
