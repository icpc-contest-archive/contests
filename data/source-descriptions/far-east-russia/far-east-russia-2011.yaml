  description: |-
    Archive pages of the Northern Eurasia Contests (NEERC) website, in English. The year pages list the NEERC final and, in most years from 2003 on, the regional contests with links to their standings; the Far Eastern Russia contest is among them in the 2011 page. The site covers the whole region, not the Far Eastern subregional alone. Our copy holds 150 saved files, which are 67 distinct addresses, many saved under http, https and port 80.

    The page for 2011 lists, for the NEERC final, standings, problems, TeX sources, tests, an analysis presentation, and generators with jury solutions; of the fifteen regional contests only Northwestern Russia has more than standings (problem statements, tests, jury archive, runs, statements, log). Our copy holds the Far Eastern Subregional Contest standings for 2011, the final standings, the 16-page problem PDF and the 13-page analysis presentation of the NEERC final, the Northwestern Russia problem PDF, and standings of the other regional contests. It also holds the 2012 pages (final standings, problem PDFs, a review PDF, regional standings) and year pages from 1996 to 2018.

    The rar archives linked from the 2011 page are not in our copy.
