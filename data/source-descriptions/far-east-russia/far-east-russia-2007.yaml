  description: |-
    Pages of the Northern Eurasia Contests site (NEERC): 150 files, 69 distinct addresses once http, https and port variants are merged. It is the site of the Northern Eurasia finals and their regional contests, not a site of the Far Eastern subregion alone. It holds the year pages of the archive for every year from 1996 to 2025; 16 standings pages for 2007 and 17 for 2008 (the final and the regional contests, among them the Far Eastern subregional standings of both years); and four problem PDFs: the 2007 finals, the 2007 Northern subregional contest, the 2007 Georgia and Uzbekistan subregional contests, and the 2008 finals.

    This contest appears on the 2007 year page as the Far Eastern Russia entry, with a link to its standings only. The year page also lists the finals' standings, problems, tests, runs and a history download, and problem statements and tests for the Northwestern Russia, Uzbekistan and Georgia entries. The pages are in English.
