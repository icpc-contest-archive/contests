  description: |-
    Archive pages of the Northern Eurasia Contests (NEERC) website, in English. The year pages list the NEERC final and, from 2003 on in most years, the regional contests with links to their standings; the Far Eastern Russia contest is among them. The site covers the whole region, not the Far Eastern subregional alone. Our copy holds 150 saved files, which are 70 distinct addresses, many saved under http, https and port 80.

    The page for 2009 lists, for the NEERC final, standings, problem statements, TeX sources, tests and jury solutions and a monitor program; of the regional contests only Northwestern Russia has more than standings (statements, tests, jury archive, runs, analysis). Our copy holds the Far Eastern Subregional Contest standings of 2009-2010, the final standings and the 13-page problem PDF of the NEERC final, the Northwestern Russia problem PDF and analysis presentation, and standings of the other regional contests. It also holds 2010 pages (standings of the final and the regional contests, and problem and review PDFs) and the year pages from 1996 to 2023.

    The rar archives and PostScript files linked from the 2009 page are not in our copy.
