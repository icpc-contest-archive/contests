    Scoreboard of the contest titled ACM 2009 on a judge system page with a Russian interface: 25 teams in rank order, each with a cell for problems A to I. A cell shows the time of the accepted run (hours and minutes) with + and the number of earlier failed attempts, or - with the number of failed attempts, or a dot. Further columns give the number solved, total time and place; Far Eastern NU 3 is first with seven problems solved. The last row gives, for each problem, successful attempts out of all attempts (problem A 16 of 122).

    The page's status line reads 'актуальное' (current). The copy is the view with out-of-competition and virtual participants hidden, and the page links to the views that show them, which are not in our copy. The team rows are filled in by a script inside the page and are present in our copy.
