  description: |-
    Website of the Northern Eurasia (NEERC) contests, in English and Russian: our copy holds 72 distinct pages (150 saved files, because many pages were saved under more than one address), not counting the home address, which only redirects. The page for NEERC 2004 links the final standings, the problems in PDF, the jury archive (problem statement sources, sample tests and sample jury solutions), history data for watching the contest in progress, the participants' runs and four picture galleries (the archive files and gallery pages are not in our copy), and lists the 2004 regional contests, among them Far Eastern Russia with its final standings. The standings pages of fourteen other regional contests of 2004 are in our copy as well.

    The site also holds the archive index pages for the years 1996 to 2023 and the 2005 pages with the regional standings of that year. The 2004 problems PDF is a 14-page document headed ACM ICPC 2004-2005, Northeastern European Regional Contest, dated 1 December 2004, with twelve problems A to L: it belongs to the finals, not to the Far Eastern subregional contest, and no Far Eastern problem statements are in our copy.
