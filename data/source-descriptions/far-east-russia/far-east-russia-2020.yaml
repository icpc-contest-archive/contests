  description: |-
    Scoreboard of the contest on the CATS judge of the Far Eastern Federal University, titled ICPC 2020, with the interface in Russian. It lists 36 teams in rank order, 17 with the prefix Far Eastern FU, 10 with Far Eastern STU, two with Komsomolsk-on-Amure SU, one with Maritime SU and six without a prefix. Each team has twelve problem columns A to L showing the solve time and the number of failed tries, then problems solved, total time and place; ties share a place, giving 28 distinct places. The best team solved nine problems. A row above the teams gives successful attempts out of all attempts for each problem, and the rule set is shown as ICPC. Links to show out-of-contest and virtual participants are present, but our copy shows the view with both hidden. The team rows are written into the page by a script, so the table is filled in only when the page runs scripts. Style sheet and script files are kept with the page.
