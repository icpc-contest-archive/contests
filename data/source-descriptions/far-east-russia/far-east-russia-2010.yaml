  description: |-
    Website of the Far Eastern quarterfinal of the ACM programming championship, financed by Far Eastern State University, in Russian. Our copy holds two captures of its pages: one from November 2011, whose banner reads Дальневосточный подрегион, 2011 (Far Eastern subregional, 2011), and one from October 2006. The 2011 pages announce the contest of 27 to 30 October 2011 and give its schedule, rules, organising committee and jury, sponsors and a problems page. The 2010 contest appears only in the archive page, which lists the championships from 1998/1999 to 2011/2012; for 2010/2011 it links the problems, final table, tests, attempt history and a schedule page, and none of those targets is in our copy.

    The 2006 capture holds the announcement of the contest of 26 to 29 October 2006, an archive page running to 2005/2006, final results pages for 1999 to 2005, schedules for 2001 to 2006, five PDFs (problems of 1999, 2000 and 2001, a 2001 invitation letter, a 2000 schedule) and other pages of the host's general site.

    Our copy holds 149 saved files, 101 of them pages.
