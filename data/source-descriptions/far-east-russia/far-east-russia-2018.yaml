    Scoreboard of the Far Eastern contest on the CATS judge of the Far Eastern Federal University, titled ACM 2018, with the interface in Russian. It lists 31 teams in rank order. Team names are mostly written as university and team: 18 start with Far Eastern FU, three with Far Eastern STU, two with Komsomolsk-na-Amure SU and two with Maritime SU; the other six have a plain team name. For each team there are ten problem columns A to J showing the solve time and the number of failed tries, then problems solved, total time and place. Two teams solved six problems, the first being Far Eastern FU: Narwhals with a total of 623. A row above the teams gives successful attempts out of all attempts for each problem. The rule set is shown as ICPC and the status as current. Links to show out-of-contest and virtual participants are present, but our copy shows the view with both hidden. The team rows are written into the page by a script, so the table is filled in only when the page runs scripts. Style sheet and script files are kept with the page.
