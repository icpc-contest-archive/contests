  description: |-
    Pages of the Northern Eurasia Contests site (NEERC): 150 files, 69 distinct addresses once http, https and port variants are merged. It is the site of the Northern Eurasia finals and their regional contests, not a site of the Far Eastern subregion alone. It holds the year pages of the archive for every year from 1996 to 2025, and for both 2006 and 2007 16 standings pages (the final and 15 regional contests, among them the Far Eastern subregional standings) and a few problem PDFs: five distinct PDFs, covering the finals and the Northern, and in 2007 the Georgia and Uzbekistan, subregional contests.

    This contest appears as the Far Eastern Russia entry of the 2006 year page with a link to its standings only; of the regional entries on that page only Northwestern Russia also links problem statements and tests. The pages are in English. The page of the series for the Far Eastern region itself is not in our copy.
