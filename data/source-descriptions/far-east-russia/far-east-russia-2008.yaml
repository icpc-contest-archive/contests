  description: |-
    Rank table of the contest titled ACM 2008, with Russian column headings (participant, problems A to H, solved, time, place, status) and the status shown as current. The 28 team rows are held in a script on the page and appear when a browser runs it; each gives the team name (institution followed by a further label), for every problem the solving time in hours and minutes with a plus sign and the number of extra tries, or a minus sign and the number of tries when unsolved, or a dot, then problems solved, total time and place. The first place has six problems and time 1442; places run 1 to 9, and the last 19 teams share place 10.

    A last row, plain HTML, gives per problem the successful attempts over all attempts with a percentage (problem A 3 of 107, problem E 0 of 0).
