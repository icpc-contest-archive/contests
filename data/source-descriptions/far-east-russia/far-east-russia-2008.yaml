  description: |-
    Website of the Far Eastern subregional (quarterfinal) of the ACM student programming championship, season 2008/2009, in Russian, on the server of the Institute of Mathematics and Computer Science of Far Eastern State University. The about page gives the dates 31 October to 2 November 2008 for the student contest and a schoolchildren's championship held alongside, and explains registration and unofficial remote participation through the judge system. The timetable gives the student main round on 1 November from 13:30 to 18:30 local time. A results page holds the student scoreboard: 28 teams, problems A to H, with solving times and tries; its heading reads 2006/2007. Further pages cover the rules (headed 2007/2008), the organising committee and jury, sponsors, and an archive page of problems, final tables, tests and timetables from 1998/1999 to 2008/2009.

    The tasks and teams pages in this copy still describe 2007. Our copy holds 149 files, 106 of them pages: besides the pages above, results pages for 1999 to 2005, timetables of earlier years, five PDFs from 1999 to 2001 (problem sets for 1999, 2000 and 2001, a 2000 timetable and a 2001 invitation), and other pages of the institute's site such as school olympiads, a spring tournament and certification. The 2008 problem statements and test data are on the judge system and are not in our copy.
