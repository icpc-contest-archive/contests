  description: |-
    Final scoreboard headed Far Eastern Subregional 2015, with the clock at 5:00:00 of 5:00:00 and status over: 32 team rows, nine problems A to I. Each row gives rank, team name with its three members in brackets, one cell per problem, the number of problems solved and the total time. A cell shows a plus with the number of earlier tries (if any) and the time of the accepted run, a minus with the number of rejected tries, or a dot. First place goes to North-Eastern FU 1 with seven problems solved and a total time of 905. Teams with the same result share a rank, and nine teams are ranked 24 with nothing solved.

    Two teams carry an asterisk before the name and list no members; the page does not say what the asterisk means. Below the table are summary rows per problem: total runs, accepted, rejected, first accept and last accept.
