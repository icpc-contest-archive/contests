  description: |-
    Website of the Northern Eurasia Contests (NEERC) archive, in English; it is the series archive, not a site of the Far Eastern contest alone. Our copy holds 150 files, 61 distinct addresses, several of them saved more than once as http, https and port 80 variants. They are a redirect stub for the front address, the archive index, the year pages for 1996 to 2008, 2015 and 2016, and the standings pages and PDFs of the 2015 and 2016 seasons.

    The 2015 year page lists the NEERC final and each regional contest, among them Far Eastern Russia, with a link to its standings; for Far Eastern Russia that is the only link. Our copy holds 18 standings pages for each of 2015 and 2016, the final and 17 subregional contests, including Far Eastern Subregional 2015 and 2016. The PDFs are the problem statements of the 2015 and 2016 finals (14 and 15 pages), problems reviews of the two finals (40 and 49 pages), and Northern Subregional statements and analyses. No problem statements of the Far Eastern contest are in our copy.
