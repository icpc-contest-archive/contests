  description: |-
    Archive site of the Northern Eurasia Contests (NEERC), in English. Each year has an archive page that lists the finals and the regional contests with links to standings, problems and tests. The 2012 page has one entry for Far Eastern Russia, "Standings: Contest final standings", which leads to the standings page of the Far Eastern Subregional Contest; no problems or other documents are listed for it.

    Our copy holds 150 saved files, 144 of them pages (HTML and PDF) and six XML files; many appear twice, under http and https addresses, which makes about 99 distinct documents. They cover the archive pages of 1996 to 2015, the final standings of the regional contests of 2012 and 2013, and PDFs of the NEERC 2012 and 2013 problems and reviews and of problems of some regional contests. The site is shared by all editions and regions, so most of it concerns other contests. Links to files that are not part of the capture lead nowhere in our copy.
