  description: |-
    Final scoreboard of 27 teams and ten problems, A to J; the page shows 5:00:00 of 5:00:00 and the status "over". Each team row gives the team name (16 names begin with "Far Eastern FU"; the others carry other abbreviations such as Amur SU, VSUES or MSUN), one cell per problem marked with + or - and a number, or a dot when there was no attempt, the number of problems solved (column "="), the time and the rank.

    The top team solved six problems with a time of 955. Ranks run from 1 to 21, and the last six teams, who solved nothing, share rank 22. No institution column and no medals.
