    Problem list of the contest "ACM 2012" on an online judge of Far Eastern Federal University: ten problems, A to J (Advanced drag racing, Before first zero, Cup and Championship, Diversify start positions, Easy money, Fortunate ticket, Guaranteed win, Hype spreading, Ignition, Judging tires). Problems D, H and I have an "analysis" link next to them, and every problem links to its statement and to a download.

