  description: |-
    Problem list of the contest on the Baekjoon Online Judge, in Korean, filed under ICPC Regionals, Northern Eurasia, Far Eastern Russia Regional Contest. It lists six problems A to F with Baekjoon problem numbers 7864 to 7869. Only problems E (Hamming sequence) and F (Two circles) have titles, with a count of people who solved them, a count of submissions and a correct-answer percentage; problems A to D appear as bare letters and numbers. No statements are on the page.
