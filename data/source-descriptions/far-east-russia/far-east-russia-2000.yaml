  description: |-
    Archive site of the Northern Eurasia (NEERC) contests, not a site of the Far Eastern contest itself. Our copy holds 150 files: 142 HTML pages, some of them the same page under more than one address, and eight zip and rar archives of problems and tests. The pages include a year page for each year from 1996 to 2025, the 2000 and 2001 pages of the regional contests (central, eastern, far-eastern, northern, southern, western, Siberian and East Siberian) and the final standings of the NEERC finals of 2000 and 2001.

    The page for this contest is headed NEERC 2000 Far-Eastern Subregion. It names Vladivostok as host and the Far-Eastern State University as host university, lists the regions taking part, and gives a results table of 31 teams with problems A to F. Each problem cell holds a dot, or a plus or minus sign, usually followed by a number; each team has a problems-solved count, a time and a rank (tied teams share rank 9). There are no per-problem times. A link to the subregion's own home page leads to another server and is not part of our copy.
