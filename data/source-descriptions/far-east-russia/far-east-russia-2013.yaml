  description: |-
    Archive site of the Northern Eurasia Contests (NEERC), in English. Each year has an archive page that lists the finals and the regional contests with links to standings, problems and tests. The 2013 page has an entry for Far Eastern Russia whose link leads to the standings page of the Far Eastern Subregional Contest of that year; no problems or other documents are listed for it.

    Our copy holds 150 saved files, 147 of them pages (HTML and PDF) and three XML files; many appear twice, under http and https addresses, which makes about 96 distinct documents. They cover the archive pages of 1996 to 2014, the final standings of the regional contests of 2013 and 2014 (the 2014 Far Eastern standings included), and PDFs of the NEERC 2013 and 2014 problems and reviews and of problems of the Northwestern regional. The site is shared by all editions and regions, so most of it concerns other contests. Links to files that are not part of the capture lead nowhere in our copy.
