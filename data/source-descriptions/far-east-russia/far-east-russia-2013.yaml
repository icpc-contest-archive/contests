  description: |-
    Final scoreboard of 24 teams and ten problems, A to J; the page shows 5:00:00 of 5:00:00 and the status "over". Each team row gives rank, the team name with its university and the names of its three members, one cell per problem (a + with the number of extra attempts and the time of the accepted run, a - with a number of rejected runs, or a dot), the number of problems solved (column "=") and the total time.

    The top team, from North-Eastern Federal University, solved five problems with a time of 1029. Ranks run from 1 to 21, and the last three teams, who solved nothing, share rank 22. Summary rows at the bottom give total runs, accepted, rejected, first accept and last accept for each problem. A "Show time" control is on the page.
