    Problem list of the contest "ACM 2013" on an online judge of Far Eastern Federal University: ten problems, A to J (Array access, Ball of fir, Compression research, Door and wallpaper, Elite number, Far Eastern Federal Clock, Ganking, Hexes in viewport, IT over the bridge, Jokers). Problem B has an "analysis" link next to it, and every problem links to its statement and to a download.

    Only the list page is in our copy, not the statements, downloads or the analysis behind the links. The page asks the visitor to log in to take part in the contest.
