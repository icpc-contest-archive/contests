  problems: 8
  description: |-
    Website of the 2010 East Central North America regional contest on the regional organisers' site, in English. The home page is a final report: the contest ran on Saturday October 23, 2010 at four sites (Cincinnati, Grand Valley in Allendale, Windsor, Youngstown), with 112 teams from 56 colleges and universities, 8 problems, and 78 teams solving at least one. It also gives the PC^2 version, the start and end times and the teams per site.

    Our copy holds the home page, a page of problem sets, judges' solutions and contest data, a page of detailed final standings (rank, name, solved, time, attempts and time for problems A to H) and the problem set PDF. The standings page stops after 58 rows and the rest of the table is missing. Of the 16 linked data files and 21 judges' solutions, our copy holds 12 data files (all eight inputs, outputs for A, B, E and G) and 9 solution sources.

    The problem set PDF has a cover with the rules, naming IBM as sponsor, and statements of problems A to H on pages numbered 1 to 15, but the file is damaged: its page tree is missing and Ghostscript and pdfinfo cannot open it, though the page text can still be read. The pages for the top 15, the top 5 per site and other awards are not in our copy; the two that were saved show only a request-verification screen.
