  description: |-
    Final scoreboard of the regional contest: 112 teams and eight problems labelled A to H. Each row gives rank, team name with the institution in parentheses, problems solved, total time, the number of attempts and the time of the solving submission for each problem (for example 2/278, and 0/-- or 7/-- where unsolved), and total attempts and number solved. A last row gives, for each problem, the number of submissions, the time of the first yes and the total number of yes answers.

    78 teams solved at least one problem; the 34 teams with none all share rank 79. First place is Waterloo Black (U Waterloo) with 8 solved and a time of 1104. No medals, awards or site marks on the page.
