  description: |-
    Website of the 2014 East Central North America regional contest, in English. The home page is a final report dated 14 November 2014: 140 teams from 61 colleges and universities competed on 8 November 2014 at four sites (Cincinnati, Grand Valley, Windsor, Youngstown), with an account of technical problems on the day, two changes to the standings, and special awards. The menu names pages for registration, rules, fees, contact and general information; they were not found when the site was fetched and are not in our copy, and the four site pages are on other servers.

    Our copy holds 53 files. Three are web pages: the home page, the problem set page, and the final results page with an All Sites table and one table per site. The others are the practice contest and contest problem set PDFs and, for each of the three practice problems PA to PC and the nine contest problems A to I, a test data input file, a test output file and judges' solutions in C++ and Java.
