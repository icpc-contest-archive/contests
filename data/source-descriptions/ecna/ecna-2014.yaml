  description: |-
    Final scoreboard of the 2014 East Central North America programming contest: the All Sites table has 141 team rows, followed by one table for each of the four sites (Cincinnati 37 rows, Grand Valley 27, Windsor 22, Youngstown 54). Columns are rank, team with institution, problems A to I, number solved and score. Each problem cell shows the solve time and the number of tries, or only the tries for an unsolved problem, and is blank when the team did not attempt it. The first place team solved eight problems. Site tables show the site rank with the overall rank in brackets.

    One team row of the All Sites table is in none of the site tables.
