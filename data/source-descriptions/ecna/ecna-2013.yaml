  description: |-
    Problem set of the contest as a PDF of 17 pages. The cover names the four host sites (Grand Valley State University, University of Cincinnati, University of Windsor, Youngstown State University), the date November 9, 2013 and IBM as sponsor, and lists ten rules: nine problems in five hours, C, C++ and Java allowed, input from standard input, communication with the judges through PC2.

    The nine problems A to I follow in English, each with a statement and a sample input and output: Battleships, Cuckoo for Hashing, Playing Fair with Cryptography, Rent-A-Pixel, Stampede!, Super Phyllis, Tree Lighting, The Urge to Merge and Xenospeak. An appendix on the last page is titled 'More Battleships Puzzles For Your Free Time'.
