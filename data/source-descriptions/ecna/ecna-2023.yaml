  description: |-
    Website of the ICPC North America East Central Regional, in English. Our copy holds three pages: the front page and two WordPress sample-post pages (a "Hello world!" post and its category page) that carry no contest content. The front page is headed with the 2024-2025 contest (Sunday, November 10, 2024, registration, sites and fees still marked TBD). Below it is a section for the 2023-2024 contest, dated Saturday, October 21, 2023, with tabs for contest information, judges, practice contest and real contest, a link to the final standings, a problem set file ecna2023-24.pdf and the twelve problems A to L from A Pivotal Question to A (Fast) Walk in the Woods.

    The page lists the regions it welcomes teams from and the judges by region (East Central, Northeast, Greater New York). The links to the standings, the practice contest and the problem set lead outside our copy.
