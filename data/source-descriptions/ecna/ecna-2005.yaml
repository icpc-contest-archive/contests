    Page of links to the problem material of the 2005 ACM ECNA Regional Programming Contest. It names four judges with their colleges and links the real contest problem set, the contest data (input) and output files for problems A to H, and the judges' solutions: A ACM (ACronym Maker), B Countdown, C The Game of Efil, D Queens, Knights and Pawns, E Reliable Nets, F Square Count, G Swamp Things and H Two Ends. Solutions are offered in C/C++ for all eight and in Java for seven; problem D has C/C++ only. The page holds links only; the files they lead to are separate.
