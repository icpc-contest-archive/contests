  description: |-
    Problem set of the real contest, a PDF of 14 pages. The cover names Ashland University, the University of Michigan - Dearborn, Sheridan Institute of Technology and the University of Cincinnati, gives November 5, 2005 and IBM as sponsor, and lists eight rules: eight questions in five hours, standard input and output, C, C++ or Java, and communication with the judges through PC2. Problems A to H follow in English: ACM (ACronym Maker), Countdown, The Game of Efil, Queens, Knights and Pawns, Reliable Nets, Square Count, Swamp Things and Two Ends. Each has a statement with input and output description, and eight sample inputs appear in the document. No test data or solutions.
