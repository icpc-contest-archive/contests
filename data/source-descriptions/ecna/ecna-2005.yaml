  problems: 8
  description: |-
    Website of the 2005 ACM East Central North America Regional Programming Contest, in English. Our copy holds 21 files: a final report, a page of problem sets, judges' solutions and data, the final standings, the problem set as a PDF, seven contest input files, two output files, seven solution files and one small image. The final report, headed November 5, 2005, tells that 113 teams from 65 colleges and universities took part at four sites (Ashland, Cincinnati, Michigan and Sheridan), that the contest ran on PC^2 version 8.6 with no technical problems from 10:08:48 to 15:08:48 EST, that it had 8 problems and that 57 teams solved at least one. It lists the top 10 teams with institution, problems solved and total time.

    The problem sets page links the problem set, the contest data and output for problems A to H, and the judges' solutions to the eight problems in C/C++ and, for seven of them, Java. Our copy has input files for problems B to H, output files for B and G, and seven of the fifteen solution files (Java for A, B, C, E and F; C/C++ for E and F), so most of what the page links is missing.
