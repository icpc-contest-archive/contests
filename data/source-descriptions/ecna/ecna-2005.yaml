  description: |-
    Final standings of the 2005 ACM East Central North America Regional Programming Contest: a scoreboard of 132 teams against eight problems A to H. Each row gives rank, team name (most followed by the institution), and for each problem the number of attempts and the minute of the accepted run (a slash separates them; an unsolved problem shows attempts followed by two dashes), then problems solved and penalty time. Waterloo Black from the University of Waterloo is first with 8 problems solved and 671 penalty minutes. 57 teams solved at least one problem, with tied teams sharing a rank; the other 75 teams share rank 58. All sites are in one table and it does not say which site a team played at.
