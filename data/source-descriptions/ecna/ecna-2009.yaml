  language:
  - en
  contest_date: '2009-10-31'
  problems: 8
  description: |-
    Website of the 2009 ACM-ICPC East Central North America Regional Programming Contest, in English. Its front page is the final report on the contest held on Saturday, October 31, 2009: 115 teams from 60 colleges and universities took part and five more registered teams were cancelled. It was a distributed contest at four sites (Cincinnati, McMaster in Hamilton, Michigan in Ann Arbor, Youngstown) run with PC^2 version 9.1.3. The report says one test case of problem B violated the specification and that a retest moved two teams up the standings, gives eight problems with 91 teams solving at least one and eight as the most solved, notes that two teams were disqualified for using electronic devices, and lists the top 15 teams with institution, team name, problems solved and total time in minutes.

    Our copy holds four pages: the report, a page of problem sets, judges' solutions and contest data, the final standings (a scoreboard of 113 teams against problems A to H), and the problem set as a PDF of 15 pages. It also holds the 23 distinct judges' solution files linked from the problems page, in C++ and Java (the second C++ link for problem G points to the file of problem F).

    The contest input and output data files linked from the problems page are not in our copy.
