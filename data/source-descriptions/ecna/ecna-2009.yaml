    Final scoreboard of the 2009 ACM-ICPC East Central North America Regional Programming Contest: 113 teams, each with rank, team name with an abbreviated institution in parentheses, one cell for each of problems A to H, number solved and penalty. A cell gives the number of attempts and the minute of the accepted run, for example 1/88; an unsolved problem with attempts shows -- in place of the minute, and a cell is blank when the team made no attempt. 91 teams solved at least one problem, four teams solved all eight, and the 22 teams with none are all ranked 92. First place is Waterloo Black of the University of Waterloo with 8 solved and penalty 833, followed by Dragons and Tartans of Carnegie Mellon. No medals or unofficial-team marks appear on the page.
