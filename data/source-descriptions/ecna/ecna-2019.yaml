  title: The 2019 ICPC East Central North America Regional Programming Contest
  language:
  - en
  contest_date: '2019-10-26'
  problems: 11
  description: |-
    Website page set of the 2019 ICPC East Central North America Regional Programming Contest, in English. The front page is headed "Preliminary Report and Results" and dated October 27, 2019, and says the final report is forthcoming. It states that the contest was distributed over four sites, with 26 teams from 11 schools at Cincinnati, 22 from 8 at Grand Valley, 24 from 8 at Windsor and 43 from 16 at Youngstown, that there were 11 problems, that 89 teams solved at least one and that the best team solved 11. It describes two issues: bad test cases in problem B (Bio Trip), removed with all submissions rejudged and no change in the standings, and two problems that did not give the number of decimal places, handled by a clarification. It links to the final standings and to the problem sets, test data and judges' solutions.

    A second page lists the six practice problems A to F and the eleven contest problems A to K with a ZIP download for each. Our copy holds 22 files: the two pages, two PDF problem sets (the practice set of 14 pages, the contest set of 24 pages with a cover dated October 26, 2019 and the problem list A to K), the 17 ZIP files, all of which open, and one image. The menu links to registration, rules, fees, contacts and the four contest site pages lead to pages that are not in our copy.
