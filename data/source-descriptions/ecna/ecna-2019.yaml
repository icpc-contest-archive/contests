  problems: 11
  description: |-
    Problem set page of the contest, headed "Problem Set, Solutions and Test Data". The page title and the alt text of its banner image read 2018, although the problems are those of 2019 and the page says it was last updated 27 October 2019. It holds two tables, each row with a problem label, a title and a ZIP link: six practice problems A to F (Chopping on Line to This Problem's a Slam Dunk) and eleven contest problems A to K, from Retribution! to Where Have You Bin?. It links a PDF problem set for the practice contest and one for the contest.

    Our copy of this page holds the page and its banner image; the ZIP files and the PDFs it links to are not part of it.
