  description: |-
    Standings of the East Central North America regional contest: 115 teams with rank, team, institution, problems solved, time, medal, citation and site citation. The institutions are 44 universities and colleges. Waterloo Gold from the University of Waterloo is first with 11 solved and time 1394, followed by Waterloo Red with 10 and Waterloo Black with 10. Four teams carry a gold medal, four silver and four bronze; 51 more are marked Ranked with a place and 52 are marked Honorable. The site citation column names a contest site (Windsor, Cincinnati, Youngstown, Grand Valley) for one team each. No per-problem results.

    One row is out of line with the rest: GV Blue of Grand Valley State University, with 0 solved and time 0, is marked Honorable at rank 9, the same rank as Victors with 7 solved.
