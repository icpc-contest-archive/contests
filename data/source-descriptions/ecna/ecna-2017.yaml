  description: |-
    Final standings of the 2017 East Central NA Regional Contest: 139 teams with rank, team name, institution, problems solved, total time and a citation. Ranks run from 1 to 134; the only tie is rank 134, shared by six teams with no problem solved. The first 69 rows carry an ordinal place as citation (First Place to Sixty-ninth Place) and the other 70 are marked Honorable Mention. The 139 teams come from 49 institutions. University of Waterloo teams take the first three places with 9 problems solved. The page has no per-problem results, and it does not state a contest date.
