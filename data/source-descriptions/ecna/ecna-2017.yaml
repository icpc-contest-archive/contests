    Final scoreboard of the 2017 East Central NA Regional Contest on Kattis: 139 teams with rank, team name, problems solved and total time, and for each of the ten problems A to J the number of attempts and the minute of the accepted run (or attempts without a solve). Ranks run from 1 to 134 with ties at the bottom. Waterloo White is first with 9 solved and 924 minutes, ahead of Waterloo Black and Waterloo Red. Solved, attempted and first-to-solve marks are shown. A filter lists all teams or the Cincinnati, Grand Valley, Windsor and Youngstown sites. The page states that the contest is over and gives its start and end as 16:00 to 21:00 CEST on 2017-10-28.

    The page also carries the Kattis menu and a login link.
