    Problem set page of the 2017 East Central North America Regional Programming Contest, headed Problem Set, Solutions and Test Data. Two tables list the six practice problems (A to F) and the ten contest problems (A to J) with title and a ZIP link for each; the ZIP files themselves are not part of this page. The practice problems are Arggggggh!, Every Second Counts, Is Everybody Appy?, KaBlam!, Life Savings and Treating Fractions Irrationally; the contest problems run from Abstract Art to Workout for a Dumbbell. The page also names four judges with their institutions and links to the 14-page practice and 22-page contest PDFs. In the contest table the last problem, Workout for a Dumbbell, is labelled I like the one before it, as printed on the page.
