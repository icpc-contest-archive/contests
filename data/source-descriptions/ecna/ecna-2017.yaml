    Problem set of the 2017 ECNA Regional Contest as handed out: a PDF of 22 pages. The cover gives the date as October 28 and lists problems A to J (Abstract Art, Craters, DRM Messages, Game of Throwns, Is-A? Has-A? Who Knowz-A?, Keeping On Track, A Question of Ingestion, Sheba's Amoebas, Twenty Four, Again, Workout for a Dumbbell). The second page names Grand Valley State University, University of Cincinnati, University of Windsor and Youngstown State University as hosts, gives October 28, 2017 as the date, states sponsorship by IBM, and holds the rules (ten problems in 5 hours; C, C++, Java, Python 2 and Python 3).

    Each problem has a statement in English with input and output sections and at least one sample input with its output. Pages 6, 8, 20 and 22 are marked as intentionally left blank.
