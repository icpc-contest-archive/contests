  contest_date: '2017-10-28'
  problems: 10
  description: |-
    Website pages of the 2017 East Central North America Regional Programming Contest, in English. The front page is a final report dated 4 November 2017: the contest ran on 28 October 2017 as a distributed contest at four sites (Cincinnati, Grand Valley, Windsor, Youngstown) with 139 teams from 49 colleges and universities, ten problems, and 133 teams solving at least one. It also gives notes on the contest software, three issues during the contest, and a list of special awards, and links to the final standings.

    The problem set page lists the ten contest problems A to J and six practice problems A to F, each with a ZIP file holding the statement, sample and secret test data and judges' solutions. Two PDFs are included: the 22-page contest problem set and the 14-page practice problem set. Our copy holds 21 files: two web pages, the two PDFs, 16 ZIP files and one image. The menu links to registration, rules, contact, fees, general information and the site pages lead to pages that are not in our copy, and the scoreboard link leads to another server.
