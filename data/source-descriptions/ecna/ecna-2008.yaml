    Final scoreboard of the 2008 ACM-ICPC East Central North America Regional Programming Contest: 124 teams, each with rank, team name (for 84 of the 124 teams written as team name, a colon and the institution; the others give the team name only), one cell for each of problems A to H, number solved and penalty. A cell gives the number of attempts and the minute of the accepted run, for example 1/177; an unsolved problem with attempts shows -- in place of the minute, and a cell is blank when the team made no attempt. 80 teams solved at least one problem, the most solved is seven, and the 44 teams with none are all ranked 81. First place is The Tartans of Carnegie Mellon University with 7 solved. No medals, awards or unofficial-team marks appear on the page.
