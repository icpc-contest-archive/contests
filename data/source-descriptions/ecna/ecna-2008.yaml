  title: The 2008 ACM-ICPC East Central North America Regional Programming Contest Final Report
  language:
  - en
  contest_date: '2008-11-01'
  problems: 8
  description: |-
    Website of the 2008 ACM-ICPC East Central North America Regional Programming Contest, in English. Its front page is the final report on the contest held on Saturday, November 1, 2008: 123 teams from 65 colleges and universities took part, ten more registered teams were cancelled, and the contest was run as a distributed contest at four sites (Cincinnati, McMaster in Hamilton, Michigan in Ann Arbor, Youngstown) with PC^2 version 8.7. It states eight problems, 80 teams solving at least one and seven as the most solved, and lists the top 12 teams with institution, team name, problems solved and total time in minutes.

    Our copy holds four pages: the report, a page of problem sets, judges' solutions and contest data, the final standings (a scoreboard of 124 teams against problems A to H), and the problem set as a PDF of 13 pages. Seven judges' solutions are also in our copy, as C++ and Java source files.

    The contest input and output data files linked from the problems page are not in our copy, and most of the linked judges' solutions are missing as well.
