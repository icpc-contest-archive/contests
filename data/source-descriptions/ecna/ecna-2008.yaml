  description: |-
    Problem set of the 2008 East Central Regional Contest as handed out: a PDF of 13 pages. The first page names the four host sites (McMaster University, University of Cincinnati, University of Michigan - Ann Arbor, Youngstown State University), the date November 1, 2008 and IBM as sponsor, and gives nine rules (eight questions in five hours, standard input and output, C, C++ and Java, communication through PC2).

    Eight problems follow, A to H, each with a statement in English, input and output format and one sample input and output. No test data or solutions are in the file.
