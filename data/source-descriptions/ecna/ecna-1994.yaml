  description: |-
    Thread of nine messages from the Usenet group comp.org.acm, captured as a Google Groups page, with the subject "ACM Regionals Results!". The first message, dated 12 November 1994, gives the top finishers of the East Central Regionals as a text table of 13 teams: user id, team name, columns for problems A to H, and a Total column with problems solved and penalty time. Each lettered cell holds a number for a solved problem and is blank otherwise; a reply explains the number as minutes until the correct submission plus 20 for each earlier incorrect one. The top three are U of Waterloo B, U of Waterloo A and Case Western Reserve U A, each with seven problems. The message also says which teams advance to the Finals.

    Most of the eight replies discuss how the ranking and penalty time are computed and how other contests score; the table is quoted in part. Our copy shows the page with its Google Groups menus; the table lists only the top finishers, not every team.
