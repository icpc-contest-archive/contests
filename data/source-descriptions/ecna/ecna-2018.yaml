  title: The 2018 ICPC East Central North America Regional Programming Contest Final Report
  language:
  - en
  contest_date: '2018-11-10'
  problems: 10
  pages: 2
  description: |-
    Final report of the contest, a PDF of 2 pages dated November 18, 2018. It states that the contest was held on Saturday, November 10, 2018 as a distributed contest with 135 teams from 50 colleges and universities, and gives the teams and schools at each of the four sites: Cincinnati 33 teams from 13 schools, Grand Valley 30 from 10, Windsor 24 from 9, Youngstown 48 from 18. It reports 10 problems, 60 teams solving at least one, and a best result of 9 problems solved.

    The report then covers three issues: a delay at the Grand Valley site and the resulting two-minute score adjustment per correct submission, which changed two ranks; an older version of problem J in the printed problem set and an error in the example of problem E, both handled by clarifications; and coaches' complaints about the difficulty of the problem set, with the judges' three stated goals for problem sets. It has no list of teams and no standings.
