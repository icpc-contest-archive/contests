  contest_date: '2018-11-10'
  problems: 10
  description: |-
    Website page set of the 2018 ICPC East Central North America Regional Programming Contest, in English. The front page is headed "Final Report and Results" and dated December 2, 2018. It links to a PDF final report, to the final standings on a scoreboard page, and to the problem sets, test data and judges' solutions, and it announces four special awards (highest jump in rank, last correct solution, most problems solved with fewest penalties, most attempts before a correct solution) with the winning teams and their schools.

    A second page lists the six practice problems and the ten contest problems A to J with a ZIP download for each, and links two problem set PDFs, one for the practice contest and one for the contest. Our copy holds 22 files: the two HTML pages, three PDFs (the final report and the two problem set PDFs), the 16 ZIP files and one image. The menu links to registration, rules, fees, contacts and the four contest site pages lead to pages that are not in our copy.

    The final report PDF opens. The two problem set PDFs and 13 of the 16 ZIP files cannot be opened: they end before the part of the file that lists its contents. The three ZIP files that open are the practice problems Are You Listening?, An I for an Eye and the contest problem Tours de Sales Force.
