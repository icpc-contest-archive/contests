  description: |-
    Problem set page of the contest, headed "Problem Set, Solutions and Test Data". It holds two tables, each row with a problem label, a title and a ZIP link: six practice problems A to F (Are You Listening? to The Ups and Downs of Investing) and ten contest problems A to J, from Car Vet to Watch Where You Step. The last contest row is labelled I on the page, like the one before it. It links a PDF problem set for the practice contest and one for the contest, and says it was last updated 11 November 2018.

    Our copy of this page holds the page and its banner image; the ZIP files and the PDFs it links to are not part of it.
