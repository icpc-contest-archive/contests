  description: |-
    Website of the ICPC North America East Central Regional, in English. Our copy holds seven page addresses: the front page, the Archives, Contact and Hall of Fame pages, and a second address for each of those three that serves the same page. The front page is headed 2026-2027 Regional Programming Contest, Sunday, November 8, 2026, and gives the registration period (September 23 to November 1, 2026), the four sites (Grand Valley State University, Purdue University, University of Windsor, Youngstown State University), the regions teams come from, team registration rules and fees ($190 per team, $50 per additional person). It has a Scoreboard link that leads to another server.

    The Archives page lists the six earlier contests from 2019-2020 to 2024-2025, each with links to the final standings, practice contest and problem set and the list of problems; the two latest also give the contest date. The Hall of Fame page gives the 2024-2025 medal teams and first-to-solve awards by problem, and award lists for 2023 back to 2019. The Contact page gives the contest director and the four site directors. The page holds no results or problems of the 2026 contest.
