  description: |-
    Judge's list of problems from the ACM-ICPC Live Archive, category "Regionals 1992 :: North America - East Central NA". Eight problems are listed by title, numbered 6549 to 6552 and 6766 to 6769: Pinball Wizard, Freeze Frame, The Search Is Over, Hip to be Square, Money For Nothing, Draggin' The Line, Pump Up The Volume and Bad To The Bone. For each it gives total submissions with solving percentage and total users with solving percentage; five of the eight show no submissions. The statements are behind links that are not part of our copy; the page also holds the site menu and a login form.
