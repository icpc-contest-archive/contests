  description: |-
    Personal web page by a transcriber, marked "Not an official ACM page", for the 1992 ACM East-Central Regional programming contest. It lists eight problems, A to H (Pinball Wizard, Freeze Frame, The Search Is Over, Hip to be Square, Money For Nothing, Draggin' The Line, Pump Up The Volume, Bad To The Bone), each linking to its own statement page. The page says the problem set was transcribed from scanned images of the original pages, and gives a last-updated date of 18 December 1999.

    Our copy holds only this index page and its two images; the eight statement pages are not in it.
