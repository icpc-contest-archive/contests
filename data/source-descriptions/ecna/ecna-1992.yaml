  title: QUESTION about ACM Programming FInals
  language:
  - en
  teams: 10
  description: |-
    Google Groups view of the comp.org.acm thread "QUESTION about ACM Programming FInals", ten posts from 24 November to 31 December 1992 in which readers exchange regional results and the teams going to the Finals in Indianapolis in February. The first post names the finalists of the Northeast and East Central regions, Waterloo and Oberlin for East Central. A post of 25 November lists the top ten finishers for East Central with total time and problems solved, from Univ. of Waterloo (A) with 5 problems and 810 down to Translylvania Univ. (B) with 3; another post says the official results will be announced in early December. Later posts give results of the Western European, Southeastern and Taiwan regions. No date of the regional contest is given.
