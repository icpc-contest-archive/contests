  read: '2026-11-16'
  rubric: 1
  copy: ecna/ecna-2012/website/2026-09-03-live-0e83650f
  title: The 2012 ACM-ICPC East Central North America Regional Programming Contest Final Report
  language:
  - en
  contest_date: '2012-11-03'
  description: |-
    Website of the 2012 ACM-ICPC East Central North America Regional Programming Contest, in English: a Final Report on the home page and five linked pages. The report says the contest was held on Saturday November 3, 2012 as a distributed contest with 131 teams from 63 colleges and universities at four sites (Cincinnati, Grand Valley, Windsor, Youngstown), run with version 9.2.3 of PC^2 with nine problems. It states that 77 teams solved at least one problem, and describes a time synchronisation problem at the start, an error in the sample input of problem G and an input case of problem I that was removed.

    The linked pages are the problem set page (a 14-page PDF for problems A to I, input and output files, judges' solutions), the Detailed Final Standings (A to I with times and tries), the top 15 teams overall, the top 10 teams at each site, and the winners of other awards. Our copy holds 38 files: six pages, the PDF, four images and 27 data and solution files.

    The standings page is cut off after 112 complete team rows, and the top 10 per site page stops after the Grand Valley site. The input files for problems E and I, the output files for F and I and most judges' solution files are not in our copy.
