    Page of the organisers' site that links the contest's documents: the contest problem set (a PDF), the contest input and output files for problems A to I, and judges' solutions, three per problem (four for problem C), in C++ and Java except problem F, which has Java only; two Java solutions for problem H also link class files. It also lists five judges with their institutions. The page itself holds only links, and the files it links are not part of this copy.

    Our copy of the contest website holds the problem set PDF: 14 pages with a cover naming the four host universities, November 3, 2012 and IBM as sponsor, and rules (nine problems, five hours, C, C++ and Java), followed by problems A to I, each with a sample input and output.
