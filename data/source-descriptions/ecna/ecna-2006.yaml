  description: |-
    Website of the 2006 ACM-ICPC East Central North America Regional Programming Contest, with a final report dated November 11, 2006 on its front page. The report says 116 teams from 64 colleges and universities took part at four sites (Ashland, Cincinnati, Dearborn and Oakville), that PC^2 version 8.7 ran the contest, and that 91 teams solved at least one of the 8 problems. It lists the top 10 teams with institution, problems solved and total time, and links to two further pages: the full final standings and a page of problem sets, judges' solutions and contest data.

    Our copy holds 13 files: the three pages, the problem set PDF, input files for problems C, E, F and G, one output file, two Java solutions and two images. The other input, output and solution files linked from the problems page are not in our copy.
