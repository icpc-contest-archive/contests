  description: |-
    Problem set as a PDF of 17 pages, in English. The first page is headed ACM International Collegiate Programming Contest, 2000 East Central Regional Contest, names Case Western Reserve University and the University of Cincinnati, gives November 11, 2000 and Sponsored by IBM, and lists eight rules (C, C++ and Java allowed, PC2 used for communication with the judges, eight questions in five hours). It is followed by eight problems A to H: Picnic Planning, Poly-polygonal Numbers, Rational Approximation, Stacking Cubes, Checker's Check, To Bet or Not To Bet, BSP Trees and Double Trouble. Each has a statement with input and output sections and sample input and output. No test data or solutions.
