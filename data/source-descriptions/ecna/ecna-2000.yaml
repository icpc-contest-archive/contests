  description: |-
    Past-results page for the 2000 contest on the website of the 2014 ACM ICPC East Central North America Regional Programming Contest, in English; the page is headed 2000 Contest, November 11, 2000, and ends with Last updated 14 November 2014. The surrounding menu lists the call for participation, registration, contact, fees and billing, rules, general information, four contest-site links and past results, but none of those menu pages is in our copy.

    Our copy holds 5 pages and 66 files. The pages are the seed page, a problem set and data page, the final standings with a result for every team on problems A to H, and two PDFs: the real contest problem set (17 pages) and the practice contest problem set (6 pages, problems A to D). The other 61 files are the judges' solutions in C, C++ and Java, the per-problem data archives, the PostScript versions of both problem sets, and two images.
