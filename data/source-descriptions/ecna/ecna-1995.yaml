  - en
  contest_date: '1995-11-11'
  description: |-
    Website of the Michigan State University student chapter of the ACM, in English. Our copy holds 150 files, among them 91 HTML pages, captured at different dates between 1996 and 2004; only a few pages concern the 1995 East Central Regionals, and the rest cover the chapter (officers, membership, meetings, volunteers, member home pages, usage statistics, other events).

    The contest page, titled "ACM Regional Programming Contest", opens with "1995 East Central Regionals of the ACM International Collegiate Programming Contest sponsored by Microsoft" and states that the contest was held on the campus of Michigan State University on Saturday 11 November 1995, with a practice session on 10 November. A call for participation gives the schedule for 10-11 November, accommodations and registration details. Another page explains how to retrieve contest work files. The site also links the 1993 and 1994 problem sets as PostScript files, which are in our copy.

    The pages for the contest's problems, rankings, rules, registration form, volunteer information and credits are linked from the contest page but are not in our copy, so it holds no results or 1995 problem statements.
