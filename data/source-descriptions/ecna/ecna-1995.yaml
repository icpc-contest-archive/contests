    Index page of a personal problem archive, marked "Not an official ACM page". It is headed 1995 East-Central Regionals ACM International Collegiate programming Contest, sponsored by Microsoft, and lists two practice problems (Long Division, The Marble) and seven contest problems A to G (Pi, Up and Down Sequences, Machined Surfaces, Sunrise, LED Test, Word Index, Molecues, as spelled on the page), each linked to its own page.

    Our copy holds only this index; the linked problem pages are not in it.
