  description: |-
    Final standings of the contest in a single table: 144 rows, each with rank, team name, a cell for each of problems A to H, number solved and penalty time. A cell holds the number of attempts and, when solved, the time of the accepted run (1/39); unsolved attempts are shown as a count followed by two dashes (8/--). 96 teams solved at least one problem and 48 rows share rank 97 with no solves. 16 of the rows are named as spare entries ("Ashland Spare 1", "CMU Spare 1", "Cincinnati Spare 1", "Sheridan Spare 1" and so on, four per site) and are ranked among the zero-solve teams; the other 128 rows match the team count in the final report. Waterloo Black is first with 7 problems solved. Institutions are not shown, only team names.
