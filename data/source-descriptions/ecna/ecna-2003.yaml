  contest_date: '2003-11-08'
  problems: 8
  description: |-
    Part of the ECNA regional's website for the 2003 contest, in English. Our copy holds 2 pages. The home page is the Final Report of November 8, 2003: 128 teams from 71 colleges and universities at four sites (Ashland, Carnegie Mellon in Pittsburgh, Cincinnati and Sheridan in Oakville, Ontario), 8 problems, and 96 teams solving at least one. The report tells how version 8.5 of the PC^2 contest control system failed during the practice contest, how all sites went back to version 7.6 overnight, and that the contest started at 10:39:10, 40 minutes late. It lists the top ten teams with institution, problems solved and total time, led by the University of Waterloo's Waterloo Black with 7 problems.

    The second page is the final standings table, a scoreboard with per-problem attempts and times, but our copy of it is cut off: it holds 119 complete team rows and breaks off in the middle of the next row, in the group of teams that solved nothing and share rank 97. The home page also links to the problem sets page, which is not in our copy.
