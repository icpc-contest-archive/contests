  description: |-
    Problem sets and data page of the ECNA regional's website: it holds no problem text itself but 58 links. It names three judges with their universities and links the real and the practice problem sets, each as PDF and Postscript. Below are the contest data files (A to H for the real contest, A to C for the practice contest), output files (A to H real, A to C practice), and judges' solutions: for the real contest A to H from one judge, A to H from one marked Java, and all of them except F from the third; for the practice contest A to C from each of the three. A note dated 7 October 2015 on this copy says the practice contest solutions are all missing.

    The files behind the links are not part of this document.
