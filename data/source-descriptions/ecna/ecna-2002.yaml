  description: |-
    Problem sets and data page of the ECNA regional's website: it holds no problem text itself but 85 links. It names four judges with their universities, links to photo pages and to post-contest comments and hints, and links the real and the practice problem sets, each as Postscript and PDF. Below are the contest data files (A to H for the real contest, A to C for the practice contest), output files (A to H plus a second B file for the real contest, A to C for practice) and judges' solutions: for the real contest A to H from three of the four judges and all of them except F from the fourth, and A to H in Java; for the practice contest A to C from each judge and in Java.

    The pages and files behind the links are not part of this document.
