  description: |-
    Part of the ECNA regional's website for the 2002 contest, in English. Our copy holds 2 pages. The home page is the Final Report of November 9, 2002: the contest was held as a distributed contest at four sites (Ashland, Cincinnati, Sheridan in Oakville, Ontario, and Western Michigan in Kalamazoo) with 131 teams from 70 colleges and universities, 8 problems, and 88 teams solving at least one. It lists the top ten teams with institution, problems solved and total time, led by Carnegie Mellon University's CMU Dragons with 8 problems.

    The second page is the final standings table, a scoreboard with per-problem attempts and times, but our copy of it is cut off: it holds 118 complete team rows and breaks off in the middle of the next row, in the group of teams that solved nothing and share rank 89. The home page also links to the problem sets page, which is not in our copy.
