    Problem set page of the contest website, in English: a table for the real contest with 10 problems, A to J, and one for the practice contest with four problems, A to D, each row linking to a ZIP file. A note says each ZIP holds the test data, input validators, the problem statement in LaTeX and the judges' submissions, and that the test files of Removal Game were split into smaller files. The table lists the last real problem, "Yes Yes, It's Nonograms", with the label I a second time instead of J. The page also links the practice problem set as a PDF and shows "Last updated 29 October 2016".
