  description: |-
    Website of the 2016 ACM ICPC East Central North America Regional Programming Contest, in English. Our copy holds four pages: the home page, the problem set page and two PDFs (the contest problem set and the practice session problem set), plus 14 ZIP files linked from the problem set page.

    The home page carries a final report dated 5 November 2016. It says the contest was held on Saturday, 29 October 2016 as a distributed contest at four sites (Cincinnati, Grand Valley, Windsor, Youngstown) with 123 teams from 49 colleges and universities, and that three more teams registered but did not attend. It gives the number of teams and schools per site, the start and end times, the 10 problems, a section on issues, and a list of special awards with the winning teams. The page links to the final standings and to the problem sets.

    The menu links to registration, contacts, fees, rules, general information, the scoreboard and past results lead to pages that are not in our copy; the links to the four site pages and to the standings lead to other servers.
