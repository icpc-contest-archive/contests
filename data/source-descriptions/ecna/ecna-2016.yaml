    Problem set of the contest as a PDF of 27 pages, in English. The cover reads "East Central North America Regional Contest 2016, ECNA 2016, October 29" and lists the problems A to J; page 2 is blank and page 3 gives the rules, naming the four host universities (Grand Valley State, Cincinnati, Windsor, Youngstown State), the date and IBM as sponsor, with ten problems in five hours. Pages 4 to 27 hold the 10 problem statements, A (Bubbly Troubly) to J (Yes, Yes, It's Nonograms), each with input and output specifications and samples; five of these pages (9, 15, 19, 23 and 25) are blank. Each carries the footer "ECNA 2016 Problem X" with a page number. No test data or solutions.
