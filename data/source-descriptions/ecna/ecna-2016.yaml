    Final scoreboard of the 2016 East Central NA Regional Contest as shown by Kattis (page headed "Standings", view "All teams"): 126 teams ranked 1 to 120 with ties, each with country flag, institution logo, number solved, total time, and for each of the 10 problems A to J the number of attempts and the minute of the accepted solution (an unsolved problem with attempts shows a dash). The page says the contest is over and gives a start of 2016-10-29 16:00 CEST and an end at 21:00, five hours. Waterloo Royal Blue is first with 10 solved and 908 minutes.

    The page has a legend for first to solve, solved, attempted and pending judgement, and tabs for the four sites; only the "All teams" view is in our copy, and the site tabs link to pages that are not. The site's main style sheet and its scripts are not in our copy.
