  description: |-
    Front page of the official web site of the East Central North America Regional Programming Contest, in English. It announces the contest for Saturday 10 November 2001 as a distributed contest hosted by Ashland University (Ashland, Ohio), Sheridan College (Oakville, Ontario) and the University of Cincinnati (Cincinnati, Ohio), sponsored by IBM, and describes the region as western Pennsylvania, Ohio, Michigan, eastern Ontario and Indiana.

    The menu names Home, Contacts, Logistics, Registration, Preparation, Billing, Rules, Participation and Documents. Our copy holds only this one page; the pages behind the menu are not in it.
