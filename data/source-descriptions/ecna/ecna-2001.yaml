  contest_date: '2001-11-10'
  teams: 10
  problems: 8
  description: |-
    Final report page of the 2001 ACM East Central North America Regional Programming Contest, held on Saturday 10 November 2001. The text says 122 teams from 68 colleges and universities took part at four sites (Ashland 43 teams, Cincinnati 23, Sheridan in Oakville, Ontario 24, Western Michigan in Kalamazoo 28), that the contest had 8 problems, that 95 teams solved at least one and that the maximum solved was 6.

    It lists the top 10 teams with final rank, institute, team name, number of problems solved and total time in minutes; the first place is Waterloo Black of the University of Waterloo with 7 solved. Links lead to the problem sets, the final standings and post-contest comments and hints by the judges. The page is a short report, not a full results list.
