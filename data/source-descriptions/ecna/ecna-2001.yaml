  description: |-
    Final standings of the 2001 ACM ECNA Regional Programming Contest: 122 teams, eight problems A to H. Each row gives rank, team name (no institution column), a cell per problem, number solved and penalty time. A problem cell shows tries and minutes as 2/245, or tries followed by -- when the problem was not solved; unattempted problems are blank.

    Waterloo Black is first with 7 solved and 1084 penalty, followed by Queen's Bacon (6) and Toronto 1 (5). 95 teams solved at least one problem; the 27 teams with none all share rank 96. The table has one further row labelled Summary, also at rank 96 with empty cells and zeros, which is not a team. The four contest sites are not marked.
