  description: |-
    Problem set page of the 2015 East Central North America regional contest, headed Problem Set, Solutions and Test Data. It lists the judges and notes that the format differs from earlier years: each problem comes as one ZIP file with test data, input validators, the statement in LaTeX and the judges' submissions. Two tables list the practice contest (four problems, A to D) and the real contest (nine problems, A to I), each with a title and a ZIP link, and each block links a problem set PDF. The link for problem B is the corrected file, and a note links the original file used in the contest.
