  - en
  contest_date: '2015-10-31'
  description: |-
    Website of the 2015 East Central North America regional contest, run by the region's organisers. The home page is a final report dated 4 November 2015: 130 teams from 55 colleges and universities competed at four sites (Cincinnati, Grand Valley, Windsor, Youngstown), with Kattis used as the contest control system. The report explains two issues, a flaw in the judges' solutions for problem B that led to corrected test data and rejudging of 57 submissions with the resulting changes in standings, and a delay at two sites caused by the password sets. It ends with special awards. The menu names pages for registration, rules, fees, contact and general information; those addresses were not found when the site was fetched and are not in our copy, and the four site pages are on other servers.

    Our copy holds 18 files from 26 addresses fetched: the home page, the problem set page, the practice contest PDF, the contest problem set PDF, and 14 ZIP files with the problem packages. Six of the ZIP files cannot be opened as archives because their ends are missing. The final standings link on the home page leads to Kattis and is not in this copy.
