  description: |-
    Final scoreboard of the regional contest, sponsored by IBM, as an HTML page whose table was saved from a spreadsheet. It ranks 70 teams with place, team name, a time for each of problems A to H where the team solved it (blank otherwise), number solved and total time; ties share a place number. Waterloo A is first with all eight problems solved, followed by Toronto A and CMU N. Attempt counts are not given.

    Below the table an Also competing list names 33 more teams without results. There is no separate institution column; team names carry an abbreviated institution name.
