    Category page of the Baekjoon Online Judge, with a Korean interface, for the 1999 East Central Regional Contest. It lists five of the contest's eight problems: A Triangle War, B Unscrambling Images, F Biorhythms, G Gone Fishing and H The Same Game. Each row gives the Baekjoon problem number, label, English title, number of users who solved it, submissions and percentage correct.

