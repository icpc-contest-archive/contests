  language:
  - en
  contest_date: '1999-11-13'
  problems: 8
  pages: 19
  description: |-
    Problem set of the contest: a PDF of 19 pages. The first page is the cover, with the ACM International Collegiate Programming Contest, the 1999 East Central Regional Contest, the University of Waterloo, 13 November 1999 and IBM as sponsor, followed by the rules: input and output through standard input and output, five CPU seconds and 16 MB per input file for C, C++ and Pascal (Java limits given in a separate document), languages C, C++, Java and Pascal, eight questions in five hours. Eight problems follow, A to H: Triangle War, Unscrambling Images, A Plug for UNIX, Treasure Hunt, 487-3279, Biorhythms, Gone Fishing and The Same Game. Each has a statement in English with sample input and output. No test data or solutions are in it.

    The PDF's text layer extracts as garbled characters; the text is readable only from the page images.
