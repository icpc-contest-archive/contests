  title: 1999 ACM East Central Programming Contest
  language:
  - en
  description: |-
    Contest report page of the 1999 ACM East Central Programming Contest, held 12-13 November 1999 at the University of Waterloo. It names the three teams going to the finals (Waterloo A, Toronto A, CMU Team N) with their members and coaches, lists the fourth to ninth places, and describes the region as western Pennsylvania, West Virginia, Ohio, Michigan, eastern Ontario and Indiana excluding the Greater Chicago area, plus McGill.

    A Contest Data list links the practice and real problem sets, standings, clarifications, submission statistics and comments, and archives of test data and solutions. Our copy holds six pages: the report, the final standings, the practice contest standings, the problem set PDF, the clarifications and the submission statistics. It also holds both problem sets in PostScript, the two test data archives and one GIF image.
