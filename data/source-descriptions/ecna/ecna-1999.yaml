  description: |-
    Judges' text file of submission statistics and comments for the contest. It opens with five general comments to teams, then covers problems A to H in turn. For each it gives total submissions, submissions in the last 10 minutes (with how many of those were correct), the number of correct submissions, and a short list of common mistakes and remarks, for example on search strategies that run too long or on output format errors.
