    Contest page on Codeforces Gym, marked Finished, with no description of the contest and no contest date. It has a link to a statements PDF in English and a table of nine problems A to I (The Agency, Chain of Fools, Condorcet Winners, Everyone out of the Pool, The Banzhaf Buzz-O (as printed), GPS I Love You, Have You Driven a Fjord Lately?, Mobile, Wally World) with time and memory limits (256 MB each; 1 second except 20 seconds for C and 10 seconds for G) and the number of solvers of each. Every problem carries a footnote mark; the footnote says the package was not updated after the judging servers were upgraded and that execution times are multiplied by 2. One announcement on problem D says that test 1 is not from the problem statement. The rest is Codeforces interface. The statements PDF is not in our copy.
