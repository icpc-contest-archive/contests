  description: |-
    Website of the 2011 East Central North America regional contest on the regional organisers' site, in English. The home page is a final report: the contest ran on Saturday October 22, 2011 at four sites (Cincinnati, Grand Valley in Allendale, Windsor, Youngstown), with 122 teams from 60 colleges and universities, 9 problems, and 94 teams solving at least one. It also gives the PC^2 version, the start and end times and the teams and schools per site.

    Our copy holds 45 files. Six are pages: the home page, a page of problem sets, judges' solutions and contest data, the detailed final standings (rows for problems A to I with attempts and time, solved, penalty), the top 15 teams overall, the top 10 teams at each of the four sites, and the winners of five special awards. The problem set PDF has 13 pages: a cover with the rules, naming IBM as sponsor, and statements of problems A to I. The files also include 8 of the 9 input data files (the input for C was too large to save), all 9 output files, 15 judges' solutions in C++ and Java, and images.
