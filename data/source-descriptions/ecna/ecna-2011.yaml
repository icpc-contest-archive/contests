    Problem list of the contest on the Baekjoon Online Judge, in a Korean-language interface. A table of nine problems gives for each the judge's problem number (4027 to 4035), the letter A to I, the title, and the numbers of users who solved it, submissions and accepted ratio. Seven titles are in English (The Agency, Chain of Fools, The Banzhaf Buzz-Of, GPS I Love You, Have You Driven a Fjord Lately?, Mobile, Wally World); the titles of C and D are in Korean. Problem D has the most solvers, 90 from 339 submissions; A, E, F, G and H have no solvers. The page shows the source as ICPC Regionals, North America, East Central North America Regional. The statements are on separate pages of the judge and are not in our copy.
