  title: The 2011 ACM-ICPC East Central North America Regional Programming Contest Final Report
  language:
  - en
  contest_date: '2011-10-22'
  description: |-
    Website of the 2011 East Central North America regional on the region's own site, in English. The front page is a final report: the contest was held on Saturday October 22, 2011 as a distributed contest at four sites (Cincinnati, Grand Valley in Allendale, Windsor and Youngstown); the report gives 122 teams from 60 colleges and universities, PC^2 version 9.1.6, nine problems, and 94 teams solving at least one.

    Our copy holds 45 files: six HTML pages (the report, the problem set and solutions page, the detailed final standings, the top 15 teams overall, the top 10 teams at each site, the winners of special awards), the problem set PDF of 13 pages, 8 contest input files (problems A, B and D to I), 9 output files (A to I), 15 judges' solutions (7 in C++, 8 in Java) and six images. The input file of problem C was too large to be fetched and is missing.
