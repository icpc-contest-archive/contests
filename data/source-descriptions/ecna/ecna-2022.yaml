  description: |-
    Final scoreboard from Kattis for the 2022 East Central NA Regional Contest: 92 teams with rank, team name, number solved and penalty time, and one cell per problem A to L showing the number of attempts and, for a solved problem, the minute of the solve. An attempted but unsolved problem shows its attempts followed by a dash; a problem not tried is blank. The page states the contest ran from 11:00 to 16:00 EST on 2023-02-25 and is over.

