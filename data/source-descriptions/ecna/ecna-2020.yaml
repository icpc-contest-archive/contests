  description: |-
    Final scoreboard on Kattis for the 2020 East Central NA Regional Contest: 71 teams ranked by problems solved and penalty time, with the winner Waterloo Black at 12 solved in 569 minutes. Twelve problem columns A to L show for each team the number of attempts and the minute of the accepted solution, or the attempts alone for unsolved problems. The page states a five-hour contest from 14:00 to 19:00 EST on 2021-03-06 and marks the contest as over. A site filter offers All, Cincinnati, Grand Valley, Windsor and Youngstown; our copy shows the All view. The last teams, with no solved problems, share rank 67. There is no institution column.
