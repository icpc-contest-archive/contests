  language:
  - en
  problems: 12
  description: |-
    Website pages of the 2020 East Central North America regional contest, in English. Our copy holds two pages and twelve ZIP files. The front page carries a preliminary report dated March 7, 2021: the contest was held remotely because of the pandemic, 71 teams from 25 schools took part, Kattis was the contest control system, play ran from 2pm to 7pm, and the contest had 12 problems, of which 66 teams solved at least one. The best result was 12 problems solved. It links to the final standings (on another server) and to the problem set. A note says a link to the final report is forthcoming. The menu names the four contest sites (Cincinnati, Grand Valley, Windsor, Youngstown) and pages for registration, contact, fees, rules and general information, which are not in our copy.

    The second page is headed Problem Set, Solutions and Test Data: a table of problems A to L with one ZIP link each, and the names of four judges with their institutions. Twelve ZIP files are in our copy, but six of them (problems A, B, D, G, H and L) are cut short and cannot be opened as archives; the other six open and hold the statement, test data and accepted solutions of their problem. The combined problem set PDF the page links to is not in our copy.
