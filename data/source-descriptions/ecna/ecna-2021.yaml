  language:
  - en
  problems: 13
  description: |-
    Website of the 2021 East Central North America Regional Programming Contest, in English, run on Kattis and held remotely. Our copy holds 29 files: the home page (saved under two addresses), the problem set page, the problem set PDF, one test input file of about 570 KB, and 24 image files. Three of those image files are not images but web pages reading "One moment, please..."; the other 21 are photographs.

    The home page carries a preliminary report dated 27 February 2022: 96 teams from 30 schools, 13 problems, 62 teams solving at least one, a maximum of 12 solved, a start at 10 am and end at 3 pm, and an account of an ambiguous test case in problem J (Recycling) that was removed and the submissions rejudged. Below it are photographs under the names of ten universities, and menus for registration, fees, rules, the four contest sites (Cincinnati, Grand Valley, Windsor, Youngstown), the scoreboard and past results.

    The problem set page lists problems A to M with a ZIP link for each and links to the PDF. The PDF in our copy is cut off at 1 MiB and cannot be opened; the ZIP files and the standings are linked but not in our copy.
