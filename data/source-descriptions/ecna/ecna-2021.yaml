  description: |-
    Final scoreboard from Kattis for the 2021 East Central NA Regional Contest: 98 teams with rank, team name, number solved and penalty time, and one cell per problem A to M showing the number of attempts and, for a solved problem, the minute of the solve. An attempted but unsolved problem shows its attempts followed by a dash; a problem not tried is blank. The page states the contest ran from 10:00 to 15:00 EST on 2022-02-26 and is over.

    A site selector offers All, Cincinnati, Grand Valley, Windsor and Youngstown; our copy shows the All view. 62 teams solved at least one problem and 36 solved none; those 36 all share rank 63. CMU1 is first with 12 solved. The page has no institution column.
