    Page of links to the problem material of the 2004 ACM ECNA Regional Programming Contest. It names four judges with their colleges, links the real and the practice problem set (each as PDF and Postscript), the real contest data and output for problems A to H, the practice data and output for A to C, and the judges' solutions for the eight real problems A to H: Alphacode, Anti-Prime Sequences, Hit or Miss, I Conduit!, Roll Playing Games, Team Rankings, To and Fro and Translations. The solutions are in C/C++ and, for six of the eight, also in Java. The page holds links only; the files they lead to are separate.
