    Baekjoon Online Judge category page for the 2004 East Central Regional Contest, in Korean. It lists eight problems A to H with the judge's problem number, the title (three of them, A, B and D, in Korean, the others in English), the number of people who solved each problem, submissions and the correct-answer ratio. The statements are on linked pages that are not in our copy, which also carries the judge's menus and footer.
