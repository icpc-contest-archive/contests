  description: |-
    Final standings of the 2004 ACM ECNA Regional Programming Contest: 133 teams with rank, team name and institution, a cell for each of problems A to H written as attempts/minute (for example 3/25), problems solved and penalty time. Unsolved problems that were tried show the attempts followed by a slash and two dashes (for example 10/--). First place is Waterloo Black of the University of Waterloo with 8 problems and penalty 799. The 14 teams with no solved problem share rank 120. The page does not say which site each team played at.
