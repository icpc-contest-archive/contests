  description: |-
    Website of the 2004 ACM East Central North America Regional Programming Contest, in English. Our copy holds 38 files, five of them pages: a final report, a page of problem sets and data, the final standings, and PDFs of the real and the practice problem sets. The final report, headed November 6, 2004, tells that 131 teams from 72 colleges and universities competed at four sites (Ashland, Carnegie-Mellon, Cincinnati and Sheridan), that the contest was run with PC^2 version 7.6, that it started 25 minutes late, that the clock of the Carnegie-Mellon site malfunctioned and that servers crashed at three sites, so that the contest ended at 16:10 EST. It states that the contest had 8 problems and that 119 teams solved at least one. It lists the top 10 teams with institution, problems solved and total time.

    The problem sets page links the real and practice problem sets as PDF and Postscript, and the judges' solutions to problems A to H in C/C++ for all eight and in Java for six of them. The page also links the contest data and output files; our copy holds the eleven output files (.diff) and the solutions, but not the data files. The Sheridan site photo gallery is a link to another server, and our copy holds six small images from the pages.
