  description: |-
    Final standings of the 2004 ACM East Central North America Regional Programming Contest: a scoreboard of 133 teams against eight problems A to H. Each row gives rank, team name (all but one followed by the institution), and for each problem the number of attempts and the minute of the accepted run (a slash separates them; an unsolved problem shows attempts followed by two dashes), then problems solved and penalty time. Waterloo Black from the University of Waterloo is first with 8 problems solved and 799 penalty minutes. The 14 teams that solved nothing share rank 120. All four sites are in one table and the table does not say which site a team played at.
