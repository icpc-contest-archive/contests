  description: |-
    Index page of the problem material of the 2004 ACM ECNA Regional Programming Contest, in English. It names four judges with their institutions and links the real problem set and the practice problem set, each as PDF and Postscript, the input data and expected output for problems A to H of the real contest and A to C of the practice contest, and judges' solutions for the eight problems in C/C++ and for six of them also in Java. The problems are A Alphacode, B Anti-Prime Sequences, C Hit or Miss, D I Conduit!, E Roll Playing Games, F Team Rankings, G To and Fro and H Translations.

    The page holds no statements itself; they are in the linked PDFs. Our copy of this page does not include the linked files.
