  contest_date: '2004-11-06'
  problems: 8
  description: |-
    Small website of the East Central North America regional on the ECNA site, in English: a final report, the problem sets with data and judges' solutions, and the final standings. The report, headed November 6, 2004, says 131 teams from 72 colleges and universities competed at four sites (Ashland, Carnegie-Mellon in Pittsburgh, Cincinnati, and Sheridan in Oakville, Ontario), that PC^2 version 7.6 ran the contest, that a late start, a clock fault at one site and server crashes affected the day, and that the contest had 8 problems. It gives the top ten teams with institution, problems solved and time, headed by Waterloo Black of the University of Waterloo with 8 problems, and links to a photo gallery of the Sheridan site.

    Our copy holds 38 files: the report page, the problem sets page, the final standings page, the real and the practice problem set each as PDF and Postscript, 11 expected-output files, 14 judges' solutions (8 in C/C++, 6 in Java) and 6 images. The 11 input data files linked from the problem sets page were refused when captured and are not in it, and the photo gallery link leads outside the copy.
