    Codeforces gym page of the ECNA 2004 contest, marked Finished, in English. It quotes the opening paragraph of the regional's report (6 November 2004, 131 teams from 72 colleges and universities) and lists eight problems A to H with their time limits (1 to 6 seconds), a 256 MB memory limit and a count written x304, x218 and so on. Links lead to the statements (en) and to the contest website.

    The statements are a linked file that is not in our copy, which is the dashboard page with the judge's menus and forms.
