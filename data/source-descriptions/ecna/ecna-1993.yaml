  description: |-
    Problem booklet as a single LaTeX source file. The cover names the 1993 East-Central Regionals of the ACM International Collegiate Programming Contest, "The Battle of Waterloo", held at the University of Waterloo on 5-6 November 1993. A page of rules and advice for contestants follows the cover, then eight problems A to H, each starting on its own page.

    Each of the eight problems has a statement in English with input and output description and a sample input and output. No test data or solutions. The file is raw LaTeX markup, not a typeset document.
