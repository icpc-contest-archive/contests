  description: |-
    Problem set as handed out at the contest: a PDF of 13 pages. The cover names McMaster University, University of Cincinnati, University of Michigan - Ann Arbor and Youngstown State University, gives the date November 10, 2007 and says it was sponsored by IBM. It states eight rules (eight questions in five hours, C, C++ or Java, input and output through standard streams, PC2 for communication with the judges). It then gives problems A to H, each with a statement in English, input and output format and one sample input and output. No test data or solutions in the PDF.
