  problems: 8
  description: |-
    Website of the 2007 ACM-ICPC East Central North America Regional Programming Contest, with a final report dated November 10, 2007 on its front page. The report says 116 teams from 67 colleges and universities took part at four sites (Cincinnati, Ann Arbor, Hamilton and Youngstown) and that 11 further registered teams were cancelled. It says PC^2 version 8.7 ran the contest, that 91 teams solved at least one of the 8 problems, and lists the top 12 teams with institution, problems solved and total time. It links to the full final standings and to a page of problem sets, judges' solutions and contest data.

    Our copy holds 20 files: the three pages, the problem set PDF, input files for problems A, B, D and F, ten judges' solution files in C++ and Java, and two images. The other data and solution files linked from the problems page are not in our copy.
