- url: http://acm2001.scusa.lsu.edu/
  read: '2026-11-16'
  rubric: 1
  copy: scusa/scusa-2001/website/2026-09-05-wayback-392463b5
  title: South Central USA Regional Programming Contest - Contest Home Page
  language:
  - en
  contest_date: '2001-11-03'
  problems: 8
  description: |-
    Website of the 2001 South Central USA Regional Programming Contest, hosted by Louisiana State University, in English. Our copy holds 73 files: 33 HTML pages, eight PDFs, 20 text files and 12 GIF images. The home page says the contest is over and links to the welcome message, schedule of events for 2 and 3 November, rules, contest details, FAQ, local information, hints, software and PC^2 instructions, and the coaches' round table agenda.

    Three reports made by CSUS PC^2 version 7: full results and the same table with team numbers, each listing 70 teams with rank, name, solved and penalty, and final standings with the top ten teams ranked and 59 more under Honorable Mention, 69 teams in all. The full results also list a team named Alternate Team, ranked 20th, that the final standings do not contain. The problems part holds a problem set page for eight problems, the eight statements as PDFs of two or three pages each, seven judge data text files (for problems 2 to 8), and a judge solutions page with 12 solution source files as text in Java, C++ and C.

    Not in our copy: the HTML versions of the statements, the judge data file for problem 1, and the pages for the summary of attempts, the summary of attempts showing times and the details linked from the results menu.
