  contest_date: '1998-11-07'
  description: |-
    Website of the 1998 ACM South Central USA Collegiate Programming Contest, held at Rice University on 7 November 1998 and sponsored by IBM. The home page names the Computer Information and Technology Institute (CITI) at Rice University in Houston as host, says the contest drew 71 teams from 40 universities in Texas, Louisiana and Oklahoma, and notes that the winners qualified for the 1999 International Finals in Eindhoven. It names UT Austin A, Sam Houston State #2 and Texas Tech #1 as the leaders.

    Our copy holds three pages: the home page, a final standings page and a problems page that lists seven problem names with links to per-problem result pages. Those per-problem pages are not in our copy. Five small images are saved with the pages.
