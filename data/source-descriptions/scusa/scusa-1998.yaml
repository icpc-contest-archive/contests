  description: |-
    Final standings of the contest: 71 teams, each listed with team number, institution and team name, the number solved and the penalty time. The first 46 teams carry a rank, with UT Austin A first on 5 solved and 707 penalty. Fifteen of the ranked teams also carry a Div II rank. Below the ranked teams a row reads "Number of other teams" with 25, 0 solved, 0 penalty and Div II rank 11, followed by those 25 teams listed by number and name without a rank. No per-problem results and no attempts.
