  title: What do I need?
  language:
  - en
  description: |-
    A page of the PHP Manual, "What do I need?", in its simple tutorial: it explains that a server with PHP support needs nothing more, and for local development points to installing a web server, PHP and a database such as MySQL, or a pre-configured package. Links lead to the previous and next tutorial pages, the manual's index and installation instructions, and outside download and package sites. The page says nothing about the contest or its problems.
