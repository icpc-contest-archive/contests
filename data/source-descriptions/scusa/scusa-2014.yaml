- url: http://ld2014.scusa.lsu.edu/
  read: '2026-11-16'
  rubric: 1
  copy: scusa/scusa-2014/website/2026-09-05-wayback-1603e693
  title: 2014 SCUSA Regional Programming Contest Local Doc Server
  language:
  - en
  description: |-
    Local documentation server of the 2014 South Central USA Regional Programming Contest, in English, set up for the teams to use during the contests. The front page links the PC^2 login and a judging information page, standard input/output examples, and language references for C/C++, the GNU C libraries, the STL, Java 7 and 8, Perl, PHP, Python 2.6, 2.7 and 3.4, and Ruby. A table lists a problem set and a scoreboard for each of the Scripting, Practice and Regional contests. The errata correct problem 4 (Runners), whose output values lie between 0 and 500,000,000, and problem 1 (Map Puzzle), whose sample input line CSRB should be BSRB; the LETU, LSU and TAMU sections are marked blank.

    The judging page says submissions are compiled with gcc -lm -std=c99, g++ -lm -std=c++11 or javac, run with input and output redirected, and compared side by side, and it shows a decision tree of judgements as an image, which is in our copy. Our copy holds 149 files, 110 of them HTML pages: the front page (three times), the judging page, a page on switching Python versions, the standard input/output examples page and the index of PC^2 documentation, plus C guide, STL, PHP, Perl and Ruby reference pages and the GNU C library index page; 28 more are plain-text C++ header files of the STL documentation. The problem sets and scoreboards that the front page links to are not in our copy, and neither are the Java, Python and C++ reference pages.
