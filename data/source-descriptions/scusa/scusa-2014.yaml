  title: 'The GNU C Library: File Name Resolution'
  language:
  - en
  description: |-
    Page of the GNU C Library reference manual, section 11.2.2, File Name Resolution, in English. It explains how a file name is resolved component by component, absolute and relative file names, and the meaning of the components for the directory itself and its parent, with a list of example file names and next, previous and contents links. It is one of the C library reference pages of the contest's local doc server and has no contest content.
