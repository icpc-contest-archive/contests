  title: 'The 2014 South Central USA Regional Contest: Summary'
  language:
  - en
  teams: 62
  problems: 9
  times: true
  tries: true
  description: |-
    Summary scoreboard of the regional contest: 62 teams with rank, team name and institution in brackets, number solved, time, and for each of problems A to I the number of runs and the solution time (a dash in place of the time where the problem was not solved), plus total attempts and solved. A last line gives submitted, first yes and total yes per problem. First place is Rice Gray (Rice) with five problems solved, time 1051; three teams solved five, none more, and the 26 teams with no solutions share rank 37. The page is stamped as updated Sat Oct 4 17:04:02 2014.

    Links at the top lead to other views of the board (Finals, Full, SumTime, FullNums, SumAtt, FirstSolved) and to views by state, graduate program and site; those pages are not part of our copy.
