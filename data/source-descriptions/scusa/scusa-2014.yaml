  description: |-
    Contest dashboard of the 2014-2015 ICPC North America South Central USA Regional on QOJ.ac, in English. It lists nine problems A to I: Map Puzzle, Ancient Numerals, Cipher, Runners, Palindrome Numbers, Factorial Factors, Chuck's Challenge, Optic Communication and Resources, each linking to its own page on the site. The page marks the contest as ended, with the ICPC ruleset, a 20 minute penalty, a limit of 1000 submissions per problem and a virtual contest that can be started; the notice and question tables are empty. Tabs link to submissions, standings and external standings. The statements are on separate pages that are not part of our copy.
