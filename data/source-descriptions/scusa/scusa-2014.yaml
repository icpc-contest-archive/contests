  language:
  - en
  description: |-
    Page of the GNU C Library reference manual, section 21.4.2, High-Resolution Calendar, in English. It describes the struct timezone type and the functions gettimeofday, settimeofday, adjtime and adjtimex, with notes on their error conditions and portability, and links to neighbouring sections. It is one of the C library reference pages of the contest's local doc server and has no contest content.
