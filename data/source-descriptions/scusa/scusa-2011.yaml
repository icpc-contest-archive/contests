    Category page of the Baekjoon Online Judge for the 2011 South Central USA Regional Programming Contest, with the site's menus in Korean. A table lists the eight problems by judge number (4812 for the first, 4506 to 4512 for the others), an unlabelled column of numbers 1 to 8 and title, with the number of users who solved each, the number of submissions and the acceptance ratio; solvers range from none to two per problem. Seven titles are in English as in the contest; the title of problem 3 appears in Korean. Statements and test data are on the judge's own problem pages, which are not part of our copy.
