    Problem set page of the 2011 ACM ICPC South Central USA Regional Programming Contest: a table of eight problems numbered 1 to 8 (Robot Navigation, All Your Base, Periodic, My Dear Watson, This is Halloween: Saving Money, Coffin Tiles, Thinking Inside the Box, Lightbulb Testing, Operation: Merchant Boorinei). Each row links to an HTML statement and a PDF, to sample solutions in one to three of C, C++, Java and Python, and to a judge input file and a judge output file. The page ends with a disclaimer of the hosts and a copyright line for 1999 to 2011. Our copy is the list page alone; the linked files are not part of it.
