  description: |-
    Summary scoreboard of the Regional contest, headed 2011 ACM South Central USA Regional Programming Contest, with a last-updated stamp of Tue Nov 1 09:57:13 2011. It lists 68 teams with rank, name (the institution in parentheses), problems solved, penalty time, and for each of the eight problems A to H the number of attempts and the time of the first correct run (a dash in place of the time where attempts were made without a correct run, 0/0 where none were made), then attempts and solved per team and a final row of submitted, first-yes and total-yes counts per problem.

    Forty-six teams solved at least one problem, the most being five (Aleph One from Tulsa in first place); the other 22 share rank 47. The page links to other views (finals, full, by state, by graduate or undergraduate program, by site, first solved), which are not in this copy.
