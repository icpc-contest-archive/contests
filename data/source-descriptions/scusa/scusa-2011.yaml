  title: 2011 SCUSA Regional Programming Contest Local Doc Server
  language:
  - en
  description: |-
    Local documentation server of the 2011 SCUSA Regional Programming Contest, in English, provided to teams during the contest. The front page links to reference documentation (PC^2 V9 guides, a C/C++ reference, a C library guide, the C++ STL, Java 1.5 and Java 6 documentation and JDKs, Perl, PHP, Python and Ruby for the scripting contest, and standard input and output examples) and to problem sets and scoreboards for Scripting, Practice and Regional contests. Headings for contest-wide errata and for four sites (Baylor, ECU, LETU, LSU) are present with no text under them.

    Our copy holds 149 files, 128 of them pages, of which 98 belong to the STL documentation. It includes the problem set pages of the three contests: Scripting (eight problems, with titles such as Tetrahedral Stacks of Cannonballs and Obstacle Course), Practice (one problem, NASCAR Drivers) and Regional (eight problems, Robot Navigation to Operation: Merchant Boorinei). The front page links a scoreboard only for the Regional contest, and that one is in our copy. The statements, solutions and judge data that the problem set pages link to are not.
