  description: |-
    Standings of the 2011 South Central USA Regional Contest: 68 teams with rank, team, institution, problems solved, time, medal, citation and site citation. The first twelve teams carry medals (four gold, four silver, four bronze); the citation gives the place in words, and the 22 teams with no problem solved share rank 47 as Honorable Mention. Four teams have a site citation as champion of a host site: East Central University, Baylor University, LeTourneau University and Louisiana State University. First place is Aleph One from the University of Tulsa with five problems. There is no per-problem detail. The times differ from those on the Regional scoreboard (940 against 1080 for the first team).
