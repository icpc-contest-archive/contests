  description: |-
    Dashboard of QOJ contest 728 on QOJ.ac, in English. The page names the contest 2020-2021 ICPC North America - Southeast USA Regional and says it is also known as 2020-2021 ICPC North America - South Central USA Regional; it is filed under both the Southeast USA and the South Central USA categories. It lists 16 problems A to P, from Ant Typing to Unread Messages, and shows the ICPC ruleset with a 20-minute penalty and a limit of 1000 submissions per problem, an empty notice list and no questions. A link to English statements and a link to an official website are on the page; the official website link leads to another site.

    The page is the contest's dashboard with the problem names only, as it stood when captured, and offers a virtual contest.
