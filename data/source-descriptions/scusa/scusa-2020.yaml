  copy: scusa/scusa-2020/website/2026-09-05-wayback-64a43cc7
  title: SCUSA
  language:
  - en
  contest_date: '2021-03-06'
  description: |-
    Website of the ICPC South Central USA Regional Contest of March 6, 2021, in English. The front page holds a final report, a checklist of things to do before the opening webinar, a contest-day schedule in Central Time (opening webinar from 11:30 AM, five-hour contest from 1:00 PM on Kattis, coaches meeting, final scoreboard reveal at 7:00 PM), the contest details (online contest, registration by 26 February 2021, no fee, own computers and internet access allowed), advancement information, links to the sites of earlier years, and contact information. The report says the University of Texas at Dallas team whoosh solved all 16 problems, Texas A&M tamoo 15 and University of Texas at Austin O(range) 14, and that nine teams are expected to advance.

    Separate pages list the nine advancing teams with their universities, give the final results and the 16 problems with solve statistics, and explain how to submit on Kattis. The results page is a Kattis standings page, saved under two addresses.

    Our copy holds 36 saved files, seven of them pages (six distinct), with a site logo, 25 files of university logos (13 universities, some saved twice) and a style sheet. The links to the resolver recording (an MP4 file and a YouTube video) are not in our copy.
