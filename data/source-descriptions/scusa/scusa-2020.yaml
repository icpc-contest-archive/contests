    Final standings from the Kattis site of the 2020 South Central USA Regional Contest: 55 teams in rank order with solved count, total time, and for each of the problems A to P the number of tries and, for solved problems, the minute of the accepted run; an unsolved problem shows its tries and a dash. The page states that the contest is over and gives a five-hour contest from 13:00 to 18:00 CST on 2021-03-06. Teams are listed by team name with no institution column. whoosh is first with all 16 problems solved and time 979, tamoo second with 15. One team, named "The ineligibles (TAMU - unofficial)", is listed among the ranked teams.

    The page also shows filters for site, state (Louisiana, Oklahoma, Texas) and program type (graduate, undergraduate), and a legend for first to solve, solved, attempted and pending judgement.
