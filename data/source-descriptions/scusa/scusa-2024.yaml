  title: ICPC North America South Central Regional
  language:
  - en
  description: |-
    Website of the ICPC North America South Central Regional, in English, a single page headed South Central NA Regional Contest with tabs for 2024-2025 contest info, event schedule, sites, getting started, rules and contest results. The results tab states that the regional is over and took place on Saturday, November 16th. It names the first three Division 1 teams (those who know, whoosh and hyper), the three teams going on to the North America Championship together with a wildcard team from Rice University, and the first three teams of Division 2 (UD2, Glaske's Guys and Kiza's Coders), each with its university. It links to the final Kattis scoreboards of both divisions.

    The other tabs hold the day's schedule, the six host sites (the University of Texas at Dallas, the University of Houston, LeTourneau University, the University of Oklahoma, the University of Tulsa and Louisiana State University) with site information, an introduction for new teams, the rules of the region, and a list of regional leadership. Some text is left over from earlier years: the sites are introduced for the 2023-2024 contest and one schedule line reads 2014-15. The foot of the page carries the results of the previous contest, held February 24, 2024, with links to its standings and problem sets.

    Our copy holds this one page with its style sheets, scripts and images. Links to Kattis and to other ICPC pages lead outside it.
