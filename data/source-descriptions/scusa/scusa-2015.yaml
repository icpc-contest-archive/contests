  description: |-
    Problem set page of the 2015 ACM ICPC South Central USA Regional Programming Contest, in English: a table of nine problems A to I (Kinfolk, Refract Facts, Poker, Interpreter, Positive Con Sequences, Morse, Hounded by Indecision, And Then There Was 5, Boggle). For each problem it links an HTML statement, solutions labelled c, cc and java (problem A has c and java, problem D has c and cc, the other seven have all three) and judge input and output files. The page also has a printable version and links to the contest's results, final scoreboard, welcome, rules, sites and other pages.

    Only the page itself is in our copy. The statements, solutions and data files it links to are not.
