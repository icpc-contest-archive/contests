  title: 2015 SCUSA Regional Programming Contest Local Doc Server
  language:
  - en
  description: |-
    Local documentation server of the 2015 SCUSA Regional Programming Contest, in English. The front page links to PC^2 login for submissions, judging information, standard input and output examples, language references (C/C++, Java 7 and 8, Perl, PHP, Python, Ruby), and to a problem set and a scoreboard for each of three contests: scripting, practice and regional. It ends with errata: a contest-wide section (no spaces in file names, Java class naming, a corrected sample output for problem C, Poker), a short note on problem B, a blank ACU section, and ASCII-art figures under LSU.

    Our copy holds 150 files, 132 of them pages: the front page, a small page of standard input and output examples, and local copies of reference documentation, mostly the Java 7 and 8 class documentation (87 pages), C++ and C reference pages (34) and C library guides. The problem set and scoreboard pages that the front page links to are not in our copy, and the Java documentation is only partly present. The seven images and the style sheets of the site are in our copy.
