  description: |-
    Scoreboard of the 2015 South Central USA Regional Contest, its summary view: 60 teams with rank, team name and institution in brackets, number solved, penalty time, and for each of the nine problems A to I the number of attempts and the solving time in minutes. A final column gives total attempts and solved, and a last row gives submitted, first yes and total yes counts per problem. Teams with no solved problem share rank 56. The page shows the update time Saturday 7 November 2015, 17:36:22, and links to other views (finals, full, per-state, graduate and undergraduate, and per-site boards for Louisiana State University, Abilene Christian University and Baylor University) which are not in our copy.
