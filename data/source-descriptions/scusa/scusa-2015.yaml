  description: |-
    Final standings of the 2015 South Central USA Regional Contest: 60 teams with rank, team name, institution, number of problems solved, total time and a citation. Places 1 to 30 carry a place citation from First Place to Thirtieth Place, and the other 30 teams are listed as Honorable Mention. First place is Rice Gray from Rice University with 7 solved. There is no per-problem detail.
