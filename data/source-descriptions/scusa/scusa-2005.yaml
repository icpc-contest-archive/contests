  description: |-
    Website of the 2005 South Central USA Regional Programming Contest, in English, run jointly by Louisiana State University and the University of Texas at Arlington. The welcome message says Arlington will host a second site of 20 teams as the first step in moving the regional to a distributed contest, and the home page thanks volunteers after Hurricane Katrina. The pages give the welcome message, news items, the contest rules (which give the contest as 11 and 12 November 2005), hints, instructions for compiling, an index of PC^2 documentation, and a Next Year page proposing a contest spread over several host sites in a single day. The navigation also links the host's contest sites for 2000 to 2004.

    The site holds a Results page with the PC^2 summary scoreboard and a Problem Set page for eight problems: an HTML statement and a PDF for each, judge solutions in C++ for all eight and in C for four (problems 1, 3, 6 and 8), and judge input and output files. Our copy holds 64 pages, some of them the same page at another address or its printable version. The separate pages for the Arlington and LSU sites (schedules, quick facts, information, FAQ, environment) and the other scoreboard views are not in it.
