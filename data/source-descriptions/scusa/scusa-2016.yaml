    Regional problem set page of the 2016 ACM ICPC South Central USA Regional Programming Contest, in English: a table of eleven problems numbered 1 to 11 (Alley, Bouncing Balls, Collision Alert, Cookie Cutting, Corrupted Gradebook, Election, Filesystem, FizzBuzz, Hit Song, Placing Plates, The ABC Conjecture). Each row links an HTML statement and a PDF; the solution and judge data columns are empty.

