  copy: scusa/scusa-2016/website/2026-09-05-wayback-3f7cda58
  title: 2016 SCUSA Regional Programming Contest Local Doc Server
  language:
  - en
  description: |-
    Local documentation server of the 2016 SCUSA Regional Programming Contest, in English. The front page links to PC^2 login, an errata page, judging information, standard input and output examples, language references (C/C++, Java, Python, PEP 8) and, for each of three contests (open practice, practice, regional), a problem set page and a scoreboard.

    Our copy holds 150 files, 86 of them pages: the errata page (five contest-wide notes on resubmitting to recreated PC^2 problems, input handling in the practice problem, C/C++ compile flags and Java commands, plus one LSU printing note), the judging page with a decision tree image, three problem set pages and three scoreboards: open practice (67 teams, problems A to F, updated 28 October 2016), practice (67 teams, one problem) and regional (68 teams, problems A to K, updated 29 October 2016 17:06). The regional problem set page lists eleven problems by title, but its statement links lead to pages that say 'Invalid request!' or are not in our copy. The open practice page links a PDF of 8 pages, which is in our copy: problems A to F. The practice page lists one problem, Mixed Fractions.

    The rest is local reference documentation, only partly present: C and GNU C library guides, C++ reference pages, the front pages of the Java 8 and Python 2.6, 2.7 and 3.3 documentation, and PEP 8.
