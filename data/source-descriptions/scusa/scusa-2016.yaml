    Final standings of the 2016 South Central USA Regional Contest: 67 teams with rank, team name, institution, number of problems solved, total time and a citation. Places 1 to 33 carry a place citation from First Place to Thirty-third Place, and the other 34 teams are listed as Honorable Mention. The top four places are teams of the University of Texas at Austin with 10 solved. There is no per-problem detail.
