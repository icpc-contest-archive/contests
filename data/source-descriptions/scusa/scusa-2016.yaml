  description: |-
    Scoreboard of the 2016 South Central USA Regional Contest its summary view: 68 team rows with rank, team name and institution in brackets, number solved, penalty time, and for each of the eleven problems A to K the number of attempts and the solving time in minutes. A final column gives total attempts and solved, and a last row gives submitted, first yes and total yes counts per problem. The two teams at the bottom share rank 67 with no problem solved. The page shows the update time Saturday 29 October 2016, 17:06:18, and links to other views (finals, full, per-state, graduate and undergraduate, and per-site boards for ACU, Baylor University and Louisiana State University) which are not in our copy.
