  description: |-
    Problem set page of the 2009 ACM ICPC South Central USA Regional Programming Contest: a table of eight problems, numbered 1 to 8 (The Neptune Adventure, Phil In the Blanks, Honeycomb, Honeycomb, Me Want Honeycomb!, YO!, Barcode of Judgment, Frenemies, Know When to Hold Them, I'm Attacking the Darkness!), each with a link to an HTML statement and one to a PDF. The columns Solution(s) and Judge Data are empty, although the page text says the page holds judge data and sample solutions; the page markup also holds a link to a zip file of the problems, but it is commented out and shows nowhere on the page. The page ends with a disclaimer of the hosts and a copyright line for 1999 to 2009. Our copy is the list page alone; the statements are not part of this file.
