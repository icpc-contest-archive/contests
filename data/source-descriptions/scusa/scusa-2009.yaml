    Standings of the 2009 South Central USA Regional Programming Contest: 73 teams with rank, team, institution, problems solved, time and citation. Places 1 to 29 each carry their own rank and an ordinal citation (First Place through Twenty-ninth Place); the other 44 teams, all with no problem solved, share rank 30 with the citation Honorable Mention. First place is 4/27 Bumpkins from The University of Texas at Austin with seven problems. There is no per-problem detail. The times differ from those on the Regional scoreboard of the contest (for the first team 1237 here, 1277 there).
