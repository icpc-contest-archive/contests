  read: '2026-11-16'
  rubric: 1
  copy: scusa/scusa-2009/website/2026-09-05-wayback-ab837e3b
  title: SCUSA Regional Programming Contest Local Doc Server
  language:
  - en
  description: |-
    Local documentation server of the 2009 South Central USA Regional Programming Contest, in English, handed to teams for use during the contest. The front page links to reference documentation (PC^2 guides, a C/C++ reference, a C library guide, the C++ STL, Java 1.5 and Java 6 documentation and JDKs, and Perl, PHP, Python and Ruby references for the scripting contest) and to a problem set and a scoreboard for each of three contests: Scripting, Practice and Regional. Below the links is an errata section: contest-wide notes on judging (judgments, time limit, whitespace, language-specific rules, corrections to two problems) and headings for the five sites ACU, ECU, LETU, LSU and TAMU, of which only LETU and LSU carry text (a printing banner rule).

    Our copy holds 150 files, 117 of them pages. The Regional problem set is there: a list of eight problems with an HTML statement and a PDF for each. The Practice problem page shows one problem. The three scoreboards are there: Regional (73 teams, problems A to H), Scripting (72 teams, problems A to G) and Practice (73 teams, problem A). The Scripting problem set is linked from the front page but is not in our copy, and some Java JDK files were not captured.
