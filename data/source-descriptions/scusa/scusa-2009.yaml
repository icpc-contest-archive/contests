  description: |-
    Summary scoreboard of the Regional contest, headed 2009 ACM South Central USA Regional Programming Contest, with a last-updated stamp of Sat Nov 7 17:20:55 2009. It lists 73 teams with rank, name (the institution in parentheses), problems solved, penalty time, and for each of the eight problems A to H the number of attempts and the time of the first correct run (a dash in place of the time where attempts were made without a correct run, 0/0 where none were made). A last column gives attempts and solved per team, and a final row gives submitted, first-yes and total-yes counts per problem.

    Twenty-nine teams solved at least one problem, the most being seven (4/27 Bumpkins from U Texas - Austin in first place). The other 44 teams share rank 30. The page links to other views (finals, full, by state, by graduate or undergraduate program, by site, first solved), which are not in this copy.
