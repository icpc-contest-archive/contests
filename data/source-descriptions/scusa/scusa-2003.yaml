  description: |-
    Home page of the 2003 South Central USA Regional Programming Contest website, hosted at Louisiana State University, in English. Our copy holds 3 pages, all of them the home page captured under three addresses, plus two style sheets and three images. The page says the contest is over and links to the final results and the problem set. It says the judge data has not been posted because its only copy was on a server that was reformatted shortly after the contest, and that recovery from backups was still being tried. It also links the welcome message, rules, schedule of events, quick facts, FAQ (marked updated Oct 26, 2003), hints, contest environment and compiling instructions, and the sites of the 2003, 2002, 2001 and 2000 contests, and carries a note that Free Pascal is used in place of Kylix.
