  description: |-
    Standings of the 2003 ACM South Central USA Programming Contest, a page titled View Standings: 79 teams, each with rank, team (institution and team name), a citation written out as the place from First Place to Seventy-ninth Place, number of problems solved (#Solved) and time. Eight teams solved 8 problems, the maximum shown; the University of Texas at Austin team Bevo Pivot is first with 8 solved and a time of 701. Every team has its own place; there are no ties.

    The page gives no per-problem detail and no attempt counts.
