  description: |-
    Regional problem set page of the 2017 ACM ICPC South Central USA Regional Programming Contest, in English: a table of eleven problems A to K (Batter Up, Collection, Faulty Robot, Honey Heist, Hopscotch, Nine Knights, No Duplicates, Orderly Class, The Uncertainity of Politics, Ring String, State Fair). Each row links an HTML statement and a PDF; the solution and judge data columns are empty. A link leads to the complete problem set as one PDF.

    Only the page itself is in our copy. The statements and PDFs it links to are not.
