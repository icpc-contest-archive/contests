  rubric: 1
  copy: scusa/scusa-2017/website/2026-09-05-wayback-447afe29
  title: 2017 SCUSA Regional Programming Contest Local Doc Server
  language:
  - en
  description: |-
    Local documentation server of the 2017 SCUSA Regional Programming Contest, in English. The front page links to PC^2 login, an errata page with counts (10 contest-wide, 2 under LSU), judging information, standard input and output examples, language references (C/C++, Java 8, Python 2.7 and 3.5, PEP 8) and, for each of three contests (open practice, practice, regional), a problem set page and a scoreboard.

    Our copy holds 150 files, 138 of them HTML pages. The errata page corrects the statements of regional problems A, C, F, G, H, I and K and gives Eclipse library path steps and printing instructions. The judging page gives compile commands and a decision tree image. Problem set pages: open practice (six problems A to F as PDF links, borrowed from the 2013 ICPC Northwest Pacific Regional), practice (one problem, Mixed Fractions) and regional (eleven problems A to K with links to HTML statements and PDFs, which are not in our copy). Scoreboards: open practice (75 teams, problems A to F, updated Friday 3 November 2017), practice (75 teams, one problem) and regional (75 teams, problems A to K, updated Monday 6 November 22:53), the last with 15 other views such as finals, full, first solved and boards by state, program and site.

    The rest is reference documentation: 99 pages of the C/C++ reference, C and GNU C library guides, and only the front pages of the Java 8, Python 2.7 and 3.5 documentation.
