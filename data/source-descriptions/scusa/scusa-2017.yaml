    Category page of the Baekjoon Online Judge for the 2017 South Central USA Regional Programming Contest, with the site interface in Korean. It lists eleven problems A to K as Baekjoon problem numbers (15096 to 15103 for most, and 31039 to 31041 for B, F and K), with title, number of users who solved each, number of submissions and acceptance ratio. Problems A, I, J and K are marked as special judge. The category is filed under ICPC Regionals, North America. The page lists problems only; the statements are on separate problem pages that are not in our copy.
