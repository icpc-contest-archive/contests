    Final standings of the 2017 South Central USA Regional Contest: 75 teams with rank, team name, institution, number of problems solved, total time and a citation. Places 1 to 40 carry a place citation from First Place to Fortieth Place, and the other 35 teams are listed as Honorable Mention. First place is UT Orange from The University of Texas at Austin with 10 solved. There is no per-problem detail.
