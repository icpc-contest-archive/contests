    Scoreboard of the 2017 South Central USA Regional Contest its summary view: 75 teams with rank, team name and institution in brackets, number solved, penalty time, and for each of the eleven problems A to K the number of attempts and the solving time in minutes. A final column gives total attempts and solved. Four teams at the bottom share rank 73 with no problem solved. First place is UT Orange from UT Austin with 10 solved. The page shows the update time Monday 6 November 2017, 22:53:20, and links to other views (finals, full, per-state, graduate and undergraduate, and per-site boards) that are not in our copy.
