  description: |-
    Website of the 2008 ACM ICPC South Central USA Regional Programming Contest, in English. Our copy holds 150 files, 143 of them pages. It has Welcome, Quick Facts (October 17-18, 2008; registration $175, or $125 if early), Rules, Hints, Compile Howto and FAQ pages, an announcement of a scripting contest, and pages for the four host sites (Abilene Christian, Baylor, East Central and Louisiana State universities), each with a schedule of events. LSU's local information page and the Baylor site FAQ are linked but not in our copy.

    The results section links the contest report, the final scoreboard, the problem set and the local documentation. The problem set holds nine problems, 1 to 9: HTML and PDF statements, sample solutions in C++ and Python (problem 7 also in Java), and judge input and output; the linked zip files are not in our copy. The scoreboard has the Summary, Finals, Full, SumTime, FullNums and SumAtt views and the ACU, ECU and LSU site views; the first-solved, by-state, by-program and Baylor views are not in our copy.

    The local documentation shown to teams during the contest is included: references for C, the C++ STL, Perl, PHP and Python, the Friday scripting contest problems 1 to 8, seven of the nine Friday practice problems, one Saturday practice problem, the Saturday practice scoreboard, and errata. Java and Ruby documentation is linked but not in our copy.
