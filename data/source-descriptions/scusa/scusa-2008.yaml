    Category page of Baekjoon Online Judge, in Korean, for the 2008 South Central USA Regional Programming Contest, filed under ICPC Regionals, North America. It lists nine problems, judge numbers 4521 to 4529, labelled 1 to 9, with English titles from Rank and File to Tribute (Editor), and for each the number of accepted users, submissions and acceptance ratio. In our copy problem 7 shows 3 accepted of 3 submissions, problem 9 shows 1 of 11, problem 4 shows none of 1, and the other six show no submissions. The statements are not on this page, only links to them. The surrounding site menu is in Korean.
- url: https://acm2008.scusa.lsu.edu/results/report.php
  read: '2026-11-16'
  rubric: 1
  copy: scusa/scusa-2008/editorial/20200925-wayback-b1d6a023/page.html
  title: Report for 2008 South Central USA Regional Programming Contest
  language:
  - en
  description: |-
    Report by the regional contest directors on the 2008 South Central USA Regional Programming Contest, in English. It says the region hosted 68 teams from Louisiana, Oklahoma and Texas in a two-day contest on October 17-18 at four sites: Abilene Christian University, Baylor University, East Central Oklahoma University and Louisiana State University. It tells the course of the event: Friday open practice and an optional scripting contest, a 45 minute practice contest on Saturday morning, and a five-hour contest starting at noon run with PC^2 version 9, with recruiters from IBM at Baylor and a talk on HPC system administration from an administrator at Argonne National Lab. A thank-you list names the sites' staff, judges, sponsors and LSU groups. The page links to the problem set, the scoreboard and the local documentation.
