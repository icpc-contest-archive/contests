  description: |-
    Standings of the 2004 ACM South Central USA Programming Contest sponsored by IBM, from the ICPC regional standings page: 75 teams with rank, team (institution and team name), citation, number of problems solved and time. Fifty-two teams carry a rank: places 1 to 12 are single teams with citations First Place to Twelfth Place, 15 teams share thirteenth place with 3 problems solved, and 25 share twenty-eighth place with 2 problems solved. The remaining 23 teams are listed without rank as Honorable Mention, with no number solved. Time is given only for the twelve teams in places 1 to 12. First place is Texas A&M University with 5 problems solved. No per-problem detail.
