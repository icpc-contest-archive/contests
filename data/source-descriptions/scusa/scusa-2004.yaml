  description: |-
    Website of the 2004 South Central USA Regional Programming Contest, hosted at Louisiana State University and written in English. Its pages give a welcome message, news items, the contest rules, a schedule of events for 5 and 6 November 2004, quick facts (dates, registration fees, facilities, judging with PC^2), a FAQ, hints, a description of the planned contest environment, hotel information and instructions for compiling. The navigation also links the host's contest sites for 2000 to 2003. Our copy holds 20 pages, some of them the same page at another address or its printable version.

    A Results page and a Problem Set page are included. The Results page is only a PC^2 scoreboard front page with buttons for several report types and a description of the summary report; it holds no team results. The Problem Set page lists eight problems; the statement, PDF and data files it links to are not part of our copy. Two PC^2 pages are also included: an index of PC^2 documentation and a PC^2 Version 8.5 FAQ and troubleshooting page.
