  description: |-
    Website of the ICPC North America South Central Regional, in English. The main page is headed 2026 Regional Programming Contest, dated Saturday, November 7, 2026, with tabs for contest info, schedule, sites, getting started, rules and results. The results tab says the regional is over and names the three Division 1 teams that represent South Central at the North America Championship (placeholder5 as South Central Champion, codex as 3rd place, whoosh as 5th place) together with a wildcard team from Rice University, and the first three of Division 2 (Code Blazers, Terra and Dawn of the Dead Code), each with its university. It links to the Kattis scoreboards of both divisions. The other tabs give the day's schedule, seven host sites with site information, an introduction for new teams, the rules and the regional leadership. The foot of the page still shows the results of the contest of February 24, 2024.

    Two more pages are in our copy: an archive of past South Central regionals from 2005 to 2024, listing for each year links to standings and problems (a website link only for 2023), and a Hall of Fame page about a volunteer award and a partner award.

    Our copy holds five pages, two of which repeat the archive and Hall of Fame pages under another address. Style sheets, scripts and images are present; links to Kattis and other ICPC pages lead outside it.
