  language:
  - en
  teams: 71
  description: |-
    Final standings of the 2018 South Central USA Regional Contest, a single table of 71 teams from 30 institutions with rank, team, institution, number solved, time, medal and a citation. Twelve teams carry medals (four gold, four silver, four bronze, ranks 1 to 12, UT Orange of the University of Texas at Austin first with 11 solved and time 1513), 44 are marked Ranked, and the last 15 are marked Honorable and have no rank number. Ties share a rank number, for example four teams at rank 13. The citation column gives the place in words for the ranked teams. No per-problem results are shown.
