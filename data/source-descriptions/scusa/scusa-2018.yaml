  description: |-
    Final standings from the Kattis site of the 2018 South Central USA Regional Contest: 71 teams in rank order with solved count, total time, and for each of the problems A to L the number of tries and, for solved problems, the minute of the accepted run; an unsolved problem shows its tries and a dash. The page states that the contest is over and gives a five-hour contest from 19:15 to 00:15 CET. Teams are listed by team name with no institution column (a few names carry a school in parentheses). UT Orange is first with 11 problems solved and time 1513.

    The page also shows filters for site (Baylor University, OU/SNU, SELU, University of Texas at San Antonio), state and program type (graduate, undergraduate), and a legend for first to solve, solved, attempted and pending judgement; the table shown is the all-sites view.
