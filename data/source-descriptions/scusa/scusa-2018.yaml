- url: http://acm2018.scusa.lsu.edu
  read: '2026-11-16'
  rubric: 1
  copy: scusa/scusa-2018/website/2026-09-05-wayback-608229dc
  title: Welcome to the 2018 ACM ICPC South Central USA Regional Programming Contest Web Site
  language:
  - en
  contest_date: '2018-11-10'
  description: |-
    Website of the 2018 ACM ICPC South Central USA Regional Programming Contest, in English. The front page announces the one-day contest of 10 November 2018, says it can be followed live on Kattis, links an open contest with the same problem set, and lists five sites: Baylor University, Louisiana State University (administrative only), Southeastern Louisiana University, Southern Nazarene University / University of Oklahoma, and the University of Texas at San Antonio. Pages for the whole region cover a welcome message, quick facts (registration fees and deadlines, Kattis as judging system), the rules, hints, a compile howto, a FAQ and contact details.

    Each of the five sites has its own page, and four have their own information and schedule pages (the Baylor site also has a dining page, the LSU site its own FAQ and quick facts, the SNU/OU site its own FAQ); the Southeastern Louisiana University site includes a one-page PDF listing hotels. The results page congratulates the University of Texas at Austin team Orange as winner, thanks the hosts and judges, and describes the Resolver and video-stream presentation of the last contest hour. Its links to the regional scoreboard, the problem set and a local documentation server lead to another host and are not part of our copy.

    Our copy holds 87 saved files, 75 of them pages, which are 28 distinct pages saved several times under http, https and alternate addresses; style sheets and logos are included.
