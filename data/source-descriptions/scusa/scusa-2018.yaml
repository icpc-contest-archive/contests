  language:
  - en
  contest_date: '2018-11-10'
  description: |-
    Results page of the contest website, in English. It congratulates the University of Texas at Austin team Orange for winning the regional and names no other team. It lists the sites that hosted the contest, thanks the chief judge, the chief technical director, the Kattis team and the competitors, and notes that the contest was one day for economic reasons. It describes how the last hour of the frozen scoreboard was shown with the Resolver and streamed to YouTube, and links a recording of it.

    Links to the regional scoreboard, the regional problem set and a local documentation server lead to another host and are not on the page itself.
