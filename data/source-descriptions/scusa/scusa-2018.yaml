  description: |-
    Kattis page listing the 12 problems of the 2018 ICPC South Central USA Regional Contest in alphabetical order by name, from Communications Satellite to Warehouse. For each problem it gives the fastest run time, the shortest solution length, the number of authors, full solves, the solve ratio, a difficulty rating with a label (three Easy, five Medium, four Hard) and the statement language, English for all twelve. The figures are Kattis statistics at the time of capture, not contest results. The page lists names with links to the problems.
