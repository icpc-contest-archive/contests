    Category page of Baekjoon Online Judge, in Korean, for the 2007 South Central USA Regional Programming Contest, filed under ICPC Regionals, North America. It lists nine problems, judge numbers 4530 to 4538, labelled 1 to 9, with title, number of accepted users, submissions and acceptance ratio. Problem 1 has a Korean title; the others carry their English titles. In our copy problem 1 shows 3 accepted of 10 submissions and problem 2 shows 24 of 34; the other seven show none. The statements are not on this page, only links to them. The surrounding site menu is in Korean.
