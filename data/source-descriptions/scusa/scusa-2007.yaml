  description: |-
    Website of the 2007 South Central USA Regional Programming Contest, in English: menus for Welcome, Quick Facts, Rules, Hints, Compile Howto and FAQ, the four host sites (Abilene Christian University, East Central University, Louisiana State University, Texas A&M University) and PC^2 documentation. Our copy holds 146 files, 132 of them pages. The quick facts and rules give the dates as November 2-3, 2007, a registration fee of $175 per team ($125 for early registration) and the contest facilities; each host site has an index, a schedule of events and a local information page, and the ECU and LSU sites also have a contest environment page.

    The results are inside the site: a problem set page for nine problems, numbered 1 to 9, with statements as HTML pages and as PDFs of one or two pages, sample solutions in C++ (and in Python for eight of the nine), and judge input for all nine. Judge output is in our copy for problems 1 to 8 only, and the zip file linked for each problem is not in our copy. A scoreboard page (the summary view) shows each team's solved count, time, and tries and time per problem, and a first-solved list gives the first teams to solve problems A and D to I. A text file of about 650 software package names is filed under the LSU site. The other scoreboard views (finals, full, by state, by site) are linked but are not in our copy.
