    Final standings of the South Central USA Regional Programming Contest, produced with PC^2 (the footer names version 8.3): 84 rows with rank, team name (institution and team name), number of problems solved and score. 74 teams carry a rank, from the University of Texas at Austin team Alpha in first place with 8 problems solved and a score of 1396 down to ties at rank 69. Ten rows named Dynamic Team (numbered 0 to 9) are listed without a rank, placed among the ranked teams by their results.

