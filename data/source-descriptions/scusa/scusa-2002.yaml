  description: |-
    Category page of the Baekjoon Online Judge, in Korean, for the 2002 South Central USA Regional Programming Contest under ICPC Regionals, North America. It lists 8 problems numbered 9971 to 9978 on the judge, with a second, unlabelled column numbered 1 to 8, the English titles, and per problem the number of users who solved it, the number of submissions and the acceptance rate. The Hardest Problem Ever has 182 solvers out of 324 submissions; four problems show no submissions.

