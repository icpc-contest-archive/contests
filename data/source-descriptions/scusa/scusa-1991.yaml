  description: |-
    Results list posted to the comp.org.acm newsgroup on 19 November 1991 by a contact at Texas A&M University, as shown in a Google Groups page. The post announces the final team rankings of the 16th Annual ACM South Central Regional Programming Contest and says that problems, test cases and sample solutions are to follow on an FTP site. Below it, 71 teams are listed in order of problems solved, with ties ordered by time. Each entry gives the team number, the school, the number of correct problems and the total time. There is no rank column and no per-problem detail. Rice University's team 46 is first with 4 problems and a time of 599; 48 teams solved at least one problem and 23 solved none.

    The Google Groups menus and notices surround the post.
