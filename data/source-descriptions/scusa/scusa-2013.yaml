  description: |-
    Problem list of the 2013 ACM ICPC South Central USA Regional Programming Contest, in English: eight numbered problems, Drop Zone, Effective Infection Time, Outpost Navigation, Multikill, Virology, Worst Case Scenario, Zombie Invasion and Zombdar. Each row links the statement as html and pdf, sample solutions in C, C++, Java or Python (problem 2 has the most, including a Java one), and judge input and output files. The page also carries the host site's menu with links to the report, scoreboard and local documentation. The linked statements, solutions and data are not part of this file.
