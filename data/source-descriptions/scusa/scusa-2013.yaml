  description: |-
    Summary scoreboard of the regional contest: 59 teams with rank, team name and institution in brackets, number solved, time, and for each of problems A to H the number of runs and the solution time (a dash in place of the time where the problem was not solved), plus total attempts and solved. A last line gives submitted, first yes and total yes per problem. First place is Ocelot (UTB) with all eight problems solved, time 897; the three teams with no solutions share rank 57. The page is stamped as updated Sat Nov 2 17:03:45 2013.

    Links at the top lead to other views of the board (Finals, Full, SumTime, FullNums, SumAtt, FirstSolved) and to views by state, graduate program and site; those pages are not part of our copy.
