  copy: scusa/scusa-2013/website/2026-09-05-wayback-d2a0a728
  title: 2013 SCUSA Regional Programming Contest Local Doc Server
  language:
  - en
  description: |-
    Local documentation server of the 2013 South Central USA Regional Programming Contest, in English, set up for the teams to use during the contests. The 2013 front page links reference documentation for C/C++ (cppreference, a C library guide and the STL), Java 6 and 7, Perl, PHP, Python and Ruby, the PC^2 contest system and standard input/output examples, and a table of problem sets and scoreboards for the Scripting, Practice and Regional contests. Its errata give the gcc, g++ and javac commands used by PC^2, name the eight regional problems from Drop Zone to Zombdar, warn not to submit source files with spaces or other special characters in their names, and note for the Baylor site that the printed problem order differs from the online one.

    Our copy holds 150 files, 145 of them pages; 130 of the pages are Java documentation pages, the rest C guide, C++ reference and example pages and two front pages. The second front page is titled 2014 SCUSA Regional Programming Contest Local Doc Server and lists a single Spring Prelim problem set and scoreboard. The problem sets and scoreboards that the 2013 front page links to are not in our copy, and neither are the PC^2, STL, Perl, PHP, Python and Ruby pages.
