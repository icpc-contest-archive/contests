    Category page of the Baekjoon Online Judge, in Korean, for the 2013 South Central USA Regional Programming Contest (under ICPC Regionals, North America): a table of eight problems, numbered 1 to 8 within the contest and 9427 to 9434 on the judge, titled Drop Zone, Effective Infection Time, Outpost Navigation, Multikill, Virology, Worst Case Scenario, Zombie Invasion and Zombdar. Each row has label links for source, multilingual and category, and the judge's counts of users who solved it, submissions and correct ratio. The page has the judge's menus and login links. It names the problems only; the statements are on separate pages that are not part of our copy.
