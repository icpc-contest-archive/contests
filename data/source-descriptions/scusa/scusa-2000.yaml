  read: '2026-11-16'
  rubric: 1
  copy: scusa/scusa-2000/editorial/20231130-wayback-184a42f3/report.html
  title: South Central USA Regional Programming Contest - Contest Report
  language:
  - en
  description: |-
    Contest report on the contest website of Louisiana State University, in English. It says the contest was held on 10 and 11 November 2000 at LSU in Baton Rouge, with 69 teams from 41 schools from Texas, Oklahoma and Louisiana, and that it was the first ACM contest hosted by LSU. There were 8 problems; 56 teams solved at least one and the top two teams both solved 5. The contest started an hour late because of technical problems with Windows 2000 and the PC^2 system from California State University, Sacramento. The report links to the problem sets, the final standings and the attempts and times grids, mentions a QuickTime video shown at the awards banquet, and thanks IBM, the FBI Computer Crime Unit from New Orleans, several LSU departments and the volunteers.
