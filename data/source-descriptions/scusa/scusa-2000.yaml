  read: '2026-11-16'
  rubric: 1
  copy: scusa/scusa-2000/website/2026-09-05-wayback-027b1dff
  title: South Central USA Regional Programming Contest - Contest Home Page
  language:
  - en
  description: |-
    Website of the 2000 South Central USA Regional Programming Contest, published by Louisiana State University, which hosted the contest on 10 and 11 November 2000. In English. The home page, written after the contest, thanks the participants and says 69 teams competed. Our copy holds 35 pages (the home page and the solutions index are each saved under two addresses) and 13 GIF images. The pages cover the contest details, the schedule and a detailed working schedule of the two days, local information on hotel and food, an FAQ, a welcome message, the contest rules, the software available, login and PC^2 contestant instructions, a contest report, a pictures page and a movies page.

    Results and problems are inside: final standings with rank, team, solved and penalty, a grid of submission attempts per team and problem, a grid of attempts and times, a problem and solutions index, seven problem statements as PDF files, and eight judges' solutions as text files in Java, C and C++. The site states that the judge input and output data are not posted at the authors' request.

    The statement PDF of the problem Virtual Computer is not in our copy, although the problem index links to it. The photographs and the movie linked from the pictures and movies pages are not in our copy, and links to the ACM and LSU sites lead outside it.
