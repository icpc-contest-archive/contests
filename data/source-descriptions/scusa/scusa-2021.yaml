  title: SCUSA ICPC South Central USA Regional Contest
  language:
  - en
  contest_date: '2022-03-05'
  description: |-
    Website of the 2021 South Central USA Regional Contest, written by the regional's hosts in English. The front page announces the contest for March 5th, 2022 and has sections on registration (deadline February 25, 2022, no fee), regional rules for an online contest run over the open Internet, the two divisions, the practice contest, the schedule and the Kattis login addresses of each division, proctor information, an FAQ, the staff and contact details. It also has a section looking for site hosts for the next year's regional.

    The contest report with the results is a separate page of the site. Our copy holds two distinct pages: the front page, saved under both its http and https addresses, and the results page; two images are also in our copy. The results page links to the final standings (on the ICPC site) and to the standings and problems of each division; none of those pages is part of our copy.
