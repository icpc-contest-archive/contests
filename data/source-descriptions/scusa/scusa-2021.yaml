  description: |-
    Contest report from the regional's website, in English. It states that the contest was held on Saturday, March 5th, 2022 as a micro-site contest in which each school hosted and proctored its own teams, with 52 teams in Division I and 15 in Division II, and that the contest and Kattis ran smoothly and that a resolver was run. It names the top five teams of each division with their universities, the first-placed team of each of Louisiana, Oklahoma and Texas, and for each problem of each division the first team to solve it or that it was not solved.

    The page links to the final standings (on the ICPC site) and to the standings and problems of each division; none of those pages is part of our copy. A staff list and contact details follow the report.
