  description: |-
    Final standings of the 2021 ICPC South Central USA Regional Contest: 67 teams in one table, with rank, team, institution, number solved, time, medal and citation. The medal column holds 4 Gold, 4 Silver and 4 Bronze Medal rows, 38 rows marked Ranked and 17 marked Honorable; the Honorable rows have no rank. Comets 1 of The University of Texas at Dallas is first with 9 solved and a time of 822.

    The rank column does not follow the number solved: 14 teams share rank 27, among them teams with 5 solved that are listed after teams at rank 26 with 1 solved. No per-problem results.
