    Statement of problem 3, Risk, of the 1997 ACM South Central USA Programming Contest, in English. The statement asks for the minimum number of countries to conquer between two countries on a board of 20 countries. It gives the input format, the required output format with column positions, and a sample input and sample output with two test sets. A connection diagram for the first sample is in our copy as an image. The page does not hold the other problems of the contest.
