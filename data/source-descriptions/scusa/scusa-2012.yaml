  copy: scusa/scusa-2012/website/2026-09-05-wayback-50af033d
  title: 2012 SCUSA Regional Programming Contest Local Doc Server
  language:
  - en
  description: |-
    Local documentation server of the 2012 South Central USA Regional Programming Contest, in English, set up for the teams to use during the contests. The front page links reference documentation for C/C++ (including the STL), Java 1.5, 6 and 7, Perl, PHP, Python and Ruby, the PC^2 contest system, and standard input/output examples. A table lists three contests, Scripting, Practice and Regional, each with a problem set and a scoreboard; the regional row has two scoreboards, one from an hour before the end and the final one. An errata section follows, with contest-wide corrections for problems 1, 3, 5, 6, 7 and 8 and empty sections for the Baylor, LETU and LSU sites.

    Our copy holds 150 saved addresses, 128 of them pages. Most are Perl, PHP, Python, Ruby, C++ and PC^2 reference pages (the PC^2 ones include five PDFs); for Java only a directory listing is held, not the documentation. The contest pages in it are the problem lists of the three contests (8 regional problems, listed with links to statements that are not in our copy; 6 scripting problems with a PDF statement each; 1 practice problem with a PDF) and the regional, practice and scripting scoreboards. The earlier regional scoreboard is not in our copy.
