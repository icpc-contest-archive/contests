  title: 'The 2012 South Central USA Regional Contest: Summary'
  language:
  - en
  teams: 58
  problems: 8
  times: true
  tries: true
  description: |-
    Scoreboard of the regional contest (Summary view) with a table of 58 teams: rank, team name with its university, problems solved, total time, and for each of the eight problems A to H the number of attempts and the solve time (or no time for an unsolved problem), plus attempts and solved totals per team. The last row, headed "Submitted/1st Yes/Total Yes", gives three counts for each problem. LeTourneau's VC-12 is first with 4 solved and time 656, and ranks run to a tie at 40 for the teams with no solved problems. The page states it was updated on Saturday 20 October 2012.

    The top of the page links to other views (finals, full, by state, by graduate or undergraduate program, by site, first solved); those pages are not part of our copy.
