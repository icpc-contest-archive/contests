  description: |-
    Final standings for the regional contest: 58 teams with rank, team name, institution, problems solved, time, medal and citation. LeTourneau University's VC-12 is first with 4 solved and time 656. Three gold, three silver (one spelled 'Sliver') and three bronze medals are marked, and the teams that follow carry the citation Honorable Mention, with ties at rank 40. No per-problem detail.

    This is a table generated by the archive from the data of the ICPC's own site, not a page from the contest; it states ICPC year 2013 and 58 teams.
