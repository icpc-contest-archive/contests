  description: |-
    Results index page of the 2012 ACM ICPC South Central USA Regional Programming Contest site at LSU, in English. It states that the contest is over and links to the contest report, the local documentation, and the problem sets and scoreboards of the scripting, practice and regional contests. Side menus link to the welcome message, quick facts, rules, hints, FAQ, and pages for the Baylor, LeTourneau and LSU sites, and to earlier years' contests back to 2000.

    The page holds no results table of its own and none of the linked pages are in our copy.
