- url: http://ld2012.scusa.lsu.edu/
  read: '2026-11-16'
  rubric: 1
  copy: scusa/scusa-2012/website/2026-09-05-wayback-50af033d
  title: 2012 SCUSA Regional Programming Contest Local Doc Server
  language:
  - en
  description: |-
    Local documentation server of the 2012 South Central USA Regional Programming Contest, in English. The home page lists the documentation available to teams during the contest (PC^2, C and C++ references, the C++ standard template library, Java 1.5, 6 and 7 documentation and JDKs, and Perl, PHP, Python and Ruby manuals for the scripting contest) and a table of problem sets and scoreboards for a scripting contest, a practice contest and the regional contest, with the regional scoreboard given as of one hour before the end and as final. Below it are errata and clarifications for regional problems 1, 3, 5, 6, 7 and 8; the sections for the Baylor, LETU and LSU sites are empty.

    Our copy holds 150 files, 128 of them pages (several addresses are captured under both http and https). It includes the three problem set pages (eight regional problems with HTML statement links and empty solution and judge-data columns; one practice problem and six scripting problems with PDF statements), the three scoreboard pages, 12 PDFs (PC^2 guides and release notes, and the practice and scripting statements) and the language manuals. Some manual pages were not fetched.
