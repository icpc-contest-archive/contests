  tries: true
  description: |-
    Summary scoreboard of the regional contest: 58 teams, with rank, team name and institution in brackets, number solved, time, and for each of problems A to H the number of runs and the solution time (0/0 where there were no runs, a dash in place of the time where the problem was not solved), plus total attempts and solved. A last row gives totals per problem (submitted, first yes, total yes). Six teams solved four problems and none solved more; first place is VC-12 (LeTourneau) with four problems and time 656. The 19 teams with no solutions all share rank 40. The page is stamped as updated Sat Oct 20 18:08:08 2012.

    Links at the top lead to other views of the same board (Finals, Full, SumTime, FullNums, SumAtt, FirstSolved) and to views by state, graduate program and site; those pages are not part of our copy.
