  description: |-
    Single page of the regional's website, in English, for the contest held on February 25th, 2023. At the top it links to recordings of the Division I and Division II resolvers, the Kattis scoreboards, the two problem sets and the two judges' notes; these are separate files and not part of this page. A contest report says that five sites took part with 42 teams, that the practice session ran 30 minutes and that there were two divisions.

    The page then holds the Division II scoreboard (5 teams) and the Division I scoreboard (36 teams). Each row gives position, team name, university, number solved, time and the letters of the problems solved, without tries or times per problem. Below are sections on useful information, registration, the Southern Conference that joins three regionals, divisions, the practice contest, an FAQ, the staff, three announcements mailed in January and February 2023, a calendar of dates and the timeline of the contest day.
