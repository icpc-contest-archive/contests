  copy: scusa/scusa-2010/website/2026-09-05-wayback-54d40594
  title: SCUSA Regional Programming Contest Local Doc Server
  language:
  - en
  description: |-
    Local documentation server of the South Central USA Regional contest, in English, provided to teams during the contest. The front page links to reference documentation (PC^2, a C/C++ reference, a C library guide, the C++ STL, Java 1.5 and Java 6 documentation and JDKs, and Perl, PHP, Python and Ruby for the scripting contest, with standard input and output examples) and to a problem set and a scoreboard for each of four contests: Test (dated Oct 23), Scripting, Practice and Regional. Below the links is an errata section. The contest-wide errata corrects problems B to H of the Regional problem set (input limits, sample output, input format, bounds) and clarifies how problem C is judged; it also refers to a flow chart used for all judgements and says the scoreboard of the Saturday practice contest was wiped by mistake. Headings for four sites (Baylor, ECU, LETU, LSU) carry no text.

    Our copy holds 150 files, 137 of them pages. They are the front page and the documentation: 96 files of the Java documentation and JDK, 26 of the C library guide, 17 of the C++ reference and 5 standard input and output examples. The problem sets and scoreboards linked from the front page are not in our copy.
