  tries: true
  description: |-
    Summary scoreboard of the Regional contest, headed 2010 ACM South Central USA Regional Programming Contest, with a last-updated stamp of Sat Oct 30 17:55:13 2010. It lists 71 teams with rank, name (the institution in parentheses), problems solved, penalty time, and for each of the eight problems A to H the number of attempts and the time of the first correct run (a dash in place of the time where attempts were made without a correct run, 0/0 where none were made). A last column gives attempts and solved per team, and a final row gives submitted, first-yes and total-yes counts per problem.

    Sixty-eight teams solved at least one problem; first place is OU A (U Oklahoma) with all eight. The three teams with nothing solved share rank 69. The page links to other views (finals, full, by state, by graduate or undergraduate program, by site, first solved); these are not in this copy.
