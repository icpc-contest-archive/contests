    Problem set page of the 2010 ACM ICPC South Central USA Regional Programming Contest: a table of eight problems labelled A to H (Let's All Go to the Movies, Finite Fingerprints, Food Restrictions, Hoverdia Eighteen, Chemistry, If You Can't Stand the Heat..., Ropes, The Most Used Primes), each with links to an HTML statement, a PDF and an RTF file. The columns Solution(s) and Judge Data are empty, although the page text says it holds judge data and sample solutions. The page ends with a disclaimer of the hosts and a copyright line for 1999 to 2010. Our copy is the list page alone; the statements are not part of it.
