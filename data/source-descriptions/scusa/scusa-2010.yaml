  description: |-
    Standings of the 2010 South Central USA Regional Contest: 68 teams with rank, team, institution, problems solved, time and citation, the citation being the place in words (First Place, Second Place and so on). First place is OU A from the University of Oklahoma with eight problems. Rank numbers run up to 69 although 68 teams are listed, and the last three teams, with no problem solved, share Sixty-ninth Place. There is no per-problem detail. Both the number of teams and the times differ from the Regional scoreboard of the contest (68 teams against 71; 800 against 960 for the first team).
