  title: 2006 South Central USA Regional Programming Contest
  language:
  - en
  problems: 8
  description: |-
    Website of the 2006 South Central USA Regional Programming Contest, in English, run by Louisiana State University together with host sites at Abilene Christian University, Baylor University, East Central University and the University of Texas at Arlington. The home page says the contest is over. Pages give the welcome message (the move to a distributed contest and the teams each site hosts), the rules (which give the contest as 3 and 4 November 2006), hints, compile instructions, a FAQ, and pages for the LSU site: schedule, quick facts, environment, information and FAQ.

    The Results section holds the PC^2 scoreboard in several views: summary, finals, full, sumtime, fullnums, sumatt, by state, by graduate or undergraduate program, and one board for each of the five sites. The Problem Set section lists eight problems with an HTML statement and a PDF each, judge solutions in C++ (and in C for problems 1, 2 and 6), and judge input and output; its zip files are not in our copy. A documentation section holds the PC^2 team guide, C, C++, STL and Java references, errata, and pages listing the Friday night, Saturday practice and regional problems with links to sample files, most of which are not in our copy. A configuration section describes the contest machines and the Jabber chat rooms.

    Our copy holds 146 pages, some of them duplicates or printable versions. Pages of the ACU, Baylor, ECU and UTA sites are not in it, nor are two scoreboard views under the documentation section (Louisiana, undergraduate).
