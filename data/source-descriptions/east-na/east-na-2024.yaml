  description: |-
    Final standings of the Northeast North America region of the 2024 ICPC contest: 105 teams from 31 institutions, with rank, team, institution, problems solved, total time, medal, citation and a site citation column that is empty except for 'None' on the first row. The top twelve teams carry medals (four gold, four silver, four bronze, one of the bronze entries misspelled 'Bronze Meadl'); the other teams are marked Ranked. The citation column gives a place citation from First Place down to Fifty-second Place, and Honorable Mention for ranks 53 onward, including the nine teams with no solved problem, which share rank 97. First place is Mex Foundation of the Massachusetts Institute of Technology with 13 solved.

    The table has no per-problem results. It covers the Northeast region only: the East Central teams that appear on the combined scoreboard are not in it. The page states the ICPC year as 2025.
