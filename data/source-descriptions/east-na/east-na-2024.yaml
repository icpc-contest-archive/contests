  description: |-
    Final scoreboard on Kattis for the ICPC NA East Division 2024, shown after the contest had ended: 193 teams in one table with rank, team name, a state or province flag and an institution logo for each team, problems solved, total penalty time, and one column for each of the thirteen problems A to M. Each problem cell gives the number of attempts and, for solved problems, the minute of the accepted submission; unsolved attempts show a dash. The first team to solve each problem is marked. Eleven teams with no solved problem are listed at the end, all with rank 183. First place is CMU NewGamePlusPlayers with 13 solved.

    The page has filters for the East Central NA Region (sites Grand Valley, Purdue, Windsor, Youngstown) and the Northeast NA Region (eight sites, among them McGill University and Rochester Institute of Technology); our copy shows the combined view of all teams. Links lead to the contest's problems, teams and rules pages on Kattis.
