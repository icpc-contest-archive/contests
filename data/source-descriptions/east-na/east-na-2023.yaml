    Final scoreboard on Kattis for the ICPC NA East Division 2023, shown after the contest had ended: 177 teams in a single table with rank, team name, a state or province flag and an institution logo for each team, problems solved, total penalty time, and one column for each of the twelve problems A to L. Each problem cell gives the number of attempts and, for solved problems, the minute of the accepted submission; unsolved attempts show a dash. The first team to solve each problem is marked. Teams that solved nothing are listed at the end, 19 of them, all with rank 159. First place is MIT Isn't Training with 12 solved.

