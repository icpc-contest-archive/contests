  description: |-
    Scoreboard on Kattis for the ICPC NA East Division 2025, shown after the contest had ended but under the banner "Unfinalized results! These are not the finalized results, the scoreboard will be updated." It lists 182 teams with rank, team name, a state or province flag and an institution logo for each team, problems solved, total penalty time, and one column for each of the twelve problems A to L. Each problem cell gives the number of attempts and, for solved problems, the minute of the accepted submission; unsolved attempts show a dash. The first team to solve each problem is marked. The three teams with no solved problem are listed last, at rank 180. First place is Monkey Is Typing with 12 solved.

    The page has filters for the East Central NA Region (sites Grand Valley, Purdue, Windsor, Youngstown) and the Northeast NA Region (eight sites, among them McGill University and Wellesley College); our copy shows the combined view of all teams. Links lead to the contest's problems, teams and rules pages on Kattis.
