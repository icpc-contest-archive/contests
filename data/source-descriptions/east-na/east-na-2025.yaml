    Standings of the Northeast region of the 2025 ICPC North America contest: 96 teams from 28 institutions, with rank, team, institution, problems solved, total time, medal and citation. The top twelve teams carry medals (four gold, four silver, four bronze); the other teams are marked Ranked. The citation column gives a place citation from First Place down to Fifty-ninth Place, and Honorable Mention from rank 60 onward. The two teams with no solved problem are ranked 95 and 96. First place is Monkey Is Typing of the Massachusetts Institute of Technology with 12 solved.

    The table has no per-problem results and covers the Northeast region only: the East Central teams on the combined Kattis scoreboard are not in it. The page states the ICPC year as 2026.
