  description: |-
    Website of the Pacific Northwest regional contest (acmicpc-pacnw.org), in English, a series site covering many years rather than 1994 alone. Our copy holds 40 files, 31 of them pages, and most are saved more than once under different address forms. The only page of the 1994 edition is its results page, headed 1994 Pacific Region Results, with the contest date 19 November 1994.

    The other files belong to other years: a 1995 results page, the PacNW 2011 final standings page, Division 1 and Division 2 problem set PDFs dated 6 March 2021 and 5 March 2022, Division 1 and Division 2 solutions PDFs for the 2022 contest dated 25 February 2023, technical notes PDFs for 2019 and 2024, ZIP and RAR archives named for the 2007, 2010, 2012 and 2014 problem sets, and one photo. The site's home page and its results index page are not in our copy. Two PDFs under the 2023 problem-set path are cut off at 1 MiB and do not open.
