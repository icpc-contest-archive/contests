  description: |-
    Contest report generated by PC^2 for the 1999 regional. It has five parts: a list of assigned team numbers with institution and team name (61 entries); languages used (Java, Pascal, C++ and C, with the teams and submission counts for each); a problem solution grid; team-by-team lists of the problems each team solved; and team-by-team lists of every submission with the judges' response.

    The grid has 60 team rows and columns A/1 to I/9, headed Biorhy, Fish, FunRun, Images, SameGa, SqCiph, String and Triang for A to H; column I is empty. Each cell gives the number of tries and, for solved problems, the minutes of the accepted run. Three rows at the bottom, labelled Tries, Yes and Fastest, give per problem the total tries, the number of teams that solved it and the fastest solution time. There is no ranking or penalty total.
