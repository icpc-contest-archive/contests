  description: |-
    Division 2 scoreboard produced by PC^2: 94 teams with rank, team name (the institution is given in parentheses after the name), problems solved and total time. Thirteen problems N to Z each show attempts and solve time as tries/time, with a last column of total attempts and solved and a bottom row of submitted, first yes and total yes per problem. First place is D2 UBC\ (U British Columbia) with 9 solved; the ten teams with no solved problem share rank 85.

    Links at the top lead to per-site standings for the six sites, to the Division 1 standings and to a sample data file; those pages are not in our copy. The footer reads last updated Sat Nov 11 18:58:15 PST 2017.
- url: https://icpc.global/regionals/finder/Pacific-Northwest-2018/standings
  read: '2026-11-16'
  rubric: 1
  copy: pacnw/pacnw-2017/standings/api-20261113/standings.html
  title: The 2017 Pacific Northwest Regional Contest — standings
  language:
  - en
  teams: 166
  description: |-
    Standings of the 2017 Pacific Northwest Regional Contest: 166 teams with rank, team, institution, problems solved, time, medal, citation and site citation. No per-problem results. Berkeley Blue (University of California, Berkeley) is first with 8 solved in 707, followed by Stanford Cardinal and UBC*; these three carry the gold, silver and bronze medals. The citation column names places First Place to Tenth Place, then D2 First Place to D2 Tenth Place for the Division 2 teams, and 146 teams are marked Honorable Mention. Three rows carry a site citation (Site Champion for No. California, Canada and Puget Sound).

    Teams of both divisions are in the one table; many Division 2 teams have a D2 prefix in their names, for example D2 - Vandal White at rank 154.
- url: https://www.acmicpc.net/category/811
  read: '2026-11-16'
  rubric: 1
  copy: pacnw/pacnw-2017/judge-baekjoon/20230514-wayback-f8940dc8/page.html
  title: 2017 Pacific Northwest Region Programming Contest
  language:
  - ko
  - en
  problems: 19
  description: |-
    Problem list of the contest on Baekjoon Online Judge, with the site's interface in Korean. Two tables, Division 1 (A to M) and Division 2 (N to Z), each of 13 problems; seven problems appear in both divisions under different letters, so there are 19 different problems. Each row gives the judge's problem number, the contest letter, the title, a marker for multilingual statements, the number of users who solved it, the number of submissions and the accepted ratio. The page names the category as ICPC Regionals, North America, Pacific Northwest Regional.

    The statements are on separate Baekjoon pages that are not in our copy.
- url: https://codeforces.com/gym/101615
  read: '2026-11-16'
  rubric: 1
  copy: pacnw/pacnw-2017/judge-codeforces/20261113-live-98f67e9d/page.html
  title: 2017-2018 ACM-ICPC Pacific Northwest Regional Contest (Div. 1)
  language:
  - en
  problems: 13
  description: |-
    Codeforces gym dashboard of the Division 1 contest, marked Finished. It lists problems A to M with name, time limit, memory limit and the number of solvers shown by Codeforces (680 for A, 102 for K). Links lead to the announcement, the English statements PDF and the contest website, and the page has the usual Codeforces forms for asking a question and posting an announcement and a note on virtual participation.

    The statements PDF and the announcement are linked but not in our copy; our copy holds the dashboard page with its style sheets, scripts and images.
