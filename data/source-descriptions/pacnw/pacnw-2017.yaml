    Links at the top lead to per-site standings for the six sites, to the Division 1 standings and to a sample data file; those pages are not in our copy. The footer reads last updated Sat Nov 11 18:58:15 PST 2017.
- url: https://icpc.global/regionals/finder/Pacific-Northwest-2018/standings
  read: '2026-11-16'
  rubric: 1
  copy: pacnw/pacnw-2017/standings/api-20261113/standings.html
  title: The 2017 Pacific Northwest Regional Contest — standings
  language:
  - en
  teams: 166
  description: |-
    Standings of the 2017 Pacific Northwest Regional Contest: 166 teams with rank, team, institution, problems solved, time, medal, citation and site citation. No per-problem results. Berkeley Blue (University of California, Berkeley) is first with 8 solved in 707, followed by Stanford Cardinal and UBC*; these three carry the gold, silver and bronze medals. The citation column names places First Place to Tenth Place, then D2 First Place to D2 Tenth Place for the Division 2 teams, and 146 teams are marked Honorable Mention. Three rows carry a site citation (Site Champion for No. California, Canada and Puget Sound).

    Teams of both divisions are in the one table; many Division 2 teams have a D2 prefix in their names, for example D2 - Vandal White at rank 154.
