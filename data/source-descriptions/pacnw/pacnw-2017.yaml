  title: 2017 PacNW Regional Contest Division 1 Standings
  language:
  - en
  teams: 72
  problems: 13
  times: true
  tries: true
  description: |-
    Division 1 scoreboard produced by PC^2: 72 teams with rank, team name (the institution is given in parentheses after the name), problems solved and total time. Thirteen problems A to M each show attempts and solve time as tries/time (for example 1/8), with a last column of total attempts and solved. A bottom row gives, per problem, submitted, first yes and total yes. First place is Berkeley Blue (UC Berkeley) with 8 solved; the six teams with no solved problem share rank 67.

    Links at the top lead to per-site standings for the six sites (Hawaii, Northwest, Puget Sound, Canada, Northeast, N. California), to the Division 2 standings and to a sample data file; those pages are not in our copy. The footer reads last updated Sat Nov 11 18:58:15 PST 2017.
