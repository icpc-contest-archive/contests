- url: http://www.acmicpc-pacnw.org/results.htm
  read: '2026-11-16'
  rubric: 1
  copy: pacnw/pacnw-2017/standings/20260901-live-083808b9/results.htm
  title: Results
  language:
  - en
  description: |-
    Results index of the Pacific Northwest regional contest series website, in English. It lists the contest years from 2025 back to 1994, and for each year links to the final standings or scoreboards and, for many years, the problem set, solutions, judge data or a discussion of the problems. The 2017 entry has links to Final Standings, the Main page, the Division 1 and Division 2 boards, problem statements for each division, solutions and a problem set discussion.

    The page also carries the site menu (Home, Host a Contest, Contest Rules, Registration, Contest Details, Results, Links, Sponsor Our Contest). Our copy holds this one page with its style sheet and image; the linked scoreboards and documents are not part of it. The page shows the state of the series site after the 2025 contest, not of the 2017 edition alone.
