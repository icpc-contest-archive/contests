- url: http://www.acmicpc-pacnw.org/results.htm
  read: '2026-11-16'
  rubric: 1
  copy: pacnw/pacnw-2017/standings/20260901-live-083808b9/results.htm
  title: Results
  language:
  - en
  description: |-
    Results index of the Pacific Northwest regional contest series website, in English. It lists the contest years from 2025 back to 1994, and for each year links to the final standings or scoreboards and, for many years, the problem set, solutions, judge data or a discussion of the problems. The 2017 entry has links to Final Standings, the Main page, the Division 1 and Division 2 boards, problem statements for each division, solutions and a problem set discussion.

    The page also carries the site menu (Home, Host a Contest, Contest Rules, Registration, Contest Details, Results, Links, Sponsor Our Contest). Our copy holds this one page with its style sheet and image; the linked scoreboards and documents are not part of it. The page shows the state of the series site after the 2025 contest, not of the 2017 edition alone.
- url: http://www.acmicpc-pacnw.org/ProblemSet/2017/index1.html
  read: '2026-11-16'
  rubric: 1
  copy: pacnw/pacnw-2017/scoreboard/2026-09-01-live-7b823934/index1.html
  title: 2017 PacNW Regional Contest Division 1 Standings
  language:
  - en
  teams: 72
  problems: 13
  times: true
  tries: true
  description: |-
    Division 1 scoreboard produced by PC^2: 72 teams with rank, team name (the institution is given in parentheses after the name), problems solved and total time. Thirteen problems A to M each show attempts and solve time as tries/time (for example 1/8), with a last column of total attempts and solved. A bottom row gives, per problem, submitted, first yes and total yes. First place is Berkeley Blue (UC Berkeley) with 8 solved; the six teams with no solved problem share rank 67.

    Links at the top lead to per-site standings for the six sites (Hawaii, Northwest, Puget Sound, Canada, Northeast, N. California), to the Division 2 standings and to a sample data file; those pages are not in our copy. The footer reads last updated Sat Nov 11 18:58:15 PST 2017.
