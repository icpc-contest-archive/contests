  contest_date: '2024-02-24'
  description: |-
    Problem set PDF of Division 1, cut short in our copy: the file ends after about 1 MiB and has no page index, so ordinary PDF readers cannot open it. Two pages can be read from it. The cover sheet reads "The 2023 ICPC Pacific Northwest Regional Contest" and "Official Problem Set", with the years 2023 and 2024 and sponsor logos. The next page is headed "Pacific Northwest Regional Programming Contest, Division 1, 24 February 2024" and lists general rules: the supported languages are C, C++20, Java, Python 3 and Kotlin; Python 2 and C# are not supported; input comes from standard input and output goes to standard output; one source file per problem.

    The problem statements themselves are not in our copy.
