  teams: 58
  description: |-
    Final standings of the Pacific NW Region contest of 11 November 2000: one table of 58 teams with rank, team (institution, then team name), number of problems solved and time. Stanford Red is first with 5 solved and a time of 641. Teams that solved nothing share rank 48 with an empty time, and the last row, SFSU Gators, has no rank and dashes in the solved column. There is no per-problem detail.
