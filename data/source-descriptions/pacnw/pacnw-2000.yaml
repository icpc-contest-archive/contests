    Index page of the problem set archive for the Pacific Northwest Regionals 2000, last updated 6 February 2002. It links ten files with their sizes: a.doc to h.doc, poker.pdf (320 kByte) and allweb.zip (256 kByte), and a comments link. Our copy holds only this page; the linked files are not part of it.
- url: http://icpc.baylor.edu/past/icpc2001/regionals/PacNW00/Problems.pdf
  read: '2026-11-16'
