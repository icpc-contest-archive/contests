  description: |-
    ICPC Live Archive category page for Regionals 2000, North America - Pacific Northwest. It lists eight problems numbered 2123 to 2130, from 2123 The Quadratic formula (Mod p) to 2130 SwampNet Routing, with total submissions, solving percentage, total users and their solving percentage for each. The page is a list of titles with a login form and menu; no statements are in it; the problem titles link to statement pages that are not in our copy.
