  title: ACM Pacific NW Region Programming Contest 11 November 2000
  language:
  - en
  contest_date: '2000-11-11'
  problems: 8
  pages: 23
  description: |-
    Problem set of the contest as a PDF of 23 pages. Pages 1 to 17 each carry the header "ACM Pacific NW Region Programming Contest" and the date 11 November 2000 and hold eight problem statements in English: A The Quadratic formula (Mod p), B Base Addition, C Solitaire Cribbage, D Poker Solitaire, E Embedded Codes, F Radio Transmitters, G Color Circles and H SwampNet Routing.

    Pages 18 to 23 are a paper, "Hill Climbing for Poker Solitaire: A Case Study on the Impact of Neighborhood Size", with charts and tables of results. The text layer of these six pages does not extract as readable text, so the paper can be read only as page images.
