- url: http://www.acmicpc-pacnw.org/results.htm
  read: '2026-11-16'
  rubric: 1
  copy: pacnw/pacnw-2000/website/2026-11-15-wayback-3e1ab44d
  title: Pacific Region Results
  language:
  - en
  description: |-
    Pages of two Pacific Northwest regional contest websites in one copy of 111 files: 50 HTML pages, 9 text files, 29 zip and 5 rar archives, 17 images and a style sheet. Many pages are saved twice, once from each host.

    The host acmcontest-pacnw.org is the Pacific Region Programming Contest site as it stood after the 2000 contest. It has the home page, contest details with schedule, software and prizes, registration with a confirmation form, rules, a host-a-contest page, a results page last updated 11/14/00, a 2000 final standings page and the 2000 problem set zip, allweb.zip. It also holds a Site Director's Guide, the results pages for 1994 to 1999 and the 1998 and 1999 problem set zips.

    The host acmicpc-pacnw.org is the later series site, with a results page last updated 11/15/07. It links final standings from 1994 to 2007, problem set archives from 1998 to 2007 and PC^2 text reports for 2003 to 2005, so most of the copy is about other years.
- url: http://www.acmcontest-pacnw.org/
  read: '2026-11-16'
  rubric: 1
  copy: pacnw/pacnw-2000/web-mirror/20010301-wayback-40cab404/page.html
  title: ACM - Pacific Region Programming Contest
  language:
  - en
  contest_date: '2000-11-11'
  description: |-
    Home page of the Pacific Region Programming Contest website. It says the region covers Alaska, British Columbia, Washington, Oregon, northern and central California and western Nevada, and that the contest runs at two sites at once. For this year it gives Saturday 11 November 2000, with CSU-Chico as the south site and Eastern Washington University as the north site.

    Under "And the winners are..." it lists six teams, from Stanford Red to UC Davis Alpha. Links lead to contest details, registration, the complete results and problem sets, and previous contests. It names a contest director as contact and is marked last updated 11/14/00.
