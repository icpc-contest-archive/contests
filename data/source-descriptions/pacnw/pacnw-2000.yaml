  description: |-
    Ranking page headed "View Standings" for the 2000 ACM Pacific Northwest Programming Contest sponsored by IBM. It has 56 rows with rank, team (institution, then team name) and a citation written as a place, from First Place to Forty-eighth Place. There are no solved counts or times. Ranks 26 and 30 do not appear. Eleven teams share rank 48; one of them, SFSU Gators, has dashes in the citation column where the others have a place.
