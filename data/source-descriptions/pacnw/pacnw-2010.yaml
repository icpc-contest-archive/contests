    Problem set as a zip archive of 13 PDF files, 20 pages in all: eleven problem statements, A to K, one practice problem, and a one-page table giving a colour for each problem letter. Each statement opens with the problem letter, the input file name and the output target, then the title and the problem text, with input and output format and sample input and output. Most of the problems have a zombie theme, from Always Follow the Rules in Zombieland (A) to Zombie Blast! (K). No test data or solutions.
