  rubric: 1
  copy: pacnw/pacnw-2010/website/2026-09-05-wayback-9c0dc4b5
  title: 2010 Results
  language:
  - en
  description: |-
    Pages and files of the series site acmicpc-pacnw.org, entered at the 2010 results page. For 2010 it holds the final results of the 2010 ACM-ICPC Pacific Northwest Region (76 teams, with rank, institution, team, problems solved and total time) and the directory listing of the 2010 problem set. The listing names two zips, and both are in our copy: the problem statements (13 PDF files) and the input and output files (24 files).

    The site also holds material of other years: the 2011 final standings (with citation and medal columns), the 2011 standings of six sites with a result per problem, and for 2011 a zip each of statements, input and output files and solutions. Further zips cover 2007, 2012 and 2014. There are technical notes for the contest environment (2019 and 2024), problem sets of the contests of 6 March 2021 and 5 March 2022 (two divisions each), judges' solutions slides dated 25 February 2023, and one photograph.

    Our copy holds 53 files, 32 of them different, as several documents are saved under more than one address. Two of the 2023 PDFs are cut off at 1 MiB and cannot be opened. There is no front page, rules or schedule for 2010.
