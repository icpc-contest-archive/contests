    Baekjoon Online Judge category page for the 2010 Pacific Northwest Region Programming Contest, filed under ACM-ICPC Regionals, North America, Pacific Northwest Regional. A table lists 12 entries, A to K and a P, with their Baekjoon problem numbers (4459 to 4470), titles, and the number of users who solved each, the number of submissions and the acceptance rate. Most titles are the English contest titles; problem B has no title in the table, and C, E and P carry Korean titles. The site menus are in Korean. Eleven of the twelve entries link to separate statement pages that are not part of our copy.
