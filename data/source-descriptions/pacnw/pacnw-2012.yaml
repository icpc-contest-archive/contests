  title: The 2012 Pacific Northwest Regional Contest
  language:
  - en
  description: |-
    Website of the Pacific Northwest Regional contest series (acmicpc-pacnw.org), in English. Our copy holds 97 saved files, 79 of them pages, at 47 distinct addresses; several pages are saved under more than one host spelling. It covers several editions, not only 2012.

    For 2012 it has the overall scoreboard (111 teams, problems A to L, produced by PC^2); six per-site standings pages (N. California - Stanford University; Northeast - EWU, Cheney/Spokane; Canada - University of British Columbia; Puget Sound - Western Washington University; Northwest - University of Portland; Hawaii - BYUH, Laie, Oahu); the 18-page statements PDF; and a directory listing of the 2012 problem folder with a 6.6 MB archive. The archive holds twelve problem folders and a practice folder with statements in TeX, judge input and output, sample files, validators and solutions in C++ and Java, plus an errata note, a practice PDF and a note on selected problems.

    Other editions: the 2011 final standings page; for 2013 a standings page (problems A to M), six site-information pages, a 30-page statements PDF and a solutions archive; a 2014 solutions archive; archives named for 2007 and 2010; technical notes for 2019 and fall 2024; problem-set PDFs for Divisions 1 and 2 dated 6 March 2021 and 5 March 2022; solutions PDFs for the 2022 divisions dated 25 February 2023; and two further PDFs saved only to their first megabyte, which do not open.
