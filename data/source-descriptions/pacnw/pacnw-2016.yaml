  title: ACM Pacific Northwest Regional Programming Contest Division 1 Standings
  language:
  - en
  teams: 77
  problems: 12
  times: true
  tries: true
  description: |-
    Division 1 scoreboard of the Pacific Northwest Regional Programming Contest, produced by PC^2 (version 9.4): 77 teams with rank, team name and institution in brackets, number solved and penalty time. Twelve problems A to L each show attempts and the minute of the first accepted run (for example 1/8), or 0/-- when not attempted (attempts followed by -- mean unsolved); a last column gives total attempts and solved.

    Ranks start at 5 and run to 127, with equal ranks shared by teams with the same result, so the rows for ranks 1 to 4 are not on the page. UBC* is the first row with 10 solved. The last row summarises each problem as submitted, time of the first yes, and total yes. The footer reads Last updated Sat Nov 05 19:00:28 PDT 2016.
