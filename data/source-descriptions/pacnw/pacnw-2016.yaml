  description: |-
    Category page of Baekjoon Online Judge for the 2016 Pacific Northwest Region Programming Contest, in Korean, with problem titles in English. Two tables list the problems with judge problem number, letter, title, accepted users, submissions and acceptance rate: Division 1 has 12 problems A to L and Division 2 has 13 rows M to Y. Division 2 reuses several Division 1 problems under the same problem numbers (Alphabet is both A and M), so the page holds 21 different problems.

    Problem L is marked as a special judge problem. The page lists problems only; the statements are not part of it.
