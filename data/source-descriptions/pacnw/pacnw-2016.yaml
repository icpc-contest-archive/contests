  read: '2026-11-16'
  rubric: 1
  copy: pacnw/pacnw-2016/standings/20260901-live-083808b9/results.htm
  title: Results
  language:
  - en
  description: |-
    Results index of the Pacific Northwest regional contest website, in English. A site menu (Home, Host a Contest, Contest Rules, Registration, Contest Details, Results, Links, Sponsor Our Contest) sits above a list of the years from 2025 back to 1994, with links to the standings of each year and, for most years, to problem statements and, for many, judge data, solutions or discussion.

    The 2016 entry links the Division 1 final scoreboard, notes that the Division 2 standings are missing and points to the ICPC regionals finder page for them, and links the Division 1 and Division 2 problem statements and a zip file with solutions, input/output and discussion of most problems. The page lists the newest editions first and covers all editions, not the 2016 edition alone.
- url: http://www.acmicpc-pacnw.org/scoreboard/2016/ACM%20Pacific%20Northwest%20Regional%20Programming%20Contest.html
  read: '2026-11-16'
  rubric: 1
  copy: pacnw/pacnw-2016/scoreboard/2026-09-01-live-77838a59/page.html
  title: ACM Pacific Northwest Regional Programming Contest Division 1 Standings
  language:
  - en
  teams: 77
  problems: 12
  times: true
  tries: true
  description: |-
    Division 1 scoreboard of the Pacific Northwest Regional Programming Contest, produced by PC^2 (version 9.4): 77 teams with rank, team name and institution in brackets, number solved and penalty time. Twelve problems A to L each show attempts and the minute of the first accepted run (for example 1/8), or 0/-- when not attempted (attempts followed by -- mean unsolved); a last column gives total attempts and solved.

    Ranks start at 5 and run to 127, with equal ranks shared by teams with the same result, so the rows for ranks 1 to 4 are not on the page. UBC* is the first row with 10 solved. The last row summarises each problem as submitted, time of the first yes, and total yes. The footer reads Last updated Sat Nov 05 19:00:28 PDT 2016.
- url: https://icpc.global/regionals/finder/Pacific-Northwest-2017/standings
  read: '2026-11-16'
  rubric: 1
  copy: pacnw/pacnw-2016/standings/api-20261113/standings.html
  title: The 2016 Pacific Northwest Regional Contest
  language:
  - en
  teams: 151
  description: |-
    Standings of the 2016 Pacific Northwest Regional Contest, both divisions in one table: 151 teams with rank, team, institution, number solved, time, medal, citation and site citation. Division 2 teams carry a D2 prefix in the team name (76 teams); the other 75 are Division 1. UBC* is first with 10 solved, ahead of Berkeley Blue and Stanford Cardinal.

    The medal column holds PacNW Champion, Second Place and Third Place for each division, and citations give place names and site winners. Twenty-five teams with no solved problems are listed as Honorable Mention. There are no per-problem results.
