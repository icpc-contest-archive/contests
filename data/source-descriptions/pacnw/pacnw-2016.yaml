  description: |-
    Codeforces gym dashboard of the Division 1 contest, marked Finished. The problem table lists twelve problems A to L (Alphabet, Buggy Robot, Cameras, Contest Strategy, Enclosure, Illumination, Maximum Islands, Paint, Postman, Shopping, Tournament Wins, Windy Path) with time and memory limits and a count such as x460 for problem A that links to the status page. The page links to a statements PDF in English, the submission, status and standings pages, and the contest website.

    The page also carries the site's forms for asking questions and posting announcements.
