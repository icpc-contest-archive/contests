  title: Results
  language:
  - en
  description: |-
    Results page of the Pacific Northwest regional contest's own website, with the site menu (Home, Host a Contest, Contest Rules, Registration, Contest Details, Results, Links, Sponsor Our Contest). It lists the contests year by year, from 2025 back to 1994, each with links to final standings, problem statements, judge data, solutions or discussion, depending on the year. The 2019 entry links to Final Standings, a Main Page, the Division 1 and Division 2 standings, a Problem Set with Statements for each division, sample problem solutions, and a problem set with solutions, I/O and discussion.

    The page holds no standings or problems itself, only links. Its last line reads "Last updated: 011/24/2025", and the entries for later editions are on it too. Our copy is this one page with its style sheet and an image.
