  description: |-
    Problem list of the contest on Baekjoon Online Judge, under the source ICPC Regionals, North America, Pacific Northwest Regional, with the site's menus in Korean. Two tables list Division 1 (problems A to M) and Division 2 (N to Z), 26 rows in all but 20 different problems, because six problems (Coloring Contention, From A to B, Rainbow Strings, Glow, Pixel, Glow!, Carryless Square Root and Maze Connect) appear in both divisions under the same judge number. Each row gives the judge's problem number, the label, the title in English, an info column (multilingual; one problem is also marked special judge), the number of people who solved it, the number of submissions and the accuracy ratio.

    The statements are on separate problem pages that are not in our copy, and the page's style sheets and images are not in our copy either.
