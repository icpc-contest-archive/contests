    Standings of the contest in one list: 147 teams ranked 1 to 147, with institution, number solved and time, and no per-problem detail. Ranks 1 to 61 have names without a D2 prefix; ranks 62 to 147 are 86 teams whose names begin with D2. A Medal column holds Gold, Silver and Bronze for ranks 1 to 3 and D2 Gold, D2 Silver and D2 Bronze for ranks 62 to 64. A Citation column gives titles such as Contest Winner, NAC Qualifier, ordinal places and Honorable Mention (74 teams), and a Site citation column names twelve site winners. First place is a University of British Columbia team with 13 solved and a time of 1763.
