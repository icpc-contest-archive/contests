  description: |-
    Final scoreboard of Division 1 produced by PC^2: 61 teams, each with rank, name and institution in parentheses, number solved, time, and for each of the thirteen problems A to M the number of attempts and the time of the accepted run (for example 1/36), with -- in place of the time where the problem was not solved. A last column gives total attempts and solved, and a bottom row gives per problem the figures Submitted, 1st Yes and Total Yes. First place is a University of British Columbia team with 13 solved.

    The page is stamped as last updated on 9 November 2019 and links to the PC^2 home page. It also links to six per-site standings pages, the Division 2 standings and a zip of sample data; those are not part of our copy.
