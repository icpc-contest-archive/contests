    Final results of the 1995 Pacific Region contest, a table of 47 teams with team name, final score, number solved and rank, under the heading 1995 Pacific Region Results with the line "Contest date: November 18, 1995". Thirty-two teams solved at least one problem and are ranked 1 to 32; Berkely #1 is first with 6 solved and a score of 1045. The other 15 teams show a dash for score and solved and share rank 33. Several institutions appear twice or more as numbered teams. No per-problem results or times.
