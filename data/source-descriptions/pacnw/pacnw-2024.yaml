  language:
  - en
  teams: 154
  description: |-
    Standings of both divisions on one list: 154 teams with rank, team, institution, solved, time, medal, citation and site citation. One team each carries a Gold, Silver and Bronze Medal, 38 more are marked Ranked, and 113 are marked Honorable and listed without a rank. The citation column holds place names (D1 Champion, Second Place, Third Place and so on) and the site citation column holds D1 and D2 champion titles for British Columbia, Washington, Oregon, California and Hawaii. First place is a team from the University of California, Berkeley.

    There are no per-problem results and no attempt counts. The Solved column has values up to 32, while the division scoreboards show 13 problems.
