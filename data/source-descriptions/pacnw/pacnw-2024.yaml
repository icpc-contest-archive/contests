  teams: 69
  problems: 13
  times: true
  tries: true
  description: |-
    Final scoreboard of Division 1, produced by PC^2 (version 9.11): 69 teams, ranked by problems solved and then time. Each row gives rank, team name with institution and site group in brackets, number solved, total time, and for each of the thirteen problems A to M the attempts and the time, with -- in place of the time when the problem is unsolved, plus a column of total attempts and solves. A last row gives for each problem the numbers submitted, first yes and total yes.

    The page links to per-site standings pages, per-region division standings pages (British Columbia, Washington, Oregon, California, Hawaii) and the Division 2 standings. Those pages are not in our copy. Teams are not marked as official or unofficial; the page states no contest date.
