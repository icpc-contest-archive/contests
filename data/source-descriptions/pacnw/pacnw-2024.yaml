- url: http://www.acmicpc-pacnw.org/results.htm
  read: '2026-11-16'
  rubric: 1
  copy: pacnw/pacnw-2024/standings/20260901-live-083808b9/results.htm
  title: Results
  language:
  - en
  description: |-
    Results page of the regional contest's own website, in English, with the site menu (Home, Host a Contest!, Contest Rules, Registration, Contest Details, Results, Links, Sponsor Our Contest). It lists the 32 editions from 1994 to 2025, newest first. Most entries link to final standings or scoreboards and a problem set, many also to solutions, judge data or discussion; the entries for 1994 to 1997 list only final standings.

    The 2024 entry is dated November 16, 2024 and links the Division 1 and Division 2 scoreboards, the problem statements of both divisions, a link to a 2024 problem set solutions file on Google Drive, and a discussion document for each division. The 2025 entry points to pages on another server. Our copy holds this one page with its style sheet and a logo image; the documents it links to are not part of it.
