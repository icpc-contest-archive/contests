    Results page of the Pacific Northwest regional contest's website, headed "Pacific NW Region Contest Results" and marked "Last updated: 11/15/07", in English. It lists, year by year from 2007 back to 1994, links to the final standings, for 1998 to 2006 to the problem sets, and for some years to statistics reports. For 1997 there is a single link, "1997 Final Standings"; no problem set is listed for that year. A menu links the site's home, registration, contest details, rules and other pages.

