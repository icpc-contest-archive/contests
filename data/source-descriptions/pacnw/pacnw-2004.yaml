  description: |-
    Page of the Baekjoon Online Judge, in Korean, listing the ten problems of the 2004 Pacific Northwest Region Programming Contest under the category name 2004 Pacific Northwest Region Programming Contest. A table gives for each problem its Baekjoon number, its letter A to J, its title, and the judge's counts of users who solved it, submissions and the percentage correct. Problems A to F have Korean titles (A, Mersenne composite numbers, in Korean) and G to J have English ones: Jill's Tour Paths, Boundaries on "A New Kind of Science", Rate of Return and A Card Trick. Problem D is marked as a special judge. The page holds the list only, not the statements.
