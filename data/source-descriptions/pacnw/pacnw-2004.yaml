  copy: pacnw/pacnw-2004/website/2026-09-05-wayback-9c0dc4b5
  language:
  - en
  description: |-
    Pages and files from the website of the Pacific Northwest Regional contest, in English, saved at several dates between 2007 and 2025. Our copy holds 83 files, 65 of them pages; several pages are saved under more than one address.

    For 2004 it holds the final standings page, the contest control system report in plain text, and the 2004 problem set page with its five zip archives: the ten problem statements as Word files A to J, input files for nine problems (none for F), output files for ten, and correct solutions from the first and second place teams, which leave out problems the teams asked not to release. The report is saved four times; one of the copies, from 2008, breaks off in the middle of its per-team summary and the other three are complete.

    The rest belongs to other contests of the region: the 2005 standings, problem set page and statistics reports, a 2011 final standings page, archives of 2007 (statements, input and output), 2010 (input and output), 2012 and 2014 (solutions with input and output), and PDFs of 2019 to 2024: technical notes of 2019 and 2024, the Division 1 and 2 problem sets dated 6 March 2021 and 5 March 2022, and solutions documents of February 2023. Two further PDFs from 2023 are cut off at 1 MiB and cannot be opened. The site's front and results index pages are not in it.
- url: http://www.acmicpc-pacnw.org/Standings/2004/pc2_report_comp.txt
  read: '2026-11-16'
  rubric: 1
  copy: pacnw/pacnw-2004/scoreboard/2026-09-01-live-6858de76/pc2_report_comp.txt
  title: CSUS Programming Contest Control System, Report from site 1 (Portland)
  language:
  - en
  contest_date: '2004-11-13'
  problems: 10
  times: true
  tries: true
  description: |-
    Complete report of the CSUS Programming Contest Control System, version 8.6, in plain text, from site 1 (Portland) for the contest of Saturday 13 November 2004: it records a start at 12:19, a stop at 17:19 and a contest length of five hours. It opens with the contest settings and a team list of 120 entries for sites 1 to 3, 41 of them marked INACTIVE, then defines problems A to J (A - Mersenne to J - Card Trick), the languages, the balloon colors and the judgement names, and gives a raw list of runs.

    The reports that follow cover submissions by language, the number of teams that solved each problem, correct and incorrect solutions per problem (771 runs in total, 216 correct), a balloon summary, a summary per team of problems solved with submissions and minutes, the runs of 83 teams listed by problem with run number, minute and judgement, a grid of tries and solution time per team for problems A to J with tries, yes and fastest time per problem, and for each problem a ranked list of the fastest teams to solve it. Four of the 83 team sections are generic accounts named team9, team10, team12 and team15. It has no overall rank table.
