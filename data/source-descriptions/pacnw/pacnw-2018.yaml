  description: |-
    Codeforces gym dashboard of the Division 1 contest, marked Finished. It lists problems A to M with name, time limit, memory limit and the number of solvers shown by Codeforces (1367 for A, 152 for M). Links lead to the announcement and the English statements PDF, and the page has the usual Codeforces forms for asking a question and posting an announcement, and a note on virtual participation.

    The statements PDF and the announcement are linked but not in our copy; our copy holds the dashboard page with its style sheets, scripts and images.
