- url: https://icpc.global/regionals/finder/Pacific-Northwest-2019/standings
  read: '2026-11-16'
  rubric: 1
  copy: pacnw/pacnw-2018/standings/api-20261113/standings.html
  title: The 2018 Pacific Northwest Regional Contest — standings
  language:
  - en
  teams: 134
  description: |-
    Standings of the 2018 Pacific Northwest Regional Contest: 134 teams with rank, team, institution, problems solved, time, medal, citation and site citation. No per-problem results. Teams of both divisions are in the one table; most of the 73 Division 2 teams carry a D2 prefix in their names. University of British Columbia's UBC p_X(x)=P(X=x) is first with 13 solved in 1078, then Stanford Cardinal and Berkeley Blue. Gold, silver and bronze medals go to the top three, and a separate D2 gold, silver and bronze to the best three Division 2 teams. The citation column names places from First Place to Sixty-seventh Place (the Division 2 medallists as D2 First to D2 Third Place), and 67 teams are marked Honorable Mention. Twelve rows carry a site winner citation, six for Division 1 and six with a D2 prefix for Division 2.
- url: https://www.acmicpc.net/category/812
  read: '2026-11-16'
  rubric: 1
  copy: pacnw/pacnw-2018/judge-baekjoon/20230401-wayback-3723d1e0/page.html
  title: 2018 Pacific Northwest Region Programming Contest
  language:
  - ko
  - en
  problems: 19
  description: |-
    Problem list of the contest on Baekjoon Online Judge, with the site's interface in Korean. Two tables, Division 1 (A to M) and Division 2 (N to Z), each of 13 problems; seven problems appear in both divisions under different letters, so there are 19 different problems. Each row gives the judge's problem number, the contest letter, the title, a marker for multilingual statements (problem M and, as G in Division 1 and T in Division 2, Goat Rope also carry a special judge marker), the number of users who solved it, the number of submissions and the accepted ratio. The page names the category as ICPC Regionals, North America, Pacific Northwest Regional.

    The statements are on separate Baekjoon pages that are not in our copy.
