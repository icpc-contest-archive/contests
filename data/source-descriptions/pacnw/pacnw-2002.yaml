  description: |-
    Final standings of the Pacific NW Region contest, 2002: 77 teams with rank, team (institution followed by team name), a citation, number solved and time. The first 66 teams carry a citation from First Place to Sixty-sixth Place, with two teams tied at Forty-first Place and no Forty-second Place; the last 11 teams, all with 0 solved, share rank 67 under Honorable Mention. University of Oregon's Buffleheads are first with 6 solved and a time of 1146. No per-problem results or attempts are given.
