  read: '2026-11-16'
  rubric: 1
  copy: pacnw/pacnw-2002/website/2026-11-15-wayback-3e1ab44d
  title: Pacific Region Results
  language:
  - en
  description: |-
    Website of the ACM Pacific Northwest Region programming contest, a series site that covers many years rather than only 2002. The main pages are the November 2007 state of the site (home page with the 2007 sites and results, registration, host a contest, contest details, rules, links, results index), and an older set of pages under the earlier host name, last updated in November 2000, which describes the 2000 contest and holds results of 1994 to 2000. Our copy holds 59 pages together with images, a style sheet and 34 zip and rar archives (problem sets and a statistics report).

    For the 2002 contest the results index links a final standings page and a problem set. The standings page, headed Pacific NW Region - Final Standings - 2002, lists 77 teams with rank, institution and team name, a place citation, number solved and time. The problem set link leads to a zip archive of six Word statement documents, B to G, which is in our copy. Pages for 2002 beyond these two are not in it.

    The results index also links standings, problem sets and statistics of the other years from 1994 to 2007.
