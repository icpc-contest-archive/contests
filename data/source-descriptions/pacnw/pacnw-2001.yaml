    Final rankings of the 2001 ACM Pacific Northwest Programming Contest, sponsored by IBM, on a page titled View Standings: 77 teams in a table of rank, team (institution followed by team name) and a citation spelled out as the place, from First Place to Sixty-eighth Place. Stanford University's Stanford Red is first. Places 43 and 68 are shared: two teams hold 43rd place and ten teams share the last rank, 68. The page gives no number of problems solved, no times and no per-problem results.
