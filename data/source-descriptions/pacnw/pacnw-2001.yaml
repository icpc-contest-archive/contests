    Zip archive of the 2001 problem set: eight Word documents, one per problem A to H, in folders named after the problems (Jumble, AliceAndBob, Triangles, dot, TaxRelief, Worms, Size, Parentheses). Each document opens with the problem letter and title and holds the statement in English, with a sample; the same problems as in the contest PDF. No test data or solutions are in the archive. Our copy is the zip file itself and opens without errors.
