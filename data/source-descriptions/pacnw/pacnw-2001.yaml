  read: '2026-11-16'
  rubric: 1
  copy: pacnw/pacnw-2001/website/2026-11-15-wayback-3e1ab44d
  title: Pacific Region Results
  language:
  - en
  description: |-
    Website of the ACM Pacific Northwest Region programming contest, a series site that covers many years rather than only 2001. The main pages are the November 2007 state of the site (home page with the 2007 sites and results, registration, host a contest, contest details, rules, links, results index), and an older set of pages under the earlier host name, last updated in November 2000, which describes the 2000 contest and holds results of 1994 to 2000. Our copy holds 59 pages together with images, a style sheet and 34 zip and rar archives (problem sets and a statistics report).

    For the 2001 contest the results index links three things: a final standings page, a problem set and a statistics page. The standings page, headed Pacific NW Region - Final Standings - 11/10/01, lists 77 teams with rank, institution and team name, and a place citation; it has no solved counts or times. The problem set link leads to a zip archive of eight Word statement documents, A to H, which is in our copy. The statistics link leads to a page on another server and is not in our copy.

    The results index also links standings, problem sets and statistics of the other years from 1994 to 2007, among them full text reports of 2003 to 2005.
