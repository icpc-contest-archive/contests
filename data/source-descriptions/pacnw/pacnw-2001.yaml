    Problem set of the 2001 ACM Pacific NW Region Programming Contest, a PDF of 17 pages in English, every page headed with the contest name and the date 10 November 2001. It holds eight problems labelled A to H: Bejmul (Jumble), Tales from Decryption, Triangles, Detours!, Tax Relief, Worm Watcher, What's My Size? and The Paren Thesis. Each has a statement with input and output description and a sample; the set contains no test data or solutions.
