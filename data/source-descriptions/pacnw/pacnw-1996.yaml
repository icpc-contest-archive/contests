  description: |-
    Final results of the 1996 Pacific Region contest, a table of 44 teams with rank, site (1 or 2), team, number solved and points, under the line "Contest date: November 23, 1996". Forty teams solved at least one problem; the University of Washington - A is first with 6 solved and 678 points. Four teams solved nothing and share rank 41. Teams are named by institution, many with an A or B team letter. No per-problem results.
