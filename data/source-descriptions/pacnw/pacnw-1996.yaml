  description: |-
    Series website of the Pacific Northwest regional contest, in English. Our copy holds 40 saved files, mostly the same pages saved under several host spellings of one address. Only one page is about the 1996 contest: its results page, a table of 44 teams. The rest belongs to other editions: a 1997 results page; a 2011 final standings page with columns for citation, site citation and medal citation; archives of problem data and solutions for 2007, 2010, 2012 and 2014; Division 1 and Division 2 problem set PDFs for the contests of 6 March 2021 and 5 March 2022; two 2022 solutions PDFs, one per division; technical notes PDFs for 2019 and 2024; and one photograph.

    The site's front page and menus are not among the saved files, so the 1996 results page is reached only through its own address. Two PDFs saved under a Spring 2023 problem set address stop at 1048576 bytes and cannot be opened.
