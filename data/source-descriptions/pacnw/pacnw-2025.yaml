- url: http://www.acmicpc-pacnw.org/
  read: '2026-11-16'
  rubric: 1
  copy: pacnw/pacnw-2025/website/2026-09-05-live-9c0dc4b5
  title: ACM - Pacific Northwest Region Programming Contest
  language:
  - en
  contest_date: '2025-11-15'
  description: |-
    Website of the Pacific Northwest regional contest as it stood after the 2025 contest, in English. The home page describes the region and its multi-site format, announces that the 2025 contest is complete and names the Division 1 champion and the teams advancing to the North America Championship, gives the date of the 2026 regional, and lists the five sites of November 15 with their site information links. It also carries the medal rules, the two-division explanation, a notice that the site is moving to another address, and links to the problem set, scoreboard and resolver videos, which are on other servers.

    Other pages: contest details with the tentative schedule of November 7 to 15, 2025, registration (closed for 2025), contest rules, a two-division FAQ, host-a-contest and sponsorship pages, links, a pictures page, a site director guide, and PDF documents (technical notes, judging notes, a PC^2 team guide). The results page lists contests from 1994 to 2025. The site also holds the 2024 and 2023 problem sets as PDFs, 2024 discussion PDFs, the 2023 and 2024 scoreboards, and two zip files (Division 1 baseline problems and 2023 problem data); the 2025 results themselves are not among them.

    Our copy holds 27 pages (HTML and PDF) among 36 saved files.
