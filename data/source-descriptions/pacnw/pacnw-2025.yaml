  description: |-
    Solutions and judges' data page for the Division 1 contest, in English, headed Saturday, November 15, 2025 at 13:00 PST. It states the time limit and the 2GB memory limit rules and lists the judges. A table of the thirteen problems A to M (Bouquet of Balloons to Triangle of Triangles) links for each problem its statement as a PDF, the judges' solutions, the sample input and output, and the secret judges' input and output; one link downloads statements, samples, judges' data and solutions in a single zip.

    Only the page itself is in our copy; the statements, solutions and data it links are not.
