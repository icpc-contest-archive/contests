  title: The 2025 ICPC North America Pacific Northwest Regional Contest
  language:
  - en
  teams: 141
  description: |-
    Standings of both divisions on one list: 141 teams with rank, team, institution, solved, time, medal, citation and site citation. One team each carries a Gold, Silver and Bronze Medal, 38 more are marked Ranked, and 100 are marked Honorable; 41 teams carry a rank and 100 are listed without one. The citation column holds place names (D1 Champion, Second Place and so on) and the site citation column holds D1 and D2 champion titles for Washington, California, British Columbia, Oregon and Hawaii. First place is a team from the University of Washington.

    There are no per-problem results and no attempt counts. The Solved column has values up to 32, while the Division 1 scoreboard shows 13 problems.
