  title: ICPC Pacific Northwest RC
  language:
  - en
  teams: 69
  problems: 13
  times: true
  tries: true
  description: |-
    Final scoreboard of Division 1, produced by PC^2 (version 9.11), headed Final Scoreboard with the statement that the contest has ended: 69 teams, ranked by problems solved and then time; the 13 teams that solved nothing all share rank 57. Each row gives rank, team number and name with institution, site and division in brackets, solved, total time, and for each of the thirteen problems A to M the attempts and the time, with -- in place of the time when the problem is unsolved, plus a column of total attempts and solves. A last row gives submitted, first yes and total yes per problem, and a legend explains the colours (solved, first to solve, pending, wrong).

    The page links to standings pages by site and division, including Division 2. Those pages are not in our copy.
