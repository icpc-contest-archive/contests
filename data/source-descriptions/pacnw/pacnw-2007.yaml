  description: |-
    Problem category page of Baekjoon Online Judge, with Korean menus, for the 2007 Pacific Northwest Region Programming Contest (source: ACM-ICPC Regionals, North America, Pacific Northwest Regional). A table lists twelve problems labelled A to K and P with the judge's problem number, title, marks, and the numbers of solvers, submissions and the solved ratio. Problems A, K and P have Korean titles; the other nine titles are in English.

    The page holds only the list. The statements are on pages of their own, which are not part of our copy.
