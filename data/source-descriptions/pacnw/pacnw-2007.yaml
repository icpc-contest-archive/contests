  title: The 2006 ACM Pacific Northwest Programming Contest
  language:
  - en
  description: |-
    Website of the ACM ICPC Pacific Northwest Region. Our copy holds 68 files, 56 of them pages (HTML, PDF and text), many of them the same document saved under several addresses and dates from 2007 to 2025. The first page is headed The 2006 ACM Pacific Northwest Programming Contest, but its table is the final results of the 2007 contest: 76 teams with rank, team, number solved and time, hosted by Stanford University, University of Washington, Simon Fraser University, Whitworth University and BYU-Hawaii.

    For 2007 the site also has a 2007 Problem Set page that links the problem set (PDF and MS-Word) and sample input and output as a RAR and a ZIP archive; both archives are in our copy. The rest is other editions: the 2008 final standings, the 2008 problem directory with text reports of the 2008 contest (runs report, contest analysis, runs grouped by team, solutions by problem, submissions by language) and PDF, input and output archives, the 2011 final standings, archives for 2010, 2012 and 2014, technical notes for 2019 and November 2024, and PDFs of the March 2021 and March 2022 contests and the 2022 solutions. Two PDFs under Spring2023 are cut at 1 MiB and cannot be opened.
