  description: |-
    Final results page headed FINAL RESULTS 2007 ACM-ICPC Pacific Northwest Region, hosted by Stanford University, University of Washington, Simon Fraser University, Whitworth University and BYU-Hawaii. One table of 76 teams with rank, team (institution and team name), number solved and total time; no per-problem detail. The browser title of the page reads The 2006 ACM Pacific Northwest Programming Contest.

    University of British Columbia (UBC^) is first with 11 solved, followed by UBC* with 10 and Stanford Red with 10. Every team has its own rank from 1 to 76.
