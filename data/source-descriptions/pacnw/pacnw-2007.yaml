  description: |-
    Zip archive of 49 entries named ICPC_PacNW_2007, the problem set of the contest. Folders hold the statements of eleven problems A to K as PDFs of one or two pages each plus a practice problem (Find Multiples), the same statements as Word documents, and one input file and one output file for each problem A to K. The statements are in English.

    The titles are Rock, Paper, or Scissors?, Missile Command, Palindromic Primes Category in Jeopardy!, Pebbles, Rubik's Cube, Geek Challenge [SKRZAT] (Base Minus Two), Frogger, Bubble Gum, Bubble Gum, in the dish, how many pieces do you wish?, Games R Us, Cover Up and Bridged Marble Rings. Our copy is the zip file itself, saved under the name page.html.
