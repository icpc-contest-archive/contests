  description: |-
    Website of the ACM ICPC Pacific Northwest Region. Our copy holds 55 files, 41 of them pages (HTML and PDF), many of them the same document saved under several addresses and dates from 2007 to 2025. The first page has the page title The 2006 ACM Pacific Northwest Programming Contest, but its visible heading reads FINAL RESULTS 2007 ACM-ICPC Pacific Northwest Region and its table is the final results of the 2007 contest: 76 teams with rank, team, number solved and time.

    For the 2006 contest the site has the standings page (65 teams) and a 2006 Problem Set page that links four RAR archives: problem statements in PDF, problem statements in RTF, input files and output files. The four archives are in our copy.

    The site also holds material of other years: the 2007 problem set page with ZIP and RAR archives, the 2011 final standings (94 teams with medal citations), archives for the 2010, 2012 and 2014 contests, technical notes for 2019 (5 pages) and November 2024 (6 pages), PDFs of 20 to 29 pages for the March 2021 and March 2022 contests (Divisions 1 and 2) and the solutions of 2022. Two PDFs under Spring2023 are cut at 1 MiB and cannot be opened.
