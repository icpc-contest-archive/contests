  description: |-
    Problem category page of Baekjoon Online Judge, with Korean menus, for the 2006 Pacific Northwest Region Programming Contest (source: ICPC Regionals, North America, Pacific Northwest Regional). A table lists eleven problems labelled A to K with the judge's problem number, title, marks, and the numbers of solvers, submissions and the solved ratio. Nine titles are in English and the titles of I and K are in Korean.

    The page holds only the list. The statements are on pages of their own, which are not part of our copy.
