    Final scoreboard of Division 1, produced by PC^2 version 9.7: 47 teams ranked with name and institution, problems solved and total time, and for each of the 17 problems A to Q the number of attempts and the solving time in minutes (a dash where unsolved). A last column gives total attempts per solved, and a bottom row gives submissions, time of first yes and total yes per problem. First place is DA_Flint (De Anza) with 17 solved; the last rows are teams with no problems solved.

    The page links per-site standings for Canada, Hawaii, Oregon, California and Washington, Division 2 standings, the Division 1 problem description PDF, sample data and technical notes. Those linked files are not part of this page.
