  read: '2026-11-16'
  rubric: 1
  copy: pacnw/pacnw-2020/standings/api-20261113/standings.html
  title: The 2020/2021 Pacific Northwest Regional Contest — standings
  language:
  - en
  teams: 105
  description: |-
    Final standings of both divisions in one table: 105 teams with rank, team name, institution, problems solved, total time, medal, citation and site citation. The 47 Division 1 teams come first; the first three carry Gold, Silver and Bronze, followed by ranked places with titles such as Fourth Place. The 58 Division 2 teams follow, most with a D2 prefix in the team name; their top three carry D2 Gold, D2 Silver and D2 Bronze. 83 teams carry the citation Honorable Mention, ten of them sharing rank 96. First place is DA_Flint (De Anza College) with 17 solved. No per-problem results.
