- url: http://www.acmicpc-pacnw.org/results.htm
  read: '2026-11-16'
  rubric: 1
  copy: pacnw/pacnw-2020/standings/20260901-live-083808b9/results.htm
  title: Results
  language:
  - en
  description: |-
    Results index page of the Pacific Northwest regional contest website, with the site's menu (home, host a contest, rules, registration, details, results, links, sponsors). It lists contest years from 2025 back to 1994 with links to scoreboards, final standings, problem statements, judge data, solutions and discussions; the exact set differs by year, and the 2025 entry points to another server.

    The entry for 2020 (March 6, 2021) links the main scoreboard page, the Division 1 and Division 2 scoreboards, and an archive with the problem set, solutions, judging input and output, and an editorial for each problem. Our copy holds only this page; the linked documents are separate files.
- url: http://www.acmicpc-pacnw.org/scoreboard/2020/index1.html
  read: '2026-11-16'
  rubric: 1
  copy: pacnw/pacnw-2020/scoreboard/2026-09-01-live-472f4209/index1.html
  title: Pacific NW 2020 Regional Contest Division 1 Standings
  language:
  - en
  teams: 47
  problems: 17
  times: true
  tries: true
  description: |-
    Final scoreboard of Division 1, produced by PC^2 version 9.7: 47 teams ranked with name and institution, problems solved and total time, and for each of the 17 problems A to Q the number of attempts and the solving time in minutes (a dash where unsolved). A last column gives total attempts per solved, and a bottom row gives submissions, time of first yes and total yes per problem. First place is DA_Flint (De Anza) with 17 solved; the last rows are teams with no problems solved.

    The page links per-site standings for Canada, Hawaii, Oregon, California and Washington, Division 2 standings, the Division 1 problem description PDF, sample data and technical notes. Those linked files are not part of this page.
