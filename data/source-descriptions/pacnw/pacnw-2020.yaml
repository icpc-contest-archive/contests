  description: |-
    Results index page of the Pacific Northwest regional contest website, with the site's menu (home, host a contest, rules, registration, details, results, links, sponsors). It lists contest years from 2025 back to 1994 with links to scoreboards, final standings, problem statements, judge data, solutions and discussions; the exact set differs by year, and the 2025 entry points to another server.

    The entry for 2020 (March 6, 2021) links the main scoreboard page, the Division 1 and Division 2 scoreboards, and an archive with the problem set, solutions, judging input and output, and an editorial for each problem. Our copy holds only this page; the linked documents are separate files.
