  title: Pacific Northwest Regional Programming Contest Division 2
  language:
  - en
  contest_date: '2021-03-06'
  problems: 17
  pages: 27
  description: |-
    Problem set of Division 2 as a PDF of 27 pages in English. The cover page reads "Pacific Northwest Regional Programming Contest", "Division 2" and "6 March 2021", and lists the languages supported (C, C++ 17, Java, Python 3 with pypy3 and Kotlin) and general rules for input and output. It is followed by 17 problems lettered R to AH, from R "No Thanks!" to AH "Triangular Collection", each on one or two pages with a time limit printed without a unit, the statement, Input and Output sections and one to three samples of input and output; 34 samples in all.

    Each problem page has a banner at the top reading "ICPC North America Regionals 2020" with sponsor logos, and a footer such as "Pacific Northwest 2020—Division 2 Problem R: No Thanks!" with the page number. No solutions or test data.
