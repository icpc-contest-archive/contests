  tries: true
  description: |-
    Complete contest report of the CSUS Programming Contest Control System (version 8.7), a plain text file of 5,637 lines for the contest that started on 5 November 2005 at 10:56 and ran five hours. It lists the team entries of four sites with their institutions, 13 of them marked INACTIVE, the three languages (Java, GNU C, GNU C++), the ten problems A to J with their settings, and the ten judgement names.

    The main part is the log of all 587 runs, each with team, problem, language, contest minute and judgement (146 Yes, 441 other judgements). Reports follow: submissions by language, the number of teams that solved each problem, correct and incorrect solutions per problem, balloon summary and detail, a summary of runs per team and problem, runs listed per team, a problem-by-team grid of attempts and solve times, and for each problem the fastest solvers in order. There is no ranked table of teams.
