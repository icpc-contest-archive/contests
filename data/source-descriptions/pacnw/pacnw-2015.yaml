    Category page of Baekjoon Online Judge for the 2015 Pacific Northwest Region Programming Contest, in Korean, with problem titles in English. Two tables list the problems with judge problem number, letter, title, accepted users, submissions and acceptance rate: Division 1 has 11 problems A to K, Division 2 has 11 rows L to V. Two Division 2 rows, Q and T, repeat the Division 1 problems Excellence and Triangle under the same problem numbers, so the page holds 20 different problems.

    The page lists problems only; the statements are not part of it.
