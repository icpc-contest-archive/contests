  language:
  - en
  teams: 145
  description: |-
    Standings of the 2015 Pacific Northwest Regional Contest, both divisions in one table: 145 teams with rank, team, institution, number solved, time, medal, citation and site citation. Division 2 teams carry a D2 prefix in the team name (75 teams); the other 70 are Division 1. A D2 team ranks first, ahead of Stanford Cardinal, so the two divisions are interleaved by results.

    Gold, silver and bronze medals are marked, with Division 2 medals labelled D2, and citations give place names and site winners. Forty-five teams are listed as Honorable Mention in the citation column, thirteen of them with no solved problems. There are no per-problem results.
