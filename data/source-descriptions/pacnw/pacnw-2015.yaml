  description: |-
    Codeforces gym dashboard of the Division 1 contest, marked Finished. The problem table lists eleven problems A to K (Airports, Butterfly Effect, Classy, Triangle, Excellence, Falling Blocks, Racing Gems, Hilbert Sort, Coverage, Olympics, Checkers) with time and memory limits and a count such as x277 for problem A that links to the status page. The page links to a statements PDF in English, the submission, status and standings pages, and the contest website.

    The page also carries the site's forms for asking questions and posting announcements.
