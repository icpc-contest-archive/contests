  times: true
  tries: true
  description: |-
    Division 1 scoreboard of the 2015 Pacific North West contest, produced by PC^2 (version 9.3): 70 teams with rank, team name and institution in brackets, number solved and penalty time. Eleven problems A to K each show attempts and the minute of the first accepted run (for example 1/53), or 0/-- when not attempted (attempts followed by -- mean unsolved); a last column gives total attempts and solved. Stanford Cardinal is first with 10 solved.

    The last row summarises each problem as submitted, time of the first yes, and total yes. Links lead to per-site standings for six sites (Northeast, Northwest, Canada, Puget Sound, Hawaii, N. California) and to the Division 2 standings. The footer reads Last updated Tue Nov 17 21:35:19 PST 2015. Our copy holds the page with its style sheet and images.
