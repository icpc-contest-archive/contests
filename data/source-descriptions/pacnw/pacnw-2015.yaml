    Division 2 scoreboard of the 2015 Pacific North West contest, produced by PC^2 (version 9.3): 75 teams with rank, team name and institution in brackets, number solved and penalty time. Eleven problems labelled L to V each show attempts and the minute of the first accepted run, or 0/-- when not attempted (attempts followed by -- mean unsolved); a last column gives total attempts and solved. Ranks are shared by teams with equal results: the last 12 rows share rank 64, all with zero solved. UVic Cyan is first with 10 solved.

    The last row summarises each problem as submitted, time of the first yes, and total yes. Links lead to per-site standings for six sites and to the Division 1 standings. The footer reads Last updated Tue Nov 17 21:36:36 PST 2015.
