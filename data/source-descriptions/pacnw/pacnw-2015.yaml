  description: |-
    Division 1 problem set as handed out at the contest: a PDF of 24 pages. The cover gives the title and the date, November 14th, 2015, followed by reminders on input and output and the platform and compiler options used (Ubuntu 14.04, g++, gcc, Java, Python 2.7 and 3.4, mono).

    Eleven problems A to K follow, each with a time limit (2 to 10 seconds), a statement in English with input and output format, and sample input and output. The last page ends problem K. No test data or solutions.
