  title: CSUS Programming Contest System
  language:
  - en
  problems: 11
  description: |-
    Runs report of the CSUS Programming Contest System (version 9.1.0), a plain text file under the heading 752 runs. Each of the 752 lines is one submission with its run number, site (five sites occur), team number and name with institution in brackets, problem (A to K, as A - Tetrahedral Stacks of Cannonballs through K), language (Java, GNU C++ and others), and the judge's answer: 341 runs are judged Yes, the others carry answers such as No - Wrong Output or No - Output Format Error.

    The file has no ranking and no per-team totals: solved problems and standings have to be worked out from the lines. The report is dated 1 January 2009.
