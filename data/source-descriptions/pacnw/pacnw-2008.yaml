  teams: 87
  description: |-
    Final results page headed FINAL RESULTS 2008 ACM-ICPC Pacific Northwest Region, hosted by Stanford University, University of Oregon, University of British Columbia, Eastern Washington University and BYU-Hawaii. One table of 87 teams with rank, institution, team name, problems solved and total time; no per-problem detail.

    Stanford Red is first with 10 solved. Ranks run from 1 to 85, and the last two teams, with no problem solved, have no rank number.
