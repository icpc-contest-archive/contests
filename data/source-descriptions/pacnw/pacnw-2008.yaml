  description: |-
    Zip archive holding a folder of eleven PDFs, one statement for each problem A to K (Tetrahedral Stacks of Cannonballs, Robot Roll Call, Cave Crisis, Obstacle Course, Pencils from the 19th Century, Optimal Strategy for the ICPC, Symbolic Logic Mechanization, Repair Depots, Crazy Circuits, PropBot and the Ancient Calculator problem). Each PDF is headed Problem and its letter, runs to one or two pages, in English, and contains a sample.

    The archive holds only these eleven PDFs, with no test data. Our copy is the zip file itself, saved under the name page.html.
