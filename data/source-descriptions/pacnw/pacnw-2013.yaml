    Problem set: a PDF of 30 pages. The cover names the Pacific Northwest Region Programming Contest, lists six host universities (Brigham Young University, Hawaii; Eastern Washington University; George Fox University; University of British Columbia; University of California, Santa Cruz; University of Puget Sound) and gives the date November 2nd, 2013. A page of reminders gives the rules for input and the compiler options. Thirteen problems, A to M, with Star Trek names and themes, each with a time limit (5, 10, 20 or 75 seconds), a statement in English, input and output format and one sample. The first problem is Assignments. No test data or solutions.
