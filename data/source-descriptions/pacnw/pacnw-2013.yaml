  description: |-
    Website of the Pacific Northwest Regional contest series (acmicpc-pacnw.org), in English. Our copy holds 111 saved files, 96 of them pages, at 46 distinct addresses; several pages are saved under more than one host spelling. It covers several editions, not only 2013.

    For 2013 it has the overall scoreboard (117 teams, problems A to M, produced by PC^2), six site pages for Hawaii, Canada, E. Washington, Oregon, Puget Sound and N. California, the 30-page statements PDF, and a solutions archive of 26 files (a C++ and a Java file for each problem).

    Other editions: the 2011 final standings page; the 2012 archive of problem folders; for 2014 a listing of the problem folder, Division 1 and Division 2 statements PDFs dated November 15th, 2014, a solutions archive, and standings pages (a summary, a Division 1 and a Division 2 page, and twelve per-site pages); technical notes for 2019 and fall 2024; and problem-set PDFs for Divisions 1 and 2 dated 6 March 2021 and 5 March 2022.
