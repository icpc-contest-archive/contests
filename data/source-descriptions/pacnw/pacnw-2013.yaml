    Scoreboard produced by PC^2 (version 9.3, build 2708): 117 teams, each with name and institution in brackets, problems solved, total time, and for each of problems A to M the number of attempts and the minute of the first accepted run (1/9 means one attempt, solved at minute 9; 0/-- means no attempt). The problem columns are headed by a colour name (Dark Green for A, Red for B and so on), and a last column gives total attempts over problems solved. Ranks run from 1 to 112; six teams with no problem solved share rank 112. A closing row gives submitted runs, time of first yes and total yes per problem. Links lead to six per-site standings pages. The footer reads 'Last updated Sat Nov 02 18:44:14 PDT 2013'. First place is Berkeley Blue with 10 problems and 1095 minutes.
