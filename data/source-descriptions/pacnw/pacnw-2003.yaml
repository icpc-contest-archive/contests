  description: |-
    Scoreboard titled Team/Problem Summary for the 2003 Pacific NW contest: 82 teams listed by site number, team number and team name with school, against nine problems A to I. Each cell shows the number of tries and a time, or tries followed by two dashes in place of the time, which are the problems not counted as solved in the summary below; empty cells have no entry. 27 teams are from site 1, 47 from site 2 and 8 from site 3.

    A summary table under the teams gives, per problem, the tries, the number of yes judgements and the fastest solution time. Two teams at site 3 are named UNOFFICIAL. The page has no ranks and no totals per team.
