  description: |-
    Short contest report page of the contest website, in English: the 2003 Pacific NW Region contest ran at three sites at once, Portland State University, CSU Fresno and BYU Hawaii, the last the first ever in Hawaii, which hosted 6 teams. It says more than 80 teams registered, calls it the biggest contest ever, and thanks the site volunteers and the PC2 team. No results or problem information.
