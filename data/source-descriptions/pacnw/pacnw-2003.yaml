- url: http://www.acmicpc-pacnw.org/results.htm
  read: '2026-11-16'
  rubric: 1
  copy: pacnw/pacnw-2003/website/2026-11-15-wayback-3e1ab44d
  title: Pacific Region Results
  language:
  - en
  description: |-
    Website of the ACM Pacific Northwest Region contest in English, with pages saved at several dates between 2001 and 2023. The results index is marked last updated 11/15/07 and the 2007 home page announces the 2007 contest. Our copy holds 111 files, 59 of them pages. The pages cover registration, hosting a contest, contest details, rules, links and a site directors' guide, and a results index that lists final standings, problem sets and statistics for the contests from 1994 to 2007.

    For 2003 the copy holds the final standings (rank, team, number solved, time), the team and problem summary with tries and times for problems A to I, the report in plain text from the CSUS Programming Contest Control System for site 1 (Fresno), and the problem-set zip with nine Word files. The 2003 contest has no home page of its own in this copy. The home page of the older web address in it is the one for the 2000 contest, dated 11 November 2000, and its pages also hold results of 1994 to 2000.

    Standings, problem sets and reports of other years are in the same copy. The report file in our copy breaks off in the middle of its per-team run lists. Images and style sheets are saved with it.
- url: http://www.acmcontest-pacnw.org/
  read: '2026-11-16'
  rubric: 1
  copy: pacnw/pacnw-2003/web-mirror/20031201-wayback-30d6021c/page.html
  title: ACM - Pacific Region Programming Contest
  language:
  - en
  contest_date: '2003-11-15'
  description: |-
    Home page of the ACM Pacific Region Programming Contest for 2003, in English, last updated 11/21/03. It describes the region (Alaska, Hawaii, British Columbia, Washington, Oregon, northern and central California, western Nevada) and gives the date, Saturday 15 November 2003, and the three sites: CSU Fresno in Fresno, Portland State University in Portland, and BYU Hawaii in Laie, the last new that year.

    It lists the overall top ten teams, with the first two marked as those going to the World Finals in Prague in March 2004, and the champions of the North, South and Hawaii sites. Links lead to the complete results, the problem set and the report. Registration and details pages are not part of this copy; the navigation image is saved.
