  description: |-
    Final standings of both divisions in one table: 145 teams with rank, team name, institution, problems solved, total time, medal, citation and site citation. The two divisions are interleaved by rank, so rank 1 appears twice: the Division 1 team new-final-final-2 (University of Washington) with 12 solved, cited as D1 Champions, and the Division 2 team D2Ursi5 (University of California, Berkeley) with 12 solved, cited as D2 Champion. Gold, silver and bronze medals are given to the first three places of each division, other teams are marked Ranked, and 21 teams at the bottom carry the citation Honorable Mention. Site citations name the winner of each site, such as Canada D2 Site Winner. No per-problem results.
