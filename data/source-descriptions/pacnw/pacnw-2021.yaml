  description: |-
    Final scoreboard of Division 1, produced by PC^2 version 9.8: 62 teams ranked with name, institution and site in brackets (for example Washington D1, California D1, Canada D1), problems solved and total time, and for each of the 13 problems A to M the number of attempts and the solving time in minutes (a dash where unsolved). Tied teams share a rank; the last rank, 52, is shared by teams with no problems solved. A last column gives total attempts per solved, and a bottom row gives submissions, time of first yes and total yes per problem. First place is new-final-final-2 (U of Washington) with 12 solved.

    The page links per-site standings for California, Washington, Hawaii, Oregon and Canada, Division 2 standings, the Division 1 problem description PDF, sample data and technical notes. Those linked files are not part of this page.
