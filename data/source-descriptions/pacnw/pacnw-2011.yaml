  description: |-
    Final scoreboard of the 2011 Pacific Northwest Regional Contest produced by PC^2 (the page footer names CSUS PC^2 version 9.3): 94 teams with rank, team name with the institution in brackets, problems solved, total time, and a cell for each of the problems A to K. Each cell holds two entries separated by a slash, for example 1/3 or 4/--; the problem columns are headed with a colour name per problem (Green for A, Red for B and so on), and a last column gives a total in the same form. The last row gives Submitted/1st Yes/Total Yes per problem. Stanford Cardinal is first with 9 problems.

    The page links to six per-site standings pages (Canada, N. California, Puget Sound, Northeast, Northwest, Hawaii) and to the PC^2 homepage; the per-site pages are not part of our copy.
