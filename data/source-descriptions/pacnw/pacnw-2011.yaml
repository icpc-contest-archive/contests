  copy: pacnw/pacnw-2011/website/2026-09-05-wayback-9c0dc4b5
  title: 'Final standings : PacNW 2011'
  language:
  - en
  description: |-
    Pages and files of the series site acmicpc-pacnw.org, entered at the final standings of the 2011 Pacific Northwest Regional Contest. For 2011 it holds the final standings (94 teams, with last-solution time, citation, site citation and medal columns), the scoreboard page of the same 94 teams with a result for each problem A to K, and the directory listing of the 2011 problem set. The listing names three zips, and all three are in our copy: problem statements (12 PDF files), input and output files (24 files) and selected solutions (23 files).

    The site also holds the 2012 contest: an overall scoreboard with problems A to L, six per-site standings pages, the problem statements as a PDF of 18 pages with a cover dated 3 November 2012, and a zip with per-problem solution and data files. Other material: zips for 2007, 2010 and 2014, technical notes for the contest environment (2019 and 2024), problem sets of the contests of 6 March 2021 and 5 March 2022 (two divisions each), judges' solutions slides dated 25 February 2023, and one photograph.

    Our copy holds 76 files, 45 of them different, as several documents are saved under more than one address. Two of the 2023 PDFs are cut off at 1 MiB and cannot be opened. There is no front page, rules or schedule.
