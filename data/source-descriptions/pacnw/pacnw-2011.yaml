    Dashboard of Codeforces gym contest 2011-2012 ACM-ICPC Pacific Northwest Regional Contest, marked Finished. It lists 11 problems, A to K, from Good or Bad? to Tree Count, each with its input and output form (standard input/output), a time limit of 5 or 15 seconds, a memory limit of 256 MB, and a count such as x242 beside it. The page also has the virtual participation and practice notes, forms to ask a question and to add an announcement, a link to the contest website and the Codeforces menus and sign-in links. The statements are linked as a PDF attachment and as per-problem pages, none of which is part of our copy.
