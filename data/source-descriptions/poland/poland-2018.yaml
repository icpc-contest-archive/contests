    Scoreboard titled "AMPPZ 2018 - Klasyfikacja Oficjalna" (AMPPZ 2018 - Official Classification), a single HTML table of 51 teams. Each row gives place, team name (university and a number), three team members, points (which equals the number of problems with an AC cell), penalty time, and one column for each of the 13 problems A to M. A problem cell that is not empty starts with an outcome code (AC, WA, TL, RE or CE), followed by a time in minutes; accepted cells end with a plus count such as +0 or +2, the others with a number in brackets such as (22). Of the 297 non-empty cells, 229 are AC. The first place is University of Warsaw 1 with 10 problems solved. A checkbox labelled "pełne wyniki" (full results) shows and hides the per-problem columns.

    The page's style sheet and script are kept with our copy.
