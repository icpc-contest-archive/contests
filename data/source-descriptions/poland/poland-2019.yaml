  description: |-
    Website of the 2019 Akademickie Mistrzostwa Polski w Programowaniu Zespołowym (Academic Polish Championship in Team Programming, AMPPZ 2019), in Polish, hosted by the Faculty of Mathematics and Computer Science of the Jagiellonian University in Kraków for 26 and 27 October 2019. The front page is a single page with sections on the contest, results, registration and fees, a preliminary schedule for both days, venue and hotels, and contact. The results section names the first three teams and links to the ranking page, which is in our copy as a Satori Testing System ranking of 45 teams.

    The problems page lists problems A to L with a PDF statement and a test data and reference solution link for each. It also links the full problem set in Polish, an English version marked unofficial, and a presentation of solutions. Our copy holds 50 files, 20 of them pages (HTML and PDF), including those twelve statements, both full problem sets and the presentation. Of the test data archives only the one for problem J is in our copy; the one for problem E was too large to save and the others are not in it. The presentation in the site copy is cut off at 1 MiB and does not open as a complete PDF. The embedded Google document and the map on the front page lead to other servers.
