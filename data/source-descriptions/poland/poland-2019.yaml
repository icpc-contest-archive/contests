  description: |-
    Scoreboard of the AMPPZ'19 contest from the Satori Testing System, in English: 45 teams, with the header row repeated at the bottom. Each row gives the team name with its three members in brackets, the score (problems solved), the time, and one column for each of the 12 problems A to L. A problem cell holds the number of attempts and, for a solved problem, the time in brackets, for example "1 (1:05)"; a dash means no attempt. The Rank column is empty in every row, so the order of the rows is the only ranking. The first row is team uw1 with 9 problems solved. Only two of the page's linked style sheets are kept with our copy, and its Satori logo is not.
