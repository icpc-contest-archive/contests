  description: |-
    Slides in Polish by the Jagiellonian University, dated 27 October 2019: a PDF of 136 pages, numbered as 80 slides, since many slides are built up over several pages. It opens with statistics of the contest (594 submissions, 208 accepted, the first problem solved and the team with most attempts on one problem). It then has a section for each of the 12 problems A to L: a slide with the problem's number of submissions and accepted submissions, the first solution and its time, and the problem's author, followed by the problem restated and the solution method with formulas and diagrams.
