  description: |-
    Website of the 10th Akademickie Mistrzostwa Polski w Programowaniu Zespołowym, Kraków, 28-29 October 2005, in Polish. The Institute of Informatics of the Jagiellonian University organises it, for the second time, under the patronage of the university's rector; a Motorola logo with a link to its site stands for the sponsor. Our copy holds 68 pages: the home page, the final ranking, the problem statements page, the model solutions and tests page, a photo index, the schedule with venues and hotels, the rules, the registration terms, the history of the contest from 1996 to 2004, directions, links to other contests, a PDF list of 50 teams, and a page listing 840 submissions.

    The ranking page has one table of 50 teams; it names other views (remote contest, secondary-school contest, all contests, main plus remote) that are not in our copy. The submissions page gives for each submission the problem letter, the time, the team code, the result code and details, from 09:05 to 14:00 on 29 October. Five photo galleries are listed (opening ceremony, teams, staff, a gallery titled "Maciek :)", closing ceremony); our copy holds 48 thumbnail images with their pages for three of them (opening ceremony 19, teams 20, staff 9) and no full-size photos. The ten statement PDFs A to J, the three trial statements X, Y and Z and the PDF of technical arrangements are not in our copy. Twelve of the thirteen archives of model solutions and tests are saved; the one for trial problem X is missing.
