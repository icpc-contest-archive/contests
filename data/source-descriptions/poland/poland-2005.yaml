    Achievements page of the Faculty of Mathematics, Informatics and Mechanics of the University of Warsaw, in Polish, for the 10th Akademickie Mistrzostwa Polski w Programowaniu Zespołowym. It lists the faculty's teams placed 1st, 2nd, 4th, 5th and 7th with their members. A report signed by Krzysztof Diks and Jan Madey says that the contest was held on 28-29 October 2005 at the Institute of Informatics of the Jagiellonian University, that 50 teams took part, and that the faculty entered six teams, placed 1, 2, 4, 5, 7 and 17. It gives the solved counts of the top places: ten problems for the first two teams, nine for the third (a Wrocław team), eight for the 4th and 5th, seven for the 6th (a Wrocław team) and six for the 7th. The page is not a full ranking and has the faculty site's menu around it.
