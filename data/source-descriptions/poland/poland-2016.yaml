  description: |-
    Home page of the website of the 2016 AMPPZ, "Akademickie Mistrzostwa Polski w Programowaniu Zespołowym" (Polish Collegiate Team Programming Championship), in Polish, headed "Wrocław, 28-29 X 2016". The text explains the contest (teams of three from Polish universities, five hours, 8 to 12 problems, solutions judged live during the contest), says this year's championship takes place on 28-29 October 2016 at the University of Wrocław, and calls AMPPZ the national form of the ICPC. Below it are the logos of the strategic partner PKO BP, the sponsors (PKO Fundacja, Facebook, Google, Axit, Nokia, Capgemini, Ten Square Games) and the partners (Agencja Rozwoju Aglomeracji Wrocławskiej, ICPC, Instytut Informatyki UWr).

    The menu links the pages on venue, accommodation, fees, schedule, team registration, problem statements, presentation of solutions, gallery, final ranking, prizes, rules and contact, and the 2015 edition. Our copy holds only this page; the final ranking and the other linked pages are not in it.
