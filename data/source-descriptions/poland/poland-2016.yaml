    Contest dashboard of the QOJ.ac online judge for the 2016 Polish Collegiate Programming Contest: a table of 12 problems A to L with their names, links to the judge's submissions, standings and external standings pages, and the notices and questions boxes, both empty. The page gives the ICPC ruleset, a 20-minute penalty and a limit of 1000 submissions per problem.

    A note in Chinese says the problems come from AMPPZ 2016 and were later used in two Moscow workshop contests, where problems D and J were replaced by others and the rest stayed the same. The statements themselves are on other pages of the judge that are not part of our copy.
