  contest_date: '1998-10-24'
  description: |-
    Website of the III Akademickie Mistrzostwa Polski w Programowaniu Zespołowym (3rd Academic Polish Championship in Team Programming), Warsaw, 23 and 24 October 1998, in Polish. The organisers named are the Institute of Informatics of the University of Warsaw, the Software Engineering Section of the Informatics Committee of the Polish Academy of Sciences and the university's student informatics society, with the Ministry of National Education and several companies as sponsors. The pages give an introduction with the history of the contest, the rules, the list of accepted teams, practical details (venue at the Faculty of Mathematics, Informatics and Mechanics, hotels, meals, tram map), an entry form, a results table, a photo page, and the problems.

    The results page links to a communique of 9 December 1998: a team from Poznań University of Technology found errors in the test data of two problems, Relations and Tree, and the organisers worked out that two teams were affected and that the Poznań team would have placed third. The home page also links the problem pages of the 1997 and 1996 contests on other servers; those are not in our copy.

    Our copy holds 10 HTML pages, 9 PostScript problem statements with their test input and output files, a 437 kB archive of the same statements and test files, and 8 photographs (the photo page links a ninth that is not saved) and some images of the page design.
