  description: |-
    Single page of the AMPPZ 2022 website, in Polish, of the Jagiellonian University in Kraków. It has sections for sponsors, results, about the contest, registration and fees, a schedule for 29 and 30 October 2022, the venue and a contact address. The results section says 50 official student teams and 14 unofficial teams (secondary schools and sponsors among them) took part, and lists the 12 medal teams (4 gold, 4 silver, 4 bronze) with rank, university with its members, problems solved and time, led by the University of Wroclaw with 11 problems. It links to the full ranking, the Polish statements and an unofficial English version, and to the previous editions 2019 and 2021.

    Only this page is in our copy; the linked ranking and statements are separate documents. An embedded Google document and a map load from other servers and are not part of our copy.
