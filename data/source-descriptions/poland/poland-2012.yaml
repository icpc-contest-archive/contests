    Problem set in English: a PDF of 12 pages with 11 problems, A to K, in the order Vending Machine, Bus Trip, Sequence, DNA, Evaluation of an Expression, Formula One, Save the Dinosaurs, Hydra, Inversions, Do It Tomorrow, Rabbits. Each problem has a three-letter code, a line giving the available memory (128 MB, 256 MB for Rabbits), a statement, input and output sections and a sample; Bus Trip takes two pages and the others one.

    Every page carries a footer with the labels organizer, main sponsor and partners (in Polish) and the line 26-28 X 2012 / amppz.mimuw.edu.pl. There is no cover page, test data or solutions.
