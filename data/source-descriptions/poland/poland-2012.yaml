  description: |-
    Page of the Faculty of Mathematics, Informatics and Mechanics of the University of Warsaw, in Polish, under its list of achievements. It gives the places of five of the faculty's teams (1, 2, 5, 6 and 9) and a report on the contest: 54 teams of three, 11 problems in five hours, held at the Faculty of Management of the University of Warsaw, with University of Warsaw teams in first and second place and six University of Warsaw teams among the first thirteen.

    The report lists the first thirteen teams in order with their members: UW2, UW1, UJ8, UWR1, UW4, UW3, UWR2, AGH1, UW6, UWR4, UJ6, UJ1, UW7. It also gives the numbers of teams that solved 10, 9, 8, 7 and 6 problems, says the first five teams receive scholarships, and names the main sponsor and four partners. The rest of the page is the faculty's site menu and footer.
