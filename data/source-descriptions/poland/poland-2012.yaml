  description: |-
    Baekjoon Online Judge category page for AMPPZ 2012, in Korean, filed under ICPC Regionals, Europe, Central European Regional Contest, Poland Collegiate Programming Contest. It lists 11 problems labelled A to K with Baekjoon problem numbers 7974 to 7984. Four titles are in English (Vending Machine, Evaluation of an Expression, Formula One, Save the Dinosaurs) and seven in Korean. For each problem it gives the number of users who solved it, the number of submissions and the acceptance ratio, and each title links to a problem page on the judge.

    Only the category page is in our copy; the linked problem pages are not. The page's style sheets and images are kept with it.
