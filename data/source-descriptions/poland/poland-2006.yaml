    Page of the Faculty of Mathematics, Informatics and Mechanics of the University of Warsaw (MIMUW) about its teams at the championship. It lists the faculty's teams that placed 1st, 2nd, 4th and 6th, with their members, and a short report signed by Krzysztof Diks that says 54 teams of three took part in Kraków, that the University of Warsaw entered seven teams, and that the winning team solved 8 of 10 problems. The report gives the number of problems solved by the teams that placed 1st and 2nd (8 and 7 problems) and 4th, 6th, 7th, 13th and 17th (6, 5, 4, 4 and 3). The report gives 4-5 November 2006 as the dates. The rest of the page is the faculty's site navigation.
