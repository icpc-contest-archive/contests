  contest_date: '2006-11-04'
  description: |-
    Website of the 11th Academic Polish Championship in Team Programming, held in Kraków on 3-4 November 2006 (trial session on Friday the 3rd, contest on Saturday the 4th) and organised by the Faculty of Mathematics and Computer Science of Jagiellonian University; sponsor logos (Motorola, Google) appear on the front page. The site is in Polish, with English labels on the results pages. Our copy holds 87 pages (68 HTML pages and 19 PDFs) among 150 files. The pages cover the announcement, results, problem statements, schedule and organisation of the contest, rules, registration, directions, links, a history of the contest since 1996 with links to earlier editions, and four photo gallery pages (opening ceremony, teams, staff, closing ceremony) with only part of their photos.

    The results pages give the final rankings of the on-site contest, the student off-site contest, the high-school off-site contest and a combined ranking. The problem page links one statement PDF per problem, three trial problems and one PDF with all statements. PDFs of the schedule, the rules, the technical arrangements and the list of starting teams are also in our copy. Links to other editions lead outside the copy.
