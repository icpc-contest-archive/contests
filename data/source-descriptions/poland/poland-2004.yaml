  description: |-
    Website of the IX Akademickie Mistrzostwa Polski w Programowaniu Zespołowym (9th Academic Polish Championship in Team Programming), held in Kraków on 22 and 23 October 2004, in Polish. It states the patronage of the Jagiellonian University's rector and names Comarch as sponsor. Our copy holds 63 pages with 36 photographs, 28 of them also as thumbnails, and some other files. The pages are the home page, the results ranking, a list of ten problem statements with a link to all of them as one archive, the programme and venues of the two days, the rules, the history of the championships since 1996, directions, the list of 48 teams with their universities, a page of links, registration information, and photo pages of the teams, the judges and the closing ceremony, plus one short page for each of the 48 teams.

    The ten problem statement PDFs are not in our copy as separate files, but the archive of all statements is, with the ten PDFs inside. Eight archives of team client files are held; other client archives and some photographs were not fetched. The login page is a form only.
