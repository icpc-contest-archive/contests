  description: |-
    Achievements page of the Faculty of Mathematics, Informatics and Mechanics of the University of Warsaw, in Polish, for the 9th Akademickie Mistrzostwa Polski w Programowaniu Zespołowym. It lists the faculty's four teams with their members: 1st, 3rd, 6th and 8th place. Below is a report signed by Krzysztof Diks. It says the contest was held on 23 October 2004 in Kraków and the Institute of Informatics of the Jagiellonian University organised the contest, that 48 teams of three from 18 universities took part, and that ten problems were set. Only 24 teams solved any problem: 12 solved one, five solved two, five solved three, one solved four and one solved seven. The faculty's teams solved seven (1st), three (3rd), three (6th) and two (8th) problems. The page is not a full ranking and has the faculty site's menu around it.
