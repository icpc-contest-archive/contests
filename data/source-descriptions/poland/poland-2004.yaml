  description: |-
    Website of the 9th Akademickie Mistrzostwa Polski w Programowaniu Zespołowym, Kraków, 22-23 October 2004, in Polish. It is run by the Institute of Informatics of the Jagiellonian University, organiser of the contest for the first time that year, under the patronage of the university's rector; the pages carry the logo of the sponsor Comarch. Our copy holds 63 pages: the home page, the results page, the problem statements page, the schedule with venues and hotels, the rules, the registration terms, the history of the contest, directions, links to other contests, a login page, a photo index with three photo pages (teams, judges and coaches, closing ceremony), a list of 48 teams with institutions, and one page per team.

    The results page is a list of the 24 teams that solved at least one problem. The problems page links ten statements, A to J, as PDFs and one archive of all ten; the archive is saved in our copy and holds the ten PDFs, while the links to the individual PDFs were not saved. The history page names the host institution of each contest from 1996 to 2003. The two gallery pages hold 28 photographs (17 of judges and coaches, 11 of the closing ceremony). Each of the 48 team pages shows a team photo and links to an archive of the team's directory, but only eight of the photos and eight of the archives are in our copy. The login page is only a form.
