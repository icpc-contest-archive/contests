  description: |-
    Page of the Faculty of Mathematics, Informatics and Mechanics of the University of Warsaw, in its list of achievements, for the IX Akademickie Mistrzostwa Polski w Programowaniu Zespołowym (9th Academic Polish Championship in Team Programming). It names the three members of each of the faculty's four teams, which placed 1st (7 problems), 3rd (3), 6th (3) and 8th (2) according to the report, and carries a short report with a signature.

    The report states that the contest took place in Kraków on 23 October 2004, organised by the Institute of Informatics of the Jagiellonian University, with 48 teams of three from 18 universities and ten problems. Only 24 teams solved any problem: 12 solved one, 5 solved two, 5 solved three, one solved four and one solved seven. It thanks two people who prepared the faculty's teams. The ranking covers only the faculty's teams. Our copy is the page with the university's menus and footer around it.
