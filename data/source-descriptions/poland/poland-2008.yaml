    Baekjoon Online Judge category page named AMPPZ 2008, filed under ICPC Regionals, Europe, Central European Regional Contest, Poland Collegiate Programming Contest. It lists ten problems, A to J, each with the judge's problem number and title (Artefakt, Bardzo brudny łańcuch, Ciekawy Książę, Dzień Szachisty, Egzotyczny układ mechaniczny, Fiołkowe puzzle, Goździki, Historia bawełny, a Korean-language title for problem I, Jaka data?) and the judge's counts of people who solved it, submissions and acceptance ratio; problems C, D, E and I carry a special-judge mark. Only problem I has people who solved it (22); the other nine show none. The interface is in Korean. No statements are on the page; each title links to the problem's own page on the judge, which is not in our copy.
