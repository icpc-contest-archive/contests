  contest_date: '2008-11-08'
  description: |-
    Website of the 13th Academic Polish Championship in Team Programming (AMPPZ), held on 7-8 November 2008 and organised by the Institute of Informatics of Poznań University of Technology and the Wielkopolska branch of the Polish Information Processing Society. The site is in Polish. Our copy holds 67 pages among 150 files; some pages are saved twice under two addresses. Its pages cover the announcement, schedule and registration (with the venue, the programme of the two days and the hotels), rules, a tutorial for C/C++ and Pascal, sponsors, organisers, the history of the championship, links and photo galleries.

    The results page has two rankings, one of the local contest with 53 teams and one of the remote contest open to all, with 20 entries; each gives rank, team, points, time and the problems as small letter images, followed by the team members' names. The resources page links the statements of problems A to J and trial problems X, Y and Z, plus archives of all statements, model solutions and tests, and the slides of the solutions discussion. Of these files only the statement of problem I is in our copy. The site also holds a subfolder with the pages of the 2007 edition.
