  description: |-
    Page of the University of Warsaw's Faculty of Mathematics, Informatics and Mechanics (MIMUW) about its teams at the championship. It lists the faculty's teams that placed 1st, 2nd and 3rd, with their members, and a report signed by Krzysztof Diks: the contest was held in Poznań on 7-8 November 2008, 53 teams took part, and the faculty entered 5 teams, which placed 1, 2, 3, 13 and 14. The winners solved 7 of the 10 problems, the next two teams 5 each, and the two teams in 13th and 14th place 4 each. The rest of the page is the faculty's site navigation.
