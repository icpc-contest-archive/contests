  contest_date: '2000-10-28'
  description: |-
    Website of the fifth Polish collegiate team programming championship, held in Warsaw on 27 and 28 October 2000, in Polish. The introduction page gives the history of the series since 1996, names the Institute of Informatics of the University of Warsaw and the Software Engineering Section of the Polish Academy of Sciences Committee of Informatics as organisers, lists the sponsors, and describes the format: a practice day, then a five-hour contest with 6 to 8 problems, teams of up to three students sharing one computer, problems in Polish.

    Our copy holds 6 pages with content and 6 images: introduction, rules, registered teams (18 institutions), detailed information (venue, accommodation, getting around, programme), and the programming environment (Linux with C, C++ and Pascal compilers). The front page has a link to a current ranking; that page is empty in our copy, so no results are in it. Links to the 1998 and 1999 editions lead outside our copy.
