  description: |-
    Achievements page on a University of Warsaw faculty website, in Polish, for this championship. It lists the 2000 results of first, second and fifth place with the names of the team members, followed by a short report signed by Krzysztof Diks, who writes that the championship was held at the faculty on 27 and 28 October and that 42 teams of three from 16 universities took part.

    The report gives the top five in order: first, second and fifth are teams of the University of Warsaw (with members and years of study), third is a team of the Jagiellonian University and fourth of Poznan University of Technology. No other teams are ranked. The rest of the page is the faculty site's menu and footer.
