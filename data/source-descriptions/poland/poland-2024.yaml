  description: |-
    News item of the Faculty of Mathematics, Informatics and Mechanics of the University of Warsaw, in Polish, written by Krzysztof Diks and dated 20 November 2024. It reports on the XXVIII Akademickie Mistrzostwa Polski w Programowaniu Zespołowym, held at the Faculty of Management of the University of Warsaw. The page states that 63 teams from 21 universities took part, together with 7 school teams and 1 sponsor team, and that the winners were a team from the University of Wroclaw, the only one to solve 11 of the 12 problems. It then goes through the medal places (4 gold, 4 silver, 4 bronze) and the 13th place, with the numbers of problems solved by the leading teams, the places of the faculty's own teams, thanks to the organisers and sponsors, and a link to the full ranking on the contest site. Our copy is the news page with the university's site menu and footer around the text.
