  description: |-
    Page from a University of Warsaw faculty website, in Polish, with a short report on the XVI Akademickie Mistrzostwa Polski w Programowaniu Zespolowym, held on 30 October 2011 in the gymnasium hall of the Faculty of Management of the University of Warsaw. It lists the places of five of the faculty's teams (1st, 2nd, 3rd, 7th and 9th) with their members, and embeds six videos from the contest.

    The report, signed by Krzysztof Diks, says 55 teams of three from 19 universities took part, ten of them from the faculty. The winning team solved 10 of the 11 problems, the second 9 and the third 7. It names the sponsor PKO BP and the partner Facebook and says the faculty's best four teams would compete on 13 November in Prague. The rest of the page is the faculty site's navigation and footer.
