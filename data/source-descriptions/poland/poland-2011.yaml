  copy: poland/poland-2011/website/2026-09-05-wayback-21aedb8e
  title: Akademickie Mistrzostwa Polski w Programowaniu Zespołowym 2011
  title_en: Academic Championships of Poland in Team Programming 2011
  language:
  - pl
  contest_date: '2011-10-30'
  description: |-
    Website of the Akademickie Mistrzostwa Polski w Programowaniu Zespolowym (AMPPZ), in Polish. Our copy holds the pages of the 2011 edition under their own address, the pages of the 2012 edition under theirs, and the site's front page, which is the 2012 edition's. The 2011 pages announce the contest for 28-30 October 2011 at the University of Warsaw and give the venue (the Faculty of Management and a hotel), a programme with registration, a practice session, two invited lectures, a company presentation and the main contest on Sunday 30 October, rules, history, and a videos page whose five embedded videos are hosted elsewhere and are not in our copy.

    The 2011 pages also hold a results page with 55 teams, a page of team line-ups by university with three members per team, and links to the problem statements in Polish and in English as PDFs and to a PDF of solution slides, all three of which are in our copy. A link to an archive of tests is not in our copy.

    Our copy has 150 files: 62 HTML pages (several of them the same page under two addresses) besides three placeholder pages from a mail server, 11 PDFs (six different documents), and images and style sheets. The 2012 edition's problem set, statements and solution slides are in it as well.
