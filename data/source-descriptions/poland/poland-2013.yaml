  description: |-
    Page of the University of Warsaw's Faculty of Mathematics, Informatics and Mechanics, in Polish, under its list of achievements. It lists five of the faculty's teams, those placed 1, 6, 8, 9 and 10, with their members, and gives a report on the contest, held on Sunday 27 October 2013 in the sports hall of the Faculty of Management: 52 teams from 17 institutions, 11 problems, with the winners solving 10.

    The report gives the first five places: the winners with 10 problems, a Jagiellonian University team second with 9, a second faculty team with 8, and two University of Wroclaw teams in fourth and fifth place with 8. It gives problem counts for the faculty's teams in places 6, 8, 9, 10, 18, 21, 24 and 25 and names the sponsors and partners. It does not list the other teams. The rest of the page is the faculty's site menu and footer.
