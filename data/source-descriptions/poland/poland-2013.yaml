  description: |-
    Page of the Szkopuł task archive for the AMPPZ contests, in Polish, with a year filter and task lists for 2014, 2013, 2012 and 2011, plus a further list of thirteen tasks lettered A to M. The 2013 block has eleven tasks, each shown by its Polish title and a short code: Autostrada (aut), Cieśla (cie), Demonstracje (dem), Egzamin (egz), Fotoradary (fot), Gra w kulki (gra), Heros (her), Inżynieria genetyczna (inz), Janosik (jan), Kocyki (koc), Walizki (wal). Each title links to its task page on Szkopuł.

    Only the task lists are in our copy, not the statements. The 2013 block has no task named Bajthattan, which is in the contest's statements, and has Walizki, which is not among them. The page carries a notice that its content may be out of date, and it covers other years besides 2013.
