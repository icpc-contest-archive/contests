  description: |-
    Baekjoon Online Judge category page for AMPPZ 2013, with a Korean interface and English problem titles. It lists 12 problems: A to K (The Motorway, Bytehattan, The Carpenter, Demonstrations, The Exam, Speed Cameras, Marbles, The Hero, Genetic Engineering, Janosik, Blankets) with Baekjoon problem numbers 9682 to 9692, and a twelfth, P (Suitcases), number 9681, at the end. For each problem it gives the number of users who solved it, the number of submissions and the acceptance ratio, and marks four of them (A, E, K and P) as having a special judge. Each title links to a problem page on the judge.

    Only the category page is in our copy; the linked problem pages are not. The page's style sheets and images are kept with it.
