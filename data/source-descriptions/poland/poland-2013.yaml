  description: |-
    Problem set in Polish: a PDF of 12 pages with 11 problems, in the alphabetical order of their three-letter codes: Autostrada (AUT), Bajthattan (BAJ), Cieśla (CIE), Demonstracje (DEM), Egzamin (EGZ), Fotoradary (FOT), Gra w kulki (GRA), Heros (HER), Inżynieria genetyczna (INZ), Janosik (JAN), Kocyki (KOC). Each problem has a memory limit (128 MB for nine problems, 256 MB for two), a statement, input and output sections and a sample; Heros takes two pages and the others one.

    Every page carries a footer with the line 25-27 X 2013 / amppz.mimuw.edu.pl and the headings organiser, main sponsor, benefactor and partners above logos, and a header reading Patronat honorowy (honorary patronage). There is no cover page, test data or solutions.
