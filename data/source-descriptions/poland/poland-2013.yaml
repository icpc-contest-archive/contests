  description: |-
    Website of the Akademickie Mistrzostwa Polski w Programowaniu Zespołowym 2013 (AMPPZ), in Polish, with the University of Warsaw's Faculty of Mathematics, Informatics and Mechanics as contact. Its pages give the programme for 25 to 28 October 2013 (main contest on Sunday 27 October), venues, accommodation, a parallel open remote contest, registration through the ICPC registration site, fees, prizes, rules, the history of the contest, organisers and contact.

    The team page lists 52 teams from 17 institutions. In the sidebar, a Results block links the final ranking (a scoreboard of 52 teams and 11 problems) and, under Problems, the Polish problem statements (a PDF with 11 problems) and the solution slides (a PDF of 36 pages); all three are in our copy.

    The site also holds other editions: subsites for 2011 and 2012, statement and slide PDFs for 2011, 2012 and 2014, a front page and a scoreboard page of 2014, and a results page of the 2011 edition. Our copy holds 150 files, 77 of them pages (several the same page under two addresses). The 2011 test archive and some logo images are not in it.
