  title_en: 1st National Team Programming Contest
  language:
  - pl
  contest_date: '1996-10-26'
  description: |-
    Website of the I Ogolnopolskie Zawody w Programowaniu Zespolowym (1st National Team Programming Contest), Poznan, 25 and 26 October 1996, in Polish. It says the contest is organised by the Polish Information Processing Society (Poznan branch), the Institute of Computer Science of Poznan University of Technology and the student society BOOBOO, with the Ministry of National Education and Microsoft-Polska as supporters; Microsoft-Polska is named as sponsor of the prizes. Its pages cover the course of the contest (a practice session on the first day, the contest on 26 October from 10:00 to 15:00, teams of up to three students, six to eight problems in English, solutions in ANSI C or Turbo Pascal), the organising and programme committees, an entry form, a list of participating institutions, directions to the venue, a results table of 24 teams, and an index of problems A to G.

    Our copy holds 66 pages. Besides the contest pages it holds many pages of the BOOBOO student society's site, and some pages from 2000. The problem pages for A to F are saved, each with the statement in English, a solution description and a program listing; problems A, B, C, E and F also show test input, and D has no test data. The page for problem G is not in our copy.
