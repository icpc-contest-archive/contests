  description: |-
    Final classification of the II Ogólnopolskie Zawody w Programowaniu Zespołowym ('KOŃCOWA KLASYFIKACJA KONKURSOWA'), an HTML page in Polish with 26 teams. Columns: position, university, team members, number of problems solved, total time in minutes, and a string of the letters of the solved problems (the letters A, B, C, D, E and H occur). Attempts per problem are not given. Positions 1 to 16 are single teams that solved at least one problem; the last ten teams solved none and share one cell for position 17. The first place has four problems solved in 799 minutes.

    A note below the table says two further teams took part outside the competition, from the University of Warsaw and the University of Wrocław, and gives their places as 1st and 10th; they are not rows of the table.
