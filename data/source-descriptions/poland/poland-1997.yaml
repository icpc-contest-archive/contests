  description: |-
    Website of the II Ogólnopolskie Zawody w Programowaniu Zespołowym (2nd National Team Programming Contest), Wrocław, 24 and 25 October 1997, in Polish, with a frames and a no-frames version. It names Wrocław University of Technology, the Software Engineering Section of the Informatics Committee of the Polish Academy of Sciences and the Lower Silesian branch of the Polish Information Processing Society as organisers, supported by the Ministry of National Education. The pages give the aims and history (the first contest, Poznań 1996, had 24 teams from 12 universities), the rules, the schedule (registration, three lectures and a practice session on Friday, the contest from 9:00 to 14:00 on Saturday, results at 15:30), a city transport map and a preliminary entry form.

    Two pages are results and problems: a final classification table of 26 teams and an index of problems 1 to 8. Our copy holds 28 pages, including directory listings of the server; the problem files themselves are not saved. Of the images, the transport map and three small icons are saved; the title image and some navigation images are not.
