  description: |-
    Achievements page of the Faculty of Mathematics, Informatics and Mechanics of the University of Warsaw, in Polish. It lists the faculty's five teams that placed 1st, 2nd, 4th, 7th and 10th, with their members, so the ranking is partial and covers this faculty only.

    A signed report follows: the contest was held on 25 October 2015 at the Institute of Computer Science of the University of Wrocław, with 51 teams of three students. The winning team solved 8 of the 12 problems and the second team 7; places 7 and 10 solved 6 and 5. The report says the first five teams received University of Warsaw scholarships funded by a bank foundation, and that the University's best teams go on to the Central European championship in November. A short list of the University's team names with their places and the university's site navigation complete the page.
