  description: |-
    Solution slides in Polish, a PDF of 42 pages; the cover reads "AMPPZ 2015", "Uniwersytet Wrocławski" (University of Wrocław) and "25 października 2015" (25 October 2015). They cover all twelve problems under their Polish names, starting with D "Studniówka", F "Flamaster" and B "Bogacze" and ending with H "Harcerze" and E "Efektowne wykresy". Each problem opens with a slide giving a short task summary, the problem's author, statistics of the judging (counts of AC, WA, TLE and RE verdicts and their sum) and the team and time of the fastest accepted submission (a dash for E, which has no accepted run), followed by one or more slides on the solution; problem A has two solutions. The last slide, on E, points to a blog where a more detailed discussion of the problems was to appear.
