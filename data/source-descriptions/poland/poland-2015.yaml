  description: |-
    Home page of the AMPPZ 2015 website, in Polish, headed "Akademickie Mistrzostwa Polski w Programowaniu Zespołowym" (Polish Collegiate Team Programming Championship) with "Wrocław, 24-25 X 2015" beneath. It says that the championship is the Polish national form of the ICPC, first held in 1996 in Poznań, sums up the rules (teams of three from Polish universities, five hours, 8 to 12 problems, judged live) and that this year's edition takes place on 24-25 October 2015 at the University of Wrocław, and shows the logos of the sponsors and partners.

    The menu links the site's other pages: venue, accommodation, fees, schedule, team registration, problem statements, presentation of solutions, a photo gallery, the final ranking, prizes, rules and contact, and the 2016 edition. Our copy holds only this home page, not the pages it links to.
