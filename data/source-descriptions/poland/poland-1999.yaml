  title: IV Akademickie Mistrzostwa Polski w Programowaniu Zespołowym
  language:
  - pl
  contest_date: '1999-11-06'
  description: |-
    Website of the fourth Polish collegiate team programming championship, held in Warsaw on 5 and 6 November 1999, in Polish. The introduction page names the Institute of Informatics of the University of Warsaw, the Software Engineering Section of the Polish Academy of Sciences Committee of Informatics and the institute's student science club as organisers, lists the sponsors, and describes the format: a practice day, then a five-hour contest with 6 to 8 problems, teams of up to three students sharing one computer.

    Our copy holds 7 pages and 10 images: introduction, rules, accepted teams (19 institutions), detailed information (venue, accommodation, getting around, programme of the two days), the programming environment (Linux with C, C++ and Pascal compilers and editors) and the results page with 39 teams. The front page links to the 1998 edition and to problem pages of the 1996 and 1997 editions; those lead outside our copy. No problem statements of the 1999 edition are in it.
