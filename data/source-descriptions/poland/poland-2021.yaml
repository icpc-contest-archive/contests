  description: |-
    Single page of the AMPPZ 2021 website, in Polish, whose footer names the Institute of Analytical Computer Science of the Faculty of Mathematics and Computer Science of the Jagiellonian University. It has sections for sponsors, results, about the contest, registration and fees, a preliminary schedule for 6 and 7 November 2021, the venue and a contact address. The results section says 48 teams took part, four of them secondary-school teams outside the competition, and lists the 12 medal teams (4 gold, 4 silver, 4 bronze) with rank, team with its three members, problems solved and time, led by UWr 2 with 10 problems. It links to the full ranking, the problem statements in Polish and an unofficial English version, and to tests and model solutions.

    Only this page is in our copy; the linked ranking and statements are separate documents. An embedded Google document and a map load from other servers and are not part of our copy.
