    Contest page on QOJ.ac listing thirteen problems A to M, from AMPPZ in the times of disease to Median. The page is placed in the Open Cup category, 2021-2022: XXII Open Cup named after E.V. Pankratiev, and says the contest is also known as "XXII Open Cup named after E.V. Pankratiev, Grand Prix of Poland" and as "Moscow International Workshops 2021. Day 1, Div.A+B Contest". The contest is shown as ended, with rules ICPC, a 20-minute penalty and a limit of 1000 submissions per problem; the notice and question lists are empty. Four statement attachments are listed: English, Polish, and two others labelled MW and Open Cup.

