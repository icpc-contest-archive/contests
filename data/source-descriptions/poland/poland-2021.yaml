  description: |-
    Scoreboard of the Satori Testing System, headed AMPPZ 2021 Ranking: 44 teams and thirteen problems labelled A to M. Each row gives the team name with the surnames of its three members in brackets, a score and a total time, then one cell per problem. A cell holds a number and, for a solved problem, a time in brackets, such as 9 (4:57); a number alone has no time, and a dash is an empty cell. In every row the score equals the number of cells with a time. The rank column is empty in every row; the rows are ordered by score and then time, with uwr2 first on score 10 and time 1540. The header row is repeated at the bottom. No institutions, countries or medals are shown.

    The style sheets are in our copy.
