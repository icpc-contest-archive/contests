  description: |-
    Page of the University of Warsaw's Faculty of Mathematics, Informatics and Mechanics (MIMUW) about its teams at the championship. It lists the faculty's teams that placed 1st, 2nd, 5th and 8th, with their members, and a short report: the contest was held in Poznań on 26-27 October 2007, 51 teams of three took part, and the University of Warsaw entered 8 teams. The report adds that the faculty's other teams placed 9th, 12th, 15th and 16th, and that its four best teams would go on to the Central European contest in Prague on 10-11 November 2007. The rest of the page is the faculty's site navigation.
