  contest_date: '2002-10-26'
  problems: 8
  description: |-
    Website of the seventh Polish collegiate team programming championship, held in Wrocław on 25 and 26 October 2002 (practice session on the Friday, contest on the Saturday), in Polish. The organiser is the Institute of Informatics of the University of Wrocław; the front page names the honorary patron, the programme committee and the donors of the prizes. Pages cover registration and fees, programme and hotels, directions, rules, technical details of the programming environment, and the history of the series with links to earlier editions.

    The results page lists 30 teams. The problems page links the 8 contest problems A to H as PDF statements of two pages each, and five problem statements from the internal qualifier held at the University of Wrocław as PostScript files. A list of 19 participating institutions is included, with 30 further pages, one per team, each giving the team name and its three members.

    Our copy has 54 files. The two test data archives linked from the problems page and the logo of the prize donor are not in it.
