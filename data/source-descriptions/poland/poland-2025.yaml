  description: |-
    News item of the Faculty of Mathematics, Informatics and Mechanics of the University of Warsaw, in Polish, on the XXIX Akademickie Mistrzostwa Polski w Programowaniu Zespołowym held on 16 November 2025 in the sports hall of the Faculty of Management of the University of Warsaw. It gives a table of 23 universities with the number of teams each entered (69 teams in total) and a table of the 12 medal-winning teams with place, team name, university, the three members and number of problems solved. The top team, UWr 1 of the University of Wroclaw, solved all 13 problems; the next seven teams solved 10. The text also gives the places of the faculty's other teams, names the organisers (the two University of Warsaw faculties and the Fundacja Rozwoju Informatyki), refers to the full ranking on the contest ranking site, and ends with the author's remarks on organising the contest. The faculty site's menu and footer surround the text.
