  description: |-
    Website of the sixth Polish collegiate team programming championship, held at the Institute of Informatics of the University of Wrocław on Saturday 27 October 2001 after a practice session on the Friday, in Polish. The front page names the organiser, gives the programme committee and the organising committee, and links to the sponsors' sites. Further pages cover registration and fees, rules, technical details (Linux, C, C++ and Pascal compilers, editors), directions to the institute and hotel, the programme of the two days, and the history of the series with links to earlier editions.

    The results page holds the table of the contest and a table of the practice session. The problems page lists problems A to H; our copy holds the eight statements as PostScript files of one or two pages each and a tar archive with input and output files for the eight problems.

    Our copy has 31 files: 9 distinct pages, the PostScript statements, the test-data archive, a style sheet and 11 images. Several of the menu button images on the front page and the map on the directions page are missing, and links to the earlier editions lead outside our copy.
