  description: |-
    Achievements page on a University of Warsaw faculty website, in Polish, for this championship. It lists first and second place for 2001 with the names of the team members, followed by a short report signed by Krzysztof Diks. The report says the championship was held on Saturday at the Institute of Informatics of the University of Wrocław, that 44 teams of three took part, each with one computer and 8 problems to solve in 5 hours.

    It gives the top three: first with 7 problems solved and second with 6 are teams of the University of Warsaw (with members and years of study), third with 4 is a team of the Jagiellonian University; a third Warsaw team is eighth with 3. No other places are given. The rest of the page is the faculty site's menu and footer.
