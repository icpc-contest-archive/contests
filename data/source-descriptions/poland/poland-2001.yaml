  description: |-
    Results page of the championship with two tables. The first, headed Wyniki zawodów (contest results), has 37 rows, one per team, with position, login, full name (an institution with a team number), number solved, total time as hours, minutes and seconds, and the problems solved, labelled A to H, in the order solved, with some letters followed by asterisks. First place solved 7 problems. One row, at position 25, is named Poza konkursem (out of competition) and is ranked in the same sequence as the others, so 36 of the 37 rows are competing teams.

    The second table, headed Wyniki turnieju w dniu próbnym (results of the practice-day tournament), has 48 rows on two problems labelled X and Y: 43 ranked, 5 unranked with no problem solved, and three of the rows named Poza konkursem. The page gives no per-problem times and no legend for the asterisks.
