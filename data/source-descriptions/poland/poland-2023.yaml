- url: http://amppz.edu.pl
  read: '2026-11-16'
  rubric: 1
  copy: poland/poland-2023/website/2026-09-05-wayback-f662664c
  title: XXVII Akademickie Mistrzostwa Polski w Programowaniu Zespołowym
  language:
  - pl
  contest_date: '2023-11-05'
  description: |-
    Website of the Polish collegiate programming contest AMPPZ, in Polish, as it stood for the 2023 edition (3 to 5 November 2023, University of Warsaw, Faculty of Management building, Warsaw). Our copy holds 150 files, of which 22 are pages: 18 HTML pages and 4 PDFs. They include the home page with the registration deadlines, a page about the contest and its history with a list of winners from 1996 to 2022, the schedule of the three days (registration, lectures, practice session, main contest on 5 November, presentation of the jury solutions, closing ceremony), fees, venue, accommodation, support and contact pages, news items with the podium and the winners of 2023, the contest rules as an 8-page PDF and three one-page hotel reservation forms.

    The site also holds pages of other editions: a page about previous editions that describes the 2024 and 2023 editions, a news item on accommodation for AMPPZ 2024, and a live-rankings page in a different layout with 12 problems A to L and team members' names. The 2023 live ranking is saved as a separate page with the table of 58 teams.
