    Index page of the AMPPZ task archive on the Szkopuł judge, in Polish. It lists the tasks of 2011 (13), 2012 (11), 2013 (11) and 2014 (11) under year headings, and below them an unlabelled block of 13 tasks lettered A to M with Polish titles from Analiza Autobusowa (A) to Matematyczne Mistrzostwa (M). The page gives titles and links only, no statements on this page. The year of the A to M block is not printed on the page.
