  description: |-
    News item from the contest site, in Polish, dated 7 November 2023: the podium of the contest. It lists the teams placed 1 to 12, one sentence each with place, medal (four gold, four silver, four bronze), team name, the three members' names, the university and the coaches. First place went to Jagiellonian 1 of the Jagiellonian University in Krakow. Only the top 12 are named; the rest of the field is not listed. The page shows the 2026 site header and footer.
