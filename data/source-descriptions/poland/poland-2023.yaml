    Live ranking page of the main contest (Zawody Główne), in Polish: a scoreboard of 58 teams against 13 problems labelled A to M. Each team row gives rank, team name (mostly university names with a number, such as Jagiellonian 1 and UWr 1), problems solved, total time, and for each problem the result code (OK, WA, TLE or RE), the number of extra attempts and the time, for example OK +1 0:24. The first three teams solved 9 problems; the last nine teams have 0 solved and share rank 50. Team members are not named.
