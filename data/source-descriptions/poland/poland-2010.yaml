- url: http://amppz.wmi.amu.edu.pl/
  read: '2026-11-16'
  rubric: 1
  copy: poland/poland-2010/website/2026-09-05-wayback-6fbbf87f
  title: AMPPZ - Akademickie Mistrzostwa Polski w Programowaniu Zespolowym
  title_en: AMPPZ - Academic Championships of Poland in Team Programming
  language:
  - pl
  contest_date: '2010-11-06'
  description: |-
    Website of the 2010 edition of the Polish academic team programming championship (AMPPZ), in Polish, run by the Faculty of Mathematics and Informatics of Adam Mickiewicz University in Poznan. The front page announces the contest for 5-6 November 2010 on the faculty premises, a practice day before the main contest, and registration for remote teams. The main menu covers results, resources, rules, a tutorial, sponsors and media, organisers, history and links. Further pages cover fees, registration (61 teams registered), dates, venue, photos and statistics; the dates, venue and programme pages still describe the 2009 contest of 23-24 October 2009, the photos page in our copy holds only a fallback text for a floating frame, and the statistics page tabulates ten problems A to J whose names differ from this edition's eleven.

    The results page is a scoreboard of 51 teams with rank, team, problems solved, total time as hours:minutes:seconds, and the solved problems by letter, some prefixed by asterisks or a number and an asterisk. A separate local ranking page lists the same 51 teams with solved count and time only. The teams page lists 52 teams with three members each. The resources page lists problems A to K by title, each with links to a statement PDF and to test data, and a link to a solutions presentation; those PDF and archive files are not in our copy.

    Our copy holds 77 files, 39 of them pages, with images and style sheets, and includes pages of the 2009 edition's site.
