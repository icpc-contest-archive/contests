  description: |-
    Page from a University of Warsaw faculty website, in Polish, with a short report on the XV Akademickie Mistrzostwa Polski w Programowaniu Zespolowym, held on 6 November 2010 in Poznan. It lists the places of four of the faculty's teams (1st, 3rd, 9th and 10th) with their members.

    The report, signed by Krzysztof Diks, says 52 teams from 17 universities took part, eight of them from the faculty. The winning team solved 8 of the 11 problems, the second team from Jagiellonian University solved 7, and the third team solved 6, as did four others. It gives the places of six faculty teams (9, 10, 11, 15, 16 and 23) and mentions the sponsor ATM S.A. The rest of the page is the faculty site's navigation and footer.
