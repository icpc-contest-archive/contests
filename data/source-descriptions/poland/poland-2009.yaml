    Page of the University of Warsaw's Faculty of Mathematics, Informatics and Mechanics (MIMUW) about its teams at the championship. It lists the faculty's teams that placed 1st, 2nd, 3rd, 8th, 9th and 10th, with their members, and a report signed by Krzysztof Diks: the contest was held on Saturday 24 October 2009 at the Faculty of Mathematics and Computer Science of Adam Mickiewicz University in Poznań, 60 teams started, the next three places went to University of Wrocław teams and the seventh to a Jagiellonian University team, and two further faculty teams placed 18th and 24th. The report adds that the teams in places 1, 2, 3, 8 and 9 would represent the University of Warsaw at the Central European contest. The rest of the page is the faculty's site navigation.
