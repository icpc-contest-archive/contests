  contest_date: '2009-10-24'
  description: |-
    Website of the Academic Polish Championship in Team Programming (AMPPZ), organised by the Faculty of Mathematics and Computer Science of Adam Mickiewicz University in Poznań, in Polish. Our copy holds 51 files: 30 pages (several saved under two addresses), one page that is only a database error message, and style sheets and images. It mixes two editions. The pages under the 2009 address are those of the contest of 23-24 October 2009, which the front page calls the 14th: the announcement with its list of dates (61 teams registered and all accepted, remote contest on 24 October), the programme and venue, rules, tutorial, sponsors, organisers, history and links. Its results page carries only the headings "Ranking lokalnych" (local ranking) and "Ranking zdalnych" (remote ranking), without any ranking, and its resources page says that the 2009 materials will be posted soon.

    The pages at the root of the site mostly show the 2010 edition: the front page announces 5-6 November 2010, and the results page (51 teams, the first with 8 problems solved), the team list and the resources page (eleven problems A to K, whose titles differ from the ten problems of 2009) belong to it. The root pages of 2009 are a statistics page with a table for problems A to J, a schedule page, a programme and venue page and a fees and hotel page. The photo page holds only a frame whose content is not in our copy.
