  description: |-
    Polish-language website of the Akademickie Mistrzostwa Polski w Programowaniu Zespołowym (AMPPZ). Its front page is the 2014 edition: 24-26 October 2014 at the University of Warsaw, teams of three, five hours, 8 to 12 problems. The menu links to the schedule, a ranking page labelled "Ostateczny ranking" (final ranking), venue, accommodation, prizes, team lists (a link to the ICPC site), the problem statements, the solution presentation and contact details. Pages for the history of the contest, the rules and the organisers are also there; the rules and organisers pages carry the 2012 edition's heading.

    Our copy holds 71 pages, HTML pages and PDFs, many of them saved under more than one address, with the site's images and style sheets. It also holds pages of the 2011, 2012 and 2013 editions: a results page for 2011 with 55 teams, team-list, registration and payment pages for 2013, a 2013 scoreboard page, and problem statements and solution presentations as PDFs for the editions 2011 to 2014, plus a 2012 problem set in English. The 2014 problem statements are a Polish PDF of 14 pages with 11 problems, and the 2014 solution presentation is a PDF of 32 pages.

    The page behind the "final ranking" link is in our copy but shows an early stage of the contest, not a final order.
