    Problem set as handed out at the contest: a PDF of 14 pages in Polish with 11 problems, from Adwokat to Kapitan, each marked with a three-letter code (ADW, BEN, CEN, DZI, EUK, FIL, GLO, HIT, INS, JAS, KAP). Every problem has a statement with input and output sections and a sample, and states a memory limit of 256 MB on its first page; three problems (BEN, FIL, JAS) take two pages, marked 1/2 and 2/2. Each page is headed with the short name amppz and carries a footer with the dates 24-26 X 2014 and the website address, and headings for the organiser, main sponsor, patron and partners. No test data or solutions.
