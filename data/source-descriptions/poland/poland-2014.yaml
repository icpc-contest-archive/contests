  description: |-
    Achievements page of the Faculty of Mathematics, Informatics and Mechanics of the University of Warsaw, in Polish. It lists the faculty's six teams that placed 1st, 5th, 6th, 7th, 8th and 9th, with their members, so the ranking is partial and covers this faculty only.

    A signed report follows: the contest was held on 26 October 2014 at the Faculty of Management of the University of Warsaw with 53 teams of three students; the winning team solved 9 of the 11 problems; places 2 to 4 are named by university with 8, 7 and 7 problems solved. It says the faculty's listed teams will take part in the Central European championship in November, that the next editions move to Wrocław, and thanks the sponsors. The rest of the page is the university's site navigation.
