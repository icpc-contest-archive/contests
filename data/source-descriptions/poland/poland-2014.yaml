  description: |-
    Solution slides of the jury for the contest, in Polish: a PDF of 32 pages, dated 26 October 2014. Each of the 11 problems opens with a statistics slide giving the author or authors of the problem, the number of submissions out of 857 and the number of the 57 teams that solved it, with a count of accepted, wrong-answer, time-limit and runtime-error submissions. One to three slides per problem then outline the solution; some give its running time. The deck ends on a slide with the word koniec (end).
