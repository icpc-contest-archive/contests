    Scoreboard page of the contest with 59 rows, one per team, under the headings Rank, Name, Score and Time followed by 11 problem columns labelled adw, ben, cen, dzi, euk, fil, glo, hit, ins, jas and kap. Teams are shown by short codes such as UW2, AGH1 or UJ6. The problem cells that are not empty hold a result code such as AC, WA, TL or RE, some followed by a number in brackets; there is one total time per team and no time per problem.

    The page shows an early state of the contest, not a final result: no team has more than 2 problems solved, 37 of the 59 teams have none, and the latest total time is 0:37:57. Teams with no solved problems are still numbered consecutively. The scripts and data files the page loads are not part of our copy; the rows themselves are present in the page.
