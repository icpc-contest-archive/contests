    Problem list of NCNA 2013 on Baekjoon Online Judge, a Korean-language page in the category ICPC Regionals, North America, North Central North America Regional. Eight problems numbered 9939 to 9946 and labelled A to H, each with title, number of users who solved it, number of submissions and acceptance ratio. Problems A, B, C, E and G carry the English titles of the contest (Bowling Score Assistant, Spectrum, One Move from Towers of Hanoi, Light Switches, Centroid of Point Masses); D, F and H are listed with Korean titles. Statements are not on the page and are reached through links to the problems.
