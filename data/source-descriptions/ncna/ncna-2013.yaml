    Eolymp page of problem 6621, "Bowling Score Assistant", in English: the statement with Input, Output, Examples and Note sections, a time limit of 1 second, a memory limit of 64 megabytes, the difficulty mark "Very hard" and the topic tags Brute force and Implementation. The task is to find, from an opponent's final score and one's own rolls through the eighth frame, the lexicographically first sequence of remaining rolls that wins, or to print impossible. A Note section explains how a bowling score is totalled, with five worked examples in frame tables. The page names neither the contest nor a problem letter. In our copy the example input and output show only a "Loading" placeholder; their download links lead to the judge's file server, outside our copy.
