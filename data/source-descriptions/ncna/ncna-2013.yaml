  description: |-
    Website of the ACM North Central North America Regional Programming Contest at the University of Nebraska-Lincoln, in English. Our copy holds 116 saved files, of which 34 addresses are pages (HTML, PDF, text); many are the same page saved under http, https and port-80 addresses. The rest are style sheets, scripts, images, fonts and three zip archives. The home page announces the contest of Saturday, November 9, 2013, sponsored by IBM, with the region's states and provinces, team requirements, registration steps and a late-fee date of October 28, 2013. It links the 2012 problem set, the 2013 problem set, the 2013 judges' data and the 2013 final results. Other pages are the rules, the contest schedule and a regional scoreboard.

    The 2013 problem set is a PDF of 11 pages with eight problems A to H (A Bowling Score Assistant through H Strings with Same Letters), each with statement and sample input and output. The 2013 judges' data is a zip with an input and an output file for each of the eight problems. The link to the 2013 final results leads to another server and is not in our copy.

    The site is not limited to this edition. Our copy also holds pages and files of 2012 (problem set and a scoreboard of official results), 2014 (rules and schedule for November 8, 2014, and a zip holding judge data, judge solutions and the 2014 problem set PDF), 2015 (a zip of twelve problem PDFs), 2018, 2020 and 2021.
