  description: |-
    Problem statement as an HTML page headed "Cheapest" Scores, with no problem number printed. For games whose scoring events may require a preceding event, the program finds, for each potential score, the way to reach it with the fewest event sequences, or reports it impossible. It has input and output sections and a sample with two games. The table of scoring possibilities for the example game is an image that is not in our copy (the page lists two image tags and its directory holds only the page).
