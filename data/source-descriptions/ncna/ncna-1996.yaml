  description: |-
    Unofficial final standings of the 1996-97 ACM International Collegiate Programming Contest North Central Regional, sponsored by Microsoft, as a plain-text table. It lists 57 teams in rank order with the number solved, a total of penalty points and, for each of the seven problems (Prob1 to Prob7), the penalty points of the solved problems; unsolved cells are blank. Forty-four teams solved at least one problem and 13 solved none. The first place, Macalester-A, solved five problems. Two team names carry an annotation in brackets, Iowa State-B(@N'western) and Iowa State-A(@Coe).

    A closing note says the standings come from information collected from satellite sites at no fixed polling frequency, and explains the penalty rule: one point per minute from the 12:30:00 start to the correct submission, plus 20 points for each failed submission before it. Attempt counts are not shown separately.
