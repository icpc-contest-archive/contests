  language:
  - en
  contest_date: '2019-11-09'
  description: |-
    Website of the ACM North Central North America Regional Programming Contest, published by the University of Nebraska-Lincoln, in English. Our copy holds 116 files, 34 of them pages, saved at different dates, so most pages appear in several versions. The 2019 home page announces the contest of Saturday, November 9, 2019, with an overview, team requirements and registration steps, and is marked last updated September 5, 2019. Its menu links problem sets and results only up to 2018.

    Other pages of this edition: the regional rules (headed the 42nd annual contest, Saturday, November 9, 2019, with edits shown in red and crossed-out text), the contest schedule for November 9, 2019 (contest 12:00 noon to 5:00 PM), and a regional scoreboard page that says the contest has not happened yet and points to the 2018 results on Kattis.

    The site also holds other years: home pages for 2012, 2016 and 2017, rules pages for 2014, 2016, 2017 and 2021, a PDF problem set headed ICPC North America Regionals 2020 (34 pages), two older PDFs of problem statements (13 and 11 pages), three zip archives named for 2013, 2014 and 2015 (judge input and output files for problems A to H; a 2014 package with judge data, judge solutions and notes; twelve problem statement PDFs), and a later page, last updated February 27, 2021, saying that the site has moved to a new address. No problem set, data or results of the 2019 contest are in our copy.
