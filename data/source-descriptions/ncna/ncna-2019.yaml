  title: 2019 ICPC North Central USA Regional Contest Solution Outlines
  language:
  - en
  problems: 11
  pages: 44
  description: |-
    Solution outlines as slides: a PDF of 44 pages headed "2019 ICPC North Central USA Regional Contest Solution Outlines", by Greg Hamerly, modified for NCNA by Bryce Sandlund, with the date November 9, 2019 on the title slide. It covers all eleven problems A to K, in the order F, G, J, H, B, D, I, A, C, E, K, from Pulling their weight to Solar Energy. For each problem a description slide restates the task, followed by one or more slides on the solution strategy; problem A gets three approaches (binary search with an angle sweep, ternary search for the center, and Welzl's algorithm), and problem I several slides deriving a formula. Each slide carries the footer "The Judges NCNA 2019 solutions". No test data; the only code is pseudocode for Welzl's algorithm.
