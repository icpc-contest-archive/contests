  contest_date: '2012-11-03'
  description: |-
    Website of the ACM North Central North America Regional Programming Contest, run by the University of Nebraska-Lincoln, in English. Our copy holds 34 pages taken from captures made between 2013 and 2024, so it covers several editions of the contest, not only 2012.

    For the 2012 edition it holds the home page announcing the contest of Saturday, November 3, 2012, sponsored by IBM, with an overview, the states and provinces of the region, team requirements and a link to the 2012 problem set; the problem set itself as a PDF of 13 pages; and the regional scoreboard page with the official results of 2012.

    The rest belongs to other editions: home pages announcing the contests of November 9, 2013, November 8, 2014, October 29, 2016 and October 28, 2017, the rules and schedule pages for 2014, a problem set PDF of 11 pages for the 2013 regional, a 34-page official problem set for 2020 and a page of 2021 rules. Later captures of the scoreboard, rules and schedule pages also describe later contests.
