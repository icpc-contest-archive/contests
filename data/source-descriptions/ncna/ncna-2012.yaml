  description: |-
    Final scoreboard of the 2012 North Central North America Regional Programming Contest on the regional contest website of the University of Nebraska-Lincoln, headed 'Results are now official!'. It lists 239 teams with rank, contest site, team (34 entries carry a school name before the team name), nine problems labelled A to I, and a last column with the number solved and the score. Each problem cell holds two numbers separated by a slash, such as 2/21, with dashes in a problem not attempted. 144 teams solved at least one problem; the other 95 show only a slash in the last column. First place is Inazuma 0b11 of the University of Minnesota - Twin Cities with 7 solved.
