    Solution slides headed "2022 North Central Regional Solutions", by The Judges, with the date Feb 25, 2023 on the title slide: a PDF of 17 pages. It covers ten problems, from Repetitive Song to Bog of Eternal Stench, with one or two slides each; the slides give the problem titles without letters. The slides of each problem restate it and outline the solution, once with a challenge for a faster method, and their footer names the problem's author or authors. No code, submission statistics or test data.
