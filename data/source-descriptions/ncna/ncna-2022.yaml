    Final scoreboard of the 2022 North Central NA Regional Contest on Kattis: 116 teams, ten problems labelled A to J. Each row gives the team name, number solved, total time, and for every problem the number of tries and the minute of the accepted run (tries only for unsolved problems). Nine cells carry the first-to-solve mark. A Site selector lists the participating host sites, but the table shown is the one for all sites. The page states the contest ran from 12:00 to 17:00 CST on 2023-02-25. Two unlabelled columns before the solved count show a logo for the state or province and a logo for the institution of every team (39 different institutions).
