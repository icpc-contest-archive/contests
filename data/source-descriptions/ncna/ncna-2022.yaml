  contest_date: '2023-02-25'
  description: |-
    Region page of the North Central North America (NCNA) region on the ICPC North America website, in English, as it stood in early 2023. The first page, updated 31 January 2023, announces that the NCNA regionals for 2022-2023 are set for Saturday, February 25, 2023, with Zoom links for the region-wide orientation and closing ceremonies; its menu lists registration, rules, schedule, sites, directors, contestants, coaches, organisers and archive, but those pages for this edition are not in our copy.

    Our copy holds 70 pages (150 files with images and feeds) from the whole na.icpc.global host, and most of the pages belong to other North American regions and to the North America Qualifier. The NCNA pages in it are the 2021-2022 contest page (practice day, registration, rules and schedule for the previous edition), the NCNA archive table, which links the 2022-2023 problem set, solution sketches and Kattis standings, the Hall of Champions, which lists the top ten teams of 2022-23 and other years, the 2023-2024 region pages, and pages for coaches, site directors and organisers. Nine PDFs are included, among them one-page bulletins for the Southern California regional and the North America Qualifier, the Qualifier's problems and solution outlines, and the Mid-Central problem set; the links to the 2022-2023 NCNA documents lead outside our copy.
