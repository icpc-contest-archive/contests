  description: |-
    Website of the ACM North Central North America Regional Programming Contest at the University of Nebraska-Lincoln, in English. Our copy holds 116 saved files, of which 34 addresses are pages (HTML, PDF, text); many are the same page saved under http, https and port-80 addresses, and the rest are style sheets, scripts, images, fonts and three zip archives. The home page announces the contest of Saturday, October 31, 2015, sponsored by IBM, with team requirements, registration steps and an October 18, 2015 late-fee date. It links the 2012 problem set, the 2013 problem set, the 2013 judges' data, the 2014 package, the 2015 problem set and the 2015 final results. The link to the 2015 final results leads to another server and is not in our copy.

    The 2015 problem set is a zip of twelve one-page PDFs, one statement per problem, labelled A to L (A Cookie Balancing Act through L The Z Stands for Zorro!), each with input and output description and a sample.

    The site is not limited to this edition. Our copy also holds pages and files of 2012, 2013, 2014, 2016 (rules, schedule and home page for October 29, 2016), 2017, 2018, 2020 and 2021.
