  description: |-
    Official verified results of the North Central Regional Programming Contest, sponsored by IBM, in a plain-text table in rank order: 59 teams, each with the number solved, total penalty points and penalty points for each of six problems (Prob1 to Prob6). Teams are named by school with a letter or colour suffix, such as A and B teams. Problems not solved have an empty cell. First place is U. Nebraska-Lincoln-A with 5 solved and 656 points; five teams solved five problems, and the last 17 teams solved none.

    A note below the table explains the ranking: problems solved first, then penalty points, which are the minutes from the 12:30 PM CST start plus 20 for each failed submission before the correct one. It adds that the standings were collected from the satellite sites. The page contains the heading and table twice in succession.
