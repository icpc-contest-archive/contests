  description: |-
    One-page website of the ACM North Central Regional Programming Contest, sponsored by IBM, for the contest held on Saturday, November 7, 1998. The page announces that official results are available, thanks the volunteers at the ten satellite sites, and gives 13 November 1999 as the date of the next contest. It says the problem set is available in HTML and MS Word formats and that test data, expected output and clarifications will be posted later, and it points to problem-set archives, to the contest director by e-mail and to a page of contest officials. The page is marked as last updated November 14, 1998.

    Our copy holds this page only. The links to the results, the problem set and the archives lead to other addresses and are not part of it.
