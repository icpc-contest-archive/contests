  description: |-
    Announcement page of the regional contest, in English. It announces the ACM North Central North America Regional Programming Contest, sponsored by IBM, for Saturday, November 9, 2002, and describes the region, the distributed format with satellite sites hosted by volunteer schools, the requirements for hosting a site, team composition and registration. It mentions the World Finals of March 22-25, 2003 in Hollywood, California, a link headed Contest Results - Now Official!, and a wiki for discussion of the contest; it is marked as last updated on November 4, 2002.

    Our copy is this single page. The links to the rules, satellite sites, support files and results lead to pages that are not part of it.
