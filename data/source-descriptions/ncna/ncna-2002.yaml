  description: |-
    Scoreboard of the North Central North America region, headed "Official Results" and "Standings - Competition Completed": 155 teams, listed as institution and team name, with number of problems solved, a Total of penalty points, and for each of Prob 1 to Prob 8 the penalty points for that problem (blank when unsolved). Attempt counts are not shown. Teams are in rank order; 123 solved at least one problem, 32 solved none, and the most solved is 7, by two teams. A last row, Number of Solutions, gives the count of solutions per problem.

    A note below the table says the standings were collected from the satellite sites, that rank is by problems solved then by penalty points (one point per minute from the 12:30 CST start, plus 20 per failed submission), and that ties are listed alphabetically. First place is the University of Minnesota, Twin Cities team U Minn - Blue.
