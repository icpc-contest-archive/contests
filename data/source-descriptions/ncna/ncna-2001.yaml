  title: The ACM North Central North America Regional Programming Contest
  language:
  - en
  contest_date: '2001-11-10'
  description: |-
    Announcement page of the regional contest, in English, with the contact details of the regional contest director at the University of Nebraska at Omaha. It announces the regionals of the 26th Annual ACM International Collegiate Programming Contest, sponsored by IBM, for Saturday, November 10, 2001, and describes the region (Minnesota, Wisconsin, Western Ontario, Manitoba, Iowa, North Dakota, South Dakota, Nebraska and Kansas), the multiple contest sites, team composition, scoring over five hours, prizes, advancement to the World Finals in Honolulu in March 2002, and online registration, with teams that register by November 3, 2001 eligible to advance.

    The page says that rules and site locations will be posted later, and is marked as last updated on March 16, 2001. Our copy is this single page with its one image; it holds no rules, site list or results.
