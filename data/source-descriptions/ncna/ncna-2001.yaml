  title: ACM NCNA Unofficial Results
  language:
  - en
  teams: 113
  problems: 9
  times: true
  tries: false
  description: |-
    Scoreboard of the North Central North America region, headed "Official Results" and "Standings - Competition Completed": 113 teams, listed as school and team name, with number of problems solved, a Total of penalty points, and for each of Prob 1 to Prob 9 the penalty points for that problem (blank when unsolved). Attempt counts are not shown. Teams are in rank order; 80 teams solved at least one problem and 33 solved none. A last row, Number of Solutions, gives the count of solutions per problem.

    A note below the table says the standings were collected from the satellite sites, that rank is by problems solved then by penalty points (one point per minute from the 12:30 CST start, plus 20 per failed submission), and that ties are listed alphabetically. First place is Red++ of the University of Wisconsin Madison with 6 problems.
