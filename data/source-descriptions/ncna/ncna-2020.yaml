  description: |-
    Solution slides by the NCNA Judges, titled "NCNA 2020-21 Solution Slides": a PDF of 86 pages holding 28 slides, many of them built up step by step over several pages. After a title slide and a slide listing the problem set developers, it covers all twelve problems A to L, in the order E, K, H, D, A, J, F, C, I, B, L, G, from Curve Speed to Safest Taxi. Each problem gets one to four slides restating the task and outlining the solution, with a line giving the number of submissions and of accepted ones (from 235 submissions and 77 accepted for E to none for G); problem E also shows a short Java solution. The footer of each problem slide names its problem author. The last slide invites questions by email. No date is given.
