  problems: 1
  pages: 1
  description: |-
    Problem 2848, 'Making Book', as a one-page statement PDF with the region line 'North America - North Central - 2003/2004'. Given the first and last page of a section of a book, with page numbers of at most three digits, the task is to count how many times each decimal digit 0 to 9 appears in the page numbers. The statement has input and output formats and a sample with three cases. No problem letter is printed. The statement ends with the line 'North Central 2003-2004'.
