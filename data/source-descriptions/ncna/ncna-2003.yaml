  copy: ncna/ncna-2003/judge-livearchive/20150309-wayback-a76392b3/2844.pdf
  title: 2844 - Making Jumps
  language:
  - en
  problems: 1
  pages: 2
  description: |-
    Problem 2844, 'Making Jumps', as a two-page statement PDF with the region line 'North America - North Central - 2003/2004'. A knight starts in the upper left square of an irregular chessboard of up to 10 rows, whose rows have variable length and offset, and may not rest on a square twice; the task is to count the squares it cannot reach. The statement has a figure of a sample board, input and output formats, and a sample with four cases. No problem letter is printed. The statement ends with the line 'North Central 2003-2004'.
