  title: 2845 - Making Mountains Out Of Molehills
  language:
  - en
  problems: 1
  pages: 3
  description: |-
    Problem 2845, 'Making Mountains Out Of Molehills', as a three-page statement PDF with the region line 'North America - North Central - 2003/2004'. It specifies a simple macro processor with bracketed macro calls, the predefined def macro, $0 to $9 parameter references and angle-bracket quoting, followed by processing rules and limits; the task is to write the processor and print its output for each input case between lines of 79 hyphens. The statement has input and output formats and a sample with seven cases. No problem letter is printed. The statement ends with the line 'North Central 2003-2004'.
