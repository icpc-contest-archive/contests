  description: |-
    Problem 2840, 'Making Waves', as a one-page statement PDF with the region line 'North America - North Central - 2003/2004'. A signal is x = sin(f1 t) sin(f2 t) with two different integer frequencies between 400 and 600 Hz; from N samples (N up to 1000) the task is to recover f1 and f2. The statement has input and output formats and one sample whose input is the 100 sample values for f1 = 400 and f2 = 500. No problem letter is printed. The statement ends with the line 'North Central 2003-2004'.
