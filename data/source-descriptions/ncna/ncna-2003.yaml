  copy: ncna/ncna-2003/judge-livearchive/20150309-wayback-1032ec55/2846.pdf
  title: 2846 - Making Labels
  language:
  - en
  problems: 1
  pages: 2
  description: |-
    Problem 2846, 'Making Labels', as a two-page statement PDF with the region line 'North America - North Central - 2003/2004'. The task is to count in how many different ways a tree with N vertices (N from 1 to 10) can be labeled with the integers 1 to N. The statement works through the cases N = 1 to 5 with figures, and has input and output formats and a sample with four cases. No problem letter is printed. The statement ends with the line 'North Central 2003-2004'.
- url: https://icpcarchive.ecs.baylor.edu/external/28/2847.pdf
  read: '2026-11-23'
