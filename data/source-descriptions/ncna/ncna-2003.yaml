  title: 2843 - Making Money
  language:
  - en
  problems: 1
  pages: 2
  description: |-
    Problem 2843, 'Making Money', as a two-page statement PDF with the region line 'North America - North Central - 2003/2004'. Given a principal, an annual interest rate and the number of compounding intervals per year (1 to 365), with interest below one cent not paid, the task is to print the value of the investment after a year. The statement has input and output formats and a sample with three cases. No problem letter is printed. The statement ends with the line 'North Central 2003-2004'.
