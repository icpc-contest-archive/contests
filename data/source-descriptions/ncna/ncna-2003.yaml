  copy: ncna/ncna-2003/judge-livearchive/20150309-wayback-5cf8e1d8/2847.pdf
  title: 2847 - Making A Budget
  language:
  - en
  problems: 1
  pages: 2
  description: |-
    Problem 2847, 'Making A Budget', as a two-page statement PDF with the region line 'North America - North Central - 2003/2004'. A company needs a given number of temporary workers each month for up to 24 months and pays a hiring fee, a monthly salary and severance pay per worker; the task is to find the minimum total cost. A worked example with three months is given, followed by input and output formats and a sample with two cases (headed 'Expected Output' rather than 'Sample Output'). No problem letter is printed. The statement ends with the line 'North Central 2003-2004'.
