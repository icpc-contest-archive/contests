  title: 2842 - Making Stars
  language:
  - en
  problems: 1
  pages: 2
  description: |-
    Problem 2842, 'Making Stars', as a two-page statement PDF with the region line 'North America - North Central - 2003/2004'. It explains how an n-pointed star is drawn by skipping a fixed number of polygon vertices, and asks for the number of different stars that can be drawn for n between 5 and 500. The statement refers to two figures, and has input and output formats and a sample with three cases. No problem letter is printed. The statement ends with the line 'North Central 2003-2004'.
