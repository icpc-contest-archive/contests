  title: 2841 - Making Pals
  language:
  - en
  problems: 1
  pages: 1
  description: |-
    Problem 2841, 'Making Pals', as a one-page statement PDF with the region line 'North America - North Central - 2003/2004'. The task is to turn a sequence of at most six decimal digits into a palindrome by deleting or adding digits at either end, reporting the smallest cost and the length of the resulting palindrome (the longer one on a tie). The statement has input and output formats and a sample with three cases. No problem letter is printed. The statement ends with the line 'North Central 2003-2004'.
