  problems: 1
  pages: 2
  description: |-
    Problem 3419, 'No Priority', as a two-page statement PDF with the region line 'North America - North Central - 2005/2006'. For an expression whose binary operators (+, -, *, /) all have the same precedence, the task is to print every distinct fully parenthesized form with their count; the statement lists the 14 ways for 1+2-3*4-5 as an example. It has input and output formats and a sample with two cases. No problem letter is printed. The statement ends with the line 'North Central 2005-2006'.
