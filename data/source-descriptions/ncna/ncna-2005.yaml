  description: |-
    Problem 3417, 'The Winning Percentage', as a two-page statement PDF with the region line 'North America - North Central - 2005/2006'. Given a winning percentage truncated to an integer and a number N, the task is to list the N smallest pairs (games won, games played) that give that percentage, in ascending order of games played. The statement has input and output formats, a sample with three cases, and a closing 'Clarifications' section that restates the requirement that each line show a different number of games won. No problem letter is printed. The statement ends with the line 'North Central 2005-2006'.
