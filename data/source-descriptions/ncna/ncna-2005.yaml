  title: 3420 - Coke Bottles
  language:
  - en
  problems: 1
  pages: 3
  description: |-
    Problem 3420, 'Coke Bottles', as a three-page statement PDF with the region line 'North America - North Central - 2005/2006'. A case of bottles in a grid of up to 9 by 9 has one bottle missing, and bottles may jump over a neighbour into an empty space, removing the jumped bottle; the task is to print a sequence of jumps that leaves at most a given number of bottles, or 'No solution'. The statement has figures, input and output formats, and a sample with four cases. No problem letter is printed. The statement ends with the line 'North Central 2005-2006'.
