  title: 3422 - Mapping the Contours
  language:
  - en
  problems: 1
  pages: 3
  description: |-
    Problem 3422, 'Mapping the Contours', as a three-page statement PDF with the region line 'North America - North Central - 2005/2006'. Contours are convex polygons with three or four edges, given by an ID and corner coordinates; the task is to print a hierarchical, column-indented listing of the contour IDs by enclosure. The statement has figures, input and output formats, and a sample with three cases. No problem letter is printed. The statement ends with the line 'North Central 2005-2006'.
