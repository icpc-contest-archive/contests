  title: 3423 - Bookshelf
  language:
  - en
  problems: 1
  pages: 2
  description: |-
    Problem 3423, 'Bookshelf', as a two-page statement PDF with the region line 'North America - North Central - 2005/2006'. The task is to simulate adding books to the left of a shelf of a given width, with books falling off the right end, and removing books, and then to list the books left on the shelf from left to right. Events are A (add), R (remove) and X (end). The statement has input and output formats and a sample with two cases. No problem letter is printed. The statement ends with the line 'North Central 2005-2006'.
