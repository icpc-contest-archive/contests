  title: 3421 - Blackjack Prognostication
  language:
  - en
  problems: 1
  pages: 2
  description: |-
    Problem 3421, 'Blackjack Prognostication', as a two-page statement PDF with the region line 'North America - North Central - 2005/2006'. It sets out the rules of a simplified blackjack game against the house played from a deck of up to 500 cards, with a worked example; the task is to report, for repeated games over the deck, the numbers of wins, losses and ties when the player draws the fewest cards needed for the best outcome. The statement has input and output formats and a sample with three cases. No problem letter is printed. The statement ends with the line 'North Central 2005-2006'.
