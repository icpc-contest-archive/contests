  problems: 1
  pages: 2
  description: |-
    Problem 3425, 'Circles', as a two-page statement PDF with the region line 'North America - North Central - 2005/2006'. Three mutually tangent circles with given radii are enclosed by a triangle tangent to each pair; the task is to find the radius of the circle inscribed in that triangle, printed with three fractional digits. The statement has two figures, input and output formats, and a sample with three cases. No problem letter is printed. The statement ends with the line 'North Central 2005-2006'.
