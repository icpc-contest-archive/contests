  title: 3424 - Minimizing Wait Time
  language:
  - en
  problems: 1
  pages: 2
  description: |-
    Problem 3424, 'Minimizing Wait Time', as a two-page statement PDF with the region line 'North America - North Central - 2005/2006'. Given the lengths of time clients want to use a resource, the task is to find the minimum average waiting time over all schedules, printed with three fractional digits; a three-client example is worked in the text. The statement has input and output formats, a sample with three cases, and a short 'Clarifications' note about 32-bit integers. No problem letter is printed. The statement ends with the line 'North Central 2005-2006'.
