  description: |-
    Home page of the ACM North Central North America Regional Programming Contest site run by the University of Nebraska-Lincoln, as captured by the Internet Archive on 4 February 2017 and last updated 25 November 2016. It announces the contest for Saturday, 29 October 2016, sponsored by IBM, and gives an overview of the region (Minnesota, Wisconsin, Western Ontario, Manitoba, Iowa, North Dakota, South Dakota, Nebraska, Kansas and the Upper Peninsula of Michigan), team eligibility requirements and registration steps, including a late fee for teams registering after 16 October 2016. The menu links to regional sites, rules, the contest schedule and problem sets and results of earlier years, with a link for the 2016 problem set.

    Our copy is this one page with the Internet Archive's header; the linked pages and files are not part of it, and the page holds no results or problems of 2016.
