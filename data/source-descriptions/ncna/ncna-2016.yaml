  description: |-
    Single problem statement, a PDF of 2 pages, headed "7991 Road Messages" and, on page 2, the label "ACM-ICPC Live Archive: 7991 – Road Messages 2/2". A message is printed on a display using a stack with push, pop and print operations, and the task is the minimum number of operations to print each given string and leave the stack empty. The statement works through the example "abba" in a table, and has Input and Output sections and a sample of four strings. No problem letter or contest name is printed.
