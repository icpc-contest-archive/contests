  description: |-
    Single problem statement, a PDF of 1 page, headed "7992 Wedgie". A block of cheese of given size is cut by two knife strokes given by entry and exit coordinates, and the task is to print "touche!" if the cheese is split or "must be hard cheese!" if it is intact. It has Input and Output sections and a sample with two cases followed by a line of the end-of-input form. No problem letter or contest name is printed.
