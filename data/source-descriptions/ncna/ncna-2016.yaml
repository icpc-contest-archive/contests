  description: |-
    Final standings of 225 teams, rendered from the public icpc.global API archive. Each row gives rank, team name, institution, problems solved, time and a place citation (First Place, Second Place and so on; 113 teams, from rank 113 to 225, carry Honorable Mention). First place is the team Chang from the University of Wisconsin-Madison with 9 problems solved and time 1316; the last 16 rows are teams with 0 solved. There is no per-problem detail and no medal column.

    The page is a re-rendering of archived API data made for our archive, not a page of the contest itself.
