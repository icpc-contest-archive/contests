  - en
  problems: 1
  pages: 2
  description: |-
    Single problem statement, a PDF of 2 pages, headed "7986 Delivering Goods" and, on page 2, the label "ACM-ICPC Live Archive: 7986 – Delivering Goods 2/2". On a directed weighted road graph with a warehouse at vertex 0, each client must be reached at the time of a shortest path; the task is the minimum number of trucks needed. It has Input and Output sections, an explanation of the three sample cases, a photo credit, and the sample input and output. No problem letter or contest name is printed.
