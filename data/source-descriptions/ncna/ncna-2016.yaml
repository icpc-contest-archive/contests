  description: |-
    Single problem statement, a PDF of 2 pages, headed "7985 Bumper-to-Bumper Traffic" and, on page 2, the label "ACM-ICPC Live Archive: 7985 – Bumper-to-Bumper Traffic 2/2". Two cars start stopped on a line and alternate between stopped and moving at 1 meter per second at given times; the task is to report whether and when they collide ("bumper tap at time S") or print "safe and sound". It has Input and Output sections, a photo credit, and a sample of four cases. No problem letter or contest name is printed.
