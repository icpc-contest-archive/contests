  title: UNO Computer Science - Technical Reports for 2011
  language:
  - en
  contest_date: '2011-11-12'
  description: |-
    Crawl of the University of Nebraska at Omaha Computer Science department website, seeded from its technical reports page for 2011. It is not a site made for the 2011 contest. Our copy holds 142 pages; most are department pages on degree programs, courses, research and news, with a few PDFs.

    The pages about the contest are a page headed Final Results for the North Central North America Region, dated November 12, 2011: a table of 220 team rows with solved count, total time and ten problem columns, and a discussion wiki (27 addresses) about the ACM North Central North America regional contest, whose pages were last edited between November 2002 and December 2003, with topics such as problem set, carry-overs and T-shirts. The department's links pages also point to the regional contest site, but those links lead outside our copy.

    No announcement, rules, schedule or problem statements for the 2011 contest are in our copy.
