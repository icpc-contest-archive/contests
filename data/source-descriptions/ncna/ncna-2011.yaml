  description: |-
    Final standings of the 2011 North Central NA Regional Contest: 218 teams with rank, team name, institution, number of problems solved, total time, medal, a citation and a site citation. Four teams each hold gold, silver and bronze medals, places are named by ordinal (First Place, Second Place and so on), and the teams that solved nothing share rank 200 with the citation Honorable Mention. The site citation names the champion team of a participating site or university for sixteen teams. First place is The Antisocial Network of the University of Wisconsin-Madison with 10 solved. There is no per-problem detail and no attempt counts.
