  description: |-
    Standings of the 2018 North Central NA Regional Contest, North Central North America, ICPC year 2019: 202 teams with rank, team name, institution, solved, time, medal (Gold Medal, Silver Medal, Bronze Medal, Ranked or Honorable) and a citation column with entries such as First Place or Thirteenth Place. A further column, site citation, is filled for 15 teams. Red (South Dakota School of Mines and Technology) is first with 8 solved in 630 minutes, followed by All Accepted (University of Nebraska - Lincoln) and dauntless (University of Wisconsin-Madison).

    Four teams are marked Gold Medal, four Silver Medal and four Bronze Medal; 170 are marked Ranked, and 20 teams with no solved problems are marked Honorable and carry no rank. Teams come from 61 institutions. No per-problem results.
