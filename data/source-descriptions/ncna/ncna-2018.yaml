  description: |-
    Scoreboard of the 2018 North Central NA Regional Contest on Kattis, marked Contest is over: 209 team rows and ten problems labelled A to J. Each row gives rank, team name, number solved, penalty time and, for every problem, the number of attempts with the solve time in minutes, or the number of attempts followed by a dash when unsolved. 182 teams solved at least one problem and 27 solved none; the zero-solve teams all share rank 183. Red is first with 8 solved and 630 minutes, ahead of All Accepted and dauntless.

    A site filter lists All and 15 sites and is set to All. A legend marks first-to-solve, solved, attempted and pending cells. No mark distinguishes unofficial teams.
