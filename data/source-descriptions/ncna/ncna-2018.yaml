  title: ACM North Central North America Regional | University of Nebraska–Lincoln
  language:
  - en
  contest_date: '2018-11-03'
  description: |-
    Website of the ACM North Central North America Regional Programming Contest, published by the University of Nebraska-Lincoln, in English. Our copy holds 116 files, 34 of them pages, saved at different dates, so most pages appear in several versions. The 2018 home page announces the contest of Saturday, November 3, 2018, with an overview, team requirements, registration steps and fees ($25 per person, $35 after October 9), and a menu of links titled 2018 Problem Set, 2018 Data and Solutions, 2018 Solution Sketches and 2018 Results. It is marked last updated September 27, 2018.

    Other pages of this edition: the regional rules (headed the 41st annual contest, Saturday, November 3, 2018, with edits shown in red and crossed-out text), the contest schedule for November 3, 2018 (check-in at 8:00, contest 11:00 to 16:00, regional results afterwards), and a regional scoreboard page that says the contest has not happened yet and points to the 2017 results on Kattis.

    The site also holds other years: home pages announcing the 2012, 2016 and 2017 contests, rules pages for 2014, 2016, 2017 and 2021, a PDF problem set headed ICPC North America Regionals 2020 (34 pages), two older PDFs of problem statements (13 and 11 pages), and three zip archives named for 2013, 2014 and 2015 (judge input and output files for problems A to H; a 2014 package with judge data, judge solutions and notes; twelve problem statement PDFs). The 2018 problem set, data, sketches and results that the home page links to are not in our copy.
