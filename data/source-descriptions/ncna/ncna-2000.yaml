  description: |-
    Standings of the 2000 ACM North Central North America Programming Contest, sponsored by IBM, as a table of rank, team and citation. Teams are given as institution followed by team name. The first 79 rows carry a rank and a place citation (First Place to Eightieth Place); 15 further rows have a rank, up to 97, and no citation; the last 14 rows have no rank and the citation Honorable Mention. First place is University of Nebraska - Lincoln (La Sandia).

    The table has 108 team rows, but one team, the Nebraska Wesleyan University team NWU Prairie Wolves, appears twice at rank 14, so it lists 107 distinct teams. There are no solved counts, times or per-problem results.
