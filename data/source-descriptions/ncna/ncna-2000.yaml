  description: |-
    Problem statements of the 2000-2001 ACM North Central Regional Programming Contest, a PDF of 11 pages printed from web pages in 2001. The first page lists eight problems: 1 An Inductively-Defined Function, 2 The Mobius Function, 3 Ro and Bot Meet, 4 Minesweeper, 5 Before and After, 6 The Spiral of Primes, 7 Maze Checking and Visualization and 8 Recognizing S Expressions. A note says the statements are unmodified versions of the originals used in the contest, that clarifications are published elsewhere, and that the tiebreaker problem was not used and is not included.

    Each problem has its statement in English with input and output descriptions, a sample input and the expected output. No test data or solutions.
