  description: |-
    Statement of problem 5462, "Coconuts, Revisited", as a single-page PDF. Based on a story about shipwrecked men dividing coconuts with a monkey, it asks, for each given number of coconuts, for the largest number of persons who could have followed the same procedure, or that there is no solution. It has input and output sections and a sample of three numbers with output. No letter label is printed.
