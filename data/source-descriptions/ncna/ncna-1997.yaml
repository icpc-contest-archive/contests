  description: |-
    Official final standings of the 1997-98 ACM International Collegiate Programming Contest North Central Regional, sponsored by IBM, dated November 12, 1997, as a plain-text table. It lists 53 teams in rank order with the number solved, a total of penalty points and, for each of the six problems (Prob1 to Prob6), the penalty points of the solved problems; unsolved cells are blank. Twenty-six teams solved at least one problem and 27 solved none. The first place, SD School M&T-A, solved four problems.

    A closing note says the standings come from information collected from satellite sites at no fixed polling frequency, and explains the penalty rule: one point per minute from the 12:30:00 start to the correct submission, plus 20 points for each failed submission before it. Attempt counts are not shown separately.
