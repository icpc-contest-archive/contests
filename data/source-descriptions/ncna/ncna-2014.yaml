    Problem list of NCNA 2014 on Baekjoon Online Judge, a Korean-language page in the category ACM-ICPC Regionals, North America, North Central North America Regional. Nine problems labelled A to I with problem numbers between 10386 and 10444, each with title, number of users who solved it, number of submissions and acceptance ratio. Eight carry the English titles of the contest (the title of H is written as a TeX formula for a continued fraction); D is listed under a Korean title, and E is marked as a special judge problem. Statements are not on the page and are reached through links to the problems.
