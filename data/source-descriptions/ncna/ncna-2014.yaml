  description: |-
    Website of the ACM North Central North America Regional Programming Contest at the University of Nebraska-Lincoln, in English. Our copy holds 116 saved files, of which 34 addresses are pages (HTML, PDF, text); many are the same page saved under http, https and port-80 addresses, and the rest are style sheets, scripts, images, fonts and three zip archives. The home page announces the contest of Saturday, November 8, 2014, sponsored by IBM, and links the 2012 and 2013 problem sets, the 2013 judges' data, the 2014 package and the 2014 final results. The schedule page gives the timetable for November 8, 2014 and an October 27, 2014 registration date. The link to the 2014 final results leads to another server and is not in our copy.

    The 2014 package is a zip of 40 entries: judge input files and judge answer files for problems A to I, 14 judge solution files, a judging notes document, a text list of the nine problems, a notes file with a run time per problem, and the problem set as a PDF of 14 pages. Its cover names the contest, IBM as sponsor and November 8, 2014, edited with corrections on November 21, 2014.

    The site is not limited to this edition. Our copy also holds pages and files of 2012, 2013, 2015, 2016, 2017, 2018, 2020 and 2021.
