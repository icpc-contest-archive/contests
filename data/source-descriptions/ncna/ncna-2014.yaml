    Final standings of the 2014 North Central NA Regional Contest: 270 teams with rank, team name, institution, problems solved, time and a citation. The first 134 rows carry place citations from First Place; the other 136 are marked Honorable Mention and share ranks from 137 to 222. The most solved is nine, by three teams; the first-place team, Do you even PSPACE? of the University of Wisconsin-Madison, solved nine with a time of 833. No per-problem results and no attempts.
