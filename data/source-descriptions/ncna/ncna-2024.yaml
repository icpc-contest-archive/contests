  title: NCNA Coaches Recognition – ICPC North America North Central Regional
  language:
  - en
  contest_date: '2024-11-09'
  description: |-
    Website of the ICPC North America North Central (NCNA) region as it stood for the 2024-25 season. The home page, headed 2024 - 2025 ICPC NCNA Contest Registration Information, welcomes teams from Minnesota, Wisconsin, Western Ontario, Manitoba, Iowa, North Dakota, South Dakota, Nebraska, Kansas and the UP of Michigan to the 2024 regional contest and gives Saturday, November 09, 2024 as the contest date. It also gives the Kattis addresses of the practice and actual contests, a live scoreboard address, a status checklist, registration instructions and a fee of $100.00 per team.

    Our copy holds 62 files, 9 of them pages: eight web pages and a robots.txt. The web pages are the home page, the coaches recognition page (the starting page of the copy), a list of the 2024-25 sites with their directors, the Hall of Champions, information pages for coaches, contestants and site directors, and the steering committee. The Hall of Champions lists the top ten teams for 2023-24, 2022-23, 2021-22 and 2020-21; the 2024 contest is not in it. The contestants page explains that the contest runs on Kattis as a 5-hour team contest with around a dozen problems.

    The site has no results and no problem statements of the 2024 contest. Style sheets, scripts and images are kept with the pages.
