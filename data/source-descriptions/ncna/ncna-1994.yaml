  description: |-
    Category page of the ICPC Live Archive for Regionals 1994, North America - North Central NA. It lists seven problems, numbered 5439 to 5445, with each title and the archive's counts of total submissions, total users and solving percentages. The titles are the same seven as on the 1994 North Central problem set, from Mapping the Swaps to Interpreting Control Sequences. The page shows no statements; it carries the archive's menu and a login form.
- url: https://icpcarchive.ecs.baylor.edu/external/54/5444.pdf
  read: '2026-11-23'
  rubric: 1
  copy: ncna/ncna-1994/judge-livearchive/20210127-wayback-1ae9b1cd/5444.pdf
  title: 5444 A Node Too Far
  language:
  - en
  problems: 1
  pages: 2
  description: |-
    Statement of problem 5444, "A Node Too Far", as a PDF of 2 pages. For networks of up to 30 nodes and queries giving a start node and a TTL value, the program prints how many nodes cannot be reached. It has input and output sections, an example network described in the text, and a sample of two networks with six queries. No letter label is printed. A running head "ACM-ICPC Live Archive: 5444 – A Node Too Far" with the page number is printed at the top of page 2, not on page 1.
- url: https://icpcarchive.ecs.baylor.edu/external/54/5439.pdf
  read: '2026-11-23'
  rubric: 1
  copy: ncna/ncna-1994/judge-livearchive/20210919-wayback-9e0e007a/5439.pdf
  title: 5439 Mapping the Swaps
  language:
  - en
  problems: 1
  pages: 1
  description: |-
    Statement of problem 5439, "Mapping the Swaps", as a single-page PDF. It defines a swap map of adjacent exchanges that sorts an array and asks for the number of swap maps of minimum size for arrays of up to five integers. It has input and output sections and a sample of four arrays. No letter label is printed.
- url: https://icpcarchive.ecs.baylor.edu/external/54/5440.pdf
  read: '2026-11-23'
  rubric: 1
  copy: ncna/ncna-1994/judge-livearchive/20211024-wayback-929f4691/5440.pdf
  title: 5440 Rational Numbers from Repeating Fractions
  language:
  - en
  problems: 1
  pages: 2
  description: |-
    Statement of problem 5440, "Rational Numbers from Repeating Fractions", as a PDF of 2 pages. It explains how to turn a repeating decimal expansion into a fraction and asks the program to print, for each case, the reduced p/q. It has input and output sections and a sample of four cases. No letter label is printed. A running head "ACM-ICPC Live Archive: 5440 – Rational Numbers from Repeating Fractions" with the page number is printed at the top of page 2, not on page 1.
- url: https://icpcarchive.ecs.baylor.edu/external/54/5441.pdf
  read: '2026-11-23'
  rubric: 1
  copy: ncna/ncna-1994/judge-livearchive/20211026-wayback-637db743/5441.pdf
  title: 5441 Recognizing Good ISBNs
  language:
  - en
  problems: 1
  pages: 2
  description: |-
    Statement of problem 5441, "Recognizing Good ISBNs", as a PDF of 2 pages. It explains the ISBN check-digit rule with a worked example and asks the program to say for each input line whether the candidate ISBN is correct or incorrect. It has input and output sections and a sample of 15 input lines with output. No letter label is printed. A running head "ACM-ICPC Live Archive: 5441 – Recognizing Good ISBNs" with the page number is printed at the top of page 2, not on page 1.
- url: https://icpcarchive.ecs.baylor.edu/external/54/5442.html
  read: '2026-11-23'
  rubric: 1
  copy: ncna/ncna-1994/judge-livearchive/20150309-wayback-6e2c88ae/5442.html
  title: Identifying Concurrent Events
  language:
  - en
  problems: 1
  description: |-
    Problem statement as an HTML page headed "Identifying Concurrent Events", with no problem number printed. For several computations with sequential events and messages sent between them, the program lists the pairs of concurrent events. It has input and output sections, a worked example and a sample with four cases and its output. The mathematical symbols of the text were images that are not in our copy, so the relations between events are blank in the text.
- url: https://icpcarchive.ecs.baylor.edu/external/54/5443.html
  read: '2026-11-23'
  rubric: 1
  copy: ncna/ncna-1994/judge-livearchive/20150309-wayback-e58fd3f4/5443.html
  title: Processing MX Records
  language:
  - en
  problems: 1
  description: |-
    Problem statement as an HTML page headed "Processing MX Records", with no problem number printed. It explains MX records and wildcard records of the Domain Naming System, and asks the program to record N MX records and then handle commands marking machines up or down and requests to show where mail for a machine is redirected. It has a combined "Input and Output" section, notes, and a sample with its output.
- url: https://icpcarchive.ecs.baylor.edu/external/54/5445.pdf
  read: '2026-11-23'
  rubric: 1
  copy: ncna/ncna-1994/judge-livearchive/20211023-wayback-a971320b/5445.pdf
  title: 5445 Interpreting Control Sequences
  language:
  - en
  problems: 1
  pages: 3
  description: |-
    Statement of problem 5445, "Interpreting Control Sequences", as a PDF of 3 pages. The program simulates a 10 x 10 text terminal that interprets control sequences introduced by a circumflex (cursor moves, clear, erase, insert and overwrite modes) and prints the final screen in a box for each test. It has input and output sections and a sample of two tests with their screens. No letter label is printed. A running head "ACM-ICPC Live Archive: 5445 – Interpreting Control Sequences" with the page number is printed at the top of page 2 and of page 3, not on page 1.
