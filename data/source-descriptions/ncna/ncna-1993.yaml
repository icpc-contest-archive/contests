    Problem page on Baekjoon Online Judge, with the site's menus in Korean and the statement in English: problem 6485, "Inventory Maintenance", whose source line reads ICPC > Regionals > North America > North Central North America Regional > NCNA 1993, problem G. The whole statement, with the input and output rules, is in its main section, followed by one sample input with its output; the task is to process lines that add, delete, buy and sell store items and to print inventory reports with total value and profit. The statement refers to "Madam Phoenix (from Problem A)". A box above the statement gives a time limit of 1 second, a memory limit of 128 MB, and 0 submissions, 0 accepted, 0 users who solved it (0.000%). The site's style sheets are not in our copy.
