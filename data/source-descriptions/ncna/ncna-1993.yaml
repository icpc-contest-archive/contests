    Statement of "Evaluating Simple C Expressions" as a PDF of 2 pages, in English, headed with the number 5435. Expressions over the variables a to z (holding the values 1 to 26 at the start) use binary + and - and the prefix and postfix ++ and -- operators, and the task is to evaluate each expression and print the value of the expression and of each variable it used. It has Input, Output, Sample Input and Sample Output. The second page carries the running line "ACM-ICPC Live Archive: 5435" with the title. The PDF prints no contest name, region or problem letter.
