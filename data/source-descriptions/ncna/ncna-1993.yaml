    Problem page on Baekjoon Online Judge, with the site's menus in Korean and the statement in English: problem 6483, "The Finite State Text-Processing Machine", whose source line reads ICPC > Regionals > North America > North Central North America Regional > NCNA 1993, problem E. It holds the full statement with input and output sections and one sample input with its output; the task is to read descriptions of finite state machines whose transitions print output strings, and to run each machine on the input that follows it. A box above the statement gives a time limit of 1 second, a memory limit of 128 MB, and 0 submissions, 0 accepted, 0 users who solved it (0.000%). The statement's figure of a two-state example machine is not in our copy, nor are the site's style sheets.
