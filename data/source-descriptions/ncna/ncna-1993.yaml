    Problem page on Baekjoon Online Judge, with the site's menus in Korean and the statement in English: problem 6484, "PostScript Emulation", whose source line reads ICPC > Regionals > North America > North Central North America Regional > NCNA 1993, problem F. The whole statement, with the input and output rules, is in its main section, followed by one sample input with its output; the task is to rewrite a small PostScript program of moveto, rmoveto, lineto and rlineto commands so that it has the same effect without the rotate, translate and scale commands. A box above the statement gives a time limit of 1 second, a memory limit of 128 MB, and 0 submissions, 0 accepted, 0 users who solved it (0.000%). The site's style sheets are not in our copy.
