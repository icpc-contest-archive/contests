  description: |-
    Index page of a personal archive of programming contest problem sets, marked "Not an official ACM page" and last updated December 19, 1999. It links to the problem sets of the ACM finals for 1991 to 1999 (nine links), of the North Central regional for 1993 to 1997 (five links, one with a pointer to the official page), of the East Central regional for 1992 to 1997 (six links) and of the Western European regional for 1994 and 1995 (three links, one of them to the 1994 practice session), plus a problem index. The text says some sets were copied from official sites, some transcribed from hardcopy, and that spelling and output errors were fixed.

    Our copy is this index page alone; the linked year pages are not part of it. It is a general archive page, not a site of this contest.
