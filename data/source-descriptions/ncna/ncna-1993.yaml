    Statement of "Extrapolation Using a Difference Table" as a PDF of 2 pages, in English, headed with the number 5434. It explains extrapolating a sequence of up to 10 values with a difference table, and the task is to give the (n + k)-th term; a hint says k has no upper limit. It has Input, Output, Sample Input with four cases and Sample Output. The second page carries the running line "ACM-ICPC Live Archive: 5434" with the title. The PDF prints no contest name, region or problem letter.
