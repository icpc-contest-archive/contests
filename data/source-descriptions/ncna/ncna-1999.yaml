    Final standings of the North Central Regional Programming Contest of the 1999-2000 ACM International Collegiate Programming Contest, sponsored by IBM, as a plain-text table in rank order: 80 teams, each with the number solved, total penalty points and penalty points for each of six problems (Prob1 to Prob6). Problems not solved have an empty cell. First place is ISU Cy-Borg (B) with 6 solved and 673 points; four teams solved all six problems and the last nine solved none.

