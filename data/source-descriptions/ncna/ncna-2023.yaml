  title: NCNA Regionals 2023-24 | ICPC NA
  language:
  - en
  contest_date: '2023-11-04'
  description: |-
    Website of the North Central North America (NCNA) region on the ICPC NA site. The page titled NCNA Regionals 2023-24 announces the regional contest for Saturday, November 04, 2023, says that Zoom links will be provided for the region-wide orientation and closing ceremonies, names the Department of Computer Science and Engineering at the University of Minnesota - Twin Cities as local sponsor of the t-shirts, and describes the region (Minnesota, Wisconsin, Western Ontario, Manitoba, Iowa, North Dakota, South Dakota, Nebraska, Kansas and the UP of Michigan).

    Our copy holds 150 files, 60 of them pages. The NCNA pages include a list of the 2023-24 sites with their directors, a steering committee page, pages of information for coaches, contestants and site directors, and a Hall of Champions page whose sections run from 2023-24 back to 2012-13; the top ten teams are listed for 2023-24, 2022-23, 2021-22 and 2020-21 (for 2023-24 it begins with Re:ZERO -Starting From Zero Once Again in ICPC- of the University of Wisconsin-Madison), and the eight earlier sections are headings only. An archive page has a table with one row per year, 2012-13 to 2023-24, and columns Problem Set, Judges Data & Solutions, Solution Sketches, Official Results, Event Photos and Top 10 Teams, with links in most of the cells. The linked files are not in our copy, except the Hall of Champions page behind the Top 10 Teams links.

    Our copy also holds pages of other ICPC NA regions and years, and nine PDF files (Bulletin-1 to Bulletin-6, NAQ-Outlines, NAQ-Problems and a Mid-Central 2022 problem set).
