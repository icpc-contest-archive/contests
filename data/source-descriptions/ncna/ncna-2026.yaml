  contest_date: '2026-11-07'
  pages: 43
  description: |-
    Website of the ICPC North America North Central Regional (NCNA). Its home page covers the 2026-27 contest: registration information, a contest summary naming the four teams advancing to the North America Championship (first place void*box, University of Wisconsin-Madison), the contest date of Saturday, November 7, 2026, the registration deadline of November 3, 2026, and links to the regional rules, eligibility decision tree, site and coach information. A table of archive resources for 2020 to 2026 has columns for the problem set, live stream or judges' solution, solution sketches, official result and top ten teams, with links where they exist; a second table for 2012 to 2019 has columns for problems, solution sketches and official result, and several years in it are empty.

    Our copy holds 43 pages, several of them the same page under two addresses. They include the steering committee page, a hall of fame page, hall of champions pages with top ten teams for 2026-27 and 2023-24, a coaches recognition page, pages for the 2021-22, 2022-23 and 2023-24 regionals, contestant and coach information for 2024-25, instructions for site directors, and pages for the regional's high school programming contest (sites, a contestants list for 2025, coaches, archive). The high school contest's own hall of champions and coaches recognition pages hold only "TBD" and a list of ICPC North America divisions. The site is in English.

    The home page embeds two Google documents and a video that are not part of our copy, and its contest-day schedule says it will be published when confirmed.
