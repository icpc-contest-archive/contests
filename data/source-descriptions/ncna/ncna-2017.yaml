  contest_date: '2017-10-28'
  description: |-
    Website of the ACM North Central North America Regional Programming Contest at the University of Nebraska-Lincoln, in English. Our copy holds 116 saved files, of which 34 addresses are pages (HTML, PDF, text); many are the same page saved under http, https and port-80 addresses, and the rest are style sheets, scripts, images, fonts and three zip archives. The home page and the contest schedule announce the contest of Saturday, October 28, 2017, under the line "Under New Sponsorship, TBA"; the home page has team requirements and registration steps, and the schedule has an October 15, 2017 date at which early registration ends and the timetable of the contest day. The rules page states a five-hour contest. The home page links the problem sets and data of earlier years, none for 2017.

    The site is not limited to this edition. Our copy also holds pages and files of 2012, 2013, 2014 (a zip with judge data, judge solutions and the problem set), 2015 (a zip of twelve problem PDFs), 2016 (rules, schedule and home page for October 29, 2016), 2018 (rules, schedule and a regional scoreboard page that links to the 2017 results on Kattis), 2020 and 2021.
