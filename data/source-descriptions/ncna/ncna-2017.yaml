    Final scoreboard of the 2017 North Central NA Regional Contest as shown by Kattis: 207 teams against ten problems A to J. Each team row gives rank, team name, a country flag, an institution logo, problems solved and total time; each problem cell gives the number of attempts and the minute of the solve, or the attempts and a dash when unsolved. Eight problem cells carry a first-solve mark. The first place goes to SDSMT - Red with eight solved in 962 minutes. Ranks run from 1 to 138; the 70 teams with no solved problem share rank 138. The site filter lists 14 sites besides All teams; the copy shows all teams. The page states a contest length of five hours starting on 2017-10-28.
