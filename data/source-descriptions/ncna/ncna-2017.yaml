    Official problem set of the 2017 ACM ICPC North Central North America Regional Contest, October 28, 2017: a PDF of 24 pages in English. The cover reads Official Problem Set and Do not open until contest begins; page 3 lists problems A to J (A Stoichiometry, B Pokemon Go Go, C Urban Design, D Smooth Array, E Is-A? Has-A? Who Knowz-A?, F Atlantis, G Sheba's Amoebas, H Zebras and Ocelots, I Racing Around the Alphabet, J Lost Map). Each problem has its own page or pages with the statement, input and output description and one to three sample inputs and outputs. Pages 2, 4, 20 and 22 are marked as intentionally blank. No test data or solutions.
