  description: |-
    Standings of The 2011 ACM-ICPC Asia Dalian Regional Contest: 140 teams with rank, team name, institution, problems solved, time and citation. The citation column gives ordinal places (First Place, Second Place and so on, shared by tied teams), and 39 teams carry Honorable Mention; the last two, with no problem solved, share rank 101. Epic of Shanghai Jiao Tong University is first with 9 problems solved, ahead of DivineRapier of Tsinghua University.

    Team and institution names are in English. The page has fewer rows than the on-site ranking of the organisers, which lists 155 teams. There are no per-problem columns and no attempt counts.
