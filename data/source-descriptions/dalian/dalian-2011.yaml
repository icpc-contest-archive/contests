  contest_date: '2011-09-25'
  description: |-
    Website of the 36th ACM International Collegiate Programming Contest, Asia Dalian Regional (the 2011 Dalian contest), in Chinese, run from Dalian University of Technology. Our copy holds 37 files, 36 of them pages; it has no images or style sheets. It is the news and notice pages of the site: the schedule (online round on 3 September, registration on 23 September, the warm-up on 24 September, the on-site contest on 25 September), the contest environment (Ubuntu 10.10, GCC, G++ and Java, judged with PC2 9.1.2), the quota and advancement rules, a notice on registering official teams, a note on hotels and contact details, tips for participants and download and news sections.

    Three result documents are inside: the results of the online round (schools with team rank and school rank), the final list of schools with their numbers of tourist and official teams for the on-site contest, and the final ranking of the on-site contest, which is a separate source of its own. A few of the 36 pages are utility pages of the site (login, registration, password recovery, comments, online users) with no contest content.
