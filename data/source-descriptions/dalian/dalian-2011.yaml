  description: |-
    Final standings of the on-site contest, published on the organisers' website on 27 September 2011 under the heading 现场赛最终排名 (final ranking of the on-site contest): 155 teams with rank, team number, school, team name, problems solved and time. Shanghai Jiao Tong University is first with 9 problems solved. Ties share a rank, and the last three teams share rank 153 with no problem solved. Some team names start with an asterisk, which the page does not explain. There are no per-problem columns.

    The page is the site's article page, with its menus, news list and login form around the table; below the table a row headed Submitted/1st Yes/Total Yes holds two groups of counts. Our copy has no images or style sheets.
