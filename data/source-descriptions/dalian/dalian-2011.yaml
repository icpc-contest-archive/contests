  description: |-
    Scoreboard of the 2011 Dalian regional on-site contest in a ranklist page headed ICPC 2011 大连赛区现场赛 排行榜 (Dalian regional on-site contest ranking list): 155 teams, ten problems A to J. Each row gives a school number, the school, the rank, the team name with its team number, problems solved and time, then one cell per problem with the number of attempts and, for a solved problem, the time in minutes (for example 1/127). The column heads of A to J also carry counts for the whole field. The first two places are Shanghai Jiao Tong University and Tsinghua University, with 9 problems each. A note on the page states the medals as 14 gold, 28 silver and 42 bronze, and the page was last updated on 26 September 2011, the day after the 09:00 start.

    On 14 rows an asterisk replaces the school number; they are ranked in the same table as the others. Links on the page lead to the boards of other 2011 and 2012 contests, to photos and to the problems; none of those pages are part of our copy.
