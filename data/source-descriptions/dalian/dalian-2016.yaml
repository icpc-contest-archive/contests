    Scoreboard of the 2016 ICPC Dalian regional on-site contest in a ranklist page headed ICPC 2016 大连赛区现场赛 排行榜 (Dalian regional on-site contest ranking list): 219 teams, eleven problems A to K. Each row gives a school number, the school, the rank, the team name with a seat code, problems solved and time, then one cell per problem with the number of attempts and, for a solved problem, the time in minutes (for example 1/66). The column heads A to K carry counts for the whole field, and a legend row names first-to-solve, solved, attempted and pending-judgement marks. Beijing Normal University is first with 11 problems solved, ahead of Beihang University. A note gives the medals as estimated at 10, 20 and 30 percent, that is 24 gold, 44 silver and 66 bronze, and the page shows the start time as 2016-10-16 09:00.

