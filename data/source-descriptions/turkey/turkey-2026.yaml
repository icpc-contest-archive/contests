  description: |-
    Website of the Turkish Programming Contest 2026, organised by the inzva community and run on the algoleague platform, in English. The main page announces a two-round contest for teams of three undergraduates in Turkey: a Qualification Round on 26 September 2026 in Ankara and Istanbul, then a three-day Final Round on 9 to 11 October at Beykoz Kundura in Istanbul, with the contest itself on 11 October. It gives the objectives, registration steps and the application period (1 August to 6 September), schedule, eligibility, contest rules, prizes (the top three teams of the Final Round go to SEERC 2026), venue and participant selection.

    Our copy holds two pages: the main page and a page of frequently asked questions on cost, problems per round, language, and applications. It holds no results of this contest and no problems.
