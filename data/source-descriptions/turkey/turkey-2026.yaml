  description: |-
    Report by inzva on the Turkish Programming Contest 2026, in English. It tells of 76 team applications from 20 universities, a Qualification Round on 26 September in which 60 teams took part (36 in Istanbul, 24 in Ankara) and a Final Round on 11 October with 20 teams from 10 universities, at Beykoz Kundura. The qualification round had 10 problems and the final 11, A to K.

    It gives a table of the top three teams with university, members, problems solved and penalty (the first two solved six problems, the third five) and names seven teams going to SEERC 2026. A second table lists submissions per problem in the Final Round: 265 in total, 81 accepted. The page also covers the sponsors, the contributors who prepared the 21 problems, and the three-day programme. A link leads to the full Final Round leaderboard on another site.
