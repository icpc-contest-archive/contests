  description: |-
    Report by inzva on the Turkish Programming Contest 2019, held at Beykoz Kundura in Istanbul, written in English. It tells that 54 teams from 14 universities, 152 students in all, took part in the five-hour contest, that the teams solved 11 original problems, and that the top ten teams go on to the Southeastern Europe Regional Contest in Bucharest. It names the top ten teams in order with their universities, led by Trie Hard of Bogazici University; the rest of the field is not listed.

    The page also covers the partnership with ICPC and Middle East Technical University, the Scientific Committee of 13 academics and a volunteer team of 30, and carries photographs. It has a link to a fact sheet.
