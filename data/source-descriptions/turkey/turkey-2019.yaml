  description: |-
    Website page of the Turkish Programming Contest 2019, organised by inzva with Middle East Technical University as partner and algotester.com in collaboration, written in English. It announces the contest as a team competition under the auspices of ICPC at Beykoz Kundura in Istanbul, with the top ten teams going on to the Southeastern Europe Regional Contest in Bucharest. The single page gives the objectives, scientific committee and judge team, registration (closed), prize, rules (teams of two or three students, a coach per team, a limit of 56 teams), a three-day schedule from 13 to 15 September 2019 and the venue.

    Our copy holds this one page. A link to a Turkish version and the FAQ lead to pages that are not in our copy, and the page carries no results or problems.
