  description: |-
    Standings as a two-page PDF with the columns Rank, Name (the institution, often with its country, and in most rows a team name), Solved and Time: 66 teams. Twenty-six teams carry a rank from 1 to 17, with ties sharing a rank, and the other 40 are listed as HM (honorable mention) down to teams with no problem solved. The Chinese University of Hong Kong team ManiAC is first with 10 solved. There is no per-problem detail. A last line headed Submitted/1st Yes/Total Yes has no figures after it.
