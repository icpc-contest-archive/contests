  title: ACM ICPC Asia Regional 2010 - Kuala Lumpur
  language:
  - en
  description: |-
    Website of the 2010 Kuala Lumpur regional contest, organised by the International Islamic University Malaysia and sponsored by IBM, in English. The home page announces 8th - 9th December 2010, a registration fee of 150 USD and that registration is closed, and its menu leads to registration, schedule, hardware and software configuration, workshop programme, transportation, accommodation and contact pages. Our copy holds 13 pages, but most of the menu targets are not among them. Of the 2010 material it has the home page, the contact page and a one-page PDF on the mode of payment.

    The rest of our copy is the archive section for the 2008 contest on the same site: five photo gallery pages, the 2008 ranklist as a scoreboard of 58 teams, and a PDF problem set of 21 pages with 11 problems A to K. No 2010 results or problems are in it.
