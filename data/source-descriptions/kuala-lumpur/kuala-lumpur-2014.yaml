  title: ACM ICPC Asia Kuala Lumpur Regional Contest 2014
  language:
  - en
  contest_date: '2014-11-01'
  description: |-
    Website of the 2014 Kuala Lumpur regional contest, run by the Kulliyyah of ICT of the International Islamic University Malaysia, in English. Our copy holds 14 pages. The home page gives the dates (31 October and 1 November 2014), venue, registration fees and period, and its menus lead to the event programme, rules, contest system configuration (PC2 9.2.4 on Linux), payment, registration, accommodation, transportation and a campus map. A second home page lists scores, problem sets and related resources: the final scoreboard, the problem set, the contest report and the opening and closing ceremony.

    Four PDFs are in our copy: the problem set of 27 pages, a 10-page slide set with the contest analysis, a 7-page contest report by the regional contest director, and a 27-page set of opening-ceremony slides introducing the participating teams by university. The report states 30 foreign and 24 local teams and gives the results from rank 25 up to the champion, with the prizes.

    The links to the final scoreboard (on another server), a winners PDF, a data set archive, a problem set with analysis and the ceremony videos lead to files that are not part of our copy.
