  title: ACM-ICPC – Regional Asia Kuala Lumpur Contest 2014 Analysis
  language:
  - en
  problems: 12
  pages: 10
  description: |-
    Slide set of 10 pages titled Analysis, in English, made with PowerPoint. It lists the twelve problems A to L with their contributors and institutions and a difficulty level for each problem, from Very-Easy to Hard, followed by judges' advice to contestants. The next five slides are statistics: how many teams solved 0 to 12 problems, attempts and accepted runs per problem before the freeze and at the end, the first accepted run of the contest and the first accepted run on each problem with team and university. The last slide is a closing thank-you.

    The slides do not explain how to solve any problem.
