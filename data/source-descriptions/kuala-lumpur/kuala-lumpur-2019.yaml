    Final standings of the 2019 ICPC Asia Kuala Lumpur Regional Contest: 33 teams with rank, team, institution, number of problems solved and total time. The columns Medal, Citation and Site citation mark gold, silver and bronze medals for the first three places, ordinal citations from First Place to Sixteenth Place, and Honorable Mention for the remaining teams from 17th to 33rd; the first place carries the site citation Contest Champion. First is 3body3 of the National University of Singapore with ten problems solved and time 1411. No per-problem detail.
