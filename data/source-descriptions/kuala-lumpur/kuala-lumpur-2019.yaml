    Problem set as a PDF of 16 pages in English, running header "ICPC Asia Kuala Lumpur Regional Contest 2019", with ten problems A to J: Rocket Simulator, Boring Problem, Clash of Clans, Polynomial Extrapolation, Flooding, Minimum and Maximum Base, Ahmad's Plantation, Psyco Pass, Activist Meeting and A Thread of Gold Around My Mansion. Each problem has a statement with input and output format and at least one sample input and output, and states that time and memory limits are as shown in the DOMjudge system. No test data or solutions.
