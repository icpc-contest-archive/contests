  description: |-
    Final scoreboard produced by DOMjudge, headed "ICPC Kuala Lumpur Regional 2019 final standings": 34 teams (33 ranked 1 to 33 and a last team, with no rank and no problems solved), ten problems labelled A to J. Each team row gives rank, team name with institution, number solved and total penalty time, and for each problem the solve time in minutes and the number of tries, coloured as solved first, solved, tried incorrect, tried pending or untried. A summary row at the bottom gives accepted runs, rejected runs, pending runs and first-solve time per problem. The team in first place is 3body3 of the National University of Singapore with ten problems solved.

    The problem letters link to a problem set PDF and the teams link to anchors within the page.
