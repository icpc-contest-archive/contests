  title: ICPC Asia Kuala Lumpur Regional Contest 2019
  language:
  - en
  description: |-
    Website of the 2019 ICPC Asia Kuala Lumpur Regional Contest, made by the Kulliyyah of ICT of the International Islamic University Malaysia, in English. The front page gives the dates (8 to 10 November 2019), the venue, the registration fees and the registration period. Further pages cover how to register, mode of payment, the program schedule for the three days (registration and mock test, the contest day, a field trip), system configuration, contest rules, accommodation and transport, a campus map and contact details. It links the final scoreboard and the problem set PDF, and a list of registered teams that is hosted elsewhere.

    Our copy holds 55 files, of which 18 are pages or PDFs: eleven HTML files (the front page is saved twice) and seven PDF files (the problem set is saved twice; also contest rules, technical slides, general tentative schedule, field trip schedule, hotel information), plus style sheets, scripts and images. The registered-teams link and the other external links lead outside the copy.
