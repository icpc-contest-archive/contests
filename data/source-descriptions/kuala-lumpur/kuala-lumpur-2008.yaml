  description: |-
    Scoreboard of the Kuala Lumpur site, produced by CSUS PC^2 8.7: 58 teams, eleven problems A to K. Each row gives rank, institution and team name, number solved, penalty time, and for each problem the number of attempts and the time of the accepted run ("--" when unsolved), plus total attempts and solved. A last row totals submissions, the time of the first yes and total yes per problem. Three teams solved 7 problems, the first of them from Shanghai Jiaotong University. Seven teams with no solved problem share rank 52. The footer carries a last-updated stamp of 16 December 2008.
