  language:
  - en
  contest_date: '2008-12-16'
  description: |-
    Website of the Kuala Lumpur site of the 2008 regional contest, hosted by the International Islamic University Malaysia, in English. Our copy holds 27 pages, of which 17 are different: the others are the same page under a second address. They cover the event information (15 and 16 December 2008, Cultural Activity Center of the university), registration and fees, prizes (marked "To be determined later"), the contest environment (Fedora 9, PC2 as judging software), the tentative programme for both days, special guests, a trip, accommodation, transportation, a visa note, contacts, a campus map page and sponsors. The contest rules page only points to the ACM-ICPC website, and the page headed Direction to IIUM has a heading and no text.

    The Contest Result page holds only a "Click here" link to a frame page, which in turn shows the scoreboard; that scoreboard is also in our copy. The Teams Enrolled menu entry leads to another server and is not part of the copy.
