    Statement of one problem as a PDF of 2 pages, titled "Smooth Visualization" with the letter A and "Input: Standard Input / Output: Standard Output"; the running line reads "(Kuala Lumpur Site) Asia Regional 2011" with the page number and "Problem A". Digits 1 to 7 are drawn as columns of '+' on a canvas of '*', and the task is to add the minimum number of columns so that adjacent columns differ in height by at most one. Input and output format and a sample input and output table are included.
