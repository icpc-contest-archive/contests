  title: ACM-ICPC Asia Regional Kuala Lumpur 2011
  language:
  - en
  contest_date: '2011-11-13'
  description: |-
    Website of the 2011 Kuala Lumpur regional contest, run by the International Islamic University Malaysia, in English. Our copy holds 43 pages. The home page gives 12th - 13th November 2011, registration from 1 October to 3 November and a fee of 200 USD; the menu leads to how to register, payment information, the two-day schedule, system configuration, event photos, accommodation, transportation, directions and a campus map. It also links the problem set, a regional closure report and a Result page.

    The report is a three-page PDF by the regional contest director: 60 teams, 29 foreign and 31 Malaysian, the judges, the day's events, IBM as main sponsor and the three top teams (National Taiwan University, Fudan University, Institut Teknologi Bandung). The problem set is a PDF of 18 pages with nine problems A to I. The Result page is a frame page whose scoreboard is not in our copy.

    The copy also holds the site of the national al-Khawarizmi 2011 contest of 29 October 2011, with its rules, programme, committee and a results scoreboard, and older material: the 2010 contest site, the 2010 standings and problem set as PDFs, and the 2008 problem set.
