  description: |-
    Pages of the Northern Eurasia Contests archive site, entered through its 2004 page (NEERC 2004). That page lists the finals resources (standings, problems in PostScript and PDF, a jury archive, a history file for replaying the contest, all runs, four picture galleries) and the regional contests of the year, each with its final standings, among them Belarus and Baltics; the Northwestern Russia entry also lists problem statements, TeX sources, tests and jury solutions. Our copy holds the Western Subregion standings of 2004 (heading 'ACM ICPC 2004-2005 NEERC, Western Subregion').

    The copy has 150 files, all pages: 60 addresses for 2004 and 59 for 2005 with the finals and regional standings of both years and the problem statements as PDF, and one year page for each other year from 1996 to 2023. Many pages are held under both http and https addresses.
