  description: |-
    Website of the Faculty of Applied Mathematics and Informatics (FPMI) of Belarusian State University, in Russian. Our copy holds 150 saved files, 134 of them pages, from several years of the site: current news, structure and departments, admissions, history, student life and contacts. Some pages mention the ACM ICPC programming contests: a press-headline list with items about the university's teams at the world championship, a welcome page for the quarter-final of the Western region held at the faculty (October 2003), and a photo gallery page with an album titled as a quarter-final of the Western region.

    No page in our copy gives the schedule, teams or results of the 2010 Western Subregional Contest. The press-headline list has undated headlines, placed between items dated 07.09.2010 and 09.11.2010, that the quarter-final of the student world programming championship is under way in Minsk and that six teams of the university reached the semi-final of the Western region competitions.
