    Standings headed 'ACM ICPC 2010-2011, NEERC, Western Subregional Contest': a table of 57 teams and 13 problems labelled A to M. Per team it gives the name (for example BSU #2, Kaunas TU 1, Tartu 1, Tallinn TU, Kant SU of Russia 1), a mark for each problem (a plus sign, a plus or minus sign followed by a number, or a dot), the number solved, the time and the rank. The page states the contest clock as 5:00:00 of 5:00:00, status over. First place is BSU #2 with 10 problems solved; rank 52 is shared by the last six teams, which solved none.

    No per-problem times are shown, only the marks with numbers.
