  description: |-
    Pages of the Northern Eurasia Contests archive site, entered through its 2003 page (NEERC 2003). That page lists the finals resources (standings, problems in PostScript and PDF, jury archive, picture gallery) and the regional contests of the year, each with a link to its final standings, among them Belarus and Baltics. Our copy holds the Western Subregion standings of 2003 (heading 'ACM ICPC 2003-2004 NEERC, Western Subregion') and the standings of the finals and of the other regional contests of 2003.

    The copy has 150 files, 149 of them pages: the year pages of the archive from 1996 onward, and in depth the years 2003 and 2004, whose pages include the 2004 Western Subregion standings, regional standings for both years, and problem statements as PDF or PostScript. Many pages are held under both http and https addresses.
