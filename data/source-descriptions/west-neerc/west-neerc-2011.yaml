  title: Northern Eurasia Contests
  language:
  - en
  description: |-
    Website of the Northern Eurasia Contests (NEERC archive), in English: the archive of the NEERC finals and their regional contests. Our copy holds 150 saved files, 147 of them pages (several addresses give the same page). Most are for 2011 and 2012: the archive page of each year, which lists that year's final materials (standings, problems, tests, analysis) and the regional contests with links to their final standings, standings pages of the regionals, a few problem PDFs, and review and analysis PDFs. The other years from 1996 to 2018 are present as one archive page each.

    For this edition the copy holds the 2011 archive page, where the Western Subregional appears under the heading Belarus and Baltics with a link to its final standings, and the standings page itself. It also holds the NEERC 2011 final's standings, a problems PDF of 16 pages and an analysis presentation of 13 pages, other regionals of 2011 and 2012, and the 2012 edition of the Western standings.
