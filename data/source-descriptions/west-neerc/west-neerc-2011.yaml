  description: |-
    Scoreboard of the Western Subregional Contest 2011 with the contest clock at 5:00:00 of 5:00:00 and status over: 64 team rows and ten problems A to J. Each row gives the rank, the team name with the names of its members, a result for each problem, the number solved and the total time. A problem cell shows a plus or minus sign, an optional number, and for solved problems a time such as 200:32; a dot marks an empty cell. A "Show time" checkbox hides or shows the times. Eleven teams carry an asterisk before the name, among them the second-ranked Gomel Team and several teams with SCH_ names; they are ranked among the others and the page does not explain the mark. First place is Belarusian SU #1 with 8 problems.

    Below the table, five summary rows give per problem the total runs, accepted, rejected, first accepted time and last accepted time.
