  description: |-
    Dashboard of the contest on Codeforces Gym, marked Finished, listing ten problems A to J, from The Baguette Master to One-Armed Bandit, with their input and output file names, time limits (1 second for seven problems, 2 seconds for E, F and G), memory limits (256 MB, and 64 MB for F, G and I) and the number of solvers of each. Links to the problem pages and to an English statements PDF are on the page but are not part of our copy, so no statements are in it. The page also holds the standard Codeforces forms for virtual participation, questions and announcements.
