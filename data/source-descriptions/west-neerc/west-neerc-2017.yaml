  description: |-
    Pages of the Northern Eurasia Contests archive site, in English. The archive page for NEERC 2017 lists the final's standings, problems and other resources, and for each of the 16 regional contests, among them Belarus and Baltics, a link to its final standings; the page for 2018 says that no information is available for Belarus and Baltics and for most other regional contests. Our copy holds 150 saved files, which are 72 distinct addresses saved under several forms of the address: archive pages for each year from 1996 to 2025, the final standings of the NEERC 2017 and 2018 finals, and standings pages of 17 regional contests for 2017 and 9 for 2018, among them the Western Subregional standings of 2017.

    It also holds PDFs: the 14-page problem statements and the 14-page problems summary of the NEERC 2017 final (St. Petersburg, Barnaul, Tbilisi and Almaty, December 3, 2017), the 15-page statements, an 11-page problems summary and a 101-page problems review of the 2018 final, a zip archive of runs of the 2018 final, and statements and analyses of the Northern Subregional Contest for both years. The file saved under a Kazakhstan address of 2017 is the Northern Subregional statement of 4 November 2017. The only page specific to the Western Subregional is its 2017 standings page. Some of the saved copies of the 2017 Northern Subregional analysis PDF stop at 1 MiB and cannot be opened.
