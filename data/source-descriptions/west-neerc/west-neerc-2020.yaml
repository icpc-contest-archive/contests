  description: |-
    Final scoreboard of the Belarus and Baltics Regional Contest 2020 (XXIII NERC Western regional contest) of 14 November 2020 as shown by iRunner 2, in Russian: 76 rows against twelve problems A to L, the clock at 5:00:00 of 5:00:00. Each problem heading carries two numbers separated by a slash. Each row gives the team name and, for most teams, three members; a result for every problem (a plus with the time of the accepted run, a number of failed attempts, a minus with a number for unsolved attempts, a dot for none), the number solved and the penalty. BelarusianSU 1 is first with 10 problems solved and a penalty of 1182. Teams without a solved problem share rank 67.

    Five rows carry an asterisk before the name; the second row is one of them. The page also states the last accepted and last submitted runs and links to an auto-refreshing view and a wide version.
