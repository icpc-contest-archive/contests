  description: |-
    Website of the Faculty of Applied Mathematics and Computer Science (FPMI) of Belarusian State University, in Russian. Our copy holds 134 pages, mostly several captures of the home page and of older and newer versions of the faculty site: news, structure and departments, admissions, education, history, contacts and a hostel page. The newest home page capture has a news feed whose newest entry is dated 6 February 2023.

    An archive page of press coverage lists headlines about the faculty, among them reports that teams of the university reached the semifinal of the Western region of the student world programming championship. Older news pages (2008 and 2012) and a short page on the quarterfinal contest of the Western region (Belarus, Latvia, Lithuania, Estonia) of 2003 mention the regional contests. None of the pages we hold is about the 2020 Belarus and Baltics Regional Contest.
