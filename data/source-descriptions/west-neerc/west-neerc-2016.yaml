  description: |-
    Homepage and general pages of the Faculty of Applied Mathematics and Informatics (FPMI) of the Belarusian State University, in Russian, with news items, the faculty's history, its departments, the dean's office, information for applicants and graduates, the hostel, contacts, conferences and announcements. The pages come from several periods: old static pages of the faculty site, news lists from 2012, home pages with news from 2016 to 2023, and a page for the CSIST 2025 congress.

    Our copy holds 150 saved files, 134 of them pages. Several pages mention the student programming world championship: the faculty history pages, news lists with headlines of press articles about the quarter-final of the Western region held at the university, and a short old page for the quarter-final of the Western region (Belarus, Latvia, Lithuania, Estonia), organised by the faculty, whose links point to 2003. None of these pages names NEERC or the Western Subregional, and none is a results or problems page of the 2016 contest.
