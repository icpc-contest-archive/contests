    Final scoreboard of the XXI NEERC Western Subregional Contest of 1 November 2018 as shown by iRunner 2, in Russian: 47 teams against twelve problems A to L, with the contest clock at 5:00:00 of 5:00:00. Each problem heading carries two numbers separated by a slash. Each team row gives the team name with the surnames of its members, a mark for every problem (a plus with the time of the accepted run, a number of failed attempts, a minus with a number for unsolved attempts, a dot for none), the number of problems solved and the penalty.

    Two teams are marked with an asterisk before the name; one of them is at the top of the table with 11 problems solved and a penalty of 1154. The page also states the last accepted and last submitted runs and has links to an auto-refreshing and a wide version.
