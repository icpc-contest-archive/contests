  description: |-
    Website of the ICPC competitions held at the Belarusian State University in Minsk, in Russian, with menu entries for contest history, an English version, the archive of ACM contests and contacts. The front page reports the qualifying round of 26 October 2025, held remotely with 219 teams from 15 Belarusian universities and 2 teams from the Immanuel Kant Baltic Federal University, and the final stage held at BSU on 15 and 16 November 2025. It states that 16 teams from Belarus advanced to the semifinal in Saint Petersburg on 15 to 17 December, gives the number of diplomas awarded (5 of the first degree, 7 of the second, 11 of the third) and names the best team, with eight problems solved.

    The page links to the results of the qualifying round and of the final stage, the list of teams for the semifinal, the problems of 2024, photo galleries and 2025 materials: schedule, team selection, rules, programme and quotas. Our copy holds only this front page, with its images and style sheets; the pages and PDF files it links to are not in our copy.
