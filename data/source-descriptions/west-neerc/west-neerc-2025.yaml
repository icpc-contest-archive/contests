  description: |-
    Final scoreboard from iRunner 2, in Russian: 59 teams against twelve problems A to L. Each cell gives the result for the team and problem with the number of failed attempts and the time of the accepted run, and each team row ends with the number solved and the penalty. The header of each problem column shows two totals for that problem, for example 54 / 143 for A. The page is dated 16 November 2025 and states that the contest is over, 5:00:00 of 5:00:00.

    Two of the teams (ranks 7 and 10) have a star and the label Guest team at the start of the team name; they are listed among the others. The first place has eight problems solved and the last five teams have none.
