  description: |-
    Pages of the Northern Eurasia Contests archive site, in English. Our copy holds 150 saved pages under 69 distinct addresses (some saved in several versions): the site home and archive index, one page for each year from 1996 to 2025, and, for 2007 and 2008, the standings pages of the final and of the regional contests. The 2007 year page lists a standings link for each regional contest except Azerbaijan, which is marked "No information is available"; the Western subregion appears under the heading "Belarus and Baltics" and links to a page headed "ACM ICPC 2007-2008 NEERC, Western Subregional Contest".

    Besides the standings, the 2007 pages include problem statement PDFs: the final (14 pages, dated November 28, 2007), the Northern subregional contest (11 pages, October 28, 2007) and the Georgia and Uzbekistan subregional contests (11 pages, October 28, 2007), plus a 14-page problem PDF of the 2008 final (November 26, 2008). The 2007 year page lists tests and jury solutions, runs and a contest replay archive as downloads; those archives are not in our copy. The site is shared by the final and all regional contests, so most of it concerns other contests than the Western subregion.
