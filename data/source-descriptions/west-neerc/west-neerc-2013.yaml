  title: Northern Eurasia Contests
  language:
  - en
  description: |-
    Website of the Northern Eurasia Contests (NEERC archive), in English: the archive of the NEERC finals and their regional contests. Our copy holds 150 saved files, 147 of them pages (several addresses give the same page). Most are for 2013 and 2014: the archive page of each year, which lists that year's final materials and the regional contests with links to their final standings, standings pages of the regionals, a few problem and statement PDFs, and review PDFs. The other years from 1996 to 2012 are present as one archive page each.

    For this edition the copy holds the 2013 archive page, where the Western Subregional appears under the heading Belarus and Baltics with a link to its final standings, and the standings page itself. It also holds the NEERC 2013 final's standings, a problems PDF of 14 pages and a review PDF of 13 pages, other regionals of 2013, and the 2014 edition of the Western standings.
