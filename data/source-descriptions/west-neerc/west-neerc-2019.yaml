  pages: 150
  description: |-
    Archive site of the Northern Eurasia Contests (NERC), in English. Our copy holds 150 pages, many of them the same page saved under both http and https addresses. The 2019 page of the archive lists the NERC 2019 finals (standings, problems, jury archive, analysis) and the regional contests; its entry for Belarus and Baltics reads "No information is available", although the standings page for that contest is in our copy.

    Inside are the 2019 final standings and geographic standings, the 2019 statement and tutorial PDFs, the 2019 standings pages of sixteen regional contests including Belarus and Baltics, and the Northwestern Russia regional's standings, statements and tutorials and its qualifier standings. The 2020 pages include the finals and online standings, offline and online statement and tutorial PDFs, and standings of eight regional contests. Archive index pages for every year from 1996 to 2025 are present.

    Only the standings page belongs to the Belarus and Baltics contest; the other pages are about other contests and years.
