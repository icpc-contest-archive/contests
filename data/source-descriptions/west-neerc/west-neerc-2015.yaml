  title: Northern Eurasia Contests
  language:
  - en
  description: |-
    Pages of the Northern Eurasia Contests archive site, in English. The archive page for NEERC 2015 lists the final's standings, problems and other resources, and for each of the 16 regional contests, among them Belarus and Baltics, a link to its final standings. Our copy holds 150 saved files, which are 61 distinct addresses saved under several forms of the address: archive pages for the years 1996 to 2008, 2015 and 2016, the final standings of the NEERC 2015 and 2016 finals, and standings pages of 17 regional contests for each of 2015 and 2016, among them the Western Subregional standings of 2015 and of 2016.

    It also holds PDFs: the 14-page problem statements of the NEERC 2015 final (St. Petersburg, Barnaul, Tbilisi and Tashkent, December 6, 2015), a 40-page problems review of that final, the statements and a review of the 2016 final, and statements and analyses of the Northern Subregional Contest for both years. The only pages specific to the Western Subregional are its standings pages for 2015 and 2016. Archive pages for 2009 to 2014 and from 2017 on are not in our copy, and some of the saved copies of the 2015 Northern Subregional analysis PDF stop at 1 MiB and cannot be opened.
