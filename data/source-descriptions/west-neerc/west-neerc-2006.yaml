  description: |-
    Pages of the Northern Eurasia Contests archive site, in English. Our copy holds 150 saved pages under 69 distinct addresses (some saved in several versions): the site home and archive index, one page for each year from 1996 to 2025, and, for 2006 and 2007, the standings pages of the final and of the regional contests. The 2006 year page lists a standings link for each regional contest except Azerbaijan, which is marked "No information is available"; the Western subregion appears under the heading "Belarus and Baltics" and links to a page headed "ACM ICPC 2006-2007 NEERC, Western Subregion".

    Besides the standings, our copy holds five problem PDFs: for 2006 the final (15 pages, problems A to K, dated November 29, 2006) and the Northern subregional contest (15 pages, problems A to K, dated November 5, 2006); for 2007 the final (14 pages, problems A to L), the Northern subregional contest (11 pages, problems A to K) and a booklet for the Georgia and Uzbekistan subregional contests (11 pages, problems A to K). The 2006 year page lists tests and jury solutions as downloads; those archives are not in our copy. The site is shared by the final and all regional contests, so most of it concerns other contests than the Western subregion.
