  description: |-
    Pages of the Northern Eurasia Contests archive site, in English. Our copy holds 150 saved pages under 70 distinct addresses (some saved in several versions): the site home and archive index, one page for each year from 1996 to 2023, and, for 2009 and 2010, the standings pages of the final and of the regional contests. The 2009 year page lists a standings link for each regional contest; the Western subregion appears under the heading "Belarus and Baltics" and links to a standings page.

    Besides the standings, the 2009 and 2010 pages include problem statement PDFs of the finals (13 pages each), the Northern subregional problems (14 pages in 2009, 13 in 2010), a 15-page review of the 2010 problems, the slides of the 2009 Northern subregional analysis, and for 2010 the Northern subregional analysis as a 10-page PDF in Russian and an 80-page presentation. The year pages list tests, jury archives, runs and PostScript versions of the statements as downloads; those files are not in our copy. The site is shared by the final and all regional contests, so most of it concerns other contests than the Western subregion.
