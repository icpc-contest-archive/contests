  description: |-
    Scoreboard of the Western Subregional 2012 with the contest clock at 5:00:00 of 5:00:00 and status over: 57 teams and twelve problems A to L. Each row gives the rank, the team name with the names of its members, a result for each problem, the number solved and the total time. A problem cell shows a plus or minus sign, an optional number, and for solved problems a time such as 294:01; a dot marks an empty cell. A "Show time" checkbox hides or shows the times. Ranks run to 53, shared by the last five teams. First place is Belarusian SU 1 with 10 problems.

    Below the table, five summary rows give per problem the total runs, accepted, rejected, first accepted time and last accepted time.
