    Dashboard of the contest on Codeforces Gym, marked Finished, listing twelve problems A to L, from Article to Sum, with their input and output file names, time limits (2 seconds for A, D and K, 1 second for the other nine), memory limits (256 MB, and 64 MB for A, E, G, I and J) and the number of solvers of each. Links to the problem pages and to an English statements PDF are on the page but are not part of our copy, so no statements are in it. The page also holds the standard Codeforces forms for virtual participation, questions and announcements.
