  description: |-
    Standings of the Western Subregional Contest 2012: 57 teams with rank, team, institution, number solved, time, medal, citation and site citation. Medals go to the first twelve places, four each of gold, silver and bronze; ranks 13 to 28 carry a place citation (Thirteenth Place and so on), and the other 29 teams are marked Honorable Mention, the last five of them sharing rank 53. Rank 1 is Belarusian SU 1 of Belarusian State University with 10 problems, marked as champion of the Western Subregional Contest in the site citation column. There is no per-problem detail.
