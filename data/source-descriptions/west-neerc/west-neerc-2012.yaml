  title: Northern Eurasia Contests
  language:
  - en
  description: |-
    Website of the Northern Eurasia Contests (NEERC archive), in English: the archive of the NEERC finals and their regional contests. Our copy holds 150 saved files, 144 of them pages (several addresses give the same page). Most are for 2012 and 2013: the archive page of each year, which lists that year's final materials (standings, problems, tests) and the regional contests with links to their final standings, standings pages of the regionals, a few problem PDFs, and review PDFs. The other years from 1996 to 2015 are present as one archive page each.

    For this edition the copy holds the 2012 archive page, where the Western Subregional appears under the heading Belarus and Baltics with a link to its final standings, and the standings page itself. It also holds the NEERC 2012 final's standings, a problems PDF of 14 pages and a review PDF of 13 pages, and the other regionals of 2012.
