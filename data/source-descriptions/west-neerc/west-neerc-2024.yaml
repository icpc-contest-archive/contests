    Final scoreboard from iRunner 2, in Russian: 78 teams against twelve problems A to L. Each cell gives the result for the team and problem with the number of failed attempts and the time of the accepted run, and each team row ends with the number solved and the penalty. The header of each problem column shows two totals for that problem, for example 21 / 175 for A. The page is dated 16 November 2024 and states that the contest is over, 5:00:00 of 5:00:00. Team names are followed by the members' names.

    The first place has ten problems solved; the last teams have one.
