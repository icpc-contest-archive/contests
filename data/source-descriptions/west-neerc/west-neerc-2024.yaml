  description: |-
    Website of the ICPC competitions held at the Belarusian State University in Minsk, in Russian, with menu entries for contest history, an English version, the archive of ACM contests and contacts. The front page reports that the final stage of the 2024 team programming championship among Belarusian higher education institutions, the quarterfinal of the ICPC world championship, was held at BSU on 15 and 16 November, with 78 teams from 16 universities. It names the best team, with ten problems solved, and the teams that advanced to the semifinal in Saint Petersburg on 13 to 15 December, and it carries a photo of the first-diploma teams.

    The page links to the results of the qualifying contests and of the final stage, the list of teams going to the semifinal, the 2024 problems, a photo gallery and 2024 materials: schedule, team selection, rules, programme and quotas. Our copy holds only this front page, with its images and style sheets; the pages and PDF files it links to are not in our copy.
