  description: |-
    Page of the Western Subregion of the 2000 Northern Eurasia contest, held in Minsk and hosted by the Belarusian State University, inside a copy of the Northern Eurasia Contests archive site. The page names the republics of the subregion (Belarus, Estonia, Latvia, Lithuania) and gives a results table of 27 teams with rank, team and institution, the outcome on each of seven problems labelled cha, dip, spo, tex, tra, tri and wor (a plus or minus, with a number of attempts where one is shown, or a dot when untried), the number solved and the total time. First place is BSUT #1 - Belarusian State University of Transport with 5 solved.

    Our copy of the site holds 136 pages: the Northern Eurasia archive menu and year pages (1996 to 2018; the menu also links 2019 and 2020, which are not held), the 2000 and 2001 pages of the finals and of the other regional contests with standings, problem and test-data archives, a 2000 picture gallery, and 54 pages of the Belarusian State University's acm.bsu.by site (the Insight Runner testing system, its wiki and school olympiad pages), which are not about this contest.
