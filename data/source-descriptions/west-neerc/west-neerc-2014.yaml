    Final scoreboard of the Western Subregional 2014 (status over, 5:00:00 of 5:00:00): 59 rows, each with rank, team name with its three members, one column for each of the 13 problems A to M, the number solved and the penalty time. Problem cells show the result with the number of rejected attempts and the time of acceptance, for example "+1 27:04", a minus sign with the count for unsolved attempts, and a dot for no attempt. One row, "Baltic old", is marked with an asterisk and hors concours; the other 58 rows are teams, led by BelarusianSU 2 with 11 problems solved. Summary rows at the foot give total runs, accepted, rejected, first accept and last accept for each problem.
