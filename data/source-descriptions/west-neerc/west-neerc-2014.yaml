  title: Northern Eurasia Contests
  language:
  - en
  description: |-
    Pages of the Northern Eurasia Contests archive site, in English. The archive page for NEERC 2014 lists the final's standings, problems and other resources, and for each of the 16 regional contests, among them Belarus and Baltics, a link to its final standings. Our copy holds 150 saved files, which are 62 distinct addresses saved under several forms of the address: archive pages for the years 1996 to 2009, 2014 and 2015, the final standings of the NEERC 2014 and 2015 finals, and standings pages of 17 regional contests for each of 2014 and 2015, among them the Western Subregional standings of 2014 and of 2015.

    It also holds PDFs: the 15-page problem statements of the NEERC 2014 final (St. Petersburg, Barnaul, Tbilisi and Tashkent, December 7, 2014), a 21-page problems review of that final, the 14-page statements of the 2015 final, a 40-page problems review of the 2015 final, and statements and analyses of the Northern Subregional Contest for both years. The only pages specific to the Western Subregional are its standings pages for 2014 and 2015. Archive pages for 2010 to 2013 and from 2016 on are not in our copy, and some of the saved copies of the Northern Subregional analysis PDFs stop at 1 MiB.
