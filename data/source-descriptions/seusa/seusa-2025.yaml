  description: |-
    Division 1 scoreboard on Kattis, shown in the Southeast USA teams view: 51 teams, each with number solved, total time and, for each of the 13 problems A to M, the number of attempts and, where solved, the minute of the accepted run. The team in first place is UCF Triangulate with 12 solved. The page marks the contest as over, gives a five-hour contest running from 19:30 to 00:30 CET and has a legend for first to solve, solved, attempted and pending judgement. Two teams at the bottom share rank 50 with no problems solved.

    The page also carries filters by conference and school for the Mid-Atlantic USA, South Central USA and Southeast USA regions; our copy shows the Southeast USA view only.
