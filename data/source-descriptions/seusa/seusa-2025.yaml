  description: |-
    Division 1 problem set: a PDF of 30 pages with 13 problems, A (Orchard Fence) to M (Much Room for Mushrooms), in English. It opens with a cover page reading Division 1 and a blank page, and ends with a back cover page. Four more pages in between are blank apart from the line 'This page is intentionally left blank.' Each problem gives its time limit and memory limit, a statement with input and output format and sample input and output; some have figures, and problem B is interactive. Pages with problem text carry a footer naming the contest, the division and the problem. The document holds statements only, without test data or solutions.
