  title: ACM ICPC Contests
  language:
  - en
  description: |-
    Website of the UCF Programming Team (University of Central Florida), in English; our copy holds 150 pages, some of them as both an http and an https capture of the same address. The ICPC record page gives, for each season from 1982-1983 onward, the places of UCF's own teams at the regional and at the finals, for example 1996-1997: regionals 1st, 3rd, 7th and 9th, finals 17th (out of 50). It does not list other teams or give an order of the teams in any regional.

    Other pages give the team's records in NAIPC, IEEE SoutheastCon, Mercer and other contests, and the lists of past and developmental team members, as well as pages on the first team and on continued success. Of the single-member pages those lists link to, our copy has 119, all of past members; none of the developmental members' pages is in it.
