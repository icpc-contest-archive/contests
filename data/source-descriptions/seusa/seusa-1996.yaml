  language:
  - en
  problems: 1
  pages: 3
  description: |-
    Statement of "Don’t Get Hives From This One!" as a PDF of 3 pages, in English, headed with the number 5254. a maze of hexagonal cells in a rectangle of at most 30 by 30 is walked with the right-hand rule; the task is to print the sequence of rooms visited followed by SOLUTION FOUND or NO SOLUTION. It has Input, Output, and a Sample Input that begins on page 2 and runs onto page 3 with the Sample Output. The PDF prints no contest name, region, date or problem letter.
