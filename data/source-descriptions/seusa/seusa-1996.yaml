  title: 5257 Approximate Matches
  language:
  - en
  problems: 1
  pages: 2
  description: |-
    Statement of "Approximate Matches" as a PDF of 2 pages, in English, headed with the number 5257. Given k, a text S of up to 50 characters and a pattern P of up to 20, the task is to list the substrings of S that match P with at most k mismatches. It has Input, Output, worked examples of mismatch counts, Sample Input with two data sets and Sample Output. The PDF prints no contest name, region, date or problem letter.
- url: https://icpcarchive.ecs.baylor.edu/external/52/5258.html
  read: '2026-11-23'
