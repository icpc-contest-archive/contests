  copy: seusa/seusa-1996/judge-livearchive/20150309-wayback-b5118572/5259.html
  title: Welfare Reform
  language:
  - en
  problems: 1
  description: |-
    Statement of "Welfare Reform" as a short HTML page in English. Childcare parent fees are looked up in a chart of fee levels against income thresholds for families of one to ten children; the task is to print the age and parent fee for each child of each family record. The chart appears as text, followed by Input, Output, Sample Input and Sample Output. The page has one inline image, a GIF file that is not in our copy. The page prints no problem number, contest name, region or date.
- url: https://icpcarchive.ecs.baylor.edu/external/52/5261.pdf
  read: '2026-11-23'
