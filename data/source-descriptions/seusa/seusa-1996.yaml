  copy: seusa/seusa-1996/judge-livearchive/20150309-wayback-ebf8e796/5258.html
  title: Constitutional Computing
  language:
  - en
  problems: 1
  description: |-
    Statement of "Constitutional Computing" as a short HTML page in English. The task compares four methods of apportioning seats in a legislature among states (Hamilton, Jefferson, Adams and Webster) and prints which methods favour each state; it has up to 50 states and a worked example with five states and 30 seats. The text has Input, Output, Sample Input and Sample Output sections. Four inline images in the example section are referenced as GIF files that are not in our copy. The page prints no problem number, contest name, region or date.
- url: https://icpcarchive.ecs.baylor.edu/external/52/5259.html
  read: '2026-11-23'
