  title: 5261 Halting Factor Replacement Systems
  language:
  - en
  problems: 1
  pages: 2
  description: |-
    Statement of "Halting Factor Replacement Systems" as a PDF of 2 pages, in English, headed with the number 5261. A factor replacement system rewrites the prime factors of an integer by ordered rules (up to 15 rules), and the task is to print the final value for each input integer. It has Input, Output, Sample Input with two systems and Sample Output. The PDF prints no contest name, region, date or problem letter.
- url: https://icpcarchive.ecs.baylor.edu/external/52/5262.html
  read: '2026-11-23'
