  description: |-
    Category page of the ICPC Live Archive online judge for Regionals 1996, North America - Southeast USA. It lists 9 problems numbered 5254 to 5262 with their titles, from Don't Get Hives From This One! to Indexing Web Pages. For each it gives total submissions with solving percentage and total users with solving percentage; two problems show no submissions.

    Only the list is in our copy; the statements are on separate pages. The menu and login form of the archive surround the table.
