  description: |-
    Statement of "Cops and Robbers" as a PDF of 2 pages, in English, headed with the number 5255. Cops, robbers and citizens are points in a plane; the task is to decide for each citizen whether it is safe (inside a triangle of three cops), robbed (inside a triangle of three robbers) or neither, with c, r and o each at most 200. It has Input, Output, a warning about boundary cases, Sample Input with two data sets and Sample Output. The PDF prints no contest name, region, date or problem letter.
