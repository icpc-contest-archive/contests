  title: 5256 18,000 Seconds Remaining
  language:
  - en
  problems: 1
  pages: 2
  description: |-
    Statement of "18,000 Seconds Remaining" as a PDF of 2 pages, in English, headed with the number 5256. A file transfer is described by the bytes sent in each second, and the task is to print an estimate of the seconds remaining every five seconds, based on the previous five seconds (or that the transfer is stalled), followed by the total time. It has Input, Output, Sample Input with three data sets and Sample Output. The PDF prints no contest name, region, date or problem letter.
