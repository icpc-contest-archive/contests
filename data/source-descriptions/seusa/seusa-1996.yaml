    Index page titled 'Contest Problem Set', noting that all problem files are in PostScript format. It links ten problem files by name (Cutting, Divide, Factor, Hives, Mismatch, Robbers, Seconds, Title, Web Page, Welfare) and an errata page for the problem set.

    Our copy holds only this index page; the PostScript statements and the errata page are not in it. The problems have no letters.
