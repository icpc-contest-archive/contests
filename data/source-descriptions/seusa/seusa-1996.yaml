  copy: seusa/seusa-1996/judge-livearchive/20150309-wayback-db41789a/5262.html
  title: Indexing Web Pages
  language:
  - en
  problems: 1
  description: |-
    Statement of "Indexing Web Pages" as a short HTML page in English. The task is to read index.htm and the files it links to by HREF, and those they link to in turn, then for each word in a word list print the files that contain it, or that it is in none. The text covers assumptions, Input, Output, and a Sample Input made of two HTML files and a word list with its Sample Output. The page prints no problem number, contest name, region or date.
