  pages: 2
  description: |-
    Statement of "Cutting Up" as a PDF of 2 pages, in English, headed with the number 5260. The task is to give the fewest cuts needed to cut a piece of fabric of up to 20 by 20 into 1 by 1 squares when a given number of layers (up to 200) can be cut at a time. It has Input, Output, Sample Input with six data lines and Sample Output. The PDF prints no contest name, region, date or problem letter.
