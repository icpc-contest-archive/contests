  description: |-
    Final scoreboard produced by PC^2 (version 8.7 is named on the page) for the 2006 ACM Southeastern Programming Contest: 67 official teams with rank, name, problems solved, total time, and for each of the ten problems A to J the number of attempts and the time of the first correct solution, plus total attempts and solved. A bottom row gives, per problem, submissions, time of first yes and total yes. The page states that it was last updated on Saturday 28 October 2006. Teams are listed by a single name column, for example UCF Kernel Panic in first place with nine problems solved.

    A separate block lists three alternate pickup teams, marked as not counting in the official final standings.
