  description: |-
    Problem set of 21 pages in English. The cover names the ACM Southeast Regional Intercollegiate Programming Contest of Saturday 28 October 2006, Georgia Southern University and the University of South Alabama, and lists ten problems with a colour for each: Digital Reversal Addition Method (DRAM), Divisibility, Folding Colored Cubes, Lawn Mowing, Logical Mazes, Pebbles, The Pushy Blockhead, Tracking, Trick or Treat! and Whoop-de-doo. The problems are not lettered. Each has a statement with the name of its input file, a description of input and output, and a sample. No test data or solutions.
