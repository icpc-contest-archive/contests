  description: |-
    Contest page for the 2006 ACM Southeastern Programming Contest, held on Saturday 28 October 2006 jointly at Georgia Southern University and the University of South Alabama. The front page links the contest results, a page of contest pictures, the problems, the registration page, the agenda, hotels and directions for both sites, and a programming environment page (Windows, Visual Studio 2005 and Eclipse, JBuilder for Java, one box of printed material per team).

    Our copy holds 60 saved files, 25 of them pages. The contest content in it is the results page (a scoreboard of 67 official teams), the problem set as a PDF of 21 pages with ten problems, the agenda for the two sites (Friday registration, Saturday welcome, practice, contest, banquet and awards), and a directory listing of 19 photo file names. Three of the four hotel and directions links point to image files. The copy also holds the host's class pages (course syllabi, notes, software and address list), which have nothing to do with the contest.
