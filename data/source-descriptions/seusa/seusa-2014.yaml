  language:
  - en
  contest_date: '2014-11-15'
  description: |-
    Website of the 2014 ACM Southeast USA Programming Contest, in English, with Florida Tech, Georgia Tech and the University of West Florida as the three contest sites. Our copy holds two pages. The front page names the organisers by role and gives the contest day, Saturday 15 November 2014, with a practice round from 11am to noon and the contest from 1:30pm to 6:30pm EST. It also covers the sites, the registration fee of $35 per person if paid by 18 October 2014 with a form and credit card payment, the languages allowed, DOMjudge as the contest software, and how standings are posted during and after the contest.

    The second page describes the contest environment: a GNU/Linux image booted from a USB flash drive, compiler versions, development software, printing of listings, and the data kept on the flash drives after the contest.

    The pages linked for the schedule, the registration form and the two final standings PDFs are not in our copy, and neither are the page images. The link to the live scoreboard leads to another server.
