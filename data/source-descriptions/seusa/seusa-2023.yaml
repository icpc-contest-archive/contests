  title: 2023 ACM Southeast USA Programming Contest
  language:
  - en
  contest_date: '2024-02-24'
  description: |-
    Single-page website of the Southeast USA regional contest, in English. It announces two divisions with a different problem set for each, with winners recognised per division and per site, and says teams of a school in both divisions are shown only in Division 1 on the scoreboard. It names the contest date as Saturday, 24 February 2024 and lists five sites, with a directions and map link for each: Samford University in Birmingham, Alabama; Florida State University in Tallahassee, Florida; College of Charleston in Charleston, South Carolina; Florida International University in Miami, Florida; and University of West Florida in Pensacola, Florida. It also gives the registration fee, the programming languages (C, C++, Java, Python 3 and Kotlin) and Kattis as the contest control system. The scoreboard line says only to check the scoreboards once the contest begins, without links.

    Our copy holds this one page and a script file; the directions and map files are not part of it.
