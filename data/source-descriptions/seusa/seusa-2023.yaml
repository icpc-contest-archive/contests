  description: |-
    Division 1 problem set as a PDF of 26 pages, in English, with no cover page: it opens directly with Problem A. Pages 6, 22 and 26 are marked as intentionally left blank; every other page has a footer reading 2022 ICPC Southeast USA Regional Division 1 with the problem letter and name (the footer says 2022 although this is the 2023 contest). It has thirteen problems, A to M, from A ABC String to M Champernowne Verification. Each problem has a statement with a time limit and an input and output format; twelve have sample inputs and outputs, and problem J is interactive with a sample interaction. No test data or solutions.
