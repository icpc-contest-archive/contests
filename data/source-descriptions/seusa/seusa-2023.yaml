    Standings of both divisions of the regional contest: 89 teams in one table with rank, team, institution, number solved, total time, medal, citation and site citation. The ranked rows come first: Division 1 (UCF Apocalypse Attack of the University of Central Florida first with 10 solved), then Division 2 (UGA Cross Country Team of The University of Georgia first with 11 solved). The Medal column names overall and per-site medals, for example Overall D1 Gold and FIU D1 Gold, and Ranked for other ranked teams; the last 12 rows have no rank and read Honorable in the Medal column. There is no per-problem detail and no attempt counts.
