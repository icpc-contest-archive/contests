  title: The 2001 ACM SE Regional Programming Contest Summary & Details
  language:
  - en
  contest_date: '2001-10-06'
  problems: 11
  description: |-
    Website of the 2001 ACM SE Regional Programming Contest, from Georgia College & State University, the host, in English. The summary page gives the dates (October 5-6, 2001), the place (the Centennial Center in Milledgeville, GA), the fee of $150 per team of three contestants and one coach, the facilities and software teams must bring, the team rules and the judging method.

    Our copy holds 51 files, 45 of them pages. For 2001 it has the schedule of events, the hotel list, the final standings and the Division II standings, the problem list with 12 statement pages (11 contest problems and one practice problem) and a contest report. It also holds pages of the 2000 contest of the same series: a results page linking the overall, Division I and Division II standings, a problem list with the statements of its ten problems, and a practice script. Its 2000 report page carries the same text as the 2001 report.

    The contest rules page and the command-line instructions page linked from the summary page are not in our copy.
