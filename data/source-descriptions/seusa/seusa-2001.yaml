  description: |-
    Final scoreboard of the contest at Georgia College & State University, October 6, 2001, as a table of text lines: 77 teams, of which 68 carry a place from 1 to 68 and 9 more, all with no problem solved, are listed at the end without one. Each row gives the team name, problems solved, penalty points and, per problem, the number of judged submissions and, when solved, the time of the solving run (dots otherwise). The header names 11 problems (SKI, NETWORK, CDROM, MESSAGE, DUCK, DUDE, COUNT, PERCENT, PUZZLE, SHUFFLE, CASHIER); the rows of places 1 to 40 have an entry for all 11, while the rows of places 41 to 68 and of the 9 teams without a place have only ten, the last column, CASHIER, being absent, and in the row of place 3 the CASHIER entry breaks off after the number of submissions. Eight problems were solved by the first-place team, UCF Intrepid.

    The board has no institution column and no marks separating divisions or unofficial teams.
