- url: http://turing.gcsu.edu/~gadkins/contestReport2001.html
  read: '2026-11-16'
  rubric: 1
  copy: seusa/seusa-2001/report/20011018-wayback-bdaf5bed/contestReport2001.html
  title: South East Regional Contest Report, 2001
  language:
  - en
  description: |-
    Report on the 2001 South East Regional Contest, in English; no author is named. It states that 77 teams from Mississippi, Alabama, Georgia, South Carolina and Florida took part on Friday and Saturday, October 5-6, with 46 volunteers from the host's computer science program. It describes the sponsors (IBM, Borland and Inprise), the single-room layout with teams two to a table, submission by "Sneaker Net" and site-supported printing, and lists the ten judges, nine with their universities and one as a private contractor.

    It also says that over 90% of teams solved at least one of the 11 problems, that 50% solved at least two and that the top team solved eight, and that prizes went to the top nine teams in each of two divisions, by graduate or undergraduate programs, with plaques for the top three. The page links to the 2001 results and problem set. The browser title of the page still reads 2000.
