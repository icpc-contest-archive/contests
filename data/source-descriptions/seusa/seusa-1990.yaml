  language:
  - en
  problems: 1
  pages: 1
  description: |-
    Statement as a one-page PDF in English, with the line "ACM Contest Problems Archive University of Valladolid (SPAIN)" at the top and the title "357 Let Me Count The Ways"; the number printed is 357. It asks for the number of different combinations of US coins (penny, nickel, dime, quarter, half-dollar) that make a given amount from 0 to 99 cents. It has Input and Output sections and a sample of three amounts. The copy prints no region, year or contest name.
