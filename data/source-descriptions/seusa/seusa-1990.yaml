  language:
  - en
  problems: 1
  pages: 1
  description: |-
    Statement of problem 5249, "The Bases Are Loaded", as a one-page PDF in English. It asks for a program that converts a whole number from one base to another, bases 2 to 16, and reports numbers that contain invalid digits. It has Input and Output sections and a sample with three lines. The copy prints no region, year or contest name.
