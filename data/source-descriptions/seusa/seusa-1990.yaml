  title: 5248 Crazy Calculator
  language:
  - en
  problems: 1
  pages: 2
  description: |-
    Statement of problem 5248, "Crazy Calculator", as a 2-page PDF in English; the second page carries the line "ACM-ICPC Live Archive: 5248 – Crazy Calculator 2/2". It asks for an integer calculator whose symbols, precedences and associativity for plus, minus, times and integer divide are given in four lines of local dialect, followed by expressions to evaluate. It has Input and Output sections, a note on the last sample expression and a sample with seven input lines. The copy prints no region, year or contest name.
