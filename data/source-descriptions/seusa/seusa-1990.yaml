  title: Don't Have A Cow, Dude
  language:
  - en
  problems: 1
  description: |-
    Statement of one problem as a web page in English, titled "Don't Have A Cow, Dude". A cow is tied to a post on the circumference of a circular pasture, and the task is to find the rope length that lets it eat a given part P of the grass for a pasture of radius R. It has an "Input and Output" section, a sample input (one case, R = 100, P = 0.33) and sample output, and a note that the sample answer is purposely not correct. The page prints no problem number, region, year or contest name.
- url: https://icpcarchive.ecs.baylor.edu/external/52/5253.html
  read: '2026-11-23'
  rubric: 1
  copy: seusa/seusa-1990/judge-livearchive/20150309-wayback-38c8dcbd/5253.html
  title: Sex Assignments And Breeding Experiments
  language:
  - en
  problems: 1
  description: |-
    Statement of one problem as a web page in English, titled "Sex Assignments And Breeding Experiments". It asks whether a given directed graph, read as parent-to-child edges of a population, can be a breeding experiment with assigned sexes, and prints "Graph number i is sexy" or "is not sexy". It has Input, Output, sample input and sample output sections. The page links four figure images (359img4.gif to 359img7.gif) that are not part of our copy, so the figures are missing. The page prints no problem number, region, year or contest name.
