  description: |-
    Statement of problem 5246, "The Seasonal War", as a 2-page PDF in English; the second page carries the line "ACM-ICPC Live Archive: 5246 – The Seasonal War 2/2". A story about two towns and a flawed spy-telescope leads to the task of counting war eagles, groups of adjacent 1 cells, in square images of at most 25 by 25 pixels, using four stated assumptions. It has an Input and Output section and a sample with two images and two output lines. The copy prints no region, year or contest name.
