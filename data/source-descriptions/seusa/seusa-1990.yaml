  title: 5250 Square Pegs And Round Holes
  language:
  - en
  problems: 1
  pages: 1
  description: |-
    Statement of problem 5250, "Square Pegs And Round Holes", as a one-page PDF in English. A circle is drawn on a 2n by 2n chessboard, and the task is to count the cells that contain a segment of the circle and the cells that lie entirely inside it, for each n up to 150. It has Input and Output sections and a sample for n = 3 and n = 4. The text refers to an illustration for n = 3. The copy prints no region, year or contest name.
