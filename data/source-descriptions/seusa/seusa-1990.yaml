  description: |-
    Category page of the ICPC Live Archive online judge for Regionals 1990, North America - Southeast USA. It lists eight problems with their archive numbers 5246 to 5253 and titles, from The Seasonal War to Sex Assignments And Breeding Experiments. For each problem it gives total submissions with solving percentage and total users with solving percentage.

    The page holds only the list; the problem statements are on separate pages that are not part of this copy. The menu and login form of the archive surround the table.
