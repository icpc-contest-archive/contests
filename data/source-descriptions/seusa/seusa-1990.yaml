  language:
  - en
  problems: 1
  pages: 1
  description: |-
    Statement of problem 5247, "Pesky Palindromes", as a one-page PDF in English. For each input string of at most 80 characters it asks for the number of unique palindromes that are substrings. It has Input and Output sections, a note explaining the sample (the strings boy, adam, madam and tot) and a sample input and output. The copy prints no region, year or contest name.
