    Statement of problem 3313, "Do You Read Me?", as a PDF of 2 pages. For texts in which syllables are marked with vertical bars, the program computes five readability scores (Kincaid, Automated Readability Index, Coleman-Liau, Fog Index and Lix) from counts of characters, syllables, words and sentences. It has input and output sections and a sample of two texts. The head line reads North America - Southeast - 2005/2006; no letter label is printed.
