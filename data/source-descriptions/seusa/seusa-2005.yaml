  description: |-
    Statement of problem 3312, "British Map Grids", as a PDF of 2 pages. Given pairs of British Ordnance Survey grid references (4 or 6 digits), the program prints the distance in kilometres between the two cells or reports an invalid reference. It refers to a Figure 1 of grid squares and has input and output sections and a sample of four lines. The head line reads North America - Southeast - 2005/2006; no letter label is printed.
