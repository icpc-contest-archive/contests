  description: |-
    Website of the 2005 ACM Southeast USA regional programming contest, in English, hosted by Florida Tech in Melbourne, Florida on Saturday 15 October 2005. The front page gives the date and place, equipment teams must bring, the contest languages (C, C++ and Java; Pascal discontinued), registration (40 dollars per person by 30 September 2005) and the schedule, and links to a live scoreboard and the final standings.

    Our copy holds five pages: the front page, a page explaining the regional contest and the ICPC, a list of hotels in the area, a page on the GNU/Linux contest environment with a CD image to try, and the schedule for Friday 14 and Saturday 15 October 2005, including talks held during the contest. The registration page, the live scoreboard and the final standings are linked but not part of our copy.
