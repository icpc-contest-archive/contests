- url: http://seusa.vanb.org/ser2020/
  read: '2026-11-16'
  rubric: 1
  copy: seusa/seusa-2020/website/2026-09-05-live-f1f4ddf8
  title: 2020 ICPC Southeast USA Programming Contest
  language:
  - en
  contest_date: '2021-03-06'
  description: |-
    Website of the 2020 ICPC Southeast USA Programming Contest, held online on Saturday 6 March 2021 in a single division. Our copy holds two pages, the front page and the final standings page, plus two scripts and one image.

    The front page says each team member worked on their own computer, that Kattis was the contest management software, that 81 teams from 19 schools competed, and that there was no registration fee. It lists the gold, silver and bronze medal teams and the eleven teams advancing to the NADC, and links to an opening ceremony video, an awards ceremony video, a slide of differences from previous years' rules, and the final standings. The slide is in our copy: teams used their own computers, could work in parallel, could use any material available to everyone except help from people other than teammates, paid services and university-specific sites, and could submit in C, C++, Java, Python 3 and Kotlin. The two videos were too large to be saved and are not in our copy.

    The final standings page is a scoreboard of the 81 teams with solve times and tries for problems A to P.
