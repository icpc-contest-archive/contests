  description: |-
    Final standings of the 2020 Southeast USA regional: 81 teams with rank, team, institution, problems solved, time, medal and citation. One team has a gold medal, two silver and four bronze; 46 teams are marked Ranked and 28 Honorable. The first 53 rows carry a rank (ties share a rank, such as fourteenth place for five teams); the last 28 rows are the Honorable teams, listed without a rank. GT 01 of the Georgia Institute of Technology leads with 16 solved in 1282 minutes.

    There are no per-problem results.
