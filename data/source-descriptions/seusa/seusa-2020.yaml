  description: |-
    Final scoreboard of the contest: 81 teams, each with rank, team name, number of problems solved, total time and, for each of the 16 problems A to P, the number of tries and the solve time in minutes (a dash instead of a time marks a problem tried but not solved). The top of the page shows the contest running from 14:00 to 19:00 EST on 2021-03-06, marked over, with a legend for first solve, solved, attempted and pending cells. GT 01 is first with 16 solved, ahead of UCF Slow Cooker with 16.

    Three summary rows at the bottom give, per problem, solved over tries, average tries and average tries to solve. Institutions are not shown, only team names.
