    Rankings page titled "View Standings" under the heading "The 2002 ACM Southeast USA Programming Contest sponsored by IBM": 81 teams with rank, institution and team name, and a citation. Seventy teams carry a rank from 1 (Mississippi State University) to 73, with a citation from First Place through Seventy-third Place; some ranks are skipped or shared. Eleven further teams are listed without a rank under the citation Honorable Mention. No problem counts, penalty times or per-problem results.
