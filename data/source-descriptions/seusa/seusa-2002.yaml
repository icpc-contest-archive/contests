  description: |-
    Results page of the 2002 ACM Southeast USA Programming Competition site, in English. It links three result pages (Final Results, Results Sorted by Division I, Results Sorted by Division II) and eleven problem sets: ABBA, Bridge, Champion, Knight, Light, Pattern, Practice Problem #2, Toll, Tune, Village and Zero, each a link to a PDF. It holds no results itself.

    Our copy is this one page; its seven decorative image files were saved as web pages, not pictures, so they do not display, and the linked result pages and the eleven PDFs are not part of it.
