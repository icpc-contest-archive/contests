  copy: seusa/seusa-2002/website/2026-10-20-wayback-fe18578c
  title: 2002 ACM - Southeast USA Programming Competition
  language:
  - en
  description: |-
    Website of the 2002 ACM Southeast USA Programming Competition (ICPC Southeast USA Regional), kept on the Embry-Riddle Aeronautical University faculty server, in English. Its pages cover the contest (October 11 and 12, 2002, Embry-Riddle Aeronautical University, Daytona Beach, with fees, facilities and software), registration, the schedule of events, location, the rules, hotels and a contact page.

    The score page is a plain-text final standings table headed "ACM Southeast Region 2002 Scholastic Programming Contest": 84 team rows, with place, team name, problems solved, penalty points and, for each of ten problems (ABBA, BRIDGE, CHAMPS, KNIGHT, LIGHTS, PATTERN, SPEEDING, TUNE, VILLAGE, ZERO), the number of judged submissions and the time of the solving one. Seventy-four teams carry a place, numbered 1 to 74 with four places shared by two teams; ten teams with no solved problem follow without a place. A results page links further result pages sorted by final, Division I and Division II, and eleven problem PDFs.

    Our copy holds 145 files from the faculty server, most of them unrelated pages of the university's faculty directory; ten are pages of the contest site. The sorted result pages and the problem PDFs were not captured.
