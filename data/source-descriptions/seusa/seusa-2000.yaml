    Statement of one problem, If it's a Javelin, Duck!: two coaches measure distances to a javelin's landing point from fixed positions, and the program works out the distance that should have been awarded for each throw. The page has footnotes. Input file javelin.in, with the output written to the matching .out file; the page has Input, Output, Sample Input and Sample Output sections. Only two of the fourteen image files referenced by the page are held with it; the other twelve are not in our copy.
