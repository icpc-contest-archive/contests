    Statement of one problem, Hey, You're Not Marion Jones!: identification numbers read from barcodes as strings of the letters V to Z (base 5) are converted to base 10 and checked against a check-digit scheme, and the program reports whether each is valid and the type of participant it belongs to. Input file checksum.in, with the output written to the matching .out file; the page has Input, Output, Sample Input and Sample Output sections. Four image files referenced by the page are not in our copy.
