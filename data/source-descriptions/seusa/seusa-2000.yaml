  description: |-
    Statement of one problem, Are We There Yet?: a simulation of a game of Find the Cookie in a hall, where each input line gives the cookie's location and the moves made and the program reports for each move whether the player is warmer, colder, the same or has found it. Input file cookie.in, with the output written to the matching .out file; the page has Input, Output, Sample Input and Sample Output sections.
