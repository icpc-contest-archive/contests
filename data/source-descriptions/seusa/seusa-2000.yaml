  title: 2000 Southeast Regional Programming Contest Practice Script
  language:
  - en
  problems: 2
  description: |-
    Practice script handed to teams for the practice session: a first practice problem (read integers from practice.in, print the sum from 0 to each one to practice.out, with sample input and output), numbered steps for compiling, running and submitting a file on a floppy disk with a submission form, and the command-line compiler instructions for Pascal, C, C++ and Java. Complete solutions to the first problem follow in C++, C, Java and Pascal.

    The page ends with a second practice problem, Pompeiian Numerals (pompeii.in, pompeii.out), which has a statement and a sample but no solution. The practice problems are not among the ten contest problems.
