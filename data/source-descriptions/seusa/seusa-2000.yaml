    Statement of one problem, The Plane Problem: cargo items are placed in a plane's rectangular hold under packing rules on weight limits, spacing, front-half and left-right weight balance, and the program works out a loading. Input file plane.in, with the output written to the matching .out file; the page has Input, Output, Sample Input and Sample Output sections.
- url: http://turing.gcsu.edu/~gadkins/P_fingers.html
  read: '2026-11-16'
  rubric: 1
  copy: seusa/seusa-2000/problemset/20010211-wayback-8c6e9fa3/P_fingers.html
  title: Who Wants to Have the Fastest Fingers?
  language:
  - en
  problems: 1
  description: |-
    Statement of one problem, Who Wants to Have the Fastest Fingers?: a television game show picks a player by asking candidates to order four items, and the program reads each candidate's timed selections and erasures and reports who is selected. The page explains the input with a table of sample selections and their interpretation. Input file fingers.in, with the output written to the matching .out file; the page has Input, Output, Sample Input and Sample Output sections.
- url: http://turing.gcsu.edu/~gadkins/contestReport.html
  read: '2026-11-16'
  rubric: 1
  copy: seusa/seusa-2000/report/20001020-wayback-0529d073/contestReport.html
  title: South East Regional Contest Report, 2000
  language:
  - en
  problems: 10
  description: |-
    Report on the contest as published with the host's pages, held on Friday and Saturday, 29-30 September 2000. It states that 77 teams from Mississippi, Alabama, Georgia, South Carolina and Florida took part, that seventeen volunteer students of the host's CS program served as runners and system administrators, that IBM was the major sponsor with further sponsorship from Borland and Inprise (a Delphi 5.0 site license), and that solutions were submitted on disks (called Sneaker Net). All teams sat in one gymnasium at nine rows of five conference tables.

    The report names the ten judges with their institutions, says over 90% of teams solved at least one problem and 50% at least two, and that the top two teams solved eight problems and were fifteen minutes apart in total points. Teams were grouped into Division I (graduate programs) and Division II (undergraduate only); the top nine in each division were recognised and the top three in each received plaques. Links at the top lead to the results and the problem set.
