    Statement of one problem, Charity Begins at Home-page: a month of visits to a charity web site, each recorded as dd:hh:mm:ss:address, from which the program lists the visitors and their numbers of valid and invalid visits, grouped by top-level and second-level domain. The page carries six reviewer comments, marked I1 to I6, listed after the sample output. Input file charity.in, with the output written to the matching .out file; the page has Input, Output, Sample Input and Sample Output sections.
