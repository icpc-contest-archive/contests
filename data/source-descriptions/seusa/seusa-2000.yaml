  title: The 2000 ACM SE Regional Programming Contest Summary & Details
  language:
  - en
  problems: 10
  description: |-
    Website of the 2000 ACM Southeast Regional Programming Contest, held at Georgia College & State University in Milledgeville, Georgia, on September 29-30, 2000. The front page gives the dates, the place (the Centennial Center), the fee of $150 for three contestants and one coach, the machines and software teams had to bring (IBM VisualAge C++, IBM C/C++, VisualAge for Java, Sun JDK 1.2, Borland Delphi 5.0), the three-member team rule and the floppy-disk submission method. Other pages hold the schedule of events, a list of hotels and motels (five of the eight list a rate), and a contest report.

    Results are on three pages: overall standings, Division I standings and Division II standings, each with per-problem submissions and times. The problem set page links a practice script and ten problem statements, each with sample input and output. Our copy holds 20 pages in all, in English. The contest rules page and the command-line instructions page that the front page links to are not in our copy, and several images on four of the problem pages are missing.
