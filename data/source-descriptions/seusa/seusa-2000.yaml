  tries: true
  description: |-
    Final overall standings of the contest, as a page of fixed-width text: 77 teams from both divisions, with place, team name, problems solved, penalty points and, for each of ten problems, the number of judged submissions and the time taken to solve it (four dots in place of the time when the problem is not solved). The problem columns are labelled COOKIE, BINGO, CHARITY, CHECKSUM, JAVELIN, DRIVEWAY, OLYMPICS, RECT, PLANE and FINGERS. UCF Centaurus is first with eight problems solved and 985 penalty points; UCF Orion also solved eight.

    Two teams named Pickup 1 and Pickup 2 stand in the table with places; a note under it says they competed for local awards and prizes only and are not in the official team rankings. Seven teams with no problem solved are listed at the end without a place. A second note explains Division I (schools with graduate programs in CS) and Division II (undergraduate programs only); the table does not mark which division a team belongs to.
