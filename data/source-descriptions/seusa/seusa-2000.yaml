  description: |-
    Statement of one problem, The Party's in Dolores's Driveway: cars are parked in a single-file driveway of 26 places with exits at both ends, and when one leaves the cars on the shorter path must move and return in reverse order; the program reports the resulting arrangements. Input file driveway.in, with the output written to the matching .out file; the page has Input, Output, Sample Input and Sample Output sections. Both image files referenced by the page are not in our copy.
