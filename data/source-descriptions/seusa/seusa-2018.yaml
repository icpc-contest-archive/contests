  description: |-
    Category page of the Baekjoon Online Judge, in Korean, for the 2018 Southeast USA Regional Programming Contest under ICPC Regionals, North America. Two tables, Division 1 and Division 2, list 11 problems each (16 different problems, since six are in both). Each row gives the problem number on the judge, the letter A to K, the English title, a mark that the statement is available in several languages (with a special-judge mark on G in Division 1 and B in Division 2), the number of users who solved it, submissions and the solving percentage. Division 1 problem G is titled Mobilization here and Troop Mobilization in the problem set. The page holds the list only, not the statements.
