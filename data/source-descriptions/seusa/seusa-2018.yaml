  description: |-
    Front page of the website of the 2018 ACM Southeast USA Programming Contest, in English. It announces two divisions with different problem sets, Division 1 qualifying for the World Finals, and gives the date (Saturday 3 November 2018), the practice round (11am to noon) and the contest (1:30pm to 6:30pm EDT), and the four sites (College of Charleston, Florida International University, Kennesaw State University, University of West Florida). It also covers the registration fee and deadline, the GNU/Linux environment with DOMjudge, the list of programming languages, and the scoreboard, and names the regional director, site directors and chief judge by role.

    Our copy holds this one page. The pages it links to, including the explanation page, registration and the final results of both divisions, are not in our copy.
