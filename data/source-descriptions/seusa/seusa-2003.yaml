  description: |-
    Single-problem statement PDF of 2 pages, headed "2770 - Run Forrest! Run!" and the region line "North America - Southeast - 2003/2004", in English. The statement asks for a program that reads the distances (in miles or kilometers) and times of the legs of a run and prints a summary table of miles, kilometers, time, pace per mile and pace per kilometer for each leg, with the overall distance and time. It has input and output sections and ends with a sample input and sample output.
