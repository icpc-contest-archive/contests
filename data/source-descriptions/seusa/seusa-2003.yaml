  description: |-
    Single-problem statement PDF of 4 pages, headed "2769 - The Matrix" and the region line "North America - Southeast - 2003/2004", in English. The statement defines the FooL language, with a pointer on a 2D matrix of cells, movement instructions, data instructions and loops, and asks for an interpreter that runs each program on the given input and prints its output; the sample has three programs, one printing Hello World. It has input and output sections and ends with a sample input and sample output.
