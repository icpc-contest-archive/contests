    Single-problem statement PDF of 2 pages, headed "2767 - Fame" and the region line "North America - Southeast - 2003/2004", in English. The statement asks, for each party given as a grid of up to 100 by 100 characters (uppercase letters or periods), for the number of four-connected groups of the letter A with three or more members, printed as "Party n has m A-list groups"; the sample has two parties. It has input and output sections and ends with a sample input and sample output.
