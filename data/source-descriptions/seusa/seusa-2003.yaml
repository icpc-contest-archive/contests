  description: |-
    Single-problem statement PDF of 2 pages, headed "2771 - Toga Party" and the region line "North America - Southeast - 2003/2004", in English. The statement asks for the maximum total happiness quotient obtainable by pairing men and women at a party according to who likes or tolerates whom, with scores of 4, 3, 2 and 1 for the kinds of pairing, printed as "Party n has a maximum happiness quotient of h"; the sample has three parties. It has input and output sections and ends with a sample input and sample output.
