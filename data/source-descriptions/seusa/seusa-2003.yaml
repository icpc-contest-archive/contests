    Single-problem statement PDF of 2 pages, headed "2764 - Antialias" and the region line "North America - Southeast - 2003/2004", in English. The statement asks for the area of a unit pixel lying to the left of a polygon edge-segment given by its entry and exit points, rounded to four decimals and printed as "Pixel n has area a to the left of the edge-segment"; diagrams illustrate the pixel and a sample of three data sets is given. It has input and output sections and ends with a sample input and sample output.
