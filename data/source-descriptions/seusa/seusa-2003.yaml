  description: |-
    Single-problem statement PDF of 2 pages, headed "2773 - Universe in the Cupboard" and the region line "North America - Southeast - 2003/2004", in English. The statement asks for the number of constellations in a list of star coordinates, where each star is in the same constellation as its closest neighbour (all of them when tied) and the relation is symmetric and transitive; the output line is "Universe n contains c constellations" and a figure of a night sky is shown. It has input and output sections and ends with a sample input and sample output.
