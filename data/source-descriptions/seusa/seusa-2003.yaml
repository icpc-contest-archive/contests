  description: |-
    Single-problem statement PDF of 2 pages, headed "2765 - Armageddon" and the region line "North America - Southeast - 2003/2004", in English. The statement asks, from the number of days each planet takes to return to its apparent starting position, in how many days all planets and the sun are aligned again (up to 2,147,483,647), or "NOT TO WORRY" if they are not; there are up to 50 planets per solar system and the sample has four systems. It has input and output sections and ends with a sample input and sample output.
