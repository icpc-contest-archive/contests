  description: |-
    Single-problem statement PDF of 2 pages, headed "2768 - Marquee Magic" and the region line "North America - Southeast - 2003/2004", in English. The statement asks for a two-line marquee form of a one-line expression in which the exponent after the caret is moved to a line above and operators are surrounded by single blanks; the expression syntax is given in BNF and the display is shown in the statement as pictures. It has input and output sections and ends with a sample input and sample output.
