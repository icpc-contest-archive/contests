  description: |-
    Single-problem statement PDF of 2 pages, headed "2772 - Treasure Island" and the region line "North America - Southeast - 2003/2004", in English. The statement asks, for each word search puzzle of up to 20 by 20 letters with words placed horizontally, vertically and diagonally in either direction, which words of a given list cannot be found, or "ALL WORDS FOUND"; a grid figure is shown. It has input and output sections and ends with a sample input and sample output.
