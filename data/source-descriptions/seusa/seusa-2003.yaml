    Single-problem statement PDF of 2 pages, headed "2766 - Election" and the region line "North America - Southeast - 2003/2004", in English. The statement describes ballot orderings of candidate names under a custom letter order, rotated by one candidate for each following district, and asks for the position of a given name on the ballot of a given district, or a message that the name is not on the ballot. It has input and output sections and ends with a sample input and sample output.
