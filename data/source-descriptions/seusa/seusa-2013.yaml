  copy: seusa/seusa-2013/website/2026-10-20-wayback-d8c7bd92
  title: 2013 ACM Southeast USA Programming Contest
  language:
  - en
  contest_date: '2013-11-02'
  description: |-
    Website of the 2013 ACM Southeast USA Programming Contest, in English, with Florida Tech, Georgia Tech and the University of West Florida as the three contest sites. Our copy holds two pages. The front page announces two divisions with a different problem set for each (Division one qualifies for the World Finals, division two has no very hard problems), names the organisers by role, and gives the contest day, Saturday 2 November 2013, with a practice round from 11am to noon and the contest from 1:30pm to 6:30pm EDT. It also covers the sites, the registration fee of $35 per person if paid by 5 October 2013, the languages allowed, DOMjudge as the contest software, and how standings are posted during and after the contest.

    The second page describes the contest environment: a GNU/Linux image booted from a USB flash drive, compiler versions, development software, printing of listings, and the data kept on the flash drives after the contest.

    The pages linked for the schedule, the registration form and the two final standings PDFs are not in our copy, and neither are the page images. The link to the live scoreboard leads to another server.
