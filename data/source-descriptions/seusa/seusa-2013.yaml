  teams: 100
  problems: 10
  times: true
  tries: true
  pages: 8
  description: |-
    Final scoreboard printed from DOMjudge, headed 'Scoreboard SER2013', a PDF of 8 pages with two boards one after the other. The first board (last update 3 Nov 2013 15:15) lists 49 teams: places 1 to 42, then seven teams without a place and with nothing solved; UCF Olympus is first with 7 problems solved. The second board (last update 3 Nov 2013 15:27) lists 51 teams: places 1 to 41, then ten teams without a place and with nothing solved; Agile Architects is first with 8 problems solved. Neither board is labelled with a division.

    Both boards have the columns rank, affiliation, team, score (problems solved and total time) and problems A to J. Each problem cell gives the number of tries and, for a solved problem, the solving time plus penalty minutes. A summary row at the end of each board totals the tries and solves per problem, and a legend explains the cell colours and the site categories (FIT, GaTech, UWF, Pickup-Teams; the second board also has Self-Registered).
