  description: |-
    Problem set of Division 1, a PDF of 17 pages in English. The cover names the contest, the date 2 November 2013 and Division 1, lists problems A to J with page numbers, and names Florida Institute of Technology, Georgia Institute of Technology and the University of West Florida as hosts. The ten problems are A Beautiful Mountains, B Nested Palindromes, C Ping!, D Electric Car Rally, E Skyscrapers, F Star Simulations, G Tandem Repeats, H Triangles, I It Takes a Village and J You Win!.

    Each problem has a statement with input and output format and a sample input and output. The pages after the cover are numbered 1 to 16. No test data and no solutions.
