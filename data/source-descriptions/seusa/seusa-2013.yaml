    Standings of the 2013 Southeast USA Regional Contest: 99 teams with rank, team, institution, problems solved, time and a citation. UCF Olympus (University of Central Florida) is first with 7 problems solved in 1034. The first 49 rows carry placings from First Place to Forty-second Place (eight teams with nothing solved share 42nd place); the other 50 rows are Honorable Mention, ranked from 50 to 89. The list starts again at 8 solved at rank 50, so it reads as two ranked lists one after the other.

    No per-problem results and no attempts are shown.
