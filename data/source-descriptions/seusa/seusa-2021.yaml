    Division 1 problem set as a PDF of 22 pages, in English. Each page carries an ICPC North America Regionals header naming sponsors (icpc global, Upsilon Pi Epsilon, ICPC EdTech) and a footer reading 2021 ICPC Southeast USA Division 1 with the problem letter and title. It has eleven problems, A to K, from A Black and White to K XOR Island. Each problem has a statement with a time limit, input and output format and sample inputs and outputs. No test data or solutions.
