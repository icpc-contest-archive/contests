  description: |-
    Standings of both divisions of the regional contest: 76 teams in one table with rank, team, institution, number solved, total time, medal, citation and site citation. The ranked rows come first: Division 1 (UCF Iris of the University of Central Florida first with 11 solved), then Division 2 (Mercer Binary Bears Team B first). The Medal column reads, for example, D1 Gold Medal and D2 Gold Medal, or D1 Ranked and D2 Ranked. The last 32 rows have no rank and read Honorable Mention in the Medal column. There is no per-problem detail and no attempt counts.
