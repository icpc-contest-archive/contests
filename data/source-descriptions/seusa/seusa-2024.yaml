    Division 1 scoreboard on Kattis, shown in the Southeast USA teams view: 42 teams, each with number solved, total time and, for each of the 13 problems A to M, the number of attempts and, where solved, the minute of the accepted run. The team in first place is GT Iridescent with 13 solved. The page marks the contest as over, gives a five-hour contest running from 19:30 to 00:30 CET, and has a legend for first to solve, solved, attempted and pending judgement.

    The page also carries filters by conference and school for the Mid-Atlantic USA, South Central USA and Southeast USA regions; our copy shows the Southeast USA view only.
