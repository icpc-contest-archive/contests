  title: 2024 ACM Southeast USA Programming Contest
  language:
  - en
  contest_date: '2024-11-16'
  description: |-
    Announcement page of the Southeast USA regional contest, in English. It states that there are two divisions with a different problem set for each, that schools may enter teams in both divisions but their Division 2 teams then do not appear on the scoreboard, and that winners are recognised in each division and at each site. It gives the contest date of 16 November 2024, the five-hour format, the states whose teams compete, the registration fee of $50 per person, the programming languages (C, C++, Java, Python 3 and Kotlin) and Kattis as the contest control system.

    The six sites are listed with links to directions and maps: Middle Georgia State University, University of North Georgia, Florida State University, College of Charleston, Florida International University and University of West Florida. The closing line links to the scoreboards.

    Our copy holds one page of the site. The directions and map files and the other pages it links to are not in our copy.
