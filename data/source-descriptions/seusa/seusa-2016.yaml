    Final scoreboard of Division I of the 2016 Southeast USA regional, a DOMjudge page last updated Thu 10 Nov 2016. It lists 45 teams with rank, team name, institution, number solved and total time, and for each of eleven problem columns (alphabet, basesums, buggy, enclosure, illuminate, intents, islands, paint, periodic, water, zigzag) the number of attempts and, for solved problems, the time. The last team row has no rank of its own. A summary row gives totals per problem, and a legend gives four site categories (CofC, FIT, KSU, UWF) and the cell colours. UCF Badlands is first with 9 problems solved.
