  title: 2016 ACM Southeast USA Programming Contest
  language:
  - en
  contest_date: '2016-11-05'
  description: |-
    Front page of the website of the 2016 ACM Southeast USA Programming Contest, in English. It says that there are again two divisions with a different problem set for each, that Division 1 qualifies its team for the World Finals, and that winners are recognised in each division and each site. It names four sites (College of Charleston, Florida Tech in Melbourne, Kennesaw State University in Marietta, University of West Florida in Pensacola), gives the date and times of the practice round and the contest, the registration fee and deadline, the contest environment (GNU/Linux, DOMjudge, a list of accepted programming languages) and a note on the scoreboard.

    Our copy holds this one page only. The pages it links to (what the contest is, the Florida Tech schedule, registration, the final results) and the live scoreboard are not in our copy.
