  description: |-
    Standings of the 2016 Southeast USA regional: 117 teams with rank, team, institution, number solved and total time. Both divisions are in one list: ranks 1 to 45 are the Division I teams and the Division II teams are numbered from 101 (the last rank is 172). UCF Badlands (University of Central Florida) is first with 9 problems solved with a time of 764. There is no per-problem detail and no division column.

    Two rows show more problems solved than a division's problem set had: 25 for GGC (Georgia Gwinnett College) and 20 for !bad (University of Miami).
