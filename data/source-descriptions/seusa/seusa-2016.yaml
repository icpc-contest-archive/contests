    Category page of the Baekjoon Online Judge for the 2016 Southeast USA Regional Programming Contest, with the site's menus in Korean and the problem titles in English (one title, problem E of Division 2, is in Korean). Two tables list the problems of the two divisions, eleven each, labelled A to K: Division 1 runs from Alphabet to Zigzag and Division 2 from Barbells to Zigzag. Four problems (Buggy Robot, Islands, Periodic Strings, Zigzag) appear in both, so 18 distinct problems in all. Each row gives the Baekjoon problem number, the label, the title, an info column (marked 다국어, "multilingual"), the number of users who solved it, the number of submissions and the percentage correct.

