  title: 2022 ACM Southeast USA Programming Contest
  language:
  - en
  contest_date: '2023-02-25'
  description: |-
    Single-page website of the Southeast USA regional contest, in English. It announces two divisions with a different problem set for each, with winners recognised per division and per site, and says teams of a school in both divisions are shown only in Division 1 on the scoreboard. It names the contest date as Saturday, 25 February 2023 and lists five sites, with a directions and map link for each: Samford University in Birmingham, Alabama; Augusta University in Augusta, Georgia; College of Charleston in Charleston, South Carolina; Florida International University in Miami, Florida; and University of West Florida in Pensacola, Florida. It also gives the registration fee, the programming languages (C, C++, Java, Python 3 and Kotlin), Kattis as the contest control system, and links to the Division 1 and Division 2 scoreboards.

    Our copy holds this one page and a script file; the directions and map files and the scoreboard links are not part of it.
