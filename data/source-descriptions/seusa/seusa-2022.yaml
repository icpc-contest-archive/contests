    Division 1 problem set as a PDF of 26 pages, in English, with no cover page: it opens directly with Problem A. Pages 8 and 10 are marked as intentionally left blank; every other page has a footer reading 2022 ICPC Southeast USA Regional Division 1 with the problem letter and name. It has thirteen problems, A to M, from A Fading Wind to M Alchemy. Each problem has a statement with a time limit, input and output format and sample inputs and outputs. No test data or solutions.
