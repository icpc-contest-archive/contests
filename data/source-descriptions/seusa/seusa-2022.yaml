    Standings of both divisions of the regional contest: 102 teams in one table with rank, team, institution, number solved, total time, medal, citation and site citation. The ranked rows come first: Division 1 (Georgia Tech Pandas of the Georgia Institute of Technology first with 12 solved), then Division 2 (USF Bools of the University of South Florida first with 10 solved). The Medal column gives Gold, Silver and Bronze Medal for each division and Ranked for the other ranked teams; the last 14 rows have no rank and read Honorable in the Medal column. There is no per-problem detail and no attempt counts.
