  title: ACM Southeast USA Regional Intercollegiate Programing Contest
  language:
  - en
  description: |-
    Home page of the ACM Southeast USA Regional Programming Contest series as it stood for the contest of Saturday 3 November 2018. It names the steering committee roles, the states of the region (Alabama, Florida, Georgia, Mississippi and South Carolina), and links to a report on institutional participation 2007 to 2012, a contestant image, a judging blog and a site for running ICPC-style contests. A list of 24 past contests, from 2017 back to 1994, gives the host sites of each year with a link to that year's page. The page also has a section for institutions that want to host a site, a list of the other North American regions, and a link to an archive of World Finals problems.

    It holds no results or problems of the 2015 contest; the 2015 edition appears in the list of past contests and in a header line that names the North American champions with links labelled ACM ICPC SER 2014 and ACM ICPC SER 2015.
