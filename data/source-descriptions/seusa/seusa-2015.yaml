  description: |-
    Problem set of Division 1, a PDF of 17 pages in English. The cover names the contest and division, lists the ten problems in a table of contents (Airports, Checkers, Coverage, Gears, Grid, Hilbert Sort, The Magical 3, Racing Gems, Simplicity, Weightlifting) and names the four host institutions: College of Charleston, Florida Institute of Technology, Georgia Institute of Technology and University of West Florida. The problems are not lettered. Each of the ten has a statement with input and output format and sample input and output. The page footers carry the contest name and the date 14 November 2015.

    No test data or solutions are in it.
