  title: 2015 ACM Southeast USA Programming Contest
  language:
  - en
  contest_date: '2015-11-14'
  description: |-
    Website of the 2015 ACM Southeast USA Programming Contest, in English. The front page names four sites (College of Charleston, Florida Tech in Melbourne, Georgia Tech in Atlanta, University of West Florida in Pensacola), gives the date and times of the practice round and the contest, the registration fee and deadline, the contest environment (GNU/Linux, DOMjudge, a list of accepted programming languages), and a note on the scoreboard and on job openings for IBM. Further pages explain what the contest is and give the schedule at Florida Tech for Friday 13 and Saturday 14 November 2015.

    Our copy holds five pages: the front page, the two further pages, and the final scoreboards of Division I and Division II as PDF files. The pages behind the links to registration, the contestant environment and the live scoreboard are not in our copy.
