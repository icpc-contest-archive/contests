    Standings of the 2015 Southeast USA regional: 109 teams with rank, team, institution, number solved and total time. Both divisions are in one list: ranks 1 to 42 are the Division I teams, ranks from 43 are the Division II teams, and the last 11 teams, with no problems solved, all share rank 99. UCF Monarch (University of Central Florida) is first with 10 problems solved with a time of 1134. There is no per-problem detail and no division column.
