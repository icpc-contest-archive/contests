  description: |-
    Dashboard of the contest on Codeforces Gym, marked Finished, with options for virtual participation and practice. It lists nine problems, A Block Game, B Euclid, C Museum Guards, D Knitting, E Minesweeper, F The Ninja Way, G Pool Table, H Robot Challenge and I Mosaic, each with standard input and output, a time limit (15 seconds for A and C, 3 seconds for the others), a 256 MB memory limit and a count of accepted solutions. A link to the English statements is present on the page; the statements themselves are not on it.

    A note on the page says the problem packages were not updated after a judge server upgrade and that execution times are multiplied by 2.
