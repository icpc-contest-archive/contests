  description: |-
    Scoreboard produced by PC^2, headed Summary - Contest and stamped last updated Sat Nov 07 18:32:28 EST 2009. It lists 83 teams with rank, team name, problems solved and penalty points, with the first place, UCF Hue, having 7 solved and 873 points. Six teams share rank 78 with no problems solved.

    Nine problem columns are labelled by problem title (Block Game to Mosaic) instead of by letter. Each solved cell carries a balloon icon whose tooltip gives the number of attempts and the minute of the solution; unsolved cells show either a cross icon (63 cells) or dashes. A last row, Time of First Solution, gives a time for eight of the nine problems; the cell for Museum Guards is empty. Institutions are not shown.
