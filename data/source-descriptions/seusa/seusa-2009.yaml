  description: |-
    Problem set of the contest as a PDF of 17 pages in English. The cover names the contest and the date, 7 November 2009, lists the contents and names Florida Institute of Technology, Armstrong Atlantic State University and the University of South Alabama as hosts. Nine problems follow: A Block Game, B Euclid, C Museum Guards, D Knitting, E Minesweeper, F The Ninja Way, G Pool Table, H Robot Challenge and I Mosaic.

    Each problem has a full statement with input and output format and a sample input and output. The pages carry a running footer numbered Page 1 of 16 to Page 16 of 16, the cover being unnumbered. No test data or solutions.
