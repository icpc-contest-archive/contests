  title: 2009 ACM Southeast USA Programming Contest
  language:
  - en
  contest_date: '2009-11-07'
  description: |-
    Website of the 2009 ACM Southeast USA Programming Contest, held on Saturday 7 November 2009 at three sites: Armstrong Atlantic State University in Savannah, Georgia, Florida Tech in Melbourne, Florida, and the University of South Alabama in Mobile, Alabama. Our copy holds 8 pages. The front page names the regional contest director, the site directors and the chief judge, and gives the practice round (11am to noon) and contest times (1:30pm to 6:30pm), registration rules and the fee of $40 per person, and the languages allowed.

    Further pages: a general description of the ACM ICPC and the Southeast region, the schedule at Florida Tech, a two-page PDF schedule for the Armstrong Atlantic site, a fee payment form with a list of institutions, a description of the GNU/Linux contest environment with a bootable CD, a one-page PDF with an IBM internship job description, and a standings page (a PC^2 summary table of the results, also held as a separate source).

    The front page links to a live scoreboard on another server, which is not part of our copy.
