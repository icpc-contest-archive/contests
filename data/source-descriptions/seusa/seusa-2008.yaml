  teams: 70
  problems: 10
  times: true
  tries: true
  description: |-
    Final results of the SER 2008 Regional Contest as a table: 70 teams with rank, name, problems solved, total time, and for each of the ten problems A to J (headed Circuits, Heart, Lawrence, Levees, Lock, Lotto, No-Win, Park, Teleport, Worms) the number of attempts and the time of the first correct solution, plus total attempts and solved. UCF Hypersolution is first with five problems solved and a time of 643; no team solved more than five, and six teams solved none. Ranks are shared, so the last six teams are all ranked 65. A bottom row gives submissions, time of first yes and total yes per problem.

    Below the table, a statistics block states that 720 programs were submitted, including pickup teams, with correct and incorrect counts per problem, a breakdown of incorrect runs by kind of error, and counts by language (Java, C++, Python, C, Haskell).
