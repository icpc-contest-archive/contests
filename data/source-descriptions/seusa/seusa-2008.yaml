  contest_date: '2008-10-25'
  problems: 10
  description: |-
    Organisers' website of the 2008 ACM Southeast USA Programming Contest, kept on a Florida Tech server. The front page names the contest officials, explains the contest, and says it is held on Saturday 25 October 2008 at three sites: Armstrong Atlantic State University in Savannah, Georgia, Florida Tech in Melbourne, Florida, and the University of South Alabama in Mobile, Alabama. It gives registration times at two of the three sites, the fee of $40 per person with a payment deadline of 4 October 2008, the Linux environment with C, C++, Java, Haskell and Python, and how the scoreboard is run. Further pages describe the regional contest, give a fee payment form, and describe the contest environment (a live CD based on Ubuntu 7.10, installed software, PC^2 for submissions).

    Our copy holds 10 pages: those four, a one-page agenda PDF for the Armstrong Atlantic site (Friday 24 and Saturday 25 October 2008), and five results pages: the final results table, an overall summary and one summary for each of the three sites. The site's navigation scripts and the balloon, cross and logo images of the scoreboard pages are not in our copy.
