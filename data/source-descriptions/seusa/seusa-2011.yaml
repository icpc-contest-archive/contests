  description: |-
    Final standings of the 2011 Southeast USA Regional Contest: 78 teams with rank, team name, institution, problems solved and total time, followed by columns for medal, citation and site citation. The citation column runs from First Place down to Honorable Mention, which 38 teams carry, and the site citation column gives site placings such as 'GSU: First Place', 'FIT: First Place' and 'UWF: First Place'. The medal column is empty except for four teams with Director's awards: first, second and third place novice awards and a C# award. GTAuto of Georgia Institute of Technology is first with 7 problems and 740 minutes.

    There are no per-problem results and no attempt counts.
