  description: |-
    Problem set of the Southeast USA regional as a PDF of 17 pages: a cover giving the title and the date 29 October, 2011, a contents list and the hosts (Florida Institute of Technology, Georgia Southern University, University of West Florida), then ten problems A to J. They are Sunday Drive, Hexagram, Flooring Tiles, Vive la Difference!, Robot Navigation, Folding Game, Burnout, Family Fortune, Moving Points and Vampire Numbers.

    Each problem has a statement in English with input and output format and a sample input and sample output; the pages are numbered 1 to 16 after the cover. There are no test data or solutions. The file's embedded title property reads '2010 ACM ICPC'; the printed cover and page footers name 2011.
