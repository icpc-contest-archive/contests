  language:
  - en
  contest_date: '2011-10-29'
  description: |-
    Website of the 2011 ACM Southeast USA Programming Contest, in English, as published by the regional organisers at Florida Tech. Our copy holds 7 pages: the front page, a page explaining the contest, a schedule for the Florida Tech site (Friday 28 and Saturday 29 October 2011), a page on preparing teams without a local chapter, a fee payment form listing the region's institutions, a page on the Linux contest environment, and the final standings as a PDF.

    The front page names the contest as held on Sat, 29 Oct 2011 at three linked sites: Florida Tech in Melbourne, Georgia Southern University in Statesboro and the University of West Florida in Pensacola. It lists the contest director, site directors and chief judge, gives the practice round (11am to noon EDT) and the contest (1:30pm to 6:30pm EDT), and states that DomJudge is the contest management software. Links to the live scoreboard and to other sites lead outside our copy.
