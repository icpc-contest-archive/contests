    Final scoreboard of the Southeast USA regional as a PDF of 4 pages, headed 'Scoreboard SER2011 Overall Rankings' and 'final standings'; the first page carries the date Tue 1 Nov 2011 and 'Last Update: 1 Nov 2011 12:49'. It lists 78 teams with rank, team name, number solved and total time, then one column for each of the ten problems A to J giving the attempts and, in parentheses, the minutes and penalty minutes. The affiliation column has a heading but its cells are empty in our copy. Nine teams, those tied with the team above, have no rank number. A summary row at the end gives totals per problem, and a legend marks participants of the three sites (GSU, FIT, UWF). GTAuto is first with 7 problems and 740 minutes.

    The last page holds only the legend.
