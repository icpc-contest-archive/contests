- url: http://seusa.vanb.org/ser2017/
  read: '2026-11-16'
  rubric: 1
  copy: seusa/seusa-2017/website/2026-09-05-live-7a530793
  title: 2017 ACM Southeast USA Programming Contest
  language:
  - en
  contest_date: '2017-11-11'
  description: |-
    Website of the 2017 ACM Southeast USA Programming Contest, in English. The front page announces two divisions with different problem sets, Division 1 qualifying for the World Finals, and gives the date (Saturday 11 November 2017), the practice round (11am to noon) and the contest (1:30pm to 6:30pm EST), the four sites (College of Charleston, Florida International University, Kennesaw State University, University of West Florida), the registration fee, the GNU/Linux environment with DOMjudge and the list of programming languages. It names the regional director, site directors and chief judge by role. A second page explains what the contest is and how teams of three are ranked.

    Our copy holds five pages: the front page, the explanation page, a schedule page, and the results of Division I and Division II as two PDFs of DOMjudge scoreboards. The schedule page in the site menu still holds the 2016 schedule of the Florida Tech site (4 and 5 November 2016). The registration page returned an error and is not in our copy, and the links to the live scoreboard and to the site pages lead to other servers.
- url: http://ser2017.cloudcontest.org/ser2017-d1.html
  read: '2026-11-16'
  rubric: 1
  copy: seusa/seusa-2017/scoreboard/2026-09-01-live-7e988f48/ser2017-d1.html
  title: Scoreboard
  language:
  - en
  teams: 47
  problems: 11
  times: true
  tries: true
  description: |-
    Final standings of Division I as a DOMjudge scoreboard: 47 teams, each with team name and institution, number of problems solved and penalty time, and one cell per problem showing tries and the time of the solving try (a bare number of tries when unsolved, 0 when untried). Rank is shown for 42 teams; five rows carry no rank, one team tied with the row above and four teams with no problem solved. The eleven problems are headed by short names (ducks, exciting, flipping, haybales, longlong, moveaway, rainbow, security, stars, treasure, unsatisfy), not letters. Cell colours follow a legend (Solved first, Solved, Tried, incorrect, Untried), team cells are shaded by category (CofC, FIU, KSU, UWF, Self-Registered), and a summary row at the bottom totals each problem. UCF Raptor, from the University of Central Florida, is first with 10 solved and a penalty of 1645.
