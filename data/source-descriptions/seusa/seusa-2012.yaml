    Category page of Baekjoon Online Judge titled '2012 Southeast USA Regional Programming Contest', under the source ICPC, Regionals, North America, Southeast USA Regional, with a Korean-language interface. Two tables list the divisions: Division 1 with problems A to J (numbers 4781, 4699, 4698, 4782, 4702, 4703, 4783, 4704, 4784, 4785) and Division 2 with problems A to J, which share six problems with Division 1 and add four more, Dueling Philosophers, Paint Me, Party Games and Reverse Nonogram. Each row gives the number of users who solved the problem, submissions and solving percentage. Several titles are in Korean.

    In Division 1, problem G (number 4783) has an empty title and no statistics in our copy. The statements are on separate pages that are not part of it.
