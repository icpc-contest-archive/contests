    Category page of the ICPC Live Archive for Regionals 2012, North America, Southeast USA, as it stood on 19 October 2021. It lists ten problems numbered 6193, 6194, 6197, 6198, 6199 and 6219 to 6223, with the titles of the Division I problems from Candy Store to Walls, and for each the total submissions, percentage solved, number of users and percentage of users who solved it.

    The page holds titles and statistics only, with no statements and no problem letters. The site menu and a login form surround the list.
