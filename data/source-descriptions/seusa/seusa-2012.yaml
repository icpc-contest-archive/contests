  description: |-
    Final scoreboard of the Southeast USA regional as a PDF of 9 pages, headed 'Scoreboard 2012 ACM ICPC Southeast USA Region' and 'using DOMjudge', dated 20 Nov 2012, with one board for each division: Division I on 5 pages and Division II on 4. Each board is labelled 'final standings' and gives rank, team name, number solved and total time, then one column for each of ten problems (A1 to J1 in Division I, A2 to J2 in Division II) with the attempts and, in parentheses, minutes and penalty minutes. The affiliation column has a heading but its cells are empty in our copy. Division I lists 59 teams, led by UCF Phyre with 7 problems and 890 minutes; Division II lists 47, led by kvm with 3 problems and 328 minutes. Each board ends with a summary row, and a legend marks FIT, GaTech and UWF participants and pickup teams.

    Teams that solved nothing are listed after the ranked ones; only the first of them in each division carries a rank.
