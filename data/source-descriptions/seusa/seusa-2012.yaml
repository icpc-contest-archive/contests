  teams: 105
  description: |-
    Final standings of the 2012 Southeast USA Regional Contest: 105 teams with rank, team name, institution, problems solved and total time, followed by medal, citation and site citation columns. The medal column names the division and place, for example 'Division 1 First Place'; 59 teams are in Division 1 and 46 in Division 2. The rank column runs from 1 to 102, with ties sharing a rank. The site citation column gives placings at the FIT, GIT and UWF sites. UCF Phyre of the University of Central Florida is first with 7 problems and 890 minutes.

    There are no per-problem results and no attempt counts. The scoreboard PDF lists 47 teams in Division II, one more than this page.
