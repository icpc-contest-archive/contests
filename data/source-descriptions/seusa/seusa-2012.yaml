  description: |-
    Problem set for Division I of the Southeast USA regional as a PDF of 16 pages: a cover giving the title, the date 10 November, 2012 and the hosts (Florida Institute of Technology, Georgia Institute of Technology, University of West Florida), a contents list, then ten problems A to J. They are 'Candy Store', 'Collision Detection', 'Component Testing', 'Do It Wrong, Get It Right', 'Funhouse', 'A Terribly Grimm Problem', 'Heads or Tails', 'Tsunami', 'Unhappy Numbers' and 'Walls'.

    Each problem has a statement in English with input and output format and a sample input and sample output. The Division II problems, test data and solutions are not in it. The file's embedded title property reads '2010 ACM ICPC'; the printed cover names 2012.
