  contest_date: '2012-11-10'
  description: |-
    Website of the 2012 ACM Southeast USA Programming Contest, in English, by the regional organisers at Florida Tech. Our copy holds 3 pages: the front page, a page on the contest environment, and the scoreboard as a PDF.

    The front page announces two divisions with separate problem sets, Division I qualifying for the World Finals. It names the contest day as Sat, 10 Nov 2012, with a practice round from 11am to noon EDT and the contest from 1:30pm to 6:30pm EDT, at three linked sites: Florida Tech in Melbourne, Georgia Tech in Atlanta and the University of West Florida in Pensacola. It gives the registration fee and states that DomJudge is the contest management software. The environment page describes the Ubuntu-based USB contest image. The front page links to pages on the contest, the Florida Tech schedule and the fee form; these are not in our copy. The live scoreboard link leads to another server.
