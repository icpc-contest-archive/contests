  description: |-
    Standings of the 2007 ACM Southeast USA Programming Contest sponsored by IBM: 76 teams, each given as institution and team name. The 57 ranked teams carry a rank, a citation (First Place to Forty-seventh Place, with ties sharing a rank) and the number of problems solved, from ten for the first place down to one. Another 19 teams follow without a rank or number solved under the citation Honorable Mention. The time column is empty for all 57 ranked teams. There is no per-problem detail.
