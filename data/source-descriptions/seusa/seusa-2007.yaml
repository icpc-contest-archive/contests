  description: |-
    Front page for the 2007 ACM Southeastern Programming Contest, Saturday 13 October 2007, held jointly at three sites: the page carries the logos of the University of South Alabama and Georgia Southern University and a linked Florida Tech logo, and has directions for all three. Its links lead to the results of the 2007 contest as a PDF, an agenda for the Georgia Southern site as a PDF, team registration, the 2007 contest environment and Melbourne accommodations pages on the cs.fit.edu site, hotels for Statesboro, Mobile and Melbourne, directions to the three sites, and the 2006 contest results, pictures and problems.

    Our copy holds 61 saved files, 27 of them pages, but not the 2007 documents: the links to the 2007 results PDF and the Georgia Southern agenda PDF are 404 errors in it. The 2006 links did resolve, so the copy holds the 2006 results page, the 2006 problem set PDF and an agenda for 27 and 28 October 2006. Besides these, the copy holds a programming environment page, a Java input example and the host's class pages, which have nothing to do with the contest.
