    Some team names carry a site tag such as KSU(D2) or CofC(D2), and the page lists the four site categories CofC(D2), FIU(D2), KSU(D2) and UWF(D2). A summary row gives totals per problem, a colour legend marks first solves, and the page ends with 'Last Update: Mon 18 Nov 2019 16:35:25 EST'. Style sheets and scripts are kept in our copy.
