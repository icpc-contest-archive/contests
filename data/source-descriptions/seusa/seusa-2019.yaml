  title: 2019 ACM Southeast USA Programming Contest
  language:
  - en
  contest_date: '2019-11-09'
  description: |-
    Website of the 2019 ACM Southeast USA Programming Contest. Our copy holds three pages: the front page, a page explaining what the contest is, and the registration and fee payment form.

    The front page announces two divisions with a different problem set for each, the contest on Saturday 9 November 2019 with a practice round from 11am to noon and the contest from 1:30pm to 6:30pm EST, and four sites: College of Charleston, Florida International University, Kennesaw State University and the University of West Florida. It names the organisers, gives the registration fee ($50 per person before 12 October 2019), the GNU/Linux environment with the permitted languages, and DOMjudge as the contest management software. It also states that Division 1 qualifies a team for the North American Championship in Atlanta in February 2020. The last paragraph links to the final results of division I and division II as PDF files; those PDFs are not in our copy.
- url: http://ser2019.cloudcontest.org/SER2019D1.html
  read: '2026-11-16'
  rubric: 1
  copy: seusa/seusa-2019/scoreboard/2026-09-01-live-309dbfb1/SER2019D1.html
  title: SER 2019 Division I final standings
  language:
  - en
  teams: 36
  problems: 11
  times: true
  tries: true
  description: |-
    Final scoreboard of Division I from DOMjudge: 36 teams, each with team name, institution, number of problems solved and total time, and for each of the 11 problems the number of tries and, where solved, the solve time in minutes. The first 28 rows carry a rank; the last eight teams, all with 0 solved, have no rank. The problems are labelled by name (Cache, Carryless, Elven, SwapFree, FixedPoint, Interstellar, Jumping, Levenshtein, Maze, OneOfEach, Windmill), not by letter. Georgia Tech 5 is first with 10 problems solved.

    Some team names carry a site tag such as FIU(D1) or KSU(D1), and the page lists the four site categories CofC(D1), FIU(D1), KSU(D1) and UWF(D1). A summary row gives totals per problem, a colour legend marks first solves, and the page ends with 'Last Update: Mon 18 Nov 2019 16:42:28 EST'. Style sheets and scripts are kept in our copy.
