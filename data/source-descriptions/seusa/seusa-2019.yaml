    Division 1 problem set as a PDF of 21 pages. The cover and contents page list the 11 problems, from Carryless Square Root to Windmill Pivot, in that order and without letters, and name College of Charleston, Florida International University, Kennesaw State University and the University of West Florida as hosts. Each of the 11 problems has a statement in English with its time limit, input and output format and sample input and output; the page footer reads 2019 ICPC Southeast USA Regional Programming Contest.

    No test data or solutions.
