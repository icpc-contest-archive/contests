  description: |-
    Final standings of the Southeast USA regional: 121 teams of both divisions in one table with rank, team, institution, problems solved, time and a citation. Division 1 teams come first (places First Place to Twenty-seventh Place, then seven teams sharing Twenty-eighth Place), followed by Division 2 teams starting at place 31 and ending with 54 teams marked Honorable Mention. The last three rows, with 0 solved, have no rank and no citation. Georgia Tech 5 of the Georgia Institute of Technology is first with 10 solved in 2054 minutes.

    The divisions are not labelled in the table, and there are no per-problem results.
