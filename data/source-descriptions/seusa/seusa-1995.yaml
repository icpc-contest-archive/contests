  description: |-
    Website of the UCF Programming Team (University of Central Florida), in English; our copy holds 150 pages, some of them as both an http and an https capture of the same address. The ICPC record page gives, for each season from 1982-1983 onward, the places of UCF's own teams at the regional and at the finals, for example 1995-1996: regionals 2nd, 7th and 8th, finals 30th (out of 43). It does not list other teams or give an order of the teams in any regional.

    Other pages give the team's records in NAIPC, IEEE SoutheastCon, Mercer and other contests, and the lists of past and developmental team members with one page per member, as well as pages on the first team and on continued success.
