  title: 2010 ACM Southeast USA Programming Contest
  language:
  - en
  contest_date: '2010-11-06'
  description: |-
    Website of the 2010 ACM Southeast USA Programming Contest, held on Saturday 6 November 2010 at three sites: Armstrong Atlantic State University in Savannah, Georgia, Florida Tech in Melbourne, Florida, and the University of West Florida in Pensacola, Florida. Our copy holds 6 pages. The front page names the regional contest director, the site directors and the chief judge, and gives the practice round (11am to noon) and contest times (1:30pm to 6:30pm), the registration rules and the fee of $40 per person, and the languages allowed.

    Further pages: a general description of the ACM ICPC and the Southeast region, the schedule at Florida Tech, a two-page PDF schedule for the Armstrong Atlantic site, a fee payment form with a list of institutions, and a page on the GNU/Linux contest environment with the compiler options used by the judges.

    The front page links to a live scoreboard on another server and to a PDF of the final standings; neither is in our copy.
