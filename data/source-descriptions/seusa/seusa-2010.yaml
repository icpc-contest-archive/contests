  description: |-
    Problem set of the contest as a PDF of 13 pages in English. The cover names the contest and the date, 6 November 2010, lists the contents and names Florida Institute of Technology, Armstrong Atlantic State University and the University of West Florida as hosts. Ten problems follow: A Balloons, B Bit Counting, C Data Recovery, D Equal Angles, E Maximum Square, F Palindrometer, G Profits, H Roller Coaster, I Skyline and J Underground Cables.

    Each problem has a full statement with input and output format and a sample input and output. The pages carry a running footer numbered Page 1 of 12 to Page 12 of 12, the cover being unnumbered. No test data or solutions.
