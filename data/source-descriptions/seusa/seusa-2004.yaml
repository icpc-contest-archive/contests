  copy: seusa/seusa-2004/judge-livearchive/20150309-wayback-a5c335d2/3037.pdf
  title: 3037 - Gate Allocation
  language:
  - en
  problems: 1
  pages: 3
  description: |-
    Problem statement of 3037, Gate Allocation, as a three-page PDF in English with the line "North America - Southeast - 2004/2005" under the title. For each airport with n gates (2 to 30) and a gate-to-gate distance matrix, planes arrive one by one and the task is to assign each to a free gate so that the average connecting-passenger distance is as large as possible. It lists eight simplifying rules, and has the input and output format and a sample with a 5-gate distance matrix. It ends with the line "Southeast 2004-2005".
