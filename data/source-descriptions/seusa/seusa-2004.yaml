    Problem statement of 3035, Air Express, as a two-page PDF in English with the line "North America - Southeast - 2004/2005" under the title. A company charges a rate per pound that falls with package weight, and for each customer package the task is to print the lowest price reachable by adding weight and the minimum weight to add. It includes a rate table, the input and output format and a sample. It ends with the line "Southeast 2004-2005".
