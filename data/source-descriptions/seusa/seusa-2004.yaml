  title: 3039 - LED Modding
  language:
  - en
  problems: 1
  pages: 3
  description: |-
    Problem statement of 3039, LED Modding, as a three-page PDF in English with the line "North America - Southeast - 2004/2005" under the title. Given a USB voltage, the voltage and current an LED expects and a list of named resistors, the task is to print the optimum resistance to add and the name of the resistor that comes closest and still works, or IMPOSSIBLE, or -- when none is needed. It states Ohm's law, and has the input and output format and a sample. It ends with the line "Southeast 2004-2005".
