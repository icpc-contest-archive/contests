  pages: 2
  description: |-
    Problem statement of 3036, Cube, as a two-page PDF in English with the line "North America - Southeast - 2004/2005" under the title. A 10x10 sheet holds exactly six red squares, each sharing a side with another red square, and the task is to decide whether the red area can be folded into a cube, printing "red squares can be folded into a cube" or "impossible" for each board. It shows one foldable and one non-foldable example, and has the input and output format and a sample of two boards. It ends with the line "Southeast 2004-2005".
