  contest_date: '2004-10-23'
  description: |-
    Front page of the 2004 ACM Southeast USA Programming Contest site, in English. It states that teams of three students solve a set of problems in five hours, that teams from Mississippi, Alabama, Georgia, South Carolina and Florida compete, and that the contest is held on Saturday 23 October 2004 on the Florida Tech campus in Melbourne, Florida. Short sections cover accommodations, equipment each team must bring, the contest environment (C, C++, Java and Pascal, on GNU/Linux), registration (45 dollars per person, by 1 October 2004) and the schedule.

    The page links to a live scoreboard, the final standings, the officially posted results and the results of all regionals. Our copy is this one page only; the pages it links on the same site and the standings file are not part of it.
