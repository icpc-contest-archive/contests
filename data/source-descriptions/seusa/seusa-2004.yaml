  description: |-
    Problem statement of 3041, Packing Passengers, as a two-page PDF in English with the line "North America - Southeast - 2004/2005" under the title. Two aircraft types with an operating cost and a capacity are available, and for n passengers (up to 2,000,000,000) the task is to find how many of each type fill every plane exactly at minimum total cost, preferring more planes of type A on ties. It has the input and output format and a sample. It ends with the line "Southeast 2004-2005".
