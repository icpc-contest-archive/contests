  description: |-
    Problem statement of 3043, Tennis Anyone?, as a three-page PDF in English with the line "North America - Southeast - 2004/2005" under the title. Point-by-point scores called out during tennis games are read for each match, and the task is to print the players' names, the games won in each set and the winner, or "Match in progress". It reproduces the rules of serving, game, set and match scoring, and has the input and output format and a sample. It ends with the line "Southeast 2004-2005".
