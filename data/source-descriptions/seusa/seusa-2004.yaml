  title: 3040 - Marching in the Corporate Parade
  language:
  - en
  problems: 1
  pages: 2
  description: |-
    Problem statement of 3040, Marching in the Corporate Parade, as a two-page PDF in English with the line "North America - Southeast - 2004/2005" under the title. Employees with supervisor relations (up to 10 employees) march in groups so that a supervisor's group is in front of the groups of the subordinates, and the task is to print the number of possible parade line-ups for each data set. It lists the rules, shows the line-ups for a five-employee example, and has the input and output format and a sample. It ends with the line "Southeast 2004-2005".
