  title: 3044 - Where's Ivan?
  language:
  - en
  problems: 1
  pages: 3
  description: |-
    Problem statement of 3044, Where's Ivan?, as a three-page PDF in English with the line "North America - Southeast - 2004/2005" under the title. For hurricane records and the position, direction and speed predictions of several models, the task is to find the model with the smallest overall error, defined as the sum of absolute differences in latitude, longitude, direction and speed. It explains how differences in longitude and direction are taken as the smaller angle, and gives the formats of the HURRICANE and MODEL records. It ends with the line "Southeast 2004-2005".
