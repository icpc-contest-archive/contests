  language:
  - en
  problems: 1
  pages: 3
  description: |-
    Problem statement of 3038, Jigsaw, as a three-page PDF in English with the line "North America - Southeast - 2004/2005" under the title. Up to 20 irregular jigsaw pieces given as character bitmaps must be reassembled into a rectangle, which the statement guarantees is possible in only one way, and the task is to print the rectangle of letters. It has a worked example of pieces lettered A to E forming an 8 row by 12 column rectangle, the input and output format and a sample. It ends with the line "Southeast 2004-2005".
