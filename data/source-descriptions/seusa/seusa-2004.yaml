  description: |-
    Problem statement of 3042, Something About Airplanes, as a three-page PDF in English with the line "North America - Southeast - 2004/2005" under the title. A simulation of two facing hangars with given capacities: planes arrive, depart or are displayed according to commands, and the task is to print the messages and hangar contents. It explains the parking and blocking rules with a worked example of six planes, and has the input and output format and a sample. It ends with the line "Southeast 2004-2005".
