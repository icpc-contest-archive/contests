  title: The 2025 ICPC Greece Collegiate Programming Contest
  language:
  - en
  teams: 76
  description: |-
    Final standings: 76 teams with rank, team, institution, problems solved, time, medal and a citation. The first nine places carry gold, silver and bronze medals (three each); of the other teams, 58 carry the medal entry Ranked and nine Honorable. Places 1 to 43 are cited with an ordinal place name (First Place to Forty-third Place) and the 33 teams from place 44 to 76 are cited Honorable Mention. First place is CodeBlooded of the National Technical University of Athens with six problems solved and a time of 377. Eleven teams have zero solved. No per-problem results.
