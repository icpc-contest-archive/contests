  description: |-
    Final standings of the contest on Codeforces (gym): a scoreboard of 79 teams against nine problems A to I. Each row gives institution and team name, problems solved, penalty, and for each problem the number of tries (+ for solved, - for unsolved) and the time of the accepted run; a last row gives accepted and tried counts per problem. Teams from Greece, Cyprus and the American University of Beirut are on the same board. First place is a team from Neapolis University Pafos with nine problems solved and 916 penalty. The page has a switch to show unofficial participants. Ties at the bottom share a rank (two teams are ranked 78).
