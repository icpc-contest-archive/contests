- url: https://grcpc.upatras.gr/
  read: '2026-11-16'
  rubric: 1
  copy: greece/greece-2025/website/2026-09-04-live-3d9dea88
  title: GRCPC by Algoforum
  language:
  - en
  description: |-
    Website of the Greek Collegiate Programming Contest (GRCPC), run by Algoforum, a group of volunteers at the University of Patras, in English. Our copy holds 23 pages and documents, six of them PDFs; a few addresses repeat the same page. The front page now announces GRCPC 2026 (24 October 2026) in six Greek cities, Cyprus and online, so it is the series site as it stood after the 2025 edition rather than a page of that edition alone.

    The page for GRCPC 2025 thanks the participants and has photographs from the Athens, Chania, Ioannina, Kavala, Patras and Thessaloniki sites, a link to the competition problems, sponsors and the organising team. The More Information page has the rules, the route to the regional contest, the schedule and venues, and the contest environment. Other pages cover registration, sponsors, a Training Camp 2025 for SEERC, past editions (2023, 2024, a 2024 BootCamp), contact and About us.

    The PDFs are three 2025 scoreboards (Greece universities, Cyprus universities, online standings) with team, university, problems solved, penalty and medal, each headed by a note that the global standings are unofficial; two 2024 scoreboards; and an 8-page GRCPC 2024 editorial.
