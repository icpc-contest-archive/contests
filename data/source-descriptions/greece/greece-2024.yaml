    Final standings of the contest on Codeforces (gym): a scoreboard of 20 teams against eight problems A to H. Each team row gives the institution and team name, problems solved, penalty, and for each problem the number of tries (+ for solved, - for unsolved) and the time of the accepted run. A final row gives accepted and tried counts per problem. First place is a team from the National Technical University of Athens with eight problems and 1196 penalty.

    The page has a switch to show unofficial participants; one of the 20 rows is listed under the institution 'Other'.
