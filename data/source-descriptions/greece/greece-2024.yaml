    Dashboard page of the contest on Codeforces (gym), marked Finished. It lists eight problems A to H (The Binary Chicken Farm, Bureaucracy, Fair Split of the Golden Tablet, Deciphering Ancient Symbols, Generation and transmission network, Anomia, Airport Departures' Optimization, The magical forest of Seih Sou) with time and memory limits and the number of solvers. A text about the contest says it is organised by the Algoforum team at the University of Patras and held at four venues. A materials list links two PDFs: an announcement for problem C and GRCPC_2024_Editorial.

    Our copy holds only the dashboard: no problem statements and no editorial text.
