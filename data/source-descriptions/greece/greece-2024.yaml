  copy: greece/greece-2024/website/2026-09-05-wayback-fa293cab
  title: GRCPC by Algoforum
  language:
  - el
  - en
  description: |-
    Website of the Greek Collegiate Programming Contest (GRCPC), run by Algoforum, a group of volunteers at the University of Patras, in English and Greek. Our copy holds six pages and a robots.txt: the English front page, Contact and About us, and three Greek pages (front page, information, registration).

    The English front page is the older one: it looks back on GRCPC 2023 and links to a 2023 page. The Greek pages are about the 2024 edition. The front page announces GRCPC 2024 and a first GRCPC BootCamp, the registration page gives 18-19 October 2024 as the date and a five-hour contest, and the information page has the rules, the venues (Patras, Thessaloniki, Athens, Ioannina, others online) and the path from the national round to the regional and the World Finals. Room details are marked as to be announced. About us lists the organising team. Our copy has no results, team list or problems for the 2024 edition.
