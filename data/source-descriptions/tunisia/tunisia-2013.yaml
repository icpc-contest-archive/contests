  description: |-
    Archive page of the Tunisian Collegiate Programming Contest website (ACM TCPC National Steering Committee) for the 2013 edition, in English. It says the first Tunisian Collegiate Programming Contest was hosted in Tunis on 05-06 October 2013, with 61 teams from 20 institutions and 20 "IOI" (as the page puts it), and that the problem set had 10 problems, A to J, listed by name (Hamza to Ahmed Aly). It states that all but three problems were solved and that 57 teams from 19 institutions solved at least one. It names the first three teams with their institutions, the first two from the Higher School of Communication of Tunis, and an IOI winner. A link leads to the detailed standings on another server, and the problem set and each of the ten problems link to files on Google Drive.

    Our copy holds this one page. The site menu (home, rules, schedule, awards, archive and others) links to pages not in our copy, the Google Drive files are not in our copy, and the images are not saved.
