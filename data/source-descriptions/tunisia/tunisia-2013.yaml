    Standings of the 2013 Tunisian Collegiate Programming Contest (TCPC): 61 teams from 20 institution names, with rank, team name, institution, problems solved, total time and a citation. The Higher School of Communication of Tunis's Sup'Com Champions are first with 4 solved. Ranks 1 to 30 carry the citations First to Thirtieth Place; 31 teams carry Honorable Mention, and the last four share rank 58 with 0 solved. 57 teams solved at least one problem. No per-problem detail.
