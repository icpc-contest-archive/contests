  description: |-
    Standings: 58 teams with rank, team name, institution, problems solved, total time and a citation. Masters of the Higher School of Communication of Tunis is first with 7 solved and a time of 1052. The citation column reads First Place to Twenty-ninth Place for ranks 1 to 29 and Honorable Mention for the other 29 teams; the last four teams share rank 53 with no problems solved. Three teams from one preparatory institute are named with an IOI prefix and are ranked among the others without a separate mark. No per-problem results.
