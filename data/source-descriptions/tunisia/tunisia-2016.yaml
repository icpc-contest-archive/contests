  contest_date: '2016-03-24'
  description: |-
    Website of the ACM Tunisian Collegiate Programming Contest (TCPC), by its National Steering Committee. The home page announces the 4th edition on March 23-24, 2016 at Sup'Com and the El Gazala Technopark, with ATSN as partner, and has sections on the event, a link to the event program, a photo gallery from the previous edition, a promotional video, the steering and executive committee members by university, a rule book (general rules, eligibility, appeals, problem format, programming, ranking, PC^2) and a venue section. Our copy holds 18 distinct pages of the site and two PDFs, in English except the French PDF.

    The PDFs are a three-page French communique on the 4th edition (about sixty teams of three, registration until 29 February 2016, a fee of 150 dinars per team, eligibility rules) and a one-page English program: registration, opening and practice on 23 March, the contest session on 24 March 2016 from 08:30 to 13:30, then closing and awards ceremonies. The program PDF has no text layer; it is an image.

    The other pages (rules, contest format, ranking, awards, PC^2, register, team) carry the earlier template with a 2015 copyright; the register page announces the third edition. There are no results or problems in the copy. The copy also holds two pages saved from the www host that are unrelated pages in Chinese, plus hosting-provider placeholder pages.
