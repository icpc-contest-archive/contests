  description: |-
    Website of the Tunisian Collegiate Programming Contest (ACM TCPC), run by the ACM TCPC National Steering Committee. The home page announces the 2015 Tunisian Final at Technopark Elgazala, March 18-19, 2015. The pages are in English and cover an about page, registration (teams of three students, at most five teams per institution, a registration deadline in January 2015), rules and regulations, rules for appeals, contest format, eligibility, problem format, how to program solutions, how teams are ranked, awards (gold medals for places 1 to 4, silver for 5 to 8, bronze for 9 to 12), the PC^2 contest system, media and contacts.

    The menu also has entries for the 2013 and 2014 contests; the 2013 page is in our copy and names 61 teams from 20 institutions, the ten problems and the top three teams. Our copy holds 19 pages (the home page is saved under two addresses). The 2014 entry leads to another address and is not in it. It has no results or problem statements for 2015.
