    Standings: 38 teams with rank, team name, institution, problems solved, total time and a citation. FakeTourists (Institut Préparatoire aux Etudes d'Ingénieurs de Tunis) is first with 5 solved and a time of 553, ahead of Master Code with 5 solved. The citation column reads First Place to Nineteenth Place for ranks 1 to 19 and Honorable Mention for the other 19 teams; the last seven teams share rank 32 with no problems solved. No per-problem results.
