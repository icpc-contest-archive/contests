    Statement of a single problem in English, a PDF of two pages made with pdfTeX, headed "Not Clean Queries" with standard input and output, a time limit of 4 seconds and a memory limit of 1024 megabytes. It prints no problem letter and no contest name. After the statement come Input, Output, one example and a Note on page 2 defining subarray, subsequence and prime factorization; the footer numbers the pages. The task is to count, for each query, the subsequences of a subarray whose product has an odd power of exactly the given primes and an even power of all others, modulo 10^9+7.
