    News post on the website of Ecole Polytechnique de Sousse, in English, headed TCPC 2K24. It reports a visit of members of the Arab & African Collegiate Programming Contest (ACPC) committee to the school's campus, with the school's director and the president and general secretary of the Tunisian Committee (TCPC) present. It says the talks covered future collaboration and that the school looks forward to making TCPC 2024 a success.

