    News post on the website of Ecole Polytechnique de Sousse, in French, headed TCPC. It describes the Tunisian Collegiate Programming Contest as a contest in which teams of three solve algorithmic problems with languages such as C, C++, Java and Python, and states that the 2024 edition was held on 4 and 5 September in Hammamet and had 70 teams.

