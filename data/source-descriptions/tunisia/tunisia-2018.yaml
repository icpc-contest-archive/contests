  contest_date: '2018-06-24'
  description: |-
    One-page website of ACM TCPC 2018, hosted by the Ecole Nationale des Ingénieurs de Sousse (ENISo), in English. It gives the dates as 23-24 June 2018, with registration, opening ceremony and a training session on Saturday and the official competition from 10:00 to 15:00 on Sunday 24 June, followed by deliberation and the closing ceremony and awards. It also covers the format (teams of three, five hours, around 13 problems, Java, C++ or C), registration and the 150 dinar fee per team with a deadline of 20 June 2018, the venue with a map, sponsors, a photo gallery, links to press and TV coverage, and a FAQ on TCPC, ACPC and ICPC. The page states 120 teams, 360 contestants and more than 50 coaches.

    Our copy holds the home page under two addresses: the main version and an index.html version that lacks the photo gallery section (and its menu entry) and the first two press items. There are no results or problems; the registration link leads to the ICPC registration site, outside our copy. Images, style sheets and scripts are saved with the copy.
