  title: TCPC 2K25 - Ecole Polytechnique de Sousse
  language:
  - fr
  description: |-
    News post on the website of Ecole Polytechnique de Sousse, in French, headed TCPC 2K25. It announces the 2025 edition of the Tunisian Collegiate Programming Contest: two days, a 5-hour problem-solving contest for university teams and high-school students, with the aim of qualifying for the ACPC regional in Egypt, and a Teens version for high-school students. It says the contest is carried by the school.

    The post gives no date for the contest and has no results, team list or problems. Our copy is this one post with the school's menus and footer.
