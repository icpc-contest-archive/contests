    Scoreboard of the 2025 ICPC Tunisian Collegiate Programming Contest produced by PC^2 (the footer names CSUS PC^2 9.11 build 20240507; "Installed and configured by ACPC"), titled only TCPC: 47 teams ranked 1 to 47, each with name and an abbreviation of the institution in brackets, number solved, time, and for each of the problems A to N a cell of the form attempts/minute ("2/110", "0/--" when unsolved), plus a column Total att/solv. DigaDiga (ISI) is first with 8 solved and a time of 580. No team has a solved cell for problems B, D, F, H and I. A row under the headings names a colour for each problem, and a bottom row gives submitted, first yes and total yes per problem. A legend explains the cell colours for first to solve, solved, attempted and pending judgement.

