  description: |-
    Solution slides in Chinese, a PDF of 49 pages made with LaTeX Beamer. The title slide reads 2023 国际大学生程序设计竞赛亚洲区域赛（南京站） (2023 Guójì Dàxuéshēng Chéngxù Shèjì Jìngsài Yàzhōu Qūyùsài (Nánjīng Zhàn), "2023 International Collegiate Programming Contest Asia Regional Contest (Nanjing site)"), names SUA 程序设计竞赛命题组 (SUA Chéngxù Shèjì Jìngsài Mìngtí Zǔ, "SUA programming contest problem-setting group") as author and gives the date 5 November 2023.

    An overview slide sorts the problems into five difficulty stages, from Easy (I, F, C) to Hard (H, J, B). All 13 problems follow in that order, under their English titles, with 1 to 8 slides each; each problem opens with a 题意 (tíyì, "problem summary") restating the task, followed by the solution, and all but C and B state a complexity. A closing slide refers readers to the SUA wiki for written solutions and annotated reference code, and a "Thank you!" slide ends the deck.
