  description: |-
    Standings page for the 2007 ACM Asia Programming Contest - Nanjing: 1307 teams listed as university and team name, with citation, number of problems solved and time. Twenty-four rows carry a rank and a place citation, First Place to Nineteenth Place, with ties; the other 1283 rows are Honorable Mention without rank. The best teams solved four problems; the first place is Fudan University. No per-problem detail. Some entries (university and team names) are written in Chinese characters.
