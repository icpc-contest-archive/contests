  description: |-
    Official standings published by the Nanjing site, hosted by Nanjing University of Aeronautics and Astronautics and sponsored by IBM, dated 28 October 2007 and naming Fudan University's Amethyst as champion. A table of 46 teams gives rank (1 to 33, with ties), university and team name, problems solved and time; the best teams solved four problems. Times are filled in for 24 teams and blank for the 22 teams below them, who solved two. A second table lists 44 further teams as Honorable Mention, without rank. A note explains that official ranks follow the Asia-Specific and Nanjing Site rules, ranking the top team of each university first and tying other teams of the same university with the next ranked team of another university. Links to three photo archives are on the page.
