  contest_date: '2007-10-28'
  description: |-
    Website of the 2007 ACM Asia Programming Contest Nanjing site, hosted by Nanjing University of Aeronautics and Astronautics and sponsored by IBM, in Chinese with a shorter English section. Our copy holds 33 files, 32 of them pages. The Chinese pages cover the background of the contest, the rules, the selection of teams for the on-site contest, the schedule of 26 to 28 October 2007 (the contest itself on 28 October), sponsors, a review of a provincial league held in May 2007, a campus map, links and contacts. A news list holds announcements about the online preliminary, registration, accommodation and a live broadcast of the contest; six of the news items are in our copy. The English pages give a description of the contest, important dates, registration, links and contacts.

    The official standings of the on-site contest are inside in a Chinese and an English version, and a closing page says the contest is over. Login pages for teams and administrators are in our copy as bare forms.
