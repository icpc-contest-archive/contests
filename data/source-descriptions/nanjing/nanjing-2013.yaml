  description: |-
    Online judge of Nanjing University of Science and Technology (NJUST Online Judge), mainly in Chinese. Our copy holds 150 files, 149 of them pages: the front page, a FAQ, login pages, 125 pages of problems with statements, one page of the contest list, 11 pages of individual contests with their problem lists, two pages showing problems of the HDU judge, a page on the history of the judge's development, a page headed Judge In All and a search page. The 11 contests started between 4 May and 12 July 2012. One page, headed ACM-ICPC Asia Nanjing 2013, has a menu and a news list with an item about a 12 May invitational, an item about hotel reservation and a link to a PDF of the 2013 NJUST invitational; nine fields on it read 'undecided'. Nothing in our copy covers the Nanjing regional contest of November 2013.
