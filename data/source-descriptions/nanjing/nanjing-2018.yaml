    Contest page of a replay contest on the Luogu judge, in Chinese, scheduled for 28 August 2026 from 13:00 to 18:00. It states that the contest uses the original problems and data of the on-site contest with Chinese statements, provided with the help of Jisuanke, and gives the rules: ICPC scoring with a 20-minute penalty per failed submission before a problem is solved, teams of one to three, a scoreboard frozen for the last hour, and a section on how to have the award verified on Luogu.

