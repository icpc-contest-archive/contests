    List of 5115 submissions in JSON, with no team names or ranks. Each run gives an id, a team id, a problem number (0 to 12, the thirteen problems A to M of the configuration), a time in milliseconds from the start of the contest, a result and a language. 1286 runs are marked ACCEPTED, 3210 WRONG_ANSWER, 428 TIME_LIMIT_EXCEEDED, 154 RUNTIME_ERROR and 37 COMPILATION_ERROR. The runs come from 373 teams and the latest is at 17,992,399 ms, just under the five hours, so the freeze hour is included. Language is C++ in 5072 runs, Python 3 in 42 and Kotlin in 1. A scoreboard can be worked out from it together with the team list, but the file does not show one.
