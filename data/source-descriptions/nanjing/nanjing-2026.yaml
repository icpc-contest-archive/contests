  contest_date: '2026-11-08'
  description: |-
    Website of the ICPC Beijing headquarters (Peking University, School of Computer Science), the body that runs the ICPC Asia East Continent regional contests in China, in Chinese. Our copy holds 67 pages and documents: the front page, introduction, advisory committee, announcements, award lists, sponsors and links, and the per-station pages of the 2025 and 2026 seasons, with an allocation notice for each 2026 regional station (Wuhan, Nanjing, Shenyang, Shanghai, Nanchang, Hong Kong, Xi'an, Chengdu) and for the Hangzhou EC-Final, and an invitation or registration notice for all of them except Hong Kong and Hangzhou, so most of it is not about Nanjing.

    For the 51st Nanjing regional it holds three documents. A two-page notice dated 4 September 2026 from the organising committee at Nanjing University of Aeronautics and Astronautics gives the contest days as 7 and 8 November 2026 at the Jiangjun Road campus, a capacity of about 320 teams, and six rules for awarding official-team places, with at most four teams per school. A three-page registration guide covers team rules (three students and one coach), the two registration systems, the planned schedule (7 November check-in, opening ceremony and warm-up; 8 November 09:30 to 14:30 contest, 16:00 to 17:00 closing ceremony) and the planned 33 gold, 66 silver and 99 bronze awards. A one-page invitation letter is an image without a text layer.

    The page of award lists for the 2025-2026 season links to a PDF for each station, Nanjing included; those PDFs are not in our copy. There are no results or problems of the Nanjing contest in it.
