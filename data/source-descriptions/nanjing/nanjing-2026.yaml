  title: “华为杯”第51届ICPC亚洲区域赛（南京）在我校举办
  title_en: The "Huawei Cup" 51st ICPC Asia Regional Contest (Nanjing) held at our university
  language:
  - zh
  contest_date: '2026-11-08'
  description: |-
    News item of the School of Computer Science and Technology and School of Software of Nanjing University of Aeronautics and Astronautics, dated 10 November 2026, about the contest it hosted on its Jiangjun Road campus on 7 and 8 November. It says this was the tenth time the university hosted the event, names the guests at the opening ceremony (university, Jiangsu youth science centre and company representatives), and says the contest began on 8 November with teams of three working for five hours.

    It reports 33 gold-medal teams and the first three places, in order: Tsinghua University, Peking University, Zhejiang University. It gives the field as 332 official teams from 185 universities, including 2 from Mongolia and 15 from Hong Kong, plus 42 invited teams from companies, alumni and high schools. No other ranks or scores.
