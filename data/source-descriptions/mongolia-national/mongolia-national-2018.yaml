- url: https://news.num.edu.mn/?p=49855
  read: '2026-11-23'
  rubric: 1
  copy: mongolia-national/mongolia-national-2018/website/2026-11-22-live-8744ea1d
  title: Оюутны програмчлалын үндэсний 10-р олимпиад амжилттай зохион байгуулагдлаа
  title_en: The 10th National Student Programming Olympiad was held successfully
  language:
  - mn
  contest_date: '2018-04-21'
  teams: 8
  problems: 10
  description: |-
    News article of the National University of Mongolia (МУИС), dated 2018-04-24, in Mongolian, titled "Оюутны програмчлалын үндэсний 10-р олимпиад амжилттай зохион байгуулагдлаа" ("The 10th National Student Programming Olympiad was held successfully"). It sets out the contest rules (teams of three students and a coach, five hours, ten problems), says the olympiad was held at МУИС from 19 to 23 April with the results meeting on 23 April 2018, and that 19 teams, among them a team of graduates and one of school pupils, wrote programs on 21 April 2018 from 12:00 to 17:00. It names the sponsors Cosmo Trade LLC (Космо трейд ХХК) and the Informatics Development Fund (Информатик хөгжүүлэх сан).

    A results table lists 8 teams with rank, team name, institution, number of problems solved and time in minutes, from SEAS-2 of МУИС-ХШУИС (5 problems, 699 minutes) to bilbo_egg (1 problem); the other teams are not listed. The text names the top three, SEAS-2, SEAS-1 and MJEED, and says the first two will represent the country at the Asian contest in October.

    Our copy holds the article and one category listing page of the news site; the article's 13 photographs are not in it.
