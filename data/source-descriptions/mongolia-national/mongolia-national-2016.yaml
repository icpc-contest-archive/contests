  description: |-
    News article of the National University of Mongolia (МУИС), dated 2016-04-12, in Mongolian, titled "Оюутны программчлалын үндэсний VIII олимпиад" ("8th National Student Programming Olympiad"). After an introduction to the international student programming contest and Mongolia's earlier results in Asia, it reports that the 8th national olympiad was held at МУИС from 8 to 11 April 2016: 13 teams of 9 universities and colleges, plus one team of graduates and one of secondary-school pupils taking part on an individual basis, 15 teams in all, with ten problems.

    A list gives eight teams with their institution, number of problems solved and time in minutes; the graduates' team solved the most (7 problems). The top three university teams are then named: LAST SIT (6 problems, 473 minutes) and KIWI (4, 344), both of МУИС-ХШУИС, and SICT of ШУТИС-МХТС (3, 288). The article also reports the closing meeting on 11 April and says the first two teams will represent the country at the Asian contest in the autumn.

    Our copy holds the article and one category listing page of the news site; the article's four photographs are not in it.
