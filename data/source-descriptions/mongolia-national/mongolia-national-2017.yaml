  description: |-
    News article of the National University of Mongolia (МУИС), dated 2017-05-24, in Mongolian, titled "Оюутны програмчлалын үндэсний 9-р олимпиад дүнгээ гаргав" ("The 9th National Student Programming Olympiad announced its results"). It reports the results meeting of 22 May, sets out the contest rules (teams of three students and a coach, five hours, ten problems, ranking by problems solved and time), and says that 10 teams, among them a team of graduates and one of school pupils, wrote programs on 20 May from 13:00 to 18:00.

    A results table lists all 10 teams with rank, team name, institution, number of problems solved and time in minutes; num seas of МУИС-ХШУИС is first with 6 problems in 683 minutes. The text then names the top three as num seas, goodluck everyone and pizza of ШУТИС-МХТС, which is fourth in the table, behind A.BATJARGAL of УБ ЭМПАТИ сургууль, and says num seas will represent the country at the Asian contest in October.

    Our copy holds the article and one category listing page of the news site; the article's seven photographs are not in it.
