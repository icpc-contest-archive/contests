  description: |-
    News article of the National University of Mongolia (МУИС), dated 2015-04-17, in Mongolian, titled "Програмчлалын үндэсний 7-р олимпиадад ХШУИС-ийн багууд эхний 3 байрыг дараалан эзэллээ" ("Teams of ХШУИС took the first three places at the 7th National Programming Olympiad"). It reports that the 7th national olympiad was held on 11 April 2015 with 14 teams from 8 universities and colleges, run in teaching building no. 3 for five hours with ten problems on the PC² system, and compares the number of teams and of attempts and correct answers with 2014.

    The results list gives seven teams in order with their institution, number of problems solved and, for all but the winner, the time; the winner, Muihar_Hucheer_Dairagch of МУИС-ХШУИС, solved 9 problems. Four more teams are named as having solved nothing, and the name SICT-3 appears twice in the list. The article also names the team with the most attempts, the first team to submit a correct solution (problem C, Bit, in the first minute) and the two most solved problems (C and H), and gives the coach and members of each of the top three teams.

    Our copy holds the article and one category listing page of the news site; the article's two photographs are not in it.
