  description: |-
    Pages of the Northern Eurasia Contests archive (NEERC, run from St Petersburg), in English. Our copy holds 150 saved files; many are the same page saved under more than one address, 61 distinct addresses: 51 pages, 9 PDFs and one presentation file. The 2009 and 2010 season pages list the finals and the regional contests with links to final standings, and for some also problem statements, tests, runs, jury archives and analysis; in 2009 the Azerbaijan entry links to its standings; in 2010 the Azerbaijan and Kyrgyzstan entries read "No information is available." The copy holds the standings pages of most regional contests of both seasons, and PDFs of problems for 2009 (the regional contest set of 13 pages, the Northern Subregional set of 14 pages) and for 2010 (13-page sets for the regional and the Northern Subregional contest), together with a 15-page review and the Northern Subregional analysis in Russian, as a 10-page PDF and an 80-page presentation PDF.

    For Azerbaijan the copy holds the standings page of this edition (ACM ICPC 2009-2010, NEERC, Azerbaijan Subregional Contest, final, nine problems A to I) and Azerbaijan standings pages of 2005, 2008, 2011 and each year from 2012 to 2025, plus two handbook PDFs for the 2024 contest. No announcement, rules or problem statements specific to the Azerbaijan contest of this edition are in the copy.
