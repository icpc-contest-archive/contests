  description: |-
    Final scoreboard of the Azerbaijan Subregional Contest of the 2018-2019 NEERC season, in the format of the NEERC contest standings pages: 56 teams with team name and team members, and for each of the twelve problems A to L a dot (no attempt), a plus (solved, with the number of rejected attempts before it when there were any, and the solve time in minutes) or a minus with the number of rejected attempts. The last columns give the number solved and the penalty time. The clock reads 5:00:00 of 5:00:00 with status over.

    Six teams named AZ_SCHOOLS 1 to 6 carry an asterisk before the name and are ranked among the others. Below the table, rows give totals of runs, accepted and rejected runs, and the first and last accepted time per problem. Baku Engineering University 1 is first with six problems solved. The 22 teams with no solved problem share rank 35.
