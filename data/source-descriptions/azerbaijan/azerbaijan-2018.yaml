  description: |-
    Pages of the Northern Eurasia Contests (NEERC) archive site, in English. Our copy holds 150 files for 66 distinct page addresses: the same pages saved under http, https and port-80 addresses, some with differing content. They are the 2018 and 2019 archive pages, the NEERC final standings and the standings of regional contests of those two years (among them Azerbaijan, Armenia, Georgia, Moscow, Ural, Northern and Southern), and the Azerbaijan standings pages of 2005, 2008, 2009, 2011 to 2017 and 2019 to 2025.

    The 2018 archive page links, for the NERC 2018 final, standings, problems, jury archive, problems analysis, review slides and runs, and lists the regional contests, with a standings link for some of them and "No information is available" for others. Our copy has the NEERC 2018 final problem statements (a PDF of 15 pages, headed Northern Eurasia Finals, December 2, 2018), its analysis (11 pages), the problems review slides (101 pages) and a zip of runs. These cover the NEERC final, not the Azerbaijan subregional. The Azerbaijan 2018 page is a scoreboard of 12 problems A to L with 56 teams. The copy also holds 2019 final and regional PDFs and statements and handbooks of the 2024 and 2025 Azerbaijan contests; the two 2024 statement PDFs are cut short and do not open.
