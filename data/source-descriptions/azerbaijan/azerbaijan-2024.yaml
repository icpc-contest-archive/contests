  title: Northern Eurasia Contests
  language:
  - en
  - ru
  description: |-
    Website of the Northern Eurasia Contests (NERC), in English with Russian parts, covering the whole host rather than one contest. Our copy holds 150 pages, 81 HTML and 69 PDF. They are the archive index pages for 2024 and 2025, the standings and statements of many regional contests of 2024 and 2025 (Armenia, Georgia, Kazakhstan, Taurida, Ural, Northwestern Russia and others), the Northern Eurasia Finals statements and tutorials, a 2024 brochure, and the standings page of the Azerbaijan contest for 2005, 2008, 2009 and every year from 2011 to 2025.

    For the 2024 Azerbaijan Regional Contest the site has the standings page, the problem statements in English and in Russian, and a four-page Contestant Handbook in English and one in Russian. The handbook is headed "ICPC 2024-2025 Azerbaijan Regional Contest, Baku Engineering University, October 27, 2024" and covers conduct of the contest, a guide to the PCMS Web Client and how runs are evaluated. The 2025 Azerbaijan standings and statements are in it too.

    Many addresses appear twice, as http and https. The 2024 brochure PDF is cut short in our copy, and some pages the archive pages link to are not in it.
