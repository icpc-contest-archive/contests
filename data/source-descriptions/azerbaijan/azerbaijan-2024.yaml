    Final scoreboard of the Azerbaijan Regional Contest (status over, 5:00:00 of 5:00:00): 55 ranked rows, with the team name (members in brackets for most teams), fourteen problem columns A to N, the number solved and the total time. Each problem cell shows a plus or minus with the number of attempts and, for a solved problem, the time of the accepted run in minutes; a Show time checkbox hides the times. The foot of the table gives, for each problem, total runs, accepted, rejected, first accept and last accept.

    Four rows are marked with an asterisk, the teams AZ SCHOOLS 1, 2 and 3 and a guest team from KZ; they are ranked among the others. AZ SCHOOLS 2 is first with 12 solved in 1079 minutes. Two teams share rank 54, with no problem solved.
