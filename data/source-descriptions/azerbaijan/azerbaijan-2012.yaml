  description: |-
    Pages of the Northern Eurasia Contests archive site of ITMO (NEERC), in English. Our copy holds 63 distinct pages and files (150 files saved, most of them stored under several addresses): the archive pages for 2012 and 2013, the final standings of the Northern Eurasia finals and of the regional and subregional contests of both years (Northwestern, Southern and Volga, Ural, Central, Moscow, Armenia, Georgia, Azerbaijan and others), and the Azerbaijan standings pages of 2005, 2008, 2009, 2011 and 2012 to 2025.

    The 2012 and 2013 pages link, per contest, standings and problem statements and, for some, tests, jury archives and run logs. Our copy also holds the problem PDFs of the 2012 and 2013 finals (Northeastern European Regional Contest, 14 pages each), problem review PDFs of both finals (13 pages each), problem PDFs of the 2012 Central and Northern and the 2013 Northern contests, and English and Russian contestant handbooks of the 2024 Azerbaijan contest (4 pages each). The test, generator and jury archives linked from the pages are not in our copy.
