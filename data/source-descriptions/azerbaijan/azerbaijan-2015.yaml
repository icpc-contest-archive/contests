  description: |-
    Pages of the Northern Eurasia Contests archive site of ITMO (NEERC), in English. Our copy holds 64 distinct pages and files (150 files saved, most of them stored under several addresses): the archive pages for 2015 and 2016, the final standings of the Northern Eurasia finals and of the regional and subregional contests of both years (Northwestern, Southern and Volga, Ural, Central, Moscow, Armenia, Georgia, Azerbaijan and others), and the Azerbaijan standings pages of 2005, 2008, 2009, 2011 and 2012 to 2025.

    The 2015 page links, per contest, standings and problem statements and, for some, tests, jury archives and run logs. Our copy also holds the problem statements of the 2015 and 2016 finals (Northeastern European Regional Contest, 14 and 15 pages), problem review PDFs of both finals (40 and 49 pages), statement and analysis PDFs of the 2015 and 2016 Northern subregional contests, and English and Russian contestant handbooks of the 2024 Azerbaijan contest. The test, generator and jury archives linked from the pages are not in our copy.
