  description: |-
    Website of the Northern Eurasia Contests archive (NERC), in English. Our copy holds 150 pages. The seed page is the 2020 archive page, with a year menu from 1996 to 2020 and links to the final standings, the problems in PDF, the jury archive, the problem analysis and the runs; its regional section names only Northwestern Russia.

    Besides the year pages for 2020 and 2021, the copy holds the NERC 2020 and 2021 problem statements and tutorials as PDFs, the NERC standings pages, and standings pages of regional contests for 2020 and 2021 (Azerbaijan, Armenia, Georgia, Kazakhstan, Uzbekistan, Taurida, Ural and the northern contest). The Azerbaijan standings page of 2020 is in it, as are Azerbaijan standings pages of 17 other years between 2005 and 2025, and statements and handbook PDFs of the Azerbaijan contests of 2024 and 2025. The site is the series archive, not a site made for the Azerbaijan contest alone.
