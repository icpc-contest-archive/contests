  description: |-
    Pages of the Northern Eurasia Contests archive (NEERC, run from St Petersburg), in English. Our copy holds 150 saved files, 147 of them pages; many are the same page saved under more than one address, 62 distinct addresses: 52 pages, 9 PDFs and one XML file. The 2011 and 2012 season pages list, for the finals and each regional contest, links to final standings, and for some also problem statements, tests, runs, logs and analysis; the Azerbaijan entry is a link to its standings. The copy holds the standings pages of most regional contests of both seasons, and PDFs: the 2011 regional contest problems (16 pages) and its analysis presentation (13 pages), the 2011 Northern Subregional problems (13 pages), and four PDFs of 2012.

    For Azerbaijan the copy holds the standings page of this edition (ACM ICPC 2011-2012, NEERC, Azerbaijan Subregional Contest, final, ten problems A to J) and Azerbaijan standings pages of 2005, 2008, 2009, each year from 2012 to 2023 and 2024 and 2025, plus two handbook PDFs for the 2024 contest. No announcement, rules or problem statements specific to the Azerbaijan contest of this edition are in the copy.
