  description: |-
    Pages of the Northern Eurasia Contests archive site of ITMO (NEERC), in English. Our copy holds 63 distinct pages and files (150 files saved, most of them stored under several addresses): the archive pages for 2013 and 2014, the final standings of the Northern Eurasia finals and of the regional and subregional contests of both years (Northwestern, Southern and Volga, Ural, Central, Moscow, Armenia, Georgia, Azerbaijan and others), and the Azerbaijan standings pages of 2005, 2008, 2009, 2011 and 2012 to 2025.

    The 2013 page links, per contest, standings and problem statements and, for some, tests, jury archives and run logs. Our copy also holds the problem PDFs and the problem review PDFs of the 2013 and 2014 finals (Northeastern European Regional Contest; the reviews have 13 and 21 pages), statements of the 2013 and 2014 Northern subregional contests, and English and Russian contestant handbooks of the 2024 Azerbaijan contest. The test, generator and jury archives linked from the pages are not in our copy.
