  description: |-
    Pages of the Northern Eurasia Contests (NEERC, called NERC from 2019) archive site, in English. Our copy holds 150 files for 68 distinct page addresses: the same pages saved under http, https and port-80 addresses, some with differing content. They are the 2019 and 2020 archive pages and the standings pages of those two years, NERC final standings, the problem statements and tutorials of the finals and of the northwestern regional contests, and the Azerbaijan standings pages of 2005, 2008, 2009, 2011 to 2018 and 2020 to 2025, with statements and handbooks of the 2024 and 2025 Azerbaijan contests.

    On the 2019 archive page the Azerbaijan entry reads that no information is available, and the page links no Azerbaijan resources. The Azerbaijan 2019 standings page is nevertheless in our copy: a scoreboard of 13 problems A to M with 53 teams. The statement (15 pages) and tutorial (10 pages) PDFs of the 2019 final cover the NERC final, not the Azerbaijan contest.
