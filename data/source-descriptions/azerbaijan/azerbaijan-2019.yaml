  description: |-
    Final scoreboard of the Azerbaijan Regional Contest 2019 in the format of the NEERC contest standings pages: 53 teams with institution, team name and team members, and for each of the thirteen problems A to M a dot (no attempt), a plus (solved, with the number of rejected attempts before it when there were any, and the solve time in minutes) or a minus with the number of rejected attempts. The last columns give the number solved and the penalty time. The clock reads 5:00:00 of 5:00:00 with status over.

    Below the table, rows give totals of runs, accepted and rejected runs, and the first and last accepted time per problem. Baku Engineering University 1 is first with ten problems solved. The five teams with no solved problem share rank 49.
