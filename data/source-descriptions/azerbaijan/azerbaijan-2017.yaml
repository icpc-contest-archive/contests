  description: |-
    Pages of the Northern Eurasia Contests (NEERC) archive site, in English. Our copy holds 150 files for 60 distinct page addresses: the same pages saved under http, https and port-80 addresses, some with differing content. They are the 2017 and 2018 archive pages, the NEERC final standings and the standings of regional contests of those two years (among them Azerbaijan, Armenia, Georgia, Moscow, Ural, Northern and Southern), and the Azerbaijan standings pages of 2005, 2008, 2009 and 2011 to 2025 other than 2017, with two handbooks (English and Russian) of the 2024 Azerbaijan contest.

    The 2017 archive page links, for the NEERC 2017 final, standings, problems, official tests, jury archive and problems analysis, and lists the regional contests with a standings link each. Our copy has the NEERC 2017 final problem statements (a PDF of 14 pages, headed Northern Eurasia Finals, December 3, 2017) and its analysis (14 pages), which cover the NEERC final, not the Azerbaijan subregional, as well as PDFs of the 2018 final and of the Northern subregional. The Azerbaijan 2017 page is a scoreboard of 12 problems A to L with 52 teams. The test and jury archive files linked from the 2017 archive page are not among the saved files.
