  description: |-
    Website of the Northern Eurasia Contests archive (NERC), in English with some Russian link titles. Our copy holds 150 pages. The seed page is the 2021 archive page with a year menu from 1996 to 2022; it lists the NERC 2021 standings, problems, jury archive, problem analysis and runs, a contestant handbook, opening and announcement videos, the qualifier standings, statements and tutorial, and a Regional Contests section with entries for Armenia, Azerbaijan, Georgia, Kazakhstan, Northwestern Russia, Taurida and Ural, each with a link to final standings.

    The copy also holds the year pages for 2000 to 2015 and for 2022, the NERC 2021 and 2022 standings pages with PDFs of statements and tutorials, and standings pages of other regional contests for 2021 and 2022. The Azerbaijan standings page of 2021 is in it, as are Azerbaijan standings pages of 17 other years between 2005 and 2025, and statements and handbook PDFs of the Azerbaijan contests of 2024 and 2025. It is the series archive, not a site made for the Azerbaijan contest alone.
