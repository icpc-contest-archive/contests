  description: |-
    Pages of the Northern Eurasia Contests archive (NEERC, run from St Petersburg), in English. Our copy holds 150 saved files; many are the same page saved under http, https and port-80 addresses, so there are 61 distinct addresses: 56 pages and 5 PDFs. The season pages for 2005 and 2006 list the finals and the regional contests, each with a link to its final standings, and for some also problem statements and tests; in 2005 the Azerbaijan entry links to its standings, in 2006 it reads "No information is available." The copy holds standings pages of many regional contests of both seasons, such as Moscow, Ural, Armenia, Georgia, Kazakhstan, Uzbekistan and Kyrgyzstan, and three problem PDFs of 14 or 15 pages each: the 2005 finals set (problems A to K), the 2006 finals set and the 2006 Northern Subregional set.

    For Azerbaijan the copy holds the standings page of this edition (ACM ICPC 2005-2006, NEEC, Azerbaijan Subregion, final, eight problems A to H) and Azerbaijan standings pages of the later years 2008, 2009, 2011 and each year from 2012 to 2025, plus two handbook PDFs of 4 pages each (English and Russian) filed under 2024. No announcement, rules or problem statements of the Azerbaijan contest of this edition are in the copy.
