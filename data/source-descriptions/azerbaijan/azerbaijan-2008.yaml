  description: |-
    Pages of the Northern Eurasia Contests archive (NEERC, run from St Petersburg), in English. Our copy holds 150 saved files; many are the same page saved under more than one address, 58 distinct addresses: 52 pages, 5 PDFs and one presentation file. The 2008 and 2009 season pages list, for the finals and each regional contest, links to final standings, and for some also problem statements, tests and jury solutions; the Azerbaijan entry is a link to its standings. The copy holds the standings pages of most regional contests of both seasons, such as Moscow, Ural, Kazakhstan, Armenia, Georgia, Uzbekistan and Kyrgyzstan, and PDFs of problems: the 2008 regional contest set (14 pages, problems A to K), the 2009 set (13 pages) and the 2009 Northern Subregional set (14 pages).

    For Azerbaijan the copy holds the standings page of this edition (ACM ICPC 2008-2009, NEERC, Azerbaijan Subregional Contest, final, eight problems A to H) and Azerbaijan standings pages of 2005, 2009, 2011 and each year from 2012 to 2025, plus two handbook PDFs of 4 pages, in English and Russian, for the 2024 contest. No announcement, rules or problem statements specific to the Azerbaijan contest of this edition are in the copy.
