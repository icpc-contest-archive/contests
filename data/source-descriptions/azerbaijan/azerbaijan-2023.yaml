  description: |-
    Website of the Northern Eurasia Contests archive (NERC), in English with some Russian link titles. Our copy holds 150 pages. The seed page is the 2023 archive page with a year menu from 1996 to 2024; it lists the NERC 2023 standings for the main contest and for the Astana, St. Petersburg, Kutaisi and Novosibirsk sites, the problems in PDF, the problem analysis, a brochure, the qualification standings, statements and tutorial, the opening and announcement videos, the contestant handbook, and a Regional Contests section with many regions (Armenia, Azerbaijan, Central Russia, Georgia, Kazakhstan, Northwestern Russia, Taurida, Ural and others), of which only Armenia, Azerbaijan, Kazakhstan, Northwestern Russia, Taurida and Ural show a standings link.

    The copy also holds the year pages for 2023 and 2024, the NERC 2023 and 2024 standings pages (for 2023 the main contest and four sites) with PDFs of statements, tutorials and brochures, and standings pages of other regional contests for 2023 and 2024. The Azerbaijan standings page of 2023 is in it, as are Azerbaijan standings pages of 17 other years between 2005 and 2025, and statements and handbook PDFs of the Azerbaijan contests of 2024 and 2025. It is the series archive, not a site made for the Azerbaijan contest alone.
