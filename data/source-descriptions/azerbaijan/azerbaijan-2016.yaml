    Standings of the 2016 Azerbaijan Subregional Contest: 39 teams with rank, team name, institution, number of problems solved, total time and a citation. Places 1 to 19 carry a place name from First Place to Nineteenth Place, and the 20 teams from rank 20 on are marked Honorable Mention, 14 of them sharing rank 26 with no problem solved. Qafqaz U 1 of Baku Engineering University is first with six problems solved. There are no per-problem results. The list has fewer teams than the NEERC scoreboard of the same contest, which has 47.
