    Final scoreboard of the Azerbaijan Subregional Contest of the 2016-2017 NEERC season, in the format of the NEERC contest standings pages: 47 teams ranked with team name and team members, and for each of the eleven problems A to K a dot (no attempt), a plus (solved, with the number of rejected attempts before it when there were any, and the solve time in minutes) or a minus with the number of rejected attempts. The last columns give the number solved and the penalty time. The clock reads 5:00:00 of 5:00:00 with status over. Below the table, rows give totals of runs, accepted and rejected runs, and the first and last accepted time per problem. Qafqaz University 1 is first with six problems solved. The 22 teams with no solved problem share rank 26.
