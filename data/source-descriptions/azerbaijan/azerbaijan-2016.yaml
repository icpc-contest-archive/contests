  description: |-
    Pages of the Northern Eurasia Contests (NEERC) archive site, in English. Our copy holds 150 files for 62 distinct page addresses: the same pages saved under http, https and port-80 addresses, some with differing content. They are the 2016 and 2017 archive pages, the NEERC final standings and the standings of regional contests of those two years (among them Azerbaijan, Armenia, Georgia, Moscow, Ural, Northern and Southern), and the Azerbaijan standings pages of 14 other years (2005, 2008, 2009, 2011 to 2015 and 2018 to 2023).

    The 2016 archive page links, for the NEERC 2016 final, standings, problems, official tests, jury archive, all runs and a problems review, and lists the regional contests with a standings link each. Our copy has four PDFs: the NEERC 2016 final problem statements (15 pages), the problems review dated December 4, 2016 (49 pages), and the NEERC 2017 final statements and analysis (14 pages each). They cover the NEERC finals, not the Azerbaijan subregional. The Azerbaijan 2016 page is the scoreboard of 11 problems A to K with 47 teams. Test data, jury archives and run files linked from the archive pages are not among the saved files.
