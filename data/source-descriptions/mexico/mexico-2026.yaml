  description: |-
    Final scoreboard of the 2026 ICPC Latin America Regional Finals, held on 7 November 2026 (17:00 to 22:00, five hours, 20 minutes penalty per rejected attempt, freeze at 240 minutes), published as a MOJ contest report. The board is open, without a freeze, and links to a separate frozen view. It lists 563 teams, each with a country flag, a bracketed institution tag, solved count and penalty, and for problems A to M the number of attempts and, for solved problems, the time of the accepted run; 12 cells carry a first-to-solve star. The 35 rows marked guest have no rank, and 83 rows carry a Qualified mark naming the 2027 ICPC Latin America Championship in Monterrey.

    Above the board the page lists three contest documents (problem set, judging environment, time limits, as PDFs) and a table of the 13 problems with their authors and links to HTML statements. The PDFs and the statements are not in our copy, nor are the pages for runs, clarifications and statistics. Of the 323 team photo links, 145 lead to photos that are in our copy.
