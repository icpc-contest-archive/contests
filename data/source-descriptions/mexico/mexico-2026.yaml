  description: |-
    Final standings of the 2026 ICPC Mexico Finals: 85 teams with rank, team name, institution, problems solved, total time, medal and citation. The first team, from the Escuela Superior de Cómputo of the Instituto Politécnico Nacional, solved 10 problems with a total time of 896 and is named the Mexico champion. The medal column gives gold (4 teams), silver (6) and bronze (10), and state champion titles; 31 teams at the end of the list are marked Honorable Mention, 8 of them with CCL Mexico. Ranks run from 1 to 88, with tied ranks. There is no per-problem detail.
