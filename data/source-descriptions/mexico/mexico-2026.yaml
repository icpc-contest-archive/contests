  description: |-
    Official website of the Mexican Finals of ICPC Mexico, held at the Escuela Superior de Cómputo (ESCOM) of the IPN in Mexico City, in Spanish with English and Portuguese versions. The home page describes the Mexican Finals as the second level of ICPC Mexico, after the Gran Premio de México, and as the route to the Latin America Final, gives the day-by-day agenda for Friday 6 and Saturday 7 November 2026 (registration, warm-up, opening, contest, awards ceremony, closing dinner), and lists sponsors by tier and photo galleries. Separate pages cover the venue and building layout, registration fees and payment instructions, and negotiated hotel rates.

    Our copy holds 12 distinct pages (the four pages in each of the three languages). The home page links to the results on another site; no results, team list or problem statements are in our copy.
