  description: |-
    Problem set of the ICPC 2022 Latin American Regional Contests as handed out in the contest session: a PDF of 32 pages in English. The cover gives the date as March 18, 2023, states that the set contains 13 problems and lists the fourteen countries whose contests use it simultaneously, Mexico among them. A page of general conditions on program names, input and output precedes the problems, A to M, from Asking for Money to Maze in Bolt. Each problem has a statement with input and output format and at least one sample; the 13 problems carry 30 samples in all, and problem M has five. Nine pages, the last among them, are blank except for a line saying so. No test data or solutions.
