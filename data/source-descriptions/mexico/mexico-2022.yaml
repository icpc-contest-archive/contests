    Problem list of the category Latin America Regional Contests 2022 on Baekjoon Online Judge, with the interface in Korean and the problem titles in English. It lists 13 problems, labelled A to M, from Asking for Money to Maze in Bolt, each with its judge problem number (28040 to 28052), a mark that the problem is multilingual, and counts of solvers, submissions and the share of correct submissions. Problems H and K also carry a special-judge mark. The list is the problem set of the whole Latin America regional, not of Mexico alone. The statements themselves are on separate pages that are not in our copy.
