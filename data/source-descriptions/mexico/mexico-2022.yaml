  description: |-
    Codeforces gym page for the 2022-2023 ACM-ICPC Latin American Regional Programming Contest, marked as finished. It lists 13 problems, A to M, from Asking for Money to Maze in Bolt, with time limits from 0.25 to 5 seconds, a memory limit of 1024 MB and the number of solvers of each. A note says that it is an official ICPC contest but the scoreboard includes teams competing unofficially, marked CCL. The contest materials link a statements PDF, a tutorial link titled as an unofficial editorial and a problemset discussion, and a link to the contest website leads to the LATAM scoreboard server; none of these are in our copy. The problem set is shared by all the Latin American finals, not only Mexico.
