  copy: mexico/mexico-2022/scoreboard/20260901-live-4cb367aa/page.html
  title: Final Scoreboard
  language:
  - en
  teams: 329
  problems: 13
  times: true
  tries: true
  description: |-
    Final scoreboard of the ICPC-LATAM Latin America Regional 2022 produced by BOCA, shared by all Latin American sites, not only Mexico. It lists 329 teams, each with a user and site code, a team name that starts with the institution in brackets, one column per problem A to M, and a total of problems solved with penalty time in brackets. A problem cell shows the number of tries and, for a solved problem, the minute of the solve; a dash stands in place of the time otherwise. The first row is a team with site code soar and 12 problems solved.

    A selector offers views for the whole region, Brazil, Central America, the Caribbean, Mexico, the north and the south, and a second set of views with -CCL in their names. Our copy repeats teams across these views, 855 rows in all. The teams with Mexican codes, 59 in all, include four with ccl codes, which belong to the Mexico-CCL view. The page also links the warmup and contest problem sets, information sheets, time limits and an editorial as files that are not part of our copy.
