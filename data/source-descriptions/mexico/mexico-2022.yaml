  description: |-
    Final standings of the 2022 ICPC Mexico Finals: 59 teams with rank, team name, institution, problems solved, total time, medal and a citation. The first three teams carry Gold, Silver and Bronze medals. The first 29 places carry a named place, First Place to Twenty-ninth Place, and the other 30 teams are listed as Honorable Mention, ranks 30 to 56 with ties. The first two teams solved 8 problems each, with times of 1101 and 1344; the first place is a team from Universidad de Guanajuato - DCNE. The teams come from 34 institutions. There is no per-problem detail.
