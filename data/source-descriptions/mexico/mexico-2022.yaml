  description: |-
    Home page of the website of the Regional ICPC Mexico 2022, in Spanish, with ITESO as the venue. Our copy holds this single page, in 21 files with its 11 scripts, a style sheet, the site icon and seven images. The page has a short text about the ICPC as a programming contest for teams of three university students, and entries for the agenda, lodging, sponsors, payments and participants, with links to the ITESO campus map, to a photo album of the event and to the Problemas y resultados page of the contest on the ICPC site.

    The pages behind the agenda, lodging, sponsors, payments and participants entries are not in our copy, so it holds no schedule, team list or results. The pictures on the tiles of those five entries are not in our copy either.
