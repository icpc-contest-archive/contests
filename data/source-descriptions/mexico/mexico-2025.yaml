  description: |-
    Final scoreboard of the joint Latin American regionals of 2025, produced by BOCA, covering all participating countries and not Mexico alone. It lists 593 distinct team accounts against problems A to L; each cell gives attempts and time (for example 2/58), and a Total column gives problems solved and penalty time. Each team has a user name with a country code and a name that starts with an institution or group in brackets; 44 team names are followed by a mark that the team qualified for Programadores de America in Chile. 34 of the accounts have user names beginning ccl, and 28 of them carry [CCL] in the name; the first place on the page is a [CCL] team from Brazil.

    The page repeats the team rows several times (2218 team rows in all), once for each score view it offers: Global, Global plus CCL, Female Teams, Brazil, Caribbean, Central America, Mexico, North, South and CCL, so rank numbers repeat. It also links an editors and machines report, the information sheets, problem sets and time limits of the warmup and the contest, and the BOCA packages.
