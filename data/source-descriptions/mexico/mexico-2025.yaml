  description: |-
    Final standings of the 2025 ICPC Mexico Finals: 139 teams with rank, team name, institution, problems solved, total time and a citation. The first place went to a team of the Facultad de Ingenieria of the Universidad Nacional Autonoma de Mexico with 7 problems solved and time 961; the first three teams each solved 7 problems. Places 1 to 128 carry ordinal citations (First Place and so on) and the later ones, from rank 129, are listed as Honorable Mention. Six teams at the end of the table have no rank number and are marked Honorable Mention: two of the Olimpiada Mexicana de Informatica, a preparatory school, two universities and an institute. There are no per-problem results.
