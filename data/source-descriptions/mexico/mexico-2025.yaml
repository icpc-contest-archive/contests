  description: |-
    Website of the 2025 ICPC Mexican Final, in Spanish. Our copy holds a single page, the front page. It says the Mexican Final is the second level of ICPC Mexico, held jointly with the other Latin American ICPC regions, and that the best Mexican university teams, coming from the Gran Premio de Mexico (the first level), meet there to decide the champion and the teams that go on to the Latin American Final. Tiles and links lead to venue and organisers, agenda, lodging, sponsors, payments, prizes, a campus map, event photos, problems and results, and participants. The campus map is an image in our copy; the links for the venue, photos, participants and for problems and results (the ICPC regional finder) lead outside it.

    The agenda, lodging, sponsors and other pages are not in our copy; the other saved files are the page's scripts, style sheet, images and icon.
