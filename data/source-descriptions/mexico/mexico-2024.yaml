  contest_date: '2024-11-09'
  description: |-
    Website of the 2024 ICPC Mexico Finals, in Spanish. Our copy holds four distinct pages, each saved under both its http and https address: the front page, contact, agenda and payments. The front page describes the ICPC and says the Mexico Finals is where Mexican university teams that qualified on three qualifying dates compete to advance to the Latin American super regional. Its menu has Home, Venue and Contact, and it links to the agenda and payments pages, a photo gallery and the host's campus site.

    The agenda covers Friday 8 November 2024 (registration, practice contest, opening ceremony, welcome dinner) and Saturday 9 November 2024 (the contest from 11:00 to 16:00, sponsor talks, awards and closing), at EGADE Business School (breakfast is at the hotels). The payments page gives fees in Mexican pesos by role, with early and late rates. The contact page lists the director of ICPC Mexico and the director of the 2024 final, with e-mail addresses, a Discord invitation and Facebook and Instagram links. No results, team list or problems are in our copy. The photo gallery link points outside it.
