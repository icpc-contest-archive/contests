  description: |-
    Final scoreboard of the joint Latin American regional of 2024, produced by BOCA, covering all participating countries and not Mexico alone. It lists 516 distinct team accounts against problems A to L; each cell gives attempts and time (for example 1/4), and a Total column gives problems solved and penalty time. Each team has a user name with a country code and a name that starts with an institution or group in brackets. 22 of the accounts have user names beginning ccl and names marked [CCL]. The first place on the page is a team from the University of Sao Paulo (USP).

    The page repeats the team rows several times (1913 team rows in all), once for each score view it offers: Global, Global plus CCL, Brazil, Central America, Caribbean, Mexico, South America North, South America South, sope, sopa, Female Teams and CCL. Rank numbers therefore repeat. It also links the information sheets, problem sets, time limits and solution sketches of the warmup and the contest, and the BOCA packages.
