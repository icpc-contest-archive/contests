  description: |-
    Final standings of the 2024 ICPC Mexico Finals: 121 teams with rank, team name, institution, problems solved, total time, and three columns for medal, citation and site citation. The first place, the Mexico Finals champion, went to a team of Escuela Superior de Computo, Instituto Politecnico Nacional, with 6 problems solved and time 438. Ranks run from 1 to 119: three teams with no problem solved share 114th place, and the five rows ranked 115 to 119 follow them with a citation but no medal or site citation (one of them has 6 problems solved). The last two, 118th and 119th, are marked Honorable Mention. There are no per-problem results.
