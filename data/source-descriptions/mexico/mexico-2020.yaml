  description: |-
    Problem set of the 2020 Latin American Regional Contests as a PDF of 22 pages, in English. The cover reads "International Collegiate Programming Contest 2020, Latin American Regional Contests", gives July 10, 2021 and "Contest Session", and says the set has 14 problems on pages numbered 1 to 20 and is used in simultaneous contests hosted in 18 countries, México among them; it is marked v1.0. A page of general information on program names, input and output follows.

    The fourteen problems, A (Almost Origami) to N (Non-Integer Donuts), each name their author and the author's country and have a statement with Input and Output sections and one to five sample inputs with their outputs, under the running head "ICPC Latin American Regional – 2020". No solutions or test data.
