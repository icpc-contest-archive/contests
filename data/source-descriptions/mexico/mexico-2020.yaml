  copy: mexico/mexico-2020/scoreboard/2026-09-01-live-208f16a8/page.html
  title: Score Board Page
  language:
  - en
  teams: 302
  problems: 14
  times: true
  tries: true
  description: |-
    Scoreboard of ICPC LATAM 2020, held in 2021, produced by BOCA and shared by all Latin American sites, not only Mexico. It lists 302 teams, each with a user and site code, a team name that starts with the institution in brackets, one column per problem A to N, and a total of problems solved with penalty time in brackets. A problem cell shows the number of tries and, for a solved problem, the minute of the solve; a dash stands in place of the time otherwise. The first place is a team from the cbcu site with 10 problems.

    A selector offers 19 views: the whole region and country or site boards such as mxmx for Mexico. Our copy repeats teams across these views, 785 rows in all. The 57 teams with mxmx codes are mixed with the others and can be told apart by that code. The page also links the contest problem set, an information sheet on the test environment and the time limits, as files that are not part of our copy.
