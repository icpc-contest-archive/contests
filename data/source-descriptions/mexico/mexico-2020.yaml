  description: |-
    Final standings of the 2020 ICPC Mexico Finals: 60 teams with rank, team name, institution, problems solved, total time and a citation. The first 30 places carry a named place, First Place to Thirtieth Place, and the other 30 teams are listed as Honorable Mention, ranks 31 to 60 with ties. The first two teams solved 10 problems each, with times of 938 and 1048; the first place is a team from ITESM Campus Monterrey. Three teams solved none. The teams come from 36 institutions. There is no per-problem detail.
