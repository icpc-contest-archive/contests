    Codeforces gym page for the 2020-2021 ACM-ICPC Latin American Regional Programming Contest, marked as finished. It lists 14 problems, A to N, from Almost Origami to Non-Integer Donuts, with time limits from 0.25 to 2.5 seconds, a memory limit of 1024 MB and the number of solvers of each. The contest materials links, labelled Statements, Tutorial, Discussion #1, Discussion and Discussion #3, lead to PDFs on another server (the problem set, an information sheet and the time limits), a GitHub repository and a Codeforces blog entry, none of which are in our copy; each problem has its own page, also not in our copy. The problem set is shared by all the Latin American finals, not only Mexico.
