  read: '2026-11-16'
  rubric: 1
  copy: mexico/mexico-2020/website/2026-09-05-wayback-b1ca80b0
  title: ICPC ITESO – Comunidad de Programación Competitiva del ITESO
  language:
  - es
  contest_date: '2021-07-10'
  description: |-
    Website of the ICPC programming community at ITESO, a blog in Spanish that serves as the site of the ICPC Mexico region. Our copy holds 150 files, 120 of them pages, spread over the contest cycles from 2015 to 2024, so it is a multi-year site and not only the 2020 edition.

    For 2020 it has the region's specific rules, the steering committee for 2020 and 2021, and the pages on venues, contests and teams of the Gran Premio de México 2020. The venues page says that because of the covid-19 pandemic contestants take part from home. The contests page lists the qualifying dates: 31 October, 14 November and 5 December 2020, an ICPC Masters México contest on 30 January 2021, a repechage on 13 February 2021, and the regional contest on 10 July 2021. The pages Información General y Programa #ICPCMX2020 and Día Zacatecas #ICPCMX2020 consist of a title and a clickable image linked to a PDF; the images and PDFs are not in our copy.

    The 2020 pages do not carry results of the contests or problem statements.
- url: https://scorelatam.naquadah.com.br/latam-2020/
  read: '2026-11-16'
