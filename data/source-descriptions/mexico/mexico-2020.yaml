  description: |-
    Problem list of the category Latin America Regional Contests 2020 on Baekjoon Online Judge, with the interface in Korean and the problem titles in English. It lists 14 problems, labelled A to N, from Almost Origami to Non-Integer Donuts, each with its judge problem number (22264 to 22277), a mark that the problem is multilingual, and counts of solvers, submissions and the share of correct submissions. Problem A also carries a special-judge mark. The list is the problem set of the whole Latin America regional, not of Mexico alone. The statements themselves are on separate pages that are not in our copy.
