    BOCA scoreboard titled "ICPC LATAM - 2021" for the Latin American regional contest, covering all countries: per row a login with country code, a name with the institution or group in brackets, then attempts and minutes (for example 1/179) for each of problems A to M and a Total of solved problems with penalty time. The first row is the team [CCL] WAN TAAN SURII KILL with 9 solved (1706). The table has 756 rows for 273 distinct logins, because a team is listed again in each view it belongs to (global, country, site): a login appears one to four times. 57 of the logins carry the country code MX, from the Mexican sites mxmx, mxch, mxza, mxac, mxgj, mxja, mxnl, mxcg, mxcm and mxcz; one more login at site mxcj carries PE.

