  description: |-
    Problem set of the 2023 Latin American Regional Contests as handed out on 21 October 2023: a PDF of 30 pages, version 1.0. The cover says it holds 13 problems and was used in simultaneous contests in 17 countries, Mexico among them. A page of general conditions on program names, input and output follows, then the problems A to M, each with a statement in English, input and output descriptions and samples. The set is shared by all the Latin American contests, not only the Mexican one.
