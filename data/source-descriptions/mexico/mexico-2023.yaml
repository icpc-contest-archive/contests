  description: |-
    Website of the 2023 ICPC Mexico regional, in Spanish. Our copy holds a single page, the front page, which describes the ICPC as a team programming contest for university students and shows tiles and links for venue and organisers, agenda, lodging, sponsors, payments, ICPC Masters, a campus map, event photos, and problems and results. The link to problems and results leads to an ICPC regional finder page outside our copy.

    The agenda, lodging, sponsors and other pages behind the tiles are not in our copy; the saved files besides the page are its scripts, style sheet, images and icon.
- url: https://scorelatam.naquadah.com.br/latam-2023/
  read: '2026-11-16'
  rubric: 1
  copy: mexico/mexico-2023/scoreboard/20260901-live-8557617e/page.html
  title: LATAM Regional 2023 | Final Scoreboard
  language:
  - en
  teams: 424
  problems: 13
  times: true
  tries: true
  description: |-
    Final scoreboard of the joint Latin American regional of 2023, produced by BOCA, covering all participating countries and not Mexico alone. It lists 424 distinct team accounts against problems A to M; each cell gives attempts and time (for example 1/38), and a Total column gives problems solved and penalty time. Teams are shown with a user name and country code (58 with the code MX: 55 with user names beginning team and 3 beginning ccl) and a name that starts with an institution or group in brackets. 20 of the 424 user names begin with ccl; 17 of the 424 team names are marked [CCL], and the first place on the page is a [CCL] team.

    The page repeats the team rows several times (1557 team rows in all), once for each of the score views it offers: Global, Global plus CCL, Brazil, Central America, Caribbean, Mexico, North, South and CCL. Rank numbers therefore repeat. The page also links the information sheets, problem sets, time limits and editorial of the warmup and the contest, and the BOCA packages.
