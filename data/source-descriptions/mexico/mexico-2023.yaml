  description: |-
    Final standings of the 2023 ICPC Mexico Finals: 55 teams with rank, team name, institution, problems solved, total time and a citation. The first place went to a team of Universidad de Guanajuato with 7 problems solved and time 1127. The first ten places are named First Place to Tenth Place, places up to 27th carry an ordinal citation, and the teams from 28th place on are listed as Honorable Mention. There are no per-problem results.
