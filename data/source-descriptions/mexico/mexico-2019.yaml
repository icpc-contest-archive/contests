  title: Final Scoreboard
  language:
  - en
  teams: 368
  problems: 13
  times: true
  tries: true
  description: |-
    Final scoreboard of ICPC LATAM 2019 produced by BOCA, shared by all Latin American sites, not only Mexico. It lists 368 teams, each with a user and site code, a team name that starts with the institution in brackets, one column per problem A to M, and a total of problems solved with penalty time in brackets. A problem cell shows the number of tries and, for a solved problem, the minute of the solve; a dash stands in place of the time otherwise. The first place is a Brazilian team with 10 problems.

    A selector offers 22 views: the whole region, country or site boards such as mxmx for Mexico, and five views whose names start with ccl. Our copy repeats teams across these views, 1312 rows in all. The Mexican teams, 55 with codes containing mxmx, are mixed with the others and can be told apart by that code. Links lead to statistics, clarifications and run lists, which are not part of our copy.
