    Problem list of the category Latin America Regional Contests 2019 on Baekjoon Online Judge, with the interface in Korean and the problem titles in English. It lists 13 problems, labelled A to M, from Algorithm Teaching to Mountain Ranges, each with its judge problem number (18029 to 18041), a mark that the problem is multilingual, and counts of solvers, submissions and the share of correct submissions. The list is the problem set of the whole Latin America regional, not of Mexico alone. The statements themselves are on separate pages that are not in our copy.
