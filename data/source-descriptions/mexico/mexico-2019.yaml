  rubric: 1
  copy: mexico/mexico-2019/website/2026-09-05-wayback-b1ca80b0
  title: ICPC ITESO – Comunidad de Programación Competitiva del ITESO
  language:
  - es
  description: |-
    Website of the ICPC programming community at ITESO, a blog in Spanish that serves as the site of the ICPC Mexico region. Our copy holds 150 files, 120 of them pages, spread over the contest cycles from 2015 to 2024, so it is a multi-year site and not only the 2019 edition.

    For 2019 it has the region's specific rules, the steering committee, and the pages on venues, contests and teams of the Gran Premio de México 2019, the first phase of the 2019 cycle, whose qualifying contests are listed for 4 May, 11 May, 14 September and 26 October. The front page carries posts from 2019: agendas of the first three Gran Premio dates, an announcement of an ICPC Masters México contest and links to solution write-ups for the first two rounds. The page titled Sitio del Regional #ICPCMX2019 – Tecnológico de Monterrey Campus Monterrey holds only its title and the site menu.

    Links to files on other servers, such as the solution write-ups, lead outside our copy.
