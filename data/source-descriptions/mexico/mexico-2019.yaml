  description: |-
    Codeforces gym page for the 2019-2020 ACM-ICPC Latin American Regional Programming Contest, marked as finished. It lists 13 problems, A to M, from Algorithm Teaching to Mountain Ranges, with time limits from 1 to 6 seconds, a memory limit of 1024 MB and the number of solvers of each. The page links a statements file in English, a link labelled D (en) to a Codeforces blog entry, and each problem's own page, none of which are in our copy. It names the problem authors and carries one announcement about problem H. The problem set is shared by all the Latin American finals, not only Mexico.
