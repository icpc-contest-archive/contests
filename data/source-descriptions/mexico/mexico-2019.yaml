  description: |-
    Final standings of the 2019 ICPC Mexico Finals: 55 teams with rank, team name, institution, problems solved, total time and a citation. The first 27 places carry a named place, First Place to Twenty-seventh Place, and the other 28 teams are listed as Honorable Mention, ranks 28 to 54 with ties. The top team solved 9 problems with a time of 1099, the next 7, and 3 teams solved none. The teams come from 31 institutions. There is no per-problem detail.
