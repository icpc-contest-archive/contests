  description: |-
    Final scoreboard produced by BOCA for the Latin America Championship (Programadores de América 2026): 52 distinct teams, 41 of the championship and 11 marked CCL, with twelve problems A to L. Each team row gives user and site, team name with institution in brackets, tries/time for each problem, and total solved with penalty in parentheses. Gold, silver and bronze medal marks, region champion marks and World Finals qualification marks appear next to the team names. The page has links to score views for the Brazil, Caribbean, Central America, Mexico, North and South regions plus CCL. The table has 93 team rows because each of the 41 championship teams appears twice, once in the overall order and once in its region's order (the rank is the same in both for one team only), and each CCL team once.

    The page also links to the contest and warmup problem sets, information sheets, time limits and BOCA packages, runs, tasks, clarifications and statistics pages. Among the championship teams, UFMG's team ooga booga is first with 8 problems solved; a CCL team is listed above it with 9.
