    Problem set of the contest session: a PDF of 29 pages in English. A cover page gives "Contest Session" and the date 16 March 2025, and states that the set contains 12 problems; a page of general information on the program name, input and output follows. Then come twelve problems, A to L (from Ananna to LED Counter), each with a statement, an input and an output section, and sample inputs and outputs. The page footers carry the name of the championship and the problem. The last page holds only a note that it would be intentionally left blank if the authors did not wish to inform about that. No test data or solutions.
