  description: |-
    Final standings of the championship as a Codeforces gym page: a scoreboard of 53 teams against problems A to L. Each row gives the place, the team name, the number of problems solved, the penalty, and one cell per problem showing a plus with the time of the accepted solution (hh:mm) and the number of rejected runs when there were any, or a minus with the number of rejected runs for an unsolved problem. A last row gives the number of accepted and tried solutions per problem. The first place has 12 problems solved (1065).

    The board mixes several kinds of team: 49 teams whose names carry a tag in brackets (9 are tagged [CCL], the others carry an institution tag) and 4 teams named with their members' Codeforces handles, which are the only rows without the gym's ghost-participant icon. These four include the first two places. The page has a switch for showing unofficial participants.
