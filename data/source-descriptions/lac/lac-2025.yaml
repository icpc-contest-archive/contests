  description: |-
    Final scoreboard produced by BOCA for the 2025 ICPC Latin America Championship (Programadores de América 2025): 40 teams ranked against problems A to L. Each row gives the rank, the team's user name and country code, the institution in brackets and team name, one cell per problem with the number of attempts and, for a solved problem, the time (an unsolved problem shows the attempts and a dash), and the total as problems solved with the penalty in parentheses. The first place of the main ranking has 9 problems solved (1660). Medal marks are printed after the team name: 4 gold, 4 silver and 4 bronze medalists, with marks for region champions and for qualification for the World Finals in Azerbaijan (7 teams).

    The page offers switches for further views (Brazil, Caribbean, CentroAmerica, Mexico, North, South, and CCL). In our copy these views are rows of the same table, 89 in all: the 40 teams of the main ranking, 40 rows of the same teams under a regional rank, and 9 teams tagged [CCL] that are not in the main ranking and are ranked among themselves (the first has 10 solved). Links at the top lead to information sheets, the warm-up and contest problem sets, time limits, an editorial and the BOCA packages; those files are not part of our copy.
