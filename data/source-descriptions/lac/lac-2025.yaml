  description: |-
    Dashboard page of the championship as a Codeforces gym, marked Finished. It lists twelve problems, A to L (Ananna, Brazilian FootXOR, Coatless in Yakutsk, Dangerous City, Exciting Business Opportunities, Festival Signs, Game of Pieces, Horrible Restaurants, Infinite Arrays, Just Look Up, Keep Fighting, LED Counter), each with its time and memory limit and the number of solvers. Under contest materials it links official results, statements and two tutorials, and it links the contest website and the full problem set. The page also holds the gym's virtual-participation and practice notes and forms for questions and announcements.

