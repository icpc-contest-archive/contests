  description: |-
    Final scoreboard produced by BOCA for the Programadores de América 2024 contest: 40 teams ranked against problems A to L. Each row gives the rank, the team's user name and country code, the institution in brackets and team name, one cell per problem with the number of attempts and, for a solved problem, the time (an unsolved problem shows the attempts and a dash), and the total as problems solved with the penalty in parentheses. The first place has 8 problems solved (900). Medal marks are printed after the team name: 4 gold, 4 silver and 4 bronze medalists; 18 rows are marked as qualified for the World Finals in Kazakhstan, and 6 rows carry champion marks, 7 marks in all (Latin America, Brazil, South America South, South America North, Mexico, Caribbean, Central America).

    The page offers switches for further views (Brasil, Caribbean, CentroAmerica, Mexico, North, South, and CCL). In our copy these views are rows of the same table, 81 in all: the 40 teams of the main ranking, 40 repeat rows of the same teams under a second rank, and one row for a team with 8 solved that is not in the main ranking. Links at the top lead to information sheets, the warm-up and contest problem sets, time limits, an editorial and the BOCA packages; those files are not part of our copy.
