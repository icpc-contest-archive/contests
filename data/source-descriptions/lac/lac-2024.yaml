    Dashboard page of the championship as a Codeforces gym, marked Finished. It lists twelve problems, A to L (Almost Aligned; Beating the Record; Clever Cell Choices; DiviDuelo; Expanding STACKS!; Fair Distribution; Greek Casino; Harmonic Operations; Insects, Mathematics, Accuracy, and Efficiency; Joys of Trading; KMOP; LED Matrix), each with its time and memory limit and the number of solvers. Under contest materials it links an official scoreboard, statements and solution sketches, and it links the contest website and the full problem set. The page also holds the gym's virtual-participation and practice notes and forms for questions and announcements.

