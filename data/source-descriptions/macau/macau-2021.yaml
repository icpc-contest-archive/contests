  description: |-
    Dashboard page of the contest on Codeforces gym, marked Finished, stating that the contest was prepared by the SUA Problem Setter Team. It has a table of the 11 problems A to K with title, input and output type, time limit (1 to 6 seconds), memory limit (256 to 1024 MB) and the number of accepted solutions. The contest materials section links Statements (en), Tutorial (en) and an additional file named D_spfa. The page also has the Codeforces forms for questions and announcements. The statements themselves are not in our copy.
