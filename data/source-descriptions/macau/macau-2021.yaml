- url: https://www.cis.um.edu.mo/icpc2022/
  read: '2026-11-16'
  rubric: 1
  copy: macau/macau-2021/website/2026-09-04-wayback-3fb2f262
  title: The 2021/2022 ICPC Asia Macau Regional Contest
  language:
  - en
  - zh
  contest_date: '2022-04-03'
  description: |-
    Website of the 2021/2022 ICPC Asia Macau Regional Contest, published by the University of Macau (venue given as University of Macau (Online); the schedule has a Macau column and an HK column with CUHK). Our copy holds four pages: a single English home page and three PDFs. The home page has sections for registration (at most three teams per university from outside Macau and Hong Kong, a fee of USD 300), the schedule for 3 April 2022 (login, opening and rules briefing, practice contest, the programming contest from 11:00 to 16:00, closing and award ceremony), the award categories, contest rules (the judging system is named as Domjudge), transportation and accommodation, and the organising committee.

    The three PDFs are the final standings, the awards list, and a two-page notice in Traditional Chinese titled 第 46 屆 ICPC 東亞洲區域賽（澳門）線上賽比賽說明 (Dì 46 jiè ICPC Dōngyàzhōu qūyù sài (Àomén) xiàn shàng sài bǐsài shuōmíng, "Instructions for the 46th ICPC East Asia Regional Contest (Macau) online contest"). The standings and awards PDFs are linked from the Awards section of the home page. There are no problem statements.

    Some images on the home page (bus map, app screenshots) are linked from another server.
