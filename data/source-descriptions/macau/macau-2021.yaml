  language:
  - en
  teams: 183
  problems: 11
  times: true
  tries: true
  description: |-
    Final standings of the contest as shown on a Codeforces gym: 183 teams with rank, team name (many entries give the institution before the team name; some add names in brackets), problems solved, penalty, and one column for each of the 11 problems A to K. Each problem cell shows a plus sign with the number of earlier wrong tries and the solve time in hours and minutes, or a minus sign with the number of failed tries. The first-place team solved nine problems with a penalty of 1024. A bottom row gives the number of accepted and tried submissions per problem.

    Tied teams share a rank (thirteen teams share rank 171), and the page offers a 'show unofficial' option.
