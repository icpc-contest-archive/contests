  description: |-
    Problem set as handed out at the contest: a PDF of 16 pages. The cover names the contest session of April 3, 2022, lists the 11 problems A to K by title and states that the set has 11 problems on 14 numbered pages; the cover also names the SUA Programming Contest Problem Setter Team as preparer, and the second page has two logo areas headed Hosted by and Problem Set Prepared by and a note against opening non-contest websites. The statements follow on the 14 numbered pages, in English. Each of the 11 problems has an input and output description and at least one example in a standard input and standard output table, and seven (C to H and K) have a Note section. No test data or solutions.
