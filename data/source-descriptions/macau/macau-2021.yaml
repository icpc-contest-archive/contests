  description: |-
    Final standings of the 2021 ICPC Asia Macau Regional Contest: 109 teams with rank, team, institution, number of problems solved, total time, medal and citation. The medals are 10 gold, 20 silver and 30 bronze; the other 49 teams have no medal. The citation column reads First Place to Fifty-fourth Place for the top 54 teams and Honorable Mention for the other 55 teams. The best teams solved eight problems (first place: 8 solved, time 825). There is no per-problem detail.
