    Final scoreboard on XCPCIO, headed 第 46 屆 ICPC 東亞洲區域賽（澳門）正式賽 (dì 46 jiè ICPC Dōng Yàzhōu qūyù sài (Àomén) zhèngshì sài, "46th ICPC East Asia Regional Contest (Macau), official contest"), marked finished, with start 2022-04-02 22:00 and end 2022-04-03 03:00 given in CDT. Eleven problems A to K, each column headed with its number of accepted teams; per team it gives place, organisation with its rank among organisations, team name, solved, penalty, tries and time per solved problem, a Dirt percentage and an SE value, with first solves marked. Shanghai Jiao Tong University's team All-in at the River is first with 8 solved. Filters select all, official, unofficial or women's teams, and summary rows at the foot give submitted, attempted and accepted counts and first and last solve times per problem.

    The table has 166 team rows, but only the first 32 (places 1 to 32) are filled in our copy; the other rows are empty.
