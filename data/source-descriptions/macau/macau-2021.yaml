  copy: macau/macau-2021/judge-luogu/20261103-live-4bc13bbf/page.html
  title: '[ICPC2021 Macao R] ICPC2021 区域赛澳门站重现赛'
  title_en: '[ICPC2021 Macao R] ICPC2021 Regional Contest Macau Site Replay Contest'
  language:
  - zh
  - en
  problems: 11
  description: |-
    Contest page on Luogu for a replay (重现赛, chóngxiànsài, "replay contest") of the 2021 ICPC Asia Macau Regional Contest, scheduled for 24 September 2023, 13:00 to 18:00. In Chinese, it says the problems are the original ones from the on-site contest with the gym test data, with English statements only, and credits the SUA setter team. It states ICPC rules with a 20-minute penalty per wrong submission, a scoreboard frozen for the last hour, one account per team, a daily limit on submissions to problems with long time limits, and that people who already took part in the original contest should not enter. The page data names the 11 problems, prefixed ICPC 2021 Macao R. Statements and results are not in our copy.
