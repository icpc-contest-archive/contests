  title: The 2020/2021 ICPC Asia Macau Regional Contest
  language:
  - en
  contest_date: '2021-05-29'
  description: |-
    Website of the 2020/2021 ICPC Asia Macau Regional Contest, in English, published by the University of Macau (University of Macau and the Hong Kong site both named). It is a single page with sections for registration, payment, the schedule, awards, contest rules, transportation and accommodation, and the organising committee. It gives 29 May 2021 as the contest day with the venue at the University of Macau and a second site in Hong Kong, a two-day schedule (registration and reception on 28 May, opening ceremony, a five-hour contest and closing ceremony on 29 May), a registration fee of USD 200, award categories (champion, runners-up, gold, silver and bronze, outstanding local and high school teams), and rules naming DOMjudge as the judging system.

    Our copy holds 1 page of the site plus its style sheets, scripts and images; the other saved files that end in .html are responses of a map service, not pages. Links to the registration page, forms and hotel sites lead outside our copy. The site has no results, team list or problems.
