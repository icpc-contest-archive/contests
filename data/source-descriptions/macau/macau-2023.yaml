  language:
  - en
  problems: 11
  pages: 23
  description: |-
    Problem set booklet of 23 numbered pages in English. The cover reads 'The 2nd Universal Cup, Stage 15: Macau, December 23-24, 2023', says 'Based on International Collegiate Programming Contest (ICPC)'. It holds 11 problems, A (-1,1)-Sumplete to K Understand, each with the input and output file names, time limit, memory limit, statement, input and output format and examples; nine of the 11 have a note after the examples (not C and H). Problems G and K are interactive. No test data or solutions.

    The cover names the Universal Cup stage and its dates, not the regional contest.
- url: https://codeforces.com/gym/104891
  read: '2026-11-16'
  rubric: 1
  copy: macau/macau-2023/judge-codeforces/20261103-live-50cfa136/page.html
  title: 'The 2023 ICPC Asia Macau Regional Contest (The 2nd Universal Cup. Stage 15: Macau)'
  language:
  - en
  problems: 11
  description: |-
    Codeforces gym page of a Finished contest, in English, titled 'The 2023 ICPC Asia Macau Regional Contest (The 2nd Universal Cup. Stage 15: Macau)'. It lists 11 problems A to K by name: (-1,1)-Sumplete, Basic Equation Solving, Bladestorm, Graph of Maximum Degree 3, Inverse Topological Sort, Land Trade, Parity Game, Random Tree Parking, Refresher into Midas, Teleportation and Understand. Each row gives the input and output mode (standard input/output), the time limit (from 1 second to 8 seconds), a memory limit of 1024 MB and the number of accepted solutions on the gym. Links to statements and a tutorial are shown under Contest materials, along with the usual gym menus and forms for questions.

    The statements themselves are not on the page.
