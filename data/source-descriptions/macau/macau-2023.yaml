  description: |-
    Final standings of the 2023 ICPC Asia Macau Regional Contest: 82 teams, one row each, with rank, team name, institution, number of problems solved, time, medal and citation. There is no per-problem detail. Eight teams have a gold medal, 16 silver and 24 bronze; the other 34 have none. The citation column names the first 41 places (First Place to Forty-first Place) and gives Honorable Mention to the other 41 teams. Twelve teams solved no problem. The team from Peking University is first with 9 problems and a time of 1443.
