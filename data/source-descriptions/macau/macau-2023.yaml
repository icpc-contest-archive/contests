  title: The 2023 ICPC Asia Macau Regional Contest
  language:
  - en
  contest_date: '2023-11-19'
  description: |-
    Website of the 2023 ICPC Asia Macau Regional Contest, in English, hosted by the University of Macau, which is also the venue. The page gives the dates as 18 and 19 November 2023: registration of teams and a reception on the 18th, the programming contest on the 19th. The home page gives the registration rules (at most two teams per university from outside Macau and Hong Kong, a registration fee of HKD 2000, three registration rounds and a separate registration of unofficial teams), the invitation letter, the schedule of the two days, the award categories, the contest rules (DOMjudge as the judging system), transportation, accommodation and the organizing committee.

    Our copy holds six documents: the home page and five PDFs. They are a one-page registration notice in Chinese (an image without a text layer), a one-page invitation letter, the list of 82 teams with seat numbers, and the final standings of the official teams (82 teams) and of all teams (92 teams). None of the six is a problem set. The page also links a replay of the standings, which is not in our copy.
