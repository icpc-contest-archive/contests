  description: |-
    Problem tutorials of Stage 15: Macau of the 2nd Universal Cup, a PDF of 6 pages in English. It has one section called 'Problem Tutorial' for each of the 11 problems, in the order of the problem set from (-1,1)-Sumplete to Understand. Each section explains the idea and the algorithm used, often with its running time, and the last section includes figures of paths on a grid. No code is included.

    The heading names the Universal Cup stage and its dates of 23 and 24 December 2023.
