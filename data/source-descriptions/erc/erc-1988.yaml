  description: |-
    Issue of Cursor dated 18 November 1988 (volume 31): a scan of 22 pages in Dutch. On page 6 a short item headed "TUE niet in wereldfinale programmeerwedstrijd" (TUE not in the world final of the programming contest) reports that the final of the European programming contest was held at the TUE on Saturday 12 November, with 25 teams from eight European countries. The Ecole des Mines of Paris finished first and Rijksuniversiteit Leiden second; the two TUE teams finished seventh and fifteenth, and the best two teams go on to the world final in the United States in February.

    The rest of the issue is university news unrelated to the contest. The text of our copy is an OCR layer over the scan and has many misread letters.
