  description: |-
    Problem set: a scanned PDF of 14 pages, in English, without a text layer. The cover names the European Regional Finals of the 1988-89 ACM Scholastic Programming Contest, held at Eindhoven University of Technology, The Netherlands, on November 12, 1988, and notes seven problems A to G on 13 numbered pages.

    The seven problems are A From Prefix to Postfix, B The Snake in the Grass, C The Jolly Jumper, D El Puzzlo, E The Easy Part, F Series Parallel Graphs and G Contest Aid, each starting on its own page with a header giving the contest, the date and the names of the source file and the input and output files. Each statement describes the input and output format. Problems A, B, C, E, F and G give an example of input and output; problem D gives an example of its output only. There is no test data and there are no solutions.
