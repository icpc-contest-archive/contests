  description: |-
    Issue of Cursor, the newspaper with its editorial office at the Technische Universiteit Eindhoven, dated 11 November 1988 (volume 31): a scan of 24 pages in Dutch. A short news item headed "Europese finale programmeerwedstrijd" (European final of the programming contest) announces that the final of the European programming contest will be held at the TUE on Saturday 12 November, organised by a staff member of Informatica and the study association Gewis of the faculty of Wiskunde en Informatica, under the auspices of the Association for Computing Machinery. It says that 25 teams from eight European countries take part, two of them from the TUE, and that the best two teams go to the world final in the United States in February.

    The rest of the issue is university news unrelated to the contest. The text of our copy is an OCR layer over the scan and has many misread letters.
