  description: |-
    Problem set of the 1991 ACM Scholastic Programming Contest, European Regional Final, as a 17-page scan with no text layer. It has eight problems, A to H: JOKER, CALC, BITMAP, FLOORTILES, NETWORK, BUYING A HOUSE, CHECK !, and WE GET AROUND .... Every problem starts a new page headed with the contest name and lists its input file, output file and Pascal source file names, followed by the statement in English. Six of the eight problems have an example of input and output; B and C have none. Each problem takes two pages, except problem E, which takes three. The pages are numbered.

    No date, place or sponsor is printed on the pages. No solutions or test data are included.
