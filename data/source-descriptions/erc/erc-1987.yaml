  description: |-
    Short Dutch newspaper item headed "Tweede plaats vakgroep VU" ("Second place for the VU department"), four sentences long. It reports that the computer science department of the Vrije Universiteit in Amsterdam took second place in the European programming contest with a team of four, which thereby qualified for the world finals to be held in the United States in February.

    The item says the contest was held in London with 17 teams, and that the task was to solve as many of the set problems as possible on a computer within six hours. It names the four team members with their home towns. It gives the placing of that one team only: no other team, score or ranking, no date and no year, and no newspaper name appear in the text. Our copy is a small XML text file holding the item's title and text, without the page it was printed on.
