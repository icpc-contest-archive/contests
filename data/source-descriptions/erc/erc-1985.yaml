  description: |-
    Issue of Felix, published for Imperial College Union Publications Board, numbered 728 and dated Friday 24 January (copyright line 1986): a PDF of 15 pages with a text layer produced by OCR, in which many columns are spaced out letter by letter. Page 4 holds a short news item headed "All Four Won". It says that a team of four postgraduates from Imperial College won a place in the world finals of the Association for Computing Machinery students' programming contest, to be held in Cincinnati, Ohio, on 5 February.

    The item says the team beat teams from Switzerland, Belgium, Finland, France and West Germany in the European finals in November, completing four problems in five hours, and that it had earlier won a programming competition at British Aerospace's Preston works. It adds that the team was trying to raise 5000 pounds in sponsorship for the trip. The item gives no standings or list of teams.
