  description: |-
    Problem set of the 1991 ACM Scholastic Programming Contest, European Regional Contest, held on 3 November 1990 and sponsored by AT&T Computer Systems, as a 16-page scan. It has eight problems, A to H: Woodworms, BOGGLE II, Semi-Circles, Counting with Dice, Russian Shops, Quad Monitor, Tom and Jerry and Musical Repe(ti)on. Each problem is in English, starts with a header naming a Pascal source file and input and output file names, and gives the statement, the input and output format and an example; problems take between one and three pages.

    The last page is the final standings sheet of the contest. There are no solutions or test data. The scan has no text layer.
