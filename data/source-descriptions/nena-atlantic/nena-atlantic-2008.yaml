  description: |-
    Page of the Science Atlantic Computer Science Division titled ACPC Programming Competition (formerly ICPC Preliminary Round), with a section for each year of the Atlantic contest from 1998 to 2025, newest first. The section for 2008 is headed "2008 UdeM October 17, 2008 – Universite de Moncton". It names the four best teams, each marked as having solved 6 of 6 problems: CS Huskies of St. Mary's University, MUN2 of Memorial University, UNB Reds of the University of New Brunswick Fredericton and Acadia Blue of Acadia University. It states that three teams moved on to the next round in Rochester, NY and that at most one team from an institution can advance. Links for the problem set and the scoreboard lead to PDF files at Science Atlantic.

    The other 2008 teams are not listed. Our copy holds the page only; the linked documents are not part of it.
