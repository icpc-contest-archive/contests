  description: |-
    Problem set as a PDF of 10 pages with six problems, numbered 1 to 6 and written in English: Cowculations, Pseudoku, Roundabout, Help me read Paul's messages, 2D moving company and Longest subsequence. Each problem has a statement and a sample input with its output. Problems 1 to 5 describe the input and output format in the text; problem 6 gives only its example. A line after each title names the author, institution and a year; problem 1 is credited to Villanova U. in 1996, the other five to Atlantic Canadian universities in 2008, including Universite de Moncton for problems 4 and 6.

    There is no cover page: the PDF starts directly with problem 1 and does not name the contest, date or place. No test data or solutions.
