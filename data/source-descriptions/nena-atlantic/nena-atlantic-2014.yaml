  description: |-
    Website of Science Atlantic, the association behind the regional student conferences. Our copy holds 149 saved files, 127 of them HTML pages, and most of those are the association's general pages: news items, annual reports, committee pages and award winners of the divisions, and the sites of other conferences such as the Atlantic Universities Geological Conference.

    The pages about this contest are the site of the Science Atlantic Mathematics, Statistics and Computer Science Conference 2014 at the University of New Brunswick, Saint John, October 3 to 5, 2014, with its announcements and registration fees, and the awards page of the Computer Science committee. The conference menu has entries for a Mathematics Competition and a Programming Competition, but those pages are not in our copy. The awards page names the first three teams of the Science Atlantic Computer Science Programming Competition: Shellshock (Mount Allison University), Bitshift (University of New Brunswick, Saint John) and Dalhousie Gold (Dalhousie University). The 2015 awards page of the same committee is also in our copy.
