  title: 2019 Atlantic Universities Mathematics, Statistics and Computer Science Conference
  language:
  - en
  description: |-
    Website of the 2019 Atlantic Universities Mathematics, Statistics and Computer Science Conference, held at Dalhousie University, Halifax, on October 25 to 27, 2019, sponsored by Dalhousie University, CGI, Science Atlantic, AARMS, ShiftKey Labs and Morneau Shepell. The one-page site covers sponsors, registration and fees, a call for abstracts, the program, the programming contest, the math contest, the AARMS workshop of Sunday, October 27, accommodations, directions and the organizing committee. The program lists the programming competition on Friday, October 25, 2019, 12:00 to 17:00 in two labs of the Computer Science building, with a meeting before it. The contest section calls the 2019 Atlantic Canadian Preliminary Contest an official qualifying contest for the ACM International Collegiate Programming Contest and describes the Linux workstations teams get.

    Our copy holds four pages: the front page and three PDFs, which are a 12-page general conference booklet, a 27-page booklet of student talks and abstracts, and a 3-page schedule of the AARMS research session. Images and the style sheet are kept. Links to the test contest site and the scoreboard lead outside our copy; the scoreboard link is marked as not yet posted.
