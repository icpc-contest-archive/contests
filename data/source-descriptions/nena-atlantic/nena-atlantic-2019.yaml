    Final standings of the 2019 Atlantic Canadian Preliminary Contest: 27 teams with rank, team name, institution, number of problems solved and total time. A citation column gives First to Thirteenth Place for ranks 1 to 13 and Honorable Mention for ranks 14 to 27; a site citation column names the contest. Mount Allison University's team is first with 6 solved, and three teams solved none. No per-problem results.
