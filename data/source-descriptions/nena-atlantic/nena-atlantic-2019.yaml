  description: |-
    Kattis list of the seven problems whose source is the 2019 Atlantic Canadian Preliminary Contest: ARMPIT Computations, Happy and Unhappy Numbers, Largest Hoarding, Meeting Points, Shortlex, Space Mail and UTF-8. For each problem it shows solution statistics, a percentage ratio, a difficulty rating (from 2.0 for UTF-8 to 5.0 for ARMPIT Computations) and the language (English). The figures are those of the day the page was fetched. The statements are linked, not included.
