    Final standings of the 2009 Dalhousie University APICS Contest: 21 teams with rank, team, institution, problems solved and total time. There are no per-problem columns and no medals. 18 teams solved at least one problem; the last three, with none solved, share rank 19. CS Huskies of Saint Mary's University is first with 4 solved and a time of 456; the next five teams solved 2 each.
