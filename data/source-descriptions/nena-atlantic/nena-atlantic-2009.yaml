  description: |-
    Problem set as a PDF of 12 pages with six problems, labelled A to F, in English: We Only Stop For The Best, Waiting at Godot's, n-Squared Matrix, Software Development, Triangle Meshes and Aquarium. Each problem has a statement with input and output format and a sample input and output; problem A starts on page 1, B on page 2, C on page 4, D on page 6, E on page 9 and F on page 11.

    There is no cover page: the PDF starts directly with problem A and does not name the contest, date or place. No test data or solutions.
