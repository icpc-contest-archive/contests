  contest_date: '2009-10-23'
  description: |-
    Website of the APICS Conference 2009 (Atlantic Provinces Council on the Sciences) at Dalhousie University, Oct. 23-24, 2009, in English. The conference is a student event with computer science and mathematics and statistics streams, and the annual ACM programming contest was held with it. Pages cover the home page, registration, schedule, venue, abstract submission, speakers, AARMS, accommodations, sponsors and contact details; the abstracts and proceedings page and the special sessions page say only "To be announced". The site also holds a call for papers in Word, PDF and HTML, the conference program as a PDF, an invited-speaker abstract and a PDF with an example article layout.

    The programming contest has one page: team registration through the ICPC site by October 19, 2009, the rules (Java, C or C++, five hours on Friday, October 23 from 12 to 5 pm, no IDEs, PC^2 for submissions), and the iMac environment. The schedule page puts the contest briefing at 11:30 and the contest at 12:00-5:00 in the Goldberg Computer Science Building. No problems or results are on the site; most of it concerns the conference. Our copy holds 59 files, of which 13 are distinct pages of the site.
