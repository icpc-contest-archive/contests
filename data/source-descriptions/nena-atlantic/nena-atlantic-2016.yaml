  description: |-
    Problem archive: a ZIP file of 49 files in a folder contest with seven subfolders, question1 to question7, one per problem: Magneto's Puzzle, Robot Navigation, Two Stacks of Firewood, Ocean's Anti-11, Kobayashi-Maru, Backyard Area and Royal Family Tree. Each problem has its statement in English, as plain text, PDF or LaTeX source, together with sample and judge input and output files (problem 3 has judge output and sample inputs only) and a solution program in C, C++ or Java; problem 3 also has a checker program.

    Only the statement of problem 6 has a header: University of New Brunswick, Faculty of Computer Science, dated October 1, 2016. The other statements carry no contest name, host or date, and the archive has no cover document. Comments in some solution files name the 2016 Atlantic Canadian Preliminary (Science Atlantic competition). Files are dated October 2016, except four dated July 2016 in the problem 4 folder.
