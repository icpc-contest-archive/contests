  description: |-
    Website of Cape Breton University for the 2016 Atlantic Universities Mathematics, Statistics and Computer Science Conference, held at the university in Sydney on October 14 and 15, 2016, with an AARMS session on Sunday. Our copy holds 3 pages: the conference page, the preliminary schedule and the page of the AARMS session on partial differential equations.

    The conference page covers registration, deadlines, student presentations and prizes, hotels, the Mathematics Competition and the Programming Competition, and the invited lectures. The programming competition is only a short section there: entries are due October 5 and coaches register their students through a link; the deadlines list gives October 6 for the computer science programming contest. The schedule places the Computer Science Programming Competition on Friday, October 14, 2016, from 12:30 to 17:30 in three rooms. No problems or results are on these pages, and the menu entries for the invited lectures, the mathematics competition and the programming competition lead to pages that are not in our copy.
