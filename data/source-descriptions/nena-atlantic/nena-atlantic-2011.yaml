  description: |-
    Website of Science Atlantic (formerly APICS). Our copy holds 149 saved files, 128 of them HTML pages, and most of those are the association's general pages: news items, committee and division pages, award winners, member and leadership pages.

    The pages about this contest are the committee page headed ACM ICPC Preliminary Round October 14, 2011 - St. Francis Xavier University and the pages of the Mathematics, Statistics and Computer Science Conference held at St. Francis Xavier University in Antigonish, October 14 to 16, 2011. The contest page names the first three places (Acadia University, Dalhousie University and Memorial University teams) with their members and coaches, and the local organisers, problem organiser and judges. It links the problem set, team instructions and scoreboard as PDF files; those files are not in our copy. The conference schedule lists the ACM-ICPC Programming Competition on 2011-10-14 from 12:00 PM to 05:00 PM, and the registration page lists a Competition Participant fee of 0.00 CAD. The page of the 2012 preliminary round at Mount Allison University is also in our copy.
