  description: |-
    Standings of the 2010 Saint Mary's APICS Contest: 20 teams, each with rank, team name, institution, number of problems solved, time and a citation. The first ten places carry the citations First Place to Tenth Place and the other ten teams are marked Honorable Mention. The teams come from universities in Atlantic Canada, with Saint Mary's University's CS Huskies in first place. The order does not strictly follow the solved count: the fifth-placed team has 2 problems solved, the thirteenth-placed team 5. There are no per-problem columns and no attempt counts.
