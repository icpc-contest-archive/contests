  description: |-
    Problem set of the APICS/ACM Programming Competition held on Friday, October 15, 2010, as part of the APICS 2010 Mathematics, Statistics and Comput(er/ing) Science Conference at Saint Mary's University: a PDF of 17 pages. It opens with notes on the problem set and general rules (five hours, one workstation per team, questions through PC2, a 20-minute penalty per incorrect submission on a solved problem), followed by ten problems A to J, from A, Nice Creams, to J, The Blur of the Landscape. The statements are in English and each of the ten has at least one sample input and output; the problems take one to three pages each. No test data or solutions.
