  description: |-
    Website of the 2017 Atlantic Universities Mathematics, Statistics and Computer Science Conference, held at the University of New Brunswick, Fredericton, on October 13 and 14, 2017 and sponsored by Science Atlantic and AARMS. The one-page site covers registration, the conference program, the programming contest, the math contest, the AARMS workshop of October 15, accommodations and directions. The programming contest section calls the 2017 Atlantic Canadian Preliminary Contest an official qualifying contest for the ACM International Collegiate Programming Contest, with the contest briefing and the contest from 12:30 to 17:30 on Friday, October 13, rooms, banquet and the announcement of winners on Saturday.

    Our copy holds four pages: the front page and three PDFs. The contest reference is a 5-page PDF on background, schedule, the Linux workstation environment and language runtimes, accounts and submission, scoring and printing. The conference program is a 14-page PDF with a campus map, keynote abstracts and talk abstracts. The AARMS workshop program is a 4-page PDF. Links to the contest site and scoreboard on Kattis lead outside our copy.
