    Kattis list of the eight problems whose source is the 2017 Atlantic Canadian Preliminary Contest: AVL++, Baseball Packs, Euphemisms-Shmeuphemisms, Groupthink, Integrity for spies, Optimizing Stock on Shelves, RPN Calculator and Slider Puzzle. For each problem it shows solution statistics, a percentage ratio, a difficulty rating (from 1.6 for RPN Calculator to 5.3 for Optimizing Stock on Shelves) and the language (English). The figures are those of the day the page was fetched. The statements are linked, not included.
