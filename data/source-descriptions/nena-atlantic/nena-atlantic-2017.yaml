    Zip archive of the problem set repository of the contest, 250 files, with a README saying it is the archived problem set used on October 13, 2017 at the University of New Brunswick (Fredericton). It holds a combined problems.pdf of 11 pages and eight problem folders: avlplusplus, baseball, euphemisms, groupthink, integrity, rpn, shelvesproblem and sliderpuzzle. Each folder has a statement in English (LaTeX source, some with images), sample and secret test data with answers, an input format validator, and judge submissions (accepted solutions, and for some problems wrong-answer or time-limit-exceeded ones). Problem metadata files give the source as the contest and the license as cc by-sa.
