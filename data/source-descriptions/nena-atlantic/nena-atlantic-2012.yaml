    Problem set of the 2012 ACM-ICPC Atlantic Preliminary: a PDF of 13 pages. The cover page thanks the contributors of the problems, names Mount Allison University as host and gives October 12, 2012 as the date. Eight problems follow, A to H: Crazy Trains, Speciation, The HBS Language, Area of Shapes, Egg Experiments, Alpine Hazard, Secure Transmission and A Tack-y Situation. The statements are in English and each of the eight has a sample input and output; page 13 is a figure for problem H. No test data or solutions.
