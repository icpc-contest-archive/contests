  description: |-
    Home page of the 2013 Australian Programming Contest (AUPC-2013), a single page in English. A line at the top says the contest is finished and points to the ICPC results page; below it are the dates of three contests, New Zealand on 17 August 2013, Australian on 7 September 2013 and South Pacific on 21 September 2013. The page then lists the contest locations (Auckland, Christchurch, Dunedin, Brisbane, Sydney, Melbourne, Perth, Manila and Egypt) with start times for some of them, the team composition and eligibility rules, a list of frequently asked questions, the scoring rules (ranking by problems solved, then least total time, 20 penalty minutes per rejected run) and the contest conduct: DOMjudge as the judging system, Java, C and C++ as the languages (Python and C# submissions are judged but make a team ineligible for prizes), five hours, at least six problems.

    There are no results, scoreboard or problems on the page. The links it names are written as plain text.
