  description: |-
    Website of the 2003 ACM ICPC Asia Region Kanpur Site, hosted by the Indian Institute of Technology Kanpur, in English. The contest was held at two centres, IIT Roorkee and Jadavpur University, Kolkata. Our copy holds 87 pages, but only 12 HTML pages and a few downloads belong to the contest site: the director's report, a contact page and a contact page of the Kolkata centre, a Kolkata centre page with its schedule, travel notes and team list, the people page, the regional contest rules, a results page, and a problem set page.

    The problem set is in our copy as a PDF of 13 pages with problems A to H, each with a statement and a sample, and as a Word file. The PC2 contestant's guide and a contest environment document are also present as Word files. The rest of the crawl is pages of the Computer Science department of IIT Kanpur that are not about the contest.
