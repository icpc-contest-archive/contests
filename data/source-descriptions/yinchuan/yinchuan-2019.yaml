    Editorial slides by "The Testers", a PDF of 16 pages in Chinese with English headings, titled "The 2019 ICPC Asia Yinchuan Regional Programming Contest Analysis". The title page carries the date 2019 年 11 月 30 日 (2019 nián 11 yuè 30 rì, "30 November 2019"). Pages 2 to 15 give one slide per problem, from "Problem A. Girls Band Party" to "Problem N. Fibonacci Sequence", and page 16 says "Thank you!".

