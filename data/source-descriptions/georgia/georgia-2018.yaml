  description: |-
    Archive site of the Northern Eurasia contests (NEERC), in English. Our copy holds 150 files (120 HTML pages, 29 PDFs and one zip of runs), which are 62 distinct addresses fetched in http, https and port-80 variants. Its entry page is the archive page for NEERC 2018, which lists the final standings, problems, official tests and jury archive of the final, and links to the regional contests of that year, among them Georgia.

    The copy includes the Georgia subregional standings page for 2018 and the standings pages of the other 2018 and 2019 regional contests, the final standings of the 2018 and 2019 finals, the 2018 final's statement, analysis and review PDFs and zip of runs, the 2019 final's statement and tutorial PDFs, and the Northern subregional statements and analysis (2018) and the Northwest Russia statements and tutorials (2019). It also holds Georgia standings pages for other seasons (2004 to 2017, 2019 to 2022, 2025) and the archive pages for 2018 and 2019.

    Links to tests, jury archives and most other years are not in our copy.
