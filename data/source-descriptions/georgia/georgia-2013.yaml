  description: |-
    Part of the NEERC (Northern Eurasia) archive site, whose home page is titled "Northern Eurasia Contests". Our copy holds 150 files under 63 distinct addresses (several pages are saved under more than one address form). They are the archive pages for the 2013 and 2014 finals, which link standings, problem statements, tests and the standings of the regional contests, together with the finals and regional standings pages of those two seasons, an XML file of northern subregional standings, and seven distinct PDFs: problem statements of the 2013 and 2014 finals (14 and 15 pages), of the northern subregional (15 and 14 pages), review slides of the finals' problems (13 and 21 pages) and an analysis PDF of the 2014 northern subregional. The test and generator archives that the archive pages link are not in our copy.

    For this edition the site has the standings page headed "ACM ICPC 2013-2014, NEERC, Georgia Subregional Contest", a scoreboard for problems A to L with 47 named teams. Georgia standings pages of other seasons are also held: 20 in all, for the seasons 2004-2005 to 2022-2023 and 2025-2026. Pages are in English.
