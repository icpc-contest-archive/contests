  description: |-
    Final scoreboard headed "ACM ICPC 2013-2014, NEERC, Georgia Subregional Contest", with the clock at 5:00:00 of 5:00:00 and status "over": 60 rows, of which 47 carry a team name and 13 have an empty name cell, all 13 with no solved problems. Ranks run 1 to 43 and then 44 is shared by the last 17 rows. Each named row gives the team name followed by its members after a colon, one cell for each of the problems A to L showing a plus sign for accepted, a minus sign with a count for rejected runs only, or a dot for no attempt, with the solve time in minutes where solved, then problems solved and penalty time. Eight team names start with an asterisk, seven of them with the prefix Sch_, which the page does not explain; the first-place team, Tbilisi SU Old Team, which solved 8 problems, is one of them. Summary rows per problem give total runs, accepted, rejected, first accept and last accept. A script on the page toggles the display of times.
