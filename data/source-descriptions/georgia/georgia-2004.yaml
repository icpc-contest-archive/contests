  description: |-
    Archive pages of the Northern Eurasia Contests (NEERC) site, in English; the Georgian subregional contest has no site of its own in our copy. Our copy holds 150 pages from 63 distinct addresses; many addresses are captured two or three times, under http, https and port-80 forms and on different dates. They include the archive pages for 2004 and 2005. The 2004 page lists, for the finals, standings, problems in PDF, a jury archive, a history file for watching the contest, runs and picture galleries; the 2005 page lists standings, problems in PDF and PostScript, tests with jury solutions and a history file. Each page then lists the subregional contests, where the Georgia entry is a single link to its standings. For 2004 the copy holds 19 standings pages of subregional contests (15 subregions, some with separate pages per day), among them the Georgia page, and the finals standings; it also holds two PDFs of 14 pages each with the finals problem statements of 2004 and 2005.

    The Georgia standings pages of 2005 to 2022 and 2025 are in our copy as well; each carries its own contest year or season in its heading. The Georgia pages for 2023 and 2024 are not in it.
