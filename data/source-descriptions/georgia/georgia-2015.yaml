  description: |-
    Archive site of the Northern Eurasia contests (NEERC), in English. Our copy holds 150 files, which are 63 distinct addresses fetched under http, https and port-80 variants. Its entry page is the archive page for NEERC 2015, which lists the final standings, problems, official tests and jury archive of the final, and links to the regional contests of that year, among them Georgia.

    The copy includes the Georgia subregional standings page for 2015 and the standings pages of the other 2015 and 2016 regional contests, the final standings of the 2015 and 2016 finals, the finals' problem statements and the problems review PDFs of 2015-2016 (40 pages) and 2016-2017 (49 pages), and the Northern subregional statements and analysis PDFs. It also holds Georgia standings pages for other seasons (2004, 2006 to 2014, 2016 to 2022, 2025) and the archive pages for 2015 and 2016.

    Links to tests, jury archives and most other years are not in our copy.
