  description: |-
    Final scoreboard of the Georgian Regional 2020, with the contest clock at 5:00:00 of 5:00:00 and status over. It lists 51 teams, each with its members, ranked by problems solved and then time. Thirteen problems, A to M, have a cell per team showing a plus or minus sign, the number of rejected attempts and the minute of the accepted run; the last columns give the number solved and the total time. First place is a team with 13 problems and 1660 minutes.

    22 of the 51 team names begin with an asterisk, which the page does not explain. Below the table are totals per problem: total runs, accepted, rejected, and the times of the first and last accepted run. The style sheet is in our copy.
