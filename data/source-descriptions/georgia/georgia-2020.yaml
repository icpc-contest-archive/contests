  title: Northern Eurasia Contests
  language:
  - en
  pages: 150
  description: |-
    Archive site of the Northern Eurasia Contests (NERC), in English, as it stood for the 2020 edition. The seed page is the NERC 2020 archive page, with a year menu from 1996 to 2020 and links to the finals' standings, problems, jury archive, tutorial and runs, for the online and offline contests. Of the regional contests only Northwestern Russia is listed there; Georgia is not mentioned.

    Our copy holds 150 pages, several of them saved under both http and https. They cover the archive index, the year pages for 1996 to 2018, 2020 and 2021, the NERC finals standings and statement and tutorial PDFs of 2020 and 2021, and regional standings pages of 2020 and 2021 for Ural, Armenia, Taurida, Northwestern Russia, Azerbaijan, Kazakhstan, Uzbekistan and Georgia. The Georgian regional standings pages of 20 editions are inside, 2004 to 2022 and 2025, among them 'Georgian Regional 2020'. The site is the NERC archive, not a website of the Georgian contest itself.
