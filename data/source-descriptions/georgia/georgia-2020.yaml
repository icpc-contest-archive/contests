    Standings page in Russian from a Yandex contest site, headed 'Georgian Regional 2020' (Положение участников, 'standings of participants'), for a contest of 5 hours with tabs for a trial contest and the main contest. The table lists teams 1 to 50 with problems A to M; each problem heading carries two counts, for example 51 / 69 for A, and each cell shows a sign, rejected attempts and the time as hours and minutes. The last columns are points (Очки) and penalty (Штраф). 21 of the 50 team names begin with an asterisk, which the page does not explain. The interface can be switched to English, Armenian, Kazakh or Uzbek.

    This is the first of two result pages: the link to page 2 leads to the live site and is not in our copy, so teams below 50th place are missing. Style sheets and scripts are in our copy.
