    Scoreboard of the Georgia Regional Contest 2025-2026 with the clock at 5:00:00 of 5:00:00 and status over: 45 teams against twelve problems A to L. For each problem a cell shows a plus with the solve time in minutes (and the number of rejected attempts before it, if any), a minus with the number of rejected attempts for an unsolved problem, or a dot when unattempted; the last two columns give the number solved and the total time. Most teams are named by university and number with the members in brackets; five rows are marked with an asterisk and give only member names. Ranks run from 1 to 41, with five teams sharing rank 41 with no problems solved. Free U of Tbilisi: 2 is first with 7 solved and 611. Summary rows at the bottom give total runs, accepted, rejected, first accept and last accept per problem. A Show time control is part of the page.
