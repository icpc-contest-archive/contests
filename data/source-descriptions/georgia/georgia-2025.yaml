  contest_date: '2025-11-15'
  description: |-
    Page of the Georgia Regional Contest on the Northern Eurasia Contests website, which hosts the regional contests and finals of the region. It gives the contest date (15 November 2025), lines for the Tbilisi and Kutaisi sites, a list of contacts by role (contest director, chief judge, technical committee, assistant), and links to the contest standings and to an archive of all runs made during the contest. An archive section lists earlier editions of the Georgia contest back to 2004, most with a standings link, and one (2007) with problem statements in PDF and tests with jury solutions; the headings for 2024 and 2023 have no links.

    Our copy holds 111 pages of the site: the seed page, the standings pages of twenty Georgia editions (2004-05 to 2022-23 and 2025-26), the pages of the other regional contests, 31 Northern Eurasia Finals pages from 1995 to 2025 with the 2025 problem statement, tutorial and brochure as PDFs, the archive index and the information and contacts pages. The runs archive for Georgia 2025 is saved as a 7z file. The site is in English; the information page and some other pages also have Russian text.
