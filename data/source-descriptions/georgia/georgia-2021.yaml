  title: Northern Eurasia Contests
  language:
  - en
  pages: 150
  description: |-
    Archive site of the Northern Eurasia Contests (NERC), in English, as it stood for the 2021 edition. The seed page is the NERC 2021 archive page, which lists the finals' standings, problems, jury archive, analysis and runs, links to the opening video and a contestant handbook, and the regional contests Armenia, Azerbaijan, Georgia, Kazakhstan, Northwestern Russia, Taurida and Ural, each with a standings link. An older copy of the same page, saved under https, lists Georgia as 'No information is available'.

    Our copy holds 150 pages, which are 80 distinct addresses, several saved under both http and https. They cover the archive index and the year pages from 1996 to 2022, the NERC finals standings and statement and tutorial PDFs of 2021 and 2022, and regional standings pages of 2021 and 2022 for Ural, Armenia, Taurida, Northwestern Russia, Azerbaijan, Kazakhstan, Uzbekistan and Georgia. The Georgian regional standings pages of 20 editions are inside, 2004 to 2022 and 2025, among them 'Georgian Regional 2021. Main Round.' The site is the NERC archive, not a website of the Georgian contest itself.
