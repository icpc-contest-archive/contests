  description: |-
    Final scoreboard of the Georgian Regional 2021, Main Round, with the contest clock at 5:00:00 of 5:00:00 and status over. It lists 34 teams, each with its members, ranked by problems solved and then time; the last two places are tied at 33. Fourteen problems, A to N, have a cell per team showing a plus or minus sign, the number of rejected attempts and the minute of the accepted run; the last columns give the number solved and the total time. First place is Tbilisi FreeUni 1 with 13 problems and 1585 minutes.

    Below the table are totals per problem: total runs, accepted, rejected, and the times of the first and last accepted run. The style sheet is in our copy.
