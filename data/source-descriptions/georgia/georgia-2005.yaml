  description: |-
    Archive section of the Northern Eurasia Contests site, in English, as it stood for the 2005 edition. It is the series' site, not one made for Georgia alone: the archive pages of 2005 and 2006 list the NEERC finals and the regional contests, among them Georgia, Armenia, Azerbaijan, Kazakhstan, Kyrgyzstan and Uzbekistan, each with a link to its final standings.

    Our copy holds 150 saved files, 141 HTML pages and 9 PDFs, which are 60 distinct pages saved under several address forms. They are the archive pages of 2005 and 2006, the standings pages of the finals and of many regional contests of both years, three PDFs of problem statements (the 2005 one has 14 pages and problems A to K, the first being Area 51), and the Georgia standings pages of 2004, 2005 to 2022 and 2025. The Georgia 2005 page is a final scoreboard of 24 teams.

    The style sheet that the standings pages refer to is not in our copy, which holds only HTML and PDF files.
