  description: |-
    Part of the NEERC (Northern Eurasia) archive site, whose home page is titled "Northern Eurasia Contests". Our copy holds 150 files under 63 distinct addresses (several pages are saved under more than one address form). They are the archive pages for the 2012 and 2013 finals, which link standings, problem statements, tests and the standings of the regional contests, together with the finals and regional standings pages of those two seasons, two XML files of northern subregional standings, and seven distinct PDFs: problem statements of the 2012 and 2013 finals (14 pages each), of the northern subregional (13 and 15 pages), and of a 2012 central-region quarterfinal (20 pages), and review slides of the finals' problems for 2012 and 2013 (13 pages each). The test and generator archives that the archive pages link are not in our copy.

    For this edition the site has the standings page headed "ACM ICPC 2012-2013, NEERC, Georgia Subregional Contest", a scoreboard of 51 teams for problems A to L. Georgia standings pages of other seasons are also held: 20 in all, for the seasons 2004-2005 to 2022-2023 and 2025-2026. Pages are in English.
