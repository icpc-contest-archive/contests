  description: |-
    Standings of the Georgia Subregional Contest: 47 teams with rank, team, institution, problems solved and total time, followed by medal, citation and site citation columns. The top four teams carry gold medals, the next four silver and the next four bronze; places 13 to 23 are labelled as ordinal places and the last 24 teams as Honorable Mention, with ties sharing a rank. Tbilisi SU #2 Scadoosh, of I. Javakhishvili Tbilisi State University, is first with 5 problems and is cited as champion of the Georgia Subregional Contest. There are no per-problem columns.
