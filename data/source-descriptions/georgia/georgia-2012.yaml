  description: |-
    Final scoreboard headed "ACM ICPC 2012-2013, NEERC, Georgia Subregional Contest", with the clock at 5:00:00 of 5:00:00 and status "over": 51 teams with ties ranked equal (45 distinct ranks). Each row gives the team name with its members, one cell for each of the problems A to L showing a plus sign for accepted, a minus sign with a count for rejected runs only, or a dot for no attempt, with the solve time in minutes where solved, then problems solved and penalty time. Three teams (ranked 2, 4 and 11) have a name starting with an asterisk, which the page does not explain. Tbilisi SU #2 Scadoosh is first with 5 problems. Summary rows per problem give total runs, accepted, rejected, first accept and last accept. A script on the page toggles the display of times.
