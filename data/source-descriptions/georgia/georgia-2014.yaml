    Standings of the Georgia Subregional Contest: 36 teams with rank, team, institution, problems solved, total time and citation. Places one to eighteen carry ordinal citations from First Place to Eighteenth Place and the remaining 18 teams are listed as Honorable Mention, with ties sharing a rank. Tbilisi FreeUni 1, of the Free University of Tbilisi, is first with 7 problems. There are no per-problem columns and no medal column.
