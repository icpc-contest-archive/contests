  description: |-
    Final scoreboard headed "ACM ICPC 2014-2015, NEERC, Georgia Subregional Contest, Practice Session", with the clock at 5:00:00 of 5:00:00 and status "over": 41 team rows with ties ranked equal, 35 distinct ranks. Each row gives the team name with member surnames in brackets (not given for the two Donetsk SU teams; the Sch_Batumi team has one name after a colon instead), one cell for each of the problems A to K showing a plus sign for accepted, a minus sign with a count for rejected runs only, or a dot for no attempt, with the solve time in minutes where solved, then problems solved and penalty time. Three team names (ranked 12 and 35) start with an asterisk, which the page does not explain. Free University of Tbilisi 1 is first with 7 problems. Summary rows per problem give total runs, accepted, rejected, first accept and last accept. A script on the page toggles the display of times.
