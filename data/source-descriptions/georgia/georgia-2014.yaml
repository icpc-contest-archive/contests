  description: |-
    Part of the NEERC (Northern Eurasia) archive site, whose home page is titled "Northern Eurasia Contests". Our copy holds 150 files under 64 distinct addresses (several pages are saved under more than one address form). They are the archive pages for the 2014 and 2015 finals, which link standings, problem statements, tests and the standings of the regional contests, together with the finals and regional standings pages of those two seasons and eight distinct PDFs: problem statements of the 2014 and 2015 finals (15 and 14 pages) and of the northern subregional of both seasons, review slides of the finals' problems (21 and 40 pages) and analysis PDFs of the northern subregional of both seasons. The test and generator archives that the archive pages link are not in our copy.

    For this edition the site has the standings page headed "ACM ICPC 2014-2015, NEERC, Georgia Subregional Contest, Practice Session", a scoreboard for problems A to K with 41 teams. Georgia standings pages of other seasons are also held: 20 in all, for the seasons 2004-2005 to 2022-2023 and 2025-2026. Pages are in English.
