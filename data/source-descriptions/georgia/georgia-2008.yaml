  description: |-
    Archive section of the Northern Eurasia Contests site, in English, as it stood for the 2008 edition. It is the series' site, not one made for Georgia alone: the archive pages of 2008 and 2009 list the NEERC finals and the regional contests, among them Georgia, Armenia, Azerbaijan, Kazakhstan, Kyrgyzstan and Uzbekistan, each with a link to its final standings.

    Our copy holds 150 saved files, 139 HTML pages, 9 PDFs and 2 PPS presentations, which are 58 distinct addresses once the http, https and port-80 forms are merged. They are the archive pages of 2008 and 2009, the standings pages of the finals and of many regional contests of both years, three PDFs of problem statements, and the Georgia standings pages of 2004 to 2022 and 2025. The Georgia 2008 page is a final scoreboard of 23 teams.

    The style sheet that the standings pages refer to is not in our copy, which holds only HTML, PDF and PPS files.
