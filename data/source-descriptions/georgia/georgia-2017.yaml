  description: |-
    Archive site of the Northern Eurasia contests (NEERC), in English. Our copy holds 150 files (120 HTML pages, 29 PDFs and one zip of runs), which are 60 distinct addresses fetched in http, https and port-80 variants. Its entry page is the archive page for NEERC 2017, which lists the final standings, problems, official tests and jury archive of the final, and links to the regional contests of that year, among them Georgia.

    The copy includes the Georgia subregional standings page for 2017 and the standings pages of the other 2017 regional contests, the final standings of the 2017 and 2018 finals, the problem statements and analysis PDFs of the 2017 final, the statements, analysis, review and zip of runs of the 2018 final, and the Northern subregional statements and analysis PDFs. It also holds Georgia standings pages for other seasons (2004 to 2016, 2018 to 2022, 2025) and the archive pages for 2017 and 2018.

    Links to tests, jury archives and most other years are not in our copy.
