  description: |-
    Final standings of the Georgia Subregional Contest 2017-2018, shown with the page header "5:00:00 of 5:00:00, status: over". The scoreboard has 52 teams in rows, named by institution and number with three surnames, a column for each of 12 problems A to L giving attempts and solve time, the number solved, and total time; a summary below gives total runs, accepted, rejected, first accept and last accept per problem. Two teams have 11 problems solved, the first with a total time of 970 (the page states no unit). Ranks run from 1 to 48, and the last five rows share rank 48 with no problem solved.

    The page has no links, no medal marks and no separate institution column.
