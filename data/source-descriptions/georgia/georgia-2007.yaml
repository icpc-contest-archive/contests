    Problem set as a PDF of 11 pages, in English, headed on every page "ACM ICPC 2007-2008, NEERC, Georgiya and Uzbekistan Subregional Contests" with Batumi, Tashkent and the date October 28, 2007. It holds eleven problems A to K, one to a page: A+B, Beer Refrigerator, Crosses and Crosses, Domestic Networks, Elevator, Formula, Given a string, History of Football, iChess, Journey with Pigs, and K'ak'-u-pakal and Mayan Script.

