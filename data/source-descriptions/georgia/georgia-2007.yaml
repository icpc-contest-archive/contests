  description: |-
    Archive section of the Northern Eurasia Contests site, in English, as it stood for the 2007 edition. It is the series' site, not one made for Georgia alone: the archive pages of 2007 and 2008 list the NEERC finals and the regional contests, among them Georgia, Armenia, Kazakhstan, Kyrgyzstan and Uzbekistan, each with a link to its final standings; on the 2007 page Azerbaijan reads "No information is available". The Georgia entry of 2007 also links problem statements in PDF and a tests archive.

    Our copy holds 150 saved files, 138 HTML pages and 12 PDFs, which are 57 distinct addresses once the http, https and port-80 forms are merged. They are the archive pages of 2007 and 2008, the standings pages of the finals and of many regional contests of both years, four PDFs of problem statements, and the Georgia standings pages of 2004 to 2022 and 2025. The Georgia 2007 problem statements and the Georgia 2007 standings page, a final scoreboard of 32 teams, are in it; the tests archive is not.

    The style sheet that the standings pages refer to is not in our copy, which holds only HTML and PDF files.
