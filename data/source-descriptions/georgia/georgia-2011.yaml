  description: |-
    Final scoreboard headed "ACM ICPC 2011-2012, NEERC, Georgia Subregional Contest", with the clock at 5:00:00 of 5:00:00 and status "over": 31 teams ranked 1 to 31 without ties. Each row gives the team name with member surnames in brackets (blank for two Batumi SU teams), one cell for each of the problems A to K showing a plus sign for accepted, a minus sign with a count for rejected runs only, or a dot for no attempt, with the solve time in minutes where solved, then problems solved and penalty time. Tbilisi SU #1 Brontozavri is first with 9 problems. Summary rows per problem give total runs, accepted, rejected, first accept and last accept. A script on the page toggles the display of times.
