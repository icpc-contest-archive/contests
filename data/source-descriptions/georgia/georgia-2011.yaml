  description: |-
    Part of the NEERC (Northern Eurasia) archive site, whose home page is titled "Northern Eurasia Contests". Our copy holds 150 files under 62 distinct addresses (several pages are saved under more than one address form). They are the archive pages for the 2011 and 2012 finals, which link the finals standings, problem statements, tests, analysis and the standings of the regional contests, together with the finals and regional standings pages of those two seasons and seven distinct PDFs: problem statements of the 2011 and 2012 finals (16 and 14 pages), of the northern subregional (13 pages each year) and of a 2012 central-region quarterfinal (20 pages), and analysis slides for the 2011 and 2012 finals (13 pages each). The test and generator archives that the archive pages link are not in our copy.

    For this edition the site has the standings page headed "ACM ICPC 2011-2012, NEERC, Georgia Subregional Contest", a scoreboard of 31 teams for problems A to K. Georgia standings pages of other seasons are also held: 20 in all, for the seasons 2004-2005 to 2022-2023 and 2025-2026. Pages are in English.
