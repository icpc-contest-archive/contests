  description: |-
    Archive section of the Northern Eurasia Contests site, in English, as it stood for the 2006 edition. It is the series' site, not one made for Georgia alone: the archive pages of 2006 and 2007 list the NEERC finals and the regional contests, among them Georgia, Armenia, Kazakhstan, Kyrgyzstan and Uzbekistan, each with a link to its final standings; on the 2006 page Azerbaijan reads "No information is available".

    Our copy holds 149 saved files, 134 HTML pages and 15 PDFs, which are 57 distinct addresses once the http, https and port-80 forms are merged. They are the archive pages of 2006 and 2007, the standings pages of the finals and of many regional contests of both years, five PDFs of problem statements for 2006 and 2007, and the Georgia standings pages of 2004 to 2022 and 2025. The Georgia 2006 page is a final scoreboard of 27 teams.

    The style sheet that the standings pages refer to is not in our copy, which holds only HTML and PDF files.
