  description: |-
    Archive section of the Northern Eurasia Contests site, in English, as it stood for the 2009 edition. It is the series' site, not one made for Georgia alone: the archive pages of 2009 and 2010 list the NEERC finals and the regional contests, among them Georgia, Armenia, Azerbaijan, Kazakhstan, Kyrgyzstan and Uzbekistan, each with a link to its final standings, except that on the 2010 page Kyrgyzstan and Azerbaijan read "No information is available".

    Our copy holds 150 saved files, 128 HTML pages, 20 PDFs and 2 PPS presentations, which are 60 distinct addresses once the http, https and port-80 forms are merged. They are the archive pages of 2009 and 2010, the standings pages of the finals and of many regional contests of both years, PDFs of problem statements and analysis, and the Georgia standings pages of 2004 to 2022 and 2025. The Georgia 2009 page is a final scoreboard of 26 teams.

    The style sheet that the standings pages refer to is not in our copy, which holds only HTML, PDF and PPS files.
