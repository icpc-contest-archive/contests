    Final scoreboard of the Georgia Subregion contest of ACM ICPC 2009-2010, NEERC, with the clock reading 5:00:00 of 5:00:00 and status over: 26 teams and eleven problems A to K. Each row gives rank, team, one cell per problem with rejected attempts and solve time in minutes, the number solved and the total time. Teams are named by institution, most with a number. The first place, Tbilisi SU 1, solved eight problems; fourteen teams solved at least one problem and the other twelve share rank 15 with none solved. Nobody solved problems E and G.

    Summary rows at the bottom give total runs, accepted, rejected, first accept and last accept per problem.
