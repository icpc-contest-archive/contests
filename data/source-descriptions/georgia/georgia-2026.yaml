  description: |-
    Page of the Georgia Regional Contest on the Northern Eurasia Contests website, which hosts the regional contests and finals of the region. For 2026 it gives the contest date (14 November 2026), a list of contacts by role (contest director, chief judge, technical committee, assistant) and a link to the contest standings; no problem statements or runs are linked for 2026. An archive section lists earlier editions back to 2004, most with a standings link, the 2025 edition also with an archive of all runs, and the 2007 edition with problem statements in PDF and tests with jury solutions; the headings for 2024 and 2023 have no links.

    Our copy holds 124 pages of the site: the seed page, the standings pages of twenty-one Georgia editions (2004-05 to 2022-23, 2025-26 and 2026-27), the pages of the other regional contests, 32 Northern Eurasia Finals pages from 1995 to 2026, 31 archive pages by year, the information and contacts pages, and eight PDFs: the 2007 problems and seven statements of finals from 2019 to 2025. The runs archive of Georgia 2025 is saved as a 7z file. The site is in English; the information page also has Russian text.
