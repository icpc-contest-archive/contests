    Scoreboard of the ICPC 2026-2027 Georgia Regional Contest with the clock at 5:00:00 of 5:00:00 and status over: 40 teams against fourteen problems A to N. For each problem a cell shows a plus with the solve time in minutes (and the number of rejected attempts before it, if any), a minus with the number of rejected attempts for an unsolved problem, or a dot when unattempted; the last two columns give the number solved and the total time. Teams are named by university and team name with three members in brackets; two rows, both teams named School, are marked with an asterisk. Ranks run from 1 to 40, one team per rank. Tbilisi FreeUni 1 of Free U of Tbilisi is first with 9 solved and 1154. Summary rows at the bottom give total runs, accepted, rejected, first accept and last accept per problem. A Show time control is part of the page.
