  description: |-
    Archive site of the Northern Eurasia contests (NEERC), in English. Our copy holds 150 files, which are 62 distinct addresses fetched under http, https and port-80 variants. Its entry page is the archive page for NEERC 2016, which lists the final standings, problems, official tests, jury archive and problems review of the final, and links to the regional contests of that year, among them Georgia.

    The copy includes the Georgia subregional standings page for 2016 and the standings pages of the other 2016 and 2017 regional contests, the final standings of the 2016 and 2017 finals, the finals' problem statements and the 2016 problems review and 2017 analysis PDFs, and the Northern subregional statements and analysis PDFs. It also holds Georgia standings pages for other seasons (2004, 2006 to 2015, 2017 to 2020) and the archive pages for 2016 and 2017.

    Links to tests, jury archives and most other years are not in our copy.
