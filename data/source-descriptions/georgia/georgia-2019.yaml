  pages: 150
  description: |-
    Archive site of the Northern Eurasia Contests (NERC), in English, as it stood for the 2019 edition. The seed page is the 2019 archive page, with a year menu from 1996 to 2020 and, for the finals, links to standings, problems, a jury archive and problem analysis; in the list of regional contests only Northwestern Russia has material, and the entry for Georgia reads that no information is available.

    Our copy holds 150 pages, several of them saved under both http and https. They are mostly standings pages of the regional contests of 2019 and 2020, plus the NERC 2019 and 2020 statements and tutorials as PDFs and a few Northwestern Russia files. The Georgian regional standings pages of 20 editions are inside, 2004 to 2022 and 2025, among them the 2019 page 'Georgian Regionals 2019' with all 13 problems and the 2019 'Open South Caucasus Championship' standings. The site is the NERC archive, not a website of the Georgian contest itself, and nothing in it announces or describes that contest beyond the standings.
