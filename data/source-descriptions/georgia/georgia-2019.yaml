  description: |-
    Final standings of the 2019 Georgia Regional Contest: 47 teams with rank, team, institution, number solved and total time, ending with Batumi SU3 with no problems solved. The Citation column names the first 23 places (First Place to Twenty-third Place) and gives the remaining 24 teams Honorable Mention. 19 of the 47 teams are from the Free University of Tbilisi; the others come from other universities in Tbilisi, Batumi and Kutaisi. First place is Tbilisi FreeUni 1 with 13 solved and 749 minutes.

    No per-problem results and no attempt counts are given.
