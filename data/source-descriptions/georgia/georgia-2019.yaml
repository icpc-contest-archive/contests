  description: |-
    Final scoreboard of the Georgian Regionals 2019, with the contest clock at 5:00:00 of 5:00:00 and status over. It lists 47 teams, each with its three or two members, ranked by problems solved and then time. Thirteen problems, A to M, have a cell per team showing a plus or minus sign, the number of rejected attempts and the minute of the accepted run; the last columns give the number solved and the total time. First place is Tbilisi FreeUni 1 with 13 problems and 749 minutes.

    Below the table are totals per problem: total runs, accepted, rejected, and the times of the first and last accepted run. A checkbox on the page shows or hides the times. The style sheet is in our copy.
