  pages: 150
  description: |-
    Archive site of the Northern Eurasia Contests (NERC), in English, as it stood for the 2022 edition. The seed page is the NERC 2022 archive page, which lists the finals' standings, problems, analysis, jury archive and runs, links to the opening video and a contestant handbook, and the regional contests Armenia, Azerbaijan, Georgia, Kazakhstan, Northwestern Russia, Taurida, Ural and Uzbekistan, each with a standings link. An older copy of the same page, saved under https, lists Georgia as 'No information is available'.

    Our copy holds 150 pages, which are 76 distinct addresses, several saved under both http and https. They cover the archive index, the year pages for 1996 to 2012, 2022 and 2023, the NERC finals standings and statement and tutorial PDFs of 2022 and 2023 with the 2023 site standings, and regional standings pages of 2022 and 2023 for Ural, Armenia, Taurida, Northwestern Russia, Azerbaijan and Kazakhstan, and for 2022 Uzbekistan. The Georgian regional standings pages of 20 editions are inside, 2004 to 2022 and 2025, among them 'Georgia Regional Contest, ICPC 2022/2023.' The site is the NERC archive, not a website of the Georgian contest itself.
