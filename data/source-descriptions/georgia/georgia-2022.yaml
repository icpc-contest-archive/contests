  description: |-
    Final scoreboard of the Georgia Regional Contest, ICPC 2022/2023, with the contest clock at 5:00:00 of 5:00:00 and status over. It has 55 rows: 48 named teams, each with its members, and 7 rows named Reserved 3 to Reserved 9 with no members listed and no problems solved. Fourteen problems, A to N, have a cell per team showing a plus or minus sign, the number of rejected attempts and the minute of the accepted run; the last columns give the number solved and the total time. First place is Tbilisi FreeUni 1 with 10 problems and 1596 minutes.

    Four team names begin with an asterisk, which the page does not explain. All teams with no problem solved, the Reserved rows included, share rank 41. Below the table are totals per problem: total runs, accepted, rejected, and the times of the first and last accepted run. The style sheet is in our copy.
