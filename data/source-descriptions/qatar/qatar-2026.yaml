  description: |-
    News article from The Peninsula Qatar, published 15 October 2026, that reports that Carnegie Mellon University in Qatar hosted the seventh annual Qatar Collegiate Programming Contest with 100 high school teams and 35 university teams, organised by the Hamad Bin Jassim Centre for Computer Science Education with prizes sponsored by Doha Insurance Group. In the university track teams from Carnegie Mellon University in Qatar took gold, silver and bronze; in the high school track DPS-Modern Indian School won gold, Park House English School silver and Birla Public School bronze. The top two teams of each track advance to the Africa and Arab Collegiate Programming Championship. Only the medal places are given, not a full ranking; teams are named only by institution or school, with no scores or problems.

    The page also carries one photograph caption and quotes from the dean of CMU-Q, the chief executive of the Jassim and Hamad Bin Jassim Charitable Foundation and the lead organiser, plus the site's menus and links to other news.
