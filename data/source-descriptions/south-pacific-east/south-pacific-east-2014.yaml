  description: |-
    Scoreboard page headed 'Eastern Division Scoreboard' and 'Final Standings', produced by DOMjudge: 18 teams against nine problems, A to I. Each row gives rank, institution abbreviation with country flag, team name, number solved, penalty time and, for each problem, the number of tries with the solving minute and penalty minutes in brackets for solved problems. A summary row closes the table. First place is Trigraph (WKTO, the University of Waikato) with 7 solved. The page links to the Eastern Division results page and to a Schools Scoreboard, and has a legend for the Qualifiers category and cell colours; it was last updated on 2 September 2014.

    Only one of the page's images is saved with our copy.
