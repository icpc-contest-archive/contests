  title: 2014 South Pacific Region Contests
  language:
  - en
  contest_date: '2014-08-30'
  description: |-
    Website of the South Pacific Region contests, in English. Our copy holds 66 pages. The seed page, '2014 South Pacific Region Contests', says the divisional contests, sponsored by IBM, were held on Saturday 30 August 2014 at 13 sites, lists the teams that qualified for the Regional Finals from the Western, Central and Eastern Divisions, and reports the Regional Finals in Sydney on 26 September.

    For the Eastern Division there is a page, '2014 Eastern Divisional Contest', naming the six host cities, the qualifying teams, and links to the scoreboard, a photo gallery and the problem set. The site also has 2014 pages for the Western and Central Divisions, the Regional Finals (placings, teams, presentations, galleries), 2014 problem sets as PDFs for each division and for the Finals, and World Finals results pages for 2014 and 2015.

    The site covers the 2015 contests as well, with its own pages, problem sets and solution sketches as PDFs. The photo galleries are present as pages, but almost all their images are missing from our copy (one image file is saved).
