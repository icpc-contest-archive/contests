    Problem set of the Eastern Divisional Contest of 30 August 2014: a PDF of 20 pages, in English, headed 'Eastern Divisional Contest 30th August 2014 Problem Set'. It holds nine problems, A to I (Ages, Sequences, Falling Stock Prices, Large Headquarters Collider (LHC), Chaos, Statement Ordering, Time Zones, Trivial, Sand Drawings). Each problem has a statement with time limit, input and output description and sample input and output. No test data or solutions.
