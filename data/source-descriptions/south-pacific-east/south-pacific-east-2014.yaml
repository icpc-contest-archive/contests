    Standings of the ACM South Pacific Eastern Division: 18 teams from eight institutions, with rank, team, institution, number solved, total time, a citation and a site citation. No per-problem detail. Places 1 to 9 are named (First Place to Ninth Place) and the rest are Honourable Mention; the site citation reads Qualify for four teams. First place is Trigraph of The University of Waikato with 7 solved, and two teams share rank 17 with no problems solved.
