  description: |-
    Website of the South Pacific Region contests, in English. Our copy holds 111 pages among 138 files. The seed page, 'Eastern Division' (area: Fiji and New Zealand), gives the date of the 2016 contest, Saturday 8 October 2016.

    For the 2015 contest the site has a page '2015 Eastern Divisional Contest' with a report of the 22 August divisional contest (16 teams at Auckland, Christchurch, Dunedin, Invercargill, Suva and Wellington) and links to the qualifiers, scoreboard, photo gallery and problem set. A '2015 South Pacific Region Contests' page reports that the divisional contests were held at 13 sites with 73 teams and lists the teams qualifying for the Regional Final in Auckland. There are matching pages for the Western and Central Divisions, the 2015 Regional Final and its celebration, a page of 2015 problem sets, and World Finals results pages for 2015 and 2016.

    PDFs include the 2015 divisional problem sets for East, West and Central, and a solution sketch for each division. The site also holds pages and PDFs of the 2016 contests. The photo galleries are present as pages, but their images are mostly missing from our copy (27 image files are saved).
