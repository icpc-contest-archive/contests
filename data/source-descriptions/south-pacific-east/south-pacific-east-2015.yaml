  description: |-
    Final standings of the Eastern Division, as a DOMjudge scoreboard page headed 'Eastern Division Scoreboard': 16 teams against eleven problems, A to K. Each row gives rank, team name with institution, number solved, penalty time and, for each problem, the number of tries, with the solving minute after a slash for solved problems. A summary row closes the table. First place is Trigraph of the University of Waikato with 6 solved, ahead of two University of Auckland teams on the same number.

    Fifteen teams are ranked 1 to 15. A sixteenth, a school team from Southern Institute of Technology, is listed after them with its own rank 1 and marked School Team (Unofficial) in the legend. A footnote says that the second-placed team was unable to attend the Regional Final and was replaced by the third-placed team. The page was last updated on 23 August 2015.
