  copy: south-pacific-east/south-pacific-east-2018/website/2026-09-05-wayback-a08b3185
  title: Eastern Division
  language:
  - en
  description: |-
    Website of the ACM ICPC South Pacific Region contests, in English, holding pages from several years. Our copy holds 125 saved files, 96 of them pages. The first page is the Eastern Division page, which gives the area (Fiji and New Zealand) and a date of Saturday 14th October 2017, so it belongs to the 2017 edition; the Western Division page carries the same date.

    The home page is headed Contests 2018 and lists that year's calendar: the World Finals in Beijing on April 15-20th, ANZAC Rounds 1 to 4 (round 2 is the New Zealand Programming Contest), the South Pacific Divisional Contests on October 20th with registration, rules and sites links, and the Regional Final in Sydney on November 23-24th. A home page variant is headed Contests 2017. The site also holds a Central Division page, FAQ, registration and contest-sites pages, 2015 and 2016 contest pages, regional contest reports for 1999 to 2003, champions pages for years between 1991 and 2003, and World Finals results pages for 1989 to 1995 and 2013 to 2017. No scoreboard or problem set of the 2018 divisional contest is among them; the 2018 scoreboard and problem set links on the home page lead to other servers.
