  tries: true
  description: |-
    Final scoreboard of the Eastern Division produced by DOMjudge: 13 teams and twelve problems A to L. Each row gives rank, a symbol column, team with institution, problems solved, total time, and per problem the number of tries and the solve time, or tries alone when unsolved. Twelve teams are ranked, led by a team from The University of Auckland with 11 solved; the thirteenth, from The University of Waikato, has no rank, solved 5 problems and is shaded as Unofficial. A summary row gives per-problem totals.

    Rows are shaded by category according to a key with three entries: Qualifiers (the first two teams), Other official teams and Unofficial. Cells are coloured for first solve, solved, tried and untried. Team names link to a judging server outside our copy. The page states it was last updated on Sat 20 Oct 2018.
