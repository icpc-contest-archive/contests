  description: |-
    Final scoreboard of the 2019 South Pacific divisional contest for all divisions together, produced by DOMjudge: 79 teams and 13 problems A to M. The table lists 74 official teams ranked 1 to 74, a summary row, then 5 unofficial teams ranked 1 to 5, and a second summary row. Each row gives rank, team with institution, problems solved, total time, and per problem the solve time with the number of tries, or the number of tries alone when unsolved. Rows are shaded by category, and a key names the categories Central, East, West and Unofficial; a badge with the category name stands in front of the first team of each category. A team from The University of Auckland is first with 12 solved.

    Cells are coloured for first solve, solved, tried and untried. The summary rows give per-problem submission counts and totals. The page states it was last updated on Sat 21 Sep 2019. Team and problem links lead to a judging server outside our copy, and the style sheets and scripts the page refers to are not in our copy.
