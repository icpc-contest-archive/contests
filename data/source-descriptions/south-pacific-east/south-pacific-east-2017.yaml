  contest_date: '2017-10-14'
  description: |-
    Website of the ACM ICPC South Pacific Region for the 2017 contests, in English. Our copy holds 7 pages: the main 2017 page, a problem sets page, separate pages for the Eastern, Central and Western divisions, a page for the regional final and a photo gallery page.

    The main page reports that the divisional contest was held on 14 October 2017 at 12 sites across the region, with three divisions but one problem set, and lists the teams that qualified for the regional final. The Eastern Division page says it was held in Auckland, Christchurch, Dunedin, Palmerston North and Suva and names the four qualifying teams. The regional final page says it was held at the University of New South Wales, Sydney, on 24 to 26 November and shows the winners and trophy presentations. The problem sets page links to the divisional problems, an editorial and data, and to the regional final problem set and data.

    The scoreboards, problem PDFs and data archives that the pages link to are not part of the crawl, and neither are the images; the photo gallery page holds only a few album headings. The pages' report links lead back to the main 2017 page.
