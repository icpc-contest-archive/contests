  description: |-
    Final scoreboard of the 2017 South Pacific divisional contest, produced by DOMjudge and last updated 17 October 2017. It lists 63 teams with rank, team name and institution, number solved, total penalty time (the column headed score), and tries and time for each of the twelve problems A to L. First place is AbishforesT of the University of New South Wales with 12 solved.

    One board covers all three divisions: colours mark the teams that qualified for the regional final, the other Central, Eastern and Western Division teams, and unofficial teams, and cells are coloured for first solve, solved and tried incorrectly. A summary row gives totals per problem. A link labelled Divisional Contest Report leads to the main 2017 page of the region's site.
