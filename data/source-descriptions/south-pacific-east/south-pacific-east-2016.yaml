  description: |-
    Final scoreboard for all three divisions of the 2016 divisional contest, produced by DOMjudge: 69 teams, twelve problems A to L. Each row gives rank, team name with institution, problems solved, total time, and for each problem the number of tries and the solve time, or the number of tries alone when unsolved. The first two teams, both from the University of New South Wales, solved 12 problems; a final summary row gives per-problem totals.

    Cells are coloured for first solve, solved, tried and untried, and a categories key distinguishes 12 qualifying teams from other official teams by row colour. The page states it was last updated on 14 October 2016.
