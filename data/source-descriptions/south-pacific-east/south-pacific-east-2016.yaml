  - en
  contest_date: '2016-10-08'
  description: |-
    Website section for the 2016 South Pacific Region Contests on the ACM ICPC South Pacific Region site, in English. Our copy holds 8 pages: the overview page, a Regional Final page, a Divisional Contest problem-set page, Western, Central and Eastern Division pages, and two photo galleries.

    The overview says the Divisional Contests were held on Saturday 8th October at 13 sites with three divisions and one problem set, and carries the Report from the RCD with the top four teams and the list of teams qualifying for the Regional Final, held in Sydney on 25-27 November. The division pages name the teams qualifying from each division, the Regional Final page names the teams in the first three places, and the problem sets page lists the divisional and final problem sets with a link to a problem set PDF, a data archive and an analysis PDF for each; those linked files are not part of our copy. The site menu is the same on every page.
