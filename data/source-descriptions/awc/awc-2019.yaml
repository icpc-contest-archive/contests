  - en
  contest_date: 2020-01
  description: |-
    Website of the 2019 ICPC Asia West Continent Final Contest, in English, built on WordPress. Our copy holds four pages: a home page that describes the two-tier ICPC structure and says the Asia West Continent Championship is open to top teams from the Amritapuri, Dhaka, Gwalior-Pune, Kabul, Kanpur, Kharagpur, Tehran and Topi sites, to be held in January 2020 at two sites, Tehran and Kolkata; a Rules page on how many teams each site sends, eligibility and World Finals slots; a People page listing the regional contest director and one member per site; and a page headed ICPC Asia Blog that has no content beyond its heading and a link.

    There are no results, team lists or problem statements in our copy. Two RSS feeds (posts and comments) are also saved.
