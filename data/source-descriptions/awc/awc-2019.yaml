  description: |-
    Problem set as a PDF of 17 pages, in English: eleven problems labelled A to K (Disk Tree, Perfect Strings, Red Black Grid, Minimize Median, Same Sum, Treelection, Intersecting Paths, Strange Keyboard, Coworkers, (1, 2) Nim, XOR Dice). Each has a statement with input format, constraints, output format and samples; ten of the eleven also have an explanation of the sample, and problems A and G have a figure. There is no cover page, so the document names no contest, date or host. No test data or solutions.
