    Final scoreboard from CodeMarshal: 65 teams, each with rank, team name, institution and country, number solved and penalty time, and for each of thirteen problems A to M the number of tries and, for solved problems, the time. An unlabelled summary row above the teams gives two counts per problem, written like 52/53. The page says the standings are finalised. FacelessMen2.0 of the Indian Institute of Technology - Kanpur is first with 10 solved and 1350 penalty. Thirteen teams solved nothing. Teams are from India, Bangladesh, Pakistan, Iran and Afghanistan.

    The site menu links (contests, clarifications, submissions, login) lead to other pages that are not in our copy.
