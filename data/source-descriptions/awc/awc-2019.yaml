  description: |-
    Final standings of 53 teams with rank, team, institution, number solved, time and a citation. Ranks run from 1 to 38 with ties. The citation is an ordinal place (First Place down to Twenty-sixth Place) for 33 teams and Honorable Mention for the other 20. First place is FacelessMen2.0 of the Indian Institute of Technology - Kanpur with 10 solved and a time of 1350. There is no per-problem detail. The Site citation column reads 'ICPC Asia West Continent Finals' followed by a number that counts up from 2019 down the list.
