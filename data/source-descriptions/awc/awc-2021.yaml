  language:
  - en
  contest_date: '2022-12-24'
  description: |-
    Event report on the news pages of the Ghulam Ishaq Khan Institute of Engineering Sciences and Technology (GIKI), dated December 26, 2022 and written by Ali Shaukat. It tells that the contest ran in parallel at sites in Bangladesh (Dhaka), India (Gwalior-Pune) and Pakistan (Topi), with a mock round on 23 December 2022 and the contest itself on 24 December 2022; that 67 teams from Pakistan, India, Iran, Bangladesh and Afghanistan were shortlisted and 58 took part, four of them at the Topi site; and that the first three prizes went to the University of Dhaka, the Indian Institute of Technology – Madras and Bangladesh University of Engineering and Technology. It thanks the organisers and the sponsors Noon, GeniTeam, Quixel and Epic Games, and links to the full scoreboard on CodeDrills.

    Our copy holds this one page. Its photos, among them a view of the top 15 teams of the scoreboard, are only empty placeholders in our copy.
