    Website "Northern Eurasia Contests" of the ICPC Northern Eurasia region, in English; our copy holds 126 pages. The seed is the page of the Tajikistan Regional Contest: participating region Tajikistan, contest date "14 Nov, 26", host Russian Tajik Slavonic University and Freedom IT Hub, a contact for the contest director, and an archive with standings for 2026 and 2025 and the runs of 2025; the 2024 and 2023 headings have nothing under them.

    The 2026 standings page is in our copy: a scoreboard of "ICPC 2026–2027 Tajikistan Regional Contest" at 5:00:00 of 5:00:00, status over, with 14 teams (institution, team name and members) against 14 problems A to N, giving attempts and solve time per problem, number solved and total time, and rows of total runs, accepted, rejected and first and last accepted time per problem. TTU: #1 is first with six problems; three teams solved none.

    The rest of the copy belongs to the region as a whole: the pages of the other regional contests, a page for each year's region-wide contest from 1995 to 2026 (the Northeastern Europe Regional Contest, from 2019 the Northern Eurasia Finals), yearly archive pages from 1996 to 2026, 19 standings pages (among them Tajikistan 2025, with its runs archive), and 17 problem-set PDFs of the region-wide contest from 2009 to 2025.
