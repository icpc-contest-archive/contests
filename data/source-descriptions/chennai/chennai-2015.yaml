  description: |-
    Final standings of the Chennai regional: 115 teams with rank, team name, institution, problems solved, total time and a citation giving the place; the last 58 teams (ranks 58 to 115) carry Honorable Mention. First place is Encore of the Indian Institute of Technology, Bombay with 8 problems solved and a total time of 991. No per-problem results.
