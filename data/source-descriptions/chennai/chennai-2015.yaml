  title: ACM-ICPC - Asia Chennai Regionals 2015 | Hindustan University, Chennai
  language:
  - en
  description: |-
    Website of the 2015 ACM-ICPC Asia Chennai regional, hosted by Hindustan University, Chennai, in English. Our copy holds two captures of the front page. The earlier one announces the on-site contest of 22 and 23 January 2016 and gives the online-round selection procedure (123 teams selected for on-site), on-site contest instructions, payment details and FAQs. The later one names the winners (Encore, Indian Institute of Technology, Bombay) and the two runners-up and links the regional ranking; its registration steps, on-site instructions and a note on a sponsor's reimbursement scheme are commented out in the page source and not displayed.

    Three PDFs of this edition, each held twice: a 6-page ranking of 115 teams (problems solved, total time, last solution time); a 6-page list of 122 teams selected for the on-site contest; and a 28-page rank list of the online first round, 1029 teams with scores.

    The rest comes from later years of the same site: six 2017 PDFs (selection list, selection rules, online-round rank list, on-site problem set, on-site ranking, event report), a results page linking three of them, and five 2019 pages for the online contest of 9 November 2019.
