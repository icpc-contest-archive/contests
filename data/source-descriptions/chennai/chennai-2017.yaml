  title: ACM-ICPC - Asia Chennai Regionals 2017 | Hindustan University, Chennai
  language:
  - en
  description: |-
    Website of the Asia Chennai Regional Contest hosted by Hindustan University, Chennai, in English. The home page, headed 2017 ACM-ICPC Asia Chennai Regional Contest, is one long page: introduction to ICPC and the Chennai site, registration and payment details (online fee INR 500 per team), a registration deadline of 31 October 2017, FAQs, contact details and a link to a results page. The separate About Us, Registration, Contact and FAQ pages and a second home page come from later captures and concern a national-level online contest (the second home page is headed 2019 ICPC India Chennai Multi Provincial Online Contest).

    The results page links three 2017 PDFs: the online round's final selection list (121 teams, one a host-slot team), the selection rules, and the online round's overall rank list (671 teams, each with at least one problem solved). Our copy also holds, unlinked from that page, the onsite scoreboard (118 teams, 11 problems), the event report (8 pages) and the onsite problem set (25 pages, 11 problems), plus three PDFs of the 2015 edition.

    Our copy has 150 files: 16 HTML files (three are 404 error stubs), 12 PDFs, style sheets, scripts, fonts and images; many pages are saved under two addresses.
