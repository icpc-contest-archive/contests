  description: |-
    Website of the ICPC Asia Gwalior-Pune Regionals 2018, hosted jointly by ABV-IIITM Gwalior and IIIT Pune, in English. The page has an about section on ICPC and on the regionals, a results section with links to three PDFs (teams shortlisted for the onsite contest, the overall rank list of the online contest, the location allotment), final onsite registration from 5 to 12 December 2018 with bank details, a CodeChef announcement of certification-exam discounts for online-contest participants, the site selection criteria (127 onsite teams: 51 at IIIT Pune and 76 at ABV-IIITM Gwalior), dates (online round 23 October; onsite round 17th-18th December for Gwalior-Pune), FAQs, directions to both campuses, contact details and sponsors. The bottom of the page still carries links labelled 2017: the shortlist, online round results, problem statements and final report.

    Our copy holds two distinct pages of the site. The seed page is saved under four addresses; the second is a later version of the same front page headed 2019 with the 2019 registration rules. The PDFs the pages link to are not in our copy. The remaining files in our copy are unrelated sales and spam pages from a later owner of the domain, not part of the contest site.
