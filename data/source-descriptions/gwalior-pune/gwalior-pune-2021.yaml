  description: |-
    Website of the ICPC Asia West Gwalior-Pune Regional 2021, organised jointly by ABV-IIITM Gwalior and IIIT Pune, in English. The front page covers the ICPC and the regional, registration (21 to 26 August 2022; Rs. 900 per team for the preliminary contest, Rs. 3750 for the onsite contest), team formation and eligibility rules, a preliminary online round on 4 September 2022 on the CodeDrills platform and a regional round on 3rd and 4th October 2022 held onsite at Gwalior and Pune, the selection criteria for the onsite contest (about 85 teams), FAQs, directions to both campuses and contact details.

    A results section headed as the 2021 standings is commented out in the page source and does not display; the block links to a 2020 final rank list and a list of 2020 teams eligible for T-shirts, both PDFs that are in our copy. No 2021 results are in it. Our copy holds 4 pages: the front page under two addresses and the two PDFs, with style sheets, scripts and images.
