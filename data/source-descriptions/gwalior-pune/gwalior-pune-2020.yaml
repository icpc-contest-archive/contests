  description: |-
    Website of the ICPC Asia West Gwalior-Pune Regional 2020, organised jointly by ABV-IIITM Gwalior and IIIT Pune, in English. The front page covers the ICPC and the regional, the contest rules and team formation rules, the plan for a single online regional contest on 18 August 2021 on the CodeDrills platform (registration closing 11 August, mock round 15 August), the selection process for World Finals participation, a news item, FAQs, contact details and the dates of other Asia West regionals. A results section links to a final rank list and a list of teams eligible for T-shirts, both PDFs that are in our copy.

    Our copy holds 60 files, 12 of them pages: the 2020 front page under four addresses, a later version of the same front page headed 2021 (it carries 2022 dates for its rounds), the two PDFs, and a short error page. Style sheets, scripts and images are present.
