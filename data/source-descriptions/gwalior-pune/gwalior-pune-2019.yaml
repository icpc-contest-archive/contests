  description: |-
    Website of the ICPC Asia Gwalior-Pune Regionals 2019, hosted jointly by ABV-IIITM Gwalior and IIIT Pune, in English. The front page has an about section on ICPC and the regionals, registration rules for Indian teams (register on the Baylor site, fee INR 900 for the online round, INR 3600 for the onsite round) and for foreign teams (registration 10 November to 5 December 2019, USD 300), team formation rules, onsite arrangements (registration and practice on 14 December, contest on 15 December 2019), the site selection criteria, links to the shortlisted teams for the onsite round and to notes on onsite selection, FAQs, contact details, directions to both campuses and sponsors.

    Our copy holds one distinct page, the front page, saved under five addresses. The PDFs it links to are not in our copy. The other files in our copy are unrelated sales and spam pages from a later owner of the domain, not part of the contest site.
