  description: |-
    Problem set of the 2000 New Zealand Programming Contest as a PDF of 16 pages with a text layer, headed NZ Programming Contest 2000. It has no cover page and starts directly with problem A.

    There are 12 problems, lettered A to D, F to I and K to N (no E or J), from Simple Graphs to Sorting Mäori. Each states its point value: 10 for A to D, 30 for F to I and 100 for K to N. Every statement is in English and gives the task, the input and output rules and a sample input with its output.
