  description: |-
    Results page of the 2000 New Zealand Programming Contest, a plain text page written from the point of view of Auckland University. It opens with a short account saying that Auckland had the overall top team, that its stage two team came third overall, and that a stage one team tied for top points with one at the Hamilton site; the contest is dated Aug 5th.

    The overall results then list 28 teams, only those that scored points, with centre code, level (1 to 3), team ID, score and number of submissions. The same 28 rows are repeated grouped by level: 13 at level 3, 9 at level 2 and 6 at level 1. Teams appear by ID only, with no names or institutions, and there are no per-problem results or times. A closing line names the judges of the Auckland site and the contest director.
