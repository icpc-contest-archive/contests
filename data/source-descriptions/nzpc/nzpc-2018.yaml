  description: |-
    Problem set: a PDF of 33 pages in English with sixteen problems A to P, from A Bus Service to P Making Phrases. Each problem heading gives its title and its points (3, 10, 30 or 100; four problems at each value), and each has a statement with input and output format and sample input and output. There is no cover page or preamble: the file starts directly with problem A, and the contest is named only inside the problems. Problem D, Dates, is a story that says today is 15 September 2018 and lists the NZPC as an event happening today. No test data or solutions.
