  description: |-
    Standings of the New Zealand part of the ACM International Programming Contest, South Pacific Region, on one page with two tables. The first, NEW ZEALAND TOP 10, ranks ten teams by position with team name, institution, accepted solutions and time taken; first place is the three little pigs of the University of Otago with 5 accepted solutions and a time of 710.

    The second, Otago Full Results, lists 13 ranked teams with the same columns plus one team marked Absent. Four of its teams are also in the top ten, and besides Otago it includes teams from the University of Canterbury, Lincoln University and ChristChurch Polytechnic. Together the two tables name 19 teams with results. The page gives no results per problem and prints neither a year nor a date.
