  description: |-
    Problem set of the 1998 New Zealand Programming Contest as a PDF of 20 pages, a scan with no text layer. Page 1 carries the heading NEW ZEALAND PROGRAMMING CONTEST 1998 and starts problem A; the page headers read NZ programming Contest 10/10/98.

    There are 19 problems, lettered A to E, G to K, M to Q and S to V (no F, L or R), from A Nice Number to Foreign Exchange. Each has a point value: 5 for A to E, 15 for G to K, 50 for M to Q, 150 for S to U and 50 to 150 for V. The statements are in English with the task and input and output rules; many have examples and some have diagrams. Problem V asks for a user interface and has no output.
