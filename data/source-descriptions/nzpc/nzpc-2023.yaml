  description: |-
    Problem set as a PDF of 36 pages, in English. It starts with a table of the 16 problems A to P with their points (3 points for A to D, 10 for E to H, 30 for I to L, 70 for M and 100 for N to P), then a preamble on input and output conventions and on submitting to DOMjudge. The problems run from Girl Swaps (A) to Losing Lakes (P). Each has a statement with input and output format and sample input and output. No test data or solutions.
