  description: |-
    Results page of the New Zealand Programming Contest website for 2023: a table with one row for each of five categories (School, Tertiary Junior, Tertiary Intermediate, Tertiary Open, Open) giving the winning team and its school or university. Squad team of Rangitoto College is the winner in School. Only the five winners are listed, with no points, solved counts or other teams. The page says the contest was held on Saturday 19th August, and each row links to a winners and scoreboard page. Further links lead to the problem set, three editorial PDFs (for the 3 and 10 point problems, the 30 point problems and the 100 point problems) and a statistics PDF. A notice in memory of a long-serving contest director sits at the top.

    The linked scoreboards, problem set, editorials and statistics are not part of this page; our copy holds the page with its style sheet.
