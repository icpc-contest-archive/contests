    Results page of the New Zealand Programming Contest website for 2022: a table with one row for each of five categories (School, Tertiary Junior, Tertiary Intermediate, Tertiary Open, Open) giving the winning team and its school, university or "Independent". Syzygy of Mt Albert Grammar School is the winner in School. Only the five winners are listed, with no points, solved counts or other teams. Each row links to a winners and scoreboard page, and the page also links to the problem set and an editorial as PDFs. A line says the contest was back on site after two years online, and a notice in memory of a long-serving contest director sits at the top.

