    Problem set as a PDF of 34 pages, in English. It opens with a preamble on input and output conventions and on submitting a single source file to DOMjudge, then gives 16 problems labelled A to P, from Jelly Beans (A) to Speed (P). Each problem has a statement with input and output format and sample input and output, and a heading showing its points: 3 points for A to D, 10 for E to H, 30 for I to L and 100 for M to P. The text New Zealand Programming Contest 2022 appears on the page of problem P. No test data or solutions.
