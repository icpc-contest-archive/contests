  description: |-
    Final results of the New Zealand Programming Contest 2013 as a scanned PDF of 5 pages with no text layer, headed New Zealand Programming Contest 2013. Each page holds the Final Scoreboard of one category: Tertiary Open, Tertiary Intermediate, Tertiary Junior, School and Open. Each row gives rank, team name, institution or organisation, a short site code, total points and a cell for each problem; the header row shows the points per problem. Teams with equal points share a rank, and a first place on the School and Open pages carries an asterisk, which a footnote on the last page explains as declared joint winners. Four of the five pages end with a line Last updated Friday, 23 August 2013, with the time.

    The text was read by OCR only and is unreliable, so team counts, the number of problem columns and the contents of the per-problem cells are not stated here.
