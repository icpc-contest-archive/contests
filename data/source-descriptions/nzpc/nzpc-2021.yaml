  title: Problem Set
  language:
  - en
  problems: 14
  pages: 30
  description: |-
    Problem set: a PDF of 30 pages in English with a preamble on input and output rules, then fourteen problems, from A Security Check to O List Calculator. The printed letters are A to F, F again, H to K, then M, N and O, so there is no heading G or L. Each problem heading gives its title and its points (3, 10, 30 or 100), and each has a statement with input and output format and sample input and output. Hostel Nights, the second F, carries the same letter as Postman Joe. Some pages carry the running text New Zealand Programming Contest 2021. No test data or solutions.
