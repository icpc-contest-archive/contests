  description: |-
    Results page of the New Zealand Programming Contest website: a table with one winner for each of five categories (School, Tertiary Junior, Tertiary Intermediate, Tertiary Open, Open), giving team name and school, university or Independent. It gives no points. A note says the contest that year was held entirely online because of the outbreak of the Delta variant of Covid-19. Only winners are listed, not the other teams.

    Each row links to a separate winners and scoreboard page, and a link opens the problem set PDF; those pages are not part of our copy. The page also carries a site banner with a memorial notice and the site's navigation menu.
