  description: |-
    Standings of the 2022 ICPC Rocky Mountain Regional Contest: 42 teams, each with rank, team name, institution, number of problems solved, total time and a citation. The citation column names the places from First Place to Twenty-first Place for the top 21 teams, and the other 21 teams are marked Honorable Mention. BYU TTL 255 of Brigham Young University is first with 12 solved. The teams come from 10 institutions. There is no per-problem detail and no attempt counts.
