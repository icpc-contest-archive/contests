  description: |-
    Problem set of the 2022 Rocky Mountain Regional Contest as a PDF of 28 pages, in English. The cover reads ICPC North America Contests, Rocky Mountain Regional Contest, Official Problem Set 2022, with logos of the ICPC Foundation and Upsilon Pi Epsilon. Page 2 gives the date February 25, 2023 and the list of problems; page 3 holds general notes on relative and absolute error tolerance and definitions of modulo, lexicographic order and letter case. Then come 12 problems, A to L, from Blueberry Waffle to Family Visits, each with input and output formats and sample input and output. Pages are footed with the regional's name, the year and the problem. Five pages (4, 10, 16, 22 and 24) are marked as intentionally left blank. No test data or solutions.
