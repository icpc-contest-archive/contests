  description: |-
    Solution slides in English by "The Judges", a PDF of 23 pages; the title slide reads "2022 Rocky Mountain Regional Solutions" and is dated Feb 25, 2023. They cover 12 problems, from Blueberry Waffle to Family Visits, named by title only, without letters. Most problems get a slide restating the problem followed by the solution, some running to two or more slides (Color Tubes three, Family Visits five, with a greedy and a dynamic-programming solution); two (Profitable Trip and Champernowne Count) end with a "Challenge" question, and the footer of each problem slide names the problem author.

    The slide counter in the footers runs to "23 / 22".
