  title: ICPC ROCKY MOUNTAIN REGIONALS NOVEMBER 3, 2018 Contest Problems
  language:
  - en
  contest_date: '2018-11-03'
  problems: 10
  pages: 22
  description: |-
    Problem set as a PDF of 22 pages in English. The cover page gives the title ICPC Rocky Mountain Regionals, November 3, 2018, and lists the ten problems A to J. Page 2 holds the rules for answers with an absolute error and for results modulo m, and definitions of lexicographic order and of uppercase and lowercase letters. Each problem then starts on its own page and has a statement, input and output specification, time limit and sample input and output; problems B to G and I to J continue on a second page, while after problems A and H the next page carries only the line 'This page is intentionally left (almost) blank'. The problem names run from Quality-Adjusted Life-Year (A) to Rainbow Road Race (J). No test data or solutions.

    The page after the cover says the contest has ten problems over 24 pages, while our copy has 22 pages.
