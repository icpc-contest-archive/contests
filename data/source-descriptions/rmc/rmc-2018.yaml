- url: https://org.coloradomesa.edu/~wmacevoy/rmrc/2018/index.html
  read: '2026-11-16'
  rubric: 1
  copy: rmc/rmc-2018/website/2026-09-05-live-51f07565
  title: Home - 2018 Rocky Mountain Regional ACM Contest Information
  language:
  - en
  contest_date: '2018-11-03'
  description: |-
    Website of the 2018 Rocky Mountain Regional ACM Contest, in English. The home page names the five host sites (University of Saskatchewan in Saskatoon, Montana Tech in Butte, Colorado Mesa University in Grand Junction, Colorado State in Fort Collins, University of Arizona in Tucson), the states and provinces the region draws from, the dates (early registration ends 21 October, registration ends 31 October, practice 2 November, contest 3 November) and the fees, with payment instructions for the US and for Canada. It lists the earlier regional contests from 2000 to 2017. It has no link to results or problems.

    The FAQ page covers team size of three, languages (C++, Java, Python 2 and 3), what teams may bring, the file naming and build conventions with a count example in C++, C, Java and Python, a testing checklist, debugging advice, and the ranking rules with a worked penalty example (20 points per incorrect submission). It names Kattis as the judge but gives the 2016 contest address. A portability page, titled for the 2004 contest, gives advice on C and C++ portability.

    Our copy holds three pages with content (home, FAQ, portability) and a style sheet. The cast of characters page and the three count example pages (C, C++, Java) contain only script error messages in place of their content.
