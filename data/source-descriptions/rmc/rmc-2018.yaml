    Standings of 63 teams with rank, team, institution, problems solved, penalty time, medal, a place citation and a site citation. The first four places carry gold medals, the next four silver and the next four bronze. Ties share a rank: eight teams are ranked 13, eleven are ranked 21 and ten are ranked 32; these teams show Ranked in the medal column, and the citation reads Thirteenth Place, Twenty-first Place or Honorable Mention. The last 22 teams have no rank and no citation, and show Honorable in the medal column. The site citation names a host site for five teams. The team named ((+)(((+)s)m)j) of the Colorado School of Mines is first with 10 solved and 774 minutes. No per-problem detail.
- url: https://icpcarchive.github.io/North%20America%20Contests/Rocky%20Mountain%20Regional%20Contest/2018%20Rocky%20Mountain%20Regional%20Contest/problems.pdf
  read: '2026-11-16'
