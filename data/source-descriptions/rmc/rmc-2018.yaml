    Scoreboard from the contest's Kattis site, shown after the contest ended: 63 teams ranked by problems solved and penalty time, with columns for rank, team name, an institution logo, number solved, time, and the ten problems A to J. Each problem cell shows the number of attempts and the minute of the accepted run, or the number of attempts and a dash for unsolved problems. Teams with equal results share a rank. A legend marks first solves, solved, attempted and pending cells, and a site filter lists the five host sites (Colorado Mesa University, Colorado State University, Montana Tech, University of Arizona, University of Saskatchewan). Every team has an institution logo with the name as a tooltip: 16 institutions in all. The team named ((+)(((+)s)m)j) is first with all 10 solved and 774 minutes. The page also gives the contest start and end times (17:00 to 22:00 CET on 2018-11-03).
