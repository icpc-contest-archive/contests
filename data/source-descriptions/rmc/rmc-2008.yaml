  description: |-
    Zip archive of the problem set: 166 files in a directory per problem. Eight directories (lock, lawrence, close, park, dance, trucking, when, primebases) are the contest problems A to H of the scoreboard. Three more (count, gpa, account) are labelled P, Q and R; the statement of count says it is meant to acclimate teams to the contest environment.

    Every directory has the statement as an HTML page, a PDF and an ODT file, input and output files, and a C or C++ source file with a Windows executable. A few directories also hold an image used in the statement. Statements are in English.
