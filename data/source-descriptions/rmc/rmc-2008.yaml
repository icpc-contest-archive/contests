  description: |-
    Home page of the 2008 Rocky Mountain Regional ACM Contest, in English. Our copy is this one page. It announces the final standings, with links to scoreboards by rank and by team, and a zip file of statements, data sets and solutions.

    The page gives the contest date of October 25, 2008, four host sites (the University of Saskatchewan, Utah Valley University, the University of Colorado, Boulder and the University of Arizona), the states and provinces the contest draws from, registration deadlines, fees and where to send payment. It links to the FAQ, a list of people, the team roster, the mailing list, two Unix tutorials and the pages of earlier contests. Those linked pages are not part of our copy.
