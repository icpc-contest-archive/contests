  description: |-
    Scoreboard of the Rocky Mountain Regional contest, which the contest home page links to as the final standings: 43 teams, ranked by problems solved and then penalty time, in a table of Rank, Team, eight problem columns A to H (named lock, lawrence, close, park, dance, trucking, when, primebases), Correct and Penalty. A solved cell shows the time of the accepted run, followed by a plus sign and a penalty number when earlier runs were rejected; unsolved cells are empty. Each team is shown as an id such as team106 followed by a name. The top team solved five problems. No institution or site column, and no medals.

    The table sits in a page with a clock reading 09:52 and a menu of main( ), Problems, Submissions, Clarifications, Scoreboard and FAQ; the menu links lead to another server and are not part of our copy.
