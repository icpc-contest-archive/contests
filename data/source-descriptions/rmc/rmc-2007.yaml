  description: |-
    Zip archive of the problem set: 157 files in a directory per problem. Nine directories (graft, lookandsay, server, cointoss, vacation, baseball, teamwork, wavelet, addition) are the contest problems A to I of the scoreboard. Three more (count, gpa, account) are labelled P, Q and R; the statement of count says it is meant to acclimate teams to the contest environment.

    Every directory has the statement as an HTML page and a PDF, input and output files, and a C source file (C++ for server). Statements are in English.
