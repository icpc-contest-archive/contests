    Scoreboard by rank of the Rocky Mountain Regional contest, which the contest home page links to as the final standings: 39 teams, ranked by problems solved and then penalty time, in a table of Rank, Team, nine problem columns A to I (named graft, lookandsay, server, cointoss, vacation, baseball, teamwork, wavelet, addition), Correct and Penalty. A solved cell shows the time of the accepted run, followed by a plus sign and a penalty number when earlier runs were rejected; unsolved cells are empty. Each team is shown as an id such as team102 followed by a name. The top team solved six problems. No institution or site column, and no medals.
