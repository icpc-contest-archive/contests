    Standings of the 2020 Rocky Mountain Regional Contest: 33 teams with team name, institution, problems solved and total time. Eighteen teams carry a rank and a place citation (First Place to Twelfth Place, then six teams sharing Thirteenth Place); the other fifteen are marked Honorable and have no rank. A Medal column gives four gold, four silver and four bronze medals, marks the six teams of thirteenth place Ranked and the fifteen Honorable, and a Site citation column names a host site for four teams. There is no per-problem detail. Alberta Gray from the University of Alberta is first with 11 problems solved in 909 minutes.
