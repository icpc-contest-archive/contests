- url: https://rocky.icpc.io
  read: '2026-11-16'
  rubric: 1
  copy: rmc/rmc-2020/website/2026-09-05-wayback-7ed21523
  title: RMC-NA ICPC | Rocky Mountain Regional Programming Contest
  language:
  - en
  contest_date: '2021-03-06'
  description: |-
    Website of the Rocky Mountain Regional Programming Contest (RMC-NA ICPC), in English. Our copy holds 28 pages (21 web pages and 7 PDFs) with 11 images, 4 style sheets and 2 scripts, from several editions of the site. The home page and a second copy of it give the 2020 contest information: a fully online contest on March 6, 2021 at 12 noon MST for 5 hours, practice from March 4 for 36 hours, registration by March 2, no fees, and a pre-qualifier for the North America Championship. A page of 2020 North America Championship communications has video and photo links, and four newsletters of that Championship (January 10, January 30, February 9 and February 13, 2020) and two travel documents on airport transport and parking are PDFs.

    The pages for site directors, coaches and contestants, the rules and the FAQ (which names Kattis as the judging system) are generic, and the coaches and rules pages still mention the Mid-Central USA regional; the page for judges holds only its heading. Seven host-site pages carry schedules of other editions (October 25 and 26, March 11 and 12, February 24 and 25, March 24 and 25), none of them for March 6, 2021. A scoreboard of the 2022 Rocky Mountain Regional Contest with 42 teams and problems A to L, four per-site standings pages and a 5-page technical notes PDF are also in it. The 2020 results and problems are not.
