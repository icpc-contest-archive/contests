    Kattis standings of the 2020 Rocky Mountain Regional Contest: 33 teams against 11 problems A to K. Each team row gives rank, team name, an institution logo, number solved, total time, and for each problem the number of attempts with the minute of the accepted run (a dash when unsolved), with a legend for first to solve, solved, attempted and pending judgement. The page shows the contest as over, from 2021-03-06 12:00 to 17:00 MST. A site selector lists Brigham Young University, Colorado Mesa University, Colorado School of Mines and University of Alberta; the copy shows site All. Two teams with zero solved share the last rank, 32. Alberta Gray is first with 11 problems solved.
