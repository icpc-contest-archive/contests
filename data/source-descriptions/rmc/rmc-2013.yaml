    Scoreboard of the RMRC 2013 Contest as a web page of the contest's judging system, listed by rank: 37 teams, ten problems labelled A to J with short names (fastfood, kingdom, acm, content, creditcard, iq, social, tables, floodit, chemicals). Each team row gives rank, team number and name, then for each solved problem the time of the accepted solution, with a plus sign and a penalty figure where the page shows one, and ends with the number of problems solved (Correct) and total Penalty. UofL 1 is first with 7 solved; the last teams have one problem each. A clock reading 15:18 and the judge's navigation menu sit at the top and bottom of the page. Teams are listed by school and team name; no institution or country column.
