  description: |-
    Home page of the 2013 Rocky Mountain Regional contest website, one page in our copy. It thanks participants and links to the final standings by rank and by team and to a zip file of the problem set, which it says holds statements, data sets and solutions. It lists the University of Alberta, Brigham Young University and the University of Arizona as host sites, the states and provinces the contest draws from, early registration ending October 15 and registration ending October 22, fees of 75 USD or CAD before October 16 and 150 after, and instructions for paying by cheque or PayPal.

    The page also links to a FAQ, a page called "Our cast of characters", two Unix tutorials, the ICPC international pages and regional rules, and the home pages of the regional contests of 2000 to 2012.
