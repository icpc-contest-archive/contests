  description: |-
    Personal web page of the coach of the University of Lethbridge teams in the International Collegiate Programming Contest. It covers the local programming club (information and problem-solving sessions), links to regional contest results pages for 2003 to 2025 and World Finals results for 2013 and 2014, lists of other contests, problem sets and online judges, and books for contest preparation.

    Its history section says the author's University of Alberta team finished 3rd overall at the ACM Regional Contest in the Mountain Region in 1995; no standings, team list or problems of that contest are on the page. The links to the results pages lead outside our copy.
