  title: 2014 Rocky Mountain Regional ACM Contest Information
  language:
  - en
  description: |-
    Website of the 2014 Rocky Mountain Regional contest. Our copy holds 8 pages: the home page, a FAQ, a page of contest officials, a portability page for C, C++ and Java with three small example programs (count.c, count.cpp, count.java), and the final scoreboard. It also holds a zip file of the contest materials. The home page thanks participants, lists the University of Alberta, the University of Utah, the Colorado School of Mines and the University of Arizona as host sites, gives registration dates (early registration to October 24, registration to October 31), fees of 75 USD or CAD before October 24 and 150 after, and payment instructions.

    The FAQ covers team size, languages, what teams may bring, how to name, compile and submit a solution through DOMjudge, and how teams are ranked. The portability page is headed 2004 Rocky Mountain Regional ACM. The scoreboard is a DOMjudge page titled Scoreboard RMRC 2014 final standings. The zip file is described on the home page as holding statements, slides about the solutions and data sets; it contains 697 entries: eleven problem folders, each with sample and secret input and output files and a problem.pdf, and two PDFs at the top level, problems.pdf and talk.pdf. Links to the ICPC pages, the host sites' own pages and the earlier regional contests lead outside our copy.
