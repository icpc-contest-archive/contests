  description: |-
    Final scoreboard of the 2014 Rocky Mountain Regional Contest, a page saved from the DOMjudge jury interface (logged-in view, last update 12 November 2014): 54 ranked teams and eleven problems labelled a to k (a-server, b-eligib, c-seats, d-facili, e-substr, f-landli, g-tank, h-rating, i-locks, j-sat, k-fracti). Each row gives rank, team name with its institution, problems solved, penalty time, and for each problem the number of tries, with the time of the accepted solution after a slash. A summary row totals tries and solves per problem, and a legend colours first solves, solves, incorrect tries and untried problems. Below the 54 teams two non-team accounts are listed separately, a test team marked to be ignored and DOMjudge itself. The page also carries the jury menu, with links that lead to a local server and not into our copy.
