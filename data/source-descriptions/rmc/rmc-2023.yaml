    Final scoreboard of the 2023 Rocky Mountain Regional Contest as shown by Kattis, after the contest was over: 49 teams with rank, team name, number solved and total time, and for each of the twelve problems A to L the number of attempts and, for a solved problem, the minute of the solve. Sapphire Mines is first with 10 solved and 1183 minutes. Four teams with no solved problem share the last rank, 46.

    A legend marks first solves, solved, attempted and pending problems, and a site selector offers All, Brigham Young University, Colorado School of Mines, Montana Tech and University of Alberta. The page header gives the contest as 5 hours long, starting 2023-11-04. Each row also carries a state flag and an institution logo; the state and institution names appear only as tooltips on those images.
