  title: RMC-NA ICPC | Rocky Mountain Regional Programming Contest
  language:
  - en
  contest_date: '2023-11-04'
  description: |-
    Website of the Rocky Mountain Regional ICPC, in English. The home page announces the contest of November 4, 2023, with a closing note that the final standings are on Kattis and the problems are in a GitHub repository. It also gives the registration, practice and contest dates, registration instructions and fees for US and Canadian universities, and the host sites: the University of Alberta in Edmonton, Montana Tech in Butte, Brigham Young University in Provo and the Colorado School of Mines in Golden.

    Other pages cover an FAQ, the contest rules, information for coaches, contestants and site directors (the judges page is a heading only), and one page per host site with address, parking and schedule. The Alberta, Montana Tech, BYU and Mines pages give the schedule of 3 and 4 November 2023.

    The site was reused across years, and our copy of 28 pages mixes editions. It holds the final scoreboard of the 2022 contest (42 teams, twelve problems A to L, with attempts and minutes per problem, and per-site standings pages for Alberta, Montana, Colorado and Utah), a virtual host-site page with a March schedule, two more host-site pages (University of Alberta, University of Arizona) whose dates, Friday October 25 and Saturday October 26, do not match 2023, a 2020 North America Championship communications page with six newsletter, letter and travel PDFs, and a five-page Technical Notes PDF. There is no 2023 scoreboard in our copy: the link on the home page leads to Kattis.
