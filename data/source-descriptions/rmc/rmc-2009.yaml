  description: |-
    Home page of the 2009 Rocky Mountain Regional ACM Contest, in English. It gives the contest date (October 31, 2009), the four host sites (University of Saskatchewan, University of Utah, University of Colorado Boulder, University of Arizona), the states and provinces the region draws from, registration deadlines and fees with billing instructions for US and Canadian teams, and links to a FAQ, rules, unix tutorials and the home pages of earlier regionals (2000 to 2008).

    A note at the top thanks participants and points to the final standings by rank and by team and to a zip file holding the problem statements, data sets and solutions. Our copy holds this one page.
