  description: |-
    Zip archive of 533 entries (378 files in 155 directories) with 24 folders directly under problems/. The nine contest problems A to I (range, coverage, xml, clickomania, balance, resistors, shuffling, papa, wax) each appear twice, once in a folder named for the problem and once in a folder probA to probI with identical test inputs. Three more problems labelled P, Q and R (count, health, lock) are likewise present twice. Each folder holds the statement as HTML and PDF in English, example and test input and output files, and solution source code in C, C++, Java or Perl; some also hold executables, a verifier or images.
