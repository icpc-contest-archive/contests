  description: |-
    Website of the ICPC North America Rocky Mountain Regional, in English. The home page announces the 2026 to 2027 contest for Saturday, October 31, 2026, with a registration deadline of October 26, 2026, fees of USD 100 per team for US teams and CAD 125 for Canadian teams, the list of states and provinces the region serves, and its sponsors. It links to the 2025 standings and to a repository of the 2025 problem data and solutions. A line on the page says that practice-contest details, contest sites and the event schedule will be published when they are confirmed.

    Our copy holds 25 pages, which are 13 distinct pages (some are saved twice under a second address): home, about, archive, 2025 to 2026, 2023 to 2024, hall of fame, outstanding regional award, contact, a sites page, and four pages of individual contest sites (ASU, BYU, Mines, Calgary). The archive page is a table of years 2015 to 2025 with links to each year's standings and problems; 2022 has a problems link only. The hall of fame page lists medal winners and first-to-solve awards of the 2024 to 2025 contest. The 2025 to 2026 and 2023 to 2024 pages are the sites of those earlier editions, with their dates and standings links.
