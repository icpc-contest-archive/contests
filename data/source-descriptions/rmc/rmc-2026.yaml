    Kattis standings of ICPC Grand Central 2026 (Rocky/Mid-Central), Division 1, a contest shared by the Rocky Mountain and Mid-Central regions, held on 2026-10-31 from 10:00 to 15:00 MDT and shown as over. The table lists 75 teams with rank, team name, a state or province flag, an institution logo, number solved, penalty time and one cell per problem for the 13 problems A to M (Asynchronous Update to XOR Sharing), giving attempts and the minute of the accepted run; first solves are marked. Alberta Jade is first with 12 solved. A Conference filter selects a region and site: Rocky Mountain Region (Arizona State University, Brigham Young University, Colorado School of Mines, Montana Technological University, University of Calgary) or Mid-Central Region (seven sites). Our copy shows all teams of both regions together.
