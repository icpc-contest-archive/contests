  description: |-
    Problem set headed RMRC 2004 Contest, in English, as a ZIP archive of 78 files (111 entries counting folders). An index page lists eight problems A to H: coins (Gold Coins), prefix (Shortest Prefixes), squares, hirefire (Hire and Fire), mixbuild (Mix and Build), blackjack, litmus (Litmus Test) and polygon (Scrambled Polygon). Each problem has its statement as an HTML page and as a PDF, and example input and output files in two line-ending variants (the example output for mixbuild is not among them). Some statements carry GIF figures.

    The index also gives the limits for each problem (source size, run time, memory, output size), six general clarifications, and one clarification each for problems B, D, E and F. It holds no judge test data beyond the examples and no solutions. The contest name appears only in the index heading, as RMRC 2004 Contest.
