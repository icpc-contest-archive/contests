    Category page of the Baekjoon Online Judge for the 2004 Rocky Mountain Regional Contest, filed under ICPC Regionals, North America. It lists eight problems labelled A to H as Baekjoon problem numbers 4864 to 4871. Only problem C has a title, 별사각형 (literally "star square"), with 13 solvers out of 23 submissions; the other seven rows are blank in our copy. The page is in Korean apart from the contest name, and the rest is the judge's menus and navigation.
