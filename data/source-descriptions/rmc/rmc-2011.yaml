  description: |-
    Zip archive of 555 entries (390 files in 165 directories) with 26 folders directly under problems/. The ten contest problems A to J (diff, shapenumber, stock, contour, pills, robot, username, citi, family, supply) each appear twice, once in a folder named for the problem and once in a folder probA to probJ with identical test inputs. Three more problems labelled P, Q and R (count, gpa, vending) are likewise present twice. Each folder holds the statement as HTML and PDF in English, example and test input and output files, one solution source file in C, C++ or Java, and an executable; four folders also hold a GIF image.
