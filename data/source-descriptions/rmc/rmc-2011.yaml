  description: |-
    Home page of the 2011 Rocky Mountain Regional ACM Contest, in English. It names four host sites (University of Alberta, Neumont University, Colorado State University, University of Arizona) and the states and provinces the region draws from, gives the registration deadlines (early registration ends October 15, registration ends October 22) and the fees with payment instructions for US and Canadian teams, and links a FAQ, rules, unix tutorials and the pages of earlier regionals.

    A note at the top thanks participants and points to the final standings by rank and by team and to a zip file of statements, data sets and solutions. The page does not state the day of the contest. Our copy holds this one page.
