    Kattis standings of the 2019 Rocky Mountain Regional Contest: 76 teams in ranks 1 to 72, with five teams tied at rank 72, and eleven problems A to K. Each team row gives a country flag, an institution logo, the solved count, the penalty time and, per problem, the number of attempts and the minute of the accepted run, with a legend for first to solve, solved, attempted and pending judgement. The page is set to site All, a site selector lists Brigham Young University, Colorado School of Mines, Montana Tech, University of Alberta and University of Arizona, and the page shows the contest as over, from 18:00 to 23:00 CEST on 2019-10-26.
