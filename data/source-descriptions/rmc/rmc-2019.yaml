  title: RMC-NA ICPC | Rocky Mountain Regional Programming Contest
  language:
  - en
  contest_date: '2019-10-26'
  description: |-
    Website of the Rocky Mountain Regional Programming Contest (RMC-NA ICPC), in English. Our copy holds 28 pages (21 web pages and 7 PDFs) with 11 images, 4 style sheets and 2 scripts, from several editions of the site. The home page announces the contest of October 26, 2019, with five host sites (University of Alberta, Montana Tech, Brigham Young University, Colorado School of Mines, University of Arizona), registration, practice and contest dates, fees and the 2020 North America Championship. The University of Alberta and Brigham Young University host pages carry the October 25 and 26 schedule; the University of Arizona page is mostly TBD. The pages for site directors, coaches and contestants, the rules and the FAQ (which names Kattis as the judging system) are generic, and the coaches and rules pages still mention the Mid-Central USA regional. The page for judges holds only its heading.

    Other editions are in our copy too: a second home page announcing an online contest on March 6, 2021, host pages dated March 11 and 12, February 24 and 25, and March 24 and 25, a 5-page technical notes PDF for the Spring 2023 Pacific Northwest and Rocky Mountain contests, a 2022 Rocky Mountain Regional Contest scoreboard of 42 teams with four per-site standings pages, a page of 2020 North America Championship communications, and four newsletters and two travel documents of that Championship as PDFs. The 2019 results and problems are not in our copy.
