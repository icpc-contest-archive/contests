  description: |-
    Welcome page of the Rocky Mountain Regional Programming Contest web page, in English: the contest date, November 20, 1999, and a notice that the 2000 International Finals are to be held in Orlando, Florida. It gives the registration fees in a table, US$80 per team for US teams and Can$125 for Canadian teams when registered by October 23, 1999, and US$150 and Can$225 after that, with the rule for what makes a team registered. Menu links lead to the host sites, final standings, registration, what to expect at the contest, local rules, contest officials and an FAQ, and a contact e-mail line. Our copy holds only this one page; the linked pages are not in it.
