  description: |-
    Final standings of the Mountain Region programming contest, a single table of 54 teams from four sites (Lethbridge, Boulder, Salt Lake City, Missoula). Each row gives the site, a local number (blank for the Lethbridge teams), the team name, the number shown for each of eight problems Pro1 to Pro8 (blank when unsolved), problems solved, total time and rank. Thirty-four teams are ranked, first U of Alberta #1 with 8 solved and a total time of 1280; the other 20 solved nothing and have no rank; one of them is a row named Alternates. Two summary rows give 94 correct solutions in total and an average of 1.679 per team. A paragraph above the table states that, under the World Finals rules, the region is represented by its first and third ranked teams, University of Alberta Team #1 and University of Calgary Team #3. The page states it was last updated on 11/23/99. No attempt counts per problem.
