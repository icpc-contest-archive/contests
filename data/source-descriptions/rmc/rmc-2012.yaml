    Baekjoon Online Judge category page for the contest, with the site's menus in Korean. It lists eleven problems with the judge's problem numbers 4796 to 4806: the ten problems A to J and an additional problem P. Several titles are given in Korean translation and others in English (for example Fuel Stops, Catching Shade in Flatland, Emergency Room); for each problem the page shows the numbers of users who solved it, of submissions and the acceptance ratio. Only titles and statistics are on the page; the statements are on separate pages not in our copy.
