  description: |-
    Zip archive of 394 files in 26 folders under problems/ (561 entries counting the directories). The ten contest problems A to J (camper, chemistry, dirichlet, fuel, sorting, nine, overload, trees, shade, emergency) each appear twice, once in a folder named for the problem and once in a folder probA to probJ. Three more problems labelled P, Q and R (count, pills, username) are likewise present twice. Each folder holds the statement as HTML and PDF in English, a solution (C++, and C for count), an executable, and example and test input and output files; the shade folders also hold a verifier, and the nine and shade folders an image.
