  description: |-
    Home page of the 2006 Rocky Mountain Regional ACM Contest, in English. Our copy is this one page; the HTML title still reads 2005 but the heading and text are about 2006. It announces the final standings and the problem set, with links to a by-rank scoreboard and a zip file of statements, data sets and solutions.

    The page lists the states and provinces the contest draws from, four host sites (the University of Saskatchewan, the University of Utah, the University of Colorado, Boulder, and the New Mexico Institute of Mining and Technology), the contest date of October 28, 2006, registration deadlines, fees in US and Canadian dollars, and where to send payment. It also links to the FAQ, a list of people, the team roster, the mailing list, two Unix tutorials and the pages of the 2000 to 2005 contests. Those linked pages are not part of this copy.
