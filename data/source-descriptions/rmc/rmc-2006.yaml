  description: |-
    Zip archive of the problem set: 197 files, 16 of them macOS metadata entries, in a directory per problem. Nine directories (bidding, coins, toothpicks, humanknot, permutation, marbles, doors, knots, stringeq) are the contest problems A to I of the scoreboard. Three more (count, gpa, account) are labelled P, Q and R; the statement of count says it is meant to acclimate teams to the contest environment.

    Every directory has the statement as an HTML page and a PDF, input files, C source files and Windows executables. Output files are present for most problems but not for marbles, stringeq or toothpicks. Statements are in English.
