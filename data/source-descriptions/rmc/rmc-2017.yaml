  description: |-
    Problem set as a PDF of 22 pages with eleven problems A to K in English: Hissing Microphone, Open-Pit Mining, Multiplication Game, Polyline Simplification, Palindromic Password, Flow Free, Decisions, Decisions, Heart Rate, Initials, Particle Collision and Frosh Week. Each problem starts on its own page and has a statement with a problem ID, time limit, input and output format and sample input and output. Five problems (D, F, G, J, K) continue on a second page; after each of the other six the next page carries only the line 'This page is intentionally left blank'. There is no cover page and no contest name or date on the pages: the first page starts directly with problem A. No test data or solutions.
