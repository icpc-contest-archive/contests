  title: Home - 2017 Rocky Mountain Regional ACM Contest Information
  language:
  - en
  contest_date: '2017-11-11'
  description: |-
    Website of the 2017 Rocky Mountain Regional ACM Contest, in English. The home page names the five host sites (University of Alberta, Montana Tech, Colorado Mesa University, Colorado School of Mines, University of Arizona), the states and provinces the region draws from, the dates (early registration ends 28 October, registration ends 1 November, practice 10 November, contest 11 November) and the fees with payment instructions for the US and Canada. It links to the ICPC results page and to a public repository said to hold the statements, solution slides and data sets, and links to the earlier regional contests from 2000 to 2016.

    The FAQ page covers team size of three, languages (C++, Java, Python 2 and 3), what may be brought, the file naming and build conventions with a count example in C, C++, Java and Python, testing advice and the ranking rules with a penalty example. A portability page and the three count example source files (C, C++, Java) are also there; the FAQ names Kattis as the judge. Our copy holds seven pages. The page for the cast of characters holds only a server-side script error message in place of its content.
