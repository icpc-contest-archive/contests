    Standings of 52 teams with rank, team, institution, problems solved, penalty time, medal, a place citation and a site citation. The first four places carry gold medals, the next four silver and the next four bronze; places 13 to 27 show Ranked in the medal column and the rest have none. The citation column gives the ordinal place from first to twenty-sixth, and Honorable Mention from place 27 to the end. The site citation names a host site for four teams. SAMurai MASters of the Colorado School of Mines is first with 9 solved and 800 minutes. No per-problem detail.
