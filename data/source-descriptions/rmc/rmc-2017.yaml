  description: |-
    Scoreboard from the contest's Kattis site, shown after the contest ended: 52 teams ranked by problems solved and penalty time, with columns for rank, team name, an institution logo, number solved, time, and the eleven problems A to K. Each problem cell shows the number of attempts and the minute of the accepted run, or the number of attempts and a dash for unsolved problems; problems a team did not try are empty. A legend marks first solves, solved, attempted and pending cells, and a site filter lists the five host sites (Colorado Mesa University, Colorado School of Mines, Montana Tech, University of Alberta, University of Arizona). The institution of every team is given by its logo, with the name as a tooltip: 13 institutions in all. SAMurai MASters is first with 9 solved and 800 minutes. The page also gives the contest start and end times.
