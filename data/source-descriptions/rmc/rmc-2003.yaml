  language:
  - en
  teams: 85
  description: |-
    Final standings of the 2003 ACM Rocky Mountain Programming Contest sponsored by IBM, on a page titled View Standings: 86 rows with rank, team (written institution=>team name), citation, number solved and time. One row, a University of Arizona team at rank 39, appears twice, so 85 different teams are listed. Seventy-five places from first to seventy-fifth carry a rank and a citation that spells the place out (First Place, Second Place and so on); the two rows at rank 39 share one place. Ten teams with no problems solved are listed last at rank 100 with no citation. The first place is University of Calgary (Digital Dinos) with eight problems solved. There is no per-problem detail.
