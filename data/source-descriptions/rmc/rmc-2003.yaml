    Statement of one problem, PROB1: SPIN, as a PDF of one page in English. It asks for a simulation of a locked spinner puzzle with up to ten digit wheels and buttons labelled with digit strings, and gives a description, the input format (file prob1.dat) and output format (file prob1.out), each with an example. No contest name or date is printed on the page.
