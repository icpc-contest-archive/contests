  title: 2003 Rocky Mountain Regional ACM Contest Information
  language:
  - en
  contest_date: '2003-11-15'
  description: |-
    Contest information page of the 2003 ACM Rocky Mountain Regional Programming Contest, in English. It names the five host sites (University of Lethbridge, Montana State University Bozeman, University of Utah, University of Colorado at Colorado Springs, University of Arizona), gives 15 November 2003 as the date, lists the states and provinces the contest draws from, and covers the registration period, fees and billing for US and Canadian teams. It links to the final standings, the problem set, and problem archives in tgz and zip form, and to pages of four of the host sites (none for the University of Arizona) and of previous regionals from 1999 to 2002.

    Our copy is this single page. The linked standings and problem set are separate documents, and the links to the host sites and to the registration system lead to other servers.
