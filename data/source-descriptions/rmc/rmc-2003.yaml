  description: |-
    Problem set page of the Rocky Mountain Regional Programming Contest 2003, in English: a table of eight problems, prob1 (spin), prob2 (shake), prob3 (toys), prob4 (compress), prob5 (sheet), prob6 (gym), prob7 (planks) and prob8 (perms). For each problem it links a statement as PDF, example input and output files (each in a dos folder and a plain one), the limits (source size, run time, memory and output size) and numbered clarifications. It also links seven general clarifications.

    Our copy is this one page; the statements, data files and clarifications it links are separate files.
