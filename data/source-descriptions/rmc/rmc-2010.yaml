  description: |-
    Home page of the 2010 Rocky Mountain Regional Contest, a single page in English. After a thank-you to participants it links the final standings by rank and by team and a zip file with the problem set, which it says holds statements, data sets and solutions. It then gives general information (the region covers Arizona, Utah, Colorado, Wyoming, eastern Nevada, Idaho, Montana, Alberta, Saskatchewan and New Mexico, and it says winners selected from regional contests worldwide advance to the 2011 ACM Programming Contest World Finals), the four host sites (University of Saskatchewan, University of Utah, Colorado State University, University of Arizona), the contest date October 30, 2010, registration deadlines and fees, billing addresses, and links to the FAQ, "our cast of characters", unix tutorials and the pages of the contests of 2000 to 2009.

    Our copy is this page only; the linked scoreboards, FAQ and problem set are separate documents.
