  read: '2026-11-16'
  rubric: 1
  copy: rmc/rmc-2010/problemset/20261102-live-03fbece2/page.html
  language:
  - en
  problems: 9
  description: |-
    Zip archive of the problem set of the 2010 Rocky Mountain Regional Contest: 505 entries (including 149 directories), about 38 MB unpacked. It holds 24 problem folders: the nine contest problems A to I (Parenthesis, Ropes, Chain Code, Task, Page Count, Soccer, Railroad, Post Office, Aronson) and three further problems P, Q and R (count, spinids, treasure), each stored twice with identical contents, once under its name and once under prob plus its letter. Each folder has the statement as HTML and as PDF, a solution source file, a compiled executable, and test cases (an example and numbered tests, each with input and expected output).

    The entries are dated 29 October 2010 except two dated 30 October. Our copy keeps the archive as received; no HTML statement in it names the contest.
