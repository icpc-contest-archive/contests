    Category page of the Baekjoon Online Judge, a Korean judge, for the 2010 Rocky Mountain Regional Contest, filed under ICPC Regionals, North America. It lists nine problems with letters A to I and judge numbers 4817 to 4825: Parenthesis, Ropes, Chain Code, Task, Page Count, Soccer, Railroad, Post Office and Aronson, three of the titles shown in Korean translation. For each problem it shows the number of users who solved it, the number of submissions and the acceptance rate, as of the capture. The page has names only, no statements; the site's menus are in Korean, and the links lead to other pages of the judge.
