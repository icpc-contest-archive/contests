  description: |-
    Scoreboard page headed RMRC 2010 Contest (title "Scoreboard - RMRC 2010 Contest") from a contest judging site, with rows in rank order: 47 teams and nine problems A to I, each column headed with the problem's name (parenthesis, ropes, chaincode, task, pagecount, soccer, railroad, postoffice, aronson). Each team row gives the team number and name, the time at which each problem was solved as hours:minutes, sometimes followed by a plus sign and a number, then the columns Correct (problems solved) and Penalty. Unsolved problems are empty. Every listed team has at least one problem solved, and ranks 1 to 47 have no ties. UAlberta 1 is first with all nine problems and penalty 1414, ahead of ULeth A and UofUT Rot with six each. Institutions are not named separately and the page does not say whether it is final.

    The page's navigation links to the judging site lead to another server and are not part of our copy.
