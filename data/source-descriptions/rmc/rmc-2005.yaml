  description: |-
    Problem set of the 2005 Rocky Mountain Regional ACM Contest, in English, as a ZIP archive of 172 files. An index page lists nine problems A to I (tire, randomwalk, paint, openclose, hourglass, mindiff, odometer, digits, suit) with the limits for each (source size, run time, memory, output size), five general clarifications and three clarifications for problem A, none for the others. Each problem has its statement as an HTML page and as a PDF and an example input; every problem except hourglass also has an example output. Each problem folder also holds windows and unix variants of the example. Every problem has at least one set of test input files, with test output files except for hourglass, which has six test inputs and no outputs; openclose has nine test sets. Problem A has a figure as a GIF.

    The archive also holds three more problems named count, server and vending, headed Problem P, Q and R, that the index does not list; the count statement describes a problem meant to acclimate teams to the contest environment. A README explains the layout and mentions example solutions, but our copy holds none. The contest name appears only in the index heading.
