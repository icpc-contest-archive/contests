  description: |-
    Final standings of the 2016 Rocky Mountain Regional Contest: 58 teams with rank, team name, institution, number solved, total time, medal, citation and site citation. There is no per-problem detail. The first twelve places carry medals (four gold, four silver, four bronze), places 13 to 40 are marked Ranked with their place name, and the 18 teams from rank 41 down are listed as Honorable Mention, the last five with no problems solved. The site citation column is filled for six teams only, naming a site such as the University of Alberta or the University of Utah. Alberta Gold from the University of Alberta is first with 8 problems solved in 680 minutes. The page states no contest date.
