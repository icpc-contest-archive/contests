  problems: 10
  times: true
  tries: true
  description: |-
    Final scoreboard of the 2016 Rocky Mountain Regional Contest on Kattis: 59 teams ranked by problems solved and penalty time, with problems A to J as columns. The page shows the contest as over after 5 hours, with start time 2016-10-29 18:00 CEST. Each team row gives the number solved, the total time, and per problem the number of tries followed by the minute of the accepted run, or by a dash when the problem is unsolved; problems a team did not attempt are blank. Team names appear without institutions. First place is Alberta Gold with 8 problems and 680 minutes; the last five teams, ranked 55, solved none.

    A site selector offers all teams or one of five sites: Colorado School of Mines, New Mexico Tech, University of Alberta, University of Arizona and University of Utah. A key marks first solves, solved, attempted and pending cells. Style sheets and images are kept with the page.
