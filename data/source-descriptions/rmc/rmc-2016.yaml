  title: Home - 2016 Rocky Mountain Regional ACM Contest Information
  language:
  - en
  contest_date: '2016-10-29'
  description: |-
    Website of the 2016 Rocky Mountain Regional ACM Contest, in English. The home page names four host sites (the University of Alberta, the University of Utah, the Colorado School of Mines and the University of Arizona), lists the states and provinces the contest draws from, gives the registration deadlines, practice day (October 28) and contest day (October 29), and sets out the fees and how to pay. After the contest it was updated with links to the results and to a zip file of the problem set (statements, slides about the solutions and data sets).

    Our copy holds 6 pages: the home page, an FAQ (team size of three, allowed languages C++, Java and Python, what to bring, how to submit), a portability page with tips for C and C++ code, and three example source files (count.c, count.cpp, count.java). The page of contest officials is in our copy only as a script error message, with no content. The portability page is headed 2004. The results are a link to another server, and the zip file is not part of our copy.
