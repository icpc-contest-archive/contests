  title: ASSOCIATION FOR COMPUTING MACHINERY Tom Mourey Memorial ROCKY MOUNTAIN REGION 2001 PROGRAMMING CONTEST
  language:
  - en
  problems: 9
  description: |-
    Problem set page of the Tom Mourey Memorial Rocky Mountain Region 2001 Programming Contest of the Association for Computing Machinery, in English: a table of nine problems, prob0 to prob8 (Hanoi, Molding, IP, Gates, Telephone, CAS, Holes I, Holes II, 100's). For each problem it links a statement page, a data file and an output file, and gives source, time, space and output limits against a row of defaults (100 KB, 10 sec, 128 MB, 100 KB). Molding, CAS and Holes II have a one-minute time limit, and CAS a 1 MB output limit. The clarifications column links numbered clarifications for prob0, prob2, prob3 and prob6 and says none for the other five.

    A line above the table links the final standings and the FAQ. Only this page is in our copy; the statement pages, data files and clarifications it links to are not.
