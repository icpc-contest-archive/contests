  description: |-
    Contest information page of the 2001 ACM Rocky Mountain Regional Programming Contest, in English. It names Lethbridge, Montana State (Bozeman), Utah, Colorado (Boulder) and Arizona as host sites and gives the contest date, the states and provinces the contest draws from, the registration period, fees and billing addresses for US and Canadian teams, and links to the regulations, a cast page, the host sites' own pages, a final standings page and a problem set page.

    A single page: the standings and the problem set are linked, not part of it.
