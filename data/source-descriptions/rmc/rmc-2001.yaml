  teams: 51
  problems: 8
  times: true
  tries: false
  description: |-
    Final scoreboard: 51 teams, each with its solve time for problems prob1 to prob8, the number of problems solved (Correct) and the penalty. A solve is shown as a clock time such as 13:29, in some cells followed by +20, +40 and so on. A cell is left empty for a problem a team did not solve; the page says a team that did not finish a problem does not appear in the table for it. A Total row gives the solves per problem (prob7 has none, so its cell is blank) and prints 150 under Correct, although the Correct column adds up to 151. The first place has 7 problems solved.

    A line above the table points to a file with longer team names; that file is not part of our copy.
