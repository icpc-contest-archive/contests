  description: |-
    Two posts from the Usenet newsgroup comp.org.acm, as shown by Google Groups, in a thread about the 1991 Mountain Region Contest. The first, dated 12 November 1991, is a reposted reply that quotes and answers an earlier exchange: complaints that the contest had problems with output formats, testing of the judges' solutions (including wrong-output-format verdicts on a finite automata problem), one problem restricted to Pascal and another with a 17-page statement. The second post, of 13 November 1991, comments on the Pascal-only complaint and on what the contest can and cannot test.

    It is discussion by participants and readers; it gives no team results, ranking or scores.
