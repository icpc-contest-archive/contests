  title: 1991 Mountain Region Programming Contesy
  language:
  - en
  description: |-
    Thread of seven posts from the Usenet newsgroup comp.org.acm, as shown by Google Groups, dated 9 to 12 November 1991 and titled 1991 Mountain Region Programming Contesy (sic). The first post, by a member of one of the two University of Idaho teams, says the contest had just finished and lists complaints: a problem statement of 17 pages, a problem restricted to Pascal although the rules allowed Pascal or C, problems needing special knowledge, output formats judged too strictly, noise from judges and runners, and protests lodged on 4 of the 8 problems. The other six posts reply to the complaints and to each other, agreeing or disagreeing; one compares the length of problem statements with another regional contest, and one concerns the address for an unrelated programming contest.

    It is an account by participants and readers; it gives no team results or ranking.
