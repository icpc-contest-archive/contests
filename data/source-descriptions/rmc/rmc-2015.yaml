  tries: true
  description: |-
    Final scoreboard of the 2015 Rocky Mountain Regional Contest on Kattis: 52 teams ranked by problems solved and penalty time, with problems A to K as columns. The page shows the contest as over after 5 hours, with start 2015-11-14 18:00 CET. Each team row gives the number solved, the total time, and per problem the number of tries followed by the minute of the accepted run, or by a dash when the problem is unsolved; problems a team did not attempt are blank. Team names appear without institutions. First place is Uncompilables with 8 problems and 1048 minutes.

    A site selector offers all teams or one of five sites: Colorado School of Mines, Colorado State University, University of Alberta, University of Arizona and Utah State University. A key marks first-to-solve, solved, attempted and pending-judgement cells. Style sheets and images are kept with the page.
