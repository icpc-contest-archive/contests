  title: Home - 2015 Rocky Mountain Regional ACM Contest Information
  language:
  - en
  contest_date: '2015-11-14'
  description: |-
    Website of the 2015 Rocky Mountain Regional ACM Contest, in English. The home page names four host sites (the University of Alberta, Utah State University, the Colorado School of Mines and the University of Arizona), lists the states and provinces the contest draws from, gives the registration deadlines, practice day (November 13) and contest day (November 14), and sets out the fees and how to pay. After the contest it was updated with links to the results, to a zip file of the problem set (statements, slides about the solutions and data sets) and to a GitHub repository.

    Our copy holds 7 pages. Besides the home page they are an FAQ (team size of three, allowed languages C++, Java and Python, what to bring, how to submit), a page listing the contest officials and site directors, a portability page with tips for C and C++ code, and three example source files (count.c, count.cpp, count.java). The portability page is headed 2004. The results and the GitHub repository are links to other servers, and the zip file is not part of our copy.
