  description: |-
    Final standings of the 2015 Rocky Mountain Regional Contest: 52 teams with rank, team name, institution, number solved, total time and a citation. There is no per-problem detail. The first twelve places carry the citations First Place to Twelfth Place; teams that tie share a rank, so six teams are ranked 13 (Thirteenth Place) and eleven are ranked 19 (Nineteenth Place). The 23 teams from rank 30 down are cited as Honorable Mention. The University of Utah team Uncompilables is first with 8 problems solved in 1048 minutes, ahead of um from the Colorado School of Mines. The page states no contest date.
