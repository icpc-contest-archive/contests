  description: |-
    Results of the Mountain region contest as a plain-text table in a post to the Usenet newsgroup comp.org.acm, dated 7 November 1993 and shown by Google Groups. The post says the contest was held in Colorado, Utah and Alberta. The table lists 29 teams in rank order with problems solved, total time, and for each of problems 1 to 8 a time and an error count (a colon marks a problem not solved). Colorado 1 is first with 8 problems and 984; Brigham Young and Utah 1 also solved 8.

    Eight rows are marked (*); a footnote says that for those teams only total times for problems are available, not solve times and errors. A TOTAL row follows the table, with a few remarks on average time per problem and wrong submissions.
