  title: ICPC North America Rocky Mountain Regional
  language:
  - en
  contest_date: '2024-11-09'
  description: |-
    Website of the ICPC North America Rocky Mountain Regional, in English. Our copy holds three pages: the home page, a Contest Sites page and a robots file; the remaining 63 files are style sheets, scripts, fonts, images and data files.

    The home page announces the 2024-2025 Regional Programming Contest on Saturday, 9 November 2024, 11 to 4 PM MST, with a practice day on 8 November. It gives the registration and late registration deadlines, the list of states and provinces the region welcomes teams from, registration fees for US and Canadian universities, a pre-qualifier notice for coaches, sponsors, a live stream embed and a button labelled Live Scoreboard. The Contest Sites page lists six host sites: Brigham Young University, Colorado School of Mines, Colorado Mesa University, Montana Technological University, University of Arizona and University of Calgary.

    No results, team list or problem statements are in our copy. The live stream is an embed from another server.
