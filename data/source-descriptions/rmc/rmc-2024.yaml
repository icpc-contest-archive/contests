    Final scoreboard of the 2024 Rocky Mountain Regional Contest on Kattis: 54 teams against 13 problems labelled A to M. Each team row gives rank, number solved, total time, and for every problem the number of attempts and the minute of the accepted run, or the attempts alone for an unsolved problem. Ties share a rank (two teams at 51, two at 53). The first team, Mines-Albatross, solved all 13 problems.

    The page states a start of 2024-11-09 11:00 MST and an end at 16:00, shows the contest as over, carries a legend for first to solve, solved, attempted and pending judgement, and has a site filter for Brigham Young University, Colorado Mesa University, Colorado School of Mines, University of Arizona and University of Calgary. The table shows all sites together; there is no institution column, but each row has a state flag and an institution logo image. No cell is marked pending.
