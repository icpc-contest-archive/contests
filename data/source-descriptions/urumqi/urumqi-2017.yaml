  description: |-
    Standings of the 2017 ACM-ICPC Asia Urumqi Regional Programming Contest: 96 teams with rank, team name, institution, number of problems solved, time, and a citation. The citations are 9 gold medals, 18 silver medals, 27 bronze medals and 36 honorable mentions; the last six teams in the list have no rank and no citation. Peking University's team Check it out is in first place with 10 problems solved and a time of 689. There is no per-problem detail.
