  description: |-
    Scoreboard of the Urumqi on-site contest, in Chinese: 94 team rows with school number, school, rank, team name, number solved, total time, and for each of the 11 problems A to K the attempts and time of the accepted solution. The header of each problem column carries two counts, and a legend names first to solve, solved, attempted and pending judgement. Peking University is in first place with 10 problems solved.

    Seventy-eight rows carry a school number in the first column; 15 have it blank and one has a star. The page notes that medals are estimated at 9, 18 and 27 and are for reference only. A side menu links to ranklists of other contests from 2008 to 2017; those pages are not part of our copy.
