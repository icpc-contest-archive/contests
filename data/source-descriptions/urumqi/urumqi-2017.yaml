    Editorial as a PDF of 3 pages headed "Asia Urumqi Regional Contest Onsite 2017, Problem Analysis". It covers all eleven problems, from "Problem A. Coins" to "Problem K. Sum of the Line", with problem F titled "Gathering Minerals" and J "Lowest Common Ancestors". The headings are in English and the analyses in Chinese: a short paragraph or two per problem giving the idea of the solution, with formulas and time complexity where relevant, and a longer account for F and J. No author is named and there is no code.
