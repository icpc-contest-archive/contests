  copy: urumqi/urumqi-2017/website/2026-09-05-wayback-ff11738d
  title: Xinjiang University Online Judge
  language:
  - zh
  - en
  description: |-
    Website of the Xinjiang University ACM association and its Online Judge, mostly in Chinese. Our copy holds 150 files, three of them small stubs (a redirect to a discussion board that is not in the copy, and two files holding only a token). The rest are the association's front page, the judge's problem list with 34 problem statement pages, submission status pages, user rankings, an FAQ, a list of contests held on the judge, and a list of upcoming contests on other judges dated April 2018. It is a general online judge; one page announces the 2017 ACM-ICPC Asia Urumqi Regional Contest as to be held at Xinjiang University.

    Five PDF notices of the organising committee of the 42nd ACM ICPC Asia regional contest are in the copy: the online round notice dated 26 August 2017 (3 pages, the first a cover page; round set for 9 September 2017), the rules for allocating on-site slots dated 27 August 2017 (2 pages), a notice dated 12 September 2017 inviting universities without a slot to apply (1 page), a list of invited universities with the number of teams each may send (2 pages, 102 slots in total), and a registration guide for the on-site contest dated 15 September 2017 (2 pages). No results, scoreboard or problem statements of the regional contest are in our copy.
