  language:
  - zh
  - en
  problems: 11
  description: |-
    Contest page on the Luogu online judge for a replay of the 2017 ACM-ICPC Asia Urumqi Regional, in Chinese. The replay ran on 2026-08-17 from 13:00 to 18:00 under ICPC rules with a frozen last hour and teams of one to three; the page says it uses the original problems and data of the on-site contest, with Chinese statements, and thanks Jisuanke for the data. It lists the 11 problems A to K by name (Coins, The Difference, The Number Triangle, Fence Building, Friends, Gathering, The Mountain, Count Numbers, A Possible Tree, Lowest Common, Sum of the Line), and gives the contest rules, the submission limit and instructions for certifying a prize.

    Our copy is the contest's front page only: the statements are on separate problem pages that are not in it.
