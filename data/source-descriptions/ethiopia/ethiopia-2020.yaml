  description: |-
    Standings of the 2020 Ethiopian Collegiate Programming Contest: 108 teams from 14 institutions, with rank, team name, institution, number of problems solved, time and a citation. Adama Science and Technology University has the most teams (30), followed by Al-Balqa` Applied University (20) and Al al-Bayt University (13). Andalus is first with nine problems solved. Places one to fifty-four carry citations from First Place onward and places fifty-five to 108 are marked Honorable Mention. There is no per-problem detail.
