  description: |-
    Problem set as a PDF of 17 pages. The first page is headed "2006 ACM International Collegiate Programming Contest - KaoHsiung" and 2006/11/18, gives the contest rules (ranking by problems solved and time, a 20-minute penalty per incorrect submission, a default 30-second time limit, input files named pa.in to pi.in) and a table of the nine problems with their time limits: A Print Words in Lines, B The Bug Sensor Problem, C Pitcher Rotation, D Lucky and Good Months by Gregorian Calendar, E Route Planning, F Shift Cipher, G A Scheduling Problem, H Click the Lines and I Perfect Service.

    The statements follow, one to three pages each, every one with input and output format and a sample input and output. All but one open with the problem letter, input file name and time limit; problem F, Shift Cipher, starts with its title only. No solutions or test data. The PDF's text layer drops every lowercase letter c and the fi and ff ligatures, so text searched or copied from it is garbled, although the pages display correctly.
