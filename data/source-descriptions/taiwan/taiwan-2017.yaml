  problems: 1
  pages: 1
  description: |-
    Statement of one problem as a PDF of 1 page, headed "8263 Smooth Sequences". A sequence of integers is smooth if neighbouring numbers differ by at most d and semi-smooth if changing exactly one number makes it smooth; the program tests whether a given sequence is smooth or semi-smooth. Input and output format and a sample input and output are included.
- url: https://icpcarchive.ecs.baylor.edu/external/82/8264.pdf
  read: '2026-11-23'
