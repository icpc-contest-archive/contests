  description: |-
    Problem set handed out at the contest: a PDF of 32 pages, dated 25 November 2017 on the cover, with 13 problems A to M. The cover page gives the rules for program input and output and a table of problem names with time limits; the statements follow in English, with input and output formats and sample input and output for most problems. No test data or solutions.

    The PDF is made of page images without a text layer, so our copy cannot be searched as text.
- url: http://icpc2017.ndhu.edu.tw/ezfiles/186/1186/img/3475/finalreport.pdf
  read: '2026-11-16'
  rubric: 1
  copy: taiwan/taiwan-2017/editorial/20180713-wayback-ba8ca293/finalreport.pdf
  title: The 2017 ACM-ICPC Asia Hua-Lien Regional Contest Final Report
  language:
  - en
  contest_date: '2017-11-25'
  problems: 13
  pages: 2
  description: |-
    Final report of the host, National Dong Hwa University, in two pages. It gives the days of the event (24 to 26 November 2017), how teams qualified and how many entered from each route, and the contest statistics: 13 problems, 1182 submissions of which 433 were accepted, and four teams with no solved problem. Tables give solved count and submission count for each problem A to M, and the number of teams for each number of problems solved from 12 down to 0. It names the first three places and the prize ranges (gold for the top 8, silver for places 9 to 24, bronze for 25 to 48) and a prize for the best female team.

    It does not walk through solutions to the problems.
