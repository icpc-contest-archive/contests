    Standings of the regional contest: 80 teams with rank, team name, institution, number solved and time, and three more columns named Medal, Citation and Site citation. The Medal column marks 8 teams Gold, 16 Silver, 24 Bronze and one Best Female Team; the Citation column gives place names and Honorable Mention; the Site citation column marks six teams with the problems they were first to solve and one team as Best Female Team. The first place is PECaveros of National Taiwan University with 12 solved and time 917. There is no per-problem detail.
