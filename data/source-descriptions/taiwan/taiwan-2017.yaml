  copy: taiwan/taiwan-2017/judge-livearchive/20190917-wayback-c3b0a938/8264.pdf
  title: 8264 Threesome
  language:
  - en
  problems: 1
  pages: 1
  description: |-
    Statement of one problem as a PDF of 1 page, headed "8264 Threesome". For n students with pairwise social connectivities, find the largest sum of the mutual connectivities of a threesome (n from 3 to 300). Input and output format and a sample input and output are included.
- url: https://icpcarchive.ecs.baylor.edu/external/82/8265.pdf
  read: '2026-11-23'
  rubric: 1
  copy: taiwan/taiwan-2017/judge-livearchive/20210122-wayback-927a4fa3/8265.pdf
  title: 8265 Coefficient Computation
  language:
  - en
  problems: 1
  pages: 1
  description: |-
    Statement of one problem as a PDF of 1 page, headed "8265 Coefficient Computation". Given n, k and a base d, output the binomial coefficient C(n, k) written in base d. The statement gives the factorial and recursive formulas. Input and output format and a sample input and output are included.
- url: https://icpcarchive.ecs.baylor.edu/external/82/8266.pdf
  read: '2026-11-23'
  rubric: 1
  copy: taiwan/taiwan-2017/judge-livearchive/20200929-wayback-f63acf7c/8266.pdf
  title: 8266 Network Report
  language:
  - en
  problems: 1
  pages: 2
  description: |-
    Statement of one problem as a PDF of 2 pages, headed "8266 Network Report"; the text carries the line "ACM-ICPC Live Archive: 8266 – Network Report" with the page number. For a connected, undirected, unweighted network graph, the program reports how many shortest paths there are of each length from 1 to the maximal length, counting multiple shortest paths between a pair of nodes once. A figure of an example graph is included. Input and output format and a sample input and output are included.
- url: https://icpcarchive.ecs.baylor.edu/external/82/8267.pdf
  read: '2026-11-23'
  rubric: 1
  copy: taiwan/taiwan-2017/judge-livearchive/20210125-wayback-ef96e5b8/8267.pdf
  title: 8267 Ambush
  language:
  - en
  problems: 1
  pages: 3
  description: |-
    Statement of one problem as a PDF of 3 pages, headed "8267 Ambush"; the text carries the line "ACM-ICPC Live Archive: 8267 – Ambush" with the page number. Troops are deployed on roads between towns so that an enemy invading with k units of troops (the text's example uses 10) can be defeated whatever path it takes, ambushing with one third or more of its troops; the task is the minimum total ambush troops needed to guarantee the safety of the capital. The text refers to Figures 1 to 4 for an example. Input and output format and a sample input and output are included.
- url: https://icpcarchive.ecs.baylor.edu/external/82/8269.pdf
  read: '2026-11-23'
  rubric: 1
  copy: taiwan/taiwan-2017/judge-livearchive/20201021-wayback-3877dd00/8269.pdf
  title: 8269 Family Gathering at Christmas
  language:
  - en
  problems: 1
  pages: 2
  description: |-
    Statement of one problem as a PDF of 2 pages, headed "8269 Family Gathering at Christmas"; the text carries the line "ACM-ICPC Live Archive: 8269 – Family Gathering at Christmas" with the page number. A family chooses a host: each non-host member's travelling time is a weight times a sum of two distances, each place has a key equal to the longest such time, and the task is to find the k-th smallest key. Input and output format and a sample input and output are included.
- url: https://icpcarchive.ecs.baylor.edu/external/82/8270.pdf
  read: '2026-11-23'
  rubric: 1
  copy: taiwan/taiwan-2017/judge-livearchive/20210125-wayback-039b072d/8270.pdf
  title: 8270 A Partial Order Relation
  language:
  - en
  problems: 1
  pages: 1
  description: |-
    Statement of one problem as a PDF of 1 page, headed "8270 A Partial Order Relation". A greatest-divisibility relation is built among the divisors of a number; given a number r, the program computes the number of edges in the resulting relation graph, which has 28 edges for 120. Figure 1 shows the graph for 120. Input and output format and a sample input and output are included.
- url: https://icpcarchive.ecs.baylor.edu/external/82/8271.pdf
  read: '2026-11-23'
  rubric: 1
  copy: taiwan/taiwan-2017/judge-livearchive/20200930-wayback-0f8ee670/8271.pdf
  title: 8271 Tracer Deployment
  language:
  - en
  problems: 1
  pages: 2
  description: |-
    Statement of one problem as a PDF of 2 pages, headed "8271 Tracer Deployment"; the text carries the line "ACM-ICPC Live Archive: 8271 – Tracer Deployment" with the page number. In a bipartite network, tracers must be placed so that every attack passes at least one tracer; the task is the minimum number of tracers needed. Input and output format and a sample input and output are included.
- url: https://icpcarchive.ecs.baylor.edu/external/82/8273.pdf
  read: '2026-11-23'
  rubric: 1
  copy: taiwan/taiwan-2017/judge-livearchive/20201027-wayback-3a06083d/8273.pdf
  title: 8273 Assigning Frequencies
  language:
  - en
  problems: 1
  pages: 2
  description: |-
    Statement of one problem as a PDF of 2 pages, headed "8273 Assigning Frequencies"; the text carries the line "ACM-ICPC Live Archive: 8273 – Assigning Frequencies" with the page number. Decide whether frequencies can be assigned to n satellites (n at most 25), with only three frequencies available, so that no two interfering satellites share one; there are at most 85 test cases. Input and output format and a sample input and output are included.
- url: https://icpcarchive.ecs.baylor.edu/external/82/8274.pdf
  read: '2026-11-23'
  rubric: 1
  copy: taiwan/taiwan-2017/judge-livearchive/20191120-wayback-852a5b1d/8274.pdf
  title: 8274 Finding the Bases
  language:
  - en
  problems: 1
  pages: 1
  description: |-
    Statement of one problem as a PDF of 1 page, headed "8274 Finding the Bases". A brief string such as (ab, 2)(a, 4) stands for a repeated string; given an ordinary string, the task is the length of its basis, the shortest brief string representing it, where length counts only the repeated strings. Input and output format and a sample input and output are included.
- url: https://icpcarchive.ecs.baylor.edu/external/82/8275.pdf
  read: '2026-11-23'
  rubric: 1
  copy: taiwan/taiwan-2017/judge-livearchive/20210122-wayback-56878c5f/8275.pdf
  title: 8275 Annual Congress of MUD
  language:
  - en
  problems: 1
  pages: 2
  description: |-
    Statement of one problem as a PDF of 2 pages, headed "8275 Annual Congress of MUD"; the text carries the line "ACM-ICPC Live Archive: 8275 – Annual Congress of MUD" with the page number. Players are assigned to one of the daily gatherings (the congress lasts D days, 3 to 20) within their stay so that the maximum number of players at any gathering is minimised; the system must report this maximum after each player enters, and the output lists the marked integers in ascending order. Input and output format and a sample input and output are included.
