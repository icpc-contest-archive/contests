  description: |-
    Website of the 2017 ACM-ICPC Asia Hua-Lien Regional Contest, made by National Dong Hwa University, bilingual in Chinese and English. Our copy holds 58 pages: a news list with dated announcements from July to December 2017, registration for foreign teams and for Taiwanese teams, contest rules, the contest environment, the schedule, the team list, travel information with accommodation and transportation, contact details, and a photo page with albums for the opening, practice, contest, award ceremony and banquet.

    The schedule gives the practice contest on 24 November, the programming contest on 25 November from 09:30 to 14:30, and an excursion on 26 November. The site holds a practice scoreboard and a final scoreboard, a problem set PDF of 32 pages with 13 problems A to M, and a two-page final report PDF.
