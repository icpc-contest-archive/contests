  read: '2026-11-16'
  rubric: 1
  copy: taiwan/taiwan-2024/rankings/20250126-wayback-f5b52a0d/page.html
  title: Awards
  language:
  - en
  problems: 14
  description: |-
    Awards page from the contest website. Teams are listed as institution followed by team name under Gold Awards (10 teams), Silver Awards (20) and Bronze Awards (30), 60 teams in all, with The University of Tokyo's Screenwalkers first. A Best Female Team entry follows.

    A First to Solve list gives, for each of the 14 problems A to N, the team that solved it first and the minute, from problem A at minute 1 to problem L at minute 277. Teams without an award are not listed, and there are no scores or per-problem results for other teams.
- url: https://codeforces.com/contest/2041
  read: '2026-11-16'
  rubric: 1
  copy: taiwan/taiwan-2024/problemset/20261102-live-0eae8e92/page.html
  title: 2024 ICPC Asia Taichung Regional Contest (Unrated, Online Mirror, ICPC Rules, Preferably Teams)
  language:
  - en
  problems: 14
  description: |-
    Codeforces contest dashboard for an online mirror of the contest, marked Finished. It lists 14 problems A to N, from The Bento Box Adventure to Railway Construction, with a time limit (1 to 10 seconds), a memory limit (1024 MB, except 128 MB for problem K) and a solved count for each. Contest materials are links to an announcement, the statements as a PDF and a tutorial, all in English. One announcement, dated 2024-11-24, gives the address of a compressed PDF of all the statements.

    Only the dashboard page is in our copy; the statements, the tutorial and the standings it links to are not.
- url: https://icpcarchive.github.io/Asia-Pacific/Taiwan/The-2024-ICPC-Asia-Taichung-Regional-Programming-Contest/tutorials_en.pdf
  read: '2026-11-16'
  rubric: 1
  copy: taiwan/taiwan-2024/editorial/20261114-live-b2e9acd2/tutorials_en.pdf
  title: 2024 ICPC Asia Taichung Regional Contest Problem Analysis and Hints
  language:
  - en
  problems: 14
  pages: 10
  description: |-
    Problem analysis and hints as a PDF of 10 pages in English, with a title block naming the contest. The first page lists the 14 problems A to N with their titles and the task authors who contributed the main idea of each, and a note that the tasks were prepared by the whole judge team and ChatGPT, followed by thanks to six named reviewers. After that each problem has its own section, from Problem A: The Bento Box Adventure to Problem N: Railway Construction, explaining the key idea and the algorithm in a few lines to about a page, with formulas and running times. There is no code and no problem statement text.
