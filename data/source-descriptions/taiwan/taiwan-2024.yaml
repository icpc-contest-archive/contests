- url: https://hpc.asia.edu.tw/icpc2024/
  read: '2026-11-16'
  rubric: 1
  copy: taiwan/taiwan-2024/website/2026-10-20-wayback-2339e6b0
  title: On-site Contest
  language:
  - en
  - zh
  contest_date: '2024-11-17'
  description: |-
    Website of the 2024 ICPC Asia Taichung regional, in English with Traditional Chinese alongside. The front page, headed On-site Contest, gives the event as 16 to 18 November 2024 at the Gymnasium of Asia University, with the contest itself from 9:30 AM to 2:30 PM on 17 November 2024 (five hours), at least eight problems in English, up to 10 foreign teams, and links for a contest guide and a live stream. Other pages cover team selection (how domestic teams qualify), accommodation, the contest environment (DOMjudge 8 on Ubuntu with the compilers and editors available), on-site rules, registration (fees of 5,000 NTD for domestic teams and 250 USD for foreign teams), travel information, a three-day schedule and photos. The news page holds only the word TBD.

    Results pages: a Final Scoreboard page, which holds a single image of the standings, and an Awards page listing the Gold, Silver and Bronze Award teams, the Best Female Team and the first team to solve each of the 14 problems with the minute. The Problem Statement page has two download links, for the problem statement and for Problem Analysis and Hints, both to an outside file store.

    Our copy holds 13 pages. The scoreboard image, the problem files and the photos are not in it.
