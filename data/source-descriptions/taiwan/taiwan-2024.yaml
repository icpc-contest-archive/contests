- url: https://icpc.global/regionals/finder/Taipei-2025/standings
  read: '2026-11-16'
  rubric: 1
  copy: taiwan/taiwan-2024/standings/api-20260904/standings.html
  title: The 2024 ICPC Asia Taichung Regional Programming Contest
  language:
  - en
  teams: 110
  description: |-
    Final standings of 110 teams, each with a rank from 1 to 110, team name, institution, problems solved, time, medal and a citation. There are 10 Gold, 20 Silver and 30 Bronze Awards and 50 Honorable Mentions in the medal column. In the citation column the first team is Champion, ranks 2 to 55 have the place as a word (Second Place and so on), and the remaining 54 teams have Honorable Mention, except one team marked Best Female Team; ranks 56 to 60 are Bronze Award teams with that Honorable Mention citation. First place is Screenwalkers of The University of Tokyo with 13 solved and a time of 1186. The institutions include Taiwanese universities and others such as The University of Tokyo and KAIST.

    There is no per-problem detail, no attempt counts and no link to the problems.
