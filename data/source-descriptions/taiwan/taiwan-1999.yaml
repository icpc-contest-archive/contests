  description: |-
    Website pages for the Taipei site of the 1999 ACM/ICPC Asia Regional Contest, in English. Our copy holds 15 files, 12 of them pages (HTML, PDF and text) and three images. The Final Report page states that the contest drew 8 foreign teams (2 from China, 2 from Singapore, 1 each from Hong Kong, Japan and Korea) and 41 teams from Taiwan, gives December 11, 1999 as the date and National Taiwan Normal University, Taipei as host, and links to the other two pages.

    The Final Standings page lists 17 ranked teams with problems solved and penalty, plus 12 honorable mentions. The Problem Sets page links a PDF of the problems and a test data text file for each of the eight problems A to H; all of these are in our copy. The PDF in our copy is damaged and cut off; only its first page can be read, and it holds the start of problem A (Ranking Prizes).
