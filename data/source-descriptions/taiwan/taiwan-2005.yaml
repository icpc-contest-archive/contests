  title: ACM International Collegiate Programming Contest Asia Regional - Taipei Site Oct. 29 ~ Oct. 31, 2005
  language:
  - en
  - zh
  problems: 9
  description: |-
    Website of the ACM ICPC Asia Regional contest, Taipei Site, in English with some Chinese pages, headed "Oct. 29 ~ Oct. 31, 2005". The front page announces a registration deadline of Oct. 1, 2005 and a menu of ACM, Registration, Contest Info, Rules, Final Results and Pictures. Our copy holds 86 pages among 149 files.

    From this edition it has the ACM page (links to the ICPC homepage and fact sheets), a PC2 User's Guide page that links to the PC2 version 8.5d team guide (the PDF is in our copy, the HTML version is not), a rules page that states a team has exactly three contestants, a campus map page and a pictures page whose text is only the header and menu. A Problem Set page lists nine problems, numbered 1 to 9, each linked to its own PDF, plus the whole set as one PDF; all of these PDFs are in our copy.

    The registration, contest information and final results pages of the menu, the rules sub-pages, the final standings page and the campus map images are not in this crawl. The address also serves pages of the 1999, 2000 and 2001 contests.
