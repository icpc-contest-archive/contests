  description: |-
    Statement of problem 6697, 'Homework Evaluation': find the best alignment score of a student's substring against a text under given scores for matches, mismatches, insertions and deletions. It has a worked example giving 42 points, a technical specification, input and output sections and a sample with two cases. A PDF of 2 pages in English. On its second page a running head reads 'ACM-ICPC Live Archive: 6697 – Homework Evaluation 2/2'. The copy does not name the contest or give a problem letter.
