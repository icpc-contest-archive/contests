  description: |-
    Front page of the website of the 2013 ACM-ICPC Asia Chiayi Regional contest, in English with a few Chinese items; the footer carries a copyright line of CCU and an address in Chiayi County. A news list of 15 entries dated 2013/06/18 to 2013/12/03 names the welcome message, posters, videos, certificates, the contest team list, a rules update, a press release, a performance guide, campus and wetland tour notes, banquet tables, live broadcast links, and the opening and closing speeches.

    The menu is made of image buttons that link to further pages (file names for ICPC, rules, registration, schedule, environment, accommodation, transportation, scoreboard, contact, staff list, site map, campus and photos) and to PDFs named for the contest problems, the standing and a contest report. Our copy holds only this front page and a one-line redirect page that points to it; none of the pages or PDFs it links to, and none of its images, are in our copy.
