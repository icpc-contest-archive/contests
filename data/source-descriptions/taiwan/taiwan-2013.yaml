  description: |-
    Statement of problem 6693, 'Flow Game': on an N x N board (N below 10) with two pairs of coloured dots on boundary cells, connect each pair without crossing paths, minimising the number of painted cells, or print -1 if impossible. It has two figures, input and output sections and a sample with two boards. A PDF of 2 pages in English. On its second page a running head reads 'ACM-ICPC Live Archive: 6693 – Flow Game 2/2'. The copy does not name the contest or give a problem letter.
