    Statement of problem 6701, 'Pirate‘s Treasure': pieces of a treasure map are copied into boxes that need keys, each key opening one box; choose boxes so that every piece is obtained, printing the lexicographically smallest sorted list of boxes or impossible. It has a figure of an example, a technical specification, input and output sections and a sample with two test cases. A PDF of 2 pages in English. On its second page a running head reads 'ACM-ICPC Live Archive: 6701 – Pirate‘s Treasure 2/2'. The copy does not name the contest or give a problem letter.
