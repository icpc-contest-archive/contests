  language:
  - en
  problems: 1
  pages: 2
  description: |-
    Statement of problem 6696, 'A Generalized N-Queens Problem': place as many white stones as possible on an N x N grid with black stones so that no two white stones share a row, column or diagonal unless a black stone lies between them; the output is the maximum number. It has two illustrated examples, a technical specification, input and output sections and a sample with two grids. A PDF of 2 pages in English. On its second page a running head reads 'ACM-ICPC Live Archive: 6696 – A Generalized N-Queens Problem 2/2'. The copy does not name the contest or give a problem letter.
