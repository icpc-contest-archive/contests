  problems: 1
  pages: 1
  description: |-
    Statement of problem 6694, 'Toy Boxes': place n toys of given weights into three boxes so that the total weight carried over n days of playing with the toys in order is minimal. It has a worked example with four toys, a technical specification, input and output sections and a sample. A PDF of 1 page in English. It has no running head. The copy does not name the contest or give a problem letter.
