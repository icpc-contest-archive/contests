    Statement of problem 6692, 'Lucky Number': for each person in a queue with a ticket number, the Lucky Number is the distance to the farthest person behind with a larger number; the task is the largest Lucky Number in a queue of up to 1,000,000 people. It has a worked table for six people, a technical specification, input and output sections and a sample. A PDF of 1 page in English. It has no running head. The copy does not name the contest or give a problem letter.
