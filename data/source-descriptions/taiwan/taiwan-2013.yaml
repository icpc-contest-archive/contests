  problems: 1
  pages: 2
  description: |-
    Statement of problem 6695, 'Computing Inverses': compute the multiplicative inverse of a nonzero element, given as a binary string, in the finite field GF(2^m) defined by a given polynomial h(x). It introduces GF(2) and GF(2^m) with tables and examples, then gives input and output sections and a sample with two cases. A PDF of 2 pages in English. On its second page a running head reads 'ACM-ICPC Live Archive: 6695 – Computing Inverses 2/2'. The copy does not name the contest or give a problem letter.
