  title: International Collegiate Programming Contests in Taiwan
  language:
  - en
  - zh
  contest_date: '2019-11-24'
  description: |-
    Website of the 2019 ICPC Asia Taipei-Hsinchu Regional Contest, titled "International Collegiate Programming Contests in Taiwan", built on WordPress with technical support from National Chiao Tung University. Our copy holds 36 pages, mostly in English with some Chinese. It has two sections: the Online Contest (eligibility, ethics and rules, scoring and ranking, important dates, judge environment, contact, problem statement link, brief commentary) and the On-site Contest, held at National Taipei University of Business from 23 to 25 November 2019 with the contest itself on 24 November from 9:30 to 14:30. The on-site pages give team selection, accommodation, contest environment, rules, registration, schedule and travel information, and an Awards page with the gold, silver and bronze teams. News posts announce the public scoreboard, the problem set, test data and sample codes, the final standings, certificates, photos and an apology about problems E and F.

    The problem set, test data and photos are Google Drive links that lead outside our copy. The Final Result page holds only its heading, and the Final Scoreboard page holds a single image, which is not in our copy; no images of the site are.
