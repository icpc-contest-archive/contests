    Standings of the 2019 ICPC Asia Taipei-Hsinchu Site Programming Contest: 107 teams with rank, team name, institution, problems solved (ten at most; every team solved at least two), total time, and the columns Medal and Citation. The Medal column names 10 Gold Awards, 20 Silver Awards and 30 Bronze Awards and is empty for the other 47 teams; Citation holds place names from First Place on. First place goes to NCTU_TaNoShiI of National Yang Ming Chiao Tung University with ten problems. There is no per-problem detail.
