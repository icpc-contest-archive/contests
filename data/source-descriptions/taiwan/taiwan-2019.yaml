    Awards page of the contest website, in English: team names with their institutions for the Gold Award (top 10 teams), the Silver Award (teams 11 to 30) and the Bronze Award (teams 31 to 60), 60 teams in all. Two special awards follow: Best International Teams and Best Women's Team. The list covers only the awarded teams and gives no solved counts or times.
