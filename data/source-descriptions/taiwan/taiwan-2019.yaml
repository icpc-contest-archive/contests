  title: Team Selection – International Collegiate Programming Contests in Taiwan
  language:
  - en
  - zh
  description: |-
    Page of the contest website on how teams are chosen for the on-site contest. Twenty places are reserved for foreign universities, selected to maximise the number of universities and countries if more apply. Domestic teams are admitted in seven categories, written in Chinese: the best team per school in the online contest among teams that solved a problem (up to 40 teams), the top 40 of a national collegiate software design competition, 10 teams each from competitions of private and of technology colleges, replacements and invitations to reach 100 teams, and open entries. No team is named.
