  contest_date: '2022-11-20'
  description: |-
    Website of the 2022 regional contest held at Wu-Han Junior High School in Taoyuan, a WordPress site with bilingual Chinese and English text. Our copy holds 31 pages. The front page gives the event dates (19 to 21 November 2022), the place, the contest time (9:30 to 14:30 on 20 November, five hours) and the registration conditions, with up to 10 foreign teams accepted. Other pages cover team selection rules, contest environment (Linux, Ubuntu 20.04, with DOMjudge 7 or later), on-site rules, registration, accommodation, the schedule of the three days with shuttle bus times, a news page listing seven press reports as links to other sites, photos, and the problem statement page.

    The Final Scoreboard page is a single image of the scoreboard, which is in our copy. The problem statement page links two problem PDFs, a statement book and one with hints, and both are in our copy. The photos page only links to a Google Drive folder, which is not. Several registration posts on the site carry 2019 dates.
