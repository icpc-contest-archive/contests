    Editorial as a PDF of 4 pages, headed as a stage of The 1st Universal Cup (Stage 6: Taiwan, 4 and 5 March 2023), with notes on all 13 problems A to M. Most notes are a short paragraph or a few bullet points naming the method; Problem B has the longest write-up, with the chromatic polynomial derivation and a three-step algorithm. The notes are outlines, not full solutions or code, and no author is named.
- url: https://icpc2022.ntub.edu.tw/wp-content/uploads/2022/11/ICPC2022-mainhint.pdf
  read: '2026-11-23'
  rubric: 1
  copy: taiwan/taiwan-2022/problemset/20261122-live-cb57d70b/ICPC2022-mainhint.pdf
  title: 2022 ICPC Asia Taoyuan Site
  language:
  - en
  problems: 13
  pages: 50
  description: |-
    Problem set as a PDF of 50 pages in English, with the running head "2022 ICPC Asia Taoyuan Site" on every page and no cover page. It holds 13 problems A to M: Simplified Genome Translation, Multi-Ladders, Distance Calculator, Tangle: A DAG for storing transactions, Printing Stickers, AA Country and King Dreamoon, Repetitive Elements, Meeting Places, Cell Nuclei Detection, Traveling in Jade City, Group Guests, Programmable Virus and Connectivity Problem.

    Each problem gives its time limit and a memory limit of 1024 megabytes, then the problem description, input and output format, technical specification and one to four numbered samples of input and output. Every problem ends with a short Hint section that points to a way of solving it (for M, the Union-Find algorithm). No date is printed, and there are no test data or full solutions.
