  description: |-
    Final scoreboard as a single tall PNG image, 1898 by 5819 pixels: a screenshot of a scoreboard with 100 teams ranked 1 to 100. Each row has the rank, a flag, the team name with its institution, the number of problems solved and the total time, and then a cell for each of the 13 problems, labelled PA to PM. A solved cell shows the minute of the accepted solution and the number of tries; a red cell shows failed tries with no solution. A summary row at the bottom gives 551 solved in total and, per problem, counts of accepted and rejected runs and the time of the first solution; no team solved problem E or problem K. The first place is 8BQube of National Taiwan University with 11 problems and 1155; one other team also solved 11. No medals or awards are marked. It is an image, so the text cannot be searched.
