    Codeforces gym dashboard for the contest, marked Finished. It lists 13 problems A to M with name, limits (1.5, 3 or 4.5 seconds, 1024 MB) and a solved count for each problem except G, which has none. Contest materials are links to Statements (PDF), Hint (PDF) and Tutorial #2, all in English, plus a link to the contest website. A question and announcement section holds one announcement, dated 2024-11-19, saying that each input file for problem I was split into files of one test case each.

