  description: |-
    Problem set with hints as a PDF of 40 pages in English. It holds the same 13 problems A to M as the plain problem set, headed Problem PA to Problem PM, each with limits, description, input and output formats, technical specification and sample, and after each statement a section headed Hint. The hints vary in length: problem B has a single line (Euclidean algorithm), problem M a few steps on building a linked list, while the hints for problems C, K and L run to several hundred words and problem G describes a local-search method. For problem A the hint names the type (string and simulation) and two ways to check divisibility by 13. No program code was found. There is no cover page and the text does not name the contest.
