  description: |-
    Final standings of 102 teams with rank, team name, institution, problems solved, time, medal, a citation column and a site citation column. The first 72 teams carry a rank and an award: 10 Gold, 20 Silver, 32 Bronze and 10 High Honors. In the citation column ranks 1 to 51 have the place as a word (First Place, Second Place and so on) and ranks 52 to 72 have Honorable Mention. The remaining 30 teams have no rank and are marked Honorable Mention in the medal column. The site citation column holds first-to-solve marks for problems (eleven teams have one) and Best Female Team for one team. First place is RngBased of National Taiwan University with 11 solved and a time of 702.

    There is no per-problem detail, no attempt counts and no link to the problems.
