    Final scoreboard as a single tall JPEG image (3140 by 10407 pixels), headed 2023 ICPC Asia Taoyuan Regional Contest final standings and produced by DOMjudge. Each team row shows rank, team name, institution, score as problems solved and total time, and for each of the 13 problems A to M the time of the first accepted solution and the number of tries. The first team listed is RngBased of National Taiwan University. Near the bottom a row named "teams above are invalid" is followed by two teams of the University of Fire Fighting and Prevention, and a summary row for the 13 problems closes the table. The footer reads Last Update: Wed 25 Oct 2023 14:40:25 CST and carries a legend for cell colours and medals.

    The page is an image, so the text cannot be searched; our copy was read by OCR for this description and the number of teams was not counted.
