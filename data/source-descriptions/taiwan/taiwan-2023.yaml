  title: On-site Contest
  language:
  - en
  - zh
  contest_date: '2023-10-22'
  description: |-
    Website of the 2023 ICPC Asia Taoyuan regional, in English with Traditional Chinese alongside. The front page, headed On-site Contest, gives the event as 21 to 23 October 2023 at Taoyuan Arena, with the contest itself from 9:30 AM to 2:30 PM on 22 October 2023 (five hours), at least eight problems in English, and a limit of 10 foreign teams. Other pages cover team selection (how domestic teams qualify), accommodation, the contest environment (DOMjudge 8 on Ubuntu, with the compilers and editors available), on-site rules, registration with a fee of 4,000 New Taiwan Dollars, travel information, a three-day schedule, news links, a photos page, and a link to the contest guide.

    The results side has a Problem Statement page linking the ICPC problem set and its hint PDF plus a second pair of PDFs labelled ISSC; a Final Scoreboard page whose text explains that a test file for problem B had the wrong format, that 100 submissions received a different judging result after rejudging, that 24 teams were affected, and that two extra Bronze medals were added; and an Awards page with medal lists and first solves per problem.

    Our copy holds 13 distinct pages and four PDFs, every page except the front page also stored under a second address. The scoreboard itself is an image linked from the Final Scoreboard page; the Photos page and the contest guide are only links to an outside file store and are not part of our copy.
