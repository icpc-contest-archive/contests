  description: |-
    The "Final Scoreboard" page of the contest's WordPress website, whose menu leads to the on-site contest, team selection, accommodation, rules, registration, news, schedule, problem statement, awards and photos. Its text explains that after the contest a test file of problem B was found not to follow the input format; re-judging changed the result of 100 submissions, 60 of them to correct, affected 24 teams and led to a re-ranking, and two additional bronze medals were awarded, to the teams placed 56th and 60th. The footer shows logos of the ICPC, co-organizers, sponsors and the contest host.

    The scoreboard itself is a single image on another server, which is not in our copy; the page as we hold it has no team results.
