    Awards page from the contest website. Teams are listed as institution followed by team name under four headings: Gold Awards (10 teams), Silver Awards (20), Bronze Awards (32) and High Honors (10), so 72 teams in all, plus a Best Female Team entry. National Taiwan University's RngBased is the first gold team listed.

    Below the lists a table of first solves gives, for each of the 13 problems A to M, the team that solved it first and the minute it did so, from problem M at minute 3 to problems I and K at minute 253; problem G is marked Not solved. There are no ranks, scores or per-problem results for other teams.

    Teams that received no award are not listed.
