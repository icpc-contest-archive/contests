    Scoreboard of the regional contest, last updated Sun Dec 06 14:40:29 CST 2015: 70 teams with rank, team name followed by school in one cell, number solved and time, then problems A to L, each with attempts and a time, and attempts over problems solved in total. The first place is negainoido of The University of Tokyo with 9 solved and time 791. Many Taiwanese schools are written in Chinese.

    One more row, a team called System test ICPC2015, has nothing solved and also carries rank 70, like the last real team; nothing marks it as a test account except its name. A final row gives submissions, first-solve time and number of teams solved for each problem.
