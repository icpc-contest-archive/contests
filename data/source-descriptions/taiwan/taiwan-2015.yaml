  contest_date: '2015-12-06'
  problems: 12
  description: |-
    Website of the 2015 ACM-ICPC Asia Taipei Regional Contest, hosted by the Department of Computer Science and Information Engineering of National Taiwan Normal University and sponsored by IBM, in English; the page for Taiwanese teams is in Chinese. Our copy holds 63 pages. They cover a general page about ICPC, registration for foreign teams and for Taiwanese teams (with the qualification categories for Taiwanese teams), contest rules, the contest computer environment, the schedule, transportation, accommodation, visa information, contact details, and one page for each event of 5 and 6 December. The schedule puts the programming contest on 6 December, from 09:30 to 14:30.

    The site holds three results and problem documents: the final scoreboard (a page that shows it in a frame, plus the scoreboard page itself), the problem set as a PDF of 34 pages with 12 problems A to L, and a final report dated 9 December 2015. The report states 70 teams from 36 universities, 782 submissions of which 325 were correct, and how many teams solved each number of problems; it says the teams with 7 or more problems solved received certificates for first to tenth place.
