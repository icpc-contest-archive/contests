  contest_date: '2014-11-22'
  description: |-
    Website of the 2014 ACM-ICPC Asia Taichung Regional Contest, hosted by Providence University and sponsored by IBM, mostly in English with a registration page for Taiwanese teams in Chinese. Our copy holds 18 pages: the home page, a general page about ICPC, registration for foreign teams and for Taiwanese teams, contest rules, the schedule, the contest computer environment, the staff list, the contest team list, the final scoreboard, a standings PDF, photo and video pages, transportation, accommodation, contact and sponsors.

    The schedule puts the practice contest on 21 November 2014 and the programming contest on 22 November, from 09:30 to 14:30, in a sports hall on the campus in Taichung. The menu also links a problem PDF and an English contest report PDF; neither is in our copy.
