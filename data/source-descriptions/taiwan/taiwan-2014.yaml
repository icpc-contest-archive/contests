  description: |-
    Statement of problem 7003, "A Balance Game on Trees", as a PDF of 2 pages, in English. It sets out a k-balance game on a tree in which vertices are set black so that as many white vertices as possible have exactly k black neighbours; Figure 4 shows a tree of 5 vertices. It has a Technical Specification list, Input and Output sections, and a sample input with its sample output. The running head "ACM-ICPC Live Archive: 7003 – A Balance Game on Trees" with page numbers appears at the top of page 2. The copy prints no contest name, year or problem letter.
