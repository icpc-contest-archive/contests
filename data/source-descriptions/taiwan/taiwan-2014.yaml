    Final scoreboard produced by PC^2: 70 teams with rank, team name, school, number solved and time, then one column for each of the twelve problems A to L giving attempts and a time, and attempts over problems solved in total. The top of the table is a team from Shanghai Jiao Tong University with 10 solved and time 1270.

    Below the teams are summary rows: a row with a colour name for each problem, and a row of submissions, first-solve time and number of teams that solved it per problem. The Name column shows account names such as team19 and team43, not the teams' own names.
