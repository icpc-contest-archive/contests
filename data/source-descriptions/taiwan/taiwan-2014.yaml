  description: |-
    Statement of problem 7011, "Security System", as a PDF of 2 pages, in English. Given a nonnegative integer and a sequence of integers, a nondecreasing real sequence whose consecutive differences are bounded by that integer is sought with the smallest squared distance from the given sequence; the output is that distance written as three integers a, b, c for the mixed number a + b/c. It has a Technical Specification list, Input and Output sections, and a sample input with its sample output. The running head "ACM-ICPC Live Archive: 7011 – Security System" with page numbers appears at the top of page 2. The copy prints no contest name, year or problem letter.
