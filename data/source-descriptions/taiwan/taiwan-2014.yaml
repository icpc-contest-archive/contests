  description: |-
    Statement of problem 7002, "Queen on Horse", as a PDF of 3 pages, in English. It sets out a chess piece, the QHorse, that combines the attacks of the queen and the knight, asking for the maximum number of non-attacking QHorses on an n by n board (n at most 19) with up to two pre-placed, and the number of ways to place them; Figures 2 and 3 are in the statement. It has a Technical Specification list, Input and Output sections, and a sample input with its sample output. The running head "ACM-ICPC Live Archive: 7002 – Queen on Horse" with page numbers appears at the top of page 2 and the following page. The copy prints no contest name, year or problem letter.
