  description: |-
    Website of the 2008 ACM ICPC Asia Regional contest, Taipei site, organised by National Taiwan University with the university's Computer and Information Networking Center as executive and a list of sponsors. The pages are in English with Chinese headings and some Chinese text. The home page, headed "ACM ICPC國際大學生程式設計競賽亞洲區台北站" (ACM ICPC International Collegiate Programming Contest, Asia Regional, Taipei Site), gives the contest as November 7 - November 9, 2008, with registration deadlines in August and September 2008, and links to the problems and the results.

    Our copy holds 17 pages: the home page, about, registration (fee and instructions), contest info (general information, schedule of events, contest environment, accommodation, PC2 user's guide, campus map), rules (with three sub-pages), contact and transportation, and a photo gallery page that needs Flash. The schedule puts the contest itself on Saturday, November 8, from 09:30 to 14:30. The results page is a frameset shell titled "The 33rd Annual ACM International Collegiate Programming Contest Asia Regional-Taipei Site", and the scoreboard frames it points to are not in our copy, and the linked problem set PDF is not in our copy either.
