  pages: 3
  description: |-
    Problem statement of 4263, Early-Morning Pickup, as a three-page PDF in English with the line "Asia - Taipei - 2008/2009" under the title. A company's representatives each pick up at most one computer on the way to the office, and the task is to compute the minimum average time at which all representatives arrive at the office, given a road network of at most 512 nodes with travel times in minutes. It has a Technical Specification and the input and output format. It ends with the line "Taipei 2008-2009".
