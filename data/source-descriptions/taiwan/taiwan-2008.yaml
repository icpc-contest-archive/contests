  language:
  - en
  problems: 1
  pages: 2
  description: |-
    Problem statement of 4268, Bonus Adjustment, as a two-page PDF in English with the line "Asia - Taipei - 2008/2009" under the title. A table of bonuses with at most two decimals and integer row and column sums must be adjusted to integers that keep all row and column sums and differ from the true values by less than one, or print "no" if impossible. The statement is told as a story about a phone call; it has a Technical Specification (up to 50 regions and functions), the input and output format and a sample of two tables. It ends with the line "Taipei 2008-2009".
