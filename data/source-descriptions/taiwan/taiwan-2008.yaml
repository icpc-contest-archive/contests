  pages: 3
  description: |-
    Problem statement of 4259, Dangerous Tunnels, as a three-page PDF in English with the line "Asia - Taipei - 2008/2009" under the title. In a network of tunnels between two tribes with rest stations at different altitudes, the task is to select k paths from Kulolo to Gulolo that share no rest station, with non-increasing altitudes, so that the maximum dangerous degree is minimal, printing that degree or "no solution". It includes Figure 1, the input and output format and a sample. It ends with the line "Taipei 2008-2009".
