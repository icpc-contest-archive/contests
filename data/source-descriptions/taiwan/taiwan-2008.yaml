  description: |-
    Problem statement of 4266, Space Elevator, as a two-page PDF in English with the line "Asia - Taipei - 2008/2009" under the title. A crew travels along a line of stops on a space elevator ribbon starting at the origin, and the task is to choose stops and a route that maximise the profits of the served stops minus the latency of the route. The statement opens with a long background passage on space elevators and carbon nanotubes. It ends with the line "Taipei 2008-2009".
