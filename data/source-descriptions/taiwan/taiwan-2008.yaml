  description: |-
    Problem statement of 4265, Lost Treasure, as a three-page PDF in English with the line "Asia - Taipei - 2008/2009" under the title. A treasure made of up to five rectangles must be moved on a ship map among up to 50 rectangular obstacles to a destination, moving only up, down, left or right at costs of 10, 2, 5 and 5 dollars per meter. It includes Figure 1 (the map) and Figure 2 (a solution costing 95), a Technical Specification and the input and output format. It ends with the line "Taipei 2008-2009".
