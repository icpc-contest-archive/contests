  description: |-
    Problem statement of 4260, Fortune Card Game, as a three-page PDF in English with the line "Asia - Taipei - 2008/2009" under the title. Cards carry an address, a symbol from A to E and a next fortune number, and given a spell the task is to output the maximum score that can be won by completing it. It includes Figure 1 of a sample card, a Technical Specification giving limits of 10 on test cases, 800 on cards and 150 on spell length, and the input and output format. It ends with the line "Taipei 2008-2009".
