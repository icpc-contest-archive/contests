  pages: 1
  description: |-
    Problem statement of 4261, Trip Planning, as a one-page PDF in English with the line "Asia - Taipei - 2008/2009" under the title. For n hotels with given distances between consecutive ones and a daily penalty of (x - 100) squared, the task is to print the minimum total penalty and the indexes of the hotels to stop at, preferring fewer stops and then the lexicographically smallest list. It has the input and output format and a sample of two data sets with penalties 2271 and 4617. It ends with the line "Taipei 2008-2009".
