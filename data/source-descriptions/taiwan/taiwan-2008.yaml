  description: |-
    Problem statement of 4264, Message, as a three-page PDF in English with the line "Asia - Taipei - 2008/2009" under the title. Noisy 10x10 black and white images, each rotated 0, 90, 180 or 270 degrees and with at most 20 percent noise, must be matched to the letters of an alphabet of up to 52 symbols, and the task is to print the decoded letters on one line. It has a Technical Specification and the input and output format. It ends with the line "Taipei 2008-2009".
