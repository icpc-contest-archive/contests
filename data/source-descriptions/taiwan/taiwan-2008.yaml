  pages: 2
  description: |-
    Problem statement of 4267, Finding The Heaviest Path, as a two-page PDF in English with the line "Asia - Taipei - 2008/2009" under the title. In a rooted tree with a positive weight on each node (fewer than 10000 nodes), the task is to print the total weight of the heaviest path from the root to a leaf, defined by subtree weights with ties broken by node number, and then the node numbers on the path, ten per line. It has a Technical Specification and the input and output format. It ends with the line "Taipei 2008-2009".
