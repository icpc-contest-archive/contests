  description: |-
    Problem statement of 4262, Road Networks, as a two-page PDF in English with the line "Asia - Taipei - 2008/2009" under the title. For a road network of N cities (up to 1000) and M roads (up to 2000), some bidirectional and some one-way, the task is to count the regions, defined as maximal sets of mutually reachable cities. It has a Technical Specification, the input and output format and a sample. It ends with the line "Taipei 2008-2009".
