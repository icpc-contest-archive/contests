    Problem set as a PDF of 34 pages, running header '2021 ICPC Asia Taipei Regional', with 13 problems A to M. It has no cover page: Problem A, Ice Cream, starts on the first page. Each problem gives its name, time limit and memory limit, a description, input and output format, a technical specification and sample input and output, in English. Four pages are marked as almost blank. No test data, solutions or hints.
