- url: https://icpc2021.ntub.edu.tw/
  read: '2026-11-16'
  rubric: 1
  copy: taiwan/taiwan-2021/website/2026-09-05-live-9febcf1e
  title: ICPC 2021
  language:
  - en
  - zh
  contest_date: '2021-11-28'
  description: |-
    Website of the 2021 regional contest at National Taipei University of Business, a WordPress site with bilingual Chinese and English text. Our copy holds 45 pages. The front page gives the event dates (27 to 29 November 2021), the place, the contest time (9:30 to 14:30 on 28 November, five hours) and the number of problems (at least eight). Other pages cover team selection, accommodation, contest environment (Linux with DOMjudge 7, compilers and editors), on-site rules, registration, the day-by-day schedule, travel, COVID-19 measures, photos, and the problem statement and problem set pages.

    Results on the site: the Final Scoreboard page is a single tall picture of a scoreboard with 103 teams and problems A to M, showing for each team rank, team name, institution, score (problems solved and total time), and the time and number of tries for each problem, with a summary row at the bottom. An Awards page lists the 60 medal-winning teams, and two problem PDFs (a statement book and one with hints) are included. The problem set, test data and photos pages only link to Google Drive folders, and the public scoreboard page links to an outside DOMjudge server; none of these is in our copy. Some posts and page text are left over from earlier editions: the final standings and apology posts name the 2019 Taipei-Hsinchu regional, and the team selection page names the 2020 contest.
