  description: |-
    Final standings of 103 teams from 28 institutions, with rank, team name, institution, number of problems solved, total time, medal, citation and site citation. The first place, ckiseki of National Taiwan University, solved 11 problems with a time of 1393; two teams solved 11 and none more. Ten teams carry Gold, 20 Silver and 30 Bronze; the other 43 have no medal. The first 51 teams have a place name (First Place and so on) in the citation column and the other 52 have Honorable Mention. One team carries a Best Female Team mark in the site citation column. No per-problem results.
