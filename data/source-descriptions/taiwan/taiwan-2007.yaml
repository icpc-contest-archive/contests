  problems: 1
  pages: 2
  description: |-
    Statement of problem 4039, "Sightseeing", as a PDF of 2 pages. For a connected weighted graph of historic sites and streets, the program prints the weight of a minimum closed walk that traverses every edge at least once. It has a technical specification, input and output sections and a sample of two graphs. The head line reads Asia - Taipei - 2007/2008; no letter label is printed.
