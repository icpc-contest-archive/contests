  copy: taiwan/taiwan-2007/judge-livearchive/20150309-wayback-afc9a649/4035.pdf
  title: 4035 - Undetectable Tour
  language:
  - en
  problems: 1
  pages: 3
  description: |-
    Statement of problem 4035, "Undetectable Tour", as a PDF of 3 pages. For grids with motion detectors whose detection distance (L1 metric) is drawn from a given probability distribution, the program computes the probability that a path from one corner to the opposite corner stays undetected. It has input and output sections and a sample of two test cases. The head line reads Asia - Taipei - 2007/2008; no letter label is printed.
