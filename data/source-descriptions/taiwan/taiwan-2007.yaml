  problems: 1
  pages: 1
  description: |-
    Statement of problem 4041, "Eventown Problem", as a single-page PDF. Given friendship indices between N citizens, the program splits them into two clubs to maximise a total happiness sum and prints the maximum value. It has input and output sections and a sample of two cases. The head line reads Asia - Taipei - 2007/2008; no letter label is printed.
