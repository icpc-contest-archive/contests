  description: |-
    Standings page of the 2007 ACM Asia Programming Contest - Taipei, with the columns Rank, Team, Citation, #Solved and Time. 40 teams carry a rank (1 to 14, with ties) and a number solved and time; the first place is National Taiwan University with 7 solved in time 1079. A further 12 teams are listed at the end without rank, solved or time and marked Honorable Mention in the Citation column, which repeats the rank for the ranked teams, so the page lists 52 teams. Teams are given as institution and team name. No per-problem detail.
