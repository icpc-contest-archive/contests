  title: 4034 - Game of Life
  language:
  - en
  problems: 1
  pages: 2
  description: |-
    Statement of problem 4034, "Game of Life", as a PDF of 2 pages. Black and white stones on an m x m board are updated by a neighbourhood rule for t iterations, and the program prints the numbers of black and white stones at the end. It has a technical specification, input and output sections, worked final boards for the two sample cases, and a sample. The head line reads Asia - Taipei - 2007/2008; no letter label is printed.
- url: https://icpcarchive.ecs.baylor.edu/external/40/4035.pdf
  read: '2026-11-23'
