  language:
  - en
  problems: 1
  pages: 2
  description: |-
    Statement of problem 4040, "Maze For Robot", as a PDF of 2 pages. A maze of checkpoints with three doors each is modelled as a finite state machine, and the program counts the strings of a given length accepted by it. It refers to a Figure 1, has a technical specification, input and output sections and a sample of three cases. The head line reads Asia - Taipei - 2007/2008; no letter label is printed.
