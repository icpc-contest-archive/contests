  copy: taiwan/taiwan-2007/judge-livearchive/20150309-wayback-d1e4c0a6/4037.pdf
  title: 4037 - Racing Route
  language:
  - en
  problems: 1
  pages: 3
  description: |-
    Statement of problem 4037, "Racing Route", as a PDF of 3 pages. Given horizontal and vertical streets and a limit T on turns, the program finds the length of the longest closed race route making at most T turns, or 0. It has two figures, a technical specification, input and output sections and a sample with one case. The head line reads Asia - Taipei - 2007/2008; no letter label is printed.
- url: https://icpcarchive.ecs.baylor.edu/external/40/4038.pdf
  read: '2026-11-23'
