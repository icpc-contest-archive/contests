  copy: taiwan/taiwan-2007/judge-livearchive/20150309-wayback-ad5b8da7/4038.pdf
  title: 4038 - The growth of a tree
  language:
  - en
  problems: 1
  pages: 3
  description: |-
    Statement of problem 4038, "The growth of a tree", as a PDF of 3 pages. A tree on a grid has trunks, branches and leaves in eight possible directions; when a new leaf must grow into an occupied spot, the program finds the cheapest set of joint rotations that makes room. It has notes on valid rotations, input and output sections and a sample of two cases. The head line reads Asia - Taipei - 2007/2008; no letter label is printed.
