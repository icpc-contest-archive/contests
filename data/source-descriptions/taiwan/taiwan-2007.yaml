  title: 4036 - Uggla Mission
  language:
  - en
  problems: 1
  pages: 2
  description: |-
    Statement of problem 4036, "Uggla Mission", as a PDF of 2 pages. Given points in a 1000 x 1000 area, a robot can only move straight, and the program prints the maximum number of points it can visit and the number of distinct routes that achieve it. It has a technical specification, input and output sections and a sample with one case. The head line reads Asia - Taipei - 2007/2008; no letter label is printed.
