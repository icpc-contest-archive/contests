  title: 4033 - Miss Kitty and Her Little Ice Cream Shop
  language:
  - en
  problems: 1
  pages: 2
  description: |-
    Statement of problem 4033, "Miss Kitty and Her Little Ice Cream Shop", as a PDF of 2 pages. Daily takings follow quadratic formulas that depend on whether the day is sunny, cloudy or rainy, and the weather follows a modular formula; the program finds the least number of days until the total reaches m. It has a technical specification, input and output sections and a sample of two cases. The head line reads Asia - Taipei - 2007/2008; no letter label is printed.
