  copy: taiwan/taiwan-2007/website/2026-09-05-wayback-5085974a
  title: ACM International Collegiate Programming Contest Asia Regional - Taipei Site, Nov. 24 ~ Nov. 25, 2007
  language:
  - en
  problems: 9
  description: |-
    Website of the Taipei site of the ACM ICPC Asia Regional contest, in English. The home page carries the heading "ACM International Collegiate Programming Contest Asia Regional - Taipei Site, Nov. 24 ~ Nov. 25, 2007" and gives the registration deadline as Oct. 31, 2007. Our copy holds 86 pages. The pages of the 2007 edition in it are the home page, a page with links to the ICPC homepage, fact sheet and policies, a rules page (a team must have exactly 3 contestants), a campus map page, a pictures page that reads "To be posted as the contest/event unfolds", and a problem set page listing nine problem names with no links. The menu also names Registration, Contest Info and Final Results, but those pages are not in our copy.

    The nine problem PDFs (two or three pages each) and the 21-page "2005 ACM Regional Programming Contest, Asia Taipei" problem set, also in our copy, are the problems of the 2005 contest dated 2005/10/30, not of 2007. The site also holds pages of earlier editions: 1999 and 2000 folders, final reports and final standings of 1999, 2000 and 2001, a schedule, a registration page and problem lists, test data files, an 8-page PC2 team guide PDF and 55 photographs from an activity page.
