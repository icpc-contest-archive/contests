  title: 4042 - Expression Evaluation
  language:
  - en
  problems: 1
  pages: 2
  description: |-
    Statement of problem 4042, "Expression Evaluation", as a PDF of 2 pages. Postfix expressions over ordered pairs use two operators X and Y; each operand has a set of candidate pairs and each operator may be X or Y, and the program prints the minimum product over all choices. It has a technical specification, input and output sections and a sample of two cases. The head line reads Asia - Taipei - 2007/2008; no letter label is printed.
