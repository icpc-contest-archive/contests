  title: ACM International Collegiate Programming Contest Asia Regional - Taipei Site Nov. 6 ~ Nov. 7, 2004
  language:
  - en
  - zh
  description: |-
    Website of the ACM ICPC Asia Regional contest, Taipei Site, whose address serves several editions. Its root is the 2005 edition ("Oct. 29 ~ Oct. 31, 2005") with that year's problem set PDF of 21 pages and problems 1 to 9 as separate PDFs; the site also holds pages of the 1999, 2000 and 2001 contests. Our copy holds 87 pages among 149 files.

    The 2004 edition is a separate area headed "Asia Regional - Taipei Site, Nov. 6 ~ Nov. 7, 2004", with six pages in our copy: a front page announcing a registration deadline of Oct. 20, 2004, an ACM page with links to the ICPC homepage and fact sheets, a PC2 User's Guide page whose linked guide files are not in our copy, a rules page stating that a team has exactly three contestants (its sub-pages are not in our copy), a pictures page with only the header and menu, and a Problem Solving Statistics page. The images of these pages are not in our copy, nor are the Registration, Contest Info and Final Results pages.

    The statistics page is a table of 55 teams, named by team only, against problems A to J. Each cell gives attempts and solving time, with "--" instead of a time when unsolved; the last column is total attempts and number solved, and a Summary row closes the table.
- url: http://icpc.baylor.edu/icpc/regionals/ViewRegionalStandings.asp?ContestID=693
  read: '2026-11-16'
  rubric: 1
  copy: taiwan/taiwan-2004/standings/2026-09-01-wayback-8c69b1cb/page.html
  title: 'View Standings: The 2004 ACM Asia Programming Contest - Taipei sponsored by IBM'
  language:
  - en
  contest_date: '2004-11-07'
  description: |-
    Standings page of the ICPC regional with three tables, each headed with the date 11/7/2004: the Final Round with 55 teams, the Nationwide Preliminaries of the Taipei site with 164 teams, and the Foreign Teams preliminary with 17 teams, some of which also appear in the Final Round. Each row gives institution and team name and a citation. Only the ranked rows carry the number solved and the time: 24 teams in the Final Round (First Place to Twelfth Place, with ties), 16 in the nationwide table and 10 in the foreign table. The remaining teams are listed unranked as Honorable Mention. First place in the Final Round went to Shanghai Jiaotong University with 8 problems solved. There is no per-problem detail.
