  title: 'View Standings: The 2004 ACM Asia Programming Contest - Taipei sponsored by IBM'
  language:
  - en
  contest_date: '2004-11-07'
  description: |-
    Standings page of the ICPC regional with three tables, each headed with the date 11/7/2004: the Final Round with 55 teams, the Nationwide Preliminaries of the Taipei site with 164 teams, and the Foreign Teams preliminary with 17 teams, some of which also appear in the Final Round. Each row gives institution and team name and a citation. Only the ranked rows carry the number solved and the time: 24 teams in the Final Round (First Place to Twelfth Place, with ties), 16 in the nationwide table and 10 in the foreign table. The remaining teams are listed unranked as Honorable Mention. First place in the Final Round went to Shanghai Jiaotong University with 8 problems solved. There is no per-problem detail.
