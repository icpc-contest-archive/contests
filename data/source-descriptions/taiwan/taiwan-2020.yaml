  description: |-
    Problem set as a PDF of 36 pages, each page headed "2020 ICPC Asia Taipei-Hsinchu Regional", with thirteen problems A to M in English. Every problem has a time limit and a memory limit, a problem description, input and output formats, a technical specification and one to three sample cases with their outputs. Five pages are printed as "Almost blank page" so that each problem starts on a fresh page. The problems are named Right-Coupled Numbers, Make Numbers, Pyramid, Quality Monitoring, A Color Game, Cable Protection, Graph Cards, Optimization for UltraNet, Critical Structures, Puzzle Game, Number with Bachelors, Save lives or money and Keystroke. There are no hints, solutions or test data.
