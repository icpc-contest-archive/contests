  title: ICPC2020
  language:
  - en
  - zh
  contest_date: '2020-11-08'
  description: |-
    Website of the 2020 ICPC Asia Taipei-Hsinchu Regional Contest, hosted by the National Taipei University of Business, in English with Chinese alongside. Our copy holds 42 pages, some of them reached under two addresses. They give the dates (7 to 9 November 2020), a three-day schedule with the contest running from 9:30 to 14:30 on 8 November, registration and fee, the rules for choosing domestic teams (foreign teams were not admitted because of COVID-19), accommodation, travel, COVID-19 precautions, the contest environment and the on-site rules (DOMjudge 7, five hours, eight to thirteen problems).

    Results and problems are handled by short pages: the final scoreboard page holds one screenshot of the DOMjudge scoreboard, the awards page lists the 60 gold, silver and bronze teams with the best female team and a ranking of 12 universities, the problem statement page points to the Codeforces gym, and the problem set, photos and test data pages only link to Google Drive folders. The public scoreboard page gives only a web address.

    The announcement posts also include items from the 2019 edition: a post pointing to its final standings, an apology about two of its problems, and posts about the online contest (TOPC) and registration. Links to Drive and other outside servers lead outside our copy.
