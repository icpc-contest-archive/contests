  description: |-
    Team Selection page of the contest website. It states that because of COVID-19 only domestic teams may take part, then lists in Chinese seven categories by which domestic teams are admitted: the best team per school from the ICPC Taiwan Online Programming Contest among teams that solved a problem (at most 40 teams), the top 40 of a national collegiate software design contest, 10 teams each from a private-university and a technology-university programming contest (at most two per school), replacements from the same school, invited online-contest teams if fewer than 100 teams are in, and open registration with priority for universities not covered above. It lists no teams.
