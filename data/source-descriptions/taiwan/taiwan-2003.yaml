    Standings of the Kaohsiung site as published on the ICPC regional pages: 63 teams with rank, team (institution and team name), citation, number solved and total time. Ranks run from 1 to 52, then 53 for seven teams and 54 for four teams; the citation column spells the place out (First Place, Second Place, Third Place and so on down to Fifty-fourth Place), and several teams carry the same citation, for example three teams with Third Place. The first two teams each solved seven problems, the top team with a time of 811; the eleven teams with zero solved have no time. There is no per-problem detail.
