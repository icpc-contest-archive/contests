  title: Professor D. J. Guan 官大智 教授
  title_en: Professor D. J. Guan
  language:
  - en
  - zh
  description: |-
    Personal website of a professor in the Department of Computer Science at National Sun Yat-sen University, Kaohsiung, in English and Chinese. Its front page lists research interests, publications, projects, courses and lecture notes, and under Links it names the 2002, 2003 and 2006 ACM Programming Contest pages. Our copy holds 150 files, among them 36 PDFs, mostly lecture notes, and 47 campus-map photographs.

    The contest part for this edition is a one-screen page headed "The 2003 ACM Asia Programming Contest, Kaohsiung Site, Sponsored by IBM" with three links: View Standings, View Problems and Sample Test Data and Answers (for reference only). The standings page is a standings entry form with 63 teams; the problem set is a PDF of 32 pages with nine problems A to I, held in our copy under the alias address AsiaKH; and the test data is a text file of 9,451 lines holding input and output files pa.in and pa.out through pi.in and pi.out. The page's Web Page link leads to another server and is not in our copy.

    The same site also holds pages of the 2002 edition (schedule, accommodation, campus map, standings) and the 2006 edition (standings entry form, problems PDF, test data), so it is not specific to 2003.
