  description: |-
    Final scoreboard of the contest as shown by DOMjudge: 110 teams ranked with team name, institution, number solved and total time, and for each of the 14 problems A to N the time of the accepting submission and the number of tries. Medal icons mark the top places, and a summary row at the bottom gives figures per problem. First place is Strong Zero (National University of Singapore) with 13 solved. The page carries a link to a live stream of the contest and a cell colour legend, and reads as last updated on 16 November 2025.

    The page also holds the team detail dialogs that DOMjudge builds for each team. Our copy keeps the style sheets and scripts beside the page.
