  contest_date: '2025-11-16'
  description: |-
    Website of the 2025 ICPC Asia Taichung Regional Contest, a WordPress site in English with Chinese alongside on the front page. The front page gives the event dates (15 to 17 November 2025), the venue (the gymnasium of Asia University), the contest time (9:30 to 14:30 on 16 November, five hours), the rule that at least eight problems with English statements will be set, and the limit of ten foreign teams. Further pages hold the on-site rules, the day-by-day schedule with registration, practice session, contest, hints session and award ceremony, registration fees, team selection rules for foreign and domestic teams, the contest environment (Ubuntu, DOMjudge, compilers and editors), travel information, accommodation, and an awards page.

    The awards page lists 10 gold, 20 silver and 30 bronze medal teams with their institutions, and a best female team. The pages for results, problem set and photos only point elsewhere (to the ICPC Global website, to Codeforces and to Google Drive); the news page says only that it is to be updated. Our copy holds 25 pages, of which 12 are the same pages again under alternative addresses.
