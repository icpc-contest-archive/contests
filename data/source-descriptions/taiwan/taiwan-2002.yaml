  description: |-
    Small website of the 2002 ACM Asia Programming Contest, Kaohsiung Site, sponsored by IBM, in English and Chinese. The front page is only a heading with links to the standings and to the problems PDF.

    Our copy holds 35 files: four distinct pages and 28 images. The pages are the front page (saved under three addresses), the standings page (two addresses; 60 teams with citation, number solved and time), a schedule page in Chinese and a campus introduction page made of images, of which our copy holds 25 of the 35 pictures it refers to. The schedule gives registration, opening ceremony, rules briefing and practice on Friday 8 November, and the contest from 09:00 to 14:00 on Saturday 9 November, followed by a meeting of coaches and the problem committee, the award ceremony and a dinner and celebration. The problems PDF link leads to a file that is not part of this crawl.
