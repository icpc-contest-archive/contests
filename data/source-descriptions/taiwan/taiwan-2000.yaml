  description: |-
    Contest information page from the ICPC (Baylor) past-regionals pages for the 2000 ACM Asia Programming Contest, Taipei, sponsored by IBM and hosted by National Taiwan Normal University, Taipei. It gives the date as 18 - 19 November 2000, a short note that winners of regional contests advanced to the World Finals in Vancouver, and links to the regional contest home page, the team roster, the standings and the problems. Our copy holds four pages: this page, the roster, the standings and the problem set PDF; the link to the regional contest's own home page leads to another server and is not part of it.

    The roster page lists 48 teams of the Taipei site, each with institution, team name, coach and team members. The standings page is a table of 48 teams with rank and citation, from First Place to Honorable Mention. The problem set is a PDF of 21 pages with eight problems A to H.
