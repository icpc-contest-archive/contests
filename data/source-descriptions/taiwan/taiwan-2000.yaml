  description: |-
    Problem set as a PDF of 21 pages, an Acrobat capture of a web page made on 27 January 2001. Page 1 is an index headed Problem Sets that lists Problem A Lattice Point, B Coin Exchange, C The Minimum Number of Rooks, D Mars Colony Construction, E Puzzle for Friends and Enemies, F A Version of Nim, G Tri-Colored Intersections and H Deadlock Detection. Pages 2 to 21 hold the eight statements in English, each with an input file name, input and output format, and a sample input and output; each page carries a banner image naming the ACM Programming Contest, NTNU and IBM as sponsor. No test data or solutions.

    The text layer of pages 2 to 21 is garbled by the font encoding, so those pages have to be read as images.
