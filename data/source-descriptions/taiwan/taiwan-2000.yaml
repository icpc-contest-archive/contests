  language:
  - en
  teams: 27
  description: |-
    Final standings as an HTML page: 27 teams with rank, team name, school name, number of problems solved and penalty. Several teams share a rank; ranks run from 1 to 10. First place is Doodoong of Seoul National University with 5 problems solved and penalty 735, followed by Gold Medal of National Taiwan University with 4. 24 of the 27 teams are from universities in Taiwan, two are from The Chinese University of Hong Kong and one from Seoul National University. There are no per-problem columns, and the page does not name the contest.
