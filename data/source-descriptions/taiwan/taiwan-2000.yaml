  - en
  contest_date: '2000-11-18'
  description: |-
    Page of the ICPC past-regionals section for the 2000 ACM Asia Programming Contest, Taipei, sponsored by IBM and hosted by National Taiwan Normal University, Taipei. It gives the dates 18 to 19 November 2000, a sentence that winners of regional contests advanced to the World Finals in Vancouver, and links to the regional home page, the team roster, the standings and the problems.

    Our copy holds 4 pages: this page, the team roster (48 teams listed by institution with team name, coach and members, as of 5/17/2002), the standings (a ranking with citations, 48 teams) and the problems PDF (21 pages, problems A to H). The link to the regional home page leads to another server and is not in our copy.
