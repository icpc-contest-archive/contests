  description: |-
    Website of the 2009 ACM ICPC Asia Regional contest, Hsinchu site, hosted by National Chiao Tung University, in English under a Chinese title. The home and news pages give the contest as scheduled to run from October 30 through November 1, 2009, with the host's address and the contest director's contact details.

    Our copy holds 8 pages: home, news, about the ICPC, the schedule of events (with contest environment and PC2 guide notes), contest information (accommodation and registration fees of NT$3,000 per team and US$120 per foreign team), contact, the rules (team composition, conduct and scoring), and a Record page that only reads "Coming Soon......". The schedule table lists the actual contest on 10/31 Saturday, but its times sit one row off from their events in places (for example Breakfast at 17:30-19:30), so the contest hours cannot be read from it reliably. The menu names a Snaps item that has no page in our copy, and the images and the Flash banner are missing. There are no results or problems in our copy.
