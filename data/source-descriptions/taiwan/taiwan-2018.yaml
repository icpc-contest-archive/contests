  contest_date: '2018-11-10'
  description: |-
    Website of the 2018 ICPC Asia Taipei Regional Contest, organised by National Taiwan University with its Computer and Information Networking Center as executive, in English with some Chinese. Our copy holds 24 pages, among them four PDFs. They cover general information, the schedule (9 to 11 November 2018, with the actual contest on Saturday 10 November), registration, rules, the contest environment, PC2 and VPN setup, hotels and a campus map. The site also holds a scoreboard for the Taiwan Online Programming Contest of 15 September 2018, a scoreboard for the regional contest, and two team lists: 88 teams for the online contest and 116 for the regional contest.

    The pages Problem Set, Final Standings, Final Report, Photos, Transportation and Taipei show only "TBA" in our copy. One PDF (a reception notification) is cut short in our copy and cannot be opened.
