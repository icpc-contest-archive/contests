    Scoreboard produced by PC^2 (version 9.5.3) for the regional contest of 10 November 2018, last updated at 15:31 that day: 116 teams and eleven problems A to K, each problem column labelled with a colour name. Each team row gives rank, team number and name, problems solved, total time, and for every problem a cell of the form attempts/time ("--" when unsolved), plus a Total att/solv column. A bottom row "Submitted/1st Yes/Total Yes" gives figures per problem. There is no institution column. First place goes to waynedisonitau123 with nine problems solved.
