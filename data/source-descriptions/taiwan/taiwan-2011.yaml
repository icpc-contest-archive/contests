  description: |-
    Scoreboard summary produced by PC^2 (CSUS, version 9.1.6): 72 teams, nine problems A to I. Each row gives rank, team name (an anonymous number such as team38), problems solved, penalty time, attempts and solve time for each problem, and total attempts over solved. A last row gives submitted runs, first-yes time and total yes per problem. Three teams at rank 70 have no problem solved. The page is stamped as last updated on Sat Nov 26 15:28:48 CST 2011 and carries no university names.
