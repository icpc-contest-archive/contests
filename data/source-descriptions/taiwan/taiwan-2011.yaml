    Final standings of the regional contest as a PDF of 2 pages: 72 teams with award, rank, team number, problems solved, penalty time, team name and university. Awards run from 1st Place to 10th Place, then Honorable Mention for ranks 20 to 58; the remaining teams are listed with a rank but no award. Three teams share rank 70 with no problem solved. No per-problem detail. First place is a National Taiwan University team with 9 problems solved in 738 minutes.
