  pages: 22
  description: |-
    Problem set as a PDF of 22 pages, in English. The cover page gives the title, the date 26 November 2011, and general notes on input files, output and time limits, with a table of the nine problems and their input file names. Problems A to I follow: Hidden Terminal Problem, City Travel, Probability Computation, Register Allocation, Finding Bottleneck Shorstet Paths, Robot Arm Planning, Finding Feasible Paths, KGold and Airport. Each has a statement with input and output format and a sample. No test data or solutions.
