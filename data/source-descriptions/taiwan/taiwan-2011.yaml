  title: The 2011 ACM-ICPC Asia Hsinchu Regional Contest
  language:
  - en
  - zh
  contest_date: '2011-11-26'
  description: |-
    Website of the 2011 ACM-ICPC Asia Hsinchu Regional Contest, made by the Computer Center of Chung Hua University, the host. It is in English with some Chinese notes and bilingual schedule entries. The pages cover the news list, about ACM, contest rules, registration (separate pages for overseas and Taiwan teams), the schedule for 24 to 27 November 2011, contest environment, accommodation, transportation, campus, contact and a site map.

    The site links the final results as a PDF and as a PC^2 scoreboard summary, the nine-problem set as a PDF, two lists of accepted teams, a hotel and venue sheet, and two Chinese-language registration and payment guides. Our copy holds 27 files, including these documents. The photo gallery named in the menu is not in our copy, and the report page marks the opening and award ceremony videos as coming soon.
