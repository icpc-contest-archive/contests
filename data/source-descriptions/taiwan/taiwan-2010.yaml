  title: Problem B Bricks
  language:
  - en
  problems: 1
  pages: 3
  description: |-
    Statement of problem B, "Bricks", a PDF of 3 pages in English with a time limit of 1 second printed under the title. The task is to find, among N bricks each given by the vertices of its border, the bricks that are similar (congruent angles, proportional sides, with or without flipping); a figure shows the four example bricks. It has input and output sections and sample input and output. No test data or solutions.
