  pages: 2
  description: |-
    Statement of problem J, "Falling Gift Game", a PDF of 2 pages in English with a time limit of 5 seconds printed under the title. The task is to plan the movement of a cart that can only move right, to collect the falling gifts with the greatest total price. It has input and output sections and sample input and output. No test data or solutions.
