  title: Problem C 2D Folding Game
  language:
  - en
  problems: 1
  pages: 3
  description: |-
    Statement of problem C, "2D Folding Game", a PDF of 3 pages in English with a time limit of 5 seconds printed under the title. The statement defines embeddings of a 0-1 sequence as self-avoiding paths in a two-dimensional lattice, with two figures, and the task is to compute the score (number of contact edges) of an optimal conformation. It has input and output sections and sample input and output. No test data or solutions.
