  problems: 1
  pages: 5
  description: |-
    Statement of problem E, "AR Game", a PDF of 5 pages in English with a time limit of 2 seconds printed under the title. The statement concerns recognising five markers, each a 100x100 binary image, from displaced and noisy captured images; the images are shown in graphical form. It has input and output sections and sample input and output. No test data or solutions.
