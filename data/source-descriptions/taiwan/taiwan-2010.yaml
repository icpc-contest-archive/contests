  problems: 1
  pages: 2
  description: |-
    Statement of problem G, "Tree Representation", a PDF of 2 pages in English with a time limit of 5 seconds printed under the title. The task is to recover a labelled tree from the sequence of n - 2 labels obtained by repeatedly deleting the smallest leaf and recording its parent. It has input and output sections and sample input and output. No test data or solutions.
