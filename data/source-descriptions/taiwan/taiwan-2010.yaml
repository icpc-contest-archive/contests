  description: |-
    Statement of problem A, "Spread Out Message", a PDF of 3 pages in English with a time limit of 2 seconds printed under the title. The task is to build a spreading list of n - 1 pairs of persons, who pass on each new message to one another, that has the highest total familiarity score; two figures illustrate examples. It has input and output sections and sample input and output. No test data or solutions.
