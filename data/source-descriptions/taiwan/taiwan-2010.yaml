  description: |-
    Statement of problem I, "History of Dots", a PDF of 2 pages in English with a time limit of 2 seconds printed under the title. The statement concerns dots of assorted colors that change colors in pairs under transformation rules; the task is to tell, for each given initial population, whether it is possible. It has input and output sections and sample input and output. No test data or solutions.
