  - zh
  contest_date: '2010-12-04'
  description: |-
    Website of the 2010 ACM-ICPC Asia Kaohsiung Regional Contest, published by Library and Information Services of National Sun Yat-sen University (NSYSU), in English with Chinese on some pages. The home page gives the contest as December 3 - December 5, 2010, with the programming contest and banquet on Saturday 12/4, and a news list with dated entries from October to December 2010.

    Our copy holds 21 pages, including repeated captures of the home page and of the contest result page: about the ICPC, rules, registration (also a version for Taiwan teams), schedule, contest environment, accommodation, transportation (also a version for Taiwan teams), contact, campus and site map pages, a photo gallery page and one photo page listing 42 photo file names. The contest result page lists 69 teams as places and Honorable Mention; one of its two captures stops after 37 teams. A summary page is a full scoreboard of 70 team rows with solved, time and attempts/time for each of problems A to J. The news mentions an accepted list and problem descriptions, which are not in our copy, and the photographs themselves are not in our copy either.
