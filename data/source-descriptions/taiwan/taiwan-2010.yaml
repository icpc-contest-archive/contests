  description: |-
    Statement of problem F, "Houses", a PDF of 1 page in English with a time limit of 5 seconds printed under the title. The task is the maximum number of 1 by 2 houses that fit on an m by n field with some bad squares. It has input and output sections and sample input and output. No test data or solutions.
