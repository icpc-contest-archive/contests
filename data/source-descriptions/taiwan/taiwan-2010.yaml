  language:
  - en
  problems: 1
  pages: 2
  description: |-
    Statement of problem H, "Q-Bacteria", a PDF of 2 pages in English with a time limit of 3 seconds printed under the title. The statement concerns Q-bacteria passing cells of a chemical component called Famma among themselves; the task is to decide whether the bacteria of a community can be destroyed and, if so, the shortest time until one is found dead, or 0 if not. It has input and output sections and sample input and output. No test data or solutions.
