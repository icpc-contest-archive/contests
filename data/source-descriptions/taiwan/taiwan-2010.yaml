  title: Problem D Mobile Communications
  language:
  - en
  problems: 1
  pages: 2
  description: |-
    Statement of problem D, "Mobile Communications", a PDF of 2 pages in English with a time limit of 15 seconds printed under the title. The statement concerns mobile base stations whose signal strength falls with the squared distance; the task is to answer YES or NO to whether giving every station the same power level avoids competing signals. It has input and output sections and sample input and output. No test data or solutions.
