  description: |-
    Single problem statement, a PDF of 2 pages, headed "6300 Signed Binary Representation of Integers" and, from page 2 on, carrying a running head "ACM-ICPC Live Archive: 6300 – Signed Binary Representation of Integers" with the page number. The statement explains computing a^x mod n by repeated squaring with ordinary and signed binary digits (-1, 0, 1); for each integer of up to 120 decimal digits, the task is to print the number of non-zero bits of its binary representation and of a signed binary representation with the fewest non-zero bits. It has Input and Output sections and a sample input and output. No problem letter, contest name or year is printed.
