  description: |-
    Single problem statement, a PDF of 2 pages, headed "6305 Ranking Number" and, from page 2 on, carrying a running head "ACM-ICPC Live Archive: 6305 – Ranking Number" with the page number. Members of k departments and a project committee must receive ranking numbers under two stated conditions; the task is to compute the smallest largest number needed, the optimal ranking number. The statement works through an example with three departments. It has Input and Output sections and a sample input and output. No problem letter, contest name or year is printed.
