  description: |-
    Single problem statement, a PDF of 2 pages, headed "6306 Smartphone Manufacturing" and, from page 2 on, carrying a running head "ACM-ICPC Live Archive: 6306 – Smartphone Manufacturing" with the page number. Workers of three companies A, B and C are split into two weekly shifts; the task is to choose the company by three ordered criteria and print its letter with the two weekly throughputs, the smaller first. The statement includes a worked reading of the first sample. It has Input and Output sections and a sample input and output. No problem letter, contest name or year is printed.
