  description: |-
    Single problem statement, a PDF of 2 pages, headed "6302 Star Travel" and, from page 2 on, carrying a running head "ACM-ICPC Live Archive: 6302 – Star Travel" with the page number. Planets joined by one-way StarGates belonging to federations, with free transfers for travellers holding the right citizenships; the task is to output, for each tour, the sequence of ticket names with the fewest tickets, preferring the smaller ticket names. It has Input and Output sections and a sample input and output. No problem letter, contest name or year is printed.
