  description: |-
    Single problem statement, a PDF of 2 pages, headed "6307 Grass" and, from page 2 on, carrying a running head "ACM-ICPC Live Archive: 6307 – Grass" with the page number. A recursive grass-cutting path over a 2^n by 2^n area; the task is to give the coordinates of the k-th visited cell and of the neighbouring cell with the greatest difference in visiting number. The statement refers to figures for n = 1, 2 and 3 and gives a worked example for n = 2 and k = 14. It has Input and Output sections and a sample input and output. No problem letter, contest name or year is printed.
