    Single problem statement, a PDF of 2 pages, headed "6309 Balanced Community" and, from page 2 on, carrying a running head "ACM-ICPC Live Archive: 6309 – Balanced Community" with the page number. A social network as a complete graph with positive and negative edges, where a group is balanced when every triple is balanced; the task is the size of the largest balanced group that contains member 0. The statement refers to Figure 4. It has Input and Output sections and a sample input and output. No problem letter, contest name or year is printed.
