  description: |-
    Single problem statement, a PDF of 2 pages, headed "6301 The Shortcut Eight-Puzzle" and, from page 2 on, carrying a running head "ACM-ICPC Live Archive: 6301 – The Shortcut Eight-Puzzle" with the page number. A sliding eight-puzzle on a 3 by 3 frame in which a tile may move up, down, left, right or up-right into the empty space; the task is the minimal number of moves from a given initial state to a given goal state, or -1 if unreachable. The statement refers to Figures 1 and 2. It has Input and Output sections and a sample input and output. No problem letter, contest name or year is printed.
