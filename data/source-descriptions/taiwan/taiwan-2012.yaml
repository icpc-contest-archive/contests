  problems: 1
  pages: 3
  description: |-
    Single problem statement, a PDF of 3 pages, headed "6308 Airline Companies" and, from page 2 on, carrying a running head "ACM-ICPC Live Archive: 6308 – Airline Companies" with the page number. An air corridor network of cities in which every cycle longer than three has a shortcut, with airline companies located in some cities; the task is the largest number of companies that are pairwise not joined by a corridor. The statement refers to Figure 3, an example network of 16 cities and 20 corridors. It has Input and Output sections and a sample input and output. No problem letter, contest name or year is printed.
