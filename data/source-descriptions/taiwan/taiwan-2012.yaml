  description: |-
    Website of the 2012 ACM-ICPC Asia Kaohsiung Regional Contest, run by Library and Information Services of National Sun Yat-sen University and titled "國立中山大學Asia Kaohsiung" (National Sun Yat-sen University Asia Kaohsiung). It is in English, with Chinese text on the pages for Taiwan teams. The news list on the home page shows entries dated 20 September to 30 November 2012. The schedule has registration and the opening ceremony on Friday 11/23 and the programming contest on Saturday 11/24, 09:30-14:30 in the NSYSU Gym, followed by the award ceremony and a banquet.

    Our copy holds 33 pages, some of them captured twice: the ICPC policies and procedures (as a page and as a PDF), registration and the admission principles for Taiwan teams, schedule, contest environment, accommodation, transportation, contact, site map, and news items on the live broadcast, the OS version, restrictions on materials and a team list of 70 teams (school name and team name). Four pages are NSYSU login, account and forum pages.

    The news items headed Contest Result, Final Scoreboard and Contest Questions only link to files on another server (a results PDF, a scoreboard page and a questions PDF), which are not in our copy. The Photo item links to an ICPC_2012 page that lists three event days (opening ceremony 11/23, programming contest 11/24, city tour 11/25); its page for the programming contest holds no photographs in our copy.
