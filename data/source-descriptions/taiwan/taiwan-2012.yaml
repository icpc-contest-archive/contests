  description: |-
    Single problem statement, a PDF of 2 pages, headed "6304 Career Planning Problem" and, from page 2 on, carrying a running head "ACM-ICPC Live Archive: 6304 – Career Planning Problem" with the page number. Students with ranked preference lists over job posts; the task is to decide whether the lists admit a "happy" arrangement, one for which no other arrangement is more popular, printing YES or NO. The statement has a technical specification list of limits. It has Input and Output sections and a sample input and output. No problem letter, contest name or year is printed.
