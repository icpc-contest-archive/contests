  problems: 1
  pages: 2
  description: |-
    Single problem statement, a PDF of 2 pages, headed "6303 Species Evolution" and, from page 2 on, carrying a running head "ACM-ICPC Live Archive: 6303 – Species Evolution" with the page number. A sequence of similarity scores must be changed into a non-decreasing sequence whose steps are bounded by a threshold, at least cost in squared differences; the task is to compute that minimal cost for each case. The statement works through an example with four candidate sequences B to E for a given sequence A. It has Input and Output sections and a sample input and output. No problem letter, contest name or year is printed.
