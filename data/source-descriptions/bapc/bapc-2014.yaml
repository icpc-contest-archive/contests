  read: '2026-11-16'
  rubric: 1
  copy: bapc/bapc-2014/website/2026-10-20-wayback-c25131b6
  title: October 19 th BAPC
  language:
  - en
  contest_date: '2014-10-19'
  description: |-
    Website of the 2014 Benelux Algorithm Programming Contest (BAPC), in English, for the contest held in Eindhoven on 19 October 2014; the pages other than the scoreboards carry the credit BAPC 2014, GEHACK, GEWIS. Our copy holds 16 pages, with the style sheet, images and three zip archives. The front page says the contest is over and names the winner, Syntax Error from Leiden University, then Kaas from Nijmegen University and UCooL from Louvain, and Ortec as best company team.

    Other pages give the program of the day, the venue and directions, the contest system and languages (C, C++, C#, Java, Haskell), how to take part (40 teams, company teams), sponsors, the organising committee and jury, and job opportunities. A four-page PDF holds the rules. Eight scoreboard pages are included: the final scoreboard, the public scoreboard and the six preliminary rounds (Nijmegen, Amsterdam, Enschede, Leiden, Delft, Eindhoven).

    The zip archives hold the 2014 problem set with test data and jury solutions, the problem set of the preliminary rounds, and the 2013 problem set. Links to the online contest server lead to another server and are not in our copy.
