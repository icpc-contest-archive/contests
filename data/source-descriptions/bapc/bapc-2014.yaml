  title: BAPC 2014 The 2014 Benelux Algorithm Programming Contest The Problem Set
  language:
  - en
  problems: 11
  description: |-
    Zip archive of the contest's problem package, 141 files. problemset.pdf is a 24-page problem set titled The 2014 Benelux Algorithm Programming Contest, listing 11 problems A to K (Avoiding the Apocalypse to Key to Knowledge), each with an English statement, input and output format and sample. The archive also holds sample input and output files for each problem, the test data used in judging as one input and one output file per problem, and 94 jury solutions in C++, Java, Haskell and one in C#, some marked as wrong or too slow. presentation.pdf is the 20-page slide set of solutions. A README states that the problem texts are licensed under Creative Commons Attribution-Share Alike 4.0 and explains the folders.
