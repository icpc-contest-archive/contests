    Kattis problem-source page for the contest: a table of 11 problems, Avoiding the Apocalypse to Key to Knowledge, in the order of the contest but without letters. Each row gives the fastest solution time, shortest solution length, a column headed Authors, full solves, ratio, a difficulty figure with label (from 1.8 Easy to 7.8 Hard) and the statement language, English for all eleven. Each problem name links to its own page on Kattis; the statements themselves are not on this page. The page also carries Kattis filters for difficulty, problem type and language.
