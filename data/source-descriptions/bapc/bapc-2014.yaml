    The rows are in three blocks, each ranked on its own: 35 participant teams, led by Syntax Error from Leiden University with 8 problems solved, 10 company teams, and 9 rows in the spectator colour (three named teams and six called Spectator plus a number). A legend explains the row colours (participants, company teams, observers, spectators) and the cell colours.
