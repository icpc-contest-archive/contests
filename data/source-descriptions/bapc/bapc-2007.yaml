  description: |-
    Problem set of the contest as a PDF of 26 pages. The cover reads Benelux Algorithm Programming Contest, October 27, 2007. It holds ten problems A to J: Average distance, Bus Pass, Cutting Banknotes, Dice Password Security, Lingo, Splitting the Loot, Pachinko, Hiking, Ranking and Stock. Each has a statement in English with input and output sections, and a Sample in- and output section follows each of the ten statements. There are no solutions or test data.
