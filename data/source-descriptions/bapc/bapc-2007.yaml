  description: |-
    Final scoreboard of BAPC 2007: 48 teams with number solved, total time and, for each of problems A to J, the number of tries, with the solving minute plus penalty minutes in parentheses where the problem was solved. The first row is Prime Suspects with 8 solved. The column heads carry the problem titles (Average Distance, Bus Pass and so on).

    The board is divided into four blocks, each ranked from 1, of 30, 10, 2 and 6 rows; a few rows at the end of a block carry no rank. A legend lists five kinds of team (Students, Companies, Unoffical, Organisation, Spectators), but no row is marked with its kind. The affil. column holds logo and flag images, which are not in our copy, so it shows empty. A last row gives 126 solved in all, the total time and three figures per problem.
