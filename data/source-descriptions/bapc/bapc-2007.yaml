  title: BAPC 2007 - News
  language:
  - en
  contest_date: '2007-10-27'
  description: |-
    Website of the Benelux Algorithm Programming Contest 2007, held on 27 October 2007 on the campus of the University of Twente in Enschede, with the footer Copyright 2007 W.S.G. Abacus. In English. The 2007 pages are the news page (a report dated 28 October 2007 on the final results), introduction, committee of recommendation, organizing committee, thanks, registration and registered teams, schedule, travel and system information, training, sponsors, contact, the problem sets page, a standings page and a full scoreboard.

    The site was reused for later editions, and our copy also holds pages of the 2008 contest (five pages), of the 2011 contest in Eindhoven (seven pages), and the scoreboards of four of the preliminary contests of 6 October 2007. The 2007 problem set PDFs and archives that the problem sets page links are not in our copy. In all the copy has 38 pages of the site itself. It also holds a later domain-for-sale page and dozens of unrelated pages from the same address, which are not part of the contest site.
