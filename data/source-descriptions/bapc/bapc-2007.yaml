  description: |-
    Contest dashboard on the online judge QOJ.ac for The 2007 ICPC Benelux Algorithm Programming Contest (BAPC 2007), filed under ICPC, Regionals, Europe, Northwestern Europe, Benelux Algorithm Programming Contest. It lists ten problems A to J by name, from A Average distance to J Stock, each linking to its problem page on the judge, and offers an attachment link to the statements in English; neither the problem pages nor the attachments are in our copy. The page also gives the judge's settings for the contest (ICPC ruleset, 20 minutes penalty, scoreboard frozen after 4:00:00), empty notice and question tables, and offers a virtual contest.
