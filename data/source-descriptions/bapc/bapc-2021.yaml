  - en
  contest_date: '2021-10-30'
  description: |-
    Home page of the 2021 Benelux Algorithm Programming Contest (30 October 2021, onsite), in English. It says the contest is hosted by Vrije Universiteit Amsterdam and organised by a committee of the study association STORM, explains what the BAPC is and that the teams with the most solved problems qualify for NWERC, and carries a news line about the call for problems for BAPC 2022. A contest materials section links the problems, solutions, test data and solutions, the same three items for the preliminaries, and the scoreboards of the contest and of the preliminaries, plus a note that the problems are on the Kattis mirror. Below are a table of the organisers of the contests from 2010 to 2020 and gold, silver and other sponsors shown as logos.

    The menu links to Jury, Schedule, Photos, Registration, Location, Rules, Help us, Company teams, Special thanks and Contact pages. Our copy holds only this one page, so those pages and the linked materials are not part of it.
