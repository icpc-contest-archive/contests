  tries: true
  description: |-
    Final scoreboard produced by DOMjudge for the 2021 Benelux Algorithm Programming Contest, with a last-update stamp of 3 December 2021. It lists 86 teams against 12 problems A to L: rank, team name with institution, problems solved and total time, and for each problem the time of the accepted submission and the number of tries, coloured as solved first, solved, tried or untried. A summary row follows each of the two groups, with figures per problem. The first 71 teams form the main ranking, led by a team from Delft University of Technology with 9 problems solved in 816; the last 15 teams belong to a Companies category and are ranked separately from 1, led by a team with 11 problems solved. Several teams at the bottom have no solved problem.

    Our copy holds the page with its style sheets and images in an assets folder.
