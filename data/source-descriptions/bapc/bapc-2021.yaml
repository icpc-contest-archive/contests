  description: |-
    Solutions presentation by the jury, a slide PDF of 77 pages in English dated 1 November 2021. It has a title slide and then slides for each of the 12 problems A to L, each introduced with its problem author and a short problem description, with submission statistics (for example 94 submissions and 82 accepted for problem A) and a solution explanation. The closing slides give statistics on the jury's work (917 commits, 693 secret test cases, 177 jury solutions, a minimum of 115 lines for all solutions), then lists of proofreaders and jury members and a sponsors slide.
