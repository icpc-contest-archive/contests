  description: |-
    Problem set of the 2021 Benelux Algorithm Programming Contest as a PDF of 27 pages, in English. The cover page lists the 12 problems A to L (Arm Coordination to Lopsided Lineup) and states a Creative Commons Attribution-ShareAlike licence by the BAPC 2021 jury. Each problem has its statement with a time limit, an input and output description and sample inputs with outputs, except problem G, an interactive problem, which has an interaction protocol and two sample interactions instead. No test data or solutions.
