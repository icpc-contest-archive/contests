    Standings of the 2021 ICPC Benelux Algorithm Programming Contest: 70 teams with rank, team name, institution, problems solved, total time and a citation. The first place solved 9 problems with a time of 816. The first 35 rows carry a place citation (a champion citation, then Second Place and so on up to Thirty-fifth Place) and the other 35 are listed as Honorable Mention. Tied teams share a rank, down to rank 68 for the three teams with no solved problem. There is no per-problem detail.
