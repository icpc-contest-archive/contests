  description: |-
    Website of the 2008 Benelux Algorithm Programming Contest, in English, run by the CHipCie, the programming committee of the study association Christiaan Huygens at Delft University of Technology. Our copy holds 63 files, of which 12 are pages: the home page with news, the day programme and registration information, a page about how the local contests, the BAPC, the North Western European Regional Contest and the World Finals fit together, sponsors, links and contact pages, the live score page, a 17-page problem set PDF and a 24-page program booklet PDF.

    The home page announces the first three places, the best business team and the release of the problem set, three downloads of solutions (15 files), test cases (16 files) and expected output (16 files), all of which are in our copy as zip archives, and a calendar file. The booklet has the preface, route description, day programme, an example problem, systems and tools, rules, tips and organisation. Images and style sheets are saved with the pages.
