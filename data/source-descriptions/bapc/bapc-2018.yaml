  description: |-
    Solution slides as presented after the contest: a PDF of 84 pages (50 numbered frames, many built up step by step), each footed October 27, 2018. There is no title page and no author is named. All 11 problems are covered, in the order A, B, F, C, G, J, H, K, E, I, D; each section opens with the number of accepted submissions out of all submissions before the freeze and, for nine of them, the minute of the first solve, then explains the solution; several name its running time or pitfalls.

    The last frame, Some statistics, gives 1015 commits to the repository, 467 test cases in total and 45.07% accepted jury solutions.
