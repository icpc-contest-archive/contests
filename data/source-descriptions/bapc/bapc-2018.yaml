  description: |-
    Scoreboard from the BAPC 2018 website: a page with two tables. The first table lists 64 teams, 52 student teams followed by 12 company teams, with rank, team name and institution or company, number of problems solved, total time, and for each of the problems A to K the minute of the accepted solution and the number of tries. Of the student rows, 45 carry a rank; the last seven, all with no problem solved, have none. The company teams are ranked separately from 1 to 12. A summary row gives the total number solved and, per problem, the counts of accepted, rejected and pending submissions and the time of the first solution. Mostly Harmless Bogosort (UCLouvain) is first among the students with eight problems.

    The second table, headed 'BAPC 2018 - web contest', lists 37 self-registered participants in the same columns, including a few accounts named as tests; 12 are ranked and the other 25 have no problem solved.
