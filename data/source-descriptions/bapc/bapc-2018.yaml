    Final standings of the 2018 Benelux Algorithm Programming Contest: 43 teams with rank, team name, institution, number of problems solved, total time and a citation column. Rows up to rank 21 carry citations from First Place to Twenty-first Place; the remaining teams are marked Honorable Mention, and the last two share rank 45 with no problem solved. Mostly Harmless Bogosort from Université Catholique de Louvain is first with eight problems and 890 minutes, ahead of The Thorycoders from Universiteit Utrecht. There is no per-problem detail and no attempt counts.
