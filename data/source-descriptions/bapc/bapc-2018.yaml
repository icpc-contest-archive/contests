  description: |-
    Website of the 2018 Benelux Algorithm Programming Contest, in English, co-organised by UCLouvain and UMONS and held at Louvain-la-Neuve on 27 October 2018. Our copy holds 17 page addresses, 12 distinct pages (some are saved under two addresses): home, schedule, preliminaries, system, rules, registration, teams, problems, results, location, accommodation and contact. The home page describes the contest and lists the earlier editions BAPC 2010 to 2017.

    The results page carries the scoreboard, and the preliminaries page carries a scoreboard of the Pre-BAPC 2018 round with 98 team rows. The problems page links to the problem set PDFs, solution slides, a video and a ZIP of statements, test data and jury solutions, but the linked files are on other servers and are not in our copy. The schedule gives the day from 09:30 registration to the 22:00 dinner; the rules page covers student and business teams, the five-hour length and the languages; the system page lists compilers, editors and compile options. The teams page only says the student and company teams are to be announced. The page images are in our copy; the Bootstrap style sheet that the pages load is on an external server and is not.
