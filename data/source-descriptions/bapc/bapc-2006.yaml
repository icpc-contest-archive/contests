  description: |-
    Scoreboard of BAPC 2006 with the contest window given as 12:00 to 17:00 and a footer reading Last Update: 21 Oct 2006 17:00. It lists 51 teams with the number solved, total time and, for each of problems A to I, the number of tries, with the solving minute plus penalty minutes in parentheses where the problem was solved. The first row is Messed Up with 7 solved.

    A legend names four kinds of team: participant (34 rows), business team (11), spectator (5) and organisation (1). The 34 participants come first, followed by the other kinds, which are ordered among themselves. The style sheet is not in our copy, so the colours the legend refers to do not show. A summary row gives totals (100 solved in all) and three figures per problem.
