  description: |-
    Website of the Benelux Algorithm Programming Contest 2006, held at the Plexus student centre in Leiden and organised by the study association De Leidsche Flesch. It is in English, apart from some sponsor and vacancy pages and two information packs in Dutch. Our copy holds 51 pages, many of them captured twice under slightly different addresses.

    The pages cover the organisation, the schedule of the day (registration from 9.00, test session, contest from 12.00 to 17.00, award ceremony), registration (closed, with the list of registered teams), system specifications, rules (as a page and as PDF and text files), prize money, sponsors, a poster PDF, and the qualifying contest of the participating universities. After the contest the home page links the problems, samples and solutions and the scoreboard, and mentions two prize winners. The copy holds the scoreboard, the problem set PDF of 20 pages, and the results of four of the six qualifying contests (Groningen, Leiden, Eindhoven, Twente); the other two link to outside sites. The tarballs of problems, samples, test data and solutions linked from the results and qualifying pages, and the PostScript problem file, are not in our copy.
