  description: |-
    Slide deck of 41 pages, in English, titled BAPC 2012 STATS + SOLUTIONS + SCORES. It opens with charts of submissions over time, submissions by language (counts and shares) and average code length by language (C, C#, C++, Java). The solution slides then cover all ten problems (Encoded Message, Integer Lists, Good Coalition, Fire, Black Out, Digit Sum, Another Dice Game, Chess Competition, John's Book Stack, Hot Dogs in Manhattan), each with the approach in short bullet points and a complexity bound; several slides are repeated in animation steps. The last slide lists 30 team names against a time axis from 13:00 to 17:00, with a legend for last submission and last correct submission.

    The slides are mostly text and charts; the code on the Another Dice Game slide is a table of precomputed values.
