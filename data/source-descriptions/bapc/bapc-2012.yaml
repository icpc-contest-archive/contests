  title: BAPC 2012
  language:
  - en
  contest_date: '2012-10-27'
  description: |-
    Website of the Benelux Algorithm Programming Contest 2012, in English, as published by the organisers (the study association A-Eskwadraat in Utrecht). Our copy holds 18 pages, four of them PDFs. The pages are the welcome page, news, location (De Uithof campus, Utrecht, with travel directions), the programme of the contest day, the contest system (DOMjudge, with the compilers and editors available), rules, preliminaries, registration, practice, sponsors, how to get involved, the organisation and the jury.

    The news page announces the final standings, the problem set, the program booklet and the jury's presentation, and gives links to the preliminary-round scoreboards of four sites (Utrecht/Twente, Eindhoven, Leiden, Delft). The standings link leads to a page on another server and is not part of our copy. The site also holds the problem set of the contest as a zip file with problem texts, test data and solutions, and the rules as a PDF of 5 pages. Three PDFs (the program booklet, the final-round presentation and the preliminaries presentation) are cut off at 1 MiB in our copy and cannot be opened. Images and style sheets are present.
