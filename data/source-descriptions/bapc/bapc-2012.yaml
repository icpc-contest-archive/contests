    Standings of the 2012 Benelux Algorithm Programming Contest: 31 teams with rank, team name, institution, number of problems solved, total time and a citation. Delft University of Technology's team5 is first with 9 problems solved and a time of 1424. The citations name the first to fifteenth places (First Place to Fifteenth Place); places 16 to 31 are marked Honorable Mention. The last team has 0 solved. There are no per-problem columns, so attempts and times per problem are not given.
