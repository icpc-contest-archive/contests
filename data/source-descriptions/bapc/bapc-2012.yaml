    Baekjoon Online Judge page for the category BAPC 2012, in Korean, listing nine problems with Baekjoon problem numbers 5423 to 5431 and contest letters A and C to J; letter B (Black Out) has no row. For each problem it gives the title, a column of marks (special judge, source, multilingual, category and, for two problems, solution), the number of people who solved it, the number of submissions and the percentage solved. Problems A, G and H carry their English titles and problem I is titled AC; the other titles are in Korean. The page is a list; the statements are on linked pages that are not part of our copy.
