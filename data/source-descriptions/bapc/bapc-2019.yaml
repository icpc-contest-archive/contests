  title: BAPC 2019
  language:
  - en
  contest_date: '2019-10-19'
  description: |-
    Website of the 2019 Benelux Algorithm Programming Contest, in English, which took place on 19 October 2019 at Radboud University in Nijmegen and was co-organised by the study associations Desda and Thalia. Our copy holds 14 pages: home, preliminaries, schedule, system, registration, rules, teams, problems, results, location, organisation and contact, plus pages for the sponsors ASML and Summitto. The home page links the results, the problem set and solutions, event photos and a video by the university magazine, and lists the websites of the editions 2010 to 2018.

    The preliminaries page describes the local qualifying rounds on 21 September 2019. The teams page lists 12 company teams and 57 accepted student teams with their institutions. The schedule runs from 09:00 registration to a 22:00 award ceremony. The organisation page names the organising committee and the jury. The results page holds the scoreboards. The problems page links PDFs and ZIPs that are on other servers and not in our copy.
- url: https://2019.bapc.eu/results.html
  read: '2026-11-16'
  rubric: 1
  copy: bapc/bapc-2019/scoreboard/20260901-live-7a0cf26c/results.html
  title: Scoreboard | BAPC 2019
  language:
  - en
  problems: 12
  times: true
  tries: true
  description: |-
    Scoreboard page of the BAPC 2019 website with eleven tables, each giving rank, team, score and, for problems A to L, the minute of the accepted run and the number of tries, with summary rows. The first table is the BAPC final results, with a country flag and institution logo per team: 56 student teams followed by 12 company teams, each group with its own summary row; the top student team is git merge -s octopus solution cup from Leiden University with 12 problems.

    The second table is the BAPC semi-live contest results: 32 rows, of which 22 are ranked. Then comes a merged scoreboard of all the local preliminaries, 137 rows including several test entries (testteam1 to testteam4 and an example team name), followed by eight boards of single preliminary sites: Amsterdam (Vrije Universiteit and University of Amsterdam), Delft, Eindhoven, Leiden, Nijmegen, Twente and Utrecht. A table of contents links to each table.
