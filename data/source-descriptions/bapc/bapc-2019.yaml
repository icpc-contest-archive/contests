  description: |-
    Final standings of the 2019 Benelux Algorithm Programming Contest: 55 teams with rank, team name, institution, number of problems solved, total time, medal, citation and site citation (Nijmegen for every row). Ranks run from 1 to 55 without ties. The first three teams carry First, Second and Third prize medals and citations; the others have a citation of the form Ranked #n. First place is git merge -s octopus solution cup from Leiden University with 12 problems and 1107 minutes. There is no per-problem detail and no attempt counts.
