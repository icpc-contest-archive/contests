  description: |-
    Final scoreboard of BAPC 2010 as published on the contest's website: 28 teams against ten problems labelled A to J. For each team it gives rank, score (the column is headed as number solved and penalty time) and one cell per problem: a count for unsolved problems, and for solved problems a count followed by time and penalty minutes in parentheses. A summary row gives the total of 28 teams, 12 affiliations and 2 countries, 108 problems solved in all, and per problem the number submitted, the number correct and the fastest time. The teams are ranked in three blocks of 20, 3 and 5 teams, each starting again at rank 1; a legend names participants, companies and spectators. Joy is first with 7 problems solved.

    The page was last updated on 23 October 2010 at 19:50. The affiliation column holds logo images that are not in our copy, nor are the style sheet and the header image, so the affiliation cells are blank.
