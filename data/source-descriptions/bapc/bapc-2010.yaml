    Slide deck of 15 pages in English, titled Solution outlines, BAPC 2010 - Leiden, with the date 23 October 2010. It covers all ten problems, A to J, in the order D, I, A, G, B, F, J, C, E, H; problems A, C and E take more than one slide, with alternative solutions. Each outline is a short list of bullet points on the idea of the solution, and the main outline of every problem ends with the running time of the solution, for example an O(1) solution for Collatz and an O(N) solution for Keylogger.

    The slides for problem C include a short C++ program. No problem statements or test data.
