    Category page of the Baekjoon Online Judge, in Korean, for the contest. A table lists nine problems A to I with the judge's problem numbers and, for A to H, the number of people who solved, the number of submissions and the solve percentage (for example 76 submissions on H). Problems F and G are titled in Korean, the others in English; the row for I has only a number, with no title or counts. The page holds no statements; the rest is the judge's navigation menu.
