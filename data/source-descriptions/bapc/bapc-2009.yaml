    Problem set as a PDF of 20 pages in English, headed BAPC 2009, with nine problems A to I: Penguin Bashing, Gearbox, Escape from the Minefield, Baby's Blocks, The Pharaoh's Curse, Dimensional Warp Drive, Fractal Streets, No Smoking, Please and Arctic Polar Explorer. Each problem has a statement with input and output sections and an example input and output table. No test data or solutions are included.
