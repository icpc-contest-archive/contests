  copy: bapc/bapc-2009/rankings/20261115-live-718f0a57/tutorials_en.pdf
  title: The Results
  language:
  - en
  problems: 9
  pages: 85
  description: |-
    Slide deck of 85 pages in English, in two parts: The Results (pages 1 to 16) and The Solutions (pages 17 to 83), followed by a page of closing remarks and a page headed Dinner Time. The results part gives the best business team (VORtech, 3 correct submissions, 674 minutes) and then third, second and first place, with the first-placed team Doeke en Jelle at 7 correct submissions and 1318 minutes, a special prize for the shortest and first solution of problem I, and thanks to runners, the photo committee, system administrators and the programming committee. Only these places are shown, not a full ranking.

    The solutions part covers all nine problems A to I, in the order I, D, G, A, F, E, B, H, C, with between 3 and 15 pages for each problem (slides that build up step by step take several pages), giving the approach and in places a worked example.
