  title: Benelux Algorithm Programming Contest 2009 -- Welcome
  language:
  - en
  contest_date: '2009-10-17'
  description: |-
    Home page of the website of the 2009 Benelux Algorithm Programming Contest, in English. It says the contest is over, that it was held on October 17, 2009 in Groningen, with preliminary rounds at the local universities on October 3, and it has news items dated 2009-06-10 to 2009-10-09 (website online, preliminaries held, preliminaries problem set online, programme booklet on the in print page). It links the problem set, the results and a Twitter feed, and its menu lists the pages news, results, registration, schedule, location, the contest, rules, problems, system, sponsors, organization, contact and in print.

    Our copy holds this home page only; the other pages and the style sheet and images were not captured, so the menu entries and the problem set and results links lead nowhere in our copy.
- url: https://en.wikipedia.org/wiki/BAPC
  read: '2026-11-16'
  rubric: 1
  copy: bapc/bapc-2009/rankings/20261020-live-ec20fb2a/page.html
  title: BAPC - Wikipedia
  language:
  - en
  description: |-
    Wikipedia article on the Benelux Algorithm Programming Contest as a series, in English: sections on organisation, contest format, judging, scoring, prizes and history, with a table with one row per year from 1991 to 2022 giving the organizer, the winning team, its members and its institution. The row for 2009 names Rijksuniversiteit Groningen as organizer and Doeke en Jelle of Universiteit van Amsterdam as winner. The article covers the series and has no results for other teams.
- url: https://icpcarchive.github.io/Europe/Northwestern-Europe/Benelux-Algorithm-Programming-Contest/The-2009-ICPC-Benelux-Algorithm-Programming-Contest-BAPC-2009/tutorials_en.pdf
  read: '2026-11-16'
