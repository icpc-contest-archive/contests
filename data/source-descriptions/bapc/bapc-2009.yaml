    Contest dashboard on the online judge QOJ.ac for The 2009 ICPC Benelux Algorithm Programming Contest (BAPC 2009), filed under ICPC, Regionals, Europe, Northwestern Europe, Benelux Algorithm Programming Contest. It lists nine problems A to I by name, from A Penguin Bashing to I Arctic Polar Explorer, each linking to its problem page on the judge, and offers attachment links to the statements and to the tutorials (both in English); neither the problem pages nor the attachments are in our copy. The page also gives the judge's settings for the contest (ICPC ruleset, 20 minutes penalty, scoreboard frozen after 4:00:00), empty notice and question tables, and offers a virtual contest.
