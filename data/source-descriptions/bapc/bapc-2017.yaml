  description: |-
    Website of the 2017 Benelux Algorithm Programming Contest, in English, run by the study association of the University of Amsterdam's information sciences programme, with the contest hosted at the ChipSoft office building in Amsterdam on 7 October 2017. Our copy holds 68 pages (94 saved files): the home page with news posts (programme booklet, teams, house rules, thanks, photos), contest information, rules, computer system and software list, location, schedule, organisation and a company page for ING.

    Three scoreboards are in it: the BAPC scoreboard, a scoreboard of the preliminaries (a merged board plus a separate board for each of eight preliminary contests) and a semi-live scoreboard. The teams page lists the participants and the company teams. A problems page links to the problem set and solutions slides of both the contest and the preliminaries, and those PDFs are in our copy, together with a 12-page programme booklet; the two linked ZIP files of jury solutions and test data are not. The link to the photos leads outside our copy.
