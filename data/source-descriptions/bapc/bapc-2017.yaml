  description: |-
    Scoreboard of the contest on the contest website, in English: 59 team rows in two groups. 45 student teams come first, ranked 1 to 41 with four more unranked rows at the end; below them 14 company teams are ranked separately from 1 to 14. Each row gives rank, a country flag, team name with university or company, number of problems solved, total penalty time, and for each of the thirteen problems A to M the number of attempts and the time of the accepted solution, with first solves marked. A Summary row gives submitted/correct counts per problem; it states 57 as the total number of teams, which differs from the 59 rows. A colour legend explains the cell colours and the two team categories. First place among the student teams is Unproved Convexity Lemma from Universite catholique de Louvain.
