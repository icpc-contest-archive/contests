    Codeforces gym page of the 2023 Benelux Algorithm Programming Contest (BAPC 23), marked Finished, in English. Its problem table lists twelve problems A to L, from apt upgrade to Locking Doors, each with standard input/output and a limit of 1, 2 or 5 seconds and 512 MB. The page links the contest materials: samples as a ZIP, statements as a PDF and solution slides as a PDF. It also explains virtual participation and practice, and carries a note saying the official PDF statements are in the attachments section.

    The statements, samples and slides are linked files and the individual problem pages are not part of our copy; the page shows only the problem list.
