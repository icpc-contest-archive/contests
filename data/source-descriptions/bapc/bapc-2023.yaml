  description: |-
    Website of BAPC 2023, the Benelux Algorithm Programming Contest, organised by via, the study association for information sciences of the University of Amsterdam, in English. Our copy holds 29 pages, some of them stored twice under a second address: the home page, a problems page, information pages on the contest, rules, system, location, schedule and registration, a contact page, two news items about the online mirror contest, and four PDFs.

    The home page links the contest materials of the contest on 28 October 2023 and of the preliminaries held on 23 September 2023: a problem set, solution slides, test data and solutions, and a scoreboard for each. The four PDFs (both problem sets and both sets of solution slides) and the two DOMjudge scoreboards, final standings of the contest and of the preliminaries, are in our copy. The location page names the Crystal Tower of the company ChipSoft in Amsterdam as the venue, and the contest page links to the sites of BAPC 2010 to 2022. The two test data archives are not in our copy.
