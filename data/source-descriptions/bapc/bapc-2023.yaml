  description: |-
    Final scoreboard of BAPC 2023 produced by DOMjudge: 57 teams in two separately ranked lists, 50 teams in the category Students (ranks 1 to 50) and 7 in the category Companies (ranks 1 to 7). Each row gives rank, team name with affiliation, number solved, total time, and for each of the twelve problems A to L the minute of the accepted solution with the number of tries, or the number of tries alone when unsolved. Each list ends with a summary row of per-problem totals.

    The first three students carry gold, silver and bronze medal marks. The team ranked first among the companies appears under the name "[Team has been disqualified]". Clicking a team opens its name, category, affiliation, country and seat location. The page states that it was last updated on 29 October 2023 and carries a colour legend for first solve, solved, incorrect, pending and untried cells, and a medal legend.
