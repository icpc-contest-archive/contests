  description: |-
    Problem set of the 2022 Benelux Algorithm Programming Contest: a PDF of 27 pages in English. The cover lists twelve problems, A Adjusted Average to L Lowest Latency, and carries a copyright line for the BAPC 2022 jury under a Creative Commons Attribution-ShareAlike 4.0 licence. Each problem has a statement with its time limit. Ten have input and output format with sample input and output; problems D Dividing DNA and J Jagged Skyline are interactive and give an interaction protocol with sample interactions. Some problems carry an illustration with a credit line. Four pages are marked as intentionally left blank. No test data or solutions.
