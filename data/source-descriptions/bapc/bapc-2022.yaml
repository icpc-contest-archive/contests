  description: |-
    Home page of the BAPC 2022 website, in English, headed "Benelux Algorithm Programming Contest, October 22, 2022 - Eindhoven". It says the contest is over and links to a 660 MiB zip of pictures. Under contest materials it lists the problems, the solutions, the test data and solutions (47 MB), the scoreboard, the stream and the closing ceremony stream. A second list, headed Preliminaries, gives problems, solutions, test data and solutions (115 MB) and the scoreboard of the preliminaries. The page ends with main, gold and silver sponsor headings and four sponsor logos (Prodrive Technologies, Booking.com, Huawei, Guardsquare).

    Our copy holds this one page with its images, style sheet and scripts. The menu entries Registration, Schedule, Location, Contest, Rules, System and Contact lead to pages that are not part of this copy, and neither are the files linked from the materials lists.
