    Solutions presentation of the jury, a slide deck of 117 pages in English dated October 22, 2022. It goes through the twelve problems, beginning with E, Equalising Audio; each problem has slides giving the problem author, the problem, the solution and a line of statistics with submissions and accepted counts. The slides build up step by step, so many pages repeat the previous one. The deck ends with a chart of language statistics, a page of random facts on the jury work (commits, secret test cases, jury solutions, lines of code) and a thanks slide to the proofreaders and the jury.
