  description: |-
    Final scoreboard of the Benelux Algorithm Programming Contest 2022 in DOMjudge, with problem columns A to L. Each of the 50 teams in the main block has rank, country flag, team name, institution, number of problems solved and total time, and each problem cell gives the solve time in minutes and the number of tries; unsolved attempts show the tries only. Delft University of Technology's Segfault go BRRRR is first with 12 problems solved. Rank 45 is shared by the six teams with no solved problems.

    A second block of 10 teams, marked with a Companies label, lists teams from companies (Ortec, Guardsquare, IMC, Booking.com, ASML, Prodrive Technologies) with their own ranks starting again at 1. Each block ends with a summary row with per-problem totals. A legend explains the cell colours: solved first, solved, tried incorrect, tried pending and untried. The page states the last update as Sun 23 Oct 2022 11:38:43 CEST.
