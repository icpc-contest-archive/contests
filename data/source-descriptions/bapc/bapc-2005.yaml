  description: |-
    Category page of the Baekjoon Online Judge titled BAPC 2005, in Korean, listing eight problems labelled A to H. Each row gives the judge's problem number (5415 to 5422), the title (ASM – The Abelian Sandpile Model, Cell Phones, Evacuation, Giant Cover, North-Western Winds, Shepherds and Engineers, Ski Lifts, Tables), and the judge's counts of users who solved it, submissions and the percentage of correct answers.

    Titles are in English except problem E, which is given in Korean as 북서풍 (bukseopung, "north-western wind"). The page is a list only; the statements are on the pages of the individual problems, which are not in our copy.
