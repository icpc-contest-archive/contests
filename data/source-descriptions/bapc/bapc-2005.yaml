  description: |-
    Results page of the contest: a scoreboard of 44 teams, with a note that this version of the result sheet fixes an error in the timing totals. Each row gives the team's number, team name, organisation, class, score, total time and, for each of problems A to H, the number of tries, with the minutes in parentheses where the problem was solved.

    The Class column mixes participants of different kinds: 31 teams are marked Contestants, 6 Business, 4 Coach and 3 Spectators, so teams of the different classes are on the same board and are told apart by that column. The first row is the team Messed Up of Universiteit Twente with a score of 6; the last two rows have score 0.
