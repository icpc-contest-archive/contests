  title: Benelux Algorithm Programming Contest 2005 sponsored by Sogeti
  language:
  - en
  contest_date: '2005-10-22'
  description: |-
    Website of the Benelux Algorithm Programming Contest 2005, sponsored by Sogeti, in English. It is run from Delft University of Technology by the study association W.I.S.V. Christiaan Huygens and announces the contest for Saturday 22 October 2005 in Delft. The home page notes that the contest was formerly known as the Nederlands Kampioenschap Programmeren (NKP) and lists the prize money for the student and business teams.

    Our copy holds 17 pages: the home page, pages on programming contests and on the change of the contest's name, sign-up, system specifications, rules, program of the day, directions to the venue, results, links and the organising committee, plus the sample solution in C of the sample problem, two PDFs, and a page at the address of the sign-up form that is the present-day home page of the association, without a form or anything about the contest. The results page is a scoreboard of 44 teams, and the problems page links the contest problem set (a PDF of 18 pages with eight problems), the problem set of the preliminary rounds held on 1 October 2005 (also a PDF of 18 pages with eight problems), and tarballs of judge input, judge output and sample solutions.

    The copy also holds the linked data and solution files that the problems page points to. Links to the sponsor and to other contest sites lead outside the copy.
