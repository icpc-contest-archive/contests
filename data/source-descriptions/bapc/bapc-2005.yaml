  description: |-
    Gzipped tar archive of 59 files in four folders, named on the website as the input, output and sample solutions of the contest. It holds judge input and judge output for problems A to H, sample solutions in C, C++, Java and Pascal for the problems (several problems have more than one solution, and not every language is covered for each), the sample input of each problem, and a separate folder for the test session with files for problems A, B and C.

    There are no problem statements in the archive.
