  title: BAPC 2024
  language:
  - en
  contest_date: '2024-10-26'
  description: |-
    Website of the 2024 Benelux Algorithm Programming Contest, in English, made by Cover, the study association for Artificial Intelligence and Computing Science of the University of Groningen. Cover organised the contest, which the University of Groningen hosted on 26 October 2024 on the Zernike campus in Groningen. Our copy holds 16 pages among 99 saved files; the location page appears under two addresses.

    The pages cover the contest and its route to NWERC and the ICPC World Finals, a list of previous BAPC editions from 2010 to 2023 with their hosts, the rules (teams of up to three, student and company teams), the programming environment (HP laptops, Ubuntu, allowed languages, DOMjudge), the schedule of the day (contest 13:00 to 18:00, scoreboard frozen at 17:00), registration rules for teams promoted from preliminaries, directions and a contact page. The teams page lists 50 student teams from 15 institutions and 8 company teams, each with a workstation number.

    The contest materials linked from the home page are in our copy: the final scoreboard, the problem set and solutions presentation as PDFs, and for the preliminaries a problem set PDF, a solutions presentation PDF and a merged scoreboard. The test data archives and the photo gallery are on other servers and are not in our copy.
