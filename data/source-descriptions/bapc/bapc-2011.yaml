  title: Benelux Algorithm Programming Contest 2011 - Eindhoven
  language:
  - en
  contest_date: '2011-10-15'
  description: |-
    Website of BAPC 2011 in English, with the contact page giving the study association GEWIS of Eindhoven University of Technology as the address. Our copy holds 4 pages: the home page, which describes the contest, its place in the series of rounds up to the World Finals and the date of 15 October 2011 in Eindhoven; a news page of eleven dated items from 7 January to 16 October (registration opening, C# allowed, the program booklet, the final scoreboard, the problem set); a registration page, which sends teams to the ICPC website; and a contact page. Sponsor logos appear on every page.

    Two archives that the news page links are in our copy: Finals.zip, with the finals problem PDF, a solution outlines presentation and, for problems A to J, jury solutions, sample and test input and output; and Preliminaries.zip, with the same kind of material for the preliminary round. The menu names further sections (rules, schedule, teams and others) that are not in our copy, and the standings of the preliminaries and the program booklet are linked from the news page but are not in our copy.
