  description: |-
    Problem set of the BAPC 2011 finals as a PDF of 22 pages in English. The cover names the Benelux Algorithm Programming Contest Finals and Saturday October 15th 2011; page 2 is a contents list of the ten problems A to J: Popping Balloons, Quick out of the Harbour, Find the Treasure, Bad Wiring, Undercover Pirate, Ultimate Finishing Strike, Doubloon Game, Walking the Plank, Parking Ships and Treasure Map. Each problem starts on an odd page from 3 to 21 and has a story, input and output specifications and examples; most take two pages, while problems D and G take one page each and are followed by a page marked as intentionally left blank. Problem E has notes on reading query answers and flushing output. No test data or solutions.
