  description: |-
    Category page of the Baekjoon Online Judge (in Korean) for BAPC 2011, filed under ICPC Regionals, Europe, Northwestern European Regional Contest, Benelux Algorithm Programming Contest. It lists nine problems: A, B, C, D, F, G, H, I and J; problem E is not listed. For each it gives the judge's problem number (5381 to 5389), the label, the title, and the counts of users who solved it, submissions and the acceptance ratio. Problems C, G and J carry Korean titles, the others the English names. The statements are not on the page, only the list.
