  description: |-
    Codeforces gym dashboard of BAPC 11, marked Finished, in English. It lists ten problems A to J with their names, the time limit (one or two seconds), the memory limit (256 MB) and the number of solvers of each; the menu has links to submit, status and standings. The side panel links the contest website and a statements file in English, and one question and announcement from May 2021 about problem E is posted. The statements themselves are not on the page, only the links to them.
