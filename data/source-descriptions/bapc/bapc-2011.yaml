  problems: 10
  times: true
  tries: true
  description: |-
    Final standings of BAPC 2011 as a scoreboard: 42 rows against ten problems labelled A to J. For each row it gives rank, score (the column is headed as number solved and penalty time) and one cell per problem: a count for unsolved problems, and for solved problems a count followed by time and penalty minutes in parentheses. A summary row gives 42 as the total of teams, 9 affiliations and 2 countries, 94 problems solved in all, and per problem the number submitted, the number correct and the fastest time. Geen Commentaar is first with 7 problems solved.

    The rows are in three blocks of 27, 6 and 9 rows, each with its own ranking starting at 1, and the legend names participants, companies and spectators. The first block ends with eight rows with no solved problems, the last seven of them without a rank. The last block ends with three rows named Spectator 1, 2 and 3 with no solved problems. The logo images of the affiliation column and the style sheet are not in our copy.
