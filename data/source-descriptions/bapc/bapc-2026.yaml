    Problem set of the preliminaries: a PDF of 29 pages titled "Preliminaries for the 2026 Benelux Algorithm Programming Contest", credited to The BAPC 2026 Jury under a Creative Commons Attribution-ShareAlike 4.0 licence. The cover lists 13 problems, A Ambagaata to M Manic Ceramic. Each problem has a time limit and a statement in English. Twelve have input and output format with sample input and output; problem L is interactive, with an interaction protocol and a sample interaction. Some problems have figures. No test data or solutions. The problems differ from those of the 30-page problem set titled "The 2026 Benelux Algorithm Programming Contest".
