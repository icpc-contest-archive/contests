  contest_date: '2026-10-31'
  description: |-
    Website of the 2026 Benelux Algorithm Programming Contest, hosted by Leiden University and organised by the study association De Leidsche Flesch. Our copy holds 30 pages: the home page, contest, schedule, location, registration, rules, contact, systems and teams pages, each in English, Dutch and French, plus the merged scoreboard of the preliminaries and two PDFs of the preliminaries, the problem set and the solution slides.

    The contest page lists the previous editions, BAPC 2010 to 2025, with their host universities. The schedule runs from walk-in at 8:00 to closing at 17:30 on 31 October 2026, with the contest from 11:30. The rules page adds local rules to the ICPC regional rules. The registration page gives the admission rules: at most 50 teams, every institution guaranteed one team, further teams taken in by preliminary results. The teams page lists the competing teams and their seating rooms. The merged scoreboard of the preliminaries shows 167 teams with solved problems and times for problems A to M.

    The home page links a packaged-problems zip; in our copy that file is a small placeholder, not the archive. There is no final scoreboard on the site; it is the preliminaries board only.
