  description: |-
    Codeforces gym dashboard of the contest, marked Finished, with a short note that BAPC is a contest for students of the Benelux universities and serves as a qualifier to the NWERC regional contest. A table lists the 13 problems A to M by name with time limit, memory limit (1024 MB on all 13) and the number of solvers. The contest materials are a statements PDF in English and two testing tools, as zip files, for problems B and H. The dashboard also carries Codeforces forms for questions and announcements. The statements themselves are not in our copy, only the links to them.
