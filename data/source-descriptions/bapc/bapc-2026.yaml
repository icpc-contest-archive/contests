  description: |-
    Final scoreboard produced by DOMjudge, headed "BAPC 2026 final standings": 56 teams and 13 problems labelled A to M. Each team has a rank, its name and institution, the number of problems solved and the total penalty time, and per problem either the solving time in minutes with the number of tries, or the number of tries alone for an unsolved problem. Cells are coloured for first solve, solved and tried-incorrect. First place is Binary Church of Université Catholique de Louvain with nine problems in 979 minutes.

    The 56 teams are 51 in the category BAPC and five company teams in the category BAPC companies (Booking.com, Booking.com, CWI, Ortec and Vortech). The company teams are in a separate block below the others and are ranked among themselves. A team's details list its category, affiliation, country and seating location. The page states its last update as 31 October 2026, 17:50:41 CET.
