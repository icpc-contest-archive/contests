    Final standings of 51 teams: rank, team, institution, problems solved, total time, medal, citation and site citation. Binary Church of Université Catholique de Louvain is first with nine problems and 979 minutes, followed by WWW of Delft University of Technology and Triply Linked List of Rijksuniversiteit Groningen.

    The first 35 teams carry a rank. Of them 4 get gold, 4 silver and 4 bronze medals, then 6 Highest Honors, 9 High Honors and 8 Honors. The last 16 teams are listed without a rank and with Honorable in the medal column. The site citation column holds one entry, BAPC, for the first-place team. No per-problem detail, and the five company teams of the scoreboard are not listed.
