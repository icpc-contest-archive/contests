  language:
  - en
  problems: 13
  pages: 30
  description: |-
    Problem set as a PDF of 30 pages titled "The 2026 Benelux Algorithm Programming Contest", credited to The BAPC 2026 Jury under a Creative Commons Attribution-ShareAlike 4.0 licence. The cover lists 13 problems, A Alternating Branch Cutting to M Memory Management. Each problem has a time limit and a statement in English. Eleven have input and output format with sample input and output; problem B is a two-pass problem with sample cases, and problem H is interactive, with an interaction protocol and sample interactions. Some problems have figures. No test data or solutions.
