  copy: bapc/bapc-2026/editorial/20261116-live-2d0b9e69/prelims-solutions.pdf
  title: Benelux Algorithm Programming Contest (BAPC) preliminaries 2026 Solutions presentation
  language:
  - en
  problems: 13
  pages: 170
  description: |-
    Solution slides of the preliminaries by The BAPC 2026 Jury, dated 26 September 2026: a PDF of 170 pages. It covers all 13 problems of the preliminaries, A Ambagaata to M Manic Ceramic. Each problem has slides that restate the problem in brief and add the solution step by step, so many pages are build-ups of the one before; the problem author is named on the slides. A section of jury statistics follows: 382 commits, 839 secret test cases, 237 jury and proofreader solutions, with last year's figures. The last slide thanks the proofreaders and the jury and calls for problems for BAPC 2027.
