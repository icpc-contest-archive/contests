  problems: 12
  times: true
  tries: true
  description: |-
    Scoreboard on the contest website: 64 teams against 12 problems labelled A to L. Each team has a rank, team name with institution, number of problems solved and total time under a score heading (1496 for the team in first place, from Université catholique de Louvain, with all 12 solved). Each problem cell of a solved problem gives the number of attempts and a time in minutes (for example 1/251); an unsolved problem shows only the attempt count, and 0 stands for no attempts. A last row, Summary, gives attempts and solves per problem (attempts/solves) and 290 solves in all.

    The table has two groups: 51 student teams ranked 1 to 51, then 13 company teams listed by company name, whose ranks restart at 1. The problem labels link to problem pages on another server, which are outside our copy.
