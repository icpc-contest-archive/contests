  copy: bapc/bapc-2016/website/2026-09-02-live-05e0bd35
  title: BAPC 2016
  language:
  - en
  contest_date: '2016-10-22'
  description: |-
    Website of the 2016 Benelux Algorithm Programming Contest, hosted by the Delft University of Technology, in English. Our copy holds 18 pages: 13 HTML pages and 5 PDFs. The HTML pages cover the welcome page, contest information, the preliminaries, the schedule of the contest day (contest 13:00 to 18:00), the computer system and compilers, the rules (teams of up to three, a student group and a business group), the semi-live online contest, the location, contact details, a list of 51 teams, and a results page with a scoreboard of 64 teams.

    The PDFs are the problem set of the final in two versions, the solutions slides of the final, the problem set of the preliminaries and the solutions slides of the preliminaries. The page headed Scoreboard has no content beyond the menu and the sponsor list. Two archives of test data and reference solutions, linked from the site, are not in our copy, and the photo gallery is on another server.
