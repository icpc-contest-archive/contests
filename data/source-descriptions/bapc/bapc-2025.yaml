  title: BAPC 2025 | BAPC 2025
  language:
  - en
  contest_date: '2025-10-25'
  description: |-
    Website of BAPC 2025, the Benelux Algorithm Programming Contest held on 25 October 2025 on the campus of Delft University of Technology and organised by the CHipCie committee of the study association W.I.S.V. 'Christiaan Huygens'. It is in English. Our copy holds 34 pages and documents, two of them repeating the schedule and systems pages under another address: the front page, a digital booklet, the contest, location and contact pages, the schedule with a page for each of its 11 programme items, the rules, the systems page, the team list, two news items about an online spectator contest, and a page listing the universities' preliminary contests.

    The site also holds the final scoreboard of the contest (60 teams: 51 contestants and 9 company teams), a second scoreboard for the online spectator contest (31 teams), the problem set (a PDF with 12 problems) and the jury's solution slides (a PDF of 31 pages). The same kinds of material for the preliminaries are in it as well: a merged scoreboard of 212 teams, and a problem set and solution slides with different problems.

    The photo gallery page only redirects to another site. The packaged problems (zip archives of 118 MB and 450 MB) are not in our copy, and the online spectator contest is at another address. The two scoreboard pages are without their style sheets, scripts, flags and institution logos, and the committee photo on the contact page is missing; the other pages have their style sheets, scripts and images.
