    Problem set of BAPC 2025 as a PDF of 27 pages. The cover reads "BAPC 2025 / The 2025 Benelux Algorithm Programming Contest" and lists twelve problems, A (Accidental Arithmetic) to L (Linguistic Labyrinth), followed by a copyright note: The BAPC 2025 Jury, licensed CC BY-SA 4.0.

    Each problem has a statement in English with its time limit, input and output description and sample cases; some statements carry illustrations with credits. Problem F is a multi-pass problem whose samples are shown pass by pass. The document holds no test data and no solutions.
