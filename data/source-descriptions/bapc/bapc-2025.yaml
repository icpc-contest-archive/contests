  description: |-
    Solution slides of BAPC 2025, a PDF of 31 pages titled "Benelux Algorithm Programming Contest (BAPC) 2025 Solutions presentation" by The BAPC 2025 Jury, dated October 25, 2025. They cover all twelve problems A to L, in the order K, J, I, A, G, B, H, F, D, C, E, L, with one to three slides each. The slides of each problem name its author, state the problem, describe the solution and give submission statistics (submissions, accepted, and for most an unknown count); nine of the twelve also give a running time.

    The last slides give language statistics of the submissions as a chart, random facts about the jury's work, and thanks to the jury and the proofreaders.
