  description: |-
    Final scoreboard of BAPC 2025 produced by DOMjudge, headed "BAPC 2025 final standings": 60 teams in two categories, 51 under Contestants and 9 under Company Teams, each category ranked on its own. Columns are rank, team (with institution), score and problems A to L. The score is the number of problems solved followed by the total penalty time; each problem cell gives the minutes of the accepted run and the number of tries (an unsolved cell gives tries only), and cells are coloured by the legend shown below the table: solved first, solved, tried incorrect, tried pending, untried. A single summary row at the end gives per-problem totals.

    First place goes to the team "ll twee = 1;" of Utrecht University with 12 problems solved and a score of 1307. The page states that it was last updated on Saturday 25 October 2025 at 23:06 CEST.
