    Scoreboard of the online spectator contest of BAPC 2025, produced by DOMjudge and carrying the same heading, "BAPC 2025 final standings": 31 teams, all in the category Online Spectators; the team details give an institution for 27 of them and a country for 22. Columns are rank, team, score and problems A to L, with the minutes of the accepted run and the number of tries in each problem cell, and a summary row with per-problem totals. Teams without a solved problem have no rank.

