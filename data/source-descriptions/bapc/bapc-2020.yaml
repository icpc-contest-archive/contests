    Solutions presentation of the jury, as a slide PDF of 46 pages in English, dated December 15, 2020. It covers the 11 problems A to K, each introduced with its problem author and explained over several slides, some with submission statistics. The closing slides give statistics of the jury's work (1400 commits, 425 secret test cases, 204 jury solutions), tips for the next contest, notes on DOMjudge and BAPCtools issues during the contest, and lists of proofreaders and jury members.
