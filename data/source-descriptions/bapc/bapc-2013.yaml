  title: Scoreboard BAPC 2013
  language:
  - en
  problems: 10
  times: true
  tries: true
  description: |-
    Scoreboard of BAPC 2013 as shown by DOMjudge: 51 team rows against ten problems, A to J, with solved count and total time for each team and, in each problem cell, the number of attempts and, for solved problems, the minutes plus penalty (for example 2 (80 + 20)). The affiliation column shows an institution logo and a country flag (one row has neither). The teams are listed in three separately ranked groups: 34 rows in the first (ranks 1 to 32 and two unranked teams with no solves), 10 in a group coloured as Observers (ranks 1 to 7 and three unranked rows; accounts named Spectator and Test Client are among them) and 7 company teams. Geen Syntax is first in the main group with 10 solved. The page ends with a summary row and a legend of the three categories (Participants, Observers, Company) and of the cell colours, including a colour for first solve. The page states it was last updated on 29 October 2013 at 14:10.

    The tables are complete in our copy and the logo images are kept beside the page.
