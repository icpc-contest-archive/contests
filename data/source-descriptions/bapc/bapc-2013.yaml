  title: BAPC 2013 STATS + SOLUTIONS + SCORES
  language:
  - en
  problems: 10
  pages: 22
  description: |-
    Slide deck titled BAPC 2013 STATS + SOLUTIONS + SCORES, in English; its page tree states 22 pages. It opens with charts of submissions over time, submissions by language (counts and shares) and average code length for C, C#, C++, Haskell and Java. The solution slides cover all ten problems (Flying Safely, Incognito, Administrative Difficulties, Destination Unknown, Cracking the Code, Jailbreak, Bribe, Getting Through, Hidden Camera, Encoded Coordinates), each with the approach in short points; most also give a complexity bound. A final scores slide shows a timeline from 13:00 to 18:00 for the participating teams, with their last submission and last correct submission, and the deck closes with slides saying the jury had fun and hopes to see the participants next year.

    The file is cut off at 1 MiB and has lost its trailer, so ordinary PDF readers cannot open it; the text can be recovered, but the mathematical formulas come out garbled.
