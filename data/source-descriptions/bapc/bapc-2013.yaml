- url: https://2013.bapc.eu/
  read: '2026-11-16'
  rubric: 1
  copy: bapc/bapc-2013/website/2026-10-20-wayback-45a735b8
  title: BAPC 2013
  language:
  - en
  contest_date: '2013-10-26'
  description: |-
    Website of the Benelux Algorithm Programming Contest 2013, in English, made by the organising committee of Utrecht University students. Our copy holds 10 pages: the welcome page, contest, participate, sponsors and organisation pages, two scoreboards and two PDFs. The welcome page was written after the contest ("The BAPC 2013 is over"); it names the winners and the best company team, and links the scoreboard, a scoreboard of an online contest, the problem set with jury solutions, the jury's slides, photos, the Dutch preliminaries (problem set with solutions, and screenshots of results from seven cities) and the programme booklet.

    The contest page gives the programme of 26 October 2013 (doors open at 09:15, contest from 13:00, award ceremony at 18:15), the location on the Uithof campus in Utrecht with routes, the rules, the supported languages (C#, C, C++, C++11, Haskell, Java) and the contest system (Debian Wheezy). The participate page says 38 teams will be welcomed, with at least two from each university or college and a separate competition for company teams, and lists the company teams already registered.

    Our copy also holds three zip files: the 2013 problem set, the preliminaries problem set, and a zip of the 2012 problems offered as example exercises. The jury slides and the programme booklet are cut off at 1 MiB in our copy and cannot be opened by ordinary readers. The photo link leads outside our copy.
- url: https://2013.bapc.eu/Scoreboard.html
  read: '2026-11-16'
