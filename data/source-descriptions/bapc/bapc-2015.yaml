  description: |-
    Solution slides for the 2015 Benelux Algorithm Programming Contest, a PDF of 14 slides in English made with LaTeX Beamer. The title slide names Universiteit Leiden and the date 24 October 2015. Each of the twelve problems A to L has one slide; most sketch the approach in a few lines, for example a binary search with a greedy check for Freight Train and a multi-source breadth-first search for Godzilla. Problem J, Tour de France, has two slides, one for the jury solution and one for a participant solution. The slide for problem E, titled with a trinomial triangle, holds only a figure of that triangle. The slides carry no code and no results.
