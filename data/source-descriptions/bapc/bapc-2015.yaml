  description: |-
    Final scoreboard of the Benelux Algorithmic Programming Contest 2015, produced by DOMjudge: 56 teams in three separately ranked groups, 39 Participants, 12 Company teams and 5 Spectator teams, so company and spectator teams are marked by category but are not mixed into the participants' ranking. Twelve problems, A to L. Each team row gives rank, country flag, team name with its university or company, number solved, total penalty time, and for every problem the number of attempts and, when solved, the time in minutes (for example 2/136). Solved cells are coloured and first solves are marked. A summary row gives attempts and solves per problem.

    First place among the participants is a team from Nijmegen University with 9 problems solved. The page carries a filter by affiliation, country and category, and a stamp of its last update on 26 October 2015.
