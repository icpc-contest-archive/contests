  description: |-
    Problem set of the 2015 Benelux Algorithm Programming Contest as a PDF in English on A4 pages. The cover gives the contest name and lists the twelve problems A to L: Freight Train, Physical Music, Godzilla, Hotels, The King's Walk, Map Colouring, Mario, Museum, Six Degrees, Tour de France, Wipe Your Whiteboards and Stand on Zanzibar. The cover states no date or place.

    Our copy is cut off after its first megabyte and has three readable pages: the cover, a page reading 'This is not a blank page.', and the first page of Problem A with its story, input format and output format. It ends there, without a sample. The statements of problems B to L are not in this file.
