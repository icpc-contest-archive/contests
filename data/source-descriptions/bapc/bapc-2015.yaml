  description: |-
    Kattis problem-source page for the Benelux Algorithm Programming Contest (BAPC) 2015: a table of 12 problems with the columns name, fastest, shortest, authors, full solves, ratio, difficulty and languages. The problems are the twelve of the contest, from Freight Train to Wipe Your Whiteboards, listed alphabetically by name without the contest letters. Difficulty is given as a number with a label: one problem is Easy (Stand on Zanzibar, 1.3), five are Medium and six are Hard, the highest being 7.5. English is the only language shown for every problem.

    The page also carries Kattis's filters and sorting controls. It holds the list only, not the statements.
