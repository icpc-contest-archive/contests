  title: BAPC 2015 · Benelux Algorithm Programming Contest
  language:
  - en
  contest_date: '2015-10-24'
  description: |-
    Website of the 2015 Benelux Algorithm Programming Contest, in English, organised by members of the student association De Leidsche Flesch for the contest held in Leiden on Saturday 24 October. Our copy holds 150 files, 84 of them pages. The pages cover the announcement, a contest page (languages C, C++ and Java, compilers, editors, DOMjudge 5.0 as jury system, and a day schedule from doors opening at 10:00 to the prize ceremony at 18:30), a participation page (registration closed), a page for each of six sponsors, the organising committee, four accommodation options, the venue (a building of the Leiden Faculty of Law) and a photo page.

    Results and problem material are inside. The final scoreboard of the contest has a page for each of its 56 teams and links to twelve problem statements as PDFs, two of which are cut short. Preliminary results are included for Leiden, Utrecht, Delft and Eindhoven as scoreboard pages, for two Amsterdam universities as one-page PDFs, and for Groningen as a PNG image. The problem set and solutions slides are PDFs. The home page links a score-progression graph and a ZIP archive of the 2015 problems with twelve ZIPs, one per problem; the contest page links a ZIP of the 2014 problem set.

    The 2015 preliminary problem archive linked from the contest page is not in our copy. The problem set PDF is cut off within problem A, and the photo page lists 64 photos of which 21 are in our copy.
