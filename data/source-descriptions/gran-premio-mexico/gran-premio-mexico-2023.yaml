  description: |-
    Page of the ICPC ITESO community site (Comunidad de Programación Competitiva del ITESO), in Spanish, giving the rules for qualifying to the 2023 Mexican regional round. It states that the regional takes place on 21 October 2023, hosted by the Tecnológico de Monterrey Campus Guadalajara with the Oracle México Development Center de Guadalajara, with 60 places (55 for official teams, 5 for guest teams). A notice at the top explains that three guest places were reassigned: one to the team of the host of the first ICPC Latin America championship, and two became official places added to the repechage, which the notice then puts at eight.

    The official places are listed as six numbered rules: 44 places by rank in the final standings of the Gran Premio de México 2023 (at most two teams per institution), one place for the host institution, one for the best all-women team and one for the best all-women team of the host institution, two community places and 6 repechage places, followed by five guest-team places. A link labelled as the first 47 qualified teams is at the top. The side menu lists the site's pages for the editions 2017 to 2026. Our copy is this one page; the linked list is not part of it.
