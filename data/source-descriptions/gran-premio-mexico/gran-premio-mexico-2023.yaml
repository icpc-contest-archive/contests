    Contest page of the Codeforces gym '2023 ICPC Gran Premio de Mexico 1ra Fecha' (first date), marked Finished. Its problem list has 11 problems labelled A to K, from Aliases (A) to Kingdom Power C. (K). Each row gives the problem name, standard input/output, a time limit of 1 to 5 seconds and a memory limit of 256 MB (512 MB for problem H), and a count of the form x869 beside it that links to the problem's status page.

    The page also carries the gym's menu (problems, submit, my submissions, status, standings, custom invocation) and forms for questions and announcements. The statements are on separate problem pages that are linked from the list and are not part of our copy; there are no standings on this page.
