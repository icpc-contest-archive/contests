  description: |-
    Page of the ICPC ITESO website (Comunidad de Programación Competitiva del ITESO), in Spanish, headed "Clasificación a la Eliminatoria Regional #ICPCMX2020" ("Qualification to the Regional Eliminatoria #ICPCMX2020"). It states that the Regional Eliminatoria takes place on 10 July 2021, with the Zacatecas campus of the Universidad Autónoma de Zacatecas as the provisional host, and that an online or hybrid format is under review at Latin American level.

    The page sets 60 places, 57 for competing teams and 3 for guest teams, and lists twelve numbered rules for filling them: the 44 best-placed Mexican teams in the final standing of the Gran Premio after its third date (two teams per institution at most), places for the two Zacatecas campuses and the state of Zacatecas, women-only places, the 5 best teams of the Repechaje, guest places for national olympiad participants and the ICPC Masters winner, a place for teams from indigenous communities, and two places for the university communities with most institutions. It contains no team results. Our copy is this single page, with its one photograph, which shows company logos.
