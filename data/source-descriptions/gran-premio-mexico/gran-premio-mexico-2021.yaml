  description: |-
    Page of the ICPC ITESO community site (Comunidad de Programación Competitiva del ITESO), in Spanish, giving the rules for qualifying to the 2021 Mexican regional round. It states that the regional is tentatively set for the first semester of 2022 at the Zacatecas campus of the Universidad Autónoma de Zacatecas, with 60 places (57 for official teams, 3 for guest teams), and that the format was changed to an in-person event distributed over 7 sites.

    The official places are listed as nine numbered rules: 44 places by rank in the Gran Premio de México 2021 final standings (at most two teams per institution), one place each for the Zacatecas and Jalpa campuses of the Universidad Autónoma de Zacatecas, one for another institution of the state of Zacatecas, one for the best all-women team, one for the all-women team of those two campuses (marked as converted to a guest place because no team met the restriction), one for a team from indigenous communities, two for communities, and 5 from a repechage contest. Three guest-team places follow. A link to a preliminary list of qualified teams is on the page. The side menu lists the site's pages for the editions 2017 to 2026. Our copy is this one page; the list of teams is a separate file that is not part of it.
