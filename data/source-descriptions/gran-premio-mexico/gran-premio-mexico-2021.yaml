  description: |-
    Standings of the 2021 ICPC Gran Premio de Mexico: 493 teams, each with rank, team name, institution, Solved, Time and a citation. The team in first place is Leones(0,0,0) of Universidad de Guadalajara CUCEI. 191 teams carry an ordinal place citation (First Place and so on, ranks 1 to 199, with some ranks shared or skipped) and the other 302 are marked Honorable Mention, with ranks 200 to 226. There are no per-problem results.
