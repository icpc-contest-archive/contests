  description: |-
    Page of the ICPC ITESO community site (Comunidad de Programación Competitiva del ITESO), in Spanish, giving the rules for qualifying to the 2024 Mexican regional round. It states that the regional takes place on 9 November 2024 at the EGADE Business School of the Tecnológico de Monterrey, Campus Monterrey, and that from 2024 places are shared out by the host's capacity: 60% by performance, 10% special places, 30% by performance in the repechage. For a capacity of 120 teams it numbers the places 1 to 120.

    The numbered list gives 72 places by performance in the accumulated standings after the third date of the Gran Premio de México 2024 (at most two teams per institution), then places for the host institution, two all-women team places (one open, one for the host institution), the Tecnológico de Monterrey and Tec Milenio systems, the winner of the Training Camp de México 2024, communities, guest teams, and 36 repechage places (85 to 120). Notes mark some places as confirmed, cancelled or vacant. The side menu lists the site's pages for the editions 2017 to 2026. Our copy is this one page.
