  description: |-
    Page of the ICPC ITESO community site (Comunidad de Programación Competitiva del ITESO), in Spanish, giving the rules for qualifying to the 2022 Mexican regional round. It states that the regional takes place on 18 March 2023 at an institution in the state of Jalisco, with 60 places (55 for official teams, 5 for guest teams). A link labelled as the accumulated results of the third date of the Gran Premio is at the top of the page.

    The rules are numbered: 44 places by rank in the final standings of the Gran Premio de México 2022 (at most two teams per institution), one place for the host institution, one for the best all-women team and one for the best all-women team of the host institution, one for a team from indigenous communities, three for communities, three additional places for the new host (ITESO) after a change of venue, and 5 from a repechage contest, followed by five guest-team places. The side menu lists the site's pages for the editions 2017 to 2026. Our copy is this one page; the linked results file is not part of it.
