  description: |-
    Page of the ICPC ITESO website (Comunidad de Programación Competitiva del ITESO), in Spanish. Headed "Standing a la fecha del Gran Premio 2016" ("Standing to date of the Gran Premio 2016"). The page holds one picture of a table, a link to a PDF of standings, and a note that the cumulative standing can be adjusted after scoreboard updates or reported inconsistencies, that the version online is the latest, and that the standing produced after the last date of the Gran Premio is the basis for promoting teams to the Regional Eliminatoria.

    The picture is a table titled "Gran Premio de México & Centroamérica 2016" with four groups of columns headed as dates (Primera, Segunda, Tercera and Cuarta fecha, "first" to "fourth date"), each split into points, problems and time. It is small and low-resolution, so the other column headings and the team rows cannot be read reliably. The linked PDF is not in our copy.
