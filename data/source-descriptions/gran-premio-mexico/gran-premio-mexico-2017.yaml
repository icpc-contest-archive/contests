  description: |-
    Page of the ICPC ITESO website (Comunidad de Programación Competitiva del ITESO), in Spanish. Headed "Resultado acumulado a la fecha del Gran Premio de México y Centroamérica 2017" ("Cumulative result to date of the Gran Premio de México y Centroamérica 2017"). The page holds one picture of a table, named like page 1 of the cumulative results PDF that the page links to, and a note that the result can be adjusted after scoreboard updates or reported inconsistencies, that the version online is the latest, and that the result produced after the last date of the Gran Premio is the basis for promoting teams to the Regional Eliminatoria.

    The picture is a table titled "Gran Premio de México y Centroamérica 2017" that starts with number and team columns, followed by several groups of columns each split into points, problems and time. It is small and low-resolution, so the other headings, the number of groups and the team rows cannot be read reliably. The linked PDF is not in our copy.
