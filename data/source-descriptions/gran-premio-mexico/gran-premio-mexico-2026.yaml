  description: |-
    Page of the ICPC ITESO community site (Comunidad de Programación Competitiva del ITESO), in Spanish, giving the rules for qualifying to the 2026 Mexican final (Final Mexicana). It states that the final takes place on 6 and 7 November 2026 at the Escuela Superior de Cómputo of the Instituto Politécnico Nacional, with a capacity of 80 official teams.

    The numbered list gives 45 places by performance after the third date of the Gran Premio de México 2026 (at most two teams per institution), then one place for the host institution, places for the best team with all, with exactly two and with exactly one woman, one for an all-women team of the host institution, one for another school of the host's university system, a direct place for the winner of the Training Camp de México 2026, two community places, one from a women's league, places for states not otherwise represented, and repechage places, numbering up to 80. Guest-team places follow: the national olympiad teams (OMI and OFMI), a preparatory-school team invited by the host, and places for Masters teams numbered up to 100. The side menu lists the site's pages for the editions 2017 to 2026. Our copy is this one page.
