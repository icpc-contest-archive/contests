    Contest page of the Codeforces gym '2026 ICPC Gran Premio de Mexico 1ra Fecha' (first date), marked Finished. Its problem list has 12 problems labelled A to L, from Anxiety at the restaurant (A) to Legendary Sort (L). Each row gives the problem name, standard input/output, a time limit of 0.5 to 4 seconds and a memory limit of 256 MB (1024 MB for problem D), and a count of the form x1166 beside it.

