  description: |-
    Page of the ICPC ITESO community site (Comunidad de Programación Competitiva del ITESO), in Spanish, giving the rules for qualifying to the 2025 Mexican final (Final Mexicana). It states that the final takes place on 7 and 8 November 2025 at the ITESO Universidad Jesuita de Guadalajara, and that places are shared out by the host's capacity: 70% to 80% by performance, 10% to 20% special places, 10% to 20% by performance in the repechage. For a capacity of 140 teams it numbers the places 1 to 140.

    The numbered list gives 100 places by performance in the accumulated standings after the third date of the Gran Premio de México 2025 (90 with at most two teams per institution, then 10 additional ones without that limit), then one place for the host institution, two all-women team places (one open, one for the host institution), one for the Jesuit university system, a direct place for the winner of the Training Camp de México 2025, five community places, two guest-team places, places for states not otherwise represented, and 18 repechage places (123 to 140). The side menu lists the site's pages for the editions 2017 to 2026. Our copy is this one page.
