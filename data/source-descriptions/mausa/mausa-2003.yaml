    Page of the Baekjoon Online Judge, in Korean, for the category "2003 Mid-Atlantic Regional Programming Contest" (source ICPC Regionals, North America, Mid-Atlantic Regional). A table of 9 entries gives the judge's problem number, the contest letter (a column without a heading), the title, the number of users who solved it, the number of submissions and the acceptance ratio. The letters are A to H and P. Only A, F, H and P have a title and counts; A is titled A Contesting Decision, the other three titles are in Korean. B, C, D, E and G show only the problem number and letter, without title or counts. The page gives titles only, no statements.
