    Standings of 161 teams under the heading "The 2003 ACM Mid-Atlantic USA Programming Contest sponsored by IBM", on a page titled View Standings. Each row has a rank, the team written as institution and team name joined by an arrow, a citation, the number of problems solved and a time. Places 1 to 19 are listed one by one, Virginia Tech first with 6 solved in 864. Then come tied groups: 26 teams at place 20 with 3 solved, 42 at place 46 with 2 solved, 58 at place 88 with 1 solved and 16 at place 147 with none. Citations such as First Place to Forty-sixth Place appear down to place 46, and a time only for the 19 individually ranked teams. There are no per-problem columns.
