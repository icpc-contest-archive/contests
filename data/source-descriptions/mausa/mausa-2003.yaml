  title: 2003 Mid-Atlantic Region Judges' Comments
  language:
  - en
  problems: 8
  description: |-
    Judges' comments on the 2003 Mid-Atlantic region contest, a single web page in English headed "2003 Mid-Atlantic Region Judges' Comments". It opens with general comments for teams (read the problem descriptions and the clarifications, do not ask about input that breaks the stated format, use the standard libraries), then gives a short comment on each of problems A to H, on how the problem can be solved and the difficulties or mistakes teams ran into.

    The last section lists 31 clarifications broadcast during the contest, each with its site number, problem letter, elapsed time, question and answer. The page states that no changes were made to the original problem set. It has no links; the problem statements and results are not on it.
