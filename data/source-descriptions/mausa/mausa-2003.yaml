  description: |-
    Baekjoon Online Judge page of problem 4757, "A Contesting Decision", with a Korean interface and the statement in English. It holds the full statement, input and output sections and one sample input with its output; a header table gives a time limit of 1 second, a memory limit of 128 MB and the judge's counts of submissions (16) and accepted solutions (14). The source section names two contests: the 2003 Mid-Atlantic Regional Programming Contest, problem A, and the 2004 Mid-Atlantic Regional Programming Contest, problem P. A Links section points to the same problem on the ACM-ICPC Live Archive, PKU Judge Online, ZJU Online Judge, TJU Online Judge and HDU Online Judge. The page's style sheets are not in our copy.
