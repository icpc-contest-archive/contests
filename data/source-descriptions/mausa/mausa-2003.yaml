  title: ACM Programming Contest (Mid Atlantic Region)
  language:
  - en
  contest_date: '2003-11-08'
  description: |-
    Website of the Mid-Atlantic Region ACM Programming Contest, in English, kept on a Virginia Tech server. Our copy holds 143 pages. The home page, as it stood in December 2003, lists news items from August to November 2003 and a snapshot of 9 sites, 73 schools, 161 teams and 483 competitors; the general information page gives the contest date as Saturday, November 8, 2003. Other pages cover the contest sites with their capacities, a final draft of the 2003 rules dated August 31, 2003, registration, directions, the contest staff and Virginia Tech's local contest.

    For the 2003 contest the copy holds the judges' comments on the problem set (general comments, comments on problems A to H and the clarifications issued during the contest) and a tar archive named MidAtlantic-2003. The archive holds the 17-page problem set PDF dated Nov. 8, 2003 with problems A to H, a 3-page practice problem PDF, and folders for problems A to H and a practice problem with judges' solutions and test data. The final standings pages that the news items link to are not in our copy.

    The site covers the whole host and also holds pages of other years: the 2002 standings and solutions pages, older problem sets back to 1997, and a 2004 directory with listings of nine problem folders, of which seven have some of their solution and test data files in our copy.
