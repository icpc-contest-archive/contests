    Scoreboard produced by CSUS PC^2 9.2.3: 173 teams ranked with name (usually with the institution in parentheses), number solved and penalty time, followed by one cell per problem for the eight problems A to H, each showing attempts and the time of the accepted run (or a dash when unsolved). Under each problem letter a colour is given (Yellow, Green, Silver, Black, Pink, Orange, Purple, Red), and a last column gives total attempts and solved per team. The first place is UMD Terps 1 of the University of Maryland with five problems solved.

