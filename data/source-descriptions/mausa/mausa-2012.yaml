  description: |-
    Standings of the Mid-Atlantic USA regional: 172 teams with rank, team name, institution, problems solved, time, medal, citation and site citation. There is no per-problem detail. Gold medals go to the top four teams, silver to places five to eight and bronze to places nine to twelve; the citation column gives the place in words (First Place, Second Place and so on) and Honorable Mention for the teams further down, and the site citation column names the champion of a host site. The first place is UMD Terps 1 of the University of Maryland with five problems solved with a time of 541.

    Teams that solved nothing share rank 157.
