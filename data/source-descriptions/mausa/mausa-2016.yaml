    Scoreboard produced by CSUS PC^2 9.3.3: 177 teams with name (institution in parentheses), number solved, penalty time, and one cell per problem for the eight problems A to H, each showing attempts and the time of the accepted run (or a dash when unsolved). A last column gives total attempts and solved per team, and a closing row gives submitted, first-yes and total-yes counts per problem. The first place is PriorityQueues for President of Virginia Tech with four problems solved; 54 teams solved nothing and share rank 124.

    The footer states the page was last updated on 5 November 2016. Our copy is a single page without images.
