- url: http://midatl.radford.edu/
  read: '2026-11-16'
  rubric: 1
  copy: mausa/mausa-2016/website/2026-10-20-wayback-42afdcdb
  title: Mid-Atlantic Regional ACM Programming Contest
  language:
  - en
  contest_date: '2016-11-05'
  description: |-
    Website of the Mid-Atlantic regional contest. Our copy holds 61 pages. The front page is headed 2016 Contest with the date November 5, 2016, and gives the eight states and districts of the region, nine contest sites (Christopher Newport University, Duke University, Johns Hopkins University, North Carolina State University, Radford University, Shippensburg University, UNC Chapel Hill, Washington College and Wilkes University), a list of contact roles, a summary of the contest format and scoring (five hours, teams of three, C++, Java or Python 3, 20 minutes penalty per wrong submission), the contest environment, an example schedule with the competition from 12:00 to 17:00, and a menu linking to registration, rules, scoreboard, team login, language documentation and previous problems.

    Besides the front page, our copy holds the scoreboard page, an index page headed ACM 2015 Programming Competition that links the C, C++ and Java 8 SE manuals and a PC^2 team guide (the guide itself is not in our copy), 56 pages of a C and C++ language and library reference, and two pages of the Java SE 8 documentation. The scoreboard page is the PC^2 summary of the 2016 results. No problem statements are in our copy.

    The team login page and the previous problems page are not in our copy, and further C and C++ reference pages that the site links to are missing. Registration and rules links lead to other servers.
