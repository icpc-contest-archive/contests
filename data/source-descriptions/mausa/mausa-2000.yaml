  description: |-
    Category page of the ICPC Live Archive online judge, reached through Regionals 2000 and North America - Mid-Atlantic USA, as shown on Tuesday, 26 October 2021. It lists eight problems numbered 2107 to 2114, with titles that match the 2000 contest packet apart from the punctuation of 2110, and for each the total submissions and solving percentage and the total users and solving percentage. Statements are on separate pages that are not part of this page. The page also carries the archive's menu and a login form.
