  title: ACM Programming Contest (Mid-Atlantic Region)
  language:
  - en
  contest_date: '2000-11-11'
  description: |-
    Website of the Mid-Atlantic Regional of the ACM International Collegiate Programming Contest, run from Virginia Tech and built as a set of frames. Our copy holds 71 addresses, 53 of them saved as files, 24 of those being pages or PDFs. The pages cover news (the 2000 regional is announced as complete, sponsored by IBM), the contest date of 11 November 2000, rules, registration with the participation fee, the contest sites with their capacities and registered teams, directions and the schedule for the Virginia Tech site, and the staff.

    The standings page and the problem pages in our copy are from earlier years: the standings page is headed "Contest Standings as of Fri Nov 20 17:25:05 EST 1998" and lists the top twelve teams with problems solved and penalty time, and the problem page holds the 1998 packet (a cover, a practice problem and eight problems as PDFs) with links to 1997 and 1999 sets and a judges' hints page. No 2000 results or 2000 problems are in our copy; the news page links to the results on another server.
