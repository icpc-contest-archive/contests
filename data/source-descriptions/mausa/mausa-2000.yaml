  description: |-
    Problem set as handed out at the contest: a PDF of 17 pages, each page marked as sponsored by IBM and dated 11/11/2000. The first page is a cover note with rules for submissions, the list of judge responses and a table matching the eight questions (numbered 1 to 8) to balloon colors. Each question follows with its statement, input and output description, and sample input and sample output. The questions are "Double, Double, Toil and Trouble", "Houses Divided", "The Computerized Contractor", "The "I"s Have It", "A Committee is a Beast with Many Heads and No Brain", "The New FAA", "It's time for change" and "Code name: Double-Omega VII". No test data or solutions.
