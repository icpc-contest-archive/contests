  description: |-
    Standings page titled "The 2000 ACM Mid-Atlantic USA Programming Contest sponsored by IBM": 137 teams, each with rank, institution and team name, and a citation such as First Place, Ninth Place or Honorable Mention. Ranks run from 1 to 8, then tied groups at 9 (eight teams), 17 (20 teams), 38 (32 teams) and 69 (39 teams); the last 30 teams carry no rank and the citation Honorable Mention. First place is Virginia Tech. The page gives no problems solved, penalty times or per-problem results.
