  description: |-
    Home page of the Mid-Atlantic Regional ACM Programming Contest website, in English, giving November 6, 2010 as the contest date. It lists the eight parts of the region, from the District of Columbia to West Virginia, and nine contest sites, from Christopher Newport University to Wilkes University, names the contest's organising roles, and summarises the format: five hours, teams of three, C++ or Java, 20 minutes penalty per incorrect submission. It also covers team eligibility, permitted reference materials, the distributed multi-site set-up, and a schedule for the day with the competition from 12:00 to 17:00 and results announced at 18:00.

    Our copy holds this one page. Its menu links to registration, rules, regional reports, the scoreboard and reference materials, and the site names link to the host universities' pages; none of these is in our copy, nor are the banner image and the style sheet.
