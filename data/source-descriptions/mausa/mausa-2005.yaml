  description: |-
    Website of the ACM Mid-Atlantic Region programming contest, as it stood after the 2005 contest. The front page and the general information page give the date as November 12, 2005 and describe the contest: five hours, teams of three, C++ or Java, penalty of 20 minutes per incorrect submission. Further pages cover the contest sites, rules, registration, people and a local qualifying contest. Our copy holds 115 pages.

    The 2005 results are in two board pages: a table of 154 teams with rank, name, problems solved and time, and a scoreboard of the same teams with attempts and time for each of problems A to H. The 2005 problem packet is a PDF of 18 pages with eight problems A to H, next to a four-page practice-round PDF and a zip of 71 files with judges' solutions in C++ and Java, makefiles and sample test files. Directory listings for the individual problems are included.

    The site also keeps pages of earlier years: standings of 1998, pictures of 2001, a page of 2002 problems with clarifications, the 2003 judges' comments and rules, and listings for 2002 and 2004. Some pages are older versions of the site with different menus.
