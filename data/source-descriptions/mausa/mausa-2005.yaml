    Standings of the 2005 ACM Mid-Atlantic USA Programming Contest sponsored by IBM, on a page titled View Standings: 153 teams with rank, team (institution and team name joined by an arrow), citation, number of problems solved and time. First place is the University of Maryland - College Park with 7 problems solved and a time of 996. The citation column gives a place name (First Place to Forty-ninth Place) for the 123 teams ranked 1 to 49; the 30 teams at rank 126 have none, 29 of them with 0 problems solved and one with no figures. Time is filled in only for the 24 teams with three or more problems solved. Ranks are shared by teams with equal results. There is no per-problem detail and no attempts column.
