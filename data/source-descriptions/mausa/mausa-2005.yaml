  description: |-
    Problem set of the 2005 Mid-Atlantic Regional Programming Contest, dated Nov. 12, 2005: a PDF of 18 pages in English. The first three pages hold the notes for teams (input and output through standard streams, the possible judge responses, how the score is computed) and, on the first page, a table of the eight problems A to H with their balloon colors. The problems are A Take Your Vitamins, B Packing Dominoes, C Extrusion, D Pasting Strings, E Mobiles, F Context-Free Clock, G Right-Hand Rule and H WordStack. Each has a statement with input and output format and an example. No test data or solutions.
