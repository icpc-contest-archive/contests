    Category page of the Baekjoon Online Judge for the 2005 Mid-Atlantic Regional Programming Contest, filed under ICPC Regionals, North America, Mid-Atlantic Regional. The interface is in Korean. A table lists eight problems labelled A to H, with judge problem numbers 4749 to 4756, the title, and the judge's counts of users who solved it, submissions and accepted ratio. Six titles are the English names of the contest's problems (Take Your Vitamins, Extrusion, Mobiles, Context-Free Clock, Right-Hand Rule, WordStack). Problem B has no title and no counts. Problem D carries a Korean title meaning "HTML editor", which is not the name the contest packet gives problem D. The statements themselves are not on the page.
