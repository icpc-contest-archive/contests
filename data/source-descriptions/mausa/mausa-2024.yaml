  contest_date: '2024-11-16'
  description: |-
    Website of the Mid-Atlantic Regional ACM Programming Contest, hosted on a Radford University site, in English. The home page is the 2024 contest: date 16 November 2024, an entry fee of $175 per team, registration and payment deadlines, the contest sites (Christopher Newport University, Johns Hopkins, Liberty University, NCSU, Penn State Harrisburg, Virginia Tech and Wilkes University), the states of the Mid-Atlantic region, Division 1 and Division 2, the rules of the contest, the contest environment and a sample day schedule with the contest from 13:30 to 18:30. It links the Division 1 and Division 2 scoreboards on Kattis.

    Our copy holds 150 files: seven HTML pages of the regional site (home page, registration instructions in two versions, a page of previous problem sets, a map of contest sites, the Johns Hopkins site page with its schedule for 16 November 2024, and the contest information page of the 2021-22 edition), seven style sheet, image and metadata files of that site, 117 files of C++ and Java reference documentation, and 19 files from other Radford University sites, such as course pages and a course PDF. One of the two registration pages is for the 2022 contest and the other for the 2024 contest. The scoreboards and the site pages of the other six contest sites are not in our copy.
