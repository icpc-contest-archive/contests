  description: |-
    Standings of the 2024 ICPC Mid-Atlantic USA Regional Contest, with Divisions 1 and 2 in one table of 127 teams. Each row gives rank, team, institution, problems solved, total time, medal, a citation such as "2nd place", "57th place, Division 2" or "Honorable Mention", and a site citation such as a state champion or a medal at a contest site. The Medal column names Division 1 and Division 2 medals, and some site medals. Of the 127 rows, 60 carry a Division 2 citation; Division 2 follows Division 1 in the order of ranks. There are no per-problem results.

    The table starts at rank 2, Abstract Syntax Tree of Johns Hopkins University with 13 solved in 1682 minutes; there is no row for rank 1 in our copy.
