  description: |-
    Standings page titled "The 2001 ACM Mid-Atlantic USA Programming Contest sponsored by IBM": 136 teams, each with rank, institution and team name, and a citation. Ranks run 1 to 10 for single teams, then tied groups at 11 (six teams), 17 (21 teams) and 37 (52 teams), each with its place name as citation (First Place to Tenth Place, Eleventh Place, Seventeenth Place, Thirty-seventh Place). The last 47 teams, ranked 87 (34 teams) and 124 (13 teams), have no citation. First place is Duke University's team Duke Hamurer. The page gives no problems solved, penalty times or per-problem results.
