    Problem set as handed out at the contest: a PDF of 21 pages, each page marked as sponsored by IBM and dated 11/10/2001. The first page is an introduction with the rules for submissions, the list of judge responses and a table of the eight problems A to H with balloon colors. Each problem follows with its statement, input and output description, and a sample input and sample output. The problems are "Financial Management", "I Think I Need a Houseboat", "Start Up the Startup", "A New Growth Industry", "Algernon's Noxious Emissions", "FDNY to the Rescue", "For the Porsche" and "Oh, Those Achin' Feet". No test data or solutions.
