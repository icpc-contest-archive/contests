  rubric: 1
  copy: mausa/mausa-2001/website/2026-10-20-wayback-faa6703a
  title: Midatlantic Regional ACM Programming Contest
  language:
  - en
  contest_date: '2001-11-10'
  description: |-
    Website of the Mid-Atlantic Regional of the ACM International Collegiate Programming Contest, run from Virginia Tech and built as a set of frames. Our copy holds 150 addresses, 138 of them saved as files: 29 HTML pages, 16 GIF and 11 JPEG images, and the judges' test data. The pages cover news (entries dated October and November 2001, including a link to the 2001 contest results and the test data used by the judges), general information with the contest date of 10 November 2001, rules, registration, the contest sites with their capacities, directions for the Virginia Tech site, the staff, a pictures page, and a problem page that lists the 2001 problem statements, clarifications and data and the 1997 to 2000 sets.

    The 2001 data and solutions page lists eight problems A to H with difficulty, 33 test input files, 33 test output files and the judges' solutions in C, C++ and Java, all of which are in our copy, together with the judges' comments and the clarifications issued during the contest. The problem statements PDF and the results are linked but are not in our copy of the site.
