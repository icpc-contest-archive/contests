  language:
  - en
  description: |-
    Short page of the University of Delaware about its programming teams in the 1998 ACM Mid-Atlantic Regional Programming Contest. It lists two teams, Pangaea and UDel-A, with three members each, and states that they placed 15th and 35th of 101 teams in the region. No other results, no problems, no date.
