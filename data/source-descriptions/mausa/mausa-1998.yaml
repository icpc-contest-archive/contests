  contest_date: '1998-11-14'
  teams: 138
  description: |-
    Standings of the 1998 Mid-Atlantic Regional as of 20 November 1998, with the note that the contest started on 14 November 1998. 138 teams appear in three tables. The first 12 teams are ranked with problems solved and penalty time (the top two show no penalty); Virginia Tech 1 is first with 8 problems. Five of them carry an asterisk, marking the teams that will advance to the internationals.

    The next 96 teams are listed by team number, problems solved (from 4 down to 1) and team name in the form institution and team, with a place printed only at the first team of each group (13, 28, 53 and 83). 30 more teams under 'Also Participating' have team number and name only, with the placing 109 printed at the first. There is no detail per problem.
