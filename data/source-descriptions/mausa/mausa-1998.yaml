  title: Welcome (1998 Mid-Atlantic Regional)
  language:
  - en
  contest_date: '1998-11-14'
  description: |-
    Website of the Mid-Atlantic Regional programming contest, run from Virginia Tech, in English. Our copy holds 150 files: 66 HTML pages, 10 PDF files, 25 text files, 46 images and 3 style sheets. It mixes pages of several years. The 1998 pages are a welcome page, general information giving Saturday, 14 November 1998 as the contest date, sites, directions, a team and site assignment list, rules, registration, people, and the contest standings of 20 November 1998 as a top-12 page and a full list.

    A problem sets page links the 1998 cover, a practice problem and eight problems; these ten PDF files are in our copy. The same page links the 1997 and 1999 problem sets, which are not in our copy. Other pages belong to other editions: a front page with news items from 2003 and 2004, rules, registration, sites and staff pages of later years, input data files of the 2000 contest, 2001 pictures and an index of yearly archive folders from 1998 to 2005.
