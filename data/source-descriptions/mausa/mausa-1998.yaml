  description: |-
    Problem sets page of the Mid-Atlantic Regional website, in English, with PDF links. The 1998 section lists a cover, a practice problem (Contest Budget) and eight problems: What's my Score?, The Unsinkable Ship?, Joe-Ball, No Hassle Car Insurance, Oldies, but Goodies, The Ultimate Greed, Fire! and Smart VCR.

    The page also links the 1999 problem set with a page of the judges' comments, and the 1997 problem set. Only the page is in our copy; the linked PDF files are not.
