  description: |-
    Results of the Mid-Atlantic Regional as a scoreboard, headed Final Results, in a PostScript file of three landscape pages. Page 1 is a note from the contest director: the scoring software at ODU was lost partway through the contest, so results could not be kept in real time; a protest against the judging of problem 8 was accepted after the contest and its submissions were rejudged, which showed that one team had solved it; the whole contest was then rejudged by new software and the scores reconciled with those of Saturday. Pages 2 and 3 hold the table: 65 teams, each with a team number, problems solved, penalties, attempts and solution time for each of problems 1 to 8 (written attempts:time), and the institution with the team name. Teams are ordered by problems solved and then penalties, from Duke University: Blue Warriors with four problems down to teams with none.

    The file is a PostScript file made by dvips with its text drawn as bitmap fonts, so the text cannot be extracted as plain text. The document gives no year or date.
