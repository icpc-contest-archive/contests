  teams: 144
  description: |-
    Page of the University of Delaware site of the 1999 ACM Mid-Atlantic Regional Programming Contest, held on Saturday, 6 November 1999 in Pearson Hall. It links six contest photos of teams and site staff, then gives the final standings of the whole regional contest: 144 rows with rank, team number and name, problems solved and penalty. Johns Hopkins University: Optimus Prime is first with 4 problems. The table ends 'Created by CSUS PC^2 version 7, last updated Sun Nov 07 01:29:28 GMT 1999'.

    Below the table are the pre-contest information and schedule of the day (breakfast, registration, lunch, contest from 12:00 to 5:00, dinner and announcement of winners), directions, the Sun Solaris programming environment with its compilers and editors, and a list of forbidden and allowed items. The six photos are in our copy.
