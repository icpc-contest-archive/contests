  description: |-
    Summary page of the 1999 ACM Mid-atlantic USA Regional programming contest, in English, with links to three more pages. The summary names eight host institutions (Virginia Tech, Christopher Newport University, Drexel University, Duke University, Johns Hopkins University, Lehigh University, University of Delaware and University of Scranton), says the contest drew students from New Jersey, eastern Pennsylvania, Delaware, Maryland, the District of Columbia, Virginia, West Virginia and North Carolina, and says winners selected from regional contests will advance to the World Finals in Orlando, Florida.

    Our copy holds 5 files: the summary, a style sheet, the final standings page, a 19-page PDF of the problems, and a contacts page that lists the regional contest roles with e-mail addresses.
