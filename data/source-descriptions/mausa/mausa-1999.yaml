    Problem set of the 1999 ACM Programming Contest Mid Atlantic Region, a PDF of 19 pages dated November 6, 1999, with eight problems numbered 1 to 8, each headed with the name of its input file (prog1.in to prog8.in). The problems are Where on Earth am I?, Trivial Alta-Vista, Down with Rabbitears, I Think I Need Bifocals, Ifs and Fors and Whiles, Oh My!, Ancient Catacomb Maps, The Internet Bubble and The Incredible Task Scheduler. The statements are in English with input and output formats and sample data. There is no cover page and no test data.
