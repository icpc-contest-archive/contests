  description: |-
    Website of the ICPC North America Mid-Atlantic Regional for the 2026-2027 season, in English. The front page announces the contest of Saturday 7 November 2026 and gives contest-day links to the Division 1 and Division 2 standings and problems on Kattis, the parallel open contests and video commentary, the dates for registration and payment, the eight host sites (Christopher Newport University, Johns Hopkins University, James Madison University, Millersville, North Carolina State University, Swarthmore, Virginia Tech and Washington College), the two divisions, team registration, fees and contacts.

    Our copy holds 5 pages, three of them different: the front page, an archive page that links standings for each year from 2012 to 2023 and problems for 2017 to 2023, and a hall of fame page that describes the regional's volunteer and partner awards. Two further pages repeat the archive and hall of fame pages under other addresses. The standings and problems themselves are on other servers and are not part of our copy; images and style sheets are saved with the pages.
