  contest_date: '2004-11-13'
  description: |-
    Website of the Mid-Atlantic Region ACM Programming Contest, in English, kept on a Virginia Tech server. Our copy holds 144 pages. The home page, as it stood in November 2004, lists news items from August 2003 to November 2004, among them a score board page and a team reference page announced on November 11, 2004, an updated contest day schedule and the test run; the general information page gives the contest date as Saturday, November 13, 2004. Other pages cover the contest sites with their capacities, a final draft of the 2003 rules dated August 31, 2003, registration, directions and the contest staff.

    For the 2004 contest the copy holds a directory of judges' solutions and test data with nine problem folders: auction, cabling, checkbook, contest, football, ghost, house, hubs and moles. Seven of them hold source files in our copy, and six of those also hold test input and output files (house has source files only); hubs and moles show only their directory listing. A team reference page for the 2004 contest is also in it. The 2004 problem set PDF and the score board pages are not in our copy.

    The site covers the whole host and also holds pages of other years: the 2003 judges' comments and solutions archive, a 2002 solutions page, older problem sets, and a 2005 directory with the 2005 problem set PDF of 18 pages, a practice problem PDF, a zip archive of the 2005 problems with solutions and test data, and listings of nine 2005 problem folders.
