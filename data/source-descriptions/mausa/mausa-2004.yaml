    Standings of 152 teams under the heading "The 2004 ACM Mid-Atlantic USA Programming Contest sponsored by IBM", on a page titled View Standings. Each row has a rank, the team written as institution and team name joined by an arrow, a citation, the number of problems solved and a Time column that is empty in every row. Two teams share first place with 5 solved, followed by places 3, 4, 5, 7, 8, 9 and 10, and tied groups at place 11 (11 teams, 3 solved), 26 (33 teams, 2 solved), 60 (92 teams, 1 solved) and 149 (7 teams, none solved). Citations run from First to Sixtieth Place and are blank at place 149. There are no per-problem columns.
