    Page of the Baekjoon Online Judge, in Korean, for the category "2004 Mid-Atlantic Regional Programming Contest" (source ICPC Regionals, North America, Mid-Atlantic Regional). A table of 9 entries gives the judge's problem number, the contest letter (a column without a heading), the title, the number of users who solved it, the number of submissions and the acceptance ratio. The letters are A to H and P, all with English titles: Filling Out the Team, Auctions R Us, GHOST, Doggone Moles, Line of Sight, Tangled in Cables, All Roads Lead to Albuquerque, er, Rome, Balanced Budget Initiative, and for P A Contesting Decision. The page gives titles only, no statements.
