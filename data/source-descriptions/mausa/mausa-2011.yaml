  problems: 8
  times: true
  tries: true
  description: |-
    Final scoreboard produced by CSUS PC^2 (version 9.1.6): 164 teams against 8 problems, A to H. Each team row gives rank, name with institution, problems solved, total time, attempts and time for each problem (a dash in place of the time where the problem was not solved) and the team's total attempts and solved count. Duke Lilike of Duke University is first with 6 problems solved and a time of 776. Teams with the same result share a rank, and the teams with nothing solved are ranked 159. A last row is headed Submitted/1st Yes/Total Yes and gives those three figures for each problem. The page ends with "Last updated Sat Nov 05 18:32:15 EDT 2011".
