    Baekjoon Online Judge page in Korean listing the problems of the 2011 Mid-Atlantic Regional Programming Contest, filed under the source ICPC Regionals, North America, Mid-Atlantic Regional. Nine problems, labelled A to H and P: A has a Korean title, the other eight keep the English ones (Raggedy, Raggedy; AAAA; Thunk and Plunk; Losers Are Winners; Line of Sight; Stained Glass; Road Rally; Roaming Romans). Each row gives the Baekjoon problem number, the label, the title, tags and the counts of users who solved it, submissions and the acceptance rate. The page lists the problems only; it holds no statements.
