  title: Mid-Atlantic Regional ACM Programming Contest
  language:
  - en
  contest_date: '2011-11-05'
  description: |-
    Website of the Mid-Atlantic Regional ACM Programming Contest for the contest of 5 November 2011, with the home page as it stood in December 2011. The home page lists the eight states and districts of the region and the contest sites (Christopher Newport, Duke, Howard, Johns Hopkins, Radford, Shippensburg, UNC Chapel Hill and Wilkes), with general information, contacts and the aim of the contest. Further pages cover registration (a fee of $135 per team due by 7 October 2011, a late fee, and fees for guests and alternates), reference materials, and the regional report for 2011.

    The report is a short Word-made page: 65 institutions, 166 registered teams, 8 problems, at most 6 solved, and the top six teams. The scoreboard page is the 2011 summary produced by CSUS PC^2: 164 teams with solved count, time, and attempts and time for each of problems A to H.

    Our copy holds 74 files, 68 of them pages. Beside the 2011 pages it contains a scoreboard page for the 2014 contest from the same address and folder listings of problem sets from 2002 to 2010. The 2011 problem set file and the older problem set PDFs were not captured, and the rules link leads to another server.
