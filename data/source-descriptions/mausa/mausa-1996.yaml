    Scoreboard of the 1996 ACM Mid Atlantic Regional Programming Contest, headed Final Standings, a page with a preformatted text listing. It says the standings have been reviewed and verified and were revised on 11/26 to correct minor problems with the score reporting software. The contest ran from 12:46 to 17:46 EST. 97 teams are listed in rank order, each with an unlabelled leading number, problems solved, points, eight problem columns and the college and team name. Each problem cell gives the number of attempts and the elapsed time as hours:minutes until solved, in the form attempts/HH:MM, as explained by a key at the top. The first place is Virginia Tech 1 with eight problems and 905 points, then Princeton University and Swarthmore College, also with eight. The problem columns are not labelled.
