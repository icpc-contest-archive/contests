  description: |-
    Page presenting the problems of the 1996 ACM Mid-Atlantic Programming Contest, in English. It says the problems were written in WordPerfect and are given as text files, so figures and cartoons are lost, and that there were eight problems and 97 teams. A table lists problems 1 to 8 (Cowculations, Intersecting Lines, Hi-Q, Call Forwarding, Making the Grade, Perfection, Shipping Routes, Slurpys) with the number of correct solutions, the number of teams that tried each and the minutes until the first correct solution. Each problem has a short note on its difficulty and solution and three links: the problem text, the test input with expected output, and a Java solution. A helper file for the Java solutions and a link to the complete contest results are also given. The page is marked as updated on November 18, 1996.

    Only this page is in our copy; the linked problem texts, test files and solutions are not.
