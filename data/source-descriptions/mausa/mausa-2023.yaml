  contest_date: '2024-02-24'
  description: |-
    Website of the Mid-Atlantic Regional ACM Programming Contest, hosted on a Radford University site, in English. The home page is the 2023-24 contest: date 24 February 2024, the six contest sites (Christopher Newport University, James Madison University, Johns Hopkins, UNC Chapel Hill, Virginia Tech, Wilkes University) with links to site-specific pages, the states of the Mid-Atlantic region, contacts, mission, an account of the contest format and rules, the contest environment, a sample day schedule and a note on the scoreboard. It links the Division 1 and Division 2 scoreboards on Kattis.

    Our copy holds 150 files: seven HTML pages of the regional site (home page, registration instructions in two versions, a page of previous problem sets with links to earlier scoreboards, a map of contest sites, a page of the Johns Hopkins site that gives its schedule for 16 November 2024, and the contest information page of the 2021-22 edition), seven style sheet, image and metadata files of that site, 117 files of C++ and Java reference documentation, and 19 files from other Radford University pages, among them the ACM club front page and a course PDF and PowerPoint file. Several pages are from other editions than 2023-24. The scoreboards and the site pages of the other five contest sites are not in our copy.
