    Final standings of the 2023 ICPC Mid-Atlantic USA Regional Contest, with Divisions 1 and 2 in one table of 123 teams. Each row gives rank, team, institution, problems solved, total time, medal, a citation such as "1st place, Division 1" or "Honorable Mention", and a site citation such as a state champion or a medal at a contest site. Division 1 is ranked first, led by UMD WHITE of the University of Maryland with 11 solved in 1143 minutes. There are no per-problem results. Division 2 teams follow Division 1 with continuing ranks (the first Division 2 team has rank 68), and ten teams that solved nothing share rank 114 as Honorable Mention.
