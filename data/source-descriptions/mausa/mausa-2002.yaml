  description: |-
    Problem set of 17 pages with the same cover, contest notes and eight problems A to H as the other problem set PDF of this contest, with the statements reworded where clarifications were issued during the contest. The changes are small: the rule on zeroes and the closing line "End of Output" in problems A, C, F and H, the statement that the space outside the maze is the letter O in problem B, "6 days' ride or less" in problem E, and one line of dashes lengthened in problem G. Each problem has a statement in English and an Example section. No test data or solutions.
