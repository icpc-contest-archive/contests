  description: |-
    Problem set: a PDF of 17 pages headed 2002 Mid-Atlantic Regional Programming Contest, Sponsored by IBM, with the date Nov. 16, 2002 in every page footer. The first two pages hold the contest notes (input and output rules, the possible judge responses, clarification rules) and a table of the eight problems A to H with their balloon colours.

    The problems are A Simple Question of Chemistry, An Amazing Problem (an interactive maze problem), Spelling Be, Apply a Cold Compress, A Baron Landscape, In Defence of a Garden, Cantoring Along and Chambers Ceramic Conundrum. Each has a statement in English and an Example section; all except problem B have separate Input and Output sections, while B, an interactive problem, describes the exchange with the program in its text. No test data or solutions.
