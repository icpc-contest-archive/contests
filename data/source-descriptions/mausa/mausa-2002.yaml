  title: ACM Programming Contest (Mid Atlantic Region)
  language:
  - en
  contest_date: '2002-11-16'
  description: |-
    Website of the Mid-Atlantic Region ACM Programming Contest, in English, kept on a Virginia Tech server. Our copy holds 115 pages. The home page announces the contest and gives a snapshot of 8 sites, 52 schools, 147 teams and 141 competitors; the general information page gives the contest date as Saturday, November 16, 2002. Further pages cover the contest sites with their capacities, the rules, registration, directions, the contest staff and short news items.

    For the 2002 contest the site holds a standings page with per-problem entries, the problem set as a PDF and a corrected version of it, a practice problem, a page with the clarifications issued during the contest and the judges' comments, and an archive of the judges' solutions and test data.

    The site covers more than 2002: it also has an older version of the general information page dated for the 2001 contest, an index of older problem sets back to 1997, pages of Virginia Tech's local contest, news and judges' comments from 2003, a 2004 directory of problem folders and a 2005 scoreboard. A few graphics and linked pages are not in our copy.
