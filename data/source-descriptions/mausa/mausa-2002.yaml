  description: |-
    Standings page of 138 teams and eight problems labelled A to H. Each row gives rank, team name, number solved, score, one entry for each problem as two numbers separated by a slash (a double dash in place of the second number where the problem was not solved) and a Total att/solv column. The first place is VirginiaTech3 with 8 solved; ties share a rank, and the last rank is 89, shared by the teams with one solved problem.

    For 25 teams the solved count is above zero while all eight problem entries read 0/--, so their per-problem detail is empty. The page is a plain HTML table without styling and does not print the contest name or year.
