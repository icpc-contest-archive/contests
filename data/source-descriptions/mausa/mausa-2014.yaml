  description: |-
    Website of the Mid-Atlantic Regional ACM Programming Contest, in English; our copy holds one page, its home page. It gives the 2014 contest date as November 1, 2014, the eight areas of the Mid-Atlantic Region, the nine contest sites (Christopher Newport University, Duke University, Howard University, Johns Hopkins University, Radford University, Shippensburg University, UNC Chapel Hill, Washington College and Wilkes University) with links to their own pages, and the regional contacts.

    Further sections cover the contest format (five hours, teams of three, a 20-minute penalty per incorrect submission), the contest environment (C, C++ and Java on UNIX/Linux), team eligibility, reference materials allowed, and an example schedule for the day with the competition from 12:00 to 17:00. There are no results, team list or problems on the page. The registration page and the programming language documentation it links to are not in our copy, nor are the banner image and the style sheet.
