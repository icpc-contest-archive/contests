  description: |-
    Website of the Mid-Atlantic Regional ACM Programming Contest, in English. Our copy holds five pages and a style sheet, and they are of different editions. The home page announces the 2006 contest, October 28, 2006: the states of the region, the eight contest sites, general information on the contest and its rules, what reference material teams may bring, and the day's schedule with the competition from 12:00 to 17:00. The registration page gives the fee of $135 per team, due on or before Oct 5, 2007, and the refund rules.

    Only the contest sites page is of the 2008 edition: headed "Contest Sites in Mid-Atlantic Region for 2008 ACM Programming Contest", it lists Christopher Newport University, Duke University, Johns Hopkins University, Marymount University, Radford University, Shippensburg University, Washington College and Wilkes University. A reference page links language documentation and editor quick-reference sheets, and the 2006 problem set is in our copy as a PDF of 19 pages with eight problems A to H. The scoreboard, the rules and the past problem sets are links that lead outside our copy.
