  description: |-
    Standings of the 2025 ICPC North America Mid-Atlantic Regional Contest, with Divisions 1 and 2 in one table of 111 teams (64 whose citation names Division 1 and 47 Division 2). Each row gives rank, team, institution, problems solved, total time, medal, a citation such as "1st place, Division 1", and a site citation such as a state champion or a medal at a contest site. Gold, silver and bronze medals are given in each division; UMD Red of the University of Maryland is first with 12 solved in 1454 minutes. Tied teams share a rank, and four teams solved nothing: three at the bottom of Division 1 and the last team of Division 2. There are no per-problem results.
