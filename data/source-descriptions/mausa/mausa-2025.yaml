  description: |-
    Problem set for Division 1 as a PDF of 30 pages with 13 problems labelled A to M, from Orchard Fence to Much Room for Mushrooms. A first page carries only the title Division 1. Each problem has a time limit and memory limit; twelve have a statement in English with input and output format and samples, and problem B (Blind Bottles) is interactive and has an interaction description instead. Some problems have figures. The page footers read 2025 ICPC Southeast USA Regional Division 1 with the problem letter and name, and five pages (2, 14, 22, 24 and 29) are marked as intentionally left blank. No test data or solutions.
