  read: '2026-11-16'
  rubric: 1
  copy: india/india-2016/website/2026-09-05-wayback-6ac905b9
  title: ACM ICPC India-Final 2016
  language:
  - en
  contest_date: '2016-12-30'
  description: |-
    Website of the India-Final of the 2016 ACM ICPC Asia regional contest, in English, organised jointly by NITTTR Kolkata, ABV-IIITM Gwalior and JIS University, Kolkata. Our copy is a web archive crawl of 72 saved files. The pages are the front page, with an account of the contest, its about 100 slots reserved for the top teams of the four regional sites (Amritapuri, Chennai, Kharagpur, Kolkata) and its two venues, Gwalior and Kolkata; selection rules; registration; important dates (onsite contest 29-30 December 2016); travel pages for Gwalior and Kolkata; a people page; a contact page; and a program schedule page. Two PDFs of two pages each are in the crawl: the program schedule for 29 and 30 December 2016 (main contest on 30 December) and the how-to-reach document for Gwalior. The Asia director's blog page holds only its heading.

    Two posts list the teams selected from the Chennai site and from the Kharagpur site, each as a table of 25 teams with team name and institution. The post on all four sites links to a consolidated list as a PDF that is not in our copy, and the Amritapuri category page is empty. The post on the problems consists of one line, Problems of India-Final 2016, which links to a problems PDF; that PDF is not in our copy. No results page is in the crawl.

    None of the images, style sheets or scripts is a real file: they are placeholder pages from a hosting provider, and one capture is a suspended-account page.
