  title: ACM-ICPC Asia-India Finals Mirror Contest 2016 | CodeChef
  language:
  - en
  contest_date: '2016-12-30'
  problems: 11
  description: |-
    CodeChef contest page of the ACM-ICPC Asia-India Finals Mirror Contest 2016, which the page calls a mirror contest of the ACM ICPC India Finals Contest 2016, starting with an hour's delay from the main contest. It lists 11 problems with codes INF16A to INF16L (no G) and, per problem, the number of successful submissions and the accuracy; the names include Pacman, Jumping Frogs III, Employee Voice Surveys, Forming Teams Again and Robots of Robin. The page states a duration of 5 hours on 30 December 2016, team registration steps, allowed languages (C, C++, Java, Python), the ICPC-style ranking rule with 20 penalty minutes per rejected run, that ranks freeze one hour before the end, and an announcement that a test case of problem D was removed and submissions rejudged.

    The problem names link to statement and status pages that are not in our copy, and neither is the contest ranks page the page links to.
- url: http://icpcindiafinal.in
  read: '2026-11-16'
  rubric: 1
  copy: india/india-2016/website/2026-09-05-wayback-6ac905b9
  title: ACM ICPC India-Final 2016
  language:
  - en
  contest_date: '2016-12-30'
  description: |-
    Website of the 2016 ACM ICPC India-Final, a WordPress site in English made by the organisers named on its home page: NITTTR Kolkata, ABV-IIITM Gwalior and JIS University. The contest is multi-site, held at ABV-IIITM Gwalior and at GNIT Kolkata. The home page says about 100 slots are available, all reserved for top teams from the Amritapuri, Chennai, Kharagpur and Kolkata regional sites. Other pages cover selection rules, registration (three steps, fee of Rs. 3,000), important dates (registration from 7 September 2016, onsite contest 29-30 December 2016), directions for reaching Gwalior and Kolkata, the program schedule, people, and contact details. The Asia Director's Blog page holds only a link to an external blog. Posts list the teams selected from the Chennai and Kharagpur sites, a notice for all four sites, and the problems of the India-Final; the Amritapuri category page holds no post.

    Our copy holds 72 saved files, of which 21 are HTML pages of the site (some pages saved twice) and two are PDFs of two pages each: the program schedule for 29 and 30 December at both venues, and the directions for reaching Gwalior. The consolidated team list, the selection rules, the programming environment document, the Kolkata directions and the problems are linked as PDFs but are not in our copy. The style sheet, scripts and images are not in our copy, and one saved file is an account-suspended notice.
