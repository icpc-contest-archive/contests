    Standings of the 2016 ACM-ICPC Asia India-FINAL Contest, rendered from the icpc.global public API archive: 64 teams with rank, team name, institution, number of problems solved, time and a citation. First place is mobius_treap of the International Institute of Information Technology, Hyderabad, with 8 problems solved. Places 1 to 32 carry a citation by place (First Place to Thirty-second Place) and places 33 to 64 are marked Honorable Mention.

    There is no per-problem detail, no problem labels and no contest date on the page.
