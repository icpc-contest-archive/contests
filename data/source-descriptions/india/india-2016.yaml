  read: '2026-11-16'
  rubric: 1
  copy: india/india-2016/teams/20161231-wayback-3f3f4402/page.html
  title: Teams selected for India-Final (all 4 sites) – ACM ICPC India-Final 2016
  language:
  - en
  description: |-
    Announcement post on the India-Final 2016 site, dated 28 December 2016. It links the consolidated list of teams selected from the Amritapuri, Chennai, Kharagpur and Kolkata sites as a PDF, which is not part of our copy, so the page itself names no teams. It asks selected teams to register at the ICPC site and choose India-Final by 28 December 2016, says teams from Amritapuri, Chennai and Kharagpur compete at Gwalior and Kolkata teams in Kolkata, gives the registration fee (Rs. 3,000) and the security deposit (Rs. 2,000 per team), says accommodation and food are provided from the afternoon of 29 December to the morning of 31 December 2016, and lists the documents to bring.
