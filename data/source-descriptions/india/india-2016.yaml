  description: |-
    Final standings of the 2016 ACM-ICPC Asia India-FINAL Contest: 64 teams from 39 institutions, ranked 1 to 64, each with team name, institution, number of problems solved, total time and a citation. The citation names the place for ranks 1 to 32 (First Place to Thirty-second Place) and reads Honorable Mention for ranks 33 to 64. First place is mobius_treap (International Institute of Information Technology - Hyderabad) with 8 problems solved; solved counts run from 8 down to 1. There are no per-problem columns, so it shows neither which problems were solved nor attempts.
