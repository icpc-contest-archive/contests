    Problem list of a replay contest, 重现赛 (chóngxiànsài, "replay contest"), of the 2016 ACM/ICPC Asia Shenyang Regional on the Hangzhou Dianzi University Online Judge, held on 30 October 2016 from 12:00 to 17:00. It lists 13 problems numbered 1001 to 1013, from Thickest Burger to Subsequence, each with its title and a ratio of accepted to submitted solutions (for example 351 of 387 for 1001; none submitted for 1011).

