  title_en: Northeastern University programming contest website
  language:
  - zh
  contest_date: '2016-10-23'
  pages: 126
  description: |-
    Website of the ACM-ICPC pages of Northeastern University (NEU), in Chinese. Our copy holds 126 pages. They carry the notices of the 2016 41st ACM-ICPC Asia Regional (Shenyang site): the schedule, the notice of the online round of 18 September 2016 on HDOJ, the onsite notice with team rules, a fee of 1000 yuan, registration steps and a programme for 22 and 23 October 2016 at NEU, and a table of onsite places per university.

    The site also holds notices and tables of places for the 2017 42nd and the 2018 43rd Shenyang regionals, a page linking six files of team certificates of the 42nd, training notices, lists of students in elective courses, a list of award winners of a 2016 NEU contest, and a warning in Chinese and English about fake ICPC contests. Besides the news pages, our copy has 58 pages of the site's own online judge (problem set, contest, status and ranklist pages and 33 problem pages), 17 pages of the NEU forum and a software download listing. The link to the internal wiki leads to pages that are not in our copy.
