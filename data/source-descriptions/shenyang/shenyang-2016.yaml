  description: |-
    Scoreboard of the 2016 ICPC Shenyang onsite contest, a ranklist page with a snapshot stamp of 10/24/2016 4:08:13 PM and a start of 2016-10-23 09:00. It lists 196 teams with school, rank, team name, number solved and penalty time, and a cell for each of the 13 problems A to M; the cells hold two numbers separated by a slash, and the column headings carry a pair of totals such as 185/193. Peking University's team is first with 9 problems solved and a time of 1105. Ten teams of Northeastern University are marked with an asterisk in the first column and carry a rank among the others; two teams have no problem solved. A link leads to a PDF of the problems.

    A key explains the cell colours (first to solve, solved, attempted, pending judgement), and the page notes how many gold, silver and bronze medals 10, 20 and 30 percent would give: 19, 38 and 57. Team and school names are in Chinese and in English. A menu on the page lists ranklists of other contests from 2008 to 2016.
