    Problem page on the Hangzhou Dianzi University Online Judge, shown as "Problem - 1001", with the title Pattern String. It gives the full statement in English: problem description, input, output, sample input and sample output, and a hint. The task: given a compressed string S and k compressed patterns, output the sum of the squares of the labels of the patterns that, allowing a cyclic shift, are a prefix of S. The header gives a time limit of 16000/8000 MS (Java/Others) and counts of 5 submissions and 0 accepted; the page does not name the contest or print a letter.
