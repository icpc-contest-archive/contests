  description: |-
    Problem list of a replay (重现赛, chóngxiàn sài, "replay contest") of the 2015 Shenyang regional on the Hangzhou Dianzi University Online Judge: a public contest that ran from 12:00 to 17:00 on 31 October 2015, with a header thanking Northeastern University. The table lists 13 problems numbered 1001 to 1013, from Pattern String and Bazinga to Meeting, each with the ratio of accepted to submitted solutions and the two counts. The statements are behind links and are not in our copy; the menu also links to the contest's ranklist and status pages, which are not in our copy either. The counts are those at the server time printed on the page, 13 November 2026, not at the end of the contest.
