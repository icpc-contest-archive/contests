  title: 东北大程序设计竞赛官网
  title_en: Northeastern University programming contest website
  language:
  - zh
  description: |-
    Website of the ACM-ICPC team of Northeastern University in Shenyang, in Chinese, in two layouts: a blog-style site headed 东北大程序设计竞赛官网 (Dōngběi dà chéngxù shèjì jìngsài guānwǎng, "Northeastern University programming contest website") and an older one headed 东北大学ACM-ICPC官网 (Dōngběi Dàxué ACM-ICPC guānwǎng, "Northeastern University ACM-ICPC website"). The posts are notices for the 41st, 42nd and 43rd ACM-ICPC Asia Regional (Shenyang site) with quota allocations for those contests, an electronic certificate page for the 42nd, a 2016 summer training schedule, recruiting notices and course lists for the university's ACM class, the prize list of a 2016 university contest and a warning about a fake ICPC for elementary schools. The older posts are the team's own contests of 2014 and January 2015 with solution write-ups, and a winter-break mentor assignment.

    The copy also holds the listing of a software download directory and one file from it, a forum with posts from 2012, and pages of the team's online judge (contest list, submission status, ranklist, problem pages numbered 1001 to 1036). No page of the 2015 Shenyang regional itself is in our copy. The older home page is headed as the board of the 2015 ACM-ICPC regional, Shenyang site, and links to a ranklist on another server, not in our copy; its menu lists pages on that regional's arrangements, none of them in our copy; and a sidebar names the Shenyang site at Northeastern University on 24 and 25 October among the 2015 China sites. Our copy holds 150 files, 128 of them HTML pages, six of which are redirect stubs or error messages.
