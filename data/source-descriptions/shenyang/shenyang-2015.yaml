  description: |-
    Scoreboard of the 2015 Shenyang on-site contest as an HTML ranklist headed ICPC 2015 沈阳赛区现场赛 排行榜 (Shěnyáng sàiqū xiànchǎng sài páihángbǎng, "Shenyang site on-site contest ranklist"): 172 team rows with school rank (S#), school, rank, team name, number solved and time, then one cell for each of the thirteen problems A to M. A solved problem shows two numbers separated by a slash, an attempted unsolved one a single number; the column heads give per-problem totals in the same form, and a legend names the cell colours first to solve, solved, attempted and pending. First place is TheWaySoFar from Beihang University with 8 solved and time 1157.

    A line above the table gives a snapshot time of 15:59:38 on 25 October 2015, the start 09:00 that day and 17, 34 and 51 as the numbers of gold, silver and bronze medals; the first column is coloured accordingly for 17, 34 and 51 rows. Ten Northeastern University teams carry an asterisk in that column. School names are in Chinese, team names in Chinese or English. A side menu lists ranklists of other contests from 2008 to 2015 and the team names link to per-team pages; those pages are not in our copy.
