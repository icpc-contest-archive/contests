    Standings of the Shenyang regional, a page rendered from the icpc.global public API archive and not an original page: a table of 162 teams with rank, team, institution, problems solved, time and a citation. First place is TheWaySoFar from Beihang University with 8 solved and 1157, followed by HIT_LS_So_Strong！ from Harbin Institute of Technology and Crawl from Peking University. The citations run from First Place to Eighty-first Place for 109 teams, and the 53 teams at the bottom hold Honorable Mention. No per-problem detail. The page header reads Shenyang, ICPC year 2016.
