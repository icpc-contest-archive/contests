  language:
  - zh
  - en
  problems: 13
  description: |-
    Contest page on Luogu for a replay contest, 重现赛 (chóngxiànsài, "replay contest"), of the 2017 ACM-ICPC Asia East Continent Shenyang Regional, run by Luogu on 5 July 2026 from 13:00 to 18:00. The page lists 13 problems labelled A to M, titled from BBP Formula (A) to Wandering Robots (M), each marked as a problem of the 2017 Shenyang regional. It says the problems and test data are those of the onsite contest, with Chinese statements, provided with the support of Jisuanke.

    The text is in Chinese and gives the rules: ICPC scoring with 20 minutes penalty per failed submission, teams of one to three, scoreboard frozen for the last hour, a limit on submissions of problems with long time limits, a ban on copying published solutions, and instructions for certifying contest awards. The statements, the scoreboard and the results are not part of our copy.
