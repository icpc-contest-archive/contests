  title_en: Northeastern University programming contest website
  language:
  - zh
  contest_date: '2017-10-22'
  pages: 126
  description: |-
    Website of the ACM-ICPC pages of Northeastern University (NEU), in Chinese. Our copy holds 127 pages. They carry the pages of the 2017 42nd ACM-ICPC Asia Regional (Shenyang site): the notice with the online round of 10 September 2017 on HDOJ and the onsite contest of 21 and 22 October 2017 at NEU, with team rules, fee, registration steps and programme; the rules for allotting onsite places (180 teams); the table of places per university; and a page linking six files of award certificates for teams ranked 1 to 180.

    The site also holds notices and tables of places for the 2016 41st and the 2018 43rd Shenyang regionals, a blank spreadsheet form for team details, training notices, lists of students in elective courses, a list of award winners of a 2016 NEU contest, and a warning in Chinese and English about fake ICPC contests. Besides the news pages, our copy has 58 pages of the site's own online judge (problem set, contest, status and ranklist pages and 33 problem pages), 17 pages of the NEU forum and a software download listing. The link to the internal wiki leads to pages that are not in our copy.
