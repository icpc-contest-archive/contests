  description: |-
    Scoreboard of the 2017 ACM-ICPC Shenyang onsite contest, a ranklist page with a snapshot stamp of 10/22/2017 03:51:08 PM, a start of 2017-10-22 09:00 and a note that it updates about once a minute. It lists 185 teams with school, rank, team name, number solved and time, and a cell for each of the 13 problems A to M; the cells hold two numbers separated by a slash or a single number, and the column headings carry a pair of totals such as 134/378. Peking University's team is first with 10 problems solved and a time of 1115. Five teams are marked with an asterisk in the first column (four from Northeastern University and one named PingCAP) and carry a rank among the others.

    A key explains the cell colours (first to solve, solved, attempted, pending judgement), and the page estimates the gold, silver and bronze medals at 18, 37 and 54, for reference only. School and team names are mostly in Chinese. A menu on the page lists ranklists of other contests from 2008 to 2017.
