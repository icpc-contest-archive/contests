    Problem list of a replay contest, 重现赛 (chóngxiànsài, "replay contest"), of the 2017 ACM/ICPC Asia Shenyang Regional on the Hangzhou Dianzi University Online Judge, held on 4 November 2017 from 12:00 to 17:00. It lists 13 problems numbered 1001 to 1013, from BBP Formula to Wandering Robots, each with its title and a ratio of accepted to submitted solutions (for example 12 of 21 for 1001; no submissions for 1004 and 1010).

    The page links to a problem page for each title. Those problem pages, the statements, the ranklist and the submissions are not part of our copy.
