  description: |-
    Contest page on Luogu for a replay of the 2018 ICPC Shenyang regional, held on 3 September 2026 from 13:00 to 18:00 under ICPC rules with the last hour of the scoreboard frozen, teams of one to three allowed. It says the problems and data are the originals from the on-site contest, with Chinese statements, and thanks Jisuanke for the data. The problem list is not shown in the page text, but the data inside the page names 13 problems, Sockpuppets to Renaissance Past in Nancy. The page also has the rules (20 minutes penalty per rejected submission, a limit on submissions of problems with long total time limits) and instructions for certifying awards.
