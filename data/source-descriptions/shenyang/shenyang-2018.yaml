    Codeforces Gym contest page of the regional contest, in English, with status Finished. It lists 13 problems A to M, from Sockpuppets to Renaissance Past in Nancy, each with its time limit (6 to 30 seconds), memory limit (1024 MB) and the number of solvers. Under contest materials it links an announcement and the statements as an English PDF, which are not part of our copy. The page also holds the Gym menus and forms for questions and announcements.
