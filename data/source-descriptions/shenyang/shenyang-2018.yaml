  title_en: Northeastern University programming contest website
  language:
  - zh
  - en
  contest_date: '2018-10-21'
  description: |-
    Website of the programming contest team of Northeastern University (NEU), in Chinese with an English warning notice. Our copy holds 150 saved files, 131 of them pages. For this edition it has the notice dated 14 September 2018 for the 43rd ACM-ICPC Asia Regional Contest (Shenyang): an online qualifier on 8 September 2018 on Jisuanke, the on-site contest at Northeastern University on 20 and 21 October 2018 (registration, opening and warm-up on the 20th, the contest on the 21st), team composition rules, the fee and the registration procedure. It also has a table of on-site slots (133 numbered rows of universities; columns qualifier, WF, other, total; 181 slots in all), a post of 10 December 2018 warning against fake ICPC contests in Chinese and English, and an Excel team information form.

    The site also holds posts about the 2016 and 2017 Shenyang regionals (notices, slot tables, electronic certificates), NEU training announcements, a prize list of a 2016 NEU contest, an old Discuz forum with posts from 2011 to 2013, a software download folder, and the NEU-ACM online judge with a contest list, a user ranking page, a status page and pages for problems 1001 to 1037 (1001 is marked unavailable). Our copy contains no scoreboard or result list of the 2018 contest.
