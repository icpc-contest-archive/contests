  description: |-
    Website of the ICPC Beijing Headquarters (ICPC北京总部, "ICPC Beijing Headquarters"), published by Peking University and its School of Computer Science, in Chinese. It serves the ICPC Asia East Continent (EC) regional contests as a whole, not the Shenyang contest alone. Our copy holds 67 pages, two of them PDF.

    Two notices concern this contest. The slot allocation notice for the 51st ICPC EC Shenyang regional, dated 2026-09-04 and also kept as a 2-page PDF, plans the contest for 14 and 15 November 2026 at the Nanhu campus of Northeastern University and gives 400 on-site slots: 320 from the online qualifier, 50 contribution slots, 10 for women's teams and 20 for Liaoning province, with unofficial (starred) teams possible. The invitation, dated 2026-10-17, is a 1-page PDF that is an image without a text layer. The 2026 schedule page lists Shenyang with eight other rows (seven more regionals and the EC Final in Hangzhou).

    The rest covers other contests: notices for the other regionals, online qualifier registration and rankings, news items, the advisory committees, sponsors, links, and pages of earlier seasons back to 2021, among them the 2025 Shenyang notices. No results of this contest are in our copy; the winners page for 2025-2026 lists eight sites, each linking to a PDF of winners that is not in our copy.
