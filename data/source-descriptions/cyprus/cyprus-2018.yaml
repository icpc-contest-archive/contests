  description: |-
    Single-page website of ICPC Cyprus 2018, the national programming competition held on 29 September 2018 at the University of Cyprus, written in English and signed InSPIRE. Its sections cover the mission, the rules (languages Java, Python and C++, team composition, eligibility), registration, the agenda (registration, programming competition, awards), the organising committee and the venue in Nicosia. A Past Problems section gives the full statements of three problems with input and output specification: Cake Decorations, Dessert Recipes and Marble Placement; the page does not say which contest they come from.

    The Results section is a list of four teams, not a ranked table: the first-place team Mip-Map and the second-place team Washing Machines, both from the University of Cyprus and both promoted to the South-Eastern European Regional Contest in Bucharest, and two teams with an honourable mention, The Brofessors and 1P2L. Coaches and members are named; no scores or times.

