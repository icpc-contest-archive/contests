  description: |-
    Website of the ICPC Cyprus 2019 national programming competition, in English, run by InSPIRE at UCLan Cyprus. Our copy is a single page with menu entries Home, About, Rules, Past Problems, Registration, Agenda, Committee, Venue and Results, and the sections follow one another on the page: the mission of the contest, the rules (language, team composition, eligibility, registration), three problems under Past Problems, the registration steps, a three-item agenda (registration and coffee break, programming competition, awards and feedback), the organising committee by university, and the venue in Pyla, Larnaka.

    The three problems are Cake Decorations, Dessert Recipes and Marble Placement. Each has a statement with input and output specification, and the page notes that more problems will be added. The Results section gives the first and second place teams, which represent Cyprus at the South-Eastern European regional contest, by team name, coach and members. It has no scoreboard, no standings and no other teams.

    The page has an embedded map and logos; images and style sheets are kept with our copy.
