  contest_date: '2025-10-18'
  description: |-
    Website of the ICPC Cyprus 2025 national programming competition, in English, held at UCLan Cyprus. Our copy holds one page, with images and style sheets, laid out as sections under the menu Home, About, Rules, Past Problems, Registration, Agenda, Committee, Venue and Results. It announces the contest for 18 October 2025 in sync with the Greek national contest GRCPC, and gives the mission, the general rules (teams of three students from one university, one computer per team, 5 hours, 8 to 14 problems, Java, Python and C/C++), the route from the Cyprus contest to the South Eastern Europe regional, the registration steps, a three-item agenda, the organising committee by university and the venue in Pyla, Larnaka.

    The Past Problems section only links to problems of GRCPC 2023 and 2024 and to ICPC World Finals past problems. The Results section is empty. Some text is left over from the 2019 edition: the on-site registration paragraph, the footer copyright and a link to the 2019 regional finder page.
