  description: |-
    Codeforces gym page of the 2025 ICPC Greek Collegiate Programming Contest (GRCPC 2025), marked Finished. It lists nine problems, A to I (zerorush, foodbreak, mansion, packages, javelins, audit, windowmanager, xorpairs, runnerups), each with its time and memory limit and the number of solvers, and links to a PDF of the statements in English. The page does not mention Cyprus; it is shared with the Greek contest, with which the Cyprus contest was held in sync.

    Our copy is the dashboard page only: the statements are in the linked PDF, which is not part of it.
