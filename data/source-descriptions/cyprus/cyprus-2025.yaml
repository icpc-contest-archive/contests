  description: |-
    Standings of the 2025 ICPC Cyprus Collegiate Programming Contest: 20 teams from universities in Cyprus, with rank, team name, institution, problems solved, total time, medal, citation and site citation. Neapolis University Pafos holds the first three places (gold, silver and bronze, with 9, 8 and 7 problems solved); the next 13 teams are marked Ranked and the last four, with no problem solved, are marked no rank.

    There are no per-problem columns and no attempt counts.
