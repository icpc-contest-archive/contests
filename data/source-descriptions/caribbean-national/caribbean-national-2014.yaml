  description: |-
    Home page of the ICPC Caribe website, a Google Sites page mostly in Spanish. It carries the site menu (ICPC LATAM regional contest pages, Caribbean community pages, qualifier and Caribbean Finals pages) and a notice of the 2019 Caribbean Finals, held from 6 to 10 November 2019 at the Universidad de Oriente (Cuban site) and from 8 to 9 November 2019 at the Pontificia Universidad Católica Madre y Maestra, Santiago de los Caballeros (Dominican site). The notice sits under the heading "Previous Caribbean Finals"; the page also has a short news item about balloons that links to an outside article. Nothing on this page concerns the 2014 Caribbean National Contests.
