  description: |-
    Website of ICPC Caribe, a Google Sites site mostly in Spanish; its home page announces the 2019 Caribbean Finals. It covers all the Caribbean contests and not only the 2015 National Contests. Our copy has 88 saved pages; three of them, icpc.global pages (an overview, a team list and a standings page), hold only an empty application shell with no content.

    The page on Caribbean participation in the ICPC gives year-by-year summaries of overall participation and of the local contests, national contests, qualifiers, regional contest and World Finals; for 2015 it lists 120 teams from 38 institutions in five national contests (Cuba, Dominican Republic, Puerto Rico, Jamaica, US Virgin Islands). Other pages hold podiums of the Caribbean regional contests, special awards, a history of Cuba in the contest up to 2008, rules, eligibility, registration and call-for-participation pages of the qualifier and the Caribbean Finals, results of pre-university teams, and results pages of the South American, Brazilian and Mexican and Central American regionals from 1996 to 2016. The participation page links to the icpc.global team lists of the national contests of each year from 2011 to 2019, including 2015; those lists are not in our copy.
