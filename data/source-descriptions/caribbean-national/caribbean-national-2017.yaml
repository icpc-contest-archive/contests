    Home page of the ICPC Caribe Google Sites website, in English with a Spanish news teaser, with its full site menu. The page has a heading "12th Caribbean training Camp", a heading "Previous Caribbean Finals" followed by the dates of the 2019 finals (6 to 10 November 2019 at the Universidad de Oriente, Cuban site, and 8 to 9 November 2019 at the Pontificia Universidad Catolica Madre y Maestra, Santiago de los Caballeros, Dominican site), embedded videos and a news item. It has no results, teams or problems of the 2017 Caribbean National Contests.
