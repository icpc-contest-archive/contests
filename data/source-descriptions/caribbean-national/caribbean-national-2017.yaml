  description: |-
    Website of ICPC Caribe, a Google Sites site in Spanish and English about the Caribbean ICPC contests and the Latin American regionals. Our copy holds 86 pages: 85 pages of the site and the icpc.global team-list page used as the starting address, which is an empty script shell. The site pages cover rules, eligibility, registration and contacts for the qualifier and the Caribbean Final, results pages for pre-university teams from 2017 to 2024, lists of qualified teams, a page of podiums of the Caribbean regional contests and finals with the placed teams for each year, a page of special prizes, a page listing the problem sets and editorials of each year's contests, and pages on Latin American regionals from 1996 to 2016.

    For this contest, the page on Caribbean participation gives 97 teams from 37 institutions at the 2017 Caribbean National Contests, held as four national contests (Cuba, Dominican Republic, Jamaica, Trinidad and Tobago), with UWI-JAM listed as the Jamaican site. The team list and results of this particular contest are not in our copy.
