  description: |-
    Problem set of the real contest as handed out: a PDF of 13 pages, a cover page followed by 12 pages with eleven problems, A to K, in English. The cover names the 2019 ICPC Caribbean National Contests, lists the problem set developers with their institutions or countries and gives 5 October 2019 as the date. Each problem has a statement with an input section, an output section and one or more sample cases in a two-column table of standard input and standard output.

    The problems are A Guess the number, B Which permutation, C Straight Lines, D Bridge, E Xela, F Dates, G How many, H Colors I, I Colors II, J Anagram and K White and black. The PDF holds no test data and no solutions.
