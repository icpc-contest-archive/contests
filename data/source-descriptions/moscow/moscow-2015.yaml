  description: |-
    Pages of the Northern Eurasia Contests site, the NEERC archive, in English. The first page of our copy is the archive page for NEERC 2015, which lists the finals resources and the regional contests of that year, among them Moscow, each with a link to its final standings. Our copy holds 141 saved files, which are 51 distinct pages and PDFs, many of them saved under more than one address form.

    For this contest it has the Moscow Subregional 2015 standings page, a scoreboard with problems A to L. Beside it are Moscow standings pages of 2003 to 2007 and 2016, standings pages of other regional contests of 2015 and 2016, the archive pages for 2015 and 2016, and PDFs of the NEERC finals: problem statements of 2015 (14 pages) and 2016 (15 pages) and problem reviews of 2015 (40 pages) and 2016 (49 pages). There is no announcement, rules or schedule page for the Moscow contest. The style sheet of the standings pages is not part of our copy.
