  description: |-
    Archive site of the Northern Eurasia (NEERC) contests, in English, seen through its page for the 2009 season. Our copy holds 150 saved files, which are 56 distinct pages, several of them saved more than once from different addresses. The 2009 page lists the NEERC final and the regional contests (Northwestern Russia, Southern and Volga Russia, Ural, Central Russia, Belarus and Baltics, Moscow, West Siberian, East Siberian and others) with links to standings, problem statements, tests and analyses.

    For the Moscow subregional of 2009 the site holds its final standings page (ACM ICPC 2009-2010, NEERC, Moscow Subregional Contest): 72 teams with problems A to L. The 2009 page offers no problem statements for this contest. The copy also holds standings of the NEERC finals and of other regional contests of 2009 and 2010, problem sets of the 2009 and 2010 finals and of the Northern subregional contests, a review of the 2010 finals, analyses of the Northern subregional contests of 2009 and 2010, and Moscow standings of other years (2003 to 2008, 2010 to 2017 and 2019).
