  description: |-
    Scoreboard of the Moscow Subregion contest of the ACM ICPC 2003-2004 NEERC, in English: 52 teams, nine problems labelled A to I. The clock reads 5:00:00 of 5:00:00 and the status is over. Each team row gives a cell per problem, where a plus sign marks a solved problem (a number after it counts tries), a minus sign and a number mark an unsolved problem with that many tries, and a dot marks no attempt; then a column headed = with the number solved, the time and the rank. No solve time per problem is shown.

    MSU Voodoo Chile is first with 5 problems solved and a time of 824. Ranks run from 1 to 27: 26 teams solved at least one problem, each with its own rank from 1 to 26, and the 26 teams with none share rank 27.
