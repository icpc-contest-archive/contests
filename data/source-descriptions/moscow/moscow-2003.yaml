  description: |-
    Pages of the Northern Eurasia Contests archive (NEERC), in English. The page for NEERC 2003 links the final standings of the finals, the problems in PostScript and PDF, the jury archive with sample tests, generators and checkers, and a picture gallery, and lists eleven regional contests of that season, Moscow among them, each with a link to its final standings.

    Our copy holds 150 files, which are 56 distinct addresses, many saved under http, https and port-80 forms. For 2003 it has the finals standings (problems A to K, with tries and times per problem), a problem PDF of 13 pages with problems A to K, and the standings of the regional contests, including the Moscow Subregion scoreboard with 52 teams and problems A to I. The 2004 archive page, its finals standings, problem PDF and regional standings are also inside, as are the Moscow standings pages for 2005 to 2017 and 2019.

    The jury archive, the picture gallery and the archive pages of the years other than 2003 and 2004 are linked but not in our copy, and no style sheets are saved.
