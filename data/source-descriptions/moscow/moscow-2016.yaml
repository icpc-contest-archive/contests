  description: |-
    Pages of the Northern Eurasia Contests site, the NEERC archive, in English. The first page of our copy is the archive page for NEERC 2016, which lists the finals resources and the regional contests of that year, among them Moscow, with links to their final standings. Our copy holds 141 saved files, which are 53 distinct pages and PDFs, many of them saved under more than one address form.

    For this contest it has the Moscow standings page, a scoreboard with problems A to L. Our copy also reaches into 2017: it has the archive page for 2017, the Moscow standings of 2017, and standings of other regional contests of 2016 and 2017. Moscow standings pages of 2003 to 2005, 2015 and 2019 are in it too. PDFs of the NEERC finals are problem statements of 2016 (15 pages) and 2017 (14 pages), a problem review of 2016 (49 pages) and an analysis of 2017 (14 pages). There is no announcement, rules or schedule page for the Moscow contest. The style sheet of the standings pages is not part of our copy.
