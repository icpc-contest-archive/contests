  description: |-
    Website of the Moscow quarterfinal of the ICPC (NEERC) series at icpc.msu.ru, in Russian, as it stood in September 2019. Our copy holds 15 pages: the home page headed Moscow Subregional-2018 (Московский четвертьфинал NEERC - 2018, "Moscow quarterfinal of NEERC 2018") and the news pages of the series for each year from 2016 back to 2003. The home page carries the news of the 2018 contest: a first stage, the Moscow Programming Contest, on 7 October 2018 at many sites, and a second stage on 20 October 2018 at a single site in the Nagatino business park, where places in the semifinal were decided. It also reports the outcome of the 2019 world finals and the semifinal results for Moscow teams.

    The menu links to registration, rules, quotas, schedule, team lists, standings, the judging server and statistics, but those pages are not in our copy; the news pages of 2017 and 2018 are not in it either.
