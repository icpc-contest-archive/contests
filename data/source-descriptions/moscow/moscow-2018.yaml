    Standings of the 2018 Moscow Subregional Contest: 86 teams with rank, team name, institution, problems solved, total time and a citation. The first 43 places carry citations from First Place to Forty-third Place; the other 43 teams are listed as Honorable Mention, starting at rank 44, and eleven teams at the end have no problem solved. The top three are Moscow SU: Red Panda (Moscow State University) with 10 solved and time 899, Moscow IPT: Shock Content (Moscow Institute of Physics and Technology) with 9 and 985, and HSE: IOI is not ICM, said MS (HSE University) with 8 and 848. No per-problem results.
