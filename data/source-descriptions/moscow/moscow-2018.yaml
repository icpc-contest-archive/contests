    Scoreboard headed MPC 2018 Finals, Moscow Subregional. Main Round.: 86 teams against eleven problems A to K. Each team row gives the place, the team name with its three members, and for every problem the number of wrong tries and the time of the accepted run (or the wrong tries with the time of the last one), followed by the columns Total (problems solved), Time, Dirt and SE. The column heads of the problems show accepted and submitted runs, and three rows at the foot give submits sent, accepted and Dirt per problem. Above the table are the last success (04:57:36) and the last submit (04:59:59). First place: Moscow SU: Red Panda with 10 problems and time 899. Teams with the same result share a place range such as 76-86. The style sheet is in our copy.
