  teams: 279
  description: |-
    Standings of the 2021 ICPC Moscow Regional Contest: 279 teams with rank, team name, institution, problems solved, total time, a medal column, a citation and a site citation. Thirteen teams hold First Award, 33 Second Award and 46 Third Award; the other 187 have no medal. The first 139 places carry citations from First Place on, and 140 teams are listed as Honorable Mention, six of them with no problem solved. Six teams have a site citation, First To Solve followed by the problem letters they solved first. The top three are Undertrained+Overpressured (HSE University) with 14 solved and time 1213, Log-rank conjecture (Moscow Institute of Physics and Technology) with 14 and 1750, and Yandex PTU (HSE University) with 13 and 1812. No per-problem results.
