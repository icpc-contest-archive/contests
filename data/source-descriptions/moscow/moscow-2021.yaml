    Contest page of the Codeforces gym 2021-2022 ICPC, Moscow Subregional, marked Finished, in English. A box gives Moscow as host city, Moscow State University, Moscow Institute of Physics and Technology and Higher School of Economics as host universities, and 19 December 2021 as the contest date. The problem list has fifteen problems A to O: A Non-Palindromic Modification, Gleb and Liteyny Avenue, Socks Drying, Christmas Children Circle, Construct The Integer, Build the Non-Cactus, Double Elimination, Roman Palindromes, 1\%-Euclidean, Spectacular Ending, Efficient Interception, FoodSberry, Fine Trip, Integer Perimeter and Treeshop, each with its time and memory limit and the number of gym solvers.

    The page links a statements PDF and a page for each problem, but neither is in our copy, so the statements and tests are not part of it.
