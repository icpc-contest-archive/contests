  description: |-
    Standings of the 2022 ICPC Moscow Regional Contest: 82 teams with rank, team name, institution, problems solved, total time, a medal column and a citation. Ten teams hold First Award, nine Second Award and 16 Third Award; the other 47 have no medal. The first 41 places carry citations from First Place on, and the other 41 teams are listed as Honorable Mention. The top three are FFTilted (HSE University) with 10 solved and time 1182, Log-rank conjecture (Moscow Institute of Physics and Technology) with 10 and 1667, and Machula's fun club (Moscow Institute of Physics and Technology) with 8 and 937. No per-problem results.
