  description: |-
    Scoreboard headed Moscow Regional Contest Finals: 84 numbered team rows against twelve problems A to L. Each row gives the place, the team name with the members in brackets (82 of the 84 rows name three members), and for every problem a dash when nothing was submitted, otherwise the number of wrong tries with the time of the accepted run, or the wrong tries with the time of the last run when unsolved, followed by the columns Total (problems solved), Time, Dirt and SE. The column heads of the problems show accepted and submitted runs, and three rows at the foot give submits sent, accepted and Dirt per problem. Above the table are the last success (04:59:06) and the last submit (04:59:59). First place: NRU HSE: FFTilted with 10 problems and time 1182. One team name starts with an asterisk and one row is named MRC:: no team 3. The style sheet is in our copy.
