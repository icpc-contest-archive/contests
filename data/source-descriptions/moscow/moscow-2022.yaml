  contest_date: '2022-11-20'
  description: |-
    Website of the ICPC Moscow Regional Contest (Московский четвертьфинал ICPC, "Moscow quarterfinal of the ICPC") at moscow.nerc.icpc.global, mostly in Russian. The same site was reused for later years, so our copy holds pages of several editions: 58 saved files, among them 25 HTML pages (some are header, footer or not-found stubs), plus style sheets, scripts, two icon files, a sitemap and robots files. The pictures that the pages refer to are not in our copy.

    The 2022 page announces that the contest ran in two stages, an online qualifier on 16 October and an on-site main round on 20 November 2022 at FizTekhPark, organised by Moscow State University and the Moscow Institute of Physics and Technology. It states that 87 teams from 17 Moscow universities took part in the main round, names the top three teams, gives the qualifier figures (1107 participants in 369 teams, run on Yandex.Contest), the rules for advancing from the qualifier to the main round, the schedule of the main-round day, sponsors and partners, and background on ICPC and the Northern Eurasia region. A 2022 archive page repeats the results announcement. The links to the main-round and qualifier scoreboards lead to other servers and are not in our copy.

    The copy also holds the home pages of 2023 and 2024, the 2023 main-round results table, the results table of a 2025 qualifier, three earlier captures of the 2022 home page, two of them under the names v0 and v1 and archive and photo-gallery pages for 2022 to 2024.
