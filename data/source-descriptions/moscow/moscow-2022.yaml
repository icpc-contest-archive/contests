  language:
  - en
  problems: 12
  description: |-
    Contest page of QOJ.ac titled The 2022 ICPC Moscow Regional Contest, in English. It places the contest in the category ICPC, Regionals, Northern Eurasia, Moscow Regional Contest, Moscow Subregional, and says it is also known as Tsinghua University Programming Camp. The problem list has twelve problems A to L: A Challenge For a Tourist, Brackets, Credit Cards, Doors of the Wardrobe, Effective Management, Form Processing, Go Play Wall-nut Bowling!, Hacking the Project, Inspection (32 MB ML!), Jeopardized Betting, KPI Calculation and Limited Shuffle Restoring. The page lists the ruleset (ICPC, 20 minutes penalty, 1000 submissions per problem, scoreboard frozen after 4:00:00) and marks the contest as ended.

    The page links English statements and tutorials as attachments, but those files are not in our copy, and the notice and question tables on the page are empty.
