  description: |-
    Website of the Moscow student programming olympiads (acm.msu.ru), in Russian, pages by the olympiad's organising committee, running on the ejudge system. Our copy holds 136 pages. The pages of this contest, titled "ACM ICPC 2008-2009, NEERC, Moscow Subregion", are news (the quarterfinal result of 30 October 2008, stating 77 teams from 12 universities, and the semifinal outcome of 27 November 2008), the programme of 25 and 26 October 2008 at Moscow State University, an information letter, the application procedure, university quotas based on the previous year's top 40, a training-round page, the final standings and a submission log headed "Total submissions: 1350". The standings list 79 teams with the team members' names, problems A to L with try counts and solve times, total solved and penalty; a black-and-white version of the same table is included.

    The site also holds pages of the spring 2008 olympiad, the spring and autumn 2009 olympiads, problem files of the 2001 and 2002 contests, and copies of Java and PHP documentation. The link to this contest's problem statements (a PDF) leads to a file that is not in our copy, and the one wiki address saved is a login notice.
