  description: |-
    Website of the Moscow student programming olympiads (acm.msu.ru), in Russian, run by the olympiad's organizing committee on the ejudge system. Our copy holds 143 pages (150 files). The pages of this contest, titled "ACM ICPC 2010-2011, NEERC, Moscow Subregion", are a news page (the announcement of the quarterfinal on 23 and 24 October 2010, the start of the internet tour, the extra semifinal places granted to the subregion and the teams that advanced, the appeals deadline of 27 October 2010), the front page of the on-site tour, the standings of the internet tour (35 teams against problems A to L, with try counts and solve times, total solved and penalty) and a 7-page PDF in Russian, headed "Moscow, October 24, 2010", with solutions to problems A to L.

    The seed page is the 2011 edition of the site (quarterfinal of 23 October 2011), and the copy also holds a few pages of that edition. The on-site standings, problems and rules pages of the 2010 contest are not in our copy. The rest is problem files of the 2001 and 2002 contests and copies of Java and PHP documentation.
