    Contest page on Codeforces Gym for the "2010-2011 ACM-ICPC, NEERC, Moscow Subregional Contest", marked Finished, in English. It lists 12 problems, A to L (Alien Visit, Big Number, Contest, Distance, Efficient Cartography, Finance, Golden Spire, Hometask, Interest Targeting, Joke, KMC Attacks, Lanes), each with standard input and output, a time limit (1 s; 3 s for B; 2 s for I, K and L) and a 256 MB memory limit. One announcement on problem J, about 9-digit precision, is posted. The statements are linked as a separate document and are not on the page in our copy; the rest is the site's menus and forms for questions and announcements.
