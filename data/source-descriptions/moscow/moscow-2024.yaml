    Editorial in English, a PDF of 3 pages, with a running header 'Tsinghua Bootcamp 2025, Day 5, Beijing, China, August 9, 2025'. It gives a short solution note for each of the 13 problems A to M, from A, An Experiment in Optics Lab, to M, Math, Nero and Seneca. The notes are one to a few paragraphs of solution ideas and complexity remarks with some formulas, and contain no statements, code or test data.

    The document does not name the Moscow Regional Contest; its header is that of the bootcamp day for which the problems were used.
