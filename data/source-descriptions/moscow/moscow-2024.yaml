  title: THE 2024 ICPC MOSCOW REGIONAL CONTEST
  language:
  - ru
  - en
  contest_date: '2024-11-17'
  description: |-
    Website of the 2024 ICPC Moscow Regional Contest, in Russian with English headings. The home page says the contest ran in two stages, an online qualifier that ended on 13 October and an on-site main round on 17 November 2024 at the Moscow office of VK. It reports 514 teams from 25 universities in the qualifier and 92 teams invited to the main round, names the first three places (two teams from HSE and one from MIPT), and gives the rules for advancing to the main round, the contest rules, a description of ICPC and the Northern Eurasia region with its stages, and the organisers, sponsors and partners.

    The seed page is the 2024 photo page, which shows a count of 247 photos and a press-release link. The site also holds pages of other editions: the 2022 and 2023 contests, with the main round scoreboard of 2023, and a qualifying round results page headed for 2025. It has no 2024 scoreboard page.

    Our copy holds 58 saved files, 27 of them pages, some of which are header and footer fragments and error pages.
