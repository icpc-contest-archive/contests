    Standings of the 2024 ICPC Moscow Regional Contest: 91 teams with rank, team, institution, number of problems solved, total time, medal and citation. Seven teams carry a First Award, 8 a Second Award and 18 a Third Award; the other 58 have no medal. The citation column gives the place name for the ranks up to 45 and Honorable Mention from rank 46; the last three teams share rank 89 with no problems solved. First place is Outsiders of HSE University with 11 solved. There is no per-problem detail.
