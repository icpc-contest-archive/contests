  problems: 13
  times: true
  tries: true
  description: |-
    Scoreboard of the main round of the 2024 Moscow Regional Contest: 93 teams and 13 problems labelled A to M. Each problem column heading shows accepted and total submissions, and each cell gives a plus, with the number of extra tries and the time, for a solved problem, a minus with a try count and a time for unsolved attempts, or a bare minus when none were made. Per team the table also has problems solved, penalty time and a Dirt column of percentages and an SE column. Rows below the table give submissions sent, accepted and Dirt totals per problem; above it are the last accepted and last submitted run.

    Most team names carry the institution as a prefix. Some begin with a number in parentheses and end with a fraction such as 1/5; the page does not explain them. Two teams are marked with an asterisk (School IOI Camp 1 and 2) and are ranked among the others. The last three teams share place 91 to 93 with no problems solved. First place is NRU HSE: Outsiders with 11 problems solved.
