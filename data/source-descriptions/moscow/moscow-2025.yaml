  description: |-
    Editorial in English, a PDF of 6 pages, with a running header 'Tsinghua Camp 2026, Day 5, Final Contest, Beijing, August 22, 2026'. It gives a solution write-up for each of the 13 problems A to M, from A, Arrange Jewels In Necklace, to M, Mobile Game Development Lab. The write-ups vary in length and contain solution ideas, formulas and time complexity; one (problem K) includes a pseudocode listing, and there are no problem statements or test data.

    The document does not name the Moscow Regional Contest; its header is that of the camp day for which the problems were used.
