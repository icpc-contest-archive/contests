  description: |-
    Website of the 2025 ICPC Moscow Regional Contest, in Russian with English headings. The home page says the contest ran in two stages: a qualifier on 12 October held on site at 13 Moscow universities, with more than 570 teams from more than 20 universities, and a main round on 23 November at the Skolkovo Institute of Science and Technology, to which 122 teams were invited. It names the first three places (all HSE teams), links to the main round results on Yandex.Contest, and gives the rules for advancing to the main round, the contest rules, a description of ICPC and the Northern Eurasia region with its stages, and the organisers, sponsors and partners.

    The site also holds an events archive with pages of the 2022 and 2023 contests, including the 2023 main round scoreboard, and photo pages for both years. There are no problem statements and no 2025 scoreboard inside our copy.

    Our copy holds 15 saved files, which are 7 distinct pages; several are saved more than once, under both http and https addresses.
