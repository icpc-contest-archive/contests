  description: |-
    Standings of the 2025 ICPC Moscow Regional Contest: 120 teams, each with its own rank from 1 to 120, with team, institution, number of problems solved, total time, medal and citation. Thirteen teams carry a First Award, 11 a Second Award and 33 a Third Award; the other 63 have no medal. The citation column gives the place name for ranks 1 to 72 and Honorable Mention from rank 73. First place is FFTilted of HSE University with 12 solved. There is no per-problem detail.
