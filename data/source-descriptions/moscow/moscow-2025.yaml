  description: |-
    Scoreboard of the 2025 Moscow Regional Contest from Yandex.Contest (Яндекс Контест), a contest of 5 hours with problems A to M. Our copy holds the first page of the table only: ranks 1 to 50, while the pager at the bottom lists three pages. Each problem column heading gives accepted and total submissions. Each cell gives a plus with the number of extra tries and the time for a solved problem, a minus with a try count and a time for unsolved attempts, or a dash when there were none. Per team the table gives problems solved (Очки) and penalty (Штраф); 47 of the 50 team names are prefixed with the institution, and every name is followed by three surnames in parentheses.

    Three of the 50 teams have an asterisk before the name (ranks 3, 30 and 37) and are ranked among the others; the page does not explain the mark. Below the table are the last accepted run and the last submitted run. First place is HSE U: FFTilted with 12 problems solved.
