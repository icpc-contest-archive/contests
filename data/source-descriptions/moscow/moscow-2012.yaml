  description: |-
    Final scoreboard for the Moscow Subregional 2012: the clock reads 5:00:00 of 5:00:00 and the status is over. 180 teams are listed with rank, team name followed by the names of its members, one column for each of the eleven problems A to K, the number solved and the total time. A solved problem shows a plus sign, with a count of extra tries when there were any, and the time of the accepted run; an unsolved problem with attempts shows a minus sign and the number of tries; a dot marks a problem with no attempts. Moscow SU ST is first with 9 problems solved and a total time of 827. Teams with equal results share a rank, and the last rank is 170. One team, SCH_AESC #1, carries an asterisk before its name and lists no members. Five summary rows at the bottom give, per problem, the total runs, accepted, rejected, the first accept time and the last accept time; no run was accepted for problems B and D.
