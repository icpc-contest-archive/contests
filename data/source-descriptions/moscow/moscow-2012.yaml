  description: |-
    Archive site of the Northern Eurasia (NEERC) contests, in English, with a year menu from 1996 to 2020. The 2012 page lists, for the finals, the standings, problems, official tests, and test generators with jury solutions, and for the regional contests of that year (Northwestern Russia, Southern and Volga Russia, Ural, Central Russia, Belarus and Baltics, Moscow, West Siberian, East Siberian and others) a link to each one's final standings.

    Our copy holds 150 files, 59 distinct documents: 50 pages, seven PDF files and two XML files with the standings of the Northern Subregional contests of 2012 and 2013 (the same documents are stored under several addresses). Moscow subregional standings pages for 16 editions are in it, including 2012 and 2013, along with the standings pages of the other regionals of 2012 and 2013, the NEERC 2012 and 2013 finals problem statements as PDFs and the problem reviews of those finals as PDF slides. The Moscow 2012 contest has no problem statements, test data or archive of its own here; its only page in our copy is the final standings. The test and jury archive downloads listed on the year page are not in our copy.
