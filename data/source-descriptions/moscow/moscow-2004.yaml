  description: |-
    Pages of the Northern Eurasia Contests archive, in English, captured from the 2004 year page onward. The 2004 page lists the NEERC 2004 finals (standings, problems in PDF, jury archive, history archive, runs, four picture galleries) and, under Regional Contests, the regional contests with a link to the standings of each, Moscow among them; the Moscow entry has standings only.

    Our copy holds 150 saved files, which are 59 distinct addresses once http, https and port variants are merged. They are the year pages for 2004 and 2005, the finals standings and finals problem PDF of each of those two years (the 2004 PDF has 14 pages, headed ACM ICPC 2004-2005, Northeastern European Regional Contest, St Petersburg - Barnaul - Yerevan - Tashkent, December 1, 2004), the standings pages of the regional contests of both years, and Moscow standings pages of other years (2003, 2006 to 2017 and 2019). No statements of the Moscow contest are in it, and the RAR archives, history archive, runs and picture galleries linked from the 2004 page are not in our copy.
