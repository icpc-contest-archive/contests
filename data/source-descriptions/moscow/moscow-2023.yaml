    Standings of the 2023 ICPC Moscow Regional Contest: 89 teams with rank, team, institution, number of problems solved, total time, medal and citation. Eight teams carry a First Award, 11 a Second Award and 15 a Third Award; the remaining 55 have no medal. The citation column gives the place name (First Place to Forty-fourth Place) for ranks 1 to 44 and Honorable Mention for ranks 45 to 89. First place is Yolki-palki of the Moscow Institute of Physics and Technology with 12 solved. There is no per-problem detail.
