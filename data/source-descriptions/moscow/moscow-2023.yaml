  - en
  contest_date: '2023-11-26'
  description: |-
    Website of the 2023 ICPC Moscow Regional Contest, in Russian with English page titles and a contact address at the nerc.icpc.global domain. The front page is a title with a press-release link and links to the contest's VK, YouTube and Telegram channels. The page for the 2023 contest reports the online qualifying round of 8 October, held on Yandex.Contest with 490 teams of which 90 advanced, and the on-site main round of 26 November, and names the first three places (MIPT, HSE, HSE).

    A separate page holds the main round scoreboard: 89 teams with problems A to M, accepted/submitted counts per problem in the header, an attempts-and-time entry per team and problem, total solved, penalty time and a Dirt column of percentages and an SE column, plus rows below with totals of submissions sent, acceptances and Dirt. There is also a 2023 photo page, an events archive and the pages of the 2022 and 2024 contests, and a 2025 qualifying round results page.

    Our copy holds 58 saved files, 27 of them pages; a few of those are the site's header and footer fragments and error pages.
