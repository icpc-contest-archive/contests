  description: |-
    Pages of the Northern Eurasia Contests archive, in English, captured from the 2007 year page onward. The 2007 page lists the NEERC 2007 finals (standings, problems in PDF, archive, runs and history files) and, under Regional Contests, the regional contests with a link to the standings of each, Moscow among them; the Moscow entry has standings only. The Northern subregional and the Georgia and Uzbekistan contests have problems PDFs linked as well.

    Our copy holds 150 saved files, which are 53 distinct addresses once http, https and port variants are merged: 20 for 2007 (the year page, finals standings and problem PDF, the regional standings pages, and two further problem PDFs, one of the Northern subregional contest and one for Georgia and Uzbekistan), 19 for 2008, and the Moscow standings pages of other years (2003 to 2006, 2009 to 2017 and 2019). No statements of the Moscow contest are in it, and the RAR archives linked from the 2007 page are not in our copy.
