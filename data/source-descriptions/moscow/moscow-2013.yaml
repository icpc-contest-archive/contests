  description: |-
    Crawl of the NEERC (Northern Eurasia) contest archive site, not a site made for the Moscow subregional alone. The archive pages for 2013 and 2014 list the finals and 15 or 16 regional contests of each year (Northwestern Russia, Southern and Volga Russia, Ural, Central Russia, Belarus and Baltics, Moscow, West and East Siberian, Far Eastern Russia, Uzbekistan, Kazakhstan, Armenia, Georgia, Kyrgyzstan, Azerbaijan, and Taurida in 2014), each with a link to its final standings. Only the finals and Northwestern Russia also link problem statements and tests.

    Our copy holds 142 saved files from 150 addresses (eight addresses failed). The same page is often stored under http, https and port-80 addresses, so there are 54 distinct pages, in English. Besides the two yearly pages it has the finals standings of 2013-2014 and 2014-2015, the problem statements and problem-review PDFs of those finals, the regional standings of 2013 and 2014, and some Northwestern Russia statements and analysis. Moscow standings pages are held for 2003 to 2010, 2013, 2014 and 2019; those for 2011, 2012 and 2015 to 2017 failed to download. No Moscow announcement, rules or problem statements are held, and the test and jury archives linked from the yearly pages are not in our copy.
