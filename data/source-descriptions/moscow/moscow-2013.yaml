  description: |-
    Codeforces gym dashboard of the 2013-2014 ACM-ICPC, NEERC, Moscow Subregional Contest, in the finished state with an option for virtual participation. It lists the 12 problems A to L by name (Augmented Reality Game, Blacklist, Charisma, Darkside, Edges Are Too Sharp!, Four Ways to Travel, Global Elephant Market, Hanmattan, Intersections, Jigsaw Puzzle, Top K Elements, Liar) with time and memory limits and a count such as x330 for problem A. Our copy is the dashboard page only: the statements are behind links to other pages and are not in it, and the page also carries Codeforces menus and a form for announcements.
