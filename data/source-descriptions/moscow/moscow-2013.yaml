  description: |-
    Final scoreboard for the Moscow Subregional 2013: the clock reads 5:15:00 of 5:15:00 and the status is over. 210 teams are listed with rank, team name (followed by member names for 201 of them), one column for each of the twelve problems A to L, the number solved and the total time. A solved problem shows a plus sign, with a count of extra tries when there were any, and the time of the accepted run; an unsolved problem with attempts shows a minus sign and the number of tries; a dot marks a problem with no attempts. Moscow SU Tapirs is first, followed by MAI #1 and MIPT Zzyzx. Teams with equal results share a rank, and the last rank is 209. Nine team names begin with an asterisk and list no members. Five summary rows at the bottom give, per problem, the total runs, accepted, rejected, the first accept time and the last accept time; no run was accepted for problems C, D, E and J.
