  description: |-
    Archive site of the Northern Eurasia (NEERC) contests, in English, with a year menu from 1996 to 2020. The 2013 page lists, for the finals, the standings, problems and tests, and for the regional contests of that year (Northwestern Russia, Southern and Volga Russia, Ural, Central Russia, Belarus and Baltics, Moscow, West Siberian, East Siberian and others) a link to each one's final standings.

    Our copy holds 142 files, 54 distinct pages (the same pages are stored under several addresses). It has the standings pages of the Moscow subregional for 11 editions (2003 to 2010, 2013, 2014 and 2019), the standings pages of the other regionals of 2013 and 2014, and PDFs of the NEERC finals problems and problem reviews and of some regional statements. The Moscow 2013 contest has no problem statements or test data of its own here; its only page in our copy is the final standings.
