  description: |-
    Website of the Moscow quarterfinal of NEERC 2017 (Moscow Subregional-2017), in Russian with English headings on the results pages. The home page announces the two-stage format: the first stage, the Moscow Programming Contest, on 8 October 2017 at many venues, and the second stage on 22 October 2017 at Dolgoprudny (MIPT) and Moscow (MSU). It congratulates the three top teams and reports the quota of 23 places in the NEERC 2017 semifinal.

    Our copy holds 33 pages. For 2017 they are the news feed, rules, requirements for venues, quotas for the second stage, the distribution of universities over venues, the schedules of both stages, the checking server, and three results pages: the final standings with problems A to J, saved under two addresses with identical content, and a head-to-head page of Moscow IPT against Moscow SU. Seven statistics pages cover winners, Hall of Fame, teams per university and season, numbers of teams and universities per season, semifinal and final participation of universities, and top-three places by university. News pages of earlier editions 2003 to 2016 are also in it; those of 2003 to 2008 and 2013 hold only the site menu.

    Links to the first-stage standings and to the upsolving contests lead to other servers and are not in our copy.
