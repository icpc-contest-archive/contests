    Final scoreboard of the Moscow Subregional 2017, status over at 5:00:00 of 5:00:00: 87 teams, each with rank, team name and the surnames of three members, a cell for every problem A to J, the number of problems solved and the total time. A cell gives the result sign, the number of extra tries and the time in minutes of the accepted run; a minus sign with a number marks failed tries and a dot marks no attempt. Ranks run from 1 to 78, with ties at the bottom. Nine cells are marked as first solves. First place, Moscow IPT: Cryptozoology, solved 9 problems in 1006 minutes.

    The bottom rows give, for each problem, the total runs, accepted, rejected, first accept and last accept. A Show time switch hides the times.
