    Final standings of the Moscow Subregional Contest, a results table headed "NEERC Moscow Subregional Contest 2011" with status over (5:00:00 of 5:00:00). It ranks 124 teams, each shown as institution and team name followed by the member names, with a cell for each of problems A to L: a solved problem shows + or +N with the time of the accepted run (for example 26:58), an unsolved problem with failed attempts shows -N, and an untried problem a dot (N is the number of failed attempts). A "Show time" box hides or shows the times. The last columns are the number solved and the penalty time. Ranks run to 122 because of ties; three teams solved no problem. The first place solved 9 problems. Cells of the first team to solve a problem are marked. Below the table five rows give, for each problem, the total runs, accepted runs, rejected runs, and the time of the first and last accepted run.
