  description: |-
    Archive site of the Northern Eurasia (NEERC) contests, in English, seen through its page for the 2011 season. Our copy holds 150 saved files, which are 58 distinct pages, several of them saved more than once from different addresses. The 2011 page lists the NEERC final and the regional contests (Northwestern Russia, Southern and Volga Russia, Ural, Central Russia, Belarus and Baltics, Moscow, West Siberian, East Siberian and others) with links to standings, problem statements and analyses.

    For the Moscow subregional of 2011 the site holds its final standings page (NEERC Moscow Subregional Contest 2011) with per-problem tries and times. The 2011 page offers no problem statements for this contest. The copy also holds standings of the NEERC finals and of other regional contests of 2011 and 2012, problem sets of the 2011 and 2012 finals and of some regional contests, an analysis presentation of the 2011 finals, a review of the 2012 finals, and Moscow standings of other years (2003 to 2010, 2012 to 2017 and 2019).
