  description: |-
    Pages of the Northern Eurasia Contests archive, in English, captured from the 2005 year page onward. The 2005 page lists the NEERC 2005 finals (standings, problems in PDF and PostScript, problem and history archives) and, under Regional Contests, the regional contests with a link to the standings of each, Moscow among them; the Moscow entry has standings only.

    Our copy holds 150 saved files, which are 56 distinct addresses once http, https and port variants are merged. They are the year pages for 2005 and 2006, the finals standings and finals problem PDF of each of those years (14 pages dated November 30, 2005, and 15 pages dated November 29, 2006), a problem PDF of the 2006 Northern subregional contest, the standings pages of the regional contests of both years, and Moscow standings pages of other years (2003, 2004, 2006 to 2017 and 2019). No statements of the Moscow contest are in it, and the RAR archives and PostScript file linked from the 2005 page are not in our copy.
