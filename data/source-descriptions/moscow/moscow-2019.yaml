    Scoreboard titled Moscow Regional Contest 2019, showing 5:00:00 of 5:00:00 and status over: 97 teams against eleven problems A to K. Each row gives the rank, the team name with its three members, and for every problem either a dot (no attempt), a plus with the time of the accepted run as minutes and seconds (with the number of earlier wrong tries when there were any), or a minus with the number of wrong tries, followed by the number of problems solved and the total time. Five rows at the foot give total runs, accepted, rejected, first accept and last accept per problem. First place: NRU HSE: Logarifmya4ka with 9 problems and time 897. The ranks run from 1 to 89; nine teams with no problem solved share rank 89. The page links a style sheet, which is in our copy.
