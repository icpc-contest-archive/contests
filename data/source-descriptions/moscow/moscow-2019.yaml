    Contest page of the Codeforces gym 2019-2020 ICPC, Moscow Subregional, marked Finished, in English. A box gives Moscow as host city, Moscow State University, Moscow Institute of Physics and Technology and Higher School of Economics as host universities, and 26 October 2019 as the contest date. The problem list has eleven problems A to K: Quantum Supremacy, Post-capitalism, Huawei Frequencies Selection, JCPC Registration System, Raiffeisenbank Logistics, Toll Road, Yandex Museum, Rebellious Sequences, Minimax Limit, You Are Given a Tree and Dynamic Traffic with MegaFon, each with its time and memory limit and the number of gym solvers.

    The page links a statements PDF and a page for each problem, but neither is in our copy, so the statements and tests are not part of it.
