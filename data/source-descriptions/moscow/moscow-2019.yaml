  description: |-
    Archive section of the Northern Eurasia Contests website (neerc.ifmo.ru), in English. It is the site of the whole Northern Eurasia region, not of the Moscow contest alone. Our copy holds 142 pages, which are 65 distinct addresses once the http, https and port variants of the same page are merged.

    The archive page for NERC 2019 lists the contest final's standings, problems, jury archive and analysis, then the regional contests; for Moscow it says that no information is available. The Moscow Regional Contest 2019 standings page is nevertheless in our copy, together with the Moscow standings pages of 2003 to 2017, and the standings pages of other regionals of 2019 and 2020 (Ural, Northwestern Russia, Armenia, Georgia, Kazakhstan and others). It also holds the statement and tutorial PDFs of the NERC 2019 contest and of the 2020 online and offline contests, and the statements and tutorials of Northwestern Russia 2019.
