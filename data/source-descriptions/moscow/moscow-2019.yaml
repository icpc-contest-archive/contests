  description: |-
    Standings of the 2019 Moscow Regional Contest: 97 teams with rank, team name, institution, problems solved, total time, a medal column and a citation. Five teams hold First Award, eight Second Award and 21 Third Award; the other 63 have no medal. The first 48 places carry citations from First Place on, and 49 teams are listed as Honorable Mention, nine of them with no problem solved. The top three are Logarifmya4ka (HSE University) with 9 solved and time 897, Moscow SU: NoNames (Moscow State University) with 9 and 1191, and Godnotent (Moscow Institute of Physics and Technology) with 9 and 1528. No per-problem results.
