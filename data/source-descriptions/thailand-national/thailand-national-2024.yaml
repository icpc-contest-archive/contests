  description: |-
    Website of the ICPC Thailand National Competition 2024, in English, hosted by the Department of Computer Engineering, Faculty of Engineering, Chulalongkorn University in Bangkok. Our copy holds 10 distinct pages (the home page was fetched under two addresses): eight web pages (home page with sponsor tiers and the registration period of 1 July to 5 August 2024, about, schedule, contest rules, travelling, registration (closed), a past-contests page, and the team announcement page) and two PDFs.

    The schedule covers an internal round on 17 and 18 August and a national round on 7 and 8 September 2024, with the contest session on 8 September, 9:00 to 14:00. The rules page says the contest follows the ICPC Regional rules for 2023/24 and lasts five hours. The team announcement page states 57 registration responses and shows team name, university, faculty and department, but only the first six teams are in our copy; it has no results. The two PDFs are the national round's tutorial slides and the internal round's solution sketch, 34 pages. The past-contests page links per-problem solution files and the home page links a scoreboard archive; those files are not in our copy.
