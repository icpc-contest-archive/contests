  title_en: Mahidol University hosts the national programming contest ACM-ICPC Thailand National Contest 2015
  language:
  - th
  - en
  description: |-
    News item in Thai, posted on 19 September 2020 on the site of the Mahidol University Archives and Museums Division, about the ACM-ICPC Thailand National Contest 2015. It reports that the contest was opened by a Mahidol University vice president and was hosted by the Faculty of Information and Communication Technology together with the Software Industry Promotion Agency (SIPA), on 22 and 23 October 2015 at the Salaya campus in Nakhon Pathom. It says the teams ranked 1 to 10 go on to the ACM-ICPC Asia Regional contest of 19 and 20 November 2015 at Prince of Songkla University, Phuket Campus, and mentions the 2016 World Finals at the same campus. The page also carries the site's menus and holds no results or problems.
