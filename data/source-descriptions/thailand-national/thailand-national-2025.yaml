    Problem D, "Do You Want to Build a Christmas Tree?", in the Codeforces Gym contest "ICPC Thailand National Contest 2025 (Partial)", which the sidebar marks Finished and Practice. The page gives a time limit of 1 second, a memory limit of 256 megabytes, standard input and output, and the full statement in English with input and output sections, one example and a note; the task is to build a tree in which every node has degree at most three and exactly P, Q and R pairs of nodes lie at distance 1, 2 and 3, or print -1. The sidebar's About Contest note says the problems come from the ICPC Thailand National Contest 2025, and a Statements (en) link leads to a ZIP file that is not in our copy.

