  description: |-
    Website of the ICPC Thailand National Contest 2025, in English, held at the School of Science of King Mongkut's Institute of Technology Ladkrabang (KMITL), Bangkok. Our copy holds three pages: the home page, the Team List page, and a second address of the Team List page with the same content. The home page states 6th - 7th September 2025 as the contest dates, says registration has closed, describes ICPC and the host, lists 26 distinct university names (the list is repeated in the page), and gives the awards (scholarships of 25,000, 20,000 and 15,000 baht for the first three teams, and 3,000 baht for the first team to solve each problem).

    It also holds the software specification: the editors and IDEs available and the compilers and flags for Java, C, C++, Kotlin and PyPy3. The rules section says only that the rules are to be announced, and the sponsor section says sponsors are to be announced. The counters for participating universities and registered teams read 0 and the Team List page lists no teams, so the data that fills them is not in our copy. The Schedule, About and Location menu entries are not pages of our copy; no results, problems or scoreboard are in it.
