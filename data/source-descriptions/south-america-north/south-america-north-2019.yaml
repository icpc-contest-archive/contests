  description: |-
    Final scoreboard of ICPC LATAM 2019 in the format of BOCA, shared by all the Latin American sites of the contest, not only South America-North. It lists 368 distinct team accounts with rank, a user/site code ending in a country code (for example teambrbr20/BR), the team name with a bracketed tag such as [USP], one column per problem A to M giving the number of attempts and, for an accepted problem, the time (a dash instead of a time where the problem was not accepted), and the number of problems solved with penalty time. A row of selectors (global, cbrd, cbcu, caribe, mxmx, cacr, caes, centroamerica, noco, novz, north, soar, sobv, soch, sope, south, brbr and five views whose names start with ccl) switches between the overall board and other views, so teams appear several times in the table; 49 of the accounts carry the country codes CO (40) or VE (9). Links to statistics, clarifications and the run list lead to pages that are not part of our copy.
