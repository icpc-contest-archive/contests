  description: |-
    Problem set of the contest session as a PDF of 22 pages. The cover reads "International Collegiate Programming Contest 2019, Latin American Regional Contests, November 8th-9th, 2019, Contest Session", states that the set has 13 problems on pages numbered 1 to 20, and lists the countries hosting simultaneous contests with it: Argentina, Bolivia, Brasil, Chile, Colombia, Costa Rica, Cuba, Ecuador, El Salvador, México, Perú, República Dominicana and Venezuela. A page of general information on program names, input and output follows.

    The problems are A Algorithm Teaching, B Build the Perfect House, C Cut Inequality Down, D Dazzling Stars, E Eggfruit Cake, F Fabricating Sculptures, G Gluing Pictures, H Hold or Continue?, I Improve SPAM, J Jumping Grasshopper, K Know your Aliens, L Leverage MDT and M Mountain Ranges, each in English with input and output sections and sample inputs and outputs. No test data or solutions.
