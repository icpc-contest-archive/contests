  description: |-
    Unofficial final scoreboard of the 2014 ICPC Latin America contests of 8 November 2014, produced by BOCA, covering all Latin American sites and not only South America North. Eleven problems A to K; each team row gives the user and site code (for example COL, BRA, BOL), the team name, one tries/time cell per problem, and a total as problems solved with penalty time in brackets. The first place in the General view has 10 problems solved. Tabs select the General view, the regions (Caribbean, NorthRegion, SouthRegion, Mexico_CostaRica) and the countries (Brasil, Colombia, Venezuela, Panama, Argentina, Bolivia, Chile, Peru, Cuba, RepDominicana); our copy holds all of these views in one page, with 1093 team rows in total and 404 distinct teams (the General view has 404 rows). The NorthRegion view has 70 rows, from the codes COL (40), VEN (28) and PAN (2).
