  description: |-
    Contest report page of the 2026 ICPC Latin America Regional Finals, produced by MOJ, with the open final scoreboard (no freeze) of all sites together. The header states the contest ran on 2026-11-07 from 17:00 to 22:00, five hours, ICPC mode with a 20 minute penalty per rejected attempt, scoreboard freeze at 240 minutes, 563 teams and 6195 submissions.

    The scoreboard has 563 rows: 528 ranked teams, with ties sharing a rank, and 35 unofficial guest teams marked [CCL] with a dash instead of a rank. Each row gives the team name with its institution, tries and time in minutes for each of the 13 problems A to M, a star on the first solve, problems solved and penalty. Many rows add a camera mark and, for 83 teams, a note on qualifying for the 2027 ICPC Latin America Championship in Monterrey, Mexico, July 13 to 17, 2027, with the basis of the place (for example performance or reserve).

    Above the table are links to three English PDFs (problem set, judging environment, time limits) and a table of the 13 problems A to M, Antonia's Ants to Moving Mountains, each with its author and a link to an HTML statement. Menu links lead to runs, clarifications, statistics, machines, qualified teams, staff tasks and the frozen scoreboard, none of which is in our copy. The filter menus (flag, university, site) need scripts to work.
