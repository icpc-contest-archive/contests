  description: |-
    Final scoreboard of the 2023 Latin American Regional Contests as produced by BOCA, one shared board for all participating countries: 424 distinct teams, of which 20 have user names starting ccl and 17 of those also carry [CCL] in the team name. Each row gives rank, user name and site code with country, team name with institution, tries and time in minutes for each of the 13 problems A to M (a dash in place of the time where the problem was not solved), and the number solved with total penalty in parentheses.

    The single table lists each team three or four times, once for each score view it belongs to: the page offers Global, Global+CCL, Brasil, CentroAmerica, Caribbean, Mexico, North (Colombia and Venezuela), South and CCL. The table has 1,557 rows in all. Links at the top lead to the contest and warm-up information sheets, problem sets and time limits, an editorial, runs, tasks, clarifications and statistics pages, and two BOCA package archives; the linked pages other than the scoreboard are not part of this document. Style sheets and images are kept with our copy.
