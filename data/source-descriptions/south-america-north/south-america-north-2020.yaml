  description: |-
    Scoreboard of the 2020 Latin American regional contests (held in 2021) in the BOCA system, with its own heading "ICPC LATAM - 2020 (in 2021) | Scoreboard". It is one board for all participating Latin American sites: it covers 302 distinct teams, and selector links lead to the Global view and to the views (brbr, centroamerica, caribe, mxmx, north, south, cacr, cani, casv, cbcu, cbdo, cbtt, noco, novz, soar, sobo, soch, sope). Our copy holds all views in one table, so each team appears two or three times (in the global ranking and in one or two other views) and the table has 785 team rows.

    Each row gives the rank, a user name with a site code, the institution in brackets with the team name, one cell per problem A to N with attempts and time (3/118; unsolved problems show attempts and a dash), and a total of problems solved with penalty time in brackets. The first row is the team UH Top with 10 problems solved and 775 penalty. Menu links to statistics, runs, clarifications, tasks, the problem set and the BOCA packages lead outside our copy.
