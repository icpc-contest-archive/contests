  description: |-
    Final standings of the 2020 ICPC South America-North Finals: 47 teams with rank, team name, institution, number of problems solved, total time and a citation. The first four teams solved eight problems; the top team is Fast and Fourier of EAFIT University. Places 1 to 23 carry a place citation (First Place to Twenty-third Place) and the remaining 24 teams are listed as Honorable Mention; ten teams solved no problem and show no time. The page has no per-problem detail.
