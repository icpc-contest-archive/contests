  description: |-
    Problem set of the 2020 Latin American Regional Contests, a PDF of 22 pages marked "Contest Session", dated July 10, 2021 and version v1.0. The cover says it is used in simultaneous contests hosted in Argentina, Bolivia, Brasil, Chile, Colombia, Costa Rica, Cuba, Ecuador, El Salvador, Guatemala, Jamaica, México, Nicaragua, Perú, Puerto Rico, República Dominicana, Trinidad y Tobago and Venezuela, so it is shared by all of these sites.

    A page of general rules for input, output and program names is followed by 14 problems, A to N (Almost Origami to Non-Integer Donuts), in English. Each has a statement with input and output format and one to five numbered sample inputs and outputs, and names its author and the author's country. No test data or solutions.
