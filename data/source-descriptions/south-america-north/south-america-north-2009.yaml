    Scoreboard page on the web site of ACIS (Bogotá, Colombia), in Spanish with English table headings, titled "Resultados Maratón Regional Latinoamericana de Programación" (Results, Latin American Regional Programming Marathon). 61 teams with rank (1 to 61, no ties), team name, university, site (Bogota 41 teams, Valencia 20 teams), number solved, time, and for each of problems A to K the attempts and the time of the accepted run ("--" when not solved), with a total of attempts and problems solved. A last row gives submissions, first accepted time and number of accepted runs per problem. The page carries a last-updated stamp of Saturday 24 October 2009 for each site, and around the table the site's menus and a list of links to other marathon results pages from 2007 to 2013. Images and scripts of the page are in our copy.
