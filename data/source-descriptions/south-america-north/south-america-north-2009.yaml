  description: |-
    Problem set of the 2009 Latin American Regional Contests, a PDF of 20 pages in English. The cover reads "ACM International Collegiate Programming Contest 2009, Latin American Regional Contests, October 23rd-24th, 2009, Contest Session", says the set holds 11 problems on pages numbered 1 to 19 and is used in simultaneous contests in Argentina, Bolivia, Brazil, Chile, Colombia, Cuba, Peru, Mexico and Venezuela, and is marked Version 6.

    Eleven problems A to K follow, from A "Another Crisis" to K "Klingon Levels"; problem E is "Electric Bill". Each has a file code name, a statement, Input and Output sections and a sample input with its output. The pages after the cover carry the running head "ACM ICPC2009 – Latin American Regionals" with the page number. No solutions or test data.
