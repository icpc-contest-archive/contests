  description: |-
    Website of the Asociación Colombiana de Ingenieros de Sistemas (ACIS), in Spanish, with its pages on the 2009 regional contest. The seed page, titled "Maraton Regional Suramericana ACM ICPC 2009", announces the Maratón Regional Latinoamericana ACM ICPC 2009 for 24 October 2009 at several sites in South America, in Colombia at the Universidad de los Andes in Bogotá, as a qualifier for the 34th World Finals in Harbin, China. It links to a press release, the problem set, photos, the results, the schedule and the Bogotá site.

    Our copy holds 24 pages. The 2009 results page is a scoreboard of 61 teams at two sites, Bogota (41 teams) and Valencia (20), giving rank, team, university, site, problems solved, time, and attempts and solve time for each of the eleven problems A to K, with a closing row "Submitted/1st Yes/Total Yes"; both sites are stamped as last updated on 24 October 2009. The schedule page gives the day's timetable for contestants and coaches, with a warm-up in the morning and the contest starting at 12:30, and the Bogotá site page gives the venue at the Universidad de los Andes.

    The other pages are the association's general pages (activities, services, news, image gallery, museum, contact) and items from 2012; the press-release link leads to a 2012 release about the World Finals in Warsaw. The problem set PDF is not in our copy.
