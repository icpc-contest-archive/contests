  description: |-
    Problem set of the contest session as a PDF of 31 pages. The cover reads "International Collegiate Programming Contest 2021, Latin American Regional Contests, April 2, 2022, Contest Session", states that the set has 13 problems on pages numbered 1 to 29, and lists the 18 countries hosting simultaneous contests with it, from Argentina to Venezuela, including Colombia. A page of general information on program names, input and output follows, and the last page holds only a joking "left blank" note.

    The problems are A Ancient Towers, B Because, Art!, C Cyclists versus Clouds, D Daily Turnovers, E Expedition Plans, F Fields Division, G Generator Tree, H Hamilton - The Musical, I Invested Money, J Joining Pairs, K KIARA is a Recursive Acronym, L Leaving Yharnam and M Most Ordered Way, each in English with input and output sections and sample inputs and outputs. No test data or solutions.
