  description: |-
    Scoreboard of the 2021 Latin American regional contests in the BOCA system, headed "ICPC LATAM - 2021 | Scoreboard". It is one board for all participating Latin American sites: it covers 273 distinct team accounts. Our copy holds all views in one table of 756 team rows, so a team appears one to four times (in the global ranking and in the views it belongs to). Selector links lead to the Global view and to views named Brasil, ccl, Centro América, Costa Rica, El Salvador, Caribe, Cuba, Dominican Republic, Mexico (with several Mexican site codes), North, Venezuela, Colombia, South, Argentina, Bolivia, Chile and Peru.

    Each row gives rank, a user name with site code, the institution in brackets with the team name, one cell per problem A to M with attempts and time (unsolved problems show attempts and a dash), and a total of problems solved with penalty time. Twelve teams carry a [CCL] tag in their names. Menu links to statistics, runs, clarifications, tasks and the problem set files lead outside our copy.
