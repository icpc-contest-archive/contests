  description: |-
    Scoreboard of the Latin American regional, South America North part, on the website of ACIS (the Colombian computing society), headed as the combined Colombia and Venezuela results as of 23 October 2010, at the end of the contest. It lists 56 team rows with rank, team, country code and institution, problems solved and total time, then one cell per problem A to K in the form tries/time ("--" when unsolved) and a final tries/solved column. Three teams share rank 54 with no problems solved; first place has 6 problems solved with 829 minutes.

