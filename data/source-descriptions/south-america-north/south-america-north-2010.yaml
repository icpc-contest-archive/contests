  contest_date: '2010-10-23'
  description: |-
    Website of the Asociación Colombiana de Ingenieros de Sistemas (ACIS), in Spanish, with its pages on the 2010 regional contest. The seed page, titled "Maraton Regional Suramericana ACM ICPC 2010", says the Maratón Regional Latinoamericana ACM ICPC 2010 was held on 23 October 2010 at sites in Argentina, Bolivia, Brazil, Chile, Colombia, Cuba, Mexico, Peru and Venezuela, in Colombia at the Universidad de los Andes in Bogotá, and gives the rules for teams advancing from the national contest.

    Our copy holds 25 pages. The results page, "Suramerica / Norte (consolidado Colombia + Venezuela)" as of 23 October 2010 at the end of the contest, is a scoreboard of 56 teams (40 from Colombia, 16 from Venezuela) with position, team, country and institution, problems solved, time, attempts and solve time for each of the eleven problems A to K, and attempts over solved; Universidad del Valle's UniValleException is first. A problems page names the eleven problems, from A "Ants Colony" to K "Kids' Wishes", each linked to a PDF; a press release reports 1299 competitors across the sites and the three Colombian teams going to the World Finals in Sharm el-Sheikh; the schedule page gives the timetable of 23 October 2010, with the contest from 12:30 to 17:30 and the scoreboard frozen in the last hour; another page gives the Bogotá venue.

    The other pages are the association's general pages. The problem PDFs, the final report PDF and the photos are not in our copy.
