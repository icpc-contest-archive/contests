  description: |-
    Problem set of the 2010 Latin American Regional Contests, a PDF of 17 pages in English. The cover reads "ACM International Collegiate Programming Contest 2010, Latin American Regional Contests, October 22nd-23rd, 2010, Contest Session", says the set holds 11 problems on pages numbered 1 to 15 and is used in simultaneous contests in Argentina, Bolivia, Brazil, Chile, Colombia, Cuba, Peru, Mexico and Venezuela, and is marked v1.0. A page of general information on input and output follows.

    Eleven problems A to K follow, from A "Ants Colony" to K "Kids’ Wishes", each with a problem code name, a statement, Input and Output sections and a sample input with its output. The problem pages carry the running head "ACM ICPC2010 – Latin American Regional" with the page number. No solutions or test data.
