    Problem list of Latin America Regional Contests 2010 on the Baekjoon Online Judge, in Korean: 13 entries, the eleven contest problems A to K and two practice problems PA and PB. Each row gives the judge's problem number, label, title, and the judge's own counts of accepted and submitted solutions and acceptance rate. Eight contest titles are in English (such as Ants Colony, Bingo!, Electric Needs, Jollo, Kids' Wishes) and three, C, D and G, have Korean titles. The page links to the problems on the judge; our copy holds only this list page, no statements.
