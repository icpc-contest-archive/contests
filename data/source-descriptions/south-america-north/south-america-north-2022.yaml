  description: |-
    Problem set of the 2022 Latin American Regional Contests, a PDF of 23 pages marked "Contest Session", dated March 18, 2023 and version v1.0. The cover says it is used in simultaneous contests with participating countries Argentina, Bolivia, Brasil, Chile, Colombia, Costa Rica, Cuba, El Salvador, México, Perú, Puerto Rico, República Dominicana, Uruguay and Venezuela, so it is shared by all of these sites.

    A page of general rules for input, output and program names is followed by 13 problems, A to M (Asking for Money to Maze in Bolt), in English. Each has a statement with input and output format and sample inputs and outputs, and names its author and the author's country. No test data or solutions.
