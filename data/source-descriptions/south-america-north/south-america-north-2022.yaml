  description: |-
    Final Scoreboard of the 2022 Latin American regional contests in the BOCA system, headed "ICPC-LATAM - Latin America - Regional 2022". It is one board for all participating Latin American sites: it covers 329 distinct team accounts. Our copy holds all views in one table of 855 team rows, so each team appears two or three times (in the global ranking and in the views it belongs to). Selector links lead to the Global view, to views named Brasil, CentroAmerica, Caribbean, Mexico, North (noco, novz) and South (soar, sobo, soch, sope), and to a second set of views named Global-CCL, Brasil-CCL, Caribbean-CCL, Mexico-CCL and South-CCL; 20 accounts have user names starting with teamccl.

    Each row gives rank, a user name with site code, the institution in brackets with the team name, one cell per problem A to M with attempts and time (unsolved problems show attempts and a dash), and a total of problems solved with penalty time. Header links to the warmup and contest problem sets, an editorial, statistics, runs and BOCA packages lead outside our copy.
