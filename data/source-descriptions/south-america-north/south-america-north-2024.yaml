  description: |-
    Final scoreboard of the 2024 ICPC Latin America Contests as produced by BOCA, one shared board for all participating countries: 516 distinct teams, 494 official and 22 unofficial teams marked [CCL], with user names starting ccl. Each row gives rank, user name and site code with country, team name with institution, tries and time in minutes for each of the 12 problems A to L (a dash in place of the time where the problem was not solved), and the number solved with total penalty in parentheses.

    The single table lists each team two to six times, once for each score view it belongs to; the page offers Global, Global+CCL, Brasil, CentroAmerica, Caribbean, Mexico, SouthAmerica_North (Colombia and Venezuela), SouthAmerica_South, two further views named sope and sopa, Female_Teams and CCL. The table has 1,913 rows in all. Links at the top lead to information sheets, problem sets and time limits, an editorial, runs, tasks, clarifications and statistics pages, and two BOCA package archives; the linked pages other than the scoreboard are not part of this document. Style sheets and images are kept with our copy.
