    Problem set of the 2018 Latin American Regional Contests, a PDF of 18 pages in English. The cover reads "ACM International Collegiate Programming Contest 2018, Latin American Regional Contests, November 9th-10th, 2018, Contest Session", says the set holds 13 problems on pages numbered 1 to 16 and is used in simultaneous contests in Argentina, Bolivia, Brasil, Chile, Colombia, Costa Rica, Cuba, El Salvador, México, Panamá, Perú, República Dominicana and Venezuela, and is marked v1.2. A page of general information on program names, input and output follows.

