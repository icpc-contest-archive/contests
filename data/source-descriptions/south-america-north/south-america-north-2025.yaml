  description: |-
    Final scoreboard of the 2025 ICPC Latin America Regionals as produced by BOCA, one shared board for all participating countries: 593 distinct user names, 34 of which start with ccl; 28 of those also carry [CCL] in the team name. Each row gives rank, user name and site code with country, team name with institution, tries and time in minutes for each of the 12 problems A to L (a dash in place of the time where the problem was not solved), and the number solved with total penalty in parentheses. The names of 44 teams carry a note that the team qualified for Programadores de America in Chile.

    The single table lists each team two to six times, once for each score view it belongs to; the page offers Global, Global+CCL, Female_Teams, Brasil, Caribbean, CentroAmerica, Mexico, North (Colombia and Venezuela), South and CCL. The table has 2,218 rows in all. Links at the top lead to information sheets, problem sets and time limits, runs, tasks, clarifications and statistics pages, an editors and machines report, and two BOCA package archives; the linked pages other than the scoreboard are not part of this document.
