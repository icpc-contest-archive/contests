  description: |-
    Problem set of the contest as a PDF of 16 pages in English. Every page carries a header naming the 2016 Beninese Collegiate Programming Contest, the University of Abomey Calavi, 05 March 2016 and the languages C, C++ and Java. It holds eight problems A to H: Linear Equation, Vote, Square, Prison Break, X X glued, The fastest road to banikoara, The Triangle Game and RIPOFF, each with a balloon colour, the statement, standard input and output sections and a sample input and output; some have figures.

    Problem G ends with "Source: MCPC 2000" and problem H with "Source: MCPC 2009". No solutions or test data.
