    Category page of the Baekjoon Online Judge, in Korean, for the 2016 Beninese Collegiate Programming Contest, filed under ICPC, Regionals, Africa and Arab, South Africa Regional Contest. It lists eight problems with labels A to H: Linear Equation, Vote, Square, Prison Break, X X glued, The fastest road to banikoara, The Triangle Game, and a problem titled in Korean ("마리오 파티", Mario Party). Each row gives the judge's problem number (14543 to 14550), the number of people who solved it, the number of submissions and the share accepted, as they stood on the page. Each title links to a problem page on the judge; those are not in our copy, so our copy holds no statements.
