  description: |-
    Website of Mapcom Technologies, a company in Cotonou, Benin, mostly in French with some English. Our copy holds 150 files, 135 of them pages, taken from captures made between 2008 and 2026. The company's page "Concours de Programmation" ("Programming Contest") describes an ACM-type national contest for students that prepares them for the regional contest, gives its aims, and has buttons for rules, training, calendar and registration, past editions, gallery, and problems and results; the pages behind those buttons show only the company's home page in our copy. A menu naming the 2016 contests of Benin, Togo, Niger and Burkina Faso, each with report, results and problems entries, is commented out in the page source and its links are empty.

    The rest is the company site (products and services, training, partners, references, news, contacts, a map page for each of five countries) and four pages of the 2008 site of the Benin national contest with three solution source files of 8 March 2008. It also holds the problem set of the 2016 Togolese Collegiate Programming Contest, a PDF of 8 pages dated 19 March 2016, and a one-page official report on that contest. Nothing in our copy gives the results or problems of the 2016 Beninese contest.
