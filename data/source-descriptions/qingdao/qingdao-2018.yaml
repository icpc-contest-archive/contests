    Final standings on Codeforces under the title of the 2018 ICPC Asia Qingdao Regional Programming Contest and the 1st Universal Cup, Stage 9. A scoreboard with rank, team name with institution in brackets, number solved, penalty, and a cell per problem A to M that shows tries (+ or - with a count) and the solve time as hours and minutes. A last row gives accepted and tried counts per problem. First place is HoMaMaOvO (University of Tokyo) with 12 problems and 891 penalty.

    Our copy holds only the first of three pages of the board: the 200 rows ranked 1 to 200 of the 479 entries that the page links name (1 - 200, 201 - 400, 401 - 479). Official university teams are mixed with high-school teams and teams of companies or no affiliation; a "show unofficial" option is on the page, and 12 of the 200 team names begin with an asterisk.
