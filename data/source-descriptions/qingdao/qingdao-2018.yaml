    Scoreboard on XCPCIO, headed 第 43 届 ICPC 国际大学生程序设计竞赛区域赛青岛站 - 正式赛 (Dì 43 jiè ICPC guójì dàxuéshēng chéngxù shèjì jìngsài qūyùsài Qīngdǎo zhàn - zhèngshì sài, "43rd ICPC regional contest, Qingdao site - official contest"), with thirteen problems A to M. Per team it gives place, organisation (25 of the 32 rows shown also carry a second, lower rank number), team name, solved, penalty, the number of tries and a time in minutes for each problem, and two measures the page defines, Dirt and SE. The header gives the start as 2018-10-20 20:00:00 CDT and the end as 2018-10-21 01:00:00 CDT and the footer gives 2018-10-21 09:00 - 14:00 (UTC+8); the header marks the contest FINISHED and has tabs for all teams, official teams and 打星队伍 (dǎxīng duìwǔ, "starred", i.e. unofficial, teams). The first place is held by a team of 清华大学 (Qīnghuá Dàxué, Tsinghua University) with 11 solved.

    Our copy shows only the first 32 rows of the board, down to 6 solved; the remaining rows of the table are empty. The summary rows at the foot (submitted, attempted, accepted, Dirt, SE, first and last solve per problem) count all teams.
