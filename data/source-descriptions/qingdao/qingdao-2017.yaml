  language:
  - en
  - zh
  description: |-
    Home page of the contest's own WordPress site in Chinese and English, titled The 2017 ACM-ICPC Asia QingDao Regional Contest, as it stood before the contest. It shows posts on the registration status of schools for the on-site contest and on the qualification rules, a welcome to the 42nd regional, and categories for the online round, the on-site contest, travel and accommodation. The sidebar gives the online round as 17 September 12:00 to 17:00 and the on-site contest as 4 to 5 November, with the host's address at China University of Petroleum (East China) in Qingdao, and links to the ICPC site and to the registration guide. Our copy holds this one page; it has no results or problems.
