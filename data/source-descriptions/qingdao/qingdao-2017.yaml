  title: 第42届ACM-ICPC亚洲区域赛（青岛）
  language:
  - zh
  contest_date: '2017-11-04'
  description: |-
    Website of the host university's ACM-ICPC contest team, a WordPress blog in Chinese. Our copy holds 13 pages from two captures: the front page, titled for the 42nd regional (Qingdao) and dated January 2018, and pages from October 2018 that carry the header of the next edition, the 43rd regional (Qingdao). The front page says that 365 teams from 226 universities take part in the on-site contest on 4 and 5 November 2017, with 36 gold, 72 silver and 108 bronze medals, and lists the posts of the 2017 contest.

    Pages of the 2017 contest in our copy: a certificate lookup page, a table of 360 teams with school, award (gold, silver, bronze medal or honorable mention), three team members and a coach; a page of nine links to media reports; and the posts for team photographs of areas C and D, whose photographs are not in our copy. The index pages also list posts for areas A and B, the participant names, the entry rules, a video and the final board, which are not among the pages we hold; the final board post only links to the board. The pages of 2018 cover the 43rd regional: the dates of the online round and the on-site contest, online round instructions, registration, quota, receipt and remittance lists.
