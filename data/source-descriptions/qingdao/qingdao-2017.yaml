  description: |-
    Contest page of a replay of the contest held on the Luogu online judge on 12 July 2026, 13:00 to 18:00, in Chinese. It describes the replay as using the original problems and data of the 2017 Qingdao regional with Chinese statements, with ICPC rules, a scoreboard frozen for the last hour and teams of one to three. The embedded contest data lists 11 problems A to K, from Battle in Two Pairs of Heroes to Our Journey of Xian Ends, and a registration figure of 2512 participants. The page also explains prize verification for xCPC contests. The statements are on separate pages and are not in our copy.
