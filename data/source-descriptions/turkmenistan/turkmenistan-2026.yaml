  description: |-
    Website of the ICPC Northern Eurasia contests, headed "Northern Eurasia Contests", in English, held under two addresses that serve the same pages. The page of the Turkmenistan Regional Contest gives Turkmenistan as the participating region, "14 Nov, 26" as the contest date and the International University for the Humanities and Development as host, names a contest director as contact, and has an archive with the standings of 2026 and of 2025, the latter also with all runs of that contest.

    The 2026 standings, headed "ICPC 2026–2027 Turkmenistan Regional Contest" and marked over at 5:00:00 of 5:00:00, rank 29 teams on 14 problems A to N, whose names appear as tooltips on the column heads. Per team they give the institution, team name and members, the time and number of rejected tries for each solved problem, failed tries, problems solved and total time; first solves are marked, and the foot gives runs, accepted and rejected runs and first and last accept per problem. Magtymguly Turkmen SU: TDU_IT_TEAM is first with eight problems. One team is marked with an asterisk that the page does not explain.

    Our copy holds 110 pages of the wider site, among them the 2025 standings (35 teams, 12 problems) and the 2025 runs archive, the pages of the other regional contests of Northern Eurasia, the Northern Eurasia Finals pages of 2019 to 2026, the NEERC pages of 1995 to 2018, the yearly archive pages, rules and contacts. The style sheet of the standings pages and some sponsor logos are not in our copy.
