  contest_date: '2005-11-20'
  description: |-
    Standings of The 2005 ACM Asia Programming Contest - Hangzhou, sponsored by IBM, in ten tables, as rank, team (university and team name), citation and, where given, solved and penalty. The final round, the on-site contest of 11/20/2005, lists 301 teams: UniverseSoft Cup Winner (Tsinghua University), 4 Gold, 14 Silver, 20 Bronze, ordinal places and 234 Honorable Mention. The 234 Honorable Mention rows have no solved count or time; the other 67 rows do. There is no per-problem detail.

    The other tables are preliminary sites: Asia Preliminary Internet HangZhou Site, 10/8/2005 (350 teams); Asia-Non-Mainland Team registration site (7); and university and provincial contests of Donghua University (25), FuDan University (22), FuDan-DongHua Friendship (12), GuangDong Provincial (98), ZheJiang Provincial (176), Zhejiang University (212) and Zhongshan University (156).
