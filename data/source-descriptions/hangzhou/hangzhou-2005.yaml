  title: The 30th ACM International Collegiate Programming Contest
  language:
  - en
  - zh
  contest_date: '2005-11-20'
  description: |-
    Website of the 30th ACM International Collegiate Programming Contest, Asia Regional - Hangzhou and UniverseSoft Cup Asia Invitational, hosted by Zhejiang University, in English with a Chinese version of the same sections. The pages cover the contest and its organisation, regional rules and team composition, the contest environment (PC^2 v8.6d, GCC 3.2.2, J2SE 5.0), registration (deadline 30 September 2005, on-site quotas of 10 non-mainland and 70 mainland teams), a tentative schedule with the on-site contest on 20 November 2005, travel information, photo folders and a dated news list.

    Results and problems are linked from it: a news list announces a real-time ranklist of the on-site contest, an online preliminary contest page of the Zhejiang University Online Judge with its rules (8 October 2005), an announcement of on-site places by school, a ZIP of 11 RTF files for the on-site problems, spreadsheets of teams and school ranks, and problem sets of the 2005 Zhejiang University, Zhongshan University and Zhejiang Provincial contests.

    Our copy holds 80 pages among 150 saved files, including the ranklist page, the ZIP, the two spreadsheets, the problem-set PDFs and directory listings of the photo folders with 11 photos. 34 further addresses (photos, photo folders and one video) were not saved. The file linked as the first round of the Fudan and Donghua friendship contest is a 13-page problem set headed TU Darmstadt Programming Contest 1999.
