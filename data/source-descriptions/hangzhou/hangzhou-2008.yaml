  title: 4357 - Get-Together at Stockholm
  language:
  - en
  problems: 1
  pages: 2
  description: |-
    Problem 4357, 'Get-Together at Stockholm', as a two-page statement PDF with the region line 'Asia - Hangzhou - 2008/2009'. A host invites friends to a party in Stockholm, the city of the 2009 World Final named in the text, under two rules: each guest must have at least A acquaintances there and be unfamiliar with at least B people. The task is to give the largest possible party among at most 100 friends. The statement has input and output formats and a sample with two cases. No problem letter is printed.
