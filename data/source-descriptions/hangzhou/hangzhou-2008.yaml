  title: 4360 - Junk-Mail Filter
  language:
  - en
  problems: 1
  pages: 2
  description: |-
    Problem 4360, 'Junk-Mail Filter', as a two-page statement PDF with the region line 'Asia - Hangzhou - 2008/2009'. For N sample emails (up to 10^5) and up to 10^6 operations, either 'M X Y' merges the characteristics of two emails or 'S X' removes all relationships of one email; the task is to report the number of distinct characteristics. The statement has input and output formats and a sample with two cases. No problem letter is printed.
