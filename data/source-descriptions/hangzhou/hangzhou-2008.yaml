  title: 4354 - Déjà vu
  language:
  - en
  problems: 1
  pages: 2
  description: |-
    Problem 4354, 'Déjà vu', as a two-page statement PDF with the region line 'Asia - Hangzhou - 2008/2009'. It opens with the same XOR switch-machine text as 4352 and says 'contrary to what we assumed in problem B', now with damaged switches: given the values of the working switches, find the minimum number of switches that turn S into T, or print 'Impossible'. The statement warns that a naive algorithm might not be sufficient, and has input and output formats and a sample with two cases. No problem letter is printed.
