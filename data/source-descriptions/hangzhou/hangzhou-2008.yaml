  problems: 1
  pages: 2
  description: |-
    Problem 4358, 'History of Languages', as a two-page statement PDF with the region line 'Asia - Hangzhou - 2008/2009'. Given two deterministic finite automata (alphabet of 2 to 26 letters, up to 2000 states each), the task is to print Yes or No according to whether they accept the same language. The statement quotes a definition of a DFA, and has input and output formats and a sample with two cases. No problem letter is printed.
