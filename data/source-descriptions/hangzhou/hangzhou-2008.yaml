  description: |-
    Problem 4359, 'Image Processing', as a two-page statement PDF with the region line 'Asia - Hangzhou - 2008/2009'. Given a black-and-white image of up to 500 by 500 cells containing digits drawn with axis-parallel rectangular strokes, the task is to output the sum of the digits that are recognisable. The text refers to Figure 2 for how the digits are drawn. The statement has input and output formats and a sample with five cases. No problem letter is printed.
