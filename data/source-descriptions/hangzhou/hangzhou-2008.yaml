  title: 4355 - Experiment on a ... "Cable"
  language:
  - en
  problems: 1
  pages: 2
  description: |-
    Problem 4355, 'Experiment on a ... "Cable"', as a two-page statement PDF with the region line 'Asia - Hangzhou - 2008/2009'. Data packages with a speed range and a departure time are sent from both ends of a cable of length L; the task is to compute the average effectiveness of a detector sent at an arbitrary time in a given interval, with precision up to 0.00001. The statement has input and output formats and a sample with two cases. No problem letter is printed.
