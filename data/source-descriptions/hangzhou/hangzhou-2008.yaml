  copy: hangzhou/hangzhou-2008/website/2026-09-05-wayback-c84dc20f
  title: Welcome to Hangzhou Dianzi University Online Judge
  language:
  - en
  - zh
  description: |-
    Crawl of the online judge of Hangzhou Dianzi University, in English and Chinese, started from its front page (Welcome to Hangzhou Dianzi University Online Judge), which offers the problem archive, status, ranklist, forum and menus for standard, VIP, virtual and DIY contests. Our copy holds 150 files, of them 102 non-empty pages: the front page in several captures, three contest list pages and pages of the DIY contest system, a downloads page, 43 pages of the judge's blog, and two Chinese pages for China Collegiate Programming Contest (CCPC) events in Hangzhou, the women's contest of May 21 to 22, 2016 and the Hangzhou site of October 18 to 19, 2016 (event overview, award settings, schedule). The rest are style sheets, scripts and images.

    The one problem document is a 17-page PDF of the problems A to L of the 2017 China Collegiate Programming Contest, Hangzhou Onsite, November 5, 2017. Nothing in the copy concerns the 2008 Asia Hangzhou regional. The crawl stopped at its page budget: its manifest lists 3962 further addresses on the host that were not fetched.
