  title: 4353 - Cryptography Reloaded
  language:
  - en
  problems: 1
  pages: 2
  description: |-
    Problem 4353, 'Cryptography Reloaded', as a two-page statement PDF with the region line 'Asia - Hangzhou - 2008/2009'. It recalls the RSA steps and asks for the two primes p and q (p < q) given n, the private exponent d and a small public exponent e, with n up to 10^100. The statement has input and output formats and a sample with two cases. No problem letter is printed.
