  title: 4352 - Binary Integer
  language:
  - en
  problems: 1
  pages: 2
  description: |-
    Problem 4352, 'Binary Integer', as a two-page statement PDF with the region line 'Asia - Hangzhou - 2008/2009'. A machine has switches, each tied to an N-bit integer with exactly three ones; the task is to count the configurations with exactly K switches on that turn S into T by bitwise XOR, with the answer taken modulo 10007. The statement has input and output formats and a sample with three cases. No problem letter is printed.
