  problems: 1
  pages: 2
  description: |-
    Problem 4351, 'A Pair of Graphs', as a two-page statement PDF with the region line 'Asia - Hangzhou - 2008/2009'. Given two undirected simple graphs with the same number of vertices (at most 8), the task is to find the minimum cost of edge additions and deletions, priced separately for each graph, that makes the graphs equivalent. The statement has input and output formats and a sample with two cases. No problem letter is printed.
