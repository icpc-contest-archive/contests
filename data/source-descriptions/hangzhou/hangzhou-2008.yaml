  problems: 1
  pages: 2
  description: |-
    Problem 4356, 'Fire-Control System', as a two-page statement PDF with the region line 'Asia - Hangzhou - 2008/2009'. A weapon at the origin fires at a circular sector; given up to 5000 target points and a number K, the task is to find the smallest area of a sector covering at least K points, printed to two decimals. The statement includes an example figure of a firing region, input and output formats, and a sample with two cases. No problem letter is printed.
