    Scoreboard of the onsite contest on a Chinese page that collects regional contest boards (headed ICPC 2013 杭州赛区现场赛 排行榜, "ICPC 2013 Hangzhou regional onsite contest board"). It lists 154 teams with S#, school, rank, team, problems solved and time, then problems A to K, each cell giving attempts and the time of the solving run; a bare number appears in cells without a time. Under each problem letter the header shows a pair of counts. The S# column holds a number for some teams, is blank for others and carries * for 8 teams. A legend marks first to solve, solved, attempted and pending judgement, and a link labelled as the contest problems leads to a PDF on another server. A line reads 2013/10/27 20:09:57 (Start: 2013-10-27 09:00) and a note gives 17, 32 and 43 as the numbers of gold, silver and bronze. First place is Secret;Weapon from Shanghai Jiao Tong University with 10 problems and 1631.

