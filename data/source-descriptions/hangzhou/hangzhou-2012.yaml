    Single-problem statement PDF of 2 pages, headed "6379 The Power of Xiangqi", in English. From the second page on, a line reading "ACM-ICPC Live Archive" with the number, title and page number is printed. The statement explains basic Xiangqi rules, gives a table of seven piece kinds with their offense power and symbol letters, and asks which of two players has the larger total offense power, with a reduction when a player lacks a Ma or a Pao. It ends with a sample input and sample output.
