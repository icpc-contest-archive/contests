  description: |-
    Scoreboard of the onsite contest on a Chinese page that collects regional contest boards (headed ICPC 2012 杭州赛区现场赛 排行榜, "ICPC 2012 Hangzhou regional onsite contest board"). A line reads 2012/11/4 13:04:45 (Start: 2012-11-04 09:00) and a note gives 14, 28 and 43 as the numbers of gold, silver and bronze. The table lists 157 teams with S#, school, rank, team, problems solved and time, then problems A to K, each cell giving attempts and the time of the solving run; a bare number appears in cells without a time. Under each problem letter the header shows a pair of counts. The S# column holds a number for some teams, is blank for others and carries * for 16 teams. A legend marks first to solve, solved, attempted and pending judgement. First place is DivineRapier from Tsinghua University with 9 problems and 784.

    The side menu links to the boards of other Chinese regional contests of 2011 and 2012, which are not in our copy.
