  description: |-
    Standings of The 2012 ACM-ICPC Asia Hangzhou Regional Contest: 141 teams with rank, team, institution, problems solved, time and a citation. Ties share a rank, which runs to 91. Places are cited from First Place downward, and 30 teams at the end carry the citation Honorable Mention. DivineRapier of Tsinghua University is first with 9 problems and 784. There is no per-problem detail, and the page does not state the contest date.
