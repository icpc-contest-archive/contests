  title: ACM-ICPC Asia Hangzhou 2012
  language:
  - zh
  - en
  description: |-
    Whole-host copy of the website of the ZSTU (Zhejiang Sci-Tech University) ACM team, mostly in Chinese. Its ACM-ICPC Asia Hangzhou 2012 site has a menu of contest notices, schedule, transport and accommodation, event services, introduction, organisers, rules, pictures, hotels and tourism. The home page, from late November 2012, links notices with titles about the registration, payment and invitation, the Chinese registration system, school accounts, hotel information and allocation, team information, the schools and members of the wheel-war exhibition, the final board and the gold, silver and bronze list; a later home page capture from 2015 carries notices about 2013 contests for new students. One notice page, dated 29 September 2012, is a table of institutions with columns for the top 70, WF, award, extra and observer teams and a subtotal for the onsite contest. The schedule, rules and board pages themselves are not in our copy, and neither are the notices linked from the home page apart from that one.

    The rest is not about this edition: the team's older home page in several copies, a small English set for the 2010 Hangzhou contest (introduction, schedule, rules, environment, and the PC2 scoreboard of that year), pages of the ZSTUOJ online judge from October 2021 and April 2025 (home page, FAQ, problem list, status, ranklist, contests and assignments), a login form, a page left by a defacement and six one-line language-switch scripts.

    Our copy holds 34 saved pages.
