    Single-problem statement PDF of 3 pages, headed "6371 Looploop", in English. From the second page on, a line reading "ACM-ICPC Live Archive" with the number, title and page number is printed. The statement describes a toy of N elements in a loop with an arrow and parameters k1 and k2, and six operations on it (add, reverse, insert, delete, move, query); the task is to print the number under the arrow for each query, with the output headed by a case number. Figures illustrate the operations. It ends with a sample input and sample output.
