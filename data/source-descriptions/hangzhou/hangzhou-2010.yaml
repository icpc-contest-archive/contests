  description: |-
    Scoreboard of the onsite contest on a Chinese page that collects regional contest boards (headed ICPC 2010 杭州赛区现场赛 排行榜, "ICPC 2010 Hangzhou regional onsite contest board"). It lists 138 teams with school rank, school, rank, team name, problems solved and time, then problems A to J, each cell giving attempts and the time of the solving run, and a total of attempts and solved. A bottom row gives submitted, first-yes time and total-yes per problem. Teams marked * in the school-rank column (20 teams) have no school rank. A note says team names marked blue are women's teams. First place is Luminar from Shanghai Jiao Tong University with 8 problems and a time of 805. The page ends with Last updated Sun Oct 24 14:39:44 CST 2010.

    The side menu links to the boards of other Chinese regional contests from 2008 to 2012; those links lead outside our copy.
