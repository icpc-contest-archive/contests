  title: ZSTUOJ
  language:
  - zh
  - en
  contest_date: '2010-10-24'
  description: |-
    Whole-host copy of the website of the ZSTU (Zhejiang Sci-Tech University) ACM team, in Chinese and English. For the 2010 Asia Hangzhou Regional Contest of ICPC it holds a few short English pages: an introduction to the ICPC, the schedule (check-in 22 October, warm-up contest 23 October, onsite contest 24 October 2010), the online contest of 19 September 2010 with its registration deadline, the judging-result rules, and the contest environment (Linux, PC2 9.1, Eclipse). A page titled Summary - Programming Contest is the PC2 scoreboard of the onsite contest, with 138 teams and problems A to J. The Chinese frameset page for the 35th ACM International Collegiate Programming Contest Asia regional (Hangzhou) holds only a no-frames notice.

    The rest is not about the 2010 contest: the team's home page in several identical copies, the home page and a notice page of the ACM-ICPC Asia Hangzhou 2012 site (the schools invited to the 2012 onsite contest), pages of the ZSTUOJ online judge from October 2021 and April 2025 (home page, FAQ, problem list, status, ranklist, contests and assignments), a login form, a page left by a defacement, six one-line language-switch scripts and a directory listing of a /month/ folder.

    Our copy holds 34 saved pages.
