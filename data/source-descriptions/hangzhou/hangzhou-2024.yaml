  description: |-
    Editorial slides in Chinese, a PDF of 45 pages. The cover gives the title "The 3rd Universal Cup: Hangzhou", the authors as Qingyu, SUA 程序设计竞赛命题组 (SUA chéngxù shèjì jìngsài mìngtí zǔ, "SUA programming contest problem-setting group") and Universal Cup, and the date 10 November 2024. An overview slide rates the expected difficulty of the problems, from Very Easy (A, K) to Medium-Hard (C), with none rated Hard.

    The solution slides cover all 13 problems, A to M, in the order A, K, E, H, M, F, B, J, I, G, D, L, C; D Dividing Sequence and L Let's Go! New Adventure take eight and seven slides. Problem B is headed "Barkeley III". The last two slides point to the SUA wiki for written solutions and annotated reference code, and say "Thank you!".
