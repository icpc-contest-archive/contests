    Scoreboard of NCPC 2008, titled 'NCPC standings', in the view that lists all participating teams: 149 rows with rank, team name, school logo and country flag, number solved, total time, and for problems A to J the number of tries and the time of the accepted solution as hours and minutes (tries with no solve are shown as a dash). Solved and attempted cells are coloured differently. The page gives the contest as 2008-10-04 11:08 to 16:08 and says the contest is over. The first place is Lag Bernhardsson with 8 solved.

    The page also gives, per problem, a 'Monkey Stats' row of counts and percentages, the average number of tries and the average tries to solve, and a menu of views by country, by site and for ICPC teams only. Teams outside the ICPC division are in the same list and are not marked. Logos, flags and the style sheet are in our copy; the other views are separate pages.
