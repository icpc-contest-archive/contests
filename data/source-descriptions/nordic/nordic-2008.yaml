  contest_date: '2008-10-04'
  description: |-
    Website of the 2008 Nordic Collegiate Programming Contest (NCPC), in English with one page in Norwegian. Our copy holds four files: the front page, a Norwegian page for the NTNU site in Trondheim, a 3-page PDF of instructions for the contest system, and the source code of a PHP script for a registered-teams page, not the list it would have shown.

    The front page gives the contest time (4 October 2008, 11:00 to 16:00 CEST), lists the subregional manager, the director, the head of jury and the technical director, lists the participating sites by country with an organiser for most of them (verified sites are marked with a plus sign), gives the rules and shows the sponsors' logos. Its links to the contestant list and to the instructions lead to files in our copy; the links to the scoreboards, problem set, solution sketches and data files lead to other addresses and are not part of it.
