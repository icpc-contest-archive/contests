  description: |-
    Problem set of the 2008 Nordic Collegiate Programming Contest as a PDF of 21 pages, in English. The cover names the contest and the date, 4 October 2008, and lists the ten problems A to J: Aspen Avenue, Best Compression Ever, Code Theft, Dinner, Event Planning, Fixing the Bugs, Getting Gold, Hard Evidence, Introspective Caching and Just A Few More Triangles!.

    Page 2 holds general advice (how submissions are judged and the tolerance for floating point output). Each of the ten problems has a full statement with input and output specifications and sample input and output. No test data or solutions.
