  description: |-
    Website of the 2009 Nordic Collegiate Programming Contest (NCPC), in English with one page in Norwegian. Our copy holds three pages: the front page, a Norwegian page for the NTNU site in Trondheim, and a registration page that only wraps a frame pointing to another server, so it has no content of its own.

    The front page states that the contest was held 3 October 2009, 11:00 to 16:00 CEST, and that the winning team, Les Blotières from KTH in Sweden, solved 9 of ten problems. It links to the problem set, solution slides, sample and judge data, scoreboards and the contestant list, lists the subregional manager, director, head of jury and technical director, lists the participating sites by country with an organiser for most of them (verified sites are marked), and gives the sponsors' logos and the rules. The linked files and lists are at other addresses and are not in our copy; the registration link leads to the registration page that is.
