  description: |-
    Problem set of the 2009 Nordic Collegiate Programming Contest as a PDF of 22 pages, in English. The cover names the contest and the date, 3 October 2009, and carries the note 'Do not open before the contest has started'. Page 2 holds general advice on judging and on the tolerance for floating point output.

    There are ten problems A to J: Soda Surpler (as spelled in its heading), Money Matters, Allergy Test, Rain Fall, Speedy Escape, Gokigen Naname, Flight Planning, Beacons, Playfair Cipher and Code Permutations. Each has a full statement with input and output specifications and two or three sample input and output pairs. No test data or solutions.
