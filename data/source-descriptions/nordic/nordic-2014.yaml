  description: |-
    Problem set of the contest as a PDF of 24 pages, in English. The cover lists eleven problems A to K by name: Amanda Lounges, Basin City Surveillance, Catalan Square, Dice Game, Opening Ceremony, Particle Swapping, Outing, Clock Pictures, How many squares?, Road Work and Train Passengers, with the line not to open before the contest has started. A page of advice follows on how submissions are judged and on the accepted precision of floating point output.

    Each problem has its own page or pages with a statement, input and output format and sample input and output, and each of the 11 carries a problem ID. Test data and solutions are not part of the document.
