    Slides of the jury's presentation of solutions, a PDF of 17 pages in English, dated 2014-10-04 and produced by the NCPC jury. After the title page and a list of problem authors, there is one section per problem, A to K, over 14 slides: B, F and G take two slides each. Every problem slide names the problem author and states the problem; most give a solution, many an insight, and several its time complexity. The last slide gives facts from the jury, including that 486 lines were enough to solve the whole contest, that 1009 contestants from 24 institutions registered, and how many judge solutions problem B has.
