  title: Nordic Collegiate Programming Contest 2014
  language:
  - en
  contest_date: '2014-10-04'
  description: |-
    Website of the 2014 Nordic Collegiate Programming Contest (NCPC), written in English by the contest organisers. Our copy holds 2 pages. The main page states that the contest was held on Saturday 4 October 2014 from 11:00 to 16:00 CEST on many sites across the Nordic countries, and that the winner, Omogen Heap from Stockholm, solved all 11 problems. It links the final standings, the problem set as a PDF, slides describing the solutions, the judges' input, output and solutions, and the packaged problems with test data, released under a Creative Commons BY-SA 3.0 licence. It also describes a public contest on open.kattis.com with the same problems, the use of the Kattis judging system, and that universities may select teams for NWERC.

    The page then lists the participating sites by country (Denmark, Finland, Iceland, Norway, Sweden) with a contact name and a mark for verified sites, the rules (who may compete, ICPC eligibility, what may be brought and used, behaviour, scoring with 20 penalty minutes per incorrect submission, clarifications), the people in charge of the contest, and sponsor logos. The second page explains how a team captain registers a team through the ICPC registration system.

    The linked standings, problem set and other files are not part of this page set and are not in our copy. Sponsor logos and other images are not in our copy.
