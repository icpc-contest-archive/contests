  description: |-
    Standings of the 2014 Nordic Collegiate Programming Contest: 296 teams, each with rank, team name, institution, problems solved, total time and a citation. There are no per-problem columns. Omogen Heap (KTH - Royal Institute of Technology) is first with 11 solved and a time of 1035, ahead of Rasmus (Aarhus University) and Algorillas (University of Oslo). The citations run from First Place to Twelfth Place one by one, then Thirteenth, Twenty-third, Thirty-third, Sixty-first and One-hundred Seventh Place, each shared by several teams, and Honorable Mention, which is given to 118 teams with two, one or no solved problems; 46 of them solved nothing and are ranked 251.

    The page does not state the date of the contest.
