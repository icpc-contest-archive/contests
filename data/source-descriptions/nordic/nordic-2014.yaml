  description: |-
    Final scoreboard of the 2014 Nordic Collegiate Programming Contest from the Kattis contest system: 296 teams, eleven problems labelled A to K. Each row gives rank, team name, country flag, institution logo, number solved, total time, and for each problem the number of tries and the minute of the accepted run (or tries with a dash for unsolved attempts). Omogen Heap is first with 11 solved and a total time of 1035. The page states the contest ran from 2014-10-04 11:00 to 16:00 CEST and is over.

    Filters above the table select all sites, a single country or a single university, and an All ICPC view for the teams competing in the ICPC division, so the full board mixes ICPC and other teams. Legend entries mark first to solve, solved, attempted and pending judgement. Ranks tie among teams with no solutions, all 46 of them shown as 251. In our copy the main Kattis style sheet and the page scripts are missing.
