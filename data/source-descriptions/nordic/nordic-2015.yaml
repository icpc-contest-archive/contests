  title: Nordic Collegiate Programming Contest 2015
  language:
  - en
  contest_date: '2015-10-10'
  description: |-
    Website of the 2015 Nordic Collegiate Programming Contest, in English. Our copy holds two pages: the main page and a registration page. The main page gives the contest time (Saturday 10 October, 11:00 to 16:00 CEST) and reports that Omogen Heap won, solving 9 of 10 problems. It links to the final standings, which lead to another server, and to the problem set and solution slides as PDFs, plus archives of judges' input and output, judges' solutions and packaged problems, all under a Creative Commons BY-SA licence. It also lists the participating sites in Denmark, Finland, Iceland, Norway and Sweden with local organisers (one Swedish site is marked as having none), the sponsors, the people running the contest, information on two warmup contests and the use of Kattis, and the contest rules including how teams are ranked.

    The second page explains how a team captain registers a team in the ICPC registration system. The linked files and results lead to other servers and are not part of our copy; the sponsor logos are not in our copy either.
