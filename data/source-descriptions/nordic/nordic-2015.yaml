  problems: 10
  times: true
  tries: true
  description: |-
    Final scoreboard of the contest on Kattis, shown as over: 337 teams ranked by problems solved and penalty time, with ten problems labelled A to J. Each problem cell gives the number of tries and, for a solved problem, the minute of the accepted run; the page has a legend for first to solve, solved, attempted and pending judgement. Omogen Heap is first with 9 solved and 773 minutes; 33 teams that solved nothing share rank 305. Entries include extra teams of the sites (names containing Extra) and a team named Team of dummies; nothing on the page separates them from the others. Filters above the table switch between all teams, ICPC teams and each site by country and university, from Aalborg to Uppsala.

    The page states the contest ran 2015-10-10 from 11:00 to 16:00 CEST.
