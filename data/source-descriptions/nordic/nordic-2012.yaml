  description: |-
    Website of the 2012 Nordic Collegiate Programming Contest, in English. The front page gives the contest day (6th October, 11:00-16:00 CEST), a note that the winner was Omogen Heap from Stockholm with 10 of 12 problems solved, and links to the final standings, the problem set (PDF), slides describing solutions, and the judges' input and output and judges' solutions as archives. Further sections list the participating sites country by country (Denmark, Finland, Iceland, Norway, Sweden) with local organisers, sponsor logos, the contest officials, the use of the Kattis judging system, and the contest rules.

    Our copy holds 3 pages: the front page, a page on team registration through the ICPC registration system, and a page in Norwegian for the site at NTNU in Trondheim. The linked standings, problem set and solution files are not part of our copy, and neither are the style sheet and the sponsor logo images.
