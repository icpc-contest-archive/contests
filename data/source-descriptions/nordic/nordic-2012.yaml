  description: |-
    Final standings of the 2012 Nordic Collegiate Programming Contest: 208 teams, each with rank, team name, institution, problems solved, total time, medal, citation and site citation. Polaris from KTH - Royal Institute of Technology is first with 9 problems solved in 785 minutes. Gold, silver and bronze medals go to the first twelve teams, four of each. The citation names the place (First Place to One-hundred Fourth Place) for the first 104 teams, and the 104 teams below them, from rank 105, are listed as Honorable Mention; 8 teams at the end solved no problem. 17 teams carry a site citation of the form "Champion of" followed by a site. No per-problem results.
