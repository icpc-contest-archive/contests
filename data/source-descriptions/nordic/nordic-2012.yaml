    Final standings of the 2012 Nordic Collegiate Programming Contest from the Kattis contest system (the page is headed KATTIS and ends "Powered by Scrool"), the "All teams" view: 271 teams with rank, team name, problems solved and total time, and for each of the twelve problems A to L the number of attempts and, for a solved problem, the time of the solving submission (unsolved attempts show "--" instead of a time). Omogen Heap is first with 10 problems solved. The last nine teams, with no problem solved, share rank 263. Below the table are per-problem statistics (Monkey Stats, average tries, average tries to solve). Links lead to views filtered by country and by university, and "ICPC" views; those views are not part of our copy.
