  description: |-
    Website of the 2023 Nordic Collegiate Programming Contest, in English. Our copy holds 4 pages: the home page with the contest date (Saturday October 7th 2023, 11:00 to 16:00 CEST) and a news item dated 2023-10-09 reporting 203 teams from 7 countries, 11 problems, and the top three teams; a Compete page with the rules and registration notes; a Sites page listing 23 local sites by university and country with their status; and a Contact page naming the contest organisers.

    The home and Compete pages link to the final results on Kattis, the problem set PDF, solution slides, a zip of packaged problems with test data and a zip of judges' solutions. Those files and the results page are not part of this copy.
