  description: |-
    Solution slides in English, a PDF of 85 pages titled "NCPC 2023 Presentation of solutions", with 2023-10-07 printed on the cover. The second slide lists the people who prepared the problems, with their universities, and a test solver. The slides then cover all eleven problems, starting with C "Converting Romans", H "Heroes of Velmar" and D "Die Hard" and ending with I "Intertwined" and B "Berry Battle 2": for each a short statement of the problem, the solution idea (several slides for most), and the problem's author; for ten of them (all but H) also the numbers of submissions and accepted solutions at the four-hour mark, with the time of the first solve left as "HH:MM". The last page is a title slide "Results!".
