    Problem set of the 2023 Nordic Collegiate Programming Contest: a PDF of 26 pages in English. The cover gives the contest name and the date October 7, 2023, and lists 11 problems A to K, from Aperiodic Appointments to Karl Coder. It is followed by general advice on input, output, judging and floating point answers, then one statement per problem. Nine problems (A and C to J) give input and output format and samples; B and K are interactive and have sample interactions instead. Six pages are marked as intentionally left blank.
