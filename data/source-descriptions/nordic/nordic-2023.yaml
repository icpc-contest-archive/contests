  description: |-
    Final standings of the 2023 Nordic Collegiate Programming Contest as shown by Kattis, with the contest marked over. 237 team rows give rank, team name, country flag, a region flag and institution logo where shown, number solved, penalty time, and for each of the problems A to K the number of attempts and, for solved problems, the minute of the accepted run. Ranks run from 1 to 186: 185 teams solved at least one problem and the 52 teams with no solved problem share rank 186. First solves are marked in ten problem columns, all except I. Omogen Heap is first with 10 solved.

    Filters above the table select all sites, all ICPC teams, or one country or site. The page gives the contest times as 2023-10-07 11:00 to 16:00 CEST.
