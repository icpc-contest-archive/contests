  description: |-
    Final scoreboard of NCPC 2007 published by KTH, marked 'Contest is over.': 129 team rows in rank order with school logo, country flag, team name, problems solved and total time. Problems A to I each show the number of attempts and the time of the accepted solution (for example 1/00:14), or attempts and -- when unsolved, and the cell is empty when a team did not try the problem. Tied teams share a rank; 7 teams share rank 123 with no problem solved. The team in first place has 9 problems solved in 19:43. A footer states that the scoreboard was generated by KTH at 16:13:48.

    The links at the top to the boards for the ICPC division, the Swedish, Norwegian, Danish and Finnish teams and individual universities lead to pages that are not in our copy. The style sheet and 15 of the 16 images are in our copy; one school logo, used on a single team's row, is missing.
