  title: Nordic Collegiate Programming Contest 2007
  language:
  - en
  contest_date: '2007-10-06'
  description: |-
    Website of the 2007 Nordic Collegiate Programming Contest, in English, as it stood before the contest on 6 October 2007, 11:00 to 16:00 CEST. Our copy holds 3 pages. The main page says the contest is held in a distributed manner at sites in the Nordic countries, that the winners become Nordic champions and that the best student teams go on to NWERC. It names the NCPC director, the head of jury and the technical director, links the scoreboards, contestant list, problem set, solution sketches and judges' solutions (some marked as published when the contest starts or after it), and lists the participating sites by country, Denmark, Finland, Iceland, Norway and Sweden, with a mark for verified sites and an organiser's contact given for most sites (some say no organiser has been found). It gives the rules: eligibility, what may be brought, behaviour, submission, and the scoring and tie-break order.

    The other pages are a PDF of 2 pages titled 'Nordic Championships 2007 Contest System', instructions for the web-based judge used for the contest (accounts, the contest version, submitting), and a Norwegian page for the Trondheim site at NTNU with time, place, a warm-up round on 29 September, registration, prizes, and payment of expenses for the two best Norwegian teams to attend NWERC.

    The scoreboards, problem set and solution files are on other addresses and are not in our copy. The contestant list is saved as the source code of a PHP script, without team names.
