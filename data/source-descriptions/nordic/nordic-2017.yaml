  problems: 11
  pages: 88
  description: |-
    Slides presenting the solutions to the eleven problems of NCPC 2017, written by the contest jury: a PDF of 88 pages whose title slide is dated 2017-10-07, followed by a slide listing the nine members of the jury. The slides take the problems one by one, in a different order than the problem set (starting with J, Judging Moose, then B). Each problem has a one-sentence statement of the task, a line of statistics (submissions, accepted, time of the first accepted submission) and the name of the problem author. Ten problems have the solution idea explained in steps; for problem J there is a single slide showing a solution as code.

    The last slides give figures for the contest (253 teams, 611 contestants, 2819 submissions, programming languages used), further facts about the solutions, and the date of the NWERC regional.
