  description: |-
    Final scoreboard of the 2017 Nordic Collegiate Programming Contest, a Kattis standings page for the contest, marked as over, with start 2017-10-07 11:00 CEST and end 16:00 CEST. It lists 298 teams with rank, team name, number solved, total time, and for each of the eleven problems A to K the number of attempts and, where the problem is solved, the minute of the solution. The 252 ranks 1 to 252 go to teams with at least one problem solved; the 46 teams with none share rank 253. The top four teams solved nine problems; first place is Flöätïng Pöïnts.

    The page has filters for all sites and for each country (Denmark, Finland, Iceland, Norway, Sweden) and site, and a legend for first to solve, solved, attempted and pending judgement. Some entries are named as guest or extra teams (for example 'Guest Team 2 Oslo', '~ Extra Slot Alfa') and nothing else on the page marks them apart.
