  description: |-
    Website of the 2017 Nordic Collegiate Programming Contest (NCPC 2017), held on Saturday 7 October 2017, 11:00 to 16:00 CEST. Our copy holds two pages: the main page and a registration page. The main page states that the contest has been held, names the winning team from the Norwegian University of Science and Technology as having solved 9 of 11 problems, and links to the final results, the problem set, slides with the solutions, the judges' input and output, the judges' solutions, the packaged problems with test data, and the list of registered teams. It also gives the contest rules, the warm-up contests and the open contest on Kattis, the contest organisers, and a table of participating sites in Denmark, Finland, Iceland, Norway and Sweden with their local organisers.

    The registration page explains how teams register through the ICPC registration system, step by step. The linked results, PDFs and archives are on other servers and are not part of our copy; neither are the sponsor logos at the top of the main page or its style sheet.
