  description: |-
    Page of the Swedish Championship in Programming 2002 (Svenskt Mästerskap i Programmering 2002), from the Division of Artificial Intelligence and Integrated Computer Systems, in Swedish. It states that the contest was held in Linköping, Lund, Stockholm and Umeå on 28 September 2002. The top has a table of the eight problems A to H (Mailboxes, Parallel computer, Moving pianos, Collecting beepers, Quantum, Goldbach, Downpayment, Lambda), each with links to test data, test results and sample solutions in C, C++ or Java, plus links to a hints document, an archive of all problems, test data and solutions, photos from Linköping, and the results page of the whole Nordic championship.

    The lower part holds two scoreboards with the same columns: team, time at which each of A to H was solved with a star for each wrong try before it, problems solved, total time and position. One covers the 62 Swedish teams, the other all 157 teams; the footer gives 157 teams and 396 participants. Two teams are marked as out of competition. The team in first place, from KTH, solved all eight problems.

    The linked statements, test data and solutions are not in our copy, which holds the page and two images.
