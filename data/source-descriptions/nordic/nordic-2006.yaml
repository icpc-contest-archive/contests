  contest_date: '2006-09-30'
  description: |-
    Website of the 2006 Nordic Collegiate Programming Contest, in English, for the contest held on Saturday 30 September 2006, 11:00 to 16:00 CEST. Our copy holds 4 pages. The main page states that 86 teams competed and that a team from KTH became Nordic champions with 7 of 9 problems solved, and that the best teams go on to NWERC 2006 in Stockholm. It links the scoreboards, a contestant list, the problem set, solution sketches, input, output and judges' solutions, and the problem clarifications. It names nine participating sites, five of them with photo links, and gives the rules: eligibility, what may be brought and used, behaviour during the contest, submission through PC^2, and the scoring and tie-break order.

    The other three pages are the clarifications page, a Norwegian-language page for the Trondheim site (time, place, a warm-up round on 23 September, prizes, technical specifications, and payment of expenses for the two best Norwegian teams to attend NWERC in Stockholm), and a Norwegian information sheet for Trondheim with allowed resources, computer set-up and test programs.

    The scoreboards, problem PDFs and solution files are on other addresses and are not part of the website pages in our copy. The contestant list is saved as the source code of a PHP script, without team names.
