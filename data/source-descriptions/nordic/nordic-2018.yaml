  title: NCPC 2018 Presentation of solutions
  language:
  - en
  contest_date: '2018-10-06'
  problems: 11
  pages: 81
  description: |-
    Slide deck of 81 pages by the NCPC 2018 jury, in English, presenting the solutions. After the title slide and a list of the ten jury members with their affiliations, it takes the eleven problems A to K one after another, in the order B, C, H, I, J, E, K, D, A, G, F. Each problem has slides stating the problem and its solution and the name of the problem author, and a closing statistics line with the number of submissions and accepted solutions; the time of the first accepted solution is given for nine problems, since G and F had no accepted solution. One slide gives a Prolog solution, to problem B. A slide of overall statistics (232 submitting teams, 3149 submissions, 792 accepted) comes before the last slides.

    The final slides announce the next stage, the Northwestern Europe Regional Contest (NWERC) in Eindhoven on 23 to 25 November, and say that each university sends up to two teams to it.
