  description: |-
    Final scoreboard of the contest as shown by Kattis after the contest ended: 283 teams ranked from 1, with solved count and total time, then one column for each of the problems A to K. A problem cell gives the number of attempts and the minute of the first correct solution, or a dash after the attempts when the problem was not solved. Country and affiliation are shown as small logos beside the team name. Omogen Heap is first with 9 problems solved in 692 minutes. 55 teams solved nothing and share rank 229.

    The page header gives the start (2018-10-06 11:00 CEST) and end (16:00 CEST) of the contest, and it offers filters by country, site and ICPC teams.
