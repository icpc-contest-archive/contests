  contest_date: '2005-10-01'
  description: |-
    Website of the 2005 Nordic Collegiate Programming Contest, in English, with the contest held on Saturday 1 October 2005, 11:00 to 16:00 CEST. Our copy holds 2 pages. The main page opens with a short results summary: the Nordic winner, also Swedish champion, was a team from the Royal Institute of Technology in Stockholm with eight of nine problems solved; second was a team from Lund Institute of Technology with six problems, and third a team from the University of Oslo with five, which is named Norwegian champion. It then links the Nordic, Swedish and Norwegian result pages, the problem set, solution sketches, input, output and solutions, and a contestant list. It lists thirteen participating sites by city, and gives the rules: who may compete, what may be brought, behaviour during the contest, the use of PC^2 for submissions, and the scoring and tie-break order.

    The second page is the local page for the Trondheim site, in Norwegian, with time, place, a warm-up round on 24 September, prizes, technical specifications, and payment of expenses for the best Norwegian team to attend NWERC in Stockholm.

    The linked result pages, problem PDFs and contestant list are not part of our copy, and neither is the style sheet.
