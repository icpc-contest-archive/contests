    Problems page of the Kattis contest site for The 2026 Nordic Collegiate Programming Contest, shown after the contest had ended (start 2026-10-03 11:00 CEST, five hours). A table lists the 13 problems A to M, from Autumn Audio to Marooned, with a score distribution column, the number of submissions and the time of the first solve; the first solve ranges from 3 minutes (problem I) to 4 hours 5 minutes (problem M).

    The score distribution column holds a bar per problem whose tooltip gives the number of teams that solved it, attempted it and made no submission. Each problem name links to a problem page on the contest site; those pages are not in our copy, so no statements are included.
