  description: |-
    Website of the 2026 Nordic Collegiate Programming Contest (NCPC), in English. Our copy holds 5 pages: the front page with news items dated May to October 2026, a Compete page with the announcement, registration notes, the rules and a section on recommended and allowed software, a Sites page, a Contact page listing the contest roles, and a call for problems.

    The contest is announced for Saturday 3 October 2026, 11:00 to 16:00 CEST, on Kattis, with registration open through 30 September 2026. The news items include a notice of 28 September 2026 that the rules on software and prewritten code were rewritten, with prewritten code now having to be printed, and a notice of 3 October 2026 about the livestream of the solution presentation and results. The Sites page is a table of 22 host universities in Denmark, Estonia, Finland, Iceland, Lithuania, Norway and Sweden, all marked Confirmed.

    The pages are those of the run-up to the contest: they hold no results and no problems.
