  description: |-
    Final scoreboard of the 2026 Nordic Collegiate Programming Contest on Kattis, shown after the contest had ended (start 2026-10-03 11:00 CEST, five hours). It lists 281 team rows with rank, team name, problems solved (Slv.) and total time, and thirteen problem columns A to M. Each problem cell gives the number of attempts and, for a solved problem, the minute of the accepted run (for example "1 12 min"); a cell with attempts and a dash is an unsolved problem, and an empty cell means no attempt. First place is Omogen Heap with 10 solved and a time of 664, and 10 is the highest number solved.

    Filter tabs on the page select all sites, the ICPC teams, a country or a single university. 226 rows have at least one problem solved, and the 55 rows with none share rank 227. Entries such as drop-in, extra, walk-in and coaches teams are listed with the other teams, identified only by their names. Each row carries a country flag and, for 279 of the 281 rows, an institution logo; there is no text column for the institution. 12 cells carry a first-to-solve mark.
