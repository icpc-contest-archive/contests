  contest_date: '2013-10-05'
  description: |-
    Website of the 2013 Nordic Collegiate Programming Contest, in English. The front page gives the contest day (Saturday 5th October, 11:00-16:00 CEST), a note that the winner was Omogen Heap from Stockholm with 9 of 11 problems solved, and links to the final standings, the problem set (PDF), slides describing solutions, the judges' input and output and judges' solutions as archives, packaged problems with test data, and the lists of registered teams and contestants. Further sections cover two warmup contests and a public contest on Kattis, the participating sites country by country (Denmark, Finland, Iceland, Norway, Sweden) with local organisers, sponsor logos, the contest officials, and the contest rules.

    Our copy holds 3 pages: the front page, a page on team registration through the ICPC registration system, and a page in Norwegian for the site at NTNU in Trondheim. The linked standings, problem set, team lists and solution files are not part of our copy, and neither are the style sheet and the sponsor logo images.
