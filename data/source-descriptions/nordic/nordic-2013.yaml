  description: |-
    Slides with the solutions to NCPC 2013, a PDF of 16 pages in English, presented by the NCPC jury and dated 2013-10-05. After the title slide and a list of the problem authors, there is one slide, or two for longer ones (F, C and I), for each of the eleven problems, in the order G, A, F, E, D, B, J, C, K, I, H. Each states the problem briefly and gives the insight and the solution or algorithm, occasionally with a proof or a time complexity, and names the problem author.
