    Final standings of the 2022 Nordic Collegiate Programming Contest on Kattis: 237 team rows and 11 problems labelled A to K. Each row gives rank, team name, country and institution as small flag and logo images, number solved, total time, and for each problem the number of attempts and the minute of the solution; the first team to solve a problem is marked. The Balloon Animals is first with 11 problems solved, in a total time of 1051. 37 teams have no problem solved, and the last rank shown is 201, shared by the teams that solved nothing.

    Walk-in teams are among the rows and are not marked as a separate group. The page offers filters by site and country and an ICPC filter. Style sheets and images are kept with our copy.
