  description: |-
    Page of the Nordic Collegiate Programming Contest 2022 on the NCPC website, in English. It states that the contest took place on Saturday 8 October 2022, 11:00 to 16:00 CEST, on site at Nordic universities, with 201 teams from 7 countries and 11 problems, and names the top three teams: The Balloon Animals from University of Copenhagen, which solved all 11 problems, #define true rand from Vilnius University, also with 11, and Keksi Fan Club from University of Helsinki with 10. It links the final results, the post-contest stream on YouTube, the problem set PDF, the solution slides, the problem packages with test data and the judges' solutions.

    Further sections cover five practice contests held between 11 September and 1 October 2022, registration and ICPC eligibility, a list of participating sites in 21 rows grouped by country (the first row names three Danish universities), with contacts and status (20 rows marked confirmed, one pending confirmation), the rules, a change-log, the open contest, notes for site directors and the organizers. The page was last updated 2022-10-07. Our copy is this one page; the linked files are not part of it.
