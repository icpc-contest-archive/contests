  description: |-
    Page of the Nordic Collegiate Programming Contest 2021 on the NCPC website, in English. It states that the contest ran on Saturday 9 October 2021, 11:00 to 16:00 CEST, online because of Covid-19, with 228 teams from 7 countries and 13 problems, and names the winning team, Omogen Heap from KTH Royal Institute of Technology, Sweden, as the only team with 11 problems solved. It links the final standings, the problem set as a PDF, the post-contest solutions stream on YouTube, the solution slides, and downloads of judges' input and output, judges' solutions and the full problem packages, all under the Creative Commons BY-SA 3.0 licence.

    The page also holds a table of 22 participating sites grouped under seven countries (Denmark, Estonia, Finland, Iceland, Lithuania, Norway, Sweden) with status, format (on site or only online) and contact details, and the contest rules, including how time and penalty are counted (20 minutes per incorrect submission). Our copy is this one page; the linked files are not part of it.
