    Final standings of the 2021 Nordic Collegiate Programming Contest on Kattis, marked "Contest is over": 228 teams, 13 problems labelled A to M. Each row gives rank, team name, country and institution as small flag and logo images, number solved, total time, and for each problem the number of attempts and the minute of the solution; the first team to solve a problem is marked. Omogen Heap is first with 11 problems solved; 29 teams have none solved, and ties at zero share rank 200.

    The page offers filters by site and by country and an ICPC filter, but in the table itself teams are not marked as ICPC-eligible or not; walk-in and extra teams appear among the others. Style sheets and images are kept with our copy.
