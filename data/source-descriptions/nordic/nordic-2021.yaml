  description: |-
    Slides of the NCPC 2021 presentation of solutions, a PDF of 155 pages in English. The cover lists seven problem authors with their affiliations (KTH Royal Institute of Technology, Apptus, University of Bergen, CSES, Spotify, University of Iceland). The slides go through all 13 problems, starting with K Knot Knowledge, one problem statement and solution per sequence of slides with the author named at the foot, and a statistics line for each of the 13 problems (submissions and accepted at the four-hour mark, and for eleven of them the time of the first accepted solution). The animation builds up step by step, so a problem's slides repeat with growing content.
