  description: |-
    Final scoreboard of NCPC 2011 from a page powered by Scrool: 250 team rows with rank, team name, a country flag and a school logo, number solved, total time and, for each of the ten problems A to J, the number of tries and the minute of the accepted solution. Summary rows above and below the teams give the share of accepted submissions per problem and the average number of tries. Links above the table select views: Nordic (all or ICPC), and per country (all or students, and individual universities). The first place has 10 problems solved; 15 teams at the foot have none. The page states the contest ran from 11:00 to 16:00 on 1 October 2011 and was generated on 19 November 2018.

    The flag and logo images are not in our copy, and the links lead to other addresses.
