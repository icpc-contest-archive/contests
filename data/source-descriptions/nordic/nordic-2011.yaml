  contest_date: '2011-10-01'
  description: |-
    Website of the Nordic Collegiate Programming Contest 2011, in English. The front page gives the contest time (1 October, 11:00 to 16:00 CEST), says that the contest used the Kattis judging system provided by Scrool and that the best student teams go on to NWERC, and states that the winner solved all 10 problems. It lists the national and local sites by country with a named organiser for most of them (three sites are marked as having no organiser), the sponsors as logos, the contest officials, and the rules.

    Our copy holds 4 pages: the front page, a page of registered teams, a registration page that holds only a frame pointing to another server, and a Norwegian page about the Trondheim site at NTNU. The front page links a problem set PDF, solution slides, sample input and output, the judges' data and the scoreboards; none of these is in our copy. The style sheet and the 14 images of the front page are also missing.
