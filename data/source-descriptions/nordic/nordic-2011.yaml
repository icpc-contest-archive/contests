    Final standings of the 2011 Nordic Collegiate Programming Contest: 186 teams with rank, team name, institution, number of problems solved and total time, followed by a medal column, a citation column and a site citation column. Four teams have a gold medal, four silver and four bronze; 87 teams carry the citation Honorable Mention, and twelve have a site citation naming them champion of their site. Ranks run from 1 to 179 with ties; first place has 9 problems solved and 8 teams at the foot have none. No per-problem detail.
