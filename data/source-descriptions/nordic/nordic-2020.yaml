  title: Nordic Collegiate Programming Contest 2020
  language:
  - en
  contest_date: '2020-11-07'
  description: |-
    Website page of NCPC 2020 with a notice that the contest uses the Kattis judging system. It reports that the contest was held online on 7 November 2020, 11:00 to 16:00 CET, because of Covid-19, with 221 teams from 27 universities across the Nordic and Baltic countries, and that the winning team solved 12 of 13 problems. Links lead to the final standings, the problem set PDF, a PDF of solution slides, a video of the post-contest solutions and results stream, the judges' input and output, the judges' solutions and the full problem packages, licensed under Creative Commons BY-SA 3.0.

    Further sections list 22 participating sites in seven countries, 20 of them marked remote or on site and two (Karlstad University and Luleå Institute of Technology) marked pending, and give the rules: teams, the Kattis system, scoring by number solved with 20 minutes of penalty per incorrect submission, and clarifications. A warm-up contest on 31 October 2020 is mentioned. Our copy is this one page only; the linked standings, files and video are not part of it.
