  description: |-
    Final scoreboard of the 2020 Nordic Collegiate Programming Contest as shown by Kattis: 221 teams with rank, team name, number solved and total time, then one column for each of the thirteen problems A to M with the number of attempts and the minute of the accepted solution. Unsolved problems with attempts show a dash. Gamlebamserne is first with 12 solved and 1463 minutes in the Time column; the 24 teams with no solved problems share rank 198. The page is marked as over, with a start of 2020-11-07 11:00 CET and an end of 16:00 CET, and has filters for each site and country.

    Two unlabelled columns next to the rank hold a country flag and a university logo image for each team; the filter lists are menus only. Our copy was saved in 2026, so the countdown text is out of date.
