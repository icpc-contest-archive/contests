    Problem set as handed out at the contest: a PDF of 28 pages in English, headed Nordic Collegiate Programming Contest, NCPC 2020, 7 November 2020, with a list of the thirteen problems A to M (Array of Discord through Methodic Multiplication) and a marking not to open before the contest. A page of advice follows, covering input and output, floating point tolerance, interactive problems and clarification requests. Each problem has a statement with samples; twelve have Input and Output sections, and problem I, an interactive problem, has an Interaction section with a sample interaction. Eleven picture or clip art credits appear in the statements. No test data or solutions.
