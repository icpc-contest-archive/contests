    Final standings of the 2020 Nordic Collegiate Programming Contest, produced from the data of the ICPC global site: 221 teams with rank, team, institution, problems solved and total time. A Medal column marks four gold, four silver and four bronze places, 127 teams are marked Ranked and 82 Honorable, a Citation column gives place names such as First Place, and a Site citation column names the site winners. The 82 Honorable teams have no rank. Gamlebamserne of the University of Copenhagen is first with 12 solved in 1463 minutes. There is no per-problem detail.

    The page is a rendering made for the archive from the stored data and states that it was made on 2026-11-13, so it is not the original page.
