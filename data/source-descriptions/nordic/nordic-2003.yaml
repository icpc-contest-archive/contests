  description: |-
    Website page of the Swedish Championship in Programming 2003 (Svenskt Mästerskap i Programmering 2003), from the Division of Artificial Intelligence and Integrated Computer Systems, in Swedish. It states that the contest was held in Linköping, Lund, Stockholm and Umeå between 11 and 16 o'clock on 27 September 2003, and lists the eight problems A to H (Hardware, Budget, Frogger, Gallup, Jackpot, Spiderman's workout, Subway planning, Exploding CPU). Each problem links to its statement, test data, a test result file or checker, and sample solutions in Java, C or C++, and to a comments entry.

    Our copy holds 49 files: the front page, the eight statements as PDFs of two or three pages, the test data and solutions, an archive of all problems, test data and solutions, a two-page PDF of short solution comments in Swedish and Norwegian, a page of comments on the problems in Swedish and Norwegian, and the two result pages, one for the Nordic competition (150 teams) and one for the Swedish teams (77 teams).
