    Final scoreboard of the 2003 Nordic programming competition, with a footer reading "Powered by Balloons'R'us": 150 teams with rank, team name (117 with university and country in brackets, for example LiU/SE or NTNU/NO), number solved and score. Eight problems A to H each show attempts and time of the accepted solution, or attempts and a dash when unsolved, followed by total attempts and number solved. Ranks are shared by tied teams, and the 14 teams with no problem solved are all ranked 137. The top team solved seven problems.

    The page has no medals, no links and no site or division marks.
