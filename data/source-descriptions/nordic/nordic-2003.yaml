  description: |-
    Website of the 2003 Swedish programming championship, run together with the Nordic competition and published by the Division of Artificial Intelligence and Integrated Computer Systems at Linköping University, mostly in Swedish. The front page says the contest ran 11:00 to 16:00 on 27 September 2003 in Linköping, Lund, Stockholm and Umeå. It lists the eight problems A to H (Hardware, Budget, Frogger, Gallup, Jackpot, Spiderman's workout, Subway planning, Exploding CPU), each with the statement PDF, test data, sample solutions in Java, C or C++, a link to comments, and for two problems a result checker in C++. Test results (expected output) are linked for six of the problems. Further links lead to a tar.gz archive of all problems, data and solutions, a PDF of hints on how to solve the problems, a results page for the Swedish championship and a results page for the Nordic competition.

    Our copy holds 49 files, all of these links included: the front page, the eight statement PDFs, the hints PDF, the tar.gz archive, a page of solution comments in Swedish and Norwegian, eight test data files, six expected-output files, eight Java solutions, eleven C and C++ source files, two images, and both results pages. The Nordic results page is a scoreboard of 150 teams and the Swedish one a scoreboard of 77 teams, each with solved count, score and attempts and time per problem.
