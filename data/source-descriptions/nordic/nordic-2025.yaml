  description: |-
    Final scoreboard of the 2025 Nordic Collegiate Programming Contest on Kattis, shown after the contest had ended (start 2025-10-04 11:00 CEST, five hours). It lists 269 team rows with rank, team name, problems solved (Slv.) and total time, and eleven problem columns A to K. Each problem cell gives the number of attempts and, for a solved problem, the minute of the accepted run (for example "2 3 min"); a cell with attempts and a dash is an unsolved problem, and an empty cell means no attempt. First place is snowman with 10 solved and a time of 1216.

    Filter tabs on the page select all sites, the ICPC teams, a country or a single university. 229 rows have at least one problem solved and 40 rows have none; the zero-solve rows share rank 230. Entries such as drop-in, extra, walk-in and coaches teams are listed with the other teams, identified only by their names. Each row carries a country flag and, for 267 of the 269 rows, an institution logo; there is no text column for the institution. 11 cells carry a first-to-solve mark.
