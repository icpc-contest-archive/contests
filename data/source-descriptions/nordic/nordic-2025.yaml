  description: |-
    Problem set of the Nordic Collegiate Programming Contest NCPC 2025 as handed out on 4 October 2025: a PDF of 24 pages in English. The cover lists eleven problems A to K (Arithmetic Adaptation to km/h) and carries the notice not to open it before the start. A page of general advice follows, on standard input and output, judging, clarification requests and floating point tolerance.

    Each problem starts on a new page with its statement, input and output format and samples; problem A has four samples and an explanation of the first. Three pages are marked as intentionally left blank, the last page of the file among them. No test data or solutions.
