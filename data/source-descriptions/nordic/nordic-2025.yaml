  description: |-
    Slides presenting the solutions of the NCPC 2025 problems, in English: a PDF of 108 pages dated October 4, 2025. The second slide lists the people who prepared the problems and the test solvers, with their institutions. From the third slide on, the slides take the problems in the order A, K, C, I, G, D, E, B, J, F, H. Each problem has a problem summary, its solution ideas and the author of the problem (for A an almost-solution and its edge cases). Many slides build up step by step, so a problem spans several near-identical pages. The slides for nine problems (all except I and K) carry a line with submission statistics at the 4-hour mark. The last slide is headed Results!.

    The slides cover the solutions only; the problem statements are a separate document.
