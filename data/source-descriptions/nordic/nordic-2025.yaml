  - en
  contest_date: '2025-10-04'
  description: |-
    Website of the 2025 Nordic Collegiate Programming Contest (NCPC), in English. Our copy holds 5 pages: the front page with dated news items from March to November 2025, a Compete page with the announcement, registration notes, the rules and a table of host sites, a Sites page, a Contact page listing the contest roles, and a call for problems.

    The front page and the Compete page state that the contest ran on Saturday 4 October 2025 from 11:00 to 16:00 CEST on Kattis, and that 232 teams from 7 countries tried 11 problems. They name snowman (University of Copenhagen, 10 problems) as winner, BishBashBosh (Aarhus University, 10) second and Omogen Heap (KTH, 9) third.

    Links to the final results, the problem set PDF, the solution slides and two zip files of problem packages and judges' solutions lead to files outside the pages of this copy. The About and Archive pages in the menu are not in our copy.
