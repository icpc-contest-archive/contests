    Sites page of the NCPC 2025 website: a table of 25 universities, each with a country flag from Denmark, Estonia, Finland, Iceland, Lithuania, Norway or Sweden, the contact persons for the site (site directors) and a status. 22 sites are marked Confirmed and 3 Pending Confirmation, which the page explains as sites that were organised the year before but not yet confirmed for this year.

    Below the table the page explains what a site director is responsible for and the conditions each site has to meet. It is a page of the contest's website, not a list of competing teams. The page carries no contest date.
