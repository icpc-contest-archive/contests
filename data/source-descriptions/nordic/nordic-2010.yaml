  description: |-
    Final scoreboard of NCPC 2010 from a page powered by Scrool: 232 team rows with rank, team name, number solved, total time and, for each of the eleven problems A to K, the number of tries and the minute of the accepted solution. Summary rows above and below the teams give the share of accepted submissions per problem and the average number of tries. Links above the table select views: Nordic (all or ICPC), and per country (all or students, and individual universities). The first place has 8 problems solved; 16 teams at the foot have none. The page states the contest ran from 11:05 to 16:05 on 2 October 2010 and was generated on 26 February 2011.

    The links on the page lead to other addresses and are not part of our copy.
