  title: Nordic Collegiate Programming Contest 2010
  language:
  - en
  contest_date: '2010-10-02'
  description: |-
    Website of the Nordic Collegiate Programming Contest 2010, in English. The front page gives the contest time (2 October, 11:00 to 16:00 CEST), says that the contest used the Kattis judging system and that the best student teams go on to NWERC, and states that the winner solved 8 of 11 problems. It lists the national and local sites by country with a named organiser for most of them (three sites are marked as having no organiser), the sponsors as logos, the contest officials, and the rules (teams of up to three, ranking by problems solved and then total time, 20 penalty minutes per incorrect submission).

    Our copy holds 5 pages: the front page, a scoreboard page, a page of registered teams, a registration page that holds only a frame pointing to another server, and a Norwegian page about the Trondheim site at NTNU. The front page links a problem set PDF, solution slides, sample input and output, and the judges' data; none of these files is in our copy.
