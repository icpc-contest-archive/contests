  title: Nordic Collegiate Programming Contest 2019
  language:
  - en
  contest_date: '2019-10-05'
  description: |-
    Website of NCPC 2019 on the Nordic ICPC site, in English. Our copy holds 2 pages. The main page is headed "NCPC 2019, Saturday October 5th 11:00-16:00 CEST" and states that the contest was held that day and that the winning team, Omogen Heap from KTH Royal Institute of Technology, solved 10 of 11 problems. It links the final results, the problem set and solution slides (PDF), the judges' input, output and solutions, and the packaged problems with test data, with a Creative Commons BY-SA 3.0 licence note. It lists the participating sites by country (Denmark, Estonia, Finland, Iceland, Norway, Sweden) with a contact for each and a mark for verified sites, the organisers and jury roles, and the rules: Kattis as the judging system, the winner being the team with most problems solved and then lowest total time, 20 penalty minutes per incorrect submission, and clarification requests.

    The second page is a guide to registering teams through the ICPC registration system; its heading refers to 2017. The links to results, files and local sites lead to other servers and are not part of our copy.
