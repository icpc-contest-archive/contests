- url: https://icpcarchive.github.io/Europe/Northwestern-Europe/Nordic-Collegiate-Programming-Contest/The-2019-Nordic-Collegiate-Programming-Contest/tutorials_en.pdf
  read: '2026-11-16'
  rubric: 1
  copy: nordic/nordic-2019/editorial/20261114-live-13247491/tutorials_en.pdf
  title: NCPC 2019 Presentation of solutions
  language:
  - en
  contest_date: '2019-10-05'
  problems: 11
  pages: 81
  description: |-
    Slide deck of 81 pages by the NCPC 2019 jury, in English, presenting the solutions. After the title slide and a list of the nine people who prepared the problems, with their affiliations, it takes the eleven problems A to K one after another, in the order H, E, A, K, B, C, G, F, I, J, D. Each problem has slides stating the problem and its solution and the name of the problem author, and a closing statistics line with the number of submissions and accepted solutions; the time of the first accepted solution is given for ten problems, since D had one submission and no accepted solution. One slide gives a solution to Hot Hike headed Business Logic Solution, in COBOL syntax. A slide of overall statistics (231 submitting teams, 3303 submissions, 1002 accepted) comes before the last slides.

    The final slides announce the next stage, the Northwestern Europe Regional Contest (NWERC) in Eindhoven on 15 to 17 November, and say that each university sends up to two teams to it.
