  description: |-
    Final scoreboard of the contest as shown by Kattis after the contest ended: 288 teams ranked from 1, with solved count and total time, then one column for each of the problems A to K. A problem cell gives the number of attempts and the minute of the first correct solution, or a dash after the attempts when the problem was not solved. Country and affiliation are shown as small logos beside the team name. Four teams solved 10 problems; Omogen Heap is first with 10 solved in 834 minutes. 67 teams solved nothing and share rank 222; five of them are named as walk-in teams.

    The page header gives the start (2019-10-05 11:00 CEST) and end (16:00 CEST) of the contest, and it offers filters by country, site and ICPC teams.
