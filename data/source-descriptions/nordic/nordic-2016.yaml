  tries: true
  description: |-
    Final scoreboard of the 2016 Nordic Collegiate Programming Contest on Kattis, shown with the contest marked as over. It has 314 team rows with rank, team name, country flag, institution logo, number solved and total time, followed by eleven problem columns A to K. Each problem cell gives the number of tries and the minute of the accepted solution; unsolved problems with attempts show the tries and a dash. Teams with equal results share a rank: 46 teams with no solved problem share rank 269, the last rank. First place goes to Game of Nolife with 10 problems solved in 833 minutes.

    Filter links above the table select all sites, one country (each with an All and an ICPC view) or one site, and the table mixes ICPC and other participants without marking them in the rows. Ten cells carry the first-to-solve mark. Our copy holds the page with its flag and logo images, style sheets and scripts.
