  description: |-
    Slides of 87 pages, in English, titled NCPC 2016 Presentation of solutions by the jury and dated 2016-10-08. After a list of the nine jury members come the problems, each with a short description of the problem, the idea of the solution and, for each of the eleven problems, a statistics line giving the number of submissions and accepted solutions; the problem author is named. Near the end are slides with numbers for the whole contest (296 teams, 3045 submissions), random facts about the problems and test data, and what happens next, naming the Northwestern Europe Contest in Bath on 18 November.
