  title: Nordic Collegiate Programming Contest 2016
  language:
  - en
  contest_date: '2016-10-08'
  description: |-
    Website of the 2016 Nordic Collegiate Programming Contest (NCPC), written in English. Our copy holds 2 pages. The main page gives the contest time (Saturday 8 October 2016, 11:00 to 16:00 CEST), names the winning team and its university, and links the final standings, the problem set, slides describing the solutions, the judges' input and output, the judges' solutions, the packaged problems and the list of registered teams. Below that it lists the participating sites by country with an organiser for all but one (Uppsala University has none), with verified sites marked, a row of sponsor logos, the officials of the contest, and the rules, which cover the Kattis judging system, scoring and clarifications.

    The second page in our copy is the registration process through the ICPC registration system, with step-by-step instructions for team captains. The links to the standings, problem set, slides and data files lead outside our copy, and the page images and style sheets are not in it.
