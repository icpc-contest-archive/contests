  description: |-
    Website of the 2008 ACM ICPC Asia regional contest, Chengdu site, hosted by Southwest University for Nationalities, mostly in Chinese with the contest name in English in the footer. Our copy holds 14 pages. It has a news list (December 2008 back to October 2008), an introduction to the contest, the organising committee, the rules, the computer environment (PC^2 judging system), the schedule for the on-site contest on 28 to 30 November 2008 and for a provincial contest earlier in the year, travel and accommodation, and contact details.

    The one scoreboard in our copy belongs to the 2008 Sichuan provincial collegiate contest, not the regional: 41 teams, eight problems A to H, with attempts and time per problem and a total column of attempts and number solved. The results page links two results: the provincial contest, whose scoreboard is in our copy, and the regional, whose page says only that results will be published after the contest. The news items about the final ranking and the problems are popup links that are not in our copy. The photo page refers to three photos that are not in our copy, and the banner and sponsor logos are missing too.
