    Single-problem statement PDF of 5 pages, titled "4400 - Transit search" with the region line "Asia - ChengDu - 2008/2009", written in English. The statement describes a web map of Guangzhou made of picture tiles at successive zoom levels, with positions given as a tile id plus offsets, and asks for a transit plan between two positions from bus stops and bus lines: walk there, the fewest bus changes, or take a taxi. It includes the input and output formats and a sample with three cases. It ends with sample output and the line "ChengDu 2008-2009"; the problem carries no letter in the copy.
