    Single-problem statement PDF of 3 pages, titled "4395 - Crop circles" with the region line "Asia - ChengDu - 2008/2009", written in English. The statement models crop circles as N circles with an importance value each, calls two circles connected if one can go from one to the other crossing at most K borderlines, and asks for the maximum importance difference over connected pairs; it has an introductory picture, a worked example, the input and output formats and a sample with two cases. It ends with sample output and the line "ChengDu 2008-2009"; the problem carries no letter in the copy.
