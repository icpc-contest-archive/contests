    Single-problem statement PDF of 2 pages, titled "4392 - Process scheduling" with the region line "Asia - ChengDu - 2008/2009", written in English. The statement asks whether n processes, each holding some amount of m kinds of resources and needing more, can be run in some order given the available resources; the input has an allocation table, a request table and the available amounts (n up to 50000), and the output is Yes or No. It ends with sample output and the line "ChengDu 2008-2009"; the problem carries no letter in the copy.
