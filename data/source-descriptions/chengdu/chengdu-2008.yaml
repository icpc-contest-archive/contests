    Single-problem statement PDF of 2 pages, titled "4399 - Toy" with the region line "Asia - ChengDu - 2008/2009", written in English. The statement describes a toy of N+1 balls and 2N sticks, a central ball joined to N others that form a ring, and asks for the number of ways to remove N sticks that leave all balls connected (rotations counted as the same), modulo M; N and M go up to 10^9, with figures of two examples and a three-case sample. It ends with sample output and the line "ChengDu 2008-2009"; the problem carries no letter in the copy.
