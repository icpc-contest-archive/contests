    Single problem statement, a PDF of 2 pages, titled "4022 - Jubilation" with the region line "Asia - ChengDu - 2007/2008". Given this year's and last year's rank lists and each team's expected place, the task is to compute the total satisfaction degree of all teams by a stated three-level rule. It has Input and Output sections and a sample of two cases, both with output 12. The last line is "ChengDu 2007-2008". No problem letter is printed.
