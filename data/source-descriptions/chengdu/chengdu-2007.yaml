    Single problem statement, a PDF of 2 pages, titled "4018 - Flight Control" with the region line "Asia - ChengDu - 2007/2008". A grid of sensor readings is given, with rules for which cells can be the trace of one aircraft along a row or column; the task is to output the minimum possible number of aircraft. It has Input and Output sections and one sample case, a 3 by 3 grid, with output "Case 1: 3". The last line is "ChengDu 2007-2008". No problem letter is printed.
