    Single problem statement, a PDF of 2 pages, titled "4016 - David Shopping" with the region line "Asia - ChengDu - 2007/2008". David walks past N shops with a pocket that holds M gifts and discards gifts by a stated rule; the task is to output how many gifts are discarded. The statement includes a worked example with five shops, Input and Output sections, and a sample of six cases (outputs 1, 0, 2, 7, 0, 3). The last line is "ChengDu 2007-2008". No problem letter is printed.
