  description: |-
    Single problem statement, a PDF of 2 pages, titled "4019 - Go to Class" with the region line "Asia - ChengDu - 2007/2008". A campus is divided into lawns that may not be crossed, separated by horizontal and vertical roads; the task is to give the shortest path from the dormitory to the classroom, with accuracy 10^-4. It refers to a picture of the campus, and has Input and Output sections and one sample case with output "Case 1: 12.0000". The last line is "ChengDu 2007-2008". No problem letter is printed.
