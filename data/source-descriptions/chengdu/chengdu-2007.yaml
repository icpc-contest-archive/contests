  description: |-
    Single problem statement, a PDF of 2 pages, titled "4013 - A Sequence of Numbers" under the region line "Asia - ChengDu - 2007/2008". It describes a sequence of N integers on which two kinds of operations are applied, a modification that adds a value to every number with wrap-around at 2^16, and a query on a bitwise-and condition; the output is the sum of the answers to all queries. It has Input and Output sections and one sample case with output "Case 1: 5". The last line is "ChengDu 2007-2008". No problem letter is printed.
