    Single problem statement, a PDF of 2 pages, titled "4017 - Evaluating Functions" with the region line "Asia - ChengDu - 2007/2008". It is set around a teleport machine with N cylinders of given heights, whose values are computed by a stepwise process; the task is to output the K-th largest of the N values. It has Input and Output sections and a sample of two cases (outputs 2 and 8). The last line is "ChengDu 2007-2008". No problem letter is printed.
