  description: |-
    Single problem statement, a PDF of 2 pages, titled "4020 - Hard Rode" with the region line "Asia - ChengDu - 2007/2008". It opens with a passage on the difficulty of travel into Sichuan and the railways there, then poses a single-track problem: N trains of given speeds leave at a fixed interval and must not pass the same spot at the same time, and the task is the minimum time needed for the trains to pull into the terminal. It has Input and Output sections and one sample case with output "Case 1: 101500". The last line is "ChengDu 2007-2008". No problem letter is printed.
