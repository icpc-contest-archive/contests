    Single problem statement, a PDF of 2 pages, titled "4015 - Caves" with the region line "Asia - ChengDu - 2007/2008". The caves of a tribe form a tree with a main cave; a robot can walk only x meters, and for each of q queries the task is to give the most caves it can explore. It has Input and Output sections and one sample case with three queries. The last line is "ChengDu 2007-2008". No problem letter is printed.
