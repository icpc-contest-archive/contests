  pages: 2
  description: |-
    Single problem statement, a PDF of 2 pages, headed "4014 - Boonie and Clyde" (spelled so in the heading; the text says Bonnie) with the region line "Asia - ChengDu - 2007/2008". Two computers in a network of bidirectional cables are attacked; the task is to count the ways to choose them so that at least two other computers end up disconnected. It has Input and Output sections and two sample cases (output "Case 1: 2" and "Case 2: 11"). The last line is "ChengDu 2007-2008". No problem letter is printed.
