  description: |-
    Standings page headed 'View Standings: The 2007 ACM Asia Programming Contest - Chengdu': 924 team rows with columns Rank, Team (institution and team name), Citation, number solved and time. 63 teams carry a rank, from 1 to 46 with ties, with citations from Champion down to Forty-sixth Place; the first-place team solved seven problems. The other 861 teams are listed without rank under Honorable Mention. Number solved is given for 48 of the ranked rows and time for 21 of them. Three ranked teams carry a star mark in the citation column, which the page does not explain. No per-problem detail.
