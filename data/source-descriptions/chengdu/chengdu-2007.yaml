    List of the schools qualified for the on-site contest of the 32nd ACM ICPC Asia regional at Chengdu, in Chinese, headed 晋级名单 (jìnjí míngdān, "list of qualifiers"). It gives the rules by which places were allotted (best online-round result per school, schools placed at recent World Finals, host schools, western schools, schools that helped organise, schools outside mainland China) and ends with each school and its number of teams, 88 teams in total as the page states. It holds school names only, no team names and no results.
