  pages: 1
  description: |-
    Single problem statement, a PDF of 1 page, titled "4021 - Integer Game" with the region line "Asia - ChengDu - 2007/2008". Numbers are arranged in a circle and an operation on a negative number changes its two neighbours; the task is the maximum number of operations, or -1 if the game can go on forever. It has Input and Output sections and a sample of two cases (outputs 1 and 0). The last line is "ChengDu 2007-2008". No problem letter is printed.
