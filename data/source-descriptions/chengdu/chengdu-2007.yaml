- url: http://acm.xhu.edu.cn
  read: '2026-11-16'
  rubric: 1
  copy: chengdu/chengdu-2007/website/2026-09-05-wayback-b2dfe5ce
  title: ACM/ICPC::XiHua University
  language:
  - zh
  - en
  contest_date: '2007-11-18'
  description: |-
    Website of the 2007 Chengdu regional contest (the 32nd ACM ICPC Asia regional), run by Xihua University, in Chinese. Our copy holds 109 files, 99 of them pages. The contest section has the background of ACM ICPC, the organising committee and sponsors, the rules of the host's own contest, the schedule of 16 to 19 November 2007 at Xihua University, registration, training dates, news items and a page listing the schools and number of teams that qualified for the on-site contest (88 teams in total).

    The results page of the on-site contest is in our copy: a table of 66 team rows with a medal column headed Dongfang Hope Cup medal (gold, silver or bronze), school rank, ICPC team rank with its medal in brackets, seat number, number of problems solved, school, team name and a note column. The number solved is blank for the last 16 rows. The site also holds the pages of a first Xihua University online contest held on 1 July 2007, with a list of five problems, status pages with submission results and a ranklist.

    The same address was captured at several dates, so some pages appear twice; the earliest capture of the results page says only that it is under construction.
