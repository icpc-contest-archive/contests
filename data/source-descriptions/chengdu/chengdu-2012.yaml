    Statement of one problem, as a single PDF page with no number, title, contest name or running head printed. It describes a simplified blackjack game played over a deck of n cards, where the player cuts the deck once by choosing p and q, and the task is to maximise the number of rounds the friend wins. It has the input and output format and a sample of two cases. The page prints no title, so its problem could not be matched by name.
