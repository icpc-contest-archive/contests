  description: |-
    Website of the 2012 Chengdu regional contest (the 37th ACM-ICPC Asia regional), hosted by Chengdu Neusoft Institute, in Chinese. Our copy holds 150 files, 56 of them empty. 22 files are pages of the contest site: the home page, the rules for qualifying for the on-site contest, a table of the on-site places allotted to 97 schools (141 teams in all; columns for online-round qualifiers, last year's World Finals schools, other regionals' host schools and spare places), six registration notices for the online round and the on-site contest, and thirteen pages in the college section (an introduction, travel directions, a campus map link, a note on summer-term ACM training, two letters from students on a placement in the United States, three pages with only a title, a photo page whose images are not in our copy, and two list pages). The home page lists further posts, such as the on-site results and the online-round ranking, that are not in our copy.

    Most of the other files belong to NSUOJ, an online judge on the same host: 37 problem pages, 13 contest lists with entries dated 2017 to 2019, 65 web board pages and its status, ranklist and other pages. They are not about this contest.
