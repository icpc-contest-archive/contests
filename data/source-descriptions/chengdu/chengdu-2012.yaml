  description: |-
    Statement of one problem, printed as "6361 Candy", as a single PDF page. A child with two boxes of n candies picks a box with probability p each day, and the question is the expected number of candies left in the other box when he finds a box empty. It has the input and output format, an accepted absolute error of 10^-4, and six sample cases. The page prints no contest name, region or letter.
