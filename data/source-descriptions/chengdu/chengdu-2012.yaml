  description: |-
    Statement of one problem, printed as "6362 Triangle", as a PDF of two pages. A wire of length n is cut into ordered pieces folded into integral, pairwise similar triangles, and the task is to count the ways, modulo 10^9+7. It has an explanation of the terms, a worked case for n = 9, the input and output format and a sample of 16 cases on page 2. Page 2 carries the running head "ACM-ICPC Live Archive: 6362 – Triangle 2/2". No contest name or letter is printed.
