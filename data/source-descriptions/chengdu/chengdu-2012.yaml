    Statement of one problem, printed as "6367 Homework", as a PDF of two pages. The task is to compute f[n] modulo 10^9+7 for a linear recurrence, where the recurrence changes at up to 100 given special values of n. It has the input and output format, a hint explaining the two sample cases, and the samples. Page 2 carries the running head "ACM-ICPC Live Archive: 6367 – Homework 2/2". No contest name or letter is printed.
