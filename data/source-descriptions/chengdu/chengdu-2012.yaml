  description: |-
    Statement of one problem, printed as "6368 Count", as a PDF of two pages with an embedded illustration. It counts the different harmonious relationship configurations of n people, a rooted tree in which everyone at the same level has the same number of subordinates, modulo 10^9+7. It has the input and output format and a sample of seven cases. Page 2 carries the running head "ACM-ICPC Live Archive: 6368 – Count 2/2". No contest name or letter is printed.
