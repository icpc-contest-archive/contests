  description: |-
    Scoreboard of the 2012 Chengdu on-site contest, headed ICPC 2012 成都赛区现场赛 排行榜 (ranklist): 146 team rows, ranks 1 to 146, and eleven problems A to K. Columns are school number, school, rank, team, number solved, time, and attempts and time for each problem, with a legend for first solve, solved, attempted and pending judgement and two numbers under each problem heading (for example 146/159 for A). Five teams are starred in the school number column; the page does not say what the star means. A line states the medal counts as 15 gold, 30 silver and 45 bronze. Every team solved at least one problem; the first place team solved seven.

    The page also has a navigation list of ranklists of other regional contests from 2008 to 2012, whose links are not part of our copy.
