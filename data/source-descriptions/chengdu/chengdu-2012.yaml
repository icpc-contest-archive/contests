    Statement of one problem, as a single PDF page with no number, title, contest name or running head printed. It opens with a story and describes a graph with weighted edges and nodes coloured 0 or 1, with the operations Change (flip a node's colour) and Asksum A B (sum the weights of edges whose end points have colours A and B). It has the input and output format and a sample of two test cases. The page prints no title, so its problem could not be matched by name.
