  description: |-
    Editorial slides, a PDF of 46 pages made with LaTeX Beamer, by 电子科技大学出题组 (Diànzǐ Kējì Dàxué chūtí zǔ, "UESTC problem-setting group"). The cover reads 第 50 届 ICPC 亚洲区域赛 (成都站) 题解 (Dì 50 jiè ICPC Yàzhōu Qūyùsài (Chéngdū zhàn) tíjiě, "50th ICPC Asia Regional Contest, Chengdu site, solutions") with the English line The 2025 ICPC Asia Chengdu Regional Contest - Tutorial, and the date 26 October 2025. The explanations are in Chinese.

    An overview page sorts the problems from Easy (G, J) to Hard (E, F); then all 13 problems follow in the order J, G, A, B, D, L, C, K, M, I, H, E, F, each with a summary of the task, the size of the shortest solution in bytes and the solution idea. The slides head problem A as "Arrow Painting" and problem I as "Inside Polygon". The deck ends on the third page about problem F, without a closing page.
