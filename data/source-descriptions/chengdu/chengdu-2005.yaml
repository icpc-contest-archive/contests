    Statement of problem 3452, "Alice and Bob", as a one-page PDF in English. The first line gives the problem number and title and the second line the region and season, "Asia - ChengDu - 2005/2006"; each page carries a page label such as "3452 - Alice and Bob 1/1". It is about a card game in which Bob follows a stated strategy and the task is to choose the optimal M for a given N. It has Input and Output sections and a sample with three values of N.
