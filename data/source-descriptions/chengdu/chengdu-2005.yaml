  description: |-
    Statement of problem 3453, "Apple", as a 3-page PDF in English. The first line gives the problem number and title and the second line the region and season, "Asia - ChengDu - 2005/2006"; each page carries a page label such as "3453 - Apple 1/3". It is a two-player game on a 5 by 6 board between Steve and a thief who take apples from trees, and the task is to find how many apples the thief gets. It has Input and Output sections, a sample of three boards with outputs 9, 12 and 0, and a Tips note explaining that the game state may loop.
