  description: |-
    Statement of problem 3450, "Pizza Maker", as a 4-page PDF in English. The first line gives the problem number and title and the second line the region and season, "Asia - ChengDu - 2005/2006"; each page carries a page label such as "3450 - Pizza Maker 1/4". It describes a pizza-making machine built from components joined by tunnels and asks for a program that simulates it, printing the output of the components connected to product outlets. It has Input and Output sections and a sample, and two figures are referred to in the text.
