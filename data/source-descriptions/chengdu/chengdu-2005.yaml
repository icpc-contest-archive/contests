  title: 第30届ACM国际大学生程序设计竞赛亚洲区成都赛区预选赛
  title_en: The 30th ACM International Collegiate Programming Contest, Asia Chengdu regional, preliminary
  language:
  - zh
  description: |-
    Website of Sichuan University's ACM/ICPC team, in Chinese. Our copy holds 149 pages, captured at several dates. Sixteen addresses are the contest section (the index appears under two addresses) of the 30th ACM-ICPC Asia Chengdu regional, held in 2005: an introduction, a news list from June to November 2005, the schedule (online round on 25 September, on-site contest at Sichuan University on 5 and 6 November), rules, registration with a fee of 800 yuan per team, the computer environment (Debian Linux, PC^2 8.6), travel, organisation, contact and links. The results page only links to rank lists and the problems page to an archive of the contest problems; neither target is in our copy. The photo and report pages are placeholders.

    The rest of the copy is other material of the same site: 127 pages of the Sichuan University Online Judge for ACM/ICPC, of which 114 are problem pages numbered 1001 to 1114 that show only a title; a sign-up page of the fifth Sichuan University programming contest; an older online judge FAQ page; and the home page of the 7th Sichuan provincial programming contest of 2015, which is the seed page.
- url: http://icpc.baylor.edu/icpc/regionals/ViewRegionalStandings.asp?ContestID=745
  read: '2026-11-16'
  rubric: 1
  copy: chengdu/chengdu-2005/standings/2026-09-01-wayback-1f9a90ac/page.html
  title: The 2005 ACM Asia Programming Contest - ChengDu
  language:
  - en
  teams: 468
  description: |-
    Standings headed The 2005 ACM Asia Programming Contest - ChengDu, sponsored by IBM: 468 teams with rank, team, citation, number of problems solved and time. The team column gives the university and the team name, joined by an arrow. The first 28 rows carry ranks 1 to 24 (with ties) and the citations First Place to Twenty-fourth Place; they solved 2 to 4 problems, and first place is Tsinghua University's Tsinghua Dream Catcher with 4 solved. The other 440 teams are listed without rank, solved count or time, under Honorable Mention. There is no per-problem detail.

    Three team entries contain Chinese text in a legacy Chinese encoding; the page declares no charset, so they show as garbled letters unless read as GBK.
