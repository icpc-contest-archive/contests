  description: |-
    Statement of problem 3451, "Longest Common Substring", as a one-page PDF in English. The first line gives the problem number and title and the second line the region and season, "Asia - ChengDu - 2005/2006"; each page carries a page label such as "3451 - Longest Common Substring 1/1". It asks for the length of the longest common substring of N given strings. It has Input and Output sections and a sample with three strings and the answer 2.
