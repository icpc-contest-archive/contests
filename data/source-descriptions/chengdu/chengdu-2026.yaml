  title: 第 51 届 ICPC 亚洲区域赛（成都站）题解 The 2026 ICPC Asia Chengdu Regional Contest - Tutorial
  title_en: Solutions of the 51st ICPC Asia Regional Contest (Chengdu site) / The 2026 ICPC Asia Chengdu Regional Contest - Tutorial
  language:
  - zh
  - en
  problems: 13
  pages: 58
  description: |-
    Editorial slides by the problem-setting team of UESTC, 电子科技大学出题组 (Diànzǐ Kējì Dàxué chūtízǔ, "University of Electronic Science and Technology of China problem-setting team"): a PDF of 58 Beamer slides in Chinese, titled 第 51 届 ICPC 亚洲区域赛（成都站）题解 (dì 51 jiè ICPC Yàzhōu qūyùsài Chéngdū zhàn tíjiě, "solutions of the 51st ICPC Asia Regional Contest, Chengdu site") with the English subtitle "The 2026 ICPC Asia Chengdu Regional Contest - Tutorial", and dated 25 October 2026 on the cover.

    A second slide sorts the problems by expected difficulty, from Easy (D, K, M) to Hard (J, L). All 13 problems A to M are covered in the order D, M, K, C, I, H, A, E, G, F, B, J, L; each section opens with a summary of the problem and the size of the standard solution, then explains the solution with formulas and diagrams. The last slides continue the construction for problem L.
