  title: 2013 ACM-ICPC Asia Regional Contest (Chengdu Site) | University of Electronic Science and Technology of China
  language:
  - zh
  description: |-
    Website of the 2013 Chengdu site of the ACM-ICPC Asia Regional Contest, run by the University of Electronic Science and Technology of China, in Chinese. The front page of the contest site holds news posts from May to October 2013: the final ranking and on-site quota allocation of the online round, the close of appeals, bank-transfer details and a table of schools with the number of teams and fees paid, short profiles of two sponsors (Huawei and a Shanghai information technology company), and a notice about a provincial contest. Its menu names pages on the contest, the venue, directions and the schedule, and the sidebar lists the other 2013 China sites (Changsha, Changchun, Hangzhou, Nanjing). Only the front page of the contest site is in our copy; the menu pages are not.

    Most of the 150 files in our copy come from the UESTC OnlineJudge for ACM/ICPC at the same host: problem lists, contest lists, ranklists, registration lists, a heroes page of past results of the UESTC team, and tables exported from Excel such as a 2013 pre-summer training ranking. These pages mostly concern UESTC's own training and school contests, not the Chengdu regional. Five https addresses of the host, among them a second copy of the contest-site address, are empty application shells titled Lutece that need JavaScript.
