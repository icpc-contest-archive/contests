    Problem page of a contest on the Hangzhou Dianzi University Online Judge 3.0, numbered 1001, "Assignment For Princess", with time limit 2000/1000 MS (Java/Others), memory 32768 K, marked Special Judge. The full statement in English is shown, with input and output format, one sample input and output and a hint about the sample. The task is to construct a map of directed roads, taking 1 to M days each, in which every castle can reach every other and every round trip takes a multiple of three days. Above the statement a line in Chinese, 这里是本场比赛全部题目的PDF文件 (zhèlǐ shì běn chǎng bǐsài quánbù tímù de PDF wénjiàn, "here is the PDF file of all the problems of this contest"), links to a PDF of the whole problem set, which is not in our copy. The page also shows the judge's submission counts for the problem.
