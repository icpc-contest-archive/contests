  description: |-
    Problem list of a contest on the Hangzhou Dianzi University Online Judge, a re-run of the 2013 Chengdu on-site contest. Ten problems numbered 1001 to 1010, each linked to its statement on the judge: Assignment For Princess, Beautiful Soup, Clumsy Algorithm, Dinner Coming Soon, Exhausted Robot, Fibonacci Tree, GRE Words Revenge, Hard Disk Drive, ICPC Ranking and Just Random. The page gives accepted and submitted counts for each problem and the re-run's own start and end times of 2013-11-16 12:00 to 17:00. Only the list is in our copy, not the statements.
