    Scoreboard of the Chengdu on-site contest on a Chinese ranklist page: 165 ranked teams, with school, rank, team name, number solved, penalty time and, for each of the ten problems A to J, the number of tries and the minute of the accepted run. Each problem heading also shows two numbers, the number of teams that solved it and the total number of tries in its column; a cell without a minute gives tries only. A legend marks first solves, solved, attempted and pending cells. The page states a start time of 2013-10-20 09:00, a page timestamp of 2013/10/21 14:50:07 and medal counts of 15 gold, 30 silver and 45 bronze. Fourteen rows carry an asterisk in the first column, among them the second-ranked team from the host university; they are listed in rank order among the others. The side menu links to ranklists of other contests of 2008 to 2013. First place is NowOrNever of Tsinghua University with 8 problems solved.
