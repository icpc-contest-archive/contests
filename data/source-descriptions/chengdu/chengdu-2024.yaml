    Editorial slides in Chinese, a PDF of 40 pages made with LaTeX Beamer, by the problem-setting group of the University of Electronic Science and Technology of China, 电子科技大学出题组 (Diànzǐ Kējì Dàxué chūtí zǔ, "UESTC problem-setting group"). The cover gives the title 2024 国际大学生程序设计竞赛亚洲区域赛（成都站） ("2024 ICPC Asia Regional Contest, Chengdu site") and the date 27 October 2024.

    After an overview page that sorts the problems from Easy (J, L) to Hard (H, M), the slides cover all 13 problems in the order L, J, A, B, G, I, E, K, D, F, C, H, M; each gets a summary of the task, keywords and the solution idea and most also state the time complexity. The last page is a closing "Thank you!".
