    Page of a replay contest on the Luogu judge, held on 2026-01-26 from 13:00 to 18:00 in ICPC style with a frozen last hour and team entries on one account. The text, in Chinese, says the contest uses the original problems and data of the 2024 Chengdu regional (also known as The 3rd Universal Cup. Stage 15: Chengdu), with English statements, and thanks the University of Electronic Science and Technology of China for the data. It gives the rules (20 minutes of penalty per rejected run, a limit of 60 submissions a day on long-limit problems, no pre-written code), the procedure for certifying xCPC prizes on the site and a call for travel write-ups. The thirteen problems appear only in the page's embedded data, listed by title without letters and each prefixed [ICPC 2024 Chengdu R]; the statements are not in our copy.
