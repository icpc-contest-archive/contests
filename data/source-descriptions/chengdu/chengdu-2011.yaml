  description: |-
    Scoreboard of the 2011 Chengdu on-site contest, headed ICPC 2011 成都赛区现场赛 排行榜 (ranklist): 141 team rows and ten problems A to J. A line at the top reads last updated 2011/11/11 21:13:39 with start 2011/11/6 09:00 and gives the medal counts as 14 gold, 28 silver and 43 bronze. Columns are school number, school, rank, team, number solved, time, and attempts and time for each problem; each problem heading carries two numbers (for example 13/118 for A), and nine first-solve cells are marked. Ranks run from 1 to 138 with ties; 137 teams solved at least one problem. Eight teams are marked with a star in the school number column and are not numbered; the page does not say what the star means. The top row is a starred team.

    The page also has a navigation list of ranklists of other regional contests from 2011 and 2012, whose links are not part of our copy.
