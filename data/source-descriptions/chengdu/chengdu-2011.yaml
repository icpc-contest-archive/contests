  description: |-
    Part of the website of the Chengdu regional contest run by Chengdu Neusoft Institute, in Chinese: seven news posts from its Contest Results section, dated 13 September to 8 November 2011. Two posts (20 September and 1 November) give the addresses of the ranking of the online round, an HTML file and a downloadable archive. Two posts (13 September and 31 October) carry the same text, a reposted problem setters' report on the online round with a comment on each of nine problems, 1001 to 1009, and an apology for an error in problem 1008. One post links the problems and solution reports of the five regional online rounds, one gives the address of the live board for the warm-up and on-site contest, and one gives the address of the on-site results download.

    Apart from the report, the posts hold addresses only; the rankings, live board and files they point to are not in our copy. Each page keeps the site menu (introduction, organisation, schedule, rules, registration, results) but those sections are not in our copy either.
