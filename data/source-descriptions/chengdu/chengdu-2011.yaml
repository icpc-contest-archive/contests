  description: |-
    Final standings of the 2011 ACM-ICPC Asia Chengdu Regional Contest: 132 teams with rank (1 to 83, with ties), team name, institution, number solved, time and citation. The top 96 teams carry a citation naming the place (First Place, Second Place and so on) and the other 36 are Honorable Mention. First place is SYSU_Metalgarurumon of Zhongshan (Sun Yat-sen) University with seven problems solved and a time of 966. No per-problem detail.
