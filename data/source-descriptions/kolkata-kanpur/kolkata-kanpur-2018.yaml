  description: |-
    Website of the ICPC Kolkata-Kanpur Site 2018, in English, organised by the National Institute of Technical Teachers' Training & Research, Kolkata, with the University Institute of Engineering & Technology, CSJM University, Kanpur and the Guru Nanak Institute of Technology, Kolkata as hosts of the two onsite venues. Our copy holds 150 files, 121 of them pages. The 2018 edition is covered by 19 distinct pages: the home page with the important dates (Kolkata-Kanpur Site Contest on 21-22 December 2018), registration, fee refund, preliminary online contest rules and result, the lists of selected teams (tentative, final and from the wait list), the result of the onsite round, program schedule, how to reach, people and contact pages. PDFs of the 2018 edition are the preliminary contest rules, a registration form, travel notes for Kanpur and Kolkata, and two invitation letters to selected teams.

    The copy also holds pages and PDFs of earlier editions of the same site: pages of the 2016 site, the 2015 onsite problem set (27 pages) with 2015 results and a director's report, and a 2017 onsite problem set of 26 pages (11 problems), a 2017 results PDF, a 2017 director's report and a 2017 program schedule. The 2018 pages link to a 2018 problem set and a 2018 director's report that are not in our copy.
