    Standings of the onsite round from the Kolkata-Kanpur Site 2018 website: 159 teams with rank, team name, score, total time, penalty and institution. Hold right there Sparky!! of the Indian Institute of Technology Roorkee is first with 9 solved. There is no per-problem detail. A note above the table says the test data of problem ALIENCOW was wrong, that all submissions were rejudged, that four teams were affected, and that the ranklist was updated. The one table covers both onsite venues, Kolkata and Kanpur, and does not mark which team played where. The page carries the site's menu and sidebar.
