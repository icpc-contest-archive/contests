  description: |-
    Website of the ACM ICPC Asia Region Kolkata-Kanpur Site contest of 2017, in English: a multi-site contest organised by the National Institute of Technical Teachers' Training and Research (NITTTR), Kolkata, with onsite rounds in Kolkata (hosted by JIS Group) and in Kanpur (hosted by the University Institute of Engineering and Technology, CSJM University). The pages of this edition are the home page, which reports that team Know_no_algo from IIT Delhi won the site; important dates (preliminary online contest on 5 November 2017, site contest on 23-24 December 2017); registration with fees and the two-step process (closed); people; contact; a fee refund notice; instructions for selected teams; and a list of the 168 teams selected for the onsite round with institute and allotted city (100 Kanpur, 68 Kolkata). The Registered Teams page holds no team list, only a link to one on the ICPC site.

    PDFs of this edition in our copy: a 3-page result list, a 26-page onsite problem set of 11 problems, a 2-page report from the contest director, a 1-page guide to the programming environment, a 2-page program schedule for 23 December 2017 and a registration form.

    The same host was reused later, so the copy also holds pages of the 2015, 2016 and 2018 contests. Our copy holds 150 saved files, of which 122 are pages or documents.
