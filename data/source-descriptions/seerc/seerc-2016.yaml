  description: |-
    Scoreboard titled 2016 ACM SEERC: Results: 91 teams, ranked by problems solved and penalty, against eleven problems labelled A to K. A solved problem shows a plus sign, the number of extra attempts if any, and the time of the accepted run (for example +1 (0:20)); an unsolved problem with attempts shows a minus sign and their number; the last columns give Total (problems solved) and Penalty. Teams with the same result share a place range, and the twelve teams with no solved problem are all listed as 80-91. Seven team names carry an asterisk, which the page does not explain. The Region column is empty for every team. Three summary rows at the bottom, labelled Total, Success and %, give figures per problem. The first-place team is LNU AlgoTesters with 8 problems and 1196 penalty. The page has no institutions and no date.
