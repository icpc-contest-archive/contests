  description: |-
    Standings of the 1998-99 contest of the Southeastern European region, in Bucharest, sponsored by IBM according to its heading: 30 ranked teams and four more listed under "Honorable Mention (in alphabetical order)" without a rank, 34 teams in all. Each row gives rank, team name (institution), country, number of problems solved and score. Seven problems were solved by the top two teams, and the first place went to Bucharest University UNIBUC-1. The score is a single number; there are no per-problem columns, attempts or solve times. Teams are from Romania, Bulgaria, Ukraine, Macedonia, Yugoslavia and Moldova.

    Quotation marks inside team names appear as replacement characters in our copy; the table is otherwise complete.
