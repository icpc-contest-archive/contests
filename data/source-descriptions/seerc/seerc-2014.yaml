  description: |-
    Scoreboard titled 2014 ACM SEERC: Standings, in a single table of 74 team rows. Each row gives the place, the team name with its institution in brackets, a City column, one cell for each of the ten problems A to J, the number solved (Total) and the penalty. A solved problem shows a plus sign, the number of failed attempts before it if any, and the solving time as hours and minutes in brackets; an unsolved problem with attempts shows a minus sign and the number of attempts. First place is LNU Penguins (Lviv National University) with 9 solved and a penalty of 1139. Three pairs of teams share a place (39-40, 57-58, 73-74); places 73-74 have 0 solved. Three rows at the foot, headed Total, Success and %, give a figure for each problem and an overall figure.

    The City column is empty in every row of our copy. The page was saved from Microsoft Word and uses no images.
