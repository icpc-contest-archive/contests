  description: |-
    Scoreboard of the 2015 ACM SEERC: 84 teams against ten problems A to J. Each team row gives place, the team name (column User), a City column that is empty for every team, a cell per problem, the number of problems solved (Total) and the penalty. A solved cell shows + with the number of earlier failed tries, when there were any, and the solve time in hours and minutes; an unsolved cell shows - and the number of tries, and a cell is empty when the team made no attempt. A line above the table names the last successful submission (4:58:58, problem H).

    Places 1 to 62 are teams with at least one problem solved; the other 22 teams, with none solved, share the place 63-84. Forty of the team names carry a [site-UPB] prefix followed by a university abbreviation in brackets; three names end with an asterisk that the page does not explain. The first place is ZNTU_SetUp with 7 problems and penalty 963. Three summary rows at the bottom, labelled Total, Success and %, give per problem the total tries, the successes and the success percentage.
