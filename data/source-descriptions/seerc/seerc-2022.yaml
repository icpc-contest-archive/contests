  description: |-
    Results page of SEERC 2022 with two scoreboards, headed Standings for Bucharest site (52 teams) and Standings for Ukrainian site (76 teams), 128 teams in all. A note at the top explains that because of the war in Ukraine the contest ran on two servers, one for the Vinnytsia site and one for the Bucharest site. Each row gives rank, team name with the surnames of its three members, status (Complete for every team), score as problems solved and penalty, and fourteen problem columns A to N. A problem cell shows the solve time in hours and minutes with the number of tries, only a number of tries when unsolved, or a dash when the team made no attempt. Tied teams share a range of ranks such as 51-52 and 62-74.

    Two links lead to CSV files, one per site, which are not part of our copy. The page was exported from Word and is encoded in UTF-16.
