  description: |-
    Scoreboard of the contest at Bucharest and Vinnytsya on 10 December 2022, with the standings headed as a five-hour table: 153 teams with team name and the surnames of its three members, country, fourteen problem columns A to N, and columns headed Total, Penalty and Dirt. Each problem cell gives a plus sign with extra attempts and the solve time, a minus sign with the number of failed attempts, or is empty. The Place, Total, Penalty and Dirt cells are empty for every team in our copy, so the order of the rows is the only ranking and no totals are shown. Rows at the foot give submissions, accepted runs and success percentage per problem.

    A table above the standings counts teams by country: Ukraine 73, School 29, Romania 25, Turkey 10, Serbia 7, Bulgaria 4, Cyprus 3, North Macedonia 1 and Moldova 1, with average problems solved and average place of the top four teams of each. The page also shows contest-control buttons for start, finish and pause.
