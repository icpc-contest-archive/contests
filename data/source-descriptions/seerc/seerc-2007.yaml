  description: |-
    Final standings page of the 2007 ACM Southeastern Europe Programming Contest, sponsored by IBM, headed Romanian Chapter of the Association for Computing Machinery, with the dates Bucharest, October 25-28, 2007. It lists 48 teams with institution and team name, a citation (First Place, Second Place and so on up to Forty-forth Place), number solved and total time. 44 teams carry a rank; four more (from Moldova, Nis and Timisoara) are listed at the end without rank, citation, solved count or time. Seven teams solved nine problems; the first place, a team from Ivan Franko Lviv National University, has 627 in the time column. There is no per-problem detail and no attempt counts.
