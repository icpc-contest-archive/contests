  description: |-
    Scoreboard titled "Standings [1:22:28]": 79 teams listed under the column heading "User", with places 1 to 72, "73-74" for two teams, and 75 to 79, against ten problems A to J. Each row gives place, name, a cell per problem, "Total" (problems solved) and "Penalty". A solved problem shows "+", followed by the number of failed attempts when there were any, and the time of the accepted run in hours and minutes, for example "+1 (3:19)"; an unsolved problem with attempts shows "-" and their number; a problem not tried is empty. Names only, with no institution or country. The team in first place solved 9 problems with a penalty of 1172.

    Three rows at the end, headed "Total:", "Success:" and "%:", give per problem and overall a count, a second count and a percentage (for problem A: 62, 22 and 35%). The page does not say whether it is final or frozen. Its style sheet is not in our copy.
