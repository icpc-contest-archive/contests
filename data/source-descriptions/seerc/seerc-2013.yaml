  description: |-
    Photo gallery of Vinnytsia National Technical University, in Ukrainian with links to Russian and English versions of the interface. Our copy holds 143 saved pages with content, some of them the same page under two addresses. They are the front page with the list of albums, the archive of albums by year (year pages for 2004 to 2015 and later pages for 2015 and 2016, and the full archive list), and the nine pages of one album, "South-Eastern European Programming Contest Opening" (Фотосесія, "photo session"), which show 130 photo thumbnails and no text about the contest beyond the album title.

    The full archive list also names an album "South-Eastern European Programming Contest Main Tour", dated 12.10.2013 (the Opening album is dated 11.10.2013), and albums of other editions of the contest; the pages of the Main Tour album are not in our copy. The gallery is a general university site: the rest of it covers other university events. It holds no scoreboard, problem statements, rules or schedule of the contest.

    The thumbnails of this album are not in our copy; only the pages that list them are.
