    Statement of problem H, Sly Number, as a one-page PDF in English. The header names the Southeastern European Regional Programming Contest, Bucharest, Romania, October 19, 2002. It gives the input file name H.DAT and the allowed source file names (H.PAS, H.C, H.CPP or H.JAVA). The problem is about sly numbers, arrays of 0, 1 and 2, with a 'Star Multiplication' and a modulo Q operation: the program reports, for each test case, whether an inverse sly number B with (A * B) mod Q equal to ONE exists (the output is 'A solution can be found' or 'No solution'). The statement ends with an input and output description and a table of example input and output.
