  description: |-
    Statement of problem A, Cash Machine, as a one-page PDF in English. The header names the Southeastern European Regional Programming Contest, Bucharest, Romania, October 19, 2002. It gives the input file name A.DAT and the allowed source file names (A.PAS, A.C, A.CPP or A.JAVA). The problem is about a bank's cash machine with a supply of bills of several denominations: the program computes the largest amount, not above the requested cash, that the machine can deliver. The statement ends with a table of four example data sets with input, output and a comment, and an explanation of each case; a footnote explains the currency symbol.
