  description: |-
    Standings headed by the Romanian Chapter of the ACM, titled the SouthEastern European Regional Contest of the ACM International Collegiate Programming Contest: 45 teams with rank, university, coach name, country (three-letter code), number of problems solved and penalty time. Thirty-three teams carry a rank from 1 to 28, with ties; the last twelve are marked HM (honorable mention) in place of a rank. Teams ranked 1 to 5 solved six problems, with Taras Schevchenko Kiev National University first with a penalty of 848. Six of the HM teams have one problem solved and a penalty, the other six have neither.

    The page gives no per-problem results and no year or date for the contest.
