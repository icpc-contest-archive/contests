  title: The ACM International Collegiate Programming Contest
  language:
  - en
  description: |-
    Site of the Romanian Chapter of the ACM for the Southeastern European Regional Contest, in English. Its front page, news, schedule, rules, registration, steering committee, sponsors and standings pages are about later editions, chiefly the 2014 and 2016 contests, held at two sites, Bucharest and Vinnytsia; the standings page is the 2014 scoreboard with problems A to J, and the problem PDFs in the site are from the 2010, 2013 and 2015 contests.

    Only one page is about the 2002 contest: an index page headed "The SouthEastern European Regional Contest of the 2002 ACM International Collegiate Programming Contest" with three links, Official Report, Problems and Teams Standings. The pages behind those links are not in our copy. A page of previous years lists the contests from 1995 to 2015, and our copy holds a similar index page for each of those 21 years; the 2008 edition also has a results page.

    Our copy holds 78 HTML pages, 10 PDFs and 16 images.
