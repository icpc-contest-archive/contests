  description: |-
    ZIP archive of the complete problem set: nine statement PDFs, problems A to I, each with a test input file (.in, or .DAT for I) and a file of expected output with the extension .sol, 27 files in all. The problems are A Period, B Corporative Network, C Cave Exploration, D City Game, E Cube Root, F Cable TV Network, G Alibaba, H Booklets and I Count on Canton.

    Each statement is a single page in English headed "Southeastern European Regional Programming Contest, Bucharest, Romania, October 16, 2004" with the ACM logo text. Each names its input file and the accepted program source files and gives the input and output format with a sample input and output. No solution programs are included.
