  description: |-
    Scoreboard headed 2024-2025 SEERC: Standings: 91 teams and problems A to M. Each row gives the rank, team name, institution, site (Bucharest or Lviv, 56 and 35 teams), country, the number of problems solved, a total time such as 15:29:00, and then up to 13 cells for A to M that are blank or hold a time as h:mm. There are no counts of tries. The first team, Infinity of University of Novi Sad, solved 10 problems; one team at the bottom has none solved. Rank numbers run from 1 to 92 and no team carries rank 84.

