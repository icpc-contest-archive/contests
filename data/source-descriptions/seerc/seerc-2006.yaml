  description: |-
    ZIP archive of the complete problem set: a folder "Problems PDF" with nine statement PDFs, problems A to I, and folders input/ and output/ with one test input file and one expected output file per problem, 27 files in all. The problems are A Sudoku, B Subsequence, C Celebrity jeopardy, D Sherlock Holmes, E Payment System, F Stargates, G Maximum, H Japan and I “Shortest” pair of paths.

    The statements are in English, one page each except F and I with two, and carry the header "Southeastern European Regional Programming Contest, Bucharest, Romania, October 21, 2006" with the ACM logo text. Each names its input file and gives the input and output format with a sample input and output. No solutions are included.
