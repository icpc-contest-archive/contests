    Category page of the ICPC Live Archive judge, "Regionals 1995 :: Europe - Southeastern", in English. It lists six problems numbered 5275 to 5280: Wily Hacker's Problem, Sentence Generator, Optimisation, Contour Painting, Trains and Maze Exploration. Each row gives the problem's title and two figures, total submissions with solving percentage and total users with solving percentage; Optimisation has no submissions. The page holds no statements; it is the list only, with the site's menus, and the capture shows the date 23 October 2021.
