  title: The 1995-1996 ACM International Collegiate Programming Contest Eastern European Regional Contest
  language:
  - en
  description: |-
    Pages of the website of the Romanian Chapter of the ACM, in English. For this edition our copy holds one page: a menu headed "The 1995-1996 ACM International Collegiate Programming Contest Eastern European Regional Contest" with three links, Official Report, Problems and Teams Clasification (as spelled on the page). The banner above the menu names the 1996-1997 SouthEastern European Regional Contest sponsored by Microsoft. The three linked pages are not in our copy; the "Past Years Contests" page that links to the 1995 and 1996 menus is.

    Our copy holds 150 files in all. Of these, 48 belong to the contest site (the address path acm): the 1996 menu, and pages of the 1997-1998 contest (news, schedule, rules, registration form, judge team, official report, final results of 25 October 1997 in Bucharest) and of the 2001-2002 contest (report, results table, problem list). The other files are later pages of the faculty's own site. Nothing in them reports the 1995 results or problems.
- url: https://seerc.icpc.global/1995/result95.htm
  read: '2026-11-16'
  rubric: 1
  copy: seerc/seerc-1995/standings/20260904-live-f7d8556e/result95.htm
  title: The 1995-96 ACM International Collegiate Programming Contest, Bucharest, November 4th, 1995 - Teams Clasification
  language:
  - en
  contest_date: '1995-11-04'
  teams: 26
  description: |-
    Standings of the 1995-1996 SouthEastern European Regional Contest, published by the Romanian Chapter of the ACM with Microsoft named as sponsor, dated Bucharest, 4 November 1995. A plain-text table of 26 teams with the columns RANK, TEAM NAME, SCOR and SOLVED, ordered by problems solved, and within equal solved by lower score first. The team names are universities; there is no country column and no per-problem detail. First place is the University "St. Kliment Ohridski" of Sofia with 6 problems solved. Eighteen teams solved at least one problem, and the last eight are listed with 0 solved. A horizontal rule separates the first three places from the rest; no medals or other awards are named.
- url: https://groups.google.com/g/comp.org.acm/c/LcxbowMkd-M/m/Bh-L2Iq2hRcJ
  read: '2026-11-16'
  rubric: 1
  copy: seerc/seerc-1995/rankings/20261023-live-fd758c90/page.html
  title: ACM programming contest finals 1996 - Q. about finalists.
  language:
  - en
  description: |-
    Message in the Usenet group comp.org.acm, shown in the Google Groups archive, dated 14 December 1995, headed "ACM programming contest finals 1996 - Q. about finalists.". The sender compiles unofficial results of the regional contests of the 1996 ACM programming contest and gives, region by region, the contest date and the first three or four teams: 17 regions are named, six of them without any teams listed. The Eastern European region, dated 4 Nov 95, lists the University of Sofia, the University of Bucharest and the University of Belgrade in that order. The post notes that not all listed teams will be eligible for the finals.

    The page is the Google Groups view of the message, with its menus and sign-in links.
