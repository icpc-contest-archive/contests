  description: |-
    Scoreboard produced by DOMjudge, headed Southeastern Europe Regional Contest 2025 final standings, with the last update stamped 16 December 2025: 105 teams and 12 problems A to L. Each row gives rank, team name and institution, problems solved, penalty time, and for each problem the solve time in minutes with the number of tries, or only the tries for an unsolved problem. Nine cells are marked as first solves. A summary row gives four figures per problem, and a legend explains the cell colours. 97 teams carry a rank; nine teams solved no problem, one of them ranked 97 and the other eight, at the bottom, with no rank.

    First place is KhNURE_KoRoVa! of Kharkiv National University of Radio Electronics with 9 problems; no team solved H, I or J. One style sheet, for category colours, is missing from our copy.
