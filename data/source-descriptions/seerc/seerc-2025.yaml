  contest_date: '2025-12-14'
  description: |-
    Website of the ICPC Southeastern Europe regional contest, in English. Our copy holds 35 pages, 15 of which are a second address of a page already in it. Its front page is the 2026 edition (contest dates December 11-13, 2026, sites in Thessaloniki and Kyiv); further pages of the 2026 edition cover about, organization and a call for problems; the menu leads to the 2025 pages and names the editions 2024 to 2021, which are on another server and not in our copy.

    The 2025 edition, with its contest on December 14, 2025, was held at the University of Macedonia in Thessaloniki, Greece and at Ivan Franko National University of Lviv, Ukraine. Its pages cover about, venue, travelling, accommodation (only a placeholder), the city, sponsors, organization, schedule, rules, programming environment and a call for participation. The 2025 home page has a final report: 105 teams from 63 institutions in eight countries, 68 at Thessaloniki and 37 at Lviv.

    Inside our copy are the DOMjudge scoreboard of 2025, the problem statements and the editorial as PDFs, and a six-page PDF of on-site rules. Links to the opening ceremony video, photos and upsolving lead to other sites and are not in our copy.
