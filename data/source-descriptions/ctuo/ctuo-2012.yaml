    Page of the CTU Open Contest 2012 website listing eight problems by name: Andrew the Ant, Software Bugs, Charlie the Cockchafer, Gregory the Grasshopper, Lisa the Ladybug, Mosquito Multiplication, Rhinoceros Beetle and Simon the Spider. Each is marked by a small letter image (a, b, c, g, l, m, r, s). For each the table links the input file, the output file, the statement as PostScript and as PDF, and the solution in C and Java. Below are an introduction, the presentation of solutions (1.6MB) and an archive of everything (13.2MB). A second section, Practice session, lists four problems (Andrew the Ant, Software Bugs, Charlie the Cockchafer and Gregory the Grasshopper) with the same kinds of files and its own presentation (1.1MB) and archive (2.4 MB). The links lead to files that are not part of this page.
