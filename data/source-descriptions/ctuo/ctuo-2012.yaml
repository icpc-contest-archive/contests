  description: |-
    Final scoreboard of the CTU Open 2012 produced by DOMjudge: 112 team rows with rank, affiliation (abbreviation and country flag), the team members, the number solved and the penalty time, and one column for each of the eight problems, named ants, bugs, cockchaf, grasshop, ladybug, mosquito, rhino and spider. Each problem cell shows the number of tries with the time and penalty in parentheses for a solved problem, and the cells of first solves are marked. The first place has 8 solved with 896 penalty time. A summary row at the bottom gives the total teams, the number of affiliations and countries, the total solved, and submitted, correct and fastest time per problem.

    A legend separates participants from unofficial teams; eight team cells are shaded as unofficial, among them the first-place team, and 17 rows carry no rank number (two with one problem solved, the rest with none). Sixteen teams solved nothing.
