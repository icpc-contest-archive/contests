  title: 2012-2013 CTU Open Contest
  language:
  - en
  problems: 8
  description: |-
    Codeforces gym dashboard of the 2012-2013 CTU Open Contest, marked Finished. It describes the contest as a local contest at CTU Prague that chooses the team representing CTU at the Central European Regional Contest, open to any Czech university, with the rules of CERC except that the contest language is Czech. The problem table lists eight problems A to H, Andrew the Ant to Simon the Spider, each with its time limit and memory limit and a count such as x73 beside it. The time limits are 2, 30, 4, 2, 5, 2, 12 and 3 seconds for A to H, 256 MB except 512 MB for E. A note on all eight says the package was not updated after the judging servers were upgraded, so execution times are multiplied by 2. A link leads to statements in English, which are not in our copy. The rest of the page is forms for questions and announcements.
