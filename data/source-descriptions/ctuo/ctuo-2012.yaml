  contest_date: '2012-10-26'
  description: |-
    Home page of the 2012 CTU Open Contest website of the Czech Technical University in Prague, in Czech, with the ICPC banner and a menu of thirteen entries: HOME, News, Dates, Fees, Registration, Location, General rules, Technical rules, Links, Sponsors, Tourist info, CONTEST and Contact. The text says the contest ran on 26 and 27 October 2012 in Prague, Brno, Plzen, Ostrava, Banska Bystrica, Bratislava, Zilina and Kosice, and that the best teams could go on to the Central European Regional Contest in Krakow on 16 to 18 November. It also says that the results with archived home directories, the problems, test data, sample solutions and photos are under the CONTEST link.

    Our copy holds only this home page. The pages in the menu, the style sheet and the banner image are not in our copy.
