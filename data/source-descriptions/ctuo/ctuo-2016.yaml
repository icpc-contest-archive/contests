  problems: 11
  description: |-
    Problem page of the CTU Open Contest 2016, titled "Problems, inputs, outputs and oficial solutions": a table of ten problems, from Aerial Archeology to Colorful Tribune, followed by a separate row for the Etnetera Brevity Challenge. Each row links to input and output files, the statement as PostScript and PDF, and solution sources in C and Java; the challenge row links three C sources and one Java source. Between the tenth problem and the challenge row are links to an introduction with all problems and to the presentation of solutions; a link to an archive all.zip of 19 MB closes the page.

    The page is in English. Our copy holds the page only; the linked files are not part of it.
