  description: |-
    Baekjoon Online Judge category page "CTU Open Contest, 2016" in Korean, filed under the source ICPC Regionals, Europe, Central European Regional Contest. It lists ten problems, numbered 13914 to 13923 and lettered A, B, C, D, F, H, O, R, S and T, from Aerial Archeology to Suspicious Samples. Two titles are in Korean instead of the English ones, and Cable Connection is marked special judge. Each row also gives a problem letter, the labels source and multilingual, and counts of accepted and submitted solutions with the acceptance ratio.

    The statements are not in our copy.
