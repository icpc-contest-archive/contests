  title: CTU Open Contest, 2016
  language:
  - cs
  - en
  contest_date: '2016-10-21'
  problems: 11
  description: |-
    Website of the CTU Open Contest 2016, mostly in Czech; the menu, the technical rules, the tourist information, the scoreboard, the submissions list and the problems page are in English. The front page says the contest ran on 21 and 22 October 2016 in Prague, Brno, Plzeň, Ostrava, Banská Bystrica, Bratislava, Žilina and Košice, and that the best teams may go on to the Central European Regional Contest in Zagreb. Our copy holds 50 pages.

    The pages cover news, the schedule of the Prague part (registration, opening with sponsor presentations and a trial round on Friday; the contest from 10:00 to 15:00 on Saturday, then presentation of solutions and results), fees (there are none), registration, the venue in Prague, general and technical rules, links, sponsors and tourist information.

    Results and problem material are inside: the final scoreboard of 95 teams in three tables, a problems page listing ten problems plus the Etnetera Brevity Challenge, and a list of 884 submissions with time, team, problem, language and result. The statement text of all eleven problems is in our copy as pages of an online PDF viewer, with input and output specifications; of the statement PDF files themselves only three (Aerial Archeology, It's Raining Man, Colorful Tribune) are held, and of the input files five. The PDF of the solutions presentation is cut off at 1 MiB and does not open.
