  description: |-
    Final scoreboard of the CTU Open 2016, headed "Scoreboard CTU Open 2016 final standings", in three tables with the same columns: the main table of 76 teams, a table headed Unofficial with 12 teams and one headed Coding Challenge with 7 teams. Each table has rank, team, score and the ten problems as columns named Archeology, Balloon, Cable, Display, Fence, Huntsmen, Orchard, Raining, Samples and Tribune.

    A team cell gives the team number, name, institution in parentheses and the members. Score is solved and penalty time, for example 6 / 995. Problem cells show tries and solve time as 1/8, the number of failed tries, or 0. Team names link to the teams' home folder archives, which are not in our copy. First place in the main table is Cykličtí mamuti with 6 problems.
