  title: 2016-2017 CTU Open Contest
  language:
  - en
  problems: 11
  description: |-
    Codeforces gym page "2016-2017 CTU Open Contest", marked Finished. The About text calls the contest a preparation for the CERC, held at CTU Prague and open to any Czech university, with the CERC rules except that the contest language is Czech. The problem table lists eleven problems A to K, from Aerial Archeology to Etnetera Brevity Challenge, each with standard input and output, a time limit of 1 to 8 seconds, a 256 MB memory limit and a count shown beside it.

    The page also carries forms for asking questions and for posting announcements. A link to an English statements PDF leads outside our copy.
