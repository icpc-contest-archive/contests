  language:
  - en
  teams: 95
  description: |-
    Standings of The 2016 CTU Open: 95 teams with rank, team, institution, solved, time, medal and citation. Ranks run from 1 to 67; ranks 1 to 12 are each held by two to four teams and rank 67 by ten. The first 31 rows (places 1 to 12) carry a medal (12 gold, 11 silver and 8 bronze rows); rows for later places up to 47 have an ordinal place as citation, and the last 29 rows (ranks 48 to 67) are Honorable Mention. The best team solved 7 problems. There is no per-problem detail.

    The teams of the contest website's Unofficial and Coding Challenge tables are in the same table without a mark; the team in first place is listed there under Coding Challenge.
