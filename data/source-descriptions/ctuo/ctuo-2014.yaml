  description: |-
    Introduction sheet of the problem set, a PDF of two pages in English. A header names ten institutions and bodies, among them the Czech ACM Student Chapter and the Czech Technical University in Prague, above the heading 'Celebrating the Twentieth Anniversary'. The text recalls how the contest began at the Czech Technical University in 1994 and 1995, states that programs may be written in C, C++ or Java and gives the rules for input and output. It ends by saying that the problem set consists of eleven sheets containing ten problems. The problems themselves are not in this file.
