  - en
  teams: 82
  problems: 10
  times: true
  tries: true
  description: |-
    Final scoreboard of the CTU Open Contest 2014 from the contest's own website: 82 teams, each with an affiliation code (CTU FIT, MUNI, ZCU, UK MFF, VSB, CTU FEL, UNIZA, STU FIIT, UMB and UPJS, with a country flag), the team members' names, the number of problems solved and the penalty time. Ten problem columns are headed by short problem names, from Karel to Visible, each linking to the statement PDF. A cell gives the number of tries and, for a solved problem, the solving time and penalty in brackets. Seventy-one teams carry a rank; the last eleven are listed without one.

    The page notes that yellow fields signify unofficial teams, but every team cell in our copy has a white background. The summary row at the bottom shows zeros for the per-problem counts and has no team or solved totals.
- url: https://icpc.global/regionals/finder/CTU-Open-2015/standings
  read: '2026-11-16'
  rubric: 1
  copy: ctuo/ctuo-2014/standings/api-20261113/standings.html
  title: The 2014 CTU Open
  language:
  - en
  teams: 93
  description: |-
    Final standings of The 2014 CTU Open: 93 teams, each with place, team name, institution, number of problems solved, total time, medal and citation. Eight gold, eight silver and seven bronze medals are marked. The citation reads First Place to Forty-sixth Place for the first 57 rows and Honorable Mention for the other 36. Places 1 to 11 are each held by two teams, and the rows of these places are not in order of problems solved (the first row, a Charles University team with nine problems solved, is followed by a University of Zilina team with five, also in first place). Ten teams share place 73 with no problem solved. There is no per-problem detail.
