- url: https://contest.felk.cvut.cz/14prg/
  read: '2026-11-16'
  rubric: 1
  copy: ctuo/ctuo-2014/website/2026-09-04-live-9c7eb41a
  title: CTU Open Contest, 2014
  language:
  - cs
  - en
  description: |-
    Website of the CTU Open Contest 2014 on the server of the Czech Technical University in Prague. The front page, news, dates, fees, registration, location and links pages are in Czech; the technical rules and the tourist information are in English. The menu covers news, dates, fees, registration, location, general rules, technical rules, links, sponsors, tourist information and a contest page. The front page says the contest was held on 17 and 18 October 2014 in Prague, Brno, Plzen, Ostrava, Banska Bystrica, Bratislava, Zilina and Kosice, and that the best teams go on to the Central European Regional Contest. The schedule gives a Friday test round and the contest on Saturday from 10:00 to 15:00.

    Our copy holds 45 pages. The contest page leads to the final rank page (a scoreboard of 82 teams), the problem set with official solutions (ten problems with PDF statements, input and output files and C and Java solutions), a list of 850 submitted solutions with time, team, problem, language and result, and a presentation of solutions as slides and as PDF. The problem page also links an introduction, an ETN quiz PDF and a single archive of all files. The rank page links a home directory archive for each team, and 29 of these archives are in our copy. The photo gallery and the link to the ICPC standings lead to other servers and are not part of it.
