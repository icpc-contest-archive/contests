    Page of the contest site headed "Problems, inputs, outputs and official solutions": a table of twelve problems, Accident, Birthday, Cables, Housing, Lanterns, Milky way, Nightmare, Park, Rope, Shopping, Trains and Vampires. Each row links to a zip of input and output data, the statement as a PDF and a zip of official solutions. A last row links to one PDF with the introduction and all problems and to the presentation of solutions.

