  description: |-
    Slides of the presentation of solutions to the CTU Open 2026, a PDF of 357 pages in English. The problems are taken one at a time, starting with Vampires and ending with Rope. For each problem the slides repeat the task, label it with topics such as implementation or strings, and explain the solution with ideas, steps and complexity. The last slide thanks the audience and refers to 2027. The slides build up step by step, so many pages repeat the one before with an added line.
