  problems: 12
  pages: 30
  description: |-
    Problem set of the CTU Open Contest 2026 as a PDF of 30 pages, in English. The cover page names the Czech ACM Student Chapter and seven universities in the Czech Republic and Slovakia. An introduction says that programs may be written in C, C++, Java, Python or Kotlin, read standard input and write standard output. Twelve problems follow, in the order Accident, Birthday, Cables, Housing, Lanterns, Milky way, Nightmare, Park, Rope, Shopping, Trains and Vampires. Each has a statement with input and output specification and sample input and output. No test data or solutions.
