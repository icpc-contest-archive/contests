- url: https://contest.felk.cvut.cz/26prg/
  read: '2026-11-16'
  rubric: 1
  copy: ctuo/ctuo-2026/website/2026-11-13-live-cdcb77c4
  title: CTU Open Contest, 2026
  language:
  - en
  contest_date: '2026-10-24'
  description: |-
    Website of the CTU Open Contest 2026, organised by the Czech Technical University in Prague, in English. The front page says the contest is held in Prague, Brno, Pilsen, Ostrava, Bratislava, Žilina and Košice, is meant for full-time university students with others in an unofficial standing, allows Java, C++, C, Python and Kotlin, and that the best teams may go on to CERC 2026 in Wroclaw. The menu has news, dates, fees, registration, location, general rules, technical rules, organizers, partners and a contest page.

    The dates page gives the schedule: registration, opening ceremony and a practice session on Friday 23 October, the contest from 10:00 to 15:00 on Saturday 24 October, then a problem set discussion and the award ceremony. The technical rules page covers teams, conduct of the contest including clarification requests, scoring and the contest environment. The contest page links the problems with official solutions, the final rank, submitted solutions from contestants and photos; the final standings table, the problem list and a page of 914 submitted solutions (time, team, problem, language, result) are in the copy.

    Our copy has 71 files saved, 23 of them pages, and 76 addresses were fetched. Seven of the twelve problem statements are in it as PDFs; the statement PDFs for Park, Rope, Shopping, Trains and Vampires, the PDFs of the whole problem set and of the solutions presentation, twelve zip archives and four images were not fetched, and the team home folders linked from the standings are not in it. The news page has three entries, dated 2025 and 2026.
