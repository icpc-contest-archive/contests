  description: |-
    Final scoreboard of the CTU Open 2026 as published on the contest's own site: 64 teams in the main table ranked 1 to 61 with ties, and a second table of 9 teams under the heading "Unofficial site, Střední školy" (unofficial site, secondary schools). Each row gives rank, team number and name, institution, the team members, a score as problems solved over penalty time, and for each of the twelve problems, labelled by name from accident to vampires, the number of tries and the time of the accepted run. First place is MFF1 of Charles University with a score of 10 problems and 789.

    The team name links to a home folder of the team, which is not in our copy. The page has a style sheet of its own, which is in our copy.
