  description: |-
    Standings of the 2009 CTU Open: 93 teams listed with rank, team number, institution, number solved, time and a citation. 86 teams carry a rank with a place name (First Place, Second Place and so on); seven teams that solved nothing are listed at the end without a rank. The top team solved eight problems and is from Charles University. The time column reads 0 for every team, and there is no per-problem detail.
