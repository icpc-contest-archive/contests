  description: |-
    Final rank list of the CTU Open 2009: 92 teams, each with rank, team number, the university abbreviation and the names of the team members, a total time, a bracketed string of letters marking which of the problems were solved, and the number of problems accepted in brackets. The first team solved eight problems; teams from Charles University take the first two places and Comenius University the third. The last six teams have zero accepted problems and a time of 00:00:00. A final column links to an archive of each team's home directory; those archives are not held with this page. No times or numbers of attempts per problem.
