    Problem set page of the CTU Open 2009 with nine problems, listed by name: Arable Area, Clock Captcha, Digital Display, Intriguing Identifiers, Letters Lies, Odd Opportunities, Peculiar Primes, Robotic Rails and Suspicious Stocks. Each row links to the input and output files, the statement in PostScript and in PDF, and two sample solution source files (.c or .C, and .java). Further links lead to an introduction (PostScript and PDF), an archive of everything (1.5 MB), and the presentation of the solutions. The linked files are not held with this page; it holds the page only.
