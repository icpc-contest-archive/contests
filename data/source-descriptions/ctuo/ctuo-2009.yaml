  title: CTU Open 2009 Contest in Prague
  language:
  - cs
  contest_date: '2009-10-16'
  description: |-
    Website of the CTU Open Contest 2009, in Czech, run from the Czech Technical University in Prague. The front page says the contest was held on 16 and 17 October 2009 in Prague, Brno, Ostrava, Bratislava and Žilina, that the best teams can go on to the Central European Regional Contest in Wroclaw on 6 to 8 November 2009, and that the regional contest decides who goes to the World Finals in Harbin. It links to the rank list with the team home directories, the problem set with test data and sample solutions, the list of submitted solutions, photo galleries, a seminar presentation for the advancing teams, and press articles.

    Our copy holds 39 files, five of them pages: the front page, the rank list, the problem set page, the list of submitted solutions (974 submissions, each with problem, time, team, a language column and outcome) and a 40-page Czech PDF presentation preparing the teams for the Central European Programming Contest 2009. Sixteen of the 92 team home directory archives linked from the rank list are in our copy. The problem statements and test data that the problem set page links to are not, and the photo galleries and press articles lead to other servers.
