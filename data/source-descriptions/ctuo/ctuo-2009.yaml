    Codeforces gym page of the 2009-2010 CTU Open Contest, shown as finished. It has a short description of the contest (a preparation for the Central European Regional Contest, held at CTU Prague, with CERC rules, contest language Czech), a link to the contest website and to English statements, and a table of nine problems with letter, name, time and memory limit and a count marked x, from x4 to x107: Arable Area, Clock Captcha, Digital Display, Intriguing Identifiers, Letter Lies, Odd Opportunities, Peculiar Primes, Robotic Rails and Suspicious Stocks. The statements and the standings are on other pages that are not in our copy.
- url: https://contest.felk.cvut.cz/09prg/solved/solution2009.ppt
  read: '2026-11-16'
  rubric: 1
  copy: ctuo/ctuo-2009/editorial/20261114-live-c821a082/page.html
  title: Sample Solutions CTU Open Contest 2009
  language:
  - cs
  problems: 9
  pages: 51
  description: |-
    Slides in Czech presenting sample solutions of the CTU Open Contest 2009: 51 slides, with a title slide and one section for each of the nine problems, Arable Area to Suspicious Stocks, and a final slide listing the problem authors. The slides describe the approach to each problem in short points, for example a row-by-row scan over polygon edges for Arable Area, dynamic programming over an acyclic graph for Letter Lies, and Dijkstra's algorithm for Robotic Rails, with illustrated worked steps for an alternative Arable Area solution.

    Our copy is the binary .ppt file; the page count is that of a conversion to PDF.
