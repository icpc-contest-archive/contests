  description: |-
    Slides of 61 pages titled CTU Open 2019, Presentation of solutions, dated 19 October 2019. They go through all ten problems in this order: Beer Bill, Beer Barrels, Beer Vision, Beer Mugs, Screamers in the Storm, Beer Can Game, Beer Marathon, Sixpack, Beer Coasters and Beer Flood System. Each problem has slides with the task or the key observation, the idea of the solution, examples and figures, and for several problems a stated time complexity. The last slide is a thanks to the audience.
