    Page of the contest website listing the ten problems of the CTU Open 2019: Beer Barrels, Beer Bill, Beer Coasters, Beer Flood System, Beer Can Game, Beer Marathon, Beer Mugs, Screamers in the Storm, Sixpack and Beer Vision. Each of the ten rows links a statement PDF, a zip of input and output files and a zip of official solutions. A bottom row links a PDF of the introduction and all problems, the presentation of solutions and an archive of 42 MB. The linked files are not part of this copy of the page.
