  copy: ctuo/ctuo-2019/website/2026-09-03-wayback-b04cb5f4
  title: CTU Open Contest, 2019
  language:
  - en
  - cs
  contest_date: '2019-10-18'
  description: |-
    Website of the CTU Open Contest 2019, organised by the Czech Technical University in Prague, in English. The home page says the contest was held on 18 and 19 October 2019 in Prague, Brno, Pilsen, Ostrava, Banská Bystrica, Bratislava, Žilina and Košice, as a subregional contest whose best teams could go on to CERC 2019. Our copy holds 20 pages: eight web pages (home page, dates and schedule, registration instructions, technical rules, partners, a contest page with links to results and materials, the scoreboard, and the page of problems and solutions) and twelve PDFs: the problem set of 25 pages, the presentation of solutions of 61 pages, eight single problem statements of 1 to 4 pages (all problems except Flood and Marathon) and two one-page leaflets in Czech from the partner Solitea.

    The menu entries News, Fees, Location, General rules, Organizers and Tourist info are linked but not in our copy, and neither are the in/out and solution zip files, the archive of all problems, the photo pages and the team home folders that the results and problems pages link to. The images and the style sheet of the site are kept.
- url: https://contest.felk.cvut.cz/19prg/rank.html
  read: '2026-11-16'
  rubric: 1
  copy: ctuo/ctuo-2019/scoreboard/20260901-live-8f1c3903/rank.html
  title: Scoreboard CTU Open 2019
  language:
  - en
  teams: 93
  problems: 10
  times: true
  tries: true
  description: |-
    Scoreboard of the CTU Open 2019 contest: 93 teams in two tables, 84 under the heading Official and 9 under Unofficial, each table with its own ranking. Columns are rank, team, score and ten problem columns named Barrels, Bill, Coasters, Flood, Game, Marathon, Mugs, Screamers, Sixpack and Vision. The score cell reads like 9 / 799. The team cell gives a team number, the team name, its school or site in parentheses and the member names. A problem cell shows tries and time as in 2/34 for a solved problem, and only a number of tries for an unsolved one. The first official team has a score of 9 / 799.

    The team names link to home folders that are not in our copy.
