  teams: 93
  description: |-
    Standings of the CTU Open 2019: 93 teams with rank, team name, institution, problems solved, total time and a citation. Official and unofficial teams, such as school teams, are in one list and are not marked apart, so each of the ranks 1 to 9 is held by two teams and ranks 10 to 74 by one team each; ten teams without a solved problem share rank 75. Citations name the places from First to Forty-sixth, and the remaining 38 teams carry Honorable Mention. There is no per-problem detail.
