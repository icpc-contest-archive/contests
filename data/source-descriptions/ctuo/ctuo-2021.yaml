  copy: ctuo/ctuo-2021/scoreboard/20260901-live-f356992d/rank.html
  title: The 2021 ICPC CTU Open Final Standings
  language:
  - en
  teams: 34
  problems: 12
  times: true
  tries: true
  description: |-
    Final standings of the 2021 ICPC CTU Open as a scoreboard: 34 teams in two tables, 30 under Official and 4 under Unofficial, each ranked separately. Columns are rank, team, score and twelve problem columns named alone, cruise, diamond, fort, hill, lair, organ, pit, rivers, screamers, tone and win. The score cell reads like 11 / 1343. The team cell gives the team name, its university or faculty in parentheses and the member names. A problem cell shows tries and time as in 1/17 for a solved problem, and only a number of tries for an unsolved one. The first official team has a score of 11 / 1343; the first unofficial team has 12 / 1327.

    The team names link to home folders that are not in our copy.
