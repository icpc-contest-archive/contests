  copy: ctuo/ctuo-2021/website/2026-09-03-live-a340760f
  title: CTU Open Contest, 2021
  language:
  - en
  description: |-
    Website of the CTU Open Contest 2021, organised by the Czech Technical University in Prague, in English. The home page says the contest was held on 26 and 27 November 2021 in Prague, Pilsen, Ostrava and Žilina, as a subregional contest whose best teams could go on to CERC 2021. Our copy holds 6 pages: the home page (saved under two addresses), a news page with announcements dated from 7 October to 18 November 2021 about the dates, COVID restrictions, the Bratislava and Banská Bystrica localities not taking part, updated compilers and unofficial teams, a fees page (no fees), a location page for the Prague site at the CTU FEE building, and a contest page with links to problems and solutions, final rank, submitted solutions and photos.

    The menu entries Dates, Registration, General rules, Technical rules, Organizers and Partners are linked but not in our copy, and neither are the pages behind the contest page links. The banner image and the style sheet of the site are kept.
