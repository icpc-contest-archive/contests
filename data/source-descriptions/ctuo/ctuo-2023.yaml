- url: https://contest.felk.cvut.cz/23prg/
  read: '2026-11-16'
  rubric: 1
  copy: ctuo/ctuo-2023/website/2026-09-03-wayback-f1da2be3
  title: CTU Open Contest, 2023
  language:
  - en
  contest_date: '2023-10-21'
  description: |-
    Website of the 2023 CTU Open Contest, organised by the Czech Technical University in Prague, in English. Our copy holds 26 pages. The front page says the contest was held on 20 and 21 October 2023 in Prague, Brno, Ostrava, Bratislava, Zilina and Kosice, that the languages were Java, C++, C, Python and Kotlin, and that the best teams could go on to the Central European Regional Contest in Ljubljana. Menu pages cover news, the schedule (practice on Friday evening, contest on Saturday 10:00 to 15:00), fees (none), registration, the Prague location, general and technical rules, organisers and partners.

    The contest page leads to the problems with official solutions (a page of links for 12 problems, with a link to a problem PDF that is in our copy), the final standings with 66 official and 2 unofficial teams, a list of 872 submissions with time, team, problem, language and result, and a photos link that points to another server.

    The style sheet, the banner and four other images are saved; the other images the pages use, such as the logos on the partners page, are not. The presentation of solutions, the PDF statements of Natatorium and Screamers, the Brevity Challenge PDF, the solutions archives and all but one input and output archive (Screamers) are not in our copy. 30 of the 68 team home archives are.
