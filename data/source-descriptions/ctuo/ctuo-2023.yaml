  description: |-
    Final scoreboard of the 2023 ICPC CTU Open from the contest's own website. An Official category lists 66 teams and an Unofficial category lists 2 more. Each row gives rank, team identifier and name, institution, team members, a score of problems solved with total time, and one cell per problem for the 12 problems beth, clubbing, digitalisation, expressions, fragmentation, gcd, hamster, movers, natatorium, proglute, screamers and wall, with the number of attempts and, for solved problems, the time. The team in first place is MFF1 from Charles University in Prague with 12 problems; four teams solved all 12. Team names link to team home folders.
