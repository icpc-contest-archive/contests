    Problem set as a PDF of 26 pages for the CTU Open Contest 2023. The cover lists the Czech ACM Student Chapter, Czech Technical University in Prague, Charles University, the Technical University of Ostrava, Masaryk University, the University of Zilina, Pavol Jozef Safarik University in Kosice, Comenius University and the Slovak University of Technology. An introduction text on the contest theme and the rules for programs (C, C++, Java, Python or Kotlin, standard input and output) is followed by 12 problems, Beth's Cookies, Clubbing, Digitalisation, Expressions, Fragmentation, Golem Coordinated Derby, Hamster, Movers, Natatorium, Proglute, Screamers in the Storm and Wall. Each has the allowed file names, an input specification and an output specification. No date is printed. No test data or solutions.
