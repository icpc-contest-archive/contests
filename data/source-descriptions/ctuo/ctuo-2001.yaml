  contest_date: '2001-10-26'
  description: |-
    Website of the CTU Open 2001 programming contest in Prague, in Czech. The front page says the contest was held on 26 and 27 October 2001 in Prague, that the best teams advance to the Central European Regional Contest in Warsaw on 16 to 19 November, and that the world finals follow the next year in Hawaii. It links to the rules, the official results list, the problem statements with sample solutions and test data, and the submits of the contestants.

    Our copy holds 145 files, 87 of them pages: the front page, the results page with 33 teams, the page of eight problem statements with its C and Pascal solutions and input and output files, and the list of 547 submits with the source text of 84 of them. Of the eight problems, seven appear in the submit list; none is listed for problem H.

    The rules page, the Central European Regional Contest link and the team home directories page are not in our copy; the home directories page returned an error.
