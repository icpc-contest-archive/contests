  description: |-
    Category page of the Baekjoon Online Judge, in Korean, titled "CTU Open Contest, 2001" and placed under ICPC Regionals, Europe, Central European Regional Contest. It lists eight problems labelled A to H with the contest's Czech titles (Komunikace, Směrnice, Matematické cvičení, Červotoči, Algebra, Přeprava materiálu, Dámy, Nástěnky) and Baekjoon problem numbers 9134 to 9142, with 9136 not used. For each it gives an information column (entries source and multilingual), the number of users who solved it, the number of submits and the accepted ratio. In our copy problem G has 10 solvers in 26 submits, problem A has 2 in 4, problem C has one submit, and the others show none.

    The page gives names only, with no statements; the rest is the judge's navigation menus.
