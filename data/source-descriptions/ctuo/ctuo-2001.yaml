  description: |-
    Problem statements of the contest on one page, in Czech. The heading names the Czech Technical University and Charles University, the Department of Computers (Katedra počítačů) of FEL ČVUT, the Czech ACM Chapter and the Kabinet software a výuky informatiky (software and informatics education unit) of MFF UK, in cooperation with the Department of Computer Science of VŠB-TU Ostrava. An opening story about a nursery school in a building of the faculty introduces the problems and gives the general rules for input and output.

    There are eight problems: Komunikace, Směrnice, Matematické cvičení, Červotoči, Algebra, Přeprava materiálu, Dámy and Nástěnky. Each has a statement, a specification of input and of output, and a sample input and sample output. A table links to a sample solution in C for all eight problems, in Pascal for seven (none for the last), and to an input and an output file for each.
