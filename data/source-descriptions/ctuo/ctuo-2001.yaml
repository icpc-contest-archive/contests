  description: |-
    Results list of the contest with 33 teams: rank, team id, university code with the members, a time, the number of problems solved and a strip of small letter images, one for each problem solved, each linking to the statement of that problem. Unsolved places are shown as dashes. The first team, cteam28 of MFF, has 7 solved in 15:12:24; three teams at the bottom have none solved. There are no attempts or times per problem.

    A legend below the table gives seven university and school codes (FEL, MFF, VSB, MUB, ZCU, LIB, GAR) with their full names, and a link returns to the main page.
