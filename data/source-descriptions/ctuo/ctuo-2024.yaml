  problems: 12
  pages: 28
  description: |-
    Problem set of the CTU Open Contest 2024 as a PDF of 28 pages in English. The header names the Czech ACM Student Chapter and nine universities. The first page is an introduction on the farm theme with the permitted languages (C, C++, Java, Python, Kotlin) and input and output rules. It is followed by 12 problems, A to L: Flag Bearer, Cowpproximation, Reptile Eggs, Fishception, Pigpartite Giraffe, Hamster, Pray Mink, Ornithology, P||k Cutting, Rabid Rabbit, Fellow Sheep and Watchdogs. Each has a statement with input and output specification and sample input and output. No test data or solutions.
