- url: https://contest.felk.cvut.cz/24prg/
  read: '2026-11-16'
  rubric: 1
  copy: ctuo/ctuo-2024/website/2026-09-03-wayback-f2412ba6
  title: CTU Open Contest, 2024
  language:
  - en
  contest_date: '2024-10-18'
  description: |-
    Website of the CTU Open Contest 2024, organised by the Czech Technical University in Prague, in English. Our copy holds 31 files: 29 pages (14 HTML pages and 15 PDFs), a style sheet and an image. The HTML pages cover the announcement (contest on 18 and 19 October 2024 in Prague, Brno, Pilsen, Ostrava, Banská Bystrica, Bratislava, Žilina and Košice), news, a tentative schedule, fees, registration instructions, location, general and technical rules, partners and a contest page.

    Results and problem material are inside: a final standings page with a scoreboard of 73 ranked teams and 7 more in a second table, with 12 problems, a page of problems with data and official solutions, a 28-page PDF of all problem statements, twelve single-problem PDFs, a two-page PDF of the practice problem (Etnetera Brevity Challenge), and a page listing 935 submitted solutions with time, team, problem, language and result.

    The slides of the presentation of solutions are in our copy only as a file cut off at 1 MiB, which cannot be opened. Links to team home folders and to other sites lead outside our copy.
