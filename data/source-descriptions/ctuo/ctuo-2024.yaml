    Codeforces gym page of the 2024-2025 CTU Open Contest, marked Finished. It lists 12 problems, A to L (Flag Bearer to Watchdogs), each with standard input and output, a 5 second time limit, 1024 MB memory limit and a count such as x236 beside it. Links lead to a contest website, to statements and to a tutorial, both marked English. The rest of the page is the Codeforces menu, forms to ask questions and add announcements, and a note on virtual participation. The statements are not part of this page.
