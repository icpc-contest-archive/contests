  description: |-
    Final standings page of the CTU Open Contest 2024: a scoreboard of 73 ranked teams from the participating sites, with rank, team (team number, name, institution and the names of its members), score as problems solved / penalty time, and one column per problem. The 12 problem columns are named bear, cow, eggs, fish, giraffe, hamster, mink, ornithology, pork, rabbit, sheep and watchdogs. A cell gives the number of tries and, for a solved problem, a time. Teams with equal results share a rank.

    A second table under the heading "Střední školy, Unofficial site" (secondary schools, unofficial site) lists 7 more teams in the same layout. A third table, under "Administrative Site", is empty. Team names link to home folders that are not part of our copy.
