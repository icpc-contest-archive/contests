  description: |-
    Slides of a presentation of solutions, a PDF of 42 pages in English. After the title slide, it goes through all 11 problems in turn: Amusement Anticipation (2 slides), Pond Cascade with simulation and binary-search variants, Chessboard Dancing by chess piece, Equinox Roller Coaster with an alternative solution, Forest Picture, Shooting Gallery, Ice cream samples, Dark Ride with Monsters, Go Northwest!, Punching Power and Treetop Walkway (5 slides). The slides state the approach to each problem; some also give its complexity.
