    Baekjoon Online Judge category page, in Korean, for the problems of the contest, filed under ICPC Regionals, Europe, Central European Regional Contest, CTU Open Contest. It lists 11 problems numbered 14977 to 14987 with the contest labels A, C, D, E, F, G, I, M, N, P and W and English titles, and for each the number of users who solved it, the number of submissions and the acceptance rate; Treetop Walkway has no submissions. Pond Cascade and Go Northwest! are marked special judge. The problems carry no statements on this page.
