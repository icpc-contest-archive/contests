    Codeforces gym dashboard for the contest, titled 2017-2018 CTU Open Contest and marked Finished. It describes the CTU Open as a local contest at CTU Prague that is open to any Czech university, and lists 11 problems labelled A to K (Amusement Anticipation to Treetop Walkway) with time limit, memory limit (256 MB) and the number of gym solvers for each. The gym relabels the problems A to K, unlike the contest's own letters. It also holds forms for questions and announcements, a link to the contest website, and links to statements, submission and standings, which are not part of our copy.
