- url: https://contest.felk.cvut.cz/17prg/
  read: '2026-11-16'
  rubric: 1
  copy: ctuo/ctuo-2017/website/2026-09-04-live-ad6572fd
  title: CTU Open Contest, 2017
  language:
  - en
  contest_date: '2017-10-28'
  description: |-
    Website of the CTU Open Contest 2017, in English, devoted to the programming competition for students at the Czech Technical University in Prague. The home page says the contest was held on 27 and 28 October 2017 in Prague, Brno, Pilsen, Ostrava, Bratislava and Žilina, that the best teams can go on to the Central European Regional Contest in Zagreb,. Our copy holds 30 web pages and PDFs (104 files in all): news, dates, fees, registration, location, rules, organisers, partners, tourist information and a contest page. The dates page gives the programme: practice session on Friday 27 October; the contest on Saturday 28 October from 10:00 to 15:00, then problem set discussion and award ceremony.

    The contest page links to the problems page, the scoreboard with three tables, a page of 916 submissions with time, team, problem, language and result, and a photo album. The problems page lists 11 problems, each with links to input, output, statement and solution sources, plus a presentation of solutions and a 110 MB archive. Our copy holds the statement PDFs, data and solutions for the first six problems (A, C, D, E, F, G) and only the input archive for Ice cream samples; the files for the other problems, the presentation of solutions and the archive are not in our copy. The links to the live stream, the photo album and the ICPC standings lead to other servers.
- url: https://contest.felk.cvut.cz/17prg/rank.html
  read: '2026-11-16'
  rubric: 1
  copy: ctuo/ctuo-2017/scoreboard/20260901-live-5c4394a5/rank.html
  title: Scoreboard CTU Open 2017
  language:
  - en
  teams: 72
  problems: 11
  times: true
  tries: true
  description: |-
    Scoreboard of the contest in three tables: Participants (61 teams), Unofficial (7 teams) and High schools (4 teams), 72 teams in all. Each row gives rank, team name with institution code and members, score as number solved and a time total, and for each of the 11 problems (labelled by short names: Amusement, Cascade, Chessboard, Northwest, Equiroaster, Forest, Gallery, Icecream, Monsters, Power, Walkway) the number of attempts and a time for solved problems, or only the attempt count where unsolved, or 0. The Participants table is led by a team with institution code CUNI that solved 10 problems with a score of 1042. The unofficial and high-school teams are kept in their own tables, apart from the official ones.

    The team names link to archives under a home directory, which are not part of our copy.
