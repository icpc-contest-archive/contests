  title: CTU Open Contest, 2017
  language:
  - en
  problems: 11
  description: |-
    Page of the problems, inputs, outputs and official solutions of the contest: a table of 11 problems (Amusement Anticipation, Pond Cascade, Chessboard Dancing, Equinox Roller Coaster, Forest Picture, Shooting Gallery, Ice cream samples, Dark Ride with Monsters, Go Northwest!, Punching Power, Treetop Walkway). For each there are links to the input file, the output file, the statement as PostScript and as PDF, and solution sources as .C and .java files (the last problem lists a .C source only). Below the table are links to an introduction plus all problems, a presentation of solutions and an archive of everything (110 MB).

    The linked statements, data and solution files are not part of this page itself.
