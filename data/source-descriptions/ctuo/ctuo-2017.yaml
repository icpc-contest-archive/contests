  read: '2026-11-16'
  rubric: 1
  copy: ctuo/ctuo-2017/standings/api-20261113/standings.html
  title: The 2017 CTU Open
  language:
  - en
  teams: 72
  description: |-
    Standings of The 2017 CTU Open: 72 teams with rank, team, institution, number solved, time, medal and citation. There are 12 gold, 7 silver and 4 bronze medals; the other 49 teams have no medal and carry a place or Honorable Mention as citation. Ranks are shared: three teams hold each of ranks 1 to 4 and two teams each of ranks 5 to 7. The three teams at rank 1 solved 6, 8 and 10 problems, and the most solved is 10, by three Charles University teams. No per-problem results.
