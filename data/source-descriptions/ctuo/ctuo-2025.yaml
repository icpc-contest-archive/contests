# Written by tools/describe_apply.py from readings of the copies we hold. See README.md in data/source-descriptions.
contest: ctuo-2025
sources:
- url: https://contest.felk.cvut.cz/25prg/
  read: '2026-11-16'
  rubric: 1
  copy: ctuo/ctuo-2025/website/2026-09-03-live-63348105
  title: CTU Open Contest, 2025
  language:
  - en
  description: |-
    Website of the CTU Open Contest 2025, organised by the Czech Technical University in Prague, in English. Our copy holds 3 pages and a style sheet: the home page, a news page and a page with the tentative schedule. The home page states that the contest was held on 7 and 8 November 2025 in Prague, Brno, Ostrava, Banská Bystrica, Bratislava, Žilina and Košice, that the best teams can go on to the Central European Regional Contest 2025 in Wroclaw, and which programming languages and printed literature are allowed.

    The news page carries dated notices, among them the announcement of the contest dates, a pre-contest workshop by the sponsor, an unofficial parallel contest and the stream. The schedule covers registration, opening ceremony, practice session, the contest from 10:00 to 15:00 on Saturday 8 November, the problem set discussion and the award ceremony.

    The other pages in the menu (fees, registration, location, rules, organisers, partners, contest) are linked but are not part of our copy, and the banner image is missing.
