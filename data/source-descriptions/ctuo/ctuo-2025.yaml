    Problem page of the CTU Open Contest 2025: a table of 12 problems, Archery to Theatre, each with links to a ZIP of inputs and outputs, a PDF statement and a ZIP of solutions. Below the table are links to a PDF with the introduction and all problems, to the presentation of solutions, and a line for the Qminers Challenge with a link to its results. The linked files are not part of this page.
