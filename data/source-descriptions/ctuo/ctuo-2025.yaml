    Category page of the Baekjoon Online Judge titled CTU Open Contest 2025, in Korean, filed under ICPC Regionals, Europe, Central European Regional Contest. It lists 12 problems with their Baekjoon numbers 35385 to 35396, labels A, B, C, D, E, G, H, J, M, O, S and T, and titles Archery to Theatre. Each row shows, under the heading "information" (정보), the mark "multilingual" (다국어), and the number of users who solved it, the number of submissions and the acceptance ratio at the time of capture; Snow has the most solvers, 13 with 40 submissions. The statements are not on this page. The rest is the site's menus and footer.
