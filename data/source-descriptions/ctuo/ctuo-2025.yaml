  description: |-
    Final standings page of the CTU Open Contest 2025: a scoreboard of 73 teams from the sites MUNI Brno, UNIZA Žilina, UPJŠ Košice, VSB Ostrava, CTU Prague, STUBA Bratislava and UMB Banska Bystrica. Each row gives rank, team (team number, name, institution and its members), score as problems solved / penalty time, and one column per problem. The 12 problem columns are named archery, book, constantine, ducks, emigrants, grooves, hussites, jj, meetings, ornithology, snow and theatre. A cell gives the number of tries and, for a solved problem, a time. Teams with equal results share a rank; 57 is the last rank and is shared by several teams with no problem solved. Team names link to home folders that are not part of our copy.
