  - en
  problems: 12
  pages: 29
  description: |-
    Problem set of the CTU Open Contest 2025 as a PDF of 29 pages in English. The header names the Czech ACM Student Chapter and eight universities. The first page is an introduction presenting the Czech and Slovak history as the theme, with the permitted languages (C, C++, Java, Python, Kotlin) and input and output rules. It is followed by 12 problems: Archery, Book Burning, Constantine of Thessaloniki, Ducks, Emigrants, Grooves, Hussites, JJ the Almighty, Meetings, Ornithology, Snow and Theatre. Each has a statement with input and output specification and sample input and output. No test data or solutions.
