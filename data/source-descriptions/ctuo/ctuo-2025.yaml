  language:
  - en
  teams: 81
  description: |-
    Final standings of The 2025 ICPC CTU Open: 81 teams with rank, team, institution, problems solved, time and citation. 73 teams carry a rank: the first 39 have a citation from First Place to Thirty-ninth Place and the others are marked Honorable Mention. The last 8 rows have neither rank nor citation; they include a team from a secondary school (Stredná priemyselná škola elektrotechnická Karola Adlera). A Charles University team is first with 10 problems solved and a time of 1769. No per-problem detail.
