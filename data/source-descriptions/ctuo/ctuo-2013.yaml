  problems: 8
  times: true
  tries: true
  description: |-
    Final scoreboard of the CTU Open Contest 2013 from the contest's own website: 92 teams, each with rank, affiliation code (CTUi, CUNI, VSB, CTUe, UZ, ZCU, MUNI, STU and others, with a country flag), the team members' names, the number of problems solved and the penalty time. Four teams at the end have no rank number. There are eight problem columns, FL to FS. Each cell gives the number of tries and, for a solved problem, the solving time and penalty in brackets; first solves are marked.

    The page says that yellow fields signify unofficial teams, and eight team cells are yellow; they are mixed into the list with no other mark. A click on a team's names opens its home folder. A summary row at the bottom gives the number of teams, affiliations and countries, the total number of problems solved, and for each problem the number submitted, the number correct and the fastest time.
