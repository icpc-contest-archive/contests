- url: https://contest.felk.cvut.cz/13prg/
  read: '2026-11-16'
  rubric: 1
  copy: ctuo/ctuo-2013/website/2026-09-04-live-a6cf8a99
  title: CTU Open Contest, 2013
  language:
  - cs
  - en
  description: |-
    Website of the CTU Open Contest 2013 on the server of the Czech Technical University in Prague. The front page, news, dates, fees, registration, location and links pages are in Czech; the technical rules and the tourist information are in English. The menu covers news, dates, fees, registration, location, general rules, technical rules, links, sponsors, tourist information and a contest page. The front page says the contest was held on 18 and 19 October 2013 in Prague, Brno, Plzen, Ostrava, Banska Bystrica, Bratislava, Zilina and Kosice, and that the best teams may go on to the Central European Regional Contest. The schedule gives a Friday test round and the contest on Saturday from 10:00 to 15:00.

    Our copy holds 39 pages. The contest page leads to the final rank page (a scoreboard of 92 teams), the problem set with official solutions (eight problems, FL to FS, with statements as PostScript and PDF, input and output files and C and Java solutions), a list of 709 submitted solutions with time, team, problem, language and result, and a presentation of solutions. The rank page links a home directory archive for each team, and nine of these archives are in our copy. The photo gallery and the link to the ICPC standings lead to other servers and are not part of it.
