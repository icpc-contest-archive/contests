  description: |-
    Page of the contest website headed 'Problems, inputs, outputs and oficial solutions'. A table lists the eight problems, from Fractional Lotion to False Sense of Security, with links for each to the input file, the output file, the statement as PostScript and PDF, and the official solutions in C and Java (a slower C solution is also listed for Folded Map). Below the table are links to an introduction (as a page, PostScript and PDF) and to a presentation of solutions. A footnote names the origin of three problems: Project Euler, the Stanford Local ACM Contest 2009 and the Greater New York ACM Regionals 2001.

    The page holds the links only; the files themselves are separate documents.
