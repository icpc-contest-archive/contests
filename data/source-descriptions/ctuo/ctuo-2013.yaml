  - en
  problems: 8
  description: |-
    Slides of the jury's presentation of solutions, 57 slides in Czech with the problem names in English. The title slide reads 'Sample Solutions CTU Open Contest 2013, Czech Technical University in Prague'. There is a section for each of the eight problems, Fractional Lotion, Folded Map, Furry Nuisance, Fence Orthogonality, Flower Pots, Frustrated Queue, Frozen Rose-Heads and False Sense of Security, of between two and twelve slides. The sections explain the idea of the solution, several with step-by-step examples, and some show source code. The last slides are a questions slide and a list of the problem authors.
