  title: CTU Open 2008 Contest in Prague
  language:
  - cs
  - en
  contest_date: '2008-10-31'
  description: |-
    Website of the CTU Open 2008 contest, with Czech pages and English problem material and rules. Our copy holds 7 pages. The front page says the contest was held on 31 October and 1 November 2008 in Prague, Brno, Ostrava, Bratislava and Zilina, that the best teams may go on to the Central European Regional Contest in Wroclaw on 28 to 30 November, and lists sponsors. It links the results with team home directories, the problems with test data and sample solutions, and the list of submitted solutions.

    The other pages are a preliminary schedule (Friday registration, opening and a trial round; Saturday contest from 10:00 to 15:00, presentation of solutions and announcement of results), instructions for registering a team, and technical rules in English. The results page is a final rank list of 80 teams, each with a link to an archive of the team's home directory; 18 of those archives are in our copy. The submissions list has 582 entries with time, team, problem letter, language and outcome. The individual submitted programs and the other team archives were not captured.
