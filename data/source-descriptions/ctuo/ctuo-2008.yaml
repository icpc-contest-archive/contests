    Page of the Baekjoon Online Judge, in Korean, for the category "CTU Open Contest, 2008", placed under ICPC Regionals, Europe, Central European Regional Contest. A table lists nine problems, numbered 6641 to 6649 on the judge and lettered A to I, with English titles, the number of users who solved each, the number of submissions and the acceptance ratio. Only On-Line Banking and Safe Gambling have solvers, 7 each. Problem H carries a special-judge mark. The page lists the problems only; the statements are on separate pages of the judge.
