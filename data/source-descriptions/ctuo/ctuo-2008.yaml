  description: |-
    Standings of the 2008 CTU Open, a table of 75 teams with rank, team name, institution, number solved and a time column. The first team, from Comenius University, solved 7; 57 teams solved at least one problem. Tied teams share a rank, the last rank is 63, and some ranks, such as 2 and 4, do not occur. The time column reads 0 for every team. Nine institutions from the Czech Republic and Slovakia appear. The list has fewer teams than the rank list on the contest website, and gives no per-problem results.
