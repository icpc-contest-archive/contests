  description: |-
    Final rank list of the CTU Open 2008 contest, in one table of 80 teams. Each row gives the rank, the team number with its university abbreviation and team members, a total time, a row of nine icons, one position for each of problems A to I, the number of accepted problems, from 7 down to 0, and a link to an archive of the team's home directory. A letter icon marks a solved problem and an empty icon an unsolved one; the page gives no attempts and no time per solution. 62 teams solved at least one problem; the 18 teams at the end show 00:00:00 and 0 accepted.
