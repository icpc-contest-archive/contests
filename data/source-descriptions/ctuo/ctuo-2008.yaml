  title: Sample Solutions CTU Open Contest 2008
  language:
  - cs
  pages: 24
  description: |-
    Slide presentation of sample solutions for the CTU Open 2008, a PowerPoint file of 24 slides in Czech. After a title slide it takes the problems in order, Alea, Banking, Contest, Declare, Exchange, Fence, Gambling, Help and Insert, each with a heading slide and one to three slides that outline the idea of the solution, such as dynamic programming, trying all combinations or a recursive count. Banking is said to be a simple simulation made harder by incorrect input; Exchange is called a rescue problem. The last slide credits the authors of the problems.
