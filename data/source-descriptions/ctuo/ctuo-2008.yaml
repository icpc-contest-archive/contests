  description: |-
    Index page of the problems of the CTU Open 2008 contest, in English with one note in Czech. It lists nine problems A to I, from "Alea iacta est" to "Tree Insertions". For each it links input data, output data and the statement as PostScript and PDF; eight have solutions in C and eight in Java, and problem G has two C versions. It also links an introduction in PostScript and PDF and a presentation of solutions. A footnote says Wooden Fence was taken from World Finals 1999 (problem D, The Fortified Forest). The Czech note says the input data of problem B had errors, one fixed during the contest and one, a double space, left in, and apologises to the affected teams. The linked files are not in this page's copy.
