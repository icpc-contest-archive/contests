    Dashboard page of a Codeforces gym contest titled "2007-2008 CTU Open Contest", marked as finished. It describes the CTU Open as a preparation for the CERC, a local contest held at CTU Prague and open to any Czech university, and links the contest website. A table lists nine problems lettered A to I with their titles, a time limit from 0.5 to 4 seconds, a memory limit of 256 MB and a count of solvers; the letters differ from the ones of the original set. A link to the English statements as a PDF is on the page; the PDF is not in our copy. The rest is the Codeforces page frame, with a note on virtual participation and forms for asking a question and adding an announcement. The statements themselves are not part of this page.
