  description: |-
    Final rank list of the CTU Open 2007 contest, in one table of 58 teams. Each row gives the rank, the team number with its university or faculty abbreviation and team members, a total time, a row of nine icons, one position for each of the nine problems, and the number of accepted problems, from 4 down to 0. A letter icon marks a solved problem and an empty icon an unsolved one; letter icons occur only for problems E, G, I, R, S and T. The page gives no attempts and no time per solution. 32 teams solved at least one problem; the 26 teams at the end show 00:00:00 and 0 accepted.
