  title: CTU Open 2007 Contest in Prague
  language:
  - cs
  - en
  description: |-
    Website of the CTU Open 2007 contest, with Czech pages and English problem material. Our copy holds 68 pages. The front page says the contest was held on 19 and 20 October 2007 in Prague, Brno, Ostrava and Bratislava, that the best teams may go on to the Central European Regional Contest in Prague in November, and carries two sponsor logos linked to the sponsors' sites. It links the results list, the problems with test data and sample solutions, and the list of submitted solutions.

    The other pages are a preliminary schedule (Friday registration, opening, information and a trial round; Saturday contest from 10:00 to 15:00, presentation of solutions and announcement of results) and instructions for registering a team. The results page is a final rank list of 58 teams. The problem section has an introduction and nine problems, each with a statement as PostScript and PDF, input and output data, a solution in C and for seven of them also in Java, and one archive of everything. The submissions list has 384 entries with number, time, team, language (c, C, java or p) and outcome (accepted or rejected with a reason); our copy holds the source text of 43 of the submissions, and the pages of the rest were not captured.
