  title: CTU Open 2006 Contest in Prague
  language:
  - cs
  - en
  description: |-
    Website of the CTU Open 2006 contest, mostly in Czech. Our copy holds 7 pages. The front page says the contest was held on 27 and 28 October 2006 in Prague, Ostrava, Brno and Bratislava, and that the best teams go on to the Central European Regional Contest in Budapest in November. It links the results list and the problem statements.

    The other pages are a preliminary schedule (Friday registration, information session, opening and a trial round; Saturday contest from 9:30 to 14:30, presentation of solutions and announcement of results), a team registration form with instructions, a list of 52 registered teams with faculty and school, the results list with 49 teams, a plain-text final standings file, and the problem statements page with 9 problems in English. The statements page and the results pages are described as documents of their own.

    The images used by the pages are in our copy.
