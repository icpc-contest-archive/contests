    Final results list of the CTU Open 2006 contest, a Czech-language page headed "Výsledková listina" ("results list"). It ranks 49 teams, each given as team number, university or faculty abbreviation and team members, with a total time. Next to each team is a row of nine icon slots: the letters of the solved problems (only C to I occur) followed by empty icons, so the page shows which problems a team solved but not attempts or the time of each solution. The letter icons link to the problem statements. Nobody solved A or B; the last three teams solved nothing and show 00:00:00. Teams from several faculties and universities are in one list.
