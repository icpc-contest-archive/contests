  title: CTU Open 2005 Contest in Prague
  language:
  - cs
  - en
  contest_date: '2005-10-15'
  description: |-
    Website of the CTU Open Contest 2005, in Czech, with the problem statements in English. The front page says the contest was held on 14 and 15 October 2005 in Prague, Ostrava, Brno and Bratislava, that the best teams go on to the Central European Regional Contest in Budapest on 19 and 20 November, and that the regional round decides participation in the world finals in Texas in April 2006. It links to the results list, the problems with test data and sample solutions, the list of submitted solutions and the home directories of the teams.

    Our copy holds 85 pages. Besides the front page they include a schedule (Friday 14 October: registration, briefing, opening, trial round; Saturday 15 October: contest from 9:30 to 14:30, presentation of solutions, results from 15:30), a registration form with the deadline of Friday 14 October at 12:00, a list of 49 registered teams, a results list of 47 teams, a problem statements page with nine problems, and a list of 297 submitted solutions. The source text of 68 submissions and the test data files of the nine problems are included.

    The 47 team home directory archives are not in our copy; 220 of the listed submissions have no saved page. The three sponsor logos on the front page returned errors and are missing.
