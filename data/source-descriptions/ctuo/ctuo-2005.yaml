  description: |-
    Problem set of the CTU Open 2005 in one page, in English, headed by the Czech ACM Student Chapter and CTU FEE Prague, MFF UK Prague, FEI TU Ostrava, MUNI FI Brno and FIIT STU Bratislava.

    Nine problems A to I: All Friends, Board Game, Crane, Divisors, Emag eht htiw Em Pleh, Failing Roads, Go Endgame, Help Me with the Game and IVXLCDM. A table links for each problem the input data, output data, a PostScript statement and a C solution, plus one archive of everything (all.tgz, 3.8 MB). The page also holds all nine statements in full, each with a sample input and output; eight have input and output specifications, while the statement of Emag eht htiw Em Pleh only refers to problem H and gives a sample.
