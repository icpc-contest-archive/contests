  description: |-
    Results list of the CTU Open Contest 2005 with 47 teams in rank order. A note at the top, in Czech, says the contest was ended about 30 minutes before its planned end by a power outage in Prague, that the result was declared as the state at the outage, and that one team not affected by the outage submitted an eighth problem within minutes afterwards, which was accepted, so that it shares first place; the year has two winners.

    Each row gives the rank, a team number with its faculty (MFF, FMFI, FI, FIIT, FEL, FAV, VSB and others), the members' names, a total time, and a row of icons in which a letter icon marks each solved problem and links to its statement. It shows solved problems only, with no attempts and no time per problem. The two teams in first place are Cteam35 of MFF and Cteam96 of FMFI. The icons that appear are for problems A and C to I. 40 teams have at least one problem solved; the last seven have none and a time of 00:00:00.
