  description: |-
    Final standings of the CTU Open Contest 1998: 31 teams numbered 1 to 31, each with a school (shown as a logo), a team name, the names of its contestants, a Problems cell and a total time. The problems are M, P, L, N, V, T, Z and R, matching the problem set.

    Below the table, Submit Statistics counts the submissions per problem by outcome (accepted, compile error, invalid library call, runtime error, time limit exceeded, wrong answer, presentation error): 417 in all, 102 of them accepted. A Run-time Analysis lists, for each problem, the running times of the accepted solutions by team number and programming language (C, C++ or Pascal), with the time limit of the problem.

    The Problems cell is an image that the original page loads from another server. It is not in our copy, so only its alternative text remains: the number of problems solved and a string of letters showing which.
