    Contest dashboard on QOJ for "CTU Open Contest 1998", filed under ICPC / Regionals / Europe / Central Europe / CTU Open Contest. It lists eight problems A to H by their Czech titles, all but "Reversi" with an English gloss, from "Mince (Coins)" to "Podnikatel (Entrepreneur)", and the settings of the archived contest: ICPC ruleset, a penalty of 20 minutes, scoreboard frozen after 4:00:00, and a virtual contest open to join. The attachment listed is the Czech statements; neither the attached files nor the individual problem pages are part of our copy.
