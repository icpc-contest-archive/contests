  description: |-
    Partial English translation of the problem set, as one web page headed by the Department of Computer Science, CTU FEE, and the Czech ACM Chapter. It says it is an unofficial translation meant to give contestants the basic idea and that not all the problems are listed. After the introduction about the Okurkons family it gives four problems: Mince (Coins), Reversi, Tchyne (Mother-In-Law) and Zlomky (Fractions). Each has a statement, input specification, output specification a sample input and output, and the file names to use for the solution (for example mince.c, mince.p, mince.C). The other four problems of the contest are not on the page. No test data or solutions.
