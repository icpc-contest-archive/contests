  description: |-
    Problem set in Czech, as one web page headed by the Department of Computer Science of the Faculty of Electrical Engineering, CTU Prague, and the Czech ACM Chapter. A short introduction addressed to the contestants, built around a family called Okurkovi, is followed by eight problems: Mince, Reversi, Lode, Vylet, Tchyne, Zlomky, Noty and Podnikatel. Each has a statement, input specification, output specification and a sample input and output. Each problem also names the file names to use for the solution (for example mince.c, mince.p, mince.C). No test data or solutions.
