  contest_date: '1998-10-24'
  description: |-
    Website of the 1998 CTU Open Contest, a small hand-made site of the Department of Computer Science and Engineering of the Faculty of Electrical Engineering, CTU Prague, in English and Czech. The English text says the contest was held on 24 October 1998; the Czech text calls it the preparatory round for the Central European Regional Contest, held on 23 and 24 October 1998, with the regional contest to follow on 13 and 14 November in Prague. It links the problem statements and the final results.

    Our copy holds 5 pages: the front page, a page for choosing the Czech character encoding, the standings page with statistics, the problem statements in Czech (eight problems), and an English translation that covers only four of them and says so.
