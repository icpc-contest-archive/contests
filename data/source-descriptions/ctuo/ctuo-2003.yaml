  title: 'Problems Statement: CTU OPEN 2003 Contest'
  language:
  - en
  problems: 9
  description: |-
    Problem set of the CTU Open 2003 in one page, in English, with an introduction from the organising team naming the Czech ACM Student Chapter at CTU in Prague and departments of CTU, Charles University, VŠB TU Ostrava and SUT Bratislava (as the page spells it). The problems are set for a goods transportation company, Advanced Cargo Movement, Ltd.; all are original except Traffic Jam, taken from the SouthEast USA Regional Contest 1999.

    Nine problems: Bridge Hands, Charlie's Change, Building a New Depot, Truck History, Base Numbers, Paper Cutting, Hexagonal Routes, Storehouse and Traffic Jam. A table links for each problem a C solution, a Pascal solution, input and output data (gzipped) and the statement as PostScript, plus one archive of everything (all.tar). The page also holds all nine statements in full, each with input and output specification and a sample.
