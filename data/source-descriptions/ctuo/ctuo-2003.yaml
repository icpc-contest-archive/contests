    Results list of the CTU Open Contest 2003 with 34 teams in rank order. Each row gives the rank, a team number with its school or site (UK Praha, CVUT Praha, UK Bratislava, STU Bratislava, ZCU Plzen, Ostrava), the members' names, a total time, and a row of icons in which a letter icon marks each solved problem and links to its statement.

    It shows solved problems only, with no attempts and no time per problem. First place is Cteam16 of UK Praha with eight problems solved; the last nine teams have no problem solved and a time of 00:00:00.
