    Baekjoon Online Judge page, in Korean, listing the problems of the CTU Open Contest 2003 as a category under ICPC Regionals, Europe, Central European Regional Contest. A table of nine problems gives each Baekjoon problem number, its letter (B, C, D, H, N, P, R, S, T), its title, and the numbers of users who solved it, submissions and percentage correct. Eight titles are in English; problem C is titled in Korean. The page is the list only: the statements are on separate pages that are not in our copy.
