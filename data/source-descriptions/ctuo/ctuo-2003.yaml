  title: CTU Open 2003 Contest in Prague
  language:
  - cs
  - en
  contest_date: '2003-10-25'
  description: |-
    Website of the CTU Open Contest 2003, in Czech, with the problem statements in English. The front page says the contest was held on 24 and 25 October 2003 in Prague, Ostrava and Bratislava and links to the results list, the problems with test data and sample solutions, the list of submitted solutions and the home directories of the teams.

    Our copy holds 66 pages. Besides the front page they include a schedule (Friday: registration, opening, trial round; Saturday 25 October: contest from 10:00 to 15:00, results announced from 16:00), an online registration form with its deadline of Friday 24 October at 12:00, a list of 33 registered teams, a results list of 34 teams, a problem statements page with nine problems, and a list of 365 submitted solutions for a contest that ran from 10:05:20 to 15:05:20. The source text of 58 submissions is included.

    The rules page, which the front page links to, and the 34 team home directory archives are not in our copy; the other submissions listed (303 submission pages) were not saved either.
