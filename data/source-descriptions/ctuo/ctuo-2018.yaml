  description: |-
    Final scoreboard of the contest in two tables: Official, with 66 teams, and Unofficial, with 11 teams, 77 in all. Each row gives rank, team name with institution code and members, score as number solved and a time total, and for each of the 10 problems (Die, Escalators, Furniture, Game, Horsemeet, Lighting, Lockers, Numbers, Rullete, Security) the number of attempts and a time for solved problems, or only the attempt count where unsolved, or 0. A team with institution code CUNI leads the Official table with 10 problems solved and a score of 1403; the Unofficial table has its own ranking. Team names link to home folders, which are not part of our copy.
