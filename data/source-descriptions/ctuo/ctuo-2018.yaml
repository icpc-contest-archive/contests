- url: https://contest.felk.cvut.cz/18prg/
  read: '2026-11-16'
  rubric: 1
  copy: ctuo/ctuo-2018/website/2026-09-03-wayback-74f7d774
  title: CTU Open Contest, 2018
  language:
  - en
  contest_date: '2018-10-20'
  description: |-
    Website of the CTU Open Contest 2018, in English, a programming contest organised by the Czech Technical University in Prague. The home page says the contest was held on 19 and 20 October 2018 in Prague, Brno, Pilsen, Ostrava, Banská Bystrica, Bratislava, Žilina and Košice, and that the best teams can go on to the Central European Regional Contest in Prague. Our copy holds 15 pages: news, dates, fees, location, general rules, organisers, partners, tourist information, a contest page, the final scoreboard, the problems and solutions page, a page of 678 submissions with time, team, problem, language and result, and a one-page PDF linked from the partners page. The dates page gives the programme: practice session on Friday 19 October, then the contest on Saturday 20 October from 10:00 to 15:00, with problem discussion and award ceremony after it.

    The problems page lists 10 problems with links to zips of data and solutions and a PDF statement for each, but none of those files, nor the presentation of solutions or the archive of everything, are in our copy. The technical rules and registration pages are not in our copy either. The news page links to records of the opening ceremony, the last-minute announcement and the problem discussion with award ceremony, and the contest page to a photo album and the ICPC standings; these lead to other servers.
