    Codeforces gym dashboard for the contest, titled 2018-2019 CTU Open Contest and marked Finished. It lists 10 problems labelled A to J (Die, Security Guards, Rullete, Numbers Generator, Locker Room, Lighting, Horsemeet, Split Game, Moving Furniture, Escalators) with time limit, memory limit and the number of gym solvers for each, in an order different from the contest's own letters. Four announcements posted in the gym are shown, one pointing to the original problem statements on the contest website and two noting that precision and output format differ from the official contest. The statements, submission and standings links are not part of our copy.
