    Contest dashboard on QOJ for "CTU Open Contest 1995", filed under ICPC / Regionals / Europe / Central Europe / CTU Open Contest. It lists seven problems A to G by title, all but "Octree" in Czech, from "Piškvorky" to "Drak", and the settings of the archived contest: ICPC ruleset, a penalty of 20 minutes, scoreboard frozen after 4:00:00, and a virtual contest open to join. The attachments listed are the Czech statements and a reconstruction and verification record; neither the attached files nor the individual problem pages are part of our copy.
