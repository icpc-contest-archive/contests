  description: |-
    Final results page: a heading and one image of a computer printout in Czech, headed as the final order of the competing teams on 13 May 1995 of the local round of the ACM programming contest of the Department of Computers of the Faculty of Electrical Engineering, CTU. The list has 16 rows with place, user name, team name (faculty or school and the team's members), the problems solved as a string of letters, and a time. Places 6 and 14 are each shared by two teams, and the last two teams have no problems solved and a time of 00:00:00. Team names carry the affiliations FEL CVUT (nine rows), MFF UK (five rows), FJFI CVUT (one row) and Gym. Arabska (one row).

    The page has no text table: the results exist only as the image, which our copy holds.
