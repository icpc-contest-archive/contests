  description: |-
    Website of the 1995 CTU Open Contest, in English, under the title Central European Regional Contest in Prague. It says the contest was held on 12 and 13 May 1995 at CTU Prague, FEE, Department of Computer Science and Engineering, and names Hewlett Packard Czech Republic and AutoCont as main sponsors. It links two documents: the problem statements and the final results.

    Our copy holds three pages: this front page, the problem statements PDF and the results page with its image. The sponsor links lead to other servers and are not part of our copy.
