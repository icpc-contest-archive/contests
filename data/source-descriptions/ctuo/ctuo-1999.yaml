  description: |-
    Problem set in English, a PDF of 12 pages headed "CTU Open Contest 1999" with the Department of Computer Science, CTU FEE & Czech ACM Chapter named above the title. It opens with a note calling it an unofficial translation, and a letter to the contestants that frames the problems as games for a collection called KOKODáKH and sets the common rules for input and output.

    Eight problems follow, without letters, under their Czech titles with an English gloss: Jack, Kaleidoskop (Caleidoscope), Logik (Logic), Mocneni (Raising Modulo Numbers), Nejvyssi zisky (The Highest Profits), Osmismerka (Word Puzzle), Patnactka (Lloyd Fifteen Puzzle) and Quorf. Each gives the source file names, the statement, input and output specifications, a sample input and the output for it; some sample outputs and terms are left in Czech. No contest date, test data or solutions.
