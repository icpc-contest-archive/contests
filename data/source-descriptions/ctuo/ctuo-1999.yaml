  description: |-
    Website of the 1999 CTU Open Contest, a hand-made site of the Department of Computer Science and Engineering of the Faculty of Electrical Engineering, CTU Prague, in English and Czech. The English text says the contest was held on 6 November 1999; the Czech text calls it the preparatory round for the Central European Regional Contest, held on 5 and 6 November in Prague and Ostrava, with the regional contest to follow on 12 and 13 November in Prague. It links the rules (that page is not in our copy), the results, the problems, the sample solutions and test data, a list of all submissions and the team home directories.

    Our copy holds 8 pages: the front page, a page for choosing the Czech character encoding, the working version of the results, the problems in Czech and in English, the sample solutions and test data page, the list of all 311 submissions, and the page of 25 team home directories. The test input and output files of all eight problems are in our copy; of the sixteen sample solution files only one (osmismerka.c) is, and none of the submitted source files is. The team home directory archives are not in our copy, and neither are the header images of the site.
