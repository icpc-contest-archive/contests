  description: |-
    Results of the CTU Open Contest 1999, a plain page marked as a working version of the results, with a note (in Czech) that better graphic design may follow later. It ranks 25 teams, each with the university (UK MFF, CVUT FEL, VSB FEI or ZCU FAV), the members, a total time and a string of eight characters, one position per problem, with a letter where the problem was solved and a dash where it was not. The page does not say which letter belongs to which problem. The last-ranked team has no solved problem and a time of 00:00:00.

    Below the table, a statistics table counts the submissions for each of the eight problems by outcome (accepted, compile error, runtime error, time limit, invalid function, wrong answer, presentation error). A final list gives the accepted submissions with the problem, the language and the run time. Attempts and times per problem are not given for each team.
