  description: |-
    Page in Czech listing the sample solutions and test data of the eight problems. For each problem (Jack, Kaleidoskop, Logik, Mocneni, Nejvyssi, Osmismerka, Patnactka, Quorf) the table links two jury solutions, one in C or C++ and one in Pascal, with the run time of each in seconds, the test input and the expected output as compressed files, and the time limit of the problem, from 2 to 40 seconds. A text above the table says the times are given so that readers can compare them with their own computers.

    Only the page is in this copy; the linked test data files are held in our copy of the site as a whole, and of the solution files only one. The problem names link to the problem statements.
