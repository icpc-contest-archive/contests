    Problem set in Czech, as one web page headed by the Department of Computer Science of the Faculty of Electrical Engineering, CTU Prague, and the Czech ACM Chapter. An introduction about a fictional travel agency, ACMCZ, is followed by eight problems, named Airport, Term, Compiler, Secretary, Medical doctor, Farm, Luggage and Competition (in Czech). Each has a statement, input and output specification, and one sample input and output. The problems carry no letters on the page. No test data or solutions.
