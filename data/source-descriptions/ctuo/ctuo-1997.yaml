  contest_date: '1997-05-17'
  description: |-
    Website of the 1997 CTU Open Contest, a small hand-made site of the Department of Computer Science and Engineering of the Faculty of Electrical Engineering, CTU Prague, in English and Czech. The front page, with an English and a Czech text, says the contest was held on 17 May 1997, under the patronage of the CTU rectorate and the department, with Microsoft and Hewlett Packard Czech Republic as main sponsors, and links the problems and the final results.

    Our copy holds 5 pages: the front page, a page for choosing the Czech character encoding, the final results page (18 teams, problems A to H), the problem statements in Czech, and the problem statements in English, marked there as an unofficial translation. The ball images of the results page are in our copy; the header images, which the pages load from a shared image folder of the host's server, are not.
