  description: |-
    Contest dashboard on QOJ for "CTU Open Contest 1997", filed under ICPC / Regionals / Europe / Central Europe / CTU Open Contest. It lists eight problems A to H by their English titles, from "Airport" to "Competition", and the settings of the archived contest: ICPC ruleset, a penalty of 20 minutes, scoreboard frozen after 4:00:00, and a virtual contest open to join. The attachments listed are an English translation in HTML of the official site, the Czech statements and a reconstruction and verification record; neither the attached files nor the individual problem pages are part of our copy.
