  description: |-
    Final results of the CTU Open Contest 1997: 18 teams numbered 1 to 18, each with the institution (MFF UK, FEL CVUT, K336 FEL, FJFI CVUT), the names of its members, a coloured ball image in the cells of problems A to H, empty cells otherwise, and a total time. The page does not explain the colours.

    Below it a Submit Results table gives, for each team number and problem, the counts of submissions by outcome (compile error, runtime error, wrong answer, time limit exceeded, presentation error, accepted) and a total of submissions and accepted ones per team. A Submit Statistics table counts the outcomes per problem and in all: 288 submissions, 51 of them accepted. The ball images are in our copy; the visitor counter image, loaded from another server, is not.
