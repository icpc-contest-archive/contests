  - en
  problems: 9
  pages: 48
  description: |-
    Slides of the presentation of solutions to the CTU Open Contest 2011, a PowerPoint file of 48 slides written in Czech, with the problem names in English. There is a title slide, then one section for each of the nine problems in the order Analog Clock, Collatz Conjecture, Encryption, Mine the Gradient, Invasion, Intergalactic Mortgage, Simple Polygon, Ambiguous Result and Domino Tiling. The sections give the idea of the solution, for example dynamic programming for Mine the Gradient, Dijkstra's algorithm for Invasion and a sweep line for Simple Polygon; the Collatz section notes that 32-bit integers are not enough, and Mine the Gradient also shows code. The last slide lists the authors of the problems.
