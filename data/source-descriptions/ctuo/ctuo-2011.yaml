  description: |-
    Website of the 2011 CTU Open Contest at the Czech Technical University in Prague (CTU), headed by the ACM-ICPC banner. The home, news, dates, fees, registration, location, general rules, links and sponsors pages are in Czech; the technical rules and tourist information pages are in English. The home page says the contest ran on 21 and 22 October 2011 at eight sites in the Czech Republic and Slovakia, and that the best teams could go on to the Central European Regional Contest in Prague. The schedule gives a Friday practice round and a Saturday contest from 10:00 to 15:00, followed by a presentation of solutions.

    The CONTEST page leads to the problems and official solutions, the final rank with archived home directories, the rank in the Baylor system and the photos (both external links), and a list of the solutions submitted by contestants during the contest. The rank page is a standings list of 124 team rows. The problems page lists nine problems with input and output files, statements in PostScript and PDF, solution programs in C and Java, an introduction, and a link to the slides of the solutions.

    Our copy holds 104 saved files, among them the slides, the C and Java solution programs, the introduction and seven of the nine statements as PDF files (those of Analog Clock Display and Collatz Conjecture are missing as PDF), and text pages for all nine statements. The input and output files, the PostScript files and the zip archive are not in our copy.
