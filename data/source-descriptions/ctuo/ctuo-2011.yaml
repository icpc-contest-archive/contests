    Page of the CTU Open Contest 2011 website listing nine problems by name: Analog Clock Display, Collatz Conjecture, Text Encryption, Mine the Gradient, Invasion, Intergalactic Mortgage, Simple Polygon, Ambiguous Result and Domino tiling. Each problem is marked by a small letter image (a, c, e, g, i, m, p, r, t) and not by the letters A to I. For each problem the table links the input file, the output file, the statement as PostScript and as PDF, and the official solution in C and in Java. Larger input files are marked with their size, up to 24MB for Mine the Gradient. Below the table are links to an introduction (PostScript and PDF), to the presentation of solutions (2.3MB) and to a single archive of everything (38.8MB). The links lead to files on the same site and are not part of this page.
