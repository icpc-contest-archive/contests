    Final standings of The 2011 CTU Open, 87 teams, headed 'ICPC year 2012'. Each row gives the rank, a team number, the institution's full name, the number of problems solved (from 6 down to 1), a time column that reads 0 on every row, a medal, a place citation and a site citation. The top twelve teams hold medals, four gold, four silver and four bronze, and the first place is a Masaryk University team with 6 solved. Places 1 to 43 are named as places (First Place and so on) and places 44 to 87 are listed as Honorable Mention. Nine teams carry a site citation of the form 'Champion of' followed by a site name, one of them for the unofficial site. No per-problem results.
