    Standings of the CTU Open Contest 2011 from the contest website: 124 team rows, each giving a team label with the institution abbreviation (MUNI, UNIBA, CUNI, STUBA, VSB, ZCU and others) and the team members, a total time in hours, minutes and seconds, the number of problems accepted, and a link to an archive of the team's home directory. Teams are ordered by problems accepted and then by time. The first 87 rows carry a rank number, the first place going to a MUNI team with 6 accepted in 12:57:10. The remaining 37 rows have no rank and show 0 accepted and a time of 00:00:00. There are no per-problem columns, and nothing marks official, unofficial or guest teams.
