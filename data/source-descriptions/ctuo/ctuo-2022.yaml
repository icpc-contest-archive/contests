  description: |-
    Problem set as a PDF of 26 pages for the CTU Open Contest 2022. The cover lists the Czech ACM Student Chapter, Czech Technical University in Prague, Charles University, the Technical University of Ostrava, Masaryk University, the University of Zilina, Pavol Jozef Safarik University in Kosice, Matej Bel University in Banska Bystrica and the Slovak University of Technology. An introduction text on the contest theme and the rules for programs (C, C++, Java or Python, standard input and output) is followed by 12 problems, Array, Canoes, Earthquake, Journals, Mower, Needle, Patio, Robots, Shamans, Transmitter, Volcanoes and Wagon. Each statement gives the allowed file names, an input specification and an output specification; eleven of the 12 have sample input and output, Canoes has none. No date is printed. No test data or solutions.
