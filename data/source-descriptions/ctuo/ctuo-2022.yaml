    Category page of the Baekjoon Online Judge, in Korean, for the problem source CTU Open Contest, 2022 under ICPC Regionals, Europe, Central European Regional Contest. It lists 12 problems labelled A, C, E, J, M, N, P, R, S, T, V and W (Array, Canoes, Earthquake, Journals, Mower, Needle, Patio, Robots, Shamans, Transmitter, Volcanoes, Wagon) with judge problem numbers 26044 to 26055. Each row gives the number of users who solved it, the number of submissions and the acceptance ratio; Needle is marked as a special judge problem. The statements themselves are on separate pages that are not part of our copy.
