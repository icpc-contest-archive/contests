- url: https://contest.felk.cvut.cz/22prg/
  read: '2026-11-16'
  rubric: 1
  copy: ctuo/ctuo-2022/website/2026-09-03-wayback-ad2385f0
  title: CTU Open Contest, 2022
  language:
  - en
  contest_date: '2022-11-05'
  description: |-
    Website of the 2022 CTU Open Contest, organised by the Czech Technical University in Prague, in English. Our copy holds 128 files: 15 HTML pages (the front page under two addresses), 14 PDFs, 67 files of submitted source code, 17 zip archives, 14 images and a style sheet. The front page says the contest was held on 4 and 5 November 2022 in Prague, Brno, Ostrava, Banska Bystrica, Bratislava, Zilina and Kosice, and that the best teams could go on to the Central European Regional Contest in Ljubljana. Menu pages cover news, the schedule (practice on Friday evening, contest on Saturday 10:00 to 15:00), fees (none), registration, the Prague location, general rules (a link to the ICPC rules), technical rules, organizers and partners.

    The contest page leads to the problems with official solutions (links to statements, input and output archives and solution archives for 12 problems, a 26-page problem PDF and a 178-page presentation of solutions), the final standings (59 official and 4 unofficial teams), and a list of 736 submitted solutions with time, team, problem, language and result. Links to the photos and to the standings on icpc.global lead to other servers.

    Missing from our copy: the logos on the organizers and partners pages, six of the 12 input and output archives (array, earthquake, robots, transmitter, volcanoes, wagon), the solutions archive for shamans and the source code of two linked submissions.
