    Final scoreboard of the 2022 ICPC CTU Open from the contest's own website. An Official table lists 59 teams and an Unofficial table lists 4 more. Each row gives rank, team identifier and name, institution, team members, a score of problems solved with total time, and one cell per problem for the 12 problems array, canoes, earthquake, journals, mower, needle, patio, robots, shamans, transmitter, volcanoes and wagon, with the number of attempts and, for solved problems, the time. The team in first place is Sho from Charles University in Prague with 11 problems. Team names link to team home folders.
