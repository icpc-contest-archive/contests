  title: CTU Open 2004 Contest in Prague
  language:
  - cs
  - en
  contest_date: '2004-11-06'
  description: |-
    Website of the CTU Open Contest 2004, in Czech, with the problem statements in English. The front page says the contest was held on 6 November 2004 in Prague, Ostrava and Bratislava, that the best teams may go on to the Central European Regional Contest in Budapest on 19 to 21 November, and that in the regional round teams compete for a place in the world finals in Shanghai in April 2005. It links to the results list, the problems with test data and sample solutions, the list of submitted solutions and the home directories of the teams.

    Our copy holds 74 pages. Besides the front page they include a schedule for Saturday 6 November (registration, opening, trial round, contest from 12:30 to 17:30, results from 18:00), a registration page that says registration has ended, a list of 55 registered teams, a results list of 45 teams, a problem statements page with ten problems, and a list of 457 submitted solutions. The source text of 56 submissions and the test data files of the ten problems are included.

    The 45 team home directory archives are not in our copy; 388 of the listed submissions have no saved page. The three sponsor logos on the front page returned errors and are missing.
