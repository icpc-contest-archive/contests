  language:
  - en
  problems: 10
  description: |-
    Problem set of the CTU Open 2004 in one page, in English, with an introduction from the organising team naming the Czech ACM Student Chapter at CTU in Prague and departments of CTU, Charles University, VŠB TU Ostrava and SUT Bratislava (as the page spells it). The problems are framed as tests for applicants to the position of "A Chief Ment" in a company. A list credits contributions to the problem set: Charles University Prague, the University of Valladolid (credited for "English-Number Translator") and CTU Prague.

    Ten problems A to J: Agents, Boatherds, C Looooops, Death to Binary?, Electricity, Firepersons, God of the Vile Baskers, Herbalists, Inglish-Number Translator and Japan Plotter Driver. A table links for each problem the input data, output data, a PostScript statement and a C solution, plus one archive of everything (all.tgz, 10 MB). The page also holds all ten statements in full, each with input and output specification and a sample.
