  description: |-
    Results list of the CTU Open Contest 2004 with 45 teams in rank order. Each row gives the rank, a team number with its faculty and school (MFF UK, FMFI UK, FEL CVUT, FEI VSB, FAV ZCU, FIIT STU), the members' names, a total time, and a row of icons in which a letter icon marks each solved problem and links to its statement.

    It shows solved problems only, with no attempts and no time per problem. First place is Cteam90 of FMFI UK with seven problems solved. The 26 top teams have at least one problem solved; the last 19 teams have none and a time of 00:00:00. Only problems C, D, E, F, G, I and J appear among the solved problems.
