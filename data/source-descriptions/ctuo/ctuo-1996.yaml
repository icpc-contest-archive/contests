  description: |-
    Results of the Prague round as a single web table, in Czech written without diacritics: 17 teams, listed in rank order from 1 to 17 with the university, faculty or school and the team members' names. For each team it gives the problems solved as a string of letters (from b to h, so which problems were solved, but not when or after how many attempts) and one time value. The table has columns for team, solved problems (a string of letters), time and a fourth column headed Postup (advancement) that is empty in every row. The teams come from FEL CVUT, FJFI CVUT, MFF UK and one secondary school (Gymnazium Arabska). The top team, from MFF UK, solved six problems (bcefgh); the last team solved one.
