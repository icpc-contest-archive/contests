  contest_date: '1996-04-26'
  description: |-
    Website of the 1996 programming contest of the Department of Computers of the Faculty of Electrical Engineering of CTU in Prague (FEL CVUT) and ACM, in Czech written without diacritics. A single long front page describes the second year of the contest: rules of the ACM regional contest, organisation (a practice day on Friday, the contest on Saturday), the equipment (PCs running Linux connected to an HP 9000 server, programs in C or Pascal), the judging verdicts, and the ranking rule (problems solved, then time, with 20 penalty minutes for each rejected submission).

    The page also holds reports on the two rounds. The local round at FEL CVUT took place on 26 and 27 April 1996 with sixteen teams present and six places in the Prague round at stake. The Prague round on 3 and 4 May 1996 had teams of FEL CVUT, FJFI CVUT and MFF UK, eight problems, and a place in the regional round in Bratislava at stake; the report ends with a date of 8 May 1996. The page links to the problem statements and the results of each round.

    Our copy holds five pages (the front page, which is also saved under its index.html address, the two problem pages and the two results pages) and 19 further files: images, style sheets and scripts.
