    Problem set of the Prague round as one web page in Czech written without diacritics: an introduction that sets the problems in the year 2047 around the hyperspace ship Nostromo, then eight problems A to H (Hyperoxni hypergony, Prunik hyperkvadru, Posadka, Kolonie, Vyplneni prostoru, Prstencove generatory, Optimalni trasa, Posloupnost planet). Each problem has a statement, input and output specifications and an example; three problems carry a figure. No test data or solutions.
