  copy: ctuo/ctuo-2000/problemset/20261101-live-a7f699c9/problems.html
  title: CTU Open 2000 Contest - Zadání úloh
  title_en: CTU Open 2000 Contest - problem statements
  language:
  - cs
  problems: 8
  description: |-
    Problem statements of the contest on one page, in Czech, headed with the Department of Computers (Katedra počítačů) of ČVUT FEL and the Czech ACM Chapter. An opening letter to the contestants gives the general rules for input and output. Then follow eight problems labelled d, g, h, l, p, r, s, t: Zpětné inženýrství (reverse engineering), Gnome, Herci, Linie, Počítáme ponorky, Rozejděte se!, Pražská spojka and Tokeny. Each has a statement, a specification of input and of output, and a sample input and sample output.

    The page links to a sample solution in C for each problem and in Pascal for seven of them, to an input and an output file for each problem, and to an archive ctu2000.tar.gz of 9.3 MB with the whole page, the sample solutions and the test inputs. Those linked files are not part of this page.
