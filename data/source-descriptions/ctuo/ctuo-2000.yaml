  problems: 8
  description: |-
    Category page of the Baekjoon Online Judge, in Korean, titled "CTU Open Contest, 2000" and placed under ICPC Regionals, Europe, Central European Regional Contest. It lists eight problems with Baekjoon problem numbers 9143 to 9150, labelled D, G, H, I, P, R, S, T and carrying the contest's Czech titles (Zpětné inženýrství, Gnome, Herci, Linie, Počítáme ponorky, Rozejděte se!, Pražská spojka, Tokeny). For each it gives an information column (entries source, multilingual, classification), the number of users who solved it, the number of submits and the accepted ratio. In our copy, 4 users solved the first problem in 14 submits and one submit was made to problem P; the others show none.

    The page gives names only. It has no statements; the rest of the page is the judge's navigation menus.
