  description: |-
    List of all 311 submits sent during the contest, numbered 1 to 311 in order of time. Each row gives the time of day (from 10.33.47 to 15.24.28), the team label with university code and the members, the problem name with the extension of the source file (.c, .p or .C) and the judge's outcome. The outcomes are accepted (48), rejected for wrong answer (143), time limit exceeded (79), runtime error (26), presentation error (8) and compile time error (5), plus one "already accepted" and one "rejected manually, wrong answer". The 311 rows come from 22 teams and cover the eight problems.

    Each row links to the source text of the submit, and an icon marks accepted rows.
