  copy: ctuo/ctuo-2000/website/2026-09-04-live-b5477c08
  title: CTU Open 2000 Contest in Prague
  language:
  - cs
  description: |-
    Website of the CTU Open 2000 programming contest in Prague, in Czech, with the Department of Computers (Katedra počítačů) of ČVUT FEL and the Czech ACM Chapter named on the problem page. The front page says the contest was held on 20 and 21 October 2000 and that the best teams advance to the Central European Regional Contest on 10 and 11 November, also in Prague. It links to the rules, the results list, the problem statements with sample solutions and test data, the list of all submits and the home directories of all teams.

    Our copy holds 146 files, 95 of them pages. They are the front page, the results page with a table of 22 teams and a table of submit statistics per problem, the page of eight problem statements with the archive ctu2000.tar.gz (9.3 MB) and the sample solutions, input and output files it links to, the list of 311 submits with the source text of 106 of them, and the page of team home directories, which lists 22 teams.

    The rules page and the 22 home directory archives are linked but are not in our copy.
