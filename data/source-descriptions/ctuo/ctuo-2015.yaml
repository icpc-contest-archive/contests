  description: |-
    Final scoreboard of the CTU Open 2015, headed "Scoreboard CTU Open 2015 final standings": 84 teams with rank, country flag, team name, institution, number solved and penalty time. The ten problems are columns named cheetahs, dive, fox, herrings, jump, lunch, owl, plankton, screen and train, each linking to its statement; a cell shows 1/205 style entries (tries and solve time), or a bare number of failed tries, or 0. First place is Ako šiel zelovoc do sveta of Comenius University with 10 problems.

    Cells are coloured for first solve, solved, tried incorrect and untried. Nine teams are marked in yellow as Unofficials, the others are Participants. A last summary row gives 84 teams, 12 affiliations and 2 countries, 217 solves in total, and submitted/correct counts per problem. Team names link to the teams' home folder archives, which are not in this copy.
