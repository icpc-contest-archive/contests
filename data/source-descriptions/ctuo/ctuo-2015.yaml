  contest_date: '2015-10-23'
  problems: 10
  description: |-
    Website of the CTU Open Contest 2015, mostly in Czech; the menu, the technical rules, the tourist information, the problems page, the scoreboard and the submissions list are in English. The front page says the contest ran on 23 and 24 October 2015 in Prague, Brno, Plzeň, Ostrava, Banská Bystrica, Bratislava, Žilina and Košice, and that the best teams go on to the Central European Regional Contest in Zagreb. Our copy holds 87 pages.

    The pages cover news, the schedule of the Prague part (registration and a trial round on Friday, the contest from 10:00 to 15:00 on Saturday, then presentation of solutions and results), fees (there are none), how to register a team, the venue in Prague, general and technical rules, links, sponsors and tourist information in English.

    Results and problem material are inside: the final scoreboard of 84 teams, a page of the ten problems with statements, input and output files and solution sources, the 37-page slide deck of solution discussions, and a list of 876 submissions with time, team, problem, language and result. The links to the photos and to the live ranking lead to other servers and are not part of our copy.
