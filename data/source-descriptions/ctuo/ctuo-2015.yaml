  language:
  - en
  teams: 84
  description: |-
    Standings of The 2015 CTU Open: 84 teams with rank, team, institution, solved, time, medal and citation, with up to 10 problems solved per team. Ranks run from 1 to 75, and eleven of them (1 to 9, 56 and 63) are held by two teams each. The first 21 rows (places 1 to 12) carry a Gold (8 rows), Silver (8) or Bronze (5) medal; rows for places 13 to 42 have an ordinal place as citation and no medal, and the last 33 rows (ranks 43 to 75) are marked Honorable Mention. There is no per-problem detail.

    The nine teams that the contest website's scoreboard shows as unofficial are in the same table without any mark.
