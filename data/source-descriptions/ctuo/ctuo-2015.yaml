    Baekjoon Online Judge category page "CTU Open Contest, 2015" in Korean, filed under the source ACM-ICPC Regionals, Europe, Central European Regional Contest. It lists ten problems, numbered 11456 to 11465 and lettered C, D, F, H, J, L, O, P, S and T, from Chasing the Cheetahs to Visitors' Train. Each row gives the title, flags such as special judge, links to the source and the original text, and the counts of accepted and submitted solutions with the acceptance ratio.

