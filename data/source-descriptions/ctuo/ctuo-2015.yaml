    Kattis problem-source page "Problems from CTU Open 2015": a table of nine problems, with columns Name, Fastest, Shortest, Authors, Full Solves, Ratio, Difficulty and Languages. Difficulty runs from 1.7 Easy (The Owl and the Fox) to 8.4 Hard (Visitors Train); every problem is listed in English. Lunch Menu, which the contest's own problem page lists, is not on this page.

