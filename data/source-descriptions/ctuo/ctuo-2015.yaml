  description: |-
    Slides of the solution discussion for the CTU Open 2015, a PDF of 37 pages in English. After the title slide, each of the ten problems has a title slide and one to seven slides, in the contest's problem order from Chasing the Cheetahs to Visitors' Train: the goal of the problem, the idea of the solution with its complexity, diagrams, and for some problems code snippets or an alternative solution. The last two slides are "Questions?" and a thank-you to the problem setters.
