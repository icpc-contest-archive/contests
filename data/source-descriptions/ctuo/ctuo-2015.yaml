  description: |-
    Problem page of the CTU Open Contest 2015, titled "Problems, inputs, outputs and oficial solutions": a table of ten problems, from Chasing the Cheetahs to Visitors' Train. Each row links to the judges' input and output files, the statement as PostScript and PDF, and the official solution in C and in Java. Below the table are links to the presentation of solutions and to an archive all.zip of 8.6 MB.

    The page is in English. Our copy holds the page only; the linked statements, data and solutions are not part of it.
