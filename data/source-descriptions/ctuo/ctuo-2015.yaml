- url: https://codeforces.com/gym/100829
  read: '2026-11-16'
  rubric: 1
  copy: ctuo/ctuo-2015/judge-codeforces/20261103-live-0fa8a98d/page.html
  title: 2015-2016 CTU Open Contest
  language:
  - en
  problems: 10
  description: |-
    Codeforces gym page "2015-2016 CTU Open Contest", marked Finished. The About text calls the contest a preparation for the CERC, held at CTU Prague and open to any Czech university, with the CERC rules except that the contest language is Czech. The problem table lists ten problems A to J, from Chasing the Cheetahs to Visitors' Train, with time limits from 1 to 12 seconds, a 256 MB memory limit and a count shown beside each problem. A note says some problem packages were not updated after the judging servers were upgraded and their time limits are doubled.

    The page also carries forms for asking questions and for posting announcements. A link to an English statements PDF leads outside our copy.
