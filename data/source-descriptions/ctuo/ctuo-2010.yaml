    Problem set page of the CTU Open 2010 with nine problems, listed by name: Arbitrage?, Bus Schedules, Bus Clock Display, Measuring Problem Difficulty, The Easiest Problem is This One, Prohibición de fumar, Pyramid Guards, Hack around the Lock and God Save the i-th Queen. Each row links to the input and output files, the statement in PostScript and in PDF, and sample solution source files (.c or .C, and .java). Hack around the Lock and Prohibición de fumar have no Java link, and three problems (Measuring Problem Difficulty, Prohibición de fumar, God Save the i-th Queen) also link a slow variant. Further links lead to an introduction (PostScript and PDF), the presentation of the solutions and an archive of everything (32.9 MB). The linked files are not held with this page; it holds the page only.
