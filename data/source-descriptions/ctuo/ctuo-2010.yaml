- url: https://contest.felk.cvut.cz/10prg/
  read: '2026-11-16'
  rubric: 1
  copy: ctuo/ctuo-2010/website/2026-09-03-wayback-be0cbc8a
  title: CTU Open 2010 Contest in Prague
  language:
  - cs
  contest_date: '2010-10-22'
  description: |-
    Website of the CTU Open Contest 2010, in Czech, run from the Czech Technical University in Prague. The front page says the contest was held on 22 and 23 October 2010 in Prague, Brno, Ostrava, Bratislava, Žilina and Košice, that the best teams can go on to the Central European Regional Contest in Wroclaw on 19 to 21 November, and that the regional contest is where teams compete for places in the World Finals, which take place in Sharm el-Sheikh, Egypt in February and March 2011. It links to the rank list with team home directories, the problem set with test data and sample solutions, the list of submitted solutions, the results of a participant survey, photos and press articles.

    Our copy holds seven distinct pages, kept as 18 files because several are saved more than once under different addresses: the front page, the final rank list (93 teams), the problem set page, the list of submitted solutions (695 rows, each with problem, time, team, language and outcome), a preliminary schedule for Friday 22 and Saturday 23 October, instructions for registering a team through the registration system, and a survey page that reports the answers of 86 participants. One of the test data files, for the problem Arbitrage?, is also saved. Images and style sheets are not in our copy; the problem statements and the team home directory archives that the pages link to are not either.
