  language:
  - en
  problems: 10
  description: |-
    Problem statements of the contest on one page, in English. The heading names the Czech ACM Student Chapter, the Department of Computer Science and Engineering of CTU in Prague, the Department of Computer Science of VŠB TU Ostrava (FEI) and the Department of Computer Science and Engineering of SUT Bratislava (FEI). An opening letter to the contestants, set around the NATO summit to be held in Prague, gives the general rules for input and output.

    There are ten problems: Sea Battle, The Die Is Cast, Defragmentation, Formatting Text, Hole Cutter, the maze game problem (M), Complicated Route, The Perfect Symmetry, Mysterious Villa and Too Much Water. Each has a statement with input and output specification; nine have a sample input and output in text, while the sample headings of Hole Cutter are empty, its sample being absent from the page. A table links for each problem to a solution in C and in Pascal, an input file, an output file and a PostScript file, and offers the whole set as all.tgz (4.14 MB) and an intro.ps. Another table names the contest each problem was taken from, for example SWERC 1998, NEERC 1998 and Mid Atlantic Regionals 2001; the maze problem is marked as an original problem of this contest.
