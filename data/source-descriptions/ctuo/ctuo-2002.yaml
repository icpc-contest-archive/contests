  description: |-
    Category page of the Baekjoon Online Judge, in Korean, titled "CTU Open Contest, 2002" and placed under ICPC Regionals, Europe, Central European Regional Contest. It lists ten problems with Baekjoon numbers 6687 to 6696, labelled B, C, D, F, H, M, R, S, V and W, with the contest's English titles. For each it gives an information column (entries source, multilingual and classification), the number of users who solved it, the number of submits and the accepted ratio. In our copy Too Much Water has 12 solvers in 13 submits, the maze game problem (M) 3 in 13, The Die Is Cast 1 in 7, and four problems have no submits.

    The page gives names only, with no statements; the rest is the judge's navigation menus.
