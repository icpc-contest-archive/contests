  contest_date: '2002-10-25'
  description: |-
    Website of the CTU Open 2002 programming contest, in Czech, with the problem statements in English. The front page says the contest was held on 25 and 26 October 2002 in Prague, Ostrava and Bratislava, that the best teams advance to the Central European Regional Contest in Warsaw on 15 to 17 November, and that the world finals follow the next year in Hollywood, California. It shows a "Sponsored by" row with links to HP, IBM and Sun, and links to the rules, the results list, the problems with test data and sample solutions, the list of submitted solutions, and the home directories of the contestants as they were at the end of the contest.

    Our copy holds 143 files, 71 of them pages: the front page, the results list of 32 teams, the page of ten problem statements with the archive all.tgz (4.14 MB) and the sample solutions, input and output files and PostScript files it links to, the list of 466 submits with the source text of 58 of them, and the home directories page, which lists 32 team archives.

    The rules page, the Central European Regional Contest link and the team home directory archives are linked but are not in our copy.
