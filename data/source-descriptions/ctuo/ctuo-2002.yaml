    Results list of the contest with 32 teams, in rank order: rank, team id with university and city (Prague, Bratislava, Ostrava, Plzeň, Liberec) and the members, a time, and a strip of ten positions in which each solved problem is shown as a small letter image linking to its statement and each unsolved position as a dash. There is no separate count of solved problems and no attempts or times per problem. The first team, Cteam27 of UK Praha, has 9 solved in 22:49:37; one team at the bottom has none solved and a time of 00:00:00.

    The page has no legend of its own beyond the strip.
