  description: |-
    Problem set of the 2004-2005 Asia Regional Programming Contest, Bombay site, as an HTML page stating that the contest was held on Monday December 6, 2004. It has seven problems A to G, in English: Cat And Mouse, School Lunch, Leftists and Rightists, Ambiguous Expressions, Seating Arrangement, A Game of Endurance and Temporary Variables. The page gives general rules (standard input and output, less than 60 seconds of CPU time) and, for each problem, a statement with input and output format and a sample input and output. No test data or solutions.
