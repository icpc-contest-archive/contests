  rubric: 1
  copy: bombay/bombay-2004/website/2026-10-20-wayback-061a8003
  title: ACM ICPC @ IIT Bombay - Home
  language:
  - en
  description: |-
    Website of the ACM ICPC Asia Regional site at IIT Bombay for the 2004-05 contest, hosted on the IIT Bombay computer science and engineering department's web server, in English. Our copy holds 63 pages, most of them pages of the 2004 edition: announcements, the regional and preliminary contest pages, contest details and rules, dates, local information and directions, people, an HTML problem set of seven problems, three preliminary problem pages, results, detailed results, and team lists for the preliminary round and the finals.

    The results page states that the finals were held on December 5-6, 2004 with 24 teams chosen from over 135 registered for the preliminary round, of which 18 were from India, 3 from China, 2 from Korea and 1 from Singapore, each given seven questions and five hours.

    24 of the pages belong to the 2003 edition's subsite, and three files are problem sets of earlier years. The blog, the photo gallery and the PDF of the 2004 problem set that the results page links to are not in our copy.
