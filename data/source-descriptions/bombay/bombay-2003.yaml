  copy: bombay/bombay-2003/website/2026-09-05-wayback-c16b7c74
  title: ACM ICPC @ IIT Bombay - Home
  language:
  - en
  description: |-
    Website of the ACM ICPC Asia Regional site at IIT Bombay, hosted on the IIT Bombay computer science and engineering department's web server, in English. Its home page announces the 2003 regional contest on December 6 and 7, 2003. Our copy holds 143 pages, of which 20 belong to the contest's own site: the home page, information pages (fees, accommodation, travel, visa), announcements, the preliminary contest page, a page of people, a page of 36 teams with institute, coach, contestants and reserves, final results, a problem summary, an index of the 2003 problem set, a photos page that only links to three albums, a page linking to problems of 1999 to 2002, and a problem set page and a blog for the 2004 contest.

    The final results page ranks 35 teams with the number of problems solved. The problem summary lists nine problems A to I with the number of correct submissions for each. The preliminary contest page reports 174 registrations on the ICPC site, 104 teams registering for the preliminary and 75 uploading solutions. The 2004 problem set page has seven problems A to G.

    The other pages in our copy belong to the department's general website and are not about the contest. The 2003 problem statements, the photo albums and the earlier-year problem files that these pages link to are not in our copy.
