  description: |-
    ICPC View Standings page of the 2003 ACM Asia Programming Contest - Bombay, sponsored by IBM, with two tables. The Final Round table has 36 rows: 35 teams with a place (ranks 1 to 30, with ties at 30) and one Honorable Mention. The Preliminary Site table has 126 rows: 34 teams with a place and 92 Honorable Mention rows. Each row gives the institution and team name, the citation (First Place, Second Place and so on) and, for the placed teams, a number without a column heading, 5 for the first-place team and 0 for the last placed ones; Honorable Mention rows have none. Shanghai Jiaotong University is first, Nanyang Technological University second, National University of Singapore third. No times or per-problem results.
