  description: |-
    Contest page for the 2016 Lethbridge Collegiate Programming Contest (LCPC) on the University of Lethbridge computer science web server, in English. It names the first three places of Division I and of Division II and links the final standings of both divisions and the results of 2015, 2014 and 2013.

    The rest of the page describes the contest: two divisions, prizes ($300, $150 and $75 in Division I; $200, $100 and $50 in Division II, for University of Lethbridge students only), C, C++ and Java, an individual three-hour contest on 24 September 2016 with a practice session at 11:00 and the contest from 12:00 to 15:00, registration closing on 22 September 2016, and practice links.

    Our copy is this one page with its style sheet and an image; the standings it links are separate files.
