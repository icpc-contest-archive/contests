  description: |-
    Contest page for the 2015 Lethbridge Collegiate Programming Contest (LCPC) on the University of Lethbridge computer science web server, in English. It names the first three places of Division I and of Division II and links the final standings of both divisions, each also in a version with guests.

    The rest of the page describes the contest: two divisions, prizes ($300, $150 and $75 in Division I; $200, $100 and $50 in Division II, for University of Lethbridge students only), C, C++ and Java, an individual three-hour contest on 10 October 2015 with a practice session at 11:00 and the contest from 12:00 to 15:00, registration closing on 7 October 2015, and practice links.

