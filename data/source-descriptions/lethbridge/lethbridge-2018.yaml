  description: |-
    Contest page for the 2018 Lethbridge Collegiate Programming Contest (LCPC) on the University of Lethbridge computer science web server, in English. It gives the date as 28 September 2018, names the first three places of Division I and of Division II, and links the final standings of both divisions.

    The rest of the page describes the contest: two divisions, prizes ($300, $150 and $75 in Division I; $200, $100 and $50 in Division II, for University of Lethbridge students only), C, C++ and Java, an individual three-hour contest, registration closing on 26 September 2018 at 6pm, and practice links. A sponsor logo is shown.

    Our copy is this one page with its style sheet and the logo image; the standings it links are separate files.
