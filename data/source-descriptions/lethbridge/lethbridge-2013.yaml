  description: |-
    Contest page of the 2013 Lethbridge Collegiate Programming Contest, on a University of Lethbridge computer science site. It shows a sponsor logo, the first three places in Division I and Division II, and links to the final standings of each division (with and without guests) and to the problem set PDFs of both divisions. The rest explains the contest: two divisions, Division I for experienced programmers and Division II for newcomers; prizes of 300, 150 and 75 dollars in Division I and 200, 100 and 50 dollars in Division II, for University of Lethbridge students only; C, C++ and Java with online references; an individual contest of five problems over three hours on 21 September 2013, with practice and lunch from 11:00, the contest from 12:00 to 15:00 and the prize ceremony afterwards; eligibility, registration until 17 September 2013, an information session on 12 September, and practice links.

    Our copy holds this one page with its style sheet, script and image; the linked standings and problem sets are separate documents.
