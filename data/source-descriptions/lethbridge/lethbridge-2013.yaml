  description: |-
    Problem set of Division I as a PDF of 12 pages in English. The cover names the contest, the date 21 September 2013 and the division, and lists five problems; page 2 reads 'This page is intentionally (almost) blank'. The problems are Penny Saver, Penny Loser, Warmer or Colder, Channel Surfing and Quaternions. Four have a statement with input and output sections and a sample; Warmer or Colder is interactive and has a section on interactive input and output, a sample interaction and notes on flushing output in C, C++ and Java. The statement of Penny Loser refers back to Penny Saver for its background and input. The cover lists Penny Loser as A and Penny Saver as B, while the statement pages are headed A: Penny Saver and B: Penny Loser. No test data or solutions.
