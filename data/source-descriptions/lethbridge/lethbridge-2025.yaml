  description: |-
    Final standings of the Lethbridge Collegiate Programming Contest, a DOMjudge scoreboard of 10 individual contestants, all from the University of Lethbridge. Columns are rank, a country flag, team (name and university), score (problems solved and penalty time), and problems A to H; each problem cell gives the solve time in minutes and the number of tries. A summary row at the bottom gives per-problem totals, and a legend explains the cell colours (solved first, solved, tried incorrect, untried). The top-ranked contestant solved 6 problems and the last-ranked solved none.
