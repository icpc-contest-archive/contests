  description: |-
    Website of the Lethbridge Collegiate Programming Contest (LCPC), hosted at the University of Lethbridge, in English. The front page gives the location (University Hall D519) and time (March 1, 12:00-3:00pm), a registration deadline of February 25, 2025, the contest results (first, second and third place and the top two new contestants), prize amounts ($300, $200 and $100, plus $50 each for two new contestants), eligibility and registration rules, the allowed programming languages (C, C++, Java, Python 3) and references, the contest format, and practice links.

    The contest is described as individual, three hours long, ranked by problems solved with ties broken by time. Prizes are limited to University of Lethbridge students. Our copy holds 2 pages: the front page and a scoreboard page. The registration form, the eligibility flowchart and the other links lead outside our copy.
