  contest_date: '2014-10-18'
  description: |-
    Contest page for the 2014 Lethbridge Collegiate Programming Contest on the University of Lethbridge computer science web server, in English. It names the first three places of Division I and of Division II, and links the final standings of both divisions (each also in a version with guests), the problem sets of both divisions as PDF files, and the 2013 results.

    The rest of the page describes the contest: two divisions, prize money for the first three places ($300, $150 and $75 in Division I; $200, $100 and $50 in Division II, for University of Lethbridge students only), C, C++ and Java as languages, an individual three-hour contest on 18 October 2014 with a practice session at 11:00 and the contest from 12:00 to 15:00, registration closing on 10 October 2014, and practice links.

    Our copy is this one page with its style sheet and script; the standings and problem sets it links are separate files.
