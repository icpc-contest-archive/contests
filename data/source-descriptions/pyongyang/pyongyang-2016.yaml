  pages: 1
  description: |-
    Single problem statement of 1 page, headed "7964 BN". Given an integer array A of length n and a number N, compute B_N, the sum of the products A_i1 * A_i2 * ... * A_ik over all index sequences whose indices add up to N, modulo 1,000,000,007; a worked example is given for B_3. The statement is in English with input and output sections and one sample input and output. The PDF prints no contest name, region or year, and no problem letter.
