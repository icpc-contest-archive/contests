    QOJ contest dashboard headed "The 2016 ACM-ICPC Asia Pyongyang Regional Contest", filed under ICPC / Regionals / Asia East Continent / The 2016 ACM-ICPC Asia East Regionals. It lists 12 problems by name only, numbered 1 to 12 rather than lettered, from "Array Inversion" to "Long Integer Factoring"; the second is given in TeX notation as "$B_N$". A side panel marks the contest as ended and gives the ICPC ruleset, a penalty of 20 minutes, a limit of 1000 submissions per problem and a scoreboard frozen after 4:00:00; under Attachments it links to statements in English and in Korean. The notice and questions tables are empty, and the standings and problem pages are links outside our copy.
