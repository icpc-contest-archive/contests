  description: |-
    Single problem statement of 1 page, headed "7974 Long Integer Factoring". Given N up to 10000, print two integers a and b, each greater than 1 and less than N^4 + 64, whose product is N^4 + 64; any solution is accepted. The statement is in English with input and output sections and one sample input and output. The PDF prints no contest name, region or year, and no problem letter.
