  copy: pyongyang/pyongyang-2016/website/2026-11-22-wayback-5533f30c
  title: 김일성종합대학이 제41차 국제대학생프로그람 아시아평양지역경연을 주최
  title_en: Kim Il Sung University hosts the 41st International Collegiate Programming Contest Asia Pyongyang Regional
  language:
  - ko
  description: |-
    News item in Korean on the website of Kim Il Sung University, the host, dated 2016-11-12 and headed 김일성종합대학이 제41차 국제대학생프로그람 아시아평양지역경연을 주최 ("Kim Il Sung University hosts the 41st International Collegiate Programming Contest Asia Pyongyang Regional"). It says the contest was held at the university on 9 and 10 November, that more than 120 students from 28 universities across the country competed in 42 teams, that the university set the problems, presented in a foreign language, and developed its own judging system, and that medals and cups were awarded. Kim Il Sung University placed first, solving all problems, with Kim Chaek University of Technology second and the University of Sciences third.

    The news item ends with links to the problem set in Korean and in English (PDF files) and to the results as an image; none of these, nor the page's images and style sheets, is in our copy, which holds this one page.
