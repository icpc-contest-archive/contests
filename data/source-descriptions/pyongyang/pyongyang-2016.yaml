  description: |-
    Scoreboard as an image (a PNG of 1366 by 2507 pixels), in Korean script with Latin team codes. It has 41 team rows. Each row gives a rank, a team code such as RNS_1, KUT_1 or REDSTAR_1, the university's name in Korean (with a group number for universities that entered several teams), twelve problem cells numbered 1 to 12, and a total in minutes (marked with the Korean 분). Thirty-six teams carry ordinal ranks from 1st to 36th; the five RNS teams carry an asterisk instead of a rank. A coloured bar at the left groups the rows by number of problems solved, from 9 down to 1.

    A green problem cell shows the solving time in minutes and, when there were earlier rejected runs, a plus number of extra attempts; a red hatched cell shows a minus number of failed attempts; a grey cell is untried. The image has no title, no header row and no contest name, so nothing in it states which contest or year it shows.
