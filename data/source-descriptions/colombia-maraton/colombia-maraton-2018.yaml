    Contest page of the UVa Online Judge for the 2018 Colombian programming marathon (Maratón Colombiana de Programación), dated September 15th, 2018. It holds a table of eleven problems, A to K, from All-star Three-point Contest to kewl Texting, each with a link to a PDF statement, and a link to download all statements as a single file.

    Only the page itself is in our copy; the PDFs it links to are not.
