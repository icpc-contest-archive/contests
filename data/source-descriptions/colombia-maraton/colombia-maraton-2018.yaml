  description: |-
    Twenty-three files from the ACIS (Asociación Colombiana de Sistemas) website, none of them a page about the XXXII Colombian national marathon. The first is a one-page letter of 5 March 2018 from the Organización de Maratones de Programación – Colombia, in Spanish, clarifying a statement in an earlier communiqué about one person. The others are a results page headed XXXIII Maratón Nacional de Programación ACIS REDIS 2019 (a scoreboard of 119 ranked teams against problems A to K, with attempts and solution times), a BOCA scoreboard page headed ICPC LATAM 2018 Scoreboard with problems A to M, a news item and a template for journal articles from ACIS, an 89-page PDF of conference slides on Raspberry Pi and Arduino, and 17 further PDFs that do not open: nine are cut off at 1 MiB and eight ask for a password.

    The BOCA scoreboard page is cut off at 1 MiB in our copy, partway through its table.
