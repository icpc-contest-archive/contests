    Front page and listing pages of Economía y Mercados, a Spanish-language Colombian technology news magazine. The front page (Portada) shows news items dated October 2021 and a menu of sections: Hardware, Software, Soluciones, Telecomunicaciones, Canal, Nombramientos, Opinión, product evaluation, news and editorial, with links to pages about the magazine itself and its publication rules. The section listings include articles dated 2010.

