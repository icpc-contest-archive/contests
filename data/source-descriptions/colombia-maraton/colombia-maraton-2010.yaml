  description: |-
    Problem set page of the XXIV Maratón Nacional de Programación Colombia, dated September 18, 2010, signed by the ACM Valladolid On-line Judge team, in English. The page opens with a list of what the participants should know: the judge is a Pentium 4 1.6 computer, the HTML views can be replaced by the PDF files, pi is to be taken as 2*acos(0), clarifications are sent by e-mail and replies may also go on a clarification board, and programs read standard input and write standard output.

    The table lists eight problems, A to H: Y-game, Flatland, Guessing Game, The Melding Plague, Preferential Romance, Finding Seats Again, Cut the Silver Bar and Cargo Trains. Each row has a PDF link, and a further link offers the whole problem set as one PDF. Our copy holds only the page and its banner image: the statements and the PDF are not part of it.
