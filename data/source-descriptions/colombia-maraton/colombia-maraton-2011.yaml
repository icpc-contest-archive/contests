    Contest page of the Valladolid On-line Judge for the XXV Colombian national programming marathon (ACIS / REDIS, ACM ICPC Colombia), dated October 8, 2011. It gives a few notes for contestants (the judge machine, the value of pi, input and output through standard streams, clarifications by e-mail and on a clarification board), then a table of ten problems, A to J, from The Starflyer Agents to Philip J. Fry Problem.

