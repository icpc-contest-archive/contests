  description: |-
    Website of the XXXVIII Maratón Nacional de Programación ACIS/REDIS 2024, run by ACIS/REDIS, in Spanish. Our copy holds two pages: the home page and a second page, Maratón Nacional 2024, with the same announcement. They give the date, 19 October 2024; the six host sites (Bogotá, Bucaramanga, Cali, Medellín, Manizales and Barranquilla, each with a host university); the schedule of the day from local registration at 8:00 to the end of the contest at 6:00 pm; team rules (a coach and three students); the registration steps; and a table of registration prices with early registration until September 20 and regular registration until October 5. The page says the national marathon qualifies teams for the Latin American regional.

    Both pages link to a final results page, a communiqué, a live video stream, a photo gallery and a page of earlier marathons; the second page also has a section with a link to the problems. The results page and the page of earlier marathons are not in our copy. The home page also carries many template placeholder blocks reading Título de ejemplo and Texto de ejemplo, and our copy holds a large number of images.
