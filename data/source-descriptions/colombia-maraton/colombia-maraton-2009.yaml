  description: |-
    Problem set page of the XXIII Maratón Nacional de Programación Colombia, dated September 5, 2009, signed by the ACM Valladolid On-line Judge team, in English. The page opens with a list of what the participants should know: the judge is a Pentium 4 1.6 computer, the HTML views can be replaced by the PDF files, pi is to be taken as 2*acos(0), clarifications are sent by e-mail and replies may also go on a clarification board, and programs read standard input and write standard output.

    The table lists ten problems, A to J: Message in the Enemy Territory, Rational Billiard, Best Coalitions, Informants, Look-and-Say sequences, Burger Time?, Triangular Grid, GrayInc, Langton's Ant and Chinese Ink. Each title links to an HTML statement and each row has a PDF link; a further link offers all PDF statements as one zip file. Our copy holds only the page and its banner image: the statements and the zip are not part of it.
