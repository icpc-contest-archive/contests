  description: |-
    Contest page of the Valladolid On-line Judge for the XXVI Colombian national programming marathon (ACIS / REDIS, ACM ICPC Colombia), dated October 20, 2012. It gives notes for contestants (the judge machine, the value of pi, standard input and output, clarifications by e-mail and on a clarification board) and a table of ten problems, A to J, from Cookie to Lazy Professor.

    Each problem links to an HTML statement and a PDF, and one link leads to a PDF of the whole problem set. Only the page itself is in our copy; the statements it links to are not.
