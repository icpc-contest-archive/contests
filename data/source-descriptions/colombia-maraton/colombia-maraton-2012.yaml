  description: |-
    Event page on the website of the Systems and Computing Engineering department of Universidad de los Andes (Uniandes), in Spanish, announcing the XXVI Maratón Nacional de Programación ACIS REDIS 2012 on 20 October 2012. It names the sites (Barranquilla, Bogotá, Bucaramanga, Cali, Manizales, Medellín), says the Bogotá site competes at Uniandes and that the organisation is run from Uniandes with ACIS and ACM-ICPC, states that five Uniandes teams are registered, and says the marathon gathers about 100 teams and qualifies for the Latin American regional marathon of 10 November.

    Our copy holds this one page, with the department's navigation menu around the text. It has no results, team list or problems.
