  description: |-
    Final results page of the XXXI Colombian national programming marathon on the website of ACIS (Asociación Colombiana de Sistemas), in Spanish: a scoreboard of 122 teams against problems A to K. Each row gives the rank, the site (six site codes), the institution, the team and, per problem, attempts and the minute of the solution (for example 1/73), with a dash instead of a minute for attempts that did not solve it, then the total solved with total time in parentheses. A legend at the top explains the notation.

    118 teams are ranked: 35 solved at least one problem (the winner solved six, with a total of 860) and 83 solved none and share rank 36. Four more teams are listed at the end marked D, disqualified for not appearing complete, with no results.

    Our copy is the page alone, without its style sheets or images.
