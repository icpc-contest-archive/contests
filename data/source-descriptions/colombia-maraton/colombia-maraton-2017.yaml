  description: |-
    Contest page of the Valladolid On-line Judge for the national programming marathon of ACIS / REDIS, ACM ICPC Colombia, 2017. The title reads XXXI and the heading reads XXX, and the page gives no date. It carries notes for contestants (the judge runs in a virtual environment in the cloud, the value of pi, standard input and output, clarifications by e-mail and on a clarification board) and a table of eleven problems, A to K, from A Contest to Meet to Soccer Championship.

    Each problem has a link to a PDF, and one link leads to a PDF of the whole problem set. Only the page itself is in our copy; the statements it links to are not.
