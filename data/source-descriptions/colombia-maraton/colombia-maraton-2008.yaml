  description: |-
    Problem set page of the XXII Maratón Nacional de Programación Colombia, dated October 1, 2008, signed by the ACM Valladolid On-line Judge team, in English. The page opens with a list of what the participants should know: the judge is a Pentium 4 1.6 computer, the HTML views can be replaced by the PDF files, pi is to be taken as 2*acos(0), clarifications are sent by e-mail and replies may also go on a clarification board, and programs read standard input and write standard output.

    The problem list has nine entries, each a link to a statement: A Angry Programmer, B Bender B. Rodríguez Problem, C Life on Mars?, D Touring Robot and E Erdös Unit Fractions, followed by a second group labelled B Frieze Patterns, C GATTACA, D 9 Puzzle and E Batman. A link offers all the PDF statements as one zip file. Our copy holds only the page and its banner image: the statements and the zip are not part of it.
