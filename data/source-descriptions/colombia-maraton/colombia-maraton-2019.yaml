  description: |-
    Results page of the XXXIII Colombian national programming marathon (ACIS / REDIS) on the ACIS website, in Spanish: a scoreboard of 119 teams from 49 institutions against problems A to K. Each row gives the rank, the site (six site codes), the institution, the team, the number of problems solved (NP), the total time (TT) and, per problem, attempts and the minute of the solution (for example 1/176), with a dash instead of a minute for attempts that did not solve it. A legend at the top explains the notation and states a penalty of 20*(x-1) minutes for a problem solved after x attempts.

    Ranks 1 to 93 are teams with at least one problem solved (the winner solved seven, with a total time of 824); the 26 teams that solved none share rank 94.
