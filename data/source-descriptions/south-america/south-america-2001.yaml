  description: |-
    Information page of the 2001 ACM South America Programming Contest, sponsored by IBM. It names the host universities by country (Buenos Aires in Argentina; Natal, Caxias do Sul and Campinas in Brazil; Punta Arenas in Chile; Margarita in Venezuela), gives the contest dates as 9 - 10 November 2001, and says that winners of regional contests advance to the World Finals in Honolulu. Links lead to the team roster, the standings and the problems.

    Our copy holds 2 pages: this page and the problems PDF it links to. The pages behind the roster and standings links are not part of our copy.
