    Problem set of the contest session as a PDF of 12 pages. The cover names the ACM South American Regional Collegiate Programming Contest, Contest Session, 10 November 2001, with the six sites Buenos Aires, Natal, Caxias do Sul, Campinas, Punta Arenas and Margarita. Six problems follow, numbered 1 to 6 and written in English: Gene Assembly, Genetic Combinations, Palindrom Numbers, Robotic Jigsaw, Direct Subtraction and Points Within. Each gives source, input and output file names, a statement, input and output formats and a sample. No test data or solutions.

