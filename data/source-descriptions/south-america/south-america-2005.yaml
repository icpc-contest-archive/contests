  description: |-
    Final standings of the 2005 ACM-ICPC South America Contest outside Brazil, sponsored by IBM: 132 teams, each with rank, institution and team name, a citation, number of problems solved and total time. The first 19 places carry a citation such as South America-South champion, South America-North champion or a place name; the next 108 teams carry the citation Honorable mention and share ranks by number of problems solved (41 teams at rank 20, 22 at rank 61, 31 at rank 83 and 14 at rank 114), and five teams at the end are marked No show with zero solved. The first team listed solved seven problems in 692 minutes. There is no per-problem detail and no number of attempts.
