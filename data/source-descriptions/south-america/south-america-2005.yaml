    Problem set of the 2005 South American regional as handed out to the contest sites: a PDF of 18 pages in English. The cover shows the ACM International Collegiate Programming Contest 2005 logo with the words event sponsor, the dates November 11-12, 2005 and the six contest sites (Argentina, Brazil, Chile, Colombia, Peru, Venezuela), and says the set contains nine problems. Problems A to I follow, from A Tornado! to I Light Up, each with a statement, input and output format, the source file names to use and a sample input and output. No test data or solutions are in the file.
