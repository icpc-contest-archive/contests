  title: 2005 ACM-Regional South American Contest
  language:
  - en
  contest_date: '2005-11-12'
  description: |-
    Website of the 2005 ACM South American regional contest, held at six sites (Argentina, Brazil, Chile, Colombia, Peru, Venezuela), in English. The front page carries news items, general information, the regional rules, the rules for advancement to the 2006 World Finals, registration, links to the scoreboards of the individual sites, and a final report of 15 November 2005 on the contest, the preliminary rounds in Brazil and Colombia, and thanks to the organisers. It states that the contest was split in two, one inside Brazil and one outside Brazil, and gives the dates as Nov. 11-12, 2005 and sets the start times of the sites for Nov. 12.

    Our copy holds seven files from the site: the front page, a one-page eligibility decision diagram dated 24 July 2005, the merged final scoreboard of all six sites, the PDF problem set of the Nov. 12 contest, the PDF problem set of the Brazilian preliminary contest, and two zip archives of data sets (18 files of input and expected output for the nine problems of the Nov. 12 contest, and one file for the Brazilian preliminary contest). The links to the scoreboards and web pages of the individual sites lead to other servers and are not part of our copy.
