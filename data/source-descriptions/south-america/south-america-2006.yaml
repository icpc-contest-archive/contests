  description: |-
    Category page of the Baekjoon Online Judge for the 2006 South America regional, in Korean: a table of ten entries with problem number, letter, title, solved count, submission count and acceptance ratio. Nine entries carry the letters A to I and one the letter PA. All ten are marked as deleted, have no title and no submissions, so the page gives no problem names or statements.
