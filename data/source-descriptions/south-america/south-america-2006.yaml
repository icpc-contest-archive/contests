  copy: south-america/south-america-2006/website/2026-10-20-wayback-affbfb6c
  title: 2006 ACM-Regional South American Contest
  language:
  - en
  description: |-
    Website of the 2006 ACM South American regional contest, in English, covering the seven sites of the contest (Argentina, Bolivia, Brazil, Chile, Colombia, Peru, Venezuela) and giving the dates as Nov. 10-11, 2006. A single page with news items, general information, the regional rules, the rules for allocating World Finals slots for 2007, registration, links to the scoreboards of the sites, and a short final report. The report says South America had 326 teams from 170 schools and points to the ICPC regional report for the standings. The contest was split into one inside and one outside Brazil.

    Our copy holds the front page, the PDF problem set (20 pages, nine problems) and a zip archive of nine input files, one per problem, named as test sets. The scoreboard and site links lead to other servers and are not part of our copy.
