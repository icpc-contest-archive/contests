  description: |-
    Problem set of the 2006 South American regional contests as handed out to the sites: a PDF of 20 pages in English. The cover shows the ACM International Collegiate Programming Contest 2006 logo with the words event sponsor, the dates November 10-11, 2006 and the seven countries hosting simultaneous contests (Argentina, Bolivia, Brazil, Chile, Colombia, Peru, Venezuela), and says the set contains nine problems. Problems A to I follow, from A Weekend Lottery to I Turkish Roulette, each with a statement, input and output format, the source file names to use and a sample input and output. No test data or solutions are in the file.
