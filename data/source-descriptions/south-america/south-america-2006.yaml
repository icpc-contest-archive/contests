  read: '2026-11-16'
  rubric: 1
  copy: south-america/south-america-2006/standings/2026-09-01-wayback-b9d1af50/page.html
  title: View Standings - The 2006 ACM-ICPC South America Contest outside Brazil sponsored by IBM
  language:
  - en
  teams: 152
  description: |-
    Final standings of the 2006 ACM-ICPC South America Contest outside Brazil, sponsored by IBM: 152 teams with institution and team name, rank, a citation, number of problems solved and total time. The first team listed solved eight problems; the next two ranks are named South America South and North region champions and the places below them are written out (Third Place and so on) down to rank 80, with no citation for the teams ranked 81 and below. 37 teams solved no problem. The last row is one team marked Honorable Mention with no rank, solved count or time. There is no per-problem detail and no number of attempts.
