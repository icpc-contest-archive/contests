  copy: south-america/south-america-2007/website/2026-10-20-wayback-56972554
  title: 2007 ACM-Regional South American Contest
  language:
  - en
  description: |-
    Website of the 2007 ACM South American Programming Contest, in English, hosted on the Institute of Computing of the University of Campinas (Unicamp) server. The home page, last updated 6 December 2007, is a single long page headed "The 2007 ACM South American Programming Contest, Nov. 9-10, 2007". It holds news items dated 1, 2 and 6 December about the number of World Finals slots for South America (eight) and the final list of advancing teams; general information on the seven sites (Argentina, Bolivia, Brazil, Chile, Colombia, Peru, Venezuela) and the tiered contests in Brazil and Colombia; the regional rules and the rule for distributing finals slots among the South, North and Brazil regions; a registration note; links to the scoreboards; and a short final report.

    Ten pages belong to the contest site: the home page, six scoreboards (Argentina, Bolivia, Chile, Peru, Colombia and Venezuela together, Brazil), a unified scoreboard for the whole contest, and the warm-up and contest problem sets as PDFs. The two zip archives of data sets linked from the home page are not in our copy. Our copy has 109 pages in all; apart from those above, most of them are pages of the Institute of Computing's general site, which have nothing to do with the contest.
