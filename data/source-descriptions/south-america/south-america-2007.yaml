  description: |-
    Standings page for the South America Contest outside Brazil: 180 teams with rank, team (university followed by team name), citation, number of problems solved and time. Ranks run only from 1 to 8 and tied teams share a place: 133 teams solved at least one problem and 47 solved none, all of the latter in eighth place. The citation column gives the regional champion and vice-champion and the North Region champion and vice-champion, and otherwise the place (Third Place to Eighth Place). The first row is a team from Universidad Nacional de Cordoba with 8 problems solved. There are no per-problem results and no attempt counts.
