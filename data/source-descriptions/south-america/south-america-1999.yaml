  - en
  contest_date: '1999-11-13'
  description: |-
    Website of the 1999 ACM South American Regional Programming Contest, in English. The front page welcomes the contest of 13 November, held at five simultaneous sites (Argentina, Rio de Janeiro, Recife, Chile, Venezuela), and names the two universities advancing to the 2000 World Finals in Orlando. Our copy holds four pages: the front page, an About page (the ICPC in general, the five sites, how teams advance to the Finals), a Rules page (team composition, eligibility, registration dates, a contest of 6 to 8 problems in 5 hours) and a second index page.

    That second index page is the 2002 edition's front page (contest dates 8-9 November 2002, seven sites) and does not belong to 1999. The links to the results, the problems and the five site pages lead to documents that are not in our copy, and two small images are included.
