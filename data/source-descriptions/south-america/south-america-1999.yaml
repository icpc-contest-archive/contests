  description: |-
    Problem set: a PDF of 17 pages with a cover naming the ACM South American Regional Collegiate Programming Contest, contest session of 13 November 1999, and the five sites Buenos Aires, Recife, Rio de Janeiro, Talca and Maracaibo. It holds seven problems numbered 1 to 7: Burrows Wheeler Decoder, Domino Game, The MTM Machine, Triangular Museum, Numeric Puzzles Again!, Polygon Visibility and Grid Soccer. Each has its source and input file names, a statement in English and a sample input and output. No test data or solutions.

    The text layer of our copy is unreadable because of its fonts; the content was read from the page images.
