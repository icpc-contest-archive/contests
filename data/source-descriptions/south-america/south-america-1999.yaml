  teams: 58
  description: |-
    Overall results of the 1999 ACM South American Regional Programming Contest: 58 teams, each with rank, team name and country, problems solved and time penalty. USB (Venezuela) is first with 4 problems and 545 minutes of penalty, ahead of UBA 1 and UBA 2 (Argentina). Teams with the same score share a rank; 17 teams that solved nothing share rank 42. Teams come from Argentina, Brazil, Chile, Colombia, Cuba, Peru and Venezuela. The page is dated 15 November 1999 and links to a results-by-site page that is not in our copy. There is no per-problem detail and no attempt counts.
