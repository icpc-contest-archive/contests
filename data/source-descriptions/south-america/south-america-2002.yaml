  language:
  - en
  problems: 1
  pages: 1
  description: |-
    Problem 2612, 'This Sentence is False', as a one-page statement PDF with the region line 'Latin America - South America - 2002/2003'. A document is a set of up to 1000 sentences of the form 'Sentence X is true/false'; the task is to print the largest number of sentences that can be true in a valid truth assignment, or 'Inconsistent'. The statement has input and output formats and a sample with three documents. No problem letter is printed. The statement ends with the line 'South America 2002-2003'.
