  problems: 1
  pages: 2
  description: |-
    Problem 2615, 'Not Too Convex Hull', as a two-page statement PDF with the region line 'Latin America - South America - 2002/2003'. Given nails on a plank, one of them the origin, and B rubber bands that must wrap all nails in non-overlapping convex polygons touching at the origin, the task is to print the smallest total enclosed area to two decimals. The statement has a figure, input and output formats, and a sample with two games. No problem letter is printed. The statement ends with the line 'South America 2002-2003'.
