  language:
  - en
  problems: 1
  pages: 2
  description: |-
    Problem 2618, 'Supermarket', as a two-page statement PDF with the region line 'Latin America - South America - 2002/2003'. A shopper must buy the items of a list in order while walking once through the supermarket's products in a fixed sequence; given up to 100000 products with prices, the task is to print the least total cost, or the word impossible. The statement has a figure of an example, input and output formats, and a sample with three shopping sessions. No problem letter is printed. The statement ends with the line 'South America 2002-2003'.
