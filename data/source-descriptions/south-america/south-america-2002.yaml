  title: 2614 - Duty Free Shop
  language:
  - en
  problems: 1
  pages: 2
  description: |-
    Problem 2614, 'Duty Free Shop', as a two-page statement PDF with the region line 'Latin America - South America - 2002/2003'. Two bags of chocolates of different brands must be distributed into boxes of given capacities so that each used box is full and holds one brand only; the task is to print the number and list of boxes for the first brand, or 'Impossible to distribute'. The statement has input and output formats and a sample with two instances. No problem letter is printed. The statement ends with the line 'South America 2002-2003'.
