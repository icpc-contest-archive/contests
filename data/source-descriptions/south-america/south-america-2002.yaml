  problems: 1
  pages: 3
  description: |-
    Problem 2616, 'I hate SPAM, but some people love it', as a three-page statement PDF with the region line 'Latin America - South America - 2002/2003'. Given a group of up to 20 people, who knows whose address, and chain messages with two thresholds and three attributes each, the task is to print, for every person, the attributes acquired from the messages forwarded. The statement has input and output formats and a sample. No problem letter is printed. The statement ends with the line 'South America 2002-2003'.
