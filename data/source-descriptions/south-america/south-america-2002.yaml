  description: |-
    Final standings of the 2002 ACM South American Regional Programming Contest, headed as published 18 Nov 2002 with minor revisions on 19 Nov, with a notice to read the interpretation page before using the table. It lists 179 team rows with rank, team name followed by its site, number of problems solved and penalty; the sites are saopaulo-usp, saopaulo-puc, portoalegre, recife, caracas, buenosaires, copiapo and barquisimeto. A row of asterisks divides the table after rank 8: above it several teams share each rank, four of them rank 1, and below it ranks 9, 10 and 11 correspond to 2, 1 and 0 problems solved. There are no per-problem columns.
