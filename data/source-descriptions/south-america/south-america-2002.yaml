  title: 2617 - Noise Effect
  language:
  - en
  problems: 1
  pages: 2
  description: |-
    Problem 2617, 'Noise Effect', as a two-page statement PDF with the region line 'Latin America - South America - 2002/2003'. Given a standard gray-scale image of a square token and a noisy scanned image, each up to 400 by 400 pixels, the task is to find over all placements of the token the highest percentage of pixels whose values differ by 100 or less, printed to two decimals. The statement has a figure, input and output formats, and a sample. No problem letter is printed. The statement ends with the line 'South America 2002-2003'.
