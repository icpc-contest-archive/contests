  title: 2613 - Will Indiana Jones Get There?
  language:
  - en
  problems: 1
  pages: 2
  description: |-
    Problem 2613, 'Will Indiana Jones Get There?', as a two-page statement PDF with the region line 'Latin America - South America - 2002/2003'. Given up to 1000 wall sections of a ruined city, the task is to find the minimum length of the wooden board needed to get from the first section to the second, printed to two decimals. The statement has a figure of a city map, input and output formats, and a sample with two cases. No problem letter is printed. The statement ends with the line 'South America 2002-2003'.
