  title: 2611 - Grandpa's Rubik Cube
  language:
  - en
  problems: 1
  pages: 3
  description: |-
    Problem 2611, 'Grandpa's Rubik Cube', as a three-page statement PDF with the region line 'Latin America - South America - 2002/2003'. Given a scrambled Rubik's cube drawn as a net and a list of face rotations, the task is to print 'Yes, grandpa!' if the rotations lead to a solved cube and 'No, you are wrong!' otherwise. The statement has figures of the cube and its rotations, input and output formats, and a sample with three tests. No problem letter is printed. The statement ends with the line 'South America 2002-2003'.
