  title: South America - ACM Programming Contest
  language:
  - en
  description: |-
    Website of the 2002 ACM South American Regional Programming Contest, in English. The front page gives the contest date as Nov 8-9, 2002, says that 7 sites will hold simultaneous contests to select teams for the 2002 World Finals, and links to a final report, to files of the problems and data sets, and to the contacts or pages of the sites in Argentina, Brazil (three sites), Chile and Venezuela (two sites).

    Our copy holds 10 addresses that make four distinct pages, each stored under two addresses, and two images: the front page; the rules page (mission, conditions for participating, team composition, complaints and appeals, important dates, advancement to the World Finals, contest procedures, contacts); an interpretation of results page, an account of the contest and of how teams were ranked; and the results page with the final standings. The problems and data set archives are linked but are not in our copy.
