  description: |-
    Final standings page headed 'The 2002 ACM South American Regional Programming Contest', with the note 'Final results - published 18 Nov 2002, minor revisions in 19 Nov' and a request to read a linked note on interpreting the table first. The table lists 179 teams with rank, team name and site, number of problems solved and penalty. Teams come from eight sites named in the Name - Site column: saopaulo-usp, saopaulo-puc, portoalegre, recife, caracas, buenosaires, copiapó and barquisimeto. Ranks run from 1 to 11 and are shared by many teams; a line of asterisks after the 23 teams ranked 1 to 8 separates them from the rest. The top team solved 5 problems with a penalty of 767. 88 teams solved nothing and are listed with 0 and 0. There is no per-problem detail. The linked interpretation note is not in our copy.
