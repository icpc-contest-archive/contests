  read: '2026-11-23'
  rubric: 1
  copy: south-america/south-america-2003/judge-livearchive/20150309-wayback-7e340c8d/2885.pdf
  title: 2885 - Kryptonite Mine
  language:
  - en
  problems: 1
  pages: 2
  description: |-
    Single-problem statement PDF of 2 pages, headed "2885 - Kryptonite Mine" and the region line "Latin America - South America - 2003/2004", in English. The statement describes a maze-like mine with walls and teleporter booths that can be used only a limited number of times and only with a clear line of sight, and asks for the shortest walking distance to the exit, rounded to the nearest integer; a figure shows the map of the mine. It has input and output sections and ends with a sample input and sample output.
- url: https://icpcarchive.ecs.baylor.edu/external/28/2886.pdf
  read: '2026-11-23'
  rubric: 1
  copy: south-america/south-america-2003/judge-livearchive/20150309-wayback-a757bd22/2886.pdf
  title: 2886 - X-Mart
  language:
  - en
  problems: 1
  pages: 2
  description: |-
    Single-problem statement PDF of 2 pages, headed "2886 - X-Mart" and the region line "Latin America - South America - 2003/2004", in English. The statement describes a poll in which each customer votes to keep at most two products and to withdraw at most two, and asks whether a list of kept products exists that pleases every customer, answered yes or no for each test case. It has input and output sections and ends with a sample input and sample output.
- url: https://icpcarchive.ecs.baylor.edu/external/28/2887.pdf
  read: '2026-11-23'
  rubric: 1
  copy: south-america/south-america-2003/judge-livearchive/20150309-wayback-63aff542/2887.pdf
  title: 2887 - Telecommunication Partners
  language:
  - en
  problems: 1
  pages: 2
  description: |-
    Single-problem statement PDF of 2 pages, headed "2887 - Telecommunication Partners" and the region line "Latin America - South America - 2003/2004", in English. The statement asks for the size of the largest set of companies in which each company has at least K business partners that are also in the set, given pairs of companies that called each other. It has input and output sections and ends with a sample input and sample output.
- url: https://icpcarchive.ecs.baylor.edu/external/28/2888.pdf
  read: '2026-11-23'
  rubric: 1
  copy: south-america/south-america-2003/judge-livearchive/20150309-wayback-dc75241f/2888.pdf
  title: 2888 - Child Play
  language:
  - en
  problems: 1
  pages: 2
  description: |-
    Single-problem statement PDF of 2 pages, headed "2888 - Child Play" and the region line "Latin America - South America - 2003/2004", in English. The statement describes domino-like slabs with a value on each half, shown in a figure, and asks for an arrangement in which the sums of the upper and lower values are equal, discarding at most one slab if needed so that the sum is highest; the output gives the sum and the discarded slab, or the word impossible. It has input and output sections and ends with a sample input and sample output.
