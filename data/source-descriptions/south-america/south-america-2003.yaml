  description: |-
    Standings produced by PC² for one region of the contest: 18 teams, listed by rank, name, number solved and score. Ten teams are ranked; the first three solved four problems each, and the top team is Uni de Palermo - Depto Exactas with a score of 417. Eight more teams are listed without rank under Honorable Mention, and a small table headed Region and Champion shows Lower Division and Upper Division both as TIE. No per-problem results. The page does not name the region; the front page of the contest website links it as the Argentina results.
