  title: 2881 - Dice
  language:
  - en
  problems: 1
  pages: 2
  description: |-
    Single-problem statement PDF of 2 pages, headed "2881 - Dice" and the region line "Latin America - South America - 2003/2004", in English. The statement describes a board game in which players roll a pair of dice and move along a trail of squares with exactly three traps, where landing on a trap loses the next round (a figure of a 48-square board is referred to), and asks for the number of the winning player in each test case. It has input and output sections and ends with a sample input and sample output.
- url: https://icpcarchive.ecs.baylor.edu/external/28/2882.pdf
  read: '2026-11-23'
  rubric: 1
  copy: south-america/south-america-2003/judge-livearchive/20150309-wayback-aa8c2f9a/2882.pdf
  title: 2882 - Secure Region
  language:
  - en
  problems: 1
  pages: 2
  description: |-
    Single-problem statement PDF of 2 pages, headed "2882 - Secure Region" and the region line "Latin America - South America - 2003/2004", in English. The statement asks, given a rectangular mined field and the positions of the mines, for the sides A and B (A at most B) of the mine-free axis-parallel rectangle whose smaller side is as large as possible and, among those, whose larger side is largest. It has input and output sections and ends with a sample input and sample output.
- url: https://icpcarchive.ecs.baylor.edu/external/28/2883.pdf
  read: '2026-11-23'
  rubric: 1
  copy: south-america/south-america-2003/judge-livearchive/20140331-wayback-1aa2b56d/2883.pdf
  title: 2883 - Runner Pawns
  language:
  - en
  problems: 1
  pages: 2
  description: |-
    Single-problem statement PDF of 2 pages, headed "2883 - Runner Pawns" and the region line "Latin America - South America - 2003/2004", in English. The statement describes a one-player chess variant on an 8 by 8 board with a horse and pawns that all move one square forward at once, with figures of horse moves and the square numbering, and asks for the minimum number of horse moves that capture all pawns, or the word impossible. It has input and output sections and ends with a sample input and sample output.
- url: https://icpcarchive.ecs.baylor.edu/external/28/2884.pdf
  read: '2026-11-23'
  rubric: 1
  copy: south-america/south-america-2003/judge-livearchive/20150309-wayback-85dc5c8f/2884.pdf
  title: 2884 - The Splitting Club
  language:
  - en
  problems: 1
  pages: 2
  description: |-
    Single-problem statement PDF of 2 pages, headed "2884 - The Splitting Club" and the region line "Latin America - South America - 2003/2004", in English. The statement asks for the minimum number of sections into which a club's members can be split, given the number of members of each age and a splitting factor R between 1.0 and 2.0, so that members of the same age stay together and the largest same-age group in a section is at most R times the smallest. It has input and output sections and ends with a sample input and sample output.
