  title: 2003 ACM-Regional South American Contest Results
  language:
  - en
  contest_date: '2003-11-08'
  description: |-
    Website of the 2003 ACM Regional South American Contest, in English. The front page is a list of dated news items, the latest from 4 December 2003: the notice that the final standings were posted at the ICPC site, the teams advancing to the 2004 Finals in Prague, a closing statement from the Regional Director, the rules for allocating the 2004 Finals slots by country and site, and the unofficial final standings notice of 10 November. It says the contest was held on Saturday 8 November 2003, simultaneously but independently in four regions (Argentina, Brazil with four sites, Chile, Venezuela), and links to a results page for each.

    Our copy holds 5 pages: the front page and the four regional results pages. The links to the warm-up problems and the contest problems (PDF files) lead to files that are not in our copy; the link to the ICPC standings leads to another server.
