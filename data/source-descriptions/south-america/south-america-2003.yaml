  description: |-
    Scoreboard as shown on a BOCA judge's page, with the status line saying the contest is over: 116 teams in rank order, each with user name, site number (1 to 4), team name, number solved, per-problem details and total time. The per-problem details give the number of attempts and the time of the accepted run for problems A to H, with a dash for the time on problems not solved. Teams from all four Brazil sites are in one table, and 72 of the 116 teams are at site 1. The first row is UFPE - AM/PM with 5 solved and a total time of 832. The page closes with a note to the judge that the scoreboard has no restrictions. Menu links (Runs, Score, Clarifications, History, Options, Logout) are on the page.
