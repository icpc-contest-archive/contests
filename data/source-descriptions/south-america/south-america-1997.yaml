  description: |-
    Statement of 'The JustaPox Language' as an HTML page. Arrays of integers in a small language are specified either by an explicit size such as [3] or by inclusion of previously defined arrays; given a list of specifications and a list of assignments, the task is to output the assignments that are inconsistent. The page has a sample with four specifications and five assignments. The page has the sections Input, Output, Sample Input and Sample Output and ends with a credit line dated 2000-12-30. No problem letter and no contest name or year is printed. Our copy holds only the HTML page, not the 13 image files it uses for formulas, which are not in our copy.
