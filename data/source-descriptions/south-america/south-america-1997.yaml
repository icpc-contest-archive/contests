  copy: south-america/south-america-1997/judge-livearchive/20210127-wayback-cb26c4f4/5552.pdf
  title: 5552 Codebreakers
  language:
  - en
  problems: 1
  pages: 2
  description: |-
    Problem 5552, 'Codebreakers', as a two-page PDF statement. A secret code is an ordered sequence of m different characters from a set of at most 10; given the set, m and a list of guesses with answers (c, w) for correctly placed and misplaced digits, the task is to print the code or N when the information does not determine it. The statement has input and output formats and a sample with two cases. Its text carries the line 'Universidad de Valladolid OJ: 5552 – Codebreakers' with the page number. No problem letter and no contest name or year is printed.
