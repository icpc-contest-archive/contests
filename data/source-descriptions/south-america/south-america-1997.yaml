  language:
  - en
  problems: 1
  description: |-
    Statement of 'Recording a tape' as an HTML page. Given the cassette durations available and a list of song durations in minutes and seconds, the task is to split the songs between Side A and Side B so that the shortest possible cassette is used, printing the cassette duration and the songs of each side. The page has a sample with two instances and a note that no two songs have the same duration. The page has the sections Input, Output, Sample Input and Sample Output and ends with a credit line dated 2000-12-30. No problem letter and no contest name or year is printed.
