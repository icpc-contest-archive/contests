  description: |-
    Page of the Maratona de Programação site, in Portuguese, headed "1997 - II Consun, Campinas" and dated 12 to 14 December 1997. It links the final standings, a warm-up session and the problems, and names the three best Brazilian teams (PUC-RJ, UFPE and FURG). It adds that PUC-RJ was the only Brazilian and South American team to qualify for the World Finals, held on 28 February 1998 in Atlanta, where it placed 24th, and that the team received the title of Latin American champion.

    The linked results and problem files are not part of our copy, which holds only this page and five image files.
