  description: |-
    Page of the ICPC Caribe website, in Spanish, on the regional contests of South America from 1996 to 2003, with one block per year. The block for 1997, titled "The 1997 ACM South America Programming Contest", gives the date 13/12/1997, a single site at the Instituto de Computação of the Universidade Estadual de Campinas (IC-UNICAMP), the sponsors IBM, SBC and CNPq, and the number of teams by country: Brazil 18, Argentina 2, Chile 2, Colombia 1, Venezuela 1. The podium lists three teams: PUC-Rio with 4 problems solved and qualified for the 1998 World Finals in Atlanta, UFPE with 3 solved, and UBA-FCEN of Buenos Aires with 3 solved. The block has no list of teams and no full ranking; it links to the organisers' ranking page and notes that Argentina, Chile, Colombia and Venezuela took part for the first time.

    Our copy is a crawl of 85 pages of the ICPC Caribe site (LATAM champions and participations, the other regional series, Caribbean contests), which cover other regions and years.
