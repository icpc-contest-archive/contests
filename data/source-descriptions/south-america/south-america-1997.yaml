  title: 5551 Monkeys in a Regular Forest
  language:
  - en
  problems: 1
  pages: 1
  description: |-
    Problem 5551, 'Monkeys in a Regular Forest', as a one-page PDF statement. Trees of several species grow on a lattice; families of monkeys are released one at a time, from left to right and top to bottom, and each occupies all not yet taken neighbouring trees of one species (neighbours differ by at most one in each coordinate). The task is to print the map of the families numbered from 1. The statement has input and output formats and a sample with two matrices. No problem letter and no contest name or year is printed.
- url: https://icpcarchive.ecs.baylor.edu/external/55/5552.pdf
  read: '2026-11-23'
