  title: Driving in City Squares
  language:
  - en
  problems: 1
  description: |-
    Statement of 'Driving in City Squares' as an HTML page. A rectangular city is cut by streets and avenues into counties, each with a circulation fee paid on entering it; the task is to print the smallest price for going from one street-and-avenue point to another, for each instance in a file whose instances end with a line starting with %. The page has a sample with two instances. The page has the sections Input, Output, Sample Input and Sample Output and ends with a credit line dated 2000-12-30. No problem letter and no contest name or year is printed. Our copy holds only the HTML page, not the 13 distinct image files (23 image references) it uses for formulas and for one figure with panels (a) and (b), which are not in our copy.
