  title: Hamiltonian Cycle
  language:
  - en
  problems: 1
  description: |-
    Statement of 'Hamiltonian Cycle' as an HTML page. For a dense undirected graph with fewer than 256 vertices, given as a list of edges, the task is to output a Hamiltonian cycle or the letter N if there is none. The page has a sample with two graphs. The page has the sections Input, Output, Sample Input and Sample Output and ends with a credit line dated 2000-12-30 and a further update line dated 2003-12-17. No problem letter and no contest name or year is printed. Our copy holds only the HTML page, not the 11 distinct image files (14 image references) it uses for formulas, which are not in our copy.
