    Judge's list of the six problems of the 1997 South America regional on the ICPC Live Archive, as it stood on 24 September 2021. Problems 5548 to 5553 are listed by title: The JustaPox Language, Driving in City Squares, Hamiltonian Cycle, Monkeys in a Regular Forest, Codebreakers and Recording a tape. Each row gives total submissions and solving percentage, and total users and solving percentage. The page holds no statements or test data, only this table of six rows under the site menu.
