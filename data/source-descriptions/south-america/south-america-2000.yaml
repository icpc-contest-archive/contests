  description: |-
    Regional contest information page of the 2000 ACM South America Programming Contest, in English, with the pages it links to. The information page names the six host sites (University of Buenos Aires, Federal University of Paraiba at Campina Grande, Federal University of Rio Grande do Sul at Porto Alegre, University of Sao Paulo, University of Chile at Santiago, University of Los Andes at Merida), gives the contest dates as 16 - 18 November 2000, and links the regional contest home page, the team roster, the standings and the problems.

    Our copy holds 4 pages: the information page, a roster of 90 teams grouped by site, a standings page of 90 teams with rank, team and citation, and the problems as a 21-page PDF. The link to the regional contest home page leads to another server and is not part of our copy.
