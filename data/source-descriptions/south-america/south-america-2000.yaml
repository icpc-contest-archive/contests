  description: |-
    Problem set in English as a PDF of 21 pages. The first part, pages 1 to 14, is headed ACM South American Regional Collegiate Programming Contest, Contest Session, November 18, 2000, and names six sites: Buenos Aires, Campina Grande, Porto Alegre, Sao Paulo, Santiago and Merida. It holds six problems numbered 1 to 6: S-Trees, Led Codes, Cable Network, Bomb the bridge, Move the Water and Faking Mondrian. The second part, pages 15 to 21, is headed Warmup Session with the same date and holds three problems: Recognizing Good ISBNs, Network Message Distribution and Editing Distance. Each problem has file names, a statement, input and output formats and a sample. No test data or solutions.
