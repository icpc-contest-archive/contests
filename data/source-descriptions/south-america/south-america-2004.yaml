  description: |-
    Standings page for the 2004 ACM-ICPC South America Contest outside Brazil, sponsored by IBM: 148 teams with rank, university and team name, citation, number solved and time. Citations run First to Sixth, Eighth and Ninth Place for the top teams, then Tenth Place for 41 teams, Fifty-first Place for 31 teams, and none for the last 67 teams, which solved no problems. The most solved is four, by the first team, Universidad de Buenos Aires (UBA-PPP), with a time of 842. Teams from several countries are in the one list.
