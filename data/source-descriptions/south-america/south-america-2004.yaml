  description: |-
    Standings for the North sub-region (Colombia and Venezuela) of the 2004 contest: 104 teams with rank, team name, number solved and time. The first three teams solved three problems each, led by T-SE7EN-USB-VEN with a time of 329; most teams solved two or fewer. Many names end in a country code (VEN or COL). The 56 teams with no solved problems share rank 49 at the end of the list. No per-problem results.
