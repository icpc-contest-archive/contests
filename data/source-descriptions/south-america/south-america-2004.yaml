    Standings for the South sub-region (Argentina, Chile and Peru) of the 2004 contest, as a text list: 43 entries with rank, team, number solved and time (column headed Time(s)); one entry is a test team named Equipo de prueba (Spanish for test team), so 42 teams. Teams are named by university and team name, or by a country code (ARG, PER) and team name. The first team, ARG PPP, solved four problems with a time of 842; seven entries with no problems solved, the test team among them, share rank 37 at the end. No per-problem results.
