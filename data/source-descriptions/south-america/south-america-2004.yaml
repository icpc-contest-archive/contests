  title: 2004 ACM-Regional South American Contest
  language:
  - en
  description: |-
    Website of the 2004 ACM Regional South American Contest, in English, giving the dates as Nov. 12-13, 2004 (last update Nov. 16, 2004). The front page has dated news items (contest times in each time zone, a change to the number used as the cost of a finals slot, an eligibility decision tree, the registration deadline), general information, the regional rules and the rule for advancing to the 2005 World Finals, which splits South America into South (Argentina, Chile, Peru), North (Colombia, Venezuela) and Brazil. It says the contest was split into one within Brazil and one outside Brazil, with six sites. It links final results for the three sub-regions, the warm-up and contest problem sets, an errata sheet and links to data sets.

    Our copy holds 8 pages: the front page, three results pages (South, North, Brazil), the warm-up and contest problem sets as PDFs, a one-page errata and clarifications PDF for problems B, C, E and H, and a one-page PDF decision tree for team eligibility dated 26 October 2004. The two links to data sets (zip files) lead to files that are not in our copy; the links to the scoreboards of the individual sites lead to other servers.
