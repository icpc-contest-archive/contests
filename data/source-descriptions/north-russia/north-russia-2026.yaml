  description: |-
    Page of the Northwestern Russia Regional Contest on the Northern Eurasia Contests website, in Russian and English, headed "Northwestern Russia Regional Contest 2026". It says the qualification round was held on October 25 together with the SPbSU Championship, that teams marked Q in its standings were promoted, and that the regional contest takes place on November 14 at ITMO University, 49 Kronverksky Ave., Saint Petersburg. It gives the schedule of that day (main round 12:00-17:00), the rules for selecting teams for the quarterfinal, instructions for the ITMO entry pass and for the team reference document, and an archive section listing the editions from 2026 back to 1998.

    Our copy holds 77 pages (40 HTML pages and 37 PDFs), among them the other regional pages and the archive index of the site. For 2026 it has the final standings of the regional (119 teams, 14 problems A to N, tries and time per problem, 22 teams marked Q, first place St. Petersburg SU: Log'N'Roll), the problem statements (14 pages) and the tutorial (10 pages), both dated St Petersburg, November 14, 2026, the contestant handbook, and the qualification standings (328 teams, 15 problems A to O) with Russian statements, tutorial and handbook. Standings, statements and tutorials of the editions 2020 to 2025 are also in our copy, and the 2019 qualification standings; most problem archives, and all files linked for 2018 and earlier, are not.
