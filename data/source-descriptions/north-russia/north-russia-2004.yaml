    Final scoreboard of the Northern Subregional Contest of the 2004-2005 NEERC, headed "Standings", with the contest clock reading 5:00:00 of 5:00:00 and status "over". It lists 68 teams, mostly from St Petersburg universities, with others from Petrozavodsk, Arkhangelsk, Novgorod and Karelia. Columns are rank, team, problems A to K, number solved and penalty time. Each problem cell gives a plus sign with the number of rejected tries and the time of the accepted run, a minus sign with a number of tries when only rejected runs were made, or a dot when nothing was submitted. Fifty-four teams solved at least one problem, the best solved seven, and 14 teams share rank 55 with none. Footer rows give total runs, accepted, rejected, first accept and last accept per problem.
