  description: |-
    Website of the Northern Eurasia Contests (NEERC) archive, in English. Our copy holds 142 pages, many of them repeated captures of the same address. It is the archive of the whole host rather than this contest alone: index pages for the years 1996 to 2023, and standings and problem documents for 2004 and 2005. The 2004 year page lists the finals (standings, problems in PDF, a jury archive, contest history and run files, picture galleries) and a Regional Contests section. Its Northwestern Russia block links to the standings and to five RAR files: problem statements in PostScript format, their TeX sources, sample tests, test sources and jury solutions. None of the RAR files is part of this copy of the site. Blocks for the other regions of 2004 follow, among them Southern and Volga Russia, Ural, Central Russia, Belarus and Baltics, Moscow, the Siberian regions, Armenia, Georgia, Kazakhstan, Kyrgyzstan and Uzbekistan.

    Inside are standings pages for the 2004 and 2005 finals and for the regional contests of both years, including the Northern Subregional Contest of 2004 and that of 2005. The 2004 finals problems are a 14-page PDF headed "Northeastern European Regional Contest", St Petersburg, Barnaul, Yerevan, Tashkent, December 1, 2004, with problems A to L; the 2005 problems are also a PDF.
