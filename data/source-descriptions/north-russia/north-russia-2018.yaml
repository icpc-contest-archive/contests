  description: |-
    Archive site of the Northern Eurasia Contests, in English, organised by year with one index page per year from 1996 to 2025. Our copy holds 149 pages, many of them saved more than once under http, https and port-80 addresses. The 2018 index page, headed NERC 2018, lists the final and 16 regional contests of that season. It links the final standings for Northwestern Russia, Ural, Taurida, Kazakhstan, Armenia, Georgia and Azerbaijan and says that no information is available for the other nine. Only the Northwestern Russia entry also links problem statements, a jury archive, analysis and runs.

    For the 2018 Northern Subregional Contest in St Petersburg (the Northwestern Russia entry) our copy holds the standings page, the 13-page statements PDF and the analysis, a 54-page PDF of slides in Russian that goes through problems A to L. The jury archive and runs files linked for this contest are not in our copy.

    Besides the year index pages, our copy holds standings pages of the 2018 and 2019 seasons for the final and many of the regional contests, statements and analyses or tutorials of the 2018 and 2019 finals and Northern Subregional Contests, a 101-page review of the problems of the 2018 final, and a zip of runs from the 2018 final.
