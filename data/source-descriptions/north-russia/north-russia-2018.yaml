  description: |-
    Problem analysis slides in Russian by Gennady Korotkevich, made with LaTeX Beamer: a PDF of 54 pages (51 numbered slides, some built up over several pages). The title slide reads 'Northern Eurasia Contests, Northern Subregional Contest 2018' and is dated 27 October 2018; the running foot reads 'NEERC Northern 2018'. It covers the twelve problems A Accumulator Battery to L LED-led Paths. Each opens with a slide crediting who had the idea and who developed it (for problem D, who prepared it), followed by the problem setup and the solution; problem K carries a six-part proof. A final slide asks for questions.
