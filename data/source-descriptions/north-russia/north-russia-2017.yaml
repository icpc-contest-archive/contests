  description: |-
    Final scoreboard of the Northern Subregional Contest, marked "5:00:00 of 5:00:00, status: over": 113 teams against 12 problems labelled A to L. Each row gives rank, the team name with its three members' surnames, then per problem a plus sign with the number of rejected runs and the solving minute, or minus and a number for unsolved attempts, or a dot; the last two columns are problems solved and total time. Teams with equal results share a rank. First place is SPb ITMO University 2 with 11 problems and 1491 minutes.

    Below the teams are summary rows per problem: total runs, accepted, rejected, first accept and last accept. A "Show time" checkbox on the page shows or hides the solving times. The style sheet is in our copy.
