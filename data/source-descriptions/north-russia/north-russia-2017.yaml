  title: Northern Eurasia Contests
  language:
  - en
  - ru
  description: |-
    Archive site of the Northern Eurasia Contests (NEERC), in English, organised by year with one index page per year from 1996 to 2025. Our copy holds 149 pages, many of them saved more than once under http, https and port-80 addresses. The 2017 index page lists the NEERC final and 16 regional contests of that season: Northwestern Russia, Southern and Volga Russia, Ural, Central Russia, Belarus and Baltics, Moscow, Taurida, West Siberian, East Siberian, Far Eastern Russia, Uzbekistan, Kazakhstan, Armenia, Georgia, Kyrgyzstan and Azerbaijan. For each regional contest it links the final standings; only the Northwestern Russia entry also links problem statements, tests and generators, a jury archive, statement sources, analysis and runs.

    For the 2017 Northern Subregional Contest in St Petersburg (the Northwestern Russia entry) our copy holds the standings page, the 12-page statements PDF and the analysis, a 61-page PDF of Russian-language slides that goes through problems A to L. Two of the three saved copies of the analysis stop at exactly 1 MiB and cannot be opened; the third is complete. The tests, jury archive, statement sources and runs (7z archives) that the page links are not in our copy.

    Besides the year index pages, our copy holds standings pages of the 2017 and 2018 seasons for the NEERC final and many of the regional contests, PDFs of statements and analyses of the 2017 and 2018 NEERC finals, a 2018 review PDF, and a zip of runs from the 2018 final.
