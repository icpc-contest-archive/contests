  title: Northwestern Russia Regional Contest
  language:
  - en
  - ru
  contest_date: '2019-10-26'
  description: |-
    Website titled Northern Eurasia Contests, in English with some pages in Russian. Our copy holds 150 pages (117 HTML, 33 PDF) under 88 distinct addresses; many addresses are held twice, as an earlier and a later version, dated between 2019 and 2025.

    The Northwestern Russia Regional Contest page, in its November 2019 version, gives the host city St Petersburg, two host universities, the participating regions, the contest date of October 26, 2019 at ITMO University, and a schedule (registration 9:00, opening 10:00, practice session 11:00, contest 12:00 to 18:00, closing ceremony 18:30), with contact details of the organisers. Links lead to the final standings, the qualifier standings, statements and tutorial, the contest statements and tutorials, tests, run logs, and the editions from 2007 to 2018; tests and run logs are not in our copy. A later version of the page covers the 2021 online quarterfinal, mostly in Russian.

    The rest of the site covers other regions: 20 pages of regional contests, archive pages for 2019 and 2020 with standings, statements and tutorials of the Northern Eurasia Finals, a 4-page contestant handbook for the online finals of December 13, 2020, and the 2020/21 special rules in Russian. Pages on school olympiads and discrete mathematics labs, in Russian, are also included.
