    Final scoreboard of the contest, a page headed 5:00:00 of 5:00:00, status over, with a Show time switch. It lists 120 teams with rank, team (institution, team name and the three members), a cell for each of the thirteen problems A to M, the number solved and the penalty time. A cell shows a plus with the number of earlier rejected attempts and the time of the accepted run, or a minus with the number of rejected attempts, or a dot if the problem was not tried. ITMO's team 1 Standard deviation is first with 11 problems solved and total time 995.

    Below the teams, summary rows give for each problem the total runs, accepted runs, rejected runs and the times of the first and last accepted run. Problem F has no accepted run.
