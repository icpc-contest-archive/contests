  description: |-
    Website of the Northern Eurasia Contests, a series site and not a site of this edition alone, in English with some Russian. Our copy holds 150 files (106 HTML pages, 33 PDFs, 10 SVG images and a style sheet), many of them saved twice under both http and https addresses. It holds the archive pages for 2022 and 2023, the pages of the regional contests, the standings of the finals and of several regional contests for both years, the statements and tutorials of the finals, and a few school and teaching pages. The Northwestern Russia regional page in one saved version gives contest dates of October 14 and November 5, 2023.

    For the 2022 Northwestern Russia contest of 29 October 2022 our copy holds the standings page, the statements as a PDF of 16 pages and the tutorial as a PDF of 7 pages covering problems A to N, in Russian. For the qualifier of 8 October 2022, as printed on its PDFs, it holds a standings page, statements (12 pages), tutorial (6 pages) and a participant handbook (4 pages), all in Russian. The archives of tests and judges' solutions and the runs are linked but not part of our copy.
