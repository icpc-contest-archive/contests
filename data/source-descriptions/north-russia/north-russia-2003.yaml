  title: Northern Eurasia Contests
  language:
  - en
  description: |-
    Website of the Northern Eurasia Contests (NEERC) archive, in English. Our copy holds 140 pages, many of them repeated captures of the same address (about 70 distinct addresses). It is the archive of the whole host rather than this contest alone: index pages for the years 1996 to 2025, and standings and problem documents for 2003 and 2004. The 2003 year page lists the finals (standings, problems in PostScript and PDF, a jury archive, a picture gallery) and a Regional Contests section. Its Northwestern Russia entry links to the standings, to the problem statements in PostScript format as a RAR file, and to a contest archive RAR file; neither RAR file is part of this copy of the site. Entries for the other regions of 2003 follow, among them Southern and Volga Russia, Ural, Central Russia, Belarus and Baltics, Moscow, the West and East Siberian regions, Far Eastern Russia, Uzbekistan and Kazakhstan.

    Inside are standings pages for the 2003 and 2004 finals and for the regional contests of both years, including the Northern Subregion of 2003 and the Northern Subregional Contest of 2004. The 2003 finals problems are there as PostScript and as a 13-page PDF headed "Northeastern European Regional Contest", St Petersburg, Barnaul, Yerevan, November 26, 2003, with problems A to K; the 2004 problems are a 14-page PDF dated December 1, 2004, with problems A to L.
