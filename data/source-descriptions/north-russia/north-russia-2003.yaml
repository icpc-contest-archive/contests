  description: |-
    Final scoreboard of the Northern Subregion of the 2003-2004 NEERC, headed "Standings", with the contest clock reading 5:00:00 of 5:00:00 and status "over". It lists 62 teams, almost all from St Petersburg universities, with a few from Petrozavodsk, Novgorod, Arkhangelsk and Karelia. Columns are rank, team, problems A to K, number solved and penalty time. Each problem cell gives a plus sign with the number of rejected tries and the time of the accepted run, a minus sign with a number of tries when only rejected runs were made, or a dot when nothing was submitted. Forty-seven teams solved at least one problem, the best solved six, and 15 teams share rank 48 with none. Footer rows give total runs, accepted, rejected, first accept and last accept per problem.
