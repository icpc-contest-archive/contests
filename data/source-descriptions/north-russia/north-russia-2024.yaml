  description: |-
    Website of the Northern Eurasia Contests, in English with some Russian text. Our copy holds two versions of the Northwestern Russia Regional Contest page. The older one has the 2024 edition on top: host universities St Petersburg ITMO University and St Petersburg State University, the participating regions, and the contest dates 27 Oct and 16 Nov 2024, then links for 2024 to the qualification standings, statements, tutorial, problem archive, runs and contestant handbook, and to the contest standings, statements, tutorials, runs, a package of tests and judges' solutions, team reaction videos and a photo gallery. The newer version has the 2025 edition on top (dates 26 Oct and 15 Nov 2025). Both list archive sections for earlier years back to 2003.

    Our copy holds 62 files, 58 of them pages, from the whole site and not only this contest: the pages of 18 regional contests (Armenia to Belarus), the archive pages for 2024 and 2025, the Northern Eurasia Finals pages for 2024 and 2025, finals standings for 2024 and 2025, three Russian-language pages on St Petersburg school olympiads, and brochure PDFs for 2024 (two files of 31 pages) and 2025 (cut short, cannot be opened). None of the files that the Northwestern Russia page links to (standings, statements, tutorials, archives) is in our copy.
