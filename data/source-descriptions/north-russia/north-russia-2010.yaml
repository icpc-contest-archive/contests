    Final scoreboard of the contest, marked as over after 5:00:00 of 5:00:00: 82 teams and 11 problems A to K. Each row gives the rank, the team name (an abbreviated institution name and a number, with the team members in brackets), the outcome of every problem (a plus with the number of earlier rejected runs and the minute of the accepted run, a minus with the number of rejected runs for an unsolved problem, a dot for no attempt), the number solved and the penalty time. The leading team is SPb IFMO 1 with 10 problems solved. Seven teams with no problem solved share rank 76. A footer gives, for each problem, the total, accepted and rejected runs and the times of the first and last accepted run. The page is in English; a checkbox shows or hides the times.
