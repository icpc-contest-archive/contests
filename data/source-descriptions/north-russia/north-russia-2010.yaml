  copy: north-russia/north-russia-2010/website/2026-09-05-wayback-29b909c0
  title: Northern Eurasia Contests
  language:
  - en
  - ru
  description: |-
    Pages of the Northern Eurasia Contests website (the ITMO site for the NEERC and its regional contests), mostly in English with some Russian. Our copy holds 150 files: 142 pages (105 HTML pages and 37 PDFs), four PostScript files and four RAR archives. It starts from the Northwestern Russia regional contest page, held in two versions: one announces the contest of October 26, 2019 in St Petersburg, the other the contests of October 31 and December 11, 2021, partly in Russian. Both carry an archive list of past years down to 2003. For 2010 the list gives links to the final standings, the problem statements in PostScript and PDF, generated tests, an archive of all materials, the runs, and two analyses in Russian. Our copy holds the standings page, the problem statements PDF of the Northern Subregional Contest of 2010 and the two analyses: a text of 10 pages that discusses problems A to K one by one, and a presentation of 80 pages with an agenda listing A to K. The PostScript file, tests, runs and archive of all materials are not in it.

    The rest of the copy covers other editions and regions: pages for 18 regional contests of Northern Eurasia, the archive pages for 2009 and 2010, the NEERC 2010 information page (St Petersburg, Barnaul, Tashkent and Tbilisi, November 24) and 41 files of the schools olympiad.
