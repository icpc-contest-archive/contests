- url: http://neerc.ifmo.ru/subregions/northern.html
  read: '2026-11-16'
  rubric: 1
  copy: north-russia/north-russia-2016/website/2026-09-05-wayback-88d7fcfd
  title: Northern Eurasia Contests
  language:
  - en
  description: |-
    Archive section of the Northern Eurasia Contests website, in English. Our copy holds 141 files saved from 150 fetched addresses, many of them the same page saved under http, https and port-80 addresses. They are the overview pages for NEERC 2016 and 2017, year pages for 1996 to 2004, 17 standings pages of the regional contests for each of 2016 and 2017, and PDFs: the problem statements of the Northeastern European Regional Contest of 2016 (15 pages) and 2017 (14 pages), a 49-page problems review for 2016 and a 14-page analysis for 2017. The standings pages of the main contest for 2016 and 2017 are linked but were not saved.

    The 2016 page lists the regional contests with links to their standings. For Northwestern Russia it also links statements, tests and generators, a jury archive, statement sources, a problem analysis and the runs. Our copy holds the Northern standings page (107 teams, problems A to K), the 12-page statements PDF and the analysis, 60 pages of slides mostly in Russian. The archives of tests, jury solutions and runs are not part of our copy. The same kinds of files for the 2017 Northern contest are held too (statements of 12 pages and an analysis of 61 pages); two of the three saved copies of that analysis are cut off at 1 MiB and cannot be opened. Pages for 2009 to 2015 and 2018 to 2021 are linked or listed in the menu but were not saved.
