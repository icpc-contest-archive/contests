  description: |-
    Final scoreboard of the Northern Subregional Contest, ACM ICPC 2016-2017, NEERC: 107 teams in a table with rank, team name (with the surnames of its three members), one column for each of the eleven problems A to K, the number solved and the total time. Each problem cell gives the solve time with the number of rejected attempts before it, a minus sign and a number for attempts without a solution, or a dot for no attempt; a checkbox labelled Show time shows or hides the times. The clock reads 5:00:00 of 5:00:00 and the status is over.

    Below the teams, summary rows give for each problem the total runs, accepted, rejected, and the times of the first and last accepted run. SPb ITMO University 1 is first with 11 solved. Twelve teams solved nothing, and they share rank 96 at the bottom.
