  description: |-
    Final scoreboard of the Northern Subregional Contest (ACM ICPC 2005-2006, NEERC): 64 teams and eleven problems A to K. Each row gives rank, team name, and for every problem either a dot (not tried), a plus followed by the number of rejected attempts (when there were any) and the time of the accepted run, or a minus with the number of rejected attempts, followed by the number solved and the total time. The header shows the clock at 5:00:00 of 5:00:00 with status over.

    SPb IFMO 1 is first with ten problems and a time of 1674; no team solved H. Six teams solved nothing and share rank 59. Summary rows at the bottom give total runs, accepted, rejected, first accept and last accept for each problem.
