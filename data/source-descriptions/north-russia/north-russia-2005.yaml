  title: Northern Eurasia Contests
  language:
  - en
  description: |-
    Pages of the Northern Eurasia Contests (NEERC) archive website. The 2005 page, headed NEERC 2005, lists the finals resources (standings, problems in PDF and in PostScript, tests and jury solutions, a package that lets one watch the contest flow in progress) and a Regional Contests block for 15 regions, from Northwestern Russia to Azerbaijan. Northwestern Russia has standings, problem statements in PostScript, their TeX sources, and sample tests with jury solutions; the other regions are listed with standings only, and Ural has separate Russian-day and English-day standings.

    Our copy holds 142 saved pages in English, which are 72 distinct addresses, several of them saved two or three times. They are taken from the 2005 and 2006 sections of the archive plus the index page of each other year. They include the 2005 finals standings, the Northwestern Russia standings (64 teams, problems A to K), standings of other regions for 2005 and 2006, a 14-page PDF of the 2005 finals problems (eleven problems A to K), and two 15-page PDFs of problems from 2006, one for the 2006 finals and one for the 2006 Northern Subregional Contest (eleven problems A to K each).

    The links to the Northwestern Russia statement, source and test archives lead to files that are not in this copy, and the copy has no style sheets or images.
