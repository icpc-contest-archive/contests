  copy: north-russia/north-russia-2009/website/2026-09-05-wayback-29b909c0
  title: Northern Eurasia Contests
  language:
  - en
  - ru
  description: |-
    Pages of the Northern Eurasia Contests website (the ITMO site for the NEERC and its regional contests), mostly in English with some Russian. Our copy holds 150 files: 142 pages (105 HTML pages and 37 PDFs), four PostScript files and four RAR archives. It starts from the Northwestern Russia regional contest page, which our copy holds in two versions: one announces the contest of October 26, 2019 in St Petersburg, the other the contests of October 31 and December 11, 2021, online and in St Petersburg, partly in Russian. Both name the host universities (ITMO University and St Petersburg State University), the participating regions and the contacts, and carry an archive list of past years down to 2003. For 2009 the list gives links to the final standings, the problem statements in PostScript and PDF, generated tests, the jury archive, the runs and an analysis presentation. Our copy holds the standings page and the problem statements PDF of the Northern Subregional Contest of 2009; the PostScript file, tests, archive, runs and analysis presentation are not in it.

    The rest of the copy covers other editions and regions: pages for 18 regional contests of Northern Eurasia, the archive pages for 2009 and 2010 (the 2009 page covers the NEERC of 2009 and lists the regional contests of that year), the NEERC 2009 information page (St Petersburg, Barnaul, Tashkent and Tbilisi, November 11) and 41 files of the schools olympiad.
