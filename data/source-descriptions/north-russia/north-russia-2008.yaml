  description: |-
    Problem set as a PostScript file of 13 pages in English. The header names the Northern Subregional Contest of NEERC 2008-2009, St Petersburg, November 1, 2008. It holds eleven problems, A to K: Access Control Lists, Billboard, Class, Deposits, Enchanted Mirror, Fenwick Tree, Ground Works, Holes, Important Wires, Just Too Lucky and Key to Success.

    Each problem gives its input and output file names, time limit and memory limit, the statement, the input and output formats and an example. No test data or solutions. The file is PostScript, not PDF, so it needs a PostScript viewer.
