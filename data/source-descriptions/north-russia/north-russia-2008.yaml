  description: |-
    Dashboard of the Codeforces gym contest 2008-2009 ACM-ICPC, NEERC, Northern Subregional Contest, marked Finished. The problem table lists eleven problems A to K with the input and output file names, the time limit (3 seconds for A, 1.5 seconds for the others), the memory limit (256 MB) and a count shown as x86 for A, x254 for B and so on. Names: Access Control Lists, Billboard, Class, Deposits, Enchanted Mirror, Fenwick Tree, Ground Works, Holes, Important Wires, Just Too Lucky, Key to Success.

    The page also holds the options for virtual participation and practice, a link to the English statements as a PDF, a link labelled Contest website that leads to another server, and forms for questions and announcements. The statements and the standings are on other pages that are not part of our copy.
