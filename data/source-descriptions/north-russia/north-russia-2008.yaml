  title: Northern Eurasia Contests
  language:
  - en
  - ru
  description: |-
    Website of the Northern Eurasia Contests, mostly in English, with a Russian-language section. It starts from the Northwestern Russia Regional Contest page, saved in two versions: one with the 2019 edition (St Petersburg, 26 October 2019) and one with the 2021 edition (online and in St Petersburg, 31 October and 11 December 2021). Each gives the host universities, the schedule, contacts and an archive list by year (2003 to 2019, and 2003 to 2021). In both, the 2008 entry links standings, problem statements in PostScript, generated tests, jury solutions and a jury archive.

    Around it are the pages of the other regional contests, the 2008 and 2009 season pages with finals standings and problems, the regional standings of both years, pages on the 2008 and 2009 finals (the 2008 one with schedule and venues in St Petersburg, Barnaul, Tashkent and Batumi), and a section in Russian on school informatics olympiads with problem PDFs and archives.

    Our copy holds 114 saved files: 109 pages (92 HTML and 17 PDF) and five others (four RAR archives and a PostScript file), many under both an http and an https address. The standings of the 2008 Northern Subregional Contest are in it. Its problem statements, tests and jury solutions are linked from the archive list but are not among the saved files.
