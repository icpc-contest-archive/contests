  description: |-
    Final scoreboard of the Northern Subregional Contest, headed 5:00:00 of 5:00:00 with status over: 59 teams and eleven problems A to K. Each team row gives rank, the team name followed by the names of its members in parentheses, one cell per problem, the number solved and the penalty time. A cell shows a plus with the number of rejected tries before it and the minute of the accepted run, a minus with the number of rejected tries for an unsolved problem, or a dot when the team made no run. The first place has all eleven problems solved with 653 penalty minutes. Eleven cells, one per problem, carry a first-to-solve mark.

    Below the table are rows with total runs, accepted runs, rejected runs, first accept and last accept for each problem. A "Show time" switch on the page toggles the times. The style sheet is saved with the page.
