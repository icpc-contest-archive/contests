    Problem list of the Baekjoon Online Judge for the category NEERC Northern Subregional 2008, in Korean. The table has eleven rows, lettered A to K and numbered 3571 to 3581 on the judge. In our copy every row has only its number and letter: the title, solver, submission and percentage columns are empty and no row links to a problem page. The page names the source as ICPC Regionals, Northern Eurasia, North-Western Russia Regional Contest.

