  description: |-
    Final scoreboard of the Northern Subregional Contest: 78 teams, each with rank, team name (followed by three names in brackets) and a cell for each of the twelve problems A to L. A cell shows + with the solving time in minutes and seconds, a count of earlier rejected runs (+1, +3), a negative number (-9) for rejected runs without a solution, or a dot for no attempt. The last two columns, headed = and Time, give problems solved and total time. A line above the table reads 5:00:00 of 5:00:00, status over, and a Show time box hides or shows the times.

    SPb SU 4 is first with 12 solved and 982 minutes. The last 15 teams share rank 64 with no problem solved. Rows at the bottom give total runs, accepted, rejected, first accept and last accept for each problem.
