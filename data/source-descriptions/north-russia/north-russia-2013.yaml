- url: https://neerc.ifmo.ru/subregions/northern.html
  read: '2026-11-16'
  rubric: 1
  copy: north-russia/north-russia-2013/website/2026-09-05-wayback-88d7fcfd
  title: Northern Eurasia Contests
  language:
  - en
  description: |-
    Pages of the Northern Eurasia Contests archive site, in English. The 2013 archive page lists the NEERC 2013 final (standings, problems in PDF, official tests) and 15 regional contests, from Northwestern Russia and Southern and Volga Russia to Kyrgyzstan and Azerbaijan, each with a link to its final standings. For Northwestern Russia it also lists problem statements in PDF, tests and generators, a jury archive, statement sources and a log of all runs. The 2014 archive page has the same layout for 2014 and 16 regional contests, including Taurida.

    Our copy holds 142 saved files (125 HTML pages, 14 PDFs, 3 XML files), many of them the same page saved under http, https and port 80 addresses. It has the final standings and the regional standings pages for 2013 and 2014, the Northern Subregional 2013 standings page and its XML file, and that contest's statements PDF of 15 pages. It also has the problem set of the 2013 final (14 pages, dated December 1, 2013) and the problems review slides for it (13 pages, by Roman Elizarov); for 2014, the Northern Subregional statements (14 pages) and the final's review slides (21 pages). The Northern Subregional 2014 analysis PDF is cut off at 1 MiB and does not open. Archive pages for the years 1996 to 2012 are saved, but not the pages from 2015 on, the 2014 final problem set, the tests, the jury archives or the run logs. Style sheets and images are not saved.
