  description: |-
    Website of the Northern Eurasia Contests (NEERC) on the neerc.ifmo.ru host, in English. Our copy holds 135 pages, which come to 65 distinct addresses once the http, https and port 80 variants are merged: the home and archive pages, the yearly index pages from 1996 to 2015, and results and documents for 2012 and 2013 only.

    The 2012 index page lists the NEERC final (standings, problems, official tests, test generators and jury solutions) and fifteen regional contests, each with a standings link; Northwestern Russia also lists problem statements, tests and generators, an archive, statements and a log that is an XML standings file. This is the Northwestern Russia (Northern Subregional) contest held in St Petersburg on 3 November 2012: its standings page, its 13-page problem PDF and its XML file are in our copy. So are the same files for the 2013 edition (the statements PDF has 15 pages), the NEERC final standings and problem PDFs for 2012 and 2013 (14 pages each), two 13-page review slide decks for the 2012 and 2013 finals, standings pages of the other regional contests, and a 20-page Central Russia problem PDF for 2012. The packaged downloads (.rar and .7z files) are linked but not in our copy.
