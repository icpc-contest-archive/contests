  title: Northwestern Russia Regional Contest
  language:
  - en
  - ru
  description: |-
    Website titled Northern Eurasia Contests, in English with some pages in Russian. Our copy holds 148 files under 85 distinct addresses: 138 pages (107 HTML, 31 PDF), 8 SVG images and 2 zip archives. Many addresses are held twice, as an earlier and a later version dated between 2020 and 2025.

    The Northwestern Russia Regional Contest page in our copy is the version that announces the 2021 edition: a qualifier on October 31, 2021 and an online contest on December 11, 2021, with the schedule, host city, host universities, participating regions and organiser contacts. It is not a page about the contest of November 14, 2020. Its archive part has a section for each year from 2003 to 2020 (to 2021 in the later version); the 2020 section links the final standings, tests and judges' solutions, run logs, statements and tutorials.

    The 2020 final standings page and the 2020 statements PDF are inside our copy. The 2020 tutorial PDF is cut off at 1 MiB in both of its copies and a PDF reader cannot open it. The rest of the site holds pages of other regions and contests for 2020 and 2021, and school olympiad and course pages in Russian.
