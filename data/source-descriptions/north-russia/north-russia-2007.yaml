    Final scoreboard of the Northern Subregional Contest, headed 5:00:00 of 5:00:00 with status over: 70 teams and eleven problems A to K. Each team row gives rank, team name, one cell per problem, the number solved and the penalty time. A cell shows a plus with the number of rejected tries before it and the minute of the accepted run, a minus with the number of rejected tries for an unsolved problem, or a dot when the team made no run. The first place has ten problems solved and 920 penalty minutes. Six teams with no problem solved share rank 65. Eleven cells, one per problem, carry a first-to-solve mark.

    Below the table are rows with total runs, accepted runs, rejected runs, first accept and last accept for each problem. A "Show time" switch on the page toggles the times. The style sheet is saved with the page.
