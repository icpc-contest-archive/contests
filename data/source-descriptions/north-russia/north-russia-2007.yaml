  description: |-
    Dashboard of the Codeforces gym contest 2007-2008 ACM ICPC Northern Subregional Contest (NEERC 07), marked Finished. The problem table lists eleven problems A to K with the input and output file names, time limit (1 to 3 seconds) and memory limit (64 MB) and a count shown as x108 for A, x224 for B and so on. Names: A+B, Beer Refrigerator, Crosses and Crosses, Domestic Networks, Elevator, Formula, Given a string..., History of Football, iChess, Journey with Pigs, K'ak'-u-pakal and Mayan Script. A note on the page says the package of a problem was not updated after the judging servers were upgraded, so the displayed execution time is multiplied by 2.

    The page also holds the options for virtual participation and practice, a link to the English statements as a PDF, and forms for questions and announcements. The statements and the standings are on other pages that are not part of our copy.
