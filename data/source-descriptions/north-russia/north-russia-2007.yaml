  description: |-
    Archive site of the Northern Eurasia Contests (NEERC) with one page per season. The page for NEERC 2007 links the final standings, the problems in PDF form, tests with jury solutions, all runs, and a package for replaying the finals, and a Regional Contests section with a block for each subregional contest. The Northwestern Russia block gives standings, problem statements as a PDF, and tests and jury solutions. The page for 2008 has the same layout and lists problems in PDF and PostScript for the finals.

    Our copy holds 141 saved pages, 69 distinct addresses because most pages were saved under http, https and port-80 addresses. They are the index and the season pages from 1996 to 2025, the final standings and the problems PDFs of 2007 and 2008, the standings of 15 subregional contests of 2007 and 16 of 2008, and the problem PDF of this contest. The standings of this contest, the Northern Subregional Contest of 2007, are among them. The pages are in English. The tests, jury solutions, runs and replay packages that the season pages link to are not in our copy. The site also covers other seasons and the other subregional contests.
