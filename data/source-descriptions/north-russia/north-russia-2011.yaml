  description: |-
    Website of the Northern Eurasia Contests (NEERC) on the neerc.ifmo.ru host, in English. Our copy holds 139 pages, which come to 67 distinct addresses once the http, https and port 80 variants are merged: the home and archive pages, the yearly index pages from 1996 to 2018, and results and documents for 2011 and 2012 only.

    The 2011 index page lists the NEERC final (standings, problems, statement sources, official tests, an analysis presentation, a jury archive) and fifteen regional contests, each with a standings link; Northwestern Russia also lists problem statements, tests and generators, an archive, runs, statements and a log. This is the Northwestern Russia (Northern Subregional) contest, held in St Petersburg on 29 October 2011: its standings page and its 13-page problem PDF are in our copy. So are the 2012 equivalents, the NEERC final standings and problem PDFs for 2011 (16 pages) and 2012 (14 pages), two 13-page slide decks with problem analyses for the 2011 and 2012 finals, and standings pages of the other regional contests. The packaged downloads (.rar and .7z files) are linked but not in our copy.
