  rubric: 1
  copy: north-russia/north-russia-2014/website/2026-09-05-wayback-88d7fcfd
  title: Northern Eurasia Contests
  language:
  - en
  description: |-
    Pages of the Northern Eurasia Contests archive site, in English, entered from its home page. The archive pages for 2014 and 2015 list the NEERC final (standings, problems in PDF, official tests, jury material) and 16 regional contests each, from Northwestern Russia to Azerbaijan, with a link to the final standings of each. For Northwestern Russia they also list problem statements, tests and generators, a jury archive, statement sources, an analysis and the runs. For the Northern Subregional Contest of 2014 the site has the standings page, a statements PDF of 14 pages, and an analysis in Russian: slides of 69 pages that open with the jury list and then go through problems A to K.

    Our copy holds 143 saved files (123 HTML pages, 20 PDFs) for 61 distinct addresses; most are saved two or three times under http, https and port 80 addresses. It also holds the 2014 final's problem set (15 pages, dated December 7, 2014) and problems review slides (21 pages, by Roman Elizarov), regional standings pages for 2014 and 2015, and the standings, statements (12 pages) and analysis of the Northern Subregional of 2015, as well as the 2015 final's review slides (40 pages). The analysis PDFs are cut off at one megabyte in some copies and complete in others. The final standings of 2014 and 2015, the tests and jury archives, and archive pages for 2010 to 2013 and after 2015 are not in our copy. Style sheets and images are not saved.
