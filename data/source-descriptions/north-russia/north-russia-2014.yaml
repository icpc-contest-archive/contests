  description: |-
    Problem analysis slides in Russian by Georgiy Korneev, a PDF of 69 pages made from PowerPoint. The cover, an image, reads 'Northern Subregional Contest, ACM ICPC 2014-2015, NEERC, Problem Analysis' with the ITMO University logo and sponsor logos. Fourteen slides introduce the members of the jury, all from SPbSU ITMO. Then come the eleven problems A Alarm Clock to K Kebab House: each opens with a slide crediting its author, statement writer and test writer, followed by two to six slides with the problem setup and the solution. The last slide asks for questions.

    Most slide footers read 'ACM ICPC NEERC Northern Subregion 2013-2014 / Разбор задач' (Problem analysis), the previous season, while the cover and the footer of slide 33 give 2014-2015. The cover text is read from an image.
