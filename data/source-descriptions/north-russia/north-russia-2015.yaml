    Final scoreboard of the Northern Subregional Contest, ACM ICPC 2015-2016, NEERC: 92 teams in a table with rank, team name (with the surnames of its three members), one column for each of the twelve problems A to L, the number solved and the total time. Each problem cell gives the solve time with the number of rejected attempts before it, a minus sign and a number for attempts without a solution, or a dot for no attempt; a checkbox labelled Show time shows or hides the times. The clock reads 5:00:00 of 5:00:00 and the status is over.

    Below the teams, summary rows give for each problem the total runs, accepted, rejected, and the times of the first and last accepted run. SPb ITMO University 1 is first with 12 solved; four teams solved nothing. Four teams share rank 89 at the bottom.
