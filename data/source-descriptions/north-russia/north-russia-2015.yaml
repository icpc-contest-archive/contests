  title: Northern Eurasia Contests
  language:
  - en
  description: |-
    Archive section of the Northern Eurasia Contests website, in English. Our copy holds 142 files saved from 150 fetched addresses, many of them the same page saved under http, https and port-80 addresses. They are the overview pages for NEERC 2015 and 2016, year pages for 1996 to 2008, the standings and problem statements of the Northeastern European Regional Contest of 2015 (a PDF of 14 pages) and 2016 (a PDF of 15 pages), a 49-page problems review for 2016, and for each of the two years 17 standings pages of the regional contests.

    The 2015 page lists the regional contests with links to their standings. For Northwestern Russia it also links statements, tests and generators, a jury archive, statement sources, a problem analysis and the runs. Our copy holds the Northern standings page (92 teams, problems A to L), the 12-page statements PDF and the analysis, 62 pages of slides mostly in Russian. Two of the three saved copies of the 2015 analysis file are cut off at 1 MiB and cannot be opened; the third is complete. The 2016 Northern statements (12 pages) and analysis (60 pages) are also held. The archives of tests, jury solutions and runs are not part of our copy. Pages for the years 2009 to 2014 and 2017 to 2020 are linked but were not saved.
