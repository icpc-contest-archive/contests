  description: |-
    Website of the Northern Eurasia Contests, in English with some Russian text. The Northwestern Russia Regional Contest page gives the host city St Petersburg, the host universities (St Petersburg ITMO University and St Petersburg State University), the participating regions and the dates October 14 and November 5, 2023. It links to standings, statements, tutorials, a package of tests and judges' solutions and the runs, and to a second set for the qualification, to opening videos and a contestant handbook, with sections for each earlier year back to 2003. A Russian notice says the final results are published and explains how teams are invited to the quarterfinal (N=40, M=100, plus all teams with nine or more problems solved).

    Our copy holds 67 files, 63 of them pages, from the whole site and not only this contest: the pages of 18 regional contests (Armenia to Belarus), the archive pages for 2023 and 2024, the Northern Eurasia Finals pages for 2023 and 2024, finals standings (2023, with the St Petersburg and Astana sites and a practice session, and 2024), four Russian-language pages on St Petersburg school olympiads, and brochure PDFs for 2023 and 2024. The 2024 brochures have 31 pages each; the two 2023 brochure files are cut short and cannot be opened. None of the files that the Northwestern Russia page links to (standings, statements, tutorials, archives) is in our copy.
