  description: |-
    Final scoreboard of the Northern Subregional Contest (ACM ICPC 2006-2007, NEERC): 70 team rows and eleven problems A to K. Each row gives rank, team name, and for every problem either a dot (not tried), a plus followed by the number of rejected attempts (when there were any) and the time of the accepted run, or a minus with the number of rejected attempts, followed by the number solved and a total time. The header shows the clock at 5:00:00 of 5:00:00 with status over, and some accepted cells are marked as first to solve.

    Petrozavodsk SU 2 and SPb IFMO 1 share rank 1 with nine problems. The total time cell reads 0 for the five teams with eight or nine solved. No run was accepted for A or E. Two teams solved nothing. Summary rows at the bottom give total runs, accepted, rejected, first accept and last accept for each problem.
