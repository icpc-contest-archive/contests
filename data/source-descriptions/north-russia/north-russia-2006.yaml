  title: Northern Eurasia Contests
  language:
  - en
  description: |-
    Pages of the Northern Eurasia Contests (NEERC) archive website. The 2006 page, headed NEERC 2006, lists the finals resources (standings, problems in PDF, tests and jury solutions) and a Regional Contests block for 15 regions, from Northwestern Russia to Azerbaijan. Northwestern Russia has standings, problem statements in PDF and tests with jury solutions; the other regions are listed with standings only, and for Azerbaijan the page says that no information is available.

    Our copy holds 147 saved pages in English, which are 69 distinct addresses, many of them saved two or three times. They are taken mainly from the 2006 and 2007 sections of the archive plus the index page of each other year. They include the 2006 finals standings, the Northwestern Russia standings (70 teams, problems A to K), standings of other regions, and PDFs of problems for the 2006 finals (15 pages, eleven problems), the 2006 Northern Subregional contest (15 pages, eleven problems) and three contests of 2007.

    The link to the Northwestern Russia tests and jury solutions leads to a file that is not in this copy, and the copy has no style sheets or images.
