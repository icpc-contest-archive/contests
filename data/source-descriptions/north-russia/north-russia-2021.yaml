  description: |-
    Website of the Northern Eurasia Contests archive, in English with some Russian. Our copy holds 150 files, many of them saved twice under both http and https addresses: the archive's year pages from 1996 to 2025, and for 2021 and 2022 the final standings page, the statements and tutorial of the finals, and the standings pages of the regional contests (Armenia, Azerbaijan, Georgia, Kazakhstan, Northwestern Russia, Taurida, Ural, Uzbekistan). For Northwestern Russia the 2021 year page links standings, a qualifier with its own standings, statements and tutorial, statements, tutorials, tests and judges' solutions, and runs.

    For this contest our copy holds the standings page (87 teams, problems A to N), the problem statements as a PDF of 20 pages and the tutorial as a PDF of 9 pages covering problems A to N, plus the standings page of the qualifier (156 teams, problems A to O) with its statements (17 pages) and tutorial (5 pages), both in Russian. Pages of the same site for the 2022 edition and for other regions are also in it. The archives of tests, judges' solutions and runs are linked but not part of our copy.
