  contest_date: '2025-11-15'
  description: |-
    Page of the Northern Eurasia Contests website for the Northwestern Russia Regional Contest, held on 15 November 2025 with St. Petersburg ITMO University as host. It lists the participating regions, the day's schedule in Russian (registration, opening ceremony, practice session, main contest from 12:00 to 17:00, closing ceremony), a paper team reference document rule in English and Russian, and the contacts. For the 2025 regional it links standings, problem statements, tutorials, all runs, team reaction videos, photos, a Polygon package of tests and judges' solutions, and a Codeforces mirror. A second block gives 26 October 2025 with St. Petersburg State University as host, and the archive has a 2025 Qualification section with its standings, statements in English and Russian, tutorials, handbooks, a problem archive and livestreams.

    The same page carries the archive of earlier editions of the regional and its qualification, from 2025 back to 1998, and the site menu leads to the Northern Eurasia Finals page, the list of regional contests, the archive and a map. Our copy holds 72 pages (38 HTML and 34 PDF; 109 addresses were fetched and 98 files saved): the standings page of the 2025 regional, its statements and tutorial PDFs, the 2025 qualification statements, tutorials and handbooks, older statements and tutorials, and the pages of the other regional contests. Thirteen archive packages (7z and zip) were saved; the 2025 packages of tests (archive.7z files) and many other archive files, including the standings pages of earlier years, were not fetched.
