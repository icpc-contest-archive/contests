  description: |-
    Final scoreboard of the Northwestern Russia Regional Contest on the Northern Eurasia Contests website: 145 teams ranked, with twelve problems A to L. Each team row gives the team name with institution prefix and three members, one cell per problem showing the number of rejected attempts and the solve time as minutes and seconds (unsolved problems show only a negative attempt count), then the number solved, the total penalty time, and an awards column. 23 teams carry the mark Q in that column. The top team solved 11 problems with 1569 minutes of penalty. The header shows the contest clock at 5:00:00 of 5:00:00 with status over.

    Below the teams, summary rows give per problem the total runs, accepted, rejected, first accept time and last accept time.
