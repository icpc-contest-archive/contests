    Final scoreboard of the Northwestern Russia Regional Contest, (status: over, 5:00:00 of 5:00:00): 145 teams and twelve problems, A to L. Each row gives rank, team (institution, team name and the three members), one cell per problem, number solved, total time and an Awards column in which 23 teams carry the mark Q. A problem cell shows the minutes and seconds of the accepted run with the number of earlier rejected attempts, or the number of failed attempts when unsolved. Teams with no solved problem share rank 141.

    Below the teams are rows with total runs, accepted, rejected, first accept and last accept for each problem. First place is HFTilted of SPb ITMO with 11 problems and time 1569. No unofficial teams are marked.
