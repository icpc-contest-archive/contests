  contest_date: '2025-11-15'
  description: |-
    Section of the Northern Eurasia Contests website for the Northwestern Russia Regional Contest, in English with Russian passages. The entry for 2025 gives the participating regions, St. Petersburg ITMO University as host and 15 November 2025 as the date, the day's schedule (registration, opening ceremony, practice round, main round from 12:00 to 17:00, closing ceremony), a note on the printed team reference document, contacts, and links to the standings, problem statements, tutorials, all runs, reaction videos, photos, a Codeforces mirror and a Polygon package.

    The same page keeps an archive of earlier years back to 1998, each with links to standings, statements and tutorials where they exist, and separate entries for the qualification rounds of 2019 to 2025 (the 2025 one on 26 October, hosted by St. Petersburg State University) with statements, tutorials and contestant handbooks, in English and Russian for 2024 and 2025.

    Our copy holds 71 pages, 37 HTML and 34 PDF. They include the standings pages of 2019 to 2025, the qualification pages, the 2025 statements and tutorial, the Northern Eurasia Finals 2025 page, the archive index, information and contact pages and the pages of the other regional contests. Thirteen ZIP and 7Z archives are saved (run archives of several years, the 2019 qualifier archive, and problem archives of 2019 and 2022); the larger problem and test archives of 2021 to 2025 are not in it. The photo and video links lead to other sites, and the reactions link is only a redirect to another site.
