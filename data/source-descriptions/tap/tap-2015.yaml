  description: |-
    News item of a university computing department, in Spanish, reporting the 5th Torneo Argentino de Programación held on 26 September 2015. It states 75 teams from 20 institutions at 9 sites (Bahía Blanca, Buenos Aires, Chilecito, Córdoba, La Plata, Neuquén, Resistencia, Río Cuarto and Rosario), 5 hours of competition and 11 problems prepared by a jury of teachers, graduates and advanced students, with a link to the problems as a PDF.

    Its results section is a text account, not a table: the overall champion (a team from the Universidad Nacional de Rosario, 9 problems, 903 penalty points), the runner-up, the teams in 5th and 6th place, and the winner of each of the other sites (the number of problems solved is given for all of them except Córdoba). It links to the full scoreboard on another site and gives the date of the Latin American Regional. The page also carries the department's navigation menus; the PDF and the scoreboard are not part of this page.
