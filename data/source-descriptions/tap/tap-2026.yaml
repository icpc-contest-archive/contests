  description: |-
    Page of the Asociación Argentina de Programación Competitiva about the Torneo Argentino de Programación 2026, in Spanish, with the association's site pages around it. The seed page announces the 16th tournament for Saturday 29 August 2026 as part of the ICPC, says it selects the teams that go to the regional contest, and gives the format: teams of three students from the same Argentine institution, one computer, five hours, C/C++, Python, Java or Kotlin. It lists fourteen sites (among them Bariloche, Chilecito, Córdoba, Jujuy, La Plata, Rosario, Salta, Santa Fe and Tucumán), the registration period of 26 June to 25 August, a FAQ, and links to statements and online judges of the 2024 and 2025 editions.

    Our copy holds 15 distinct documents: seven pages (the tournament page, the association's home, ICPC, institutional, members and useful links pages, and a page of earlier editions with links to online judges back to 2011 and to statements for 2017 to 2025 except 2021) and eight PDFs. The PDFs are the tournament rules for 2026 (4 pages), the problem booklet of the 2025 edition (24 pages), problem booklets of 2017 (26 pages), 2018 (19 pages), 2019 (22 pages), 2020 (27 pages) and 2022 (22 pages), and the association's statute (12 pages, scanned images without a text layer). The 2020 booklet is shared with the Brazilian, Mexican and Centroamerican contests, and the 2022 booklet also with the Bolivian one. No results or problems of the 2026 edition are in our copy.
