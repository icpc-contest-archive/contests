    Contest dashboard on Codeforces for "2026 Argentinian Programming Tournament (TAP)", marked Finished. It lists fourteen problems labelled A to N, each with its name, time limit (1 to 5 seconds), memory limit of 1024 MB and number of accepted solutions. The contest materials section links an announcement and the statements in Spanish and in English, and there is a link to the contest website.

    The page also holds the Codeforces menus, virtual participation and practice notes, and forms for questions and announcements. The statements themselves are not on the page; the links to the problems, the standings and the attached files are not part of our copy.
