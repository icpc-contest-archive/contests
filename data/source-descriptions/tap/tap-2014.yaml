  description: |-
    Standings of the 2014 Torneo Argentino de Programación: 66 teams with rank, team name, institution, number of problems solved and total time, plus three more columns: a medal column, a citation column and a site citation column. The two top teams carry the titles Argentinian Champion and Argentinian Runner Up. The citation column reads First Place to Thirty-first Place for ranks 1 to 31 and Honorable Mention for 35 teams, among them four tied at rank 63 with no problem solved. The site citation column names a champion for each of nine sites. The most solved by any team is 9, by two teams. The page gives no per-problem results.
