  title: 3er Torneo Argentino de Programación
  language:
  - es
  contest_date: '2013-10-05'
  description: |-
    Announcement of the 3rd Torneo Argentino de Programación, posted on a personal blog on 28 July 2013 with a request to pass it on. It gives 5 October 2013 as the date and eight host cities with their universities: Bahía Blanca, Buenos Aires, Córdoba, La Plata, Neuquén, Río Cuarto, Río Turbio and Santa Fe. It explains that teams of three students from higher-education institutions in Argentina solve a set of algorithmic problems in 5 hours with instant judging, that the tournament is part of the ACM-ICPC with official certificates, and that institutions may use it to select teams for the 2013 Latin American Regional, from which the selected Latin American teams go to the World Finals in Yekaterinburg in 2014. The post lists the general organiser and a local organiser per site, and points to a page of earlier problems. In Spanish; it holds no results or problems.
