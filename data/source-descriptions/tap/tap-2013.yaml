    Home page of the Asociación Argentina de Programación Competitiva, in Spanish. It explains what competitive programming is, gives a short history of Argentine participation in the ICPC, the Training Camp Argentina and the Torneo Argentino de Programación, and shows a calendar for 2026 with five events in a table. Menu links lead to the tournament, the training camp, the ICPC, the association and other pages.
