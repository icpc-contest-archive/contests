  description: |-
    Final scoreboard produced by BOCA, titled "Final Scoreboard", covering teams of Argentina, Brazil, Costa Rica and Mexico: 1178 teams in all, of which 760 carry the country code BR, 351 MX, 54 AR and 13 CR in their user names. Per team it gives rank, user name with country code, institution in brackets and team name, then fifteen problem columns A to O with the number of attempts and, for a solved problem, the time of the accepted run ("-" for an unsolved one), and a total of problems solved with penalty time in parentheses. The first team in the table is an Argentine team from FAMAF - UNC with 10 problems solved.

    Teams are repeated with a different rank in each appearance: every Argentine and Mexican team appears three times, 673 of the Brazilian teams three times and 87 four times, and the Costa Rican teams twice. Menu links lead to statistics, clarifications and the run list, which are not part of our copy. The Argentine teams are mixed with the others and have to be picked out by the AR code.
