    Final standings of the Torneo Argentino de Programación 2020: 53 teams with rank, team name, institution, number of problems solved, total time and a citation. The top team, Alt 4F of Universidad Nacional de Córdoba, solved 10 problems with a total time of 802. The first 28 places carry an ordinal citation (First Place to Twenty-eighth Place) and the remaining 25 teams are marked Honorable Mention; two teams share rank 52, with no solved problems and no time. There is no per-problem detail.
