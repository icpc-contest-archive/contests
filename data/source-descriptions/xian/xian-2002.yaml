    It holds nine problems numbered 1 to 9: Computing, Coding of Permutations, Cabric Number Problem, Number of Locks, Necklace of Beads, Quantity of White Mice, Color Change of Go Game Pieces, Placement of Keys and Selecting the Optimal Teaching Fiends. Each has a statement in English with the name of its input file (for example computing.in) and a sample input and output heading. No test data or solutions.
