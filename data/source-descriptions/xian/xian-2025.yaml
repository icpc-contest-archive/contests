  read: '2026-11-23'
  rubric: 1
  copy: xian/xian-2025/editorial/20261123-live-5dd96ccc/tutorials_zh-cn.pdf
  title: 第 50 届 ICPC 国际大学生程序设计竞赛 亚洲区域赛（西安）题解
  title_en: '50th ICPC International Collegiate Programming Contest, Asia Regional (Xi''an): Solutions'
  language:
  - zh
  problems: 13
  pages: 10
  description: |-
    Editorial as a PDF of 10 pages in Chinese, headed 第 50 届 ICPC 国际大学生程序设计竞赛 亚洲区域赛（西安）题解 (dì 50 jiè ICPC guójì dàxuéshēng chéngxù shèjì jìngsài Yàzhōu qūyùsài (Xī'ān) tíjiě, "50th ICPC, Asia Regional (Xi'an), solutions") and dated 19 October 2025; the pages after the first carry the running head "The 2025 ICPC Asia Xi'an Regional Contest Tutorials". No author is named.

    The first page has a table of how each problem fared at the on-site contest, among 417 teams with submissions, unofficial (starred) teams included: a percentage for G, L, J, F, I, B and M, and a number for C, K and A (17, 12 and 8) and for D, E and H (0). Then come solution write-ups for all 13 problems, A. Azalea Garden to M. Mystique as Iris, in letter order, most of them with a time complexity; the last write-up runs onto page 10.
