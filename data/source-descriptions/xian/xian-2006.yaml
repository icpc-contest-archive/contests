  description: |-
    Standings of The 2006 ACM Asia Programming Contest - Xian sponsored by IBM, on a page titled "View Standings": 117 team rows, each with a rank, a team entry written as institution and team name, a citation, number of problems solved and time. The first 58 rows carry a rank and a citation from First Place down to Thirtieth Place; the other 59 are listed under Honorable Mention with no rank, solved count or time. The first-place team, Peking University's T2, has five problems solved with a time of 870. There is no per-problem detail.
