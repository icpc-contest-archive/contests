    Single problem statement, a PDF of 2 pages headed "3784 - Digit Puzzle" with the region line "Asia - Xian - 2006/2007". Puzzles of the form a x b = c with some digits hidden; a puzzle with a unique solution is called good, and the task is to turn the given puzzles into good ones by changing as few characters as possible, printing the lexicographically first optimal result. There is one figure of two good puzzles. The statement is in English with input and output sections and a sample input and output; no problem letter is printed. Each page ends with the title and a page count (for example 1/2), and the last page carries the line "Xian 2006-2007" and a problemsetter credit.
