    Single problem statement, a PDF of 1 page headed "3782 - Bigger is Better" with the region line "Asia - Xian - 2006/2007". Given n matches and the number of matches each digit needs, make the biggest non-negative integer that is a multiple of m, printing -1 if there is none. There is one figure of the digits made from matches. The statement is in English with input and output sections and a sample input and output; no problem letter is printed. Each page ends with the title and a page count (for example 1/1), and the last page carries the line "Xian 2006-2007" and a problemsetter credit.
