  read: '2026-11-16'
  rubric: 1
  copy: xian/xian-2006/website/2026-09-05-wayback-9adb2dfa
  title: Welcome To Online Judge
  language:
  - zh
  - en
  description: |-
    Website of the Xidian ACM Online Judge (page title "Welcome To Online Judge"), in Chinese with some English, whose footers name the Xidian ACM Online Judge team and the HUSTOJ Project. Our copy holds 150 files saved between 2011 and 2025; five of them are stubs (a maintenance notice twice, a redirect, a wrong-verification-code script and a "No Such Contest!" message). Most are problem pages (116 addresses of the problem page, four of them "problem unavailable" notices); the rest are home pages, one of which carries a notice of a June 2015 monthly contest on the judge, problem set lists, user ranking lists, contest lists, a FAQ, login, mail and password pages, an account page that only asks the reader to log in, a compile-error page reading "No such code!" and two copies of the text of the GNU General Public License version 2.

    No saved page is about the 2006 Xi'an contest. The contest lists name the university's own events, such as freshman and school contests from 2015 to 2021; a 2021 home-page notice mentions the ICPC Asia regional contest in Nanjing only in passing. Many links lead to pages that are not part of our copy.
