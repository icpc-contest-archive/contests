  description: |-
    Single problem statement, a PDF of 2 pages headed "3781 - A Rod in a Path" with the region line "Asia - Xian - 2006/2007". A rod of length L has both endpoints on a path of alternating horizontal and vertical segments on a grid; the task is to compute the minimum distance endpoint A must cover to reach the rightmost endpoint of the path, or print -1 if that is impossible. There is one figure of the grid, path and rod. The statement is in English with input and output sections and a sample input and output; no problem letter is printed. Each page ends with the title and a page count (for example 1/2), and the last page carries the line "Xian 2006-2007" and a problemsetter credit.
