    Single problem statement, a PDF of 2 pages headed "3787 - Gargoyle" with the region line "Asia - Xian - 2006/2007". A water system of gargoyles, a reservoir and pipe connections, where each pipe has lower and upper speed bounds and a cost constant that multiplies its water speed; the task is to find the water speeds that minimise the total cost. There is one figure of a gargoyle. The statement is in English with input and output sections and a sample input and output; no problem letter is printed. Each page ends with the title and a page count (for example 1/2), and the last page carries the line "Xian 2006-2007" and a problemsetter credit.
