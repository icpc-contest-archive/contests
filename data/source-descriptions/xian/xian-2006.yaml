    Single problem statement, a PDF of 1 page headed "3786 - Fairies' Defence" with the region line "Asia - Xian - 2006/2007". For n fairies fixed at integer points in a box, with an attacker appearing at a uniformly distributed point of the box and rushing to the nearest fairy, compute for every fairy the probability of being attacked, to three decimal places. The statement is in English with input and output sections and a sample input and output; no problem letter is printed. Each page ends with the title and a page count (for example 1/1), and the last page carries the line "Xian 2006-2007" and a problemsetter credit.
