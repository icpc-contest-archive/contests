    Single problem statement, a PDF of 2 pages headed "3785 - Extraordinarily Tired Students" with the region line "Asia - Xian - 2006/2007". Students alternate between awake and sleeping periods described by three integers (a, b, c) each; the task is to compute the first time at which all students are awake, or -1 if that never happens. The statement refers to a table of an example, Table 1. The statement is in English with input and output sections and a sample input and output; no problem letter is printed. Each page ends with the title and a page count (for example 1/2), and the last page carries the line "Xian 2006-2007" and a problemsetter credit.
