    Single problem statement, a PDF of 2 pages headed "3783 - Collapse!!" with the region line "Asia - Xian - 2006/2007". A treasure box that works as a spaceship flies from left to right through a cave while rocks fall; the task is to find the minimal speed that gets it out without being hit, given each rock's radius, position and time of falling. There is one figure of a collision between the spaceship and a rock. The statement is in English with input and output sections and a sample input and output; no problem letter is printed. Each page ends with the title and a page count (for example 1/2), and the last page carries the line "Xian 2006-2007" and a problemsetter credit.
