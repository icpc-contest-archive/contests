    Single problem statement, a PDF of 2 pages headed "3788 - Hidden Music Score" with the region line "Asia - Xian - 2006/2007". Notes on a staff are erased down to their positions and the paper is rotated; given the rotated positions and the names of the first and last note, the task is to recover the original sequence of notes. There are two figures, of note names and of the transformation of the score into its hidden form. The statement is in English with input and output sections and a sample input and output; no problem letter is printed. Each page ends with the title and a page count (for example 1/2), and the last page carries the line "Xian 2006-2007" and a problemsetter credit.
