  description: |-
    Single problem statement of 1 page, headed "8053 Funny Numbers". A number is funny if the sum of its digits minus 1 is prime and the absolute difference between the sums of its first-half and second-half digits (central digit dropped when odd) is a perfect number; the task is to print Funny or Serious for each given number. The statement is in English with input and output sections and a sample input and output. The PDF prints no contest name, region or year, and no problem letter.
