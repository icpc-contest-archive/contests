  description: |-
    Website of the ACM chapter at GIK Institute, in English. Its ICPC page announces the 2020 ICPC Asia Topi Regional On-Site Contest at GIK Institute, Topi, with registration deadline, contest dates and fees marked to be announced. It also announces a preliminary Asia Topi online contest on 22-23 December 2020 (200 teams welcome), with its registration deadline, fees and registration steps.

    The page links five PDFs. Two are real in our copy: a 9-page problem set headed ACM-ICPC Programming Competition 2019, Day 2, with six problems, and a 2-page sample problem from an earlier Softcom. The other three (Day 1, a scorecard and a final scoreboard) are saved as a web page shell instead of PDFs. The site also holds the ICPC pages of the 2019 and 2018 editions, with their rules, and pages on ACM, Softcom, the chapter's team and participants. Our copy holds 15 web pages and the two PDFs, besides images, scripts and style sheets.
