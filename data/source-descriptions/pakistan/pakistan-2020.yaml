  description: |-
    Standings of the 2020 ICPC Asia Topi Regional On-site Contest: 22 teams with rank, team, institution, problems solved, total time, medal and two citation columns, which read GIK Institute Topi and Asia Topi on every row. Four teams are marked gold, four silver and four bronze, two Ranked and eight Honorable; the Honorable teams solved nothing and have no rank number. Ranks run from 1 to 13. First place solved four problems. No per-problem columns, attempts or per-problem times.
