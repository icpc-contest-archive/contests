  description: |-
    Event report "The 2025 ICPC Asia Topi Regional Onsite Contest", a PDF of 15 pages in English. It covers the online preliminary of 22-23 November 2025 (298 registered teams, 254 ranked, about 44 disqualified for plagiarism or use of AI tools) and the on-site contest held at three sites, GIK Institute in Topi (25 teams), IBA Karachi (24) and PUCIT Lahore (38): 87 teams of 261 contestants, a mock round on 31 January 2026 and the main contest on 1 February 2026. A table names the four gold-medal teams, led by champions Chai Walay of FAST-NUCES Karachi; twelve medals were given in all. It also covers participation by institution and gender, the jury, the closing ceremony, acknowledgments and sponsors.

    Pages 9 to 15 are photographs, most with captions, ending with an image of the scoreboard's top 12 teams. Two figures, the top 10 of the online round and the site-wise distribution of the jury, are images.
