  description: |-
    Problem set headed "The 2025 ICPC Asia Topi On-Site Preliminary Programming Contest": a PDF of 22 pages in English. The first page gives the contest instructions (DOMjudge for clarifications; C/C++, Java and Python3; flushing output in interactive problems; a ban on plagiarism and generative AI tools). Twelve problems follow, numbered 01 to 12, from FFT to The Sufi Trail Guardians; each has a time and memory limit and at least one sample; eleven have input and output sections, and problem 09, "Badshah ka Wazir kaun?", is interactive, with an interaction section and a sample interaction. Each page carries the footer "Asia – Topi 2026 February 1" with its page number. No solutions or test data.
