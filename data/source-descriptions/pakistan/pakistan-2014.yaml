    Front page of the website of the ACM-ICPC Asia Lahore Regional Contest 2014, in English, announcing that FAST-NU Lahore will host the first Pakistani ACM-ICPC regional, organised by NUCES-ACM, its ACM student chapter. It gives the event date as November 21-22, 2014 and a schedule: registration from 5 October to 6 November 2014, a first-round online contest on 9 November, results on 10 November, fees due 11 November, a full dress rehearsal on 21 November and the contest on 22 November 2014. It links registration through the ICPC site, an official poster, an invitation letter for universities, and rules for the World Finals, the regionals in general and the Lahore regional.

