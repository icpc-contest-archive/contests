  description: |-
    Standings headed ACM ICPC Asia Lahore Finals 2017 Standings, as a page of the UMT ICPC website: 86 teams with rank, university (with a country code in brackets), team name, number solved and total time. Ranks run from 1 to 39; the 49 teams with no problems solved share 39th place with time 0. First place solved three problems. There are no per-problem columns, no attempts and no medal marks.

    The page is surrounded by the university's site navigation and footer.
