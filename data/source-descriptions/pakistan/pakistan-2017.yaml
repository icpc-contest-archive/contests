  title: Welcome To The ACM ICPC Lahore Regional 2018
  language:
  - en
  description: |-
    Website of the ACM ICPC Lahore Regional, hosted by the Computer Science Department of the University of Management and Technology (UMT), Lahore, inside the School of Systems and Technology site. The ICPC pages are an introduction to the ICPC, a tentative registration procedure and rules for the 2018 regional (stated as held on 30 December 2018), a registration page, a contact page, and a downloads page that links to general regional rules, World Finals rules and a schedule; those linked files are not in our copy. They also hold two results pages: the Finals 2017 standings (86 teams) and the Online Round 2016 standings, a table of 101 rows with total time, university and a coach column, without team names. A Problem Sets page is headed for the 2017 regional but shows no problems itself; it links to a PDF that is not in our copy.

    Our copy holds 150 files, 134 of them HTML pages besides two error pages. Ten files are ICPC pages (the home page is held twice); the rest are the school's own pages (programmes, faculty, news, staff) and a few images and other files. The site is in English and the home page is the one for the 2018 edition, so this edition is represented by its standings page and problem-set page.
