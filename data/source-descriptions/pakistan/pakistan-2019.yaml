  description: |-
    Website of the ACM chapter at GIK Institute (ACM GIKI), in English. Its ICPC page announces the 2019 ICPC Asia Topi Regional On-Site Contest at GIK Institute, Topi: registration deadline 20 October 2019, contest dates 1-3 November 2019, fees per team for local and foreign students, registration steps, and a section for an online competition on PC^2 with links for Day 1 and Day 2 problems and scorecards and an image of scoring rules. A second ICPC page, linked as the 2019 team page, gives rules (teams of three, one PC per team, four hours, five to eight problems), the software allowed, the submission format, PC^2 v9 as the contest system and penalty-point scoring, and names GIKI Institute as site director. Its results link is an empty placeholder, and its problem set and answers files are not in our copy.

    The rest of the site covers ACM and its GIKI chapter, the Softcom events, a gallery and contact details. Our copy holds 150 files, but 24 are domain-expired parking pages and 8 are pages of an unrelated Chinese-language site from a later period. The day problem and scorecard links (ICPC_Day1, ICPC_Day2, ScoreCard3.0) are saved only as a JavaScript app shell page, not as PDFs; the only PDF is a two-page sample problem from the 15th Softcom, December 2014.
