  description: |-
    Standings of the 2019 ICPC Asia Topi Regional On-site Contest: 66 teams with rank, team, institution, problems solved, total time, medal and two citation columns, which read Topi and Asia West on every row. Gold, silver and bronze are marked for the first three teams; 38 teams are marked Ranked and 25 Honorable, the Honorable ones having solved nothing and carrying no rank number. Ranks run from 1 to 22. First place solved seven problems. No per-problem columns, attempts or per-problem times.
