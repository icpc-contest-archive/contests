  description: |-
    Problem set of "The 2024 ICPC Asia Topi Regional Final On-site Contest": a PDF of 11 pages in English. The first page gives the contest instructions (DOMjudge for clarifications; C/C++, Java and Python3; standard input and output). Nine problems follow, numbered 01 to 09: Circuit Design, Car Washing, Stock Trader's Dilemma, Calligraphy Crisis, BioDiversity Scan, ICPC Event Management - Optimizing Unique Event Tracking, Electoral Boundaries, Optimized Path Country and Ancestral Queries. Each has a time limit, a statement with input and output sections and a sample input and output; problem 05 has two samples. Each page carries the footer "Asia – Topi 2025 February-2025" with its page number. No solutions or test data.
