    Invitation letter from GIK Institute, a one-page PDF in English with the subject "Invitation to 'The 2024 ICPC Asia Topi Regional Contest' at GIK Institute, Topi", signed by the Regional Contest Director of ICPC Asia Topi. It announces the on-site contest for 1-2 February 2025 at the GIK Institute of Engineering Sciences and Technology, Topi, preceded by a preliminary online contest on 16-17 November 2024 for around 300 teams, from which the top 60 teams are to be invited on site. It gives the participation fees for both rounds, says the winning team qualifies for the 49th ICPC World Finals, lists earlier Pakistani World Finals appearances, and explains how to pay and register.
