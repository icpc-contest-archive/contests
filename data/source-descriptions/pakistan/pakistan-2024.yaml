  description: |-
    Event report "From Topi to the World Finals: 2024 ICPC Asia Topi Regionals Recap", a PDF of 10 pages in English. It says the GIK Institute organised the contest at three sites at once (GIK Institute, FAST-NUCES Lahore and FAST-NUCES Karachi), with a mock round on 1 February 2025 and the main contest on 2 February 2025: 101 teams from 14 universities (45, 46 and 10 at the three sites), chosen from 244 teams of the online preliminary of November 2024, competed on nine problems. It names Team Proxima of FAST-NUCES Karachi as champions and the four gold-medal teams that advance to the ICPC Asia West Continent Finals of March 7-8, 2025, lists the 14 universities, and covers the judging panel, the closing ceremony, guest speakers and sponsors.

    Pages 4 to 10 are photographs with captions; the last page also holds an image of the scoreboard's top 12 teams, headed "Results for ICPC Asia Topi 2024 Onsite Preliminary", with place, team, award, solved problems, total time and time of last submission (four gold, four silver and four bronze medals).
