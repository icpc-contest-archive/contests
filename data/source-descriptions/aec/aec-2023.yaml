  description: |-
    Announcement on Codeforces of Stage 23: Shanghai of The 2nd Universal Cup, a stage taking place on 17 February 2024. The post says the stage is based on The 2023 ICPC Asia East Continent Final Contest, the last contest in the Asia EC region of that season, in which 280 official teams took part onsite for the last World Finals slots. It thanks the problem setters and testers, describes the Universal Cup as a non-profit training organisation with more than 2600 registered teams, and lists links to registration, terms and ratings.

    The post contains no results and no problems. The page around the post is the standard Codeforces layout with rating and activity sidebars.
