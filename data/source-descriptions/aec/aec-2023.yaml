  description: |-
    Problem set in its Universal Cup edition: a PDF of 25 pages in English. The cover reads "The 2nd Universal Cup, Stage 23: Shanghai, February 17-18, 2024", says the set is based on the International Collegiate Programming Contest (ICPC) and states that it should contain 13 problems on 25 numbered pages.

    The 13 problems run from A "DFS Order 4" and B "Roman Master" through K "Best Carry Player 4", L "Binary vs Ternary" and M "Circular Route". Each has a statement with time and memory limits and one or more sample cases; twelve of them have separate input and output sections (problem J has neither heading), and eight have a note on the samples. No test data or solutions.
