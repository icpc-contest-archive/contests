    Standings page of the Universal Cup Judging System for The 2023 ICPC Asia East Continent Final Contest (EC-Final 2023), in the ICPC ruleset with 20 minutes penalty and the scoreboard frozen after 4:00:00. The contest is shown as ended, and the page has a "Show unofficial" option that is ticked.

    The table on the page is drawn by a script and is empty in the HTML, but the standings data is embedded in the page: 753 entries over problems A to M, each with a rank, a score, a time figure and a name (a handle, or a team name; 171 entries also carry an institution), plus the per-problem results. No medals are marked. The statements and tutorial are linked as attachments and are not part of our copy.
