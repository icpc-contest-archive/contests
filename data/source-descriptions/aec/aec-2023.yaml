    Contest dashboard on the QOJ online judge for "The 2nd Universal Cup. Stage 23: Shanghai", which the page says is also known as The 2023 ICPC Asia East Continent Final Contest (EC-Final 2023). It lists 13 problems A to M by name, from A "DFS Order 4" and B "Roman Master" to M "Circular Route", and states the rules used on the judge: ICPC ruleset, 20 minutes penalty, scoreboard frozen after 4:00:00. A notice of 2024-02-17 clarifies problem J. The statements themselves are not on this page: it links an English statements file and a Chinese tutorial as attachments, and the standings as separate pages.
