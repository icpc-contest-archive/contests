    Editorial slides by the problem-setting team, signed EC-Final 2023 命题组 (mìngtí zǔ, "problem-setting group"): a PDF of 57 slides titled "Tutorials", dated February 22, 2024, written in Chinese. It covers all 13 problems A to M in order, from the DFS-order counting problem A to the circular-route problem M. For each problem a slide restates the task in brief, with its input bounds for twelve of them (the interactive problem J gives a step bound instead), followed by one or more slides of solution ideas.
