  read: '2026-11-23'
  rubric: 1
  copy: aec/aec-2024/editorial/20261123-live-746e953b/tutorials_zh-cn.pdf
  title: ICPC Asia EC Final 2024 题解
  title_en: ICPC Asia EC Final 2024 Solutions
  language:
  - zh
  problems: 12
  pages: 43
  description: |-
    Solution slides titled ICPC Asia EC Final 2024 题解 (tíjiě, "solutions"), by the contest's problem-setting committee, ICPC Asia EC Final 2024 命题组 (mìngtí zǔ, "problem-setting group"), dated December 29, 2024 on the title slide. A PDF of 43 Beamer slides in Chinese, with a navigation bar for problems A to L on every slide.

    Each of the twelve problems, A Hitoshizuku to L Shiori, has a slide summarising its statement followed by one to five solution slides with the approach and its time complexity; the summary slides credit the problem authors. An opening slide asks readers not to pass the solutions on, as the contest would be run again as a Universal Cup stage a few weeks later. The last slide reads Thank you!
