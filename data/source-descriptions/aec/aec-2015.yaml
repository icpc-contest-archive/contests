  description: |-
    Final standings of the 2015 ACM-ICPC Asia EC-FINAL Contest: 185 teams, each with rank, team name, institution, problems solved, time and a citation in the form First Place, Second Place and so on. Tied teams share a rank and place, so the ranks run to 91. First place is Dreadnought of Shanghai Jiao Tong University with 9 solved and time 1227; the last group, ranked 91, includes teams with no problem solved.

    There is no per-problem detail and no attempt counts. The page states the number of teams in its header and refers to the ICPC year 2016.
