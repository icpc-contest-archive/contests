    Scoreboard of the 40th ACM-ICPC Asia EC-Final (Shanghai) Contest with 288 team rows, last updated Sun Dec 13 14:05:31 CST 2015. Columns are School Rank, Team Rank, EC Rank, Name (school, then team name and a team number), Solved, Time, tries and time for each of the 13 problems A to M, and a solv/att total. Each problem heading carries two numbers (A 274/643). A legend marks first-to-solve, solved and attempted cells and the gold, silver and bronze colours.

    EC Rank is a plain number on 89 rows, in parentheses on 81 rows and empty on 118 rows; 16 rows show -- in School Rank and Team Rank. The first row (9 solved, time 1159) has no EC Rank; the second (9 solved, time 1227) has EC Rank 1. School names are in Chinese; team names are in Chinese or English.
