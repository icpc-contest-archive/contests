    Ranklist of the 2015 EC-Final on a Chinese ACM/ICPC information site (headed 排行榜, páihángbǎng, "ranking"), with 288 teams: S# (a number on 128 rows, * on 16 rows, empty on the rest), school, Rk, team name with a team number, Slv., Time, and tries and time for each of the 13 problems A to M. The header shows a time stamp of 2015/12/14 20:37:10, the start 2015-12-13 09:00, and the medal counts as 26, 50 and 120 for gold, silver and bronze.

    The page also has a legend for first-to-solve, solved, attempted and pending cells, a skin switch, a team filter, and a left menu of links to the ranklists of other contests from 2008 to 2015. Those links, and the links on team names and problem letters, lead outside our copy.
