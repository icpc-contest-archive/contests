  description: |-
    Contest page of the 2015 ACM-ICPC Asia EC-Final Contest in the Codeforces gym, marked Finished. It lists 13 problems A to M (A Boxes and Balls, B Business Cycle, C Suffixes and Palindromes, D Change, E Colorful Floor, F Hungry Game of Ants, G Legacy of the Void, H Open Face Chinese Poker, I Champions League, J Dome and Steles, K Convex Polyhedron, L Multiplication Table, M November 11th), each with a time limit of 1 to 10 seconds, a memory limit of 256 MB and a count of solvers shown as x460 for A and so on. Under contest materials it links Statements (en) and Tutorial (en).

    Two announcements dated 2022-10-08 are shown: the limit on T for problems B and J is reduced to 50, and the sample of problem G should have T equal to 2. The statements and tutorial are links to other files that are not part of this page.
