  title: ACM大赛 > 首页
  title_en: ACM Contest > Home
  language:
  - zh
  pages: 27
  description: |-
    Website of the ACM contests at Shanghai University (上海大学), in Chinese, set up for the 2015 ACM-ICPC EC-Final held there. Our copy holds 27 pages. The menu has an introduction to the ACM/ICPC, news, schedule, travel directions, file downloads, organising committee, links and contacts. The news list has 12 items dated 2014-11-12 to 2015-12-18: registration and payment notices, the allocation of places per university, a security-check notice, a report that the university held the 40th ACM-ICPC EC-Final (2015-12-14), two ranking items and two videos. The home page lists the 2015 Chinese regional contests with dates (Changchun, Shenyang, Hefei, Beijing, Shanghai).

    Two articles are present in full: travel directions to the Baoshan campus from Pudong and Hongqiao airports and Hongqiao railway station, and the rules for qualifying to the EC-Final (top 35 universities in the mainland China Asia regionals, at most three teams per school, extra teams as unranked asterisk teams). The download page lists one file, the 2015 EC-Final invitation, dated 11/26/2015.

    The seed address returns an empty page, the schedule and committee pages hold only the menu, and nine captured news pages hold only a view count and a creation date, without article text. No results are in our copy. Some pages are not about the contest: a university page on course selection for autumn 2016, an International Exchange College page, and home and login pages showing only the university's navigation.
