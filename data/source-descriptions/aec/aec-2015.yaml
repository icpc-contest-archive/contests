  description: |-
    Solutions slides of the ACM/ICPC 2015 EC-Final: a PDF of 23 pages in English, with no author named. A practice round section covers three problems taken from Google APAC 2016 University Graduates Test Round D (A Dynamic Grid, B IP Summarization, C Virtual Rabbit), each with a one-line to short note. The EC-Final section then gives solution notes for the 13 contest problems A to M, in order, as short outlines of the method, formulas and complexity (for example the state of the DP for problem I). Each problem carries an Accepted count, for example 274 for problem A. The three slides for problem E hold only an image under the title. No problem statements.
