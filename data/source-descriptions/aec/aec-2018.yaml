    Final standings of the contest as a Codeforces gym, titled 2018-2019 ACM-ICPC, Asia East Continent Finals. The page shows places 1 to 200 of 445 rows: rank, team name, number solved, penalty, and one column for each of the twelve problems A to L with the number of wrong attempts and the solve time. A last row gives accepted and tried counts per problem. Moscow SU is first with 10 problems solved; places 2 to 5 have nine each. In 160 of the 200 rows the team name starts with an institution in brackets, mostly for Chinese teams; 32 others give team members after a colon.

