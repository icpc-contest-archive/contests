  description: |-
    Final standings of the 2017 ACM-ICPC Asia East Continent League Final as a DOMjudge scoreboard: 329 team rows and 13 problems labelled A to M, each header linking to its problem; the tooltips name them (A is Chat Group, M is World Cup). For each team it gives three rank columns (headed team / school / ec rank), a country flag, team name with its school, number solved, total time, and tries/minutes for each problem, with cell colours for first solve, solved and tried. Rows are shaded by category as in a legend of EC, Non-EC and Non-Official, so unofficial teams are mixed in and can be told apart; 27 rows have no overall rank. A summary row gives totals per problem. Team and school names are mostly in Chinese. The first row, without a rank, is a team with 11 problems solved and 1036; it is followed by Tsinghua University and Peking University teams with 11. The page says it was last updated on 17 December 2017 at 17:38 CST.
