  title: ACM大赛 > 首页
  title_en: ACM contest > home
  language:
  - zh
  description: |-
    Website of Shanghai University (上海大学, Shànghǎi Dàxué) for its ACM/ICPC contests, in Chinese, headed ACM大赛 (ACM dàsài, "ACM contest"). The menu has 竞赛简介 (jìngsài jiǎnjiè, "contest introduction"), 最新动态 (zuìxīn dòngtài, "latest news"), 日程安排 (rìchéng ānpái, "schedule"), 交通路线 (jiāotōng lùxiàn, "travel routes"), 文件下载 (wénjiàn xiàzài, "downloads"), 组委会 (zǔwěihuì, "organizing committee"), 相关链接 (xiāngguān liànjiē, "related links") and 联系方式 (liánxì fāngshì, "contact").

    The introduction describes the ACM/ICPC and its rules. The news page, the first of two, lists titles dated from 2015 to 26 December 2017, among them the 2017 EC-Final participant list, registration and payment notices, a security-check notice, the quota rule for Shanghai University and the live video of the contest. The downloads page lists English and Chinese invitation letters for the 2017 ACM-ICPC Asia East Continent League Final, dated 10/9/2017 as printed. The travel page gives routes from two airports and a high-speed rail station to the Baoshan campus, with metro hours. The links page lists the 2016 ACM-ICPC Asia CHINA-Final results and live video, the ICPC site and a professor's blog. The contact page gives a telephone number.

    Our copy is a snapshot taken in 2020 and holds nine pages. The schedule and committee pages contain only the menu; the news item pages, the invitation files and the travel images are not in it.
