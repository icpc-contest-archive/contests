    Standings of 210 teams, rebuilt on 2026-11-13 from the ICPC public API archive and not a copy of an original page. Each row gives rank, team name, institution, number solved, total time and a citation such as First Place. The Beihang University team three investigators is first with 10 problems and 1176; ranks run from 1 to 93, and 11 teams share the last rank with 1 to 3 problems solved. There is no per-problem detail. The header notes the ICPC year 2018 and that the data were fetched on 2026-04-26.
