    Contest dashboard of the Codeforces gym for the 2017-2018 ACM-ICPC Asia East Continent League Final (ECL-Final 2017), marked Finished. A table lists 13 problems with time and memory limits and, for 12 of them, the number of solvers: A World Cup, B Scapegoat, C Traffic Light, D Mr. Panda and Geometric Sequence, E Snakebird, F Good Number, G Image Recognition, H Mr. Panda and Birthday Song, I PLAYERUNKNOWN'S BATTLEGROUNDS, J Straight Master, K Downgrade, L SOS and M Chat Group. The page links to the English statements, submission, standings and the contest website, but the statements themselves are not in our copy, which was taken in November 2026 and also holds the site's menus and forms for announcements and questions.
