  pages: 8
  description: |-
    Website of the ACM contests at Shanghai University (上海大学), in Chinese. Most of its content concerns the 2017 EC-Final; the 2016 China-Final appears only in a few items. Our copy holds 8 pages: an introduction to the ACM/ICPC and its rules, a news list, travel directions to the Baoshan campus, file downloads, links, contacts, and schedule and committee pages that each show one image that is not in our copy.

    The news list (first of two pages) has 15 items from 2015-12-14 to 2017-12-26, mostly notices for the 2017 EC-Final (registration, payment, security check, participant list, places per university, videos); older items include a campus map and a restaurant note dated December 2016. The links page names the 2016 ACM-ICPC Asia CHINA-Final Contest results and a live broadcast of it, as links that lead outside our copy. The two downloads are invitation letters of the 2017 contest, in English and Chinese, dated 10/9/2017; the files are not in our copy. Style sheets are present; the pictures are not.
