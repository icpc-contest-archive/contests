  description: |-
    Final standings of the 2016 ACM-ICPC Asia CHINA-Final Contest: 184 teams, each with rank, team name, institution, problems solved, time and a citation in the form First Place, Second Place and so on. Tied teams share a rank and place, so the ranks run to 81. First place is New Meta of Shanghai Jiao Tong University with 10 solved and time 1267.

    There is no per-problem detail and no attempt counts. The page states the number of teams in its header and refers to the ICPC year 2017.
