    Solution slides as a PDF of 19 pages, titled "Solutions" and "ACM/ICPC 2016 China-Final". Problem headings are in English, the explanations in Simplified Chinese. A "Practice Round" part covers four practice problems A to D (Beautiful Numbers, Watson and Intervals, Clash Royale, Soldiers); the "Final Round" part has one slide per contest problem, A "Number Theory Problem" to L "World Cup", each giving the idea of the solution, some with its complexity, and the final-round slides carry "Submitted" figures given as two numbers (such as 28/114). No author is named.
