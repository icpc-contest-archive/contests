  description: |-
    Scoreboard of the 2016 ACM-ICPC Asia China-Final (Shanghai) Contest with 315 team rows, last updated Sun Dec 11 14:35:15 CST 2016. Columns are School Rank, Team Rank, EC Rank, Name (school, then team name and two slash-separated values), Solved, Time, tries and time for each of the 12 problems A to L, and a solv/att total. Each problem heading carries two numbers (A 313/390). A legend marks first-to-solve, solved and attempted cells and the gold, silver and bronze colours.

    EC Rank is a plain number on 80 rows, in parentheses on 67 rows and empty on 168 rows. 22 rows show -- in School Rank and Team Rank; nine of them have an asterisk in the name. The first row (11 solved, time 1069) has no EC Rank; the third row (10 solved, time 1267) has EC Rank 1. School names are in Chinese.
