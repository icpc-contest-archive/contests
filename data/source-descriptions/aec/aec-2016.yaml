    Contest page of the 2016-2017 ACM-ICPC CHINA-Final in the Codeforces gym, marked Finished. It lists 12 problems A to L (A Mr. Panda and Strips, B Hemi Palindrome, C World Cup, D Great Cells, E Bet, F Mr. Panda and Fantastic Beasts, G Pandaria, H Ice Cream Tower, I Cherry Pick, J Mr.Panda and TubeMaster, K Justice Rains From Above, L Number Theory Problem), each with a time limit of 1 to 15 seconds, a memory limit of 256 MB and a count of solvers shown as x205 for A and so on. Under contest materials it links Statements (en) and Tutorial (zh).

    The statements link points to a PDF in the gym and the tutorial link to an address on another site; neither file is in our copy.
