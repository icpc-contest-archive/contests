  description: |-
    Contest dashboard on the QOJ.ac online judge for The 4th Universal Cup. Stage 15: Grand Prix of China, which the page says is also known as The 2025 ICPC Asia East Continent Final Contest (EC-Final 2025); it is filed under ICPC / Regionals / Asia East Continent and under Universal Cup / The 4th Universal Cup. It lists twelve problems A to L by title, from Outstanding Outlines to Logical Resonance, each linking to its page on the judge, and gives the settings: ICPC ruleset, 20 minutes penalty, scoreboard frozen after 4:00:00.

    A note on the page says that a testing tool is available for problems G, K and L, and a rights notice in Chinese and English reserves the problem set to the SUA Programming Contest Problem-Setting Team. The attachments box offers the statements in English and tutorials in simplified Chinese. The statements themselves are not on this page.
