- url: https://icpcarchive.github.io/Asia-East-Continent/Asia-East-Continent-Final-Contest/The-2025-ICPC-Asia-East-Continent-Final-Contest/tutorials_zh-cn.pdf
  read: '2026-11-23'
  rubric: 1
  copy: aec/aec-2025/editorial/20261123-live-4e052360/tutorials_zh-cn.pdf
  title: 2025 ICPC 国际大学生程序设计竞赛 东亚区决赛（EC-Final）
  title_en: 2025 ICPC International Collegiate Programming Contest, East Asia Continent Final (EC-Final)
  language:
  - zh
  - en
  problems: 12
  pages: 45
  description: |-
    Editorial slides in simplified Chinese by the SUA 程序设计竞赛命题组 (SUA chéngxù shèjì jìngsài mìngtí zǔ, "SUA programming contest problem-setting team"), a PDF of 45 pages. The cover reads 2025 ICPC 国际大学生程序设计竞赛 东亚区决赛（EC-Final） (Guójì dàxuéshēng chéngxù shèjì jìngsài Dōngyà qū juésài, "International Collegiate Programming Contest, East Asia Continent Final") and is dated 2 February 2026.

    Pages 2 to 43 cover all twelve problems in order, A. Outstanding Outlines to L. Logical Resonance, each under its English title, from two to six slides per problem: a 题意 (tíyì, "problem summary") slide followed by the solution. Page 44, 补题与 Universal Cup (bǔtí yǔ Universal Cup, "upsolving and the Universal Cup"), says the problems will be used in the Universal Cup on 7 February 2026 and asks readers not to spread the contest materials; page 45 is a closing "Thank you!".
