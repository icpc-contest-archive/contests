  description: |-
    Final scoreboard of the contest, produced by DOMjudge and headed The 2019 ICPC Asia-East Continent Final Contest: 386 team rows with rank, team name (mostly in Chinese with an English name in brackets), institution, problems solved and penalty time, then one column per problem A to M. A solved cell gives the solve time in minutes and the number of tries; an unsolved cell gives the tries only. Cells are coloured for first solve, solved, tried and untried, and a last row gives totals per problem including the time of the first solve. A team tied with the one above it carries no rank number. A legend names the team categories Girls, Participants, post-graduate and Star. Three Hold Two of Tsinghua University is first with 9 problems solved. The page ends with a last-update line of 16 December 2019.

    Our copy holds the page only; the style sheets, scripts and institution logos it refers to are not in our copy.
