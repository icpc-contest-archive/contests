  description: |-
    Problem set of the online round as a PDF of 19 pages, in English. Every page carries the running header "ICPC 2020-2021, NERC - Northern Eurasia Finals" with "Online, December 13, 2020". There is no cover page: problem A starts on page 1. It holds 15 statements, A Almost Balanced Tree to O Optimum Server Location, in order. Each statement gives the input and output file, time limit and memory limit, the text of the problem, the input and output format (problem I, which is interactive, has an interaction protocol instead), and an example; some have a note. The last page holds problem O. No test data or solutions.
