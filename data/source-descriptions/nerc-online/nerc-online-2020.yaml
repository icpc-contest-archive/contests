  description: |-
    Standings of The 2020 Northern Eurasia Finals Online with 324 teams. Each row gives rank, team name, institution, number of problems solved, total time and a citation: First Degree Diploma (13 teams), Second Degree Diploma (26), Third Degree Diploma (63) and Honorable Mention (222). The first place, SPb HSE 1: Lemon Tree, solved 11 problems with total time 1386. Teams with the same result share a rank, and the 22 teams with no solved problem are all ranked 303. There are no per-problem columns and no attempt counts.
