  description: |-
    Contest page of the online round on Codeforces, in English, marked Finished. A table lists 15 problems, A Almost Balanced Tree to O Optimum Server Location, each with input and output type, time limit and memory limit; 14 of them also show a count of the form x509, problem H shows none. The page links the statements as a PDF and the tutorial as a PDF, both in English, and a contest website. Two announcements are shown: a general one saying the contest was held online because of COVID-19 restrictions and that teams were allowed to use three computers, and one on problem B with a link to its full second example.

    The linked files and the standings, submissions and status pages are not part of this page; they are links to other addresses.
