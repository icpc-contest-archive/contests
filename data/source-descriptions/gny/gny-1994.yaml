  title: ACM contest finals list
  language:
  - en
  description: |-
    Usenet thread in the newsgroup comp.org.acm titled ACM contest finals list, shown on a Google Groups page. Two messages, dated Jan 4 and Jan 7, 1995: the first asks who will compete in the International finals of the ACM programming contest, and the reply lists participants in the finals by region and asks for the missing ones to be added. The reply covers 16 regions, each with the area it covers; 15 give a contest date (two of them 'To Be Announced') and most give the contest sites, and many give a contact for the region. Twelve regions also list teams for the finals, some with a 2nd or 3rd place team.

    The Greater New York entry names November 12, 1994 as the contest date and SUNY Old Westbury as the site, and lists Columbia with Queens College as 2nd place. No scores or further teams are given for that region.
