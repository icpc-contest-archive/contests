  title: Columbia Students Participate in ACM Competition
  language:
  - en
  description: |-
    News article by John Wong, "Columbia Students Participate in ACM Competition", in English. It reports that a three-student Columbia team, picked in a tryout in October, won the regional competition held on Long Island for a region of New York, New Jersey and Connecticut, and will go on to the international contest of the ACM in Nashville, Tennessee, on March 1, 1995. The rest of the article explains how the contest works (five hours, seven problems, ranking by problems solved and then time), outlines two sample problems and describes the team's preparation and the prizes. It gives no other results of the regional: no scores, no other teams and no date for it. A photo at the top, kept in our copy, shows students at an Academic Olympiad during Engineering Week, not the contest.
