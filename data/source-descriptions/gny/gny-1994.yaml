  description: |-
    Usenet message in the newsgroup comp.org.acm, titled Greater NY regional and dated Nov 16, 1994, shown on a Google Groups page. The short text, signed by a graduate research assistant at Columbia University, gives the venue as Old Westbury, NY and ranks the first three teams: Columbia II, Queens College II and Queens College I. It adds that 20 teams participated, that Columbia advances to the International Finals, and asks readers to post other regional rankings. No scores, problems or full results are given.
