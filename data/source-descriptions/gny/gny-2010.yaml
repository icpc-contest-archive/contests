  description: |-
    Standings page of the contest, produced by PC^2 (9.1.6): 48 teams with rank, name, number solved, total time and, for each of the nine problems A to I, the number of attempts and the minute of the first correct solution. A last column gives total attempts and problems solved per team. Team names carry a tag in parentheses on most rows, for example Princeton 1 (S3). Princeton 1 is first with eight problems and 710 minutes; two teams that solved nothing share rank 47. A row above the teams gives submitted, first yes and total yes counts for each problem.
