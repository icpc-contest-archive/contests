    Baekjoon Online Judge category page for the contest, in Korean, filed under ICPC Regionals, North America, Greater New York Region. It lists nine problems, numbered 2684 to 2692 and labelled A to I, with Korean titles (problem F keeps the title I²C), the number of users who solved each, the number of submissions and the acceptance rate. Problem I is marked as a special judge problem. The page lists problems only, not their statements, and the counts are those of the day the page was saved.
