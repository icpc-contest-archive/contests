  description: |-
    Standings of the contest: 52 teams with rank, team name, institution, number of problems solved, total time and a citation. Princeton of Princeton University is first with eight problems and 710 minutes. The citation column gives First to Fifth Place for the top five and Top Freshman-Sophomore Team for rank 6; it is empty for the rest. The time column reads 0 for every team from rank 11 down, and the last four teams, which solved nothing, have no rank. There is no per-problem detail. The page header calls the contest ICPC year 2011.
