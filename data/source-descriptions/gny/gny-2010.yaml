  contest_date: '2010-10-24'
  description: |-
    Website of the 2010 ACM ICPC Greater New York Region contest, sponsored by the Greater New York Region and hosted by Rutgers University in Piscataway, NJ, on Sunday, October 24, 2010. The front page gives the schedule (registration and practice from 9 am, contestants' meeting at 11, contest from noon to 5 pm, awards at 5:30), the fee of $70 per team, payment and registration instructions, the contest environment (a bootable CD, with a download link) and the allowed languages (Ada, C/C++ and Java). It also lists the standings, problems and rules of earlier years back to 1997.

    Our copy holds three pages: the front page, the contest rules (registration dates, prizes, languages and compilers, conduct and judging) and the standings page. The problems page, which the front page links to, is not in it; that page was not retrieved when the site was saved. The pages of earlier years are not part of it.
