  description: |-
    Submission details of the Greater New York regional, 7 November 1999: a scoreboard of 39 teams, identified by team number only, against problems A to H, each cell giving the number of attempts and Y or N for whether the team eventually solved the problem. Below it a second grid gives the minute at which each team solved each problem. Above the grids, a table counts the 316 submissions by language (none in Pascal, 300 in C/C++, 16 in ADA) as 114 correct and 202 incorrect. The text says 39 teams competed, against 31 the year before, and that three teams solved no problem.

    Team numbers match the final standings page.
