  description: |-
    Website of the Greater New York region's 1999 regional contest, in English. The home page names the United States Military Academy at West Point, NY and Sunday, 7 November 1999, says the region covers schools from parts of New York, New Jersey and Connecticut, and links to the final standings, the problems and the submission details; it was last modified 12 November 1999.

    Our copy holds 4 pages and 17 other files: the home page, the final standings of 39 teams, the problems page, and the submission details page with a grid of attempts per team and problem and a grid of solve times. The problems page links eight Microsoft Word files, one per problem A to H, and eight judges' input files, all of which our copy holds, and the site's logo image is the 17th file.
