  description: |-
    Problems page of the regional, in English: solutions and secret data for thirteen problems labelled A to M, from A-Astackofgold to M-Smartpasswordvalidation. For each problem the table links a PDF statement, several judges' solution source files, a page of sample input and output and a page of the judges' secret input and output; one link gives everything zipped together. The page says the contest was held with the ECNA and NENA regions to form the East Division, that each problem gave a time limit per test case, and that programs were limited to 2 GB of RAM including the execution environment. A second table names the judges by region.
