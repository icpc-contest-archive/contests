  contest_date: '2024-11-10'
  description: |-
    Website of the 2024 ICPC Greater New York Regional Collegiate Programming Contest, in English, held on Sunday 10 November 2024 as microsites: each university hosted its own students instead of meeting at one site. Our copy holds 54 pages. The front page links the final standings, the problem set with judges' data and solutions, the microsite rules, a link to the official regional website, installation instructions for the contest image and a team photo upload form. It gives the schedule (Zoom opening and closing ceremonies, contest 11:00 to 16:00 Eastern), the team naming format and eligibility, and a list of earlier years back to 1997. A line on the page dates the results to Sunday 17 November 2024.

    Inside our copy are the rules page, a three-page PDF of microsite rules, a six-page technical notes PDF, the final scoreboard, and a problems page with the thirteen statements A to M as PDFs and sample and secret data pages. The zip of all problem material was too large to save, and of the individual secret data files only 11 input and 11 answer files of problem A were saved. The Zoom and image pages are on other servers and are not part of our copy.
