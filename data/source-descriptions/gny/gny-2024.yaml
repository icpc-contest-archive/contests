    Standings of the Greater New York regional: 83 teams with rank, team name, institution, problems solved, total time, medal and citation. The Medal column marks one team Gold, one Silver, one Bronze, 45 Ranked and 35 Honorable; the 35 Honorable teams carry no rank. Citations name the place (First Place and so on) for 41 teams and read Honorable Mention for 7 more; the 35 Honorable teams have no citation. There is no per-problem detail.
