    Final scoreboard produced by PC^2 for the Greater New York regional: 83 teams, thirteen problems labelled A to M. Each row gives rank, team name (for 81 of the 83 teams followed by the institution in parentheses), problems solved, total time in minutes, and for each problem the number of attempts and the minute of the first accepted run (-- in place of the minute means no accepted run), plus a total of attempts and solved. The first five teams solved eleven problems; the three teams with no solved problems share rank 81. A last row gives submitted, first-yes and total-yes counts per problem. The footer reads 'Last updated Sun Nov 10 22:33:14 UTC 2024'.
