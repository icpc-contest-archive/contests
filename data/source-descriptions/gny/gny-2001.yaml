  description: |-
    Final standings of the 2001 Greater New York Regional contest, 39 ranked rows with rank, team (preceded by a team number), solved, penalty and set, then four teams listed as Honorable Mention without a rank, 43 teams in all. First place is Cornell Big Red JLM with 7 solved and a penalty of 993; Brooklyn College B and NYU 1 share third place. Text above the table congratulates the winners, names Stevens Institute of Technology team 1 as the top freshman-sophomore team (fifth place overall), and announces a rule for next year that teams within 3 minutes on the same number solved tie. No per-problem detail or attempt counts. Last updated 4 November 2001.
