  description: |-
    Website of the ACM Greater New York Region for its 2001 regional contest, held on Sunday 28 October 2001 at Nassau Community College in Garden City, NY. The home page is a short welcome stating that the region covers schools from parts of New York, New Jersey and Connecticut, with two links: final standings and problems.

    Our copy holds 3 pages: the home page, the final standings page (39 ranked teams plus four Honorable Mentions) and the problems page for problems A to I. Beside them are the judges' input files and correct output files for the nine problems, and a zip archive of the nine statements as PDFs.
