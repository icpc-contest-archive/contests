    Standings of 47 teams with rank, team name, institution, number of problems solved, total time and a citation. The first 41 rows carry a rank and a citation running from First Place to Twenty-third Place, followed by Honorable Mention; six teams with 0 solved at the end have no rank and no citation. Columbia 1 (Columbia University) is first with nine problems solved and a time of 678. There are no per-problem columns. The ranks as printed go from 9 to 11 without a 10, and two teams share rank 12.
