    Page of the Baekjoon Online Judge, in Korean, listing the ten problems of the 2012 Greater New York contest, labelled A to I and X and numbered 3943 to 3952 on the judge. For each problem the table gives the title (Korean for A, B, D, E and F; the English title for the other five), the number of users who solved it, the number of submissions and the acceptance ratio; problem G is marked as a special judge problem. The page is filed under ACM-ICPC Regionals, North America, Greater New York Region. It lists the problems only; the statements are on the linked problem pages, which are not in our copy. The counts are those of the time of capture.
