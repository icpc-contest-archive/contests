  title: 2012 ACM ICPC Greater New York Region
  language:
  - en
  contest_date: '2012-10-28'
  description: |-
    Website of the 2012 Greater New York regional contest, in English. The front page gives the date (Sunday, October 28, 2012), the host (Stony Brook University, Stony Brook, NY), the approximate schedule from registration at 9 am to the awards presentation at 5:30 pm, the fee of $70 per team, the payment instructions, the programming languages (Ada, C/C++ and Java) and a link to the contest CD image. It also lists the previous years from 1997 to 2011 with links to their standings and problems pages (and, for 2010 and 2011, rules pages).

    Our copy holds 16 pages: the front page, the rules page, the problems page and the standings page (the last two saved twice, under two spellings of the host name), and ten problem statements as PDFs (A to I and X, two pages each except I with three). Beside them are the judges' files linked from the problems page: a zip with all problems, ten solution files and nine of the ten input files; b.in is not in our copy. The links to the earlier years lead outside our copy.
