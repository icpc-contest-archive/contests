    Scoreboard produced by CSUS PC^2 (version 9.2), headed "Summary - Stony Brook Contest": 42 teams ranked 1 to 42, with ten problems labelled A to I and X. Each row gives rank, team name, number solved and total time, then for each problem the number of attempts and the time of the accepted run ("--" where there is no accepted run), and a total of attempts and solved. 36 of the 42 team names end in a suffix S1, S2 or S3 in parentheses. A summary row gives, for each problem, the submissions, the time of the first yes and the total yeses. Columbia 1 is first with nine problems solved and a time of 678. The page states it was last updated on Sun Oct 28 16:48:49 EDT 2012.
