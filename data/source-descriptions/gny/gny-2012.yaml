    Problems page of the contest website, in English: ten problems labelled A to I and X (Hailstone HOTPO, B-Casting, Pen Counts, Maximum Random Walk, Faulhaber's Triangle, The King's Ups and Downs, Mad Veterinarian, Windmill Animation, Push-To Telescope, Mystery). Each problem links to its statement as a PDF, the judges' solution in C or C++ and the judges' input file; one link gives all problems in a zip. There is no column of correct output. The page states that problems, solutions and data are released under a Creative Commons Attribution-NonCommercial-ShareAlike 3.0 licence.
