  description: |-
    Contest page on the QOJ.ac online judge for the Greater New York contest: a list of ten problems labelled A to J (Cornhole, Sum of Remainders, Quotdoku, Counting Pythagorean Triples, Clarissa's Conical Cannolis, Busy As a Bee, Linked Triangles, You You See What?, Caravan Trip Plans, PSET), each linking to a problem page on the judge. The notice and questions tables are empty. The page shows the contest as ended with the ICPC ruleset, a 20-minute penalty and a limit of 1000 submissions per problem, and says a virtual contest is in progress with a button to start participating. Links lead to the judge's submissions and standings pages, which are not part of our copy, and neither are the statements.
