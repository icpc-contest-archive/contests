    Final scoreboard produced by PC^2 for the Greater New York regional: 78 teams, ten problems labelled A to J. Each row gives rank, team name with the institution in parentheses, problems solved, total time in minutes, and for each problem the number of attempts and the minute of the first accepted run (1/3 means one attempt, solved at minute 3; -- in place of the minute means no accepted run), plus a total of attempts and solved. The first two teams solved ten problems; the three teams with no solved problems share rank 76. A last row gives submitted, first-yes and total-yes counts per problem. The footer reads 'Last updated Sun Feb 26 21:03:00 EST 2023'.
