  copy: gny/gny-2022/website/2026-09-04-live-653f3cbc
  title: 2022 ICPC Greater New York Region
  language:
  - en
  contest_date: '2023-02-26'
  description: |-
    Website of the 2022 ICPC Greater New York Regional Collegiate Programming Contest, in English, hosted by Sacred Heart University at its West Campus in Fairfield, CT, on Sunday 26 February 2023. Our copy holds 89 pages. The front page names the regional champion and the four other teams advancing to the ICPC North America Championship in Orlando, Florida, and links to the final results, the team photos and a photo album. It gives the schedule of the day, the team naming format, eligibility rules, the fee, a link to the contest rules, and a list of earlier years back to 1997 with links to their standings or problems.

    Inside our copy are the rules page, the final scoreboard and a "Full Info" page of it, the problem set page with the ten statements as PDFs, sample and secret data pages for each problem and a zip of problems, solutions and data, a five-page technical notes PDF, a one-page parking map PDF, and team photo pages with 43 team photographs (the front page also carries a photograph of the medals).

    The front page embeds a video of the last hour of submissions from another server; it is not part of our copy. Photo pages from number 43 on, and their images, were not saved.
