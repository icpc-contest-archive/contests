  title: 2009 ACM ICPC Greater New York Region
  language:
  - en
  contest_date: '2009-10-18'
  description: |-
    Website of the 2009 ACM ICPC Greater New York Region contest, sponsored by the Greater New York Region and hosted by Hofstra University in Hempstead, NY, on Sunday, October 18, 2009. The front page gives the schedule (registration and practice from 9 am, contestants' meeting at 11, contest from noon to 5 pm, awards at 5:30), the fee of $70 per team, payment and registration instructions, the contest environment (a bootable CD, with a download link) and the allowed languages (Ada, C/C++ and Java). It also lists the standings, problems and rules of earlier years back to 1997.

    Our copy holds 13 pages: the front page, the contest rules (eligibility, registration dates, prizes, languages and compilers, conduct and judging), the problems page and the standings page, and nine problem statement PDFs (A to I, one to three pages each). It also holds the judges' solutions in C, C++ and Java, the judges' input and output files and a zip of all problems. The pages of earlier years are not part of it.
