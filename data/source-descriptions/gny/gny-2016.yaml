  description: |-
    Final scoreboard of the Greater New York Region contest produced by CSUS PC^2 9.3.3: 48 teams, ten problems A to J. Each team row gives rank, team name, number solved, total time, and for each problem the number of attempts and the minute of the first accepted run (0/-- for unsolved), with a total of attempts and solved problems. Princeton 1 is first with 10 solved. The last row of the table gives, for each problem, submissions, the minute of the first yes and total yes runs. Team names are given without institution or country.

    Above the table the page names three special prizes of this year: Lightning Coders, The Last Say and Persistent Debuggers. The page ends with an update stamp of Sun Nov 13 17:34:46 EST 2016.
