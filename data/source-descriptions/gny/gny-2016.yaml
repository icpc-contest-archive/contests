  title: 2016 ACM ICPC Greater New York Region
  language:
  - en
  contest_date: '2016-11-13'
  description: |-
    Website of the 2016 ACM ICPC Greater New York Region contest, sponsored by IBM and hosted by the Manhattan College Department of Computer Science in the Bronx, in English. The front page gives the date (Sunday, November 13, 2016), the day's schedule from registration at 8:30am to closing ceremonies at 6:30pm, the computing environment (Fedora Core 24, one computer per team, C/C++/Ada, Java and Python), registration instructions with a deadline of October 24, and the cost of $75 per team plus $30 per guest. It also lists earlier contests from 1997 to 2015 with their host institutions.

    Our copy holds 14 pages: the front page, the rules page, the final standings page, the problems page and ten problem statements as PDFs (A to J), together with the judges' solution and data files linked from the problems page. The rules page is the general and region-specific rules text and still shows prizes and registration information as to be announced. The links to earlier years lead outside our copy.
