  description: |-
    Website of the 2014 ACM ICPC Greater New York Region contest, hosted by St. Joseph's College, Patchogue, NY, in English. Our copy holds 13 pages: the home page with the schedule (registration and practice from 9 am, contest from noon to 5 pm, awards at 5:30 pm), the cost per team, the environment (a bootable USB, languages C/C++ and Java) and a list of earlier years from 1997 to 2013; a rules page; a standings page; and a problems page that links nine problem statements as PDFs (A to I, one or two pages each).

    The problems page also links the judges' solutions, input files and output files for the nine problems, and a zip of all problems. The standings page is the final scoreboard of 45 teams. The links to earlier years lead outside our copy.
