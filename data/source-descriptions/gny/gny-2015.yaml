  description: |-
    Website of the 2015 ACM ICPC Greater New York Region contest, hosted by the Queens College Department of Computer Science in Flushing, Queens, in English. Our copy holds 13 pages: the home page with the schedule (registration from 8:30 am, practice, opening ceremonies, contest from noon to 5 pm, closing ceremonies), the computing environment and languages (C/C++/Ada, Java, Python), registration steps, the cost per team and a list of earlier years from 1997 to 2014; a rules page; a standings page; and a problems page that links nine problem statements as PDFs (A to I, one or two pages each).

    The problems page also links the judges' solutions, input files and output files, and a zip of all problems. The standings page is the final scoreboard of 49 teams. The links to earlier years and to the ICPC registration site lead outside our copy.
