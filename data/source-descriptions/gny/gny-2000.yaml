  description: |-
    Problem set as a PDF of 13 pages. The first page is a printout of the ICPC home page from early 2001 (announcing the 2000 regional results and the 2001 World Finals); the other 12 pages hold the eight statements, A to H: u Calculate e, Problem Bee, Digital Roots, Scramble Sort, A Well-Formed Problem, Entropy, N-Credible Mazes and SPF. Each statement is headed with the contest name and has a background, an example and an output section; all but problem A, which takes no input, also have an input section. Problems B, E, F and H run to two pages. No test data or solutions.
