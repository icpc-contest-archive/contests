  description: |-
    Website of the ACM Greater New York Region for its 2000 regional contest, held on Sunday 5 November 2000 at Kean University in Union, NJ. The home page is a short welcome stating that the region covers schools from parts of New York, New Jersey and Connecticut, with two links: final standings and problems.

    Our copy holds 11 pages: the home page, the standings page (41 teams with rank, set, team, solved and penalty), the problems page, and eight problem statements as PDFs of one or two pages, A to H. The problems page also links the judges' input files (seven) and correct output files (eight), which are in our copy. The page is in English.
