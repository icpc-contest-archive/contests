  description: |-
    Final standings of the 2000 Greater New York Regional contest, 41 teams ranked 1 to 41, with the columns Rank, Set, Team, Solved and Penalty. First place is Poly Gone with 6 solved and a penalty of 677; Cornell GJM also solved 6. The page states that 41 teams competed and names Cooper Pioneers 3 as the top team of only freshmen and sophomores. Set is a number from 1 to 3 for most teams and a question mark for two. There is no per-problem detail and no attempt counts. The page was last updated 9 November 2000.
