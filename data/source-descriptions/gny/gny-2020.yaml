  description: |-
    Official results of the 2020 ICPC Greater NY Regional Competition, produced by CSUS PC^2 9.7.0 and last updated on Tuesday, March 9, 2021. The table lists 55 teams with rank, team name, problems solved, penalty time, the attempts and minute of the first accepted run for each of the problems A to L ("--" in place of the minute when the problem is unsolved), and a total of attempts and solves. A closing row gives submissions, time of the first yes and number of yes runs per problem.

    A legend colours rows: 17 teams are marked green as advancing to the NADC on April 22, 2021, and 5 are marked yellow as not advancing because two other teams from their school already did. Princeton-Team C is first with 10 problems solved in 1046 minutes. Institutions are not shown.
