  description: |-
    Problem set page of the 2020 Greater New York regional, held online on Sunday, March 7, 2021 (the page title says 2018, the heading says 2020). A table lists twelve problems A to L (BottleReturn, ComfyDeviations, ArthursTable, MagicDrone, Marbles, ChocolateBarGame, ThreeTriangles, ICPCStandings, TernaryMachine, CardinalAdjacencies, SternSeq, EvenlySeparatedStrings) with links to the PDF statement, the judge's solution source files (two for problems C, E and L) and the judge's input and output data. A link offers everything as one zip file. The text places the material under a Creative Commons Attribution-NonCommercial-ShareAlike 3.0 license and says the statements include the clarifications sent during the contest.

    The copy of this page holds only the page and its images; the statement PDFs and the zip file are held in our copy of the website.
