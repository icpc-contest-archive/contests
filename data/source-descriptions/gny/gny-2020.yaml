  title: 2020 ICPC Greater New York Region
  language:
  - en
  contest_date: '2021-03-07'
  description: |-
    Website of the 2020 ICPC Greater New York Regional Collegiate Programming Contest, which was an online contest on Sunday, March 7, 2021, in English. The home page links to the official results and to the problem set with solutions and judge's data, and explains the rules for the online format: teams use their own computers, one per contestant, communicate only among themselves, may use public online resources, and must be ready to meet the judges by video within 10 days if they advance. It gives the schedule (practice contest 10:00 AM, contest 11:00 AM to 4:00 PM, Zoom webinars for the ceremonies), team naming rules and a list of links to the pages of earlier years.

    Our copy holds 146 files from 150 addresses (four returned errors): the home page, the rules page, the official results page, the problem set page, the 12 problem statements as PDF files, 15 judge solution source files, one zip file of the problems, solutions and judge data (614 entries), and directory listings of the judge data of all twelve problems, with 42 of the input files and 43 of the answer files saved individually. The links to the pages of earlier years and to the contest image lead to pages that are not in our copy.
