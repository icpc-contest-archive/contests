  description: |-
    Final standings of the contest: 58 teams, nine problems A to I. Each row gives rank, team name (school and team number, with a set mark S1, S2 or S3), problems solved, total time, and for each problem the number of submissions and the time of the first correct one, with -- for unsolved, plus a total column headed att/solv. A last row gives, per problem, the submissions, the time of the first correct one and the number of correct ones. Rutgers 2 is first with eight problems solved.

    The page explains the S1 (freshmen and sophomores only), S2 (undergraduates only) and S3 (with graduate students) sets and names Yale 3 as the best S1 team.
