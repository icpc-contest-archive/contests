  description: |-
    Website of the 2006 ACM Greater New York Regional Collegiate Programming Contest, in English: held on Sunday, October 29, 2006 at Nassau Community College, Garden City, NY, with AdaCore and Google named as sponsors. The home page is a short welcome text with links to the final standings, the problems and the contest rules.

    Our copy holds 13 pages: the home page, the standings page (58 teams, problems A to I), the problems page, the rules page and nine PDF problem statements, one per problem A to I. The rules page covers the differences from the previous year, eligibility, registration and fees, prizes, personnel, conduct, electronic submission with PC^2 and judging; it gives the site's capacity as 73 teams. The files linked from the problems page are also in our copy: a zip of all problems, the judges' solutions (nine in C++, plus a Java zip and a Snobol file as alternatives for two problems, and a header file for problem E), nine input files and nine output files.
