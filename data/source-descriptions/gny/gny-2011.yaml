    Scoreboard produced by CSUS PC^2 (version 9.2): 50 teams ranked 1 to 50, with problems A to I. Each row gives rank, team name, number solved and total time, then for each problem the number of attempts and the time of the accepted run ("--" where there is no accepted run), and a total of attempts and solved. 42 of the 50 team names end in a suffix S1, S2 or S3 in parentheses. A summary row above the teams gives, for each problem, the submissions, the time of the first yes and the total yeses. Princeton 1 is first with nine problems solved and a time of 840. The page states it was last updated on Sun Oct 30 17:23:32 EDT 2011.
