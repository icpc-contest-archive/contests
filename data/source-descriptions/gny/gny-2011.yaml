  title: 2011 ACM ICPC Greater New York Region
  language:
  - en
  contest_date: '2011-10-30'
  description: |-
    Website of the 2011 Greater New York regional contest, in English. The front page gives the date (Sunday, October 30, 2011), the host (Adelphi University, Garden City, NY), the approximate schedule from registration at 9 am to the awards presentation at 5:30 pm, the fee of $70 per team, the payment instructions, the programming languages (Ada, C/C++ and Java) and a link to the contest CD image. It also lists the previous years from 1997 to 2010 with links to their standings and problems pages (and, for 2008 to 2010, rules pages).

    Our copy holds 13 pages: the front page, the rules page, the problems page, the standings page, and nine problem statements as PDFs (A to I, one to four pages each). Beside them are the judges' files linked from the problems page: a zip with all problems, and solution, input and output files for each problem. The rules page covers eligibility, registration, prizes, the electronic submission with PC^2 and the judging. The links to the earlier years lead outside our copy.
