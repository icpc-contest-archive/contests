  description: |-
    Final standings of the contest: 66 teams, nine problems A to I. Each row gives rank, team name (school and team number, with set marks S1, S2 or S3 on most rows), problems solved, total time, and for each problem the number of submissions and the time of the first correct one, with -- for unsolved, plus a total of attempts and solved problems. A last row summarises each problem. NYU 3 is first with six problems solved; two teams, NYU and Rutgers, are announced as going to the World Finals in Shanghai.

    The page also gives counts of submitted and correct runs by language (Ada, C, Java, C++) with the share correct, and explains the S1 (freshmen and sophomores only), S2 (undergraduates only) and S3 (with graduate students) sets; Yale 2 is named as the best S1 team.
