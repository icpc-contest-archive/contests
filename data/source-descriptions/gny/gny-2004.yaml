  description: |-
    Website of the 2004 ACM Greater New York Regional Collegiate Programming Contest, in English: held on Sunday, November 14, 2004 at Iona College, New Rochelle, NY and Stevens Institute of Technology, Hoboken, NJ. The home page is a short welcome text saying the region covers parts of New York, New Jersey and Connecticut, with links to the final standings and the problems.

    Our copy holds 12 pages: the home page, the standings page (66 teams, problems A to I), the problems page and nine PDF problem statements, one per problem A to I. The files linked from the problems page are also in our copy: a zip of all problems, nine judges' solutions (eight in C++ and one in Java), nine input files and nine output files. The link to a page of submission details leads to a page that is not in our copy.
