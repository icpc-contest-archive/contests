    Problem set page of the contest site, headed Problem Set for Greater New York 2018 Regional: ten problems A to J, from Potato Sacks to Pinemi Puzzles, each linked to its statement as a PDF. A table links, for each problem, the judges' solution source file (two for problem B), the judges' input file and the judges' output file; problem B also has a graphical visual aid program in an Extra column. A link gives everything zipped together, and the page states that problems, solutions and data are released under a Creative Commons Attribution-NonCommercial-ShareAlike 3.0 license. The ten PDF statements are one or two pages each (two of one page, eight of two pages) and are in our copy as part of the site.
