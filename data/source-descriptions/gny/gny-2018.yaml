    Final standings of the Greater New York Regional Contest: 70 teams with rank, team name, institution, number of problems solved, total time, a medal column and a citation. Kington of Columbia University is first with 8 solved in 893 minutes (Gold Medal), followed by Princeton 1 (Silver Medal) and Cornell i^2 (Bronze Medal). 54 further teams are marked Ranked with a place citation, up to Honorable Mention at rank 37; the 13 teams with no problems solved are marked Honorable and have no rank. No per-problem results.
