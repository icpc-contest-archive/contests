  description: |-
    Final scoreboard of the Greater New York Region contest produced by CSUS PC^2 9.5.4: 70 teams, ten problems A to J. Each row gives rank, team name, number solved, total time, and for each problem the number of attempts and the minute of the first accepted run (0/-- for unsolved), with a total of attempts and solved problems. 67 of the 70 team names link to team photos. Teams with the same result share a rank; the 13 teams with no problems solved share rank 58. A last row gives per problem the submissions, the minute of the first yes and total yes runs; it shows no accepted run for problems B and I. Columbia - Kington is first with 8 solved in 893 minutes.

    The page states that Columbia - Kington are the regional champions for 2018 and ends with the update stamp Sun Nov 18 16:39:46 EST 2018. Team names are given without institution or country.
