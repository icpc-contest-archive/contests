  title: 2018 ICPC Greater New York Region
  language:
  - en
  contest_date: '2018-11-18'
  description: |-
    Website of the 2018 ICPC Greater New York Region contest, hosted by the Manhattan College Department of Computer Science in the Bronx, in English. The front page names the champions (Columbia - Kington), second place (Princeton 1), third place (Cornell i^2), a top sophomore/freshman team and a top rookie team, and links to team photos and event photos. It gives the day's schedule with campus locations, parking and a campus map, name badge rules, the languages (C/C++/Ada, Java, Python and Kotlin), eligibility, registration with a deadline of Friday, November 2, 2018, a cost of $150 per team plus $50 per guest payable by check, two mock practice contests, and a list of earlier contests from 1997 to 2017.

    Our copy holds 15 pages: the front page, the rules, the final standings, the problems page, a page of instructions for burning the contest image to a USB drive, and ten problem statements as PDFs (A to J). It also holds 72 photos as JPEG files, most of them team photos linked from the standings, and the judges' solution and data files linked from the problems page. Links to earlier years and to the photo albums lead outside our copy.
