  description: |-
    Final standings of the contest on the organisers' page: a scoreboard of 54 teams, ranked, with columns for name, problems solved and penalty time, then one column for each of the nine problems A to I and a Total column. A problem cell reads submissions / penalty time, with -- as the time when the problem was not solved. The Total column holds two numbers per team (20/7 for the first team: 20 submissions, 7 correct), although the note on the page gives the order as correct / total. A last row gives, for each problem, attempts, correct submissions and the penalty time of the first submission. Tied teams share a rank; first place is Cornell 1 with seven problems solved.

    Each team name carries a set tag: S1 for teams of freshmen and sophomores only, S2 for teams of undergraduates only, S3 for teams with one graduate student. A note above the table congratulates the top freshman-sophomore team.
