  description: |-
    Zip archive of the nine problem statements as PDF files, one for each of problems A to I (Four Quarters, The Drunk Jailer, Lingo, Number Base Conversion, Unimodal Palindromic Decompositions, Extended Lights Out, Dehuff, Picture Puzzle, Strictly Inscribed Similar Triangles). The statements are in English and run from one to three pages each, 17 pages in all. Each carries the problem letter and title and the footer Greater New York Regional.

    Each statement has the problem text with an Input and an Output section; eight of the nine end with an Example of input and output. Problem A has no input file and gives only rounds 1 to 3 of the expected output table instead. The archive holds no test data and no solutions.
