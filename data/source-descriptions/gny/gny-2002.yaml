  description: |-
    Category page of Baekjoon Online Judge, in Korean, titled 2002 Greater New York Programming Contest and filed under ICPC Regionals, North America, Greater New York Region. It lists nine problems A to I, numbered 6358 to 6366 on the judge, with columns for problem number, label, title, number of users who solved it, number of submissions and acceptance percentage. Titles are in English except problem B, which has a Korean title, and problem C, shown as L-I-N-G-O: LINGO.

    The page is a list of the judge's problems with its solved and submission counts at the time of capture; it holds no statements, and the problem pages are not part of our copy. The date of the contest is not given.
