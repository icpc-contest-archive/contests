  description: |-
    Website of the 2002 ACM Greater New York Regional Collegiate Programming Contest, in English. The home page names Barclay's Capital Management as sponsor, gives Sunday, November 3, 2002 and Columbia University in New York as date and place, says the region draws schools from parts of New York, New Jersey and Connecticut, and links to two pages.

    Our copy holds three pages: the home page, a final standings page with 54 teams, and a problems page for nine problems A to I. The problems page links one zip archive with the nine problem statements as PDFs, eight judges' input files (problem A has none) and nine correct output files. All of these files are in our copy, together with one image.
