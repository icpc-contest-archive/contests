    Standings page of the contest with the same scoreboard as the organisers' page: 54 teams with rank, name, solved, penalty and a submissions / time cell for each of problems A to I, a Total column and a last row of figures per problem. The set tags S1, S2 and S3 and the note on the top freshman-sophomore team are the same. The page title reads 2002 ACM Greater NY Regional Contest Problems, and its footer says it was last updated 6 November 2002.

    The table rows are identical to the other copy. This copy differs in the title, in naming IBM as a sponsor beside Barclay's Capital Management, in a link back to the 2002 contest page, and in lacking the note on how to read the Total column. No images are stored with our copy.
