  description: |-
    Problem set page of the 2019 Greater New York regional (the page title says 2018, the heading and the date line say 2019). A table lists eleven problems A to K by short name (FYI, Remdoku, PassTheBuck, Roundness, CircleGarden, BelochFold, CollatzSeq, ProblematicPublicKeys, Ratbase, Unicycles, TeamNames). For each there are links to a PDF statement, the judge's solution source file and the judge's input and output data; problem F also has a validator. A link offers everything zipped together, and the text says the material is released under a Creative Commons Attribution-NonCommercial-ShareAlike 3.0 license and that the statements include the clarifications sent during the contest.

    Our copy holds only this page with its logo and license images. The statement, solution and data files it links to are not in it.
