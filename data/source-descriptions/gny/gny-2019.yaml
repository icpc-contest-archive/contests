  description: |-
    Final standings of the 2019 Greater New York regional, produced by CSUS PC^2 9.6.0 and last updated on Sunday, October 27, 2019 at 16:45 EDT. The table lists 66 teams with rank, team name, problems solved, penalty time, and for each of the problems A to K the number of attempts and the minute of the first accepted run ("--" in place of the minute when the problem is unsolved), plus a total of attempts and solves per team. The last two teams, with no solved problems, share rank 65.

    A closing row gives, for each problem, the number of submissions, the time of the first yes and the total number of yes runs. First place is Cornell-1 with 10 problems solved in 975 minutes. Institutions are not shown, only the team names.
