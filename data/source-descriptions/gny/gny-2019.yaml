  description: |-
    Standings of the 2019 Greater NY Regional Contest: 68 teams with rank, team name, institution, problems solved, time, medal and citation. Four teams carry a gold medal and the citations First to Fourth Place, 56 more are marked Ranked with place citations down to Honorable Mention, and the last eight teams are listed as Honorable without a rank. Cornell-1 of Cornell University is first with 10 problems solved in 975 minutes. There are no per-problem columns and no attempt counts.
