  title: 2019 ICPC Greater New York Region
  language:
  - en
  contest_date: '2019-10-27'
  description: |-
    Website of the 2019 ICPC Greater New York Regional Collegiate Programming Contest, held on Sunday, October 27, 2019 at the New Jersey Institute of Technology (NJIT), in English. The home page gives the day's schedule (registration, practice contest, opening ceremony, contest 11:15am to 4:15pm, coaches meeting, closing ceremonies), campus and parking information, the team naming rules, name badges, the languages offered (C/C++/Ada, Java, Python 2 and 3, Kotlin), registration and eligibility notes, and the champion teams and special awards. At the bottom it links to the pages of earlier years back to 1997.

    Our copy holds 116 files: the home page, the rules page, the final standings, the problem set page, a one-page PDF with the NJIT schedule and campus map, a page of instructions for writing the contest image to a USB drive, and a directory listing of team photographs (123 JPEG files listed, 103 of them saved), which is also saved in four sort orders. Links to the event photo albums and the mailing list lead to other servers and are not part of it.
