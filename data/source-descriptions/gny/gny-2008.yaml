  description: |-
    Problems page of the contest: nine problems A to I (A Sixth Grade Math through I Joe's Triangular Gardens), each linked to a statement PDF, with columns for the judges' solution, the judges' input file and the correct output. A link offers all problems zipped together, and another leads to the standings. A note on problem H gives a 1963 RAND Corporation paper as the source of its algorithm. Our copy is the HTML page only; the linked PDFs, solutions, data and zip file are not in it.
