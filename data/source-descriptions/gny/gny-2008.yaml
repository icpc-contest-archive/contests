  description: |-
    Final standings page of the contest, produced by PC^2 (version 8.7): 45 teams with rank, name, number solved, total time and, for each of the nine problems A to I, the number of attempts and the minute of the first correct solution. A last column gives total attempts and problems solved per team. The team name carries a tag in parentheses, for example SUNY SB 2 (S2/D). SUNY SB 2 is first with 8 problems; the table ends with teams that solved none, and a final row gives submitted, first yes and total yes counts for each problem.
