  description: |-
    Baekjoon Online Judge category page for the contest, in Korean, filed under ICPC Regionals, North America, Greater New York Region. It lists nine problems, numbered 2702 to 2710 and labelled A to I, with title, number of users who solved each, number of submissions and acceptance rate. Most titles are Korean translations; problem B keeps the English title Cryptoquote, and problem E is marked as a special judge problem. The page lists problems only, not their statements, and the counts are those of the day the page was saved.
