  contest_date: '2008-10-26'
  description: |-
    Website of the 2008 ACM ICPC Greater New York Region contest, sponsored by the Greater New York Region and hosted by St. Joseph's College in Patchogue, NY, on Sunday, October 26, 2008. The front page gives the schedule (registration and practice from 9 am, contestants' meeting at 11, contest from noon to 5 pm, awards at 5:30), the fee of $70 per team, payment and registration instructions, the contest environment (a bootable CD, with a download link) and the allowed languages (Ada, C/C++ and Java). It links to the contest rules, the problems, the final standings and photos, and lists the standings, problems and rules of earlier years back to 1997.

    Our copy holds only this front page and its three images (the ICPC, IBM and St. Joseph's College logos). The linked rules, problems, standings and photos pages are not in it.
