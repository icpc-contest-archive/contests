  description: |-
    Final standings of the contest: 51 teams, nine problems A to I. Each row gives rank, team name (school and team number), problems solved, total time, and for each problem the number of submissions and the time of the first correct one, with -- for unsolved, plus a total column headed att/solv. A last row gives, per problem, the submissions, the time of the first correct one and the number of correct ones. Cornell 1 is first with all nine problems solved and a total time of 430.

    The page credits CSUS PC^2 version 8.7 and states that it was last updated on Sunday, November 4, 2007 at 16:57:50 EST.
