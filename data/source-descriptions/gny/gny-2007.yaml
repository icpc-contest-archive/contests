  contest_date: '2007-11-04'
  description: |-
    Home page of the 2007 ACM ICPC Greater New York Region contest, in English: held on Sunday, November 4, 2007 at Kean University, Union, NJ, with AdaCore, Google and Two Sigma Investments named as sponsors. It gives the host and location, the day's approximate schedule (registration and practice from 9 am, contest from 12 noon to 5 pm, awards at 5:30 pm), the fee of $50 per team plus $30 per guest, registration and payment deadlines, and the languages (Ada, C/C++ and Java). The contest is run from a bootable CD that teams can download to practise.

    The page links the contest rules, final standings and problems, two newspaper articles, directions and parking, and links to the standings and problems pages of earlier editions from 1998 to 2006 and the problems page of 1997.

    Our copy holds this one page with the Kean University, Google, Two Sigma and ICPC logo images; the AdaCore and IBM logo images are missing. The links to the other pages do not work inside it; the standings and the problems page are held as separate documents.
