    Website of the Greater New York region's 1998 regional contest, in English. The home page names Bloomfield College in Bloomfield, NJ and 8 November 1998, says the region covers schools from parts of New York, New Jersey and Connecticut, and links to the final standings and the problems.

    Our copy holds 10 pages: the home page, the final standings page with 31 teams (time and incorrect tries per problem for A to G), the problems page, and the seven problem pages A to G, each with a statement, input and output format and sample data.
