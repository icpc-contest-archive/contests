  description: |-
    Website of the ICPC North America Greater New York regional, in English. The home page announces the 2026-2027 contest for Sunday 8 November 2026 at Touro University, Times Square Campus, with the tentative schedule, the team-naming format, the bring-your-own-laptop requirement and registration notes; registration dates, cost, practice-contest availability and the image instructions are still marked TBD. Other pages cover general information about the ICPC, a contact page, the contest rules, and a second contest page (linked as Sites) with the same schedule, a registration deadline of 4 November 2026 and a note that registration is open for the East Division Online Judge.

    Our copy holds 79 pages and 138 files. Most are older editions: an archive table lists each year from 1997 to 2024 with host, website, standings and problems links (1997 has problems only). The copy includes a problems page for each year from 1997 to 2023 and a standings page for each of those years except 1997 and 2009, besides the final scoreboard of the 2025 contest with its twelve problem PDFs. A hall of fame page lists gold, silver and bronze teams and first-to-solve awards for 2024-2025 and earlier years. No results page for the 2026 contest is in our copy; the home page links to a scoreboard on another server.
