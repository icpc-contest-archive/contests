  description: |-
    Website of the 2005 ACM Greater New York Regional Collegiate Programming Contest, in English: held on Sunday, November 20, 2005 at Kean University, Union, NJ, with AdaCore named as sponsor. The home page is a short welcome text saying the region covers parts of New York, New Jersey and Connecticut, with links to the final standings and the problems.

    Our copy holds 12 pages: the home page, the standings page (59 teams, problems A to I), the problems page and nine PDF problem statements, one per problem A to I. The files linked from the problems page are also in our copy: a zip of all problems, nine judges' solutions (eight in C++ and one in C), nine input files and nine output files.
