  description: |-
    Final standings of the contest: 59 teams, nine problems A to I. Each row gives rank, team name (school and team number, with set marks S1, S2 or S3 on most rows), problems solved, total time, and for each problem the number of submissions and the time of the first correct one, with -- for unsolved, plus a total column headed att/solv. A last row gives, per problem, the submissions, the time of the first correct one and the number of correct ones. SUNY SB 1 is first with seven problems solved.

    The page also counts the 486 submissions by language (Ada, C or C++, Java) with correct and incorrect runs, and explains the S1 (freshmen and sophomores only), S2 (undergraduates only) and S3 (with graduate students) sets; Fairleigh 1 is named as the best S1 team.
