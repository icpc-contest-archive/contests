  description: |-
    Final standings of the contest on the organisers' page: a scoreboard of 60 teams, ranked, with columns for name, problems solved and penalty time, one column for each of the nine problems A to I, and a Total column. A problem cell reads submissions / penalty time, with -- as the time when the problem was not solved, and the Total column reads correct / total submissions. A Summary row gives, for each problem, attempts, correct submissions and the penalty time of the first submission. First place is Cornell 1 with seven problems solved.

    Each team name carries a set tag: S1 for teams of freshmen and sophomores only, S2 for teams of undergraduates only, S3 for teams with graduate students; three teams carry S?. Text above the table names the members and coach of the top two teams and congratulates the top freshman-sophomore team.
