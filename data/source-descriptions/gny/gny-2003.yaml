  description: |-
    Website of the 2003 ACM Greater New York Regional Collegiate Programming Contest, in English. The home page gives Sunday, November 9, 2003 and the New York Institute of Technology in Old Westbury, NY as date and place, says the region draws schools from parts of New York, New Jersey and Connecticut, and links to a final standings page and a problems page.

    Our copy holds 12 pages: the home page, the standings page with 60 teams, the problems page, and nine PDF problem statements A to I (15 pages in all). Also saved are the files the problems page links: a zip of the nine statements, the judges' solutions as nine C++ source files, nine input files, nine output files and one image.
