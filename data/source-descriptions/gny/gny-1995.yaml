  description: |-
    Usenet post to comp.org.acm, viewed in Google Groups and dated 14 December 1995, headed "REGIONAL RESULTS: ACM 1996 PROGRAMMING CONTEST". It lists the first three or four teams of each of 17 ICPC regions as unofficial results, with the contest date of each region and, for some, a web address. For the Greater New York region, contest date 05 Nov 95, it gives three places: Columbia University, SUNY Stony Brook and Cornell University. Several other regions in the list have a date but no teams.

    The post carries only the order of teams, with no problems, scores or times. Our copy is the Google Groups page of the message, with the page's menus around the text.
