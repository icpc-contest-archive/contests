  contest_date: '2025-11-09'
  description: |-
    Website of the Greater New York regional, hosted by Columbia University on Sunday 9 November 2025, in English. Our copy holds 3 pages. The front page gives the schedule from registration at 8:00 am to the closing ceremony and dinner at 5:30 pm, the team-naming format (institution abbreviation, hyphen, team name), notes that contestants bring their own laptop and boot a contest image, and links to the final standings, the problem set with sample and secret judges' data and judges' solutions, the technical notes; it gives the fee, describes the practice contest and says photographs will be added later. It ends with a list of previous years from 1997 to 2024, most with their host and links to standings or problems; the 2020, 2021 and 2024 contests are marked online with no host.

    The rules page covers eligibility, the five-hour contest with six or more problems, languages, the 80-team capacity, personnel, conduct of the contest, submission with PC^2 and judging. The problem page of our copy is only a redirect notice pointing to the 2023 problems page. The standings and problems that the front page links to are on other servers and are not part of this copy.
