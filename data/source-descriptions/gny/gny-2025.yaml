  description: |-
    Final scoreboard produced by PC^2 (version 9.11) for the Greater New York regional: 81 teams, twelve problems A to L. Each team row gives rank, team number and name, problems solved, penalty time, and for each problem the number of attempts and the minute of the solve, plus total attempts and solves. A footer row gives submitted, first-yes and total-yes counts per problem. The top three are Princeton 2, Cornell - Alpha and Columbia-0, all with nine solved. The page says the contest has ended; gold, silver and bronze medal rows and first-solve cells are marked in the legend. Links lead to a Columbia University standings page and to one problem PDF per letter; they are not part of our copy.
