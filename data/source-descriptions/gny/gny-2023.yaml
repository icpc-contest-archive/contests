  title: 2023 ICPC Greater New York Region
  language:
  - en
  contest_date: '2023-10-29'
  description: |-
    Website of the 2023 ICPC Greater New York Regional Collegiate Programming Contest, in English, hosted by Columbia University on Sunday 29 October 2023. Our copy holds 51 pages. The front page names the regional champion and links photo albums, team photos, a video playback of the last hour of submissions, live coverage and a coaches presentation from 1 October 2023. It gives the schedule, team naming format, laptop and contest image requirement, eligibility, the fee, and earlier years back to 1997 with links to their standings or problems.

    Inside our copy are the rules page, the official results scoreboard, and a problems page titled "Solutions and Secret data" listing problems A to L. Our copy holds a PDF statement and a sample data page for each of the twelve and a secret data page for eleven; problem E has only its statement and sample data. The page says some problems were shared with the ECNA and NENA regions. Also held are two zip files (statements, data and solutions; extra files for problem J), a five-page technical notes PDF and a three-page PDF on writing the contest image to a USB drive.

    Videos and photo albums are on other servers and not in our copy; the coaches presentation video was too large to save. Of the individual secret data files, only 17 input and 18 answer files of problem A were saved.
