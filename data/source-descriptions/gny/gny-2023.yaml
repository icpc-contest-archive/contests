    Official results scoreboard produced by PC^2 for the Greater New York regional, posted 31 October 2023: 92 teams, twelve problems labelled A to L. Each row gives rank, team name, problems solved, total time in minutes, and for each problem the number of attempts and the minute of the first accepted run (3/24 means three attempts, solved at minute 24; -- in place of the minute means no accepted run), plus a total of attempts and solved. The first three teams solved nine problems; the six teams with no solved problems share rank 87. A last row gives submitted, first-yes and total-yes counts per problem. There is no institution column; most team names begin with an institution name or abbreviation. The footer reads 'Last updated Sun Oct 29 17:05:28 EDT 2023'.
