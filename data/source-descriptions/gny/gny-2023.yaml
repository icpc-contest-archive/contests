  title: ICPC 2023 Greater New York Regional Programming Contest
  language:
  - en
  contest_date: '2023-10-29'
  problems: 12
  description: |-
    Problem and solutions page of the contest website, headed "ICPC 2023 Greater New York Regional Programming Contest" and dated Sunday, October 29, 2023, in English. It notes that some problems were shared with the ECNA and NENA regions, that each problem gives its own time limit and that programs were limited to 2GB of memory, and lists the judges under Greater New York, East Central NA and Northeast NA. A table of twelve problems, A-cornhusker to L-morsepal, links each problem's statement PDF and its sample input and output; eleven also link judge's solutions (two to six files each, in C, C++, Java, Kotlin and Python) and the secret judge's data, and J-basehilo also has interactive validator files. E-tetrasphere has only its statement and sample data. Eight problems carry an asterisk, explained as shared with the Northeast NA and East Central NA regions. One link offers everything zipped together. The linked files and the header image are not part of our copy.
