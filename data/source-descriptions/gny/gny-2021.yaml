  contest_date: '2022-03-06'
  description: |-
    Website of the 2021 ICPC Greater New York Regional Collegiate Programming Contest, an online contest on Sunday, March 6, 2022, in English. The home page sets out the rules of the online format: teams use their own computers, one per contestant, communicate only among team members, may use public online resources but not AI-assisted coding tools or paid resources, and teams advancing to the North America Championship must be ready to meet the judges by video within 10 days. It gives the schedule (practice contest 10:00 AM, contest 11:00 AM to 4:00 PM, Zoom webinars for the ceremonies), team naming rules, registration links and a list of links to the pages of earlier years.

    Our copy holds 147 files from 150 addresses (three returned errors): the home page, the rules page, the results page, the problem set page, the 15 problem statements as PDF files (each kept under two addresses), 19 judge solution source files, a zip file of the problems, solutions and judge data, and directory listings of the judge data of the 15 problems, with 30 input and 31 answer files saved individually. The links to the pages of 2020 and earlier years, and to registration and mailing list pages, lead to pages that are not in our copy.
