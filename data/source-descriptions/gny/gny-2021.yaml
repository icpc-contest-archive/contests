  description: |-
    Problem set page of the 2021 Greater New York regional, held online on Sunday, March 6, 2022. A table lists fifteen problems A to O (FootballScoring, TriColorHexPuzzle, CheckerSlide, Sequinary, Unicycle2, Spider-Fly, CollatzCount, CIDR, Tetrasphere, MorseCode, PoolingPCRTests, Letterle, SevenSegment, Neighbors, TransportingSpaghetti) with links to the PDF statement, the judge's solution source files (none for problem I) and the judge's input and output data. A link offers everything as one zip file. The text places the material under a Creative Commons Attribution-NonCommercial-ShareAlike 3.0 license and says the statements may have been updated for the clarifications sent during the contest.

    The copy of this page holds only the page and its images; the statement PDFs and the zip file are held in our copy of the website.
