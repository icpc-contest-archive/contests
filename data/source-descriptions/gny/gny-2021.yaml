  description: |-
    Results of the 2021 Greater New York Regional, produced by CSUS PC^2 9.7.0 and last updated on Wednesday, March 9, 2022; the page heading calls them official results. The table lists 89 teams with rank, team name, problems solved, penalty time, the attempts and minute of the first accepted run for each of the problems A to O ("--" in place of the minute when the problem is unsolved), and a total of attempts and solves. The labels of the problems link to their PDF statements. A closing row gives submissions, time of the first yes and number of yes runs per problem.

    Five teams are marked green as qualifying for the North America Championship in Orlando, Florida on May 30, 2022. Columbia-fortcoders is first with 13 problems solved in 1140 minutes. Institutions are not shown, and thirteen teams with no solved problems share the last rank, 77.
