  contest_date: '2017-11-19'
  teams: 61
  problems: 10
  times: true
  tries: true
  description: |-
    Final scoreboard of the Greater New York Region contest produced by CSUS PC^2 9.3.3: 61 team rows under the heading Summary - Greater New York Region, ten problems A to J. Each row gives rank, team name, number solved, total time, and for each problem the number of attempts and the minute of the first accepted run (0/-- for unsolved), with a total of attempts and solved problems. Tied teams share a rank: Columbia 1 and Cornell 2 are both first with 8 solved and 1244 minutes, and ten teams with no problems solved share rank 52. Ten team names begin with 'NQ -' (for example NQ - Union 1); the page does not explain the prefix, and these teams are ranked among the others. A last row gives per problem the submissions, the minute of the first yes and total yes runs.

    Above the table the page says there was a tie for first place and that TwoSigma awarded prizes for the top three teams. The page ends with the update stamp Mon Nov 20 10:10:18 EST 2017. Team names are given without institution or country.
