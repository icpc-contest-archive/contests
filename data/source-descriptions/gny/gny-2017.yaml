  title: 2017 ACM ICPC Greater New York Region
  language:
  - en
  contest_date: '2017-11-19'
  description: |-
    Website of the 2017 ACM ICPC Greater New York Region contest, in English. The front page announces a contest on Sunday, November 19, 2017 at several sites: Manhattan College, Yale, Stony Brook, Binghamton College and online. It gives the schedule (livestreamed opening at 11:15am, contest from noon to 5:30pm, problems released at noon for download and printing), a practice session from November 14 to 18 on the PC^2 web interface, the languages (C/C++/Ada, Java, Python), the requirement to use the region's contest image, a registration deadline of November 3 and a cost of $30 per team. It also lists earlier contests from 1997 to 2016 with their hosts.

    Our copy holds 19 pages: the front page, the rules, the final standings, the problems page with ten problem statements as PDFs (A to J), and five contest environment pages (an overview and instructions for Linux, Windows, Mac and a bootable DVD). The rules page still reads 'The Contest will be held on TBD, at TBD' and lists prizes and registration as to be announced. Links to earlier years lead outside our copy.
