  description: |-
    Website of the Northern Eurasia Contests (NEERC), the organiser of the finals and of the regional contests that feed them, in English. Our copy holds 150 saved files, many of them the same page saved under http, https and port-80 addresses. They include the site's home and archive index pages, the yearly archive pages from 1996 to 2010, and those for 2020 and 2021. The 2020 page lists the NERC 2020 finals in offline and online versions (standings, problems, jury archive, tutorial, runs) and, under Regional Contests, only Northwestern Russia (NWRRC standings, tests, runs, statements, tutorials). It has no entry for Armenia.

    The standings of the 2020-2021 Armenia Regional Contest are nonetheless in our copy, as a standings page with its own address, not reached by a link from the archive page. The copy also holds the NERC 2020 and 2021 finals standings, PDFs of the 2020 and 2021 finals statements and tutorials, and an Armenia standings page for each year from 2004 to 2025. The site is shared by all NEERC contests and years, so most of its pages are about other contests; the only Armenia PDF is a statements file in the 2024 Armenia folder, and our copy holds no problem statement of the Armenia 2020 contest.
