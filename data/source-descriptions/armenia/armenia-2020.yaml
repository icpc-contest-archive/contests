    Final standings of the Armenia Regional Contest, 2020-2021 season: 19 teams ranked by problems solved and then penalty time, with problems A to N as columns. Each cell shows the number of rejected attempts and the time of acceptance, or a minus sign with the number of rejected attempts for unsolved problems. Team names are given with the three members. The status line reads "over", 5:00:00 of 5:00:00. YSU: Old Era But Gold Era is first with ten problems solved, ahead of YSU: New Era, which also solved ten.

    Under the table are summary rows per problem: total runs, accepted, rejected, first accept and last accept. Teams are prefixed YSU, RAU, AUA, NPUA and EUA.
