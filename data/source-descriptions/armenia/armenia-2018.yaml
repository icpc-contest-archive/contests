  description: |-
    Website of the Northern Eurasia Contests (NEERC), the organiser of the finals and of the regional contests that feed them, in English. Our copy holds 150 saved files, many of them the same page saved under http, https and port-80 addresses. They include the yearly archive pages for 2018 and 2019. The 2018 page has an Information and Resources part for the finals (standings, problems, jury archive, analysis, review slides, runs) and a Regional Contests part with sixteen regions. For Armenia, Taurida, Ural, Georgia, Kazakhstan, Azerbaijan and Northwestern Russia it links standings or contest material; the others read "No information is available".

    The Armenia 2018 entry leads to the standings of the 2018 Armenia Subregional Contest, which is in our copy. The copy also holds the final standings of the NEERC 2018 finals, PDFs of the 2018 and 2019 finals statements, analyses and a 2018 review, PDFs for the Northern regional contests, and an Armenia standings page for each year from 2004 to 2025. The site is shared by all NEERC contests and years, so most of its pages are about other contests; the only Armenia PDF is a statements file in the 2024 Armenia folder, and none is a problem statement of the Armenia 2018 contest.
