  description: |-
    Final standings of the Armenia Subregional Contest, 2018-2019 season: 14 teams ranked by problems solved and then penalty time, with problems A to L as columns. Each cell shows the number of rejected attempts and the time of acceptance, or a minus sign with the number of rejected attempts for unsolved problems. Most team names are given with institution and number, followed by the three members; the two asterisked teams are named "Veteran RAU" (with members) and "Veteran YSU" (no members). The status line reads "over", 5:00:00 of 5:00:00. Yerevan State University 1 is first with ten problems solved. Two teams carry an asterisk before the name, Veteran RAU (second place, seven solved) and Veteran YSU (no problem solved); the page does not explain the mark. Three teams share rank 12 with no problem solved.

    Under the table are summary rows per problem: total runs, accepted, rejected, first accept and last accept. Teams come from Yerevan State University, Russian-Armenian (Slavonick) State University and American University of Armenia.
