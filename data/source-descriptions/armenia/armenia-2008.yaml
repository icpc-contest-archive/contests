  description: |-
    Pages of the Northern Eurasia Contests archive site, in English, as saved around the Armenia standings pages of 2004 to 2024. It holds the yearly archive index pages for 2008 and 2009, each listing the NEERC finals (standings, problems in PDF and PostScript, statement sources in TeX, tests and jury solutions) and the regional contests with links to their standings, and in a few cases problem statements and tests. Our copy has final standings pages for the finals and for many of the regional contests of 2008 and 2009, the finals problem PDFs for those years, and Armenia standings pages for 17 of the years between 2004 and 2024.

    The 2008 Armenia standings page in it is the one for the 2008-2009 Armenia Subregional Contest: 18 teams, problems A to K. The archive index lists only standings for Armenia in 2008. The problem PDF at the 2008 address is the Northeastern European Regional Contest problem set (St Petersburg, Barnaul, Tashkent, Batumi, 26 November 2008), not a set for Armenia.

    Our copy holds 114 pages, several of them the same address saved under http and https. Some of the saved PDFs, among them the 2009 finals problem PDF under all three of its addresses and the 2008 one under two of its three, cannot be opened, and one capture of the 2008 index page stops after the first regional contest.
