  description: |-
    Website of the Northern Eurasia Contests (NERC), the series site that also covers the regional contests of the region, in English with Russian labels. Our copy holds 150 pages. It starts from the archive page of the 2024 season, which lists for each regional contest, Armenia among them, its standings, statements and a runs archive, and for some regionals tutorials, handbooks and photo galleries.

    For this edition the copy has the Armenia standings page and the English statements PDF; the link to the runs archive leads to a file that is not in our copy. The site is not specific to Armenia: the copy also holds the 2025 season archive page, standings pages and statements of other regionals and of the Northern Eurasia Finals for 2024 and 2025, and the Armenia standings pages of earlier editions from 2004 to 2023 and the Armenia standings page of the 2025 archive.
