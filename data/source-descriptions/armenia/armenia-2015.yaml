  description: |-
    Archive section of the Northern Eurasia Contests website, in English, showing the NEERC 2015 archive page: a year menu from 1996 to 2020, links for the finals (standings, problems in PDF format, official tests, jury archive), and a list of regional contests, each with a link to its final standings. The Armenia entry has one link, to its final standings; Northwestern Russia also has links to problem statements, tests and generators, a jury archive, statement sources, an analysis and the runs.

    Our copy holds 149 saved files, which are 64 distinct addresses, several of them saved under more than one address form. They are the archive pages for 2015 and 2016, the standings pages of the finals and of regional contests of both years, the Armenia standings pages for each year from 2004 to 2023, the 2015 and 2016 finals problem statement and review PDFs, and the statements and analysis PDFs of one regional contest for 2015 and 2016.

    The style sheet and images are not in our copy; the pages are plain tables and text without them.
