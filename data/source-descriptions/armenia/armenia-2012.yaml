  description: |-
    Standings of the Armenia subregional: 18 teams with rank, team name, institution, problems solved, total time, medal, citation and a site citation. Medals are gold for ranks 1 to 4, silver for 5 to 8 and bronze for 9 to 12; the citations name the places First to Ninth and Honorable Mention for the rest. The first-place team, RAU1 of the Russian-Armenian (Slavonick) State University, has 8 solved and is cited as champion of the subregional. There is no per-problem detail and no number of attempts.

    The scoreboard on the NEERC site has 23 rows; these 18 are the teams on it that have no asterisk.
