  description: |-
    Scoreboard of the Armenia subregional in the format of the NEERC standings pages, titled 'ACM ICPC 2012-2013, NEERC, Armenia Subregional Contest', with the contest clock at 5:00:00 of 5:00:00 and status over. It lists 23 teams with their members, in rank order 1 to 23, against twelve problems A to L: each cell shows the number of rejected attempts and the solve time in minutes, or a minus sign and the attempts for an unsolved problem, with a dot where nothing was submitted. Columns for problems solved and total penalty time follow. First place is RAU1 with 8 solved. Below the table are totals per problem: runs, accepted, rejected, and the times of the first and last accepted run.

    Five teams have an asterisk before their name; the page does not say what it means, and they carry ordinary rank numbers in the sequence. Nobody solved problems C, I and K. A script toggles the display of times; our copy holds the page's style sheet.
