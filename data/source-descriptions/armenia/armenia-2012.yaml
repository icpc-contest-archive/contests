  description: |-
    Final scoreboard of the Armenia Subregional Contest, headed "ACM ICPC 2012-2013, NEERC, Armenia Subregional Contest", with a clock reading 5:00:00 of 5:00:00 and status "over". It lists 23 teams with their members' names, one column for each of the twelve problems A to L, a column headed "=" (number of problems solved) and a Time column. A solved problem shows "+" and a time, with a number after the plus in many cells; an attempted unsolved problem shows "-" and a number; "." marks no attempt. RAU1 is first with 8 problems solved. Five teams carry an asterisk before their name (Quantum, Physmath 2, Yerevan SU reserve, Physmath 1 and Gyumri school team) and are ranked in the same table. The page has no explanation of the asterisk. Summary rows at the bottom give total runs, accepted, rejected, first accept and last accept for each problem.

