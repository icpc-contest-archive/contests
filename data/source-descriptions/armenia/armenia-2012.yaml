  description: |-
    Pages of the Northern Eurasia (NEERC) contest archive. The Armenia subregional has no site of its own in our copy; it appears as one entry, Armenia, in the list of regional contests on the 2012 archive page, which links its standings. The page also covers the NEERC final of 2012, with links to standings, problems in PDF, official tests and jury solutions, and gives the same list of regional contests for 2013.

    Our copy holds 147 saved files, 141 of them pages: the archive index pages for 2012 and 2013, the standings pages of the NEERC regions for 2012 and 2013 (Armenia, Georgia, Moscow, Ural, Central, Northern, Southern and Western among them), problem PDFs of the 2012 and 2013 NEERC finals and of the Northern and Central subregionals, the 2012 and 2013 review PDFs, and the Armenia subregional standings pages of other years (2004, 2005, 2008 to 2011, 2013 to 2025) with a 2024 Armenia statements PDF. Most files repeat the same page under http, https and port-80 addresses. No problem statements titled for the Armenia 2012 contest are among them; the 2012 Northern Subregional problem PDF holds twelve problems A to L.
