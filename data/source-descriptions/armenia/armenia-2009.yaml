  description: |-
    Pages of the Northern Eurasia Contests archive site, in English, as saved for the NEERC years 2004 to 2025. It holds the yearly archive index pages for 2009 and 2010, each listing the NEERC finals (standings, problems, statement sources, tests, jury solutions; the 2009 index also a monitor program) and the regional contests with links to their standings and, for the Northwestern one only, problem statements, tests, runs and a contest analysis. Our copy has final standings pages for the finals and for many of the regional contests of 2009 and 2010, the finals problem PDFs, and an Armenia standings page for every year from 2004 to 2025.

    The 2009 Armenia standings page in it is the one for the 2009-2010 Armenia Subregional Contest: 20 teams, problems A to K. The archive index lists only standings for Armenia in 2009. The problem PDF at the 2009 address is the Northeastern European Regional Contest problem set (St Petersburg, Barnaul, Tashkent, Tbilisi, 11 November 2009), not a set for Armenia.

    Our copy holds 147 pages, several of them the same address saved under http and https.
