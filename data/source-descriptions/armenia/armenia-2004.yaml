  description: |-
    Pages of the Northern Eurasia Contests archive on the NEERC site, not specific to Armenia. Our copy holds 149 files, which are copies of 66 distinct pages, many saved several times under http, https and port 80 addresses. The 2004 archive page lists the resources of NEERC 2004 (standings, problems in PDF, jury archive, history archive, runs, picture galleries) and the regional contests of that year, among them Armenia with a link to its final standings. A 14-page PDF holds the twelve problems A to L of the 2004-2005 Northeastern European Regional Contest, headed December 1, 2004 and naming Yerevan among its sites.

    The copy also holds the 2005 archive page with a similar layout and a 14-page PDF of eleven problems of the 2005-2006 contest, the standings pages of the other regional contests of 2004 and 2005, an Armenia standings page for every year from 2004 to 2025, and a 14-page statements PDF of the ICPC 2024-2025 Armenia Regional Contest. The pages are mostly in English; some 2005 standings pages are in Russian. The jury archive, history archive, runs and picture galleries named on the archive pages are not in our copy.
