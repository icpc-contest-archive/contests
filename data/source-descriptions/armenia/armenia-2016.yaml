  description: |-
    Archive section of the Northern Eurasia Contests website, in English, showing the NEERC 2016 archive page: a year menu from 1996 to 2020, links for the finals (standings, problems in PDF format, official tests, jury archive, all runs, a problems review), and a list of regional contests, each with a link to its final standings. The Armenia entry has one link, to its final standings; Northwestern Russia also has links to problem statements, tests and generators, a jury archive, statement sources, an analysis and the runs.

    Our copy holds 150 saved files, which are 62 distinct addresses, several of them saved under more than one address form. They are the archive pages for 2016 and 2017, the standings pages of the finals and of regional contests of both years, the Armenia standings pages for each year from 2004 to 2019, the finals PDFs (2016 statement and review, 2017 statement and analysis), and statement and analysis PDFs of the Northwestern Russia contest for 2016 and 2017 and of one 2017 contest in Kazakhstan.

    The style sheet and images are not in our copy; the pages are plain tables and text without them.
