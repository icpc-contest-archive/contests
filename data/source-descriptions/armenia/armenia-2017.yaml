  description: |-
    Final standings of the Armenia Subregional Contest, 2017-2018 season: 22 teams ranked by problems solved and then penalty time, with problems A to L as columns. Each cell shows the number of rejected attempts and the time of acceptance, or a minus sign with the number of rejected attempts for unsolved problems. Team names are given with institution and number, followed by the three members. The status line reads "over", 5:00:00 of 5:00:00. Yerevan State University 1 is first with seven problems solved. Four teams share rank 19 with no problem solved: one from the American University of Armenia and three from the Yerevan State University of Architecture and Construction.

    Under the table are summary rows per problem: total runs, accepted, rejected, first accept and last accept. Teams come from Yerevan State University, Russian-Armenian (Slavonick) State University, American University of Armenia and the Yerevan State University of Architecture and Construction.
