  description: |-
    Website of the Northern Eurasia Contests (NEERC), the organiser of the NEERC finals and of the regional (subregional) contests that feed them, in English. Our copy holds 149 saved files, many of them the same page saved under http, https and port-80 addresses. They include the yearly archive pages for 2017 and 2018, each with an Information and Resources part and a Regional Contests part. The 2017 page lists sixteen regional contests, among them Armenia, each with a link to its final standings. The copy also holds the final standings of the NEERC 2017 and 2018 finals, the regional standings pages of 2017 and 2018, and an Armenia standings page for each year from 2004 to 2025.

    The Armenia 2017 entry on the archive page leads to the standings of the 2017 Armenia Subregional Contest, which is in our copy. The PDFs in our copy are problem statements and analyses of the NEERC 2017 and 2018 finals and of the Northern regional contests, a 2018 review, and a statements PDF in the 2024 Armenia folder; none of them is a problem statement of the Armenia 2017 contest. The site is shared by all NEERC contests and years, so most of its pages are about other contests.
