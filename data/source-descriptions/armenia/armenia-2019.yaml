    Final standings of the Armenia Regional Contest, 2019-2020 season: 19 teams ranked by problems solved and then penalty time, with problems A to M as columns. Each cell shows the number of rejected attempts and the time of acceptance, or a minus sign with the number of rejected attempts for unsolved problems. Team names are given with the three members. The status line reads "over", 5:00:00 of 5:00:00. Yerevan SU: One Last Dance is first with seven problems solved. Two teams carry an asterisk before the name, SCH_Quantum Jigglypuff (third place, seven solved) and SCH_Physmath Powered by Arsen (sixth place); the page does not explain the mark.

    Under the table are summary rows per problem: total runs, accepted, rejected, first accept and last accept.
