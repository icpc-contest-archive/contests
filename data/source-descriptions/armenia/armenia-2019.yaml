  title: Northern Eurasia Contests
  language:
  - en
  description: |-
    Website of the Northern Eurasia Contests (NEERC), the organiser of the finals and of the regional contests that feed them, in English. Our copy holds 149 saved files, many of them the same page saved under http, https and port-80 addresses. They include the yearly archive pages for 2019 and 2020. The 2019 page has an Information and Resources part for the finals (standings, problems, jury archive, analysis) and a Regional Contests part with sixteen regions; only Northwestern Russia has material there (qualifier and NWRRC standings, statements, tutorials, tests and runs). Armenia is listed on it as "No information is available".

    The standings of the 2019-2020 Armenia Regional Contest are nonetheless in our copy, as a standings page with its own address, not reached by a link from the archive page. The copy also holds the final standings of the NERC 2019 finals, PDFs of the 2019 and 2020 finals statements and tutorials, and an Armenia standings page for each year from 2004 to 2025. The site is shared by all NEERC contests and years, so most of its pages are about other contests; the only Armenia PDF is a statements file in the 2024 Armenia folder, and our copy holds no problem statement of the Armenia 2019 contest.
