  description: |-
    Pages of the Northern Eurasia Contests website (NERC, hosted at neerc.ifmo.ru), in English with some Russian labels. It is not the Armenian contest's own site. The archive page for 2023 lists for the Northern Eurasia Finals the standings, the Astana, St. Petersburg, Kutaisi and Novosibirsk site standings, problems in PDF, problem analysis and a brochure, and then a block of regional contests; Armenia, Azerbaijan, Kazakhstan, Taurida and Ural each give a standings link, and Northwestern Russia also lists qualification and contest statements, tutorials, runs and a test package. Many other regions are listed with no material.

    Our copy holds 150 files, 90 HTML and 60 PDF, captured at various dates from 2020 to 2026. It has the archive pages for 2023 and 2024, the Armenia regional standings pages for every year from 2004 to 2025 including 2023, standings and statements of other regional contests, the Northern Eurasia Finals standings, and statements, tutorials and brochures as PDFs.
