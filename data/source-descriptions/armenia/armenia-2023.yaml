  description: |-
    Scoreboard headed "ICPC 2023–2024, Armenia Regional Contest" and marked 5:00:00 of 5:00:00, status over: 34 teams, each with a team name and three contestant names, against 13 problems A to M. Each problem cell shows a plus or minus sign, a count of failed attempts where there were any, and the time of the accepted run in minutes; the last two columns give the number solved and the total time. Two teams share rank 32. First place is a Yerevan SU team with 9 solved and a total time of 947. Ten cells carry a first-to-solve mark. Summary rows under the table give total, accepted and rejected runs and the first and last accepted time for each problem; problems B, H and L have no accepted run. A "Show time" switch is on the page.

    Three teams, at ranks 3, 4 and 5, carry an asterisk before their name; the page does not say what it marks.
