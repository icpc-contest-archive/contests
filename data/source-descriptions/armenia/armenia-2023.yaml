  description: |-
    Dashboard page of a contest on QOJ.ac titled "The 2023 ICPC Northwestern Russia Regional Contest". It is a shared contest: the page lists the Armenia, Azerbaijan, Kazakhstan, Northwestern Russia, Taurida and Ural subregional categories and says the contest is also known as the 2023 ICPC Armenia, Azerbaijan, Kazakhstan, Taurida and Ural Regional Contest. The problem table lists 13 problems, A Axis-Aligned Area through M Missing Vowels. The page shows the ICPC ruleset with a 20 minute penalty, a scoreboard freeze after 4:00:00, the status Contest Ended with a virtual contest open, empty notice and question lists, and an English statements attachment link.

    The statements and the standings are separate pages and are not in this copy.
