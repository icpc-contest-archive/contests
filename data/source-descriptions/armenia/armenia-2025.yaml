  description: |-
    Page of the Armenia Regional Contest on the Northern Eurasia Contests (NERC) site, in English. It names Yerevan State University as host, gives the contest dates as 14-15 Nov 2025 and a registration deadline of 2025-11-13, lists the contest director, chief judge and technical head with their posts and contact details, and links the contest standings and an archive of all runs made during the contest. Below, an archive lists the standings of the Armenia contest for each year from 2004 to 2025, with runs links for 2025 and 2024 and a statements link for 2024.

    Our copy holds 111 pages: this page, the site menu and other regionals' pages of the same site, the Armenia standings pages of the earlier years, the Northern Eurasia Finals page for 2025 and four PDFs (an English statements PDF of the 2024 Armenia contest and three Northern Eurasia Finals documents). The runs archives of the 2025 and 2024 Armenia contests are saved as files beside the pages. The registration link leads to a server outside our copy.
