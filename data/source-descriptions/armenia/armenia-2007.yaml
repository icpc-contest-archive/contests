  description: |-
    Pages of the Northern Eurasia Contests archive site, in English, as saved around the Armenia standings pages of 2004 to 2025. It holds the yearly archive index pages for 2007 and 2008, each listing the NEERC finals (standings, problems in PDF, tests and jury solutions, runs, and a history of the contest to watch it in progress) and the regional contests with links to their standings, and in a few cases problem statements and tests. Our copy has final standings pages for the finals and for many of the regional contests of 2007 and 2008, the finals problem PDFs for those two years, and for the Armenia contest a standings page for every year from 2004 to 2025.

    The 2007 Armenia standings page in it is the one for the 2007-2008 Armenia Subregional Contest: 12 teams, problems A to I. The archive index says only standings are available for Armenia in 2007; the problem PDF at the 2007 address is the Northeastern European Regional Contest problem set (St Petersburg, Barnaul, Tashkent, Batumi, 28 November 2007), not a set for Armenia.

    Our copy holds 149 pages, several of them the same address saved under http and https; one Armenia page (2018) did not save under its https address.
