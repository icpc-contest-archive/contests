  description: |-
    Archive section of the Northern Eurasia Contests website, in English, showing the NEERC 2013 archive page: a year menu from 1996 to 2020, links for the finals (standings, problems in PDF format, official tests), and a list of regional contests, each with a link to its final standings. For Northwestern Russia the page also links to problem statements, tests and generators, a jury archive, statement sources and a run log. The Armenia entry has one link, to its final standings.

    Our copy holds 150 saved files, which are 66 distinct addresses, several of them saved under more than one address form. They are the archive pages for 2013 and 2014, the standings pages of the finals and of regional contests of both years, the Armenia standings pages for each year from 2004 to 2025, the review and problem statement PDFs of the 2013 and 2014 finals, the statements PDFs of one regional contest for 2013 and 2014 with its 2013 run log in XML and a 2014 analysis PDF, and the 2024 Armenia statements PDF. The Armenia 2013-2014 entry is the standings page described as a separate source.

    The style sheet and images are not in our copy; the pages are plain tables and text without them.
