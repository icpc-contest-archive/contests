  description: |-
    Pages of the Northern Eurasia Contests archive site, in English, as saved around the Armenia standings pages of 2005 to 2024. It holds the yearly archive index pages for 2010 and 2011, each listing the NEERC finals (standings, problems, statement sources, tests, jury solutions) and the regional contests with links to their standings and, for the Northwestern one, problem statements, tests, runs and analyses (in Russian). Our copy has final standings pages for the finals and for many of the regional contests of 2010 and 2011, plus PDFs of the 2010 finals problems, review and analyses, and Armenia standings pages for 15 of the years between 2005 and 2024.

    The 2010 Armenia standings page in it is the one for the 2010-2011 Armenian Subregional Contest: 22 teams, problems A to K. The archive index lists only standings for Armenia in 2010.

    Our copy holds 113 pages, several of them the same address saved under http and https. Most of the saved PDFs cannot be opened (four of the 23 open), and one capture of the 2010 index page breaks off partway through the first regional contest's entries.
