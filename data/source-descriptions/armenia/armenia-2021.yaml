  description: |-
    Pages of the Northern Eurasia Contests website (NERC, hosted at neerc.ifmo.ru), in English with some Russian labels. It is not the Armenian contest's own site. The archive page for 2021 has a block for the Northern Eurasia Finals (standings, problems, jury archive, problem analysis, runs) and a block of regional contests. The Armenia entry there gives only a link to its standings. In the capture of the 2021 page dated 2022 several other regions are marked "No information is available"; the later capture lists standings for Armenia, Azerbaijan, Georgia, Kazakhstan, Taurida, Ural and Northwestern Russia.

    Our copy holds 150 files, 122 HTML and 28 PDF, captured at various dates from 2012 to 2026; two are redirect stubs, and many pages are held under both http and https addresses. It has the archive pages for 2021, 2022 and several earlier years (1996 to 2012), the Armenia regional standings pages for every year from 2004 to 2025 including 2021 and 2022, standings of other regional contests, the Northern Eurasia Finals standings, and problem statements and tutorials as PDFs for 2021 and 2022.
