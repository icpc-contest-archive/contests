    Scoreboard headed "ICPC 2021–2022, Armenia Regional Contest" and marked 5:00:00 of 5:00:00, status over: 23 teams, each with a team name and three contestant names, against 14 problems A to N. Each problem cell shows a plus or minus sign, a count of failed attempts where there were any, and the time of the accepted run in minutes; the last two columns give the number solved and the total time. First place is a Yerevan SU team with 11 solved and a total time of 1080. Eleven cells carry a first-to-solve mark. Summary rows under the table give total, accepted and rejected runs and the first and last accepted time for each problem; problems F, G and I have no accepted run. A "Show time" switch is on the page.

    Nothing on the page marks unofficial or guest teams.
