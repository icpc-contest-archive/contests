    Final standings of the 2011 Armenia Subregional Contest: 18 teams with rank, team name, institution, number of problems solved, total time, medal and citation, plus a further column for a citation by the contest site. Ranks 1 to 4 carry gold medals, ranks 5 to 8 silver and ranks 9 to 12 bronze; ranks 13 to 18 have no medal. The citation column gives First Place to Ninth Place for ranks 1 to 9 and Honorable Mention for ranks 10 to 18. First place is RAU 1 of the Russian-Armenian State University with 8 problems solved and time 774, cited as Champion of Armenia Subregional Contest.

