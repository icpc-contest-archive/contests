  description: |-
    Pages of the Northern Eurasia Contests archive site, in English, as saved for the NEERC years 2004 to 2025. It holds the yearly archive index pages for 2011 and 2012, each listing the NEERC finals (standings, problems, tests, jury solutions; the 2011 index also statement sources and an analysis presentation) and the regional contests with links to their standings and, for the Northwestern one only, problem statements, tests, a run log and statement sources. Our copy has final standings pages for the finals and for many of the regional contests of 2011 and 2012, PDFs of the 2011 finals problems and analysis, and an Armenia standings page for every year from 2004 to 2025.

    The 2011 Armenia standings page in it is the one headed NEERC Armenian Subregional Contest 2011: 18 teams, problems A, B and D to K. The archive index lists only standings for Armenia in 2011.

    Our copy holds 147 pages, several of them the same address saved under http and https.
