  description: |-
    Final scoreboard of the Armenia Subregional Contest of the 2014-2015 NEERC season, an HTML page with the contest clock at 5:00:00 of 5:00:00 and status over. It lists 23 teams against eleven problems, A to K, with the team members' names in the team cell. Each problem cell shows the number of rejected attempts and the time of the accepted run, followed by the number solved and total time. Three teams carry an asterisk before the name, which the page does not explain. Footer rows give total runs, accepted, rejected, first accept and last accept for each problem; problems C and E have no accepted run.

    The page states no contest date or place.
