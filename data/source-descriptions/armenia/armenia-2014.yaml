  title: ACM ICPC International Programming Olympiad
  language:
  - en
  - hy
  - ru
  description: |-
    Website of the ACM ICPC International Programming Olympiad of the Faculty of Informatics and Applied Mathematics (Yerevan State University), in English with Armenian and Russian versions of the pages. It has an organizing committee page (subregional director, jury chairman, head of the technical committee), a rules page, a teams page, a tasks page, a results page, a photo gallery page and a contact page with a form. A post dated 5 November 2014 lists the 20 teams of the 2014 edition, and the teams page lists the teams of 2015, 2014, 2013, 2012 and 2011. Posts for 2016 and for 2010 to 2013 are also in our copy; the 2016 teams post has no list.

    The results page gives per-problem tables with place, team, solved marks, total and penalty for 2015 (18 teams), 2014 (20 teams, problems A to K), 2013 (17 teams) and 2012 (18 teams). The tasks page holds only the heading Problem A and no statements. The photo gallery page shows no contest photographs. The front page announces "ACM ICPC 2015 Armenian QF" for October 24, so the site is shown in its 2015 state; the 2014 edition is in the dated post, the teams page and the results page.

    Our copy holds 134 saved files: 69 HTML pages on 56 distinct addresses (several saved under two address forms and in the three languages), one of them a webmail login page of the same host, together with style sheets, scripts and images.
