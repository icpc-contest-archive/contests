  description: |-
    Pages of the Northern Eurasia Contests website (NERC, hosted at neerc.ifmo.ru), in English with some Russian labels. It is not the Armenian contest's own site. The archive page for 2022 has a block for the Northern Eurasia Finals (standings, problems, problem analysis, jury archive, runs) and a block of regional contests. In the later capture it lists Armenia, Azerbaijan, Georgia, Kazakhstan, Northwestern Russia, Taurida, Ural and Uzbekistan, each with a standings link; Northwestern Russia also lists qualifier and contest statements, tutorials, runs and a test package. In the earlier capture of that page several of these are marked "No information is available". The Armenia entry gives only a link to its standings.

    Our copy holds 150 files, 120 HTML and 30 PDF, captured at various dates from 2012 to 2026; two are redirect stubs, and many pages are held under both http and https addresses. It has the archive pages for 2022, 2023 and 1996 to 2006, the Armenia regional standings pages for every year from 2004 to 2025 including 2022 and 2023, standings of other regional contests, the Northern Eurasia Finals standings, and problem statements, tutorials and a 2023 brochure as PDFs.
