  description: |-
    Pages of the Northern Eurasia Contests archive on the NEERC site, not specific to Armenia. Our copy holds 149 files, which are copies of 62 distinct pages, many saved several times under http, https and port 80 addresses. The 2005 archive page lists the resources of NEERC 2005 (standings, problems in PDF and PostScript, sample tests and jury solutions, history archive) and the regional contests of that year, among them Armenia with a link to its final standings. A 14-page PDF holds the eleven problems A to K of the 2005-2006 Northeastern European Regional Contest, headed November 30, 2005.

    The copy also holds the 2006 archive page with the PDFs of the 2006-2007 problems (15 pages) and of its Northern subregional contest, the standings pages of the other regional contests of 2005 and 2006, an Armenia standings page for every year from 2004 to 2025, and a 14-page statements PDF of the ICPC 2024-2025 Armenia Regional Contest. The pages are mostly in English; some 2005 standings pages are in Russian. The history archive and the sample tests and jury solutions named on the archive pages are not in our copy.
