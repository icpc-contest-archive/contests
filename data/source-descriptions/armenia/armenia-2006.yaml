  description: |-
    Pages of the Northern Eurasia Contests archive on the NEERC site, not specific to Armenia. Our copy holds 149 files, which are copies of 60 distinct pages, many saved several times under http, https and port 80 addresses. The 2006 archive page lists the resources of NEERC 2006 (standings, problems in PDF, tests and jury solutions) and the regional contests of that year, among them Armenia with a link to its final standings. A 15-page PDF holds the eleven problems A to K of the 2006-2007 Northeastern European Regional Contest, headed November 29, 2006 and naming Yerevan among its sites.

    The copy also holds the 2007 archive page with a 14-page PDF of the twelve problems of the 2007-2008 contest, the Northern subregional problem PDFs of 2006 and 2007, the standings pages of the other regional contests of 2006 and 2007, an Armenia standings page for every year from 2004 to 2025, and a 14-page statements PDF of the ICPC 2024-2025 Armenia Regional Contest. The pages are in English. The tests and jury solutions named on the archive pages are not in our copy.
