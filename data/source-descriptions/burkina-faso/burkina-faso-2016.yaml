    Problem set as a PDF of nine pages in English. Every page carries the header The 2016 Burkinabe Collegiate Programming Contest (C, C++, JAVA), with University Ouaga 1 and 16th April 2016. It holds seven problems A to G, each with the colour of its balloon: A Funny plate, B Beautiful square, C Ouagadougou, D newspapers, E Root, F Sums and G Fingerpainting. Each has a statement with standard input and output sections and a sample input and output; A, B, C and D include pictures.

