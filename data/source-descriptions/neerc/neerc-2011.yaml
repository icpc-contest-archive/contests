  contest_date: '2011-11-27'
  description: |-
    Archive section of the Northern Eurasia Contests website (the NEERC site hosted by ITMO) for the 2011 final. The seed page is headed NEERC 2011 and links the contest final standings, the problems in PDF, the statements sources in TeX, the official tests with generators and jury solutions, and an analysis presentation. It also lists 15 regional contests with links to their standings, and for one of them (Northwestern Russia) also problem statements, tests, a jury archive, runs and a log as links. A separate page of the site gives the schedule for 25 to 27 November 2011 at St Petersburg National Research University ITMO, with the contest on Sunday 27 November, and notes that the contest runs in St Petersburg, Barnaul, Tashkent and Tbilisi, and gives accommodation and meal information.

    Our copy holds 100 files. Of the 2011 edition it has the final standings, the 16-page problem set, the 13-page analysis slides, the schedule page, the standings pages of all 15 regional contests and the 13-page problem statements PDF of Northwestern Russia. It also holds the corresponding pages of the 2012 edition and pages of the school olympiad section. The downloads linked from the seed page (statements sources, tests, jury archive and the Northwestern Russia archives) are not in our copy.
