    Contest dashboard on QOJ.ac headed "The 2013 Northeastern Europe Regional Contest (NEERC 2013)", filed under ICPC / Regionals / Northern Eurasia. It lists eleven problems A to K by title, from ASCII Puzzle to Kabaleo Lite, and states that the contest has ended, under the ICPC ruleset with a penalty of 20 minutes and a scoreboard frozen after 4:00:00. Tabs lead to the submissions, standings, external standings and discussions, and under Attachments are "Statements (en)" and "Tutorials (en)"; neither attachment nor the problem pages are in our copy.
