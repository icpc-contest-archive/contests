  description: |-
    Final scoreboard of the contest as an HTML table: 228 teams, eleven problems A to K. The page shows the clock at 5:00:00 of 5:00:00 with status over. Each team row gives rank, team name with the surnames of its members (two or three), for each problem the number of rejected runs and the time of the accepted run, the number solved and the total time. The team names carry the institution but there is no separate institution or country column. Ties share a rank: the last five teams, with no problem solved, are all ranked 224. The first place is SPb SU 4 with 8 problems solved and a total time of 613.

    Below the teams, summary rows give for each problem the total runs, accepted and rejected runs, and the times of the first and last accepted run.
