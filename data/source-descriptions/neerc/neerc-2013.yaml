  description: |-
    Problem set as a PDF of 14 pages in English. Every page carries the running header ACM ICPC 2013-2014, Northeastern European Regional Contest, with the sites St. Petersburg, Barnaul, Tbilisi and Tashkent and the date December 1, 2013. It holds eleven problems, A to K: ASCII Puzzle, Bonus Cards, Cactus Automorphisms, Dictionary, Easy Geometry, Fraud Busters, Green Energy, Hack Protection, Interactive Interception, Join the Conversation and Kabaleo Lite.

    Each problem has a full statement with input and output format and a sample input and output section. Ten problems name an input and an output file; problem I, which is interactive, uses standard input and output and describes the interaction protocol. No test data or solutions.
