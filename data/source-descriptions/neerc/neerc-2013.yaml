  description: |-
    Dashboard of the Codeforces gym for the contest, in English, with the status Finished. A short About text says NEERC 2013 took place in St. Petersburg, Barnaul, Tbilisi and Tashkent on November 30 - December 1, 2013. A problems table lists eleven problems A to K with their input and output file names (problem I uses standard input and output), the limits of 4 seconds and 256 MB, and the number of solvers of each. Contest materials link a statements PDF in English and a tutorial hosted on another site.

    The page also holds the Codeforces forms for questions and announcements and the notes for virtual participation. The statements, the standings and the submission pages are separate pages that are not part of our copy.
