  contest_date: '2013-12-01'
  description: |-
    Website of the Northern Eurasia Contests in English, here at the NEERC 2013 page of its archive. That page lists, for the final, the standings, the problem statements as a PDF and the official tests, and, for each of 15 regional contests (Northwestern Russia, Southern and Volga Russia, Ural, Central Russia, Belarus and Baltics, Moscow, West Siberian, East Siberian, Far Eastern Russia, Uzbekistan, Kazakhstan, Armenia, Georgia, Kyrgyzstan, Azerbaijan), a standings page; for Northwestern Russia it also lists problem statements, tests, a jury archive and a run log. A schedule page for NEERC 2013 gives the programme of 30 November and 1 December 2013 (registration, opening ceremony, practice session, contest, problems analysis, awards ceremony) at St Petersburg National Research University ITMO, with hostel and campus hotel information, partly repeated in Russian, and links the problems review PDF.

    The site is not limited to this edition: our copy holds 113 files, 99 of them pages (HTML and PDF), and includes the 2014 archive page with its standings and statements, the school olympiad pages for 2012 to 2015, and many pages in both an http and an https version. The 2013 test archives, jury archive and statements sources linked from the 2013 page are not in our copy; the Northwestern run log (XML) is. No style sheets or images were saved.
