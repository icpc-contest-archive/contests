  description: |-
    Category page NEERC 2013 of the Baekjoon Online Judge, in Korean, filed under ICPC Regionals and Northern Eurasia Finals. It lists ten problems of the contest as a table: Baekjoon problem number (9579 to 9588), the contest label, the English title, a column of labels (such as special judge, source, multilingual and category) and the counts of accepted users, submissions and the acceptance ratio. The labels are A to H, J and K; no row for problem I (Interactive Interception) is on the page. Nine of the ten rows carry the special judge tag.

    The statements themselves are on the linked problem pages, which are not part of our copy. The site menus and sidebars are Korean.
