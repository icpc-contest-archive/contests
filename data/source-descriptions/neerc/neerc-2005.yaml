  description: |-
    Website of the Northern Eurasia contests (neerc.ifmo.ru), in English. The archive page for NEERC 2005 links the final standings, the problems in PDF and in PostScript format, tests with jury solutions, and a contest history for watching the contest flow, followed by the regional contests of that season: Northwestern Russia, Southern and Volga Russia, Ural (with a Russian day and an English day page), Central Russia, Belarus and Baltics, Moscow, West Siberian, East Siberian, Far Eastern Russia, Uzbekistan, Kazakhstan, Armenia, Georgia, Kyrgyzstan and Azerbaijan. Each has a standings page; Northwestern Russia also lists problem statements, statement sources and tests with jury solutions.

    Our copy holds 142 saved files, many of them the same page under several addresses, and 23 distinct pages of the 2005 edition: the archive page, the main standings, the problem statements PDF, and 20 standings pages of regional contests, some with Russian text. It also holds pages of the 2006 edition and of later editions up to 2018. The PostScript problems, the tests and jury solutions, the contest history and the Northwestern Russia downloads are linked but are not in our copy.
