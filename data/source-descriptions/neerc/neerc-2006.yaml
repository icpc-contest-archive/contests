  description: |-
    Website of the Northern Eurasia contests (neerc.ifmo.ru), in English. The archive page for NEERC 2006 links the final standings, the problems in PDF format and the official tests and jury solutions, followed by the regional contests of that season, each with a standings page: Northwestern Russia (also with its problem statements in PDF and its tests and jury solutions), Southern and Volga Russia, Ural, Central Russia, Belarus and Baltics, Moscow, West Siberian, East Siberian, Far Eastern Russia, Uzbekistan, Kazakhstan, Armenia, Georgia and Kyrgyzstan. For Azerbaijan the page says no information is available.

    Our copy holds 141 saved files, many of them the same page under several addresses, and 19 distinct pages of the 2006 edition: the archive page, the main standings, the problem statements PDF, a 15-page PDF of the problems of the Northern Subregional Contest (St Petersburg, November 5, 2006), and 15 standings pages of regional contests. It also holds pages of the 2007 edition and of later years. The tests and jury solutions are linked but are not in our copy.
