  description: |-
    Standings headed View Standings, The 2003 ACM Northeastern Europe Programming Contest sponsored by IBM, in English. The Final Round (NEERC Finals) table lists 121 teams as university and team name. 111 of them have a rank, a citation column, followed by two numbers without column headings (for the first place, 10 and 1524); the first 80 carry a place citation such as First Place, and the ten others are listed at the end without a rank or results as Honorable Mention. St Petersburg Institute of Fine Mechanics and Optics (SPb IFMO) is first with ten problems and a time of 1524, Nizhny Novgorod State University (NNSU) second and Moscow State University (RoVD) third.

    The page then has tables for twelve preliminary sites (Central, East Siberian, Eastern, Far Eastern, Moscow, Northern, Southern, West Siberian and Western Subregions, Kazakhstan, Middle Asia Subregion and Transcaucasian Group), 555 teams in all, listed without ranks or results as Honorable Mention. There is no per-problem detail.
