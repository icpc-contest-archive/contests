  read: '2026-11-16'
  rubric: 1
  copy: neerc/neerc-2003/website/2026-09-05-wayback-88d7fcfd
  title: Northern Eurasia Contests
  language:
  - en
  description: |-
    Website of the Northern Eurasia Contests (NEERC), in English. Our copy holds 142 saved files (91 HTML pages, 49 PDFs, one PostScript file and one zip file), which are 59 different addresses once http, https and port variants are merged. The page headed NEERC 2003 lists the resources of the contest: the final standings, the problems in PostScript and in PDF, a jury archive (sample tests, generators, checkers, sample solutions) and a picture gallery. It also lists the regional contests by area, each with a link to its standings: Northwestern Russia (also problem statements and an archive), Southern and Volga Russia, Ural, Central Russia, Belarus and Baltics, Moscow, West Siberian, East Siberian, Far Eastern Russia, Uzbekistan and Kazakhstan.

    Of the 59 addresses, 18 belong to 2003: that page, the final standings, the problems as PDF and as PostScript, and 14 standings addresses of regional contests. These are ten areas with one standings page each and one area with a page for each of two days, saved under both an ural and an eastern address. The jury archive, the regional problem and archive files and the picture gallery are not in our copy.

    The site also holds other editions: 22 addresses of 2004 (final standings, regional standings and a problems PDF) and 19 files from 2010 to 2018 (PDFs of problem statements, reviews and analyses, and a zip file for 2018). The other years appear only as menu links.
