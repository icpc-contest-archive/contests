    Problem set as a PDF of 13 pages, in English. The heading names the ACM ICPC 2003-2004 Northeastern European Regional Contest, with St Petersburg, Barnaul and Yerevan as places and 26 November 2003 as the date. It holds the statements of eleven problems, A to K: Alternative Scale of Notation, Bring Them There, Code Formatting, Data Mining, Entropy, Farmer Bill's Problem, Game, Hypertransmission, Illumination, Jurassic Remains and King's Quest. Each starts with input and output file names and time and memory limits, and eleven problems each have a section with a sample input and output. No test data or solutions.
