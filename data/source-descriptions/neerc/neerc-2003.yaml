  description: |-
    Final scoreboard titled Standings, ACM ICPC 2003-2004 NEERC, at 5:00:00 of 5:00:00 with status over. It lists 115 teams with rank, team name, a cell for each of the eleven problems A to K, the number solved and the total time. Solved cells give the number of earlier rejected runs and the solving time in minutes; unsolved problems with rejected runs show a minus sign and a count, and untried problems show a dot. SPb IFMO 1 is first with ten problems and 1524 minutes. Fourteen teams solved nothing and share rank 102. No team solved problem I. Below the teams, rows give total runs, accepted, rejected, first accept and last accept for each problem. The page has a Show time switch.
