  title: Northern Eurasia Contests
  language:
  - en
  description: |-
    Archive section of the Northern Eurasia contests website (NEERC), in English. The 2008 page, headed NEERC 2008, links the final standings, the problems in PDF and PostScript, the statements as TeX sources, and tests and jury solutions, and lists the regional contests of that year, from Northwestern Russia to Azerbaijan, each with a standings link; Northwestern Russia also has links to PostScript statements, generated tests, jury solutions and an archive. A separate announcement page says the contest takes place in St Petersburg, Barnaul, Tashkent and Batumi on November 26, with the events at the Anichkov Palace complex, and gives the programme from registration on November 24 to a bus tour and solutions discussion on November 27.

    Our copy holds 74 saved files, some of them the same page saved under http and https addresses. For 2008 it has the page itself, the announcement page, the final standings page, the 14-page statements PDF with 11 problems, and the standings pages of 15 regional contests. It also holds the matching pages for the 2009 contest and 22 files from a school olympiad section of the site. The tests, jury solutions, PostScript statements and TeX sources of 2008 are linked but are not in our copy.
