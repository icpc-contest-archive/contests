    Final scoreboard of the contest, status over at 5:00:00 of 5:00:00, with a "Show time" checkbox. 201 teams are listed with rank, team name (an abbreviated university name and number, followed by the team members' names) and, for each of the eleven problems A to K, a plus sign with extra tries and the minute of acceptance, a minus sign with failed tries, or a dot for no attempt. The last two columns give the number of problems solved and the total time. Saratov SU 1 is first with 9 problems and a time of 1012; four teams solved 9. The 23 teams that solved nothing are listed at the bottom.

    Below the table, five rows labelled Total runs, Accepted, Rejected, First Accept and Last Accept give a figure for each problem.
