  description: |-
    Codeforces gym dashboard of the contest, marked Finished, with links for the contest website, virtual participation, practice, statements (en), submit, status and standings. Eleven problems A to K are listed (Aerodynamics, Blind Walk, Clock, Drive through MegaCity, Exclusive Access, Fibonacci System, Giant Screen, Hell on the Markets, iSharp, Javanese Cryptoanalysis, KINA Is Not Abbreviation), each with a limit of 2 s and 256 MB and a count written with an x (x138 for A). Ten read from named input and output files; problem B uses standard input/output. All eleven carry a footnote marker; the note says the package was not updated after the judging servers were upgraded and that execution time is multiplied by 2. The statements themselves are not on this page; it links to them as a PDF.
