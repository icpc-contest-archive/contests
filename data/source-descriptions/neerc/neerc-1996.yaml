  description: |-
    Pages of the NEERC archive on the organisers' site, in English, for the 1996-97 contest. The resources page for 1996 lists five items: the final standings, the problems in Microsoft Word format, sample tests, detailed results with contest flow information, and jury solutions, plus a Turing machine emulator for problem C. Our copy holds six pages (the resources page and the standings page, each saved under more than one address and in two page layouts) and the problems zip archive.

    The standings page and the problems archive are in our copy. The sample tests, detailed results, jury solutions and emulator are linked from the resources page but are not part of our copy.
