  description: |-
    Contest magazine page of the ACM 1996-97 NorthEastern European Regional Collegiate Programming Contest, in English: seven problems A to G (Table, Black Box, Turing calculator, DEL command, Parallelepiped walk, Random number, Moscow time). Each problem has a statement with the output file OUTPUT.TXT and a time limit per test (15 or 20 seconds); problems A, B, D, E, F and G also name the input file INPUT.TXT, and most give examples. Problem C, instead, describes a Turing machine interpreter that the solution is tested with. The page links to the Turing machine interpreter, the tests and the solutions as zip files; those files are not part of our copy. Our copy keeps the page's seven GIF images.
