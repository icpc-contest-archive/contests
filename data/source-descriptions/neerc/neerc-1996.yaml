  description: |-
    Final standings headed ACM ICPC 1996-1997 NEERC, shown as over at 5:00:00 of 5:00:00: 71 teams, each named by its institution, with the number solved, penalty time and rank. For each of problems A to G the table gives the number of attempts, marked + for a solved problem (with the number of earlier failed attempts) and - for failed attempts; it has no per-problem times. The first-place team solved four problems; 20 teams solved none and share the last rank, 52. No team has any entry for problem C. Ties share a rank.
