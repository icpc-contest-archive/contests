    Codeforces gym page of the contest 2012-2013 ACM-ICPC Northeastern European Regional Contest (NEERC 12), marked Finished. It lists the twelve problems A to L with their names, input and output file names, time and memory limits and a count beside each problem, and has a link to the statements in English (a PDF), a link labelled "Разбор задач (en)" (razbor zadach, "problem analysis") to slides on another site, options to submit, to register for practice or to take a virtual participation. The page also holds forms for questions and announcements. The problem statements themselves are behind links and not in our copy.
