  description: |-
    Slides of 13 pages by Roman Elizarov with short bullet-point outlines of how to solve the problems of the contest. Page 1 carries only his copyright line; pages 2 to 13 take one problem each, in the order of the set from the easiest problem to the last. They cover for example the bubble layout, a knapsack over bit strings, the folding of the snake cube, counting Hyperdrome strings, the protein peaks and the Minotaur labyrinth; the sweeping-line problem is called the hardest ever given on NEERC.
