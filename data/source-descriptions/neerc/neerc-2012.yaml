    Final standings of the 2012 Northeastern Europe Regional Contest: 229 teams with rank, team name, institution, problems solved, penalty time, medal, citation and site citation. Four gold, four silver and four bronze medals are marked, for the first twelve places. Every team has a citation: the places from First Place to One-hundred Fourteenth Place, then Honorable Mention for the remaining 115 teams, which include the 15 teams with no solved problem, all at rank 215. The site citation column names four site champions (St Petersburg, Barnaul, Tashkent and Tbilisi). There is no per-problem detail. First place goes to SPb NRU ITMO 1 of St. Petersburg ITMO University with 11 solved.
