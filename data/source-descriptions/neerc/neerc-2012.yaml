  contest_date: '2012-12-02'
  description: |-
    Archive section of the Northern Eurasia Contests website (the NEERC site hosted by ITMO) for the 2012 final. The seed page is the NEERC 2012 page of the archive; it links the contest final standings, the problems in PDF, the official tests and the test generators with jury solutions, and lists 15 regional contests with links to their standings, and for one of them (Northwestern Russia) also problem statements, tests, a jury archive, statements sources and a log as links. A separate page gives the schedule from Friday 30 November to Sunday 2 December 2012 at St Petersburg National Research University ITMO, with the contest on Sunday from 10:00 to 15:00, followed by the problems analysis and the awards ceremony, adds accommodation and meal information, and links a problems review.

    Our copy holds 116 files. Of the 2012 edition it has the final standings, the 14-page problem set, the 13-page review slides, the schedule page, the standings pages of all 15 regional contests, the problem statements PDFs of Central Russia (20 pages) and Northwestern Russia (13 pages) and an XML file of the Northwestern Russia standings, linked on the seed page as the log. It also holds the corresponding pages of the 2013 edition and pages of the school olympiad section. The test archives linked from the seed page (official tests, jury solutions, Northwestern Russia archives) are not in our copy.
