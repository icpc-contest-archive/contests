  description: |-
    Final scoreboard of the 2012 Northeastern European Regional Contest: 229 teams with rank, team name and members, and a column for each of the twelve problems A to L. Each cell gives a plus (solved) with the number of rejected attempts and the time of the accepted run in minutes, a minus with the number of rejected attempts for an unsolved problem, or a dot for no attempts. The last columns give the number solved and the total penalty time. The page header shows the contest clock at 5:00:00 of 5:00:00 with status over, and a switch to show or hide times.

    The table ends with summary rows per problem: total runs, accepted, rejected, time of the first accept and time of the last accept. First place goes to SPb NRU ITMO 1 with 11 problems solved.
