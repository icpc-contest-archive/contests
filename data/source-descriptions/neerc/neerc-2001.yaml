  description: |-
    Contest information pages of the 2001 ACM Northeastern Europe Programming Contest, in English. The front page, titled Regional Contest Information, names the contest as sponsored by IBM and hosted by St. Petersburg IFMO in St. Petersburg, Russia, gives the dates 26 - 28 November 2001, says that winners go on to the World Finals in Honolulu, and links to a team roster, the standings and the problems.

    Our copy holds 18 pages: the front page, a problems index, and the eight problem statements A to H, each as an HTML page and as a PDF (the eight PDFs have 12 pages in all). The statements carry the contest name, the problem letter and title, the problem text, input and output specifications and sample input and output. DOC and RTF versions of the statements, two images and a style sheet are saved beside the pages. The roster and standings links lead to other servers and are not part of our copy.
