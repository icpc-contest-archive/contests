  description: |-
    Standings page for The 2001 ACM Northeastern Europe Programming Contest sponsored by IBM, with ten tables of rank, team and citation. The first is the Final Round (NEERC Finals) with 110 teams: the first 76 rows carry a rank and a place name, from First Place (SPb IFMO 1 of the St Petersburg Institute of Fine Mechanics and Optics) down, and the other 34 are listed as Honorable Mention without a rank. Each team is shown as its institution followed by the team name.

    The other nine tables are preliminary sites: the Central, East-Siberian, Eastern, Far Eastern, Northern, Siberian, Southern and Western subregions and the Transcaucasian group. Their teams are listed only as Honorable Mention, without rank. There are no solved counts, times or problem columns.
