  description: |-
    Scoreboard titled ACM ICPC 2001-2002 NEERC, with the clock at 5:00:00 of 5:00:00 and status over. It lists 99 teams by rank, team name (for example SPb IFMO 1, Saratov SU 3), eight problem columns A to H, a column headed = with the number solved, and a time column. A problem cell shows + for solved or - for unsolved, followed by the number of wrong tries, and for solved problems a time; a dot marks a problem with no attempt. First place, SPb IFMO 1, solved seven problems with a time of 1190.

    Below the teams, rows give total runs, accepted runs, rejected runs, first accept and last accept for each problem. The 22 teams that solved nothing are listed at the end, all with rank 78.
