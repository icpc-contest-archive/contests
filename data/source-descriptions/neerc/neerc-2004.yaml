  description: |-
    Website of the Northern Eurasia contests (neerc.ifmo.ru), in English. The page for NEERC 2004 lists the final standings, the problems in PDF format, a jury archive (problem statement sources, sample tests, sample jury solutions), a contest history for watching the contest flow, the runs, and four picture galleries (opening ceremony, during the contest, two for the awards ceremony). Below it come the regional contests of that season: Northwestern Russia, Southern and Volga Russia, Ural (with a day 1 and a day 2 page), Central Russia, Belarus and Baltics, Moscow, West Siberian, East Siberian, Far Eastern Russia, Uzbekistan, Kazakhstan, Armenia, Georgia and Kyrgyzstan. Each has a standings page; Northwestern Russia also lists problem statements, tests and jury solutions.

    Our copy holds 141 saved files, many of them the same page under several addresses, and 22 distinct pages of the 2004 edition: the archive page, the main standings, the problem statements PDF, and 19 standings pages of regional contests, some of them with Russian text. It also holds pages of the 2005 edition and a few of later years. The jury archive, contest history, runs, picture galleries and the Northwestern Russia downloads are linked but are not in our copy.
