    Final scoreboard headed ACM ICPC 2004-2005 NEERC, at 5:00:00 of 5:00:00 with status over: 173 teams ranked 1 to 164, with ties sharing a rank, and a column for each of the twelve problems A to L, the number solved (=) and total time. A cell with a plus sign shows the time of the accepted run as minutes:seconds, preceded by the number of rejected tries when there were any; a cell with a minus sign shows only the number of rejected tries; a dot marks a problem without a submission. Ten teams have no problem solved. Team names are mostly short university names, usually with a number, for example SPb IFMO 1 in first place with 12 problems and a total time of 1421.

    Below the table are totals per problem: total runs, accepted, rejected, first accept and last accept. The page has a style sheet, which is in our copy.
