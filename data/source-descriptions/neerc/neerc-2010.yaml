  title: Northern Eurasia Contests
  language:
  - en
  - ru
  description: |-
    Website of the Northern Eurasia Contests (NEERC), in English; the school olympiad pages are in Russian. Our copy holds 103 pages (HTML and PDF): 66 archive pages for 2010 and 2011, 4 pages of the regional contests section (2010 and 2011), and 33 pages of the school olympiads in St Petersburg, mostly from 2009 to 2012 with a few from 2020.

    The archive page headed NEERC 2010 lists the final standings, the problems in PDF, the statement sources in TeX, the official tests, and test generators with jury solutions. A schedule page announces NEERC 2010 for St Petersburg, Barnaul, Tashkent and Tbilisi on 24 November, with the programme for 22 to 24 November. Our copy holds the 13-page PDF of the problem statements and a 15-page PDF titled NEERC 2010 Problem Review, slides with a short outline of the solution of each of the eleven problems. Standings pages of thirteen subregional contests of 2010 are in our copy, from Northwestern Russia, Southern and Volga Russia and Ural to Uzbekistan, Kazakhstan, Armenia and Georgia; the archive page says no information is available for Kyrgyzstan and Azerbaijan. Northwestern Russia also has a problems PDF and two analysis PDFs. The TeX sources, tests and jury archive are linked but not in our copy. Style sheets and images are not in our copy.
