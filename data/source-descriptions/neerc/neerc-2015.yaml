  description: |-
    Final scoreboard of the Northeastern European Regional Contest 2015-2016: 224 teams ranked 1 to 213 (ties share a rank), with twelve problems A to L. Each team row gives the team name with the surnames of its three members, a cell per problem and then the number solved and the total time. A solved problem shows a plus sign, the number of wrong tries if any, and the time as minutes and seconds; an unsolved problem shows a dot, or a minus sign with the number of rejected tries. The clock reads 5:00:00 of 5:00:00 with status over.

    Ural Federal University 1 is first with 11 problems solved and a total time of 1468. Below the teams are summary rows per problem: total runs, accepted, rejected, first accept and last accept.
