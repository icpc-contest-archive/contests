  description: |-
    Problems review slides by Roman Elizarov, dated December 6, 2015, in English: a PDF of 40 pages. The opening recaps the contest as 224 teams, 12 problems and 5 hours, the 20th NEERC (Jubilee), and a summary table gives for each problem the author of the idea, the number of teams that solved it out of the total runs, and the success rate.

    Each of the twelve problems A to L then has a section of two to five slides with the solution idea. Eleven of them open with statistics: accepted and rejected runs in Java and C++, the fastest and shortest solutions and the team with the most attempts; problem I, which no team solved, has none. The last slide credits the jury and assistants.
