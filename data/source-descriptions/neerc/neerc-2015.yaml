    Problem set of the contest: a PDF of 14 pages in English, headed on every page "ACM ICPC 2015–2016, Northeastern European Regional Contest. St. Petersburg – Barnaul – Tbilisi – Tashkent, December 6, 2015". It holds twelve problems, A (Adjustment Office) to L (Landscape Improved).

    Each problem has its statement, the input and output format and a sample input and output. Problems A to I, K and L name input and output files; problem J is interactive and uses standard input and output. The samples of problems B, E, G and I are followed by an explanation. No test data or solutions.
