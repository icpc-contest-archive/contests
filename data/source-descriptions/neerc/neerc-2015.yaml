  contest_date: '2015-12-06'
  description: |-
    Website of the Northern Eurasia Contests (NEERC and its regional contests), mainly in English with some Russian text. Our copy holds 150 files, 146 of them pages, and covers many editions: the archive menu lists the years 1996 to 2021, there are pages of the contest for 1995 to 2022, and the site also holds the 2016 edition and pages of school olympiads, mostly in Russian.

    For 2015 the archive page lists the final standings, the problems in PDF, the official tests and the jury archive, followed by the regional contests (Northwestern Russia, Moscow, Ural, Kazakhstan and others) with their standings. The page of the 2015 contest says NEERC 2015 took place in St Petersburg, Barnaul, Tashkent and Tbilisi on December 5-6, with all events at ITMO University, and gives the schedule (registration, opening ceremony, practice session, contest day, problems analysis, awards ceremony) and notes on hostel and hotel accommodation.

    Inside our copy are the final standings page with 224 teams, the 14-page problem statements PDF, the 40-page problems review PDF, standings pages of 16 regional contests and, for Northwestern Russia, a 12-page statements PDF. The analysis PDF of Northwestern Russia is cut off at 1 MiB and cannot be opened. The test and jury archives named on the archive page are not among the files we hold.
