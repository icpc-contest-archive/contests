  description: |-
    Standings of the 2015 Northeastern Europe Regional Contest: 223 teams with rank, team name, institution, number of problems solved, time and a citation. The first 111 teams carry an ordinal citation (First Place down to One-hundred Eleventh Place) and the remaining 112 teams, with three or fewer problems solved, are marked Honorable Mention. There is no per-problem detail.

    Ural Federal University is first with 11 problems solved and a time of 1468. The page gives no contest date and does not name the problems.
