  description: |-
    Final standings headed ACM ICPC 1997-1998 NEERC, shown as over at 5:30:00 of 5:30:00: 77 teams, each named by its institution, with the number solved, penalty time and rank. For each of problems A to H the table gives the number of attempts, marked + for a solved problem (with the number of earlier failed attempts) and - for failed attempts; it has no per-problem times. The first-place team solved four problems; 32 teams solved none and share the last rank, 46. No team solved problems D, F or H. Ties share a rank.
