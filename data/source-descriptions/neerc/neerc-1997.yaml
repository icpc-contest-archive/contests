  description: |-
    Pages of the NEERC archive on the organisers' site, in English, for the 1997-98 contest. The resources page for 1997 lists three items: the final standings, the problems in HTML format, and sample tests (described as not official). Our copy holds six pages: the resources page and the standings page, each saved under more than one address and in two page layouts.

    The sample tests and the problems archive are linked from the resources page but are not saved with these pages.
