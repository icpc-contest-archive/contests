  title: Northern Eurasia Contests
  language:
  - en
  contest_date: '2014-12-07'
  description: |-
    Website of the Northern Eurasia Contests in English, here at the NEERC 2014 page of its archive. That page lists, for the final, the standings, the problem statements as a PDF, the official tests, generators and jury solutions, statements sources and run logs (as 7z archives), and, for each of 16 regional contests (Northwestern Russia, Southern and Volga Russia, Ural, Central Russia, Belarus and Baltics, Moscow, Taurida, West Siberian, East Siberian, Far Eastern Russia, Uzbekistan, Kazakhstan, Armenia, Georgia, Kyrgyzstan, Azerbaijan), a standings page; Northwestern Russia also lists problem statements, tests, a jury archive, an analysis and runs. A schedule page for NEERC 2014 gives the programme of 6 and 7 December 2014 (registration, opening ceremony, practice session, contest, problems analysis, awards ceremony) at ITMO University, with hostel and campus hotel information, partly repeated in Russian, and links the problems review PDF.

    The site is not limited to this edition: our copy holds 118 files, 107 of them pages (HTML and PDF), and also includes the 2015 archive page with 28 files below it, the school olympiad pages for 2013 to 2016 (in Russian), and many pages in both an http and an https version. The test, generator, jury and run archives linked from the 2014 pages are not in our copy. The Northwestern analysis PDF stops at exactly 1 MiB and does not open. No style sheets or images were saved.
