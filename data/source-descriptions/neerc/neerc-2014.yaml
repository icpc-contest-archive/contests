  description: |-
    Problem set of the contest as a PDF of 15 pages in English. The running header names the ACM ICPC 2014-2015 Northeastern European Regional Contest and the sites St. Petersburg, Barnaul, Tbilisi and Tashkent, with the date December 7, 2014. It holds eleven problems, A to K: Alter Board, Burrito King, Cactus Generator, Damage Assessment, Epic Win!, Filter, Gomoku, Hidden Maze, Improvements, Jokewithpermutation and Knockout Racing.

    Each problem has a full statement with input and output format and at least one sample. Ten problems name an input and an output file; problem G, which is interactive, uses standard input and output and has an interaction protocol section. No test data or solutions.
