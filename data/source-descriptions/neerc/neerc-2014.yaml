    Dashboard of the Codeforces gym for the contest, in English, with the status Finished. A short About text says NEERC 2014 took place in St. Petersburg, Barnaul, Tbilisi and Tashkent on December 6-7, 2014. A problems table lists eleven problems A to K with their input and output file names (problem G uses standard input and output), the limits of 3 seconds and 256 MB, and the number of solvers of each. Contest materials link an announcement in Russian, a statements PDF in English and a video review of the problems in Russian.

    The page also holds the Codeforces forms for questions and announcements and the notes for virtual participation. The statements, the standings and the submission pages are separate pages that are not part of our copy.
