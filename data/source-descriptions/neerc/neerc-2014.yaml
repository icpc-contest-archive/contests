  description: |-
    Final standings of the contest: 248 teams with rank, team name, institution, number of problems solved, total time and a citation. The first 124 rows carry a place as the citation (First Place, Second Place and so on, down to the One-hundred Twenty-fourth Place); the other 124 teams are listed as Honorable Mention. The first place is SPb ITMO University 1 from St. Petersburg ITMO University with 9 problems solved and a total time of 761, followed by Moscow SU Tapirs with 9 and 930. A few places are shared by tied teams (27th, 60th and 118th each appear twice).

    The page gives no per-problem results.
