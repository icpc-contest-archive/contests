  description: |-
    Category page NEERC 2014 of the Baekjoon Online Judge, in Korean, filed under ICPC Regionals, Northern Eurasia and Northern Eurasia Finals. It lists the eleven problems of the contest, A to K, as a table: Baekjoon problem number (10589 to 10598, and 18931 for G), the contest label, the title, a column of labels (such as special judge, source, multilingual, interactive and category) and the counts of accepted users, submissions and the acceptance ratio. Most titles are the English ones; the titles of A and J are Korean. Seven of the eleven rows carry the special judge tag.

    The statements themselves are on the linked problem pages, which are not part of our copy. The site menus and sidebars are Korean.
