  description: |-
    Final scoreboard of the contest as an HTML table: 247 teams, eleven problems A to K. The page shows the clock at 5:00:00 of 5:00:00 with status over. Each team row gives rank, team name (usually an institution's name, often with a number) with the three members' surnames, for each problem the number of rejected runs and the time of the accepted run, the number solved and the total time. There is no separate institution or country column. Ties share a rank: the last 25 teams, with no problem solved, are all ranked 223. The first place is SPb ITMO University 1 with 9 problems solved and a total time of 761.

    Below the teams, summary rows give for each problem the total runs, accepted and rejected runs, and the times of the first and last accepted run.
