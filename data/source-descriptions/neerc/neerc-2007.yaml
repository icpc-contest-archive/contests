  description: |-
    Final scoreboard of the contest, status over at 5:00:00 of 5:00:00, with a "Show time" checkbox. 196 teams are listed with rank, team name (an abbreviated university name, usually with a number) and, for each of the twelve problems A to L, a plus sign with extra tries and the minute of acceptance, a minus sign with failed tries, or a dot for no attempt. The last two columns give the number of problems solved and the total time. SPb IFMO 1 is first with 8 problems, followed by nine teams with 7 each, led by Izhevsk STU and Stavropol SU; 49 teams solved nothing and share the last rank.

    Below the table, five rows labelled Total runs, Accepted, Rejected, First Accept and Last Accept give a figure for each problem. No run was accepted for problems C, D and K; D had no runs at all.
