  description: |-
    Archive section of the Northern Eurasia contests website (NEERC), in English. The 2007 page, headed NEERC 2007, lists the final standings, the problems in PDF format, tests and jury solutions, all runs made during the contest, and a history file for watching the contest in progress. Below these it lists the regional contests of that year, from Northwestern Russia to Kyrgyzstan, each with a standings link and, for three of them, problem statements and tests; Azerbaijan is marked as having no information.

    Our copy holds 142 saved files, many of them the same page saved under http, https and port-80 addresses. For 2007 it has the final standings page, the 14-page statements PDF with 12 problems, the standings pages of 14 regional contests, and one 11-page statements PDF for the Northern regional contest and one for the Georgia and Uzbekistan regional contests. It also holds the matching pages for 2008 and 19 files from 2010 to 2018 (18 PDFs and one zip). The tests and jury solutions, the runs and the history file of 2007 are linked but are not in our copy.
