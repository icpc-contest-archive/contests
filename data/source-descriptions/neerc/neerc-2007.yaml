  description: |-
    Codeforces gym dashboard of the contest, marked Finished, with links for virtual participation, practice, statements (en), submit, status and standings. Twelve problems A to L are listed (Ants, Building for UN, Cactus Reloaded, Diver, Equation, Fund Management, Game, Hanoi Towers, I18n, Japanese Writing, Kingdom Partitioning, Language Recognition), each with its input and output file names, a limit of 2 s and 256 MB, and a count written with an x (x189 for A) that links to the status page. All twelve carry a footnote marker; the note says the package was not updated after the judging servers were upgraded and that execution time is multiplied by 2. The statements themselves are not on this page; it links to them as a PDF.
