  description: |-
    Contest information page of the 2000 ACM Northeastern Europe Programming Contest sponsored by IBM. It names St. Petersburg IFMO (Sablinskaya 14, St. Petersburg) as host and 7 December 2000 as the date, says that students came from Belarus, Estonia, Latvia, Lithuania, Russia and adjacent areas, and that winners advance to the World Finals in Vancouver.

    The page links to the regional contest home page (on another server, not in our copy), a team roster, the standings and the problems. Our copy holds four pages: this page, the roster page of 410 teams, the standings page and a 20-page PDF with the problems.
