  description: |-
    Final scoreboard headed ACM ICPC 2000-2001 NEERC, with the clock shown as 5:00:00 of 5:00:00 and status over. It lists 106 teams against eight problems A to H. Each cell shows a plus for a solved problem, followed by the number of earlier wrong attempts if any, a minus and a number for attempts without a solve, or a dot for no attempt. Further columns give the number solved, the total time and the rank. Time is given per team only, not per problem.

    Teams are named by institution and number, for example SPb SU 1, which is first with eight problems solved. 15 teams solved nothing; they share rank 92. The page has no images.
