  description: |-
    Public team list of the 2000 ACM Northeastern Europe Programming Contest, marked as of 7/5/2002 5:04:26 PM Central Time. It lists 410 teams in ten groups: the NEERC Finals (101 teams) and the Central, East-Siberian, Eastern, Far Eastern, Northern, Siberian, Southern and Western subregions and the Transcaucasian group. One further entry in the Northern group is a placeholder with nonsense text. Each entry gives the institution and team name, the coach and the contestants' names; eleven entries, including the placeholder, have no contestants listed. 249 of the 411 institution names link to a website outside our copy.

    The list gives no results.
