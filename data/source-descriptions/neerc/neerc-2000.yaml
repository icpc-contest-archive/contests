  teams: 98
  description: |-
    Standings page of the 2000 ACM Northeastern Europe Programming Contest sponsored by IBM, dated 12/7/2000. The Final Round table (NEERC Finals) has 98 teams with rank, team and a citation: 68 teams carry a numbered place with a citation from First Place onward, and 30 are listed without a rank as Honorable Mention. Teams are given as university and team name. Places run in order with some numbers skipped, for example 8 is followed by 10.

    Nine more tables list the preliminary sites (Central, East-Siberian, Eastern, Far Eastern, Northern, Siberian, Southern and Western subregions, and the Transcaucasian group), 292 teams in all, every one an Honorable Mention without a rank. There are no solved counts, times or per-problem results.
