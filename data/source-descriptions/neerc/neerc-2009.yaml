  copy: neerc/neerc-2009/website/2026-09-05-wayback-29b909c0
  title: Northern Eurasia Contests
  language:
  - en
  - ru
  description: |-
    Website of the Northern Eurasia Contests (NEERC), in English; the school olympiad pages are in Russian. Our copy holds 134 pages (HTML and PDF): 65 archive pages for 2009 and 2010, 22 pages of the regional contests section for 1995 to 2014, and 47 pages of the school olympiads in St Petersburg, mostly from 2008 to 2011 with a few from 2020. Most addresses appear under both http and https.

    The archive page headed NEERC 2009 lists the final standings, the problems in PDF and PostScript, the statement sources in TeX, the official tests with jury solutions, and a monitor program. A schedule page announces NEERC 2009 for St Petersburg, Barnaul, Tashkent and Tbilisi on 11 November, with the programme for 9 to 12 November. Standings pages of fifteen subregional contests of 2009 are in our copy, from Northwestern Russia, Southern and Volga Russia and Ural to Uzbekistan, Kazakhstan, Armenia, Georgia, Kyrgyzstan and Azerbaijan; Northwestern Russia also has a problems PDF. The final standings and the 13-page problems PDF of NEERC 2009 are in our copy; the PostScript, TeX, test, jury and monitor files are linked but not in it. Pages for 2010 are of the same kind. Style sheets and images are not in our copy.
