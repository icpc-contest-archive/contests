    Final scoreboard of NEERC 2009-2010, status over at 5:00:00 of 5:00:00: 199 teams ranked from 1 to 184, tied teams sharing a rank. Each row gives the team name with the names of its three members, a cell for each of problems A to K, the number solved and the total time. A cell shows a plus sign with the number of rejected runs before it and the time of the accepted run, a minus sign with the number of rejected runs, or a dot. First place is Petrozavodsk SU 1 with nine problems solved and a total time of 1321. Five summary rows at the bottom give, for each problem, total runs, accepted, rejected, first accept time and last accept time.
