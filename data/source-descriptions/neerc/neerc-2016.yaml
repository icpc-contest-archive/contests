  description: |-
    Standings of the 2016 Northeastern Europe Regional Contest: 228 teams with rank, team name, institution, number of problems solved, time and a citation. The first 18 teams carry an ordinal citation (First Place to Eighteenth Place), the next 30 are Second Degree Diploma, 66 are Third Degree Diploma and the last 114, with two or fewer problems solved, are Honorable Mention. There is no per-problem detail.

    St. Petersburg State University is first with 9 problems solved and a time of 1525. The page gives no contest date and does not name the problems.
