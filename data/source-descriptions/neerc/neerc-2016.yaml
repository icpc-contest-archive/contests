  contest_date: '2016-12-04'
  description: |-
    Website of the Northern Eurasia Contests (NEERC and its regional contests), mainly in English with some Russian text. Our copy holds 108 files, 105 of them pages, and covers two editions, 2016 and 2017: both archive pages, both contest pages, and the final standings of each. It also holds pages of school olympiads, mostly in Russian.

    For 2016 the archive page lists the final standings, the problems in PDF, the official tests, the jury archive, all runs and a problems review, followed by the regional contests (Northwestern Russia, Ural, Moscow, Kazakhstan and others) with their standings. The page of the 2016 contest says NEERC 2016 took place in St Petersburg, Barnaul and Tbilisi on December 3-4 at ITMO University, with an additional site for Middle Asia teams to be announced, and gives the schedule (registration, opening ceremony, practice session, contest day, problems analysis, awards ceremony) and notes on hostel and hotel accommodation.

    Inside our copy are the final standings page with 228 teams, the 15-page problem statements PDF, the 49-page problems review PDF, standings pages of 16 regional contests and, for Northwestern Russia, a 12-page statements PDF. The analysis PDF of Northwestern Russia is cut off at 1 MiB and cannot be opened. The test and jury archives named on the archive page are not among the files we hold.
