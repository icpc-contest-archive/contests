  description: |-
    Problems review slides in English, dated December 4, 2016: a PDF of 49 pages. The opening recaps the contest as 228 teams, 13 problems and 5 hours, and a summary table gives for each problem the author of the idea, the number of teams that solved it out of the total runs, and the success rate.

    Each of the thirteen problems A to M then has a section of two to seven slides with the solution idea. Twelve of them open with statistics: accepted and rejected runs by language, the fastest and shortest solutions and the team with the most attempts; problem I, which no team solved, has none. The last slide credits the jury and assistants.
