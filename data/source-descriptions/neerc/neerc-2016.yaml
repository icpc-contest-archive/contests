    Problem set of the contest: a PDF of 15 pages in English, headed on every page "ACM ICPC 2016–2017, Northeastern European Regional Contest. St. Petersburg – Barnaul – Tbilisi – Almaty, December 4, 2016". It holds thirteen problems, A (Abbreviation) to M (Mole Tunnels).

    Each problem has its statement, the input and output format and an Examples section. Problems A to H and J to M name input and output files; problem I is interactive and uses standard input and output. The examples of problems G, I and M are followed by an explanation. No test data or solutions.
