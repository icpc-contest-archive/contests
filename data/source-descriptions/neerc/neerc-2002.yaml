  description: |-
    Standings headed View Standings, The 2002 ACM Northeastern Europe Programming Contest sponsored by IBM, with rank, team and citation but no results per problem. The Final Round (NEERC Finals) table lists 115 teams as university and team name: 97 with a rank, 76 of them with a place citation such as First Place, and 18 listed without a rank as Honorable Mention. Moscow State University (MSU1) is first, Nizhny Novgorod State University (NNSU#2) second and Saratov State University (SaratovSU #3) third.

    Below the final are tables for eleven preliminary sites (Central, East Siberian, Eastern, Far Eastern, Northern, Southern, West Siberian and Western Subregions, Middle Asia, Transcaucasian group and one headed delete it), where the teams are all listed as Honorable Mention without ranks. Ten of these tables hold teams, 379 rows in all, and the one headed delete it is empty.
