    Results of the national qualifier of 14 July 2017 on the organisers' site, headed 結果と順位 ("Results and ranking"), in Japanese. The table lists 391 teams with rank, team name, institution, number solved, time, a rule letter and an award mark: 358 teams carry ranks 1 to 358 and 33 teams with no problem solved are listed with a dash. The text explains that the teams marked A to D under the rule column, 43 in all, were selected for the Tsukuba regional; the table holds 39 marked A, three C and one B. The 36 top teams carry an award mark, the commendation described on the page. Team sleep 18000 of The University of Tokyo is first with 8 problems solved. There is no per-problem detail.
