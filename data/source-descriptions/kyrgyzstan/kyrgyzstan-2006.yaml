  description: |-
    Pages of the Northern Eurasia Contests website (NEERC, hosted at ITMO) for the 2006 season, in English with some Russian. The year page headed "NEERC 2006" lists the finals (standings, problems, tests and jury solutions) and the subregional contests, each with a link to its standings except Azerbaijan, which says no information is available; only the Northwestern Russia entry also links problem statements and tests and jury solutions. The Kyrgyzstan subregion has a standings link only.

    Our copy holds 150 saved files, which are 52 distinct addresses once http, https and port-80 copies are merged; one of them is a redirect stub for the site root. 19 of the addresses belong to the 2006 archive: the year page, the finals standings, two PDFs of 15 pages (the finals problem statements, problems A to K, Northeastern European Regional Contest, November 29, 2006; and the Northern Subregional problems of November 5, 2006, A to K), and 15 standings pages of subregional contests including Kyrgyzstan, whose page lists 34 teams. The rest are 20 pages of the 2007 archive, one page each of 2004 and 2005, and one page each from the archives of 2008 to 2019 (not every year).

    Only HTML and PDF files are saved: images and style sheets are not in our copy, nor are the rar archives linked from the year page.
