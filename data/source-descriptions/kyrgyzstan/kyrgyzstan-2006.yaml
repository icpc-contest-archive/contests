  description: |-
    Final scoreboard of the Kyrgyzstan subregional contest, a page of the Northern Eurasia (NEERC) archive with the clock at 5:00:00 of 5:00:00 and the status "over". 34 teams are listed by short name (for example Kyrgyz-Russian Slav U 1), with a cell for each of the nine problems A to I (entries such as +, +2, -9 or a dot), the number of problems solved, a time column and the rank.

    13 teams solved at least one problem, and six of the nine problems were solved by some team. Kyrgyz-Russian Slav U 1 is first with four problems and time 495, ahead of Kyrgyz NU 1 with four and 638; two teams share rank 12. The other 21 teams solved nothing and all carry rank 14. Per-problem solve times are not given, no institution column is shown, and no teams are marked as unofficial.
