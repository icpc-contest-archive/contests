  description: |-
    Pages of the Northern Eurasia Contests (NEERC) archive, in English. Our copy holds 150 saved files; several of them are the same page saved under http, https and port-80 addresses. They cover the 2008 and 2009 seasons, plus the Kyrgyzstan standings pages of 2004 to 2007, 2011 to 2017 and 2019.

    The 2008 season page links the finals and 15 regional contests, among them Kyrgyzstan, each with a link to its final standings; our copy holds the finals standings and the standings pages of those regional contests, and the same for 2009. The Kyrgyzstan page of 2008 is a scoreboard of 36 teams with problems A to I. The only problem set of 2008 in our copy is a 14-page PDF of the Northeastern European Regional Contest finals (St Petersburg, Barnaul, Tashkent and Batumi, 26 November 2008) with problems A to K. The 2009 pages add the 13-page finals problems PDF, the 14-page Northern Subregional problems PDF and a slide file of the Northern Subregional analysis.
