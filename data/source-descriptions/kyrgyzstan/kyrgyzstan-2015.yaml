  description: |-
    Archive site of the Northern Eurasia contests (NEERC), in English. The 2015 page lists the NEERC 2015 finals resources (standings, problems, official tests, jury archive) and 16 regional contests, each with a link to its final standings, among them Kyrgyzstan; the Northwestern Russia entry also lists problem statements, tests, analysis and runs. The page's side menu links every year from 1996 to 2020.

    Our copy holds 150 files, which are 58 distinct addresses saved under several schemes and capture dates. They cover the 2015 and 2016 year pages, 22 addresses under each of those two years (regional standings pages, the finals standings, PDFs of the finals problems and review, and statement and analysis PDFs of the Northwestern Russia contest), and a Kyrgyzstan standings page for each of 12 other years (2004 to 2009, 2011 to 2014, 2017 and 2019). Our copy has no registration, rules or schedule pages of the Kyrgyz contest.
