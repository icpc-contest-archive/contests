  description: |-
    Final scoreboard of the Kyrgyzstan Subregional 2015, shown at 5:00:00 of 5:00:00 with status over: 40 teams against nine problems labelled A to I. Each row gives rank, team name with its three members in brackets, a cell per problem (a plus with the solving minute and earlier failed attempts, or a minus and the number of failed attempts), the number solved and the total time. Rank 1 solved 8 problems in 832 minutes; ranks 1 to 32 are consecutive and the last eight teams share rank 33 with nothing solved. Problem A was not solved by any team. Eight cells are highlighted as first to solve.

    Four teams have an asterisk before their name and are ranked in sequence with the others; the page does not say what the asterisk means. Rows at the bottom total runs, accepted and rejected runs per problem and the first and last accepted time. The page has a Show time checkbox. No institution column.
