    Final standings of the 2015 Kyrgyzstan Subregional Contest: 36 teams with rank, team name, institution, number solved, time and a citation. Ranks 1 to 18 carry the citations First Place to Eighteenth Place; the other 18 teams are Honorable Mention, and seven of them share rank 30. The teams come from 8 institutions. First place has 6 solved in 593. No per-problem detail.
