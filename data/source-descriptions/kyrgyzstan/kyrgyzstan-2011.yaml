  description: |-
    Pages of the Northern Eurasia Contests (NEERC) archive, in English. Our copy holds 150 saved files; several of them are the same page saved under http, https and port-80 addresses. They cover the 2011 and 2012 seasons, plus the Kyrgyzstan standings pages of 2004 to 2009, 2012 to 2017 and 2019.

    The 2011 season page links the finals and 15 regional contests, among them Kyrgyzstan, each with a link to its final standings; our copy holds the finals standings and the standings pages of those regional contests, and the same for 2012. The Kyrgyzstan page of 2011 is a scoreboard of 38 teams with problems A to H. The problem documents of 2011 in our copy are a 16-page PDF of the Northeastern European Regional Contest finals (27 November 2011, problems A to L), a 13-page analysis PDF and a 13-page PDF of the Northern Subregional Contest problems (St Petersburg, 29 October 2011, problems A to K). The 2012 pages add a 14-page finals problems PDF, a 13-page review PDF, a 20-page problems PDF of the Central Region of Russia quarterfinal, a 13-page Northern Subregional problems PDF and an XML standings file of the Northern Subregional.
