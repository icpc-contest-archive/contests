  description: |-
    Final standings of the 2011 Kyrgyzstan Subregional Contest: 23 teams with rank, team, institution, number solved, time, medal, citation and a site citation. Ranks 1 to 4 carry gold medals, 5 to 8 silver and 9 to 12 bronze; the citation column reads First Place to Eleventh Place for ranks 1 to 11 and Honorable Mention for the other twelve teams. The last five teams, with no problem solved, share rank 19. Kyrgyz-Russian Slav U 1 is first with six problems solved and is cited as champion of the subregional contest. No per-problem results.
