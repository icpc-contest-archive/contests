    Final scoreboard of the NEERC Kyrgyzstan Subregional Contest 2011: 38 teams against eight problems A to H. Each team row gives the rank, the team name followed by the names of its members, one cell per problem such as +1 53:32, -3 or a dot (solved problems carry a time), then the number solved and the total time. The header reads 5:00:00 of 5:00:00 with status over, and a Show time checkbox hides the solve times. Some team entries carry (!) or (!!) marks that the page does not explain. Kyrgyz-Russian Slav U 1 is first with six problems solved; fourteen teams with no problem solved share rank 25.

    Below the teams, rows give for each problem the total runs, accepted runs, rejected runs, and the times of the first and the last accepted run.
