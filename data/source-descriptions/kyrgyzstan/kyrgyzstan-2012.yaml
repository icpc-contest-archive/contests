  description: |-
    Archive pages of the Northern Eurasia Contests (NEERC) site, shared by the final and all its regional contests; the Kyrgyzstan subregional is one of many entries. The 2012 page lists the final's standings, problems, official tests and jury solutions, then a block for each regional contest (Northwestern Russia, Southern and Volga Russia, Ural, Central Russia, Belarus and Baltics, Moscow, the Siberian and Far Eastern regions, Uzbekistan, Kazakhstan, Armenia, Georgia, Kyrgyzstan and Azerbaijan). Most blocks give only a link to the final standings; Northwestern Russia also lists problem statements, tests, a jury archive and a run log.

    Our copy holds 150 files, 144 of them pages (127 HTML, 17 PDF) and six XML files, for 57 distinct addresses; most addresses are held under http, https and an explicit port 80. They are the archive pages for 2012 and 2013, standings pages of the regional contests of 2012 and 2013, Kyrgyzstan standings pages of several other years (2004 to 2009, 2011 to 2017 and 2019), and PDFs such as the 2012 and 2013 problem sets and review reports. Style sheets and images are not in our copy.
