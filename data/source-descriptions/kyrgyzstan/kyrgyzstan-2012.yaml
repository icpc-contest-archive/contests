  description: |-
    Pages of the Northern Eurasia Contests (NEERC) archive, in English. Our copy holds 150 saved files; several of them are the same page saved under http, https and port-80 addresses. They cover the 2012 and 2013 seasons, plus the Kyrgyzstan standings pages of 2004 to 2009, 2011, 2013 to 2017 and 2019.

    The 2012 season page links the finals and 15 regional contests, among them Kyrgyzstan, each with a link to its final standings; our copy holds the finals standings and the standings pages of those regional contests, and the same for 2013. The Kyrgyzstan page of 2012 is a scoreboard of 40 teams with problems A to F. The problem documents of 2012 in our copy are a 14-page PDF of the Northeastern European Regional Contest finals (2 December 2012, problems A to L), a 13-page review PDF, a 20-page PDF of the Central Region of Russia Quarterfinal contest, a 13-page PDF of the Northern Subregional Contest problems (St Petersburg, 3 November 2012, problems A to L) and an XML standings file of the Northern Subregional Contest. The 2013 pages add a 14-page finals problems PDF, a 13-page review PDF, a 15-page Northern Subregional statements PDF and an XML standings file.
