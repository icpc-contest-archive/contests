  description: |-
    Pages of the Northern Eurasia Contests website (NEERC, hosted at ITMO) for the 2004 season, in English with some Russian. The year page headed "NEERC 2004" lists the finals (standings, problems, jury archive, contest history files, runs, picture galleries) and the subregional contests, each with a link to its standings; only the Northwestern Russia entry also links problem statements, tests and jury solutions. The Kyrgyzstan subregion has a standings link only.

    Our copy holds 150 saved files, which are 57 distinct addresses once http, https and port-80 copies are merged. 22 of them belong to the 2004 archive: the year page, the finals standings, a PDF of 14 pages with the finals problem statements (problems A to L, Northeastern European Regional Contest, December 1, 2004), and 19 standings pages of subregional contests including Kyrgyzstan, whose page lists 50 teams. The rest are 23 pages of the 2005 archive and one page each from the archives of 2006 to 2019 (not every year).

    Only HTML and PDF files are saved: images and style sheets are not in our copy, nor are the rar archives (problems, tests, jury solutions, history files, runs) linked from the year page.
