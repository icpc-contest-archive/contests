  description: |-
    Final scoreboard of the Kyrgyzstan subregional contest, a page of the Northern Eurasia (NEERC) archive with the clock at 5:00:00 of 5:00:00 and the status "over". 50 teams are listed, each with a team name followed by its institution (mostly in Russian, a few in English), a cell for each of the seven problems A to G (entries such as +, +1, -8 or a dot), the number of problems solved, a time column and the rank.

    13 teams solved at least one problem; the best solved five, and the first place goes to KRSU Team #1 of the Kyrgyz-Russian Slavic University with five problems and time 556. The other 37 teams solved nothing and all carry rank 14. Per-problem solve times are not given, and no teams are marked as unofficial.
