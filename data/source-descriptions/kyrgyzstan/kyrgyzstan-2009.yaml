  description: |-
    Pages of the Northern Eurasia Contests (NEERC) archive, in English. Our copy holds 150 saved files; several of them are the same page saved under http, https and port-80 addresses. They cover the 2009 and 2010 seasons, plus the Kyrgyzstan standings pages of 2004 to 2008, 2011 to 2017 and 2019.

    The 2009 season page links the finals and 15 regional contests, among them Kyrgyzstan, each with a link to its final standings; our copy holds the finals standings and the standings pages of those regional contests. The 2010 season page links 13 regional contests, not Kyrgyzstan, and our copy holds their standings and the finals standings. The Kyrgyzstan page of 2009 is a scoreboard of 39 teams with problems A to H. The problem documents of 2009 are a 13-page PDF of the Northeastern European Regional Contest finals (11 November 2009, problems A to K), a 14-page PDF of the Northern Subregional Contest (St Petersburg, 17 October 2009, problems A to K) and a slide file of the Northern Subregional analysis. The 2010 pages add a 13-page finals problems PDF, a 15-page problem review PDF, a 13-page Northern Subregional problems PDF and two Northern Subregional analysis PDFs of 10 and 80 pages.
