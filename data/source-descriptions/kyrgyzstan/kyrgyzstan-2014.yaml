  times: true
  tries: true
  description: |-
    Final scoreboard, shown at 5:00:00 of 5:00:00 with status over: 34 teams ranked by problems solved and penalty time, against nine problems labelled 0 to 8. Each row gives the team name with its three members in brackets, a cell per problem with a plus and the solving minute (with earlier failed attempts as a number) or a minus and the number of failed attempts, the number solved and the total time. Only problems 1, 5, 7 and 8 were solved by any team; first place has four solved in 694 minutes. The page has a Show time checkbox.

    Two teams are marked with an asterisk as out of competition and are ranked in sequence with the rest. Rows at the bottom total runs, accepted and rejected runs per problem and the first and last accepted time. No institution column.
