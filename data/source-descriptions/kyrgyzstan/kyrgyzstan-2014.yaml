  title: KRSU Online Judge
  language:
  - ru
  - en
  description: |-
    Website of the KRSU Online Judge, the Kyrgyz-Russian Slavic University's judge and contest site, which carries the Kyrgyzstan ICPC subregional under a menu entry (called ICPC KYR Regional in the 2019 menu). The menus are in Russian and English, the news and most pages in Russian. Our copy holds 150 files captured at many dates between 2007 and 2025: the home page as it stood in 2013, 2017, 2018 and 2020, pages on the rules, FAQ and contacts, the NEERC and subregional history pages, the contest list as of January 2022, the 2005 and 2006 pages with their photo pages, a problem archive list, and many login, status and Q and A pages of individual contests. The captures from 2024 and 2025 are an empty script-driven page shell, script files and an icon.

    The contest list of January 2022 names Kyrgyzstan Subregional 2014 (26 October 2014, 5 hours) and its warmup, and the menu of a 2019 page links results, problems and photos for 2014. None of those 2014 pages is in our copy, so nothing here shows the 2014 standings or problems. Five captured pages show a server error message.
