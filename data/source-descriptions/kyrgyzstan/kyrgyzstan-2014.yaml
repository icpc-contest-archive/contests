  description: |-
    Final standings of the 2014 Kyrgyzstan Subregional Contest: 32 teams with rank, team name, institution, number solved, time and a citation. The first 14 teams carry a place citation from First Place to Sixteenth Place; the other 18 are Honorable Mention, and 11 of them share rank 24 with no problems solved. Rank 5 and rank 11 are not used. The institutions are 10 universities and institutes. First place has 4 solved in 694. No per-problem detail.
