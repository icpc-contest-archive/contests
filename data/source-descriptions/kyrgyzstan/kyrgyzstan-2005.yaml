  description: |-
    Pages of the Northern Eurasia Contests website (NEERC, hosted at ITMO) for the 2005 season, in English with some Russian. The year page headed "NEERC 2005" lists the finals (standings, problems, tests and jury solutions, history files) and the subregional contests, each with a link to its standings; only the Northwestern Russia entry also links problem statements and tests. The Kyrgyzstan subregion has a standings link only.

    Our copy holds 150 saved files, which are 55 distinct addresses once http, https and port-80 copies are merged; one of them is a redirect stub for the site root. 23 of the addresses belong to the 2005 archive: the year page, the finals standings, a PDF of 14 pages with the finals problem statements (problems A to K, Northeastern European Regional Contest, November 30, 2005), and 20 standings pages of subregional contests including Kyrgyzstan, whose page lists 32 teams. The rest are 19 pages of the 2006 archive, one page of the 2004 archive and one page each from the archives of 2007 to 2019 (not every year).

    Only HTML and PDF files are saved: images and style sheets are not in our copy, nor are the rar archives linked from the year page.
