  description: |-
    Final scoreboard of the Kyrgyzstan subregional contest, a page of the Northern Eurasia (NEERC) archive with the clock at 5:00:00 of 5:00:00 and the status "over". 32 teams are listed by short name (for example Kyrgyz-Russian Slav U 1), with a cell for each of the nine problems A to I (entries such as +, +6, -12 or a dot), the number of problems solved, a time column and the rank.

    15 teams solved at least one problem; Kyrgyz-Russian Slav U 1 is first with eight problems and time 1173, and eight of the nine problems were solved by some team. The other 17 teams solved nothing and all carry rank 16. Per-problem solve times are not given, no institution column is shown, and no teams are marked as unofficial.
