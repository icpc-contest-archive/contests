  description: |-
    Website of the Northern Eurasia Contests archive (NERC and its regional contests), in English. Our copy holds 150 files, 123 of them HTML pages and 27 PDFs, many of them the same page captured under several addresses. It holds the archive page for 2019, which has links to the NERC 2019 standings, problems, jury archive and problem analysis and lists the regional contests of that season; in that page the Kyrgyzstan entry reads "No information is available". Further pages are the standings of the Kyrgyzstan subregional contests of 2004 to 2009, 2011 to 2017 and 2019, standings of other regional contests (Ural, Moscow, Armenia, Central Russia, Taurida, Kazakhstan), and the NERC 2019 and 2020 problem statements and tutorials as PDFs. The pages cover many editions, not only the 2019 Kyrgyzstan contest.
