  title: Northern Eurasia Contests
  language:
  - en
  description: |-
    Archive site of the Northern Eurasia contests (NEERC), in English. The 2016 page lists the NEERC 2016 finals resources (standings, problems, official tests, jury archive, a problems review) and 16 regional contests, each with a link to its final standings, among them Kyrgyzstan; the Northwestern Russia entry also lists problem statements, tests, analysis and runs, and the Ural entry a runs archive. The page's side menu links every year from 1996 to 2020.

    Our copy holds 150 files, which are 60 distinct addresses saved under several schemes and capture dates. They cover the 2016 and 2017 year pages, 22 addresses under 2016 and 24 under 2017 (regional standings pages, the finals standings, and PDFs of the finals statement, review and analysis, Northwestern Russia statements and analysis, and a statement PDF in the Kazakhstan folder of 2017), and a Kyrgyzstan standings page for each of 12 other years (2004 to 2009, 2011 to 2015 and 2019). Our copy has no registration, rules or schedule pages of the Kyrgyz contest.
