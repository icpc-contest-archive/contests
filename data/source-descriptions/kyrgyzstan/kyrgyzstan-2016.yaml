  description: |-
    Final scoreboard of the Kyrgyzstan Subregional 2016, shown at 5:00:00 of 5:00:00 with status over: 38 teams against nine problems labelled A to I. Each row gives rank, team name with its three members in brackets, a cell per problem (a plus with the solving minute and earlier failed attempts, or a minus and the number of failed attempts), the number solved and the total time. Rank 1 solved 8 problems in 1396 minutes. Tied teams share a rank, and the last five teams share rank 34 with nothing solved. Problem E was not solved by any team. Eight cells are highlighted as first to solve.

    Rows at the bottom total runs, accepted and rejected runs per problem and the first and last accepted time. The page has a Show time checkbox. No institution column, and no team is marked as unofficial.
