  description: |-
    Pages of the Northern Eurasia Contests (NEERC) archive, in English. Our copy holds 150 saved files; several of them are the same page saved under http, https and port-80 addresses. They cover the 2010 and 2011 seasons, plus the Kyrgyzstan standings pages of 2004 to 2009, 2011 to 2017 and 2019; there is none for 2010.

    The 2010 season page lists the finals and 13 regional contests with a link to the final standings of each; its entries for Kyrgyzstan and Azerbaijan read "No information is available" and have no link. Our copy holds the 2010 finals standings and the standings pages of the 13 linked regional contests, a 13-page PDF of the Northeastern European Regional Contest problems (24 November 2010, problems A to K), a 15-page problem review PDF, the Northern Subregional problems PDF (13 pages) and two Northern Subregional analysis PDFs of 10 pages (in Russian) and 80 pages. The 2011 season has the finals and regional standings, including Kyrgyzstan, and PDFs of the finals problems, a finals analysis and the Northern Subregional problems.
