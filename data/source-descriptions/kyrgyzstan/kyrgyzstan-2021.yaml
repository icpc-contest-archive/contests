  description: |-
    Website of the KRSU Online Judge, the programming judge of Kyrgyz-Russian Slavic University, which also hosts the pages of the Kyrgyzstan ICPC regional ("KYR ICPC Subregional"). The top menu is in English; news, rules and sub-menus are mostly in Russian. Our copy holds 149 files (138 of them pages, the rest style sheets, scripts and images) captured at different dates between 2007 and 2025, most of them in 2007 and of the older pages such as the news, rules, FAQ, registration and photo pages, so it mixes editions.

    For the 2021 contest, the home page as captured in January 2022 has a news item of 9 October 2021 announcing that the Kyrgyzstan championship of 12-13 November 2021 is held under special pandemic rules, with registration through icpc.global under the region Northern Eurasia. The contests page, also captured in January 2022, lists "ICPC Kyrgyzstan Regional 2021" on 13.11.2021, five hours, and a warmup contest on 12.11.2021. The ranklist page captured in September 2022 shows a server error instead of a table. A problem set list of the judge (problems with acceptance percentage, total submissions and tags) is also in the copy.
