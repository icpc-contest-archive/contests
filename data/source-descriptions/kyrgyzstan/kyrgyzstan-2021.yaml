  description: |-
    Standings of the 2021 ICPC Kyrgyzstan Regional Contest: 60 teams from 10 institutions, with rank, team name, institution, number solved, total time and a citation. The first 30 teams carry place names from First Place to Thirtieth Place and the other 30 are marked Honorable Mention. First place is AUCA #1 (American University - Central Asia) with 8 solved and a total time of 934. Tied teams share a rank, for example seven teams with 0 solved at rank 54. There is no per-problem detail.
