    Final scoreboard of The 2022 ICPC Kyrgyzstan Regional Contest on the KRSU Online Judge: start 30.10.2022 10:10:00, duration 300 min, state "final standings". It lists 44 teams and nine problems A to I. A team row gives the institution and team name with up to three member surnames (four teams list only two), for each problem the solve time (h:mm) and the number of rejected attempts, then the number solved and the penalty time. The last three teams, with no solved problems, share rank 42. A line above the table names the last accepted run (team, problem and time). First place is Kyrgyz Russian Slavic University - KRSU 1 with 5 solved and a penalty time of 314.
