  description: |-
    Website of the KRSU Online Judge, the programming judge of Kyrgyz-Russian Slavic University, which also carries the pages of the Kyrgyzstan ICPC regional ("KYR ICPC Subregional"). The top menu is in English; news, rules and sub-menus are mostly in Russian. Our copy holds 150 files (139 of them pages, the rest style sheets, scripts and images) captured at different dates between 2007 and 2025, most of them in 2007 and of the older pages (news, rules, FAQ, registration, photos), so it mixes many years.

    For 2022 the home page, captured in November 2022, has news items from September to October 2022: the plan for a two-stage championship with a qualification round (moved to 15 October 2022) and an offline regional contest on 29-30 October 2022 for up to 44 teams, the list of qualified teams, the schedule of both days at the host university, a link to the broadcast, and a notice of 31 October 2022 naming the 15 teams that go on to the NERC finals in Almaty. Earlier news items cover the 2021 and 2020 contests. The ranklist page captured in September 2022 shows a server error instead of a table, and our copy holds no problem or standings pages of the 2022 contest itself. The judge's list of problems is included.
