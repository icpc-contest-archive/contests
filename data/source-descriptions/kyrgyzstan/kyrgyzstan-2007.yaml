  description: |-
    Final scoreboard of the Kyrgyzstan subregional contest, a page of the Northern Eurasia (NEERC) archive with the clock at 5:00:00 of 5:00:00 and the status "over". 35 teams are listed by short name (for example American U Central Asia 4), with a cell for each of the ten problems A to J (entries such as +, +4, -11 or a dot), the number of problems solved, a time column and the rank.

    26 teams solved at least one problem, and six of the ten problems were solved by some team. Kyrgyz-Russian Slav U 1 is first with six problems and time 802, ahead of Kyrgyz-Russian Slav U 3 with six and 1003. The other 9 teams solved nothing and all carry rank 27. Per-problem solve times are not given, no institution column is shown, and no teams are marked as unofficial.
