  description: |-
    Pages of the Northern Eurasia Contests website (NEERC, hosted at ITMO) for the 2007 season, in English with some Russian. The year page headed "NEERC 2007" lists the finals (standings, problems, tests and jury solutions, runs, contest-flow files) and the subregional contests, each with a link to its standings except Azerbaijan, which says no information is available; Northwestern Russia, Uzbekistan and Georgia also link problem statements and tests and jury solutions. The Kyrgyzstan subregion has a standings link only.

    Our copy holds 150 saved files, which are 52 distinct addresses once http, https and port-80 copies are merged; one of them is a redirect stub for the site root. 20 of the addresses belong to the 2007 archive: the year page, the finals standings, three PDFs (the finals problem statements of 14 pages, problems A to L, November 28, 2007; the Northern Subregional problems of October 28, 2007, 11 pages, A to K; and the Georgia and Uzbekistan subregional problems of October 28, 2007, 11 pages, A to K), and 15 standings pages of subregional contests including Kyrgyzstan, whose page lists 35 teams. The rest are 19 pages of the 2008 archive, one page each of 2004, 2005 and 2006, and one page each from the archives of 2009 to 2019 (not every year).

    Only HTML and PDF files are saved: images and style sheets are not in our copy, nor are the rar archives linked from the year page.
