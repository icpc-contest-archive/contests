  description: |-
    Final scoreboard of the Kyrgyzstan Subregional 2013: 34 teams against eight problems A to H. Each team row gives the rank and team name, one cell per problem such as +1 177:45, -3 or a dot (solved problems carry a time), then the number solved and the total time. The header reads 5:00:00 of 5:00:00 with status over, and a Show time checkbox hides the solve times. Osh STU 2 is first with three problems solved; twenty-two teams share rank 13.

    Below the teams, rows give for each problem the total runs, accepted runs, rejected runs, and the times of the first and the last accepted run.
