  description: |-
    Pages of the Northern Eurasia Contests (NEERC) archive, in English. Our copy holds 150 saved files; several of them are the same page saved under http, https and port-80 addresses. They cover the 2013 and 2014 seasons, plus the Kyrgyzstan standings pages of 2004 to 2009, 2011, 2012 and 2014 to 2017 and 2019.

    The 2013 season page links the finals and 15 regional contests, among them Kyrgyzstan, each with a link to its final standings; our copy holds the finals standings and the standings pages of those regional contests. The 2014 season page links 16 regional contests, and our copy holds the finals and regional standings for 2014 as well. The Kyrgyzstan page of 2013 is a scoreboard of 34 teams with problems A to H. The problem documents of 2013 in our copy are a 14-page PDF of the Northeastern European Regional Contest finals (1 December 2013, problems A to K), a 13-page review PDF, a 15-page PDF of the Northern Subregional Contest statements (St Petersburg, 26 October 2013, problems A to L) and an XML standings file of the Northern Subregional Contest. The 2014 pages add a 15-page finals statements PDF, a 21-page review PDF, a 14-page Northern Subregional statements PDF and a 69-page Northern Subregional analysis PDF in Russian.
