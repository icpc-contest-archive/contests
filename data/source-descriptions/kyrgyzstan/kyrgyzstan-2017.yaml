  description: |-
    Final scoreboard of the Kyrgyzstan Subregional 2017, shown at 5:00:00 of 5:00:00 with status over: 44 teams against eight problems labelled A to H. Each row gives rank, team name with its three members in brackets, a cell per problem (a plus with the solving minute and earlier failed attempts, or a minus and the number of failed attempts), the number solved and the total time. Rank 1 solved 6 problems in 881 minutes. Ranks 1 to 38 are consecutive and the last six teams share rank 39 with nothing solved. Problems D and G were not solved by any team. Six cells are highlighted as first to solve.

    Two teams have an asterisk before their name and are ranked in sequence with the others; the page does not say what the asterisk means. Rows at the bottom total runs, accepted and rejected runs per problem and the first and last accepted time. The page has a Show time checkbox. No institution column.
