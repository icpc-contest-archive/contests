  title: Northern Eurasia Contests
  language:
  - en
  description: |-
    Archive site of the Northern Eurasia contests (NEERC), in English. The 2017 page lists the NEERC 2017 finals resources (standings, problems, official tests, jury archive, problems analysis) and 16 regional contests, each with a link to its final standings, among them Kyrgyzstan; the Northwestern Russia entry also lists problem statements, tests, analysis and runs. The page's side menu links every year from 1996 to 2020.

    Our copy holds 150 files, which are 55 distinct addresses saved under several schemes and capture dates. They cover the 2017 and 2018 year pages, 24 addresses under 2017 and 16 under 2018 (regional standings pages, the finals standings, and PDFs of the finals statements, review and analysis, Northwestern Russia statements and analysis, a statement PDF in the Kazakhstan folder of 2017, and a zip archive of the 2018 finals runs), and a Kyrgyzstan standings page for each of 13 other years (2004 to 2009, 2011 to 2016 and 2019). Our copy has no registration, rules or schedule pages of the Kyrgyz contest.
