  description: |-
    Final standings of the 2006 ACM Asia Programming Contest - Beijing, sponsored by IBM, as published by the ICPC site: nine site sections on one page. The final round (on-site regional contest, 12 November 2006) lists 54 teams: 24 ranked teams with team name, institution, citation (First Place to Eighteenth Place), problems solved and total time, followed by 30 teams marked Honorable Mention without a rank. University of Science and Technology of China is first with 4 problems solved.

    The page also holds the preliminary sites, each with rank, team and citation only: the mainland China internet contest of 7 October (542 teams, all Honorable Mention), the HeLongJiang Provincial and NorthEast China contests (133), the Tsinghua University campus contest (29) and a registration list for teams outside mainland China (4). The campus contests of Beijing Normal University and Peking University and two placeholder sites have no teams. No per-problem results.
