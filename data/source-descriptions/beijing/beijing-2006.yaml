  title: The 2006 ACM/ICPC Asia Programming Contest - Beijing
  language:
  - en
  - zh
  description: |-
    Website of the 2006 ACM/ICPC Asia Programming Contest - Beijing on the Tsinghua University computer science site, in English and Chinese. The English page gives the registration deadlines, the online round on 7 October from 13:00 to 18:00, the on-site contest on 10 to 12 November, the fee of 800 RMB or 100 US dollars per team, and housing arranged by Tsinghua University at about 80 to 140 RMB per person per day. It was last updated on 9 October.

    The Chinese version, updated on 1 November, adds the rules for choosing on-site teams from the online round (including a revival round and a final round, with the final on 12 November), a note on registration, and the same fees and housing. Our copy holds three pages and two images; the third page is a frameset shell with no readable content. It holds no results, team list or problems.
- url: http://icpc.baylor.edu/icpc/regionals/ViewRegionalStandings.asp?ContestID=784
  read: '2026-11-16'
