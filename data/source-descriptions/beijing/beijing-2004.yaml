    Standings of the 2004 ACM Asia Programming Contest - Beijing, sponsored by IBM, in three tables with the columns Rank, Team and Citation. The Final Round of 11/14/2004 lists 62 teams: 23 ranked from First Place to Fifteenth Place and 39 under Honorable Mention without rank. First place is Shanghai Jiaotong University, team Cappuccino. The Preliminary Site table for the nationwide preliminaries of 10/16/2004 lists 353 teams: 201 ranked, led by Fudan University, team Aladdin, and 152 under Honorable Mention. A third table, the preliminary site for foreign non-mainland teams, has one team, National Taiwan University. Ranked teams have two further numbers without column headings, for example 5 and 643 for the Final Round winner.
