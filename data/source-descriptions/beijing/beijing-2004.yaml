  contest_date: '2004-11-14'
  description: |-
    Website of the ACM programming contest group of Peking University, mostly in Chinese. The front page, headed 第29届ACM国际大学生程序设计竞赛亚洲区北京赛区预选赛 (dì-29 jiè ACM guójì dàxuéshēng chéngxù shèjì jìngsài Yàzhōu qū Běijīng sàiqū yùxuǎnsài, "29th ACM ICPC Asia Beijing regional preliminary"), is a frame page with a menu. It links a list of Founder Technology Cup prize winners (5 first, 10 second and 15 third prize teams), an online synchronous round ranking, and a note that problems and results have been updated. Only three content frames are in our copy: the introduction (contest at Peking University on 14 November 2004), the environment (Windows 2000, pc^2 v8.5d-p1, Dev-C++, Eclipse) and the contacts. The English-labelled pages of this edition are frame shells without content.

    The copy also holds a View Standings page for the 2004 ACM Asia Programming Contest - Beijing sponsored by IBM, as of 11/16/2004, with Rank, Team, Citation, #Solved and Time: 24 teams ranked 1 to 15 with solved and time (first: Shanghai Jiaotong University, team Cappuccino, 5 solved, 643), 40 under Sixteenth Place and 297 under Honorable Mention. A Contest Standing page of 172 user IDs for problems A to I belongs to the third Peking University programming contest of 2004, not to the regional.

    Further pages: English pages of the 30th contest, Peking University's own contests (2010, 2011, 2013), the Beijing regionals of 2015 to 2018, course pages and JudgeOnline pages. Our copy has 150 files, 113 of them pages.
