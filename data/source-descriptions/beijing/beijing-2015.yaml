  description: |-
    Website of the 2015 ACM-ICPC Asia Beijing Regional Contest, made by the organising committee at Peking University, in Chinese with the English contest name. One long front page gives the schedule (as an image), the venue (Peking University gymnasium) and the dinner location, registration steps and deadlines (23 October for ICPC registration and fees), the rules for the 200-team on-site field (top 120 schools of the online round, extra places for finalists, medallists and hosts, 153 teams allocated and the rest by priority), the on-site dates of 14 and 15 November, a game-contest invitation and the online round judge.

    Linked from it are the final scoreboard, a ranking table and a certificate archive, a registration form, two PDF invitation letters, and a spreadsheet listing the schools given places. The quota page is an exported spreadsheet frameset of three sheets whose sheet pages are not in our copy.

    Our copy holds 17 files: three distinct pages (the front page, the scoreboard and the quota page, the first two saved under two addresses each), the PDFs, spreadsheets, a rar archive, three images and style sheets.
