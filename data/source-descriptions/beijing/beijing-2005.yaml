  description: |-
    Standings of the 2005 ACM Asia Programming Contest - Beijing in twelve tables with the columns Rank, Team and Citation; two of them, a repeated Nanjing University of Aeronautics and Astronautics heading, are empty. The Final Round, the on-site contest of 11/13/2005, lists 453 teams: 64 ranked from First Place to Forty-sixth Place, each with two further unlabelled numbers (for first place, Tsinghua University team bomber, 7 and 788), and 389 under Honorable Mention without rank. The Asia Preliminary Internet Beijing Site of 10/16/2005 lists 447 teams with ranks up to 377 and a number solved; citations are given only to the first 81. The other tables are one non-mainland registration site (6 teams) and university sites with names only under Honorable Mention: Peking University 113, Hangzhou Dianzi University 60, Beijing Normal University 24, Beijing University of Chemical Technology 20, Wuhan University 18, Beijing University of Posts and Telecommunications 9 and Nanjing University of Aeronautics and Astronautics 5.
