  title: 第30届ACM国际大学生程序设计竞赛
  title_en: The 30th ACM International Collegiate Programming Contest
  language:
  - zh
  - en
  contest_date: '2005-11-13'
  description: |-
    Website of the ACM programming contest group of Peking University, mostly in Chinese, with English pages for the contest. The 2005 front page, headed 第30届ACM国际大学生程序设计竞赛 (dì-30 jiè ACM guójì dàxuéshēng chéngxù shèjì jìngsài, "30th ACM International Collegiate Programming Contest"), has a menu of introduction, organisation, environment, rules, schedule, problems, registration, report, results, finalist teams and quota rules, and three links marked New for the ACM/ICPC ranking, the Java Challenge ranking and the Founder Technology Cup ranking. It also links the Hangzhou and Chengdu regional sites.

    Our copy holds the introduction (the 30th Asia regional with 11 sites), the environment page (preliminary on the PKU Online Judge, final on Windows 2000 with pc^2 v8.6), the contact page, and the English pages for the 30th Asia Beijing regional: introduction, organising committees, rules, environment and contact. The English report and result pages are placeholders. The schedule, problems, results and ranking pages linked from the front page are not in our copy.

    The copy also holds pages of the 2004 edition (including a View Standings page of the 2004 Beijing contest), Peking University's own contests of 2004, 2010, 2011 and 2013, the Beijing regionals of 2015 to 2018, and Online Judge pages: 150 files, 113 of them pages.
