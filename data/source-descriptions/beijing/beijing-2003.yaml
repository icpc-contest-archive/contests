  description: |-
    Website of the ACM/ICPC contest at Tsinghua University, in Chinese with English labels on the contest menu. The front page announces that the 28th ACM International Collegiate Programming Contest, Asia regional Beijing, together with the 2003 "Northern Pearl Cup" university programming contest, has ended and links the results. Pages of the 2003 contest: draft rules, a tentative schedule for 24 to 26 October 2003 (registration, welcome dinner, coaches' meeting, warm-up, and the five-hour contest on 26 October at the Tsinghua gymnasium), a results page, and the problem set as a PDF. A Word file headed Result Report states that 48 teams from 39 universities took part on 26 October 2003.

    Much of the rest is of the 2002 edition (the 27th contest): the introduction text, the organisation page, the participants' guide (schedule for 25 to 27 October 2002, Beijing rules of October 2002, the ICPC headquarters rules and Asia rules of 2002, and a PC2 contestant's guide), registration instructions and form as Word files, the 2002 problem set as a Word file and a results page of the 2002 contest.

    Our copy holds 129 files, 78 of them pages, and 52 images. 34 of the HTML pages belong to an unrelated site about degrees and graduate education, served from the same address.
