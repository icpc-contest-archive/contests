    Problem set as a PDF of 15 pages, in English, headed ACM International Collegiate Programming Contest - Asia Regional (Beijing) 2003 and dated Oct 26 2003 on every page. It holds eight problems A to H: Ticket Discount, Area of Polygon, Face Mask Transportation, k-longest Common Sequence, Radius of the Holedox, Extended Graph Coloring, CPCI/MCA and Powerful Calculator. Each has a statement, the name of its input file, input and output formats, and a sample input and output. No test data or solutions.
