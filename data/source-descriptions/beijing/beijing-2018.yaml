  description: |-
    Website of the 2018 ICPC Asia Beijing Regional Contest, hosted by Peking University, in Chinese and English. Our copy holds 5 pages, two of them the same front page stored under two addresses. The front page gives the dates of the online round (22 September 2018) and of the on-site contest (10 to 11 November 2018), a capacity of 180 teams, and links to the contest system hihoCoder, the award list, a certificates download and the ICPC registration page for the contest.

    The other pages are the award list, a text file ranking schools in the online round and a text file listing how many teams each institution may send to the on-site contest. The certificates archive and the live results on hihoCoder are not in our copy.
