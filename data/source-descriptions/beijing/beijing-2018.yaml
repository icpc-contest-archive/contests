    Award list of the 2018 Beijing on-site contest in Chinese and English. A table of special awards names champion, runner-up, third place, best women's team, fastest solve overall, fastest solve for each of problems A to J, and a perseverance award, each with school, team name and prize money in yuan. The main table lists 181 teams in rank order with university, team name, number of problems solved, coach, three contestants, award and university rank: 15 gold, 30 silver, 60 bronze and 76 honorable mention. A link leads to a prize money form, which is outside our copy. The page declares no character set; it reads correctly as GBK.
