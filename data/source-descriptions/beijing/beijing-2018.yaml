  description: |-
    Final standings of the 2018 ICPC Asia Beijing Regional Contest: 181 teams with rank, team, institution, number solved, total time, medal, citation and a site citation, which reads Beijing for every team. The medals are 15 gold, 30 silver and 60 bronze, and the remaining 76 teams are Honorable Mention. First place is Tsinghua University with 10 solved and time 1783; the last teams solved none. Some ranks are shared. No per-problem results.
