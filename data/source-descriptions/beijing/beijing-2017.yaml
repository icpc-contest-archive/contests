    Final standings of the 2017 ACM-ICPC Asia Beijing Regional Contest: 186 teams with rank, team, institution, number solved, total time and a citation. The citation gives First Place to Ninety-third Place to the leading 93 teams and Honorable Mention to the other 93. First place is Shinnippori of Tsinghua University with 9 solved and time 1236; the last three teams solved none. No per-problem results.
