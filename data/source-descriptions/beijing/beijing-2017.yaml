  title_en: ACM-ICPC Programming Contest Beijing Regional (2017)
  language:
  - zh
  - en
  contest_date: '2017-11-19'
  description: |-
    Website of acm.pku.edu.cn, the Peking University ACM site, in Chinese and English. Our copy holds 150 files, 110 of them pages, from many years: pages of the 29th and 30th ACM International Collegiate Programming Contest Asia Beijing sites, a 2004 Peking University programming contest site, the sites of the Peking University programming contests of 2010, 2011 and 2013 (selection contests for the university's ACM/ICPC teams), pages of PKU JudgeOnline, and the Beijing Regional Contest front pages of 2015 to 2018.

    The 2017 front page names the 2017 ACM-ICPC Asia Beijing Regional Contest, hosted by Peking University on 18 to 19 November 2017, and links its result, award list and certificates, and the same for 2016 and 2015. Our copy holds the 2017 result page (195 team rows, problems A to J), the 2017 award list (186 teams: 15 gold, 30 silver, 65 bronze, 76 honorable mention), the 2016 result page and award list, a 2015 result page, and a text file ranking 241 schools of the online round. The certificates files are not in our copy.

    The 2018 pages add the award list (181 teams), a ranking of 251 schools of the online round and a list of on-site places per school.
