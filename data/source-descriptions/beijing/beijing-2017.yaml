  description: |-
    Scoreboard of the Beijing on-site contest: 195 team rows with school, rank, team name, number solved and time, and one column for each of the 10 problems A to J. A solved cell gives the number of tries and the minute of the solving submission (for example 1/240); a cell with only a number is a problem attempted without a solve. Each problem head carries two further numbers (A: 2/21). The page states a start time of 2017-11-19 09:00, a refresh stamp of 21 November 2017 and an estimate of 37, 71 and 105 teams for gold, silver and bronze. First place is Shinnippori with 9 problems solved; three teams solved none. Nine teams carry an asterisk before the school name, which the page does not explain.

    The page title names the Xi'an on-site contest, but the table is that of Beijing. The site menu at the top lists contests of other years and sites.
