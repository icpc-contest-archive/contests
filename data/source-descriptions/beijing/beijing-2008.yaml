  description: |-
    Website of Beijing Jiaotong University's online judge, holding the pages of the online preliminary of the 2008 ACM/ICPC Asia Beijing Regional Contest (Chinese, with English judge pages), headed 'ACM/ICPC 2008 Asia Beijing Regional Contest'. The preliminary ran on 30 September 2008 from 9:00 to 14:00 with ten problems A to J. Its scoreboard has 509 teams with rank, team, number solved, time and failed tries per problem, and a penalty total; 328 teams solved at least one problem and Proxima is first with 10. Further pages give the rules and promotion rules, a list of registered teams with institutions, run status, FAQ, and school rankings (132 schools in the final school ranking) with the schools that qualified for the on-site contest and how many places each gets.

    A separate set of pages in Chinese, headed as the 33rd ICPC Asia regional, Beijing, hosted by Beijing Jiaotong University, has an introduction to the ICPC, the organizing committee, rules, the contest environment (hardware and an OpenSolaris contest system), directions and lodging, and the problem list and PC^2 results of the 2008 Beijing Provincial Collegiate Programming Contest, a different contest. The menu pages load their content from separate files; the news and schedule pages have none in our copy, and the photo page only says it will be published after the contest.

    The rest of the 104 files belong to the judge's general site, captured between 2008 and 2015: problem lists, contest lists, user rankings and registration. There are no results of the on-site regional contest.
