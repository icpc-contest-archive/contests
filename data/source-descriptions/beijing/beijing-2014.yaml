  description: |-
    Scoreboard of the onsite contest on a ranklist page headed 2014 北京赛区现场赛 (Běijīng sàiqū xiànchǎng sài, "Beijing region onsite contest"), stamped 2014/11/16 19:51:33 with a start time of 09:00. It lists 182 teams with school, rank, team name, problems solved and penalty time, and for each of the eleven problems A to K the number of attempts and the minute of the accepted run. Each problem heading carries two counts, for example 163/207 for A, which the page does not label. A note gives the gold, silver and bronze medals as 17, 31 and 57. 19 unofficial teams are marked with an asterisk in the first column; the first place, Valkyrie of Peking University with 9 solved, is one of them. UESTC_MonaLisa of the University of Electronic Science and Technology of China is the first team without an asterisk.

    The page has a menu of earlier Chinese contests from 2008 to 2014, a link labelled as the contest problems that points to a 2013 file on another server, and a legend for first-solve, attempted and pending cells. Our copy holds this page with its scripts and style sheets; the links to the problems and to the other contests lead outside it.
