    Problem list of a replay contest on the Hangzhou Dianzi University Online Judge, headed 2014ACM/ICPC亚洲区北京站-重现赛（感谢北师和上交） (2014 ACM/ICPC Yàzhōu qū Běijīng zhàn - chóngxiàn sài, "Asia Beijing site, replay contest, thanks to BNU and SJTU"). The replay ran on 29 November 2014 from 12:00 to 17:00 as a public contest. The table gives eleven problems, numbered 1001 to 1011, with the titles A Curious Matt, Black And White, Collision, Dire Wolf, Everlasting L, Fluorescent, GRE Words Once More!, Happy Matt Friends, Intersection, Just A Mistake and K.Bro Sorting, and for each the accepted and submitted counts as they stood in November 2026.

    The page is a list of links: the statements are on separate pages that are not in our copy. The navigation menu leads to other pages of the judge that are also not in our copy.
