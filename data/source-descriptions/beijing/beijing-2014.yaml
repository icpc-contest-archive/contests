  description: |-
    Standings of the Beijing regional: 163 teams with rank, team, institution, problems solved, total time, medal and citation. There are 17 gold, 30 silver and 57 bronze medals; the other 59 teams are listed as Honorable Mention. The citation names the place for the top ranks. UESTC_MonaLisa of the University of Electronic Science and Technology of China is first with 9 solved; 35 ranks are each shared by two or more teams. There is no per-problem detail and no number of attempts.

    It has 163 teams where the organisers' ranklist has 182 rows, 19 of them marked with an asterisk.
