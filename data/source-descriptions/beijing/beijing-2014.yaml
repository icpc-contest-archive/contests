  contest_date: '2014-11-16'
  description: |-
    Website of the Beijing regional contest, run by Beijing Normal University on a WordPress blog, mostly in Chinese with the site title and some headings in English. Its posts cover the schedule of the onsite contest (arrival on 14 and 15 November, warm-up on 15 November, contest on 16 November 2014, review and awards that afternoon), hotel and transport guides, the invitation letter, and tables that allocate onsite places per university, the newest totalling 176 places. A post from September sets out the online-round rules and the penalties for cheating, and another links a page of certificates for download (优胜奖, yōushèng jiǎng, "honorable mention"): 58 rows, ranks 106 to 163, with school and team name. A page titled REPORT holds the onsite report: 182 teams from 110 universities and the full ranklist.

    The site also holds the report of the Beijing Invitational Contest of 18 May 2014 (154 teams) with its DOMjudge scoreboard, a 9-page warm-up problem set PDF for the invitational, and a BNU Contest board page of the regional onsite contest with 182 teams, frozen at 13:00:01 and generated 2014-11-16 14:02:19. Our copy has 150 files, 117 of them pages, many of them the same page under several addresses. It also holds pages of the BNU online judge, among them two training ranklists unrelated to the contest. The problem statements of the regional contest itself are not in our copy.
