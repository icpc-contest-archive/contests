    Report page of the Beijing Normal University contest website, with one paragraph in English and the final ranklist below it. The paragraph says the onsite contest took place on 16 November 2014 with 182 teams from 110 universities. The ranklist is a scoreboard of those 182 teams with school, rank, team name, problems solved, penalty time and, for problems A to K, the attempts and minute of the accepted run; each problem heading carries two unlabelled counts, for example 163/207 for A. Unofficial teams are marked with an asterisk in the first column, and one of them, Valkyrie of Peking University, is in first place with 9 solved. Team names are mostly in Chinese with a romanised or English name in brackets.

    The page is wrapped in the site's menu and sidebar.
