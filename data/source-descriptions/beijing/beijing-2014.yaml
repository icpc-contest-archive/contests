  description: |-
    Report page "2014 Beijing Onsite Contest Report" on the WordPress site of the regional hosted by Beijing Normal University. A short English paragraph says that 182 teams from 110 universities took part, followed by the final ranklist: 182 teams with school rank, school, rank, team name followed by a second name in parentheses, problems solved, total time, and tries and solve time for each of the eleven problems A to K; each problem's column head carries a pair of counts, such as 163/207 for A.

    Nineteen teams are marked with an asterisk in the school-rank column and before the team name; the page does not say what the mark means. The first column, S#, ranks the schools from 1 to 107: it is filled for the best unstarred team of each school and blank for that school's other 56 teams. The first row is the starred team Valkyrie of Peking University (the school names are in Chinese); the first team with a school rank is UESTC_MonaLisa of the University of Electronic Science and Technology. The site's menu (schedule, lodging, travel, venue) and the sidebar's recent posts are in Chinese.
