  description: |-
    Final standings of the 2007 ACM Asia Programming Contest - Beijing, sponsored by IBM, as published by the ICPC site: 1008 teams with rank, team (institution and team name), citation and number solved. 70 teams carry a rank (First Place to Fiftieth Place, with ties) and the other 938 are listed without a rank as Honorable Mention. Total time is given only for the teams in places 1 to 15; below them only the number solved is shown, and the Honorable Mention rows show neither. Tsinghua University is first with 6 problems solved. No per-problem results.
