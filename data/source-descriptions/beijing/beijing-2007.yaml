  teams: 441
  description: |-
    Results of the online preliminary contest, a page of the Beihang University contest website with a Chinese menu: 441 teams with their rank among schools (the best team of each of 116 schools; the other 325 teams marked with an asterisk, except one with no mark), school, team rank, account name, team name, number solved (8 at most) and time. Tsinghua University is first with 8 problems solved.

    Below the table are lists of the schools given places in the on-site contest and why: the top 50 schools, four schools that solved 8 problems, twelve schools placed at the 2007 World Finals, five schools that held their own qualifying contests, three schools hosting other Asia regionals (two places each), and five schools with a women's team that solved 7 problems or more. A note says that teams from Taiwan and North Korea qualify directly, three each.
