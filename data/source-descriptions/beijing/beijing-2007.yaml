  title: ACM-ICPC 2007 Beijing China
  language:
  - en
  - zh
  contest_date: '2007-11-11'
  description: |-
    Website of The 2007 ACM-ICPC Regionals Beijing, Asia, held under the theme Microsoft Cup Collegiate Programming Contest, made by the College of Software of Beihang University as host and organiser, with Microsoft China Research & Development Group as regional sponsor and IBM as global sponsor. It exists in English and in Chinese. Pages cover the announcement (registration 24 September to 7 October 2007, contest on 11 November 2007), the ICPC and the host university, the schedule (arrival on 9 November, opening ceremony, coaches' meeting and warm-up contest on 10 November, contest from 9:00 to 14:00 and closing ceremony on 11 November), accommodation, travel, the organising committee, rules, contacts and the city.

    The Chinese version has further pages: a page with the rules for choosing teams from the online preliminary, and the results of that preliminary, which is also a source of its own. The English registration page only points to the ICPC registration site. Our copy holds 25 pages, one of them a short redirect stub. It has no results of the on-site contest and no problems.
