  teams: 198
  problems: 11
  times: true
  tries: true
  description: |-
    Scoreboard of the Beijing on-site contest, 198 team rows with school, rank, team name, number solved and time, and one column for each of the 11 problems A to K. A solved cell gives the number of tries and the minute of the solving submission (for example 1/203); a cell with only a number is a problem attempted without a solve. Each problem head carries two further numbers (A: 3/19). The page states a start time of 2016-11-13 09:00 and estimates the gold, silver and bronze cut-offs at 37, 71 and 105 teams. Cells are coloured for first solve, solved, attempted and pending, as the legend says.

    The page title names the Xi'an on-site contest, but the table, the team names and the start date are those of Beijing; the site's menu lists contests of other years and sites. Four teams solved eight problems; the first place is UESTC_Life_and_Lemons. Four teams carry an asterisk before the school name, which the page does not explain.
