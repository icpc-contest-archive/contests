  description: |-
    Award list of the on-site contest in Chinese and English. A table of special awards gives champion, runner-up, third place, best women's team, fastest solve overall, fastest solve for problems A to K (no team for J) and a perseverance award, each with school, team name and prize money in yuan. The main table lists 185 teams in rank order with university, coach, three contestants, award and university rank: 13 gold, 30 silver, 50 bronze and 92 honorable mention. A note says a few team names differ from the registration form and that only prize-winning teams were checked.
