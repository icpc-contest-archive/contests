    Final scoreboard as shown by the hihoCoder contest system: 198 teams with rank, college, team name, number solved, penalty as hours:minutes:seconds, and a cell for each of the 11 problems A to K giving the solve time, with the number of wrong tries as (+n) and unsolved attempts as (-n). The page ends with 'last updated Sun Nov 13 2016 16:27:30'. First place is UESTC_Life_and_Lemons with 8 problems solved. Four teams have an asterisk before the school name; the page does not say what it means. Team names link to the system's user pages, which are outside our copy; the page is a table without the original style sheet.
