  description: |-
    Final standings of the 2016 ACM-ICPC Asia Beijing Regional Contest: 182 teams with rank, team, institution, number solved, total time and a citation. The citation names the place for the leading 88 teams (First Place to Ninety-first Place) and gives Honorable Mention to the other 94; first place is UESTC_Life_and_Lemons of the University of Electronic Science and Technology of China with 8 solved and time 916. Some rank numbers are skipped. No per-problem results.
