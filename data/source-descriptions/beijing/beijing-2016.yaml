  title: ACM-ICPC国际大学生程序设计竞赛北京赛区(2016)
  title_en: ACM-ICPC Programming Contest Beijing Regional (2016)
  language:
  - zh
  - en
  contest_date: '2016-11-13'
  description: |-
    Website of the 2016 ACM-ICPC Asia Beijing Regional Contest, hosted by Peking University, in Chinese and English. Our copy holds 5 pages. The front page has links to the final ranking, the award list and a certificates download, and a link to a blog. The main page covers both rounds: the online round of 24 September 2016, with the rule that the top 110 schools of the online school ranking get one on-site place each, and the on-site contest of 12 to 13 November 2016 with a stated site capacity of 180 teams. It gives registration instructions, the schedule from Friday 11 to Sunday 13 November (check-in, warm-up, opening, contest, closing ceremony), the venue and the contest environment (Ubuntu Linux, a contest system based on hihoCoder, Java and C/C++ with Eclipse).

    The final ranking is a scoreboard page, the award list a page of medals and special awards, and a plain-text file gives the school ranking of the online round. The certificates archive, the quota allocation page, the registration form and the invitation letters that the page links to are not in our copy.
