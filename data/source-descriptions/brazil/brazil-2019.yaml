  description: |-
    Final scoreboard of ICPC LATAM 2019 produced by BOCA, covering the Latin American regional sites together. It lists 368 distinct teams, each with a rank, a user and site code, the team name with its institution, attempts and time for each of problems A to M, and the total solved with penalty time. Most teams appear three or four times, in different views of the page (a global view and views per site and region), and 25 teams appear twice, so the table has 1,312 rows in all.

    The User/Site column carries 12 different codes after the slash (AR, BO, BR, CL, CO, CR, CU, DO, MX, PE, SV, VE). The 25 teams with user codes starting teamccl are the twice-listed ones, and 20 of them carry a CCL tag in the name. The team in first place, from USP, solved 10 problems. Links to LATAM statistics, clarifications and run lists lead to other pages.
