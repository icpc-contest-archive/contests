  description: |-
    Website of the Maratona de Programação series (Brazilian programming marathon), in Portuguese, as it stood for the XXIV edition, whose Brazilian final took place in Campina Grande, Paraiba. Our copy holds 18 pages among 41 saved files. The home page is a title over an image carousel of five photos, three of which are in our copy. The results page for the 2019 final gives the 13 problem names with their authors, the list of gold, silver and bronze medallists, the regional champions of five Brazilian regions and the three top teams of the non-competitive café-com-leite contest, with links to problem PDFs, test data archives, time limits and BOCA reports.

    Inside the copy are the contest problem set as a 22-page PDF with 13 problems and the warmup set as a 6-page PDF with 3 problems, one-page PDFs of time limits for each, a 4-page information sheet, test data archives for 11 of the 13 contest problems (none for C and J), two photos of the event, an 18-page PDF printout of the Latin American BOCA report page, and BOCA report pages for the Brazil site: scoreboard, statistics, clarifications, runs and tasks, with a separate set for the café-com-leite teams.
