  description: |-
    Results page of the Brazilian final of the XXIV Maratona de Programação, in Portuguese, held in Campina Grande, Paraiba, hosted by Unifacisa and sponsored by VTEX, B2W, Wild Life, Microsoft, Google, SAP and Itau. It names the 13 contest problems A to M and three warmup problems with their authors and countries, and links to the problem PDFs, information sheets, time limits and per-problem data.

    The results are given as lists, not a table: the team that won, three gold, three silver and four bronze medallists, the regional champions of five Brazilian regions, and the first three places of the café-com-leite contest of 17 non-competitive teams. Links lead to the final scoreboard, statistics, clarifications, runs and tasks reports for both contests; they are not part of this page.
