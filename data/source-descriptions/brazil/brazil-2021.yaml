  read: '2026-11-16'
  rubric: 1
  copy: brazil/brazil-2021/website/2026-09-04-wayback-e3e106de
  title: XXVI Maratona de Programação
  language:
  - pt
  - en
  description: |-
    Website of the Maratona de Programação of the SBC, in Portuguese. Our copy holds 28 files: nine HTML pages, nine PDFs (one stored twice) and ten images. The main page is the 2021 edition (XXVI Maratona): the online first phase of 30 October 2021 with 534 teams from 127 institutions, the Brazilian final in Gramado, Rio Grande do Sul, the problem list A to M for the final and A to C for a warmup, the medallists, regional champions, 12 non-competitive teams in a separate contest, and the world final. A second page covers the first phase with its 14 problems A to N and the allocation of slots by state.

    The PDFs are the final's opening slides (22 pages), the Latin American problem set of 13 problems (24 pages, dated April 2, 2022), the 3-problem warmup set (6 pages) and its time limits (1 page), a print of the Latin America scoreboard (11 pages), and the first-phase problem set of 14 problems (26 pages). Six captured BOCA report files of the first phase are held (the score page twice); two are cut off at 1 MB.

    The 2022 page and a few 2022 files are inside too. Of the photos, only some from the world final section are in our copy; the Gramado and medallist photos, the zipped problem packages and other linked documents are not.
