  title: ICPC LATAM - 2021 | Scoreboard
  language:
  - en
  teams: 273
  problems: 13
  times: true
  tries: true
  description: |-
    Scoreboard of ICPC LATAM - 2021 in BOCA format: 273 teams from twelve site codes (BR, MX, CO, CU, BO, AR, CL, PE, CR, DO, SV, VE) and 13 problems A to M. A cell gives the number of attempts and the minute of the accepted run (for example 1/253), or attempts and a dash when unsolved; the last column gives problems solved and total penalty time. 231 teams solved at least one problem. The top row is [CCL] WAN TAAN SURII KILL with 9 solved (1706); twelve teams carry [CCL] in their names, and the page does not mark them as unofficial.

    Each team appears one to four times, in the global list and in the other views the page offers by region, country and site, so the page holds 756 team rows in all. The header links to statistics, runs, clarifications, tasks, an info sheet, the problem set, time limits and a package file; those files are not part of our copy.
