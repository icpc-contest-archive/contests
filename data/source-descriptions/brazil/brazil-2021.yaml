    Dashboard of the Codeforces gym contest '2021-2022 ACM-ICPC Latin American Regional Programming Contest', marked Finished: 13 problems A to M, from Ancient Towers to Most Ordered Way, with the time limit (0.35 s to 10 s), the memory limit (1024 MB) and a solver count for each. The About section says it is an official ICPC contest whose scoreboard includes teams competing unofficially [CCL], and that contestants were allowed to code on a single computer, on-site or remotely with proctoring and no internet connection. Contest materials hold one item, a problemset discussion (en) linking to a Codeforces blog entry; the About section also links to a contest website. The blog entry, the statements and the standings are on other pages that are not part of our copy; our copy is the dashboard only.
