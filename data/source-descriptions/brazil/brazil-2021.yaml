    Baekjoon Online Judge category 'Latin America Regional Contests 2021' (short name latin2021): a list of 13 problems labelled A to M, from Ancient Towers to Most Ordered Way, each linked to its own problem page (numbers 24983 to 24995). For each problem the list gives the title, a multilingual tag, the number of users who solved it, the submissions and the acceptance ratio at the time of capture; problem F also carries a special-judge tag. The site interface is in Korean and the titles are in English. Statements are on the linked problem pages, which are not part of our copy.
