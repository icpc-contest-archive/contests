    Problem set of the contest session, a PDF of 31 pages typeset in LaTeX (version v1.0). The cover names the 2021 Latin American Regional Contests, gives April 2, 2022 as the date, and says the set has 13 problems and is used in simultaneous contests in Argentina, Bolivia, Brasil, Chile, Colombia, Costa Rica, Cuba, Ecuador, El Salvador, Guatemala, Jamaica, México, Nicaragua, Perú, Puerto Rico, República Dominicana, Trinidad y Tobago and Venezuela.

