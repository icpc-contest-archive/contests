    Final scoreboard of the BOCA contest system, with the scores labelled general: 58 teams, of which 53 are ranked and 5, with no problem solved, are listed at the end with a dash in place of a rank. Each row gives the rank, the team login, the team name prefixed by its institution in brackets, one column for each of the problems A to J, and a Total column with the number solved and the penalty time. A problem cell shows the number of attempts and the minutes of the accepted run, or attempts and a dash when the problem was not solved. The first place is a team of USP-Sao Carlos, with 7 problems and 660 minutes.
