  contest_date: '2013-11-08'
  problems: 10
  description: |-
    Website of the XVIII Maratona de Programação (2013), held by the Sociedade Brasileira de Computação with the Fundação Carlos Chagas, in Portuguese. The front page gives the dates of the two phases, the first phase on 14 September 2013 and the Brazilian final on 8 and 9 November 2013 in Uberlândia, Minas Gerais, at UniAlgar. It names the authors of the two warm-up problems and of the ten final problems A to J and the problem committee, names the champion team, lists the gold, silver and bronze medal teams and the regional champions, and mentions a parallel competition called Café com Leite with 12 teams. It links the final scoreboard, the contest statistics, the clarifications and the runs.

    Our copy holds 82 pages. They include the final results pages of the BOCA contest (scoreboard, statistics, clarification list, run list), the final problem set and the warm-up problem set as PDFs, and a first-phase page with a warm-up of two problems and 10 problems, each linked to a zip of test input and output files, with the problem PDFs and instruction sheets. It also holds directory listings of the upload folders of 35 first-phase sites; only one of them, Araçatuba, has its two BOCA scoreboard pages in our copy, and the files named in the other listings are not.
