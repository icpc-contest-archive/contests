  description: |-
    Problem set of the 2013 Latin American Regional Contests, Contest Session: a PDF of 17 pages in English. The cover gives the dates 8 and 9 November 2013, says that the set contains 10 problems and is used in simultaneous contests in ten countries (Argentina, Bolivia, Brasil, Chile, Colombia, Cuba, México, Perú, República Dominicana, Venezuela). A page of general rules follows; each problem has a single test case in its input. The ten problems are A Attacking rooks, B Blogger language, C Counting ones, D Disjoint water supply, E Eleven, F Football, G Go up the Ultras, H Hide and seek, I Inverting Huffman and J Join two kingdoms. Each has a statement with input and output format and sample input and output. No test data or solutions.
