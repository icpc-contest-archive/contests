    Problem set of the 2023 Latin American Regional Contests, contest session, dated October 21, 2023: a PDF of 30 pages in English, marked v1.0. The cover says it holds 13 problems on pages numbered 1 to 28 and is used in simultaneous contests in 17 countries, which it lists (Antigua y Barbuda, Argentina, Bolivia, Brasil, Chile, Colombia, Costa Rica, Cuba, El Salvador, Guatemala, México, Perú, Puerto Rico, República Dominicana, Trinidad y Tobago, Uruguay and Venezuela). A page of general rules for program names, input and output follows the cover.

    The 13 problems are labelled A to M, from A "Analyzing Contracts" to M "Meeting Point". Each has a statement with input and output formats and at least one sample input and output. No test data or solutions are in the document.
