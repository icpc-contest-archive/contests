  title: XXVIII Maratona de Programação
  language:
  - pt
  problems: 13
  description: |-
    Website of the Brazilian Programming Marathon (Maratona SBC de Programação), in Portuguese, as it stood for the XXVIII edition, 2023. The 2023 page reports a first phase on 2 September at 44 sites with 726 teams from 181 institutions, and the Brazilian final in Chapecó, Santa Catarina, hosted by the University of the West of Santa Catarina (UNOESC). It names the sponsors, lists the three warmup problems and the 13 contest problems A to M with the setter and country of each, and gives the medal teams and the teams that qualified for the Latin American finals in Guadalajara, the regional champions, the ten non-competitive "café com leite" teams, the Brazilian ICPC Summer School, and the 2023/24 World Finals.

    Our copy holds 47 files: 23 pages and 24 images. Nine pages are of the 2023 final: the home page, a BOCA scoreboard of 64 teams with problems A to M, a scoreboard of 10 "café com leite" teams, the runs, statistics and clarifications lists, the contest problem set (a PDF of 23 pages), its time limits and an editorial PDF (12 pages). Three pages are of the 2023 first phase: a page on the first phase with its sites and qualified teams, a scoreboard, and a page that a script fills in and that holds only its title in our copy.

    The other 11 pages belong to the 2024 edition on the same site: first-phase and warmup problem PDFs, a first-phase scoreboard and runs list, and the scoreboard of the 2024 Brazil finals.
