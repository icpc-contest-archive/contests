  description: |-
    Solution Sketches for the 2023 Latin American Regional Contests, dated October 21, 2023: a PDF of 12 pages in English. It covers all 13 problems, A "Analyzing Contracts" to M "Meeting Point", in order. Each sketch starts with the problem's author and country and explains the intended solution in prose, and many give the expected time complexity; the sketch for problem A also refers to a related World Finals problem and to published solutions for it.

    Code excerpts appear in at least the sketches for problems D and G. There is no test data.
