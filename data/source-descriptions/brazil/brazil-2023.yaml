    Contest dashboard on QOJ for The 2023 ICPC Latin America Regional Contest, filed under ICPC, Regionals, Latin America, Latin American Regional Contests. It lists 13 problems A to M, from "Analyzing Contracts" to "Meeting Point", each linked to its problem page, and gives the rules as an ICPC ruleset with 20 minutes penalty and the scoreboard frozen after four hours.

    The page links the contest's standings and external standings, and offers two attachments for download, the statements and the tutorials in English; those files and the problem pages themselves are not part of our copy. The notice and questions tables are empty.
