  description: |-
    Final scoreboard of the Latin American regional contest, LATAM Regional 2023, produced by BOCA. It has 13 problems, A to M. Each row gives rank, a team and site code (for example teamsoar030/AR), the team name with its institution in brackets, a cell per problem with the number of attempts and the minute of the accepted run (such as 1/54), and the total solved with penalty time in parentheses.

    The page holds the whole Latin American contest: 424 distinct team accounts with codes from 17 countries, 20 of them CCL accounts, 17 with a name beginning with [CCL]. The same teams are repeated in several views (global, by region and by country, and CCL views), so the table has 1557 rows and ranks restart in each view. Links lead to the warmup and contest information sheets, problem sets, time limits, the editorial and the BOCA packages.
