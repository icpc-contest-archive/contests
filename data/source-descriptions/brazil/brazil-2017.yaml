  description: |-
    Updated final scoreboard of the Latin America ACM ICPC contest of November 2017, as a 12-page printout of the BOCA report page printed on 12/5/2017 and posted on Friday, December 1, 2017. It ranks 442 teams from 13 countries, by the country codes in the user names: Brazil (72 teams), Bolivia, Mexico, Colombia, Argentina, Cuba, Peru, Chile, the Dominican Republic, Costa Rica, Venezuela, El Salvador and Panama. Columns are rank, country, user and site, team name with the university in brackets, and problems A to J, each cell giving a number, a slash and a time (for example 1/124) or a number, a slash and a dash. There is no solved or penalty column; the order is the rank. A first-place team from USP in Brazil heads the list. An "Available scores" line at the top names other views (Global, Caribbean, MexicoCA, NorthRegion, SouthRegion and one per country); the printout itself holds one list of 442 rows.
