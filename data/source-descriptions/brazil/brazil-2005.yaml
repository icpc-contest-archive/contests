  description: |-
    Scoreboard of the final, as shown by the BOCA contest system's administrator page marked 'the contest is over': 29 teams ranked by problems solved and total time. Each row gives the team's user name, team name, number solved, a per-problem detail of tries and time in minutes for each solved problem, and the total time; a dash in place of a time marks a problem with tries but no solution. Problems are shown by letter and colour name, with letters A, C, D, E, F, G, H and I in use (B does not appear). The team in first place is ITA - in the case, it is with 7 solved. The menu links of the page point to an address (mainserver) that is not part of our copy.
