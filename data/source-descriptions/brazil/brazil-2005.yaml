  description: |-
    Website of the 2005 Maratona de Programação, in Portuguese. Our copy holds 146 files, 88 of them HTML pages. The main page reports a first phase on 10 September 2005 and a Brazilian final on 11 and 12 November 2005 at Faculdades COC in Ribeirão Preto, with 29 qualified teams. It names the champion and the medal-winning teams, the teams qualified for the World Finals and the panel of judges, and links to the final scoreboard, the warm-up problem set, the problem set PDF, the submission and clarification logs, and a photo album on another server that is not in our copy. The directories linked for the warm-up and for each of the nine problems A to I hold the judges' input and solution files.

    A first-phase section (primeira-fase) holds the first-phase problem set PDF and a warm-up PDF, a table of 21 sites with their places under two rules and the teams qualified, result pages of the sites (some with submission pages), a report from the contest control system of one site, and input and solution files for the eight first-phase problems; the solution file of one problem (Tecle & Some) and the warm-up data directory are not in our copy.
