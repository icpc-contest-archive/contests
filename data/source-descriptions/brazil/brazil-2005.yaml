  description: |-
    Standings page of the 2005 ACM-ICPC South America Contest within Brazil, sponsored by IBM. The first table is the Final Round at Faculdades COC, dated 11/12/2005 on the page: 29 teams with rank, institution and team name, citation, number solved and time. The top three are Instituto Tecnologico de Aeronautica (ITA In the case, it is.) with 7 solved, Pontifícia Universidade Católica do Rio de Janeiro and Universidade de São Paulo (IME-USP A).

    The page also holds 21 tables for preliminary sites, dated 9/10/2005, one per site. Most list ranked teams with solved count and time, followed by teams marked Honorable Mention without a rank; two list only Honorable Mention teams and two have no team rows. There is no per-problem detail.
