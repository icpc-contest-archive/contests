    Final scoreboard from BOCA for the Maratona de Programação 2011: 49 teams ranked 1 to 49, each with user name, institution and team name, cells for problems A to K, and a Total of problems solved with the penalty in parentheses. A cell shows attempts and the time of the accepted run, or attempts and a dash when unsolved; problems not attempted are blank. The first-placed team, from UFPE, solved 8 problems.

    The balloon images, the style sheet and a script the page refers to are not in our copy.
