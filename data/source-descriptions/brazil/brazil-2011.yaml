  description: |-
    Website of the XVI Maratona de Programação, the 2011 Brazilian marathon run by the Sociedade Brasileira de Computação with Fundação Carlos Chagas, in Portuguese. The front page gives the dates of the first phase (17 September 2011) and of the Brazilian final (4 and 5 November 2011, at UFG in Goiânia), reports 536 first-phase teams from 191 schools and 50 teams in the final, and names the author of each of the 11 contest problems and of the warm-up problems. It names the champion team and lists the gold, silver and bronze medal teams with members and coaches, marking those that qualified for the World Finals.

    Other pages hold the problem set and warm-up set of the Latin American regional (English PDFs); a first-phase page with the problem sets, the slots per site and the qualified teams, with a scoreboard link for 41 of the 44 sites; the final scoreboard as a page; test input and output files for some of the first-phase problems and a zip archive of the warm-up test data that does not open; photos of the medal teams; and a page on the 2012 World Finals in Warsaw.

    Our copy holds 139 files, 101 of them pages; some linked files, such as the contest test data archive and several test files, were not saved.
