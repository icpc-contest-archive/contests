    Problem set of the ACM ICPC 2011 Latin American Regional Contests, a PDF of 22 pages marked v1.1 and headed Contest Session, dated 4 and 5 November 2011. The cover states that the set has 11 problems and is used in simultaneous contests in Argentina, Bolivia, Brazil, Chile, Colombia, Cuba, Peru, Mexico and Venezuela. After a page of general input and output rules come the 11 problems A to K, from Army buddies to King's Poker. Each has a statement in English with input and output description, sample input and output, and a problem code name. No test data or solutions.
