    Final standings of the 2011 South America/Brazil Regional Contest: 50 teams, with rank, team name, institution, problems solved and total time. Ranks 1 to 49 are given; the last team, with no problems solved, has no rank. A Medal column marks three gold, three silver and four bronze teams, and two citation columns mark the first-placed team as LA-Champion and Brazilian Champion. The first-place team is Challenge Accepted ! of the Universidade Federal de Pernambuco with 8 problems and a time of 1180. There are no per-problem results.
