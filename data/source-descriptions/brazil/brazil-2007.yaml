    First-phase page of the XII Maratona de Programação, in Portuguese, for the first phase of 22 September 2007. It lists two warm-up problems and ten problems A to J by title with their authors, links two problem PDFs and the judges' expected inputs and outputs, and explains how places in the Brazilian final were allotted to sites by two rules, 51 in all.

    A table of 33 sites gives the places of each site that has any, the names of its qualified teams and, for 30 sites, a link to its results. Three sites are marked cancelled for having no teams, and ten sites below the minimum of 6 teams and 3 schools are treated together as one combined site with 7 places. The linked files are not part of our copy of this page.
