    Problem set of the 2007 ACM ICPC South American Regional Contests, contest session of 9 and 10 November 2007: a PDF of 21 pages in English. The cover says the set has 10 problems with pages numbered 1 to 20, lists the seven countries (Argentina, Bolivia, Brazil, Chile, Colombia, Peru, Venezuela) that held simultaneous contests, and carries headings for the organisation and the sponsor in Brazil.

    Problems A to J run from Ambiguous Codes to Justice League. Each has a statement with input and output format, the accepted source file names and a sample input with its output. No test data or solutions are in the file.
