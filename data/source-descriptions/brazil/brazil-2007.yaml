  description: |-
    Standings of The 2007 ACM-ICPC South America Contest within Brazil, sponsored by IBM, on a page titled View Standings. The first table is the final round at the Federal University of Minas Gerais: 51 teams, of which 26 are ranked and 25 are listed without a rank as Honorable Mention. Ranked rows give institution and team name, a citation (Brazilian Champions, then places with gold, silver and bronze medal citations down to tenth, then plain places), number of problems solved and time. The Instituto Tecnológico de Aeronautica team is first with 8 solved.

    The 34 first-phase site tables that follow are headed with a site name and the date 9/22/2007 and use the same columns, with site champions and honorable mentions; four of them (CEFET-MT, Barão de Mauá, FAAr, UFT) have no rows. There is no per-problem detail, and the solved and time cells have no column headings.
