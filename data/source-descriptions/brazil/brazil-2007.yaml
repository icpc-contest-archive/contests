    Scoreboard shown on the administrator's page of the BOCA contest system, titled Admin's Page and marked 'contest not running': 51 teams with user name, team name, one column for each problem A to J, and a total. A problem cell reads tries/time, such as 1/266, with a dash in place of the time on unsolved problems; the total gives problems solved and, in brackets, the penalty time. ITA - O que é Overflow? is first with 8 solved (1308), and three teams solved none.

    The page names no contest and gives no date. Its menu links (Runs, Score, Clarifications and others) point to a local server address and do not lead anywhere from our copy.
