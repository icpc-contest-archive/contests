  description: |-
    Website of the XII Maratona de Programação, the 2007 programming marathon run by the SBC with Fundação Carlos Chagas, in Portuguese. Our copy holds 66 pages. The front page reports a first phase on 22 September 2007 with more than 288 teams from 114 schools at 33 sites, and a Brazilian final on 9 and 10 November 2007 at the Federal University of Minas Gerais in Belo Horizonte, for which 51 teams qualified. It lists the medal teams and the Brazilian teams that went on to the 2008 World Finals in Banff, and links to videos and photo albums elsewhere.

    The final is covered by BOCA pages: the final scoreboard (51 teams, problems A to J), run, clarification and task lists, a site start and stop log and statistics, plus the contest and warm-up problem PDFs and a problems page with the committee, the authors and two zip archives of test data. The first phase has a page with two warm-up problems and ten problems A to J, two problem PDFs, a directory of 20 judges' input and output files and a table of 33 sites with their places in the final. Our copy holds the index pages of 30 site result folders, but only one site's BOCA score and run pages and one bitmap image; the other result files are missing.
