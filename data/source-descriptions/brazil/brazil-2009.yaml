  title: XIV Maratona de Programação
  title_en: XIV Programming Marathon
  language:
  - pt
  contest_date: '2009-10-23'
  description: |-
    Website of the 2009 Brazilian Programming Marathon (Maratona de Programação), in Portuguese, published by the Brazilian Computing Society (SBC) with Fundação Carlos Chagas. The front page gives the dates (first phase 19 September 2009, Brazilian final 23 and 24 October 2009 at the Institute of Computing, Unicamp), reports a record 410 teams from 145 schools at 44 first-phase sites, and says 52 teams reached the final. It lists the medal teams with members and coaches, shows team photos, links the final scoreboard, and lists the seven Brazilian teams at the World Finals in Harbin, China, in February 2010 with how they placed.

    The first-phase page holds the allocation of the 52 final places by site and links to the first-phase problem PDFs and judges' input and output files. Another page names the authors of the 11 final problems A to K and 2 warm-up problems, with the problem PDFs and zip archives of judges' data. Each of the 44 first-phase sites has a folder, but our copy mostly holds only its directory listing; scoreboard, run list and clarification pages are held for Campo Grande, Dourados and Goiânia, and a scoreboard PDF for Brasília. The other files in those listings (photos, database dumps) are not in our copy, nor is the Facebook page. Our copy holds 150 files, 104 of them pages.
