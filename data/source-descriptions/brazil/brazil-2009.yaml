    Problem set of the 2009 Latin American Regional Contests, a PDF of 20 pages in English dated 23 and 24 October 2009, marked Version 6. The cover states that the set is used in simultaneous contests in Argentina, Bolivia, Brazil, Chile, Colombia, Cuba, Peru, Mexico and Venezuela, so it is shared and not specific to Brazil. It holds 11 problems, A (Another Crisis) to K (Klingon Levels), each with a statement, input and output description, a file code name and a sample input and output. No test data or solutions.
