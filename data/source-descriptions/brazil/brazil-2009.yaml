  description: |-
    Standings of 52 teams with rank, team, institution, number solved, time and a citation column. The first team is marked Brazilian Champions and Gold Medal, the next two Gold Medal, three more Silver Medal and four Bronze Medal; the remaining 42 teams carry no citation. The top team solved 10 problems in a time of 931. Ranks run 1 to 51, and the last team, with no problems solved, is listed without a rank. No per-problem results.

    The page is headed "The 2009 South America/Brazil" and gives the contest year as ICPC year 2010.
