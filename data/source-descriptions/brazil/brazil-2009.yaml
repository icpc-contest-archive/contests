  copy: brazil/brazil-2009/website/2026-09-02-live-63608638
  title: XIV Maratona de Programação
  title_en: 14th Programming Marathon
  language:
  - pt
  description: |-
    Website of the XIV Maratona de Programação (the Brazilian Programming Marathon), 2009, in Portuguese, published by the Sociedade Brasileira de Computação together with the Fundação Carlos Chagas. The front page reports the two phases (first phase on 19 September 2009, Brazilian final on 23 and 24 October 2009 at the Instituto de Computação of Unicamp), the record of 410 teams from 145 schools in 44 sites in the first phase, the 52 teams that qualified for the final, the champion and the medal winners with their members, a link to the final scoreboard, and a section on the seven teams that went on to the World Finals in Harbin, China, in February 2010.

    The first-phase page names the problem setters, links the warm-up and contest problems with the judges' inputs and outputs, and tabulates the places in the final given to each site with the qualified teams. It links a directory listing for each of 44 local sites; our copy holds the listings, but the sites' own contest output (scoreboards, run, clarification and task lists in HTML and PDF) only for four of them: Brasília, Campo Grande, Dourados and Goiânia. A problems page lists two warm-up problems and eleven contest problems A to K by title with their setters. The final's PDF problem set, the final scoreboard PDF, the first-phase problem PDFs and zip files of input and output are also in our copy.

    Our copy holds 104 pages (91 HTML, 4 HTM and 9 PDF) among 150 files, with 22 photographs.
