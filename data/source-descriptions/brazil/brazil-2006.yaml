  description: |-
    Website of the XI Maratona de Programação, the 2006 programming marathon of the SBC, in Portuguese. Our copy holds 80 pages. The front page gives an account of both phases: a first phase on 9 September 2006 with 174 teams from 86 schools at 26 sites, and a Brazilian final on 10 and 11 November 2006 in Rio de Janeiro, supported by UFRJ and IME, for which 43 teams qualified. It names the sponsor and supporters, the problem committee, the medal-winning teams, and the teams that went on to the 2007 World Finals in Tokyo.

    The final is documented by its BOCA scoreboard (43 teams, problems A to I), a statistics page, a list of all runs, the 20-page problem set as a PDF, a 5-page warm-up PDF, judges' input and solution files for the two warm-up and nine contest problems, and 13 photographs. The first phase has its own page with two warm-up and eight contest problems (an input and output archive for each, and two problem PDFs), the distribution of final places over 26 sites, and 43 per-site result files: BOCA score and run pages, PC² standings pages, plain-text lists and one PostScript file.
