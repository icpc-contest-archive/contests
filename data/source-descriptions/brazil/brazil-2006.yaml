  description: |-
    Final scoreboard of the Brazilian final, produced by BOCA and headed 'Maratona de Programação da SBC - Final Brasileira': 43 teams, all from one site, ranked 1 to 43. Each row gives a user name, the team name, problems solved, total time and a per-problem detail for problems A to I, where every attempted problem is written as a pair of numbers such as A(1/8), with a dash in place of the second number on problems not solved.

    The team in first place, PUC-Rio: Link-EdiSamba, solved all nine problems with a total time of 1333. The last-ranked team solved none. The page shows no medals or marks beyond the table.
