  description: |-
    Standings page titled View Standings for The 2006 ACM-ICPC South America Contest within Brazil, sponsored by IBM. The first table is the final round at the Federal University of Rio de Janeiro: 43 ranked teams, each with rank, institution and team name, a citation (Brazilian Champions, Second Place and so on down to Forty-third Place), number of problems solved and time. Pontifícia Universidade Católica do Rio de Janeiro's Link-EdiSamba is first with 9 solved.

    Below it are 26 tables for the first-phase sites, each headed with a site name and a date of 9/9/2006 (the Rio de Janeiro one adds "primeira fase"), together listing 174 teams, with the same columns and tied ranks; one lists an Honorable Mention without a rank. There is no per-problem detail, and the solved and time cells have no column headings.
