  description: |-
    Standings page of the 2004 ACM-ICPC South America Contest within Brazil, sponsored by IBM. The first table is the Final Round held at USP-São Paulo on 13 November 2004: 31 team rows with rank, institution and team name, citation, number solved and time; ranks run from 1 to 32 and rank 14 has no row. The top three are Universidade Estadual de Campinas (Will Code for Money) with 5 solved, Universidade Federal do Rio de Janeiro (Frost Byte) and Instituto Tecnologico de Aeronautica (Naves Bros.), each with 4.

    The page also holds 14 tables for the preliminary sites of 2 October 2004 (COC-Ribeirão Preto, FURB-Blumenau, PUC-Campinas, UFMG-Belo Horizonte and others). They list ranked teams with solved count and time, followed by teams marked Honorable Mention with no rank or score. There is no per-problem detail.
