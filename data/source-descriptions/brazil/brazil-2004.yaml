  description: |-
    Website of the Maratona de Programação, mostly in Portuguese, with the pages of the 2004 and 2005 editions. Our copy holds 150 files, 123 of them pages. The 2004 page reports a two-phase contest: a first phase on 2 October 2004 at 14 sites, and a Brazilian final on 12 and 13 November 2004 at the Universidade de São Paulo, with 34 qualified teams of which two did not attend. It names the champion and the medal-winning teams, the teams going to the World Finals in Shanghai, and links to the first-phase results and problems, the problem set PDF, a directory for each of the eight problems and the submission and clarification logs. The first-phase pages are not in our copy.

    The 2004 material in our copy includes a BOCA administrator's scoreboard of the final (32 teams with solved count, tries and time per problem, and total time), the clarification log (28 entries), the run log (297 runs) and the problem set PDF. The eight directory listings name the judges' input and output files, but only one of those files (tax.in) is kept. The 2005 edition is in the same copy, with its own page, a scoreboard of 29 teams, run and clarification logs and problem set PDFs including a warm-up set.
