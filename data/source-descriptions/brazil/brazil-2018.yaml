  description: |-
    Standings of the 2018 ICPC South America/Brazil Finals: 71 teams, each with rank, team name, institution, number of problems solved, total time and a citation. There is no per-problem detail and no medal column.

    Places 1 to 35 are cited by ordinal place and the last 36 teams are marked Honorable Mention. The first place, from Universidade de São Paulo - Campus de São Carlos, solved 10 problems.
