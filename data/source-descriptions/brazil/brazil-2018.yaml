  title: Final Nacional da XXIII Maratona SBC de Programação
  language:
  - pt
  contest_date: '2018-11-10'
  description: |-
    Website of the national final of the XXIII Maratona SBC de Programação (Brazilian final), in Portuguese, held in Salvador, Bahia, on 9 and 10 November 2018 at the SENAI CIMATEC events centre and organised jointly by SENAI/CIMATEC and UFBA. Our copy holds 6 pages: the home page with a welcome text and venue address, the schedule, registration, tourism, and lodging.

    The schedule runs from check-in on 8 November to check-out on 11 November, with the opening ceremony and warm-up on 9 November and the official contest from 14:00 to 19:00 on 10 November, followed by the closing ceremony. The registration page gives fees in reais for individual participants and for Café-com-Leite teams, with or without hotel. The tourism page lists attractions of Salvador and the lodging page describes the event hotel. The site has no results, team list or problem statements.
- url: http://maratona.ime.usp.br/
  read: '2026-11-16'
  rubric: 1
  copy: brazil/brazil-2018/standings/20181116-wayback-fb7debe8/page.html
  title: XXIII Maratona de Programação
  language:
  - pt
  description: |-
    Home page of the Maratona de Programação series for its XXIII edition, in Portuguese, giving the first phase as 15 September 2018 and the Brazilian final as Salvador, 9 and 10 November 2018. It is a menu page: links to the results of the Brazilian final 2018, the slots for the Brazilian final, the 2017/18 World Final, what the contest is, how to take part, rules, registration, first-phase sites, the Brazilian final 2018, the computing environment, publicity, important dates, the organising committee, past competitions, contact and credits.

    The page holds no results table; the linked results and other pages are not part of this copy. A line at the foot gives the last modification as 13 November 2018.
