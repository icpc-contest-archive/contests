  contest_date: '2018-11-10'
  description: |-
    Website of the national final of the XXIII Maratona SBC de Programação (Brazilian final), in Portuguese, held in Salvador, Bahia, on 9 and 10 November 2018 at the SENAI CIMATEC events centre and organised jointly by SENAI/CIMATEC and UFBA. Our copy holds 6 pages: the home page with a welcome text and venue address, the schedule, registration, tourism, and lodging.

    The schedule runs from check-in on 8 November to check-out on 11 November, with the opening ceremony and warm-up on 9 November and the official contest from 14:00 to 19:00 on 10 November, followed by the closing ceremony. The registration page gives fees in reais for individual participants and for Café-com-Leite teams, with or without hotel. The tourism page lists attractions of Salvador and the lodging page describes the event hotel. The site has no results, team list or problem statements.
