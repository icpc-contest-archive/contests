    Home page of the Maratona de Programação series for its XXIII edition, in Portuguese, giving the first phase as 15 September 2018 and the Brazilian final as Salvador, 9 and 10 November 2018. It is a menu page: links to the results of the Brazilian final 2018, the slots for the Brazilian final, the 2017/18 World Final, what the contest is, how to take part, rules, registration, first-phase sites, the Brazilian final 2018, the computing environment, publicity, important dates, the organising committee, past competitions, contact and credits.

    The page holds no results table; the linked results and other pages are not part of this copy. A line at the foot gives the last modification as 13 November 2018.
