  description: |-
    Scoreboard of ICPC LATAM - 2020 (in 2021) in BOCA format: 302 teams, each with its site code (BR, CA, CB, MX, NO, SO), a name that starts with the institution in square brackets, and fourteen problem columns A to N. A cell gives the number of attempts and the minute of the accepted run (for example 3/118), or attempts and a dash when the problem was not solved; the last column gives problems solved and total penalty time. 265 of the 302 teams solved at least one problem. Five teams solved ten problems; the first in the global ranking is [UH] UH Top (775 minutes).

    Each team appears two or three times, once in the global ranking and again in the other views the page offers (it lists Global and a series of regional and site scores), so the page holds 785 team rows in all. The header links to statistics, a runs list, clarifications, a tasks list, an info sheet, the problem set and a package of BOCA files; those links lead to files that are not part of our copy.
