  contest_date: '2024-11-09'
  problems: 12
  description: |-
    History page of the XXIX Maratona de Programação (Maratona SBC de Programação) 2024 on the organisers' site, in Portuguese. It has a section for each stage: the online Fase Zero, the First Phase of 31 August 2024 at 48 sites with 880 teams from 226 schools, and the Brazilian final in João Pessoa, Paraíba, hosted by IFPB, with its sponsors and photos. For the final it lists the three warmup problems and the twelve contest problems A to L, each with its author and country, and links the problem PDFs, information sheet, time limits, BOCA packages and the editorial.

    The page then reports the six simultaneous Latin American contests (65 teams in the Brazilian final, 524 teams in all), names the winning team, Faça o WM of Universidade de São Paulo, lists the gold, silver and bronze medallists and the teams qualified for the Latin America Championship in Salvador, Bahia, and ends with the 2024/25 ICPC World Finals in Baku.

    Our copy holds nine pages and PDFs, besides photos and the warmup package archive: the seed page, the Fase Zero and First Phase pages, and six PDFs (warmup and contest problem sets, information sheet, two time-limit sheets, editorial). The page also links the opening slides and the contest package archive, which are not in our copy (the warmup package archive is), and the scoreboard links lead to another server.
