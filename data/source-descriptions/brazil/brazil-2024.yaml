  description: |-
    Final scoreboard of The 2024 ICPC Latin America Contests, produced by BOCA, covering all the simultaneous Latin American regional contests together. The table has 1,913 team rows and 516 distinct team entries, with rank, user and site code, team name (prefixed by the institution in brackets), problems A to L and a total of problems solved with penalty time. Each problem cell gives the number of tries and the solve time, or tries and a dash when unsolved. The first row is [USP] Faça o WM with 9 solved and 1171 penalty.

    Each team appears in two to six rows, and its rank can differ between rows. 22 entries are marked [CCL] in the team name and carry a ccl user code, set apart from the other team entries. The header lists the separate boards (Global, Global+CCL, Brasil, Central America, Caribbean, Mexico, South America North and South, and others) and links to the information sheets, problem set, time limits, editorial and packages.

    The RUNS, TASKS, CLARIFICATIONS and STATISTICS pages are linked but not in our copy.
