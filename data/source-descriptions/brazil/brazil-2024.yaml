  description: |-
    Final standings of the 2024 ICPC South America/Brazil Finals: 63 teams with rank, team name, institution, number of problems solved, time and a citation. The first place is Faça o WM of Universidade de São Paulo with 9 solved and a time of 1171, followed by Torcida Pão de Alho of Universidade Federal de Minas Gerais with 8 and CACHE OVERFLOW of Universidade Federal de Campina Grande with 6.

    The top 31 places carry an ordinal citation (First Place to Thirty-first Place) and the remaining 32 teams are cited as Honorable Mention. There is no per-problem detail and no attempt counts.
