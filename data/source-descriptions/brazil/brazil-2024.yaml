    Problem set of the contest session of 9 November 2024, a PDF of 19 pages. The cover is headed ICPC Latin American Regional Contests – 2024, states that the set has 12 problems and lists the 17 countries whose contests use it simultaneously; it is marked v1.0. A general-information section on program names and on input and output format comes first, followed by problems A to L (Append and Panic! to Latin Squares). Each problem has a statement in English with the author's name and country, input and output format, and sample input and output. No test data or solutions.
