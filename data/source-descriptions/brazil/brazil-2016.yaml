  times: true
  tries: true
  description: |-
    Final scoreboard produced by BOCA (the footer names boca-1.5.10): 72 team rows against ten problems, lettered A to D and F to K, with no column E. Each row gives a login, the team name with its institution in brackets, one cell per problem with the number of tries and the time, written tries/time, and a Total column with the number solved and the penalty in parentheses. A problem with tries but no solution shows a dash in place of the time.

    Two groups share the table, listed by score in one sequence but ranked separately: 58 teams of the Brasil site, ranked 1 to 58, and 14 teams marked [CCL] in the name, ranked 1 to 14. The header offers the two groups as "Brasil" and "CCL". The first of the Brasil group is UFPE 0xE with 9 problems (1289); the first of the CCL group, Rumpelstiltskin, has 10 (1008). Its header links lead to a local server address outside our copy.
- url: https://icpc.global/regionals/finder/South-America-Brazil-2017/standings
  read: '2026-11-16'
  rubric: 1
  copy: brazil/brazil-2016/standings/api-20261113/standings.html
  title: The 2016 ACM-ICPC South America/Brazil Finals — standings
  language:
  - en
  teams: 58
  description: |-
    Final standings of the 2016 ACM-ICPC South America/Brazil Finals: 58 teams ranked 1 to 58, each with team name, institution, number of problems solved and total time, followed by a medal column, a citation column and a site citation column. The first place, 0xE of Universidade Federal de Pernambuco, solved 9 problems with a time of 1289 and is the only team with a site citation ("Brazilian Champions"). Ten teams carry medals, three gold, three silver and four bronze. The citation column names the place for the first 29 teams, from First Place to Twenty-ninth Place, and reads Honorable Mention for the other 29.

    There are no per-problem results, no counts of attempts and no problem labels.
