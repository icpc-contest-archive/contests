  copy: brazil/brazil-2016/website/2026-11-15-wayback-7e5fdcad
  title: XXI Maratona de Programação
  language:
  - pt
  - en
  description: |-
    Website of the Maratona de Programação, the Brazilian regional contest, in Portuguese. Its home page in our copy is that of the next edition, the XXII, with the first phase on 9 September 2017 and the final in Foz do Iguaçu. The XXI edition, with the first phase on 10 September 2016 and the Brazilian final in Belo Horizonte on 11 and 12 November 2016, is covered by an archive page of the edition, which gives the size of the first phase (779 teams from 231 schools at 49 sites) and the problem authors, champion and medallists of the final, and by the results page of the final. Also in the copy are the 15-page contest problem PDF of the Latin American regional contests, two one-page information sheets (warm-up and contest sessions), four BOCA report pages of the final (scoreboard, statistics, clarification list, run list), and a one-page PDF print of the scoreboard of the 14 teams of the "café com leite" side competition (marked CCL).

    Our copy holds 52 pages, in 90 saved files. It also has 22 pages of the 2017 edition (among them its home page, the pages of its menu, a coach form as PDF and three text files on the contest environment) and an archive page for each edition from 1996 to 2016. The warm-up problems, problem packages and team photos linked from the results page are not in our copy, and neither are the style sheets and images of the BOCA report pages.
