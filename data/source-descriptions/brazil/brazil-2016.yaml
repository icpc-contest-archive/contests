  description: |-
    Problem set of the contest session as a PDF of 15 pages, in English, version 1.0. The cover names the ACM International Collegiate Programming Contest 2016 Latin American Regional Contests, November 11th-12th, 2016, and lists the twelve countries whose simultaneous contests use the set, from Argentina to Venezuela. A page of general rules on program names (C, C++, Java and Python), input and output follows, then eleven problems A to K, from Assigning Teams to Kill the Werewolf. Each problem names its author with the author's country, the statement, input and output format and numbered sample inputs with their outputs. No test data or solutions.
