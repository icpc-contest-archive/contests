  description: |-
    Judge's list of problems: the category "Latin America Regional Contests 2016" of the Baekjoon Online Judge, with a Korean-language interface. A table of 11 problems, lettered A to K, gives the judge's problem number (13866 to 13876), the title, and the judge's counts of users who solved it, submissions and acceptance rate. Titles run from problem A to "Kill the Werewolf" (K); all but A are in English, and A has a Korean title.

    The counts are the judge's own, as of the capture. The problem statements are on the judge's separate problem pages, which are not in our copy.
