  title: XXI Maratona de Programação
  language:
  - pt
  contest_date: '2016-11-11'
  problems: 10
  description: |-
    Results page of the Brazilian final of the XXI Maratona de Programação, in Portuguese, headed "Resultados da Final Brasileira 2016". It says the final was held in Belo Horizonte by UFMG, CEFET-MG and PUC-Minas. It lists the authors of the three warm-up problems and of ten contest problems, lettered A to D and F to K, with links to the problem PDFs, information sheets and problem packages, and names the people who helped prepare the set.

    The champion is the team 0xE of the Universidade Federal de Pernambuco. The ten medal-winning teams are listed, three gold, three silver and four bronze, with members and coaches, and qualification for the World Finals is noted. The page also names the five regional champions and a "café com leite" competition of 14 teams besides the official one, with its winning team. Links lead to the BOCA reports (scoreboard, statistics, clarifications, runs) and team photos; those linked pages are not part of this page, and it has no table of all teams.
