  title: XVII Maratona de Programação
  language:
  - pt
  problems: 10
  description: |-
    Website of the XVII Maratona de Programação (2012), held by the Sociedade Brasileira de Computação with the Fundação Carlos Chagas, in Portuguese. The front page gives the dates of the two phases, the first phase on 15 September 2012 and the Brazilian final on 9 and 10 November 2012 in Londrina, at the Ney Braga events park. It names the authors of the ten final problems A to J and the problem committee, names the champion team, lists the gold, silver and bronze medal teams and the regional champions, and links the final scoreboard, the contest statistics, the clarifications and the runs.

    Our copy holds 61 pages. They include the final results pages of the BOCA contest (scoreboard, statistics, clarification list, run list), the final problem set and the warm-up problem set as PDFs, input and solution files for the ten final problems and the two warm-up problems, and a first-phase section: a page with 12 problems and a warm-up of two problems, each with input and solution files, the first-phase problem set and warm-up as PDFs, and a PDF with problems and solutions. It also holds directory listings of the upload folders of 37 first-phase sites; the files named in those listings, such as site scoreboards, are not in our copy. A short page about the 2013 World Finals sits under a heading for the XVIII Maratona.
