  description: |-
    Final scoreboard of the BOCA contest system (BOCA 1.5.1), covering the Brazilian site: 49 teams, ranked by problems solved and then total time. Each row gives the rank, the team login, the team name prefixed by its institution in brackets, one column for each of the problems A to J, and a Total column with the number solved and the penalty time. A problem cell shows the number of attempts and the minutes of the accepted run, or attempts and a dash when the problem was not solved; no team has an entry in column B. The first place is the team of ITA, with 9 problems and 911 minutes.

    The small images the page refers to are not in our copy.
