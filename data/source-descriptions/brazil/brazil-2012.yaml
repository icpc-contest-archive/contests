  description: |-
    Booklet of problems and solutions of the first phase of the 2012 Maratona de Programação da SBC, the Brazilian sub-regional of the ACM ICPC, held on 15 September 2012: a PDF of 28 pages in Portuguese. After the cover come 12 problems, A to L, starting with A Concurso de Contos. Each has a statement with input and output format and file name, followed by a section headed Solução that explains the solution in prose, with some formulas. No test data or code.

    This is the qualifying round that preceded the Brazilian final of 9 and 10 November 2012, not the final contest.
