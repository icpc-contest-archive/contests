  description: |-
    Problem set of the 2012 Latin American Regional Contests, Contest Session: a PDF of 19 pages in English. The cover gives the dates 9 and 10 November 2012, says that the set contains 10 problems and is used in simultaneous contests in ten countries (Argentina, Bolivia, Brasil, Chile, Colombia, Cuba, Perú, México, República Dominicana, Venezuela), and shows the sponsors. A page of general rules for program names, input and output follows. The ten problems are A Arranging Heaps, B Boxes and Stones, C Cellphone Typing, D Different Digits, E Environment Protection, F Fix the Pond, G Game of Tiles, H Hours and Minutes, I Interval Product and J Joining Couples. Each has a statement with input and output format and a table of sample input and output. No test data or solutions.
