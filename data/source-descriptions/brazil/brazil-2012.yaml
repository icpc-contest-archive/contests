  description: |-
    Final standings of the 2012 South America/Brazil Regional Contest: 50 teams, with rank, team name, institution, number of problems solved, total time, medal and citation, and a column for a site citation. 49 teams are ranked; one more team, with no problem solved, is listed last without a rank. Gold medals go to the first three teams, silver to places 4 to 6 and bronze to places 7 to 10; the first-place team carries the site citation Brazilian Champions. The citation column gives the place as a word for places 1 to 25 and Honorable Mention for places 26 to 49. There is no per-problem detail.
