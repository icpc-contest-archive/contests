  description: |-
    Final results page of the XIX Maratona de Programação, in Portuguese. It says the Brazilian final took place at the Universidade de Fortaleza (UNIFOR) in Fortaleza on 7 and 8 November 2014, names the authors of the three warm-up problems and of the eleven contest problems A to K, and names the champion, the team "I am root" of the Universidade de São Paulo.

    It lists the ten medal-winning teams, three gold, three silver and four bronze, with team members and coach, and notes the teams that qualified for the World Finals. The five regional champions are named. Links lead to the problem PDFs, the final scoreboard, statistics, clarifications and run list, and team photos. Those linked pages are not part of this page, and it has no table of all teams.
