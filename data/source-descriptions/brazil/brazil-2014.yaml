  title: ACM International Collegiate Programming Contest 2014 Latin American Regional Contests
  language:
  - en
  contest_date: '2014-11-07'
  problems: 11
  pages: 16
  description: |-
    Problem set of the Latin American regional contests, a PDF of 16 pages in English. The cover names the 2014 ACM International Collegiate Programming Contest, Latin American Regional Contests, 7th-8th November 2014, Contest Session, and says that the set is used in simultaneous contests in Argentina, Bolivia, Brasil, Chile, Colombia, Cuba, México, Panama, Perú, República Dominicana and Venezuela.

    A page of general information on program names and input and output follows. Then come eleven problems, A to K, from Automated Checking Machine to Knights of the Round Table, numbered as pages 1 to 14. Each has a statement with the author and the author's university, input and output format, and sample input and output. No test data or solutions.

    The text layer of the cover page also holds four copies of the statement of a problem called Baggage, which is not shown on the page and is not one of the eleven, so text extracted from that page is unreliable; the text of the other pages reads normally.
