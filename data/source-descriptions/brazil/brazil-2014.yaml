  description: |-
    Website of the Maratona de Programação, the Brazilian regional contest, in Portuguese, with the pages of its XIX edition: first phase on 13 September 2014 and Brazilian final in Fortaleza on 7 and 8 November 2014. The 2014 pages in our copy are the home page (a menu of 19 links and a notice that it was last modified on 18 December 2014), the page of important dates with deadlines from May to September 2014, a short page saying that Unifor is to hold the Brazilian final in Fortaleza, and a page of past competitions. A 10-page PDF manual for the directors of first-phase sites, dated 8 April 2013, is also in the copy.

    Our copy holds 150 files, 123 of them pages. The site is shared between editions: it also has the dates and final pages of the 2007, 2009, 2011, 2012, 2016, 2018 and 2019 editions, the home page of the 2016 edition, past-competition pages of several editions, the rules for 2015, a few pages of the 2003 edition, results pages of the 2000 and 2001 contests, and a 60-page PDF from March 2009 on the SBC programming competitions. 68 of the pages are unrelated pages of the Institute of Mathematics and Statistics of the University of São Paulo, served at the same address.

    The rules, registration, first-phase sites, organising committee and other pages that the 2014 menu links to are not in our copy. The link to the final results leads to a page that is not part of this copy.
