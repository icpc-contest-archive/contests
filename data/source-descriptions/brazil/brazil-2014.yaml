  description: |-
    Final standings of the 2014 ACM-ICPC South America/Brazil Finals: 60 teams, each with rank, team name, institution, number of problems solved and total time, followed by a medal column, a citation column and a site citation column. Tied teams share a rank number. The first place, "I am Root" of Universidade de São Paulo, solved 10 problems with a time of 1010. Ten teams carry medals, three gold, three silver and four bronze, and their citation gives the place from first to tenth; only the first-place team has a site citation ("Brazilian Champions").

    There are no per-problem results, no counts of attempts and no problem labels.
