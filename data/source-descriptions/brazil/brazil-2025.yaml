  description: |-
    Final standings of the 2025 ICPC South America Brazil Finals: 66 teams with rank, team name, institution, number of problems solved, time and a citation. The first place is Naim continua dentro de nós of Universidade Estadual de Campinas with 10 solved and a time of 1564, followed by a team of Universidade Federal de Campina Grande with 9 and ooga booga of Universidade Federal de Minas Gerais with 8.

    The first 36 places carry an ordinal citation (First Place to Thirty-sixth Place) and the remaining 30 teams are cited as Honorable Mention. There is no per-problem detail and no attempt counts.
