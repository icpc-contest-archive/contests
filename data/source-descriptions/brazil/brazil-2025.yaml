  description: |-
    Final scoreboard of ICPC Latin America Regionals 2025, produced by BOCA, with all the simultaneous Latin American contests on one page. The table has 2,218 team rows and 593 distinct team entries; each team appears in two to six rows, and its rank can differ between rows. Columns are rank, user and site code, team name with the institution in brackets, problems A to L and a total of problems solved with penalty time; each problem cell gives the number of tries and the solve time, with a dash for time when unsolved. The first row is [CCL] Guerreiros do K-pop with 10 solved and 1411 penalty, and the first [UNICAMP] row has 10 solved and 1564. 34 entries carry a ccl user code, 28 of them marked [CCL] in the team name, and 44 team entries carry a note that the team qualified for the Programadores de America in Chile.

    The header lists the separate boards (Global, Global+CCL, Female_Teams, Brasil, regional groups, CCL) and links to the information sheets, problem set, time limits, packages and an editors and machines report. The RUNS, TASKS, CLARIFICATIONS and STATISTICS pages are linked but not in our copy.
