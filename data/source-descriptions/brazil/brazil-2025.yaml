  description: |-
    History page of the XXX Maratona de Programação (Maratona SBC de Programação) 2025 on the organisers' site, in Portuguese. Separate pages cover the online Fase Zero of 24 May 2025, the First Phase of 13 September 2025 (53 sites, 1025 teams from 239 schools, thirteen problems A to M with authors, results links, judges' editorial and the places awarded for the Brazilian final) and the Brazilian final at FECAP in São Paulo, 6 to 9 November 2025. The final's page gives sponsors, the four warmup problems, the twelve contest problems A to L with authors and countries, and the results: 66 teams in the Brazilian final and 573 in the six simultaneous Latin American contests, with winners and medallists. The seed page also reports the Latin America Championship in Santiago, Chile (44 teams, 12 Brazilian) and the Brazilian teams qualified for the 2026 World Finals.

    Our copy holds 25 pages and documents: the four history pages; for the First Phase, the warmup and contest problem sets and information sheets in Portuguese and English, the judges' editorial, and the BOCA scoreboard with its runs, clarifications and statistics pages; and for the Latin American contest, the warmup and contest problem sets, an information sheet and time limits (English) and three BOCA scoreboards (Latin America, Brazil, Brazil with CCL). The opening slides and the package archives are linked but not in our copy.
