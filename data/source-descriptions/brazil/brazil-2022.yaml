  description: |-
    Problem set of the 2022 Latin American Regional Contests, contest session, dated March 18, 2023: a PDF of 32 pages in English, marked v1.0. The cover says it holds 13 problems on pages numbered 1 to 30 and is used in simultaneous contests in 14 countries, which it lists (Argentina, Bolivia, Brasil, Chile, Colombia, Costa Rica, Cuba, El Salvador, México, Perú, Puerto Rico, República Dominicana, Uruguay and Venezuela). A page of general rules for program names, input and output follows the cover.

    The 13 problems are labelled A to M, from A "Asking for Money" to M "Maze in Bolt". Each has a statement with input and output formats and at least one sample input and output; several have figures. The last page carries only a note that it is intentionally left blank. No test data or solutions are in the document.
