  description: |-
    Final scoreboard of the Latin American regional contest, ICPC-LATAM Regional 2022, produced by BOCA. It has 13 problems, A to M. Each row gives rank, a team and site code (for example teamsoar001/AR), the team name with its institution in brackets, a cell per problem with the number of attempts and the minute of the accepted run (such as 1/88), and the total solved with penalty time in parentheses. The first row is [UBA - FCEN] una ma y no inchamo ma with 12 problems solved.

    The page holds the Latin American contest as a whole: 329 distinct team accounts from 14 country codes, 20 of them in the CCL views and 15 with a name beginning with [CCL]. The same teams are repeated in several views, so the table has 855 rows and ranks restart in each view. The page's menu lists the views: global, the Brazil, Central America, Caribbean, Mexico, North and South regions with their site codes, and the CCL views of the same groups. Links lead to the warmup and contest information sheets, problem sets, time limits, the editorial and the BOCA packages.
