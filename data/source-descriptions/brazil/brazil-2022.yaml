  problems: 13
  description: |-
    Website of the Brazilian Programming Marathon (Maratona SBC de Programação), in Portuguese. The page for the XXVII edition, 2022, says that the first phase was held on 8 October 2022 at 42 sites in Brazil with 556 teams from 170 institutions, and that the Brazilian final took place in Campo Grande, Mato Grosso do Sul, hosted by the Federal University of Mato Grosso do Sul. It names the sponsors, lists the three warmup problems and the 13 contest problems A to M with the setter and country of each, gives the gold, silver and bronze medal teams of the Latin American results, the regional champions, the eleven non-competitive "café com leite" teams, and the Brazilian teams at the 2022/23 World Finals in Luxor, Egypt.

    Our copy holds 30 files: eight pages and 22 images. Only the 2022 page belongs to this edition. The other seven pages are of the 2023 edition on the same site: its home page, a first-phase page, two scoreboards, a list of runs, a problem set PDF of 23 pages and an editorial PDF of 12 pages. The links from the 2022 page to its scoreboards, problem set, results PDF, packages and team photos lead to files that are not in our copy.
