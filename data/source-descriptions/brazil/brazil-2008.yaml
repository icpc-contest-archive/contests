  title: XIII Maratona de Programação
  title_en: 13th Programming Marathon
  language:
  - pt
  description: |-
    Website of the XIII Maratona de Programação (the Brazilian Programming Marathon), 2008, in Portuguese, published by the Sociedade Brasileira de Computação with the Fundação Carlos Chagas. The front page reports the first phase (20 September 2008; a record 360 teams from 129 schools at 40 sites) and the Brazilian final on 14 and 15 November 2008 at the Centro Universitário de Vila Velha, with the 51 qualified teams, the champion and medal winners with their members, photos of the winners, a link to the final scoreboard, and the six teams that went on to the World Finals in Stockholm in April 2009.

    A first-phase page gives the problem setters, two warm-up problems and contest problems A to J with judges' inputs and outputs, the places in the final given to each site, and links to the sites' result files. Our copy holds most of those files (PDF, HTML, text, images, spreadsheets, Word); five links lead to pages that are not in it. A page of the final's problems lists two warm-up and eleven contest problems by title with their setters. The PDF problem sets of the first phase (18 pages) and of the final's South American regional contest, a warm-up PDF and a zip of input and output files are also there.

    Our copy holds 103 files, 47 of them pages (HTML, PDF or text); the rest are images, input and output files, a zip, a spreadsheet, a Word file and a script.
