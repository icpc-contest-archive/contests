    Problem set of the ACM ICPC 2010 Latin American Regional Contests, a PDF of 17 pages marked v1.0 and headed Contest Session, dated 22 and 23 October 2010. The cover states that the set has 11 problems and is used in simultaneous contests in Argentina, Bolivia, Brazil, Chile, Colombia, Cuba, Peru, Mexico and Venezuela. After a page of general input and output rules come the 11 problems A to K, from Ants Colony to Kids' Wishes. Each has a statement in English with input and output description and a sample input and output, and a problem code name. No test data or solutions.
