  title: XV Maratona de Programação
  title_en: XV Programming Marathon
  language:
  - pt
  - en
  problems: 11
  description: |-
    Website of the XV Maratona de Programação, the 2010 Brazilian marathon run by the Sociedade Brasileira de Computação with Fundação Carlos Chagas, in Portuguese. The front page gives the dates of the first phase (18 September 2010) and of the Brazilian final (22 and 23 October 2010, at UDESC in Joinville), reports 432 first-phase teams from 157 schools at 43 sites and 50 teams in the final, and lists the gold, silver and bronze medal teams with members and coaches, marking those that qualified for the World Finals. It mentions a guest team from OBI that finished third and links the final scoreboard as a PDF.

    Other pages hold the problem committee and the author of each warm-up and contest problem; the Latin American problem set and warm-up set in English (PDF); the Brazilian first-phase problem set (11 problems) and warm-up set in Portuguese (PDF); test data archives; a first-phase page with the qualification slots per site and the qualified teams, linking results for many sites; photos of the medal teams; and a page of the 2011 edition about the World Finals.

    Our copy holds 150 files, 111 of them pages. Some files of the individual site pages were not saved.
