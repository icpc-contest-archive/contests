  description: |-
    Final scoreboard produced by BOCA (the footer names boca-1.5.10): 62 teams ranked 1 to 62 against eleven problems, A to K. Each team row gives a login, the team name with its institution in brackets, one cell per problem with the number of tries and the time, written tries/time, and a Total column with the number solved and the penalty in parentheses. A problem with tries but no solution shows a dash in place of the time. The first place is Turing-indecisos of UFPE with 11 problems and 1504. Every team has at least one problem solved.

    The header reads "Available scores: Brasil". There are no medal marks and no separate site or guest groups.
