  description: |-
    Judge's list of problems: the category "Latin America Regional Contests 2015" of the Baekjoon Online Judge, filed under the ACM-ICPC regionals of Latin America, with a Korean-language interface. A table of 12 problems gives the judge's problem number (11540 to 11551), the letter, the English title, and the judge's counts of users who solved it, submissions and acceptance rate. Letters A to K run from "At most twice" to "Keep it energized"; a twelfth problem is lettered P and titled "Competition".

    The counts are the judge's own, as of the capture. The problem statements are on the judge's separate problem pages, which are not in our copy.
