  description: |-
    Final results page of the XX Maratona de Programação, in Portuguese. It says that the Brazilian final was hosted by Faculdade IBTA in São Paulo, shows a group photo of the participants and mentions a march along Avenida Paulista, names the authors of the three warm-up problems and of the eleven contest problems A to K and lists the problem selection committee. The champion is the team Turing Indecisos of the Universidade Federal de Pernambuco.

    The ten medal-winning teams are listed, three gold, three silver and four bronze, with team members and coach, and the qualification for the World Finals is noted. The page also names the five regional champions and a "café com leite" competition of five teams besides the official one. Links lead to the problem PDFs and test data, the final scoreboard, statistics, clarifications, run list and team photos. Those linked pages are not part of this page, and it has no table of all teams.
