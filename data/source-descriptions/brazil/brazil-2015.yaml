  description: |-
    Final standings of the 2015 ACM-ICPC South America/Brazil Finals: 62 teams, each with rank, team name, institution, number of problems solved and total time, followed by a medal column and a site citation column. The first place, Turing-indecisos of Universidade Federal de Pernambuco, solved 11 problems with a time of 1504 and is the only team with a site citation ("Brazilian Champion"). Ten teams carry medals, three gold, three silver and four bronze.

    There are no per-problem results, no counts of attempts and no problem labels.
