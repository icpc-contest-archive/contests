  copy: brazil/brazil-2015/website/2026-09-05-wayback-815d0c41
  title: XX Maratona de Programação
  language:
  - pt
  description: |-
    Website of the Maratona de Programação, the Brazilian regional contest, in Portuguese, as it stood for its XX edition: first phase on 12 September 2015 and Brazilian final in São Paulo on 13 and 14 November 2015. The pages of this edition in our copy are two versions of the home page, one last modified on 3 September 2015 and one last modified on 16 November 2015 that adds a link to the results of the final, and the 2015 rules, with sections on team formation, registration and qualification for the Brazilian final, super-sites, centralised grading, the contest format, and prizes and qualification for the World Finals.

    Our copy holds 150 files, 124 of them pages. The site is shared between editions: it also has the dates and final pages of the 2007, 2009, 2011, 2012, 2014, 2016, 2018 and 2019 editions, the home page of the 2016 edition, past-competition pages of several editions, a few pages of the 2003 edition, results pages of the 2000 and 2001 contests, and a 60-page PDF from March 2009 on the SBC programming competitions. 70 of the pages are unrelated pages of the Institute of Mathematics and Statistics of the University of São Paulo, served at the same address.

    The other pages that the 2015 menu links to, such as dates, first-phase sites, registration and the final, are not in our copy.
