  description: |-
    Website of the Angolan collegiate programming contest cycle (AoCPC), in Portuguese, hosted on WordPress. Our copy holds 7 pages. The main page is headed AOCPC 2017 and announces the Concurso Nacional Universitario ACM de Programacao (national university ACM programming contest) at the Instituto Superior de Tecnologias de Informacao e Comunicacao (ISUTIC) on 29 and 30 September 2017. It lists nine participating institutions and links to the schedule, descriptions of activities, team instructions, the programming environment, the list of teams qualified for the South African regional, the scoreboard and the problem set, a video summary and a minute-by-minute account.

    The other pages are two posts of 21 September 2017 announcing side events (ICPC-Xadrez, a chess activity, and ICPC-Futebol, a football match on the afternoon before the contest day), a post of 17 October 2017 on ICPC-Xadrez with a sign-up deadline of 19 October, a news post on the 2018-2019 ICPC cycle with its planned dates, a page on registration for the 2019-2020 cycle (four levels: local contests, national contest, regional contest, world finals), and a 2-page PDF with instructions for filling in the ICPC profile.

    The scoreboard, team list and problem set are only links: the first and last lead to another server and the team list to the ICPC site, and none is part of our copy. The PDFs behind the schedule links are not in our copy either, and eight photo files linked by the site were not captured.
