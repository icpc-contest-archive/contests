    Problem set as a PDF of 14 pages, in English, headed with the contest name and the date November 19, 2017. The first page lists two clarifications (for problem A any minimizing x and y may be output; for problem H with n = 3, k is at most 100000). It then holds eleven problems A (Fermat's Optimization Problem) to K (Marine), each with a statement, input and output format, time limit and an example with sample input and output. No test data or solutions.
