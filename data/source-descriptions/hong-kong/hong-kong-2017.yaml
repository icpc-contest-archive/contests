  description: |-
    Contest page on Luogu, in Chinese, for a replay contest (重现赛, chóngxiànsài, "replay contest") of the 2017 ACM-ICPC Asia Hong Kong Regional, held on 3 August 2026 from 13:00 to 18:00. The text says the problems and data are the originals of the on-site contest, with Chinese statements, and sets out the rules: ICPC format with a 20-minute penalty per failed attempt, teams of one to three, a scoreboard locked for the last hour, and a limit on submissions to problems with long time limits. A last section explains Luogu's award certification for ICPC and CCPC results.

    The page does not list the problems in our copy, so the statements are not in it.
