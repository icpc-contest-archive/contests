  title: The 2017 ACM-ICPC Asia Hong Kong Regional Contest
  language:
  - en
  contest_date: '2017-11-19'
  description: |-
    Contest page of the 2017 ACM-ICPC Asia Hong Kong Regional Contest, held at the Hong Kong Polytechnic University over 18 and 19 November 2017 (registration, opening and a practice contest on the 18th, the contest on the 19th), in English. It gives the eligibility and registration rules (HKD 1100 per team, at most 50 teams, one team per university, no online preliminary), the schedule of both days, transport directions, the award categories (champion, runners-up, five gold, five silver and five bronze awards), and contest rules with the judging environment (Ubuntu 16.04, C, C++ and Java, PC2 as control system). It has links to a scoreboard page and a problem set PDF, and AIM TECH is named as sponsor.

    Our copy is this one page; the menu entries are anchors within it, and the registration, hotel and reference links lead outside our copy.
