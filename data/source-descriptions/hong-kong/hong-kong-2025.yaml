  description: |-
    Contest dashboard on QOJ.ac for "The 4th Universal Cup. Stage 14: Grand Prix of Hong Kong", which the page says is also known as The 2025 ICPC Asia Hong Kong Regional Contest and as Petrozavodsk Winter 2026, Day 2, Grand Prix of Hong Kong. It lists twelve problems A to L, from Bipartite Graph Matching Problem to Cyclic Shift II, each linked to its problem page, and files them under the ICPC Asia East regionals, the 50th Petrozavodsk Programming Camp and the 4th Universal Cup. A side panel gives the rules (ICPC ruleset, 20 minutes penalty, scoreboard frozen after 4:00:00) and links to statements and tutorials in English as attachments.

