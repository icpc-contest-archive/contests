  description: |-
    Website of the Department of Computer Science and Engineering of The Chinese University of Hong Kong, mostly in English. Our copy holds 148 pages (plus two icon files): 98 of them are copies of the department home page saved under different addresses, and the rest include the seminar archive for 2017/2018, news and achievement items, a few course and project pages, and an alumni story page in Chinese.

    One achievement item, saved under two addresses, reports a CSE ACM programming team winning the gold medal at the ACM/ICPC Dalian, Beijing and Qingdao regional contests in 2016. The home page lists an upcoming event entry for an ICPC Asia Hong Kong regional whose address names the 2023 contest. No page covers the 2016 Hong Kong regional contest.
