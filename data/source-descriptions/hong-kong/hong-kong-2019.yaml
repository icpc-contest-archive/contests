  description: |-
    Standings of the 2019 ICPC Asia Hong Kong Regional Contest: 36 teams with rank, team name, institution, number of problems solved, time, medal and a citation. There are no per-problem columns. First place has 6 problems solved with time 672 and carries the title Champion; 3 teams carry a gold medal, 7 silver and 11 bronze, and the remaining 14 have no medal. The citation column holds ordinal places (First Place to Eighteenth Place) for 18 teams and Honorable Mention for the other 18; the two do not follow the rank order throughout (rank 7 reads Honorable Mention, rank 21 reads Seventh Place).
