  description: |-
    Codeforces gym dashboard of the contest, marked Finished. It lists eleven problems A to K with their names, time limits (from 0.5 to 5.5 seconds), a memory limit of 512 MB each and the number of solvers of each problem, and links to contest materials: announcement, statements, tutorial and a solution to problem F, all in English. The page also shows the virtual participation and practice notices and the forms for questions and announcements.

    The linked announcement, statements and tutorial are not part of our copy of the page. The solver counts are those of the day the page was saved, in November 2026.
