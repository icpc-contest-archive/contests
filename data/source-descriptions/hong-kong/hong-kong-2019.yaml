  title: The 2019 ICPC Asia Hong Kong Regional Contest
  language:
  - en
  - zh
  contest_date: '2019-12-01'
  description: |-
    Website of ACM HK, the Hong Kong chapter of the ACM, in English with the Shenzhen venue address in Chinese. Its page for the 2019 ICPC Asia Hong Kong Regional Contest gives the dates (30 November and 1 December 2019), the venue (the National Supercomputing Center in Shenzhen), the registration fee of USD 200 and a deadline of 30 September 2019 for second-round registration and payment, the schedule of both days (practice contest on 30 November, contest on 1 December), the award categories and the contest rules, which name DOMjudge 7.1.1 as the judging system. The regional page has no scoreboard or problem links in our copy.

    Our copy holds 56 pages in all, many of them the same page under two addresses. The rest of the site belongs to the separate annual ACM-HK Programming Contest, held locally: its pages for 2017, 2018 and 2019 (rules, registration, dates, past winners, a 2017 scoreboard), problem PDFs of 2015 to 2018, a two-page rundown for the 22 June 2019 contest and a registration form, besides pages about the chapter, its committee and its other events. The 2018 regional page, as it stood in a December 2018 capture, is also inside.
