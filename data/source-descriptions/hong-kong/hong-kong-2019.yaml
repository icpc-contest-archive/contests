    Problem set: a PDF of 19 pages with a cover that names the Asia Hong Kong Regional Contest 2019, December 1, lists the eleven problems A to K by name (Axis of Symmetry to Key Project) and says it was prepared by Zhejiang University. The page headers read Shenzhen, December 1, 2019. Each of the eleven problems has a full statement in English with input and output format and an example, some with figures. There is no test data and no solutions.
