    Contest dashboard on the QOJ.ac online judge, in English, for "The 3rd Universal Cup. Stage 23: Hong Kong", which the page says is also known as The 2024 ICPC Asia Hong Kong Regional Contest; it is filed under ICPC / Regionals / Asia East Continent (both Hong Kong & Macau and The 2024 ICPC Asia East Regionals) and under the 3rd Universal Cup. It lists 13 problems A to M, from "General Symmetry" to "Godzilla", each linking to its problem page, and gives the contest settings (ICPC ruleset, 20-minute penalty, scoreboard frozen after 4:00:00). Attachments named "Statements (en)" and "Tutorials (en)" are linked for download, and the page links the standings; neither is part of this page.
