  description: |-
    Analysis as slides, a PDF of 58 pages in English, by Zhejiang University and dated 2024.12.22. An overview slide says the contest was to be used as a stage of Universal Cup Season 3 and ranks the thirteen problems A to M from easiest to hardest by idea, by coding and in summary. The problems then follow in the summary order (C, K, L, G, H, B, F, E, A, D, J, I, M), each with a title slide giving the length of the shortest judge solution in bytes, followed by a description slide and one or more solution slides. Problem D is headed Master of Both IV here. The last page reads Thank you.
