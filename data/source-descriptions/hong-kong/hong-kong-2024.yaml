- url: https://icpc2024.comp.polyu.edu.hk/
  read: '2026-11-16'
  rubric: 1
  copy: hong-kong/hong-kong-2024/website/2026-09-04-live-9ffdc735
  title: The 2024 ICPC Asia Hong Kong Regional Contest
  language:
  - en
  contest_date: '2024-12-22'
  description: |-
    Website of the 2024 ICPC Asia Hong Kong Regional Contest, in English, for 21 and 22 December 2024 at The Hong Kong Polytechnic University and City University of Hong Kong. Our copy holds the front page and five PDFs. The front page gives the registration steps (registration on the ICPC website, a fee of 1800 HKD, an additional information form, a link to the list of accepted teams), the registration rounds, the schedule of both days (registration, opening, warm-up and reception on 21 December; contest, coach arrangement, closing and solutions, coach banquet on 22 December), contact details and logos of sponsors and supporting organisations.

    The PDFs are the contest instructions (2 pages: DOMjudge 8.3.1, languages C, C++, Java, Kotlin and Python 3, compiler arguments), judging notes (2 pages), technical notes (5 pages), the list of accepted teams (3 pages), which is a source of its own, and a guidance document of 6 pages: one page with schedule, awards, programming environment, rules and transport, followed by the official team list with seat assignments and a seat list. Our copy has no scoreboard, results or problem pages.
