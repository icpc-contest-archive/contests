  teams: 52
  description: |-
    Standings of the 2018 ICPC Asia Hong Kong Regional Contest: 52 teams with rank, team name, institution, number of problems solved, time and medal, plus two columns, citation and site citation, that hold 0 for every team. There are no per-problem columns. First place has 6 problems solved with time 930; 4 teams carry a gold medal, 8 silver and 11 bronze.

    Ranks run from 1 to 39 (four teams share rank 39 with no problems solved). The last ten rows, including three teams of the Hong Kong Olympiad in Informatics, all show rank 99 and no medal, and their solved counts range from 0 to 5; the page does not say why they are ranked this way.
