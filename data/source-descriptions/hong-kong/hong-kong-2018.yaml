  contest_date: '2018-11-18'
  description: |-
    Website of the 2018 ACM-ICPC Asia Hong Kong Regional Contest, in English, for 17 and 18 November 2018 at Cyberport, Hong Kong. Our copy holds one page, the front page, which carries everything: the registration rules (one team per university, at most 60 teams, a fee of USD 200, priority for universities in Hong Kong and Macau), the schedule of both days (registration and practice contest on 17 November, the contest and the closing ceremony on 18 November), directions to Cyberport, the award categories (champion, two runners-up, gold, silver and bronze), the contest rules, the judging and coding environment (PC 2 on Microsoft Windows 7), and a list of 37 confirmed universities.

    The buttons for the scoreboard, problem set and photo album have empty addresses in our copy and lead nowhere.
