  description: |-
    Standings of The 2001 ACM Mid-Central USA Programming Contest sponsored by IBM: 98 teams with rank, team (institution and team name) and citation. The first 38 teams carry ranks 1 to 22 (First Place to Twenty-second Place, with 17 teams tied at rank 22); the remaining 60 teams are listed alphabetically by institution under Honorable Mention without a rank. First place is University of Arkansas (Arkansas Razorbacks). There are no solved counts, times or per-problem results.
