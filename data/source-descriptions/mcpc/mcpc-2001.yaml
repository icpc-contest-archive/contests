  title: WELCOME 2001-2002 ACM MID-CENTRAL CONTEST REGION
  language:
  - en
  contest_date: '2001-11-03'
  teams: 10
  description: |-
    Home page of the 2001-2002 ACM Mid-Central contest region for the regional programming contest of Saturday, November 3, 2001, sponsored by IBM, titled THE SECOND ACM MID-CENTRAL REGIONAL PROGRAMMING CONTEST of the 21st CENTURY. It announces that registration closed after October 12, 2001, gives registration statistics current to 10-18-01 (100 teams, 54 universities), and carries a menu of links: site locations, schedule of events, notes for local site coordinators, T-shirt order, contest headquarters, regional officials, rules, a call for problems for 2002, and the contest archives of 2000, 1999, 1998, 1997 and 1996.

    A table lists the ten official team finalists in order, First to Tenth, with university, adviser, team label and three team members; this is the only result on the page, so the other teams are not listed. The top two teams go to the World Finals in Honolulu, Hawaii, March 20 to 24, 2002. First place is University of Arkansas - Fayetteville, Team A.

    Our copy holds this one page with its two images. The pages behind the menu links are not part of it.
