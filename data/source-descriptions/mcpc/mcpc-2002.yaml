    Rankings page headed 'The 2002 ACM Mid-Central USA Programming Contest sponsored by IBM': 108 teams with rank, institution and team name, and a citation such as First Place or Honorable Mention. 103 teams carry a rank, 1 to 95, with nine teams sharing rank 95; five more are listed without a rank as Honorable Mention. The University of Illinois team Overflow is first, followed by the University of Arkansas and the University of Kentucky. The page gives no number of problems solved, no times and no per-problem results.
