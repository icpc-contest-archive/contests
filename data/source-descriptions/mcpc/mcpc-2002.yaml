  language:
  - en
  contest_date: '2002-11-02'
  description: |-
    Home page of the website of the 2002-2003 ACM Mid-Central Regional Programming Contest, in English, sponsored by IBM and dated Saturday, November 2, 2002. It announces late registration after October 11 and October 18 as the last day for ordering T-shirts, and gives registration statistics current to October 31, 2002: 108 teams from 61 universities.

    The page is a menu of 18 links: registration at a glance, regional officials, the chief judges' page, site locations, the call for problems, schedule of events, notes for local site coordinators, T-shirt order, contest rules, the top 9 teams, contest headquarters, and archives of the regional contests of 1996 to 2001. Our copy holds this one page only; the pages behind the links are not in it, and its logo images are not in our copy.
