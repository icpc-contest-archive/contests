    Page of the contest website headed 'OFFICIAL 2002-2003 TEAM FINALISTS', listing the ten best teams, First to Tenth place. It states that the top three teams will attend the World Finals in Beverly Hills, California, March 22-26, 2003. For each team it gives the university with its postal address, the team adviser, the team letter and the three team members. The University of Illinois team B is first. Only the top ten are listed; the rest of the field is not on this page.
