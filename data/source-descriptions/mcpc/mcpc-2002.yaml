  description: |-
    Category page of the Baekjoon Online Judge, with Korean menus, listing the problems of the 2002 Mid-Central Regional Programming Contest, filed under ICPC Regionals, North America. A table gives seven problems, labelled A to G and numbered 4644 to 4650 on the judge, with title, number of users who solved it, number of submissions and acceptance rate. Six titles are in English (Programmer, Rank Thyself; Magnificent Meatballs; Safecracker; Oil Pipeline; Tanning Salon; Jungle Roads) and problem B has a Korean title (Hilbert curve). Each title links to a problem page of the judge; the statements are not on this page.
