  description: |-
    Scoreboard headed 'ACM Mid-Central Programming Contest Regional Standings' with a time of 06:00:59 PM: 106 teams ranked by problems solved, with columns for solved count, a total, a GMean value and a number for each of the seven problems A to G (0 where the problem was not solved). It gives no attempt counts. Teams are named by short institution name and letter, such as U. Illinois B, which is first with 7 solved. Rank 95 is shared by 12 teams with no problems solved, three of them marked {X} before the name without explanation on the page. Two summary rows at the bottom give the number of solutions and the average time for each problem.
