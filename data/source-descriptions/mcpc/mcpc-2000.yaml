  description: |-
    Standings of The 2000 ACM Mid-Central USA Programming Contest sponsored by IBM: 98 teams with rank, team (institution and team name), citation (First Place down to Seventy-eighth Place), number solved and time. The first-place team, University of Arkansas (Razorbacks), solved 6 problems with a time of 782; no other team solved more than 5, and 23 teams solved none. The last 23 teams, all with zero solved and no time, share rank 78. There is no per-problem detail and no problem labels.
