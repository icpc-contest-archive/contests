  title: WELCOME 2000-2001 ACM MID-CENTRAL CONTEST REGION
  language:
  - en
  contest_date: '2000-11-04'
  description: |-
    Home page of the 2000-2001 ACM Mid-Central contest region for the regional programming contest of Saturday, November 4, 2000, sponsored by IBM. It announces that registration closed after October 30, 2000, gives registration statistics current to 11-01-00 (102 teams, 54 universities), and carries a menu of links: site locations, schedule of events, notes for local site coordinators, T-shirt order, contest headquarters, regional officials, rules, a call for problems for 2001, and the contest archives of 1999, 1998, 1997 and 1996.

    Below the menu a table lists the nine official team finalists in order, First to Ninth, with university, adviser, team label and three team members; the top three teams go to the World Finals in Vancouver, B.C., March 7 to 11, 2001.

    Our copy holds this one page. The pages behind the menu links and the two images (the IBM logo and the site logo) are not part of it.
