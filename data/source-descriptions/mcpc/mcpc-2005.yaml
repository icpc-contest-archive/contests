  contest_date: '2005-11-05'
  description: |-
    Website of the Mid-Central USA Region of the ACM programming contest, run by the regional director at Rockhurst University, in English. The home page, last updated in February 2006, welcomes visitors to the 2005 contest, states that it was held on Saturday, November 5, and names the top three teams. Our copy holds 35 pages: pages for coaches, contestants, judges, problem authors and site directors, the rules, the schedule, site facilities, FAQs and contacts, and the notes to teams, judges and sites with the list of error messages.

    The 2005 contest materials page lists problems A to I (Pascal's Travels to Netiquette) with links to input, output and judge's solution for each; those linked files are not in our copy. The archives page lists the contests from 2005 back to 1998, with a zip file link for each year from 2005 to 2000, a link to the final standings of 2005 that leads outside our copy, and for 1999 and 1998 links to individual problems. Several pages belong to the 2006 contest instead: the 2006 contest materials page, a contest-day updates page, a local site standings page for 2006 and the notes to sites last modified in October 2006. The copy also holds six programming problems of the week (numbers 32 to 37) and older archive pages from 1998, 1999, 2001 and 2002.
