    Standings of the 2005 ACM Mid-Central USA Programming Contest, sponsored by IBM. 122 teams are listed with rank, team (institution followed by the team's name), citation, number solved and time. The first eighty teams carry a citation from First Place onward, and the rest have none; the best teams solved 7 problems, and the 24 teams that solved none share rank 99. There is no per-problem detail.
