    Problem list of the 2005 Mid-Central Regional Programming Contest on the Baekjoon Online Judge: nine problems labelled A to I, each with its judge problem number (4620 to 4628), title, and counts of users who solved it, submissions and the percentage correct. Seven titles are in English (Pascal's Travels, Overflowing Bookshelf, Connect, Copier Reduction, Time to Graduate, Painter, Netiquette) and problems G and H are given Korean titles. The page is in Korean and holds no statements; each title is a link to a problem page that is not part of our copy.
