  description: |-
    Baekjoon Online Judge page of problem 4620, "Pascal's Travels": the statement in English with input and output sections and one sample input and output, inside the site's Korean interface. A table gives a time limit of 1 second, a memory limit of 128 MB and the site's counts (160 submissions, 72 accepted, 67 solvers). The source list (출처, chulcheo, "source") files it under the 2005 Mid-Central Regional (problem A) and the 2005 Pacific Northwest Region contest (G). A hint warns that brute force over every path will exceed the time limit.

    The statement's two images and the site's style sheets are not in our copy.
