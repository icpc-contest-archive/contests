  description: |-
    Website of the 1995 ACM Mid-Central Region Programming Contest, held Saturday, November 4, 1995, in English. Our copy holds 8 pages and 27 files in all. The front page links the official results, the notifications and clarifications posted during the contest, and, for each of the seven problems, a statement in HTML and PostScript, the judge's solution, and the output; the judge's test data is linked for six of them (problem 2 has no test-data link). The results page is the final standings table of 79 teams. The notifications page lists time-stamped notices from the judges, among them a lowered limit for problem 2, a corrected judge output for problem 2 and a note on problem 1.

    Of the linked problem files, our copy holds the HTML statements of five problems (Perfect Cubes, A Puzzling Problem, Galactic Import, Letter Sequence Analysis, Mark-up), four PostScript statements, five judge's solutions, five test inputs and five outputs. The HTML statements of DNA Translation and Basically Speaking and the page images are not in our copy.
