  description: |-
    Final scoreboard of the 1995 Regional Programming Contest of the ACM Mid-Central Region, headed "Official Verified Final Standings": 79 teams, each with site, team name, division (1 or 2), a column for each of the seven problems #1 to #7, number solved, total time and place. A problem cell holds a time if the team solved the problem and is empty otherwise; there are no counts of attempts. Teams come from nine sites; 44 teams are in division 1 and 35 in division 2. Places run from 1 to 48 and are shared by teams with equal results: 31 teams solved nothing and share place 48. First place is the team WHEATON at site UIC with five problems solved and a time of 678.
