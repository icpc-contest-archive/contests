  description: |-
    Front page of the ICPC North America Mid-Central Regional website, headed "2024 – 2025 Regional Programming Contest", in English. It gives the contest date (November 09, 2024), the states the region welcomes teams from (Missouri, Arkansas, Illinois, Kentucky, Tennessee), the host sites (University of Illinois Urbana-Champagne, U. Tennessee Martin, Tennessee Tech, U. Kentucky, U. Arkansas - Fort Smith), the regular registration period (September 16 to October 26, 2024), fees ($25 per person), eligibility rules and an FAQ (Kattis as judging system, supported languages, next level after the regional). A Live Scoreboard link leads to Kattis.

    Our copy holds one page of the site, the front page, with its style sheets, scripts and images, plus the robots file and the site's WordPress data files. The menu pages (about, archive, contact, history) and the other pages named in the site's sitemap are not in our copy, and the live scoreboard link leads to another server.
