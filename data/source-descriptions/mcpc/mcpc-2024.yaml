    Standings page of the 2024 Mid-Central USA Programming Contest on Kattis, shown with the status "Contest is over": 81 teams with rank, team name, a state flag, an institution logo (the institution name appears as its tooltip), problems solved (Slv.) and total time, and one column for each of the 15 problems A to O. A problem cell shows the number of tries and, for a solved problem, the minutes; an unsolved problem shows the tries and a dash. A legend marks first solves, solved, attempted and pending. A site menu lists six host sites (Microsite, Tennessee Martin, Tennessee Technological University, Arkansas - Fort Smith, Illinois at Urbana/Champaign, Kentucky) as filters; our copy shows all sites together. The contest ran 12:00 to 17:00 CST on 2024-11-09.

    The team in first place is pocpocpoc with 14 solved. Five teams (COD1, Hendrix Black, nw2, Pirate and WUSTL 2) share the last rank, 77, with no solved problems; Pirate is not in the 80-team standings of the other source.
