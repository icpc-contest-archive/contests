  description: |-
    Regional standings dated Wed Feb 23 2000 in the page heading: a table of 106 teams from nine sites (CMSU, Harding, Louisville, Loyola, Murray St., Principia, SMSU, Tenn. Tech, Valparaiso). Each row gives rank, team name, number solved, score, a time for each of problems A to F, and the site; a 0 appears in a problem column where a team has no time for it, and there are no counts of attempts. The score is the sum of the problem times. First place is U. Arkansas A with six problems solved and a score of 1561. Forty-three teams solved nothing and share rank 64. Two closing rows give the number of solutions and the average score for each problem.

    The table combines all sites in one list.
