  language:
  - en
  contest_date: '1999-11-06'
  description: |-
    Home page of the 1999-2000 ACM Mid-Central contest region, dated Saturday, November 6, 1999 and marked as sponsored by IBM. It calls the contest the last Mid-Central regional programming contest of the 20th century. Notices list six satellite sites (Loyola University, University of Louisville, Principia College, Harding University, Southwest Missouri State University, Valparaiso University) as closed, say that fees are required for registrations after October 14th, and name three universities with open places. Registration statistics current to 11-05-99 give 110 teams from 61 universities.

    A table headed 1999-2000 team finalists says the top three teams go to the World Finals in Orlando, Florida, March 15-19, 2000; it lists nine teams, first to ninth, with university, adviser, team and team members. A menu links the ACM world wide programming contest site (Baylor University), the regional officials, satellite site locator, call for problems, schedule, rules, fees, team coaches, contest results, contest headquarters, registration, notes for site coordinators, participating teams by local site, notes for judges and the 1998-1999 activities. Our copy holds this one page; the linked pages are not in our copy.
