  description: |-
    Home page of the 1998-1999 ACM Mid-Central contest region, dated Saturday, November 7, 1998 and marked as sponsored by IBM. A notice near the top lists two satellite sites, University of Illinois - Chicago and University of Louisville, as closed and tells teams that have not registered to call the local satellite site coordinator.

    The page is a menu of links: funding changes, satellite site locater, call for problems, how to register a team, contest rules, contest day schedule, team registrations master list, team distribution by site, notes for local satellite site coordinators, contest results, problem set, notes for judges, and the previous year's regional web site. Our copy holds this one page only; the pages it links to are not in our copy.
