  description: |-
    Official results of the Mid-Central region as a table of 88 teams from eight sites: Arkansas State, Murray State, Principia College, Rockhurst College, Tennessee Tech, U Illinois Chicago, U Louisville and U Missouri Rolla. Each row gives rank, team name, total time, a time for each of problems 1 to 6, and the site name. A 0 appears in a problem column where a team has no time for it; there are no counts of attempts. Total time is the sum of the problem times. Eleven teams have a time in all six columns; the first place is UKENTUCKY-B with 527. Thirteen teams have no solved problem and share rank 76. The page does not state the date. It combines the results of all sites in one table.
