    Problem page 4571 "Grade School Multiplication" on Baekjoon Online Judge, with the statement in English inside the site's Korean interface: problem, input and output sections and one sample input with its output. Its source line files it under ICPC > Regionals > North America > Mid-Central Regional > 2011 Mid-Central Regional Programming Contest as problem A. The header gives a time limit of 1 second, a memory limit of 128 MB and the judge's counts (22 submissions, 16 users solved), and a links section points to the same problem on the ACM-ICPC Live Archive and HDU Online Judge. Our copy does not hold the site's style sheets.
