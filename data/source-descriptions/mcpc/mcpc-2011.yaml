  description: |-
    Baekjoon Online Judge page for the 2011 Mid-Central Regional Programming Contest, in Korean with mostly English problem titles. It lists eight problems labelled A to H, numbered 4571 to 4578 on the judge, with accepted-user count, submissions and acceptance ratio. Problems A, B, C, E, F and H (Grade School Multiplication, Laser Tag, Pizza Pricing, Refrigerator Magnets, Shut the Box, Crash and Go(relians)) have English titles; D and G appear under Korean titles. The page also holds the judge's navigation menus. Statements are on linked pages not in our copy.
