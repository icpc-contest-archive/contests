  title: 2011 ACM Mid-Central USA Programming Contest Regional Standings
  language:
  - en
  teams: 143
  problems: 8
  times: true
  tries: false
  description: |-
    Regional standings of the 2011 ACM Mid-Central USA Programming Contest, a plain page with 143 team rows. Each row gives rank, team name, Solved, Total, Last and a number for each of the eight problems A to H, with 0 where the problem was not solved; the eight numbers add up to Total in every row. The first place is U Illinois at U-C ILLIAC with 7 solved and 1120 total, the only team with seven. Seven teams share rank 137 with no problem solved, and two of them carry a {x} prefix. Two summary rows at the foot give the number of solutions and the average score per problem. Attempts are not shown.
- url: https://icpc.global/regionals/finder/Mid-Central-USA-2012/standings
  read: '2026-11-16'
  rubric: 1
  copy: mcpc/mcpc-2011/standings/api-20261113/standings.html
  title: The 2011 Mid-Central USA Regional Contest — standings
  language:
  - en
  teams: 143
  description: |-
    Final standings of the 2011 Mid-Central USA Regional Contest: 143 teams with rank, team name, institution, number solved, time, medal, citation and site citation. The first twelve places carry a medal (four gold, four silver, four bronze); the citation names the place for the ranked teams and reads Honorable Mention for the 72 lowest entries, which include the seven teams at rank 137 with no problem solved. Eight teams carry a site citation naming them champion of a participating university. First place is ILLIAC of the University of Illinois Urbana-Champaign with 7 solved. There are no per-problem results.
