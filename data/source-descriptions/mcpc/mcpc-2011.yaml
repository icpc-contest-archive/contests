- url: http://mcicpc.cs.atu.edu
  read: '2026-11-16'
  rubric: 1
  copy: mcpc/mcpc-2011/website/2026-09-05-wayback-ce172ffd
  title: ACM Mid-Central Regional Contest Materials Page
  language:
  - en
  description: |-
    Website of the ACM Mid-Central Regional Programming Contest, a series site that holds material from several years. Our copy holds 149 files, 137 of them pages. Besides 2011 it has final standings pages for 2006, 2008 to 2010 and 2012 to 2014, a contest materials page for each year from 2004 to 2014, problem pages of several years, and 2014 standings pages from a score script: the regional standings and nine local-site standings.

    For 2011 it holds the materials page and statement pages for six of the eight problems (Laser Tag, Refrigerator Magnets, Shut the Box, Su-domino-ku, Sokoban, Crash and Go(relians)), with a judge notes page for Laser Tag; the 2011 final standings page is not in it. The materials page lists notes to teams, error messages, notes to sites and to judges, the judging utilities, and the eight problems A to H, each with input and output and the judge's C++ and Java code, four of them (B, C, D, F) with judge's notes; it says it was last modified on 28 October 2011. The archive file for 2011 (3.7 MB, 190 files) holds a folder for each of the eight problems, judge utilities and a folder of PDFs.
