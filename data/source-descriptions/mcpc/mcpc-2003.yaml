  description: |-
    Standings page headed 'The 2003 ACM Mid-Central USA Programming Contest sponsored by IBM', in English: 104 teams with rank, institution and team name, citation, number solved and time. Rank 1 is the University of Illinois team Overflow with 7 solved and a time of 775, followed by Queen's University (Queen's BLT) and a second University of Illinois team. Places up to 80 carry a citation such as First Place; two teams at the end are marked no-show and ranked 101, and teams that solved nothing have no time. There is no per-problem detail.

    Ranks 14 and 65 are absent from the table in our copy (it goes from 13 to 15 and from 64 to 66).
