    Apache directory listing of the archive folder for 2003 on the Mid-Central contest server, last modified 2015-09-21. It has 16 entries: eight directories named after the problems (clay, robots, bracelet, tread, mines, doubles, fax, tourn), directories judge, team, notes, unix and back, and the files browse.html, install.bat and rootmark.txt.

    Only the listing itself is in our copy; the contents of the directories are not, so no statements, data or solutions can be read here.
