  contest_date: '2003-11-01'
  description: |-
    Website of the Mid-Central USA Region of the ACM programming contest, in English. Our copy holds 119 saved pages, of which four are 404 error pages and three are a notice that the address moved to Missouri State University, plus 31 other files (input, output and source files, figures, images). The 2003 pages carry update stamps from August 2003 to May 2004.

    The 2003 home page opens with 'Welcome to the 2003 Mid-Central USA programming contest!', says the contest was held on November 1, and links to the contest materials, a zip file and an Official Standings page on another server; the zip file and that page are not in our copy. Other 2003 pages are the rules, the schedule for Saturday, November 1 (contest 12:30pm to 5:30pm CST), information for coaches, site directors and judges, contacts, FAQs, and an archives page listing the contests of 1998 to 2003.

    The contest materials page lists problems A to H. Our copy holds seven statements (Fax Regions is missing), a judge's solution for all eight, judge's notes for Robots, Bright Bracelet and Fax Regions, input and output files for six problems (Fax Regions only input, Robots only output), and notes to judges, teams and sites. Pages of the contests from 1996-97 to 2002 are also held: home pages up to 2001, site lists, schedules, enrolment summaries for 2000 to 2002, and a 1997 results page.
