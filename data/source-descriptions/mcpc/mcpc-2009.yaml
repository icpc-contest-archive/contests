  title: ACM Mid-Central Regional Contest Materials Page
  language:
  - en
  description: |-
    Website of the ACM Mid-Central Regional Programming Contest, a series site that holds material from several years. Our copy holds 150 files, 137 of them pages, and was started from the archive file of the 2009 contest. Besides 2009 it has final standings pages for 2006, 2008 and 2010 to 2014, a contest materials page for each year from 2004 to 2014, problem pages of several years, and 2014 standings pages from a score script: the regional standings and nine local-site standings.

    For 2009 it holds the final standings, the materials page and five problem pages (Rock, Paper, Scissors; Cell Towers; DuLL; RIPOFF; Black Vienna). The materials page lists a coaches to-do list, proposed changes for 2010, notes to teams, error messages, notes to sites and to judges, the judging utilities, and the nine problems A to I, each with input and output and the judge's Java or C++ code, four of them (A, C, D, H) with judge's notes; it says it was last modified on 16 October 2009. The archive file itself (3.3 MB, 156 files) holds a folder for each of the nine problems, judge utilities and a folder of PDFs.
