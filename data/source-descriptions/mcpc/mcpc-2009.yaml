    Baekjoon Online Judge page for the 2009 Mid-Central Regional Programming Contest, in Korean with English problem titles except one. It lists nine problems labelled A to I (Up and Down, Gnome Sequencing, DuLL, Black Vienna, Duplicate Removal, Rock, Paper, Scissors, A to Z Numerals, Cell Towers, RIPOFF), numbered 4588 to 4596 on the judge, with accepted-user count, submissions and acceptance ratio. Duplicate Removal appears under a Korean title. The page also holds the judge's navigation menus. Statements are on linked pages not in our copy.
