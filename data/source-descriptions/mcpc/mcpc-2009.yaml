  description: |-
    Final standings of the 2009 Mid-Central USA Contest: 141 teams with rank, team name, institution, number solved, time and a citation. The citation names the place for the ranked teams (First Place, Second Place and so on) and reads Honorable Mention for the 42 lowest entries, which include the seven teams at rank 135 with no problem solved. First place is Bardeen of the University of Illinois Urbana-Champaign with 7 solved. There are no per-problem results.
