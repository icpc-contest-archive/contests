  description: |-
    Regional standings of the 2009 ACM Mid-Central USA Programming Contest, a plain page with 142 team rows. Each row gives rank, team name, Solved, Total, Last and a number for each of the nine problems A to I, with 0 where the problem was not solved; the nine numbers add up to Total in every row. Two teams solved seven problems, the first being UIUC Bardeen with 647 total. Eight teams share rank 135 with no problem solved, and three of the 142 names carry a {X} prefix. Two summary rows at the foot give the number of solutions and the average score per problem. Attempts are not shown.
