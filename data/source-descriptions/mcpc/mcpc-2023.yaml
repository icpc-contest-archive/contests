  contest_date: '2024-02-24'
  description: |-
    Website of the Mid-Central USA Regional on the ICPC North America site, in English. Our copy holds 55 pages (45 web pages, nine PDFs and a robots file) among 146 saved files. The Mid-Central page for 2023-24 announces the regional for Saturday, 24 February 2024, with a link to the live Kattis standings, the schedule of the day, the Kattis addresses of the practice, regional and open contests, eligibility rules for a contest held in February, contact information for the regional contest director, answers to frequently asked questions (registration from 1 January to 10 February 2024, languages, fee) and a note that the problem set link will be posted later. The about and contact pages of the region are in the copy; the about page still says the regional takes place on March 5, 2022.

    The copy also holds the pages of the 2022-23 Mid-Central regional, including the problem set PDF of 25 February 2023, pages of other regions, season pages of ICPC North America, and PDFs: six one-page bulletins that mention the Southern California regional or the North America Qualifier and not Mid-Central, the solution outlines of the 2022 North American Qualifier (32 pages) and a problem set titled North America Qualifier (26 pages). Some style sheets and scripts were not saved.
