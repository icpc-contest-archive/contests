- url: http://csc.smsu.edu/~mcpc/old1index.html
  read: '2026-11-16'
  rubric: 1
  copy: mcpc/mcpc-1997/website/2026-10-20-wayback-d60d14d1
  title: ACM MID-CENTRAL CONTEST REGION WEB SITE
  language:
  - en
  contest_date: '1997-11-01'
  description: |-
    Website of the ACM Mid-Central Contest Region for the 1997-1998 season, sponsored by IBM, in English. The front page is a menu for the regional of Saturday, November 1, 1997, last updated that day. Our copy holds 15 pages: the region description, the contest announcement of July 28, 1997 (up to six problems in five hours), the rules, fees and schedule of the day, the satellite site list, a count of teams by site, the registration and site-host forms, a sample certificate, the list of registered teams, the list of team advisers, and the final standings. It also holds the previous season's home page for 1996-1997.

    The menu entries for the problem set, the regional officials and the notes for coordinators and judges lead to addresses that are not in our copy.
- url: http://csc.smsu.edu/~mcpc/97results.html
  read: '2026-11-16'
  rubric: 1
  copy: mcpc/mcpc-1997/scoreboard/2026-09-01-live-d2f46b8b/97results.html
  title: '*OFFICIAL* FINAL STANDINGS'
  language:
  - en
  teams: 79
  problems: 6
  times: true
  tries: false
  description: |-
    Official final standings of the Mid-Central regional: 79 ranked teams. Each row gives the place, the school (almost always with a team letter A or B), the number of problems solved, the total time in minutes, and a time in minutes for each of problems 1 to 6, with 0 where unsolved. Teams are grouped by number solved: no team solved six problems, seven teams solved five, and the first place went to the University of Missouri Rolla team A with five problems and 443 minutes. Ten teams that solved nothing share place 70. Two teams registered but did not attend because of site overload are listed at the end. The page gives no counts of attempts and no site column.
- url: http://csc.smsu.edu/~mcpc/97participants.html
  read: '2026-11-16'
  rubric: 1
  copy: mcpc/mcpc-1997/teams/20020717-wayback-eb955704/97participants.html
  title: 97 PARTICIPANTS
  language:
  - en
  contest_date: '1997-11-01'
  description: |-
    List of registered teams for the Mid-Central regional of Saturday, November 1, 1997, with a summary stating 46 schools and 81 teams, the last team having registered on October 31, 1997. Each row gives the university, its adviser, team A or B, the student names (mostly with class year), the satellite site and the fee status, which is Paid by IBM for 80 teams and IBM for one. In addition, 48 rows are placeholders reading Team Adviser and Member; 47 of them have the site XXXX and a fee date of Jan 15. Nine school entries are tagged with the East Central or North Central region. There are no results on the page.
