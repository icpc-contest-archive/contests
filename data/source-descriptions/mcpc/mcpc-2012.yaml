  title: ACM Programming Contest - Mid-Central USA Region
  language:
  - en
  contest_date: '2012-11-03'
  description: |-
    Website of the ACM ICPC Mid-Central USA Region, in English. Its home page reports the contest held on Saturday, November 3, 2012, lists the top five teams (University of Chicago Whiteboard Erasers first) and links to the official standings. A news item announces that the 2013 contest will be run by a new Regional Contest Director, and a notes item describes the rule changes for 2012.

    Our copy holds 52 pages, plus 6 other files (five zip archives and one image). The menu pages are for coaches, contestants, judges, problem authors and site directors, with contest documents, rules, schedule, site facilities, archives, contacts and FAQs; six forms for sites and judges (clarification request, judging request, accepted solution receipts, three log sheets) are PDFs. A Problem of the Week index from a university computer science department comes with seven of its problem pages.

    The archives page links a zip file for each contest from 1992 to 2012, and a standings link for each year from 1998 to 2012. Our copy holds the contest materials pages for 1998 to 2012 and zip archives for 2008 to 2012. The 2012 materials page lists problems A to H, each with input and output and the judge's code; six of the eight also link judge's notes. Three of the problem statement pages (Any Way You Slice It, The Mark of a Wizard, LRU Caching) are in our copy as pages; the other statements are only inside the 2012 zip. The standings links lead to another server.
