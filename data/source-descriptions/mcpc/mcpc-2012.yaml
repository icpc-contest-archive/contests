  description: |-
    Scoreboard of the regional contest as a plain table: 155 teams, with the institution usually abbreviated in front of the team name, then problems solved, total time, time of the last solution and a time for each of the eight problems A to H (0 where unsolved). Tries per problem are not given. First place is U Chicago Whiteboard Erasers with 8 solved and a total of 769.

    Teams are ranked 1 to 143; the 12 teams with no solved problem share rank 144, and four of them carry an {X} prefix on their name, which the page does not explain. Two rows at the foot give the number of solutions and the average score for each problem.
