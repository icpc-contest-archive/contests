  description: |-
    Website of the Mid-Central USA contest series, in English, whose seed page is the 2009 regional standings page. Our copy holds 137 pages in 149 files and covers many editions: contest materials pages for 2004 to 2014 with problem pages for some of the years, final standings reports for 2006 and 2009 to 2014, the output of a 2014 scoreboard script (a regional view and nine per-site views), and zip files of the contests of 2008 to 2012. It has no home page.

    For 2008 the copy holds the contest materials page, which lists problems A to H (Parity to Steganography) with links to input, output and judge's solution for each and to judge's notes for B to H; problem pages for five of the eight problems (Hex Tile Equations, Line & Circle Maze, Steganography, Serial Numbers and Lampyridae Teleportae); a page of Java source for Bulletin Board; notes on the problem set from the regional chief judges, last modified 22 October 2008; and a zip file of 164 entries that holds a folder for each of the eight problems. The 2008 final standings page is not in this copy of the site.
