  description: |-
    Regional standings of the 2008 ACM Mid-Central USA Programming Contest: a scoreboard of 139 teams, ranked 1 to 132 with ties, giving for each team columns headed Solved, Total and Last and a column for each of the eight problems A to H. A problem cell holds a time and 0 for an unsolved problem; attempts are not shown. The top three teams solved 6 problems, and eight teams solved none. Four teams at the bottom carry a {X} prefix on the team name, which the page does not explain. Two rows at the foot give the number of solutions and the average score for each problem.
