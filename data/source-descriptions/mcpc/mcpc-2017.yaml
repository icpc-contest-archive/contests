  description: |-
    Final standings of the 2017 Mid-Central USA Regional Contest (ICPC year 2018): 119 teams with rank, team name, institution, problems solved, total time, a medal column, a citation and a site citation column. The medal column marks four gold, four silver and four bronze teams, then Ranked for 97 teams and Honorable for 10 teams; the citation gives the place name (First Place and so on, up to Thirty-seventh Place) for 61 teams and Honorable Mention for the 58 teams ranked 62 and below. The site citation column is empty except for one entry reading None. Tied teams share a rank. There is no per-problem detail. The first place is Uni of the University of Illinois Urbana-Champaign with eight problems solved.
