  description: |-
    Final scoreboard of the Mid-Central USA Programming Contest 2017 on Kattis: 126 teams and eight problem columns labelled A, B and D to I (there is no column C). Each row gives the rank, team name, number solved, total time, and for every problem the number of tries and the minute of the accepted run, or a dash where the problem was attempted and not solved. The cells of the first team to solve each problem are marked. The page states that the contest is over and that it ran for five hours. Tied teams share a rank, and the last teams have no solved problems. A site filter offers All teams and eight sites: Southwest Baptist University, Tennessee Martin, Tennessee Technological University, University of Arkansas – Fort Smith, University of Chicago, University of Illinois at Springfield, University of Louisville and Webster University. The first place is the team Uni with eight problems solved.
