  read: '2026-11-16'
  rubric: 1
  copy: mcpc/mcpc-2019/website/2026-09-05-wayback-6c5719e4
  title: ICPC Mid-Central USA Regional Contest 2019 documentation
  language:
  - en
  description: |-
    Website of the ICPC Mid-Central USA Regional, served from a university computer science department server (cse.sdsmt.edu) and built with Sphinx, in English. Our copy holds 74 files, 28 of them pages. The site pages are the general ones of the series: about the regional, rules (with a heading for proposed rules for 2020 that holds only a placeholder sentence), FAQ, information for contestants, and a problem archive. The archive page lists the years 1992 to 2019. For each of 2015 to 2019 it gives links to a problem set, judges' data and solutions, and standings; the 2019 entry is labelled Under Construction. Those problem set and solution files are not in our copy.

    The home page as captured announces the later contest of March 6, 2021, with the Kattis address of mcpc20, Zoom and Discord links, and a table of site assignments. Nothing in our copy gives the results or problems of the 2019 contest itself. Our copy also holds 12 zip archives of earlier contests (1992 to 2011), three file-browse pages (2005, 2008, 2011) and a few 1998 and 1999 problem files. Several other saved pages belong to other parts of the same university's computer science site and have nothing to do with the contest.
