  title: 2014 ACM Mid-Central USA Programming Contest Standings
  language:
  - en
  description: |-
    Website of the ACM Mid-Central USA Region, in English. Our copy holds 138 pages, 150 files in all (five zip archives and two images among them). The home page and the general menu pages (rules, schedule, FAQs and the like) are not in our copy.

    For the 2014 contest it holds the results pages of the scoring program: the regional standings (153 teams, problems A to I, with solved, total time, last solution and a time per problem) and nine pages with the standings of the local sites, one per host university. It also holds the 2014 contest materials page (problems A to I, each with links to input and output and the judge's code; five of the nine also link judge's notes), pages for the nine problem statements, and the notes for teams, sites and judges.

    The site is a series site: it also holds standings pages for 2006 and 2008 to 2013, contest materials pages and some problem pages for 2004 to 2013, and zip archives of the contest materials for 2008 to 2012.
