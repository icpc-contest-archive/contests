  description: |-
    Scoreboard of the regional contest as a plain table: 152 teams, with the institution (often abbreviated) in front of the team name, then problems solved, total time, time of the last solution and a time for each of the nine problems A to I (0 where unsolved). Tries per problem are not given. First place is Northwestern Mildcat with 8 solved and a total of 737.

    Teams are ranked 1 to 145 (some ranks are shared); the 7 teams with no solved problem share rank 146. Two rows at the foot give the number of solutions and the average score for each problem.
