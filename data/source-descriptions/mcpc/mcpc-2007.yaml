  description: |-
    Statement of problem 3853, 'Rock Skipping': on a side-view map of a lake with obstacles, choose the throw (i,d), meaning first landing position and skip distance, that wins under the ranking rules of count, length, initial position and distance. It has a sample map with the throws compared, input and output sections and an example. A PDF of 1 page in English, with the region line 'North America - Mid Central - 2007/2008' under the title and 'Mid Central 2007-2008' at the end. A line reading 'Last modified on October 26, 2007 at 9:28 AM.' is printed before the closing line.
