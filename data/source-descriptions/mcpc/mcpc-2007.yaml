  language:
  - en
  problems: 1
  pages: 2
  description: |-
    Statement of problem 3850, 'Here We Go(relians) Again': find the fastest route from the northwest corner to the southeast corner of a rectangular grid city whose blocks have integer speed limits, one-way streets and closed streets; the output is the travel time in blips, or a statement that no route exists. It has a picture of an example city, input and output sections and an example input and output. A PDF of 2 pages in English, with the region line 'North America - Mid Central - 2007/2008' under the title and 'Mid Central 2007-2008' at the end.
