  description: |-
    Statement of problem 3852, 'Guard': place a given number of guards in a layout of corridors modelled as line segments so as to minimise the maximum risk, where an item's risk is its value times the distance to the nearest guard that can see it. It has a figure of a sample site layout, input and output sections and an example. A PDF of 2 pages in English, with the region line 'North America - Mid Central - 2007/2008' under the title and 'Mid Central 2007-2008' at the end. A line reading 'Last modified on October 28, 2007 at 8:15 AM.' is printed before the closing line.
