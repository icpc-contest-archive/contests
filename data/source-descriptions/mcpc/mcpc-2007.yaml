  title: 3849 - Persistent Bits
  language:
  - en
  problems: 1
  pages: 2
  description: |-
    Statement of problem 3849, 'Persistent Bits': for a sequence generated by (A*X + B) % C from a seed S, report for each of the 16 bit positions whether it is always 0, always 1 or varies (marked ?). It has a worked example with a table of the sequence in decimal and 16-bit binary, input and output sections and an example. A PDF of 2 pages in English, with the region line 'North America - Mid Central - 2007/2008' under the title and 'Mid Central 2007-2008' at the end. A line reading 'Last modified on October 26, 2007 at 11:38 AM.' is printed before the closing line.
