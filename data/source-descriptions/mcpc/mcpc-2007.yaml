  title: 3848 - Slink
  language:
  - en
  problems: 1
  pages: 6
  description: |-
    Statement of problem 3848, 'Slink': Slink, a Slitherlink-style puzzle in which every cell of a grid shows how many of its edges are in a single closed loop; the task is to solve each puzzle and print the solution as a drawing. Six pages with figures of an example puzzle and its solution, the heuristics for solving it, a rule specification with examples, input and output sections and examples with drawn solutions. A PDF of 6 pages in English, with the region line 'North America - Mid Central - 2007/2008' under the title and 'Mid Central 2007-2008' at the end.
