    Problem list of the 2007 Mid-Central Regional Programming Contest on the Baekjoon Online Judge: eight problems labelled A to H (Typesetting, The Seven Percent Solution, Slink, Persistent Bits, Here We Go(relians) Again, Electronic Document Security, Guard, Rock Skipping), each with its judge problem number, title, and counts of users who solved it, submissions and the percentage correct. The page is in Korean and holds no statements; each title is a link to a problem page that is not part of our copy.
