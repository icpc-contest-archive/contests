  description: |-
    Statement of problem 3847, 'The Seven Percent Solution': percent-encode each input string by replacing the seven reserved characters in a table (space, !, $, %, (, ), *) with their percent codes. It has a table of the seven characters, input and output sections and an example of six strings with its output. A PDF of 1 page in English, with the region line 'North America - Mid Central - 2007/2008' under the title and 'Mid Central 2007-2008' at the end. A line reading 'Last modified on October 24, 2007 at 3:38 PM.' is printed before the closing line.
