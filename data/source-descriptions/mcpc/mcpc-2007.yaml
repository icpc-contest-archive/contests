  description: |-
    Problem page 4605 "Typesetting" on Baekjoon Online Judge, with the statement in English inside the site's Korean interface: problem, input and output sections and one sample input with its output. Its source line files it under ICPC > Regionals > North America > Mid-Central Regional > 2007 Mid-Central Regional Programming Contest as problem A. The header gives a time limit of 1 second, a memory limit of 128 MB and the judge's counts (5 submissions, 2 users solved), and a links section points to the same problem on the ACM-ICPC Live Archive, PKU, ZJU, Sphere and HDU judges.

    The six figures of the statement and the site's style sheets are not in our copy.
