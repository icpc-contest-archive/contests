  description: |-
    Standings of the 2007 ACM Mid-Central USA Programming Contest, sponsored by IBM. 119 teams are listed with rank, team (institution followed by the team's name), citation, number solved and time. Places 1 to 80 carry a citation from First Place onward and the other teams have none; the best result is 6 problems solved, by the top three teams, and the five teams that solved none share rank 115 with an empty time. There is no per-problem detail.
