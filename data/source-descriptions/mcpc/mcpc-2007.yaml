- url: http://mcpc.cigas.net
  read: '2026-11-16'
  rubric: 1
  copy: mcpc/mcpc-2007/website/2026-09-05-wayback-8b1073f7
  title: 2007 Contest Report
  language:
  - en
  description: |-
    Website of the Mid-Central USA Region of the ACM programming contest, in English, seeded at a short 2007 Contest Report. The report states that the contest involved 119 teams from 55 schools at 9 different sites, that 8 problems were posed, that the winning team solved 6 problems and that 114 teams solved at least one; it also says the lead changed hands many times in the last 20 minutes.

    Our copy holds 150 files, 115 of them pages; it has no home page. The 2007 contest materials page, last modified 23 October 2007, lists problems A to H (Typesetting to Rock Skipping) with links to input, output and judge's solution, and the copy holds the statements, input and output files and solution source code for all eight, notes to teams, judges and sites, and a zip file of the 2007 contest with 158 entries (142 files). The site also holds material of other editions: the 2008 contest materials page and directory listings of its problem folders with a few problem files, the contest materials page of each of 2004, 2005, 2006, 2009, 2010 and 2011 with a few problem files for 2004 and 2011, and zip files of the contests from 1992 to 2011 (18 zip files, with 1996 and 1997 missing).
