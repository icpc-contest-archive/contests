    Statement of problem 3851, 'Electronic Document Security': given a log of access-control-list entries of the form entities, operator (+, minus or =) and rights, compute the current ACL of a document. It has input and output sections and an example. A PDF of 1 page in English, with the region line 'North America - Mid Central - 2007/2008' under the title and 'Mid Central 2007-2008' at the end. A line reading 'Last modified on October 20, 2007 at 5:47 PM.' is printed before the closing line.
