  description: |-
    Division 1 standings of ICPC Grand Central 2026 (Rocky/Mid-Central) on Kattis, a contest shared by the Rocky Mountain and Mid-Central regions, shown with the status "Contest is over": 75 teams with rank, team name, a state or province flag, an institution logo, problems solved (Slv.) and total time, and one column for each of the 13 problems A to M. A problem cell shows the number of tries and, for a solved problem, the minutes; an unsolved problem shows the tries and a dash. A legend marks first solves, solved, attempted and pending. The page has no "Unfinalized" or frozen notice. It ran 10:00 to 15:00 MDT on 2026-10-31.

    A Conference menu filters the board to the Rocky Mountain Region (five schools) or the Mid-Central Region (seven sites); our copy shows all teams together, and the rows carry no region label. Alberta Jade is first with 12 solved. Rank 70 is shared by two teams, and the last row, Team Quickselect, has no solves.
