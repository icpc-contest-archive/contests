  rubric: 1
  copy: mcpc/mcpc-2026/website/2026-11-13-live-6d9f1e6a
  title: ICPC North America Mid-Central Regional
  language:
  - en
  contest_date: '2026-10-31'
  description: |-
    Website of the ICPC North America Mid-Central Regional, in English. The front page announces the 2026 – 2027 Regional Programming Contest for Saturday, October 31, 2026, for teams from Missouri, Arkansas, Illinois, Kentucky and Tennessee. Its registration section says that the registration opening and deadline are to be announced and that the sites will be published when confirmed; it also gives $25 per person and has eligibility, practice contest and FAQ headings. A Scoreboard link leads to Kattis.

    Our copy holds 16 page addresses that resolve to eight distinct pages: the front page, an about page on the ICPC and the regional, an archive page, the front pages of the 2025-26, 2024-25 and 2023-24 seasons, a hall of fame page with volunteer and partner awards, and an FAQ on programming languages and mathematical knowledge. The 2023-24 page concerns a contest on February 24, 2024.

    The archive page lists the years 1992 to 2022 with links to solutions, standings and problems; 2020 and 2021 have no links, and many years lack some of the three. These links and the Kattis scoreboard link lead to other servers and are not part of our copy.
