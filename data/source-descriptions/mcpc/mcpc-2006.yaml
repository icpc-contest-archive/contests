  description: |-
    Statement of problem 3597, 'Falling Ice': disks of ice fall one at a time into a box and freeze where they land; the task is the height of the final pile, to two decimals. It includes the formula for the upper intersection point of two circles, input and output sections, illustrations and a sample of five data sets. A PDF of 2 pages in English, with the region line 'North America - Mid Central - 2006/2007' under the title and 'Mid Central 2006-2007' at the end.
