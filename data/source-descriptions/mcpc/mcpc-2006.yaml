  title: ACM Programming Contest - Mid-Central USA Region
  language:
  - en
  contest_date: '2006-11-04'
  description: |-
    Website of the Mid-Central USA Region of the ACM programming contest, run by the regional director at Rockhurst University, in English. The home page, updated on 10 November 2006, welcomes visitors to the 2006 contest, states that it was held on Saturday, November 4, and names the top three teams. Our copy holds 123 pages: pages for coaches, contestants, judges, problem authors and site directors, the rules, schedule, site facilities, FAQs and contacts, notes on error messages and judging utilities, five judging forms as PDF files, and 14 Problem of the Week pages (an index and 13 problems).

    The 2006 contest materials page lists problems A to G (Quicksum to Root of the Problem) with links to input, output and judge's solution for each; those linked files and the 2006 zip file are not in our copy. The copy also holds the contest materials and archive pages of earlier editions: 33 files under the 2004 archive, 22 for 1998 and 21 for 1999, with problem pages, input and output files and solution source code, plus one page each for 2000 to 2003 and 2005. Our copy also holds the 2006 standings index page, which links to the regional standings and nine local site standings; those pages are not in our copy.
