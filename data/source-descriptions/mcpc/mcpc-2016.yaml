  description: |-
    Pages of the Mid-Central USA regional contest website. The 2016 Contest Report page says the contest had 156 teams from 56 schools at 9 sites, 10 problems, 7 of them solved by at least one team, and that 104 teams solved at least one problem; it links to the final standings and to the problem set. Our copy holds 31 files, of which 10 are pages or documents.

    The problem set is a PDF of 20 pages with ten problems A to J, each with a statement and sample input and output. The final standings are a Kattis board saved on the host's server. A second PDF of 20 pages is the problem set of the 2017 contest, nine problems A to I. The rest of the copy is six directory listings of the report folder (two folders, four of the pages in sorted order), a style sheet, and 20 zip archives of earlier contests, named for the years 1992 to 2013 (not every year in that range).
