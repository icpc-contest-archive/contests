  teams: 142
  description: |-
    Final standings of the 2010 Mid-Central USA Regional Contest: 142 teams with rank, team name, institution, number solved, time and a citation. The citation names the place for the ranked teams, from First Place to Ninety-ninth Place, and reads Honorable Mention for the 43 lowest entries, which include the five teams at rank 138 with no problem solved. First place is Bardeen of the University of Illinois Urbana-Champaign with 9 solved. There are no per-problem results.
