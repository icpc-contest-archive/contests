  description: |-
    Baekjoon Online Judge page for the 2010 Mid-Central Regional Programming Contest, in Korean with mostly English problem titles. It lists nine problems labelled A to I, numbered 4579 to 4587 on the judge (including Judges' Time Calculation, Mad Scientist, Voting, Queen Collisions, Top This, Quick Search and Image Compression), with accepted-user count, submissions and acceptance ratio. Problems E and I appear under Korean titles. The page also holds the judge's navigation menus. Statements are on linked pages not in our copy.
