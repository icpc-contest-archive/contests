  read: '2026-11-16'
  rubric: 1
  copy: mcpc/mcpc-2010/website/2026-09-05-wayback-ce172ffd
  title: ACM Mid-Central Regional Contest Materials Page
  language:
  - en
  description: |-
    Website of the ACM Mid-Central Regional Programming Contest, a series site that holds material from several years. Our copy holds 150 files, 138 of them pages, and was started from the archive file of the 2010 contest. Besides 2010 it has final standings pages for 2006, 2008, 2009 and 2011 to 2014, a contest materials page for each year from 2004 to 2014, problem pages of several years, and 2014 standings pages from a score script: the regional standings and nine local-site standings.

    For 2010 it holds the final standings, the materials page and four problem pages (Mad Scientist, Top This, Judges' Time Calculation, Quick Search). The materials page lists notes to teams, error messages, notes to sites and to judges, the judging utilities, and the nine problems A to I, each with input and output and the judge's Java and C++ code, four of them (A, F, G, H) with judge's notes; it says it was last modified on 25 October 2010. The archive file itself (2.4 MB, 177 files) holds a folder for each of the nine problems, judge utilities and a folder of PDFs.
