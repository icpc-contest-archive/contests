    Final scoreboard of the Mid-Central USA Programming Contest 2022 on Kattis, marked as over (five hours, starting 2023-02-25 20:00 CET). It lists 100 teams with rank, team name, a state image and an institution logo (names appear as tooltips), number solved, time and, for each of the thirteen problems A to M, either the number of tries and the minute of the solve, or the number of tries and a dash for an unsolved problem that was attempted, or an empty cell. The legend marks first solves, solved, attempted and pending cells. A site filter offers All and eight host sites; our copy shows All. Unbengable is first with 11 solved and time 860. Teams with the same result share a rank, and nine teams with nothing solved share rank 92.
