    Problem set of the Mid-Central USA Regional Contest as handed out: a PDF of 28 pages with a cover page from ICPC North America Contests (marked 2022, 2023 and NAC, with the ICPC Foundation and sponsors), a page of general rules for the contest dated 25 February 2023, and thirteen problems A to M, from Blueberry Waffle to Creative Accounting. The rules page lists the supported languages (C, C++ 17, Java, Python 3 and Kotlin). Each problem has a statement in English with its time limit, input and output description, and sample input and output. No test data or solutions.
