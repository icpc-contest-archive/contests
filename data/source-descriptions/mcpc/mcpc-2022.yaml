  read: '2026-11-16'
  rubric: 1
  copy: mcpc/mcpc-2022/website/2026-09-04-wayback-ba069b85
  title: MCNA 2022-23 | ICPC NA
  language:
  - en
  contest_date: '2023-02-25'
  description: |-
    Website of ICPC North America with the page of the Mid-Central regional at its head, in English. Our copy holds 66 pages (56 web pages, nine PDFs and a robots file) among 150 saved files. The Mid-Central page for the 2022-23 season announces the regional for Saturday, 25 February 2023, with the day's schedule from registration at 11:00 Central to the closing ceremony at 7:30 Eastern, the Kattis addresses of the practice, regional and open contests, eligibility rules for a contest held in February, contact information for the regional contest director, answers to frequently asked questions, and a link to the problem set PDF. The about and contact pages of the region and a page for the 2023-24 regional of 24 February 2024 are also in the copy.

    The rest of the site is the North America organisation: season pages for 2021-22, 2022-23 and 2023-24, the qualifier, practice and sponsoring pages, and pages of other regions. Nine PDFs are in the copy besides the Mid-Central problem set: six one-page bulletins that mention the Southern California regional or the North America Qualifier and not Mid-Central, the solution outlines of the 2022 North American Qualifier (32 pages) and a problem set titled North America Qualifier (26 pages). A post of 25 February 2023 links the Mid-Central problem set. Some style sheets and scripts were not saved.
