  description: |-
    Website of the ACM programming contest of the Mid-Central USA Region, in English, as it stood before the 2015 contest. Our copy holds 17 pages, most of them taken in late October 2015, and three zip archives. The front page, updated 17 October 2015, announces that registration for the 2015 Mid-Central USA Programming Contest is open until October 24th, 2015, and that a new contest management system, Kattis, is used this year.

    The pages give information for coaches, contestants and site directors, the Notes to Teams (scoring, tie-breaking, disqualification), the rules, the schedule of the contest day (contest from 12:30 to 5:30 pm Central Time), site requirements, contacts and FAQs. The Site Facilities page lists eight confirmed 2015 sites with their capacities. No results or problems of the 2015 contest are in our copy.

    An Archives page links the materials, standings and scoreboards of earlier contests. Our copy holds the contest materials pages and zip archives of 2012, 2013 and 2014, and the scoreboards of 2013 (problems A to H) and 2014 (problems A to I).
