    Final scoreboard of the 2015 Mid-Central USA Regional Contest on Kattis: 155 teams, nine problems labelled A to I. Each row gives the team name with an institution logo, the number solved, the total time, and for every problem the number of tries and the minute of the accepted run, or a dash for a problem attempted but not solved. The page states that the contest is over and that it ran for five hours. Ranks are shared between tied teams, and the last teams have no solved problems. A site filter offers All teams and eight sites: ATU, Chicago, Louisville, Rhodes, TTU, UCM, UIS and Webster. The first place is Poor Man's Shield with eight problems solved.
