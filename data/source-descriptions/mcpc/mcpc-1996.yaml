  description: |-
    Home page of the ACM Mid-Central Contest Region, in English, carrying the 1996-1997 notice. It describes the region (Missouri, Arkansas, Kentucky, Tennessee and Illinois), lists the regional officials, and gives the satellite sites for the contest of November 2, 1996 with each site's capacity and fee. It then lists the registered teams by school, with the site each is assigned to, fee status and the team members' class years; the page states 46 schools and 79 teams as of November 1, 1996. It also names the region's three top teams, which go to the finals. The page was last updated on November 19, 1996.

    The menu links to announcement, rules, schedule, registration, results and other pages, but those addresses are not in our copy: it holds this one page only, without its images.
