- url: http://mcicpc.cs.atu.edu/
  read: '2026-11-23'
  rubric: 1
  copy: mcpc/mcpc-2013/website/2026-11-22-wayback-e01d9ad4
  title: ACM Programming Contest - Mid-Central USA Region
  language:
  - en
  description: |-
    Website of the ACM programming contest of the Mid-Central USA Region, in English. Our copy holds 21 pages, one of them a PDF clarification request form, taken at dates from April 2013 to September 2015, most of them in November 2013. The front page, updated 16 January 2013, still reports the 2012 contest, held on Saturday, November 3, 2012, with its top five teams, and announces that the 2013 contest will be run by a new Regional Contest Director at Arkansas Tech University. Most other pages were updated between September and November 2013.

    They give information for coaches, contestants, judges, problem authors and site directors, the rules, the schedule of the contest day (contest from 12:30 to 5:30 pm Central Time), contacts and FAQs. The Site Facilities page lists the eight 2013 sites with their capacity, systems and meals, and the Notes to Teams, Error Messages and Notes to Judges pages carry modification dates of October 2013. No results or problems of the 2013 contest are in our copy.

    An Archives page links zip files of the contests from 1992 to 2012 and standings of those from 1998 to 2012; the zip files are not in our copy. The 2012 contest materials page is also in our copy, listing problems A to H with links to their input and output files and the judges' code.
