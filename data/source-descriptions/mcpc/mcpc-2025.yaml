  description: |-
    Standings page of the 2025 Mid-Central USA Programming Contest on Kattis, with a banner reading "Unfinalized results! These are not the finalized results, the scoreboard will be updated." It lists 84 teams with rank, team name, a state flag, an institution logo, problems solved (Slv.) and total time, and one column for each of the 13 problems A to M. A problem cell shows the number of tries and, for a solved problem, the minutes; an unsolved problem shows the tries and a dash. A legend marks first solves, solved, attempted and pending, and a site menu lists seven host sites as filters; our copy shows all sites together. The contest ran 12:00 to 17:00 CST on 2025-11-08.

    Ten teams share the last rank, 75, with no solved problems. The team in first place is pocpocpoc with 12 solved. Some results differ from the final standings of the other source: this board has Limit Testing with 10 solved and a time of 883 (11 solved and 1227 there), and WUSTL 3 is on it.
