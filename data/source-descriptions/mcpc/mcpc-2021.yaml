  copy: mcpc/mcpc-2021/website/2026-09-04-wayback-ba069b85
  title: Main 2021-22 | ICPC NA
  language:
  - en
  description: |-
    Website of ICPC North America, the organiser of the North American regional contests, in English. Our copy holds 64 pages (62 web pages, one PDF and a robots file) among 150 saved files. The main page of the 2021-22 season announces the regionals for spring 2022, the practice contests of 29 January to 20 February 2022, the North America Qualifier of 22 January 2022 and the North America Championship of 26 to 31 May 2022, gives season totals (1,189 teams, 399 universities) and lists the eleven regions. Season pages for 2021-22, 2022-23 and 2023-24 are in the copy, with qualifier, practice and sponsoring pages and pages of other regions.

    The Mid-Central pages in the copy are of later seasons: two information pages, for the regionals of 25 February 2023 and 24 February 2024, and about, contact and contest FAQ pages, and a post of 25 February 2023 linking the 28-page official problem set PDF of the 2023 contest. The about page of the Mid-Central region states that, due to Covid, the regional takes place on March 5, 2022, and that it draws more than 100 teams from universities in Arkansas, Illinois, Kentucky, Missouri and Tennessee; no page gives results or problems of that contest. Some style sheets and scripts were not saved.
