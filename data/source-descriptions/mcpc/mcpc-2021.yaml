  description: |-
    Final scoreboard of the Mid-Central USA Programming Contest 2021 on Kattis, marked as over (start 2022-03-05 13:00 CST, end 18:00 CST, five hours). It lists 79 teams with rank, team name, an institution logo, number solved, total time and, for each of the eleven problems A to K, either the number of tries and the minute of the solve, or the number of tries and a dash for an unsolved problem that was attempted, or an empty cell. The legend marks first solves, solved, attempted and pending cells. Ranks run to 74 with ties at the bottom: six teams with no solved problem share rank 74. UIUC A is first with 10 solved and time 1150.

    The page links to the problems, teams and rules pages of the contest. Institution names appear only as logo tooltips.
