  description: |-
    ICPC Live Archive category page for Regionals 1993, North America - Mid-Central USA: six problems numbered 5296 to 5301 with their titles (The Programmer's Hex, Dart-a-Mania, Lost in Space, Gleaming the Cubes, A Logical Problem, Soundex Indexing). For each it gives total submissions and solving percentage and total users and solving percentage on the archive. The titles link to problem pages of the archive that are not part of our copy, so no statements are included. The page also carries the archive's menu and login form.
