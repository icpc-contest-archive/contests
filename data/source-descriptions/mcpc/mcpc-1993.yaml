  description: |-
    File index of the 1993 Mid Central Regionals problem archive, titled B_US_MidCen 1993. It lists 36 files for six problems named by file stem: cubes, darts, hexagons, logic, soundex and space. Each problem has an HTML statement and a Pascal solution; cubes, darts, hexagons, logic and soundex have one input file and one output file each, while space has four numbered input and output pairs, a C solution and a run file. Four problems (cubes, darts, hexagons, space) also have a .sav file. The page notes a last update in October 1999.

    Our copy holds only the index page; the linked files are not part of it.
