    Standings page headed 'The 2004 ACM Mid-Central USA Programming Contest sponsored by IBM', in English: 111 teams with rank, institution and team name, citation, number solved (at most 5) and time. Illinois Institute of Technology (IIT-Chicago A) is first with 5 solved and a time of 240, followed by the University of Illinois and The University of Chicago. Places 1 to 80 carry a citation such as First Place; three teams share rank 109, two of them marked no-show. There is no per-problem detail.
