    Category page of the Baekjoon Online Judge, with Korean menus, listing the problems of the 2004 Mid-Central Regional Programming Contest. A table gives seven problems, labelled A to G: problem A is number 2363 on the judge with a Korean title, and B to G are numbered 4630 to 4635 with English titles (Triangle Cuts, Symmetric Order, Flow Layout, Permutation Code, Ink Blots, Speed Limit). It also shows solvers, submissions and acceptance rate per problem. Each title links to a problem page of the judge; the statements are not on this page.
