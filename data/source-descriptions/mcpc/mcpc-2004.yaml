  contest_date: '2004-11-06'
  description: |-
    Website of the Mid-Central USA Region of the ACM programming contest, in English, as it stood after the 2004 contest. Our copy holds 150 files: 127 html pages, 22 text files and one image. The 2004 home page, updated November 16, 2004, says the contest was held on November 6 and that the Illinois Institute of Technology's A team won. Around it are the rules, the schedule (contest 12:30pm to 5:30pm CST), site facilities for 2004, documents, information for coaches, contestants, judges and site directors, contacts, FAQs, archives and the changes planned for 2005.

    The 2004 standings are in our copy: an index page, a regional standings table of 111 teams with columns Solved, Total, Last and a time for each of problems A to G, followed by rows for the number of solutions and the average score per problem, and ten tables for local sites. An index of the 2003 standings is also held.

    The 2004 contest materials page lists problems A to G. Our copy holds all seven statements with input and output files and the judge's solution, judge's notes for Triangle Cuts and Ink Blots, and notes to judges, teams and sites. Pages of the contests from 1996-97 to 2002 are held too, and one 2002 problem statement.
