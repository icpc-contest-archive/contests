  description: |-
    Final standings of SWERC 2018: 89 teams, each with rank, team name, institution, number of problems solved, total time, medal and citation. The medal column gives 2 gold, 4 silver and 8 bronze medals, and the remaining 75 teams are marked Ranked. The citation column names the place (First Place to Thirty-ninth Place) for 39 teams and Honorable Mention for the other 50; the last three teams, with no problem solved, share rank 87. A separate column marks the SWERC Champion. The teams come from 49 institutions. ENS Ulm 1 is first with 10 solved. There is no per-problem detail.
