  description: |-
    Problem set of the contest as a PDF of 24 pages, in English. The cover names the contest and gives Paris, 2 December 2018, with a list of the judges and problem setters and their affiliations, a statement that the set has 11 problems on 24 pages, and a Creative Commons Attribution-ShareAlike 4.0 licence notice. Page 2 is blank. Problems A to K, City of Lights to Dishonest Driver, follow, each with its time limit, statement, input and output format and limits, and one or more samples; some samples carry an explanation. It holds no test data.
- url: https://swerc.eu/2018/theme/slides/problemanalysis.pdf
  read: '2026-11-16'
  rubric: 1
  copy: swerc/swerc-2018/editorial/20261114-live-a04393d9/problemanalysis.pdf
  title: Problem Analysis Session
  language:
  - en
  problems: 11
  pages: 39
  description: |-
    Slides of the problem analysis session given by the SWERC judges, dated 2 December 2018, in English: a PDF of 39 pages that are 29 numbered slides, some built up over several pages. After a statistics slide (about 2500 submissions, 28 clarification requests, submissions by language) the slides go through problems A to K, one section each, in the order A, K, E, B, D, F, I, H, J, G, C. Each section opens with the number of teams that solved the problem before the freeze and, for every problem solved, the first team to solve it and the minute; problem C is marked as not solved before the freeze. The sections then give the problem in brief and the intended solution, for several with its complexity, and for some a source reference.
