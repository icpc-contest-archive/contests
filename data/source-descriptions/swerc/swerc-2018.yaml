- url: https://swerc.eu/2018/
  read: '2026-11-16'
  rubric: 1
  copy: swerc/swerc-2018/website/2026-09-05-live-c7f5a5e2
  title: SWERC 2018
  language:
  - en
  problems: 11
  description: |-
    Website of the 2018 Southwestern Europe Regional Contest (SWERC), held at Télécom ParisTech in Paris on 1-2 December 2018 and co-organised by Télécom ParisTech and École normale supérieure, in English. Our copy holds 73 pages. The home page reports 89 teams of three students, around 360 people, champion ENS Ulm 1, and a contest format of five hours. Further pages cover the contest, regulations, the schedule from Friday registration to the Sunday awards ceremony, venue and travel, the contest computer environment, organisers, media (photos and videos), and a table of past SWERC editions since 1995.

    The teams page lists 89 teams from 49 institutions with their members, and each of the 49 institutions has its own page of historical results. The problems page links the full problem set (a PDF of 24 pages with 11 problems), the test cases (a zip archive), the problem analysis slides, and a practice contest with its problem set and judge solutions; these files are in our copy. The results page links two DOMjudge scoreboards, the official one and one for a publicly accessible contest with the same problems; their front pages are in our copy. The videos, the test cases of the practice contest and most team pages of the scoreboards are not part of our copy.
- url: https://swerc.eu/2018/theme/scoreboard/public/
  read: '2026-11-16'
  rubric: 1
  copy: swerc/swerc-2018/scoreboard/20260901-live-edc89f2e/page.html
  title: Scoreboard ICPC SouthWestern Europe Regional Contest 2018
  language:
  - en
  teams: 89
  problems: 11
  times: true
  tries: true
  description: |-
    Final scoreboard produced by DOMjudge, as its footer states: 89 team rows with rank (87 teams ranked; the last two, with no problem solved, have none), country flag, team name and institution, a score column of problems solved and penalty time, and one column for each of the eleven problems A to K. A solved cell shows attempts and the minute of the accepted submission (for example 1/33); a cell of an unsolved problem shows the number of failed attempts, or 0 if untried. Gold, silver and bronze medal marks appear beside the top 14 teams (2, 4 and 8), and ten cells of first solutions are coloured; problem C was solved by no team. A summary row gives 89 teams, 49 affiliations, 283 problems solved in total and submitted/correct counts per problem. Problem headings link to problem PDFs and team names to team pages. First place is ENS Ulm 1 with 10 problems solved. The page states its last update as Sunday 2 December 2018, 18:33 CET.
