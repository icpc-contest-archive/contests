    Final scoreboard produced by DOMjudge, headed ICPC Southwestern Europe Regional Contest (SWERC) 2024 final standings: 141 teams and 13 problems labelled A to M. Each row gives rank, country flag, team name with its institution, number solved and total time, and for each problem the time in minutes with the number of tries when solved, or the number of tries when not. Cells are coloured for first solve, solved, tried-incorrect, tried-pending and untried. A summary row gives for each problem the numbers of accepted, rejected and pending submissions and the time of the first solve. The rank cells of 14 teams are marked as medals: 2 gold, 4 silver and 8 bronze. A pop-up for each team gives its category, affiliation, country and location. The footer reads Last Update: Thu 23 Oct 2025 17:17:14 UTC using DOMjudge. Xeppelin of Ecole Polytechnique is first with 10 problems solved.
