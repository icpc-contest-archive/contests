- url: https://swerc.eu/2024/
  read: '2026-11-16'
  rubric: 1
  copy: swerc/swerc-2024/website/2026-09-05-live-7cece24b
  title: Home - SWERC 2024
  language:
  - en
  description: |-
    Website of the Southwestern Europe Regional Contest (SWERC) 2024, in English; the site states that it is hosted by LIP6. The home page describes SWERC as a 5-hour contest for teams of three students from France, Israel, Italy, Portugal, Spain, Switzerland and a few small states, and as the regional selection phase for the Europe Championship. Other pages give the regulations, registration rules and deadlines, the contest description, the team environment (software and compilation flags), the organizers and judges, and a schedule page for each of the three sites: Lisbon, Lyon and Pisa. Each schedule lists the contest on Sunday 1 December and a practice session on the Saturday before.

    The site also holds a teams page (141 teams from 65 institutions, each institution with a Historical standings link), 41 institution pages (so not every institution's page is in our copy), the final DOMjudge scoreboard, a past editions page listing SWERC back to 1995, and four PDFs: the problem set and the judges' analysis slides for the main contest and for the practice contest. Our copy holds 60 pages.

    The contents page also links the broadcast, the photos, the test cases and the mirror contest on Codeforces; the test cases and photos are on another server and not in our copy.
