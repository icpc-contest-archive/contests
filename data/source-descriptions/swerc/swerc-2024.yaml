  description: |-
    Problem set of the main contest, a PDF of 33 pages in English. The cover names the contest, the three sites Lisbon, Lyon and Pisa, and the date 1 December 2024, lists eight judges and problem setters with their affiliations, and states a Creative Commons Attribution-ShareAlike 4.0 licence. It holds 13 problems labelled A to M, from A: Titanomachy to M: Ook? Ook! Each problem has a statement with a time limit (from 0.5 to 6 seconds) and an input and output description. Problems A to K and M have sample input and output, six of them (C, D, E, F, I, K) with sample explanations; problem L is interactive and has a sample interaction instead. No test data or solutions are in the document.
