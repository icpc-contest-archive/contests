    Category page of the ICPC Live Archive, as it stood on 24 September 2021, for the 1993 Southwestern Europe regional. It lists seven problems numbered 5586 to 5592: Chess, Spin, Vertex, Rubik's Cube, Rename, Compress and Logic. For each it gives the total submissions and solving percentage, and the number of users and their solving percentage.

