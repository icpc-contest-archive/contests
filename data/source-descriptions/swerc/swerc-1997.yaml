  description: |-
    Index page of the 1997 problem material, headed 'Western and Southwestern European Regionals 1997'. It links five documents, each in a plain and a compressed (.Z) form: the problem set PrSet97, the file Pract97, and three tar archives named all_input, all_output and all_solutions. Below them are 42 individual files: 14 input files (.in), 14 solution files (.sol) and 14 C sources (.c), named after problems such as bricks, complex, island, mbone, ontherun, pushing, treasure, triangle and video, plus carbon, definite, geometry, ibm and url, which have no C source. Island, pushing, triangle and video have more than one C source.

    The page ends with a link for comments and the line 'Last update: Wed Dec 3 17:33:34 MET 1997'. Our copy is this index page only; none of the linked files is in it.
