  description: |-
    Final standings of the 1997 Southwestern European Regional Programming Contest as a plain HTML table: 36 teams ranked 1 to 36, with the team name (a university, usually followed by a number), one column for each of the nine problems A to I, the number solved and the total time. A solved problem shows a time in hours, minutes and seconds followed by a number in brackets; an unsolved problem with a number shows dashes in place of the time and the number in brackets. Total time is the sum of the times of the solved problems, and teams are ordered by number solved, then by total time. Charles University Prague 2 is first with eight problems and a total time of 23:09:04.

    The page gives no date, venue or medals and has no links.
