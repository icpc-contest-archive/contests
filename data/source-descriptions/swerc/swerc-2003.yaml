  title: SWERC'2003 official website
  language:
  - en
  description: |-
    Website of the Southwestern Europe Regional Contest at the Ecole Polytechnique in Palaiseau, near Paris, in English. Our copy holds 13 saved pages, the home page being saved under two addresses. Only two are of the 2003 edition: the home page, which names the contest dates as 14th to 16th November 2003, lists the countries and regions the contest draws from, announces Albert Einstein University of Ulm (Ulm 1) as winner and Universitat Politecnica de Catalunya (UPC 1) in second place, and links the final standings; and that standings page, a scoreboard of 52 teams.

    The other pages are headed SWERC'2004: a home page announcing the contest for 20th to 21st November 2004 at the Ecole Polytechnique, a general information page, two regulation pages, a schedule, a hotel reservation page, links, a contact page, the menu header and a French frame page. The hotel, schedule and regulation pages say that no information is available yet for 2004 and give last year's content; the schedule gives the previous year's programme, with practice session on Saturday 15th and contest on Sunday 16th November. The style sheet is in our copy.
