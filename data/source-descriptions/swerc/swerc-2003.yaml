    Single-problem statement PDF of 2 pages, headed "2945 - Help R2-D2!" and the region line "Europe - Southwestern - 2003/2004", in English. The statement describes loading containers one at a time into the starship of minimal index that can hold them, and asks for the number of starships used and the total waste, printed as two numbers, with the first two sample cases explained. It has input and output sections and ends with a sample input and sample output.
