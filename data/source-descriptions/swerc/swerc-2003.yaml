    Single-problem statement PDF of 2 pages, headed "2942 - Rent your airplane and make money" and the region line "Europe - Southwestern - 2003/2004", in English. The statement describes renting orders for a single airplane, each with a start time, a duration and a price, and asks for the maximum total price obtainable by accepting non-overlapping orders; it works through a four-order example and the sample prints 18. It has input and output sections and ends with a sample input and sample output.
