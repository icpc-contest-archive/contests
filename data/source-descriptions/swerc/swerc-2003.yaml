  description: |-
    Single-problem statement PDF of 2 pages, headed "2939 - Men at work" and the region line "Europe - Southwestern - 2003/2004", in English. The statement asks for the minimal time to drive from home to work across an N by N grid of roads in which each cell alternates between blocked and open periods of a given length (digits 0 to 9); the output is the time or NO. The sample has two cases. It has input and output sections and ends with a sample input and sample output.
