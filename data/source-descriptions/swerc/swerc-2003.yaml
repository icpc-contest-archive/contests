  description: |-
    Single-problem statement PDF of 1 page, headed "2946 - Phony primes" and the region line "Europe - Southwestern - 2003/2004", in English. The statement defines phony primes (odd numbers with at least three distinct prime factors p such that p-1 divides N-1, like 561) and asks for all of them in a given interval [Nmin, Nmax], or the word none. It has input and output sections and ends with a sample input and sample output.
