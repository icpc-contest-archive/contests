  description: |-
    Final scoreboard of 52 teams against nine problems labelled A to I. Each row gives the rank, a country flag, the team (institution abbreviation and team name), one cell per problem, the number solved and the total time. A solved cell shows the time of the accepted run with a number in brackets; an unsolved cell shows dashes with a number in brackets; the cell is empty when the team made no attempt, which is the case for every team in column C. AEUU Ulm 1 is first with 7 problems solved in 17:36:33, followed by UPC UPC 1 with 5 and SFITZV Chäschüechlichaiba with 4. 37 teams solved at least one problem and 15 solved none. The page says Page 1 of 1 and carries no marks for unofficial teams. Flag images and style sheets are in our copy.
