  pages: 2
  description: |-
    Single-problem statement PDF of 2 pages, headed "2940 - Square dance" and the region line "Europe - Southwestern - 2003/2004", in English. The statement concerns relations given as pairs of distinct primes arriving one at a time, kept in a collection with no square subproduct, and asks for the number of squares that can be formed; the output line gives the test case number and the count. It has input and output sections and ends with a sample input and sample output.
