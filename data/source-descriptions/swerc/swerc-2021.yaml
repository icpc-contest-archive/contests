  description: |-
    Website of SWERC 2021-2022, in English, with a menu of About, The contest, Regulations, Problems, Results, Teams, Environment, Schedule, Venue, Organizers and Past editions, and the contact address of the organizing team at Politecnico di Milano. Our copy holds 50 pages and documents. The About page announces an onsite contest open to teams from France, Israel, Italy, Portugal, Spain and Switzerland, and the Schedule page puts registration on Friday 22 April, the opening and practice session on Saturday 23 April, and the five-hour contest on Sunday 24 April at the Bovisa Campus of Politecnico di Milano, followed by the problem analysis and closing ceremony.

    The site holds the regulations, a Teams page of 97 teams from 49 institutions, and 21 pages about single institutions. A Results page points to the final scoreboard, which is part of our copy. The Problems page links the problem set as one PDF and as twelve single statements A to L, with the solutions PDF; nine of the twelve zip archives of test data are in our copy. A Past editions page lists earlier SWERC editions from 1995 to 2020-2021 with links to their sites; those are not part of our copy.
