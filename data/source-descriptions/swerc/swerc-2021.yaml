    Problems page of the contest website, in English: twelve problems labelled A to L (Organizing SWERC, Drone Photo, Il Derby della Madonnina, Ice Cream Shop, Evolution of Weasels, Wine Tasting, Round Table, Pandemic Restrictions, Antennas, Boundary, Gastronomic Event, Circular Maze). Each has a link to its statement PDF and to a zip archive of test input and output files with some judge solutions. Further links give the full problem set PDF and the analysis PDF. A Training section points to Codeforces, where the problems can be submitted, and to a mirror contest on Codeforces that has three additional, harder problems.

