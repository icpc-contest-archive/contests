  description: |-
    Final scoreboard of the contest, as a DOMjudge page headed "SWERC 2021 final standings": 97 teams, each with rank, team name and institution, score (problems solved and total time) and one cell for each of the twelve problems A to L. A solved cell gives the time of the accepted run and the number of tries; an unsolved cell with attempts shows only the tries. The first solution of each problem is marked (12 marks), and the rank cells of the 2 gold, 4 silver and 8 bronze medal teams are coloured. A summary row gives totals for each problem. Raw Pots of Harbour.Space University is first with 10 problems.

    Links to the pages of single teams lead to files that are not part of our copy.
