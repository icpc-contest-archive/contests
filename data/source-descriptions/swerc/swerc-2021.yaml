  description: |-
    Final standings of the 2021 ICPC Southwestern Europe Regional Contest: 97 teams with rank, team, institution, problems solved, time, medal and citation. Two teams hold gold medals, four silver and eight bronze; 34 more are marked Ranked and the last 49 Honorable Mention. First place is Raw Pots of Harbour.Space University - Barcelona Campus with 10 problems solved and time 1303; the lowest-ranked teams solved one problem. The citation column gives the place name (First Place, Second Place and so on) for the first 48 teams and Honorable Mention for the rest. No per-problem results or attempt counts.
