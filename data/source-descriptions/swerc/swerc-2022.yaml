  - en
  problems: 12
  description: |-
    Problems page of the contest website: twelve problems A to L (Walking Boy, Uniform Chemistry, Another Wine Tasting Event, Crossing the Railways, Spinach Pizza, Beppa and SwerChat, Parmigiana With Seafood, Controllers, Library game, Italian Data Centers, Train Splitting, Vittorio Plays with LEGO Bricks). Each has a link to its statement PDF and to a zip archive of test input and output files with some of the judges' solutions. Two further links lead to the full problem set and to a PDF explaining the solutions.

    A Training section says the problems can be submitted on Codeforces against the official test data, in a different order, and that a mirror contest there can be taken as a virtual participation. The linked statements and archives are held in our copy of the website; this page itself is only the list.
- url: https://codeforces.com/contest/1776
  read: '2026-11-16'
  rubric: 1
  copy: swerc/swerc-2022/judge-codeforces/20261113-live-f1f0c2b9/page.html
  title: Dashboard - SWERC 2022-2023 - Online Mirror (Unrated, ICPC Rules, Teams Preferred) - Codeforces
  language:
  - en
  problems: 14
  description: |-
    Contest page of the online mirror of the regional contest on Codeforces, marked Finished. It lists 14 problems A to N with time and memory limits and a count printed beside each (x2468 for A). Twelve are the problems of the regional contest, in a different order (A is Walking Boy, B is Vittorio Plays with LEGO Bricks); problems D (Teamwork) and N (Count Permutations) are not among the twelve of the official problem list.

    Links under contest materials lead to the announcement, the statements and an editorial PDF. The page also shows an announcement posted on 2023-02-19 saying that the sample explanations of problem N are wrong and how to correct them. Our copy is this page only.
