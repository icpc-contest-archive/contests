  problems: 12
  times: true
  tries: true
  description: |-
    Final scoreboard produced by DOMjudge, headed "SWERC 2022 final standings": 120 ranked teams and one guest team, Jane Street, listed after them in a separate block and marked Guest. Each row gives rank, team name with institution, number of problems solved, total penalty time, and a cell for each of the twelve problems A to L with the minute of the accepted submission and the number of tries, or the number of failed tries alone. ENS Ulm 1 is first with 11 solved.

    Summary rows give, per problem, counts of correct, incorrect and pending submissions and the fastest solve time. A colour key explains solved first, solved, tried incorrect, tried pending and untried. The page also holds a pop-up panel with a team's category, affiliation, country and room.
