- url: https://swerc.eu/2022/
  read: '2026-11-16'
  rubric: 1
  copy: swerc/swerc-2022/website/2026-09-05-live-9ae3946f
  title: SWERC 2022-2023
  language:
  - en
  problems: 12
  description: |-
    Website of the Southwestern Europe Regional Contest 2022-2023, in English. The organisers' pages cover the announcement, the contest format (five hours, teams of three), regulations, registration, environment, venue, a schedule of the three days from Friday 17 to Sunday 19 February with the contest on the Sunday, the organising committee, and the list of past editions from 1995 to 2021-2022 with links. The Organizers page names the Politecnico di Milano as host; the footer says the site is hosted by Télécom Paris.

    The Problems page lists problems A to L with a statement PDF and a zip archive of test data and judges' solutions for each, the full problem set, a PDF of solutions, and a note on training on Codeforces. The Results page points to the final DOMjudge scoreboard, which is in our copy. The Teams page lists 120 teams from 53 institutions, each with its members and coach.

    Our copy holds 38 pages: 24 HTML pages and 14 PDFs (the twelve statements, the full problem set and the solutions), together with 12 zip archives. Ten institution pages linked from the team list are included; other institution pages and some logo images are not.
