    Contest page on QOJ.ac, filed under ICPC / Regionals / Europe / Southwestern Europe: the twelve problems A to L in the official order, from Walking Boy to Vittorio Plays with LEGO Bricks. The page shows an empty notice list and no questions, an ICPC ruleset with a 20-minute penalty, and links to attachments labelled Statements (en) and Tutorial (en). Menu links lead to the contest's submissions, standings and external standings.

    Our copy is the dashboard only; the attachments and standings are not in it.
