  description: |-
    Short page headed Western and Southwestern European Regional Contest 1994 that offers the problem set as a PostScript file (160 kByte) and as a gzip-compressed copy of it (49 kByte). It states no contest date and no host.

    Our copy holds only this page. The two files it links to are not in it, so the problems themselves cannot be read from our copy.
