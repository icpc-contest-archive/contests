  title: 1994 East-Central Regionals of the ACM International Collegiate Programming Contest
  language:
  - en
  description: |-
    Pages of the ACM Programming Contest European Division website at ETH Zurich, mostly in English. Our copy holds 135 pages and 15 images. It has the division's home page and European Division page, regional contest information pages (general information, frequently asked questions, accommodation, application form, contest environment) for a regional contest in Zurich, a call for problems for the 2001 finals, pages from the 2000 world finals, and 78 photo pages from the 2001 world finals in Vancouver. It also has the 1993 and 1994 East-Central Regionals problem set pages; the 1994 one, held at the University of Waterloo on 11-12 November 1994, has eight problems A to H (Lining Up to Cabinets), each with statement, input, output and sample.

    Four accounts from participants are included: an English report by a member of the Freiburg team, which the page says won the Southwestern European Regionals and the finals in 1994; a German report on the autumn 1994 regional contest at ETH Zurich by members of the ETH team; a German report on the 1993 regional in Swansea; and feedback from the coach of the Modena team. No problem set, ranklist or results page of the 1994 Western and Southwestern European contest is in our copy.
