  title: ICPC Live Archive
  language:
  - en
  problems: 8
  description: |-
    Category page of the ICPC Live Archive named Regionals 1994 :: Europe - Southwestern, listing eight problems numbered 5593 to 5600: Presentation Error, Bits, Divisors, Fatman, Safebreaker, Quadtrees, Race Tracks and Train Swapping. For each it shows the total number of submissions and the percentage solving, and the total number of users and the percentage solving, as they stood on the day the page was saved.

    The page carries the archive's menu and login form around the list. It holds titles and statistics only; the statements are on separate pages that are not part of our copy.
