  description: |-
    Final scoreboard of SWERC 2011 showing 36 teams against ten problems labelled A to J. Each row gives the team name, the number of problems solved with total time (the winner, UPC-1, has 8 and 1129), and for every problem the number of tries, with the solve time plus penalty in brackets when solved (for example 6 (213 + 100)). A summary row at the foot gives the total of 124 solved problems and three figures per problem.

    A filter form at the top lists the institutions and the countries CH, ES, FR, IL and PT, and the categories Participants and Observers. Ranks run from 1 to 34; the last two teams, with no problems solved, carry no rank number. The affiliation column holds only small institution logos and country flags, which are in our copy, and no text. The filter entry for Universitat Politècnica de València shows garbled accented letters.
