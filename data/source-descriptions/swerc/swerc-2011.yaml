  description: |-
    Final standings of the 2011 Southwestern Europe Regional Contest: 36 teams with rank, team, institution, problems solved, total time, medal and citation. UPC-1 of Universitat Politècnica de Catalunya is first with 8 problems and a time of 1129, ahead of ENS Lyon 1 with 8 and 1289.

    The first four teams have gold, the next four silver and the next four bronze, and each carries a citation such as First Place. The 24 teams from rank 13 down have no medal and the citation Honorable Mention; the last three of them, with no problems solved, share rank 34. There is no per-problem detail.
