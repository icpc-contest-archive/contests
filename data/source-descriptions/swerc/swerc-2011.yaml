    Contest dashboard on QOJ.ac headed "The 2011 ICPC Southwestern Europe Regional Contest (SWERC 2011)", filed under ICPC, Regionals, Europe, Southwestern Europe. A note says the statements, official test data and jury solutions were recovered from the official contest package preserved by the ICPC archive. It lists ten problems, A Alphabet Soup to J Remoteland, each linked to its problem page. A side panel gives the settings (ICPC ruleset, a penalty of 20 minutes, a limit of 1000 submissions per problem, a scoreboard frozen after 4:00:00) and marks the contest as ended; the notice and question tables are empty. Under Attachments the page links to "Statements (en)" and "Tutorials (en)", files not part of our copy.
