    Codeforces gym page for the 2011-2012 ACM-ICPC Southwestern European Regional Programming Contest (SWERC 2011), marked Finished. Under contest materials it links an English statements file, and a table lists ten problems A Alphabet Soup to J Remoteland with input and output mode, time limit (1 to 30 seconds) and memory limit (256 MB), each with a count of solvers. One announcement is shown: the definition of a set in problem E should read at least six games.

