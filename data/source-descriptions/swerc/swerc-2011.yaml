  description: |-
    Problem Set page of the SWERC 2011 website, hosted by Universidad Complutense Madrid, headed Southwestern Europe Regional Contest, November 19-20, 2011. The page carries the site menu (Home, Teams, Contest, Regulation, Schedule, Registration, Results, Problem Set, Photos, Location, Organization), a list of the earlier SWERC sites from 1997 to 2010, and a contact line. Its body is three links: a PDF with the problem statements, a PDF with the solution outlines, and the problem test cases with examples of solutions (67 Mb).

    The page only links to those files; it does not list the problems itself. The menu column ends with Updated 2011/05/23. Our copy is this one page with its style sheet and the two logos; the header picture of Madrid is not in it, and neither are the other site pages.
