  title: SWERC'2002 Official Site - Home
  language:
  - en
  contest_date: '2002-11-17'
  problems: 9
  description: |-
    Official website of the 2002 Southwestern Europe Regional Contest, in English, under the patronage of the Faculties of Science and of Engineering at the University of Porto. Our copy holds 80 pages plus images, style sheets and downloads. The home page announces the winners and links the standings, the problem set and the multimedia pages. The information page gives the event outline, a summary of the rules and the contest regions. The contest page gives a tentative schedule (registration on 15 November; talks, practice session and social events on 16 November; contest on 17 November) and describes the Mooshak judging system. Other pages: links, a magazine discount offer, and hotel reservation pages with a table by institution.

    The Data pages give a participation summary (54 teams, 6 countries, 29 schools), the final standings, the nine contest problems A to I and three practice problems A to C as web pages, the problem set and practice set PDFs, PostScript of the practice set only, and archives of the HTML problems and test data. The Multimedia page lists a poster, two television videos and photo galleries (443 pictures). Our copy has the gallery index pages but only 31 of the Dinner gallery's 55 photo pages; the other photo pages, the Practice session galleries, the poster, the videos and the photo archive are not in it, nor are the News, Regulation and Porto pages.
