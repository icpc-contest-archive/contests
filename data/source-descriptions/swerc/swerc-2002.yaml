  description: |-
    Final standings of SWERC'2002: a scoreboard of 53 teams against nine problems labelled A to I. Each row gives the rank, a country flag, the team (institution abbreviation and team name), one cell per problem, the number solved and the total time. A solved cell shows the time of the accepted run with a number in brackets; an unsolved cell shows dashes with a number in brackets; a cell is empty when the team made no attempt. The first place is Albert Einstein Ulm_1 with 4 problems solved in 13:36:59. 36 teams solved at least one problem and 17 solved none; ranks run from 1 to 53 without ties and no team is marked as unofficial. The six country flag images are in our copy; the icon of one team whose country is unknown is not.
