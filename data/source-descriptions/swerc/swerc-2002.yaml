  description: |-
    Contest dashboard on QOJ.ac headed "The 2002 ICPC Southwestern Europe Regional Contest (SWERC 2002)", filed under ICPC / Regionals / Europe / Southwestern Europe. It lists 9 problems, A "Solitaire" to I "Servers", without statements on the page; the Attachments box links an English statement booklet, "Statements (en)". A second attachment link is labelled "Official public test data". A note on the page dates the contest to 17 November 2002 at the University of Porto, says the surviving data is about half of the original jury cases, describes four reconstructed cases added to problem B, and gives a fallback limit of 1 second and 512 MB for every problem. The side panel gives the ICPC ruleset with a 20-minute penalty and offers a virtual contest.
