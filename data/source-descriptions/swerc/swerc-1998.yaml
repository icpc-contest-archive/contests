  description: |-
    Contest dashboard on the QOJ online judge, filed under ICPC / Regionals / Europe / Southwestern Europe. It lists nine problems A to I, from Optimal Programs to Single-Player Games, by title only. A note says the contest was held at the University of Ulm, Germany, on 1 November 1998, that statements, inputs, jury outputs and solutions were recovered from the official Ulm contest archive, and that every problem is given 1 second and 512 MB. The settings shown are the ICPC ruleset, 20 minutes penalty and a scoreboard frozen after 4:00:00. An Attachments box links to "Statements (en)" as a download; the statements, the standings and the problem pages are not part of our copy.
