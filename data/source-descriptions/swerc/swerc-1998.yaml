  description: |-
    Website of the ACM Student Chapter at the University of Ulm, mostly in German with an English version of the front page, as it stood in September 2006 (its last-changes line reads 11 September 2006). The front page explains the ACM programming contest, lists the winners of the Ulm Local Contest from 1996 to 2006 and gives a short account of each regional and World Finals result of the Ulm teams. The entry for the 1998 Southwestern Europe regional says that Ulm 1 came second behind Albert-Ludwigs-Universität Freiburg and that Ulm 2 and Ulm 3 placed fourth and eighth. The link behind it leads to a standings page that is not in our copy.

    Our copy holds 150 files, 103 of them pages. Most belong to the Ulm Local Contest pages for 1996 to 2000 (problem lists, rank lists, submission lists, the judges' input files and solutions) and to the World Finals pages for 1996 to 2004, among them the 1998 World Finals in Atlanta (28 February 1998) with its final standings and a report. No page about the regional contest of 1 November 1998 itself is in our copy.
