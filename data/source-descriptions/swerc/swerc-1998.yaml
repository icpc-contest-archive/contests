  description: |-
    Index page of a file archive for the Western and Southwestern European Regionals 1998. It lists links to two files in PostScript form, practice.ps and problems.ps, and to tar archives of all input, all output and all solutions, each also compressed. Below them are 31 individual files: for each of nine problems (bugs, centauri, dice, fastfood, fuses, games, optimal, reflect, slides) a source file in C, an input file and a solution file, plus extra C solutions optimal_prutto.c, optimal_thorsten.c, games-mark.c and slides-mark.c. The page ends with a last-update line of 3 December 1998.

    Only the index page is in our copy; the files it links to are not.
