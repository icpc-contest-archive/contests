    Problem set of the Southwestern European Regional Contest as handed out at the contest: a PDF of 21 pages. The cover names the ACM International Collegiate Programming Contest 1998/99, the University of Ulm, Germany, and 1 November 1998, with IBM as sponsor and Wilken GmbH, Schwarz Pharma and the German ACM Chapter as supporters. It states that the set holds nine problems on twenty numbered pages. The nine problems A to I run from Optimal Programs to Single-Player Games; each has a statement in English with the source and input file names, input and output description and a sample input and output (problem E labels them Input Sample and Output Sample). No test data or solutions.
