  times: true
  tries: true
  description: |-
    Final scoreboard produced by DOMjudge, last updated 28 November 2017: 75 teams ranked 1 to 75, each with team name, institution, number of problems solved and total time, then one cell for each of the eleven problems A to K. A solved cell gives the number of attempts and the minute of the solution (for example 1/10); an unsolved cell gives the number of attempts, and 0 means untried. The first 14 places carry medal marks (2 gold, 4 silver, 8 bronze), and cells for first solutions are highlighted. ENS Ulm 1 is first with 9 problems and 1124 minutes. A summary row gives 75 teams, 48 affiliations and 301 solved problems, and two legend tables explain the cell colours and the participant and sponsor categories; all 75 rows are in the participant colour.

    The problem letters and team names link to problem PDFs and team pages that are not part of our copy.
