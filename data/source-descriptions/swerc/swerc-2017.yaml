  title: SWERC 2017
  language:
  - en
  - fr
  contest_date: '2017-11-26'
  problems: 11
  description: |-
    Website of SWERC 2017, organised jointly by Télécom ParisTech and École normale supérieure and held at Télécom ParisTech in Paris on 25 and 26 November 2017; the schedule puts the contest itself on Sunday 26 November, 09:30 to 14:30. Our copy holds 81 pages (HTML pages, PDFs and text files), in English apart from a French press release. The home page reports 76 teams, 75 of them ranked, and names ENS Ulm 1 as champion. Other pages cover the contest, regulations, registration, schedule, venue, the contestant machines' software environment, organizers, photos (an external gallery and a video are linked) and past editions from 1995 to 2016.

    The teams page lists 76 teams from 48 institutions, each with a page of historical standings (48 such pages). The problems page links the problem set and a practice set (PDFs of 23 and 11 pages) and the analysis slides (31 pages). A 6-page participant booklet, press releases, a poster, a survey form and two reports of the CPCI association are also included.

    The results page links two DOMjudge scoreboards, both in our copy: the final scoreboard and the scoreboard of a separate publicly accessible contest with the same problems. Their team and problem pages, the 60 MB test data archive and four slide decks (opening ceremony, practice introduction, last-minute information, coach meeting) are not in our copy.
