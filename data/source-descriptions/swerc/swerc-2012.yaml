  description: |-
    Problem Set page of the SWERC 2012 website, in English, headed "Southwestern Europe Regional Contest, November 17-18, 2012, Universitat Politècnica de València". Besides the site menu (home, teams, contest, regulation, schedule, registration, results, classification, problem set, photos, location, organization) and links to the sites of the earlier editions, SWERC 2011 back to SWERC 1997, the page holds four download links: a PDF with the problem statements, a PDF with the solution outlines, the problem test cases, and examples of solutions. It is marked "Updated 2012/11/30".

    Our copy holds this one page with its style sheet and two images. The four linked files and the other pages of the site are not part of it.
