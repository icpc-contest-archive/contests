    Final scoreboard of 44 teams, a DOMjudge page headed "Scoreboard SWERC 2012 final standings" and stamped Mon 19 Nov 2012 09:16:04 CET. Per team it gives rank, affiliation (shown as the institution's logo, with a list of the institutions above the table), team name, problems solved and total time, then one column for each of the ten problems A to J. An unsolved cell shows the number of tries; a solved cell shows the tries followed by time plus penalty in parentheses. Teams are ranked 1 to 39, and the last five, none of which solved a problem, carry no rank. First place is UPC-1 with seven problems solved. A summary row at the bottom gives figures per problem.

    Team names link to team pages that are not part of our copy.
