  description: |-
    Category page of the ICPC Live Archive online judge, Regionals 2000 :: Europe - Southwestern, as shown on 28 October 2021. A table lists eight problems numbered 2200 to 2207, Railroads, Ouroboros Snake, Vito's Family, Smith Numbers, Chainsaw Massacre, Erdos Numbers, Echo and Fold-up Patterns, with the total submissions and solving percentage and the total users and solving percentage for each (for example 539 submissions at 25.60 percent for Railroads). Each title links to the problem page on the judge. The page also carries the judge's login form and menu.

    Only this list is in our copy; the problem pages behind the links are not.
