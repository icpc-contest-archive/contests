  description: |-
    Contest dashboard on the QOJ online judge, filed under ICPC / Regionals / Europe / Southwestern Europe. It lists eight problems A to H, from Railroads to Fold-up Patterns, by title only. A note says the contest was held at the University of Valladolid, Spain, on 19 November 2000, that it used the shared European 2000 regional problem set, and that the problems on QOJ are therefore those of NWERC 2000. The settings shown are the ICPC ruleset, 20 minutes penalty and a scoreboard frozen after 4:00:00. An Attachments box links to "Statements (en)" as a download; the statements, the standings and the problem pages are not part of our copy.
