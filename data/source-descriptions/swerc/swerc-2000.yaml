  description: |-
    Final standings of SWERC'00 as a page of the contest website, with a menu (ranklist, final standings, submissions, problems set) and the line SWERC '2000 WINNER above the table, naming Universidad de Valladolid 1. The table gives rank, team name (institution and team number), problems solved and penalty for 15 teams: ranks 1 to 5 solved two problems, ranks 6 to 10 solved one problem each with a penalty, and five teams share rank 11 with one problem solved and no penalty shown. Below it an Honorable Mention list gives 9 more team names without results. Nothing is given per problem.

    The menu links lead to another address and are not part of our copy; the page images are kept.
