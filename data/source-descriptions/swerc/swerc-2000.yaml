  description: |-
    Contest information page of the ICPC Southwestern Europe regional of 2000, hosted by Universidad de Valladolid and giving the contest dates as 18 - 19 November 2000. It states that students came from universities in France, Italy, Portugal and Spain, and links to the regional contest home page, the team roster, the standings and the problems.

    Our copy holds four pages: this page, the team roster, the standings page and the problem set PDF of 16 pages. The link to the regional contest home page leads to another server and is not part of our copy.
