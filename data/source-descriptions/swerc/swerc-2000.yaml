  title: Southwestern European Regional Contest
  language:
  - en
  contest_date: '2000-11-19'
  problems: 8
  pages: 16
  description: |-
    Problem set as handed out at the contest: a PDF of 16 pages. The cover names the ACM International Collegiate Programming Contest 2000-2001 sponsored by IBM, the Southwestern European Regional Contest supported by Telefonica I+D and Divisa Informatica S.A., the University of Valladolid, Spain, and 19 November 2000, and says the set holds eight problems on fifteen numbered pages.

    Eight problems A to H follow, Railroads, Ouroboros Snake, Vito's Family, Smith Numbers, Chainsaw Massacre, Erdos Numbers, Echo and Fold-up Patterns. Each has a statement in English and a sample input and output. No test data or solutions.
