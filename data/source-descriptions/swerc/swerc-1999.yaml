  description: |-
    Home page of the official website of the 1999-2000 Southwestern European Regional Contest, in English. It gives the date of the contest as 21 November 1999 and has a countdown to the contest, links to the team status and to a tentative schedule marked as of November 10, and a link to a weather forecast for Valladolid. A side menu leads to general information, contest information, registration and Valladolid information, and two links lead to a problem set archive and to the ACM contest site.

    Our copy holds this one page only. The pages behind the menu and the page's images are not in our copy; the links lead to pages that are not in it or to other sites.
