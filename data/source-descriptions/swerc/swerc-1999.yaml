    Category page of the ICPC Live Archive for Regionals 1999, Europe - Southwestern, dated 25 October 2021 on the page. It lists eight problems numbered 5636 to 5643, from Date Bugs to Robbery, each with total submissions, the percentage of them accepted, total users and the percentage of users who solved it. The statements are linked from the archive problem by problem and are not part of this page. Around the list are the archive's menu and a login box.
