  description: |-
    Standings of SWERC'99 as shown on a page of the SWERC'00 website: the browser title reads SWERC'00 Registration: Register a Team, but the content is headed SWERC'99 Results and a banner names Technical University of Madrid 1 as the SWERC 1999 winner. A table of 15 ranked rows gives rank, name, number solved and penalty: Technical University of Madrid 1 and University of Valladolid 1 are first and second with four problems, and the five teams that share rank 11 have two problems each. A penalty figure is given only for ranks 1 to 10. Eleven further teams are listed under Honorable Mention without results, so 26 teams appear in all. There is no per-problem detail and no date.

    The page also has a menu with Ranklist, Final Standings, Submissions and Problems set, and a script for a contest countdown; the menu links lead to an address outside our copy. The style sheet and images are in our copy.
