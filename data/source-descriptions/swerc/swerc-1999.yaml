  description: |-
    Final standings of the Southwestern European Regional Programming Contest 1999 as a scoreboard, with the page title Real Time Contest Ranklist: 26 teams, each with a country flag, the team name (university and team number), then for each of the eight problems A to H a time with a number in parentheses, followed by the number solved and the total time down to thousandths of a second. A problem that was not solved shows 00:00:00. Technical University of Madrid 1 is first with four problems and 11:14:43.872, ahead of University of Valladolid 1 with four. Ranks 1 to 22 are single; the four teams that solved nothing share rank 23. The page gives no date and no explanation of the figures in parentheses.
