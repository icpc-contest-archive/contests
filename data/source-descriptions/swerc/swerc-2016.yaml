- url: http://swerc.up.pt/2016/
  read: '2026-11-16'
  rubric: 1
  copy: swerc/swerc-2016/scoreboard/2026-04-16-archive/2016-southwestern-europe-regional-contest-2016.html
  title: SWERC'2016
  language:
  - en
  description: |-
    Home page of the SWERC'2016 website, in English, for the contest to be held on November 19th and 20th at the Faculty of Sciences of the University of Porto (Portugal). It carries a menu (Teams, Contest, Regulation, Schedule, Registration, Results, Classification, Problem Set, Photos, Location, Organization, Links, ACM-ICPC, Past Editions, Contact) and an announcement that ENS Ulm 1 (École Normale Supérieure ULM) is the winner of SWERC'2016.

    Under the announcement are links to the Final Classification (HTML), Submissions, Stats and Evolution pages, the Problem Set (PDF), the Problem Analysis (PDF), a ZIP of solutions and input/output files, and a photo album. The welcome text describes SWERC as drawing students from France, Italy, Portugal, Spain, Switzerland, western Austria and Israel, with the winning team advancing to the ACM World Finals; the page ends with an Event Sponsors section.

    Our copy holds this home page only. The pages and files it links to are separate addresses and are not part of it.
- url: http://swerc.up.pt/2016/reports/ranking.html
  read: '2026-11-16'
  rubric: 1
  copy: swerc/swerc-2016/standings/20180412-wayback-e2ffd309/ranking.html
  title: 'Mooshak: SWERC16_Contest'
  language:
  - en
  teams: 60
  problems: 11
  times: true
  tries: true
  description: |-
    Scoreboard produced by Mooshak (page title "Mooshak: SWERC16_Contest"): 60 teams ranked 1 to 60 on one page. Columns are rank, country (shown as a flag image), team (an institution abbreviation followed by the team name), eleven problem columns A to K, Solved and Points. Each problem cell gives a time in h:mm:ss with a number of tries in parentheses for a solved problem, "------" with the number of tries for an unsolved one, and is empty for a problem not attempted.

    The first team, ENS Ulm 1, solved 9 problems with 19:45:39 in Points. The last teams solved one problem each. No medals or other marks are shown, and the page does not say whether it is final.

    Images and the style sheet are kept with our copy.
- url: https://icpc.global/regionals/finder/SWERC-2017/standings
  read: '2026-11-16'
  rubric: 1
  copy: swerc/swerc-2016/standings/api-20261113/standings.html
  title: The 2016 Southwestern Europe Regional Contest — standings
  language:
  - en
  teams: 60
  description: |-
    Standings of 60 teams with rank, team, institution, problems solved, time, medal, citation and site citation. The winner is ENS Ulm 1 (École Normale Supérieure de Paris) with 9 problems solved and time 1185, marked Gold Medal, First Place and SWERC Winner. Ranks 1 to 3 carry gold medals, 4 to 7 silver and 8 to 12 bronze, and the citation column names the place for ranks 1 to 30 and reads Honorable Mention for ranks 31 to 60.

    Solved counts run from 9 down to 1. There is no per-problem detail and no number of attempts.
- url: http://swerc.up.pt/2016/reports/problemset.pdf
  read: '2026-11-16'
  rubric: 1
  copy: swerc/swerc-2016/problemset/20180412-wayback-d6f995c0/problemset.pdf
  title: SWERC'2016 Southwestern Europe Regional Contest
  language:
  - en
  problems: 11
  pages: 24
  description: |-
    Problem set: a PDF of 24 pages in English. The cover names SWERC'2016, the Southwestern Europe Regional Contest, Porto, 19-20 November 2016, and the ACM International Collegiate Programming Contest 2016. Page 2 holds the contents list of problems A to K and a list of eleven judges and problem setters with their affiliations.

    The eleven problems are Within Arm's Reach, Bribing Eve, Candle Box, Dinner Bet, Passwords, Performance Review, Cairo Corridor, Pascal's Hyper-Pyramids, The White Rabbit Pocket Watch, Risky Lottery and Balls and Needles. Each takes two pages (pages 3 to 24): the statement with task, input, constraints and output, then sample input and output. The problem pages carry a footer naming SWERC'2016 and Universidade do Porto. The PDF holds statements only; there is no test data or solution.
