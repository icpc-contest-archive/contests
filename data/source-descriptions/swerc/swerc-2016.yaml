    Codeforces Gym dashboard of "2016-2017 ACM-ICPC Southwestern European Regional Programming Contest (SWERC 2016)", marked Finished. It lists problems A to K with standard input/output, time limits of 1 or 1.5 seconds and 256 MB memory, and a count beside each problem. It links a contest website and Statements (en), and has the Codeforces menu, practice and virtual participation text, and forms for asking questions and adding announcements.

