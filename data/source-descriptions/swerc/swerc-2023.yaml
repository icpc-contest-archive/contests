    Slides of the problem analysis session given by the SWERC judges, dated 28/01/2024, as a PDF of 65 pages in English. An opening slide gives statistics: about 1424 submissions and 52 clarification requests, about 42 of them answered "No comment.". The deck then takes the 13 contest problems one by one, in the order I, F, E, L, A, K, B, J, C, D, G, H, M. Each problem gets a short statement and its solution, usually with its complexity. Eleven problems give the number of teams that solved it before the freeze and the team that solved it first, with the minute; H and M are marked not solved before the freeze.
