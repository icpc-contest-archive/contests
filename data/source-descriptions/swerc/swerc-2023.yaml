- url: https://swerc.eu/2023/
  read: '2026-11-16'
  rubric: 1
  copy: swerc/swerc-2023/website/2026-09-05-live-350c01d0
  title: Home - SWERC 2023-2024
  language:
  - en
  contest_date: '2024-01-28'
  description: |-
    Website of the Southwestern Europe Regional Contest (SWERC) 2023-2024, hosted by LIP6, in English. Its pages cover the contest and its format, regulations, registration (open 9 October to 10 December 2023), results, the list of teams, the computer environment, the schedule, the venue at the Jussieu campus of Sorbonne University in Paris, the organizers, and past editions back to 1995. The schedule gives a practice session on Saturday 27 January 2024 and the five-hour contest on Sunday 28 January, with sponsor lectures, a banquet, and an assignment of teams to rooms and machines. The teams page lists 108 teams from 65 institutions, each with three students and a coach.

    The results page links to the final scoreboard, practice and contest problem sets as PDFs, the judges' analysis slides for both, per-problem zip archives, a playlist of streams and a photo album. Our copy holds 17 distinct pages and PDFs (the teams page is saved under two addresses), including the contest and practice problem sets and analyses, and 11 zip archives: practice problems A to E and contest problems A to F. The zip archives for contest problems G to M are not in our copy. The scoreboard link leads to a small index page that points on to a scoreboard held outside the website copy, and the mirror server, the streams and the photo album lead to other servers.
