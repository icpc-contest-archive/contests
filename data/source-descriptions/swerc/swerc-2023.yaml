  times: true
  tries: true
  description: |-
    Final scoreboard of a DOMjudge public page headed "SWERC 2023 final standings": 107 teams with rank, country flag, institution logo, team name, institution, number of problems solved and penalty time. For each of the 13 problems, A to M, a cell gives the solve time in minutes and the number of tries, or only the tries when the problem was attempted and not solved; untried cells are empty. Solved cells are coloured and 12 cells carry the first-solve mark; nobody solved problem M. The first 14 teams carry medals (2 gold, 4 silver, 8 bronze), and the last four teams, which solved nothing, have no rank. First place is dETHroners (ETH Zürich) with 11 problems solved. A summary row gives the total of 484 solved and, for each problem, the numbers of accepted, rejected and pending submissions and the time of the first solve. The page can be filtered by affiliation and country and states a last update of 9 February 2024. Links to team pages and to the problem PDFs lead outside our copy.
