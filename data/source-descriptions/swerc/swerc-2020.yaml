- url: https://swerc.eu/2020/
  read: '2026-11-16'
  rubric: 1
  copy: swerc/swerc-2020/website/2026-09-05-live-771e95e0
  title: SWERC 2020-2021
  language:
  - en
  contest_date: '2021-03-07'
  description: |-
    Website of SWERC 2020-2021, in English, organised by Institut Polytechnique de Paris; the contest ran online on 6-7 March 2021, with the contest itself on Sunday 7 March from 09:00 to 14:00 according to the schedule. The home page reports 109 teams, 107 of them ranked, and names the champion and the next two teams. Our copy holds 70 pages: the contest description, regulations, registration, schedule, environment, organisers, media (photos, a press release, a press review with links to coverage by participating institutions), and past SWERC editions.

    The teams page lists 109 teams from 52 institutions with their members, and 52 institution pages give historical standings. The problems page lists the 13 problems A to M, each with a link to a video analysis, plus links to the full problem set, a version with test cases, and the same two for the practice contest. The results page links to the scoreboard, which is in our copy as a DOMjudge page, together with the statement of problem A as a 2-page PDF. Reports of the organising association (an activity report of 5 pages and a financial report of 3 pages) are also included.

    The videos, the problem set files and the other problem statements linked from the scoreboard are not in our copy.
