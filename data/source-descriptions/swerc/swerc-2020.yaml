  description: |-
    Final scoreboard of SWERC 2020-2021 produced by DOMjudge, last updated on 8 March 2021: 107 teams, with problems labelled A to M. Each row gives rank, team, institution, number solved and total time; each problem cell gives the minute of the accepted solution with the number of tries, or only the tries for an unsolved problem. Medals are marked beside the rank (2 gold, 4 silver and 8 bronze), one row near the end has an empty rank cell, and a summary row closes the table. First place is ENS Ulm 1 from École Normale Supérieure de Paris with 12 problems solved.
