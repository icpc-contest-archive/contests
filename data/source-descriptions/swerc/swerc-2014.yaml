    Standings of the 2014 Southwestern Europe Regional Contest: 49 teams with rank, team name, institution, number of problems solved, time, medal and a citation column. UPC 1 (Universitat Politècnica de Catalunya) is first with 9 solved and a time of 1122, followed by Sub-ETHa (ETH Zürich) and ENS Ulm 1 (École Normale Supérieure de Paris). Two teams carry a Gold Medal, three a Silver Medal and four a Bronze Medal; ranks 10 to 35 are marked only with a place name (Tenth Place and so on), and the last 14 teams, with no problem solved, are marked Honorable Mention. There is no per-problem detail and no attempts column.
