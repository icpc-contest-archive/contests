  title: SWERC'2014
  language:
  - en
  description: |-
    Homepage of the SWERC 2014 website, in English, as the host's site showed it after the contest. It announces the winner, UPC 1 (Universitat Politècnica de Catalunya), and links to the final classification (HTML), submissions, stats, an evolution page, the problem set (PDF), the problem analysis (PDF), a ZIP of solutions with input and output files, and a photo gallery of more than 800 photos. The welcome text says the contest is to be held on November 22nd and 23rd and hosted by the Faculty of Sciences of the University of Porto, Portugal, and describes the ICPC and the regional's catchment (France, Italy, Portugal, Spain, Switzerland and western Austria).

    The menu lists Home, Teams, Contest, Regulation, Schedule, Registration, Results, Classification, Problem Set, Photos, Location, Organization, Links, ACM-ICPC and Past Editions, followed by a contact line. Our copy holds only this one page and the five photographs its thumbnails link to; the banner, map and sponsor logos (University of Porto, IBM, Microsoft) shown on the original page, and the pages and documents it links to, are not part of it.
