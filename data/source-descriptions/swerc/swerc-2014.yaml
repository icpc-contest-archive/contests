    Problem set: a PDF of 24 pages in English. The cover names the Southwestern Europe Regional Contest, Porto, 23 November 2014, and the ACM International Collegiate Programming Contest 2014. A contents page and a table of authors and additional problem setters are followed by ten problems, A to J (GREAT + SWERC = PORTO, Flowery Trails, Golf Bot, Book Club, Ricochet Robots, City Park, Playing with Geometry, Money Transfers, The Safe Secret, The Big Painting). Each statement has input and output descriptions and at least one sample; some samples have an output explanation. The footer names the Universidade do Porto Computer Science Department. No test data.
