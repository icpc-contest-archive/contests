  title: SWERC 2013 - València
  language:
  - en
  contest_date: '2013-11-17'
  description: |-
    Website of the 2013 Southwestern Europe Regional Contest, hosted by the Escola Tècnica Superior d'Enginyeria Informàtica of the Universitat Politècnica de València, in English. Our copy holds 26 pages: 13 of the 2013 edition and 13 of the 2012 edition site, which the home page links as SWERC 2012. The 2013 pages are the home page, contest environment and compile commands, regulation, a schedule for Saturday 16 and Sunday 17 November, registration and fees, location, organization, results and problem set.

    The results page says the contest ran on Sunday 17 November 2013 from 10:00 to 15:00, with 10 problems and 44 teams from 24 universities, and names the first two places. It links to a classification PDF, a problem statements PDF and a solution outlines PDF, all three in our copy, and to live Mooshak listings that are not. The 2012 pages include two scoreboard pages.

    The Teams link leads to another server. The two photo gallery pages, 2013 and 2012, hold only the title Single File PHP Gallery and no photos.
