  description: |-
    Problem set page of the SWERC 2009 website, hosted by Universidad Complutense, Madrid, in English. The site header gives Southwestern Europe Regional Contest, October 31 - November 1, 2009, and the page is marked as updated 2009/07/11. Below a menu (Home, Teams, Contest, Regulation, Schedule, Registration, Results, Problem Set, Photos, Location, Organization) and a list of links to the SWERC sites of earlier years, the page lists ten problem statements labelled A to J, each with a problem title and the name of its author: from A, Trick or Treat, to J, Stammering Aliens.

    The page links to three downloads: a PDF of the problem statements, a PDF of solution outlines, and an archive of test cases and example solutions. Our copy of this page holds the page with its style sheet and images; the other pages of the site are not in it.
