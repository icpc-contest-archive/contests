  - en
  description: |-
    Home page of the SWERC 2015 website, in English, of the Southwestern Europe Regional Contest hosted by the Faculty of Sciences of the University of Porto (Portugal). A menu offers Home, Teams, Classification, Problem Set, Photos, Location, Organization, Links, ACM-ICPC, Past Editions and Contact. The page names UPC 1 (Universitat Politècnica de Catalunya) as winner, says the contest was held on November 21st and 22nd, and links the final classification (HTML), the problem set (PDF), the problem analysis (PDF), the solutions and input/output files (ZIP) and a photo gallery with around 500 photos. It also carries a short text on the ACM International Collegiate Programming Contest and an event sponsors section, and points to the 2016 site.

    Our copy holds this front page only. The pages and files it links to are separate documents.
