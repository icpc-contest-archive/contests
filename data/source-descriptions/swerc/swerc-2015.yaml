  description: |-
    Slides of the problem analysis session given by the SWERC Judges, in English: a PDF of 33 pages titled Problem Analysis Session, SWERC 2015. Page 2 is a table of the estimated number of accepted solutions and the number accepted within four hours for each of the ten problems A to J. The analysis then takes the problems in the order H, A, C, J, D, B, E, G, F, I. Each opens with a slide stating the problem with its categories and a difficulty (from Easy to Hard), followed by slides with the sample solution or approach, one with pseudocode. The last page is Questions?
