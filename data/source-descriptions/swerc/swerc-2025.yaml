  description: |-
    Problem set PDF of 28 pages in English. The cover names the contest, the three sites Lisbon, Lyon and Pisa and 23 November 2025, lists the judges and problem setters, says the set has 12 problems on 28 pages, and gives a Creative Commons Attribution-ShareAlike 4.0 licence. Page 2 is a blank page.

    Problems A to L (Adjusting Drones to LFS) follow, each with a statement, an input section and a Samples section: 15 samples in all, one for each problem except D with two and L with three, and most samples are followed by an explanation. Problems A to H and J to L have an output section; problem I is interactive and has an interaction section instead. No test data or solutions.
