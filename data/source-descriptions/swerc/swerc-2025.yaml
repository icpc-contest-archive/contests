    Problem analysis slides for SWERC 2025 in English, dated November 23, 2025: 63 slides printed as 182 PDF pages. Slide 2 charts, for each of problems A to L, how many teams attempted and solved it, and slide 3 the submissions by language.

    The problems follow in the order D, E, F, B, J, A, C, G, L, I, H, K. Each has a plot of submissions over time, a summary of the statement and the solution idea. Ten problems also state how many teams solved them before the freeze and when and by which team they were first solved; problems H and K are marked "Not solved before freeze". Some solution slides state a time complexity.
