  problems: 12
  times: true
  tries: true
  description: |-
    Final scoreboard of SWERC 2025 produced by DOMjudge: 142 teams in category Participants2025 plus one team in category Observers, which has its own rank 1 and its own summary row. Each row gives rank, team, institution with country flag, problems solved and total time, and for each of the twelve problems A to L the solve time in minutes and the number of tries for a solved problem, and the number of tries for an unsolved one. Gold, silver and bronze medal marks are shown on the first 14 rows. Summary rows give per-problem totals, and a detail pane per team names its category, country and site. The page says it was last updated on 25 Nov 2025 23:22:02 UTC. The team in first place, Fire Code of The Open University of Israel, solved 11 problems.
