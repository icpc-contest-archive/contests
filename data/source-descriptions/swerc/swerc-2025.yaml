  title: Home - SWERC 2025
  language:
  - en
  description: |-
    Website of the 2025 Southwestern Europe Regional Contest (SWERC), in English, with contact addresses for Portugal, France and Italy and the note that the website is hosted by LIP6. Our copy holds 57 addresses, of which 10 are pages of the site: the home page, an explanation of the contest, regulations and eligibility, registration, the team list, one page each for the host sites Lisbon, Lyon and Pisa with venue and schedule, a content page, and a page of past editions from 1995 to 2024. The scoreboard page and the statements and analysis PDFs are also in it.

    The content page links the scoreboard, the problem statements, the problem analysis, the problem instances and photos; the scoreboard, statements and analysis are in our copy, the problem instances and photos are not. The past editions page links to other editions' sites and caches, which are not part of it.
