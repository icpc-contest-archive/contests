  description: |-
    Landing page of the 1996 Southwestern European Regional Contest problem set, in English. It links the contest problem set in HTML, Postscript and gzip-compressed Postscript, the same three forms for the practice session problem set, a page of the chief judge's comments, and two tar.gz archives with test data, sample solutions and checking programs, one for the contest and one for the practice session. It names the chief judge as the compiler of the set and credits other contributors, and notes that the practice problems were taken from the practice session two years earlier.

    Our copy is this page only; the linked documents and archives are not in it.
