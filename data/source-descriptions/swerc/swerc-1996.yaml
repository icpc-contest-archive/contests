  description: |-
    Final ranklist of the 1996 Southwestern European Regional Contest, stamped 16 November 1996 14:06:45: 30 teams with rank, university, the letters of the problems solved, total time and programming language. Only problems B, C, E and F appear among the solved letters, and there are no per-problem times or attempt counts. University of Ulm 1 is first with four problems, ahead of University of Ulm 2 and Czech Technical University Prague 2.

    A contest report above the table says 30 teams from 20 institutions in seven countries took part, that the contest ran from 09.06 to 14.06 at ETH Zürich, counts the teams by language (20 C, seven C++, three Pascal), and names the two teams that advance to the finals. The page links to two team photos and to the sponsors Microsoft and Union Bank of Switzerland; the logo and the photos are not in our copy.
