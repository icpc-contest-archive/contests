  problems: 8
  description: |-
    Problem set of the 1996 Southwestern European Regional Contest as one HTML page, in English. Its heading names the 1996-1997 ACM International Collegiate Programming Contest, ETH Zürich, 16 November 1996, with Microsoft as sponsor and Union Bank of Switzerland as supporter. A contents list leads to eight problems, A Stars, B Hexagon, C Domino Effect, D Pendulum, E Border, F The New Villa, G Ships and H Jury Compromise.

    Each problem has a full statement, an input specification, an output specification, a sample input and the output for it (problem F labels them 'Input Sample' and 'Output for Input Sample'), and a line naming the source and input file names. Our copy is only this page with its two small images; the test data and solutions are not in it.
