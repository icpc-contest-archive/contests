  language:
  - en
  problems: 9
  description: |-
    Page titled 'SWERC'2001 Summary and Problem Set' on the contest's own site. It states that participation rose to 47 teams from 7 countries representing 29 institutions, and names the two teams that qualified for the World Finals in Hawaii, March 2002: first place Royal Institute of Technology (KTH_NADA, Sweden) and second place Ecole Politechnique de Paris 1 (France). It links to statistics on problems solved and the progress of teams during the contest.

    The page lists the practice session (two problems, A The Six-Letter Cipher and B Cantor Fractions II) and the contest problems A to I (Mice and Maze to No Change); each of the two sets (practice and contest) offers downloads as an HTML archive (tgz), a PDF and gzipped PostScript, and each problem links to its own HTML page. Only this page is in our copy, not the pages it links to.
