  language:
  - en
  contest_date: '2001-11-18'
  problems: 9
  pages: 22
  description: |-
    Problem set as handed out at the contest: a PDF of 22 pages. The cover names the ACM International Collegiate Programming Contest 2001-2002 sponsored by IBM, the Southwestern European Regional Contest, the University of Porto, Portugal, and November 18th, 2001. A contents page and a remark follow; the remark says the set was developed jointly by the University of Porto and the University of Warsaw for the SWERC'2001 and CERC'2001 regional contests.

    Nine problems A to I (Mice and Maze, Multiple Morse Matches, Maya Calendar, Water Shortage, Puzzle, Reliable Programs, Binary Stirling Numbers, Project File Dependencies, No Change), in English. Each has a statement with input and output specification and one sample input and one sample output. No test data or solutions.
