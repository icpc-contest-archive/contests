  read: '2026-11-16'
  rubric: 1
  copy: swerc/swerc-2001/website/2026-10-20-wayback-942b2fa7
  title: The 2001 ACM Southwestern Europe Programming Contest sponsored by IBM
  language:
  - en
  pages: 18
  description: |-
    Pages of the 2001 ACM Southwestern Europe Programming Contest sponsored by IBM, hosted by the University of Porto, Portugal, taken from the ICPC regional contest pages. Our copy holds 18 pages. The front page names the host, says the event was organised by staff of the Faculties of Science and of Engineering, gives the dates 16 - 18 November 2001, lists the countries the teams come from, and links to the team roster, the standings and the problems.

    The results page is a scoreboard of 47 teams with per-problem times and tries for problems A to I. Two statistics pages follow, one with the count of each run result (accepted, wrong answer, time-limit exceeded and others) per problem and one with a table in 15-minute steps from 0:00:00 to 5:00:00 with counts per problem. The problems page links to the problem set PDF of the contest (22 pages) and the practice set PDF (6 pages), both in our copy, and to an archive (tgz) of the contest problems as HTML. 11 problem pages in English are in our copy: A to I of the contest and the two practice problems.

    The team roster link leads to a page that is not part of our copy; neither are the PostScript files and the practice-set archive linked from the problems page.
