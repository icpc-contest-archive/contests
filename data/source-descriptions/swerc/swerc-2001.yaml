  description: |-
    Home page of the official site of SWERC'2001, the 2001 Southwestern European Regional Contest, published by the Universidade do Porto and written in English. It states that the contest is part of the ACM International Collegiate Programming Contest, draws students from France, Italy, Portugal and Spain, and is held in Porto under the patronage of the Faculties of Engineering and of Science. A table gives early registration from 15/03/2001 to 01/11/2001 and registration from 15/03/2001 to 08/11/2001; the page states 'last update: 01/03/2001'.

    The menu links to Info, Regulation, Contest, Porto, Links and Search pages, which are not in our copy: only this page and its images are.
