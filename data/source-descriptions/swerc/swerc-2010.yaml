  description: |-
    Problem set page of the SWERC 2010 website, hosted by Universidad Complutense, Madrid, in English. The header gives the Southwestern Europe Regional Contest, November 20-21, 2010. The page has three links: the problem statements as a PDF, the solution outlines as a PDF, and the problem test cases with example solutions (77 Mb). The page lists no problems itself.

    The site menu (Home, Teams, Contest, Regulation, Schedule, Registration, Results, Problem Set, Photos, Location, Organization) and thirteen links to the sites of earlier SWERC contests from 1997 to 2009 are on the page; the test case archive is not in our copy. The page is marked as updated on 2010/11/25.
