    Scoreboard of SWERC 2010 with 38 teams and ten problems A to J, carrying the time stamp Sun 21 Nov 2010 15:17:04. Each team row gives rank, an affiliation column of logos (institution name as hover text), team name, number of problems solved and penalty time, and for each problem the number of attempts, with the solve time and penalty in brackets for solved problems (for example 1 (15 + 0)). Teams tied on a rank show it only on the first of them. The last row is a summary: total teams, number of affiliations and countries (23 / 5), total problems solved (83) and, per problem, submitted / correct / fastest time. First place is Dirt collector with 5 problems solved and 904 penalty time. The last three teams solved no problems.
