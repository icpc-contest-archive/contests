    Solution outlines of SWERC 2010 by the SWERC Judges, as slides in English. Our copy is a PDF of 74 pages; the slides are numbered up to 39, and many slides appear in several build steps. After the title slide, two statistics slides follow: the first team to solve each problem with its time (given for eight of the ten problems; B and G have no entry), and the number of accepted solutions, total submissions and success rate for problems A to J. The rest gives the solution outline of each of the ten problems, some with several approaches.
