  title: SWERC'2004 Official Website
  language:
  - en
  - fr
  contest_date: '2004-11-21'
  description: |-
    Official website of the 2004 Southwestern Europe Regional Contest (SWERC'2004), hosted at Ecole Polytechnique in Palaiseau near Paris. It is in English and is built as frames with a header and a content page; French versions of several pages are included. Our copy holds 76 pages: a welcome page, the tentative schedule (registration on Friday 19 November, practice session on Saturday, the contest on Sunday 21 November from 10:00 to 15:00, awards at 16:00), team composition, contest environment, conduct of the contest, scoring and appeals rules, hotel information and reservation, Paris and Polytechnique pages, contact, links to past SWERC sites, ACM sites and problem archive sites, and a results page.

    The results page is a board with 57 teams. The welcome page links to the final results. The welcome page says the website is still under construction, and the schedule is labelled tentative.
