    ICPC Live Archive category page for the 2004 Southwestern Europe regional, listing nine problems numbered 3204 to 3212 with their titles, from Stormy Versailles to Crime. For each problem it shows total submissions and solving percentage and total users and solving percentage on the archive. Problem 3208, Fighting the Heat II, has no submissions. The page lists titles only: no statements, input data or solutions are on it, and the page's login form and menu links lead to other pages of the archive.
