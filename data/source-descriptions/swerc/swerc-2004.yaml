  description: |-
    Contest dashboard on QOJ.ac headed "The 2004 ICPC Southwestern Europe Regional Contest (SWERC 2004)", filed under ICPC / Regionals / Europe / Southwestern Europe. It lists 9 problems, A "Stormy Versailles" to I "Crime", without statements on the page; the Attachments box links an English statement booklet, "Statements (en)". A note on the page says the event was held at École Polytechnique in Palaiseau, France, from 19 to 21 November 2004, with the programming contest from 10:00 to 15:00 on 21 November; it says the test data was reconstructed, that problem F uses a custom checker because it permits multiple valid answers, and gives time limits of 3 seconds (10 for C, 9 for H) with a 512 MB memory limit, and links the event's archived website. The side panel gives the ICPC ruleset with a 20-minute penalty and offers a virtual contest.
