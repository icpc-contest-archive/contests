  description: |-
    Category page of Baekjoon Online Judge, in Korean, for the source SWERC 1995 under ACM-ICPC Regionals, Europe. A table lists nine problems numbered 6439 to 6447 with contest letters A to J (no I). For each it gives the title, marks such as special judge and multilingual, the number of users who solved it, the number of submissions and the acceptance ratio. Titles are shown for A to F and H (A, E and F in Korean translation, B, C, D and H in English); the rows for G and J have no title and no figures.

    The page also carries the site's menus. It lists problems only; the statements are on separate pages not in our copy.
