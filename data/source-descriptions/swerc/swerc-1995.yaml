  description: |-
    Archive page of the Southwestern European Regional Programming Contest of 1995, held at ETH Zurich, Switzerland, in English; the contest was sponsored by Microsoft and supported by Union Bank of Switzerland. The page offers the regional problem set in HTML, two PDF versions (19 pages each), PostScript and compressed PostScript, and a practice problem set in the same formats (HTML, two PDF versions of 5 pages each, PostScript and compressed PostScript). The regional set is dated 9 December 1995 and has nine problems A to J: Intersection, Synchronous Design, Graph Coloring, Triangle, Anagram, Spreadsheet, Cube, Peter's Calculator and Partial Differential Equations. The practice set, dated 8 December, has three: Inverse Tangens, Word Counting and Sorting.

    A page of comments by the head judge discusses the problems and gives submission statistics per problem, stating that 28 teams submitted 230 programs. A compressed archive gives the test data, sample solutions and judging scripts.

    Our copy holds eight pages (four HTML pages and four PDF files), the PostScript files, the three compressed files and 27 small images. There are no results or team list.
