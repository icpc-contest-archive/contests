    Category page of the ICPC Live Archive named Regionals 1995 :: Europe - Southwestern, listing nine problems numbered 5601 to 5609: Intersection, Synchronous Design, Graph Coloring, Triangle, Anagram, Spreadsheet, Cube, Peter's Calculator and Partial differential equations. For each it shows the number of submissions and the percentage solving, and the number of users and the percentage solving, as they stood on 20 October 2021, the day shown on the page.

    The archive's menu and login form surround the list. It holds titles and statistics only; the statements are on separate pages not in our copy.
