  description: |-
    Problem set as a gzipped tar of HTML files: nine statements A to I, in order BEATBIT, Prester John, Robotruck, Jumping Hero, Board Games, The Bridges of Kolsberg, The Finest Chef, IP-TV and Ladies' Choice, plus one image used by the statement of problem F. Each statement is in English with a background, the problem, input and output descriptions and sample input and output; problems E and G have two samples. No test data or solutions.

    Eight of the nine files were exported from Microsoft Word and declare a legacy Mac encoding; the o-umlaut in Kolsberg in problem F is stored in that encoding.
