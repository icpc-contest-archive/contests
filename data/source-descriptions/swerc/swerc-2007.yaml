  description: |-
    Contest page of SWERC'2007, in English, stating that the contest uses Mooshak. It announces the winner, a team from Universidad Complutense de Madrid, and links the final ranking, submissions, statistics and evolution pages, plus a ranking taken at the start of the blackout, one hour before the end. It gives the official contest as 18 November, 09:00 to 14:00 UTC, with a blackout over the final hour, and describes a public on-line contest running in parallel from 09:05 to 14:05 UTC, with registration and login links. It links the problem set as nine problems A to I, plus an HTML.tgz download.

    Our copy is this one page and its logo image; the linked ranking, submissions, statistics, evolution and problem pages and the Mooshak login links are not part of it.
