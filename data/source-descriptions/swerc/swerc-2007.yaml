  description: |-
    Contest dashboard on QOJ.ac headed "The 2007 ICPC Southwestern Europe Regional Contest (SWERC 2007)", filed under ICPC, Regionals, Europe, Southwestern Europe. A note says the statements are the official ones of the contest held in Lisbon, that the original event site survives with the complete English set, and that, as its public archive lacked the test data, checkers and limits, the problems use the official samples with reconstructed tests and fallback limits of 1 second and 512 MB. It lists nine problems, A BEATBIT to I Ladies' Choice, each linked to its problem page. A side panel gives the settings (ICPC ruleset, a penalty of 20 minutes, a limit of 1000 submissions per problem, a scoreboard frozen after 4:00:00) and marks the contest as ended; the notice and question tables are empty. Under Attachments the page links to "Statements (en)", a file not part of our copy.
