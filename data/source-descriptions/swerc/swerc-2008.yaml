    Contest dashboard on QOJ.ac headed "The 2008 ICPC Southwestern Europe Regional Contest (SWERC 2008)", filed under ICPC, Regionals, Europe, Southwestern Europe. It lists ten problems, A Bring Your Own Horse to J Wizards, each linked to its problem page. A side panel gives the settings (ICPC ruleset, a penalty of 20 minutes, a limit of 1000 submissions per problem, a scoreboard frozen after 4:00:00) and marks the contest as ended; the notice and question tables are empty. Under Attachments the page links to "Statements (en)", a file not part of our copy.
- url: http://icpc.informatik.uni-erlangen.de/swerc2008/results/solOutline.pdf
  read: '2026-11-23'
  rubric: 1
  copy: swerc/swerc-2008/editorial/20120425-wayback-69b5c725/solOutline.pdf
  title: ACM-ICPC South Western European Regional SWERC 2008
  language:
  - en
  - de
  problems: 10
  pages: 40
  description: |-
    Solution outline by the FAU Contest Team of Friedrich-Alexander Universität Erlangen-Nürnberg: slides made with LaTeX Beamer, a PDF of 40 pages in English with German slide titles here and there. The cover gives the title "ACM-ICPC South Western European Regional SWERC 2008", the team, the university and the date November, 23 2008.

    An overview slide headed "Übersicht" (German, "overview") lists the ten problems with the minimum and maximum lines of code of their solutions. Each problem then has a statistics slide followed by one to eight slides on the solution, from Bring Your Own Horse to Wizards; every statistics slide reads 0 submissions, 0 accepted and no first team or time. Toll Road has a slide of C++ code. The last slide, headed "Abendgestaltung" (German, "evening plans"), holds only the word "Kanapee?".
