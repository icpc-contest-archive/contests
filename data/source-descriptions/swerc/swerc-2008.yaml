  problems: 10
  pages: 22
  description: |-
    Problem set as a PDF of 22 pages, in English. The cover names the ACM-ICPC South Western European Regional SWERC 2008 and gives 23 November 2008, with a problem overview listing ten problems: Bring Your Own Horse, First Knight, Postal Charges, Randomly-priced Tickets, The Game, The Merchant Guild, Toll Road, Top Secret, Transcribed Books and Wizards.

    The problems are labelled A to J, each starting on an odd page from 3 to 21. Each statement has input and output descriptions and one sample input and output. Statements A to F run over two pages; for G to J the following page is marked as intentionally left (almost) blank; page 2 holds only its number. No test data or solutions.
