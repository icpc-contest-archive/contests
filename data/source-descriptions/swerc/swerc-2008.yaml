  title: SWERC 2008 - Results
  language:
  - en
  description: |-
    Results index page of the SWERC 2008 website, hosted by Friedrich-Alexander-University Erlangen-Nuremberg, headed "South Western European Regional Contest, November 21-23, 2008". Under Contest Results it links the final standings, the standings before the freeze (after 4 hours), submissions, the problem set (PDF), example solutions (ZIP), solution outlines (PDF) and a practice session (PDF). It names one team as winner: agregpower from Lyon, seven problems in a total of 1314 minutes. The page shows a last update of 2009-01-12 and the site's menu (home, results, photos, rules, schedule, registration, system, location, organization, contact) and links to earlier SWERC sites.

    Our copy is this page and three images; the pages and files it links are not part of it.
