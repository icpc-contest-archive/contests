  title: Scoreboard SWERC 2008
  language:
  - en
  teams: 56
  problems: 10
  times: true
  tries: true
  description: |-
    Final scoreboard headed "Scoreboard SWERC 2008" with the subheading "final standings": 56 teams, with rank, a short institution code (blank for some teams), team name, a score of problems solved and penalty time, and ten problem columns A to J, each headed by its title and a circle (coloured, open for J). Solved problems show the number of attempts with solve time plus penalty in parentheses (for example 2 (223 + 20)); unsolved problems show only the attempts. The first place is agregpower with seven problems and 1314, second UPC-2 with seven and 1387.

    The top 41 teams carry a rank; 15 further teams with no solution are listed without one. A last summary row gives 56 teams, 29 affiliations from 7 countries, 111 problems solved, and for each problem the numbers submitted, correct and the fastest time. Unofficial or guest teams are not marked.
