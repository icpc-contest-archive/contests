  description: |-
    Final scoreboard of SWERC 2019-2020 produced by DOMjudge, last updated on 26 January 2020: 98 teams, of which 95 are ranked 1 to 95 under Participants and three are listed under Ineligible with their own ranks 1 to 3. Problems are labelled A to L. Each row gives rank, team, institution, number solved and total time; each problem cell gives the minute of the accepted solution with the number of tries, or only the tries for an unsolved problem. Medals are marked beside the rank (2 gold, 4 silver and 8 bronze), and each group ends with a summary row. First place is EP Chopper from École Polytechnique with 11 problems solved. Team names link to team photos.
