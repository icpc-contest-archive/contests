  description: |-
    Slide deck titled Problem Analysis Session by the SWERC judges, dated January 26, 2020, in English: a PDF of 84 pages made with LaTeX Beamer, numbered as 44 slides. It opens with statistics (about 1400 submissions, 35 clarification requests, solved and attempted counts per problem and submissions by language), then covers all twelve problems A to L one after another, starting with I and ending with E. The problem slides include charts of submissions over contest time, a summary of the problem and its solution, and for eleven of the twelve problems which team solved it first and after how many minutes (problem E was not solved before the freeze).
