- url: https://swerc.eu/2019/
  read: '2026-11-16'
  rubric: 1
  copy: swerc/swerc-2019/website/2026-09-05-live-7ad47edf
  title: SWERC 2019-2020
  language:
  - en
  contest_date: '2020-01-26'
  description: |-
    Website of SWERC 2019-2020, in English, organized by Institut Polytechnique de Paris and held at Télécom Paris. The home page gives 25-26 January 2020 as the event dates and reports 98 teams, 95 of them ranked, with the champion and the next two teams. Our copy holds 67 pages: the contest description, regulations, registration, a schedule (24 to 26 January, contest on Sunday 26 January), venue, environment (team and judging hardware and software), organizers, media (photos, video links, press review) and past SWERC editions from 1995 to 2018.

    The teams page lists 98 teams from 51 institutions with their members, some shown as anonymous, and 50 institution pages give each institution's historical SWERC standings. The problems page links to the full problem set, test cases and problem analysis for the contest and for a practice contest. The results page links to the scoreboard and to a public contest with the same problems. Two reports of the organizing association are included, an activity report (6 pages) and a financial report (5 pages).

    The problem files, the scoreboard, the videos and the slides linked from the schedule are not in this copy.
