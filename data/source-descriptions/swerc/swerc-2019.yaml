  description: |-
    Standings of the 2019-2020 Southwestern Europe Regional Contest: 95 teams with rank, team, institution, problems solved and total time, plus medal, citation and site citation columns. Gold medals go to two teams, silver to four and bronze to eight; the first 38 teams carry an ordinal place citation (First Place and so on) and the other 57 are marked Honorable mention. EP Chopper from Ecole Polytechnique is first with 11 solved and carries the site citation SWERC Champion. There is no per-problem detail and no count of attempts.
