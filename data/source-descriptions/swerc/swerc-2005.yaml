  description: |-
    Official website of the 2005 Southwestern Europe Regional Contest (SWERC'2005) at Ecole Polytechnique in Palaiseau near Paris, in English, built as frames with a header and a content page; French versions of some pages are included. Our copy holds 49 pages: a welcome page, the tentative schedule (registration on Friday 18 November, practice session on Saturday, the contest on Sunday 20 November from 10:00 to 15:00), team composition, contest environment, conduct, scoring and appeals rules, hotel information and a hotel reservation form with room types and prices, Paris and Polytechnique pages, contact, links to past SWERC sites, ACM sites and problem archive sites, and a ranking page.

    A one-page PDF, the 2005 ICPC Regionals eligibility decision diagram dated 24 July 2005, is linked from the team composition page. The welcome page says the site is still under construction. The ranking page is a board with 55 teams.
