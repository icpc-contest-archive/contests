  description: |-
    Onsite problem set as a PDF of 27 pages, in English. The cover reads "Onsite Contest Problems", sponsored by IBM, hosted by IIT Kanpur, 21st December 2014, 12 Problems. Two pages of instructions follow: twelve problems in five hours, judging with PC², the scoring rule with 20 penalty minutes per rejected run, and the rules for the team reference document. The problems A to L, from A "King's test to his sons" to L "Finding Identity Integers", each have a statement, input and output format and one sample.
