  description: |-
    Standings of the 2014 ACM-ICPC Asia Gwalior Regional Contest: 89 teams with rank, team name, institution, number of problems solved, time, medal, citation and site citation. 82 teams carry a rank, from First Place for the Indian Institute of Information Technology - Hyderabad team Believe (10 solved) down to Honorable Mention; seven teams at the end are unranked and marked Absent with 0 solved. The Time column reads 300 for every team. The Medal column is empty for ranked teams. There is no per-problem detail.
