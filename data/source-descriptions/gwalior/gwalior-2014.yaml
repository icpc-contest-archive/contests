- url: http://www.icpcgwalior.org/
  read: '2026-11-16'
  rubric: 1
  copy: gwalior/gwalior-2014/website/2026-09-05-wayback-4e456cbb
  title: ACM ICPC Gwalior Site 2014
  language:
  - en
  description: |-
    Website of the ACM ICPC Gwalior Site contest of 2014, in English, organised jointly by ABV-Indian Institute of Information Technology & Management, Gwalior and IIT Kanpur. The home page says "Gwalior Site Contest is Over", describes the ACM-ICPC and the Gwalior site, and lists latest updates: the result of the contest, the problems, the result of the preliminary round and the rules for the preliminary round. Other pages give the important dates (registration 20 August to 25 October 2014, preliminary online contest 1 November, Gwalior site contest 19 and 20 December), a registration page that says registration is closed, the organising team, contact details and a login. A rules page says it is under construction.

    Our copy holds 21 files: the site pages, five PDF files (the result PDF is there twice, at two addresses) and a robots.txt. The PDFs are the result of the site contest, the 27-page onsite problem set, a 17-page onsite problem set whose cover says 2013 Kanpur Site, and the list of teams selected through the preliminary round. The home page also links the rules for the preliminary online contest, which are not in our copy. The login page is a form, the registration page only says registration is closed, and one page shows a submitted team registration confirmation.
