    Standings of the 2017 ACM-ICPC Asia Gwalior Regional Contest: 93 teams with rank, team name, institution, number of problems solved, time and a citation from First Place to the ninety-third place. The team LongTimeNoC of the Indian Institute of Technology - Kanpur is first with 8 problems solved. Ranks run from 1 to 93 without ties. There is no per-problem detail.
