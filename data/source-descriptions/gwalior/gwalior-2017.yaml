  contest_date: '2017-12-21'
  description: |-
    Website of the ACM-ICPC Asia Gwalior Regionals 2017, hosted by ABV-IIITM Gwalior, in English. The home page, in three snapshots from 21 to 31 December 2017, describes the ICPC and the Gwalior regional, gives the registration fees in an FAQ, the criteria by which teams were shortlisted for the onsite round, and the dates of the online round (5 November) and the onsite slots for each Indian site. The first two snapshots also give the onsite programme (20 and 21 December 2017, contest day 21 December, at the host campus) and link the online-round results and the onsite schedule on Google Drive. The last snapshot drops the onsite instructions and links the online-round results, a problem statements PDF and a final report PDF of the onsite round; those two PDFs and the Google Drive documents are not in our copy. The home page carries no results table.

    Our copy holds 150 files, but only seven are pages of the contest site: the three snapshots of the 2017 home page, a home page of ICPC Asia Gwalior-Pune Regionals 2018, one of the 2019 regionals, and two PDFs of the 2018 edition (a 4-page location allotment list of teams for Gwalior and Pune, and a 1-page initial registration form). The other files are toy-shop and streaming-spam pages and images from later years, unrelated to the contest.
