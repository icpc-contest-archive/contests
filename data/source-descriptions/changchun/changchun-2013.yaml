  title: The 2013 ACM-ICPC Asia Changchun Regional Contest
  language:
  - zh
  - en
  contest_date: '2013-12-08'
  description: |-
    Website of the 2013 ACM-ICPC Asia Changchun Regional Contest, in Chinese, hosted by Jilin University; our copy holds eight files: the front page, six PDF notices and a Word invitation. The front page, headed as the 38th ACM-ICPC regional contest at Changchun, states that 180 teams (177 official, 111 universities) took part, with three starred teams from Tsinghua, Peking and Ningbo Universities, and gives the medal counts, prize amounts, the dates 7 to 8 December 2013 and the venue at the Jilin University central campus. It also gives the computer environment (Ubuntu 13.10, PC^2 9.2.3, GCC/G++ 4.8.1, Java 1.7), the online qualifier of 28 September 2013 on the HDU online judge, the quota rules, payment and registration deadlines, and links to the other 2013 Asian regionals and to sponsors. The front page also has a block of links for the live ranking, seating plan, photos, problem set and solution reports, and a video replay; these point to files and pages that are not in our copy.

    The PDFs are the first-round on-site quota allocation of 30 September 2013 (3 pages), the final ranking of the online qualifier with 70 universities (2 pages), a registration-progress table of 23 November 2013 (3 pages), a 3-page notice for arriving teams with the draft schedule, hotel prices, travel and registration instructions, a 1-page schedule for 6 to 8 December, and a one-page scan, apparently of the invitation letter. The Word file holds the invitation letter as text.
