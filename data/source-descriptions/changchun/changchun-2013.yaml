  description: |-
    Statement of one problem as a one-page PDF in English, with no problem number, title, letter or contest name printed on it. It opens with a story about a submission that gets TLE (time limit exceeded) and shows the contestant's Java solution and a C++ version, both given as code listings. The task is to speed up that computation, which applies a list of operations (+, -, * and @ with a number) to each of many query values, keeping the value between a minimum and a maximum after each operation, and the shown solutions print the sum of the final values. The page has Input and Output sections, a hint that the shown solution would run for an hour on the test data, and a sample with three test cases and three output lines.
