    Statement of one problem as a one-page PDF in English, with no problem number, title, letter or contest name printed on it. Three countries have base stations on nodes of a tree, and the task is to count, for each query of three base-station nodes, how many nodes each country occupies. The page has Input (up to 10 test cases, N up to 10^5 nodes, M up to 10^5 queries), Output and one sample with two queries.
