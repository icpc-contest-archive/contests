  description: |-
    Scoreboard of the on-site contest, headed ICPC 2013 长春赛区现场赛 排行榜 (ICPC 2013 Changchun regional on-site contest ranking list), stamped 2013/12/8 20:10:18 with a start time of 2013-12-8 09:00. It lists 181 teams with school rank (S#), university, rank, team name, number solved and time, and for each of the ten problems A to J the tries and, for solved problems, the time. Each problem heading also carries two counts, for example 177/219 for A. A legend marks first solves, solved, attempted and pending cells. The page states that 16, 31 and 64 teams receive gold, silver and bronze.

    Three teams carry a star in place of a school rank and are ranked with the others; the second-placed team, Obsidian of 北京大学 (Peking University), is one of them. First place is CamEo of 上海交通大学 (Shanghai Jiao Tong University) with 8 solved and a time of 901.
