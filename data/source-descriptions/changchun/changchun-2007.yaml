  title: 第32届ACM-ICPC亚洲区长春赛区预选赛
  title_en: 32nd ACM-ICPC Asia Regional Changchun Site
  language:
  - zh
  - en
  contest_date: '2007-11-05'
  description: |-
    Website of the Changchun regional of the 2007 ACM-ICPC Asia contest, hosted by Jilin University, in Chinese with an English version of 10 pages. The pages are titled 第32届ACM-ICPC亚洲区长春赛区预选赛 (dì-32 jiè ACM-ICPC yàzhōu qū chángchūn sàiqū yùxuǎnsài, "32nd ACM-ICPC Asia Changchun regional preliminary"). They cover news, an introduction, the organising committee, rules and awards, registration and the rules for selecting teams, the schedule of 3 to 6 November 2007 with the contest on 5 November, the contest environment, travel and lodging, photos, links and contact. The news page records that 65 universities with 102 teams registered for the on-site contest.

    Results inside: a PC² summary of the on-site contest with per-problem columns A to I; a page with the standings of the online preliminary contest, listing 236 teams that solved at least one problem; and a page of universities with the number of on-site teams each may send. The results page itself only says that results follow the contest. Problem statements, videos and spreadsheets linked from the news page are not in our copy.

    About two thirds of our copy (100 of 150 pages) belongs to another event on the same server: the 2007 ACM/ICPC Jilin Provincial Internet Contest, with its announcement, a ranklist of 99 teams (a second block on the same page repeats 21 of them without the solved column), and a photo gallery. The Changchun photo gallery is only partly held (2 index pages and 18 picture pages). No image files are in our copy.
