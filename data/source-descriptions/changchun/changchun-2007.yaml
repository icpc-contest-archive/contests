  description: |-
    Summary produced by PC² (the footer names CSUS PC^2 8.7) for the contest: 109 teams, each shown only by a label such as team72, with rank, number solved, time, one cell per problem A to I and a total of attempts and problems solved. Each problem cell gives the number of attempts and, for a solved problem, the solve time; an unsolved problem shows -- in place of the time. The first team solved 5 problems; 39 teams solved none and share rank 71. A last row gives, per problem, the numbers submitted, first yes and total yes. The footer reads last updated Mon Nov 05 14:26:00 CST 2007. Institutions are not shown.
