  description: |-
    Page of the Changchun regional website headed 网络赛选拔结果 (wǎngluò sài xuǎnbá jiéguǒ, "online contest selection result"), in Chinese. It lists nine rules for choosing the universities and number of teams admitted to the on-site contest from the online qualifier: one team for each of the best-placed 66 universities, extra teams for the top ten universities, for some universities with a women's team, for thirteen universities that reached the World Finals in recent years, and for the hosts of the other mainland China regionals, with at most three teams per university. A table of 66 universities gives the number of teams each may send, from 1 to 3, 101 in all. It lists universities, not teams.
