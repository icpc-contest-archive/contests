  title: 2015 ACM-ICPC Asia Regional Contest (Changchun Site)
  language:
  - zh
  - en
  contest_date: '2015-10-18'
  description: |-
    Website of the 2015 ACM-ICPC Asia Regional Contest (Changchun Site), made by Northeast Normal University, mostly in Chinese. Our copy holds 150 files, 131 of them pages, of which 55 addresses belong to the 2015 contest section. It has an introduction to the contest, the schedule of 16 to 18 October 2015, venue, campus and route guides, hotel information and a hotel booking page, rules, organisation, document downloads, the list of online-round account applications by university, a page of online-round results listing the 101 universities that each win one on-site place, the table of on-site places by university (total 220), and the final ranking of the on-site contest: 220 teams with university, team name and ranks, of which five starred teams have no team rank. A blog of short posts from 18 October 2015 has posts titled for the freeze of the board, the last half hour, the last five minutes and the end of the contest, and several photo posts.

    Three PDFs of the 2015 section are inside: the problem set, a guide to registering for the online round on the ICPC website and the invitation letter. The live ranking board page is in our copy as an empty loading page. The same host also holds the 2012 contest site, the training team's site, a Copenhagen cooperation project site and an online judge, which are in the same copy.
