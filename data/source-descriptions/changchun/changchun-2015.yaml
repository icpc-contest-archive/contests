    Contest dashboard on the QOJ.ac online judge, in English, filed under ICPC / Regionals / Asia East Continent / Changchun. It lists 13 problems labelled A to M, among them "Almost Sorted Array" (F) and "Security Corporation" (M), each linking to its problem page on the judge, and gives the contest settings (ICPC ruleset, 20-minute penalty, scoreboard frozen after 4:00:00). Attachments named "Statements (en)" and "Tutorials (en)" are linked for download; the statements themselves and the standings are on other pages of the judge, outside our copy. The notice and question boxes are empty.
