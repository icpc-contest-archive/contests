  description: |-
    Scoreboard of the on-site contest, headed ICPC 2015 长春赛区现场赛 排行榜 (ICPC 2015 Changchun regional on-site contest ranking list), stamped 2015/10/19 22:29:53 with a start time of 2015-10-18 09:00. It lists 220 teams with school rank (S#), university, rank, team name, number solved and time, and for each of the thirteen problems A to M the tries and, for solved problems, the time. Each problem heading also carries two counts, for example 7/160 for A. A legend marks first solves, solved, attempted and pending cells. The page states that 22, 44 and 66 teams receive gold, silver and bronze.

    Five teams carry a star in place of a school rank: one from South China University of Technology, ranked second, and four from a high school attached to Northeast Normal University. Starred teams are ranked with the others. First place is 爬 (Crawl) of 北京大学 (Peking University) with 8 solved and a time of 868.
