    Problem set of the contest as a 26-page PDF in English with thirteen problems, A to M, the last being Security Corporation. Each page carries the running title The 2015 ACM-ICPC Asia Changchun Regional Contest. Each problem has a statement with a time limit, the colour of its balloons, input and output format and one sample. Ten of the 26 pages are blank pages marked as left blank, including the last one.

    The PDF has no cover page: problem A starts on the first page, and the only identification is the running title.
