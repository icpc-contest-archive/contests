  description: |-
    Final standings of the contest: 172 teams with rank, team name, institution, number of problems solved, time and a citation. The citation is the place name (First Place, Second Place and so on, down to Eighty-sixth Place), and the last 21 teams, ranked 87, are marked Honorable Mention. First place is SYSU_BlackBlade of Zhongshan (Sun Yat-sen) University with 8 solved and a time of 1134. There is no per-problem detail.
