  - en
  description: |-
    Website of Northeast Normal University's ACM team, in Chinese with some English. Our copy holds 150 files, 130 of them pages. The core is the site of the 2012 ACM-ICPC Asia Regional Contest (Changchun Site): an introduction to the contest, venue and campus and route guides, hotel information, schedule, rules, organisation, document downloads, the result of the online round, the on-site quota table by university, a list of award winners with institution and team name, and a news blog with posts from the contest day.

    The same host holds other material: the site of the 2015 Changchun regional (rules, venue, hotel, online-round results, on-site quota table and final ranking of that year), a Copenhagen cooperation project site with four PDFs, the university's ACM training team site with its results of other contests, and pages of an online judge. The seed page of our copy is one of the Copenhagen project pages, not a page of the 2012 contest.

    A realtime ranking board page is also in our copy; it is headed 2015 ACM-ICPC Asia Regional Contest (Changchun Site) and holds only placeholder fields, no results. A separate PC^2 summary page, last updated 22 April 2012, lists 142 teams with solved count, time and tries per problem for twelve problems A to L.
