  description: |-
    Scoreboard of the on-site contest, headed ICPC 2012 长春赛区现场赛 排行榜 (ICPC 2012 Changchun regional on-site contest ranking list), stamped 2012-10-15 10:54 with a start time of 2012-10-14 09:00. It lists 180 teams with school number, university, rank, team name, number solved and time, and for each of the eleven problems A to K the tries and, for solved problems, the time. Each problem heading also carries two counts, for example 6/128 for A. A legend marks first-to-solve, solved, attempted and pending cells. The page states that 17, 35 and 51 teams receive gold, silver and bronze, and the school-number cells of those teams are coloured accordingly.

    Eight teams carry a star in place of a school number and are ranked with the others; the second-placed team, Mithril of Shanghai Jiao Tong University, is one of them. First place is SYSU_BlackBlade of 中山大学 (Sun Yat-sen University) with 8 solved and a time of 1134.
