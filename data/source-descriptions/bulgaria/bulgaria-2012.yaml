  contest_date: '2012-05-12'
  description: |-
    Website of the 24th Republican Student Olympiad in Programming, in Bulgarian, hosted by the Burgas Free University. The home page says the contest was held there on 12 May 2012 for students of universities in Bulgaria, with pupils from Burgas and Varna taking part alongside. It links to the invitation and programme (a 2 page PDF), the problem statements (11 pages), the ranking by university and of all teams (2 pages), a ZIP of the authors' solutions and tests, an archive of the contest system, a transport map and a screenshot of the olympiad's first web page. A later version of the home page, headed 11 - 12.05.2012, has a menu (accommodation, regulations, programming environments, participants, tasks, ranking, photos, archive) and a list of documents. Pages saved in March 2012 hold the invitation to universities, a list of hotels in Burgas, the regulations, the programming environments and contest system (SPOJ0) and a list of earlier host universities from 1998 to 2011.

    Our copy holds 150 files. Besides the pages of this edition (two versions of the home page, the three PDFs, the ZIP, the March 2012 pages and images) it holds pages of other editions of the contest and of the bcpc.eu root, which are not part of this edition's site. The menu addresses for regulations and classification return the home page again, the photo page is a bot-check page, and the archive of the contest system was not saved.
