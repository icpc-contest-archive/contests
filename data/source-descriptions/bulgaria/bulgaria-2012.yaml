  description: |-
    ZIP archive of 39 files with the solutions and test data of the contest. For each of the tasks A to K it holds a C++ source file (.cpp), an input file (.in) and an output file (.out). The rest are a file named c.contestant.out, two batch files for testing tasks B and C, and three short text files for tasks F, H and K in Bulgarian. There is no write-up explaining the solutions.
