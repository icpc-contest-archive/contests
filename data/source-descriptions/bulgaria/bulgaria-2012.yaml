  description: |-
    Problem set in a PDF of 11 pages, in Bulgarian, one problem per page, A to K. Each page repeats a header with the contest name, the dates 11 to 12 May 2012, Burgas Free University as place, and the names of the university, the Municipality of Burgas, MusalaSoft and Telerik. Every problem has a statement and a sample input and output. Most give the input and output format under their own headings; problem F gives them in the running text and problem G has none. Problem I has a sample with an explanation. No test data or solutions.
