  description: |-
    Final standings page of the contest, in two parts. The first is the official ranking by university: 11 universities with rank and, for ten of them, the three members of the team that counted. The second is the scoreboard of all teams, produced by CSUS PC^2 9.1.6, with 28 teams: rank, team name (a short code such as SU2 or NBU1, without institution), problems solved, time, attempts and solve time for each of the problems A to M, and attempts over solved in the last column. The first two teams solved 8 problems; 23 teams solved at least one problem and the other five share rank 24. A last row gives per-problem totals headed "Submitted/1st Yes/Total Yes". The page states it was last updated on 14 May 2011.
