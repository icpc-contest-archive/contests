  description: |-
    Website of the XXIII Republican Student Olympiad in Programming, also titled Bulgarian Collegiate Programing Contest, 13 to 14 May 2011, hosted by Shumen University "Episkop Konstantin Preslavski" and its Faculty of Mathematics and Informatics. It is in Bulgarian. The front page lists the organising committee, an archive of the olympiad's hosts from 1998 to 2010, and an invitation saying that for the first time the olympiad is an official first stage (subregion) of the ACM International Collegiate Programming Contest.

    Ten pages belong to this edition: home, programme (arrival on 13 May, contest on 14 May from 10:00 to 15:00, prize-giving, an excursion on 15 May), accommodation, participants (11 universities), teams (27 teams with coach, university and team members, usually three), problems, photos, regulations, programming environments (PC^2 is the grader) and classification. The problems page links 13 RAR archives, A to M; each holds the statement in Bulgarian and in English as Word files and one input and one output file. The classification page holds the ranking of 11 universities and the scoreboard of 28 teams. Two PDFs are saved: the invitation and the programme.

    Our copy has 150 files; many pages are saved several times under http, https and www addresses. It also holds a few pages of the next edition (12 May 2012) and some pages that show only a "One moment, please" verification notice, which are not site content. The photo gallery is there as 34 photographs; the archive of all photos was not saved.
