    Problem set as a PDF of 12 pages, in Bulgarian, with eleven problems with English titles: A Info board, B Escape, C Elections, D Network, E RPG, F Olympiad, G Snakes, H Kriminalna, I Periodic, J Towers and K Slang. Each problem has a statement with input and output sections and a sample input and output; all but problems C and D also have a constraints section; the footers name the XXV Jubilee Republican Student Olympiad, Sofia, 18.05.2013. The contest's tasks page lists this file as the test session (Тестова сесия, "test session"). Its text is the same as the other problem set PDF of this contest except for a few sample lines. No test data or solutions.
