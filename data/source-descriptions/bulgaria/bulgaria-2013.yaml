  read: '2026-11-16'
  rubric: 1
  copy: bulgaria/bulgaria-2013/website/2026-09-03-wayback-65f5852b
  title: XXV РЕПУБЛИКАНСКА СТУДЕНТСКА ОЛИМПИАДА ПО ПРОГРАМИРАНЕ
  title_en: 25th Republican Student Olympiad in Programming
  language:
  - bg
  description: |-
    Website of the 25th (jubilee) Republican Student Olympiad in Programming, in Bulgarian. The home page invites participants to the contest on 17 and 18 May 2013 at the National Palace of Culture in Sofia, hall 8, names New Bulgarian University, Sofia University and the Technical University of Sofia as hosts, lists the organisers and sponsors, and lists the five previous editions (2008 to 2012), with a link to an archive page of hosts from 1998 to 2012. Further pages give the programme (registration on 17 May, contest on 18 May from 10:00 to 15:00, awards at 15:30), the regulations, the programming environments (PC^2 as contest system), the list of registered teams, the tasks and the results. An invitation and a one page greeting from the President of Bulgaria are PDFs on the site.

    The results are on two pages: the ranking by university and a full scoreboard of 26 teams. The tasks page links to two PDFs with the eleven problems A to K.

    Our copy holds 150 files: nine pages of this edition, four PDFs, and logos and photos. It also holds pages of other editions of the contest and of the bcpc.eu root. The photo gallery links lead outside it, and the photo archives are not in it.
