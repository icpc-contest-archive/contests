  title: Основной тур — Четвертьфинал 2019
  title_en: Main round - Quarterfinal 2019
  language:
  - ru
  contest_date: '2019-10-26'
  description: |-
    Website of the 2019 quarterfinal of the ICPC world programming championship, run by the Ural Federal University in Ekaterinburg, in Russian. The front page reports that the main round took place on 26 October 2019 with 102 teams from 36 institutions in 21 cities, gives the diploma thresholds (4 solved problems for third degree, 5 and 6 for second, 7 and 8 for first) and names the teams advancing to the semifinal. Other pages hold the competition rules, the substitution rules, the schedule (registration and practice round on 25 and 26 October, main round 14:00 to 19:00, awards ceremony), and the list of teams invited to the main round together with a decision disqualifying three pairs of teams from the qualification round for identical submitted solutions.

    The qualification section covers the round of 5 October 2019: sites in 16 cities, selection rules, a newcomers' explainer, the Ural Federal University championship, the college tournament and a jury report on technical problems with the judging queue during the qualification. Links to earlier and later seasons are in the navigation.

    Our copy holds 51 saved files: 46 HTML pages, which are 15 distinct pages saved as https, http and print versions (the front page also at the bare directory address), plus five images. The links to the standings of the main round and of the qualification, and to the college and university championship results, lead to pages that are not in our copy. The participants pages of the main round and of the qualification are a heading without a list.
