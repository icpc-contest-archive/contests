  read: '2026-11-16'
  rubric: 1
  copy: urals/urals-2021/website/2026-09-05-live-94d73890
  title: Основной тур — Четвертьфинал 2021
  title_en: Main round — Quarterfinal 2021
  language:
  - ru
  contest_date: '2021-12-11'
  description: |-
    Website of the Ural Regional Contest 2021 on the Ural Federal University's programming-contests site, in Russian. The main page states that the main round was held online on 11 December 2021 after a qualification round, and lists the 21 teams that advanced to the semifinal of the world championship. Other pages hold the rules, the rules for team substitutions, the timetable of the contest day (opening ceremony, practice round, main round and closing ceremony, in Ekaterinburg time), the winners and prizewinners by diploma degree, and the organizing committee with sponsor logos. A qualification section covers the round held on 17 October 2021 with 264 teams from 28 institutions: selection rules, schedule, the list of teams admitted to the main round and a list of 25 teams that the jury found to have passed their solution to another team or submitted someone else's code. A colleges tournament page includes a results table of 14 teams with problems A to K.

    Our copy holds 54 files: 50 HTML pages, many of them the same page repeated as a print version or under an http address, and four sponsor logo images. The full main-round results, the qualification results and the certificates are linked from these pages but are not in our copy; the problem statements and the editorial are linked to another site.
