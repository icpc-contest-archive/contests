  description: |-
    Final scoreboard of the 2021-2022 Ural Regional Contest: 99 teams, fourteen problems A to N. Each team row gives rank, team name with the surnames of its members, for each problem the outcome (an accepted run with the number of earlier rejected runs and the time, a count of rejected runs without acceptance, or a dot for no runs), the number of problems solved and the penalty time. The clock reads 5:00:00 of 5:00:00 and the status is over. The first place is Ural FU: The Last Dance with 11 problems. Below the teams are summary rows per problem: total runs, accepted, rejected, first accept and last accept. Cells holding the first accepted solution of a problem carry a first-to-solve mark, and a Show time checkbox hides or shows the times. Team names are not marked as official or unofficial.
