  description: |-
    Website of the 2013 quarterfinal of the world programming championship for the Eastern (Ural) subregion, published by Ural Federal University in Yekaterinburg, in Russian. Our copy holds 19 saved pages: six distinct pages (general information, timetable, rules, list of participants, results, a page of sights in Yekaterinburg), the rest being print versions and http copies of them.

    The general information page gives the event days as 24 to 27 October 2013, the registration deadlines of 12 and 17 October, accommodation and the organising committee. The timetable puts the opening and a practice round on 25 October and the main round on 26 October 2013, followed by the discussion of problems and a closing buffet. The rules page sets out the contest rules, the organising committee and who may take part. The results page is a standings table with a per-problem grid for problems A to J. Links to an information letter PDF and a photo gallery lead to files that are not in our copy, and the list of participants page is empty in our copy.
