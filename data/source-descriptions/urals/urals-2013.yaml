    Final scoreboard of the Eastern Subregional 2013, with the contest clock at 5:00:00 of 5:00:00 and status over: 43 teams and ten problems A to J. Each row gives the rank, the team name with institution and member names, a cell per problem, the number of problems solved (=) and the time. A cell with a plus sign gives the number of rejected runs before the accepted one, when there are any, and the time of the accepted run; a cell with a minus sign gives the number of rejected runs on an unsolved problem; a dot marks a problem with no runs.

    The team in first place is Ural FU 1 with 10 problems solved and a time of 985. One of the 43 rows is a team marked with an asterisk as unrated, and it still carries a rank in the table. Summary rows at the bottom give, for each problem, the total runs, accepted and rejected runs, and the times of the first and last accepted run.
