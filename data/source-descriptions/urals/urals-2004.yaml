  description: |-
    Archive site of the Northern Eurasia (NEERC) contests, in English; the standings pages are in Russian. Its 2004 page lists the finals (standings, problems in PDF, jury archive, history files, runs, picture galleries) and the regional contests, among them Ural with three standings pages: the final standings of the VIII Ural Championship in programming, and the standings of day 1 and day 2. The day pages list three team members' names next to each team.

    Our copy holds 150 pages, many of them the same page saved under http and https addresses. Besides the Ural pages it has the standings of the other 2004 regional contests, the standings of the 2004 finals, the 2004 finals problems as a PDF of 14 pages, the corresponding pages for 2005, and yearly index pages for other years. Ural has no problem statements or other material of its own in our copy. The links to the jury archives, runs, history files and picture galleries are not part of it.
