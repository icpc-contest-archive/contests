  title: Основной тур — Четвертьфинал 2018
  title_en: Main round - Quarterfinal 2018
  language:
  - ru
  contest_date: '2018-10-27'
  description: |-
    Website of the 2018 quarterfinal of the ICPC world programming championship, run by the Ural Federal University in Ekaterinburg, in Russian. The front page reports that the main round took place on 27 October 2018 with 88 teams from 35 institutions in 19 cities, lists the diploma thresholds (5 solved problems for third degree, 6 and 7 for second, 8 for first) and names the teams advancing to the semifinal. Further pages hold the competition rules, the substitution rules, the schedule (registration and practice round on 26 and 27 October, main round 14:00 to 19:00, awards ceremony), the list of teams invited to the main round, and a section on the qualification round of 6 October 2018 (sites, selection rules, a newcomers' explainer, the college tournament and the Ural Federal University championship held alongside it). The navigation also links to earlier and later seasons of the quarterfinal.

    Our copy holds 43 saved pages: 14 distinct pages, each saved as https, http and print versions, plus the front page saved a fourth time at the bare directory address. The links to the standings of the main round and of the qualification, and to the college and university championship results, lead to pages that are not in our copy. The participants pages of the main round and of the qualification are a heading without a list.
