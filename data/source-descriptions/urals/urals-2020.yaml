  read: '2026-11-16'
  rubric: 1
  copy: urals/urals-2020/website/2026-09-05-live-9d0b4dff
  title: Основной тур — Четвертьфинал 2020
  title_en: Main round - Quarterfinal 2020
  language:
  - ru
  contest_date: '2020-11-14'
  description: |-
    Website of the 2020 quarterfinal of the ICPC world programming championship, run by the Ural Federal University, in Russian. The front page says the main round took place on 14 November 2020 in remote format, lists the teams advancing to the semifinal and links to the contest monitor on another server. Other pages hold the competition rules, the substitution rules, the schedule (all events online on 14 November: opening ceremony, practice round, main round, problem discussion, closing ceremony), and the list of teams invited to the main round, preceded by a note on teams found to have submitted other teams' solutions and barred from the main round. A section on the qualification round of 11 October 2020 (315 teams) holds the selection rules, a newcomers' explainer, the Ural Federal University championship and the college tournament, whose results page is a scoreboard of 33 teams with problems A to K. The newcomers' explainer still speaks of the 2019/2020 semifinal in December 2019.

    Our copy holds 45 saved files: 43 HTML pages, which are 14 distinct pages saved as https, http and print versions (the front page also at the bare directory address), plus two images. The main round standings, the qualification standings, and the certificate, diploma and qualification statement and editorial PDFs linked from the pages are not in our copy. The participants pages of the main round and of the qualification are a heading without a list.
