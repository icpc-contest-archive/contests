  description: |-
    Final scoreboard of the contest at 5:00:00 of 5:00:00, status over: 69 team rows and fourteen problems labelled A to N, with the problem names shown as tooltips on the column letters. Each row gives rank, one team entry written as institution, team name and three member names, and for every problem a dot (no attempt), a plus sign with the number of rejected attempts and the time of the accepted run, or a minus sign with the number of rejected attempts on an unsolved problem, followed by the number solved and the penalty time. The first place solved 12 problems. A checkbox switches the solve times on and off and the first accepted run of each solved problem is shaded.

    Below the teams, rows give for each problem the total runs, accepted, rejected, and the times of the first and last accepted run. Three rows share rank 67 with no problem solved; one of them is an entry named "* Team ekb700" without members.
