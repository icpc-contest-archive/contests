  description: |-
    Page of the 2026 qualification section, in Russian, listing the teams invited to the main tour of the Ural Regional Contest, each as institution, team name and members. The teams are grouped by the selection rule that admits them: the best team of each institution, the best second and third teams, the first ten teams from the waiting list, the teams from the Yekaterinburg qualification, and wildcards. A section on disqualifications names one team disqualified after the qualification for using additional electronic devices. The page also gives the deadline of 8 November 2026 for teams to confirm participation, asks coaches and guests to fill an additional form, and notes that the main-tour problems are in English.
