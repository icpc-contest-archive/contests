  title_en: Main tour — Quarterfinal 2026
  language:
  - ru
  - en
  contest_date: '2026-11-14'
  description: |-
    Website section of the Ural Federal University quarterfinal site for the 2026 Ural Regional ICPC Championship, in Russian. The main-tour page announces the contest for 14 November 2026 and says that a team must pass the qualification round to take part. Further pages give the contest rules, the substitution rules, the selection rules, and a timetable for 14 November 2026 at an address in Yekaterinburg. Our copy also holds 54 pages of the Northern Eurasia regional contest site, in English, among them its Ural page, the standings of the main tour and Ural standings of earlier years.

    The qualification has its own pages: rules, timetables, two qualification standings tables (one with teams from the regions, one with Yekaterinburg teams), the colleges tournament, the UrFU championship, the list of teams admitted to the main tour, and PDFs of the qualification statements (16 and 18 pages), tutorials (9 and 8 pages) and certificates for 10 and 31 October 2026. The list of admitted teams asks teams to confirm participation by 8 November 2026 and coaches and guests to fill an additional form. Statements and tutorials of earlier seasons are also in our copy.

    The winners page still describes the 2025 contest, and the colleges tournament page carries the same text as the 2025 site. The participant lists are empty in our copy, because a script fills them in.
