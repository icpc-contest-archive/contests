  title: Четвертьфинал 2016
  title_en: Quarterfinal 2016
  language:
  - ru
  contest_date: '2016-10-22'
  description: |-
    Website of the 2016 quarterfinal of the world programming championship, held at Ural Federal University in Yekaterinburg, in Russian. The front page reports that the main round was held on 22 October 2016 with 87 teams from 36 universities and branches in 22 cities, explains the diplomas by number of problems solved, and lists the 23 teams that advanced to the semifinal. A notice says the solutions were re-checked after the checker for problem J worked incorrectly and an updated results table was posted.

    Other pages cover the rules, the rules for team substitutions, technical information, the timetable (arrival on 21 October; on 22 October registration, opening, a practice round, a master class for beginning coaches, the five-hour main round from 14:00 to 19:00 and the closing ceremony), hotels in Yekaterinburg with addresses and prices, the qualification round of 8 October 2016 (340 teams from 43 universities at 19 sites, 90 teams passing) with its selection rules, an introduction for beginners, and the university's open team championship held with the qualification.

    Our copy holds 14 distinct pages (43 page files with print versions and http duplicates). The results pages, the problem statements PDF, the photo galleries and the qualification results are linked but not in it (their fetch timed out). The registration page and the participant pages hold only an empty frame that a script fills from another server, so no team list appears.
