  description: |-
    Website of the Ural student programming competitions, in Russian. Our copy holds 150 files of the whole site, 128 of them pages, from many years: history pages (the Ural federal university and other Ural universities at ICPC semifinals and finals, school teams), the pages of the 1999 championship, and 2020 pages. The part for this edition is the site of the Second Ural Team Programming Championship, held at Ural State University on 3-4 April 1998 and recognised as a quarterfinal of the world championship.

    Its pages are the announcement, rules, a list of the 27 registered teams with their members, a problems page, the results, photos and the organising committee. The results page holds the final protocol of 27 teams over seven problems A to G, with for each team and problem a mark ('.', '+' or '-', with a number on some), the number of problems solved and the time; the first place, Ural State University team 2, solved four problems.

    The problems page links to an archive of the problems (Problems.rar), which is not in our copy. The photos page shows 11 thumbnails, of which only one image file is in our copy.
