  description: |-
    Final scoreboard of the Urals Subregional Contest, 5:00:00 of 5:00:00 elapsed with status over: 87 teams against 12 problems labelled A to L, with the problem names shown as tooltips on the column heads. Each team row gives rank, the team name with institution prefix and the three members' surnames, then per problem either a plus with the minute of the accepted run (a number after the plus counts earlier rejected runs), a minus with the number of rejected runs, or a dot for no attempt, followed by problems solved and penalty time. Ural FU: Kek is first.

    Ranks run from 1 to 85, with the last place shared by three teams that solved nothing. No team solved problems D and F. Rows at the foot give totals per problem for runs, accepted, rejected, first accept and last accept. A checkbox hides or shows the times. All rows are in one table without marks for unofficial teams. The heading prints the season as 2017-2017.
