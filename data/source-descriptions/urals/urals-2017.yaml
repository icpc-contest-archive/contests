  title_en: Quarterfinal 2017
  language:
  - ru
  contest_date: '2017-11-04'
  description: |-
    Website of the 2017 quarterfinal of the world programming championship, held at Ural Federal University in Yekaterinburg, in Russian. The front page reports that the main round was held on 4 November 2017 with 85 teams from 32 universities and branches in 21 cities, explains the diplomas by number of problems solved, and lists the 26 teams that advanced to the semifinal. The qualification figures are 333 teams from 38 universities, 79 passing and 9 more admitted as wildcards.

    Other pages cover the rules, the rules for team substitutions, the timetable (3 to 5 November, with the five-hour main round from 14:00 to 19:00), the qualification round of 30 September 2017 held at 18 sites with its selection rules and a per-site timetable, and an introduction for beginners. One page lists the 88 teams admitted to the main round, and another reports the open team championship of the university held with the qualification, with 83 teams.

    Our copy holds 14 distinct pages (43 page files with print versions and http duplicates). The results pages and photo galleries are linked but not in it (their fetch timed out); the links to problem analyses lead to other sites. The registration pages hold only an empty frame, and the participant pages a heading and such a frame, filled by a script from another server, so no team list appears on them.
