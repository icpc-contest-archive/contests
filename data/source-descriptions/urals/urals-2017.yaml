    Problem set as a PDF of 12 pages in English, with 'ICPC 2017–2018, NEERC, Northern Subregional Contest' and 'St Petersburg, November 4, 2017' as the header of every page. It holds 12 problems labelled A to L, from Auxiliary Project to Little Difference. Each statement gives the input and output file names, a time limit of 3 seconds and a memory limit of 512 megabytes (the same in all 12), the input and output format, and examples.

    The header names the Northern Subregional Contest held in St Petersburg; the Urals Subregional is not named anywhere in the document. There are no solutions or test data.
