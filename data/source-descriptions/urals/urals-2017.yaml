    Final standings of the 2017 Urals Subregional Contest, ICPC year 2018: 85 teams with rank, team name, full institution name, number of problems solved, total time and a citation. The top 42 rows carry place citations from First Place to Forty-second Place; the other 43 teams are listed as Honorable Mention, one of them with no problem solved. Ranks run from 1 to 85; rank 73 is shared and every other rank is held by one team.

    Ural FU: Kek of Ural Federal University is first with 10 problems and 1070 minutes, followed by Perm SU: Fire Mind with 8 and Ural FU: Let's play qual/qf/sf with 8. There is no per-problem detail.
