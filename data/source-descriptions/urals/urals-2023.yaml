  description: |-
    Website of the Ural regional contest of the ICPC (2023), run by Ural Federal University, in Russian, under the heading "Основной тур — Четвертьфинал 2023" (Main round, quarterfinal 2023). The front page states that the contest took place on 5 November 2023, lists 22 teams congratulated for advancing to the semifinal, and names the organising committee. Menus lead to the rules, substitution rules, timetable, participant list, results, winners and prizewinners, problem statements and problem analysis, and to a qualification round, a colleges tournament and a university championship of the same season.

    Our copy holds 40 pages, 13 distinct ones plus print-version and http/https duplicates: the main round front page, rules, substitution rules, timetable, participants page and the winners and prizewinners page, and the qualification section (general information with the number of qualification teams, selection rules, participants page, timetable, the list of teams invited to the main round, colleges tournament, university championship). The participants pages of both rounds have a heading but no team list in our copy, and the pages linked for the full results, problem statements and problem analysis are not part of this copy.
