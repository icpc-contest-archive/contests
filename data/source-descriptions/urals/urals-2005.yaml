  description: |-
    Archive site of the Northern Eurasia (NEERC) contests, in English; the Ural standings pages are headed in Russian and in English. Its 2005 page lists the finals (standings, problems in PDF and PostScript, tests and jury solutions, history files) and the regional contests, among them Ural with three standings pages: the combined table of the IX Ural Championship, the Russian day and the English day. The round pages have 53 team rows each, with problems A to J in the Russian round and A to K in the English round.

    Our copy holds 150 pages, many of them the same page saved under http and https addresses. Besides the Ural pages it has the standings of the other 2005 regional contests, the standings of the 2005 finals and their problems as a PDF, the corresponding 2006 pages (including a problems PDF of a 2006 regional contest), and yearly index pages for other years. Ural has no problem statements of its own in our copy. The links to jury solutions, tests and history files are not part of it.
