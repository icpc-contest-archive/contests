  contest_date: '2007-10-27'
  description: |-
    Website of the 2007 quarterfinal of the ICPC programming championship for the Ural region, in Russian, a section of a larger site about the Ural programming contests; the sponsor named is the company SKB Kontur. The general information page says the quarterfinal was held on 26-27 October 2007, that the teams chosen there would represent the Ural region at the semifinal in St Petersburg on 28 November 2007, and lists the 15 teams that advanced. An online contest ran alongside, with its problems in the Timus Online Judge archive as numbers 1582 to 1592. The page also names the organising committee and the programme committee.

    The other pages are the timetable (registration and a practice round on 26 October, the main round on 27 October from 9:00 to 14:30, problem discussion, closing, awards and a reception), the application form for teams (registration closed on 24 October 2007), and suggestions for free time in Yekaterinburg. A blank service contract in RTF format sets the fee at 2,500 rubles per team for the quarterfinal.

    Our copy holds 15 files: 13 pages, the contract and one image, which are four distinct pages with their print versions, some saved under both http and https. The links to the list of participants, the results table, the information letter and the second contract (cash payment) lead to files that are not in our copy.
