  title: Общая информация — Четвертьфинал 2010
  title_en: General information — Quarterfinal 2010
  language:
  - ru
  contest_date: '2010-10-30'
  description: |-
    Website of the 2010 quarterfinal of the world programming championship (Четвертьфинал 2010, "Quarterfinal 2010"), in Russian, listing sponsors. The front page gives the event as 28 to 31 October 2010 at the Ural State University, lists the 15 teams chosen to represent the Eastern subregion at the semifinal in St Petersburg on 22-25 November 2010, mentions an online contest held alongside the on-site one, and says the problems are in the Timus Online Judge archive as numbers 1800 to 1809. It links to the problems, the full results, a photo gallery and a photo report.

    The timetable puts the main round on 30 October 2010 from 10:00 to 15:30, with arrival on 28 October, registration, opening and a practice round on 29 October, problem analysis and closing on the afternoon of the 30th, and departure on 31 October. Further pages hold the contest rules, technical information (Visual Studio 2010 and Eclipse Helios with JDK 1.6, input and output through input.txt and output.txt, 64 KB source limit, 64 MB memory limit), a table of 18 universities with the number of teams each requested (45 in total) and whether the organisers arrange accommodation, the application form, and suggestions for sights in Ekaterinburg.

    Our copy holds 24 files: seven distinct pages, each also saved as a print version, and two images (sponsor logos). The participant list, the results, the photo galleries, the problems PDF and the information letter are linked from the pages but are not in our copy.
