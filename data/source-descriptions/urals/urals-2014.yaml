  description: |-
    Final scoreboard with the contest clock at 5:00:00 of 5:00:00 and status over: 124 teams and twelve problems A to L. Each row gives the rank, the team name (mostly prefixed by an institution abbreviation) with the surnames of its three members, a cell per problem, the number of problems solved (=) and the time. A cell with a plus sign gives the number of rejected runs before the accepted one, when there are any, and the time of the accepted run; a cell with a minus sign gives the number of rejected runs on an unsolved problem; a dot marks a problem with no runs.

    The team in first place is Ural FU: Bear companions with 10 problems solved and a time of 938. Summary rows at the bottom give, for each problem, the total runs, accepted and rejected runs, and the times of the first and last accepted run; problem E has no runs at all, and problem K has 6 runs and none accepted.
