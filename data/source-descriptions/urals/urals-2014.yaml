  contest_date: '2014-10-11'
  description: |-
    Website of the 2014 quarterfinal of the world programming championship for the Eastern (Ural) subregion, published by Ural Federal University in Yekaterinburg, in Russian. Our copy holds 28 saved pages: nine distinct pages (general information, rules, technical information, registration, list of participants, two timetables, accommodation in Yekaterinburg, a page of sights in Yekaterinburg), the rest being print versions and http copies of them.

    The general information page says the contest ran from 9 to 12 October 2014 at two sites, Ural Federal University in Yekaterinburg and Izhevsk State Technical University in Izhevsk, and lists 22 teams that advanced to the semifinal. The timetables for both sites put the main round on 11 October 2014, after registration, an opening and two practice rounds on 10 October. The technical information page lists the computers, software, languages and compiler command lines.

    The results page and the photo gallery are linked from the menu but are not in our copy, and the list of participants page is empty in our copy.
