  description: |-
    Website of the 2006 quarterfinal of the ICPC programming championship for the Ural region, in Russian, a section of a larger site about the Ural programming contests; the sponsor named is the company SKB Kontur. The general information page says the quarterfinal was held on 27-28 October 2006, that the teams chosen there would represent the Ural region at the semifinal in St Petersburg on 27-29 November 2006, and lists the 12 teams that advanced. An online contest ran alongside, with its problems in the Timus Online Judge archive as numbers 1500 to 1510.

    The other pages are the timetable (registration and a practice round on 27 October, the main round on 28 October from 9:00 to 14:30, problem discussion, closing and awards), a table of the 46 teams that applied, by 21 universities, the application form, and suggestions for free time in Yekaterinburg.

    Our copy holds 17 files: 16 pages and one image, which are five distinct pages with their print versions, some saved under both http and https. The links to the list of participants, the results table, the photo gallery and the online results lead to pages that are not in our copy.
