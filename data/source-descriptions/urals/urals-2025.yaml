  description: |-
    Short winners page of the contest website, in Russian: one sentence stating that the first-degree diploma of the Ural Regional ICPC Championship 2025 goes to the team Ural FU: looks like a team name, with its three members named. The page has the heading "Победители и призеры" ("Winners and prize-winners") but gives no second or third place and no results table. The page carries the site's menus and states that it was updated on 19 November 2025.
- url: https://nerc.itmo.ru/archive/2025/northern/statements.pdf
  read: '2026-11-16'
  rubric: 1
  copy: urals/urals-2025/problemset/20261102-live-b9a12800/statements.pdf
  title: ICPC 2025–2026 Northwestern Russia Regional Contest
  language:
  - en
  contest_date: '2025-11-15'
  problems: 12
  pages: 13
  description: |-
    Problem set as a PDF of 13 pages in English, with the running header "ICPC 2025–2026 Northwestern Russia Regional Contest, St Petersburg, November 15, 2025". It holds twelve problems A to L, from Asynchronous Processor to Lucky Number Theory, in the same order and with the same names as the Ural scoreboard. Each problem has a statement with time and memory limits and one or more examples; eleven have input and output sections. Problem E is interactive and has an interaction protocol section in place of an output section.

    The set is headed with the Northwestern Russia contest; the Ural contest is not named in the document.
