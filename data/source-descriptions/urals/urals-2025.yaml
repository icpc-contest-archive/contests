- url: https://sp.urfu.ru/qf/2025/index.html
  read: '2026-11-16'
  rubric: 1
  copy: urals/urals-2025/website/2026-09-05-live-73b00ff1
  title: Уральский региональный чемпионат ICPC 2025
  title_en: Ural Regional ICPC Championship 2025
  language:
  - ru
  contest_date: '2025-11-15'
  description: |-
    Website section of the Ural Federal University programming-contest site (Четвертьфинал 2025, "Quarterfinal 2025"), in Russian. The main-tour page reports that the Ural Regional ICPC Championship 2025 was held on 15 November 2025 with 74 teams from 17 institutions in 12 cities, explains the diploma levels by number of problems solved, and lists the teams that advance to the semifinal of the world student championship. Further pages hold the contest rules, the substitution rules, the timetable, a winners page and a link to the standings on another server.

    The qualification round has its own pages: general information (held 18 October 2025, 320 teams from 20 institutions in 13 cities), selection rules for the main tour, timetable, the list of teams admitted to the main tour, the colleges tournament (46 teams) and the UrFU team championship (66 teams). Menus link to the sites of earlier seasons back to 1998.

    Our copy holds 13 distinct pages, each also saved in print format and over plain http, and four image files (logos); the site's style sheet is not in our copy. The participant lists of the main tour and of the qualification are empty in our copy, because they are filled in by a script from another server.
