  read: '2026-11-16'
  rubric: 1
  copy: urals/urals-2025/scoreboard/20260904-live-d2cf1a0e/standings.html
  title: ICPC 2025–2026, Ural Regional Contest
  language:
  - en
  teams: 74
  problems: 12
  times: true
  tries: true
  description: |-
    Final scoreboard of the contest at 5:00:00 of 5:00:00, status over: 74 teams and twelve problems labelled A to L, with the problem names shown as tooltips on the column letters. Each team row gives rank, one team entry written as institution, team name and three member names, and for every problem a dot (no attempt), a plus sign with the number of rejected attempts and the time of the accepted run, or a minus sign with the number of rejected attempts on an unsolved problem, followed by the number solved and the penalty time. A checkbox switches the solve times on and off, and the first accepted run of each solved problem is shaded.

    Below the teams, rows give for each problem the total runs, accepted, rejected, and the times of the first and last accepted run. Unofficial or guest teams are not marked.
