  description: |-
    Standings of the Ural Regional Contest: 74 teams, each with rank, team name, institution, number of problems solved, total time, medal and citation. The top 23 teams carry a medal (First Degree for 3 teams, Second Degree for 7, Third Degree for 13) and a citation naming the place, the first being the regional champions. The next 13 teams are cited as High Achievement and the last 38 as Honorable Mention, without a medal. No per-problem results.
