  description: |-
    Final scoreboard of the 2022-2023 Ural Regional Contest: 88 teams, fourteen problems A to N. Each team row gives rank, team name with the surnames of its members, for each problem the outcome (an accepted run with the number of earlier rejected runs and the time, a count of rejected runs without acceptance, or a dot for no runs), the number of problems solved and the penalty time. The clock reads 5:00:00 of 5:00:00 and the status is over. The first place is Ural FU: Re:Fresh with 8 problems. Cells holding the first accepted solution of a problem carry a first-to-solve mark, and a Show time checkbox hides or shows the times. Below the teams are summary rows per problem: total runs, accepted, rejected, first accept and last accept. The names of 23 teams are prefixed with an asterisk that the page does not explain; they are ranked among the others.
