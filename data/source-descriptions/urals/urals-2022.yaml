  title: Четвертьфинал 2022
  title_en: Quarterfinal 2022
  language:
  - ru
  contest_date: '2022-10-29'
  description: |-
    Website of the Ural Regional Contest 2022 on the Ural Federal University's programming-contests site, in Russian. The main page states that the contest was held on 29 October 2022 and lists the 25 teams that advanced to the semifinal of the world championship. Other pages hold the rules, the rules for team substitutions, the timetable for 29 October 2022 in Ekaterinburg (registration, opening, practice round, main round, award ceremony) with 30 October as the day of departure, a winners page, and the organising committee with sponsor logos. A qualification section covers the round held on 8 October 2022 with 346 teams from 45 institutions: selection rules, the list of teams admitted to the main round and a list of 10 teams that the jury found to have passed their solution to another team or submitted someone else's code. A colleges tournament page includes a results table of 36 teams with problems A to K.

    Our copy holds 44 files: 40 HTML pages, many of them the same page repeated as a print version or under an http address, and four sponsor logo images. The winners page is headed with the 2021 contest and lists the 2021 diploma winners. The participants page has no list in our copy. The full main-round results, the qualification results, the problem statements, the tutorial and the certificates are linked from these pages but are not in our copy.
