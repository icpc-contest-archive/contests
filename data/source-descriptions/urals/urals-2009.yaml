  contest_date: '2009-10-10'
  description: |-
    Website of the 2009 quarterfinal of the world programming championship (Четвертьфинал 2009, "Quarterfinal 2009"), in Russian, sponsored by SKB Kontur. The front page gives the event as 8 to 11 October 2009 at the Ural State University, lists the 16 teams chosen to represent the Eastern subregion at the semifinal in St Petersburg on 11 November 2009, mentions an online contest held alongside the on-site one, and says the problems are in the Timus Online Judge archive as numbers 1711 to 1721. It links to the problems, the full results and the online results.

    The timetable puts the main round on 10 October 2009 from 09:00 to 14:30, with arrival on 8 October, registration, opening and a practice round on 9 October, problem analysis and closing on the afternoon of the 10th, and departure on 11 October. Further pages hold the contest rules, a table of 18 universities with the number of teams each requested (38 in total) and whether the organisers arrange accommodation, the application form, and suggestions for sights in Ekaterinburg.

    Our copy holds 19 files: six distinct pages, each also saved as a print version, and one image (the sponsor's logo). The participant list, the results pages, the problems PDF and the information letter are linked from the pages but are not in our copy.
