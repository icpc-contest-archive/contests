  description: |-
    General information page of the 2002 Ural Programming Championship section on a programming-contests site (its top menu names the Ural Championship, the ICPC quarterfinal and other contests), in Russian. It states that the sixth Ural Championship was held from 22 to 27 April 2002 at South Ural State University and was at the same time the quarterfinal of the 2002-2003 team student world programming championship for the Eastern (Ural) subregion.

    The page holds the section menu, which names rules, history, selection for the semifinal, schedule, hotels, contacts, participant list, problems, results and solutions of rounds 1 and 2, total results and a photo gallery, and a list of all Ural Championships from 1997 to 2026. Our copy is this one page only; the pages the menu links to are not in it. The page shows an update date of 8 May 2013.
