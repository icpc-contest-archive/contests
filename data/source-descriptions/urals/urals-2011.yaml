  contest_date: '2011-10-29'
  description: |-
    Website of the quarter-final of the 2011 ICPC world championship held at Ural Federal University in Yekaterinburg, in Russian. Our copy holds 19 saved pages, which are six sections (general information, timetable, rules, technical information, sightseeing in Yekaterinburg, team application form), several of them saved again as print versions and under both http and https addresses, plus two images. The general information page states that the contest took place at Ural Federal University and lists the 15 teams chosen to represent the Eastern subregion at the semi-final in St. Petersburg on 27 November 2011. The timetable runs from arrival on 27 October to departure on 30 October, with registration, opening and a practice round on 28 October and the main round on 29 October from 10:00 to 15:30, followed by a lecture, problem discussion and closing. The rules page says the contest follows ICPC rules and describes the organising committee, the jury and team eligibility; the technical page names Visual Studio 2010 and Eclipse 3.7/JDK 1.7 as the programming environments, a 64 KB source limit and a 64 MB memory limit. The application form is marked as closed.

    The links to the problem statements, the full results, the photo gallery and the team list lead to files that are not in our copy. The page also notes a simultaneous online contest and that the problems are in the Timus Online Judge archive as numbers 1885 to 1895.
