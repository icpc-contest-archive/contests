  contest_date: '2008-11-01'
  description: |-
    Website of the 2008 quarterfinal of the world programming championship (Четвертьфинал 2008, "Quarterfinal 2008"), in Russian, sponsored by SKB Kontur. The front page gives the event as 30 October - 2 November 2008, lists the 14 teams chosen to represent the Ural region at the semifinal in St Petersburg on 26 November 2008, mentions an online contest held alongside the on-site one, and says the problems are in the Timus Online Judge archive as numbers 1649 to 1659.

    Other pages hold the timetable (registration, opening and a practice round on 31 October, the main round on 1 November from 09:00 to 14:30, problem analysis and closing that afternoon, at the mathematics and mechanics faculty in Ekaterinburg), the contest rules, an application form for on-site participation (registration deadline 15 October 2008), a table of 17 universities with the number of teams each requested (42 in total), an accommodation table by institution, and suggestions for leisure in Ekaterinburg. A contract in RTF, a contract archive in RAR and the sponsor's logo image are also saved.

    Our copy holds 22 files: seven distinct pages, most of them also saved as print versions. The pages for the list of participants and for the results, and the information letter, are linked from the pages but are not in our copy.
