  description: |-
    Final scoreboard headed "Eastern Subregional 2012", with the clock showing 5:00:00 of 5:00:00 and status over. It lists 51 teams against eleven problems A to K: each team row gives the team name with its three members, a cell per problem, then the number solved and the total time. A cell holds a plus sign, the number of earlier rejected attempts if any, and the time of the accepted solution; an unsolved problem with attempts shows a minus sign and the number of attempts, and a problem never tried shows a dot. Rank 48 is shared by four teams with no problems solved. The first place is Ural FU: Wadjet with eight problems solved. Rows below the table give the total, accepted and rejected runs per problem and the times of the first and last accepted solution. The style sheet is saved with the page.
