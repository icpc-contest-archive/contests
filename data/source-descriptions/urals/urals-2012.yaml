  contest_date: '2012-10-20'
  description: |-
    Website of the quarter-final of the 2012 world programming championship at Ural Federal University in Yekaterinburg, in Russian. Our copy holds 12 saved pages and four images; the pages are nine distinct ones (general information, timetable, rules, technical information, team list, results, photo gallery, sightseeing in Yekaterinburg, and the English problem set as a PDF), some saved under two addresses.

    The general information page says the contest ran on 19 and 20 October 2012 and lists the 17 teams that advanced to the semi-final in St. Petersburg on 2 December 2012; it also gives the Timus archive numbers 1910 to 1920 for the problems. The timetable has arrival on 18 October, registration, opening and a practice round on 19 October, the main round on 20 October from 10:00 to 15:30, then problem discussion, closing and a reception. The technical page names Visual Studio 2010 and Eclipse 3.7/JDK 1.7, with a 64 KB source and 64 MB memory limit. The team list holds 51 teams and the results page is a scoreboard of the same 51 teams against problems A to K.
