  description: |-
    Website of the Ural student programming competitions, in Russian. Our copy holds 150 files of the whole site, 137 of them pages, covering many years: history pages (Ural universities at ICPC semifinals and finals, school teams), the pages of the 2002 championship with its problems as two PDFs, the school olympiads of 2001 and 2002, and a research paper that is also source 2 of this contest.

    The part for this edition is the section on the Fifth Ural Programming Championship, held on 16-21 April 2001 at Perm State University as the quarterfinal of the 2001-2002 world championship for the Eastern (Ural) subregion. It has an information page, the schedule, the rules, the selection contest of Ural State University of 31 March 2001, and the results of the first round, the second round and the final. The contest had two rounds, on 18 and 20 April, of eight problems each; the first was in Russian and the second in English. Each of the three results tables lists 44 teams with, per problem, a mark ('.', '+' or '-', with attempts and, for solved problems, the time), the number solved and the total time. In the final table, columns A1 to H1 and A2 to H2, the first place has 12 problems solved.

    The statements of the 2001 problems are not in our copy; the information page says the English round is in the Timus Online Judge archive as problems 1150 to 1157.
