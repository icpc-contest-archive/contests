  description: |-
    Final scoreboard of the Eastern Subregional Contest, 5:00:00 of 5:00:00 elapsed with status over: 86 teams against 12 problems labelled A to L, with the problem names shown as tooltips on the column heads. Each team row gives rank, the team name with institution prefix and the three members' surnames, then per problem either a plus with the minute of the accepted run (a number after the plus counts earlier rejected runs), a minus with the number of rejected runs, or a dot for no attempt, followed by problems solved and penalty time. Ural FU: Dandelion is first with 12 problems.

    Ranks run from 1 to 79; the last places are shared by ties, eight teams with no problem solved among them. Rows at the foot give totals per problem for runs, accepted, rejected, first accept and last accept. A checkbox hides or shows the times. All 86 rows are in one table without marks for unofficial teams.
