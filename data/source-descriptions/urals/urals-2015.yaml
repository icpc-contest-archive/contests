  title: Четвертьфинал 2015
  title_en: Quarterfinal 2015
  language:
  - ru
  contest_date: '2015-10-24'
  description: |-
    Website of the 2015 quarterfinal of the world programming championship, held at Ural Federal University in Yekaterinburg, in Russian. The front page reports that the main round was held on 24 October 2015 with 86 teams from 42 universities and branches in 22 cities, explains the diplomas by number of problems solved (4 to 6, 7 and 8, 9 or more), and lists the 21 teams that advanced to the semifinal.

    Other pages cover the rules, the rules for team substitutions, technical information (computers, software, languages and compiler command lines), the timetable (arrival on 22 October, registration, opening and practice rounds on 23 October, the five-hour main round on 24 October from 10:30 to 15:30 followed by problem discussion and closing), the qualification round of 3 October 2015 (361 teams from 50 universities at 14 sites, 88 teams passing), the selection rules, certificate archives per site, and an introduction to the contest for beginners. A separate page lists the teams admitted to the main round.

    Our copy holds 13 distinct pages (40 page files with print versions and http duplicates). The results pages of the main and qualification rounds, the photo galleries and a PDF of example problems were not captured (their fetch timed out). The registration page and the participant pages of both rounds hold only an empty frame that a script fills from another server, so no team list appears on them.
