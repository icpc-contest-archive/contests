    Problem set as a PDF of 12 pages in English, with 'Regional Olympiad of Students, St Petersburg, October 24, 2015' as the header of every page. It holds 12 problems labelled A to L, from Alex Origami Squares to Lucky Chances, one statement per page. Each statement gives the input and output file names, a time limit of 2 seconds and a memory limit of 256 megabytes (the same in all 12), the input and output format, and one or more examples.

    The header names the St Petersburg regional olympiad; the Eastern Subregional is not named anywhere in the document. There are no solutions or test data.
