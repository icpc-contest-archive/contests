  tries: true
  description: |-
    Final scoreboard of the contest: 66 teams and 13 problems labelled A to M, with the clock showing 5:00:00 of 5:00:00 and status over. Each row gives the rank, the team (short institution name, team name and three surnames in brackets), one cell per problem, the number solved and the penalty time. A solved cell shows a plus sign with the number of extra attempts and the time in minutes; an unsolved cell with attempts shows a minus sign and their number; a dot means no attempt. Cells with the first accepted solution of a problem are marked.

    Below the teams, rows give for each problem the total, accepted and rejected runs and the times of the first and last accepted run. First place has 10 problems solved.
