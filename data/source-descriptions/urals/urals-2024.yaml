  title: Основной тур — Четвертьфинал 2024
  title_en: Main round — Quarterfinal 2024
  language:
  - ru
  contest_date: '2024-11-16'
  description: |-
    Russian-language website of the 2024 Ural Regional Championship, the ICPC quarterfinal. Our copy holds 40 pages, some of them print versions or the same page under another address. The main-round section gives general information (held 16 November 2024, 66 teams from 19 institutions in 13 cities, diploma levels, the teams advancing to the semifinal), rules, substitution rules, the timetable, a winners page and a participants page. The qualification section covers the round of 26 October 2024 (320 teams from 29 institutions), selection rules, timetable, the list of teams invited to the main round including wildcards, the college tournament and the Ural Federal University championship.

    The participants page holds only its heading and an empty container for a registration list that is loaded from another server. The links to the standings lead to another site, and the linked results, problem statement and tutorial files are not part of our copy.
