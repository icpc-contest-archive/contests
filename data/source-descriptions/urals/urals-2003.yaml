  description: |-
    Two sites crawled together, in English and Russian. The first is the Ural regional contest page of the Northern Eurasia regional contests site, with host and contact details and links to the final standings of the Ural contest for the years 2003 to 2018; the site's pages for the other subregions are in the copy too. The second is the site of the Ural Programming Championship of 2003. Our copy holds 144 files, 127 of them pages.

    For this edition, the championship site says that the Seventh Ural Programming Championship ran on 21-26 April 2003 at South Ural State University and was the quarterfinal for the Eastern (Ural) subregion in the 2003-2004 season. Its pages hold the history, rules, rules for admitting teams, limits on teams per university, the selection for the semifinal, hotels, contacts, the timetable, the list of participants by university, the problems of the two rounds as PDFs (round 1 in Russian, 7 pages; round 2 in English, 9 pages), the results of each round, the results of the two internet rounds, and a total results table of 53 teams with problems solved and time per round and the place.

    The standings of day 1 and day 2 from the regional contests site are in our copy as well.
