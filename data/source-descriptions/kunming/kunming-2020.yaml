    Contest page on the NowCoder judge for the 第 45 届国际大学生程序设计竞赛（ICPC）亚洲区域赛（昆明） (Dì 45 jiè guójì dàxuéshēng chéngxù shèjì jìngsài (ICPC) Yàzhōu qūyù sài (Kūnmíng), "45th International Collegiate Programming Contest, Asia Regional (Kunming)"), in Chinese. The page's embedded data holds the participation notice: Kunming University of Science and Technology hosts the Kunming site on 2 and 3 April 2021 at the ICPC Asia committee's request; the contest lasts five hours, is a team contest played online on NowCoder, with the venue given as the Chenggong campus of the university; teams have exactly three members from one school; each team may use only one main computer and, optionally, one printer of its own. It lists the compiler settings of the judge for C++, Java, C, Python 2 and Python 3, and gives the ranking rule: classic ACM rules, with a default penalty of 20 minutes per rejected run before acceptance.

    The problems and the scoreboard are not in our copy; the text visible on the page itself is only NowCoder's navigation and login text.
