  description: |-
    Contest page on the NowCoder judge named 第46届ICPC亚洲区域赛（昆明）(正式赛） (Dì 46 jiè ICPC Yàzhōu qūyù sài (Kūnmíng) (zhèngshì sài), "46th ICPC Asia Regional (Kunming), official contest"), in Chinese. The page's embedded data holds the organising committee's requirements for the contest, dated 28 February 2022: a team plays on one main computer, with at most one printer of its own, in a room of its school, watched by an on-site volunteer and online proctors through a video meeting, with student-card identity checks, screen recording of the main computer, a browser limited to the NowCoder pages, an MD5 check of the recordings after the contest and a code-similarity check afterwards. It also gives the judge's compiler settings for C++, Java, C, Python 2 and Python 3, the freeze of the scoreboard 60 minutes before the end, and the ranking rule: classic ACM rules, a default penalty of 20 minutes per rejected run before acceptance.

    The problems and the scoreboard are not in our copy; the text visible on the page itself is only NowCoder's navigation and login text.
