  description: |-
    Contest category page of the Baekjoon Online Judge, in Korean, filed under ICPC Regionals, Asia Pacific, Thailand. A table lists 16 problems: the eleven contest problems A to K (numbers 9614 to 9624) and five practice problems PA to PE (9609 to 9613). Each row gives the judge's problem number, the label, a title, the number of users who solved it, the number of submissions and the acceptance rate. Some titles are translated into Korean and others stay in English, and problem H is marked as a special judge problem.

    The titles link to the judge's own problem pages, which are not in our copy; the page holds no statements.
