    Final scoreboard of the 2013 ACM-ICPC Asia Phuket Programming Contest, dated 22 November 2013: 67 teams, each with rank, team name, institution and country code, number solved and penalty time, and eleven problem columns A to K. Each problem cell gives the number of attempts and the time of the accepted run (for example 1 03:40), or the attempts alone for unsolved problems. Peking University is first with nine problems and a time of 959.

    Below the table are a row of statistics per problem (solved over attempted, average tries, average tries to solve), and a colour legend (country leader, first to solve, solved, attempted, pending judgement). The images the page refers to are not kept beside it in our copy.
