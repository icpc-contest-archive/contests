  title: The 2013 ACM-ICPC Asia Phuket Regional Programming Contest, 21-22 November 2013, Phuket campus of Prince of Songkla University
  language:
  - en
  description: |-
    Website of the 2013 ACM-ICPC Asia Phuket Regional Programming Contest, in English, made by the host, the Department of Computer Engineering of Prince of Songkla University, Phuket Campus. The home page announces the contest for 21-22 November 2013, the registration period (20 July to 15 October 2013), the top prize of 50,000 Baht, the venue and a map, and short blurbs about the earlier Phuket contests of 2009 and 2011 and the 2012 Hat Yai contest.

    Our copy holds the home page, the contest rules page (adapted from the official ICPC regional rules, with the contest environment: Ubuntu, GCC, Java, Eclipse, PC2), the final scoreboard page, the problem set page, and seven PDFs: the tentative schedule (competition on 22 November 2013, 08:00 to 13:30), a transportation schedule, accommodation, registration fees and team selection, a campus map, the contest problems and the practice problems.

    The menu also names a contest report, a team list, live scoreboards, a live stream and photos; none of these is in our copy, and the live-score and stream links lead to other addresses.
