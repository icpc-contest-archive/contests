  description: |-
    Problem set of the contest day, a PDF of 20 pages in English. The cover names the Department of Computer Engineering of Prince of Songkla University, Phuket Campus as host and 22 November 2013 as the date, and says there are 11 problems (A to K) to solve in 5 hours in C, C++ or Java, with standard input and output.

    The problems are Spanning Trees in a Secure Lock Pattern, Teaching Hazard, Counting Lattice Squares, Seven Segment Display, Airport Sort, Boxes, Meeting Room Arrangement, Traveling Fool, Cabin Baggage, Minimal Subarray Length and Safari Park. Each has a statement with input and output specifications and sample data. No test data or solutions.
