  description: |-
    Results page of the contest website, in English. It names Shanghai Jiao Tong University's Tempus Fugit as champion and gives a short account of the five-hour contest, saying that all problems except J and K were solved and naming the teams that solved problems L, A and B first, at 3, 3 and 6 minutes.

    It lists the first twelve places only, each with team, institution and country, and the medal: gold for places 1 to 3, silver for 4 to 7 and bronze for 8 to 12, with prize money of 50,000, 30,000, 20,000 and 10,000 Baht for the top places. Links to the final scoreboard, the contest problems and the data sets lead to files that are not in our copy.
