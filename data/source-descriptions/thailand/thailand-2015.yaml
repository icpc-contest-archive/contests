  description: |-
    Statement of problem 7307, "Automatic Scholarship Calculation", as a PDF of 2 pages. Scholarship slabs of equal CGPA width go up to 4.00 with a percentage that rises by a fixed integer step; given each student's CGPA and a number of scholarship units to use up exactly, the program prints the number of different allocations. The statement shows two example tables of slabs and, after the output section, a table illustrating one allocation for the sample. It has input and output sections and one sample of ten students with output 79554. No letter label is printed. A running line "ACM-ICPC Live Archive: 7307 – Automatic Scholarship Calculation" with the page number is printed at the top of page 2.
