    Statement of problem 7304, "Queue of Soldiers", as a single-page PDF. Given soldiers' heights, where a soldier dies if someone in front of him is strictly shorter, the program prints the number of permutations of the heights in which exactly K soldiers die, modulo 1000000007. It has input and output sections and a sample of three cases with outputs 3, 1 and 2. No letter label is printed.
