  description: |-
    Standings of the 2015 ACM-ICPC Asia Phuket Regional Contest: 65 teams with rank, team name, institution, problems solved and total time. Shanghai Jiao Tong University's Tempus Fugit is first with ten problems and a time of 783. The Medal column marks three gold, three silver and six bronze places, and the Citation column gives First Place to Twelfth Place for the medallists, a place name for the others, and Honorable Mention for teams ranked 61. Rank 61 is shared by teams with no problem solved. There is no per-problem detail.
