  description: |-
    Contest category page of the Baekjoon Online Judge, in Korean, filed under ICPC Regionals, Asia Pacific, Thailand. A table lists twelve problems A to L with the judge's problem numbers 11784 to 11795 and English titles: Hex Code, Programming Contest Strategy, Terrorists, Aquarium, Queue of Soldiers, Jumping Joey, Primorial vs LCM, Automatic Scholarship Calculation, Tom and Jerry, Sunlight on a Tree, New Angry Bird Weapon and Donation Packaging. Each row gives the number of users who solved it, the number of submissions and the acceptance rate; problem I is marked as a special judge problem.

    The titles link to the judge's problem pages, which are not in our copy; the page holds no statements.
