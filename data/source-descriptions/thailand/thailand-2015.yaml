  title: The 2015 ACM-ICPC Asia Phuket Regional Programming Contest
  language:
  - en
  description: |-
    Website of the 2015 ACM-ICPC Asia Phuket Regional Contest, in English, hosted by the Department of Computer Engineering of Prince of Songkla University, Phuket Campus, with the Software Industry Promotion Agency as partner. The home page gives the dates, 19-20 November 2015, and says the contest has ended, with a link to the results.

    Our copy holds six pages: home, schedule (registration dates, a tentative program for both days, the transportation schedule), contest (registration, team registration and the contest rules adapted from the official ICPC regional rules), results, local info (hotels, optional trips) and contact. Several are saved under two addresses. It also holds a registration fees PDF of 2 pages, which states that the site accepts up to 68 teams, and an awards photo.

    The results page lists the top twelve places with medals. The final scoreboard, the contest problems PDF and the data set archive it links to are not in our copy.
