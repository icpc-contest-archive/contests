  description: |-
    Website of the 2012 ACM-ICPC Asia Hatyai Regional Contest, run by the Department of Computer Engineering, Faculty of Engineering, Prince of Songkla University, in English. It announces 15-16 November 2012 at the university's International Convention Center in Hat Yai and has pages for registration and fees (30 slots for foreign teams, 30 for Thai teams, fees in baht and US dollars), contest rules, prizes, the schedule, the contest environment (Linux, PC2), a Hat Yai map, transportation, accommodation and contact details. The schedule gives registration, opening and a practice session on 15 November and the contest session from 9.00 to 14.00 on 16 November. The prize page lists 50,000 baht for first place down to 10,000 baht for places 4 to 7.

    The menu has Contest Problems and Score Board entries. Our copy holds the score board page (65 teams, problems A to J) and the 17-page problem set PDF (10 problems, A to J), but no page links to that PDF directly and the Contest Problems entry points to a directory page that is not in our copy.

    Our copy holds 149 files, 43 of them pages and documents, with style sheets, scripts, fonts and images. It also holds pages of the same host's 2013 Thailand Southern contest (home page, score board, problem set page, two problem PDFs, a zip archive of 26 files, registration lists) and three other pages of the department's site, mostly in Thai.
