  description: |-
    Scoreboard of the 2012 ACM-ICPC Asia Hatyai Programming Contest, 16 Nov 2012, last updated Fri Nov 16 15:08:06 ICT 2012: 65 teams with rank (ties share a rank; the last rank is 60, shared by six teams), team name, university and country code, problems solved and penalty time. For each of the problems A to J a cell gives the number of attempts and, for a solved problem, the solve time in hours and minutes; attempted but unsolved problems show -- instead of a time, and untried problems are blank. HKUST_Optimus Prime from the Hong Kong University of Science and Technology is first with 7 problems and a time of 934.

    Below the teams, per-problem rows give solved/submitted counts (headed Monkey Stats), average tries and average tries to solve. A legend explains the cell colours (first to solve, solved, attempted, pending judgement).
