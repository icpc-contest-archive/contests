  description: |-
    Final scoreboard of the ICPC Asia Bangkok 2025 contest as shown by DOMjudge, headed "final standings": 58 teams, each with rank, country flag, team name, institution, problems solved and penalty time, and 14 problem columns A to N. Each cell gives the number of tries and, for a solved problem, the solve time in minutes; the cells are coloured for first solve, solved, tried and incorrect, tried and pending, or untried. The first three rows carry a gold, a silver and a bronze medal icon. A summary row gives the total solved (228) and, per problem, the accepted, rejected and pending submissions and the time of the first solve. Clicking a team name opens a card with its category (Participants for all 58 teams), affiliation, country and seat location. The page ends with "Last Update: Sun 02 Nov 2025 16:09:34 +07". First place is Just use CRT from Seoul National University with 13 problems solved.

    The submission detail that the page loads on a click is not in our copy.
