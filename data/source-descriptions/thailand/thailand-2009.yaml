  contest_date: '2009-11-04'
  problems: 11
  description: |-
    Website of the 2009 ACM-ICPC Asia Phuket Regional Programming Contest, hosted by Prince of Songkla University, Phuket Campus, in English. Its pages cover registration dates and fees, team selection (up to 68 teams, 33 foreign and 35 Thai), prizes, the contest environment (Ubuntu, PC2), hotels, a map and photo albums. The problems page gives a practice session of 3 problems on 3 November and the contest of 11 problems on 4 November 2009. Menu entries lead to PDFs of the contest rules, the tentative program and the transportation arrangements, which are in our copy, and to an eligibility document on another server, which is not.

    The results are inside: the final scoreboard, ranking PDFs for all teams and for Thai teams only, a one-page PDF listing the 60 teams by country and university, the 23-page PDF of the contest problems, a results and solutions page with test input and answer files for 10 of the 11 problems (A has an input file only), and two analysis PDFs, for problem D and problem K.

    Our copy holds 150 saved files, some of them stored twice under two forms of the address: pages and PDFs of the 2009 Phuket site, a few pages of the same host's other Thai contests (2009 and 2010 national, 2010 southern, 2011 and 2013), and unrelated spam pages and a parked-domain page from later years of the address. No style sheets are in our copy and only two JPEG images are.
