    Page headed 'Results and Solutions' for the contest of 4 November 2009 (5 hours): a table of correct, incorrect and total submissions for each of the 11 problems A to K (594 submissions in all), and a note on which problems were solved by all, one, two or no teams. Then one section per problem with its name, the number of teams that solved it, an excerpt of the test input and output with links to the files, and the problem setter's affiliation; the first team to solve it and the time are given for the nine problems that were solved. Problem D links a notes PDF and problem K an analysis PDF.

    Links to the scoreboard, the two ranking PDFs, the problem PDF, the test files and the two analysis PDFs point to files that are not part of this page's copy, which holds only the page and one image.
