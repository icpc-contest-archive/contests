  description: |-
    Statement of problem 6849, "Landmine Cleaner", as a PDF of 2 pages. Given the signal reading of a drone at each cell of an N by M grid, where a cell with a mine adds 3 to the count of mines in its 3 by 3 neighbourhood, the program prints for each row a string of '-' and 'L' marking the mines. It has input and output sections and one sample of a 3 by 4 grid with its output. No letter label is printed. A running line "ACM-ICPC Live Archive: 6849 – Landmine Cleaner" with the page number is printed at the top of page 2.
