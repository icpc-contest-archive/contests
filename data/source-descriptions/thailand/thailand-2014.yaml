  description: |-
    Statement of a problem as a single-page PDF; the first line is the start of the text, with no problem number or title printed. Given a solid polygonal mesh, a cutting plane through three points and a fourth point, the program removes the half-space containing that point and prints, for what remains, the number of solids with their volumes and surface areas, and the number of connected cross-section regions with their areas. It has input and output sections and a sample of two cases with their outputs. No letter label is printed.
