  description: |-
    Contest page of the ACM Valladolid On-line Judge, in English, headed The 2014 ACM-ICPC Asia Bangkok Regional Contest, November 16th, 2014. It gives notes for contestants (the judge is a Pentium 4 2.8 GHz computer, pi is to be computed as 2*acos(0), the contest duration may be extended, clarifications go by e-mail or the Clarification Board, standard input and output) and a table of twelve problems A to L: Volume Control, Combination, Mesh Cutter, Location, Zeroes, Fishing, Landmine Cleaner, Hidden Plus Signs, The Programmers, Blanket, Concert Tour and City.

    Each row links a PDF statement, and below the table are links to the whole problem set as a zipped PDF archive and as a DOC file. None of those files is in our copy, which holds only the page and its banner image. The link texts of problems K and L read PDF for I and PDF for J.
