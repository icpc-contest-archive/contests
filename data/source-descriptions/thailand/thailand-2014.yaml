  description: |-
    Statement of problem 6844, "Combination", as a single-page PDF. The program counts how many binomial coefficients C(n, r), for r from 0 to n and n from low to high, are odd. It has input and output sections and a note on the first sample and a sample of three lines with outputs 6, 70 and 2510. No letter label is printed.
