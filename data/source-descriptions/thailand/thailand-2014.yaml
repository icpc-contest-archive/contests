  description: |-
    Statement of problem 6846, "Optimal Landing Location", as a PDF of 2 pages. Three warehouses have given positions and capacities, and a cargo plane brings a given amount of goods; the program finds the landing location that minimises the total distance covered by three trucks and prints that distance with four decimals. It has input and output sections and one sample case with output 2960.5351. No letter label is printed. A running line "ACM-ICPC Live Archive: 6846 – Optimal Landing Location" with the page number is printed at the top of page 2.
