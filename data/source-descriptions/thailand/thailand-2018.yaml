    Problem set of the contest as one PDF of 22 pages in English, without a cover page: twelve problems, A “Flying Squirrel” to L “Largest Allowed Area”, each starting on a new page under a header that names the 2018 ICPC Asia Nakhon Pathom Regional Contest. Each problem gives its time limit (1 second, 3 seconds for K), the statement with input and output sections, and a sample input with its output; some add an explanation of the sample, and problem A's explanation draws the poles of its sample.

