  description: |-
    Website of the regional contest, run by the Faculty of Information and Communication Technology of Mahidol University, in English. Our copy holds one page, the home page, with a banner and a poster image, general text about the ICPC and its levels of competition, and a menu leading to About, Organizing Committee, Sponsors, Prize, Rules, Programming Environment, Schedule, Registration, List of Accepted Teams, Accommodation, Visa Information, Transportation and Contact, and to the sites of the 2012 to 2017 contests. Picture buttons on the home page link to photo galleries of three days, a closing video, a problem set download, a scoreboard page and a live scoreboard.

    None of the pages and files behind the menu and the buttons is in our copy, and the images of the buttons are missing too, so the schedule, rules, team list, problems and results cannot be read.
