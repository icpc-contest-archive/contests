  description: |-
    Final scoreboard on the contest's own website (Central European Regional Contest 2019 in Prague), with the site's menu above it: 63 teams ranked by solved problems and penalty time. Each row gives rank, team name with institution, the three team members, a score in the form solved / penalty (the team in first place has 11 / 917), and one cell for each of twelve problems, labelled Abb, Begeeks, Bob, Crimson, Deep, Garden, Hindenburg, Kequalss, Ponk, Saba, Screamers and Thebugs. A solved problem shows attempts/time (1/18); an unsolved one shows the number of attempts alone, or 0. Every team name, in both tables, links to a downloadable archive named for the team.

    A second table headed Unofficial lists three further teams, ranked among themselves, in the same columns. Our copy holds the page and its style sheet and banner image.
