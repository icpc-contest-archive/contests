  title: Main page
  language:
  - en
  contest_date: '2006-11-17'
  description: |-
    Website of the 2006 Central European Programming Contest, in English, organized by the Faculty of Electrical Engineering and Informatics of the Budapest University of Technology and Economics and the Electrical Engineering Students' Hungarian Association, with IBM named as main sponsor. The main page presents the contest as a regional contest of the 31st ACM International Collegiate Programming Contest, to be held on November 17-19, 2006, with more than 50 teams from eight countries expected. The menu leads to news, important dates, fees, site location, general and technical rules, links, sponsors, tourist information, a gallery and results.

    Our copy holds 33 files, 29 of them pages: the twelve menu pages (the fees page is saved twice), 15 PDFs and an index of 56 archives of team home directories from the 2005 contest. The dates page gives a schedule from Friday arrival to Monday departure, with the contest on Sunday. The results page has tables for CERC 2006 (62 teams), CERC 2005, CERC 2004 and four Hungarian National Contests. The PDFs include the problem set of this contest (16 pages, problems A to K), the problem sets of CERC 2005 and CERC 2004, reports on the 2005 contest in English and Hungarian, Hungarian solution notes and a press release for the 2006 national contest, four versions of a billing-address document and one presentation. Two media files are also held.

    Not in our copy: the other videos, the test data archives, two of the three presentations, the home directory archives themselves, and the maps, hotel photos and sponsor logos of the inner pages.
