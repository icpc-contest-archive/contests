  description: |-
    News page of the website of the Central European contest, in English, under a menu of home, news, dates, fees, location, general rules, technical rules, links, sponsors, tourist info, gallery and results. It is a list of 26 dated entries, newest first, running from 12 October 2004 to 22 November 2006.

    The 13 entries from 2 October to 22 November 2006 concern the 2006 contest: billing-address documents, the Hungarian national selection contest of 29 October 2006 with its test data and solutions, a note on the online contest ranking, videos, presentations, the problem set, the results and press releases. The other 13 entries are dated 2004 and 2005, plus one of 23 June 2006 offering last year's test data, so the page is the site's news list for three years. The linked files are not part of our copy.
