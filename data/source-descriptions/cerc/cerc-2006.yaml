    Problem set as a PDF of 16 pages in English with eleven problems labelled A to K: Astronauts, Bridges, Chimes, DNA Regions, Education Radio Programme, Fast Track, Grass is Green, Highways, Islands, Jewel-eating Monsters and Knowledge Transfer. Each problem has a statement with an introduction, input and output formats and one sample input with its sample output. The document has no cover page: it starts directly with problem A and does not name the contest, date or host. Test data and solutions are not part of it.
