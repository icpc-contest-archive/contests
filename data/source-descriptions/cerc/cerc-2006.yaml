  times: true
  tries: true
  description: |-
    Results page of the contest website, in English, holding the results of several contests one after another: the Hungarian National Contest of 2007, CERC 2006, the Hungarian National Contest of 29 October 2006, CERC 2005, the Hungarian National Contest of 29 October 2005, CERC 2004 and the Hungarian National Contest 2004. A heading for ACM ICPC Pre-Regionals Poland, 28-29 October 2005, carries only a link to another site.

    The section 'Results of the CERC 2006' is a table of 62 teams without a header row, giving place, team id, points, time and tasks, each followed on a second line by the team name and university. Points are the number of tasks solved and time is hours:minutes:seconds. The tasks column lists task letters, some followed by asterisks (up to seven). The letters a and c to k occur; b does not. Warsaw Eagles of Warsaw University are first with ten tasks in 23:50:00. The sections for the other contests are similar tables; most have a header row (place, team, points, time, tasks).

    The page's two images are included in our copy.
