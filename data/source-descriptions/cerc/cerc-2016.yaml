    Slide deck of 136 pages, headed CERC 2016: Presentation of solutions, with University of Zagreb named on the first slide. The second slide lists problems A to L with a difficulty rating (Easy, Medium or Hard). Each of the twelve problems then has a title slide with the number of submits, the number accepted (shown as "at least" a number, or "?" for G and I), the team that first solved it with its solving time (for ten problems; G and I show none) and the author, followed by slides explaining the solution, in the order A, K, F, C, L, J, H, D, E, B, G, I. The deck ends with a Thanks slide.
