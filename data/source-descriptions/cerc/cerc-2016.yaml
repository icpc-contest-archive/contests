  contest_date: '2016-11-18'
  description: |-
    Website of the Central Europe Regional Contest 2016, in English, organised by the Croatian Computer Science Association and hosted by the Faculty of Electrical Engineering and Computing, University of Zagreb, on 18 to 20 November 2016. The home page names the seven countries whose students took part (Austria, Croatia, Czech Republic, Hungary, Poland, Slovakia, Slovenia), says the best teams advance to the ACM ICPC World Finals in Rapid City, South Dakota, in May 2017, and points to the contest's Facebook page. The menu lists Schedule, Participation Fee, Eligibility, Venue, Accommodation, Organizers, Contact, Competition Rules, Contest Data, Results, Final Report, Photo Gallery, About Zagreb and About Croatia.

    Our copy holds six pages: the home page, saved under four addresses, the Results page, and the PDF presentation of solutions. The Results page is a scoreboard of 67 teams with problems A to L; the presentation is a 136-page slide deck on the twelve problems. The other menu pages, the problem statements and the test data are not in our copy.
