  description: |-
    One-page website of the 2022 Central European Regional Contest, in English, by ACM Slovenia and the Faculty of Computer and Information Science of the University of Ljubljana, at which all activities were held from 25 to 27 November 2022. It holds the announcement, registration schedule, the programme of the registration, practice and contest days, eligibility and the 50 euro participation fee, rules, contest environment, venue, location and accommodation information, a gallery of promotional videos and contest photos, sponsors, the organizers and a list of past editions.

    The results table lists 56 teams with rank, a country flag, team name, score (the number of solved tasks) and total time, and for each of the twelve problems A to L either its name, when not tried, or the number of attempts and the penalty time. Ties share a rank: five teams with no problem solved are at rank 52. Links to the tasks, solution slides and test data lead to files that are not part of this page; the scoreboards and contest system link to another server.
