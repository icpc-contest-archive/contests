  description: |-
    Website of the Central European Programming Contest '08 (CEPC'08), held on November 28-30, 2008, made by the Institute of Computer Science of the University of Wrocław, in English. Our copy holds 87 pages. 19 of them belong to the next contest at the same address, the Central European Regional Contest '10 of November 19-21, 2010: its front page, a solutions page, a standings page and eleven problem statement PDFs among them.

    The 2008 pages cover news, important dates, the schedule (registration on Friday, opening ceremony and trial session on Saturday 29 November, contest on Sunday 30 November from 9:00 to 14:00), fees, travel, accommodation, venue, general and technical rules, a checklist, sponsors, photo galleries and a gnome hunting page, a photo competition run alongside the contest.

    Results and problems: a standings page of 61 teams, a two-page PDF titled CEPC 2008 Final Ranking, and a problems page listing two trial and ten contest problems. Eight of its twelve statement PDFs are in our copy (the two trial problems and contest problems B, C, D, E, I and J); the statements of A, F, G and H and the linked test files are not.
