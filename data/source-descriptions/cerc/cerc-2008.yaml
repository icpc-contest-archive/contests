  description: |-
    Problems page of CEPC'08, in English. It lists two trial session problems (Saturday, November 29, 2008, 15:30-17:30 CET), Can you add this? and Johnny and the Quadratic Equation, and the ten problems of the contest (Sunday, November 30, 2008, 9:00-14:00 CET): YAPTCHA, Skyscrapers, Business Cards, Museum, Morphing is fun, Tower, Suffix reconstruction, Two professors, Counting heaps and In case of failure. Each entry links to a statement PDF and to an input file and an output file. The page holds only the names and links; the linked files are not part of this document.
