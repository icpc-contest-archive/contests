    Category page of the Baekjoon Online Judge for CERC 2008, written in Korean, filed under ICPC Regionals, Europe, Central European Regional Contest. A table of 12 problems labelled A to J, PA and PB gives the Baekjoon problem number and, where filled in, the title, the number of users who solved it, the number of submissions and the acceptance ratio. Only five rows are filled in (A, B, H, I and J), with titles YAPTCHA and Skyscrapers in English and the others in Korean; the rows for C to G, PA and PB show only the label. The five filled rows link to problem pages; the statements are not on this page.

    The statistics are those of the day the page was saved.
