  description: |-
    Results page of the contest website, in English, holding the results of several contests one after another: the Hungarian National Contest of 2007, CERC 2006, the Hungarian National Contest of 29 October 2006, CERC 2005, the Hungarian National Contest of 29 October 2005, CERC 2004 and the Hungarian National Contest 2004. A heading for ACM ICPC Pre-Regionals Poland, 28-29 October 2005, carries only a link to another site.

    The section for CERC 2004 is a table of 50 teams with place, team id, points, time and tasks, each followed on a second line by the university and team name. Points are the number of tasks solved and time is hours:minutes:seconds. The tasks column lists task letters, some followed by asterisks (up to seven). Only the letters b to i occur, eight in all. Warsaw University's Warsaw Falcons are first with eight tasks; five teams have eight. The sections for the other contests are similar tables, but the Hungarian National Contest 2007 section has no header row and a different team column.

    The page's two images are included in our copy.
