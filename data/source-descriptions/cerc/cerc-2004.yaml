  description: |-
    News page of the website of the Central European contest, in English, under a menu of home, news, dates, fees, location, general rules, technical rules, links, sponsors, tourist info, gallery and results. It is a list of 26 dated entries, newest first, running from 12 October 2004 to 22 November 2006: press releases, a note on sponsorship, films and media files from opening ceremonies, problem sets, results, reports, test data, home directories, billing-address documents, notes on the online contest ranking and on the Hungarian national selection contests.

    Two entries of 23 November 2004 announce the problem set and the results of CERC 2004 with links to them. Five entries are dated 2004; the other 21 are dated 2005 or 2006, so the page is the site's news list for three years, not for 2004 alone. The linked files are not part of our copy.
