    Slides titled Task overview for the Central Europe Regional Contest 2025, dated 7 December 2025, Wroclaw, in English. The deck has 158 PDF pages, numbered as 76 slides because many slides are built up over several pages. It opens with contest statistics (1135 submissions, of which 1103 in C++, 31 in Python 3 and 1 in Java).

    It then has a section for each of the twelve problems, in the order L, G, D, K, I, H, A, C, J, F, B, E. Each section explains the task and its solution. The last page reads Thank you.
