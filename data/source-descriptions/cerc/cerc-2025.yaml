    Scoreboard on the contest website of the Institute of Computer Science, University of Wrocław: 70 teams, each with team name, institution and city, and a cell for each of the twelve problems A to L. A solved cell gives a time and, when there were failed attempts, a count such as +2; an unsolved cell with failed attempts shows the count in parentheses. The last column gives the number of problems solved and a total time. 69 rows have a rank; the rank cell of one row (the twelfth) is empty, and two teams share the rank 13-14. First place is Big as Hectic Dreaming (Eötvös Loránd University) with 10 problems and 765. The page has the site menu around the table.
