  contest_date: '2025-12-07'
  description: |-
    Website of the Central Europe Regional Contest 2025, held at the Institute of Computer Science of the University of Wrocław, Poland, in English. It announces the contest for 5 to 7 December 2025, with teams from Austria, Croatia, Czech Republic, Hungary, Latvia, Poland, Slovakia and Slovenia, and has pages for important dates, fees, travel hints, the venue (the Institute and the Wrocław University Library, where the contest is held), a preliminary schedule from Friday to Sunday, general rules, sponsors, accommodation, previous CERC contests and contact. The front page carries a news note about the closure of the Wrocław airport until 4 December.

    A results page gives the scoreboard of 70 teams for problems A to L. A one-page eligibility form for a team is a PDF, and the same form is also an ODT file. Our copy holds 36 saved files: twelve pages of the site, each captured under both an http and an https address, the eligibility form in two formats, and style sheets and images.
