  description: |-
    Contest dashboard on the QOJ.ac judge for "The 4th Universal Cup. Stage 10: Grand Prix of Wrocław", which the page says is also known as The 2025 ICPC Central Europe Regional Contest (CERC 2025). It lists twelve problems, A Automatized Mineral Classification to L Letters on T-shirts, by name only, with links to statements and tutorials in English as attachments.

    The page also holds two notices about problems A and B dated 2025-12-27, the rules of the contest on the judge (ICPC ruleset, 20 minutes penalty, scoreboard frozen after 4:00:00) and an invitation to a virtual contest. The standings and the statements are on other pages of the judge and are not part of our copy.
