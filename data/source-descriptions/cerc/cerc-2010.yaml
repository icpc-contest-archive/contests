  description: |-
    Standings page of CERC'10 from the organisers' website: 68 teams in rank order. Each row gives the number, team name, university, the participants, the score (number of problems solved), the time as hours:minutes:seconds, and a string of the problem letters solved, some followed by asterisks. The letters run from C to J. There are no columns per problem and no time per problem. The first place is Warsaw Eagles of the University of Warsaw with 8 problems.

    Below the table the page links to two PDF versions of the standings, one of them including the high-school teams; the PDFs are not in our copy.
