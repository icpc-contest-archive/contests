    Baekjoon Online Judge category CERC 2010, under ICPC Regionals, Europe, Central European Regional Contest. A table lists ten problems, A to J, with their Baekjoon problem numbers (3426 to 3435), titles, and per-problem counts of accepted users, submissions and acceptance ratio. Eight titles are the English ones; the titles of D (Defense Lines) and E (Enter The Dragon) are shown in Korean. Beasts, Enter The Dragon and Justice for All are marked as special judge. The page is in Korean and holds titles and statistics, not the statements.
