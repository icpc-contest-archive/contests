  description: |-
    Printer-friendly page of solution sketches for CERC'10 from the organisers' website, in English, about 3,800 words. After a link to the presentation of the problem set solutions given during the contest, it has one section per problem, A to J, each describing the idea of the solution; problems H and J also have an alternative solution. A closing section points to further sketches (in Polish) on the page of the informal post-CERC'10 contest. The presentation file is not in our copy.
