  description: |-
    Solutions page of the CERC'10 website. It holds no solutions: the text announces an informal post-CERC'10 contest open to everyone with the same tasks, and says the tasks, tests and solutions will be officially published after that contest, after November 27. The rest of the page is the site's menu and header.
