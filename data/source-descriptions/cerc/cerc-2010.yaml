  read: '2026-11-16'
  rubric: 1
  copy: cerc/cerc-2010/website/2026-10-20-wayback-20f7a6b3
  title: CERC'10 - Central European Regional Contest '10
  language:
  - en
  contest_date: '2010-11-21'
  description: |-
    Website of CERC'10, the Central European Regional Contest held 19 to 21 November 2010 in Wroclaw, Poland, by the Institute of Computer Science of the University of Wroclaw. It is in English. Our copy holds 58 pages. They cover the announcement, standings, problems, solutions, important dates, fees, invoices, travel, accommodation, venue, an aquapark leisure evening, general and technical rules, registration, the schedule, the award ceremony venue, sponsors, news, a list of previous contests from 1995 on, two photo galleries (opening and trial session, the contest), and printer-friendly versions of several pages.

    The standings page lists 68 teams with solved problems and times, the problems page names ten contest problems and two trial problems, and the solutions page holds solution sketches for the ten problems. The photographs are not in our copy: it holds the gallery pages and 29 pages wrapping single photographs of the opening day, and its only images are two logos. The standings PDFs and the solutions presentation that the pages link to are not in our copy.
