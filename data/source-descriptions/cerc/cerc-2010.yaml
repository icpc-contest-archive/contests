    Problems page of the CERC'10 website: it lists the trial session of Saturday 20 November 2010 with two problems (Can you add this?, Teams) and the contest of Sunday 21 November 2010 with ten problems, from Ardenia to Justice for All in alphabetical order: Ardenia, Beasts, Casting Spells, Defense Lines, Enter The Dragon, Fields and Farmers, Game, Hanging Hats, Insults, Justice for All. Each name links to a PDF, followed by a link to tests, and for Beasts, Enter The Dragon and Justice for All to tests and a verification programme. The page holds names and links only; the linked PDFs and tests are not in our copy.
