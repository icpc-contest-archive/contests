  description: |-
    Introduction sheet of the problem set, a one-page PDF headed Czech Technical University in Prague, ACM ICPC sponsored by IBM, Central Europe Regional Contest 2011, with the title Contest Ciphers. The text introduces cryptography as the theme, says that a Cipher Contest was held the day before, allows C, C++ or Java, and states the input and output rules and the restrictions on contestants' programs. It ends by saying the problem set consists of 11 sheets including this one and contains 10 problems. The problem statements themselves are not on this page.
