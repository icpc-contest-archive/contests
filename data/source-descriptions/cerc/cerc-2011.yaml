  description: |-
    Final standings of the 2011 Central Europe Regional Contest: 64 teams with rank, team name, institution, number of problems solved and a citation. The citation column reads First Place through Thirty-second Place for the top 32 and Honorable Mention for the remaining 32. The first-place team is University of Warsaw 1 with 9 problems solved; the last row has 0. The Time column reads 0 for every team, so it carries no penalty times. There is no per-problem detail.
