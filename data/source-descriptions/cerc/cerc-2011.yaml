  title: Central European Regional Contest 2011 in Prague
  language:
  - en
  contest_date: '2011-11-13'
  description: |-
    Website of the Central European Regional Contest 2011 in Prague, in English, which names the Czech Technical University in Prague, Faculty of Electrical Engineering, Department of Computer Science and Engineering as organiser. Our copy holds 64 pages in 110 files. The pages cover news, important dates and the schedule of 11 to 13 November 2011, fees, accommodation, location, general and technical rules, links, sponsors, tourist information and a survey evaluation. The Contest page links the final standings with team home archives, the problems with official solutions, the results and hints of the Cipher Contest held on the Saturday, a list of 802 submitted solutions with time, team, language and outcome, photos and a note that certificates are available in the registration system.

    The standings page, the problems and solutions page and the solution slides are in our copy and are also described as sources of their own. Images and style sheets are present. The team home archives are linked but not in our copy, and the photo gallery link leads to another server.
- url: https://contest.felk.cvut.cz/11cerc/rank.html
  read: '2026-11-16'
  rubric: 1
  copy: cerc/cerc-2011/standings/20260901-live-69c440a0/rank.html
  title: CERC 2011 Final Standings
  language:
  - en
  teams: 64
  problems: 10
  times: false
  tries: false
  description: |-
    Final results page of the Central European Regional Contest 2011 on the organiser's website: 64 teams in rank order. Each row gives the place, a team number with country code and university abbreviation and the three members' names, a total time, a ten-slot marker with one position per problem showing a letter where the problem was solved and a blank where it was not, the number of accepted problems, and a link to the team's home archive. Per-problem times and numbers of attempts are not given.

    The winner solved 9 problems and the last-ranked team solved none. The website's menu is at the top of the page; the home archive links are not part of our copy, and the page images are saved with it.
