  description: |-
    Category page of the Baekjoon Online Judge, in Korean, named CERC 2011 and filed under ICPC Regionals, Europe, Central European Regional Contest. It lists ten problems A to J with Baekjoon problem numbers 3416 to 3425, title, marks such as special judge, source and multilingual, number of users who solved it, number of submissions and acceptance ratio. Eight titles are the English CERC 2011 titles (Boring Card Game, Vigenere Cipher Encryption, Unique Encryption Keys, Racing Car Trail, Stack Machine Programmer, Vigenere Cipher Analysis, The Grille, Unchanged Picture); the titles of F and J are in Korean. The statements are on separate problem pages that are not in our copy. The page also carries the judge's menus and lists of other contests.
