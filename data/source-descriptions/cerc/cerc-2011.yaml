  - en
  pages: 1
  description: |-
    One-page PDF with the final ranking of the CERC Cipher Contest, a side event held the day before the programming contest at the 2011 Central Europe Regional Contest, not the programming contest itself. It has 14 rows, in order of score, giving a time, team number, university, number of passwords with a password score, an opened-envelopes column with letters, and a total score; the rows name 16 team numbers, two rows listing two teams together. Scores run from 80 to 30. The top row is a team from Charles University with 4 passwords and 80 points.
