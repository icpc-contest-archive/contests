  title: Problems, inputs, outputs and oficial solutions
  language:
  - en
  problems: 10
  description: |-
    Page of links to the contest material on the organiser's website, in English: ten problems (Boring Card Game, Vigenere Cipher Encryption, Unique Encryption Keys, Racing Car Trail, Stack Machine Programmer, Strange Regulations, Vigenere Cipher Analysis, The Grille, Unchanged Picture, Stack Machine Executor). For each it links the input and output data (some inputs of 5 to 10 MB), the statement as PostScript and PDF, and official solutions in C and Java, with extra slow solutions for two problems. Below are links to an introduction sheet, a presentation of solutions and an archive of everything, and a statistics table with columns accept, compile, runtime, time, wrong and present for the ten tasks. The linked files are separate documents.
