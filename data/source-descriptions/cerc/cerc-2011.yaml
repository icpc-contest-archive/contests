  problems: 10
  description: |-
    Dashboard of a finished Codeforces gym contest titled 2011-2012 ACM-ICPC, Central Europe Regional Contest (CERC 11), in English. It lists ten problems A to J (Vigenere Cipher Analysis, Boring Card Game, Stack Machine Executor, The Grille, Stack Machine Programmer, Strange Regulations, Racing Car Trail, Unchanged Picture, Unique Encryption Keys, Vigenere Cipher Encryption), each with input and output type, a time limit between 1 and 15 seconds, a 256 MB memory limit and a count of solvers. The About section names the Croatian Computer Science Association and the University of Zagreb as organiser and host and gives 18 to 20 November 2016 as dates, which does not match the 2011 contest. The page links an English statements file but holds no statements, and also shows the dashboard's forms for questions and announcements.
- url: https://contest.felk.cvut.cz/11cerc/solved/solution-CERC-2011.pptx
  read: '2026-11-16'
  rubric: 1
  copy: cerc/cerc-2011/editorial/20261114-live-4ca0a9dc/page.html
  title: Sample Solutions — Central Europe Regional Contest 2011 — Czech Technical University in Prague
  language:
  - en
  problems: 12
  description: |-
    Slide presentation of the sample solutions of the Central Europe Regional Contest 2011, from the Czech Technical University in Prague, in English: a PowerPoint file of 53 slides. After the title slide it covers two practice problems (Ants and Electrician) and then the ten contest problems under their short names: Vigenere and Grille together as the easy ones, Execute, Program, Analyse, Regulate, Unique, Cards, Trail and Unchange. Most sections state the idea of the solution with examples, key observations, pitfalls and time complexity; the Vigenere and Grille section is a single remark that they were easy. The last slide lists the authors of the problems. It contains 12 images.
