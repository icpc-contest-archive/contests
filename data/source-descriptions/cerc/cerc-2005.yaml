  description: |-
    News page of the website of the Central European contest, in English, under a menu of home, news, dates, fees, location, general rules, technical rules, links, sponsors, tourist info, gallery and results. It is a list of 26 dated entries, newest first, running from 12 October 2004 to 22 November 2006.

    The six entries dated between 20 November and 7 December 2005 concern CERC 2005: the online contest ranking, press articles, media files shown at the opening ceremony, the problem set of CERC 2005 with a download link, reports on the contest in English and Hungarian, and home directories. An entry of 23 June 2006 offers the test data of last year's contest. The other entries are dated 2004 and 2006, plus one of 8 November 2005 about the Hungarian National Contest 2005, so the page is the site's news list for three years. The linked files are not part of our copy.
