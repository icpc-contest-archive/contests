    Standings of the 2017 Central Europe Regional Contest: 69 teams, each with rank, team name, institution, number of problems solved, time and a citation. The first 34 places carry an ordinal citation, First Place to Thirty-fourth Place, and the remaining 35 teams are marked Honorable Mention; four teams tie at rank 66 with no problem solved. University of Warsaw team UW1 is first with 10 problems and time 1536. The teams come from 29 institutions. There is no detail per problem.
