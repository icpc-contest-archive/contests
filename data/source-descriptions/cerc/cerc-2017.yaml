    Scoreboard on the CERC 2017 website: 69 teams, twelve problems labelled A to L. Each row gives rank, institution and team name with the three members in brackets, problems solved, penalty time, and for each problem the number of attempts with the solve time in hours and minutes in brackets for solved problems; unsolved problems show attempts only or a dash. The team in first place is University of Warsaw UW1 with 10 problems solved and 1536 penalty. Four teams share rank 66 with no problem solved. The page carries the site menu and no medal marks or first-solve marks.
