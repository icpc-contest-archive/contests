  description: |-
    Solution slides from the University of Zagreb: a PDF of 227 pages. The second slide lists the twelve problems A to L, each rated Easy, Medium or Hard. Each problem then gets its own section, in the order A, H, F, J, L, G, D, B, K, I, C, E, opening with the number of submissions and accepted runs, the team that solved it first and when, and the problem's author, followed by the solution worked through step by step with figures and complexity bounds. For three problems, C, D and E, the accepted count is printed as "?" and no first solver is given. The slides end with "Thanks!".
