  title: CERC 2017 CENTRAL EUROPE REGIONAL CONTEST 2017
  language:
  - en
  contest_date: '2017-11-19'
  description: |-
    Website of the 2017 Central Europe Regional Contest, in English, published by the Croatian Computer Science Association, which organises it, with the Faculty of Electrical Engineering and Computing, University of Zagreb, as host. The home page announces the contest in Zagreb on 17 to 19 November 2017, with students from seven countries (Austria, Croatia, Czech Republic, Hungary, Poland, Slovakia, Slovenia) and the best teams advancing to the World Finals in Beijing. Our copy holds 81 files, 30 of them pages, among them the schedule (registration on Friday, opening ceremony and practice contest on Saturday, contest and award ceremony on Sunday), an eligibility page, a photo gallery page, and a results page with a scoreboard of 69 teams, problems A to L, with attempts and times.

    The site also keeps the 2015 and 2016 editions as subsites: their home pages and results pages with scoreboards, the 2015 contest data page, presentation PDFs of the solutions for both years, and the 2015 problem statements PDF. The menu entries for rules, venue, organisers and the final report, and the 2017 contest data files (problem statements, test data, solutions), are not in our copy. Style sheets and the site's interface images are saved with the pages; the photographs of the gallery page are not.
