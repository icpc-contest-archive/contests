  description: |-
    Website of the 2013 Central Europe Regional Contest (CERC'13), the first tier of the ACM International Collegiate Programming Contest for that region, hosted by the Theoretical Computer Science Department at Jagiellonian University in Kraków, in English. Our copy holds 24 pages: news, ranking, final report, contest data, schedule, venue, accommodation, competition rules, links, an eligibility form as a PDF, and the problem and solution PDFs.

    The ranking page is the final results table of 72 teams, with problems solved, time and attempts per problem for A to L. The final report gives the contest day (17 November 2013, 9:30 to 14:30), 72 teams from 30 universities, 12 problems of which 10 were solved, and the top five teams. The contest data page offers a PDF statement for each of the 12 problems, the whole problem set as one PDF, the presentation of solutions as a PDF, and links to input and output archives. The input and output archives for problems C, E and H and the 106 MB archive of all data are not in our copy; the other nine problem archives are.

    The schedule covers 15 to 17 November (registration, opening, three lectures, practice session, the contest, problem discussion, award ceremony and banquet). The remaining pages give the local rules, the venue, three hotels and links to the sites of earlier CERC contests.
