  description: |-
    Final ranking page of the contest website: a table of 72 teams, each row giving the institution with the names of its three team members, the number of problems solved (Score), the total Time, and for each of problems A to L the number of attempts, followed by the time of the accepted run in hours and minutes when the problem was solved. Problems never attempted show a dash. Rows are ordered by problems solved and then by time; the Rank column is empty in every row. First place is Comenius University with 9 problems and a time of 1054, ahead of Jagiellonian University (9, 1387) and University of Warsaw (8, 688).
