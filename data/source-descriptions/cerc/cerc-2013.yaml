  description: |-
    Final report on the contest website, a short text by the host. It states that the contest was held from 15 to 17 November 2013 at Jagiellonian University in Kraków, with 72 teams from 30 universities of six countries, that the contest day was Sunday 17 November from 9:30 to 14:30 CET, and that the host's own Satori Contest System was the judge. There were 12 problems, of which 10 were solved during the contest; every team solved at least one and the maximum was 9.

    The page lists the top five teams with team name, university, members, problems solved and total time (Comenius University first with 9 problems and 1054 minutes) and links to the problem set and the full ranking.
