  description: |-
    Final standings of the contest, headed "CERC 1998 Final Standings", on a page with the flags of eight countries (Austria, Czech Republic, Hungary, Croatia, Latvia, Poland, Slovenia, Slovakia) at the top. 44 teams are listed in rank order with a country flag, a team number (cteam61 and so on), the institution name, a problems column and the total time as hours:minutes:seconds. The problems column is a small image for the nine problems A to I; its alternative text gives a letter for each problem solved and a dash for each not solved (the first row reads abcd--ghi). There are no attempt counts and no per-problem times.

    Below the table, a Submit Statistics table gives, for each of A to I and in total, the number of submissions by outcome (Accepted, Compile Error, Runtime Error, Time Limit Exceeded, Wrong Answer, Presentation Error); 100 of 638 submissions were accepted. A Runtime Analysis section lists, for eight of the problems, the running times of accepted solutions with the team number and the language (C, C++ or Pascal) against the time limit of the problem.

    The images that draw the solved problems are loaded from another server and are not in our copy; their alternative text is.
