  contest_date: '1998-11-14'
  description: |-
    Website of the 1998 Central European Regional Contest, in English. Our copy holds three pages: the front page, the final standings and the problem set, plus an archive of sample solutions.

    The front page says the contest is over, names Comenius University Bratislava as the winner and Warsaw University as the second team advancing to the World Finals, and links to the standings, the problem set, sample solutions, test data, a public inquiry page and pictures from the event. A Judges' Comment on it says that the problem "cipher" had an error: the sample solution makes an invalid assumption about the decryption, many contestants' solutions made the same one, and the test data are correct. The standings page lists 44 teams with results for nine problems; the problem set page has nine statements dated November 14, 1998. The sample-solutions archive holds C sources for nine problems and Pascal sources for eight of them (all but hares).

    The test data archive and the inquiry and pictures pages that the front page links to are not in our copy, and neither are any of the images used by the pages.
