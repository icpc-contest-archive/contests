  description: |-
    Problem set of the contest, in English: one HTML page headed ACM International Collegiate Programming Contest 1998/99, sponsored by IBM, Central European Regional Contest, Dept. of Computer Science, Czech Technical University in Prague, November 14, 1998. It opens with a letter to the contestants, "The Antique Theater", that frames the problems around a theater ensemble called Antique Comedians of Malidinesia.

    Nine problems follow, each with a statement, input and output specification, a sample input and the output for it, and the file names to use for the solution: Adding Reversed Numbers, Copying Books, Substitution Cipher, Commedia dell' arte, Calculating Expressions on Turing Machine, Skyscraper Floors, Glass Beads, Hares and Foxes and Invitation Cards. No test data or solutions are on the page.
