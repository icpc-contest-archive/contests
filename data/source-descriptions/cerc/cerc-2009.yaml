  description: |-
    Problems page of CEPC'09, in English. It lists two trial session problems (Saturday, November 7, 2009, 15:30-17:30 CET), Can you add this and Lost in Space, and the eleven problems of the contest (Sunday, November 8, 2009, 9:00-14:00 CET): Accountant notes, Better and faster, Cave, Decision, Everybody may get lost in space, (False) faces, Garlands, Hypervisor MacrOS, Island, Jack's socks and Knowledge for the masses. Each entry links to a statement PDF and to a zip file of tests. The page holds only the names and links; the linked files are not part of this document.
