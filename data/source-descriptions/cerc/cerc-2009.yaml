    Results of CEPC 2009 as a news item on the Wrocławski Portal Informatyczny, in Polish. The main table has 75 rows, each with a number, a team identifier with university and team name, the points (problems solved), the time and the solved problems as letters (B, C, D, I, J and K appear), some followed by asterisks or a number in brackets. The first row is Warsaw Owls 09 of the University of Warsaw, with six problems. Nine of the rows are high school teams, which the text says were invited and took part outside the competition; they carry team identifiers starting with lo and school names, and are not marked otherwise.

    Below the table are the names of the members of the first ten teams and of the invited high school teams, with their schools.
