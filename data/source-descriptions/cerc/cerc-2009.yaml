  description: |-
    Website of the Central European Programming Contest '09 (CEPC'09), held on November 6-8, 2009, made by the Institute of Computer Science of the University of Wrocław, in English. Our copy holds 129 pages, 93 of them belonging to the photo galleries; of the photographs themselves our copy holds one JPEG file. Two further pages are of the following contest at the same address, the Central European Regional Contest '10: a solutions page and an aquapark page.

    The 2009 pages cover news, important dates, fees, invoices, travel hints, accommodation, directions to the City Hall, venue, general and technical rules, a checklist, sponsors, media partners and previous contests. The news page records that an online ranking frozen one hour before the end of the contest, including high school teams, was published, and lists later additions such as a video of the award ceremony and solution sketches.

    A ranking page points to the results on another site. The problems page is in our copy; of the statements, only two PDFs are (problem A, two pages, and problem E, one page), together with a 29-page PDF with the solution of problem H. Test files, the schedule and the registration page are not in our copy.
