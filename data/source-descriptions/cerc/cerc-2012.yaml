  language:
  - en
  contest_date: '2012-11-18'
  teams: 77
  problems: 11
  description: |-
    Final report on the organisers' website, in English. It states that the contest was held on Sunday 18 November 2012 in the building of the Faculty of Mathematics and Computer Science, hosted by the Theoretical Computer Science Department at Jagiellonian University in Kraków, from 9:30 to 14:30 CET, with 77 teams from 31 universities in six countries, judged on the organisers' own Satori Contest System. It says there were 11 problems, 10 of them solved during the contest, every team solved at least one, and the best teams solved 10.

    It lists the top five teams with university, problems solved and total time in minutes: two teams with 10 problems and three with 9, the first being from Comenius University. A link leads to the full ranking.
