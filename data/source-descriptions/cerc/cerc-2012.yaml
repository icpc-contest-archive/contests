  description: |-
    Ranking page of the Central Europe Regional Contest 2012 with a scoreboard of 77 teams against 11 problems labelled A to K. Each row names the university and the three team members, then gives the Score (the number of problems solved; it equals the number of solved cells in every row), a total time, and for each problem the number of tries with the solve time in hours and minutes, for example 1 (0:45). A problem that was tried but not solved shows only the number of tries, and an untouched problem shows a dash. The rows are in rank order but the Rank column is empty, and the header row is repeated under the table. The top two rows have 10 problems solved and the last row has 1; the first five rows agree with the final report.
