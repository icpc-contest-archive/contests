  title: CERC'12 - Central Europe Regional Contest 2012 - Kraków, November 16-18, 2012
  language:
  - en
  contest_date: '2012-11-18'
  description: |-
    Website of the Central Europe Regional Contest 2012 in Kraków, in English, hosted by the Theoretical Computer Science Department at Jagiellonian University, with an event sponsor and a strategic partner shown as logos (a news item names Google as the strategic partner). Our copy holds 18 pages in 37 files. The pages are a home page with dated news, a ranking page, a final report, a contest data page, the schedule of 16 to 18 November 2012, venue, accommodation with hotel prices, registration and fees, general rules, technical rules, and a links page naming earlier editions of the contest from 1995 to 2011 with their host universities.

    The contest data page links statements, test data and model solutions for the eleven problems A to K. Our copy holds the statement PDFs of problems A to G (one or two pages each), the test data of A to G and the model solutions of A to F; the files for H to K, the solutions of G, the all-statements PDF and the all-data archive are missing. Style sheets and logos are present; the three hotel photos are missing. Links to the ICPC site and earlier contest sites lead to other servers.
