  description: |-
    Final standings of the 2012 Central Europe Regional Contest: 77 teams with rank, team name, institution, number of problems solved, a time and a citation. The citation column reads First Place through Thirty-seventh Place for the top 37 and Honorable Mention for the other 40. The first-place team, from Comenius University, solved 10 problems with time 1205, and the last has 1 problem. Times are single numbers, with no per-problem detail.
