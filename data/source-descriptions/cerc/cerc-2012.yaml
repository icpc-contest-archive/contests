  description: |-
    Solution slides from Jagiellonian University, dated November 28, 2012 on the title slide: a PDF of 95 pages holding 29 slides, many repeated as they build up step by step. A first slide of numbers gives 1006 submissions, 310 accepted, and the times and universities of the first and last accepted runs. It then explains all eleven problems, in the order H Darts, C Chemist's Vows, A Kingdoms, J Conservation, E Word equations, D Non-boring sequences, I The Dragon and the knights, K Graphic Madness, G Jewel heist, B Who wants to live forever? and F Farm and factory, ending on the last slide of problem F.
