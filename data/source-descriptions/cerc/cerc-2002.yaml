  description: |-
    Final standings of the contest in Warsaw, from the contest website: 61 teams. The 30 ranked teams, places 1 to 30, each have a login and team name followed by its institution, points, total time and a Tasks column; the other 31 teams, with 0 points and dashes for time and tasks, are listed as Honorable Mention without a login and with the institution before the team name. Points equal the number of problem letters in Tasks. Tasks lists the letters of the problems the team solved, some followed by asterisks and one entry, F*(8), with a number in brackets; the page explains neither. Problems A, B, C, D, F, G and H appear in the Tasks column; E does not appear for any team. The Warsaw Eagles team of Warsaw University is first with 7 points in 23:12:23. The login of each ranked team is a link to a team information page, which is not in our copy.
