  description: |-
    Final standings of the Central European Regional Contest 2007 as published on the organisers' website: 67 teams in rank order, each row giving the team number with country code and institution abbreviation, the team members' names, the total time, the number of problems accepted (nine for the first-placed team, one for the last 17) and a link to a zip file of the team's submissions. No per-problem columns and no attempts are shown, and the page marks no unofficial or guest teams.

    The page carries the site's menu above the table.
