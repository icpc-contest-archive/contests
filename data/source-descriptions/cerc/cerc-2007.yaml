  title: Central European Regional Contest 2007, Prague, Czech Republic
  language:
  - en
  contest_date: '2007-11-11'
  problems: 10
  description: |-
    Website of the Central European Regional Contest 2007, written in English and made by the Czech Technical University in Prague, Faculty of Electrical Engineering, Department of Computer Science and Engineering. Our copy holds 94 pages. The menu pages are news, important dates with the schedule of the contest weekend (registration and practice session on Saturday 10 November, contest on Sunday 11 November), fees, accommodation, location, general rules, technical rules, links, sponsors and tourist information, plus a four-page fact sheet PDF. The home page says the contest was held on November 10-11, 2007 and that more than 70 teams from eight countries were expected.

    The results and problem material is inside: a final standings page of 67 teams, a problems area with the statement of each of the ten contest problems (B, C, H, K, L, N, P, R, S, W), each with input and output specification and a sample, a one-page cover sheet of the problem set, and the statements of five practice session problems. C source files sit beside the problem pages, and eight submitted solution files from contestants are also in our copy.

    A link to the ICPC rank page on another server is not part of our copy.
