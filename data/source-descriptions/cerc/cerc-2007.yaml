  description: |-
    Category page of the Baekjoon Online Judge for CERC 2007, written in Korean, filed under ICPC Regionals, Europe, Central European Regional Contest. A table of 15 problems gives for each the Baekjoon problem number, a label (in a column without a heading), the title, the number of users who solved it, the number of submissions and the acceptance ratio. Ten problems carry the contest's labels B, C, H, K, L, N, P, R, S and W; five more are labelled PA to PE. Most titles are the English ones (such as Strange Billboard and Robotic Sort); the titles of P and of PA to PD are in Korean. The statements are on pages the table links to, not on this page.

    The statistics are those of the day the page was saved. Menus and footer are those of the judge's site.
