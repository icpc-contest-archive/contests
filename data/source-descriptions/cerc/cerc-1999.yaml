  description: |-
    Problem set of the contest, in English: one HTML page headed ACM International Collegiate Programming Contest, sponsored by IBM, Central Europe 1999 Regional Contest, Czech Technical University in Prague, Dept. of Computer Science, Faculty of Electrical Engineering, November 13, 1999. An introduction addressed to the contestants frames the problems around a team called Archaeologists of the Central Mountains and a pyramid.

    Eight problems follow, each with a statement, input and output specification, a sample input and the output for it, and the file names to use for the solution: Run Away, Equipment Box, Secret Code, The Proper Key, Labyrinth, Piggy-Bank, Lifting the Stone and Play on Words. No test data or solutions are on the page.
