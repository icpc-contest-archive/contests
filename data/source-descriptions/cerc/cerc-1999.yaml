  description: |-
    Page of the organisers, in English, titled "CERC 1999: Sample Solutions and Test Data". A table lists the eight problems (away, box, code, key, labyrinth, pig, stone, words) with the judges' solution in C or C++ and in Pascal, each with its running time, links to the test input and the expected output, and the time limit of the problem, from 2 s to 50 s. Away has a Pascal solution only. The page says that the Pascal solution of away probably has minor errors, that the C solution of words has an error found by a contestant, and that the judges' test data is correct in both cases. No explanations of the solutions are given.
