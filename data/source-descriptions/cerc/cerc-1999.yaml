  read: '2026-11-16'
  rubric: 1
  copy: cerc/cerc-1999/website/2026-09-03-live-c0853a0e
  title: Central European Regional Contest, 1999
  language:
  - en
  contest_date: '1999-11-13'
  description: |-
    Website of the 1999 Central European Regional Contest, in English. Our copy holds seven pages: the front page, the final results, the problem statements, the sample solutions with test data, the list of all submits, the home directories page and the public inquiry. The front page announces the contest for November 12th and 13th, 1999, points to the Central Registration System for registration, and offers contestants one year of free ACM membership through a web form.

    The final results page has 47 teams, and the problem statements page has eight problems. The submits page lists 824 submits with time, team, university, file and result; it gives contest start 10:09:12 and contest stop 15:15:00, and the last eight submits, all after the stop, are marked "submit ignored". The home directories page lists 47 teams with a link to an archive of each team's directory. The public inquiry is a questionnaire for coaches and contestants with questions answered on a scale of six grades about the web pages, e-mail, hotel, staff, presentation, system, food, the problem statement and the award ceremony.

    Our copy also holds the 16 test data files (input and expected output for each of the eight problems), 15 files of the judges' sample solutions (C or C++ and Pascal; away has Pascal only), and 96 of the 824 submitted sources. The other 728 submitted sources and the 47 home directory archives are not in our copy, and neither are the header and footer images of the pages; the eight country flags are in it.
