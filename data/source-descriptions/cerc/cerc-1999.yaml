  description: |-
    Final results of the contest, headed "CERC 1999 Final Results", with the flags of eight countries at the top. 47 teams are listed in rank order with a country flag, team number, institution and total time. The problems column is an image per team whose alternative text has one position for each of the eight problems (away, box, code, key, labyrinth, pig, stone, words) with the first letter of each solved problem and a dash for each unsolved one; the first team reads -bcklpsw. The first place is Charles University Prague 2.

    A statistics table gives the number of submissions for each problem by outcome (accepted, compile error, runtime error, time limit exceeded, wrong answer, presentation error): 111 of 810 submissions were accepted. A text grid under it gives, for every team and problem, how often each of the outcome columns A, C, R, T, L, W, P occurred; the legend below it explains six of the seven.

    The images that draw the solved problems are loaded from another server and are not in our copy; their alternative text is.
