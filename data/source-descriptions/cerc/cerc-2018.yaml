  title: Central European Regional Contest 2018 in Prague
  language:
  - en
  contest_date: '2018-12-02'
  description: |-
    Website of the 2018 Central Europe Regional Contest, in English, hosted by the Czech Technical University in Prague and run on the contest.felk.cvut.cz server. The home page says the contest was held from 30 November to 2 December 2018 and selects teams for the World Finals of the 43rd ACM International Collegiate Programming Contest. Our copy holds 40 files, 23 of them pages: news, dates and schedule (arrival on Friday, opening ceremony and practice session on Saturday, contest on Sunday), fees, accommodation, location, general and technical rules, organizers, partners, tourist information, and a contest page that links the problems, official solutions, final rank, photos and submitted solutions.

    Results and problem material inside the site: a final standings page, a page of problems with inputs, outputs and official solutions, a log of submitted runs, a text file of clarifications, and PDF statements of six problems (Clockwork ||ange, Trees Gump, Incredible Hull, The Lord of the Kings, Matrice, Game of Stones). The news page also carries leftover entries from the 2011 edition in a commented-out block. The linked zip archives, the photos and the other statements are not in our copy.
