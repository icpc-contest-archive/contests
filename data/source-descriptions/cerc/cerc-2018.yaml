    Category page of the Baekjoon Online Judge, in Korean, named CERC 2018 and filed under ICPC Regionals, Europe, Central European Regional Contest. It lists twelve problems with Baekjoon numbers 16694 to 16705, labelled A, B, C, D, G, H, I, K, L, M, R and S as in the contest (The ABCD Murderer to Game of Stones), and for each the number of users who solved it, the number of submissions and the acceptance ratio. Problem D is marked as special judge. The statements are on separate pages that are not part of our copy.
