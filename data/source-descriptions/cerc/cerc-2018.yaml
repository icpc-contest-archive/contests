  description: |-
    Slides of the CERC 2018 presentation of solutions, dated December 2, 2018: a PDF of 76 pages produced with LaTeX Beamer, in English. Each of the twelve problems has its own slides with the idea of the solution and its complexity, in the order Silence of the Lamps, Clockwork ||ange, Matrice, Trees Gump, Game of Stones, The ABCD Murderer, Shooter Island, Reservoir Dog, Incredible Hull, The Bridge on the River Kawaii, The Lord of the Kings and Mirrority Report. The ABCD Murderer has the jury solution and three alternative approaches, Reservoir Dog two methods (binary search and an exact formula), and Mirrority Report ends with extra cases. The last slide is a thank-you slide.
