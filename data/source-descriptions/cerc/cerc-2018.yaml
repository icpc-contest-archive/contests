  description: |-
    Scoreboard headed CERC 2018 Final Standings: 74 teams ranked by score, shown as problems solved and penalty time (12 / 1914 for the first team, UW1 of the University of Warsaw), with one column for each of twelve problems named Abcd, Bridge, Clockwork, Dog, Gump, Hull, Island, King, Lamps, Matrice, Report and Stones. Each team is given as a team number, team name, school and the three members. A solved problem shows attempts and time (1/59); an unsolved one shows the number of attempts, or 0. Fourteen teams share rank 61 with no problem solved.

    A second table headed Unofficial lists three high school teams in the same format; they are not in the main ranking. The team numbers link to files that are not in our copy.
