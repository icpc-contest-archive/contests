    Standings of the 2018 Central Europe Regional Contest: 74 teams, each with rank, team name, institution, number of problems solved, time and a citation. The first 37 places carry an ordinal citation, First Place to Thirty-seventh Place, and the other 37 teams are marked Honorable Mention. University of Warsaw team UW1 is first with 12 problems and time 1914; 14 teams share rank 61 with no problem solved. The teams come from 32 institutions. There is no detail per problem.
