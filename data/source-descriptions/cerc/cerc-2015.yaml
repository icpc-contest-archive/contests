  description: |-
    Scoreboard on the contest website: 62 teams ranked by problems solved and penalty, with twelve problem columns A to L. Each row gives rank, a team name that combines the institution, the team number and the surnames of its members (three for 60 teams, two for two teams), the number solved and the penalty. Each problem cell shows the number of attempts with the solving time in hours and minutes, or the attempts alone for an unsolved problem, or a dash for none.

    First place is University of Warsaw #1 with 10 problems. Two teams share rank 61 with no problem solved. The page also carries the contest menu; its other pages are not in this file.
