  description: |-
    Website of the Central Europe Regional Contest 2015, in English, organised by the Croatian Computer Science Association and hosted by the Faculty of Electrical Engineering and Computing, University of Zagreb, on 13 to 15 November 2015. Our copy holds one page, the home page, with its style sheets, script and images. It welcomes visitors, names the seven countries whose students take part (Austria, Croatia, Czech Republic, Hungary, Poland, Slovakia, Slovenia) and says the best teams advance to the ACM ICPC World Finals in Phuket, Thailand, in May 2016.

    The menu lists Schedule, Participation Fee, Eligibility, Venue, Accommodation, Organizers, Contact, Competition Rules, Contest Data, Results, Final Report, About Zagreb and About Croatia. Those pages are not part of this copy; the links on the page lead to external sites.
