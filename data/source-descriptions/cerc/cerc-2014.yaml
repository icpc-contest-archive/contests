- url: https://cerc.tcs.uj.edu.pl/2014/news.html
  read: '2026-11-16'
  rubric: 1
  copy: cerc/cerc-2014/website/2026-09-03-live-23512f2b
  title: CERC'14 Central Europe Regional Contest 2014 Kraków, November 14-16, 2014
  language:
  - en
  contest_date: '2014-11-16'
  description: |-
    Website of the 2014 Central Europe Regional Contest, hosted by the Theoretical Computer Science Department at Jagiellonian University in Kraków, in English. Our copy holds 18 pages: nine HTML pages (news, ranking, final report, contest data, schedule, venue, accommodation, competition rules, links) and nine PDF problem statements.

    The news page announces the end of the contest and congratulates the winners from the University of Zagreb. The final report states 78 teams from 32 universities in seven countries, a contest day of Sunday 16 November 2014 from 9:30 to 14:30, 12 problems of which 11 were solved, and lists the top eight teams. The ranking page is a scoreboard of problems A to L. The contest data page lists problems A to L with links to a statement PDF and to input, output and solutions for each problem. The schedule covers 14 to 17 November, with sponsor lectures on 15 November. The links page points to the earlier CERC sites back to 1995.

    The nine statement PDFs in our copy are for problems A, C, D, E, G, H, I, J and K. The input, output and solutions archives of eight problems (A, B, D, E, F, H, I, K) are in our copy. Statements B, F and L, the archives for C, G, J and L, the combined problem set, the presentation of solutions and the archive of all data are linked but not in our copy.
