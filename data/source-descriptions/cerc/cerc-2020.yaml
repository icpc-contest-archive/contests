  read: '2026-11-16'
  rubric: 1
  copy: cerc/cerc-2020/problemset/20261101-live-ef1457e5/solved.html
  title: Problems, inputs, outputs and oficial solutions
  language:
  - en
  problems: 11
  description: |-
    Problem page on the contest's website listing the eleven problems of CERC 2020 by name, from Art Transaction to Screamers. For each problem it links three files: a zip of input and output data, the statement as a PDF, and a zip of official solutions. The last rows link a PDF of all problems, the presentation of solutions and a tar.gz archive of all problems (44 MB). The page holds only links; the files themselves are not part of our copy. In English.
