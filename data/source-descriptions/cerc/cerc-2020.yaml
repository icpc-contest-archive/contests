  description: |-
    Dashboard of the 2020-2021 ICPC Central Europe Regional Contest on QOJ.ac, filed under the judge's category ICPC / Regionals / Europe / Central Europe. It lists eleven problems A to K, Art Transaction to Screamers. The page shows the contest as ended, with the ICPC ruleset, a 20-minute penalty and a limit of 1000 submissions per problem, offers a virtual contest, and has an attachment named Statements (en). Notices and questions are empty. The statements attachment is not part of our copy.
