  rubric: 1
  copy: cerc/cerc-2020/judge-codeforces/20261103-live-606184cf/page.html
  title: Dashboard - 2020-2021 ICPC Central Europe Regional Contest (CERC 20) - Codeforces
  language:
  - en
  problems: 11
  description: |-
    Codeforces gym dashboard of the 2020-2021 ICPC Central Europe Regional Contest (CERC 20), marked Finished. The problem table lists eleven problems lettered A to K, from Art Transaction to Screamers, each with its limits (standard input/output, 5 seconds, 1024 MB) and a count of solvers. Links under contest materials lead to two statement files (English) and a tutorial. The page also carries the menus and forms for virtual participation and questions. The statements and tutorial are not part of our copy.
