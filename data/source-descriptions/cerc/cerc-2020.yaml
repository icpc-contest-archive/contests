# Written by tools/describe_apply.py from readings of the copies we hold. See README.md in data/source-descriptions.
contest: cerc-2020
sources:
- url: https://contest.felk.cvut.cz/20cerc/
  read: '2026-11-16'
  rubric: 1
  copy: cerc/cerc-2020/website/2026-09-03-wayback-dcfade8f
  title: Central European Regional Contest 2020 in Prague
  language:
  - en
  contest_date: '2021-09-26'
  description: |-
    Website of the 2020 Central Europe Regional Contest (CERC 2020), hosted by the Czech Technical University in Prague and organised with the Czech ACM Chapter. The front page says the contest was held online on 25 and 26 September 2021 with 88 teams from seven European countries. Menu pages cover news (credentials sent to contestants, links to the online stream, technical rules updated, the announcement of the online format), the tentative schedule (opening ceremony and practice session on Saturday 25 September, the five-hour contest on Sunday 26 September, problem set discussion and award ceremony), fees (states no registration fee), general and technical rules, organizers and partners (Huawei and JetBrains as ICPC sponsors, plus a local partner). Two one-page PDFs on eligibility are also included: a certificate of eligibility form for a team and an eligibility decision diagram.

    The contest page links the problems with official solutions, the final rank and the submitted solutions of contestants; the presentation of solutions is linked from the problems page. Our copy holds 21 pages: 12 web pages and 9 PDFs. Of the statement PDFs only five are present (Art Transaction, Pizzo Collectors, Excavation, Tobacco Growing, Pickpockets); the combined all-problems PDF and the presentation PDF are cut short at 1 MiB and cannot be opened in full. The zip files of data and solutions, the page of submitted solutions and the streams are not part of our copy.
- url: https://contest.felk.cvut.cz/20cerc/rank.html
  read: '2026-11-16'
  rubric: 1
  copy: cerc/cerc-2020/scoreboard/20260901-live-0ec41186/rank.html
  title: CERC 2020 Final Standings
  language:
  - en
  teams: 88
  problems: 11
  times: true
  tries: true
  description: |-
    Final scoreboard on the contest's website: 88 team rows, each with rank, team name and institution, the team members, a score in the form solved / penalty time (the first-place team, University of Wroclaw's UWr1, has 9 / 872), and one cell for each of eleven problems, headed art, bank, collectors, excavation, growing, mission, offices, pickpockets, problems, roof and screamers. A solved problem shows attempts/time (1/217); an unsolved one shows the number of attempts alone, or 0. Three teams with no solved problem share rank 86. One table only; no unofficial or guest teams are listed separately.
- url: https://icpc.global/regionals/finder/Central-Europe-2021/standings
  read: '2026-11-16'
  rubric: 1
  copy: cerc/cerc-2020/standings/api-20261113/standings.html
  title: The 2020 Central Europe Regional Contest — standings
  language:
  - en
  teams: 88
  description: |-
    Final standings of the 2020 Central Europe Regional Contest: 88 teams with rank, team name, institution, a Solved column, a Time column and a citation. Places 1 to 44 carry the citation First Place through Forty-fourth Place and the rest are listed as Honorable Mention; three teams share rank 86. The ranks match those of the contest website's scoreboard (University of Wroclaw's UWr1 first), but the Solved column holds numbers such as 217, 229 and 192, not counts of solved problems, and the Time column is empty in every row. No per-problem results.
