  description: |-
    Slides of the presentation of solutions to CERC 2020, dated September 26, 2021: a PDF of 89 pages. After the title page there is one section for each of the eleven problems, starting with Rescue Mission and ending with Art Transaction, starting with the task and followed by observations and the solution. The last page is a thank-you slide. In English.
