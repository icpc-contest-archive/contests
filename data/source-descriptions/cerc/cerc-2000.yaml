  title: Central European Regional Contest, 2000
  language:
  - en
  contest_date: '2000-11-10'
  problems: 9
  description: |-
    Website of the 2000 Central European Regional Contest, in English, from the Czech Technical University in Prague (Faculty of Electrical Engineering, as the problem statements page states). The front page says the contest was held on November 10th and 11th, 2000 and links to five parts: final results, problem statements with sample solutions and test data, all submits, home directories, and statistics.

    Our copy holds 119 files. The final results page lists 49 teams with rank, team code, institution, a time, the number of problems solved and a strip of nine slots marking the problems solved. The problem statements page has nine statements with sample input and output, linked to .c and .p sample solutions for all nine problems and to test input and output files, four of each in our copy. The statistics page gives submission counts per problem and run times of accepted solutions. The home directories page lists 49 teams with a link to a gzip archive each; five archives are in our copy. 47 files hold submitted programs. The schedule page covers Thursday 9 to Sunday 12 November, and one page is the accommodation registration form for Hotel Krystal.

    The index page of all submits is not in our copy, and most archives and part of the test data are missing. The letter icon of problem F on the statements page is also missing.
