  description: |-
    Problem set of the 2000 Central European Regional Contest as one page titled 'Problems Statement: CERC 2000', in English. The header reads ACM International Collegiate Programming Contest, Sponsored by IBM, Central Europe 2000 Regional Contest, Czech Technical University in Prague, Dept. of Computer Science, Faculty of Electrical Engineering, November 11, 2000. An introduction from the organising team, themed on a mobile communications company, is followed by nine problems in this order: Simple Arithmetics, The Bulk, Complete the sequence!, Direct Visibility, Complicated Expressions, Factorial, The Game of Master-Mind, Hotline, I-Keyboard. A strip of nine letter icons, a to i, stands beside the list of problems.

    Each problem has a statement with Input Specification, Output Specification, one Sample Input and one Sample Output, and the file names to use for the solution (.c, .p, .C). The file names .c, .p, .in and .out under each title are links; the files they lead to are not part of this copy. The images of the page are present.
