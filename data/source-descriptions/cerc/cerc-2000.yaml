  description: |-
    Final results of the 2000 Central European Regional Contest, a plain page from the contest organisers: 49 teams in rank order. Each row gives the rank, a team code, the institution name (with a number where an institution entered several teams), a time in hours:minutes:seconds, the number of problems solved and a strip of nine slots. In the strip a letter icon, linked to the problem's statement, marks each solved problem and an empty mark an unsolved one; six different letters occur (f, c, i, e, g, a). First place is Warsaw Univ. 1 with 6 problems solved in 09:26:27.

    There are no per-problem times or numbers of attempts, and no medals or other marks. The icons are present in our copy.
