  description: |-
    Statistics page of the 2000 Central European Regional Contest. A table gives the submissions per problem for eight problems (factor, complete, ikeyb, expr, arith, bulk, game, direct) in the columns accept, compile, runtime, time, lib, wrong and present, with a total for each problem and in all: 506 submissions, of which 119 accept. The problem hotline is not in the table.

    Under the heading 'Run-times of accepted problems' follow lists for six problems (arith, complete, expr, factor, game, ikeyb), one line for each of the 119 accepted solutions with a time of day, a team code, the source file name and a run time in seconds, and each list ends with a TIMEOUT line giving a number of seconds. The page does not list teams or rank them.
