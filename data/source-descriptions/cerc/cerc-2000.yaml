    Problem list of the category CERC 2000 (under ICPC Regionals, Europe, Central European Regional Contest) on the Baekjoon Online Judge, in Korean. A table gives nine problems numbered 3469 to 3477 and lettered A to I, each with its title, a labels column, the number of people who solved it, the number of submissions and the percentage of correct submissions. Eight titles are the contest's English ones (Simple Arithmetics to I-Keyboard, with Hotline as H); problem F carries a Korean title, not Factorial.

    The page is the judge's list only: the statements are not in our copy, and the problem links lead to pages on the judge that are not part of it. Around the table are the site's menus and footer.
