  description: |-
    Front page of the site of the ACM International Collegiate Programming Contest at the Czech Technical University in Prague, in English, with a menu of general information (rules and environment, accommodation in Prague, frequently asked questions, how to get there, the organising team, other sites and problem archives) and a schedule link for CERC. It names three contests held at the university: the FEE Local Contest and the CTU Open Contest, both in Czech, and the Central Europe Region contest, in English.

    Eleven news items are listed, dated 1999/03/05 to 2000/10/26. The newest announce that registration for accommodation for CERC 2000 opened on 2000/10/13 and closed on 2000/10/26; the others concern the 1999 contests and the registration forms for the 2000 local and CTU Open contests. Our copy holds this one page and its images; the pages it links to are not part of it.
