  copy: cerc/cerc-2001/website/2026-10-20-wayback-b65925d6
  title: ACM Central European Programming Contest 2001 / Poland
  language:
  - en
  contest_date: '2001-11-18'
  description: |-
    Website of the 2001 ACM Central Europe Programming Contest in Warsaw, hosted by the Faculty of Mathematics, Informatics and Mechanics of Warsaw University, in English. The front page is a frameset with a menu and a welcome page whose one news item, dated 12 July 2001, says that hotel information, the timetable and the fees will be available in September.

    Our copy holds 9 pages: the frameset, the menu, the welcome page, the contest rules (contest weekend 16 to 19 November 2001, team composition, eligibility, advancing to the World Finals, appeals), a page on the computing environment (Linux workstations; C, C++ and Pascal), the schedule for Friday to Sunday, the fees page (with the payment instructions for Polish teams in Polish), a page of useful information on money, transport and sightseeing in Warsaw, and the final standings of 60 teams. It also holds 41 images and 2 style sheets.

    The problem statements are not in our copy, and neither is the news archive that the welcome page links to. The menu on the left links to the pages listed above.
