  description: |-
    Website of the Central European Regional Contest 2023 in Ljubljana, Slovenia, published by ACM Slovenia, in English. It is a single page with sections for the schedule (registration deadlines, a Friday registration, a Saturday practice contest, and the Sunday contest and award ceremony), participation and eligibility, the participation fee, contest rules, the contest and its results, a gallery, venue, location, accommodation, sponsors, organizers and contact. The footer lists the websites of earlier editions from 2015 to 2022.

    The results section holds a scoreboard of 60 teams with rank, team name with a country flag, score, total time, and for each of the twelve problems A to L (Attendance to Labelled Paths) a cell with the number of attempts and a time. First place is Jagiellonian teapots with 10 problems. Links lead to the tasks, the public scoreboard, the contest system, test data and solutions, and the presentation of solutions; those targets are not part of our copy. Our copy holds the one page with its images and style sheets.
