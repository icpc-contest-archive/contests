    Slides of the solution presentation of the contest, in English: 16 pages with a title slide dated Ljubljana, 10 December 2023, and slides for all twelve problems A to L. The first slide of each problem gives the problem title, two numbers in parentheses after it, a one-line summary and bullet points on the solution idea, with diagrams for some. The order runs E, B, H, G, I, C, D, K, J, L, A, F; problems A and F have a second slide, and the last page reads The End.
