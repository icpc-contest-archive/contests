    Final standings of the 2023 ICPC Central Europe Regional Contest: 60 teams with rank, team name, institution, number of problems solved, total time, medal, and a place citation. Jagiellonian teapots from the Jagiellonian University in Krakow is first with 10 problems solved and is marked Champions of Central Europe. Two teams have a gold medal, three silver and four bronze; teams from tenth place on have no medal. The lowest team solved no problems. No per-problem results.
