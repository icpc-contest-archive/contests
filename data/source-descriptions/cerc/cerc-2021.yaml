  description: |-
    One-page website of the 2021 Central European Regional Contest, in English, organised by ACM Slovenia in Ljubljana. It carries the announcement with two dated updates (the contest ran online from 22 to 24 April 2022 in local proctored environments, with a separate unofficial contest for teams not accepted), the schedule of the practice day and the contest day, eligibility and participation fee, rules, links to the tasks, public scoreboards, test data and contest system for the practice, the contest and the unofficial contest, a link to the official solution slides, a gallery of promotional and presentation videos, and the organisers.

    The results table lists 61 teams with rank, team name, score (the number of solved tasks) and total time, and for each of the twelve problems A to L either its name, when not tried, or the number of attempts and the penalty time. Links to the contest system and to the other scoreboards lead outside our copy.
