  description: |-
    Slides titled Task overview for the Central Europe Regional Contest 2024, dated 15 December 2024, Wroclaw, in English. The deck has 100 PDF pages, numbered as 65 slides because many slides are built up over several pages. It opens with contest statistics (954 submissions, of which 823 in C++, 111 in Python 3 and 20 in Java; total test runs, source sizes, and the latest submission).

    It then has a section for each of the twelve problems, in the order C, D, B, L, I, K, F, E, H, G, J, A. Each section explains the task and its solution. The last page reads Thank you.
