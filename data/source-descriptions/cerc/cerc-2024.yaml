  description: |-
    Website of the Central European Regional Contest 2024, held at the Institute of Computer Science of the University of Wrocław, Poland, in English. It announces the contest for 13 to 15 December 2024, with teams from Austria, Croatia, Czech Republic, Hungary, Latvia, Poland, Slovakia and Slovenia, and has pages for important dates, the fee of 60 EUR per person, travel hints, the venue (the Institute, the Wrocław University Library where the contest is held, and the City Hall for the award ceremony and banquet), a preliminary schedule from Friday to Sunday, general rules, sponsors, accommodation, previous CERC contests and contact.

    A results page gives the scoreboard of 70 teams for problems A to L. A one-page eligibility form for a team is a PDF. Our copy holds 34 saved files: twelve pages of the site, several of them captured twice, the eligibility form, and style sheets and images.
