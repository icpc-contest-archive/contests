  description: |-
    Problem set of the Delft Algorithm Programming Contest 2026 (DAPC), the Delft site of the BAPC preliminaries, as a PDF of 29 pages in English. The cover lists thirteen problems A to M, from Ambagaata to Manic Ceramic, and the next page gives the copyright to the BAPC 2026 Jury under a Creative Commons Attribution-ShareAlike licence.

    Each problem has a statement with its time limit (from 1 to 10 seconds) and, except for problem L, an input and output format and sample cases. Problem L is interactive and gives sample interactions instead. No date, test data or solutions are in the document.
