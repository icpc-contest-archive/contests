  description: |-
    Merged scoreboard of the BAPC preliminaries as produced by DOMjudge, last updated 9 October 2026: 167 teams, all in the category Participant, against thirteen problems labelled A to M. Each team has a rank, its name and university, the number solved with total penalty time, and for each problem the solve time in minutes and the number of tries. Colours mark first solves, other solves, incorrect attempts, pending attempts and untried problems. A summary row gives totals per problem and shows that no team solved problems C and G; the 11 cells marked as first solves are one for each of the other problems.

    153 teams carry a rank and 14 teams that solved nothing have none; the team ranked 153rd also solved nothing. First place is held by the team 'Proven Concept' of Utrecht University with 11 solved and 819 penalty time. The board has no column for the local site where a team played. Clicking a team name opens its category and affiliation.
