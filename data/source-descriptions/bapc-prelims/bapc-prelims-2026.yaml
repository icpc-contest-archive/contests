  description: |-
    Codeforces gym page of the contest '2026 Benelux Algorithm Programming Contest Preliminary (BAPC Prelims 2026)', marked Finished and described as the qualifying stage run at Dutch, Belgian and Luxembourgish universities. It lists thirteen problems A to M, from Ambagaata to Manic Ceramic, each with its input and output form, time limit (1 to 10 seconds), memory limit of 1024 MB and the number of solvers.

    The contest materials section links a testing tool for problem L (a zip file), the statements in English and a tutorial in English; these files are linked, not part of our copy. The rest of the page is the gym's menus and its forms for asking questions and adding announcements.
