  description: |-
    Standings of the 2026 ICPC BAPC Preliminaries: 91 teams from eight institutions (Delft University of Technology 65 teams, University of Twente 9, Universiteit van Amsterdam 7, Université de Mons 4, Vrije Universiteit 2, Saxion University of Applied Sciences 2, University of Warsaw 1, Jagiellonian University in Krakow 1). Columns are rank, team, institution, solved, time, medal, citation and site citation. There is no per-problem detail.

    Four teams share rank 1 and the ranks run to 62, while five teams have no rank, solved count or time. Three Delft teams carry a gold, silver and bronze medal. The citation column gives the place (First Place and so on) and marks 44 teams Honorable Mention, and the site citation names the champions of four local contests: Delft, Twente, Mons and Amsterdam.
