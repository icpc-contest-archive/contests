  description: |-
    Scoreboards of the BAPC 2017 preliminaries, in English. A merged scoreboard of 98 teams gives rank, team name with a location (a city, university or country), number solved, total time and, for problems A to L, the number of attempts and the solve time, followed by a summary row. First solves are marked, and cells are coloured as solved first, solved, tried incorrect or untried. Team names are coloured by category: of the 98 teams, 82 are participants, 12 spectators and 4 company teams, with a legend.

    Below it are separate scoreboards for three of the local preliminary contests: Amsterdam Programming Contest 2017 (11 teams), Leidsch Kampioenschap Programmeren 2017 (11 teams) and Eindhoven Algorithmic Programming Contest 2017 (34 teams), each with its own category legend. Headings for pre-BAPC 2017, Nijmegen, Amsterdam Algorithm Programming Preliminaries, Utrecht and Delft follow, each with only a host name under it and no table.
