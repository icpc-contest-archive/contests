  description: |-
    Website of BAPC 2018, in English, co-organised by UCLouvain and UMONS according to its front page; its front page announces the main contest for 27 October 2018 at Louvain-la-Neuve. Our copy holds 17 saved pages, 12 of them different: home, schedule, preliminaries, system, rules, registration for the semi-live online contest, teams, problems, results, location, accommodation and contact. The preliminaries page carries the Pre-BAPC 2018 final scoreboard; the problems page links the preliminaries problem set (web and printable PDF), a solution presentation and a ZIP of statements, test data and jury solutions, alongside the same files for the main contest.

    The results page holds scoreboards of the main contest and of the web contest, not of the preliminaries, and the teams page says teams are to be announced. The linked PDFs, ZIP and video are not part of the 17 pages.
