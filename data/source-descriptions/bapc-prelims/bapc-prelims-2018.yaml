  description: |-
    Final scoreboard of the BAPC 2018 preliminaries, as a page of the BAPC 2018 website: 98 teams with rank, team name, university, number solved, score and, for problems A to K, a cell per problem. A solved problem shows attempts and time (for example 2/24) on a green cell; a problem with attempts but no solution shows a bare number on a red cell; untried problems are empty. The 25 teams with no problems solved all share rank 72. Eleven university names appear, from Belgium and the Netherlands; first place is Mostly Harmless Bogosort of UCLouvain with nine problems solved.
