  description: |-
    Six PDF files from the 2009 directory of the CHipCie problem archive, with no web page between them. They are three pairs of a problem set and a second document: the BAPC 2009 Preliminaries (18 pages of problems and 30 pages of solution slides), the main BAPC 2009 contest (a 20-page problem set headed BAPC 2009 and starting with problem A, Penguin Bashing, and an 85-page presentation of the results and the solutions) and the 2009 ACM North Western European Regional Contest held in Nuremberg (a 22-page problem set and a 30-page solutions document).

    Only the preliminaries pair is of this contest; the other four files are of other contests.
