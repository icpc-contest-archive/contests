  description: |-
    Problem set of the BAPC 2009 Preliminaries: a PDF of 18 pages with nine problems, A All-Out Arctic Warfare, B Hedge Maze Relay Race, C Brick Stacking, D Family Politics, E Box City, F Box Village, G Word Search Puzzle, H Blueprint and I Typechecker. Each problem has a statement in English with input and output format, and an example. The running header on each page reads BAPC 2009 Preliminaries. No date, host or sponsor is stated, and there is no test data or solutions.
