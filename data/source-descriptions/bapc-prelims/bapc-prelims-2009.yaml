  description: |-
    Solution slides of the BAPC 2009 Preliminary Rounds: a PDF of 30 pages. The title slide is dated 2008-10-03. Slides take the nine problems one after another, giving the idea of each solution in a few bullet points, with a diagram or pseudocode for some: Box Village, Family Politics, Hedge Maze Relay Race, Typechecker, Brick Stacking, Blueprint, All-Out Arctic Warfare, Word Search Puzzle and Box City. On the slides Typechecker, Blueprint and Word Search Puzzle are all lettered G; in the problem set Typechecker is I and Blueprint is H. The last slide invites the audience to the BAPC 2009 on October 17 in Groningen.
