  description: |-
    Standings of the 2022 ICPC BAPC Preliminaries: 104 teams with rank, team name, institution, problems solved, total time, medal, citation and site citation. Ranks are per site: six teams share rank 1, and each of them has a site citation naming it champion of one of six contests (Delft, Utrecht, Groningen, Amsterdam, Nijmegen and Eindhoven). Gold, silver and bronze medals are given to 6, 5 and 5 teams at ranks 1 to 3; lower ranks carry place names only (up to Fifty-second Place). Segfault go BRRRR of Delft University of Technology has the most problems solved (12). There are no per-problem results.
