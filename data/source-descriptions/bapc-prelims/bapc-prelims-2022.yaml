    Scoreboard of the BAPC 2022 preliminaries as shown by DOMjudge: rank, team name with institution, a score of problems solved and total time, then one cell per problem A to L giving the time of the accepted solution and the number of tries, or only the number of tries where the problem is unsolved. First place is Segfault go BRRRR of Delft University of Technology with 12 problems solved.

