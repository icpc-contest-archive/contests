  title: BAPC 2010 - Leiden
  language:
  - en
  description: |-
    Website of the 2010 Benelux Algorithm Programming Contest in Leiden, titled "BAPC 2010 - Leiden", together with the 2010 directory of the CHipCie problem archive. The website is that of the finals on 23 October 2010 at Student center Plexus, Leiden; its schedule, location and news pages are about that day, and the news page says team Joy won as the only team to solve 7 of the 10 problems. The pages are home, news, schedule, location, contest, rules, system, registration, organisation, sponsors, companies, vacancies, contact and Problems & Solutions. The scoreboard and gallery addresses return the home page, and the https address of the site root is an unrelated Dutch page of the ICT guild of De Leidsche Flesch. Our copy holds 47 pages: 34 HTML addresses (20 different documents) and 13 PDF addresses (8 different files).

    The Problems & Solutions page lists problem sets, solution outlines or presentations, test data, sample data and solutions for the 2010 finals, the 2010 preliminary rounds and the 2009 finals. Our copy holds the files it links except five: the 2010 all-files zip, the 2009 reference-solutions zip, the 2009 preliminary-rounds problem set and example input, and the program booklet. The 2010 PDFs of the finals, the preliminaries and NWERC from the archive are also in it.
