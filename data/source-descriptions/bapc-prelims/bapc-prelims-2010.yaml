  description: |-
    Problem set of the BAPC 2010 preliminaries: a PDF of 24 pages whose cover reads "Preliminaries 2 October 2010", with the running header Preliminaries BAPC 2010. It lists ten problems, A Evolution, B Have a Nice Day, C Serial Numbers, D Equal Is Not Really Equal, E The Great Cleanup, F Stock Market, G Acrobat Reader, H Farmer John, I Imagine and J My Cousin Obama. An introductory page explains how to print real numbers to six digits in C, C++ and Java for problems A and H. Each problem has a statement in English with input and output format and an example. No test data or solutions.
