    Baekjoon Online Judge category page for the BAPC 2010 Preliminaries, in Korean. A table lists the ten problems A to J with their Baekjoon problem numbers 5442 to 5451, the title, the number of accepted users, the number of submissions and the acceptance rate. Eight titles are the English ones (Evolution, Have a Nice Day, Equal Is Not Really Equal, Stock Market, Acrobat Reader, Farmer John, Imagine and My Cousin Obama); C and E are shown in Korean translation. Problem H is marked as a special judge problem. The page has no statements; they are on the linked problem pages, which are not in our copy.
