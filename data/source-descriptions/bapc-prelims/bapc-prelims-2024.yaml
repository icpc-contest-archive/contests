    Final scoreboard of the BAPC Preliminaries 2024 as produced by DOMjudge: 227 teams with rank, team name, institution, a score of problems solved and total time, then one cell per problem A to L with the time of the accepted solution and the number of tries; a colour legend names solved first, solved, tried incorrect, tried pending and untried. The 24 teams with 0 solved have no rank. A Summary row at the bottom gives four figures per problem, the last in minutes. Teams come from twelve affiliations: Delft University of Technology (74 teams), Eindhoven University of Technology (61), University of Groningen (22), Universiteit van Amsterdam (13), Universiteit Leiden (12), University of Twente (12), Radboud University Nijmegen (11), UMONS (7), Vrije Universiteit Amsterdam (6), Utrecht University (4), UCLouvain (4) and Saxion (1). Every team has the category Participant. First place is Segfault go BRRRR of Delft University of Technology with 12 problems solved.

