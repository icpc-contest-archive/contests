  description: |-
    Standings of the 2025 ICPC BAPC Preliminaries: 162 teams from eight institutions (Delft University of Technology 72 teams, Eindhoven University of Technology 43, Rijksuniversiteit Groningen 18, Universiteit van Amsterdam 10, Radboud University, Université de Mons and Vrije Universiteit 5 each, University of Twente 4). Columns are rank, team, institution, solved, time, medal and citation. There is no per-problem detail.

    Ranks are given per group of teams: seven teams share rank 1 and the ranks run to 55, while 17 teams carry no rank. Medals are gold (7 teams), silver (7) and bronze (6). The citation column gives the place (First Place up to Twenty-eighth Place) and marks 28 teams Honorable Mention. In the 68 Delft rows that have one the Time column differs from Solved; in the other 94 rows it has the same value as Solved.
