  title: Preliminaries | BAPC 2025
  language:
  - en
  contest_date: '2025-09-20'
  description: |-
    Website of the Benelux Algorithm Programming Contest (BAPC) 2025, in English, made by W.I.S.V. 'Christiaan Huygens' for the contest hosted by Delft University of Technology. Our copy holds 35 pages. The preliminaries page lists eleven preliminary contests run by universities between 20 and 27 September 2025, among them the Delft Algorithm Programming Contest and the Twentsch Algorithm Programming Contest, and the home page links the merged preliminaries scoreboard, the preliminaries problem set (PDF) and its solution slides (PDF).

    The site also covers the main contest of 25 October 2025: schedule, rules, systems, location, a digital booklet, a team list by institution with company teams, the final standings with a spectator view, and the main contest problem set and solution slides as PDFs. Pages for the individual schedule items and two news items are included.

    Images and style sheets are in our copy. The problem packages (zip files) and the photo gallery, which redirects to another site, are not, and links to the local contests' own sites lead outside our copy.
