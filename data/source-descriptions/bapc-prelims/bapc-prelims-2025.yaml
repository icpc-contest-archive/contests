  tries: true
  description: |-
    Merged scoreboard of the BAPC preliminaries as produced by DOMjudge, last updated 3 October 2025: 212 teams, all in the category Participant, against twelve problems labelled A to L. Each team has a rank, its name and, for 211 of them, its university, the number solved with total penalty time, and for each problem the solve time in minutes and the number of tries. Colours mark first solves, other solves, incorrect attempts, pending attempts and untried problems. A summary row at the foot gives totals per problem.

    186 teams carry a rank and 26 teams that solved nothing have none; the team ranked 186th also solved nothing. First place is held by the team 'll twee = 1;' of Utrecht University with 12 solved. The board has no column for the local site where a team played. Clicking a team name opens its category and affiliation.
