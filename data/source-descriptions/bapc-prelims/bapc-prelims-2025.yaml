    Problem set of the BAPC 2025 preliminaries as a PDF of 27 pages: a cover headed "Preliminaries for the 2025 Benelux Algorithm Programming Contest", the list of twelve problems A to L (Alto Adaptation, Bottle of New Port, Calculation Obfuscation, Dralinpome, Entropy Evasion, Friendly Formation, Genealogy Gumbo, Hidden Sequence, Ingredient Intervals, Journal Publication, Koehandel, Landgrave), and a copyright line crediting the BAPC 2025 Jury under a Creative Commons Attribution-ShareAlike 4.0 licence. Each statement is in English with a time limit; eleven have Input and Output sections and sample inputs and outputs, while problem E is interactive, with an Interaction section and two sample interactions. Several statements have illustrations. The copy does not state the contest date.
- url: https://2025.bapc.eu/prelims/solutions.pdf
  read: '2026-11-23'
  rubric: 1
  copy: bapc/bapc-2025/editorial/20261115-live-1dcc5267/solutions.pdf
  title: Benelux Algorithm Programming Contest (BAPC) preliminaries 2025 Solutions presentation
  language:
  - en
  problems: 12
  pages: 118
  description: |-
    Solutions presentation of the BAPC 2025 preliminaries by the BAPC 2025 Jury, a 118-page slide PDF whose title slide carries the date October 4, 2025. It goes through all twelve problems in the order K, D, B, H, J, E, G, I, A, F, L, C. Slides 2 to 113 each carry the problem letter and title and the problem author's name; the slides restate the task and build up the solution step by step, so the same slide appears several times with more text each time. Slides headed "Statistics" show dots where the submission and acceptance counts would be. The final slides give jury work figures (440 commits, 802 secret test cases, 221 jury and proofreader solutions), a thanks slide listing the proofreaders and the jury, and a call for problems for BAPC 2026.
