  tries: true
  description: |-
    Scoreboard of the 2021 BAPC preliminaries as shown by DOMjudge, headed Demo contest preliminary results - not final, with a last-update stamp of 20 November 2021. It has 182 team rows with rank, team name and institution, number solved, total time, and for each of problems A to K the solve time in minutes and the number of tries. 163 teams carry a rank; 19 rows have no rank and no solved problems, among them two named Example teamname and one named testteam. A summary row closes the table, and a legend explains the cell colours and lists Gold, Silver and Bronze awards.

    Teams from several institutions are on one board; the board does not say which preliminary site each team played at. Our copy holds the whole page with its style sheets.
