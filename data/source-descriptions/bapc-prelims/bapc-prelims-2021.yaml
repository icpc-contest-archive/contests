  title: Preliminaries for the 2021 Benelux Algorithm Programming Contest
  language:
  - en
  problems: 11
  description: |-
    Problem set of the preliminaries for the 2021 Benelux Algorithm Programming Contest, a PDF in English. The cover (page 1) lists the eleven problems A to K (Almost Always, Buffered Buffet, Candy Contribution, Dickensian Dictionary, Entering Enemy Encampment, Fridge Distraction, git mv, Histogram, Ice Growth, Jack the Mole, Kudzu Kniving) and page 2 carries a copyright line of the BAPC 2021 Jury under a Creative Commons Attribution-ShareAlike 4.0 licence. The statements start on page 3; each has input and output format and sample input and output, and some carry picture credits. The cover names no date or place.

    Our copy is cut off after about one megabyte and is not a complete PDF: PDF programs cannot open it. The text of the cover and of the statements of problems A to F can be recovered from the data; the statements of problems G to K are not in our copy.
