  description: |-
    Standings of the 2021 ICPC BAPC Preliminaries: 167 teams from twelve institutions in the Netherlands and Belgium, each with team name, institution, number solved and time. The Rank column is empty for every team and the rows are not sorted by result, so the order must be worked out from the solved and time columns. The most solved is 10; 17 teams show 0 solved and two have no solved count. There is no per-problem detail and no attempt counts.
