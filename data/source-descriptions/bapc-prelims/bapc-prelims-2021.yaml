- url: https://2021.bapc.eu
  read: '2026-11-16'
  rubric: 1
  copy: bapc-prelims/bapc-prelims-2021/website/2026-09-05-wayback-f4cb3a73
  title: BAPC21 - Benelux Algorithm Programming Contest
  language:
  - en
  description: |-
    Website of the Benelux Algorithm Programming Contest (BAPC) 2021, headed Onsite, 30 October 2021, hosted by Vrije Universiteit Amsterdam and organised by a committee of the study association STORM. The home page describes the contest and lists the organisers of the contests of 2010 to 2020. The registration page explains that institutions hold preliminaries to select their teams, most of them on Saturday 9 October and two (Groningen and Mons) on 16 October, and names the preliminary contest of each of eleven institutions in the Netherlands and Belgium. The schedule page gives 9 October for the preliminaries and 30 October for the BAPC.

    Other pages cover the jury, rules, the programme of the contest day, location, a company teams page that holds only its heading, a call for volunteers, special thanks, photos (a notice only) and contact. Results and problems are in the site: a DOMjudge scoreboard of the preliminaries marked preliminary results, a scoreboard of the BAPC marked final standings, the preliminaries problem set and a solutions presentation of the preliminaries dated 1 November 2021 (59 pages), and the BAPC problem set and solutions (77 pages).

    Our copy holds 14 distinct pages and 4 PDF files, with images and style sheets. The two problem set PDFs (BAPC and preliminaries) are cut off at 1 MB and cannot be opened normally; the two solutions presentations are complete.
