  description: |-
    Website of the Benelux Algorithm Programming Contest (BAPC) 2011, hosted in Eindhoven, mainly for the main contest of 15 October 2011 that followed the preliminaries. Our copy holds seven pages and documents: the home page, a news page, a registration page, a contact page, a scoreboard page, a plain-text standings list of seven teams with number of solutions and time (linked from the news as one of the preliminaries' final standings), and a nine-page program booklet PDF with schedule, directions, rules and organisation.

    The news page covers the preliminaries as well: it announces registration through the ICPC site, the final standings of the preliminaries in six cities, and the exercises of the preliminaries (problem PDF, solution slides, sample data, test data and jury solutions). These are links, and the files they point to are not in our copy. The scoreboard page is the final standings of the main contest, with problems A to J, attempts and times per problem, and separate groups for participants, companies and spectators. The menu items for rules, schedule and teams are not in our copy.
