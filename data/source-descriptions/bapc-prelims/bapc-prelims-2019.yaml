  description: |-
    Standings of the 2019 BAPC Preliminaries: 99 teams, each with rank, team name, institution, number solved, time, medal, citation and site citation. There is no per-problem detail and no attempt counts.

    Ranks are not unique: five teams are ranked 1 and five ranked 2, and the last five rows have no rank, two of them with no solved count or time. The Medal column marks 5 gold, 4 silver and 5 bronze teams; the Citation column gives First Place down to Eleventh Place for 20 teams and Honorable Mention for 74 teams, and one team has a site citation.
