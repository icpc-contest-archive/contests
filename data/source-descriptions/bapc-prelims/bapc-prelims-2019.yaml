    Problem set of the preliminaries for the 2019 Benelux Algorithm Programming Contest, a PDF of 24 pages in English. The cover (page 1) lists the twelve problems A to L (Architecture, Bracket Sequence, Canyon Crossing, Deceptive Dice, Exits in Excess, Floor Plan, Greetings!, Hexagonal Rooks, Inquiry I, Jumbled Journey, Knapsack Packing, Lifeguards) and page 2 carries a copyright line of the BAPC 2019 jury under a Creative Commons Attribution-ShareAlike 4.0 licence. The statements start on page 3; each has input and output format and sample input and output, and some have figures. The cover names no date or place. The last page has no text. No test data or solutions.
