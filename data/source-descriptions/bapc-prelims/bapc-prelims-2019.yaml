- url: https://2019.bapc.eu/preliminaries
  read: '2026-11-16'
  rubric: 1
  copy: bapc-prelims/bapc-prelims-2019/website/2026-09-02-live-b066fd93
  title: Preliminaries | BAPC 2019
  language:
  - en
  contest_date: '2019-09-21'
  description: |-
    Website of the Benelux Algorithm Programming Contest (BAPC) 2019, entered at its Preliminaries page. The preliminaries page announces the local preliminary rounds for Saturday 21 September 2019, with an advised schedule (test session, five-hour contest, unfreezing and presentation of solutions), the requirement that a host institution runs its own DOMjudge system, and an embedded map of the registered preliminary rounds. The home page says the BAPC itself took place on 19 October 2019 at Radboud University in Nijmegen, co-organised by Desda and Thalia, and links to the websites of the years 2010 to 2018.

    The rest of the site is mostly about the main contest: schedule of the day, system description (languages, compiler options, installed software, with a changelog), registration, rules, a team page listing 12 company teams and the student teams accepted, two sponsor pages, location, organisation (committee and jury) and contact. The problems page links PDFs of the problem set and solutions and ZIP files with statements, test data and jury solutions, for both the BAPC and the preliminaries. The results page holds the scoreboards of the contest and of the preliminaries.

    Our copy holds 14 distinct pages (the Preliminaries page is saved under two addresses) with their images and style sheets. The linked PDF and ZIP files and the embedded map are not part of it.
- url: https://2019.bapc.eu/results.html
  read: '2026-11-16'
  rubric: 1
  copy: bapc-prelims/bapc-prelims-2019/scoreboard/20261023-live-7a0cf26c/results.html
  title: Scoreboard | BAPC 2019
  language:
  - en
  teams: 137
  problems: 12
  times: true
  tries: true
  description: |-
    Scoreboard page of the BAPC 2019 website with eleven boards: the BAPC final results, the BAPC semi-live contest results, the merged preliminaries, and eight boards for single preliminary sites (Amsterdam Vrije Universiteit, Amsterdam University of Amsterdam, Delft, Eindhoven, Leiden, Nijmegen, Twente, Utrecht).

    The merged preliminaries board has 137 team rows with rank, team name and institution, number solved, total time, and for each of problems A to L the solve time in minutes and the number of tries. 129 rows carry a rank; eight do not, four of them named testteam1 to testteam4. A summary row closes the board. The site boards use the same problem columns; the Utrecht board writes each problem cell as tries/time. The final board lists 56 student teams and, in a second block, 12 company teams; the semi-live board has 32 rows.

    The merged board mixes teams of all sites and includes test teams without marking them apart from their names. Our copy holds the whole page with its style sheets and images.
