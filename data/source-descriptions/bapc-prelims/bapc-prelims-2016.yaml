    Page of the BAPC 2016 website for the preliminary contest, in English. A short text says the preliminaries were held on 24th of September at several universities around the Benelux, and links to the problem set (1.6 MB), solutions and test data (47.8 MB) and a solution presentation (257.1 KB). Below a Results heading are five images labelled DAPC, EAPC, LAPC, NKP and AAPP; one image each follows under the headings University of Amsterdam (UvA) and University of Utrecht (Scorebord_UKP), and the page ends with premium and event sponsor logos. The site menu leads to schedule, scoreboard, system, teams, rules, semi-live online contest, results, location and contact pages.

    Our copy holds this one page with its images and style sheets. The linked files and the other pages of the site are not part of it.
