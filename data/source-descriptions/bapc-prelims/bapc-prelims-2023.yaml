  description: |-
    Final scoreboard of the BAPC Preliminaries 2023 as produced by DOMjudge: 215 teams with rank, team name, institution, a score of problems solved and total time, then one cell per problem A to M with the time of the accepted solution and the number of tries; a colour legend names solved first, solved, tried incorrect, tried pending and untried. The 17 teams with 0 solved have no rank. A Summary row at the bottom gives four figures per problem, the last in minutes. Teams come from twelve affiliations: Delft University of Technology (73 teams), Eindhoven University of Technology (55), Rijksuniversiteit Groningen (19), University of Twente (15), Vrije Universiteit (11), Radboud University (11), Leiden University (9), Universiteit van Amsterdam (9), Universite Catholique de Louvain (6), Utrecht University (3), Universite de Mons (3) and BetterBe (1). Every team has the category Participant. First place is Segfault go BRRRR of Delft University of Technology with 13 problems solved.

    The page states a last update of Tue 03 Oct 2023 and no contest day. Our copy holds the page with its style sheets and scripts.
