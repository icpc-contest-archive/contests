  description: |-
    Standings of the 2020 BAPC Preliminaries: 142 teams from ten institutions, each with rank, team name, institution, number solved, time, citation and site citation. There is no per-problem detail and no attempt counts.

    The top two teams solved 11 problems and the lowest teams 1. Rank numbers run from 1 to 156 with gaps. The Citation column gives an ordinal place (First Place up to Seventy-first Place, with some places missing) for 65 teams and Honorable Mention for the other 77. Nine teams carry a site citation reading Best team followed by an institution name (one is spelled Beste team).
