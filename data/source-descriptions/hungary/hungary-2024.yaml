  description: |-
    Final scoreboard of ICPC Hungary 2024 as shown by DOMjudge under the heading "ICPC Hungary 2024 final standings": 51 team rows with rank, team name, institution, problems solved and total time. Twelve problems A to L are columns, and each cell gives the minutes of the accepted run and the number of tries, or only the tries when unsolved. The first 48 rows are the teams of the category Participants (ranks 1 to 48 with one empty rank cell, for a team with the same solved count and time as the team above it; first place ELTE 1 with 11 problems and 1150 minutes). A second block below a summary row holds three teams of the category Observers from the Neumann Society Hungary, ranked 1 to 3 separately. Each block ends with a summary row of counts per problem, and a colour legend marks solved first, solved, tried incorrect, tried pending and untried.

    The page also holds a box with members and category for each team; it has 54 such boxes, three of them for teams that have no row in the scoreboard.
