  description: |-
    Pages of university informatics departments in Hungary, mostly in Hungarian with some English: our copy holds 150 files, 132 of them pages. They come from the sites of the Budapest University of Technology and Economics computer science department and the Institute of Informatics of the University of Szeged. They hold the conference pages of ICLP 2012 (28th International Conference on Logic Programming, Budapest, 4 to 8 September 2012: call for papers, programme, accepted papers, registration, hotel information), a page of the 8th Japanese Hungarian Symposium on Discrete Math., the department and institute home pages, staff pages, and many PDFs: calls for student demonstrators, exam problem sheets and lecture slides from courses, a 2024 post about the ICPC in Hungary and a problem document headed ICPC Hungary 2025.

    Nothing in it is about a 2012 Hungarian ACM programming contest.
