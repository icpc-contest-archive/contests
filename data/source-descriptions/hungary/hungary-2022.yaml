  description: |-
    Year archive of 2022 of the news portal Informatikai versenyek ("Competitions in informatics") of the ELTE Faculty of Informatics, headed "Év: 2022" (Year: 2022). It mixes posts of several competitions: results of the rounds of the talent-search university programming contest, a CERC 2021 notice and a report on how the ELTE teams did there, and two posts on ICPC Hungary 2022.

    The announcement of 3 October, in English, says the Hungarian qualification contest is on 15 October at the "Lovarda" laboratory of the faculty from 10:00 to 15:00 and that three ELTE teams can go on to the Central European regional in Ljubljana. The report of 18 October, in Hungarian, says 36 teams from BME, ELTE and SZTE took part, a set of 13 problems and five hours; it names the first three teams, all from ELTE (PirosPaPrika first, then Hungry Team and Árvíztűrő Tükörfúrógép), the first two with 12 problems solved. It links to a results page on another server, which is not in our copy.

    Our copy holds 18 pages: the archive, its monthly archives and the individual posts.
