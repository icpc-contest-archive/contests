  description: |-
    Page of the national ACM contest on the Informatics Competitions portal of the ELTE Faculty of Informatics, in Hungarian, headed "ACM programozási verseny 2018." (ACM programming contest 2018) with a "Támogató" (sponsor) heading above it. It gives the date and place as 11 November 2018 at the Lovarda, the registration deadline of 7 November and how to register by email, and the rules: teams of three, a problem set of 6 to 12 problems in English, one computer per team, printed material allowed, 20 penalty minutes per wrong submission of a problem that is finally solved, languages C, C++, Java, Pascal and Python. The contest runs on the UVa Online Judge, with a short test round at 9:00. The page also says the contest is ELTE's selection for the Central European regional in Prague on 30 November to 2 December 2018.

    Our copy is this one page, without style sheets or images, and holds no results, team list or problems.
