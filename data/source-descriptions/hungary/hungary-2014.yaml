  description: |-
    Website of the national round of the ACM programming contest at ELTE, in Hungarian, as it stood the day before the 2014 contest. Its main page, headed "ACM programozási verseny 2014." ("ACM programming contest 2014"), explains the three levels of the competition, gives the date and place of the national round (Lovarda, 19 October 2014, 9:00 to 15:00, with a short test contest at 9 and the contest itself from 10), registration by e-mail with a deadline of 17 October, and the rules: teams of three, one computer, 6 to 12 problems in English, submission on the UVa online judge, 20 minutes penalty per rejected try. It says the round is a subcontest of CERC 2014 and that the list of registered teams is on the ICPC site.

    Our copy holds 11 pages. Besides the main page they are the problem sets of the 2007, 2008, 2009, 2011, 2012 and 2013 national rounds as PDFs, and the results pages of the 2007, 2008, 2009 and 2011 rounds. The 2010 problem set and results and the 2012 and 2013 results are links to other sites and are not in our copy. No results of the 2014 round are on the site. The style sheet of the pages is not in our copy.
