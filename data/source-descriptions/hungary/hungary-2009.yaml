    Problem set in English: a PDF of 24 pages with no cover page, made of ten problem statements printed from the ACM ICPC Live Archive, one after another. Each starts with its Live Archive number and title: 3646 Transcript, 3656 Odd or Even, 3687 Football Foundation (FOFO), 3708 Graveyard, 3986 The Bridges of Kolsberg, 4173 Line & Circle Maze, 4211 Bases, 4295 Videopoker, 4403 ASCII Diamondi and 4405 Tariff Plan. Under each title the Live Archive names the regional contest the problem comes from, between 2006/2007 and 2008/2009 (for example Southwestern Europe, South America, Kuala Lumpur). Each problem has input and output sections and at least one example. The PDF does not name the Hungarian contest.
