  description: |-
    Year archive of the news portal Informatikai versenyek ("Competitions in informatics") of the ELTE Faculty of Informatics, in Hungarian, headed "Év: 2016" (Year: 2016). It lists the portal's posts of 2016 in several competitions, mainly the talent-search university programming contest (Tehetségkutató egyetemi programozási verseny) with round results tables, plus a Sapientia ECN post, a Hash Code post and two posts on the 2016 ACM contest: a notice of 4 October that the contest information is out and a notice of 25 October that the problems and results are available.

    Our copy holds 21 pages: the year archive, its monthly archives and the individual posts. It has no results or problems of the Hungarian ACM contest itself; the 25 October post only links to them.
