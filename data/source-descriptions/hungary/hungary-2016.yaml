  problems: 10
  pages: 16
  description: |-
    Problem set as a PDF of 16 pages with ten problems, in English, each headed by its number and name: 1079 A Careful Approach, 1729 Owllen, 10271 Chopsticks, 10409 Die Game, 11624 Fire!, 12125 March of the Penguins, 12333 Revenge of Fibonacci, 12952 Tri-du, 13076 The traveller squirrel and 13117 ACIS, A Contagious vIruS. The problems have no letters. Every problem has a statement with input and output format and a sample input and output; later pages of a problem carry the running head "Universidad de Valladolid OJ" with the problem number and name.

    There is no cover page, contest name, date or sponsor, and no test data or solutions.
