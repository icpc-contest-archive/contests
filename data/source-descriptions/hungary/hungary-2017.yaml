  description: |-
    Single page on the informatics competitions site of the Faculty of Informatics of ELTE (ELTE IK), in Hungarian, announcing the 2017 national ACM programming contest, which the page also calls a selection contest for ELTE students, with ELTE sending its three best teams to the Central European regional. It states the time and place as the Lovarda, 8 October 2017, 9:00 to 15:00, with a practice round before the contest starts at 10:00, run on the UVa online judge. It gives the registration deadline of 6 October 2017 and how to register, the rules (teams of three, 6 to 12 problems in English, five hours, the programming languages and compilers, 20 penalty minutes per wrong submission, ranking by problems solved and then time), and the later steps: the Central European regional in Zagreb on 17 to 19 November 2017 and the World Finals in Beijing in April 2018. A list of the three ELTE teams sent to the regional is at the end.

    Our copy holds this one page. It has no results and no problem statements. The site menu and sidebar link to other years and other contests that are not in our copy.
