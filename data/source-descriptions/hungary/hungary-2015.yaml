  title: ACM programozási verseny 2015.
  title_en: ACM programming contest 2015
  language:
  - hu
  contest_date: '2015-10-18'
  description: |-
    Page of the national ACM contest on the Informatics Competitions portal of the ELTE Faculty of Informatics, in Hungarian, headed "ACM programozási verseny 2015." (ACM programming contest 2015). It describes the contest: teams of three solve problems written in English within five hours, with a short practice round at 9:00 before the main contest at 10:00. It gives the date and place as 18 October 2015 at the Lovarda, the registration deadline of 16 October, the rules (languages C, C++, Pascal and Java, one computer per team, printed material allowed, 20 penalty minutes per rejected submission of a problem that is finally solved, ranking by problems solved and then total time) and how the contest runs on the UVa Online Judge. It also explains that the contest is the national round and ELTE's selection for the Central European regional in Zagreb on 13 to 15 November 2015.

    Our copy is the single page as it stood in June 2016, with its style sheets and one script. It holds no results, team list or problems.
