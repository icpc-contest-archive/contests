  description: |-
    Website of the ICPC activities at the Budapest University of Technology and Economics (BME), titled "ICPC @ BME", in English. It is the site as it stood for ICPC Hungary 2025 (contest day 11 October 2025), with pages for the regional round (CERC 2025), preparation, results, gallery, the VProg student community, and a women's contest in 2026. The results page has tabs for 2025, 2024 and 2023 but our copy holds one table of 13 BME teams with rank, BME rank, team name, participants and certificate. An older version of the site, "ICPC @ SZIT", holds posts on ICPC Hungary 2024 and CERC 2023.

    Nothing in it is about the 2015 contest. Our copy of the crawl holds 149 files, including a 25-page PDF of the ICPC Hungary 2025 problem set, pages of the ELTE contests portal, and many BME course PDFs.
