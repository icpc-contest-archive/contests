  title: The Northeast North America ACM ICPC Home Page
  language:
  - en
  description: |-
    Website of the Northeast North America region of the ICPC, in English, as it stands now rather than in 2006: the contacts page is headed for 2019 and the contests page only points to a newer NENA website. Our copy holds 20 pages: the framed home page with its menu, a description of the region and its two-tier format of preliminary sites and a final round, the regional rules (five preliminary sites, a final round at RIT, sixteen schools advancing, C, C++, Java and Python), the contacts, and a page of sample problem sets.

    The sample problem sets page links sets from 1998 to 2021. Seven of them are in our copy as PDFs: the RIT preliminaries of 1998, 1999, 2000, 2002 and 2003 and the regional finals of 2003 and 2004. Of the yearly pages, those for 2005-2006 to 2009-2010 are in our copy; the 2006-2007 page lists the 2006 sets of the Northern (McGill), Northeast (WNEC), Eastern (BOSPRE), Western (Oswego) and Atlantic (Cape Breton) preliminaries and the Region Finals (RIT), but the PDFs it links are not in our copy. There are no results or team lists.
