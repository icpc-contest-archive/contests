  description: |-
    Problem set of the final round: a PDF of 15 pages with eight problems numbered 1 to 8, from Let's create a committee, iFlop and BlackBox to Intergalactic Collegiate Programming Contest and Doggone Air. Each problem has a statement in English with a description of the input and output, and at least one printed sample input and output; 11 sample pairs in all, each sample input labelled with a file reference such as see ~/8.1. There is no cover page naming the contest, and no test data or solutions.
