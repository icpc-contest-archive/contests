  description: |-
    Standings page of the 2006 ACM Northeast North America Programming Contest sponsored by IBM, as published on the ICPC site. It opens with the Final Round (Regional Finals, 11/11/2006): 12 teams with rank, team, citation (First Place to Twelfth Place), problems solved and time. First place is the MIT team Beavers with 7 solved.

    The same page then gives, in the same columns, the results of five preliminary sites: Atlantic (Cape Breton, 10/13/2006), Eastern (Fitchburg, 10/14/2006), Northeast (WNEC, 10/14/2006), Northern (McGill, 10/21/2006) and Western (Oswego, 10/14/2006). Tied teams share a rank, and the Northern table ends with two teams marked Honorable Mention. There are no per-problem results.
