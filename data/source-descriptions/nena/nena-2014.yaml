  description: |-
    Website of the Computer Science department of the Rochester Institute of Technology, in English. Our copy holds 136 pages: the department's calendars for 2014 and 2015 (year, month, week and day views), news items, advising and handbook pages, and PDFs of syllabi, hint sheets and forms.

    No page of the 2014 Northeast North America regional contest is in our copy. A news page carries a one-paragraph teaser saying that problem-solvers gathered at RIT in November for the IBM-sponsored Northeast North America Regional Contest of the ACM International Collegiate Programming Contest, held for the ninth consecutive year; the teaser breaks off mid-sentence, shows no year and the full article is not in our copy.
