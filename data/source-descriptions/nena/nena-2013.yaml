  description: |-
    Website of the Computer Science department of the Rochester Institute of Technology, in English. Our copy holds 132 pages, among them the department's 2014 calendar (year, month, week and day views). The rest is the department's own material: home page, news items, advising and handbook pages for 2013-2014 and 2014-2015, and PDFs of advising syllabi, hint sheets, program templates and forms.

    No page of the 2013 Northeast North America regional contest is in our copy. A news page of the site carries a one-paragraph teaser saying that problem-solvers gathered at RIT in November for the IBM-sponsored Northeast North America Regional Contest of the ACM International Collegiate Programming Contest, held for the ninth consecutive year; the teaser breaks off mid-sentence, shows no year and the full article is not in our copy. The home page mentions the department's annual high school programming contest, which is a different event.
