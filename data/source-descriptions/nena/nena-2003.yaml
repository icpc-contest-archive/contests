  title: ACM Northeast North America Region
  language:
  - en
  description: |-
    Website of the ACM Northeast North America Region, kept by the Department of Computer and Information Science at Westfield State College. Our copy holds 123 pages, many of them the department's pages on courses, help and facilities. The contest pages are the region's home page, the 2003-2004 contest sites, the regional modifications to the contest rules, the contest director page, the 2003-2004 dates, the final standings, a preliminary results index and two preliminary results pages. The home page also carries a note that second teams are confirmed first-come first-served and should register by October 10.

    The sites and dates pages give an eastern preliminary at Western New England College (October 25, 2003), a Boston preliminary (October 25), a western preliminary at the Rochester Institute of Technology (October 18), a northeastern preliminary at the University of Prince Edward Island (October 17) and the regional final at the Rochester Institute of Technology on November 8, 2003. The final standings page holds a text grid of 16 teams by eight problems. The western and eastern preliminary results are pages of our copy with times per problem; the Boston and Atlantic results are links to other sites and are not in it. No problem statements are in the contest pages.
