    Standings page for the 2003 ACM Northeast North America Programming Contest sponsored by IBM, with rank, team (institution and team name) and citation, and an unlabelled number after the citation for each ranked team. The regional final held at the Rochester Institute of Technology on 11/8/2003 lists 16 teams: 14 ranked from First Place (Massachusetts Institute of Technology, number 6) to Fourteenth Place, and two Honorable Mentions. Below it come four preliminary sites: Boston (distributed, 10/25/2003) with 18 teams, the Rochester Institute of Technology (10/18/2003) with 16, the University of Prince Edward Island (10/17/2003) with 18, and Western New England College (10/25/2003) with 14. Teams below the ranked places are listed as Honorable Mention without a rank. No times or per-problem detail.
