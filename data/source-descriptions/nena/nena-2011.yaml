  description: |-
    Website of the Department of Computer Science of the Rochester Institute of Technology. Our copy holds 148 files, 143 of them pages: the department's calendar for 2012 with month, week and day pages, and the home, news, events, people, programs, advising and other department pages.

    It is not a site about the contest. The news listings include a high school programming contest held by the department, a headline about success in the ACM ICPC Regional contest, and the opening of a news item headed RIT Hosts Elite Universities for International Computer Programming Contest, which says the IBM-sponsored Northeast North America Regional Contest was held for the ninth consecutive year at RIT; the full item is not in our copy. Our copy holds no standings, problem set or schedule of the 2011 contest.
