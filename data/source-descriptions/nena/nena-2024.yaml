    Final standings on Kattis for ICPC NA East Division 2024, filtered to the Northeast NA Region (all teams). The page lists 105 teams with rank, team name, problems solved, total time and, for each of the thirteen problems A to M, the number of attempts and the minute of the accepted solution, or the attempts with a dash when unsolved. 96 teams solved at least one problem; 9 solved none and share rank 97. Mex Foundation is first with 13 solved.

    The page also offers filters by division (East Central NA Region and Northeast NA Region) and by site or university, and a legend for first-to-solve, solved, attempted and pending marks. The contest ran 2024-11-10 from 11:00 to 16:00 EST. Our copy holds the page with its style sheets and scripts.
