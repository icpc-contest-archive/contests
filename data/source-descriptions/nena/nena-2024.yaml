  description: |-
    Website of the ICPC North America Northeast Regional for its 2024 - 2025 Regional Programming Contest, in English. The home page gives the contest date (Sunday, November 10, 2024), the area the region covers, the names of the regional contest director and deputy, registration dates and fees, and the contest schedule in several time zones, and links to a live scoreboard and live streams. A second page lists seven host sites (Rochester Institute of Technology, Rensselaer Polytechnic Institute, Northeastern University, McGill University, Universite de Moncton, College of the Holy Cross and Dalhousie University) with their cities. A third page describes the contest computer image, its editors, languages and IDEs, hardware rules and the use of Kattis as the judge.

    Our copy holds three pages, with 28 files in all including style sheets, scripts and images. The menu links to Rules & Info, Archive, Hall of Fame and Contact are not part of it, and the live scoreboard and stream links lead to other servers.
