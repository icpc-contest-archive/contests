    Website of the Computer Science department of the Rochester Institute of Technology, in English. Our copy holds 144 pages, starting from the department's 2012 calendar (year, month, week and day views). The rest is the department's own pages: home, news, events, people, advising, FAQs, how-to guides, and PDFs of advising syllabi, hint sheets and program templates.

    No page of the 2012 Northeast North America regional contest is in our copy. A news page of the site carries a one-paragraph teaser saying that problem-solvers gathered at RIT in November for the IBM-sponsored Northeast North America Regional Contest of the ACM International Collegiate Programming Contest, held for the ninth consecutive year; the teaser breaks off mid-sentence, shows no year and the full article is not in our copy.
