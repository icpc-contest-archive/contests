  description: |-
    Standings page of the 2005 ACM Northeast North America Programming Contest sponsored by IBM, as published on the ICPC site. It opens with the Final Round (Regional Finals, Rochester Institute of Technology, 11/5/2005): 12 teams with rank, team, citation (First Place to Twelfth Place), problems solved and time. First place is MIT Beavers with 7 solved.

    The same page then lists, in the same columns, the results of five preliminary sites: Acadia University (10/21/2005), Boston distributed (10/22/2005), McGill University (10/22/2005), SUNY-Oswego (10/29/2005) and Western New England College (10/29/2005). There are no per-problem results.
