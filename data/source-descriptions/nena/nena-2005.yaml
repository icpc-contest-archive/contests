  description: |-
    Website of the Department of Computer Science of the Rochester Institute of Technology. Our copy holds 149 files, 143 of them pages, in several versions of the site's design: a home page, a Website Posting FAQ for faculty, and people, alumni, programs, advising, news, events and calendar pages.

    It is not a site about the contest. The contest appears in a department news item dated 20 January 2012, headed RIT Hosts Elite Universities for International Computer Programming Contest, which reports on a Northeast North America Regional Contest held at RIT in the preceding November (the ninth consecutive year, RIT and 11 other institutions, RIT sixth, MIT the winner), and in two news headlines, one about success in the ACM ICPC Regional contest and one reading The ACM ICPC programming contest. Our copy holds no standings table, problem set or schedule of the 2005 contest.
