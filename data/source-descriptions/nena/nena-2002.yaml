  title: ACM Northeast North America Region
  language:
  - en
  description: |-
    Website of the ACM Northeast North America Region, kept by the Department of Computer and Information Science at Westfield State College. Our copy holds 76 pages, many of them the department's pages on courses and facilities; the contest pages are the region's home page, the list of contest sites for 2002-2003, the regional modifications to the contest rules, the contest director page, the contest dates, the final standings, and preliminary results pages.

    The dates page gives the preliminary contests of 12, 18, 19 and 26 October 2002 and the regional final of 9 November 2002; the sites page names the host of each (Oswego, Mount Allison, Western New England College, Harvard, and the Rochester Institute of Technology for the final). The final standings page holds a text grid of 13 teams by seven problems with time and number of tries. Of the preliminary results pages, the Boston and Eastern pages give per-contestant results with times, the Atlantic page names the winning teams, and the Western page holds a single link to standings on another server. The preliminary results index is headed 2001-2002.
