    Standings page for the 2002 ACM Northeast North America Programming Contest sponsored by IBM, in three columns: rank, team (institution and team name) and citation. The regional final held at the Rochester Institute of Technology on 11/9/2002 lists 13 teams, ranked 1 to 13 from First Place (Harvard University) to Thirteenth Place (Worcester Polytechnic Institute). Below it come the preliminary sites: Boston (distributed, 10/26/2002) with 16 teams, Mount Allison University (10/18/2002) with 16, SUNY-Oswego (10/12/2002) with 12, and Western New England College (10/19/2002) with 14. Top places carry a rank and citation; the remaining teams are listed as Honorable Mention without a rank. The page has no solved counts, times or per-problem detail. An empty section headed "Preliminary Site: delete Retired" is also on it.
