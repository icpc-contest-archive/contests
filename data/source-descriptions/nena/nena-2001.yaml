  description: |-
    Page headed "The 2001 ACM Northeast North America Programming Contest sponsored by IBM", listing the order of teams with the columns Rank, Team and Citation; there are no solved counts, times or per-problem results. The Final Round at Westfield State College, dated 11/3/2001, lists 12 teams ranked 1 to 11, with two teams tied at 11th, and the citations First Place to Eleventh Place; MIT is first. Each team is given as institution followed by team name.

    Four lists for the preliminary sites follow, each dated: Boston (distributed) on 10/13/2001 with 13 teams, St. Francis Xavier on 10/19/2001 with 16, SUNY-Oswego on 10/20/2001 with 15, and Western New England College on 10/13/2001 with 18. In the Oswego list all 15 teams are ranked; in the other three the first 4 (Boston), 3 (St. Francis Xavier) and 4 (Western New England College) teams carry a rank and a place name and the remaining teams are listed unranked as Honorable Mention.
