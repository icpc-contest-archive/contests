  copy: nena/nena-2001/website/2026-10-20-wayback-8358f32f
  title: Department of Computer and Information Science - ACM
  language:
  - en
  description: |-
    Website of the Department of Computer and Information Science at Westfield State College, whose ACM section covers the Northeast North America Region for 2001-2002, in English. Our copy holds 78 pages. Fifteen of them belong to the ACM section: a front page headed "ACM Northeast North America Region" and pages for the contest sites, regional rules, contest director, contest dates, final standings, preliminary results, three preliminary-site results pages and the Westfield State College site (hardware, software, campus). The rest are the department's own pages on courses, faculty and computing help.

    The rules page names five sites: Western New England College in Springfield, a distributed Boston site, SUNY-Oswego, St. Francis Xavier University in Antigonish, and the final at Westfield State College on Nov. 3; twelve teams advance to the final. The results page holds the final standings with times for four teams and a list of nine other participants. The Boston and Eastern preliminary pages are tables of four teams each, with seven problem columns, problems solved and total time, and a list of other teams; the Nova Scotia page names three winning teams and links to a scoreboard on another server. The Western (Oswego) results are linked from the preliminary results page to another server and are not in our copy.

    The five pictures on the hardware page and the picture on the directions page are not in our copy.
