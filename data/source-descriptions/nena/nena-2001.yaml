  problems: 7
  times: true
  tries: false
  description: |-
    Final standings page of the Northeast North America ACM Programming Contest, 2001-2002, from the Westfield State College department site: a plain-text table of four teams in rank order, MIT, St._Mary's, Laval and UMass. Each team has seven problem cells holding a time as printed (for example 10:27) or a dash, followed by one closing figure; the problems carry no labels, the columns no headings, and there are no attempt counts.

    Below the table nine more participants are named without results: Acadia, Brown, Harvard, Middlebury, New Brunswick, RIT, Rochester, RPI and SUNY-Buffalo. A note says the top team (MIT) qualified for the International Contest while wildcard positions were still awaited, and a link leads to the preliminary results.
