  title: ACM Northeast North America Region Home Page
  language:
  - en
  description: |-
    Website of the ACM Northeast North America Region, in English, as it stood in 2000. Our copy holds 18 pages and 3 images. The home page links to the contest sites and dates for 2000-2001 (preliminary sites at Rochester Institute of Technology, WPI and Dalhousie University and the final at Westfield State College; the dates page lists every date as TBA or None), the contest director page, the regional rules, the international contest's rules (a link that leads outside our copy), and the results for 1999-2000.

    The results page is a table of 13 teams, the final standings of 1999-2000. The regional rules page is for the 1999-2000 contest: a two-tier format, twelve teams advancing from the preliminaries to the championship round, and no time penalty for rejected runs; it links to the international contest's Final Contest Rules 1997-98, which are in our copy. Five pages describe the Westfield State College contest site (an overview, hardware, software, directions, campus map).

    Six more pages are general pages of the Department of Computer and Information Science server: its home page, a second department page, classes, UNIX help, getting an account and the acceptable use policy. No problem statements are on the site. Some images (the logo and the computer pictures on the hardware page) are not in our copy.
