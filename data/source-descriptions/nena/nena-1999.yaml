  description: |-
    Problem set of the championship round as a PDF of 12 pages, in English. The heading names the Northeast Regional Championship Round of the 1999-2000 ACM International Collegiate Programming Contest, sponsored by IBM, at Westfield State College, Westfield, MA, on November 6, 1999. It holds seven problems numbered #1 to #7: Cubism, Scientific Notation, The winning score, Round and round we go, Halloween in the Land of Nog, Did you bring a paint brush? and Cell growth.

    Each statement has a sample output; problems 2 to 6 also have sample input, and problems 1 and 7 read no input. There is no test data or solutions.
