  description: |-
    Final standings of the Northeast North America ACM Programming Contest 1999-2000, a plain-text table of 13 teams, named by institution, with MIT in first place and Harvard second. Each row has seven columns, one per problem, holding a time of day such as 10:27 or 2:47 where the problem was solved and a dash where not, followed by a last column of numbers (for example -5-, 65, 337). The table has no header row, so the columns are not labelled and the page does not say how the last column is computed. No attempts are shown.

    A line above the table says all the teams were winners in preliminary contests. A note below it says the top two teams, MIT and Harvard, qualified for the International Contest. The page ends with the date November 8, 1999.
