    Results of the championship round of the Northeast North America region, a plain-text table of 12 teams, named by institution, from Harvard in the first row down to Rochester. Each row has seven columns, one per problem, holding a time of day such as 10:24 or 1:45 where the problem was solved and a dash where not, followed by a last column of numbers (for example -6-, -3-, 269, 18). The table has no header row, so the columns are not labelled and the page does not say how the last column is computed. Harvard has six of the seven problems solved. No attempts are shown.

    A note under the table says all of these teams had to qualify in a preliminary contest. The page ends with the date October 26, 1998.
