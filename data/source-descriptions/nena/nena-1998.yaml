  title: ACM Northeast North America Region Home Page
  language:
  - en
  contest_date: '1998-10-24'
  description: |-
    Website of the ACM Northeast North America Region, in English. Our copy holds 7 pages. The home page links to the others: the contest sites and the contest dates for 1998-1999 (western, central, eastern and northeastern preliminary sites, a northern preliminary marked cancelled, and the regional final on October 24, 1998 at Westfield State College), a page naming the contest director and the maintainer of the region's web pages with the address of DCIS, Westfield State College, and the results page.

    Two rules pages are included. One is the Final Contest Rules 1997-98 of the International Contest, which links to the region-specific rules; the other is the region's special rules for the 1999-2000 contest (twelve teams advance to a championship round, no time penalty for rejected runs). The results page is the table of the championship round, with 12 teams; the home page calls it the contest results for 1997-1998, but the page itself is titled 1998-9. No problem statements are on the site.

    The logo image of the home page is not in our copy, and the registration page and the links to the international contest and ACM home pages lead outside it.
