  description: |-
    Final standings page of the Northeast North America ACM Programming Contest, 2000-2001, from the Westfield State College department site: a plain-text table of 14 teams in rank order, MIT first, then Harvard and UMass. Teams are shown by short names such as Bridgewater_State and St._Marys, without institution or country. Each team has eight problem cells holding either a time as printed (for example 12:53) or a dash, followed by one closing figure; the problems carry no labels and the columns have no headings, and there are no attempt counts.

    A note above the table says all listed teams won or placed well in preliminary contests, and a note below says the top team qualified for the International Contest while wildcard positions were still awaited. A link leads to the preliminary results.
