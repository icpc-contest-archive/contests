  read: '2026-11-16'
  rubric: 1
  copy: nena/nena-2000/website/2026-10-20-wayback-3fff4513
  title: Department of Computer and Information Science - ACM
  language:
  - en
  description: |-
    Website of the Department of Computer and Information Science at Westfield State College, whose ACM section covers the Northeast North America Region for 2000-2001, in English. Thirteen of the 115 pages in our copy belong to that section: a front page headed "ACM Northeast North America Region", and pages for the contest sites, regional rules, contest director, contest dates, final standings, preliminary results and the Westfield State College site (hardware, software, a campus page). The rest are the department's pages on courses, faculty and computing help, and one on its ACM activities.

    The sites page names four preliminary sites (Rochester Institute of Technology, Worcester Polytechnic Institute, Harvard University, Dalhousie University) and the regional final at Westfield State College. The regional rules describe a two-tier contest in which twelve teams advance to the Championship Round, with scoring by problems solved and then total time, no penalty for rejected runs, and C, C++ and Java as languages. The results page holds the final standings of 14 teams. The preliminary results page links to four preliminary-site results; only the one for the Western site (a scoreboard of 15 team rows and 7 problems) is in our copy, and the other three lead to other servers.

    The pages disagree on the day of the final: the rules page gives Nov. 4 and the dates page gives Nov. 6. The five pictures on the hardware page are not in our copy.
