  description: |-
    Page headed "The 2000 ACM Northeast North America Programming Contest sponsored by IBM", listing the order of teams with the columns Rank, Team and Citation; there are no solved counts, times or per-problem results. The Final Round at Westfield State College, dated 11/6/2000, lists 14 teams ranked 1 to 14 with the citations First Place to Fourteenth Place, MIT first; each team is given as institution followed by team name.

    Four lists for the preliminary sites follow, each dated: Dalhousie University (10/20/2000, 21 teams), Harvard University (10/21/2000, 10 teams), Rochester Institute of Technology (10/21/2000, 15 teams) and Worcester Polytechnic Institute (10/21/2000, 24 teams). Within each, the teams placed carry a rank and a place name (3, 4, 14 and 7 teams respectively; the Rochester list has ranks 1 and 3 to 15, with no rank 2) and the others are listed unranked as Honorable Mention.
