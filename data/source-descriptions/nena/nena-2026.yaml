  description: |-
    Website of the ICPC North America Northeast Regional for its 2026 – 2027 Regional Programming Contest, in English. The home page gives the contest date (Sunday, November 8, 2026), the region it covers, the names of the regional contest director and deputy, a tentative schedule in three time zones and a registration section where the opening, closing and fee values are still "TBA". A banner states that the schedule was last verified on August 23, 2026 against the ICPC Global list of upcoming regionals.

    A sites page lists seven host sites with their cities: Rochester Institute of Technology, Rensselaer Polytechnic Institute, Northeastern University, McGill University, Universite de Moncton, Wellesley College and Dalhousie University. A system information page describes the contest computer image, its editors, languages and IDEs, hardware rules and the use of Kattis as the judge; its heading and image details still refer to NENA 2025. Our copy holds five page addresses, of which three are distinct pages (two addresses repeat the sites and system information pages), within 35 saved files that include style sheets, scripts and images. No results or problem documents are in it.
