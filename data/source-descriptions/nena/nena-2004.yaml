    Standings page for the 2004 ACM Northeast North America Programming Contest sponsored by IBM, with rank, team (institution and team name), citation, and two unlabelled numbers after the citation for each ranked team. The regional final held at the Rochester Institute of Technology on 11/13/2004 lists 11 teams ranked from First Place (Massachusetts Institute of Technology, numbers 4 and 825) to Eleventh Place, two of them tied for 6th and 7th place. Below it come five preliminary sites: Boston (distributed, 10/23/2004) with 17 teams, all Honorable Mention; McGill (10/23/2004) with five; SUNY-Oswego (10/9/2004) with eight; the University of New Brunswick-Saint John (10/15/2004) with 22; and Western New England College (10/30/2004) with 17, all Honorable Mention. Unranked teams are listed as Honorable Mention. No per-problem detail.
