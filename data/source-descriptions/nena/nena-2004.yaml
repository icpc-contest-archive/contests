  title: ACM Northeast North America Region
  language:
  - en
  description: |-
    Website of the ACM Northeast North America Region, kept by the Department of Computer and Information Science at Westfield State College. Our copy holds 121 pages, many of them the department's pages on courses, help and facilities. The contest pages are the region's home page, the 2004-2005 contest sites, the regional modifications to the contest rules, the contest director page, the 2004-2005 dates, the final standings, a preliminary results index and an Eastern preliminary results page.

    The sites and dates pages name six sites with dates: a western preliminary at SUNY-Oswego (October 9, 2004), an eastern preliminary at Western New England College (October 30), a Boston preliminary at Harvard University (October 23), an Atlantic or northeastern preliminary at the University of New Brunswick-Saint John (October 15), a northern preliminary at McGill University (October 23) and the regional final at the Rochester Institute of Technology on November 13, 2004. The final standings page holds a text grid of 11 teams by eight problems. The preliminary results index links the Boston, Atlantic, Western and Northern results to other sites, which are not in our copy. No problem statements are in the contest pages.
