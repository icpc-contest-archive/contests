  description: |-
    Final ranklist of the 1999 contest, dated Sunday 21 November 1999: 26 team rows with rank, team (university and team name), and for each of the nine problems named divide, formatting, lcd, stree, dreisam, game, maze, robbery and y2k the result (Accepted, Wrong Answer, Run-Time Error or Time-Limit Exeeded, as spelled on the page), the time of the run and a penalty count, followed by a total time including penalty. A problem a team did not attempt is blank. The team in rank 14 is labelled IBM (not ranked). First place is the team Uni Ulm 1 of Albert Einstein University Ulm, with eight problems accepted. A link leads to a submission list that is not in our copy of this page.
