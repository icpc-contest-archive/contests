  title: 'ACM Freiburg: Programming Contest 1999 and 2000'
  language:
  - en
  contest_date: '1999-11-21'
  description: |-
    Website of the Freiburg ACM programming contest pages for 1999 and 2000, in English, headed ACM Programming Contest Freiburg 1999 and 2000. It covers two editions of the Mid Central European Regional Programming Contest, 1999 (21 November 1999) and 2000 (19 November 2000). The 1999 section links a practice session, the problem set, the jury input and expected output, the home directories of the teams, the final ranklist and photos; the 2000 section links the problem set, jury input and expected output, home directories and a ranklist. Other pages hold the contest rules, an account of the ACM contest and the programme of the event, the dates and deadlines, and a hotel reservation page.

    Our copy holds 148 files from 150 addresses: 45 HTML pages (20 of them re-sorted versions of directory listings), the nine 1999 problem statements as PostScript, the 1999 problem archive, the 1999 jury input and expected output files with their archives, 29 archives of the 1999 team home directories, 31 photo files and 11 icons and other images. The 2000 ranklist page is dated Sunday 19 November 2000, 15:21 CET. Not in our copy: the 2000 problem statement, jury files and team archives, the 1999 practice files, most of the photos and the accommodation page. Links to the ACM, sponsors and other sites lead outside the copy.
