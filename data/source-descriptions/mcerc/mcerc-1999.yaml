  description: |-
    Problem set: a PDF of 19 pages, A4, headed ACM International Collegiate Programming Contest 1999/2000, Mid-Central European Regional Contest. It holds nine problems A to I: A Maze, B Date bugs, C Robbery, D Dreisam Equations, E LC-Display, F Formatting Text, G The Game, H Dividing, I S-Trees. Problems A to H take two pages each and problem I three (pages 17 to 19). Each problem has a statement with input and output format and a sample input and output, and its header gives a file name for the solution (with the extensions c, cc, pas and java) and for the input file.

    The text layer of the PDF is garbled when extracted as text, so it does not copy or search correctly, but the pages display normally.
