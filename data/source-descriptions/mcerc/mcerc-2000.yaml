  description: |-
    Ranklist of the Freiburg contest, a scoreboard of 24 teams against eight problems named atlantis, cogwheels, erdos, numbergame, ouroboros, patterns, railroad and smith. Each team row gives rank, institution and team name with a team number, one cell per problem and a total time that includes penalty. A cell holds the judge's response (for example Accepted, Wrong Answer, Time-Limit Exceeded, Run-Time Error), a time and a penalty figure. The page is stamped Sun Nov 19 15:21:59 CET 2000 and headed "Current Ranklist"; a link leads to a submission list.

    First place is Albert Einstein University: Uni Ulm 1. Fifteen of the 24 rows have at least one Accepted cell; the last rows, with a total time of 0:00:00, have none, and four teams are listed as "unknown" institution.
