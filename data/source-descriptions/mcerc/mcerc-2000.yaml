- url: http://acm.informatik.uni-freiburg.de/
  read: '2026-11-16'
  rubric: 1
  copy: mcerc/mcerc-2000/website/2026-10-20-wayback-1ba7b369
  title: ACM Programming Contest Freiburg 1999 and 2000
  language:
  - en
  description: |-
    Website of the ACM Programming Contest Freiburg, one site for the 1999 and 2000 contests, in English. Our copy holds 148 saved files, 45 of them HTML pages (several are the same directory listing in a different sort order). The pages shared by both years give an overview of the ACM programming contest, the outline of the event (suggested arrival on 17 November 2000, practice session on 18 November, contest on 19 November), a summary of the rules, the contest site, accommodation, expenses and registration, and the application deadline. A separate rules page is the 1999 version. A hotel reservation page is also there, and the home page names IBM and SuSE as sponsors.

    The 2000 contest is represented by five pages: a ranking page headed "Current Ranklist", and directory listings of the problem set (final.pdf and final.ps.gz), the jury input (nine files), the expected output (eight files) and the team home directories (24 archives). Those listed files are not part of our copy. The 1999 contest is fuller: its practice session, problem files, input and output files, team home-directory archives, ranking page with a submission log, and some of the photographs are in our copy; further photographs were not saved.
