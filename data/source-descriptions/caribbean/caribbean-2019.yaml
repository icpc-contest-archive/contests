- url: https://www.icpc-caribe.com/
  read: '2026-11-16'
  rubric: 1
  copy: caribbean/caribbean-2019/website/2026-09-04-wayback-0a89b60f
  title: ICPC Caribe
  language:
  - es
  - en
  description: |-
    Website of ICPC Caribe, the Caribbean community of the ICPC, in Spanish and English. Our copy holds 81 pages. The home page reports the 2019 ICPC Caribbean finals, held from 6 to 10 November 2019 at the Universidad de Oriente (Cuban Site) and from 8 to 9 November 2019 at the Pontificia Universidad Católica Madre y Maestra, Campus Santiago de los Caballeros (Dominican Site), and gives summary figures for the 2019-2020 local finals (21 September 2019) and national finals (5 October 2019).

    The menu is organised in sections for local contests, national contests (including the Cuban national final) and the Caribbean Finals (the regional contest, with a section on the Cuban site). The pages cover the Caribbean community with its institutions by country as of 11 October 2019, official rules, eligibility, instructions for teams and site directors, judges' tips, registration and call for participation pages, contact pages, the teams qualified to the finals, online judges, a page of problem topics and editorials of Caribbean contests from 2009 to 2020, the Caribbean's participation and special awards in past regional contests, and lists of Latin American champions and World Finals participations, with a page on the Brazilian regional contests since 2004. The site also holds pages on other ICPC-related activities.

    The site is the series site and covers several editions. Our copy holds no results table of the 2019 finals.
- url: https://scorelatam.naquadah.com.br/latam-2019/
  read: '2026-11-16'
  rubric: 1
  copy: caribbean/caribbean-2019/scoreboard/2026-09-01-live-e9f99892/page.html
  title: Final Scoreboard
  language:
  - en
  teams: 368
  problems: 13
  times: true
  tries: true
  description: |-
    Final scoreboard of ICPC LATAM 2019 produced by BOCA, shared by the Latin American finals of 2019: one table with 22 views stacked one after another, a global view of 343 teams, a view that adds 25 further teams whose user names start with ccl (368 teams in all), and views by site or group such as Brazil, Mexico, Colombia, Argentina, Chile, Peru, Bolivia, El Salvador, Costa Rica, Venezuela, Cuba, the Dominican Republic, the Caribbean, North and South, so that the table has 1312 rows. Each row gives rank, user and site, team name preceded by a bracketed tag (mostly the institution), tries and time for each of problems A to M, and the total solved with penalty time in brackets. The first row is a Brazilian team with ten problems solved.

    The Caribbean teams are mixed in with all the others in the global view; the Caribbean view lists 31 of them: 25 with the Cuban user prefix cbcu and 6 with the Dominican prefix cbrd. The pages for statistics, clarifications and run lists, linked at the top, are not part of our copy.
