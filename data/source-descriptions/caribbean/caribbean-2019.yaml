  description: |-
    Problem set of the 2019 Latin American Regional Contests: a PDF of 22 pages. The cover gives November 8th-9th, 2019, "Contest Session", states that the set has 13 problems on pages numbered 1 to 20, and lists the thirteen countries where it was used in simultaneous contests, among them Cuba and República Dominicana; it carries a version mark v1.0. A page of general information follows, allowing C, C++, Java, Kotlin and Python solutions.

    The thirteen problems, A Algorithm Teaching to M Mountain Ranges, are in English under the running header ICPC Latin American Regional – 2019, each with input and output sections and numbered samples (32 sample inputs in all). No solutions or test data.
