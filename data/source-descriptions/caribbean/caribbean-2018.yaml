  description: |-
    Problem set of the 2018 Latin American Regional Contests: a PDF of 18 pages. The cover gives November 9th-10th, 2018, "Contest Session", states that the set has 13 problems on pages numbered 1 to 16, and lists the thirteen countries where it was used in simultaneous contests, among them Cuba and República Dominicana; it carries a version mark v1.2. A page of general information follows, allowing C, C++, Java and Python solutions.

    The thirteen problems, A A Symmetrical Pizza to M Mount Marathon, are in English under the running header ICPC Latin American Regional – 2018, each with input and output sections and numbered samples (39 sample inputs in all). No solutions or test data.
