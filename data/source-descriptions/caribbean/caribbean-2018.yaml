  description: |-
    Unofficial scoreboard of ICPC Latin America 2018, produced by BOCA. One table with a selector for 17 views: latam, ca, cub, dom, mex, cri, slv, ct, bra, ven, col, no, arg, per, chi, bol and so. The latam view lists 406 teams against 13 problems labelled A to M; the ca view lists 43 teams, led by the Universidad de La Habana team UH++ with 9 solved, and the other views are further subsets of the same teams.

    Per team the board gives the rank, a login with country code, the team name with its institution in brackets, the number of tries and the time for each problem attempted (a dash instead of a time where the problem was not solved), and the number solved with total penalty time in brackets. The latam view is led by a team of the USP - São Carlos with 10 solved. The page carries no date and does not say whether it is final; teams with no solved problem are listed at the end.
