  title: COJ Forum - Index page
  language:
  - en
  description: |-
    Front page of the COJ Forum, a phpBB discussion board of an online judge, in English. It lists the board's categories with topic and post counts: general discussions (problem set, algorithms, documentation, FAQ, guestbook, off topic), online judge system (bugs, suggestions, announcements, related tools), programming languages, and Competitive Programming Contests, which has ACM-ICPC Caribbean Local Contests, National Contests, Finals (Regional Contest) and other contests. In the copy dated 9 April 2019 the Caribbean Finals category shows 44 topics and 46 posts, the latest titled "FC2018 - The 6th Caribbean To…".

    Our copy holds 150 files. 14 are HTML pages: nine saved copies of the front page (headed "It is currently" 7 December 2018, 9 April, 10 April and 2 May 2019) and the forum FAQ and BBCode FAQ pages in Spanish and English versions. 134 are Atom feeds of forum posts, dated 2011 to 2016, from the general, announcement, local contest, national contest and other contests forums; the others are a favicon and a one-pixel image. Nothing in the copy is a forum or topic page of the 2018 Finals, and it has no results or problems; the front page only names the sub-forums of the 2018 editions in its menu.
