    Final standings of the 2018 ICPC Caribbean Finals: 43 teams with rank, team name, institution, number of problems solved, total time and a citation column. UH++ of the Universidad de La Habana is first with 9 solved and a time of 748, followed by Limitless of the Universidad de Oriente - Sede Antonio Maceo (8 solved, 584) and UCLV.h of the Universidad Central "Marta Abreu" de Las Villas (8 solved, 936). Ranks run from 1 to 43 without ties; the last team has no problem solved. There is no per-problem detail and no list of problems.
