  description: |-
    Codeforces gym dashboard of the "2017-2018 ACM-ICPC Latin American Regional Programming Contest" (the title names the Latin American regional as a whole, not the Caribbean Finals alone), marked Finished. It lists 13 problems labelled A to M, from "Arranging tiles" to "Marblecoin", each with its name, input and output mode (standard input/output), a time limit of 1 second (2 seconds for A) and a memory limit of 256 MB, and a count marked with an x. A link under Contest materials leads to a statements PDF in English; the PDF is not in our copy, so the statements are not included. The rest of the page is Codeforces navigation, the virtual participation notice and the forms for questions and announcements.
