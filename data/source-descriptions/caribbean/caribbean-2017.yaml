    Problem list of the category "Latin America Regional Contests 2017" on the Baekjoon Online Judge, a Korean-language site. It is a table of 13 problems labelled A to M, from "Arranging tiles" to "Marblecoin", each with its judge problem number and English title, marked as multilingual, with the count of users who solved it, the number of submissions and the acceptance rate. The statements themselves are on separate problem pages that are not part of this list.
