  - es
  description: |-
    Forum page for the 2017 edition inside the COJ Forum, under ICPC Caribbean Finals (Regional Contest), Previous editions. Its heading reads "The 2017 ACM-ICPC Caribbean Regional Contest". It lists three sub-forums for the Cuban, Dominican and Puerto Rican sites (the Cuban one has 6 topics, the other two none) and eight topics of the edition, in Spanish and English: call for participation, official rules, eligibility conditions, team registration guide, instructions for teams, judges' tips, the 8th Caribbean meeting of ACM-ICPC leaders and the 5th tournament of virtual players ICPChallenge. Four announcement topics are listed above them: three calls for participation for 2019 events and one on the ICPC Caribbean Community members.

    Only this forum page is in our copy; the topics are listed by title and their posts are not part of it. It has no results table.
