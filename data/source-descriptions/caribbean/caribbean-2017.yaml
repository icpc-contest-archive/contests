  title: The 2017 ACM-ICPC Caribbean Finals
  language:
  - en
  teams: 56
  description: |-
    Final standings of the 2017 ACM-ICPC Caribbean Finals: 56 teams with rank, team name, institution, number of problems solved, total time, medal, citation and site citation. Firefox of the Pontificia Universidad Católica Madre y Maestra - Campus Santo Domingo is first with 8 solved and a time of 965; Netscape of the Universidad de Oriente - Sede Antonio Maceo has 7 and KFP of the Universidad Central "Marta Abreu" de Las Villas has 6. The Medal column marks the top three teams as Gold, Silver and Bronze Medals, and the Site citation column names the Dominican and Cuban site champions (the first two teams). Teams with equal results share a rank. There is no per-problem detail and no list of problems.
