  description: |-
    Final scoreboard of the ICPC Latin America Regionals 2025, a BOCA report page shared by all the Latin American regional contests that ran on the same problem set. It lists 593 distinct team ids with site code, team name (some prefixed [CCL]), a cell per problem A to L giving attempts and time of the accepted run (or attempts and a dash), and a total of problems solved with penalty time in brackets. Teams are repeated under several views of the same board (global, by country and region), so the page has far more rows than teams. 53 of the ids carry Caribbean site codes (AG, CU, DO, PR, TT).

    The page also links to the contest information sheet, the problem set (contest.pdf), time limits, warmup material, a report on editors and machines, and the BOCA packages; those links lead to files that are not part of this page.
