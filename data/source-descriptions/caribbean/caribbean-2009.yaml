  description: |-
    Results page of the Caribbean Finals of the ACM-ICPC for 2009, in Spanish, on the finals' WordPress site. Three tables: standings by team (33 teams with position, team, institution, country, accepted problems and time), by institution (13 institutions with number of teams, points and accepted problems) and by country (CUB, with 12 institutions and 32 teams, and RDO, with 1 institution and 1 team). In the team table the first team, UCLV1, is marked with an asterisk as qualified for the 2010 World Finals; 24 teams solved at least one problem and the nine with none share position 25. A note explains how institution and country points are summed from team positions and refers readers to the official table on the ACM-ICPC site. The site menu and sidebar link to the results of 2010 and 2011 and other pages of the finals.
