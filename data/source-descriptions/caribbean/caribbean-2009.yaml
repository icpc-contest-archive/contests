    Problem list of the Baekjoon Online Judge category Latin America Regional Contests 2009, in a Korean interface. A table of 13 problems with judge problem number, letter, title, accepted and submitted counts and acceptance ratio: the eleven problems A to K and two further problems labelled PA and PB. Most titles are English (Another Crisis, Brothers, Code Lock, Dinner Hall, File Recover, Grapevine, Hooligan, Isosceles Triangles, Jingle Composing, Klingon Levels, Hexagonal Tiles); problem E and problem PA have Korean titles. Each problem links to its own page on the judge, which is not in our copy. The category is named for the Latin America regional contests of 2009 as a whole.
