  description: |-
    Final standings of the 2010 Caribbean Final on the contest's WordPress site, in Spanish: 30 teams with rank, team, institution, country, accepted solutions (ACs), time and time of the last accepted solution. Olimpo from UCI is first with 6 solved. The two teams marked with an asterisk are those qualified for the 2011 World Finals. There is no per-problem detail.

    The page also holds a table of 15 institutions with number of teams, points and ACs, with the rule for the points; a table of the three countries represented (CUB, RDO, JAM); and four special prizes (fastest, most persistent, most accurate and most extreme team) with the winning team of each. A link labelled official table leads to the ICPC site.
