  title: ACM International Collegiate Programming Contest 2010 Latin American Regional Contests
  language:
  - en
  problems: 11
  pages: 17
  description: |-
    Problem set of the 2010 ACM ICPC Latin American Regional Contests, as a PDF of 17 pages in English. The cover gives October 22nd-23rd, 2010 and the Contest Session, and says that the set has 11 problems and is used in simultaneous contests hosted in Argentina, Bolivia, Brazil, Chile, Colombia, Cuba, Peru, Mexico and Venezuela; it is marked v1.0. A page of general information on input and output follows the cover, and the problems run on pages numbered 1 to 15.

    Eleven problems A to K follow, from A Ants Colony to K Kids’ Wishes: Bingo!, Cocircular Points, Digits Count, Electric Needs, Flowers Flourish from France, Growing Strings, Hyperactive Girl, Ingenious Metro and Jollo in between. Each has a statement with a code name for its files, input and output sections and a sample input with its output. No test data or solutions.
