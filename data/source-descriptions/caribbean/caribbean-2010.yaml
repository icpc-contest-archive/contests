    Problem list of the Baekjoon Online Judge for the category Latin America Regional Contests 2010, with Korean menus: a table of 13 rows, the eleven problems A to K of the contest followed by two practice problems PA and PB. Each row gives the judge's problem number, label, title, and counts of correct and total submissions with the success ratio. Titles of problems C, D and G are in Korean; F is titled Tautogram.

    Only the list is in our copy; the statements are on separate pages of the judge. The category is shared by the Latin America regional contests of 2010 (it is not specific to the Caribbean final), and it is not shown which site each problem was used at.
