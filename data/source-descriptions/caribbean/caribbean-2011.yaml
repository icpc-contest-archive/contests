    Home page of the WordPress site of the Caribbean Finals of the ACM-ICPC, in Spanish. The only post is a welcome message from 2009 signed by the director of the Caribbean Final, announcing a temporary website with general information about the event. The menu lists sections on the contest (important dates, documents, team composition, registration fee, participants, training, live broadcast), results pages for 2009, 2010 and 2011, accommodation, travel and contact, and a list of external links.

    The banner of the page announces a sixth edition on 7 and 8 November 2014, which is not this contest. Our copy holds this single page; the results pages it links to are separate sources.
