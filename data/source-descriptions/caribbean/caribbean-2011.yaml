  title: ACM International Collegiate Programming Contest 2011 Latin American Regional Contests
  language:
  - en
  problems: 11
  pages: 22
  description: |-
    Problem set of the 2011 ACM ICPC Latin American Regional Contests, as a PDF of 22 pages in English. The cover gives November 4th-5th, 2011 and the Contest Session, and says that the set has 11 problems and is used in simultaneous contests hosted in Argentina, Bolivia, Brazil, Chile, Colombia, Cuba, Peru, Mexico and Venezuela; it is marked v1.1. A page of general information on input and output follows the cover, and the problems run on pages numbered 1 to 20.

    Eleven problems A to K follow, from A Army buddies to K King’s Poker: Ball Stacking, Candy’s Candy, Diccionário Portuñol, Electrical Pollution, File Retrieval, Garden Fence, Hedge Mazes, In Braille and Jupiter Attacks! in between. Each has a statement with a code name for its files, input and output sections and a sample input with its output. No test data or solutions.
