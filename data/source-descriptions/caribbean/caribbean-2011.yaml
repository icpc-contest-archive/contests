    Problem list of the Baekjoon Online Judge for the category Latin America Regional Contests 2011, with Korean menus: a table of 13 rows, the eleven problems A to K followed by two practice problems PA (Bakugan) and PB (Hailstone Sequences). Each row gives the judge's problem number, label, title, and counts of correct and total submissions with the success ratio. The titles of problems B and F are in Korean, the others in English.

    Only the list is in our copy; the statements are on separate pages of the judge. The category is shared by the Latin America regional contests of 2011 and is not specific to the Caribbean final.
