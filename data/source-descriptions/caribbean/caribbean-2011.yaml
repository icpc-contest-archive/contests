    Codeforces gym dashboard of a training contest built from the 2011-2012 ACM-ICPC Latin American Regional Contest plus extra problems, in English. It lists 13 problems: A to K are the eleven regional problems (Army buddies to Kings Poker) and L (Gates) and M (Game) are added; each row gives the time and memory limit and a count shown as x followed by a number. The page links to a statements PDF and to an editorial post, and carries the gym's submission and question forms.

    The gym is named for the whole Latin American regional, not for the Caribbean final. Our copy holds the dashboard page only; the statements PDF and the editorial are not in it.
