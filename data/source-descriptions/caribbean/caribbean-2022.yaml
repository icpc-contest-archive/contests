    Standings of the 2022 ICPC Caribbean Finals: 41 teams with rank (1 to 41, with ties at 18 and 23), institution, number of problems solved, total time, medal, a regional contest rank citation and a site citation. 30 teams are listed at the Cuba site, 10 at the Dominican Republic site and 1 at the Puerto Rico site. Gold, silver and bronze medals go to the first three teams, from Universidad de La Habana (nine problems solved), Universidad de Las Tunas and Universidad de La Habana. One team has zero solved. There are no per-problem results.
