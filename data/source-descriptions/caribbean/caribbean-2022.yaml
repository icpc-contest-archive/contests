  description: |-
    Problem set of the ICPC 2022 Latin American Regional Contests, contest session of 18 March 2023, as a PDF of 32 pages in English, marked v1.0. The cover says it is used in simultaneous contests in Argentina, Bolivia, Brasil, Chile, Colombia, Costa Rica, Cuba, El Salvador, México, Perú, Puerto Rico, República Dominicana, Uruguay and Venezuela. After a page of general conditions for input and output it has 13 problems, A (Asking for Money) to M (Maze in Bolt), each with a statement, input and output specification and one to five sample cases; the last page only says it is intentionally left blank. No test data or solutions. The set is shared by all Latin American sites, not only the Caribbean one.
