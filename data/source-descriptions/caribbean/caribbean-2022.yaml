- url: https://www.icpccaribe.org/
  read: '2026-11-16'
  rubric: 1
  copy: caribbean/caribbean-2022/website/2026-09-04-wayback-6ff148cf
  title: ICPC Caribe
  language:
  - es
  - en
  description: |-
    Website of ICPC Caribe, a Google Sites site mostly in Spanish with some English page titles. Our copy holds 85 pages. It covers the Caribbean qualifier (eliminatoria) and the Caribbean Final (final caribeña): announcements, official rules, eligibility conditions, instructions for teams and for site directors, judges' tips, the Cuban site, and a chess side event. For the 2022 edition it has a page listing the teams qualified to the Puerto Rican, Dominican and Cuban sites of the regional contest with their ranks and problems solved, and a report on the results of the Cuban pre-university teams in 2022, with the number of teams per site. Qualified-teams pages for 2020, 2021 and 2023 and pre-university results pages for 2017 to 2024 are in it too, as are the announcement and rules for the 2023 final.

    The site also has pages on ICPC in Latin America (regional contests of South America, Brazil, Mexico and Central America, champions and World Finals participations) and on the history of Caribbean teams (podiums, special prizes, exercises used in Caribbean contests, online judges).

    Our copy holds the pages as text only, with no images. The page of registered teams embeds its tables from external spreadsheets, which are not in our copy.
