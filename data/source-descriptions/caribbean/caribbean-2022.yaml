  title: ICPC-LATAM - Latin America - Regional 2022
  language:
  - en
  teams: 329
  problems: 13
  times: true
  tries: true
  description: |-
    Scoreboard headed "Final Scoreboard" of the BOCA system for the ICPC-LATAM Latin America Regional 2022, shared by all Latin American sites. The table has 855 rows for 329 distinct user ids; each team appears two or three times, and the page header lists the available scores Global, Brasil, CentroAmerica, Caribbean, Mexico, North, South and matching CCL ones. Each row gives rank, user id with country code, team name with a bracketed institution or group tag, tries and time for each of problems A to M, and the total solved with penalty in brackets. 41 teams have Caribbean site ids (cbcu, cbdr, cbpr), and 20 team ids start with ccl; 15 of their names begin with [CCL] and the others carry tags such as [OMI] or [PREPA5]. The first row is a team tagged [UBA - FCEN] with 12 solved.

    The page links to the contest problem set, time limits, editorial, information sheets and warm-up files, and to the BOCA runs, tasks, clarifications and statistics pages; none of those is part of our copy.
