    Final standings of the 2016 ACM-ICPC Caribbean Finals: 43 teams with rank, team name, institution, number of problems solved, total time and a citation column. UH++ of the Universidad de La Habana is first with 10 solved and a time of 1359, followed by sUrPRise of the Universidad de Pinar del Río with 8 and KFP of the Universidad Central "Marta Abreu" de Las Villas with 7. Ranks run from 1 to 43; teams with equal solved and time (ranks 11 and 12, for example) still carry different ranks. The last team has no problem solved. There is no per-problem detail and no list of problems.
