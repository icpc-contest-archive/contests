  description: |-
    Problem set of the 2016 Latin American Regional Contests: a PDF of 15 pages. The cover gives November 11th-12th, 2016, "Contest Session", states that the set has 11 problems on pages numbered 1 to 13, and lists the twelve countries where it was used in simultaneous contests, among them Cuba and República Dominicana; it carries a version mark v1.0. A page of general information follows, allowing C, C++, Java and Python solutions.

    The eleven problems, A Assigning Teams to K Kill the Werewolf, are in English under the running header ICPC Latin American Regional – 2016, each with input and output sections and numbered samples (33 sample inputs in all). No solutions or test data.
