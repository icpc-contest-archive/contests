  description: |-
    Standings of the 2023 ICPC Caribbean Finals: 64 teams with rank, institution, number of problems solved, total time, medal, a rank citation and a site citation. 37 teams are at the Cuba site, 15 at the Dominican Republic site, 7 at Puerto Rico, 3 at Trinidad and Tobago and 2 at Antigua and Barbuda. Seven teams share rank 58 at the bottom, all with no solved problems. The first team, from Universidad de La Habana, has 7 solved. Medals are awarded per site: 13 gold, silver and bronze medals in all, each tagged with its site. There are no per-problem results.
