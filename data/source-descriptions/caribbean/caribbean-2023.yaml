  description: |-
    Page of the ICPC Caribe site, in Spanish, with the podiums of the Caribbean regional contests: 16 editions, from 2009 and 2010 (held as part of the Mexico and Central America region) and the Caribbean Final from 2011 to 2024. Each edition gives the contest date, the sites, links to the ranking and the problem set, and the top three teams with problems solved, penalty, institution, team members and coach.

    The 2023 section states 21 October 2023 and the sites UH, PUCMM-STI, UPR-M, UWI-TTO and UWI-FIC. It lists three teams: the first, UH Top from the Universidad de La Habana, solved 7 problems with penalty 890; the second and third solved 5 each, with penalty 754 and 888. Only these three teams are given for this edition.
