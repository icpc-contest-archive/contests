  description: |-
    Problem set of the ICPC 2023 Latin American Regional Contests, contest session of 21 October 2023, as a PDF of 30 pages in English, marked v1.0. The cover says it is used in simultaneous contests in Antigua y Barbuda, Argentina, Bolivia, Brasil, Chile, Colombia, Costa Rica, Cuba, El Salvador, Guatemala, México, Perú, Puerto Rico, República Dominicana, Trinidad y Tobago, Uruguay and Venezuela. After a page of general conditions for input and output it has 13 problems, A (Analyzing Contracts) to M (Meeting Point), each with a statement, input and output specification and one to four sample cases. No test data or solutions. The set is shared by all Latin American sites, not only the Caribbean one.
