  description: |-
    Scoreboard headed "Final Scoreboard" of BOCA for the LATAM Regional 2023, shared by all Latin American sites. The table has 1557 rows for 424 distinct user ids; each team appears three or four times. The page header lists the available scores: Global, Global+CCL, Brasil, CentroAmerica (El Salvador, Costa Rica, Guatemala), Caribbean (Antigua and Barbuda, Trinidad and Tobago, Puerto Rico, Dominican Republic, Cuba), Mexico, North (Colombia, Venezuela), South (Argentina, Bolivia, Chile, Peru) and CCL (Brasil, Cuba, Mexico, Bolivia). Each row gives rank, user id with country code, team name with a bracketed institution or group tag, tries and time for each of problems A to M, and the total solved with penalty in brackets. 64 user ids belong to the Caribbean sites. 20 team ids start with ccl; 17 of their names begin with [CCL] and the others carry tags such as [OMI] or [OMIJAL].

    The page links to the contest problem set, time limits, editorial, information sheets and warm-up files, to the BOCA runs, tasks, clarifications and statistics pages, and to team photos; none of those is part of our copy.
