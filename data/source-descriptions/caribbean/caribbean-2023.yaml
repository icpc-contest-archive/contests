- url: https://www.icpccaribe.org/
  read: '2026-11-16'
  rubric: 1
  copy: caribbean/caribbean-2023/website/2026-09-05-wayback-6ff148cf
  title: ICPC Caribe
  language:
  - es
  - en
  description: |-
    Website of ICPC Caribe, a Google Sites site mostly in Spanish with some English text. Our copy holds 85 pages, captured between March 2023 and December 2025. For the 2023 edition it has the page of teams qualified to the Dominican Republic, Puerto Rico, Trinidad and Tobago, Antigua and Barbuda and Cuba sites of the regional contest, with the qualification rule applied to each team, the announcement and official rules of the 2023 Caribbean Final (final caribeña), a report on the 33 Cuban pre-university teams of the 2023 qualifier, and pages of the Cuban site: a call for sponsors, a chess tournament, an algorithms workshop and a collaborative learning workshop.

    It also holds pages of other editions: qualified teams for 2020 to 2022 and 2024, pre-university results for 2017 to 2024, and a 2025 page on a tournament of AI contestants. Further pages cover ICPC in Latin America (regional contests of South America, Brazil, Mexico and Central America, champions and World Finals participations) and Caribbean history (podiums, special prizes, online judges).

    Our copy holds the pages as text only, without images. The tables of registered teams are embedded from external spreadsheets and are not in our copy.
