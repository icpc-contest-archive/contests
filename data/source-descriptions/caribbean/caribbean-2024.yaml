  description: |-
    Final scoreboard of the 2024 ICPC Latin America Contests, a BOCA report page shared by all the Latin American regional contests that ran on the same problem set. It lists 516 distinct team ids with site code, team name (some prefixed [CCL]), a cell per problem A to L giving attempts and time of the accepted run (or attempts and a dash), and a total of problems solved with penalty time in brackets. Teams are repeated under several views of the same board (global, by country and region), so the page has far more rows than teams. 25 of the ids carry Caribbean site codes (AG, DO, PR, TT).

    The page also links to the contest information sheet, the problem set (contest.pdf), time limits, an editorial (solution sketches), warmup material and the BOCA packages; those links lead to files that are not part of this page.
