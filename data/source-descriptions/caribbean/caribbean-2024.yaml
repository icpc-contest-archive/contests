  description: |-
    Page of the ICPC Caribe website (a Google Sites page, in Spanish) giving the podium of every Caribbean regional contest from 2009 to 2024, one section per edition. The section for the 2024 Caribbean Final names 9 November 2024 as the date and UAPA, UPR-M, UWI-TTO and UWI-FIC as sites, and gives the top three teams with problems solved and penalty time: #Pray4Mark with 4 solved and 457 penalty, AEE with 4 and 618, Cypher++ with 3 and 503. For each it also gives the institution, country, members and coach, and says the first team qualified for the "PDA 2025" in Brazil (Salvador de Bahía). Each edition has links to the ranking, the problem set and the icpc.global ranking.

    Only the three podium teams of 2024 are listed here, not the full field.
