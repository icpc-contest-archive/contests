  description: |-
    Problem set of the contest session, a PDF of 31 pages in English. The cover gives the date April 2, 2022, states that the set has 13 problems on pages numbered 1 to 29, and says it was used in simultaneous contests in 18 countries, among them Cuba, Jamaica, Puerto Rico, the Dominican Republic and Trinidad and Tobago; it is marked v1.0. A page of general information on program names, input and output follows.

    The thirteen problems run from A, Ancient Towers, to M, Most Ordered Way. Each has a statement with input and output sections and between one and six sample inputs with their outputs. No test data or solutions.
