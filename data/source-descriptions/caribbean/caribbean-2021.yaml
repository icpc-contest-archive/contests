  description: |-
    Scoreboard of ICPC LATAM - 2021 produced by BOCA, shared by the Latin American finals: one table with 32 views stacked one after another, a global view of 252 teams, views by country, region or site (Brazil, Central America, Costa Rica, El Salvador, the Caribbean, Cuba and its sites, the Dominican Republic, Mexico and its sites, North, Venezuela, Colombia, South, Argentina, Bolivia, Chile and Peru), and 21 further teams that are not in the global view, so that the table has 756 rows and 273 distinct teams. Each row gives rank, user and site, team name preceded by a bracketed tag, tries and time for each of problems A to M, and the total solved with penalty time in brackets. Teams marked CCL are included; the first row of the table is one of them, with nine problems solved.

    The Caribbean view lists 37 entries: 29 with Cuban user prefixes, 3 more Cuban ones whose user name ends in ccl and 5 with the Dominican prefix cbdr. Links at the top to the problem set, an information sheet, the BOCA packages, statistics, run lists and clarifications are not part of our copy.
