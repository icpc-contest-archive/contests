  description: |-
    Final standings of the 2014 ACM-ICPC Caribbean Finals: 46 teams with rank, team name, institution, number of problems solved, total time and a citation column. The Universidad de Oriente - Sede Antonio Maceo team Napster is first with 8 solved and a time of 801, followed by two teams of the Universidad de La Habana with 7 solved each. Teams with equal results share a rank. There is no per-problem detail and no list of problems.
