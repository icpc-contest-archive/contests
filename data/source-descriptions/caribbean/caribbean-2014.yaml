  title: Finales Caribeñas del ACM-ICPC | Sexta edición el 7 y 8 de noviembre de 2014
  title_en: Caribbean Finals of the ACM-ICPC | Sixth edition on 7 and 8 November 2014
  language:
  - es
  description: |-
    Website of the Finales Caribeñas del ACM-ICPC (Caribbean Finals of the ACM-ICPC), in Spanish, on WordPress.com. The banner of the front page reads "Sexta edición el 7 y 8 de noviembre de 2014" (sixth edition, 7 and 8 November 2014), but most inner pages carry the banner "Tercera edición el 4 y 5 de noviembre de 2011 en la UCI" (third edition, 4 and 5 November 2011). Our copy holds 50 files, of which 28 are HTML pages (some saved twice, under http and https): a welcome post dated 2009, pages about the ACM-ICPC, the Latin America super region, the Caribbean Finals, sponsors, Havana and the host university UCI, and pages on important dates, documents, team composition, registration fee, participants (invited guests by country), training links, live broadcast, lodging, travel and contact.

    The body text is older than the 2014 banner. The lodging page gives hotel nights from 1 to 7 November 2011, and the two results pages are tables of the 2009 contest (33 teams) and the 2010 contest (30 teams) with columns position, team, institution, country, ACs and time (the 2010 table adds the time of the last AC), each followed by an institution ranking. The menu also lists a 2011 results page that is not in our copy. The copy has no results, problems or team list for 2014.
