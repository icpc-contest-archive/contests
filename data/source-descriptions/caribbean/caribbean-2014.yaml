  description: |-
    Unofficial final scoreboard of ICPC Latin America headed 08/NOV/2014, produced by BOCA. It is one table with links to switch between 15 views: General, Caribbean, NorthRegion, SouthRegion, Mexico_CostaRica, Brasil, Colombia, Venezuela, Panama, Argentina, Bolivia, Chile, Peru, Cuba and RepDominicana. The General view ranks 404 teams across 11 problems labelled A to K; the Caribbean view has 46 teams, and the other views are subsets of the same teams.

    Per team the board gives the rank, a login with country code, the team name, and for each problem the number of tries and the time (4/- means tries without a time), with a balloon image on solved problems, then the number solved and total penalty time in brackets. The General board is led by a team tagged USP (BRA) with 10 problems solved. The footer reads Release of 09/Nov/2014. The last two teams of the General view solved no problem.
