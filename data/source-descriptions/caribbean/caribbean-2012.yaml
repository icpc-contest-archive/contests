    Final standings of the 2012 Caribbean Finals of the ACM-ICPC: 34 teams with rank, team, institution (full name), problems solved, total time and a citation. The first seventeen places carry First to Seventeenth Place and the other seventeen are marked Honorable Mention. UH++ from Universidad de La Habana is first with 5 problems solved and a total time of 285. No per-problem results, attempts or country column.
