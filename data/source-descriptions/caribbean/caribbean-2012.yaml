    Problem list of the Baekjoon Online Judge for the category Latin America Regional Contests 2012, with Korean menus: a table of 12 rows, the ten problems A to J followed by two practice problems PA (Hot Dogs) and PB (Tornado!). Each row gives the judge's problem number, label, title, and counts of correct and total submissions with the success ratio. The titles of problems D, H and I are in Korean, the others in English.

    Only the list is in our copy; the statements are on separate pages of the judge. The category is shared by the Latin America regional contests of 2012 and is not specific to the Caribbean final.
