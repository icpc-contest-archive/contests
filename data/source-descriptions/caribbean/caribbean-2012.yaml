  description: |-
    Problem set of the 2012 Latin American Regional Contests: a PDF of 19 pages. The cover gives November 9th-10th, 2012, "Contest Session", states that the set has 10 problems on pages numbered 1 to 17, and lists the ten countries where it was used in simultaneous contests, among them Cuba and República Dominicana; it carries a version mark v1.0 and spaces for sponsors in Brazil. A page of general information on program names, input and output follows.

    The ten problems, A Arranging Heaps to J Joining Couples, are in English, each with input and output sections and a sample input with its output, under the running header ICPC Latin American Regional – 2012. No solutions or test data.
