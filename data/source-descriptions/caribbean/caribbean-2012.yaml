  description: |-
    Home page of the official website of the Cuban site (Sede Cubana) of the Caribbean Final of the ACM-ICPC, in Spanish, dated September to October 2012. It has a welcome message from the director of the event in the Caribbean and a news item of 13 October 2012 on the Cuban final, held at seven sites across the country with 80 teams, ten of them from the Universidad de las Ciencias Informáticas (UCI), which qualified four teams for the regional contest. Three highlighted entries give the dates of the regional contest (9 and 10 November 2012), the national contests (13 October 2012) and the local contests (29 September 2012).

    The menu lists sections on the contest (call, participants, schedule, activities, rules, environment, registration, eligibility, travel, accommodation, transport, FAQ) and a photo and video gallery; the sidebar has a visitor count, sponsors and links. The comment block holds a test comment and advertising spam. Our copy holds this single page; none of the other sections or any results are in it.
