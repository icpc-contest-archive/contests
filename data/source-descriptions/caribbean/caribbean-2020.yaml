  title: ICPC LATAM - 2020 (in 2021)
  language:
  - en
  teams: 302
  problems: 14
  times: true
  tries: true
  description: |-
    Scoreboard of ICPC LATAM - 2020 (in 2021) produced by BOCA, shared by the Latin American finals: one table with 19 views stacked one after another, a global view of 302 teams and views by site or group (Brazil, Central America, the Caribbean, Mexico, North, South and single sites such as Cuba, the Dominican Republic, Trinidad and Tobago, Colombia, Argentina, Peru, Bolivia and Chile), so that the table has 785 rows. Each row gives rank, user and site, team name preceded by a bracketed tag (the institution), tries and time for each of problems A to N, and the total solved with penalty time in brackets. The first row is a Cuban team, UH Top of the Universidad de La Habana, with ten problems solved.

    The Caribbean teams are mixed in with the others in the global view; the Caribbean view lists 36 of them: 27 with the Cuban user prefix cbcu, 5 with the Dominican prefix cbdo and 4 with the Trinidad and Tobago prefix cbtt. Links at the top to the problem set, an information sheet, the BOCA packages, statistics, run lists and clarifications are not part of our copy.
