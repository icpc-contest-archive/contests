- url: https://www.icpc-caribe.com/
  read: '2026-11-16'
  rubric: 1
  copy: caribbean/caribbean-2020/website/2026-09-05-wayback-0a89b60f
  title: ICPC Caribe
  language:
  - es
  - en
  description: |-
    Website of ICPC Caribe, the Caribbean community of the ICPC, in Spanish and English. Our copy holds 81 pages. A banner on 25 pages announces the 2020 ICPC Caribbean Finals for 10 July, and a page of qualified teams lists the 36 teams going to the Caribbean Final (Cuba 27, Dominican Republic 5, Trinidad and Tobago 4) with their qualifying places. The home page still reports the 2019 finals and the 2019-2020 local and national contests; the Caribbean community page lists institutions by country as of 18 June 2021.

    The menu has sections for the qualifier (Eliminatoria), the Caribbean Final (Final Caribeña) and ICPC Latin America. The pages cover official rules, eligibility, instructions for teams, judges' tips, registration, calls for participation, contact pages, results and medals of a pre-university teams contest, a page of problem topics and editorials of Caribbean contests from 2009 to 2020, a page of special awards of the Caribbean finals from 2010 to 2020, online judges, and lists of Latin American champions and World Finals participations.

    The site is the series site and covers several editions. Our copy holds no results table of the 2020 final; the nearest are the list of qualified teams and the special awards.
