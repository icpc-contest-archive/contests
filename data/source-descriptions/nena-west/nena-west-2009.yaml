  contest_date: '2009-10-17'
  description: |-
    Website of the SUNY Fredonia computer science department, in English, entered through the page of the ACM Preliminary Programming Contest held at SUNY Fredonia on October 17th 2009. That page asks teams to register at the Baylor site, gives October 10th 2009 as the deadline for contestant information and a fee of $50 per team, lists the day's itinerary from registration at 9:00 am to the awards presentation at 3:15 pm, and says the contest uses the Microsoft environment with C/C++ and Java. It also lists local lodging and links to the questions of 2007 to 2009 and to the standings.

    Our copy holds 132 pages. The contest material in it is the contest page, the 2009 questions as a PDF and the 2009 standings: a frame page with three sheet pages, of which only the first holds data, a table of 11 teams with time and tries for each of problems 1 to 9, the number solved and total time. The links to the 2007 and 2008 questions and standings lead outside the copy. The other pages are the department's own: faculty, programs, students, scholarships, news and contact pages, and several research PDFs.
