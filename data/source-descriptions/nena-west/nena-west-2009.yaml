  description: |-
    Rules and problem set as a PDF of 10 pages, in English. The first page names the contest (the Northeast Regional Preliminary Competition of the 2009-2010 ACM International Collegiate Programming Contest), SUNY Fredonia, Fredonia, NY, and October 17, 2009, and gives eleven rules with the day's schedule, the languages (C, C++ and Java) and the submission procedure. Nine problems follow, numbered 1 to 9 (Edit Step Ladders, Lexicon, Generating Strings of Balanced Parentheses, Modified Run Length Encoding (MRLE), Square Triangular Numbers, Getting to Second Base, Acyclic Graphs, Help Education Board, Farey Sequences), each with a statement and an example of input and output. No test data or solutions.
