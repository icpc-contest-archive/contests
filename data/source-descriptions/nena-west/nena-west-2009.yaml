  description: |-
    Standings of the 2009 Fredonia Preliminary Contest: 11 teams with rank, team, institution, problems solved, time and a citation (First Place to Fifth Place). The University of Rochester team YellowJackets is first with 6 solved and a time of 323, followed by RIT 1 with 5 and Hobart College's HWS-1 and SUNY Fredonia's Fredonia 2 tied for third with 2. Five teams have no problem solved. Ranks are shared by tied teams. There is no per-problem detail.
