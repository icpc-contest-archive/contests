  description: |-
    Website of the ACM-ICPC competition in Bolivia, in Spanish. Its front page shows the 2010 edition. For 2011 our copy holds twelve first-phase scoreboards, one per city (Chuquisaca, Cochabamba, El Alto, La Paz, Llallagua, Oruro, Pando, Potosí, Santa Cruz, Tarija, Trinidad, Yacuiba), with 179 team rows in all and problems A to G (A to H for Pando) with attempts and time per problem. Two further scoreboards for problems A to K list 59 and 63 teams with team name and university. All are produced by PC^2, with last-updated stamps from September to November 2011.

    The site also has pages of the 2006 to 2010 competitions, a page listing the 2012 host sites by city, rules, schedule, registration, committee, history, advice and books. Two zip archives named for 2011 hold problem material: contest-icpc-latam-2011.zip with a contest.pdf and folders of input and output files (34 entries), and ICPC-Bolivia-dataset-2011.zip with a problem set PDF, a warm-up PDF and folders of test input, output and solution files. Our copy holds 116 pages, several of them captured twice at different dates.
