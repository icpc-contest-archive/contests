  description: |-
    Website of the ACM-ICPC competition in Bolivia, in Spanish. Its front page in our copy shows the 2010 edition. The 2009 edition has a general-details page (hosted by UAGRM in Santa Cruz; first phase held in simultaneous contests in eight cities; more than 90 teams from more than 22 universities, as the page states) and a page listing 50 numbered teams qualified for the final, grouped by city or host university, with university and team name.

    The site also holds pages for the 2006 to 2010 competitions, with rules, schedule, registration, committee, history of the competition in Bolivia, advice, books and online judges. It has many PC^2 scoreboards, most for problems A to K, among them one last updated 24 October 2009, two last updated 23 October 2010, thirteen first-phase scoreboards of 2010, one last updated 5 November 2011, and results pages from 2006 and 2007. Our copy holds 125 pages, many of them captured twice at different dates, with images, style sheets and a qualification-statement form (PDF and text).
