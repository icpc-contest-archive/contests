  description: |-
    Message posted to the ACM ICPC Bolivia mailing list on 17 September 2012, in Spanish, announcing the teams qualified for the Latin American Final 2012. It states the criteria used (regular rules, invited teams at sites with free places, a second round by rank with at most two teams per institution) and lists 53 teams in ten departments, each with team name, university, number of problems solved (blank for one team) and a status: 31 Clasificado, 17 2da Ronda, 5 Invitado.

    The thread continues with replies about registration in the ICPC system, teams confirming their participation, and a link labelled as the final scoreboard of the second online repechage contest (a SPOJ ranking page). No times or per-problem results are given.
