  description: |-
    Website of ICPC Bolivia, the community that organises the Bolivian Programming Contest, as it stood for the 2026 edition. Our copy holds 84 pages in Spanish and English: 83 web pages and the rules PDF (4 pages). They cover the current edition with calendar and registration, a call for problems for National Phase 2, the twelve host sites (English pages for all twelve, Spanish pages for ten), a regional-host page, institutions, training resources, an about page, a gallery and a blog. One more saved page, from the icpc.global registration site, is an empty shell.

    Three results pages are inside. Phase 1 (29 August 2026 on the home page) has 226 team rows against 14 problems A to N, with attempts and minutes per cell, solved count and penalty. Phase 2 (19 September 2026) has 230 rows against 11 problems A to K: 223 teams ranked 1 to 223, then seven invited Cafe Con Leche teams ranked separately. A combined ranking lists 227 teams with solved and penalty per phase and a qualified-for-the-Regional column. Each phase also has a registered-teams page, and blog posts report both phases.

    The about page and blog index also mention the 2025 edition. Links to some institution pages, blog posts, the Spanish Sucre and Tupiza host pages and the English results pages lead to pages not in our copy.
