    Statement of problem 4767, "Machine Translation II", as a 3-page PDF in English. The first line gives the problem number and title and the second the region and season, "Asia - Harbin - 2009/2010"; the line "Harbin 2009-2010" follows the sample output and each page carries a label such as "4767 - Machine Translation II 1/3". It introduces statistical machine translation, n-gram language models and back-off smoothing, then asks for the logarithm of each given sentence's probability under the smoothed trigram model, to four decimal places. The input is a training corpus of trigram counts between <trainingdata> tags followed by sentences. It has Input and Output sections, a hint that the real data is larger than the sample, and a sample with three sentences.
