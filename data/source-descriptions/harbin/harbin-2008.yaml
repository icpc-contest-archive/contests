  language:
  - en
  problems: 1
  pages: 3
  description: |-
    Problem statement of 4319, Carrying Out A Task, as a three-page PDF in English with the line "Asia - Harbin - 2008/2009" under the title. A ship crosses a sea grid (up to 20 by 20) with reefs and undercurrents, using normal or accelerated moves that use B energy, and the task is to output the minimal number of actions, minimising damage first and A energy second, or "can not reach!". It has the input and output format and a sample of two grids with answers 8 and "can not reach!". It ends with the line "Harbin 2008-2009".
