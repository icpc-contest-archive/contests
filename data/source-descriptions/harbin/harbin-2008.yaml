  title: The 33rd ACM/ICPC Asia Harbin Regional Contest
  language:
  - zh
  - en
  teams: 110
  description: |-
    Final standings of the onsite contest: 110 teams with rank, school and team name in Chinese, team name in English, award, school rank, team id, number of problems solved and penalty time. The awards are 11 gold, 23 silver, 35 bronze and 41 honorable mention. The first two places are held by Tsinghua University, with 7 problems solved; the third place also has 7. The last 19 teams have no solved count or time. Four teams have school names starting with Z_.

    A menu on the left links to pages of other contests from 2008 to 2012, ten of them marked 缺失 (missing); those pages are not in our copy.
