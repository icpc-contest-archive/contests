  title: 4314 - Mining Station on the Sea
  language:
  - en
  problems: 1
  pages: 2
  description: |-
    Problem statement of 4314, Mining Station on the Sea, as a two-page PDF in English with the line "Asia - Harbin - 2008/2009" under the title. Given n vessels at mining stations, n ports and the distances between directly connected stations and ports, the task is to output the minimal total sailing distance when each port takes exactly one vessel. It has the input and output format (n up to 100, m up to 200) and one sample with output 13. It ends with the line "Harbin 2008-2009".
