  language:
  - en
  problems: 1
  pages: 2
  description: |-
    Problem statement of 4313, K-dimension number, as a two-page PDF in English with the line "Asia - Harbin - 2008/2009" under the title. A positive integer with exactly K divisors is called a K-dimension number, and for each pair n and K the task is to output the n-th K-dimension number. The statement opens with a story about a navigation training ship, then gives the definition, the input and output format and a sample with two cases. It ends with the line "Harbin 2008-2009".
