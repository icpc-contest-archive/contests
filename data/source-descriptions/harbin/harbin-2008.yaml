  title: 4315 - Gauss Elimination
  language:
  - en
  problems: 1
  pages: 2
  description: |-
    Problem statement of 4315, Gauss Elimination, as a two-page PDF in English with the line "Asia - Harbin - 2008/2009" under the title. For each system of n linear equations (n at most 100) the task is to print the solutions, as fractions when not integer, or "No solution.". The statement opens with a story about a freighter captain and Gauss, and has the input and output format and a sample of two systems, one with coefficients of 25 digits. It ends with the line "Harbin 2008-2009".
