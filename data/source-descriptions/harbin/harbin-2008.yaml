  title: 4317 - Simple Addition Expression
  language:
  - en
  problems: 1
  pages: 2
  description: |-
    Problem statement of 4317, Simple Addition Expression, as a two-page PDF in English with the line "Asia - Harbin - 2008/2009" under the title. An expression i + (i+1) + (i+2) is simple when adding it produces no carry in any position, and for each n the task is to count the simple expressions with i < n. It begins with a story about a yacht's computer, and has the input and output format and a sample of six values of n. It ends with the line "Harbin 2008-2009".
