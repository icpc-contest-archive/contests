  title: Welcome to hrbeu online judge
  language:
  - en
  - zh
  pages: 144
  description: |-
    Online judge of Harbin Engineering University (page title Welcome to hrbeu online judge), in English and Chinese. Our copy holds 150 files, 144 of them pages. Most of the pages are the judge itself: problem lists and problem sets, status and ranklist pages, 43 pages titled Online Contest for the judge's own contests, FAQ, registration, login and hall of fame. 37 pages are advertisements for pills placed in the blog upload folder of the same server.

    The contest list page names three online contests titled 2008 Asia Harbin Regional Contest Online (a main contest and two warm-ups); their own pages are not in our copy. One page is a results table of the onsite contest titled 第35届ACM-ICPC亚洲区预赛（哈尔滨）现场赛比赛结果 (results of the 35th ACM-ICPC Asia regional, Harbin, onsite contest), with school and team names in English and Chinese, solved, time and award; it is not the 2008 edition. Nothing in our copy is a site of the 2008 regional contest.
