  title: 4316 - Searching Treasure in Deep Sea
  language:
  - en
  problems: 1
  pages: 3
  description: |-
    Problem statement of 4316, Searching Treasure in Deep Sea, as a three-page PDF in English with the line "Asia - Harbin - 2008/2009" under the title. An underwater robot with 100 bullets and 100 body components moves through a ship of up to three floors given as character maps, fighting monsters with attack tactics that cost bullets and reduce monster life, and the task is to print Yes or No for whether it can reach the treasure place E. It has long rules, the input and output format and a sample of two cases with maps. It ends with the line "Harbin 2008-2009".
