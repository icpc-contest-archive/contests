  title: 4318 - Navy maneuvers
  language:
  - en
  problems: 1
  pages: 2
  description: |-
    Problem statement of 4318, Navy maneuvers, as a two-page PDF in English with the line "Asia - Harbin - 2008/2009" under the title. Two warships, Victory and Glory, take turns moving along the edges of a directed acyclic graph whose nodes carry positive integers, and the task is to print Victory or Glory depending on whether the path sum reaches f. It lists six rules of the maneuver, the input and output format (n below 10000) and a sample of two cases. It ends with the line "Harbin 2008-2009".
