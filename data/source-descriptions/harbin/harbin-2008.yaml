  description: |-
    Problem statement of 4320, Degree Sequence of Graph G, as a two-page PDF in English with the line "Asia - Harbin - 2008/2009" under the title. For each non-negative integer sequence (fewer than 1000 numbers) the task is to answer yes or no, whether it is the degree sequence of a simple graph. It opens with a story and a figure of a graph with six ports and nine routes, and has the input and output format and a sample of two cases. It ends with the line "Harbin 2008-2009".
