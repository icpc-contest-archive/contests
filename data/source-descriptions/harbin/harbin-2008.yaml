  title: 4321 - Dividing Sea Area to Navigation-Triangle
  language:
  - en
  problems: 1
  pages: 3
  description: |-
    Problem statement of 4321, Dividing Sea Area to Navigation-Triangle, as a three-page PDF in English with the line "Asia - Harbin - 2008/2009" under the title. A convex polygon of n islands (3 to 100) is divided into n-2 triangles, each with weight V = S + 2a + b using extra islet points, and the task is to print the smallest possible difference between the largest and smallest weight with two decimals. It includes a figure, the input and output format and a sample of two cases. It ends with the line "Harbin 2008-2009".
