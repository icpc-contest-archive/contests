  description: |-
    Problem statement of 4312, Shell Pyramid, as a two-page PDF in English with the line "Asia - Harbin - 2008/2009" under the title. Shells are stacked in a pyramid of layers, and for a serial number s (s < 2^63) the task is to print the layer, row and column of the s-th shell. It tells a story about a ship's captain, includes a figure of the layers, and has the input and output format and a sample with two cases. It ends with the line "Harbin 2008-2009".
