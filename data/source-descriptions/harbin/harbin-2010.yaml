  description: |-
    Scoreboard page in Chinese titled "2010 哈尔滨赛区现场赛 - Ranklist" (2010 Harbin regional on-site contest), with the page heading "ICPC 2010 哈尔滨赛区现场赛 排行榜" (rankings of the 2010 Harbin regional on-site contest). It holds two tables. The first, headed "最终排行 TOP 26" (zuìzhōng páiháng, "final ranking, top 26"), lists 26 teams with rank, name, and for each of problems A to J the number of attempts and a Y or N for solved, plus a total of attempts and problems solved. The second, headed "封榜时全榜" (fēngbǎng shí quánbǎng, "full board at the time of the freeze"), lists 126 teams with rank, name, solved count, penalty time, and per problem two numbers separated by a slash, the second being "--" when unsolved, with a row of colour names (Yellow, Red, Green and so on) above the problem columns and a bottom row of submitted, first-yes and total-yes figures per problem; a line above it reads "Last updated Sun Sep 26 13:12:57 CST 2010". Team names combine university and team name, and two names begin with three asterisks, which the page does not explain. The top of the frozen board is Tsinghua University with 8 solved; the top of the final table is Wuhan University with 10 solved. A side menu links to the ranklists of other Chinese regional contests from 2008 to 2012, some marked as missing.
