    Single problem statement, a PDF of 2 pages, titled "5091 - Power Stations" with the region line "Asia - Harbin - 2010/2011". Towns with power stations, each with an available time range, are joined by cables, and every town must receive power from exactly one station on each of the next D days; the task is to output a working schedule for each station, or "No solution". It has Input and Output sections, notes that any correct answer is accepted, and has a sample of two cases. The line "Harbin 2010-2011" follows the sample output. No problem letter is printed.
