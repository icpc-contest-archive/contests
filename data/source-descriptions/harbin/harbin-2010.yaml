  description: |-
    Ranklist page for the Harbin on-site contest, in Chinese, on a site whose menu lists ranklist pages for contests held in China from 2008 to 2012, some marked as missing. It has two tables. The first, headed final ranking TOP 26 (最终排行 TOP 26), lists the top 26 teams with, for each of problems A to J, the number of attempts and Y or N for solved or not, and a total of attempts and problems solved; it has no times. The first place is Wuhan University with ten problems.

    The second, headed 封榜时全榜 (full ranklist at the freeze) and marked as last updated on 26 September 2010 at 13:12:57, lists 126 teams as institution-team name with problems solved, penalty time, and attempts/time for each of A to J, with a colour name above each problem column. Two team names are prefixed with three asterisks. A last row gives submitted, first-yes and total-yes counts per problem. In this table Tsinghua University's DivineRapier is first, so its order differs from the final top 26.
