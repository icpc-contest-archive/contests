    Single problem statement, a PDF of 2 pages, titled "5088 - Alice and Bob's Trip" with the region line "Asia - Harbin - 2010/2011". Alice (who wants a short total distance) and Bob (who wants a long one) take turns choosing edges down a tree of spots from the root, Bob first, with the total required to lie within [L, R]; the task is to print the most Bob can get, or "Oh, my god!" when the total is not within [L, R]. It has Input and Output sections and a sample of four cases. The line "Harbin 2010-2011" follows the sample output. No problem letter is printed.
