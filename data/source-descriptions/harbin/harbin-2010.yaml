    Single problem statement, a PDF of 1 page, titled "5092 - Permutation Counting" with the region line "Asia - Harbin - 2010/2011". The E-value of a permutation is the number of positions where ai is greater than i; the task is to count the permutations of 1 to N with E-value exactly k, modulo 1,000,000,007. It has Input and Output sections, an explanation of the sample, and a sample of two cases (outputs 1 and 4). The line "Harbin 2010-2011" follows the sample output. No problem letter is printed.
