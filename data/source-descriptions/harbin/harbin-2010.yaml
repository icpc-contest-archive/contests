  title: 第35届ACM/ICPC亚洲区预赛（哈尔滨）官方网站
  title_en: Official website of the 35th ACM/ICPC Asia Regional Contest (Harbin)
  language:
  - zh
  - en
  contest_date: '2010-09-26'
  description: |-
    Website of the Harbin site of the Asia regional contest, in Chinese, run as a WordPress blog by the ACM/ICPC team of Harbin Engineering University. Our copy holds 25 pages: the front page and the monthly archives for August and September 2010, one page per post, and an About page. The posts cover the contest rules (five hours, three people per team, C, C++ and Java, 20 minutes penalty per wrong run), a draft schedule from 24 to 26 September 2010 with the contest itself on 26 September from 09:00 to 14:00, registration for the online preliminary round, hotel and internet information, directions from the Harbin railway station, the software environment, account information, a note on teams still pending, and the final allocation of slots to 80 universities.

    The post of 26 September 2010 holds the final results: 126 teams with rank, university, team name, problems solved, time and an award (gold, silver, bronze or honorable mention); two team names end in three asterisks. The post ends with a line saying the full ranklist would be posted after it was exported from the database. The sidebar names IBM and Alibaba as sponsors and links the organizing committees and the university's online judge.
