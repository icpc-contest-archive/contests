  description: |-
    Organisers' page of the first phase of the 2016 Maratona de Programação, in Portuguese. It reports 779 registered teams from 231 schools, 789 participating teams when the CCL teams are counted, and the judging committee. It links the warm-up and contest problem PDFs, their information sheets, test data and BOCA packages, the judges' solutions, and the final scoreboard, run list, clarification list and statistics of the first phase.

    It explains the three rules for the places in the final and gives tables of the sites that reached the threshold of 10 teams and 5 schools and of the sites grouped into seven supersites (Amazonas, Minas Gerais, Rio Grande do Sul, São Paulo, Centro-Oeste, Nordeste, Norte), with the places by rule, a results link for each of the 49 sites (25 that reached the threshold and 24 in the supersites) and the names of the qualified teams. It ends with the criteria for the places given by the committee. It is a list of qualified teams, not a ranking of all teams.
