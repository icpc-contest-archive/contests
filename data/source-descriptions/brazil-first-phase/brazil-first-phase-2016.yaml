  contest_date: '2016-09-10'
  description: |-
    Website of the 2016 Maratona de Programação, in Portuguese, organised by the Sociedade Brasileira de Computação. The front page gives the first phase as 10 September 2016 (779 teams from 231 schools in 49 sites, all judged centrally for the first time) and the Brazilian final as 11 and 12 November 2016 in Belo Horizonte. It lists the authors of the problems of the warm-up (A to C) and of the contest, names the winning team, lists the gold, silver and bronze medal teams, and reports the Brazilian teams at the World Finals in Rapid City.

    Our copy holds 44 files, of which 15 are pages: the front page, the first-phase page with the rules for the places in the final, PDFs of the warm-up and contest problems with their information sheets, and BOCA reports of the Brazilian final (a final scoreboard of 72 teams, 58 in the Brasil group and 14 marked CCL, with problems A to D and F to K; statistics; a clarification list; a run list; a one-page scoreboard of the 14 CCL teams). The first clarification tells contestants to disregard problem E because no solutions can be submitted for it. The rest is 25 images and four zip files of test data and BOCA packages.

    The judges' solutions and the site results linked from the first-phase page are not in our copy.
