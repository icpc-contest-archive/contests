    Problem list on the Baekjoon Online Judge for the first phase of the 2017 Maratona de Programação, filed under ICPC, Regionals, Latin America with the source "Sub-Regional Brasil do ACM ICPC". The table has 13 problems labelled A to M, Baekjoon problem numbers 15039 to 15051, with Portuguese titles from "Acordes intergaláticos" to "Máquina de café" and, for each, the number of users who solved it, the number of submissions and the acceptance percentage.

