    Problem booklet ("Caderno de Problemas") of the Maratona de Programação da SBC 2017, Sub-Regional Brasil do ACM ICPC, dated 9 September 2017: a PDF of 19 pages in Portuguese. After the cover come general information on file names and input and output conventions, then 13 problems labelled A to M, from "Acordes intergaláticos" to "Máquina de café".

    Each problem has a statement with input and output format and between two and five numbered sample inputs with their outputs. No test data or solutions.
