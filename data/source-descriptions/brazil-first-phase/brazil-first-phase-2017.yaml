  description: |-
    Final scoreboard of the Maratona da SBC - Brasil as shown by BOCA: 837 teams, each with a user/site id, the name column giving the institution in brackets and the team name, then one column for each of the 13 problems A to M giving tries and time (for example 1/70; an unsolved problem with attempts shows tries and a dash), and the number solved with total penalty time in brackets. The first place is a USP team with 13 solved; 88 teams solved nothing.

    Sixty teams have [CCL] in their name and ids beginning teamccl (for example "Café com Leite Belo Horizonte 7"); they are ranked in the same table as the others. The page opens with a line of score-view and site codes under "Available scores". Every team appears in two or three rows (the table has 1,924 rows for the 837 teams); the first row of each team carries its rank 1 to 837 and the repeated rows repeat its data, nearly always with a different leading rank number.
