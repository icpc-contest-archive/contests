  title: XXII Maratona de Programação
  title_en: 22nd Programming Marathon
  language:
  - pt
  - en
  contest_date: '2017-09-09'
  description: |-
    Website of the XXII Maratona de Programação, organised by the Sociedade Brasileira de Computação, in Portuguese with some English. The front page states that the first phase was held on 9 September 2017 with 816 teams officially taking part from 232 schools at 51 sites, plus "café com leite" teams outside the competition, 837 teams in all. It also covers the Brazilian final of 10 and 11 November 2017 in Foz do Iguaçu with 72 teams, the medal winners, the regional champions, the Brazilian ICPC Summer School 2018 and the universities qualified for the World Finals in Beijing.

    Our copy holds 37 files, 26 of them pages: the front page, the page of places for the Brazilian final, eight PDFs and sixteen server directory listings of problem folders, plus ten photographs and a zip archive of warm-up test files. The PDFs are a warm-up problem set of 3 problems, a contest problem set of 13 problems, their time limits, an information sheet, a 40-page slide presentation on the problems, a scoreboard headed BOCA LATAM ACM ICPC November 2017 and a one-page statement on incidents.

    The two problem sets and the time-limit sheets name themselves the Latin American Regional Contests of 10 and 11 November 2017, so they are not those of the 9 September first phase. The first-phase problem booklet and scoreboards are linked from the first-phase page but are not part of this copy.
