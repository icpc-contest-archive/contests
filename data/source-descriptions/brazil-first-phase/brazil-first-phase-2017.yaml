  title: Vagas para a final brasileira
  title_en: Places for the Brazilian final
  language:
  - pt
  contest_date: '2017-09-09'
  description: |-
    First-phase page of the XXII Maratona de Programação, headed "Vagas para a final brasileira" (places for the Brazilian final), in Portuguese. It states that 816 teams from 232 schools registered, that 51 sites took part on 9 September 2017 with additional "café com leite" teams, 837 teams in all, and names the team of judges and their universities. It links the warm-up and contest problem PDFs, the input and output files, the final scoreboard, the run list, the clarification list and the statistics.

    It explains the three kinds of places (about 25% for the best performance, about 65% by site size, about 10% by the steering committee) and the rule that a site needs at least 10 teams and 5 schools. Tables then list, for each site, the places under each rule and the qualified teams with a link to the site's results: one table of 23 sites that reached the threshold, totalling 51 places, and eight tables for groups of smaller sites (Bahia, Ceará, Piauí, Rio Grande do Sul, São Paulo, Nordeste, Norte, Brasil).
