  title: XXVII Maratona de Programação
  language:
  - pt
  contest_date: '2022-10-08'
  description: |-
    Page of the organisers for the first phase of the XXVII Maratona de Programação, in Portuguese. It states that the first phase took place on 8 October 2022 at 42 sites in Brazil, with 556 teams from 170 Brazilian institutions, and that the same contest ran at the same time in Argentina, Bolivia, Central America and Mexico. It lists the 14 problems A to N by title, and links the information sheet and the problems in Portuguese, Spanish and English, the input and output files, and for the main contest and for a side contest called café com leite the final scoreboard, submissions, clarifications and statistics.

    Seven tables give the places for the Brazilian final by site: one for the sites that reached the threshold of 10 teams and 5 schools, and six headed Supersede, for (Minas Gerais, Centro-Oeste, Nordeste, Norte, Sudeste, Brasil). Each row gives a site (state abbreviation and city), its places under rules 1 to 3 where it has any, and its qualified teams, each with the institution in brackets. Notes explain a team that was not qualified, a disqualified team, and a new first-phase contest held online on 19 November for the Vitória site after a power failure. The page also links the information sheet, problems, input and output files and scoreboard of the Vitória contest. The linked files are separate documents.
