  language:
  - en
  problems: 14
  description: |-
    Codeforces gym dashboard of the 2022-2023 ICPC Brazil Subregional Programming Contest, marked Finished. It lists 14 problems A to N, from Finding Maximal Non-Trivial Monotones to Numbers on both Sides, each with its time limit (0.25 to 15 seconds), a memory limit of 1024 MB and a count of the form x2510 beside it. The about section says the problem set was used in simultaneous contests: the Maratona SBC de Programação 2022, the Tercera Fecha Gran Premio de México 2022, the Gran Premio de Centroamérica 2022, the Torneo Argentino de Programación 2022 and The 2022 ICPC Bolivia Preliminary Contest.

    It points to final results and the original problem set on another site, and links Official Results and statements in Portuguese, English and Spanish as contest materials. Those files and the problem statements are not in our copy.
