  description: |-
    Problem set booklet (Caderno de Problemas) in Portuguese, 20 pages. The cover names the Maratona de Programação da SBC 2022, Sub-Regional Brasil do ICPC, and the date 8 October 2022. The cover page also carries general information on program file names, input and output; the 14 problems A to N follow from page 2, each with a statement, input and output specification and at least one sample.

    The cover says the same problem set was used at the same time in the Tercera Fecha Gran Premio de México 2022, the Gran Premio de Centroamérica 2022, the Torneo Argentino de Programación 2022 and The 2022 ICPC Bolivia Preliminary Contest.
