    Final scoreboard produced by BOCA headed Brazilian Sub-Regional 2022 - Extra Vitória Site. 12 teams, ten from UFES (including its Ceunes and Alegre campuses) and two from IFES, are ranked 1 to 12, with the user and site code, institution and team name, 12 problems A to L, and a total of problems solved with penalty time in parentheses. A problem cell shows attempts and minutes; tried but unsolved problems show a dash. The best team solved 6 problems and all 12 teams solved at least one.

    The page has the Global, Brasil and site views, so every team appears three times in the table. It links the information sheet and the problem set (Portuguese), the BOCA problem packages and the runs, tasks, clarifications and statistics pages; those links lead outside our copy.
