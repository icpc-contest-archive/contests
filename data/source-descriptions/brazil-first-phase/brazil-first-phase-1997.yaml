  description: |-
    History page of the Maratona de Programação in Portuguese, section 1997 - II Consun, Campinas, dated 12 to 14 December 1997. It names the three best Brazilian teams (PUC-RJ, UFPE, FURG) with their members and coaches, and says that the PUC-Rio team was the only Brazilian and South American team qualified for the ICPC World Finals, held on 28 February 1998 in Atlanta, where it placed 24th and was given the title of Latin American champion. Links lead to the final classification, the warm-up session problems, the contest problems and the 1998 World Finals standings.

    Our copy holds two pages (this one and the final classification), the two PostScript problem files, one warm-up session of 9 pages with four problems A to D and the contest session of 15 pages with six problems, and one GIF image. The link to the World Finals standings leads outside our copy.
