  language:
  - pt
  contest_date: '2020-11-14'
  description: |-
    First-phase page of the XXV Maratona de Programação, in Portuguese, published by the organisers. It gives the schedule (warm-up on 7 November, first phase on 14 November, 14:00 to 19:00), says 799 teams from 196 schools were accepted, and lists the people who took part in preparing the problems. It lists the authors of problems A to O, four teams disqualified for breaking the code of conduct, and the prizes of the sponsors SAP, B2W and VTEX with the first three teams of each of the five regions.

    Four tables by site follow, each with columns headed rule 1, rule 2 and rule 3 and the teams that qualified for the Brazilian Final: one for the 14 sites that reached the threshold of 10 teams and 5 schools, and three headed as superseding Centro-Oeste (1 place), Nordeste (2) and Norte (2) for the sites that did not. A note says the contest could not be held in Amapá because of a power outage. The page links the warm-up and contest problems, an editorial, test data, and four BOCA reports (final scoreboard, submissions, clarifications, statistics). Our copy is this page only; the linked files are separate sources.
