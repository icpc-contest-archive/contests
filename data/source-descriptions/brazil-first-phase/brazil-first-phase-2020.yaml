  description: |-
    Final scoreboard of the first phase for Brazil, produced by the BOCA contest system (boca-1.5.14): 760 teams ranked from 1, each with a user name, the school in brackets and the team name. It has one column for each of the 15 problems, A to O, giving tries and the time of the accepted run (for example 1/58), or tries and a dash when unsolved, and a total of problems solved with penalty time in brackets. First place is [UNICAMP] namae wa?? with 10 problems solved; 79 teams have none solved.

    The same table also holds each team's row again in the views of its state and, for many teams, of its region, each row carrying the rank within that view (1607 rows in all, every team two or three times). The header names these views: 27 state codes and three regions.
