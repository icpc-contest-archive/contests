  description: |-
    Problem book of the Brazilian sub-regional contest, in Portuguese: a PDF of 26 pages with a cover (contest name, 14 November 2020, "Caderno de Problemas"), general information on file names, input and output, and 15 problems, A to O, from Álbum de Figurinhas to Ônibus Venusiano. The general information names the simultaneous contests that used the set: Gran Premio de México (Segunda Fecha), Gran Premio de Centroamérica (Primera Fecha) and Torneo Argentino de Programación. Each problem has a statement with input and output sections and one to four input and output examples.

    No test data or solutions are in the file.
