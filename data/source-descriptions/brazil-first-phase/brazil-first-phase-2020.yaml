  title: XXV Maratona de Programação
  language:
  - pt
  - en
  contest_date: '2020-11-14'
  description: |-
    Website of the XXV Maratona SBC de Programação 2020, in Portuguese, built around the edition page. It states that the first phase took place on 14 November 2020 at 27 online state sites with 799 teams from 196 schools, and that the Brazilian Final was held online on 9 and 10 July with sponsors named. The edition page lists the warm-up and contest problems of the Final (3 and 14 problems, with the setter of each and, for the contest problems, the setter's country), the champion, gold, silver and bronze medal teams, regional champions, special prizes, the Brazilian ICPC Summer School, and the world final in Dhaka with the five Brazilian teams that qualified.

    Our copy holds 28 files from 30 addresses: the edition page, the first-phase page (schedule, jury, problem authors and qualified teams per site), four images, a PDF of the Final's opening slides (21 pages), the warm-up and contest problem books (8 and 30 pages), information sheets and time limits, and 15 zip packages of problems (3 for the warm-up, 12 for the contest). The packages for contest problems K and N, a further PDF of Latin American results, the team photos and the pages of the Final's BOCA reports were not captured, nor were the first-phase PDFs, test data and reports that the first-phase page links. The site's style sheet and two scripts are missing from our copy.
