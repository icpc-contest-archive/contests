  contest_date: '2024-08-31'
  description: |-
    Website of the Maratona SBC de Programação 2024 (heading XXIX Maratona de Programação - 2024), in Portuguese, covering the whole 2024 competition and not the first phase alone. Our copy holds 36 files, 14 of them pages. The front page has sections for the Fase Zero (online, May 2024), the first phase of 31 August 2024 (48 sites, 880 teams from 226 schools), the Brazilian final in João Pessoa, the Brazilian ICPC Summer School, the 2024/25 ICPC Latin America Championship in Salvador and the 2024/25 World Finals in Baku, so it also reports events held in 2025.

    Inside our copy: the Fase Zero page; the first phase page with the teams qualified per site; and, for the Brazilian final, the warmup and contest problem sets (PDFs of 8 and 19 pages, in English, headed ICPC Latin American Regional Contests 2024), an information sheet in English, one-page time limit lists, a 14-page PDF of solution sketches linked as the editorial, a package archive for the warmup, and the BOCA pages of the Brazilian final (scoreboard, runs, tasks, clarifications, statistics). It also holds 21 image files.

    Not in our copy: the first phase scoreboards and problem set, the opening slides, the contest package archive, the scoreboard of the Café com leite side competition and many of the photos and graphics.
