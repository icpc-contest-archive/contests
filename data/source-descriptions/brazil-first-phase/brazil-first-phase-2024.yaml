    Final scoreboard produced by BOCA for The 2024 ICPC South America/Brazil First Phase, a board shared by the simultaneous contests in Brazil, Bolivia, Mexico and Central America. The overall view lists 1473 distinct teams, each with a user/site id ending in /BR, /MX, /BO, /CR, /GT or /SV, the institution in brackets with the team name, twelve problem columns A to L showing attempts and the minute of the accepted run, and a total of problems solved with the penalty time in brackets. Teams of the Café com Leite side competition are in the same list; 37 team names carry the mark [CCL].

    Each team appears from three to six times in the table, once in the overall view and again in the views of its country, region and site. The page header links the information sheets and problem sets (English and Portuguese) for the warmup and the contest, and the BOCA packages; those files are separate.
