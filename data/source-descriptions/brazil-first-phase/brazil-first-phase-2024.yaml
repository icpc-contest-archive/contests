  description: |-
    Problem booklet (Caderno de Problemas) in Portuguese: a PDF of 17 pages. The cover names the Maratona de Programação da SBC 2024, Sub-Regional Brasil do ICPC, and gives 31 August 2024 as the date. The same first page carries general information on program names, input and output, and states that the booklet holds 12 problems and that the set was used at the same time in the Gran Premio de Centroamérica, the Gran Premio de México and the Competencia Boliviana de Programación, all 2024.

    Twelve problems A to L follow, each with a statement, input and output format and sample cases; six of them (A, C, E, H, I, J) have explanations of the samples. No test data or solutions.
