  description: |-
    Page of the first phase of the 2024 Maratona SBC de Programação, in Portuguese, with no title of its own. It states that the competition ran at the same time in Bolivia (292 teams), Mexico (541 teams) and Central America (80 teams), names the judging team, and lists the warmup and contest links (information sheets and problem sets in Portuguese and English, and the input and output packages). It gives the authors of problems A to L under their Portuguese titles and links to the final scoreboard, the list of submissions, the clarifications and the statistics.

    It also covers an online side competition, Café com leite, with 27 teams, with its own scoreboard link and its first three places. Tables list the teams qualified for the Brazilian final site by site, with columns for rules 1 to 4, under headings that give the number of slots of each regional or state group; a closing paragraph says how the committee used its three extra slots. The page has no images; the linked files are not part of it.
