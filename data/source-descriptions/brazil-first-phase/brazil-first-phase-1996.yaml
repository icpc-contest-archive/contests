  description: |-
    Announcement page in Portuguese for the I CONSUN, a Brazilian university software event with two parts: a software competition (best software, best multimedia package) and a programming contest for student teams. It gives the objectives, the target public (Brazilian undergraduate and graduate students), registration from 15/09/96 to 04/10/96, judging from 07/10/96 to 08/11/96, the programming contest on 28 and 29/11/96 with results and awards on 02/12/96 at DCC-UFMG, the organising committee, the organisers (DCC-UFMG, IC-UNICAMP, SOFTEX 2000), sponsors (CNPq, Microsoft, Engetron, Squadra) and supporters (SBC, FUMSOFT, POP/MG, FINEP).

    Our copy holds this one page and its logo image. The links to the rules pages lead to pages that are not in our copy.
