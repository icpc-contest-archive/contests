  description: |-
    History page of the Maratona de Programação in Portuguese, section 1996 - I Consun, Belo Horizonte. It reports that the first Maratona was held at the Federal University of Minas Gerais on 28 and 29 November 1996 with results on 2 December, names the organising committee, says the event was not an official ICPC regional but its winner was invited to the 1997 ICPC World Finals, and that the contest had six problems and was run without support software, with diskettes carried between teams and judges.

    The results table lists 11 universities with problems solved, penalty and, for problems A to F, the number of submissions followed by a slash and 1 if a correct submission was made, 0 if not. Unicamp is first with 3 solved and a penalty of 702; the last five universities solved none. The page lists the members and coach of each of the top three teams, says that the Unicamp team was invited to the World Finals, links to the problem set and to the announcement page, and ends with a last-modified date of 2021.
