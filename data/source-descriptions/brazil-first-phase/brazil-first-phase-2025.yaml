  description: |-
    Website of the 2025 Maratona SBC de Programação, the Brazilian programming marathon of the Sociedade Brasileira de Computação (SBC), in Portuguese. The front page has one section per stage of the season: the Fase Zero held online in May 2025, the first phase of 13 September 2025, the Brazilian final in São Paulo on 6 to 9 November 2025 (66 teams), the Brazilian ICPC Summer School of January 2026, the ICPC Latin America Championship in Santiago, Chile, in March 2026 (44 teams, 12 of them Brazilian) and the ICPC World Finals in Dubai in November 2026. The page states that the first phase was held at 53 sites in Brazil with 1025 teams from 239 schools.

    Our copy holds 84 files, 25 of them pages (HTML or PDF). For the first phase it has the results page with the places for the Brazilian final, the judges' editorial, the warm-up and contest information sheets and problem sets in Portuguese and English, and the BOCA final scoreboard with its list of runs, clarifications and statistics. It also has the Fase Zero and Brazilian final pages and the Latin America regional documents of 7 and 8 November 2025: warm-up and contest problem sets, information sheet, time limits and score pages.

    The BOCA package archives and the PDF of the Brazilian final are not in our copy. Links to the Summer School site and to other sites lead outside it.
