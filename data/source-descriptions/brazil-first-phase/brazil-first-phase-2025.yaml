  description: |-
    Problem set in Portuguese, a PDF of 21 pages: a cover naming the Maratona de Programação da SBC 2025, the ICPC Brazil Sub-Regional and the date 13 September 2025, a general information page, then 13 problems A to M. The general page says the set was used at the same time in the Gran Premio de Centroamerica, the Gran Premio de Mexico and the Bolivian programming competition, and explains file naming, input and output rules.

    Every problem has a statement with input and output format and at least one sample input and output; problem A is "Alimentação saudável" and problem M "Muralhas reforçadas". Time limits are not in the document; it says they are given in the BOCA system. No test data or solutions.
