    Page of the Maratona SBC de Programação for its first phase of 13 September 2025, in Portuguese. It states that the contest ran at 53 sites in Brazil and at the same time in Bolivia (197 teams), Mexico (265 teams) and Central America (26 teams), lists the authors of problems A to M, and reports the online "café com leite" competition and its winning team. Links lead to the judges' editorial, the warm-up and contest information sheets and problem sets (Portuguese and English), the test data packages, the final scoreboard, the list of runs, the list of clarifications, the statistics and a photo album.

    The second half holds tables of places in the Brazilian final, one table per group of sites and one row per site, with columns Rule 1 to Rule 4 and the qualified teams, followed by the places given to the regions and to Brazil. The page ends with "Last modified" 21 January 2026. The documents it links to are separate files and are not part of this page.
