    Final scoreboard produced by BOCA for The 2025 ICPC South America/Brazil First Phase: a table with rank, a User/Site column (for example teambrdfdf010/BR), team name with the institution in brackets, one column per problem A to M, and a total of problems solved with penalty time in parentheses. Each problem cell gives attempts and time, for example 1/15.

    The page holds 1514 distinct teams, with the country codes BR, MX, BO, CR, SV, DO and GT, mixed in one document. Of these, 42 have ccl in their user id: they are teams of the online "café com leite" competition, 34 of which also carry [CCL] in the team name. The same teams recur in several overlapping views listed under "Available scores" (Brazil, regions, sites, Bolivia, Central America, Mexico, café com leite, Global, Global+CCL), each with its own ranking, so 7268 rows repeat the 1514 teams and ranks run up to 1514.

    Menu links lead to the runs, tasks, clarifications and statistics pages, the information sheets and problem sets in Portuguese and English and the BOCA packages. Our copy keeps the page's images and style sheets.
