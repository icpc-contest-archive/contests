  description: |-
    Final scoreboard of one site, produced by BOCA (Maratona de Programação - Site): 18 teams, with problems A to K as columns. Each team has a login, a name, a cell per problem giving number of attempts and the time of the accepted run (or attempts and a dash when unsolved), and a total of problems solved with penalty time in brackets. Seventeen of the 18 team names begin with the school in brackets (UFPEL, FURG or FATEC); one has no school. First place is Haus of Code with 4 problems solved (350).

    The page offers two views, General and Site_1, and in our copy every team row appears twice, once for each view. Only this site is on the page, not the whole first phase.
