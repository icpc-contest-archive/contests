  description: |-
    Website of the 2014 Maratona de Programação, in Portuguese, giving the first phase as 13 September 2014 and the Brazilian final as 7 and 8 November 2014. The front page reports 643 teams from 199 schools in 41 sites in the first phase, lists the authors of the problems of a warm-up (problems A to C) and a contest (problems A to K), names the winning team, lists the gold, silver and bronze medal teams, and reports the Brazilian teams at the 2015 World Finals.

    Our copy holds 6 pages and 14 images. Besides the front page there is the first-phase page with the Brazilian problems, the contest problem booklet as a PDF of 16 pages with problems A to K, headed ICPC Latin American Regional 2014, and the warm-up booklet as a PDF of 5 pages with three problems, and two directory listings of zip files with the test data for the warm-up (3 files) and the contest (11 files). The links to the final scoreboard, statistics, clarifications and run list of the final, and some team photographs, lead to files that are not in our copy.
