  description: |-
    Organisers' page of the first phase of the 2014 Maratona de Programação, in Portuguese. It gives the date of 13 September 2014, 643 teams from 199 schools in 41 sites, and the authors of the problems: a warm-up with three problems A to C and a contest with eleven problems A to K, each with a link to a zip of input and output files, plus links to the warm-up and contest PDFs.

    It explains the three rules for the final's places (best first-phase results, size of the site, and places given by the committee) and holds a table of 43 sites with their places by rule, a results link for 41 of them and the names of the teams that qualified for the Brazilian final. It is a list of qualified teams, not a ranking of all teams.
