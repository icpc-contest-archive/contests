  - en
  contest_date: '2008-09-20'
  description: |-
    Website of the 2008 Maratona de Programação (the XIII edition, Sub-Regional Brasil do ACM ICPC), run by the Sociedade Brasileira de Computação with the Fundação Carlos Chagas, in Portuguese. The front page gives the first phase as 20 September 2008 and the Brazilian final as 14 and 15 November 2008 in Vila Velha, Espírito Santo. It reports 360 teams from 129 schools at 40 sites in the first phase and 51 teams qualified for the final, names the champion and medal teams and the six institutions that went to the World Finals, and has team photographs and links to the final scoreboard and photo galleries.

    The first-phase page has a table of 40 sites with their slots for the final, the qualified teams and a link to each site's results. Our copy holds the results of 35 sites (18 HTML pages, 7 PDFs, 7 images, a text file, a Word file and a spreadsheet); five linked result addresses are not in our copy. It also holds the warm-up (2 problems) and main problem set (10 problems) as Portuguese PDFs, two directory listings of the judges' input and output files (13 of those files are in our copy) and a page naming the problem committee.

    For the final it has a BOCA scoreboard of 47 teams with problems A to K, English problem sets of the warm-up (2 problems) and contest session (11 problems), and a 1.7 MB zip of test data. Our copy holds 47 pages and 103 files in all.
