  description: |-
    Page of the Maratona's site for the first phase of 2008, in Portuguese, headed Resultados da primeira fase e vagas para a final (first-phase results and slots for the final). It links the warm-up and main problem sets with the judges' input and output files and lists the problem authors. The main part is a table with one row per site, with the slots won under the two qualification rules and the teams that qualified, each row linking that site's results, and for some sites photos or a news report. A total row and notes follow: three sites with no registered teams were cancelled, sites below the minimum of 6 teams and 3 schools were grouped as one site with 7 slots, a school may qualify at most two teams, and a team must solve more than one problem. It gives no ranking of all teams.
