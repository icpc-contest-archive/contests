  description: |-
    Open final scoreboard with the contest's information, produced by MOJ for The 2026 ICPC South America Brazil First Phase. The header gives the start 2026-08-29 14:00, the end 19:00, a duration of 5h00, ICPC mode, a penalty of 20 minutes per rejected attempt, a freeze at 240 minutes, 15957 submissions and "Teams 2010". The scoreboard is not frozen; a separate frozen view is linked.

    The table has 2009 team rows with rank, flag, team name with institution in brackets, attempts and time for each of the problems A to N, total solved and penalty. Of these rows, 33 are marked "guest" and carry no rank (26 of them café com leite teams), and the last row is a test team named "[ICPC] Test 1". Above the table are filters for flag, university and site. Teams that qualified for the Brazilian final carry a "Final BR" mark with the site and rule (61 teams); 14 cells carry a star. Of the 2009 rows, 451 have no problem solved.

    Above the table are links to the problem set, the testing environment sheet and the time limits as PDFs in English and Portuguese, and a table of the 14 problems A to N with Portuguese titles, authors and links to HTML statements. The runs, clarifications and statistics pages are linked and are not in this file.
