    Our copy holds 100 files, 97 of them HTML pages: the album's pages of thumbnails, 50 pages of single photos (each with a file name as title, an upload date and a view count) and Flickr's general pages. The photographs and videos themselves are not in our copy, so the pages show only their file names. The album has no text about the contest beyond its title and description.
