  description: |-
    Page of the Maratona de Programação SBC for the first phase of 2026, in Portuguese. It opens with a table of the 54 host sites (site, venue, local director, contact) and a link to a map. The results section states that the phase was held on 29 August 2026 at 54 sites (two had no registered teams) in 26 states, with 965 registered teams from 233 schools, and that the contest ran at the same time in Bolivia (227 teams), Central America (120) and Mexico (670). It names the sponsors, lists the authors of problems A to N and reports the online "café com leite" competition and its winning team.

    Links lead to the information sheet, problems and time limits in Portuguese and English, the input and output files, the final scoreboard, the runs, clarifications and statistics, and the photo album. The last part holds tables of the teams that qualified for the Brazilian final, per site with Rule 1 to Rule 4, and the extra places given by state, by region and for Brazil. The heading "Resultados da Final Brasileira" at the end has no content in our copy. These linked documents are separate files.
