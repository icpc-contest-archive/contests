  description: |-
    Scoreboard of the "Brazilian Sub-Regional 2021", produced by BOCA: 767 distinct teams, with columns for user and site (for example teamarac7/AR), team name with the institution in brackets, the 14 problems A to N, and a total of problems solved with penalty in brackets. Each problem cell shows attempts and time, as in "2/238"; a cell such as "1/-" shows attempts without a solve. The leaders solved 11 problems, and teams at the bottom have 0 solved.

    The page header links to the score, runs, tasks, clarifications and statistics pages, to information sheets and problem sets in English, Portuguese and Spanish, and to a packages archive; none of those is in our copy. The list of available scores covers Global, Argentina with its sites, Brasil with its states, Central America and Mexico with a list of universities and other groups. Our copy holds all the listings in one table of 2402 team rows, so most teams appear three times, each with its own rank (global ranks run 1 to 767).
