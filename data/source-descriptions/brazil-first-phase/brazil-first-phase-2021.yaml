  description: |-
    Page of the organisers for the first phase of the XXVI Maratona de Programação, in Portuguese. It states that the first phase took place on 30 October 2021, fully online, with 534 teams from 127 Brazilian institutions, lists the people who took part in preparing the contest, and links to the information sheet, the problem PDF, the input and output files of the problems, and the final scoreboard, list of submissions, list of questions and statistics of the Brazilian board. It names the 14 problems A to N in Portuguese.

    Five tables show the places for the Brazilian final by site: states that reached the threshold of 10 teams and 5 schools, then four tables headed Supersede Centro-Oeste, Nordeste, Norte and Brasil. Each row gives a site (a state), its places under rules 1 to 3 where it has any, and the names of its qualified teams, each with the institution in brackets. A closing note says how the remaining places were allotted. There are no team rankings with solved counts; the linked files are separate documents.
