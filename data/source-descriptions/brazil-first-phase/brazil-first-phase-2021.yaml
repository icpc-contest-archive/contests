  description: |-
    Codeforces gym dashboard of the 2021-2022 ACM-ICPC Brazil Subregional Programming Contest, marked Finished. It lists 14 problems A to N, from Assigning Prizes to No Luck, each with its time limit (0.25 to 3.5 seconds), a memory limit of 1024 MB and a count of the form x107 beside it. The about section says the problem set was used in simultaneous online contests: the Maratona de Programação da SBC 2021, the Tercera Fecha Gran Premio de México 2021, the Tercera Fecha Gran Premio de Centroamérica 2021 and the Torneo Argentino de Programación 2021, with teams free to use as many computers as they liked and internet access.

    It points to final results and the original problem set on another site, and links Official Results, two sets of statements (English and Portuguese) as contest materials. Those files and the problem statements are not in our copy.
