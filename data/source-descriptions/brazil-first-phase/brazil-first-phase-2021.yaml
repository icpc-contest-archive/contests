  description: |-
    Page of the first phase of the 2021 Brazilian Programming Marathon, in Portuguese, on the marathon's site. It states that the first phase was online on 30 October 2021 with 534 teams from 127 institutions and names the people who prepared and tested the problems. It lists the authors of problems A to N, and links the info sheet, the problem PDF, the input and output packages and the final scoreboard, runs, clarifications and statistics of the Brazilian contest.

    The larger part is the allocation of places in the Brazilian final: tables by state for the sites that reached the threshold of 10 teams and 5 schools, and for the Centre-West, Northeast, North and Brazil super-sites, each giving how many places each rule yields and the names of the qualified teams, and a closing note on how the committee redistributed unassigned places. No team ranking or scores.
