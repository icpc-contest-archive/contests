    Scoreboard produced by the BOCA contest system and saved from its staff page, which names no contest and does not say whether it is final. The Brazil view ranks 513 teams, each with login and site, team name with the institution in brackets, and for each of the problems A to N the number of attempts and the minute of the accepted solution, followed by solved count and penalty time. First place is the IMPA team Last Chance with 9 problems solved and 1195 minutes. A selector offers 22 views by state code and four super-site views, and every team appears again in at least one of them with a separate rank, so the table has 1144 team rows in all. The links to the runs, tasks, clarifications and statistics pages lead outside our copy.
