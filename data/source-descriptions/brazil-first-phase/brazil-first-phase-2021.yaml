  description: |-
    BOCA scoreboard of the Brazilian teams of the first phase, which the organisers' first-phase page lists as the final scoreboard. 513 distinct teams are ranked from 1 to 513; each row gives the user and site code, the institution in brackets with the team name, columns for 14 problems A to N, and a total written as problems solved with the penalty time in parentheses. A problem cell shows attempts and minutes, for example 1/203; a problem tried but not solved shows a dash instead of minutes. 399 of the teams solved at least one problem.

    The page holds the Brazil-wide view together with views by state and region, so the table has 1144 rows and teams repeat, with the rank within each view. Links to runs, tasks, clarifications and statistics lead outside our copy.
