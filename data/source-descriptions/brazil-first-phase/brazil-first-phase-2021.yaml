  description: |-
    Results page of the 2021 Brazilian Programming Marathon (Maratona de Programação), in Portuguese, published on the marathon's site. It reports that the first phase was held online on 30 October 2021 with 534 teams from 127 Brazilian institutions, then covers the Brazilian final in Gramado (organised by the Federal University of Rio Grande do Sul, with sponsors named), the Latin American results with the gold, silver and bronze medal teams and their coaches, the 2021/22 World Finals in Luxor, Egypt, and the Brazilian teams there. It also lists the authors of the 3 warm-up problems and the 13 problems of the Latin American contest session, and notes a hardware contest.

    Our copy holds 19 files, 9 of them pages: this page, the first-phase page, and PDFs of the opening slides (22 pages), the warm-up and contest problem sets (6 and 24 pages, in English, both covers dated 2 April 2022), and their info sheets and time-limit sheets. It also holds two photos and 8 of the 16 zipped problem packages (warm-up A to C; contest A, B, C, E, H). The other packages, the scoreboards, the Latin American results PDF and the other photos are not in it.
