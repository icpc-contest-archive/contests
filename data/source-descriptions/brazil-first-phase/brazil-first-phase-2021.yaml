  title: XXVI Maratona de Programação - 2021
  language:
  - pt
  contest_date: '2021-10-30'
  description: |-
    Website page of the XXVI Maratona de Programação, 2021, in Portuguese. It states that the first phase was held online on 30 October 2021 with 534 teams from 127 Brazilian institutions, and goes on to the Brazilian final in Gramado, the sponsors, the Latin America result with lists of gold, silver and bronze medal teams and their members, regional champions, a non-competitive contest with 12 teams, a free-hardware contest, and the world final in Luxor, Egypt, held on 14 to 18 April.

    Our copy holds 9 pages: this page, the first-phase page, and seven PDFs. The PDFs are the opening slides (22 pages), a 6-page warm-up problem set with a 4-page information sheet and a 1-page table of time limits, and a 24-page problem set of the Latin American regional contest (13 problems, A to M) with its own 4-page information sheet and 1-page table of time limits. Eight problem package archives and two photographs are also saved; other package archives are not in our copy.
