  description: |-
    Problem set booklet (Caderno de Problemas) in Portuguese, 26 pages. The cover names the Maratona de Programação da SBC 2021, Sub-Regional Brasil do ICPC, and the date 30 October 2021. The cover page also carries general information on program file names, input and output; the 14 problems A to N follow from page 2. Each problem has a statement with input and output specification and at least one sample input and output.

    The cover says the same problem set was used at the same time in the Tercera Fecha Gran Premio de México 2021, the Tercera Fecha Gran Premio de Centroamérica 2021 and the Torneo Argentino de Programación 2021.
