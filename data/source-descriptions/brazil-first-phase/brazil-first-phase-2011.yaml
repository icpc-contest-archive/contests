  title: XVI Maratona de Programação
  title_en: XVI Programming Marathon
  language:
  - pt
  - en
  contest_date: '2011-09-17'
  description: |-
    Website of the XVI Maratona de Programação (2011), a partnership of the Sociedade Brasileira de Computação and the Fundação Carlos Chagas, in Portuguese. The front page states that the first phase on 17 September 2011 had 536 teams from 191 schools at 44 sites, and that 50 teams qualified for the Brazilian final of 4 and 5 November 2011 in Goiânia. It names the champion team (Challenge Accepted, UFPE), lists the medal teams and the teams qualified for the World Finals, credits the authors of the final's problems, and has photos.

    Our copy holds 139 files, 101 of them pages. They include the first-phase results page with the places per site and a link to each site's scoreboard, the first-phase problem booklet and warm-up PDFs, input and output files for problems A to F of the first phase, the Latin American final's problem set (22 pages, 11 problems) and warm-up in English, the final scoreboard of the Brazilian final as a BOCA page of 49 teams with tries and times for problems A to K, and a page on the World Finals of 2011/2012.

    Our copy is incomplete: the folders of all 41 sites hold only the server's directory listing, and 422 further addresses were not saved. The scoreboard page has lost its balloon images, script and style sheet; its table is intact.
