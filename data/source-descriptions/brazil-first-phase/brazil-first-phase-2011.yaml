  description: |-
    First-phase results page of the XVI Maratona de Programação on the organisers' site, in Portuguese, headed 'Resultados da primeira fase e vagas para a final brasileira' (first-phase results and places in the Brazilian final). It states that 536 teams from 191 schools took part and that the Brazilian final has 50 teams, and explains the two kinds of places: rule 1, for sites that had gold or silver medal schools in 2010, and rule 2, by site size, from a formula that shares 44 places by number of schools. A table of 44 sites (city and state) gives the places under each rule and the qualified teams as university and team name; 41 rows carry a Placar (scoreboard) link to that site's own results and 3 sites are listed without teams. Sites under the threshold of 6 teams and 3 schools are marked with an asterisk and pooled. Links at the top lead to the warm-up and contest problem booklets and per-problem input and output files. It does not rank the teams.
