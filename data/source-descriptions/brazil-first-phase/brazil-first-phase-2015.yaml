    Scoreboard printed from a BOCA page, 2 pages, titled UNOFFICIAL Scoreboard MARATONA DE PROGRAMACAO DA SBC 2015. It ranks 20 teams with problems A to L as columns. Each team has a login, a name with its institution in brackets, a cell per problem giving attempts and the time of the accepted run (attempts and a dash when unsolved), and a total of problems solved with penalty time in brackets. First place is Ops! Solucao Trivial from UNIOESTE, Campus Cascavel, with 6 problems solved (904).

    The print is dated 9/13/2015 and does not say whether the board is final. The header lists the board views (Geral and a set of site codes), but only the 20 teams of one site are printed.
