  description: |-
    Organisers' page of the first phase of the 2015 Maratona de Programação, in Portuguese. It gives the date of 12 September 2015, 639 teams from 209 schools in 41 sites, the committee that wrote the problems, and the problems with authors: a warm-up with three problems A to C and a contest with twelve problems A to L, with links to the warm-up and contest PDFs and their information sheets and 15 links to zip files of input and output.

    It explains the three rules for the places in the final and then gives tables of sites with their places by rule, a results link for each of the 41 sites and the names of the qualified teams: one table of 22 sites that reached the threshold of 10 teams and 5 schools, and six tables of the other 19 sites grouped as supersedes (Bahia, Minas Gerais, Rio Grande do Sul, São Paulo, Nordeste, Brasil). It states that 62 teams were classified for the Brazilian final. It is a list of qualified teams, not a ranking of all teams.
