  title: XX Maratona de Programação
  language:
  - pt
  contest_date: '2015-09-12'
  description: |-
    Website of the 2015 Maratona de Programação, in Portuguese, organised by the Sociedade Brasileira de Computação. The front page gives the first phase as 12 September 2015 (639 teams from 209 schools in 41 sites) and the Brazilian final as 13 and 14 November 2015 in São Paulo, hosted by Faculdade IBTA. It lists the authors of the problems of the warm-up (A to C) and of the contest (A to K), names the winning team, lists the gold, silver and bronze medal teams, and reports the Brazilian teams at the 2016 World Finals.

    Our copy holds 114 files, of which 64 are pages. The first-phase page gives the 12 Brazilian problems with zip links, the rules for the places in the final and the teams that qualified. 41 directory listings, one for each first-phase site, name that site's result files (PDFs, HTML reports and images). The Brazilian final's BOCA reports are in our copy: the final scoreboard with 62 teams and problems A to K, a statistics page, a clarification list and a run list. Also present are PDFs of the warm-up and contest problems with their information sheets, directory listings of the test-data zip files, 21 of those zip files, and 29 images.

    None of the result files named in the site listings is in our copy, and the images and style sheets of the BOCA reports are not either.
