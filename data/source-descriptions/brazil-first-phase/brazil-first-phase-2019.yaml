  times: true
  tries: true
  description: |-
    Final scoreboard of the Brazilian site, produced by the BOCA contest system (boca-1.5.14): 687 teams ranked from 1, each with a user name, the school in brackets and the team name. It has one column for each of the 13 problems, A to M, giving tries and the time of the accepted run (for example 1/31), or tries and a dash for an unsolved problem, and a total of problems solved with penalty time in brackets. Solved cells carry a coloured balloon image. First place is [USP] Time com T with 11 problems solved; 23 teams have none solved.

    The same table also holds each team's row again in the further score views named in the header (55 views: regions, states and site codes), each row carrying the rank within that view; every team appears two or three times in all (1579 rows).
