    Contest page on Codeforces (gym) for the 2019-2020 ACM-ICPC Brazil Subregional Programming Contest, marked Finished, with links to statements in English, Spanish and Portuguese. It lists 13 problems, A to M (Artwork to Maratona Brasileira de Popcorn), each with its time limit (1 to 3 seconds) and memory limit (256 MB, 1024 MB for problem I) and the number of solvers shown as x and a count. The page carries one announcement dated 2019-09-18 about problem I, Interplanetary, with an extra sample.

    The statements, standings and submissions are separate pages that are not part of our copy; only the dashboard is.
