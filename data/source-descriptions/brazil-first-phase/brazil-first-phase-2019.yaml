  read: '2026-11-16'
  rubric: 1
  copy: brazil-first-phase/brazil-first-phase-2019/web-mirror/20261023-live-f7739499/page.html
  title: XXIV Maratona de Programação - 2019
  language:
  - pt
  contest_date: '2019-09-14'
  description: |-
    Edition page of the XXIV Maratona SBC de Programação 2019, in Portuguese. It states that the first phase took place on 14 September at 47 sites with 726 teams from 224 schools, and links to the first-phase page. It then covers the Brazilian Final held in Campina Grande, Paraiba: its sponsors, the warm-up and contest problem lists with 3 and 13 problems (the contest problems labelled A to M, each with its setter and country), links to problem PDFs, information sheets, time limits and test-data files, and the opening slides.

    The results section names the champion team, USP-São Paulo's "time com T", lists the gold, silver and bronze medal teams, the regional champions of five regions, and a separate "café com leite" (non-competitive) board of 17 teams. Further sections tell of the Brazilian ICPC Summer School 2020 at Unicamp and of the world final in Moscow, with the nine Brazilian teams that qualified. Our copy is the single page with the Bootstrap and Font Awesome style sheets and 15 of its photographs; the site's own style sheet, two scripts and 17 of the larger photographs are missing, and the files it links to (problem PDFs, test data, slides, the other report pages) are not part of it.
