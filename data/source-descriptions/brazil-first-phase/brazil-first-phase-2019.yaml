  contest_date: '2019-09-14'
  description: |-
    Results page of the first phase of the XXIV Maratona de Programação, in Portuguese, published by the Maratona (SBC). The front page says the first phase ran at 47 sites with 726 teams from 224 schools, gives teams and schools per region (Centro Oeste, Nordeste, Norte, Sudeste, Sul), and says the same problem set was used in Mexico, Central America and one site in the United States, with centralised judging.

    Our copy holds 67 files from 70 addresses: the front page, a warm-up session (a PDF of 5 pages with 3 problems, an information sheet and a small test-data archive), the contest problem book as PDFs in Portuguese (18 pages), English (18 pages) and Spanish (19 pages), information sheets in Portuguese and English (errata for problem I, Interplanetary), and an archive of contest test data. Four BOCA report pages are included: the final scoreboard, the list of submissions, the clarifications and statistics per problem and per team. The site's style sheet and two scripts are missing from our copy (they answered 404 on capture); the report pages keep their own styles.
