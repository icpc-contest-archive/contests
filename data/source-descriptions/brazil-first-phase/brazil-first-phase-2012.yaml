  contest_date: '2012-09-15'
  description: |-
    Website of the XVII Maratona de Programação (2012), in Portuguese, presented as a partnership of the Sociedade Brasileira de Computação and the Fundação Carlos Chagas. The front page gives the dates of the first phase (15 September 2012) and of the Brazilian final (9 and 10 November 2012), states that 545 teams from 194 schools took part in the first phase, and reports the final: the champion and medal teams with links to their photographs, the Brazilian teams going to the world finals, and the training programme for the world finals.

    Our copy holds 61 pages. The first-phase section has a page of slot rules and qualified teams per site, the problem notebook, the warm-up notebook, a PDF with problems and solutions, test input and output files for the two warm-up problems and the twelve problems, and directory listings of 37 sites. The final section has the Latin American regional contest problem set (10 problems A to J, in English) and warm-up set (2 problems), test data for both, and BOCA pages: a final scoreboard of 49 teams with attempts and time per problem, run statistics, a clarification list and a run list. A page about the 2013 world finals, headed with the dates of the 2013 marathon, is also in the copy.

    The per-site results pages of the first phase are not in our copy; only the directory listings that name them are.
