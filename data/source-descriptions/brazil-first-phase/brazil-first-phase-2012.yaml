  description: |-
    First-phase page of the organisers' website, in Portuguese, headed 'Vagas para a final brasileira' (places for the Brazilian final). It states that 545 teams from 194 schools were accepted, lists the two warm-up problems and the twelve first-phase problems with links to the problem PDFs, test input and output files, hints and solutions, and explains how the places in the final are assigned: places for sites with gold and silver medal schools of 2011, places by site size with the formula used, a minimum of 6 teams and 3 schools per site, and a combined site for the smaller ones.

    A table of sites follows, with the places each site received and the qualified teams, and a link to the results of 37 of the 42 sites. The places in the table add up to 50. The linked site results are in our copy only as directory listings.
