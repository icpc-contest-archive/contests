    Page of the Maratona's site for the first phase of 2009, in Portuguese, headed Resultados da primeira fase e vagas para a final (first-phase results and slots for the final). It links the warm-up and main problem sets with the judges' input and output files. The main part is a table with one row per site (46 rows), with the slots won under the two qualification rules and the teams that qualified; 44 rows link that site's results, and the two cancelled sites have no link. A second table gives the five regional supersites with the sites in each and their slots. Notes follow: a total of 52 slots, two cancelled sites with no teams, a school may qualify at most two teams, and a team must solve more than one problem. It gives no ranking of all teams.
