  - en
  contest_date: '2009-09-19'
  description: |-
    Website of the 2009 Maratona de Programação (the XIV edition, Sub-Regional Brasil do ACM ICPC), run by the Sociedade Brasileira de Computação with the Fundação Carlos Chagas, in Portuguese. The front page gives the first phase as 19 September 2009 and the Brazilian final as 23 and 24 October 2009 at Unicamp. It reports 410 teams from 145 schools at 44 sites in the first phase and 52 teams qualified for the final, names the champion and medal teams and the seven institutions that went to the World Finals, and has team photographs.

    The first-phase page has a table of sites with slots for the final, the qualified teams and a link to each site's results, and a table of the five regional supersites. Of the 44 site directories behind it, only four hold files in our copy: BOCA report pages for Campo Grande, Dourados and Goiânia (clarifications, runs, scoreboards; Campo Grande also tasks) and a scoreboard PDF for Brasília. For the others only the directory listing page is in our copy, not the files it lists. The warm-up (2 problems) and main problem set (8 problems) are Portuguese PDFs, with the judges' input and output files.

    For the final it has a scoreboard PDF of 51 teams with problems A to K, English problem sets of the warm-up (2 problems) and contest session (11 problems), a page naming the problem committee and authors, and two zip archives of test data. Our copy holds 104 pages.
