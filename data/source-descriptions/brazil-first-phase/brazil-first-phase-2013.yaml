  description: |-
    Website of the XVIII Maratona de Programação (2013), in Portuguese, presented as a partnership of the Sociedade Brasileira de Computação and the Fundação Carlos Chagas. The front page gives the dates of the first phase (14 September 2013) and of the Brazilian final (8 and 9 November 2013, Uberlândia), states that 586 teams from 182 schools in 36 sites took part in the first phase, and reports the final: the champion and medal teams, regional champions, a parallel competition of 12 teams called Café com Leite, the training course of 2014 and the Brazilian teams at the 2014 world finals, with links to team photographs.

    Our copy holds 82 pages. The first-phase section has a page of qualification rules and qualified teams, the problem notebook, the warm-up notebook, two PDFs of instructions, zip files of test input and output for the two warm-up problems and the ten problems, and directory listings of 36 sites. Only two result pages of a site (Araçatuba's final scoreboard, in a short and a detailed version) are in the copy. The final section holds the warm-up problem set (2 problems) and the contest problem set (10 problems A to J) of the Latin American regional contests of 8 and 9 November 2013, both in English, and BOCA pages of the final: a scoreboard with 58 team rows, run statistics, a clarification list and a run list.

    Most per-site result pages of the first phase are not in our copy.
