    A table lists ten problems, labelled A to J, with their judge problem numbers (13623 to 13632) and English titles from Zero or One to Trucks. For each problem it shows the number of users who solved it, the number of submissions and the acceptance percentage as shown on the page. Statements are not on this page; the titles link to the judge's own problem pages.
