  description: |-
    First-phase page of the organisers' website, in Portuguese, headed 'Primeira Fase 2013'. It states that 586 teams from 182 schools competed in 36 sites on 14 September 2013 and lists the two warm-up problems and the ten first-phase problems, with links to the problem PDFs, instruction PDFs and zip files of test input and output.

    It then explains the 60 places in the Brazilian final: about 25 percent for the best first-phase results, about 65 percent by site size with the formula used, and about 10 percent invited by the steering committee, with a minimum of 6 teams and 3 schools per site. A table lists each site with its places and qualified teams, with a link to the results of 36 of the 38 sites; a note says the scoreboards of two sites were corrected after an input and output problem with problem H, and three teams were invited under the third rule. The linked site results are in our copy only as directory listings.
