  description: |-
    Problem set of the Brazilian round of the 2005 ACM ICPC South American Regional, a PDF of 16 pages in Portuguese, from the Maratona de Programação of the Sociedade Brasileira de Computação. The cover is dated 10 September 2005, says the booklet holds 8 problems with pages numbered 1 to 15, and lists nineteen host sites, universities and colleges in Brazilian cities from Belém to Porto Alegre.

    The eight problems A to H are "Jogo do Bicho", "Curso Universitário", "Redução de Pena", "Cubos Coloridos", "Gerente de Espaço", "Tecle & Some", "Regata de Cientistas" and "Piscina". Each has a statement with input and output sections, the names of the source files to submit, and an example of input and output. No test data or solutions.
