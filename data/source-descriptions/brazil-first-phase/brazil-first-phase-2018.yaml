  title: XXIII Maratona de Programação - Vagas para a final brasileira
  title_en: 23rd Programming Marathon - Places for the Brazilian final
  language:
  - pt
  contest_date: '2018-09-15'
  description: |-
    First-phase page of the XXIII Maratona de Programação, headed "Vagas para a final brasileira" (places for the Brazilian final), in Portuguese. It states that 746 teams from 219 schools registered, that the first phase ran at 52 sites, that 87 "café com leite" teams took part in addition (770 teams competing) and that teams from Costa Rica, Nicaragua, Guatemala and Mexico brought the total to 1156 simultaneous teams. It names the team of judges and notes that two teams were disqualified for improper conduct. It links the warm-up and contest problem PDFs, test-data archives, the final scoreboard, the run list, the clarification list, the statistics and per-site PDFs.

    It explains the three kinds of places (about 25% for the best performance, about 65% by site size, about 10% by the steering committee) and the rule that a site needs at least 10 teams and 5 schools. Tables then list, for each site, the places under each rule and the qualified teams: one table of 19 sites that reached the threshold, totalling 43 places, and ten tables for groups of smaller sites (Bahia, Ceará, Minas Gerais, Piauí, Rio Grande do Sul, São Paulo, Centro-Oeste, Nordeste, Norte, Brasil).
