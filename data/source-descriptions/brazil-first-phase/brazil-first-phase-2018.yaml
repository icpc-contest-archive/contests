  - en
  contest_date: '2018-09-15'
  description: |-
    Website of the XXIII Maratona de Programação, organised by the Sociedade Brasileira de Computação, in Portuguese with some English. The front page gives the first phase on 15 September 2018 and the Brazilian final in Salvador on 9 and 10 November 2018, with links to three sections: the first phase, the Brazilian final and the World Finals.

    Our copy holds 116 files, 80 of them pages. The first-phase section has the page on places for the Brazilian final (746 registered teams from 219 schools, 52 sites, 1156 simultaneous teams counting Costa Rica, Nicaragua, Guatemala and Mexico), the warm-up and contest problem PDFs with information sheets, a warm-up test-data archive, the BOCA final scoreboard, run list, clarification list and statistics, and 50 per-site scoreboard PDFs (the page links 51). The Brazilian final section has the account of the final with medal winners and regional champions, the opening slides, the Latin America scoreboard PDF, BOCA score, statistics, clarification, run and task pages for the official and the "café com leite" competitions, and team photos. The World Finals section reports the Porto finals of 31 March to 5 April 2019 with a PDF of the final classification.

    The warm-up and contest problem PDFs under the Brazilian final section, and the lists of problems on its page, are those of the Latin American contest of 9 and 10 November 2018, not of the first phase. The contest test-data zip and the BOCA package zip, one photo and the images, style sheets and scripts of the BOCA report pages are not in our copy.
