  description: |-
    Final scoreboard of the Maratona de Programação as shown by BOCA ("Global"): 1156 teams, each with a user/site id, the name column giving the institution in brackets and the team name, one column for each of the 13 problems A to M giving tries and time (an unsolved problem with attempts shows tries and a dash), and the number solved with total penalty time in brackets. The first place is a USP - São Carlos team with 10 solved; 84 teams solved nothing.

    The user ids end in a suffix: /BR for 770 teams, /MX for 324, /CR for 23, /NI and /GT for one each and /1 for 37. Eighty-seven teams have [CCL] in their name and ids beginning teamccl; they are ranked in the same table as the others. The page opens with a long line of score-view and site codes under "Available scores". Every team appears in four to six rows (the table has 5,741 rows for the 1156 teams): the first row of each team carries its rank 1 to 1156 and the repeated rows repeat its data, nearly always with a different leading rank number.
