    Dashboard of a Codeforces gym, "2018-2019 ACM-ICPC Brazil Subregional Programming Contest", with the contest marked as finished and options for virtual participation and practice. It lists 13 problems A to M with English titles ("Slackline Adventure" to "Modifying SAT"), the time limit (0.5 s for most, up to 8 s for problem H) and the 1024 MB memory limit of each, and a number at the right of each row (for example x145 for A). A "Statements (pt)" link under the contest materials leads to the Portuguese statements, which are not part of this page.

    The rest of the page is the gym's menu, forms for asking questions and for announcements, and links to submit, status and standings.
