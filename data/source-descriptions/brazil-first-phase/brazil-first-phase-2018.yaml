  description: |-
    Problem booklet ("Caderno de Problemas") of the Maratona de Programação da SBC 2018, Sub-Regional Brasil do ACM ICPC, dated 15 September 2018: a PDF of 23 pages in Portuguese. After the cover come general information on file names (C/C++, Python, Java and Kotlin) and input and output conventions, then 13 problems labelled A to M, from "Aventurando-se no Slackline" to "Modificando SAT".

    Each problem has a statement with input and output format and between two and four numbered sample inputs with their outputs. No test data or solutions.
