  description: |-
    Problem booklet (Caderno de Problemas) in Portuguese: a PDF of 20 pages. The cover names the Maratona de Programação da SBC 2023, Sub-Regional Brasil do ICPC, and gives 2 September 2023 as the date. The same first page carries general information on program names, input and output, and states that the booklet holds 13 problems and that the set was used at the same time in the Gran Premio de México, the Gran Premio de Centroamérica, the ICPC Bolivia Preliminary Contest and the Torneo Chileno de Programación, all 2023.

    Thirteen problems A to M follow, each with a statement, input and output format and sample cases (35 sample pairs in all). No test data or solutions.
