  description: |-
    Scoreboard produced by BOCA for the contest it names Regional Brasileira 2023 (state shown: contest not running). It lists 687 distinct teams, each with a user/site id, the institution in brackets with the team name, thirteen problem columns A to M and a total. A problem cell shows the number of attempts and the minute of the accepted run (for example 1/3); an unsolved problem with attempts shows the attempts and a dash. The total is the number of problems solved with the penalty time in brackets; the first place has 13 solved (1015), and the last places have 0 (0).

    The table has 1704 rows because each team appears two or three times, once in the overall list and again in the views of its site and region. The page names the site views in a list of available scores, and those links, like the links to runs, tasks, clarifications and statistics, lead to other pages that are not part of this one.
