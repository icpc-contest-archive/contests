  description: |-
    Page of the Maratona SBC de Programação 2023 for its first phase, in Portuguese. It states that the first phase was held on 2 September 2023 at 44 sites in Brazil, with 726 teams from 181 Brazilian institutions, and that it ran at the same time in Bolivia, Central America and Mexico. It names the problem selection committee and the regional and foreign representatives, and lists the authors of problems A to M under their Portuguese titles. Seven links lead to the information sheet, the problem set, the input and output package, the final scoreboard, the list of submissions, the clarifications and the statistics.

    A first table lists, by site, the teams that qualified (columns site, type, qualified teams), with the rule (Regra 1 to 4) under which each qualified; it is followed by eight tables under headings starting with Supersede, for states and regions. A closing paragraph names the teams the committee added under rule 3. The page has no images, and the linked documents are separate files that are not part of this page.
