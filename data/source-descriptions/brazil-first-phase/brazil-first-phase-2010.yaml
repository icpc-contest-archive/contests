    First-phase results page of the XV Maratona de Programação on the organisers' site, in Portuguese, headed 'Resultados da primeira fase e vagas para final' (first-phase results and places in the final). A table of 43 sites (city and state) gives the places won under rule 1 and rule 2, the total per site, and the qualified teams as university and team name; 37 of the rows carry a Results link to that site's own results and 6 sites are listed without teams. The text states that 50 teams qualified for the Brazilian final, that sites below the threshold of 6 teams and 3 schools were pooled into one super-site with 6 places, and that six sites without registered teams were cancelled. Links at the top lead to the warm-up and contest problem PDFs and their test data. It does not rank the teams.
