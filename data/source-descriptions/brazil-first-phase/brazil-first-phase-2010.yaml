  title: XV Maratona de Programação
  title_en: XV Programming Marathon
  language:
  - pt
  - en
  contest_date: '2010-09-18'
  description: |-
    Website of the XV Maratona de Programação (2010), a partnership of the Sociedade Brasileira de Computação and the Fundação Carlos Chagas, in Portuguese. The front page states that the first phase on 18 September 2010 had 432 teams from 157 schools at 43 sites, and that 50 teams qualified for the Brazilian final of 22 and 23 October 2010 in Joinville. It names the champion team (Razão Cruzada, UFPE), lists the medal teams and the teams qualified for the World Finals, and links the final scoreboard.

    Our copy holds 150 files, 111 of them pages. They include the first-phase page with the slots per site, the first-phase problem booklet and warm-up PDFs with test-data archives, the Latin American final's problem set and warm-up in English, a page naming the problem committee and the authors of each problem, and the final scoreboard of the Brazilian final as a BOCA PDF of 51 teams with tries and times per problem. Result files of the first phase are held for 10 of the sites (BOCA boards saved as HTML pages, PDFs, images and a text file); the folders of the other 27 sites hold only the server's directory listing.

    Our copy is incomplete: 283 further addresses of the site, among them most of the result files in the site folders, were not saved. One page, on the World Finals held in 2011, carries the header of the XVI Maratona (2011).
