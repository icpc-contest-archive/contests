  title: 2025 AGM - South Pacific Competitive Programming Association
  language:
  - en
  description: |-
    Website of the South Pacific Competitive Programming Association, in English. The front page of our copy is a news post of 18 December 2025 about the 2025 annual general meeting. Our copy holds 28 pages among 150 files, covering the association's contests over several seasons: ICPC preliminary and regional contests of 2024 and 2025, the SPAR rounds and news posts.

    For the 2024 preliminary the site has a final report dated 3 September 2024 (124 teams at ten sites in three divisions, winners of Level A and Level B, the teams invited to the regional finals, the Boersen Prize) and a one-page flyer PDF announcing the contest of 31 August. It also holds DOMjudge scoreboards of the 2024 regional finals, of SPAR rounds and of the 2025 preliminary contest (Level A and Level B). The page about South Pacific ICPC describes the preliminary contest of 14 September 2025.

    Some photographs were not saved with our copy.
