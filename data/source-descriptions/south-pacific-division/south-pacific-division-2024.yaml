  description: |-
    Problem set of Level A: a PDF of 30 pages, in English. The cover page names the ICPC South Pacific Preliminary Contest Level A, 31 August 2024, and lists twelve problems A to L, from Arranging Sticks to LLM. The cover page also carries definitions (answer tolerance, results modulo m, lexicographic order, letters, Euclidean distance). Each problem has a statement with time limit, input and output format and sample input and output. Six pages are marked 'This page is intentionally left (almost) blank'. The Level B problem set is not in this document.
