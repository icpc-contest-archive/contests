  description: |-
    Scoreboard of Level A of the preliminary contest, produced by DOMjudge and marked 'preliminary results - not final', last updated 3 September 2024. It lists 83 teams against twelve problems, A to L. Each row gives rank, country flag, team name, institution, number solved, penalty time, and for each problem the minutes of the accepted solution with the number of tries, or the tries alone for unsolved problems. A summary row at the bottom gives, per problem, the numbers of accepted, rejected and pending submissions and the time of the first solve. First place is W[3]-complete of UNSW Sydney with 11 solved.

    Two categories share the board, shown by row colour and a legend: 72 official teams (Level A Participants) and 11 Level A Unofficial teams, which are ranked on their own, restarting at 1.

    Style sheets and flag images are linked from another server and are not saved with our copy.
