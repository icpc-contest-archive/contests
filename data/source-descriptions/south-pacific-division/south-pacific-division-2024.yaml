  description: |-
    Rankings of The 2024 South Pacific Independent Regional Contest Preliminary: 119 teams, 69 from Level A and 50 from Level B. Each row gives rank, team, institution, and a Medal and a Citation column that both read 'LEVEL A, Place n' or 'LEVEL B, Place n'. The Solved and Time columns are present but empty, so the page gives the order of teams and no results per problem. Ranks are given per level, so the same rank number appears in both Level A and Level B; first place in Level B is All you need is white king (The University of Sydney) and in Level A W[3]-complete (UNSW Sydney).
