  description: |-
    Standings of the 2021 South Pacific Independent Regional Contest Divisional: 93 teams with rank, team, institution, number of problems solved and time. The University of Western Australia team is first with 13 solved and 635. The top three carry gold, silver and bronze medals and the citations Winner, Second Place and Third Place; 13 teams are cited as Regional Finalist and the other 77 as Honourable Mention (spelled Honorable in seven rows). Eight teams carry Unofficial in the site citation column and are ranked among the others. Ranks run from 1 to 81, with ties; the last seven rows have 0 solved or no result. No per-problem detail.
