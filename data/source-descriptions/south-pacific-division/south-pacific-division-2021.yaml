  description: |-
    Website of the South Pacific Programming Contests, the site of the South Pacific Competitive Programming Association, in English. Our copy holds 116 files, 98 of them pages. The South Pacific ICPC page gives the 2021 schedule: Divisional Finals on October 16th and Regional Finals on December 11th.

    The 2021 results page states that on October 16 2021, 86 teams from 15 universities in Australia and New Zealand, as well as a number of high schools, competed on a problem set of 13 problems; it names the winner, the next three teams and the sixteen teams advancing to the Regional Final. The archive version of that page links four PDFs: the divisional scoreboard (3 pages) and the Regional Finals problem set (28 pages) open, but the divisional problem set and the Regional Finals report with scoreboard are cut short in our copy and cannot be opened. Other pages hold the 2021 Regional Finals instructions and a contest page with compiler settings and limits.

    The site was captured as a whole, so it also has pages of other years and later seasons: results and finals pages from 2004 to 2023, 2022 instructions, ANZAC scoreboards, the 2020 divisional scoreboards and news about later contests.
