    Scoreboard of the 2021 South Pacific Divisional Finals printed from DOMjudge: a PDF of 3 pages headed preliminary results - not final, with a last update of Sat 16 Oct 2021. Each team has its institution, a score of solved count and penalty time and, for problems A to M, the minute of the solve and the number of tries, coloured for first solve, solved, incorrect and pending. The first block ranks 79 official participants 1 to 79, with Agents Smith of The University of Western Australia first at 13 solved, and ends with a summary row. A second block lists 20 unofficial participants, including high school teams: eight with ranks 1 to 8 and twelve with 0 solved and no rank, followed by its own summary row. A legend closes the last page.

    Our copy has no text layer: each page is an image.
