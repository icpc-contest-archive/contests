  description: |-
    Scoreboard of Level A of the preliminary contest, produced by DOMjudge, headed 'final standings' and last updated 2 September 2026. It lists 102 teams against twelve problems, A to L (from All for the Bowl to Litmoss). Each row gives rank, team name, institution, number solved, penalty time, and for each problem the minutes of the accepted solution with the number of tries, or the tries alone for unsolved problems. A country flag appears on 100 of the 102 rows. A summary row at the bottom gives, per problem, the numbers of accepted, rejected and pending submissions and the time of the first solve. First place is a team of UNSW Sydney with 12 solved; gold, silver and bronze medal marks sit beside 7, 12 and 22 teams.

    Two categories share the board, shown by row colour and a legend: 81 Level A Participants and 21 Level A Unofficial teams, the latter ranked on their own. Each team also has a detail panel with name, category, description and, for most teams, affiliation, country and location.
