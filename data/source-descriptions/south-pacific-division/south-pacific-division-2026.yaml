  description: |-
    Standings of the 2026 ICPC South Pacific Independent Regional Contest Preliminary: 144 teams from 15 institutions, with rank, team, institution, number solved, total time, medal, a citation and a site citation. No per-problem detail.

    The first 116 rows are ranked; 38 of them share rank 82, including all the teams with 'Level B' medals. First place is a team of UNSW Sydney with 12 solved. The medal column holds 7 gold, 12 silver and 22 bronze medals, plus 3 gold, 5 silver and 7 bronze marked 'Level B'. The citation column gives places and the remaining ranked teams as Honorable Mention (107 rows carry it), and the site citation names division champions and runners-up and a Boersen Prize winner. The last 28 teams are listed without rank or results.
