  language:
  - en
  problems: 1
  pages: 2
  description: |-
    Statement of problem 6329, "Lost", as a PDF of 2 pages. An amusement park has N sites joined by N roads in a connected graph with exactly one loop (length 3 to 30); a random walk starts at a random site and never revisits a site, and the program prints the sum of the five largest probabilities of a site being the last one visited. It has input and output sections and a sample of two cases. No letter label is printed. A running line "ACM-ICPC Live Archive: 6329 – Lost" with the page number is printed at the page break.
