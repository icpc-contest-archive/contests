    Statement of a card-game problem as a single-page PDF; the first line is the start of the text, with no problem number or title printed. It describes the four-player game Spade 7 and its rules, and asks, given the thirteen cards of each player, for the minimum possible sum of all four players' penalty points over T test cases (T up to 20). It has input and output sections and one sample with output 0. No letter label is printed.
