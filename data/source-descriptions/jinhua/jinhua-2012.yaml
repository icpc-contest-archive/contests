  description: |-
    Statement of problem 6331, "Crazy Tank", as a PDF of 2 pages. A tank on a platform of height H fires N cannonballs with given initial speeds at one angle chosen in advance; the program prints the largest number that can land in the enemy tank's interval with none landing in the friendly tank's interval (g = 9.8). It has input and output sections, a hint on the two sample cases, and a sample with outputs 1 and 0. No letter label is printed. A running line "ACM-ICPC Live Archive: 6331 – Crazy Tank" with the page number is printed at the page break.
