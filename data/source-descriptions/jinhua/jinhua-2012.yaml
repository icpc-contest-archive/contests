    Scoreboard of the on-site contest, from a Chinese-language ICPC results board (heading 2012 金华赛区现场赛 (Jinhua regional on-site contest)), time-stamped 2012/10/28 20:56:27 with start time 2012-10-28 09:00. It lists 152 teams with the columns S#, School, Rk, Team, Slv. and Time, and for each of the eleven problems A to K a cell with the team's result: solved cells show two numbers separated by a slash, cells of attempted but unsolved problems one number. The column heads show two totals per problem, for example A 140/343. Ranks run from 1 to 152 without ties. In the S# column 84 rows carry a running number, 13 rows a star and 55 rows are empty; the page does not explain the marks. The page states the medal cut-offs as 14 gold, 28 silver and 42 bronze. First place: Mithril of Shanghai Jiao Tong University with 10 problems solved.

