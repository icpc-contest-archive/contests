  description: |-
    Statement of problem 6335, "Building Design", as a single-page PDF. Given the vertices of a convex polyhedron, the program chooses a face to stand it on so that the peak is as high as possible and, among those, the projected area is smallest, and prints the height H and area S to three decimals. It has input and output sections and one sample (six vertices, output 1.155 1.732). No letter label is printed.
