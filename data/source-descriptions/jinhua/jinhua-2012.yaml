  description: |-
    Website of the host university's ACM team for the 2012 Jinhua regional, in Chinese. The home page carries a menu (introduction, organisation, schedule, rules, traffic, contest services, staff login), news links to an invitation letter, the rules for team quotas and a ranking, links to the Chengdu, Changchun, Hangzhou and Tianjin regional sites, and the host's contact details and address in Jinhua.

    Our copy holds 146 pages, but the menu pages and the news items are not among them; apart from the home page the crawl consists of two practice online judges run by the same university (C language and data structures), with their problem lists, submission status pages, contest lists and user lists, whose pages show dates from 2013 to 2020. No page of the copy states the contest date or lists teams or results.
