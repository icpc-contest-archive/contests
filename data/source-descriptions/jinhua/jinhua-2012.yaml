  description: |-
    Statement of problem 6332, "IT Companies", as a single-page PDF. N companies and their branches (labelled 1 to N and -1 to -N) obey rules on their numbers of workers, and given a count c[i] for each company the program prints the 2N units sorted by number of workers, or Impossible. The statement says the problem is special judged. It has input and output sections and a sample of two cases. No letter label is printed.
