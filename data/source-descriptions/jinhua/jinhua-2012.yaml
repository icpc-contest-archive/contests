  description: |-
    Statement of problem 6328, "Physical Examination", as a single-page PDF. Given n examination queues, each with a starting waiting time and a rate at which it grows every second, the program finds the earliest time (in seconds, taken modulo one year) at which all subjects can be finished in the best order. It has input and output sections, a hint explaining the sample, and one sample. No letter label is printed.
