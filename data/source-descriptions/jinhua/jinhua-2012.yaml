  title: 6330 Walk
  language:
  - en
  problems: 1
  pages: 2
  description: |-
    Statement of problem 6330, "Walk", as a PDF of 2 pages. A walker moves parallel to the axes on a plane with axis-parallel rectangular buildings and must get from a start point to a destination; the program prints the least number of turns, or -1 if the destination cannot be reached. It has input and output sections, a hint on the two sample cases, and a sample. No letter label is printed. A running line "ACM-ICPC Live Archive: 6330 – Walk" with the page number is printed at the page break.
