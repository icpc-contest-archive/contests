    Statement of problem 6333, "Yuanfang, What Do You Think?", as a PDF of 2 pages. The program factors the polynomial x^n - 1 (n up to 1100) into irreducible polynomials with integer coefficients, printed in a stated format and order. It has input and output sections and a sample for n = 1 to 6 with its output. No letter label is printed. A running line "ACM-ICPC Live Archive: 6333 – Yuanfang, What Do You Think?" with the page number is printed at the page break.
