  description: |-
    Standings of the 2015 Palestinian Collegiate Programming Contest West Bank: 22 teams from 9 institutions, each with rank, team name, institution, number of problems solved and time. The Citation column names the first 11 places (First Place to Eleventh Place); the other 11 teams are listed as Honorable Mention. First place is MiracleSort of An-Najah National University with 8 problems solved and a time of 1008.

