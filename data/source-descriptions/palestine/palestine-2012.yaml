  description: |-
    Page on a Palestine Polytechnic University staff website, headed "PCPC Palestinian Collegiate Programming Contest", with an account in Arabic headed نبذة عن مسابقة البرمجة الفلسطينية لطلاب الجامعات PCPC ("About the Palestinian programming contest for university students, PCPC") and an English section "About ICPC". The Arabic text says the contest began in 2012 and that the first edition was held at Palestine Polytechnic University, with teams from all Palestinian universities and a supervising and judging team from Egypt and Jordan. It then names later hosts: the Arab American University in 2014 and 2015, An-Najah National University in 2016, Palestine Technical University in 2017, Birzeit University in 2018, the Ministry of Telecommunications and Information Technology in 2019 (about 40 university teams and 6 school teams) and three universities in 2020, and mentions Palestine's three appearances at the Arab contest and the founding of the Palestinian Olympiad in Informatics.

    It gives no date, teams, results or problems of the 2012 contest. Our copy holds this one page; its images and style sheets are not in our copy.
