  - en
  description: |-
    Selected Teams page of the Coimbatore site website: lists of teams, without results, in three tables. The first, headed teams registered at amrita.edu but not at baylor.edu, has 23 teams with team name, coach name, e-mail, an eligibility column and a column for whether a D.D. (bank draft) was received; a status line says the teams were notified by e-mail, and notes explain that blue marks pending notification and bold italics marks duplicates already in the draft-received list. The second, teams registered at both sites but payment not received, has 11 teams with team name, coach name, e-mail and eligibility. The third, teams confirmed (payment received and confirmation mails sent), has 33 teams with team name, college, an amount (Rs.2000 for every team) and e-mail.

    The page also repeats the site's menu and links to the IBM press release, fact sheet and policies PDFs.
