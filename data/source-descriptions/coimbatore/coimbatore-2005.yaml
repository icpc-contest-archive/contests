  description: |-
    Abstract standings page of the Asia Region contest at Coimbatore, on the contest website, in English. The Top 10 Teams table gives rank, institution, team name, problems solved (out of 8) and time; first is Indian Institute of Technology, Mumbai (GALOIS) with 7 solved and time 881. A second table under Honorable Mention lists 32 further teams with institution, team name, solved and time, and a Participated list names 5 teams without results. In all 47 teams appear.

    The page links to a detailed standings page and to the home page; it gives no per-problem results itself.
