  title: The 30th Annual ACM International Collegiate Programming Contest
  language:
  - en
  contest_date: '2005-12-11'
  description: |-
    Website of the Coimbatore site of the ICPC Asia Region contest, hosted by Amrita Vishwa Vidyapeetham, in English. The menu leads to the contest rules, registration, the regional contest page with a FAQ on the contest environment, the preliminary contest page, fee details, important dates, a schedule of the two onsite days (11 and 12 December 2005), local information, a campus tour of photo pages, related links and contact details. The preliminary contest is described as a three-hour online round on 12 November 2005 with five problems and the main contest as a five-hour onsite round on 11-12 December 2005.

    The site also holds results and problem documents: an abstract standings page and a detailed standings page with a per-problem table of 47 teams and problems A to H, a page of selected teams, the problem sets of the online round (5 problems) and the onsite round (8 problems) as PDFs, and three PDFs of general ICPC material (an IBM press release, a fact sheet and the policies and procedures).

    Our copy holds 71 pages, among them several pages of the university's general site (about, news, schools) that the contest pages link to.
