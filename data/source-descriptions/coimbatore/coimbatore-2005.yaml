  description: |-
    Standings page of the 2005 ACM Asia Programming Contest - Coimbatore, sponsored by IBM, with three tables. The Final Round table for the onsite contest of 12/12/2005 lists 47 teams as institution and team name: the first 42 with rank, a citation (First Place to Forty-second Place) and two unlabeled numbers, problems solved and time, followed by 5 teams marked Honorable Mention without rank or numbers. IIT Bombay's galois is first with 7 solved.

    Two more tables list teams of the preliminary sites with only the citation Honorable Mention: 70 teams of the Asia Preliminary Internet Coimbatore site (11/12/2005) and 13 teams of the Asia-Foreign Team Coimbatore Registration Site (12/12/2005). There are no per-problem results.
