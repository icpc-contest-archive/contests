  copy: coimbatore/coimbatore-2006/judge-livearchive/20150309-wayback-4a53a6ea/3806.pdf
  title: 3806 - Rat Attack
  language:
  - en
  problems: 1
  pages: 3
  description: |-
    Statement of problem 3806, "Rat Attack", as a PDF of 3 pages. On a 1025 x 1025 grid with rat populations, the program places m gas bombs of given strengths at disjoint positions to kill the most rats, with ties broken by the smaller position, and prints the location and the rats killed. It has input and output sections and a sample of two scenarios. The text "=6in" is printed on page 1 of the statement. A line below the title reads Asia - Coimbatore - 2006/2007; no letter label is printed.
