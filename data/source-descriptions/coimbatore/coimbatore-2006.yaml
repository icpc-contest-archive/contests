  title: 3804 - Jungle Safari
  language:
  - en
  problems: 1
  pages: 2
  description: |-
    Statement of problem 3804, "Jungle Safari", as a PDF of 2 pages. For a walk across a jungle from a store to a destination, with fruit trees at some locations and a limited carrying capacity, the program finds the minimum number of water packets to buy, or reports Impossible. It has input and output sections and a sample of two trials. A line below the title reads Asia - Coimbatore - 2006/2007; no letter label is printed.
