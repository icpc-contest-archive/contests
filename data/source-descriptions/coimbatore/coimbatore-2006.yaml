  description: |-
    Website of the Coimbatore site of the ICPC Asia Region contest 2006, hosted by Amrita Vishwa Vidyapeetham, in English. The front page says the contest is over and links to the final standings, a director's report and the onsite problems. Other pages cover fee details, registration, the preliminary contest (an Internet round on 28 October 2006 run with Mooshak, with a list of 60 teams selected for the onsite round), people, related links, the regional contest and its programming environment, the schedule of 16 and 17 December 2006, contest rules, important dates and contact details.

    Inside are a standings page with a per-problem table of 51 teams for problems A to G, a list of 90 registered teams, the onsite problem set as a PDF of 15 pages with seven problems, and a one-page director's report as a PDF. A link on the front page leads to the previous year's site, which is not part of this copy. Our copy holds 16 pages.
