  description: |-
    Standings page of the 2006 ACM Asia Programming Contest - Coimbatore, sponsored by IBM, with four tables. The Final Round table for the onsite regional contest of 12/17/2006 lists 52 teams as institution and team name: 51 ranked from First Place to Fifty-first Place with an unlabeled count of problems solved (the last six have 0), and one Honorable Mention team without rank. The winner is Indian Institute of Technology, Bombay (ACM(e) Solvers) with 6 solved. No penalty times or per-problem results are shown.

    Three further tables list preliminary-site teams, all marked Honorable Mention: 60 teams of the Coimbatore Site First Round Internet Contest (10/28/2006), 11 teams of the Foreign Teams Registration site (11/28/2006) and 11 teams of the Amrita University Campus Programming Contest in India (9/17/2006).
