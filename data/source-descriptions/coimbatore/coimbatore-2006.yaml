  title: Director's report, ICPC 2006, Asia-Coimbatore Site
  language:
  - en
  contest_date: '2006-12-16'
  pages: 1
  description: |-
    Director's report on the 2006 contest at the Coimbatore site: a PDF of one page written by the site's Regional Contest Director, Vallath Nandakumar, under the header of the 31st ACM ICPC, Asia Region, Coimbatore Site, 16-17 December 2006. It tells that fifty teams and their coaches came to Amrita Vishwa Vidyapeetham for the five-hour contest of seven problems on 17 December 2006, that IIT Bombay's ACMeSolvers won with six problems and seven other teams solved five, that two teams came from Bangladesh and one from South Korea, and that it was the second time Amrita hosted the contest. It also mentions problems with question quality and judging the previous year and plans to test solution code more thoroughly. No problem solutions are discussed.
