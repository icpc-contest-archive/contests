  title: 3800 - Intriguing Player Chain
  language:
  - en
  problems: 1
  pages: 2
  description: |-
    Statement of problem 3800, "Intriguing Player Chain", as a PDF of 2 pages. For n players (n up to 16) with jerseys numbered 1 to n in a circle, the program prints every arrangement, starting with jersey 1, in which the sum of any two adjacent jerseys is a prime, clockwise ones first and in ascending order. It has input and output sections and a sample with n = 6 and n = 8. A line below the title reads Asia - Coimbatore - 2006/2007; no letter label is printed.
