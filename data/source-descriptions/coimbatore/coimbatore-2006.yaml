  title: 3805 - Peg-Solitaire
  language:
  - en
  problems: 1
  pages: 3
  description: |-
    Statement of problem 3805, "Peg-Solitaire", as a PDF of 3 pages. It describes the 33-hole peg board with numbered holes, and asks the program to play each given starting position by always making the jump with the largest target hole (then the larger source hole) until no move remains, and to print the pegs left. It has a worked example, input and output sections and a sample of two instances. The text "=6in" is printed on page 1 of the statement. A line below the title reads Asia - Coimbatore - 2006/2007; no letter label is printed.
- url: https://icpcarchive.ecs.baylor.edu/external/38/3806.pdf
  read: '2026-11-23'
