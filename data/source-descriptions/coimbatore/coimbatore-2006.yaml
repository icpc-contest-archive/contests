  title: 3802 - Operator Jumble
  language:
  - en
  problems: 1
  pages: 2
  description: |-
    Statement of problem 3802, "Operator Jumble", as a PDF of 2 pages. Given a sequence of integers and a target, the program inserts the operators +, -, * and / (read left to right) so that the expression equals the target, or prints NO EXPRESSION; it lists three restrictions and the rule for choosing among several solutions. It has input and output sections and a sample of three cases. A line below the title reads Asia - Coimbatore - 2006/2007; no letter label is printed.
- url: https://icpcarchive.ecs.baylor.edu/external/38/3803.pdf
  read: '2026-11-23'
  rubric: 1
  copy: coimbatore/coimbatore-2006/judge-livearchive/20150309-wayback-5f84f0c9/3803.pdf
  title: 3803 - Mahabharat -- A Story in disguise
  language:
  - en
  problems: 1
  pages: 1
  description: |-
    Statement of problem 3803, "Mahabharat -- A Story in disguise", as a single-page PDF. Told as a story about brothers in a circle from which the m-th person is repeatedly eliminated, it asks the program to print, for the number of brothers n and the elimination number m, the position of the one who is left last. It has input and output sections and a sample of two test cases. A line below the title reads Asia - Coimbatore - 2006/2007; no letter label is printed.
