  read: '2026-11-23'
  rubric: 1
  copy: coimbatore/coimbatore-2006/judge-livearchive/20150309-wayback-5df580c8/3801.pdf
  title: 3801 - Longest Run on a Snowboard
  language:
  - en
  problems: 1
  pages: 2
  description: |-
    Statement of problem 3801, "Longest Run on a Snowboard", as a PDF of 2 pages. Given grids of heights, the program finds the longest slide in which each step goes to a neighbouring point of lower height that is not co-prime with the current one, and prints its length and the path. It has input and output sections and a sample of two areas with their output. A line below the title reads Asia - Coimbatore - 2006/2007; no letter label is printed.
