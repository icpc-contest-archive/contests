  description: |-
    Information page on the Luogu judge for a replay contest (重现赛, chóngxiànsài, "replay contest") of the 2018 Jiaozuo regional, held on 2026-09-17 from 13:00 to 18:00. It says the problems and test data are those of the original contest, with Chinese statements, and thanks Jisuanke for providing them. It sets out the rules: ICPC scoring with a 20-minute penalty, teams of one to three, a scoreboard frozen for the last hour, and a request that those who already took part in the original or solved the problems afterwards do not enter. A closing section explains prize certification. The page does not list the problems and our copy holds no statements or test data.
