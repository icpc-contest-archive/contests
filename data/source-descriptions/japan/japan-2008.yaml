  title: Aizu ACM/ICPC 2008 contest
  language:
  - en
  - ja
  contest_date: '2008-10-26'
  description: |-
    Website of the Asia Regional Contest held in Aizu, Japan, hosted by the University of Aizu, mostly in English with Japanese versions of some pages. The regional overview gives the dates (October 25-27, 2008) and the auditorium of the University of Aizu as the place; other pages cover the contest outline, news, registration and eligibility, the schedule (contest on 26 October, 9:00 to 14:00, with a Java Challenge, trial session, coaches' workshop and excursion), contest hardware and software, accommodation, links, and past Asia Regional Contests held in Japan from 1998 to 2007.

    Results inside our copy: the regional results page (15 ranked teams and 20 teams listed as Honorable Mention), the Java Challenge results and tournament statistics, and the domestic contest of 4 July 2008 with its rules, team selection rules, six problems A to F and a results page of 139 ranked teams and 122 Honorable Mention teams. The regional problem set is a PDF of 32 pages (problems A to J), with a data page, the 20 input and output files A.in to J.ans, and a slide file for the commentary. There are picture gallery pages, whose photographs are not in our copy, and a list of 20 sponsors.

    Our copy holds 97 files: 44 pages, one PDF, 20 data files, a slide file held twice, and images, scripts and style sheets. Many English and Japanese language variants of pages are missing, and so is the Java Challenge description PDF that the Java Challenge page links to.
