  description: |-
    Page of the Aizu ACM/ICPC 2008 contest website, in Japanese, headed 国内予選の成績 (kokunai yosen no seiseki, "domestic contest results"), that explains how teams are ranked in the domestic contest and how the contest is run. Teams rank by number of problems solved, then by total penalty, where the penalty is the time from the start to each solution plus 20 minutes per wrong submission on problems finally solved; a worked example is given. It then describes how problems are published on the web, the four data sets per problem and the rule that a problem counts as solved after correct output on two different data sets in a row. It holds no results.
