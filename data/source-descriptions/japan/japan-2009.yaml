  title: ACM/ICPC Asia Regional Contest 2009, Tokyo, Japan
  language:
  - en
  - ja
  contest_date: '2009-11-08'
  description: |-
    Website of the 2009 Asia Regional Contest in Tokyo, hosted by Waseda University at the National Olympics Memorial Youth Center, in English and Japanese. Our copy holds 32 pages. The English pages give the overview and schedule (7 to 9 November, with the contest on 8 November), the computer equipment supplied to teams (laptop, Fedora Linux, gcc and Java, editors, Eclipse), local information on lodging and meals, and a teams list. They also cover the domestic internet contest of 3 July 2009 that decided which Japanese teams went to Tokyo: its rules, the team selection rules and a system rental page. Japanese pages repeat this and add an outline of the ICPC, a mock domestic contest and a list of registered teams.

    The results page with the final standings and the contest problems PDF with ten problems are inside the copy. The domestic contest has its final results page, English and Japanese statements of its six problems A to F, and three Japanese press releases (a four-page one from 20 October 2009, one of 8 July on the 27 qualifying teams and one of 19 November on the results). The link to photos leads to another server and is not part of our copy.
