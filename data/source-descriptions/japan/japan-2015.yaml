  description: |-
    Final standings of the Tsukuba regional from the contest website: 42 teams with place, university rank, institution (with country in brackets), team name, problems solved (11 for the winner, Shanghai Jiao Tong University, down to 1) and total time. The Award column is filled for the top places only: gold, silver and bronze medals and thirteen Place Awards (入賞, "prize-winning places"). Per-problem results and attempts are not given.

    Above the table are the awards: the governor of Ibaraki Prefecture's and the mayor of Tsukuba's awards for the first and second place, and a table of sponsor company awards with the prize and the team that won it. A note links to the official results with last-solution times on the Baylor University system, which are not part of our copy. Text mainly in Japanese.
