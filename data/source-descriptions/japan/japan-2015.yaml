  description: |-
    Commentary by the chief judge, Kiyoshi Ishihata, headed 審判長講評 (Shinpanchō kōhyō, "chief judge's commentary"): a PDF of six pages in Japanese. It opens with statistics: a table of how many teams solved each number of problems (one team solved all eleven), and a table of the results per problem for all 42 teams, giving teams that solved it and that tried without success, and its wrong submissions, in all and by kind (wrong answer, time limit, run error, compiler error). A few paragraphs on the difficulty of the set follow. Then comes a section on each problem A to K, from Decimal Sequences to Min-Max Distance Game, explaining the solution. The contest's name and date are not printed.
