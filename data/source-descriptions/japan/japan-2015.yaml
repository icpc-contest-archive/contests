  title: ICPC 2015 Tsukuba
  language:
  - ja
  - en
  contest_date: '2015-11-29'
  description: |-
    Website of the 2015 ACM-ICPC Asia Tsukuba Regional Contest, in Japanese with some English. The front page gives the dates as 28 to 30 November 2015, University of Tsukuba as host and Tsukuba as the place. The regional pages state the schedule: reception and opening ceremony on 28 November, the contest and award ceremony on 29 November, and an excursion on 30 November. The venue is Tsukuba Capio.

    The site covers both rounds. The domestic (online) contest part holds the overview, registration, rules, scoring and selection rules, lists of registered and pending teams, special awards, photos, messages of support and a results table of the domestic round with the rule under which each team was selected for Tsukuba. The regional part holds the overview, registration, access, system environment, timetable, Java Challenge, a page on spectating and side events with an online trial participation, a programming lesson for children and beginners, messages, a message of the IISF chairperson, and a results page with awards and the final table.

    Our copy holds 36 pages, one of them a redirect stub. The problem statements, judge data and commentary are linked from the regional front page but are not in our copy.
