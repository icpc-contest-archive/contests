    Commentary by the chief judge, Hidehiko Masuhara, headed 審判長講評 (Shinpanchō kōhyō, "chief judge's commentary"): a PDF of three pages in Japanese, with page numbers 14 to 16. It opens with an overview of the ten problems set for five hours, a table of how many teams solved each number of problems, and a table of the results per problem for all 34 teams (teams solving it and submissions). Then comes one paragraph on each problem A to J, from Ginkgo Numbers to Cubic Colonies, outlining the intended solution and how the teams fared on it. The contest's name and date are not printed.
