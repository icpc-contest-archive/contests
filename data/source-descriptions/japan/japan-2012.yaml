  contest_date: '2012-11-18'
  description: |-
    Website of the Asia Regional Contest 2012 in Tokyo, titled "ACM-ICPC 2012 in Tokyo", in English and Japanese, with Tokyo Institute of Technology named as host. Our copy holds 53 pages in 88 saved files. It has the outline of the ACM-ICPC, the domestic contest that selects the Japan-based teams (with a Japanese results page of the domestic contest that marks the 27 teams selected for the regional), eligibility and registration, and the regional contest pages: outline (17 to 19 November 2012 at the National Olympics Memorial Youth Center), schedule, participating teams, contest environment, Java Challenge, access and lodging, standing, FAQ, links and past contests 1998 to 2011.

    The contest documents are inside: the standings page, the team list, a page of links to the problems and judge data, the problem PDF of 28 pages with ten problems A to J, and a zip of judge data with ten input files and ten answer files. The domestic contest's seven problems A to G are there as pages in English and Japanese.

    Sponsor logos, figures and two style sheets are saved with the pages. Links to sponsors and to the ICPC site lead outside our copy.
