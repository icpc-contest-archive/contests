  contest_date: '2004-11-21'
  description: |-
    Website of the 2004 Ehime site of the ICPC Asia regional contest, held at the Center for Information Technology of Ehime University, in English with a few Japanese pages. Our copy holds 85 pages. The contest pages give the outline (contest on 21 November 2004 with trials and a welcome party the day before, nine problems, C, C++ and Java), the team list (27 Japanese and 7 foreign teams), the computing environment, a workshop programme for coaches, an excursion, other Asian regional sites, a Java prize, travel and accommodation, and a photo page. Pages on eligibility, the steps to take part, registration and the domestic contest of 2 July 2004 are included.

    The results page ranks universities by their best team: 19 rows with solved count and score (time), then 15 further teams under Honorable Mention, with marks for the teams going to the World Final. Two teams are marked as champions of other sites: Shanghai Jiaotong University's team as champion of Taipei and a University of Tokyo team as champion of Manila. Problem statements are in a PDF for 2004 and for each earlier regional contest back to 1998, listed on the past-problems page. The domestic contest has its own results and problem pages. Pages of the Ehime University main and English sites are also in our copy.
