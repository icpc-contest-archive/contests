  description: |-
    Standings page headed "The 2004 ACM Asia Programming Contest - Ehime sponsored by IBM", with three boards. The Final Round of 11/21/2004 lists 34 teams with rank, institution and team name, and a citation: 18 teams carry a place from First to Fourteenth followed by the number solved and a second figure (8 solved and 1161 for the first place), and 16 further teams are listed as Honorable Mention without figures.

    The page also holds the Japan nationwide preliminaries of 7/2/2004 with 198 teams, of which 121 carry a place and a number solved and 77 are Honorable Mention, and a board of 7 foreign teams at the Ehime preliminary site, all Honorable Mention. There is no per-problem detail.
