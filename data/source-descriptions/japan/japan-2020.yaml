- url: https://icpc.jp/2020/regional/
  read: '2026-11-16'
  rubric: 1
  copy: japan/japan-2020/website/2026-09-04-live-c9db7a5d
  title: Regional – ICPC 2020 Yokohama
  language:
  - ja
  - en
  contest_date: '2021-03-17'
  description: |-
    Website of ICPC Japan for the 2020 Yokohama regional contest, in Japanese and English. The regional page says the contest was held fully online on 16 and 17 March 2021, and gives the schedule: system test contests from 27 February to 14 March, registration, opening and a rehearsal contest on 16 March, and on 17 March the contest from 9:00 to 14:00, commentaries, awards and a closing party. Other regional pages hold the special rules for the online contest (an honor system with no proctor, one contestant per closed room), the judge system environment (DOMjudge manuals), the tools used for each event, the sponsors' award results for the regional contest and the standings of 40 teams.

    Our copy holds 32 pages, one of them a redirect stub. Besides the regional pages it holds the pages of the Japanese domestic qualifier of 6 November 2020 (eligibility, registration and registration status, rules, scoring, team selection, preparation, system rental and results of 297 teams) and the sponsorship pages with company awards, messages from sponsors and sponsors' announcements of their own contests.

    The problems PDF, the commentaries slides, the dataset archive and the recording of the Yes/No and award session are linked from the front page, and the judge system manuals from the environment page, but they lead to other servers and are not part of our copy.
