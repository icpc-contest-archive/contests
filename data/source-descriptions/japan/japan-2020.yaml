    Dashboard of the QOJ.ac contest 2020-2021 ICPC Asia Pacific Yokohama Regional, which the page says is also known as Moscow International Workshop 2021, Day 3, Japanese Contest. It lists eleven problems, A (Three-Axis Views) to K (Suffixes may Contain Prefixes). The page shows an ICPC ruleset with 20 minutes of penalty, a submission limit of 1000 per problem, and links to attachments labelled Statements (en) and Statements (en) (MW). The notice and questions tables are empty.

