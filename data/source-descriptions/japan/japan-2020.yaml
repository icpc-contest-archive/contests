- url: https://icpcarchive.github.io/Asia-Pacific/Japan/The-2020-ICPC-Asia-Yokohama-Regional-Contest/tutorials.pdf
  read: '2026-11-23'
  rubric: 1
  copy: japan/japan-2020/editorial/20261123-live-1b6dac40/tutorials.pdf
  title: Commentaries on Problems
  language:
  - en
  problems: 11
  pages: 79
  description: |-
    Slides of the judge team's commentaries on the problems of the ICPC 2020 Asia Yokohama Regional: a PDF of 79 pages in English covering all eleven problems, A to K. The opening slides chart, for each problem, the number of teams that attempted and solved it at the freeze, and the number of teams per number of problems solved at the freeze, with the same counts for 2019 and 2018 for comparison.

    The problems are then taken in decreasing order of the number of teams that attempted them (A, B, J, G, I, E, H, C, K, F, D), each with a title slide, the story or problem statement in brief and the solution.
