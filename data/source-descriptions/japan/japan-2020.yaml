    Official problem set of the Yokohama regional as a PDF of 29 pages. The cover names ICPC Asia Pacific Regionals 2020 and shows sponsor logos; a header at the start of each problem gives the contest date 2021-03-17. It holds eleven problems, A (Three-Axis Views) to K (Suffixes may Contain Prefixes). Each problem has a statement in English with a time limit, input and output format and sample input and output. No test data or solutions.
