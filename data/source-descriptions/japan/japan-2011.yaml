  contest_date: '2011-11-13'
  description: |-
    Website of the 2011 Asia Regional Contest in Fukuoka, in English with a Japanese version of most pages, signed in its footer by the ACM-ICPC Fukuoka executive committee (ACM-ICPC福岡大会実行委員会). The regional contest took place at the INAMORI Center, Kyushu University. Our copy holds 52 pages, four of them account login and registration forms. The rest are the outline; the domestic contest (outline, rules, scoring rules, selection rules, simulation system rental, problems, result); the regional contest (outline, time table for 12 to 14 November, participating teams, contest environment, problems and judge data, standing, a photos page that links to an external album, access, and an apology about the Eclipse system failing during the contest); registration and eligibility; past contests; links and contact.

    The regional problems are a PDF of 34 pages with problems A to J. The domestic problems A to G, dated 2011/6/24, are in an HTML page in English and another in Japanese, and the archive of their inputs and example outputs is saved. The judge data of the regional contest is linked as a zip file that is not in our copy.
