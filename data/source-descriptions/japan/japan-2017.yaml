  title: Commentaries on Problems
  language:
  - en
  problems: 11
  pages: 109
  description: |-
    Slides of the judge team's commentaries on the problems of the ACM ICPC 2017 Asia Tsukuba Regional: a PDF of 109 pages in English covering all eleven problems, A to K. The opening slides note what changed from previous years (Python 2 and 3 added; the first three problems are the easiest and the rest are in random order), give the judges' estimated order of difficulty and predicted number of correct answers per problem, compare these with the actual numbers, and chart how many teams solved how many problems.

    Each problem then has a title slide followed by a summary of the task and the solution; the section on H, Homework, is the longest, and the last slide gives further references for K, Counting Cycles.
