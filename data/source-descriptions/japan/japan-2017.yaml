  title: ICPC 2017 Tsukuba
  language:
  - ja
  - en
  problems: 11
  description: |-
    Website of the 2017 ACM-ICPC Asia Tsukuba Regional Contest, in Japanese with English passages on some pages. The front page states that the contest was held on 16 and 17 December 2017 at Tsukuba Capio, that 50 teams including 7 foreign teams took part, and that the University of Tokyo team Cxiv-Dxiv won. Tsukuba-Gakuin University is named as host university; the organisers are the organising committee and the International Information Science Foundation, with Ibaraki Prefecture and Tsukuba City as co-organisers.

    Our copy holds 40 pages. They cover eligibility; the national qualifier (registration, rules, scoring and team selection rules, system rental, sponsor awards, photos, and a results page of the qualifier held on 14 July 2017); and the regional contest: registration, the computing environment (keyboard, Python 2 and 3 modules, a trial system DVD), information for contestants and coaches, a note from the judges on problem order, the timetable for 16 to 18 December, sponsor messages, special awards, photos, team photos, a page on the road to the World Finals, the final standings of the 50 teams, and the universities selected for the 2018 World Finals. One page lists the organising committee, judges and liaison members.

    The front page links the problem set, a detailed scoreboard, the chief judge's report and slides, and the judging data. Those files are on other servers and are not part of our copy of the site.
