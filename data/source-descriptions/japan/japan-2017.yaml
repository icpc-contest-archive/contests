  description: |-
    Scoreboard headed "ICPC2017 Tsukuba Results": 50 teams against 11 problems labelled A to K, in final order from rank 1 to rank 50. Each row gives the rank, the number of problems solved with a figure in brackets next to it (11 and 1261 for the first team), the team name, the university, and a bracketed figure such as 1/4 after the university name. For every problem the cell shows the solve time in hours and minutes followed by a bracketed (+n) count; an unsolved problem shows a dash, with a (+n) count where attempts were made. Cells are coloured as solved, rejected or unattempted, each university name is preceded by a small flag image, and each of the eleven problem letters in the header row carries a coloured flag icon.

    The first place is Cxiv-Dxiv of The University of Tokyo with all 11 problems solved; the last row, CPS Agents of Tokyo Denki University, has none. The page carries no date and no medal marks.
