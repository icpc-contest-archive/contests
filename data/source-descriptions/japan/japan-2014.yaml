  read: '2026-11-16'
  rubric: 1
  copy: japan/japan-2014/website/2026-09-04-live-e16f7d2d
  title: ICPC 2014 Waseda
  language:
  - ja
  - en
  contest_date: '2014-10-19'
  description: |-
    Website of the 2014 ACM-ICPC Asia Tokyo Regional Contest, hosted by Waseda University and the International Information Science Foundation, in Japanese and English. The front page reports that the event was held at the National Olympics Memorial Youth Center in Tokyo on 18-20 October 2014, with the contest itself on 19 October, and that 40 teams took part: 35 Japan-based teams selected from 326 teams in the domestic online contest, and 5 from China and Taiwan. It lists supporters, sponsors and the top teams.

    The site has two parts. The domestic contest part holds an overview, registration pages, rules, scoring and selection rules, the seven domestic problems A to G with statements, and a results page with two tables, one of 215 teams with rank, solved, time, selection rule and award, and one of 111 teams under Honorable mention. The regional part holds a timetable, contest overview, system environment, a teams page, a problems and judge data page, a standings page, Java Challenge, a photos page, local access information, registration and volunteer pages. There are also messages from the director and an organization page.

    Our copy holds 31 pages, one of them a redirect stub. The regional teams page only links to a list on another server, the photos page only links to an album elsewhere, and the problem PDF and judge data archive linked from the problems page are not part of our copy.
