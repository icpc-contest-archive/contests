  description: |-
    Final standings from the contest website: 40 teams with team rank, university rank, team name, university, number of problems solved (10 for the winner, The University of Tokyo, down to 3) and penalty time. An Award column marks the gold, silver and bronze medals, the 3rd team rank tie and twelve Place Awards (入賞, "prize-winning places"). Per-problem results and numbers of attempts are not given.

    Above the table the page lists the sponsors' awards: first solution, last solution and second last solution, the 1st, 10th, 20th and 29th team rank awards, and the 2^n awards for the 1st, 2nd, 4th, 8th, 16th and 32nd ranks. It links to the official results on the Baylor University system, which are not part of our copy. Text in Japanese and English.
