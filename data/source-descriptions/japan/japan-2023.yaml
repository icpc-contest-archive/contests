  description: |-
    Contest dashboard in a Codeforces gym for the 2023-2024 ICPC, Asia Yokohama Regional Contest 2023, marked Finished, host Tokyo Institute of Technology, Japan, November 25-26, 2023. It lists eleven problems, A Yokohama Phenomena to K Probing the Disk, each with standard input/output, a time limit (2 to 10 seconds) and a 1024 MB memory limit, and a count marked x beside each problem. Links to Statements (en) and Editorial (en) are shown. One announcement dated 2023-12-01 on Problem K points to a local testing tool in the judge's archive. The page also holds the virtual participation notice and the forms for asking questions and adding announcements.

    The statements, editorial, submissions and standings are separate pages and are not part of our copy.
