  description: |-
    Editorial as a slide deck of 100 pages, in English, titled Commentaries on Problems and marked JUDGE TEAM, ICPC 2023 2024 Asia Yokohama Regional. The first slides give statistics of the contest at the freeze: the number of problems solved against the number of teams, compared with last year, and the number of teams per problem with the estimated order of difficulty. They are followed by a section for each of the eleven problems A to K, from A Yokohama Phenomena to K Probing the Disk. Each section names the proposer and author and explains the problem and its solution, with the complexity and figures where needed. The last section, on problem K, ends the deck.
