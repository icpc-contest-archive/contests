  title: Regional Contest – ICPC 2023 Yokohama
  language:
  - en
  - ja
  description: |-
    Website of ICPC Japan for the 2023 Yokohama regional contest, mostly in English for the regional pages and in Japanese for the domestic qualifier pages. The regional front page thanks the participants and lists the contest information (rules, contest program, information from the judges, computing environment, photos), the links for spectators (standings, problems, commentaries, a mirror contest at Aizu Online Judge, the judges' report in Japanese, judge data), videos, the venue (Yokohama Sanbo Hall) and the rules for foreign teams (capacity ten). The schedule gives registration and rehearsal on Saturday 25 November, the contest on Sunday 26 November from 9:30 to 14:30, commentaries on the problems and the award and closing ceremony that afternoon.

    Our copy holds 33 pages, one of which is only a redirect. Regional pages: the information from the judges (problems A and B are the easiest; interactive problems explained), the computing environment (provided computer, Ubuntu, DOMjudge manuals, compiler options, Python modules, a trial system image). The rest covers the Japanese domestic qualifier (registration, proctors, rules, scoring, selection, and a results page with 301 teams, of which 50 were selected for Yokohama), eligibility, sponsor messages and awards, and the judges.

    The standings, problem set, commentaries, judge data and videos are linked to other addresses and are not part of our copy.
