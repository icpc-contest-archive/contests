  description: |-
    Standings of the 2023 ICPC Asia Yokohama Regional Contest: 58 teams with rank, team, institution, number solved, time and a citation. Places 1 to 29 carry the citations First Place to Twenty-ninth Place and the other 29 teams are marked Honorable Mention. Speed Star (The University of Tokyo) is first with 11 solved in 933, ahead of tonosama (Institute of Science Tokyo) with 10. Most teams are from Japanese institutions; teams from Taiwanese universities are listed among them. There is no per-problem detail. Some institutions are named in their later forms, for example Institute of Science Tokyo and The University of Osaka.
