  description: |-
    Official problem set as a PDF of 22 pages, in English. The cover names the ICPC Asia Pacific Contests, the 2023 Asia Yokohama Regional Contest and 2023-2024 Asia Pacific, and shows sponsor logos. Each problem starts on a page headed Asia Regional Contest, Yokohama, 2023-11-26. It holds eleven problems, A to K, from A Yokohama Phenomena to K Probing the Disk, with time limits of 2 to 10 seconds. Each has a statement with input and output formats and sample cases, except problem K, which is interactive and has a sample interaction instead. No test data or solutions.
