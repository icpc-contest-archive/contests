- url: https://icpc.jp/2018/regional/
  read: '2026-11-16'
  rubric: 1
  copy: japan/japan-2018/website/2026-09-04-live-575e9100
  title: Asia Yokohama Regional Contest 2018 – ICPC 2018 Yokohama
  language:
  - ja
  - en
  contest_date: '2018-12-09'
  description: |-
    Website of the ICPC 2018 Yokohama organisers, in Japanese and English. Our copy holds 37 pages. The regional contest pages are in English: a front page thanking participants and noting that the 60 teams were the largest number ever for a regional contest in Japan, the schedule for 8 and 9 December 2018 at Yokohama Sanbo Hall and Kanagawa Kenmin Hall, venue and hotel notes, the computing environment (Lenovo ThinkPad L580 laptops, Ubuntu 16.04) with Python module lists, a System Trial DVD page, a contest documents page, information for contestants and coaches, the problem order, a judges commentaries and data page, the industrial sponsor awards, and a results page with the regional standings.

    The pages for the Japanese domestic round are in Japanese: registration, rules, scoring, selection, special measures, a table of registration status by team ID, and the domestic results page for the round of 6 July 2018, a table of 433 teams with rank, team name, institution, problems solved, time, the selection rule that applied and an award mark, with 45 teams chosen for Yokohama. The sponsorship pages carry sponsor messages and award results, in Japanese and English.

    The live standings, the problem PDFs, the contest documents and the judges commentaries are linked from the pages as files on other servers and are not part of our copy.
