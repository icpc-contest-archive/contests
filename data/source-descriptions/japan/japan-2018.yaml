  description: |-
    Judges' commentary slides in English, 92 pages, from the judge team of the regional. The opening slides give the estimated order of difficulty of problems A to K (by coding and by analysis), the predicted number of correct answers per problem against the number actually solved, and a chart of how many teams solved 0 to 11 problems. Then come solution slides for all eleven problems, each with a problem summary and the solution. The last pages are a gallery of four judge test cases with their sizes and minimum and maximum values, and a closing slide asking what happened in the last 30 minutes.
