  title: ACM/ICPC International Collegiate Programming Contest, Asia Regional Contest 2005, Japan, Tokyo
  language:
  - en
  - ja
  contest_date: '2005-11-04'
  description: |-
    Website of the 2005 Tokyo site of the ICPC Asia regional contest, held at Tokyo University of Technology in Hachioji, in English with Japanese pages and a Q and A page in Japanese. Our copy holds 101 pages. The regional pages give the outline, the team list (28 Japanese teams including a wildcard team, and 8 foreign teams), the schedule for 3 to 5 November 2005, a Java contest (Robocode) with its result, a coaches' workshop whose programme reads "coming soon", an excursion, an access map and the final results. Eligibility, registration and the nationwide internet (domestic) contest with its rules, team selection, results and problems are also covered.

    The results page lists 18 teams with number solved, time and final standing (11 of them carry a standing), then 18 teams under Honorable Mention. The problems page of the regional contest links a problems PDF and input and sample-output files for problems A to I; those files are not in our copy. Problem PDFs of the regional contests from 1998 to 2004 are in our copy. Some pages are from the university's own site.
