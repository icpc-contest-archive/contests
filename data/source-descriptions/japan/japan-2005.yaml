  description: |-
    Standings page headed "The 2005 ACM Asia Programming Contest - Tokyo sponsored by IBM", with three boards. The Final Round of 11/4/2005 lists 36 teams with rank, institution and team name, and a citation: 18 teams carry a place from First to Eleventh followed by the number solved and a second figure (8 solved and 1070 for the first place), and 18 further teams are listed as Honorable Mention without figures.

    The page also holds the nationwide preliminary of 7/1/2005 on the Tokyo Internet site, 193 teams all marked Honorable Mention, and a board for foreign teams registered at the Tokyo site, 8 teams all marked Honorable Mention. There is no per-problem detail.
