  title: The 2013 ACM-ICPC Asia Aizu Regional Contest
  language:
  - en
  - ja
  contest_date: '2013-11-24'
  description: |-
    Website of The 2013 ACM-ICPC Asia Aizu Regional Contest, 23 to 25 November 2013, hosted by the University of Aizu, in English with some pages in Japanese. Our copy holds 80 saved files: 36 HTML pages and four PDFs, besides style sheets, scripts and images. The regional contest section covers the overview, team list, team introductions (a PDF), schedule, equipment, local information, excursion, results and problem set; its workshop link leads to another site. Other pages are news, outline, registration and eligibility, a photos page, Java Challenge (with its top four), past regional contests in Japan, links and contacts, and a poster PDF. The domestic contest section has overview, rules, selection, system rental, standings and a problem set of six problems A to F.

    The contest documents inside are the results page with 39 teams, the team list, and the regional problem set as a PDF of 28 pages with ten problems A to J. A PC² contestant's guide PDF of four pages is also saved. The judge data linked from the regional pages is not in our copy.

    Links to the ICPC site and other sites lead outside our copy.
