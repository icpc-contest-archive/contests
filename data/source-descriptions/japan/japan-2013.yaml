    Contest dashboard on QOJ.ac, filed under ICPC, Regionals, Asia Pacific, Japan. It lists ten problems A to J by title, from Equal Sum Sets to C(O|W|A*RD*|S)* CROSSWORD Puzzle, with links to the statements and to an attachment of the statements in English, and has tabs for submissions, standings and external standings. The side panel marks the contest as ended and gives its settings: ICPC ruleset, 20 minutes penalty, scoreboard frozen after 4:00:00, and a virtual contest open to join.
