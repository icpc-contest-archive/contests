  title: 審判長講評
  title_en: Chief judge's commentary
  language:
  - ja
  problems: 10
  pages: 3
  description: |-
    Commentary by the chief judge, Kiminori Matsuzaki, headed 審判長講評 (Shinpanchō kōhyō, "chief judge's commentary"): a PDF of three pages in Japanese, with page numbers 15 to 17. It opens with an overview of the 2013 set of ten problems for five hours: every team solved A and B, and the best teams solved nine. A table gives how many teams solved each number of problems, and a second, for all 40 teams, gives per problem its field, the submissions, the teams that solved it and the time of the first solve in minutes. Then comes one paragraph on each problem A to J, from Equal Sum Sets to C(O|W|A*RD*|S)* CROSSWORD Puzzle, outlining the intended solution and how teams fared; J was not solved.
