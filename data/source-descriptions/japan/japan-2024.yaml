    Scoreboard titled ICPC 2024 Asia Yokohama Regional Standings: 55 teams against 12 problems, A to L, each problem column headed by a coloured flag. Each team row gives rank, number solved with the total penalty in parentheses, team name, university, a bracketed pair such as [1/3] after the university, and for each problem the solve time in hours and minutes with the number of extra attempts as (+n), or only (+n) for unsolved attempts. First place is Screenwalkers (The University of Tokyo) with 11 solved. A last row gives, for each problem, the teams that solved it out of the teams that attempted it, and the submissions.

    The style sheet is embedded in the page; the page carries no script and no further links.
