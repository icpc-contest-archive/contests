  copy: japan/japan-2024/website/2026-09-04-live-85568a27
  title: Regional Contest – ICPC 2024 Yokohama
  language:
  - en
  - ja
  description: |-
    Website of the ICPC 2024 Yokohama organising committee for the 2024 Asia Yokohama Regional Contest, in Japanese and English. The regional page gives the contest information, the timetable (registration, rehearsal and team introductions on 21 December; the contest from 09:30 to 14:30 on 22 December, followed by commentaries and the closing ceremony) and the venue, Yokohama Sanbo Hall. Further pages cover the computing environment (hardware, software versions, compiler options, Python modules, system trial image), information from the judges, the list of judges, and sponsor messages and company awards, including the company award results of the regional contest.

    The site also holds the pages of the Japanese domestic qualifier of 5 July 2024: eligibility, registration steps and FAQ, rules, scoring rules, selection rules, and a results page that states 363 teams and 50 teams selected for the regional.

    Our copy has 34 pages, all HTML; one is only a redirect stub, and no style sheets or images were kept. The regional page links to the standings, problem set PDF, commentaries, judge data, photos and videos on other servers; those are not part of this copy.
