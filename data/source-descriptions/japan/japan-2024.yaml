    Problem set: a PDF of 24 pages with a cover page that names the contest, followed by 12 problems labelled A to L, starting with A, Ribbon on the Christmas Present, and ending with L, Peculiar Protocol. Each problem has a time limit and a statement in English. Eleven problems have input and output sections and sample input and output; problem G is interactive and has an interaction section and a sample interaction instead. The cover states no date. No test data and no solutions.
