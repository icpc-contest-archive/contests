  copy: japan/japan-2001/website/2026-10-20-wayback-068cdc44
  title: ICPC Asia Regional Contest, Japan Hakodate
  language:
  - en
  - ja
  contest_date: '2001-11-10'
  description: |-
    Website of the Asia Regional Contest held in Hakodate on 10 and 11 November 2001 at Future University - Hakodate, sponsored by the ACM/ICPC Hakodate Steering Committee, Future University - Hakodate and the ACM Japan Chapter. The seed page is a frameset with a menu and a main page, mostly in English, with Japanese versions of the menu and main pages. The pages cover the announcement and news list, the Hakodate contest rules, hotel information, the computer environment (hardware, keyboards), an FAQ, links, the schedule of 10 and 11 November, posters in Japanese and English and a Japanese leaflet (three one-page PDFs), a photo album of four pages, and a page headed ACM ICPC Qualification Status with the final standings of the domestic qualifying round of 5 October. The Asia-specific rules are only linked to another server.

    The site also holds the final standings of the contest and the problems: problems.pdf of 21 pages, a tar.gz of judge data and eight plain-text input files for problems A to H.

    Our copy holds 91 pages (HTML, text and PDF files), plus the judge data archive and 22 GIF images. 35 of the pages are the contest's own; the other 56 are pages of the university's general site (admissions, departments, news) and are not about the contest. The photographs of the photo album are not in our copy, only their captions.
