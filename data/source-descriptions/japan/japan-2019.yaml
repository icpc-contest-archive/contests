    Dashboard of a QOJ.ac contest named Petrozavodsk Winter 2020, Day 2, Japanese Contest, which the page says is also known as the 2019-2020 ICPC Asia Pacific Yokohama Regional. It lists eleven problems, A (Fast Forwarding) to K (Draw in Straight Lines); problem H is spelled Parehtneses Editor. The page shows an ICPC ruleset with 20 minutes of penalty, a submission limit of 1000 per problem, and links to attachments labelled Statements (en), Statements (PTZ) (en) and Tutorial (en). The notice and questions tables are empty.

