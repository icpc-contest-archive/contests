    Page of the contest website headed ICPC Asia Yokohama Regional Contest Documents. It tells teams to download, print and bring the documents to the contest, because only printed material is allowed in the contest area, and lists a Contest Program (uploaded 12 November 2019) and a Contest Information sheet (uploaded 11 November 2019). It also links the pages on the easiest problems and on information for coaches and contestants.

