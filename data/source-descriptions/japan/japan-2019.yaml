- url: https://icpc.jp/2019/regional/
  read: '2026-11-16'
  rubric: 1
  copy: japan/japan-2019/website/2026-09-04-live-10235a4a
  title: Asia Yokohama Regional Contest 2019 – ICPC 2019 Yokohama
  language:
  - en
  - ja
  contest_date: '2019-11-17'
  description: |-
    Website of ICPC Japan for the 2019 Yokohama regional contest, in English and Japanese. The regional contest page gives the schedule (registration, rehearsal and team introduction on 16 November; check-in, a contest from 9:30 to 14:30, commentaries, award ceremony and closing party on 17 November; an office tour on 18 November), the two venues in Yokohama, the hotel note, and registration for foreign teams (capacity 15). The other regional pages cover the computing environment (the computer provided to each team, Ubuntu 18.04 and the installed software, compile options, Python module lists, a trial system DVD), a note that problems A and B are assumed to be the easiest two, contest documents, information for coaches and contestants, accommodation and travel subsidies, the standings of 65 teams, and the commentaries from the judges.

    Our copy holds 38 pages, one of them a redirect stub. Besides the regional pages it holds the pages of the Japanese domestic qualifier of 12 July 2019 (eligibility, team and proctor registration, rules, scoring, team selection, photos, results with 495 teams), and the sponsorship pages: company awards for the domestic and regional contests, messages from sponsors, and sponsors' announcements of their own contests.

    The problem statements, the contest program, the contest information sheet, the commentaries PDF and slides, the judge data, the system manuals, the live standings and the photos are linked from the pages but lead to other servers and are not part of our copy.
