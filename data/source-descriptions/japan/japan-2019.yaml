    Problem list of the Yokohama regional on Baekjoon Online Judge, in Korean. It lists eleven problems, A to K, with judge problem numbers 18210 to 18220, the English problem titles, a multilingual mark, and the judge's counts of accepted users, submissions and accepted ratio. Problems I and J are marked special judge. The statements are on separate pages of the judge, not in this page.

