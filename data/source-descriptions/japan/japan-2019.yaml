  description: |-
    Judge team's slides with commentaries on the problems of the Yokohama regional, 99 pages in English. The opening slides are charts titled Predicted number of correct answers, Estimated vs. Solved at the freeze and Number solved vs number of teams at the freeze, followed by the order of the problems from most to fewest solving teams (A, B, H, E, G, I, C, D, F, K, J).

    The eleven problems, A to K, follow in the order above, most with slides summarising the problem and all with slides explaining the solution; problem D goes from its title slide straight to the seven steps of its method, and a slide reading Thank you very much for your attention stands between D and F. Some also have a story or key observations, and problem J ends with seven slides on correctness.
