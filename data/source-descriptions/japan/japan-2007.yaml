  title: ACM/ICPC Asia Regional Contest 2007, Tokyo, Japan
  language:
  - en
  - ja
  description: |-
    Website of the Asia Regional Contest held in Tokyo, hosted by the University of Tokyo, in English with a parallel Japanese section. The home page gives the dates (November 2-3, 2007), the contest site (the National Olympic Memorial Youth Center) and the host, and announces that results, problems, input data and output examples of the regional contest are available. It is built as frames with a menu for the contest outline, the regional contest, the domestic contest and registration.

    Our copy holds 59 files, 25 of them pages. They include the regional problem set as a PDF of 24 pages (problems A to J), a page of links to input data and output examples for A to J, the domestic contest page with problem texts A to F in English (A also in Japanese), the domestic contest results in Japanese, and a list of sponsors in Japanese. The menu pages for the outline, the regional results and registration are not in our copy, and neither are the data files that the data pages link to.
