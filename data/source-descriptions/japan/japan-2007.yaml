  contest_date: '2007-11-03'
  teams: 50
  description: |-
    Final standings of the 2007 ACM Asia Programming Contest - Tokyo, held 3 November 2007, as a View Standings page: 50 teams. The first 33 rows carry a rank (1 to 22, with ties) and give university and team name, a citation (First Place, Second Place and so on), the number of problems solved and the time; the other 17 teams are listed without rank, solved or time as Honorable Mention. Kyoto University is first with 9 solved. No per-problem results and no attempts.

    The page also lists, as Honorable Mention only, the teams of two preliminary sites: 256 teams of the Japan Nationwide Contest held on 6 July 2007, and 9 teams of the Non-Japan-based Team Tokyo Registration Site (3 November 2007).
