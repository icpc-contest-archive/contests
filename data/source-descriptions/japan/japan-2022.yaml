  title: Asia Yokohama Regional Contest 2022 – ICPC 2022 Yokohama
  language:
  - en
  - ja
  description: |-
    Website of ICPC Japan for the 2022 Asia Yokohama Regional Contest, mostly in English for the regional pages and in Japanese for the domestic qualifier pages. The regional front page thanks the participants and gives the contest information, the schedule (registration and rehearsal on Tuesday 27 December, the contest on Wednesday 28 December from 9:30 to 14:30), the venue (Yokohama Sanbo Hall), a note that hotels are not reserved, and the rules for foreign teams (registration closed, capacity five teams). It links the final standings, the problems, a mirror contest, the judges' commentary and report, judge data and videos.

    Our copy holds 34 pages, one of which is only a redirect. Regional pages: notes about the problems (A and B are the easiest; interactive problems explained), the computing environment (provided computer, Ubuntu, DOMjudge manuals, compiler options, Python modules, a trial system image), information for coaches and contestants, the COVID-19 policy and the contest documents list. The rest covers the Japanese domestic qualifier (registration, rules, scoring, selection, and a results page with 298 teams), world finals selection, sponsor messages and awards, eligibility and the judges.

    The standings, problem set, judge data and videos are linked to other addresses and are not part of our copy.
