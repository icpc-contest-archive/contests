    Contest dashboard in a Codeforces gym for the 2022-2023 ICPC, Asia Yokohama Regional Contest 2022, marked Finished, host Keio University, Japan, December 27-28, 2022. It lists eleven problems, A Hasty Santa Claus to K New Year Festival, each with standard input/output, a time limit (2 to 15 seconds) and a 1024 MB memory limit, and a count marked x beside each problem. The page also holds the virtual participation notice and the forms for asking questions and adding announcements.

    The statements, submissions and standings are separate pages and are not part of our copy.
