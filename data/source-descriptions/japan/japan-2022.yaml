  description: |-
    Official problem set as a PDF of 26 pages, in English. The cover names the ICPC Asia Pacific Contests and the Asia Yokohama Regional Contest and shows sponsor logos; its embedded text comes out of text extraction as control characters, but the page renders normally. Each problem starts on a page headed Asia Regional Contest, Yokohama, 2022-12-28. It holds eleven problems, A to K, from A Hasty Santa Claus to K New Year Festival, with time limits of 2 to 10 seconds. Each has a statement with input and output formats and sample cases, except problem B, which is interactive and has an interaction description and a sample interaction instead. No test data or solutions.
