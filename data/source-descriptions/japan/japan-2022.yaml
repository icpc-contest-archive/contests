  description: |-
    Standings of the 2022 ICPC Asia Yokohama Regional Contest: 43 teams with rank, team, institution, number solved, time and a citation. Places 1 to 21 carry the citations First Place to Twenty-first Place and the other 22 teams are marked Honorable Mention. tonosama (Institute of Science Tokyo) is first with 9 solved in 1209, ahead of Time Manipulators (The University of Tokyo) with 9 solved in 1244. There is no per-problem detail. Some institutions are named in their later forms, for example Institute of Science Tokyo and The University of Osaka.
