  read: '2026-11-16'
  rubric: 1
  copy: japan/japan-2000/website/2026-10-20-wayback-c6c253f1
  title: ICPC2000 Home
  language:
  - en
  - ja
  contest_date: '2000-11-12'
  problems: 8
  description: |-
    Website of the Asian Regional Contest, Japan, Tsukuba, 11-12 November 2000, in English with a parallel Japanese version. Our copy holds 142 files, of which 113 are pages. The home page states that the contest at the EPOCAL Tsukuba International Congress Center "was finished successfully" and names the sponsors (ACM/ICPC Tsukuba Steering Committee, University of Tsukuba, ACM Japan Chapter), co-sponsors, supporters and supporting companies. The menu leads to the rules of the Tsukuba contest (the Asia regional rules are a link to another site), the organizing committee, links to past problems, hotel guidance, links, and a poster as a one-page PDF in English and in Japanese.

    The contest section has the official standings, a page with the schedule and the contest environment (PCs, software, keyboard rule), a list of 37 teams from 25 institutions with a page for each team (36 of those pages are in our copy), and a photo album. A separate standings page lists 20 teams with rank, name, problems solved and penalty, marked "Last updated Sun Nov 12 14:07:39 JST 2000". The eight problems A to H, Lost in Space to Ether Geometry, are given as HTML pages and as one 27-page PDF, with the judge's data as eight text files. A further set of pages covers the domestic preliminary contest of 13 October 2000: five problems A to E in HTML, each with four data files.

    Not in our copy: the photographs, the team-photo list and the after-contest photo page, the live video page, and some figures in the problem pages.
