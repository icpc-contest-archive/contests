  description: |-
    Category page of the Baekjoon Online Judge, in Korean, for the Asia Regional Contest 2006 in Yokohama, filed under ICPC Regionals, Asia Pacific, Japan. It lists nine problems A to I as judge problems numbered 3905 to 3913, each with its title and the judge's counts of users who solved it, submissions and accuracy. Problems A, B, G, H and I carry their English titles (How I Wonder What You Are!, How I Mathematician Wonder What You Are!, Polygons on the Grid, The Best Name for Your Baby, Enjoyable Communication); C, D, E and F carry Korean titles.

    Only the list is in our copy, not the statements. The page includes the judge's menus and Korean interface text.
