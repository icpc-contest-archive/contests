  contest_date: '2006-11-05'
  description: |-
    Website of the 2006 Yokohama site of the ICPC Asia regional contest, held at Keio University's Yagami Campus, built as a frame set with the Keio University copyright. Pages are in English, with Japanese versions of some. Our copy holds 60 pages. The regional pages give an overview with the team list (29 domestic (Japanese) and 7 foreign teams) and the computing environment, the schedule for 4 to 6 November 2006, the Java Challenge (CodeBear) with its top three, the workshop for coaches with its programme, local information, the excursion, the results and the problems. A news page lists announcements from April to October 2006. The registration, eligibility and domestic (internet) contest pages are included, with the domestic rules, team selection, problem and result pages, and a list of past regional contests.

    The results page lists 23 teams with official rank, team rank, solved and time, then 13 teams under Honorable Mention. The problems page links a PDF of the problems and two zip files of sample and judging input and output; the zip files are not in our copy, and the PDF in our copy breaks off partway. Of the four slide files linked from the workshop page, one is in our copy.
