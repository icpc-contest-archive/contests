    Standings page headed "The 2006 ACM Asia Programming Contest - Yokohama sponsored by IBM", with three boards. The Final Round of 11/5/2006 lists 36 teams with rank, institution and team name, and a citation: 23 teams carry a place from First to Thirteenth followed by the number solved and a second figure (7 solved and 916 for the first place), and 13 further teams are listed as Honorable Mention without figures.

    The page also holds the Japan Nationwide Programming Contest (Internet) preliminary of 6/30/2006, 208 teams all marked Honorable Mention, and a board for non-Japan-based teams registered at the Yokohama site, 7 teams all marked Honorable Mention. There is no per-problem detail.
