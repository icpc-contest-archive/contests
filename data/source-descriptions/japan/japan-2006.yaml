  title: ACM/ICPC International Collegiate Programming Contest, Asia Regional Contest 2006, Yokohama, Japan
  language:
  - en
  - ja
  contest_date: '2006-11-05'
  description: |-
    Website of the ACM/ICPC Asia Regional Contest 2006 in Yokohama, held at Keio University, in English with a parallel Japanese version. Our copy holds 66 saved files, 60 of them pages, of a frame-based site: an outline, the domestic (nationwide Internet) contest with rules, team selection, problems and results, registration and eligibility, and the regional contest with overview, schedule, Java Challenge, coaches' workshop, local information, excursion, results and problems.

    The overview gives the on-site contest as 4 to 5 November 2006 at Keio University's Yagami Campus (the front page names 4 November as trial use and 5 November as contest day), with C, C++ and Java allowed, and a list of participating teams. The results page is a table of 36 teams with official rank, team rank, team name, university, problems solved and time: 23 ranked teams and 13 more as Honorable Mention. The domestic contest result page lists 86 teams with rank, result, problems solved and score. The problems page links a PDF of all problems and zip files of sample and judging input and output; the PDF in our copy is cut short and cannot be opened, and those two zip files are not in the crawl. The crawl does hold a zip of the Java Challenge program and one coaches' workshop slide file.

    Most navigation images and sponsor logos are missing from our copy, as are three Japanese pages beyond the crawl depth.
