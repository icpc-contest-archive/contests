  - en
  teams: 36
  description: |-
    Final results page of the regional contest on the host's website: 36 teams with official rank, team rank, team name, university, problems solved and time. A note explains the Asia-Specific Rules, under which the official rank is based on the top team of each university and other teams of the same university tie with the next ranked team of another university. The 23 ranked teams run from first place (Lacotix, Shanghai Jiao Tong University, 7 solved, 916) to thirteenth official rank; 13 further teams are listed as Honorable Mention with no figures. No per-problem detail.

    The page's menu links to overview, schedule, Java Challenge, workshop, local information, excursion and problems.
