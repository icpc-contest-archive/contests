  description: |-
    Standings page from the ICPC site for The 2006 ACM Asia Programming Contest - Yokohama, sponsored by IBM, with three boards. The Final Round of the Asia Yokohama on-site regional contest, 5 November 2006, lists 36 teams as university and team name with a citation: places First to Thirteenth Place with problems solved and time for the 23 teams that solved at least two problems, and 13 teams as Honorable Mention without figures. First place is Lacotix of Shanghai Jiao Tong University with 7 solved and time 916.

    The other two boards are preliminary sites and list team and citation only, all as Honorable Mention: the Japan Nationwide Programming Contest (Internet) of 30 June 2006 with 208 teams, and the non-Japan-based team registration site of 5 November 2006 with 7 teams. No per-problem detail.
