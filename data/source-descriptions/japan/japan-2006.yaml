  description: |-
    Problem statements in English, a PDF of 22 pages with no cover, holding nine problems in contest order: How I Wonder What You Are!, How I Mathematician Wonder What You Are!, Cubic Eight-Puzzle, Sum of Different Primes, Manhattan Wiring, Power Calculus, Polygons on the Grid, The Best Name for Your Baby and Enjoyable Commutation. Each has its statement, input and output format and sample input and output.

    The pages are of two kinds. Seven problems are printed with a number before the title (1373, 1571, 1604, 1213, 1214, 1374, 1375) and running heads reading 'Universidad de Valladolid OJ'. Problems G (Polygons on the Grid, pages 15 and 16) and I (Enjoyable Commutation, pages 20 to 22) are pages of the contest's own set, headed 'ACM International Collegiate Programming Contest, Asia Regional Contest, Yokohama, 2006-11-05', with the problem letter, an input file name such as G.txt and the original page numbers 16, 17 and 21 to 23.
