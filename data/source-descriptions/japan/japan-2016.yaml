  copy: japan/japan-2016/website/2026-09-04-live-58ae88d1
  title: ICPC 2016 Tsukuba
  language:
  - ja
  - en
  description: |-
    Website of the 2016 Tsukuba regional contest (ACM-ICPC Asia Tsukuba Regional Contest 2016), in Japanese with English team and institution names. The front page announces that the contest ran on 15 and 16 October 2016 at the Tsukuba International Congress Center, names the top three teams, and notes which teams advance to the 2017 World Finals. It gives the organisers as the University of Tsukuba, a foundation and the contest's executive committee, and states 384 teams from 93 universities in the domestic round of 24 June and 45 teams (6 from abroad) from 37 universities at the regional.

    The pages cover the domestic round (registration, rules, scoring and selection rules, sponsor messages, special awards, the chief judge's commentary on the problems, photos, and a rankings page) and the regional (overview, computing environment, team list, timetable, access information, photos, prizes, the road to the World Finals, a participant survey, and the final results and official standings), plus the organising committee.

    Our copy holds 43 saved addresses, all HTML pages; one of them, the eligibility address under registration, is only a redirect stub with no page content. Images and style sheets are not saved. The link to the contest problems leads to a PDF on another server and is not part of our copy.
