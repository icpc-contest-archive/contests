  description: |-
    Problem set: a PDF of 25 pages with a cover page that names the contest and says Problem Set, followed by 12 problems labelled A to L, starting with A, Tatami Renovation, and ending with L, Common Tangent Lines. Each problem has a time limit (2 or 3 seconds) and a statement in English. Eleven problems have input and output sections and sample input and output; problem F is interactive and has an interaction section and three sample interactions instead. The cover states no date. No test data and no solutions.
