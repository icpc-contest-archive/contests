  description: |-
    Scoreboard titled ICPC 2025 Asia Yokohama Regional - Top Teams Standings: 39 teams against 12 problems, A to L, ranked from 1 to 39. Each team row gives rank, number solved with the total penalty in parentheses, team name, university, a bracketed pair such as [1/3] after the university, and for each problem the solve time in hours and minutes with extra attempts as (+n), or only (+n) for unsolved attempts. First place is Strong Zero (National University of Singapore) with 9 solved. A last row gives, for each problem, the teams that solved it out of the teams that attempted it, and the submissions; the attempted counts go up to 63 teams, so the page lists only the top part of the field.

    The style sheet is embedded in the page; the page carries no script and no further links.
