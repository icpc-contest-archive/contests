- url: https://icpc.jp/2025/regional/
  read: '2026-11-16'
  rubric: 1
  copy: japan/japan-2025/website/2026-09-04-live-e831dd23
  title: Regional Contest – ICPC 2025 Yokohama
  language:
  - en
  - ja
  description: |-
    Website of the ICPC Asia Yokohama Regional Contest Organizing Committee for the 2025 Asia Yokohama Regional Contest, in Japanese and English. The regional page gives the schedule (registration, rehearsal, tech talks and team introductions on 6 December; the contest from 09:00 to 14:30 on 7 December, then commentaries and the closing ceremony), the venue, Yokohama Sanbo Hall, and links to the contest documents. Our copy holds the contest information and contest program PDFs of 8 pages each, the problem set PDF, the problem analysis in English and in Japanese, and the judges' commentary slides, besides pages on the computing environment, information from the judges, the committee and judges, and sponsor messages and company awards including the regional results.

    The pages of the Japanese domestic qualifier are inside too: registration, rules, scoring and selection rules, the judging system and manuals, and a results page that states 355 teams on 4 July 2025 and 50 teams selected for the regional.

    Our copy has 48 pages, 42 HTML and 6 PDF, and 16 images; no style sheets, and some images of the sponsor pages are missing. Links to the standings, photos, videos and the Aizu Online Judge mirror lead to other servers.
