  description: |-
    Contest dashboard on QOJ.ac for the 2021-2022 ICPC Asia Pacific - Yokohama Regional, in the category ICPC / Regionals / Asia Pacific / Japan. It lists eleven problems, A Loop of Chocolate to K Distributing the Treasure, and says the contest is the official ICPC regional contest and is also known as Moscow Pre-Finals Workshops 2022 Day 4. The settings shown are the ICPC ruleset, a 20 minute penalty and a limit of 1000 submissions per problem; the notices and questions tables are empty.

    The statements (English) are offered as an attachment, and the submissions and standings are separate pages; none of these are in our copy.
- url: https://icpcarchive.github.io/Asia-Pacific/Japan/The-2021-ICPC-Asia-Yokohama-Regional-Contest/tutorials.pdf
  read: '2026-11-23'
  rubric: 1
  copy: japan/japan-2021/editorial/20261123-live-200b5137/tutorials.pdf
  title: Commentaries on Problems
  language:
  - en
  problems: 11
  pages: 94
  description: |-
    Slides of the judge team's commentaries on the problems of the ICPC 2021 Asia Yokohama Regional: a PDF of 94 pages in English covering all eleven problems, A to K, in letter order. The opening slides chart the number of teams that attempted and solved each problem at the freeze, this year against last year and in the judges' estimated order of difficulty, and the number of teams per number of problems solved, with charts for 2020 and 2019.

    Each problem has a title slide, a summary of the task and the solution. The slides on B note that all teams solved it after many failures, and those on J add an amendment: a condition missing from the problem text.
