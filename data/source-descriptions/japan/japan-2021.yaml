    Official problem set as a PDF of 27 pages, in English. The cover names the ICPC Asia Pacific regionals, shows sponsor logos, and gives the contest as Asia Regional Contest, Yokohama, 2022-03-16. It holds eleven problems, A to K, from A Loop of Chocolate to K Distributing the Treasure. Every problem has a time limit, a statement, input and output formats and at least two sample cases. No test data or solutions.
