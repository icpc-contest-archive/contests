  description: |-
    Final standings of the 2021 ICPC Asia Yokohama Regional Contest: 40 teams with rank, team, institution, number solved, time and a citation. The first twenty places carry the citations First Place to Twentieth Place and the other twenty teams are marked Honorable Mention. The University of Tokyo's team UT a.k.a Is is first with 7 solved in 677. There is no per-problem detail. Some institutions are named in their later forms, for example Institute of Science Tokyo and The University of Osaka.
