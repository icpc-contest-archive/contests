- url: https://icpc.jp/2021/regional/
  read: '2026-11-16'
  rubric: 1
  copy: japan/japan-2021/website/2026-09-04-live-de7028b8
  title: Regional Contest – ICPC 2021 Yokohama
  language:
  - ja
  - en
  contest_date: '2022-03-16'
  description: |-
    Website of ICPC Japan for the 2021 Yokohama regional contest, mostly in Japanese with English headings and some English pages. The regional front page says the contest was run fully online and lists the standings, the problem set, a note on Problem J, the chief judge's commentary and slides, a dataset, videos of the opening and the awards ceremony, the rules and the compiler list. It also gives the schedule: a system test in early March 2022, registration, opening ceremony and rehearsal on 15 March 2022, and the contest on 16 March 2022 from 9:00 to 14:00.

    Our copy holds 33 pages, one of which is only a redirect. Regional pages: the notice on the change from on-site to online format, the rules with an FAQ, compiler versions and options, the judge system environment, a note on a correction made to Problem J during the contest, and the standings. The rest of the site is about the Japanese domestic qualifier of 5 November 2021 (registration, rules, scoring, selection of the 40 teams for Yokohama, its results page with 275 teams), eligibility, sponsor messages and company awards, and the list of judges.

    The links to the problem set PDF, the chief judge's commentary, the commentary slides and the dataset lead to another server and are not part of our copy; the two videos link to YouTube.
