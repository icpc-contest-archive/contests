    Standings of the regional on the ICPC Japan site, headed as a copy of the original at the ICPC global site: 40 teams, each with university rank, team rank, affiliation, team name, number solved and penalty. The leaders are The University of Tokyo (UT a.k.a Is), Kyoto University (Heno World) and Tokyo Institute of Technology (tonosama), each with 7 solved; the last seven teams have 2 solved. There is no per-problem detail. Below the table is a link to the note on Problem J. The page carries the site menu in Japanese.
