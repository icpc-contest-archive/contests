  title: 'ACM-ICPC: ACM International Collegiate Programming Contest Asia Regional Contest 2010 in Tokyo'
  language:
  - ja
  - en
  description: |-
    Website of the 2010 Asia Regional Contest in Tokyo, run by the ACM-ICPC Tokyo Site Organizing Committee (ACM-ICPC東京大会実行委員会) with the ACM Japan Chapter as co-host, in Japanese with a parallel English version of most sections; the schedule, contest environment, domestic problems and domestic results pages are Japanese only. Our copy holds 44 pages: the outline of the ICPC, the domestic (Internet) contest with its rules, scoring, selection rules, problems and results, the regional contest outline, schedule for 11 to 13 December, list of participating teams, contest environment (PC^2 9.1.6, gcc/g++ 4.4.4, Java SE 6) and Java challenge, registration and eligibility, past contests, links and FAQ.

    The domestic problems and results pages are in it. The regional standings and the regional problems are not among its pages.
