    Final standings of the contest on Codeforces (gym): a scoreboard with rank, team (mostly university and team name, in Chinese or English; 28 rows give a team name and member handles), number solved, penalty, and for each of the thirteen problems A to M the result as + or - with the number of extra attempts and the solve time in hours and minutes. A closing row gives accepted and tried counts per problem. Our copy holds only the first page, 200 rows; the page links to a second page, rows 201 to 319, which is not part of it. The first row is a team from Tsinghua University with 8 solved. 172 of the 200 rows carry an icon titled "Ghost participant", eight team names begin with an asterisk, and the page offers a "show unofficial" option.
