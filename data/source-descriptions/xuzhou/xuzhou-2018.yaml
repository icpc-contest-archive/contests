  title: acm国际大学生程序设计竞赛
  title_en: ACM International Collegiate Programming Contest
  language:
  - zh
  contest_date: '2018-10-28'
  description: |-
    Website of the 2018 ACM-ICPC Asia Xuzhou regional (the 43rd), in Chinese, run by China University of Mining and Technology, the host. The home page, as held from November 2018, names the contest in English and Chinese, gives 27 and 28 October 2018 at the Nanhu campus, and shows statistics of 169 schools, 1055 participants and 1980 submissions. The pages of this edition are the contest environment (Ubuntu 14.04, the PC^2 judging system, C, C++ and Java compilers, editors) and the schedule: registration on 27 October 2018, opening ceremony and warm-up contest the same day, the contest from 9:00 to 14:00 on 28 October, then the awards ceremony.

    Other pages with content: the ICPC introduction, the ICPC rules, the award rules (gold, silver and bronze certificates for 10%, 20% and 30% of the teams), an introduction of the host university, a table of public transport and taxi routes from Xuzhou railway station and airport to the hotels and campus, a list of five notices dated 2018 and 2019, and the invitation to the national invitational contest of 2 and 3 June 2018.

    Our copy holds 58 pages, some under more than one address, and also a later form of the home page announcing the 2019 contest. The pages for the problems, downloads, contacts, registration procedure, hotels, shuttle, catering, medical care, network support, campus map, ICPC history and the 2019 contest hold only the menu. Our copy holds no PDF files.
