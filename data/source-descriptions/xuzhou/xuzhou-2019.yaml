- url: http://acm.cumt.edu.cn
  read: '2026-11-16'
  rubric: 1
  copy: xuzhou/xuzhou-2019/website/2026-09-05-wayback-ceaab171
  title: acm国际大学生程序设计竞赛
  title_en: ACM International Collegiate Programming Contest
  language:
  - zh
  contest_date: '2019-11-03'
  description: |-
    Website of the Xuzhou regional contests, in Chinese, run by China University of Mining and Technology, the host. The home page, as held from November 2019, is headed "The 2019 ICPC Asia Xuzhou Rigional Contest" and names the 44th regional; it gives 2 and 3 November 2019 at the Nanhu campus, with the opening ceremony and warm-up contest on the 2nd and the contest and closing ceremony on the 3rd, lists the registration steps, and shows statistics of 192 schools and 1133 participants (the submissions count is dashes).

    The 2019 section of the menu (preliminary, schedule, problems) and the pages for hotels, shuttle, catering, medical care, network support, contacts, downloads and the registration procedure hold only the menu. The news list has five notices, three of them from 2019: the invitation to the 2019 regional dated 2019-09-17, a list of the top 180 universities of the online round, and the registration notice for the online round; the texts behind these titles are not in our copy. The other pages with content are of 2018: the contest environment, schedule, rules, award rules, an invitation to the 2018 national invitational contest, a transport table and introductions of the ICPC and the host.

    Our copy holds 58 pages, some under more than one address, and no PDF files.
