  description: |-
    Final standings of 284 teams, ranked 1 to 284. Each row gives rank, team name, institution, problems solved, total time, medal, a citation (gold, silver, bronze or honorable mention) and a site citation, which reads ICPC Asia XuZhou on every row. There are 28 gold, 57 silver and 86 bronze medals; the other 113 teams have no medal, and 9 teams have no problem solved. First place is Peking University with 10 problems solved in 1045. No per-problem detail.
