  title: '[ICPC2019 Xuzhou R] ICPC 2019 区域赛徐州站重现赛'
  title_en: '[ICPC2019 Xuzhou R] ICPC 2019 Xuzhou Regional Replay Contest'
  language:
  - zh
  - en
  problems: 13
  description: |-
    Contest page on the Luogu (洛谷, Luògǔ) judge for a replay of the 2019 ICPC Asia Xuzhou Regional, run by the judge's official team on 2026-10-22 from 13:00 to 18:00 under ICPC rules with the scoreboard frozen for the last hour. The text in Chinese says the problems and data are those of the original contest, with statements in Chinese, and gives the rules: teams of one to three, 20 minutes penalty per rejected submission, a limit on submissions of long-running problems, and no rating points (the result counts towards the site's contest score). A section on prize certification follows. The page's embedded contest data lists thirteen problems, each titled '[ICPC 2019 Xuzhou R]' followed by the name, from Cat and Cats line up to Kill the tree. The statements themselves are not in our copy.
