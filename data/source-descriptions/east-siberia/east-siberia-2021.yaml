    Standings of the contest: 46 teams with rank, team name, institution, number of problems solved, penalty time, medal and citation. Places 1 to 15 carry diplomas (first degree for the first five, second degree for places 6 to 10, third degree for places 11 to 15), the rest carry certificates, and from place 24 the citation reads Honorable Mention. Irkutsk SU 4 is first with 7 problems. No per-problem detail.
