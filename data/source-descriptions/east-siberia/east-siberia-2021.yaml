  description: |-
    Scoreboard from Yandex Contest for the main round of the East Siberian regional, a 5-hour contest: 50 teams against 13 problems labelled A to M. Each team row gives the team name (usually followed by a list of members in parentheses; three entries have no member list), then for every problem a plus or minus with the number of attempts and a time (hh:mm), then total solved and penalty. The column heads show the number of accepted submissions over the number of all submissions per problem. Four entries carry an asterisk before the name (Siberian SUTIS 1, Demidenko Vitaly, Siberian SUTIS 3, Siberian SUTIS 6); the page does not explain the mark. Siberian SUTIS 1 is first with 9 problems; Irkutsk SU 4 is second with 7. A footer names the last accepted solution (problem M, 04:56) and the last submitted solution (problem L, 04:59).
