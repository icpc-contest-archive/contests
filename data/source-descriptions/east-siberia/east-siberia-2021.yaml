  title_en: ICPC season 2021/22 | Institute of Space and Information Technologies, SibFU
  language:
  - ru
  contest_date: '2021-11-21'
  description: |-
    Announcement page of the East Siberian regional quarterfinal, on the website of the Institute of Space and Information Technologies of Siberian Federal University, in Russian. It states that a practice round runs on 20 November 2021 (8 hours) and the contest on 21 November 2021 (5 hours), held remotely with Krasnoyarsk as the site, and has headings for the organisers and for two sponsors of the Krasnoyarsk site, each sponsor with a short blurb. It carries an information letter with registration rules (registration on icpc.global and on the host's own system by 19 November), contact details, and links to the problem statements, three videos of problem analysis, the contest rules, the judging system and the official contest page on VK.

    The results section names the top three teams (Irkutsk SU 4, Irkutsk NRTU 3, Irkutsk SU 5), links a protocol, and lists the 22 teams that received a place in the semifinal with their universities. Our copy is this one page only; the linked statements, protocol and videos are not in it,, and the site's navigation menus surround the text.
