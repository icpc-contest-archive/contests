  description: |-
    Standings page of Yandex Contest for The 2020 East Siberian Regional Contest, with a duration of 05:00:00; the start and end times are blank in our copy. It is the first of two pages of the board and shows 50 participants, each with place, name, the team members and, for each of the twelve problems A to L, a plus with the time of the accepted solution (preceded by the number of earlier rejected attempts when there were any), a minus with the number of rejected attempts and a time, or a dash for no attempt, followed by points and penalty. The heading of each problem carries two counts, such as 62 / 73 for A. Six entries are marked with an asterisk and stand among the others. The first place is Buryat SU 6: WARush with ten problems. The foot of the page names the last accepted answer and the last submission. The second page of the board is not in our copy.
