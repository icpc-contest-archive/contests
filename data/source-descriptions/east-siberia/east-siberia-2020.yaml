    Final standings of the 2020 East Siberian Regional Contest: 54 teams with rank, team name, institution, number of problems solved, total time and a citation. The first 38 teams carry the citations First Place to Forty-fifth Place, with some place numbers skipped and some shared; the other 16 are marked Honorable Mention. The first place is Buryat SU 6 of Buryat State University with 10 problems and a time of 822. There is no per-problem detail.
