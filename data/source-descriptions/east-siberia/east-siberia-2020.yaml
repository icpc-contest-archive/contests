  description: |-
    Contest page on Codeforces (a gym contest) for the East Siberian Regional Contest of 2020-2021, marked Finished, with a link to the contest website. It lists twelve problems A to L with their names, time limits of 1 to 2 seconds, a memory limit of 256 or 512 MB and the number of accepted solutions for each. Problems A, B, C, D, F, G and H have Russian names; E, I, J, K and L have English names. A link to statements in Russian is present but the statements are not in our copy. The page also holds the Codeforces forms for questions and announcements.
