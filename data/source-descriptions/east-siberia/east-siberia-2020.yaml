  title: ICPC сезон 2020/21 | ИКИТ СФУ
  title_en: ICPC season 2020/21 | IKIT SFU
  language:
  - ru
  description: |-
    Website page of the Institute of Space and Informatic Technologies of Siberian Federal University for the 2020/21 season, in Russian. It announces the quarterfinal of the world programming championship for the East Siberian region of Russia, 6 to 7 November 2020, held remotely under the special rules of the season, with the option for sites to hold it in person. The programme gives 7 November for the main round and closing, but prints the year 2019 on those lines. It gives the programme in Krasnoyarsk time (opening and trial round on 6 November, main round on 7 November, closing), the registration deadline, and the sites Krasnoyarsk (remote only), Irkutsk, Ulan-Ude, Chita and Norilsk with contact details. Links lead to results, problem statements, certificates, participants' submissions, and tests and solutions in three parts (A-D, E-H, I-L).

    The page lists 22 numbered teams under a heading for places in the semifinal, starting with Buryat SU 6: WARush. Our copy holds two pages: the same page in two versions made at different times; the later one adds a link to finalists' diplomas and words the heading of the list as places in the NERC final. The linked results, statements and other documents are not in our copy.
