    Contest page on QOJ.ac titled 2016-2017 ICPC Northern Eurasia - East Siberian Subregional, with the note that the contest is also known as XVII Open Cup named after E.V. Pankratiev, Eastern Grand Prix, Div 2. It lists twelve problems A to L under short names (Count The Ones, Craters, Closing Ceremony, Skyscrapers, Blackboard, Buddy Numbers, Gmoogle, Generator, Addition, White Mage, Inspection, Fibonacci Equation). The page shows the contest as ended, with the ICPC ruleset, a 20-minute penalty and a limit of 1000 submissions per problem, and offers statements in Russian and an Open Cup statement in English as attachments. The notice and question tables are empty.

    Our copy is the dashboard page with its style sheets and scripts; the statements, submissions and standings pages it links to are not part of it.
