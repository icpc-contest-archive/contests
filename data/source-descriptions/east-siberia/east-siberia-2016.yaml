  description: |-
    Page on the website of the Institute of Space and Information Technologies (IKIT) of Siberian Federal University, in Russian, announcing the quarterfinal of the world programming championship for the East Siberian region of Russia, to be held at the institute in Krasnoyarsk from 29 to 31 October 2016 (29 October opening and trial round, 30 October main round, 31 October closing). It names the sponsors, describes registration and lodging, says that solutions are judged by the Yandex.Contest online system, and gives a list of 15 teams that advanced to the semifinal, noting that the region's quota is 15 teams. A further list of 13 teams gives a place number (some a range) and, for eight of them, the problems solved.

    Links name the information letter, programme, contract and acceptance forms, hotel information and maps, regulations, the final table, the problems as a PDF, the submission log, jury tests and solutions for problems A to F and G to L, participants' submissions, photographs and the contest's page on a social network. These files and pages are not part of our copy. Our copy holds two versions of this one page, in an older and a newer layout of the institute's site. The text is the same except that the older version has two links to results of East Siberian teams at the NEERC 2016 contest, and the newer one instead lists two teams that did not come to the semifinal.
