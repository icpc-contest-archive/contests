    Standings page headed NEERC East Siberian Subregional Contest, with the contest clock at 5:00:00 of 5:00:00, status over, and a line giving 398 runs and 71 accepted. 33 team rows, each a team name followed by its members (three names, except the last row, which has a name only), with problems A to L as columns, then the number solved, the total time and the rank. A problem cell shows a plus for a solved problem, with the number of rejected tries when there were any, or a minus and the number of tries when it was not solved; there are no per-problem solve times. The last four rows share rank 30, and the last of them is named "* The best generation". Below the table are totals of runs, accepted and rejected runs per problem. First place goes to I of Math Siberian FU Bizons with ten problems.
