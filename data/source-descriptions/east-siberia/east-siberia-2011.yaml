  description: |-
    Page from the website of the Institute of Space and Information Technologies of Siberian Federal University (SFU IKIT), in Russian, for the 2011/2012 season. It announces the quarterfinal round of the world programming championship for the East Siberian region, held at the institute in Krasnoyarsk from 22 to 24 October 2011; teams of universities from the Chita and Irkutsk regions, Krasnoyarsk Krai and the republics of Khakassia, Buryatia and Tuva may take part, and the winners go on to the semifinal in Barnaul. It gives the entry rules (teams of three plus an optional reserve, deadlines, fee, instructions for teams of institute students on registering on the ACM site, four lodging options) and the programme: arrival on 21 to 22 October, opening and a practice round on the 22nd, the main round on the 23rd, closing on the 24th.

    Links lead to a PDF labelled Summary, a PDF of final results and participant lists, the information letter and application, a contract form, an acceptance act, the programme booklet and the regulations. There is no link to the problems. Our copy holds only this page; none of the linked files is in our copy.
