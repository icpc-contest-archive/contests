  description: |-
    Single page of the website of the Institute of Space and Information Technologies of Siberian Federal University, in Russian, under the heading сезон 2000/2001 год ("season 2000/2001") with the article Региональный этап ACM-ICPC в Восточно-Сибирском субрегионе 2000/01 года ("Regional stage of ACM-ICPC in the East Siberian subregion, 2000/01"). It reports that Krasnoyarsk State University entered five teams in the quarterfinal and that one of them became champion of the East Siberian subregion and won an additional place in the ACM world semifinal, and that Krasnoyarsk State Technical University entered four teams, its best finishing fourth.

    The article states the rule that each university may send one team to the semifinal, plus an additional team from the host university, and lists the five universities that qualified in order: Krasnoyarsk State University, East Siberian State Technological University, Siberian State Technological University, Krasnoyarsk State Technical University and Irkutsk State Technical University. It then says that the seven best teams of these universities did well in the semifinal at Altai State Technical University in Barnaul, and closes with a sentence on the value of the world programming championship. There is no results table, no problem list and no count of all participating teams; the rest of the page is the institute's menu and footer.
