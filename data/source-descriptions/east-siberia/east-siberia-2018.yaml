  description: |-
    Website page of the Institute of Space and Informatic Technologies of Siberian Federal University for the 2018/2019 season, in Russian. It announces the quarterfinal of the world programming championship for the East Siberian region of Russia, 9 to 11 November 2018 (opening and trial round, main round on 10 November, closing), with sites in Krasnoyarsk, Ulan-Ude and Irkutsk, and lists general sponsors and sponsors. It gives the rules of the qualification round of 22 September and of the selection of teams for the main round, and has links to the programmes of the three sites, the standings of the qualification round and of the main round (on Yandex Contest), the problem statements, jury tests and solutions in four parts, an analysis, participants' submissions, certificates and a photo report.

    The page also holds a table of semifinal places with 17 numbered teams marked as confirmed, four teams marked as declined and an empty eighteenth row, and a table of 17 East Siberian teams with problems solved, penalty, place in Siberia and place overall. Our copy holds four pages: the season page in three versions made at different times, and one subpage listing the 56 teams invited to the main round after the qualification round. The linked statements, tests and photographs are not in our copy.
