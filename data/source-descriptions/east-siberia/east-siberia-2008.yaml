    Final standings of the ACM ICPC 2008-2009 NEERC East Siberian Contest, in English: 29 teams and ten problems A to J, with the status line showing 5:00:00 of 5:00:00, over. Each problem cell gives a mark: + for a problem solved at the first try, +N for one solved after N failed tries, -N for N failed tries without a solution, and a dot for no tries. Per team it then gives the number of problems solved (column headed =), Time and Rank. IKIT SFU 2 is first with seven problems and a Time of 698. The last team, ICMM SFU 2, solved nothing. The institute's page lists 30 teams; Irkutsk STU 2, 22nd there, is not in this table.
