  description: |-
    Page of the Institute of Space and Information Technology of Siberian Federal University, in Russian, for the 2008/2009 season. It announces the quarter-final contest of the programming world championship for the East Siberian region of Russia, to be held in Krasnoyarsk at the institute from 25 to 27 October 2008, and names two sponsors. It links a report (an archive file) and a photo report on another site, gives registration instructions with links to an information letter with application form, a contract form, an act of acceptance and a programme of events (PDF files), and lists organiser contacts. A table headed as the results of the quarter-final of the International programming olympiad gives institution and team, place, penalty points and number of problems solved for 30 teams, places 1 to 30; the team in 30th place solved nothing.

    Our copy holds two pages: the same page twice, once in the institute's current site layout and once in an older layout. The linked report, photo report and PDF documents are not in our copy, and links to the problems and tests and to the contestants' solutions are present only inside an HTML comment and so are not shown.
