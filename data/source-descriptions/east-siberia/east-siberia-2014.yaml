  description: |-
    Page on the website of the Institute of Space and Information Technologies (IKIT) of Siberian Federal University, in Russian, announcing the quarterfinal of the world programming championship for the East Siberian region of Russia, to be held at the institute in Krasnoyarsk from 24 to 27 October 2014. It gives the programme (25 October opening and trial round, 26 October main round, 27 October closing), lists a general sponsor, a gold sponsor, four further sponsors and the catering sponsors, and explains how team captains register on the ICPC registration site and send an application to the contest director by 20 October 2014.

    A list of links at the bottom names the information letter, regulations, contract form, hotel information and maps, the contest programme, the protocol of the contest, the protocol of teams advancing to the semifinal, a summary PDF, problems with tests and solutions, participants' runs, the contest's page on a social network and photographs. These are links to files and pages that are not part of our copy. Our copy holds two versions of this one page, an older one and one in the institute's newer site layout. They carry the same text, except that the newer one adds a line in the list of links saying that one named team did not come to the semifinal.
