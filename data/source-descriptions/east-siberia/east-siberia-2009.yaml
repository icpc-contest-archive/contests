  description: |-
    Page from the website of the Institute of Space and Information Technologies of Siberian Federal University (SFU IKIT), in Russian, for the 2009/2010 season. It announces the quarterfinal round of the world programming championship for the East Siberian region, held at the institute in Krasnoyarsk from 21 to 23 October 2009; teams of universities from the Chita and Irkutsk regions, Krasnoyarsk Krai and the republics of Khakassia, Buryatia and Tuva may take part, and the winners go on to the semifinal in Barnaul. It gives the rules for entry (teams of three plus an optional reserve, application deadline, fee, registration instructions, lodging) and the programme: arrival on 20 to 21 October, registration and a practice round on the 21st, the main round on the 22nd, results and awards on the 23rd.

    The page carries a table of results of 25 teams (institution and team name, place, penalty points, problems solved), a list of participating teams with their institutions, and links to extract.zip, a runs-by-team file, a photo report, the organising committee, the information letter and application, a contract form and the event programme. It has no link to the problem statements.

    Our copy holds only the page itself, saved twice from two addresses (two files, with slightly different attachment links); none of the linked files is in our copy.
