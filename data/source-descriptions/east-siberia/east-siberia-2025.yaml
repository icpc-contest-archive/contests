  description: |-
    Standings of the contest: 45 teams with rank, team name, institution, number of problems solved, penalty time, a citation and a site citation naming the site where the team competed: Irkutsk (22 teams), Krasnoyarsk (16) and Ulan-Ude (7). The citation gives the place as a word down to the thirty-third place and Honorable Mention below it. Ranks are printed as in the table: there is no rank 5, two teams share 12 and three share 41. Simmetriada of Irkutsk State University is first with 8 problems. No per-problem detail and no medals.
