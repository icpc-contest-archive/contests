  contest_date: '2017-10-22'
  description: |-
    Website page of the Institute of Space and Informatic Technologies of Siberian Federal University for the 2017/2018 season, in Russian. It announces the quarterfinal of the world programming championship for the East Siberian region of Russia, held in Krasnoyarsk, with a second site in Irkutsk, from 21 to 23 October 2017 (opening and trial round, main round, closing), and names three sponsors. It sets out the rules of the qualification round of 30 September and of the selection of teams for the main round, and gives the programme, accommodation and registration information. A list of links leads to the final results (on Yandex Contest), the problem statements, jury tests and solutions, the submission log, participants' solutions and photographs.

    The page also holds a table of 23 teams with a slot number and whether the semifinal place was confirmed or declined, and a table of 18 East Siberian teams at the semifinal with problems solved, penalty, place in Siberia and place overall; two of those rows say the team did not come. Our copy holds four pages: the season page in three versions made at different times, and one subpage listing the 44 teams invited to the main round after the qualification round. The linked results, statements and photographs are not in our copy.
