  description: |-
    Website page of the Institute of Space and Informatic Technologies of Siberian Federal University for the 2019/2020 season, in Russian. It announces the quarterfinal of the world programming championship for the East Siberian region of Russia, 15 to 17 November 2019 (opening and trial round, main round on 16 November, closing), held from 2019 at five sites: Krasnoyarsk, Ulan-Ude, Irkutsk, Chita and Norilsk. It names general sponsors and sponsors of the Krasnoyarsk and Irkutsk sites, gives addresses and contact details of the sites, and has links to the programmes of the five sites, the results (on Yandex Contest), the problems, participants' submissions, an analysis, tests and solutions in two parts, certificates and a photo report.

    It also holds a list of 20 numbered teams under "Путевки в полуфинал" (places in the semifinal) and a separate table headed "Результаты NEF" (results NEF) of 20 teams with problems solved, penalty, overall place and place in Siberia. Our copy holds three pages: the season page in three versions made at different times (two complete, one without the sponsor, results and semifinal sections). The linked results, problems and photographs are not in our copy.
