  description: |-
    Page from the website of the Institute of Space and Information Technologies of Siberian Federal University (SFU IKIT), in Russian, for the 2010/2011 season. It announces the quarterfinal round of the world programming championship for the East Siberian region, held at the institute in Krasnoyarsk from 28 to 30 October 2010; teams of universities from the Chita and Irkutsk regions, Krasnoyarsk Krai and the republics of Khakassia, Buryatia and Tuva may take part, and the winners go on to the semifinal in Barnaul. It gives the entry rules (teams of three plus an optional reserve, application and registration deadlines, fee, lodging options) and the programme: arrival on 27 to 28 October, opening and a practice round on the 28th, the main round on the 29th, closing on the 30th. Two sponsors are named, with a paragraph on one of them.

    Links lead to the information letter and application, a contract form, an acceptance act, the programme booklet, the regulations, the organising committee, two photo reports (main round and awards) and a PDF of final results and participant lists. There is no link to the problems.

    Our copy holds only the page itself, saved twice from two addresses (two files); none of the linked files is in our copy.
