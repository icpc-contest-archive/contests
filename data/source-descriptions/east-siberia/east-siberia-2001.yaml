  description: |-
    Single page of the website of the Institute of Space and Information Technologies of Siberian Federal University, in Russian, under the title ACM-ICPC сезон 2001/2002 ("ACM-ICPC season 2001/2002"). Its heading announces the team championship of the regional stage in the East Siberian subregion held on 23 October 2001 at KGTU. Our copy holds two captures of this one page.

    The page lists the 20 teams of the contest by university and team name, numbered 1 to 20; the last three are marked as outside the competition. A text about the 2001/02 season follows: eight quarterfinal groups with centres in Minsk, Rybinsk, Perm, Saratov, Saint Petersburg, Novosibirsk, Krasnoyarsk and Vladivostok, and the semifinal in Barnaul, which used the Internet. It describes how the Siberian semifinal group went for the teams from Krasnoyarsk State Technical University and names the Saint Petersburg Institute of Fine Mechanics and Optics as overall winner with seven problems solved.

    The page has a Results line that links to a PDF of the quarterfinal results, which is not in our copy. The results table of the quarterfinal sits inside a comment in the page source and is not displayed, so our copy shows no ranking of the teams.
