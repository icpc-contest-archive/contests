  description: |-
    Single page of the website of the Institute of Space and Information Technologies of Siberian Federal University, in Russian, under the heading сезон 2002/2003 год ("season 2002/2003"). Its heading announces the team championship of the regional stage in the East Siberian subregion held on 27 October 2002 at KGTU. Our copy holds two captures of this one page.

    The page lists the 26 participating teams by university and team name, numbered 1 to 26, with the universities of Krasnoyarsk, Irkutsk, Khakassia and Buryatia among them. Below it a table headed Результаты 1/4 финала Международной олимпиады по программированию ("Results of the quarterfinal of the International Programming Olympiad") gives rank, team, penalty points and number of problems solved for 17 teams, from KGTU/1 in first place with 3 problems and 302 penalty points to a team with 1 problem and 254 penalty points in 17th place. The other nine of the 26 listed teams do not appear in the table. There is no per-problem detail and no problem list. The team list is also linked as a PDF, which is not in our copy.
