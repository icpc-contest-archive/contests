  pages: 2
  description: |-
    Page on the website of the Institute of Space and Information Technologies (IKIT) of Siberian Federal University, in Russian, announcing the quarterfinal of the world programming championship for the East Siberian region of Russia, to be held at the institute in Krasnoyarsk on 24 and 25 October 2015 (24 October opening and trial round, 25 October main round and closing). It names the sponsors, explains how team captains register on the ICPC registration site and send an application by 22 October 2015, notes that C# and Python were added as languages that year, and gives lodging prices for out-of-town participants.

    A list of links names the information letter, regulations, programme, contract and acceptance forms, hotel information and maps, a results PDF, three pages on another site (results, text broadcast, a match between Irkutsk and Krasnoyarsk teams), problems with tests and solutions, participants' runs, photographs and the contest's page on a social network. These files and pages are not part of our copy. Our copy holds two versions of this one page, one in a newer and one in an older layout of the institute's site. The text is the same except at the end of the link list: the newer version lists five teams that did not come to the semifinal, and the older one has two links to results of East Siberian teams at the NEERC 2015 contest instead.
