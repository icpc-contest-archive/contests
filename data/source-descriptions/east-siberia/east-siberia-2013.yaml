  description: |-
    Page from the website of the Institute of Space and Information Technologies of Siberian Federal University (SFU IKIT), in Russian, for the 2013/2014 season. It announces the quarterfinal round of the world programming championship for the East Siberian region, held at the institute in Krasnoyarsk from 8 to 11 November 2013, with opening and a practice round on 9 November, the main round on 10 November and closing on 11 November. It carries text on six general sponsors (DiVita IT, QB System, Navikey, InterSystems, Softline and JetBrains) and instructions for teams of institute students on applying and registering on the ACM site.

    Links lead to the information letter, the regulations, the programme, hotel and lodging information, the protocol of the contest, the protocol of the teams that reached the semifinal, a PDF labelled Summary, an archive of problems, tests and solutions, an archive of participants' solutions and the contest's page on a social network. Our copy holds only this page; none of the linked files is in our copy.
