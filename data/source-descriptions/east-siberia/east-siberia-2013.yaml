  description: |-
    Standings page titled East Siberian Subregional 2013, with the contest clock at 5:00:00 of 5:00:00 and status over: 32 team rows and eleven problems, A to K. Each row gives the team name followed by three member names (except the five rows marked with an asterisk, which give a name only), then one cell per problem showing a plus with the solve time (and the number of rejected tries when there were any), or a minus with the number of tries when unsolved, then the number solved and the total time. Five rows have names starting with an asterisk (two school teams, branches of the university in Abakan and Zheleznogorsk, and a team 34); they are ranked in the same list as the others and the page does not explain the mark. Ranks run 1 to 22, and eleven teams with no solved problems share rank 22. A summary below the table gives total, accepted and rejected runs and the first and last accept time per problem. First place goes to IMCS SFU: Bizons with nine problems.
