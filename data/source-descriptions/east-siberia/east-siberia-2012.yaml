  description: |-
    Page from the website of the Institute of Space and Information Technologies of Siberian Federal University (SFU IKIT), in Russian, for the 2012/2013 season. It announces the quarterfinal round of the world programming championship for the East Siberian region, held at the institute in Krasnoyarsk from 26 to 29 October 2012, with opening on 27 October, the main round on 28 October and closing on 29 October. It carries text on three general sponsors (Mobilfon, Metadesign studio and JetBrains) and instructions for teams of institute students on applying and registering on the ACM site.

    Links lead to the information letter, the regulations, a contract form, an acceptance act, the programme, hotel information and maps, the protocol of the contest, the protocol of the teams that reached the semifinal, a PDF labelled Summary, an archive of problems, tests and solutions, a submission archive, a photo report and the contest's page on a social network. Our copy holds only this page, saved twice from two addresses (two files, with slightly different attachment links, one also linking clarification and runs-by-team reports); none of the linked files is in our copy.
