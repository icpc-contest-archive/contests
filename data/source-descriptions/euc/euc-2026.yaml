    Written solutions of the 2026 ICPC Europe Championship, a PDF of 17 pages in English. It has one section for each of the eleven problems A to K, each headed by the problem letter and name and an author credit, followed by an explanation of the approach, which states a time complexity in several sections. Two figures illustrate problem A. Problem A is headed Three Circles here, while the problem set calls it Three Castles.
