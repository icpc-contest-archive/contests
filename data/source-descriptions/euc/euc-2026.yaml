  description: |-
    Problem set of the 2026 ICPC Europe Championship as a PDF of 15 pages, in English, with no cover page: the statements start on page 1. Eleven problems are labelled A to K, from A Three Castles to K Multiset Variance. Each problem starts on its own page with a header giving the memory limit, the time limit, the name EUC 2026 and the date 8.02.2026, and has a statement with input and output sections and an example; all but problem E add an explanation of the example. Problems A, F, H and K take two pages, the other seven one page each. No test data or solutions.
