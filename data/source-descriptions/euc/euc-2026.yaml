  description: |-
    Website of the ICPC Europe Championship run by the ICPC Foundation. Our copy holds 51 pages and also covers the 2024 edition (Prague), the 2025 edition (Porto) and a front page for the 2027 edition (Eindhoven). The 2026 pages announce the championship hosted by the University of Warsaw, 6 to 8 February 2026, and state 53 institutions, 53 teams and 159 contestants. They cover the FAQ, the schedule (registration, opening ceremony, contest orientation, contest day on Sunday 8 February, closing and award ceremony), sponsors, rules, programming environment, team reference document instructions, health and safety policy, a welcome video page, a list of the 53 teams with institution, members, country and workstation number followed by three non-competitive sponsor teams, and a table of the teams that qualified for the ICPC World Finals with their place at the championship.

    The 2026 solutions PDF is inside our copy. The scoreboard address is only a short redirect page to another server, and the problems address is a redirect page to a problem PDF that is not part of the site copy, so the results and statements are not in it. The front page now announces the 2027 championship.
