- url: https://euc.icpc.global/
  read: '2026-11-16'
  rubric: 1
  copy: euc/euc-2024/website/2026-09-04-wayback-4045d75f
  title: ICPC EUC 2024 | | EUC ICPC
  language:
  - en
  description: |-
    Website of the 2024 ICPC Europe Championship, hosted by the Czech Technical University in Prague, in English. Our copy holds 31 pages, 16 of them pages of the 2024 edition: the home page (contest dates 22-24 March 2024, winners, a count of 52 teams from 48 institutions in 24 countries), FAQ, schedule, sponsors, hosts, organization, accommodation, rules, online judge, programming environment, TRD instructions and health and safety policy. It also has a list of the 52 qualified teams by region (NWERC, CERC, SEERC, SWERC, 13 teams each) with institution and country, a table of the 52 registration times, and a table of 1003 submissions with time, team, problem, language and result.

    The site was reused for the 2025 edition: ten pages of the 2025 Championship hosted by the University of Porto are in the same copy, as are four PDFs of 2025 (problem analysis slides, solutions, technical notes, judging notes). From 2024 there is one PDF, the solutions document. The 2024 pages link to the scoreboard, photo gallery and video playlist on other sites, and to the 2024 problem set and problem analysis PDFs, which are not in our copy.
