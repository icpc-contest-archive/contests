  - en
  problems: 11
  pages: 30
  description: |-
    Problem set of the 2024 ICPC European Championship as a PDF of 30 pages. The cover reads The 2024 ICPC European Championship, Official Problem Set, with sponsor logos. Eleven problems A to K (A Grove, B Charming Meals, C Annual Ants' Gathering, D Funny or Scary?, E Damage per Second, F Dating, G Scooter, H Division Avoidance, I Disks, J Amanda the Amoeba, K Make Triangle) follow in English, each with a statement, input and output format and one to three samples. Pages 2, 18, 22 and 28 are blank pages. No test data or solutions.
