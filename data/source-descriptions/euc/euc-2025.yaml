    Final standings of the 2025 ICPC Europe Championship: 53 teams with team name, institution, problems solved and total time, plus a Medal column and a Citation column. The top 30 teams are ranked 1 to 30 and carry a place citation (First Place to Thirtieth Place); the other 23 are listed without a rank as Honorable. Medals are 2 gold, 4 silver and 6 bronze, and 18 further ranked teams are marked Highest Honors. Delft University of Technology (team Segfault go BRRRR) is first with 8 problems solved in 1299 minutes. No per-problem results.
