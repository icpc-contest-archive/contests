  description: |-
    Final scoreboard of the 2025 ICPC Europe Championship in DOMjudge: 53 teams ranked 1 to 53, shown by institution with country flag and logo, problems solved and penalty time, and one cell for each of the problems A to K giving the minute of the accepted run and the number of tries, or only tries when unsolved. A summary row gives per-problem totals. Delft University of Technology is first with 8 problems and 1299 minutes. Medal icons mark the top twelve places (2 gold, 4 silver, 6 bronze), 12 teams carry a "Pre-qualified" label, and a colour legend marks first solves, solved, incorrect, pending and untried cells. The page shows the board twice, once as full cells and once as the string of solved letters per team. The page states the last update as 2 March 2025 18:20 UTC.
