  - en
  contest_date: '2025-03-02'
  problems: 11
  description: |-
    Website of the ICPC Europe Championship run by the ICPC Foundation. Our copy holds 52 pages and also covers the 2024 edition (Prague), the 2026 edition (Warsaw) and a front page for the 2027 edition (Eindhoven), each with its own history pages. The 2025 pages announce the championship hosted by the University of Porto from 28 February to 2 March 2025 and state 53 teams, 53 institutions and 159 contestants. They cover the FAQ, the schedule (registration, opening ceremony, dress rehearsal, contest day on Sunday 2 March), sponsors, rules, programming environment, team reference document instructions, health and safety policy, an online judge page, a list of the 53 teams grouped by regional contest with institution, country and home folder, and a page of submitted solutions (time, team, problem, language, result).

    The 2025 problem set, the problem analysis slides (217 pages) and the solutions document (23 pages) are PDFs inside our copy. The links to the scoreboard, the video records and the photos lead to other servers and are not part of it. The front page of the site now announces the 2027 championship.
