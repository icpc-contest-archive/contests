  description: |-
    Problem set of the 2025 ICPC Europe Championship as a PDF of 28 pages, in English. A cover page is followed by eleven problems labelled A to K, from A Condorcet Elections to K Amusement Park Rides. Each problem has a statement with input and output sections and a samples section, and some give an explanation of the samples. The page headers read International Collegiate Programming Contest 2024-2025 and The 2025 ICPC Europe Championship hosted by, with no host named after it. Pages 2, 14, 24 and 28 are marked as blank pages. No test data or solutions.
