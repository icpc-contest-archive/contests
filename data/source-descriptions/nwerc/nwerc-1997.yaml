  description: |-
    Contest dashboard on QOJ.ac headed "The 1997 ACM ICPC Northwestern Europe Regional Contest", filed under ICPC / Regionals / Europe / Northwestern Europe. It lists eight problems, A (Arrows) to H (Hall of Flames), each linked to its problem page, and its Attachments box links to the statements in English. The side panel marks the contest as ended, with ICPC rules, a 20-minute penalty and a scoreboard frozen after 4:00:00, and offers a virtual contest; the notice and question tables are empty. The problem pages, the statements file, the standings and the submissions are not in our copy.
