  description: |-
    Final scoreboard of 41 teams, a page of the contest committee's website. Each row gives rank, team ID, team name, university, country, number solved and total time, then problems A to H with the number of attempts and, for solved problems, the time in parentheses. Umea University is first with 6 problems solved and a time of 594, followed by Darmstadt University of Technology with 5. Teams from the Netherlands, Sweden, Germany, Ireland, Poland, Norway, Denmark, Belgium and England appear. A remark under the table says that the team coaches joined the contestants on guest computers in a separate room and solved 4 problems versus 6.
