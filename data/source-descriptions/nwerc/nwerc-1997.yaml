  description: |-
    Problem set: a PDF of 18 pages. The cover names the Department of Applied Mathematics and Computer Science and the date November 23rd 1997, and lists the eight problems: A Arrows, B MDST-machine, C Entropy, D Columns, E Internet, F Gardener, G Mendel and H Hall of Flames. Each problem starts on its own page with a description, input and output format, and an example with sample input and output; every problem takes two pages except D, which takes three. In English. No test data or solutions.
