  title: 'Chipcie: Programming Contest'
  language:
  - en
  - nl
  contest_date: '1997-11-23'
  description: |-
    Website of the 1997 North Western European contest, run by the Chipcie programming contest committee of the Delft University of Technology (a frame page with a side menu). Our copy holds 40 pages. They cover an overview of the ACM contest, an outline of the two contest days (22 and 23 November 1997, about 8 problems in 5 hours), the contest rules, a hardware and software page, the list of 41 registered teams, a guide to Delft and a page of cinemas and pubs, three photo pages, and the final score page with the ranking of 41 teams.

    The site also offers old problem sets from 1989 to 1996 (the ICPC, the North Western European regional, the Dutch national contest and the Dutch preselection contests) as English and Dutch archives in PostScript and HTML (tgz and zip files, which are in our copy), together with year index pages that only list directories. A zip of the 1996 North Western European problems is in our copy too. The Chipcie home page links a committee page, a zip with jury input, output and solution programs of the Delft preselection contest of September 1997, and a Dutch results page of that contest (14 teams, problems A to G). The 1997 North Western European problem statements are not on the site. Links to other sites lead outside our copy.
