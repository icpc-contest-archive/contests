  title: nwerc.eu Northwestern Europe Regional Contest November 28-29 2015
  language:
  - en
  description: |-
    Website of the Northwestern Europe Regional Contest 2015, hosted by Linköping University, in English. The welcome page announces the contest for November 28-29 2015, links the public scoreboard, MyICPC and a Kattis practice contest, and lists downloads: the problem set, solution slides, sample input and output, judges' solutions and packaged problems, all stated to be copyright the NWERC 2015 jury under Creative Commons BY-SA 3.0. Further pages give the contest description with a list of previous NWERC contests and their hosts, the schedule of Friday to Sunday (registration, reception, practice session, lunch, TechTalk, excursion, dinner, the contest on Sunday, coaches' meetings and the award ceremony), the location and accommodation options in Linköping, registration deadlines and excursion choices, local rules on team composition, the contest computers and compilation options, and contact details.

    Our copy holds 20 files: ten HTML pages (the Kattis standings page of the final results is one of them; the system page is saved under two addresses), the problem set PDF, the solution slides PDF, the two tar.bz2 downloads (sample data and judges' solutions), a style sheet and five images. The archive of all materials linked from the welcome page was too large to be saved and is not in our copy.
