  description: |-
    Front page of the contest website before the contest, in English. It announces the contest at the Faculty of Information Systems and Technology of Delft University of Technology in the weekend of 16 and 17 November 2002, with links to a small and a large map. Four news items are dated 12 August to 17 September 2002 (updates to the tech, FAQ, rules and join pages, the last adding sleeping accommodation). A menu of ten entries (intro, contest, tech, rules, problems, join, agenda, FAQ, links, sponsors) and an overview describe the sections. The page ends with a contact line for the regional contest director and the note that it was last modified on 20 June 2002.

    Only this one page is in our copy, with its images; the section pages it describes are not.
