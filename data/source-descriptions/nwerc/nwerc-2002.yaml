  read: '2026-11-16'
  rubric: 1
  copy: nwerc/nwerc-2002/website/2026-09-04-live-6ea27bb7
  title: ACM Northwestern Europe International Collegiate Programming Contest sponsored by IBM.
  language:
  - en
  pages: 14
  description: |-
    Website of the 2002 ACM Northwestern Europe Programming Contest, in English, made by CHipcie, a committee of the study association W.I.S.V. Christiaan Huygens. The front page names the Faculty of Information Systems and Technology in Delft as the venue and the weekend of 15, 16 and 17 November 2002 as the dates. It says the contest is over and carries news items from 20 November to 3 December 2002 about results, problem specifications and solutions, IBM presentations and photos.

    The menu has ten entries: intro and nine sections. Contest (50 to 60 teams of three students, six to eight problems), tech (computers, Debian GNU/Linux 3.0 or Windows NT 4, the jury system), rules (refers to the ACM rules), problems (explanation and links to practice archives), join (registration through ACM, sleeping in classrooms for 10 euros for two nights, hotels), agenda (contest on Sunday from 10:00 until just before 15:00), FAQ, links and sponsors. The sponsors page holds a thank-you text and sponsor logos.

    The results, problem specifications and photo album are linked to other servers and are not in our copy. Our copy holds 14 pages: the front page under four addresses, the nine section pages and a page listing three IBM presentation files, of which one is saved, as a binary file. The ten menu mouseover images are saved as an unrelated web page instead of images.
