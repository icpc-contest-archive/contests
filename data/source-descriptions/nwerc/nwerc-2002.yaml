  description: |-
    Final scoreboard titled "ACM NWERC 2002 Final Contest Results - With coaches", in English. It lists 64 entries in one table: 54 teams of type 1, each with name, organization and country, and ten more entries named Spectator 1 to Spectator 10 of type 3, which have no organization or country and are ranked among the teams. Columns are ranking, ID, name, type, organization, country, solved, time and problems A to H. Each problem cell gives the number of attempts and, where the problem was solved, a time in brackets. A last row gives accepted and submitted totals per problem.

    First place is Bug Fiction of Univ. Groningen with 7 problems solved. A footnote says the times of the two teams marked (*1) were decreased by 10 minutes because of a PC hardware problem. The page states it was last updated on 11/17/02 at 15:23:56.
