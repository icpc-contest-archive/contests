# Written by tools/describe_apply.py from readings of the copies we hold. See README.md in data/source-descriptions.
contest: nwerc-2020
sources:
- url: https://2020.nwerc.eu/
  read: '2026-11-16'
  rubric: 1
  copy: nwerc/nwerc-2020/website/2026-09-05-live-5e0677f0
  title: NWERC 2020
  language:
  - en
  description: |-
    Website of the 2020 Northwestern Europe Regional Contest, hosted by Reykjavík University and held online on March 27 and 28, 2021 (a practice session and the contest). Our copy holds 18 pages. The front page carries news items from the call for problems of 6 May 2020 to the announcement of 2 April 2021 that the standings were final, with links to the problem set, solution slides and final standings of the practice session and of the contest.

    Other pages cover the rules for an online contest, registration with a list of the registered teams by university (the page states 120 teams from 52 universities), the schedule of the two days, the judging system (Kattis) and compilers, the contest environment (a virtual machine image), the sponsors, the organization and jury, the call for problems, a COVID-19 update, and a page about the contest that lists earlier NWERC editions back to 2005 with their hosts. The site also holds the final scoreboards of the practice session and of the contest, the problem set and the practice problem set as PDFs, the solution slides for both, and a team guide PDF.

    The packaged problems of the practice session (a tar.bz2 file) are in our copy; the 91 MB package of the contest problems was too large to be saved and is not.
