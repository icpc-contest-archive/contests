    Final scoreboard of the main contest, in the layout of Kattis: 120 teams ranked from 1, with solved count, total time and, for each of the problems A to K, the number of tries and the time of the solution (a dash for tries without a solution). The header gives the contest as 2021-03-28 from 11:00 to 16:00 CEST and a legend for first-to-solve, solved, attempted and pending cells. The first place is Los Patrons with 10 solved and 597 minutes.

    Three rows at the foot give, per problem, solved over tries, average tries and average tries to solve. No institutions are shown. Nobody solved problem B.
