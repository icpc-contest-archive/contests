  description: |-
    Final standings of the 2020 Northwestern Europe Regional Contest: 120 teams ranked 1 to 120, with institution, number of problems solved and total time. Gold, Silver and Bronze medals (four teams each) are named in a Medal column, and a Citation column gives the place name (First Place, Second Place and so on, then Honorable Mention for the 60 lowest teams). A Site citation column gives national champion titles to 12 teams; the first place, Los Patrons of the University of Oxford, is marked NWERC Champions.

    There is no per-problem detail.
