  - en
  problems: 11
  pages: 49
  description: |-
    Solution slides of the contest, by the NWERC 2020 jury: a PDF of 49 pages. After a title page, a page listing the jury members with their institutions and a page thanking the test solvers, there is a section for each of the 11 problems, in the order K, C, H, D, A, F, E, I, G, J, B. Each section names the problem author and gives the problem and the idea of the solution; ten sections end with a submission statistics line (problem J has none). Only the K section shows code, a Python line. Problem D has four solution types and problem B runs over 17 slides.

    The last three pages hold random facts about the jury's work (commits, jury solutions, test cases), time limits, and a chart of submission verdicts by language (c, cpp, java, kotlin, python3).
