  language:
  - en
  teams: 123
  description: |-
    Final standings of the 2019 Northwestern Europe Regional Contest: 123 teams with rank, team name, institution, number of problems solved, total time, medal, citation and site citation. Four teams each get a gold, silver and bronze medal (places 1 to 12); the first two, Leiden University and the University of Cambridge, both solved nine problems. The other 70 ranked teams share places by number solved (eight teams with six solved share place 13, 39 teams with five solved share place 21, 23 teams with four solved share place 60), and the 41 teams with three or fewer solved are marked Honorable without a rank. The site citation column names a country for 11 teams. No per-problem results.
