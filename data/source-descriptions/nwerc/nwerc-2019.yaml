- url: https://2019.nwerc.eu/
  read: '2026-11-16'
  rubric: 1
  copy: nwerc/nwerc-2019/website/2026-09-05-wayback-d385d023
  title: Northwestern Europe Regional Contest November 15-17 2019 - Eindhoven
  language:
  - en
  - nl
  contest_date: '2019-11-17'
  description: |-
    Website of NWERC 2019, the Northwestern Europe Regional Contest held on November 15-17 2019 at the Eindhoven University of Technology, in English. Its pages cover the contest and the earlier NWERC editions with their host universities, the schedule (Friday registration, Saturday practice session and social activities, Sunday competition and award ceremony), registration with the team admission rules and a table of 130 accepted teams by university and team name, location and travel, rules, the contest machines and DOMjudge system, a photo page, and the contest direction, jury and local committee.

    The site also carries the final DOMjudge scoreboard and five PDFs: the problem set, the practice session problems, slides with the practice solutions, slides presenting the solutions of the contest, and the DOMjudge team manual. An archive of the practice session files (tar.bz2) is saved as well.

    Our copy holds 82 files, 60 of them pages. The home page address in our copy shows the home page of the study association GEWIS, in Dutch, and many of the saved pages belong to that association (news, activities, career, committees), not to the contest. The photo thumbnails come from another server and are not in our copy.
- url: https://2019.nwerc.eu/scoreboard/
  read: '2026-11-16'
  rubric: 1
  copy: nwerc/nwerc-2019/scoreboard/2026-09-01-wayback-2c0af276/page.html
  title: NWERC 2019 final standings
  language:
  - en
  teams: 131
  problems: 11
  times: true
  tries: true
  description: |-
    Final scoreboard of NWERC 2019 produced by DOMjudge. The first block of the table lists 123 teams: 116 ranked 1 to 116 and, at the end, seven teams without a rank, all with no problem solved. Each row gives rank, country flag, university logo, team name, university, score (problems solved and total time) and, for each of the problems A to K, the time of the accepted run and the number of tries; unsolved problems show only the tries. First solves are marked, and a summary row closes the block. The team in first place is git merge -s octopus solution cup of Leiden University with nine problems and 1276.

    After that summary row, eight teams marked Companies are listed in the same table with their own ranks 1 to 8 and their own summary row.

    The flags, logos and style sheets used by the page are not in our copy.
