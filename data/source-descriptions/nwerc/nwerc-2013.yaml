  description: |-
    Final standings from the contest website: 92 teams ranked by problems solved and penalty time, with ten problems labelled A to J. Each row gives rank, an affiliation cell, team name, number solved and total time, and each problem cell gives the number of tries and, for a solved problem, the time of the accepted run plus penalty minutes. The affiliation cell holds a logo and a country flag as images, with the institution name only in the image's title attribute; the page refers to 61 distinct images and 21 of them are in our copy. The team in first place, geen.opdracht5, solved all ten problems.

    A closing summary row gives the total of 372 problems solved and, for each problem, three figures that read as submissions, teams that solved it and the time of the first solution.
