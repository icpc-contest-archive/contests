  title: NWERC 2013
  language:
  - en
  contest_date: '2013-11-24'
  description: |-
    Website of NWERC 2013, the Northwestern European Regional Contest, hosted by Delft University of Technology in the Netherlands on 22-24 November 2013. It is in English and our copy holds 140 files, of which 19 are pages (17 HTML pages and two PDFs), the rest images and a style sheet. The pages cover a welcome text, a description of the contest, the four preliminary contests (BAPC, GCPC, NCPC, UKIEPC), the schedule of the three days, system information, rules, a list of 92 teams by institution and team name, two activities (a beer tasting and a guided tour of Delft), results, location, travel and accommodation, and contact details.

    The results section holds the final standings and a page naming the champions and the next three places. A problems page links two problem set PDFs, which are in our copy: the practice session set (8 pages, three problems) and the contest set (22 pages, problems A to J). A media page links a photo gallery and news articles outside the site.

    The zip with presentation, solutions and test data that the problems page links was not fetched and is not part of our copy, nor are three photographs hosted on other servers; the page images and logos of the site are otherwise in it.
