  - en
  problems: 10
  pages: 19
  description: |-
    Slides on the problems of NWERC 2013, a PDF of 19 pages, headed Problems on its cover page, which lists the ten problem names. Each of the ten problems, Absurdistan Roads to Jingle Balls (A to J), has slides with the solution idea in short points, such as Prim's algorithm for Absurdistan Roads. Problems A, D, F, H and J have two slides each, Exponential Towers has four, and Battle for Silver, Card Trick, Grachten and Infix to Prefix have one; several slides state the problem and some give the time complexity. The problem names are repeated in a sidebar on every page.

    The slides carry no contest date, host or author on the pages.
