  description: |-
    Final standings of the Northwestern European Regional Contest 2013 as a scoreboard: 92 teams ranked by problems solved and total time, with problems A to J as columns. Each team row gives the affiliation as a university logo and country flag, the team name, the number of problems solved and the total penalty time. Each problem cell gives the number of attempts and, in parentheses, the solve time plus penalty minutes (for example 1 (23 + 0)); unsolved problems show the number of attempts or 0. Cells are coloured, with a separate colour for the first solution of a problem. A last row summarises each problem. The team in first place is geen.opdracht5, with 10 problems solved; one team, in last place, solved none.
