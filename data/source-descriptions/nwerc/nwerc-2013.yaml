    Baekjoon Online Judge category page for NWERC 2013, with Korean menus, listing ten problems A to J from Absurdistan Roads to Jingle Balls, numbered 9643 to 9652. Nine titles are in English; problem D, Diagrams & Tableaux, has a Korean title. Each row gives the number of users who solved it, the number of submissions and the percentage of correct answers, and marks problems A and C as using a special judge.

    The page lists the problems and judge statistics; the statements are on separate pages that are not in our copy.
