    Category page of the Baekjoon Online Judge for NWERC 2013, in Korean: a table of 10 problems labelled A to J, with problem numbers 9643 to 9652. For each problem it gives the title, marks such as special judge (problems A and C), source, multilingual and classification, and the number of users who solved it, the number of submissions and the percentage correct. Nine titles are the English titles of the contest (Absurdistan Roads to Jingle Balls); the title of problem D is given in Korean. The page holds no statements; they are on the problem pages it links to.
