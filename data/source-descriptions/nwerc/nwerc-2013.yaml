  description: |-
    Slides with the solutions to the ten problems A to J, in English: a PDF of 19 pages. After an overview slide listing the problems, each problem has one to four slides with the solution idea; Exponential Towers has four, Absurdistan Roads, Diagrams & Tableaux, First Date, Highway of the Future and Jingle Balls two each, and the other four one each. Some problems also have a short statement of the problem. The slides name the algorithms, and some give time complexities. A list of the problems runs down the left side of the slides.
