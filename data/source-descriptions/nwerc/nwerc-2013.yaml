  title: NWERC 2013 Northwestern European Regional Contest, November 22-24 2013
  language:
  - en
  contest_date: '2013-11-24'
  description: |-
    Website of the 2013 Northwestern European Regional Contest, hosted by the Delft University of Technology, in English. Our copy holds 19 pages and documents. The welcome page names the host and the dates, 22 to 24 November 2013. Further pages cover the preliminary contests (BAPC, GCPC, NCPC and UKIEPC), the three-day schedule, the contest system (software and compiler options on the contest machines), the team list, the two activities (beer tasting and a guided tour of Delft), the rules, travel information, accommodation, the venue and contact details. The contest page also links to the sites of the 2005 to 2012 editions.

    The results section holds a page naming the champions and the next three places, the final scoreboard (92 teams, problems A to J), a problems page that links the practice session and contest problem sets, and a media page that links photos and news items. Both problem set PDFs are in our copy: an 8-page practice session set and the 22-page contest set. The archive of solutions and test data linked from the problems page (29.9 MB) is not in our copy, and links to outside sites lead out of the copy.
