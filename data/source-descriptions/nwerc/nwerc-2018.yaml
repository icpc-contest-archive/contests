  problems: 11
  times: true
  tries: true
  description: |-
    Final scoreboard of NWERC 2018 from a DOMjudge page, last updated Sunday 25 November 2018 at 17:02 CET. It has 127 team rows: 122 in the category named for the host, Eindhoven University of Technology, and a separate list of 5 teams from companies in the category Companies, ranked on their own. Each row gives rank, team name with its institution and a country flag, problems solved and penalty time, and for problems A to K the minutes of the accepted run and the number of tries; cells are coloured as solved first, solved, incorrect, pending or untried. First place is Treenity of the University of Cambridge with 11 problems solved. Three teams at the bottom of the main list, with no problems solved, have no rank. A summary row at the bottom gives the total number of problems solved and, for each problem, the numbers of accepted, rejected and pending submissions and the time of the first solve.

    Only the HTML is in our copy: the style sheets, scripts, banner, country flags and university logos are missing, so the page shows without its colours and images.
