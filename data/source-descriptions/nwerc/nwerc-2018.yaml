  - en
  contest_date: '2018-11-25'
  description: |-
    Website of the Northwestern European Regional Contest 2018, held in Eindhoven. Our copy holds 18 files, but the front page of the site is not among them. Twelve are PDFs: four documents, each saved under three addresses.

    The contest problem set is a 24-page PDF with problems A to K, dated Eindhoven, 25 November. The practice problem set is an 8-page PDF dated Eindhoven, 24 November, with three problems A to C. Two slide decks give the solutions: 29 pages for the contest and 9 pages for the practice session. The practice problems are also held as a 15.6 MB bzip2 archive of problem packages with statements, test data, sample submissions and validators, and there is one large photograph. One of the three copies of the contest slides is cut short and cannot be opened in full; the other two are complete.

    Four more files are pages of the website of a Dutch student association (two activity pages from January 2016 and two activity archive listings) and have nothing to do with the contest. The archive of all contest files that the site links to is not in our copy.
