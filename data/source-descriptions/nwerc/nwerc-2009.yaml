  description: |-
    Final scoreboard of the contest, titled Inventions!, as a single table of 64 teams and ten problems A to J, each column headed with the problem name. Per team it gives rank, institution logo and country flag, team name, number solved and penalty time (column headed 'score', titled '# solved / penalty time'), and for each problem the number of tries with the solving minute plus penalty in brackets, for example 1 (12 + 0); unsolved problems show only the number of tries. The first team, deFAUlt, solved 8 problems in 820 minutes. Ten teams at the bottom, all with no problem solved, carry no rank number.

    A summary row gives, per problem, submissions, correct submissions and fastest time, and for the whole board 173 problems solved by 64 teams from 36 affiliations and 8 countries. The page is marked as last updated on 9 November 2009 at 09:40.
