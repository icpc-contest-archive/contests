  description: |-
    Results index page of the contest website. It names the winner, the team deFAUlt from Erlangen, with 8 problems solved in a total of 820 minutes, and links to the final standings, the problem set PDF, the solution outlines PDF, zip files of example solutions, sample input and output and test data, and a checker for problem I, Simple Polygon. A note states that the problem texts and solutions are copyright 2009 by the NWERC 2009 jury and licensed under Creative Commons Attribution-Share Alike 3.0.

    The page carries no standings of its own; the linked files are not part of this page.
