  title: NWERC 2009 - Nuremberg
  language:
  - en
  contest_date: '2009-11-08'
  description: |-
    Website of the North Western European Regional Contest 2009, hosted by Friedrich-Alexander-University Erlangen-Nuremberg, in English. Our copy holds 16 pages: the home page with a note that NWERC 2010 is to be held in Bremen, a news page (registration closed with 64 teams, arrival directions, emergency number), the list of registered teams, rules, a schedule from Friday 6 to Sunday 8 November, registration, system information, location, organization, a photo gallery, and a manual titled Domjudge@FAU Manual.

    The results page names the winner and links to the final standings, the problem set PDF, the jury's solution outlines PDF, and zip files of example solutions, sample input and output, and test data; the standings page and both PDFs are in our copy, and the three zip files and a checker source file are saved beside them.

    The photo gallery page lists eleven links to slideshows (all photos plus ten albums); the slideshow pages are not in our copy.
