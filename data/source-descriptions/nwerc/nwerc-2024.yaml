  description: |-
    Final scoreboard of the Northwestern Europe Regional Contest 2024 as produced by DOMjudge, with problems A to M. The 80 teams of the category Contestants are ranked first; the last one, ChosenByBrett, solved no problem. Kindergarten Timelimit (Karlsruhe Institute of Technology) is first with 13 problems and 1274 penalty minutes. Each team row gives rank, name, institution, problems solved and total time, and for each problem the time of the accepted submission and the number of tries; the 80 university teams also show a country flag. A legend explains the cell colours (solved first, solved, tried incorrect, tried pending, untried) and the medal colours.

    A second category, Companies, ranks 5 company teams separately (Jump Trading, Ortec, IMC Trading, ASML and JetBrains Student Team), so 85 teams appear in all. Each category ends with a summary row of totals per problem. The page repeats the board in a compact view and a detailed view.
