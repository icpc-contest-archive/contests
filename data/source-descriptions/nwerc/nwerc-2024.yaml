  description: |-
    Website of NWERC 2024, the Northwestern Europe Regional Contest, in English, with a copyright line of the study association W.I.S.V. 'Christiaan Huygens'. The front page says the 2024 edition was held from 22 to 24 November 2024 on the campus of Delft University of Technology and was a lit(e) version; its news item on the conclusion names the champion and the three teams that qualified for the ICPC World Finals and, among thirteen teams in all, those for the ICPC Europe Championship. Our copy holds 27 pages (46 files).

    The site has a digital booklet, contest, schedule, teams, rules, jury advice, systems, location, accommodations and contact pages, and four news items (conclusion, online spectator contest, last information, the lit(e) date). The teams page lists 85 teams (80 university teams and 5 company teams) with workstation numbers. Contest material is final standings and a spectators scoreboard, the problem set (PDF), problem slides and solution slides; the test session has its own standings, problem set, problem slides and solution slides.

    The photos link only redirects to a gallery on another server. The contest's packaged-problems archive and the livestream links (YouTube) are not part of our copy; the file saved for the test session's packaged-problems link is cut short (about 5 MB of the announced 57 MB).
