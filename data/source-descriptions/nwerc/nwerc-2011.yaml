  description: |-
    Solutions slides of NWERC 2011 by the jury, Jacobs University Bremen: a presentation of 93 pages in English. It opens with a statistics table giving, for each of the ten problems, correct and total submissions and the fastest solving time (from E, Please, go first, 62 of 106 submissions correct, fastest 25 minutes, to F, Pool construction, 0 of 2), then one section per problem in the order E, B, C, A, H, G, I, D, J, F, each with the solution approach. Source code is shown for problems E, B and D and a test case for problem I; the last page is headed The end.

    The slides build up step by step, so many pages repeat the previous one with one more line. The table names problem C 'Move to Front', where the problem set calls it 'Movie collection'.
