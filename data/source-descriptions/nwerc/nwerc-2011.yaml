  title: NWERC 2011 - Jacobs University Bremen
  language:
  - en
  contest_date: '2011-11-27'
  description: |-
    Website of the Northwestern European Regional Contest 2011, hosted by Jacobs University Bremen, in English. Our copy holds 15 pages, 13 web pages and two PDFs, and two ZIP files. The web pages are the home page announcing the contest for 25 to 27 November 2011, results, final scoreboard, team roster, rules, schedule, a semi-live online contest, registration with fees and deadlines, system information, location, organization, a page listing the organizing team and the jury, and a second scoreboard page.

    The results page links the final standings, the problem set (PDF), the solutions (PDF), example solutions (ZIP) and test data including samples (ZIP), and names the winner, geen.opdracht5 from Delft University of Technology. Both PDFs and both ZIP files are in our copy. The schedule covers registration on Friday 25 November, the opening ceremony, practice session and excursion on Saturday, and the contest on Sunday 27 November. The rules, registration and system pages cover team eligibility, fees and the contest computer environment.

    Some images, and the per-team and per-problem pages of the scoreboard system, are not in our copy.
