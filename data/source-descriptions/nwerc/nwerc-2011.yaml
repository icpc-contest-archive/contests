  description: |-
    Final scoreboard of NWERC 2011 from DOMjudge (version 3.2.0 in the page source): 70 teams and ten problems, A to J. Each row gives rank, team name, number of problems solved and total time, then one cell per problem with the number of tries and, in brackets, the solving time plus penalty minutes; unsolved problems show only the number of tries. The affiliation column holds a logo and a country flag for each team. The first place is geen.opdracht5 with seven problems solved and a total time of 898.

    Ranks 1 to 65 are given; six teams solved no problem, one of them (rank 65) with a rank and five listed after it without a rank. A last row, Summary, shows 70 teams, 42 affiliations and 9 countries, 184 problems solved in all, and three figures per problem labelled submitted / correct / fastest time, for example 135 / 18 / 22 for problem A.
