  description: |-
    Home page of the website of the 2006 Northwestern European Programming Contest, hosted by KTH - Royal Institute of Technology, Stockholm, 17-19 November 2006, in English. Our copy is this one page. Its news announces the final results and links the problem set as a PDF, the test data and sample solutions as tar.gz archives, a video of the contest as a Windows media file, and photos of the winners and the top two teams, with two further photo albums. It also carries a note that books are not allowed on the contest floor except the Team Contest Reference and a dictionary, links to the 2005 and 2007 NWERC sites, and a menu for about, organisation, contact, news, travel, hotels, registration, schedule, hockey, rules, technical information, FAQ, links and about this site.

    The linked pages, archives, video and photos are not part of this copy, and the link to the final results points to a results address without the year in it.
