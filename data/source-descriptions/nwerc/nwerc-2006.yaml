    Final scoreboard of 42 teams. Each row gives rank, an institution logo and a country flag in unlabelled columns, team name, number of problems solved, score, and for each of the nine problems A to I the number of attempts and the time for a solved problem (for example 3/191), or just the number of attempts for an unsolved one, with a blank cell when not attempted. The column headed Total att/solv gives the attempts on solved problems and the number solved (for example 9/6); a column headed Change is empty on every row. A footnote links to an explanation of the scoring, which is not in our copy. Lag Bernhardsson is in first place with six problems solved and a score of 651. The page has no medal marks. Logos, flags and the style sheet are in our copy.
