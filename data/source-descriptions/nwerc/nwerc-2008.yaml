- url: http://2008.nwerc.eu/
  read: '2026-11-16'
  rubric: 1
  copy: nwerc/nwerc-2008/website/2026-09-05-wayback-c1d2bd5f
  title: NWERC 2008 - General - Home
  language:
  - en
  contest_date: '2008-11-23'
  description: |-
    Website of NWERC 2008, the Northwestern European Programming Contest, held at Utrecht University in the Netherlands in the weekend of 22-23 November 2008. It is in English. Our copy was taken from the web archive: 143 files, of which 51 are HTML pages or PDFs (some pages are held twice, under two addresses), plus images, style sheets, three tar.gz archives and a PowerPoint file. The pages cover the home page with news items dated from 18 April to 23 November 2008, the organisation and contact details, the contest schedule from Friday registration to the Sunday awards ceremony, rules, system information, a team contest reference, location and travel pages, links, and a registration page listing the 47 accepted teams with their institutions.

    The results section holds the final scoreboard (47 teams, problems A to F and H to K). The problemset page links the problem set PDF, the jury's solutions slides as a PDF, and archives of sample data, test data and possible solutions; all of these files are in our copy. Two talk presentations from the weekend are also held: one from Xopus as a PDF of 43 pages and one from Imtech as a PowerPoint file. A separate scoreboard page of a local Utrecht programming championship (Utrechts Kampioenschap Programmeren, problems A to H) is included as well.

    The photo albums and the video report that the home page links to are on other servers and are not part of our copy.
