    Dashboard of the Codeforces gym contest for NWERC 2008, marked finished, with a link to the contest website and to the English statements. The problem table lists ten problems, A to F and H to K, from Equilibrium Mobile to Videopoker, with the input and output mode, the time and memory limits of each and the number of gym solves.

