  description: |-
    Solutions slides of the jury, a PDF of 21 pages in slide format, as it stood on the contest website in December 2008: a cover, then two pages for each of the ten problems, A to F and H to K, with short bullet points on the solution and a statistics line of submissions, correct submissions and the minute of the first correct solution. The statistics line of problem K has unfilled placeholders ("??") and that of problem E shows zeros. Utrecht University is named on the cover.

    It is the same file as the one held from the ICPC archive page; the extracted text repeats the problem letters from the sidebar of every page.
