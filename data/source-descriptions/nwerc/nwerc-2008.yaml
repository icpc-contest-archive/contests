  - ko
  problems: 10
  description: |-
    Baekjoon Online Judge category page for NWERC 2008, in Korean, listing ten problems with letters A to F and H to K and Baekjoon problem numbers 3681 to 3690. Most titles are in Korean, while F (Sculpture) and K (Videopoker) keep their English titles. Each row gives the number of users who solved it, the number of submissions and the percentage of correct answers, and marks problems D, I and K as using a special judge.

    The page lists the problems and judge statistics; the statements are on separate pages that are not in our copy. The site menus around the table are in Korean.
