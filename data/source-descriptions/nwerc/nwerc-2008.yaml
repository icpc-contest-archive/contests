  description: |-
    Problemset page of the contest website: a short page with five links, to the problems as a PDF, sample input/output data as tar.gz, test data as tar.gz, possible solutions as tar.gz and the solutions presentation as a PDF. A note says the problem texts are copyright 2008 by the NWERC 2008 jury and licensed under a Creative Commons Attribution-Share Alike licence, version 3.0, with the LaTeX sources available on request. The page was last modified on 28 November 2008.

    Our copy of this page holds only the page itself with a style sheet and an icon; the files it links to are not part of this capture.
