  title: Problems from Northwestern Europe Contest (NWERC) 2008
  language:
  - en
  problems: 10
  description: |-
    Kattis page listing the ten problems of NWERC 2008 that are on the Kattis judge: Cat vs. Dog, Disgruntled Judge, Easy Climb, Equilibrium Mobile, Matchsticks, Proving Equivalences, Sculpture, Shuffle, Videopoker and White Water Rafting. The table has the columns Name, Fastest, Shortest, Authors, Full Solves, Ratio, Difficulty and Languages; every problem shows English as its only language. The problems carry no letters on this page.

    It is a list of problems with judge statistics, not the statements themselves. The figures are those of the day our copy was taken.
