  description: |-
    Final scoreboard from the contest website: 47 teams ranked by problems solved and then penalty time, with ten problem columns labelled A to F and H to K (there is no G). Each team row gives rank, a university logo and a country flag, team name, number solved and penalty time. A solved problem shows the number of attempts followed, in brackets, by the solve time and the penalty; an unsolved one shows the number of attempts only. First place went to Marta, Irena & Sirup with nine problems solved.

    The 47 teams carry 27 different university logos and 9 country flags. A closing Summary row gives 27 / 9 in the logo column, 156 solved in total and three figures for each problem column. The page states 'final standings' and a last update on 23 Nov 2008 at 17:24.
