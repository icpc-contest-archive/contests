  title: NWERC 2008 - General - Home
  language:
  - en
  contest_date: '2008-11-23'
  description: |-
    Website of the 2008 Northwestern European Programming Contest (NWERC), in English, for a contest held on the De Uithof campus in Utrecht, the Netherlands. Our copy holds 143 files, 51 of them pages (several saved under two addresses). The front page announces that the contest is over, links the final standings, the problem set with test data and solutions, photos, the presentations by Xopus and Imtech and a video report, and says that NWERC 2009 is in Nuremberg. A news item of 16 Nov 2008 says registration closed and 47 teams will compete.

    The pages cover the organisation (organisers, jury and technical committee), the schedule from the Friday 21 November registration to the Sunday 23 November contest (10:00 to 15:00) and awards ceremony, the rules, system information, the team contest reference, travel, accommodation and networking, and links. The registration page holds a table of the 47 accepted teams with institution, logo and country flag.

    The results page holds the final scoreboard. The problem set PDF, the jury's solution slides, three tar.gz archives (sample data, test data, possible solutions), a 43-page PDF presentation by Xopus and a PowerPoint file linked as the Imtech presentation are in our copy, and so is a second scoreboard, the final standings of the Utrechts Kampioenschap Programmeren (Utrecht Programming Championship), last updated 4 Oct 2008. The photo galleries and the video report lead to other servers and are not part of our copy.
