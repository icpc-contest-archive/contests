  problems: 10
  times: true
  tries: true
  description: |-
    Final scoreboard of the contest website, last updated 23 Nov 2008 17:24 according to the page: 47 teams ranked by problems solved and penalty time, with ten problems labelled A to F and H to K. Each row gives rank, an affiliation cell, team name, number solved and total time. Each problem cell gives the number of tries and, for a solved problem, the time of the accepted run plus penalty minutes in parentheses; unsolved problems show the number of tries alone (0 when none). Marta, Irena & Sirup is first with nine problems solved.

    A closing summary row gives the total of 156 problems solved and, for each problem, three figures that read as submissions, teams solving it and the time of the first solution. The affiliation cells hold logo and country-flag images with no text; the page refers to 36 distinct images and only nine of them are in our copy, together with two style sheets and an icon.
