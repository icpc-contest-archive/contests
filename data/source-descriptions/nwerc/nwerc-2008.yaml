  - en
  problems: 10
  pages: 21
  description: |-
    Solutions slides of the jury, a PDF of 21 pages in slide format: a cover reading Solutions, NWERC 2008, Solutions to the problems, The Jury, Utrecht University, The Netherlands, followed by ten problems, A to F and H to K, in the order H, I, D, J, A, F, B, C, K, E. Each problem takes two consecutive pages, a slide with the key ideas of the solution in short bullet points, for example largest and smallest number for Matchsticks, and distances between polygons for Rafting, and the same slide with a statistics line added: number of submissions, number correct and the minute of the first correct solution. The statistics line of problem K reads 1 submission with unfilled placeholders for the other figures ("??"), and that of problem E reads 0 submissions, 0 correct.

    Every page carries a sidebar of problem letters.
