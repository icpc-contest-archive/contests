  title: NWERC 2007 - General - Home
  language:
  - en
  contest_date: '2007-11-18'
  description: |-
    Website of the 2007 Northwestern European Programming Contest (NWERC), in English, held at the Utrecht University campus De Uithof in the Netherlands. The contact address is the study association A-Eskwadraat, and logos of IBM (main sponsor), Google, ASML and Optiver appear on the front page. Our copy holds 125 files: 68 pages (67 HTML pages and the problem set PDF, several of them saved under more than one address), two ZIP files, images and style sheets. The front page says the site is no longer updated and the contest is over, and links the final standings, a photo impression and the problem set with test data.

    The pages cover the organisation (organisers, jury and technical committee), the schedule from the Friday registration to the Sunday contest (10:00 to 15:00), the rules, system information (C, C++ and Java; Linux and Windows machines), the team contest reference, registration, travel, accommodation and networking, and links. The results are a final scoreboard page. The problem set PDF, a ZIP of test data and a ZIP of possible solutions are included. Three webcam addresses saved in our copy are error pages. The photo gallery and some other links lead to other servers and are not part of our copy.
