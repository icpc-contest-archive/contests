  description: |-
    Final scoreboard from the contest website: 51 teams ranked by problems solved and then total time, with problems A to J as columns. Each team row gives rank, a university logo and a country flag, team name, number solved and total time. A solved problem shows the number of attempts followed, in brackets, by the solve time and the penalty; an unsolved one shows the number of attempts only. First place went to Marta, Irena & Sirup with eight problems solved.

    The 51 teams carry 26 different university logos and 9 country flags. A closing Summary row gives 26 / 9 in the logo column, 173 solved and a total time of 28795, and three figures for each problem column. The page states 'final standings' and a last update on 18 Nov 2007 at 17:12.
