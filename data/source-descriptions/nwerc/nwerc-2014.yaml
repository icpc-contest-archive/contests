  title: nwerc.eu Northwestern Europe Regional Contest November 29-30 2014
  language:
  - en
  contest_date: '2014-11-30'
  description: |-
    Website of NWERC 2014, hosted by Linköping University, in English. Our copy holds 11 pages: nine web pages and two PDFs. The web pages are the welcome page, a page describing the contest with a list of the nine previous NWERC contests and their hosts, the final scoreboard, the schedule of the Friday to Sunday programme, location and accommodation with travel directions, registration, rules, a description of the contest computers and compilers, and contact details. The welcome page reports the outcome (95 teams from 48 universities in 9 countries, with the top three teams and their solved counts and times), names IBM, Microsoft and ING as sponsors, and links the materials.

    The two PDFs are the problem set and the jury's slides presenting the solutions. Two archives of the judges' solutions (a tar.bz2 and a zip, 115 files each) are also held. The archives of judges' input and output and of packaged problems are not in our copy, and the link to the problem presentations leads to another server.

    The style sheet and most images are present; one picture on the welcome page is missing.
