  description: |-
    Final scoreboard from Kattis, headed NWERC 2014 with the contest shown as over (start 10:05 CET, end 15:05 CET, five hours). It lists 96 teams with rank, team name, number solved and time, then one cell per problem A to K giving the number of tries and the time of the accepted run, or tries with "--" when unsolved. Ranks run from 1 to 94; the last three teams share rank 94. Lambdabamserne is first with 9 solved and time 1298. The cell of the first team to solve each problem is marked; problem A has no first-solve mark and its footer shows 0/12 solved/tries. Footer rows give solved/tries, average tries and average tries to solve per problem.

    Each team row also has a country flag and an institution logo as images; the image files are not in our copy.
