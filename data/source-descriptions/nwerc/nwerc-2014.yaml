    Final standings of 96 teams with rank, team, institution, problems solved, time, medal and a citation column. The teams come from 48 institutions. Lambdabamserne (University of Copenhagen) is first with 9 solved and time 1298, followed by Old Fafhioned Typefetting and Omogen Heap. Four teams carry Gold, four Silver and six Bronze; the citation column gives an ordinal place (First Place, Fifteenth Place and so on) for the 56 teams ranked 1 to 40 and Honorable Mention for the last 40 (rank 57 and below). No per-problem results.
