  description: |-
    Regional contest information page of the 1999 ACM Northwestern Europe Programming Contest, sponsored by IBM and hosted by Hogeschool 's-Hertogenbosch, 13 - 14 November 1999. It lists the countries the contest drew students from, says that the winners advance to the World Finals in Orlando, Florida, and links to the team roster, the standings, the problems and the regional contest director's e-mail.

    Our copy holds three pages: this one, the standings page and the problem set PDF. The links to the team roster and to the host's own site lead outside our copy.
