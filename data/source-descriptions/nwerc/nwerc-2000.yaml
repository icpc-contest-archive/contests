  description: |-
    Problem set of 13 pages. The cover names the ACM International Collegiate Programming Contest 2000-2001, the Northwestern Europe Regional Contest (NWERC), TU Darmstadt, 19 November 2000. A contents list leads to eight problems numbered 1 to 8: Railroads, Ouroboros Snake, Vito's Family, Smith Numbers, Chainsaw Massacre, Erdös Numbers, Echo and Fold-up Patterns. Each has a statement in English with input and output description and a sample input and sample output. No test data or solutions.
