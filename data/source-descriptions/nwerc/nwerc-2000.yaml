- url: http://www.pi.informatik.tu-darmstadt.de/acm-contest/2000/nwerc/welcome
  read: '2026-11-16'
  rubric: 1
  copy: nwerc/nwerc-2000/website/2026-10-20-wayback-57764423
  title: ACM Programming Contest NWERC 2000 - Welcome
  language:
  - en
  description: |-
    Official website of the Northwestern Europe Regional Programming Contest 2000, hosted by the Darmstadt University of Technology (department of computer science) in Darmstadt, Germany, in English. The welcome page gives 17 to 19 November 2000 and carries a note that registration for NWERC 2001 begins on May 1st. Our copy holds 23 HTML pages, among them the welcome, about, schedule, information, contest, rules, environment, travel, FAQ, contacts and links pages. The schedule lists registration deadlines and the programme of 18 and 19 November (registration, three invited talks, a practice session, the contest from 10:00 to 15:00, the awards ceremony). The environment page names IBM ThinkPad laptops, the languages C, C++, Free Pascal and Java, and PC^2 7.5 for submissions.

    The results side is in the pages for the problemset (a list of eight problems linked to a PDF), the final standings, the teams (41 entries linking to ZIP backups of the teams' home directories), a webcam page, a press page with links to articles, and picture pages. The copy also holds gzip test files for the eight problems (seven input files, for problems 2 to 8, and eight output files) and one PowerPoint file of a presentation. The problemset PDF, the ZIP archives and the press articles are not in our copy.
