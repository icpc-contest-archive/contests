  description: |-
    Welcome page of the contest website from before the contest, in English. It announces the North Western Regional Programming Contest 2000 at Darmstadt University of Technology, to be held from 17 to 19 November 2000 at the department of computer science in Darmstadt, and gives figures for the previous year's ACM contest (1968 teams from 1041 universities in 69 countries). A note says early hotel registration ends on 1 September. The menu links About, Schedule, Information, Contest, Contacts and Links. Our copy is this single page; the pages it links to are not part of it.
