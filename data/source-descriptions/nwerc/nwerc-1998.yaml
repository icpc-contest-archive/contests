    Problem set: a PDF of 18 pages, each headed with the contest name and IBM as sponsor. The first page holds general remarks on file names, input and output files and the Pascal, C, C++ and Java submission and compiler rules. Eight problems follow: A Space Management, B Plane Spotting, C Kroket, D Psychic Yahtzee, E Super Snooker, F Inverso, G Mondriaan and H Numbers & Letters. Each has a statement with input and output format and a sample input with its output. In English. No test data or solutions.
