  description: |-
    Regional contest information page of the 1998 ACM Northwestern Europe Programming Contest, sponsored by IBM and hosted by Hogeschool 's-Hertogenbosch, 21 - 22 November 1998. It lists the countries the contest draws from, says that the winners go to the World Finals in Eindhoven, and names the top three teams with problems solved and minutes: Poznan POOH's of Poznan University of Technology (6 problems, 694 minutes), ICT / *scratch* of the University of Groningen (6, 1146) and Sub-Zero Programmers of Delft University of Technology (5, 652). It links to the standings and to the problem set.

    Our copy holds two pages: this one and the standings page. The link to the host's own site and the link to the problem set document lead outside our copy.
