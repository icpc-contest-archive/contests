  description: |-
    Problem set of 16 pages in English, headed on each page North Western European Regional Collegiate Programming Contest 1996. It holds eight problems A to H: Burger, Wormholes, Squares, Magic, Jackpot, Dividing coins, Crimewave and Gaston. Each problem gives input and output file names, a description, input and output specification and a sample input with the correct output. The only date given is the year 1996 in the heading; no place, test data or solutions appear in it.
