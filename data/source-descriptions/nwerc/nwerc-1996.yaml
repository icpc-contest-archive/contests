  description: |-
    Index page of the problem set archive kept by CHipCie (W.I.S.V. Christiaan Huygens), in English. It lists the European regional contest from 1988 to 2023 (ERC, WERC, then NWERC) in a table of 36 rows with name, place and dates, and per row icons linking to the contest website, problem set, solutions presentation, data and solutions archive, scoreboard and photos where they exist. The row for NWERC 1996 gives only the place, Delft, and has one link, to the problem set PDF.

    The page covers the whole series, not this edition alone. Our copy holds 35 files: the index, one other page and 33 PDFs from various years, among them the 1996 problem set. None of the scoreboard pages the index links to is in our copy.
