  description: |-
    Official problem set of NWERC 2022. A PDF of 26 pages in English, dated November 27, 2022. Two front pages come first: a cover reading 'ICPC Europe Contests, Northwestern Europe Regional Contest, Official Problem Set, 2022 2023' with ICPC sponsor logos, and a title page that lists the twelve problems A to L (Alternating Algorithm, Bottle Flip, Circular Caramel Cookie, Delft Distance, ETA, Faster Than Light, Going in Circles, High-quality Tree, Interview Question, Justice Served, Kebab Pizza, Last Guess) and carries the copyright note of the NWERC 2022 jury under a Creative Commons Attribution-ShareAlike 4.0 licence.

    The remaining 24 pages hold the twelve problems, one after the other, each with a time limit and a statement. Eleven have input and output specifications and sample input and output; problem G is interactive, has no input and output sections, describes the protocol between a submission and the interactor and gives a sample interaction. Ten statements carry figures; the photographs in problems G and J have photo credits. The set has no test data and no solutions.
