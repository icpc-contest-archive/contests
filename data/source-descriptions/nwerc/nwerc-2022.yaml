  description: |-
    Final scoreboard of the Northwestern Europe Regional Contest 2022 produced by DOMjudge: 146 team rows with rank, team name and institution, number of problems solved, total time, and one cell for each of the twelve problems A to L. A solved cell gives the solve time in minutes and the number of tries; an unsolved cell with attempts gives only the tries. First solves are marked, and a legend explains the cell colours and the gold, silver and bronze medal marks (four teams of each). A summary row at the end of each block gives per-problem totals.

    The main block holds 140 university teams, ranked 1 to 136; the last four rows, teams with no problem solved, carry no rank number. A second block lists six company teams, ranked separately from 1 to 6, so the company teams are mixed into the page but kept apart from the ranked university teams. The first university team is Trinity's Trinity of the University of Cambridge with 11 problems solved and a total time of 1570.
