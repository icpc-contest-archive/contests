    Standings of the 2022 ICPC Northwestern Europe Regional Contest: 140 teams from 62 institutions, with rank, team name, institution, problems solved and total time; there are no per-problem columns. The first twelve places carry a gold, silver or bronze medal (four of each). The Citation column names the place in words (First Place to Seventieth Place) for the top 70 rows and 'Honorable Mention' for the other 70; a Site citation column holds a single entry, 'Champion NWERC 2022', for first place.

