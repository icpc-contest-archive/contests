  title: NWERC 2022
  language:
  - en
  contest_date: '2022-11-27'
  description: |-
    Website of NWERC 2022, the Northwestern Europe Regional Contest held from 25 to 27 November 2022 on the campus of Delft University of Technology, in English. The footer names the student association W.I.S.V. 'Christiaan Huygens', and the home page lists one platinum and three gold sponsors. Our copy holds 150 files, 38 of them pages.

    The pages cover a contest description with the list of earlier editions from 2005 to 2021 and their hosts, the schedule for Friday 25 to Sunday 27 November (registration, welcome speech, test session, activities, dinner, the contest, coach meetings, solutions and award ceremony), a team list of 141 teams, the rules, jury advice, the programming environment and systems, the location, accommodations, contact details, a photos page and seven news items.

    The home page links the material of the contest and of the test session: a final scoreboard (for the contest also a scoreboard for the spectator contest), the problem set as a PDF, problem slides and solution slides as PDFs, and a package of problems. The test session package (a zip) is in our copy; the contest package and the programme booklet are not. The photos page holds only an album heading with the dates 25 to 27 November in our copy, and the livestream links lead to other servers.
