    Problem set as handed out at the contest: a PDF of 24 pages. The cover names the ACM International Collegiate Programming Contest 2001-2002 sponsored by IBM, the Northwestern Europe Regional Contest supported by MERCK KGaA, Darmstadt University of Technology in Germany, and the date 4 November 2001. A contents list gives nine problems numbered 1 to 9: Area, Ambiguous Dates, Cog-Wheels, Cube, Enigma, Gridland, T9, Number Game and Signal Box. A general remark says programs read standard input and write standard output, and that problem 3, Cog-Wheels, was withdrawn 29 minutes into the contest because it had been used at the Mid-Central European Regional Contest 2000.

