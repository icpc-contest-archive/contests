  description: |-
    Front page of the official website of the Northwestern Europe Regional Programming Contest 2001, hosted by Darmstadt University of Technology. The text says the contest was held from 2 to 4 November 2001 at the department of computer science in Darmstadt, gives world figures for 2000 (2700 teams from 1079 universities in 70 countries, 64 teams advancing to the World Finals in Vancouver) and announces the World Finals in Honolulu in March. The menu names the pages About, Schedule, Information, Contest, Contacts and Links, and the page has a sponsors row and a last-updated line.

    Our copy holds this one page only; the pages the menu leads to are not part of it.
