  problems: 9
  description: |-
    Problem list from the contest website: nine problems numbered 1 to 9 (Area, Ambiguous Dates, Cog-Wheels, Cube, Enigma, Gridland, T9, Number Game, Signal Box), each with links to public and secret input and output files. The page links to the problem set as a PDF and to the judges' solution presentation as a PowerPoint file. Two notes follow the table: problem 3, Cog-Wheels, was withdrawn 29 minutes into the contest because it had been used at the Mid-Central European Regional Contest 2000 in Freiburg, and problem 8, Number Game, was ambiguous and was judged correct only after a long discussion among the judges.

    The linked input and output files and the PowerPoint presentation are not part of our copy.
