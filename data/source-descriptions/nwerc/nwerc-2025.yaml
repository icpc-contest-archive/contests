  title: Northwestern Europe Regional Contest 2025
  language:
  - en
  contest_date: '2025-11-30'
  description: |-
    Website of NWERC 2025, organised by the Karlsruhe Institute of Technology and held at its KIT Campus South in Karlsruhe from Friday 28 to Sunday 30 November 2025; the five-hour contest is on Sunday 30 November. Our copy holds 15 pages: the home page, the Teams, Live, Schedule, Rules, Jury Advice, Systems, Location, Activities and About pages, and five PDFs. All are in English.

    The Teams page lists 141 competing teams by institution. The Live page links to the scoreboard on a separate address and to video streams. The Schedule covers registration, opening ceremony, test session, company market and the contest on Sunday from 10:00 to 15:00. The Rules page gives the local rules on team composition and slot allocation and what teams may bring. The Systems page describes the laptops and the software and editors provided; the Location and Activities pages cover the campus and the Saturday programme. The About page explains the contest format and lists past editions with their hosts.

    The PDFs are a program booklet (17 pages) and slide sets for the opening ceremony (51 pages), the Q&A session (32), the last remarks (16) and the closing ceremony (18). The home page also links to the problem set, problem slides, problem packages and solution slides; those files are not part of our copy of the site.
