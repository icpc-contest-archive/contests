  description: |-
    Solutions presentation of NWERC 2025 by the contest jury, slides dated 30 November 2025, as a PDF of 76 pages. It opens with a cover, a page naming the jury members with their institutions and a page thanking the proofreaders and test solvers.

    The twelve problems A to L, Arcade Crane to Last Christmas, follow in order. Each section states the problem and works through observations and the solution, and carries a statistics line with the number of submissions and accepted ones; some sections have figures. The last pages show submission results by language and a Random facts slide on the jury's work: 658 commits, 1413 secret test cases and 317 jury and proofreader solutions.
