    Problem list of NWERC 2025 on the Baekjoon Online Judge, a Korean-language page filed under ICPC Regionals, Europe. The contest table has 12 rows, problems A to L with Baekjoon problem numbers 35072 to 35083; each row gives the title, labels such as special judge and multilingual, and the numbers of users who solved it, submissions and the acceptance ratio. Problem H is listed by number and letter only, without a title or figures.

    A second table lists three practice-session problems, A Atlantic Email, B Build Dependencies and C Circular Shortcut. The statements are on separate pages that are not part of our copy.
