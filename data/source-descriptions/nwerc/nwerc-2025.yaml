  description: |-
    Final scoreboard of the Northwestern Europe Regional Contest 2025, produced by DOMjudge and last updated Mon 01 Dec 2025 09:26 CET. It lists 145 teams against twelve problems A to L, with rank, team name, institution, number solved and total time, and for each problem the solve time in minutes and the number of tries. Cells are coloured for solved first, solved, tried incorrect and tried pending.

    141 teams are in the category NWERC: 139 carry ranks 1 to 139 and the last two are listed without a rank. Four teams in the category Company teams are listed after them in a separate block, ranked 1 to 4 among themselves. First place goes to bruhopen of the University of Cambridge with 11 problems solved and a total of 728. A Summary row with per-problem figures ends each block, and each team opens a detail view: for the NWERC teams it shows category, affiliation, country and location, for the company teams only category and location. The page holds the same rows twice, once for each of two layouts.
