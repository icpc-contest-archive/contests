  description: |-
    Problem set of NWERC 2025 as a PDF of 26 pages. The cover names the ICPC Northwestern Europe Regional Contest, gives the date 30 November 2025 and lists the twelve problems A to L, Arcade Crane to Last Christmas. A copyright notice states that the work is by the NWERC 2025 jury under a Creative Commons Attribution-ShareAlike 4.0 licence.

    The twelve statements follow, in English. Each gives the time limit (from 1 to 8 seconds), the task, the input and output format and one or more sample inputs and outputs; some have figures.
