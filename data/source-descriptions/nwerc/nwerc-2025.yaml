    Solutions presentation of NWERC 2025 by the contest jury, slides dated 30 November 2025, as a PDF of 31 pages. It is a shorter version of the 76-page slide set: the same cover, jury page and proofreader page, then one section for each of the twelve problems A to L.

    The sections are not in letter order but run F, L, D, K, J, E, A, C, B, G, H, I. Each states the problem and gives observations and the solution; eleven of the twelve carry a statistics line with submissions and accepted ones, and problem A has none. The last pages hold a Random facts slide on the jury's work.
