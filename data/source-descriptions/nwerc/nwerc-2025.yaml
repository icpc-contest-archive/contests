    Final standings of the 2025 ICPC Northwestern Europe Regional Contest: 141 teams with rank, team name, institution, number of problems solved, total time, medal, citation and site citation. There is no per-problem detail.

    The first 90 teams carry ranks 1 to 90; the other 51 are listed without a rank and marked Honorable. The Medal column gives 4 Gold, 4 Silver and 4 Bronze medals, then 22 Highest Honors, 22 High Honors, 34 Honors and the 51 Honorable. The Citation column is filled for the 90 ranked teams, and the Site citation column only for the winner, NWERC. First place is bruhopen of the University of Cambridge with 11 solved in 728; three teams solved nothing.
