  description: |-
    Problem set of NWERC 2016 as a PDF with a cover naming the contest, Bath and 20 November, and listing eleven problems A to K: Arranging Hat, British Menu, Careful Ascent, Driving in Optimistan, Exam Redistribution, Free Weights, Gotta Nudge 'Em All, Hamiltonian Hypercube, Iron and Coal, Jupiter Orbiter and Kiwi Trees. The cover asks not to open it before the contest starts.

    Our copy is cut off at exactly 1 MiB and lacks its cross-reference table and trailer, so PDF tools cannot open it. The text of the pages can still be recovered: statements A, B and C are complete, each with sample input and output (six pages), and problem D breaks off on page 7 after its output description, without samples. Statements E to K are missing.
