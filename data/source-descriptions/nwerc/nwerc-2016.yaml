  description: |-
    Solution slides of NWERC 2016 by the jury, a PDF of 68 pages dated 20 November 2016. The opening slides list the jury and the test solvers with their affiliations. Then follow slides for each of the problems A to K, in the order E, H, C, F, I, A, J, K, B, D, G, each built up over several pages: a short problem statement, the solution idea, a statistics line giving the number of submissions and accepted runs, and the author of the problem. Alternative solutions are given for problems C, J and G only. The last slide, 'Random numbers produced by the jury', gives the number of forum posts and commits, the lines of code of the shortest judge solutions and the average number of jury solutions per problem, each compared with NWERC 2015.
