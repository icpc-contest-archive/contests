  read: '2026-11-16'
  rubric: 1
  copy: nwerc/nwerc-2016/website/2026-09-05-wayback-a9dbeb94
  title: nwerc.eu Northwestern Europe Regional Contest November 19-20 2016
  language:
  - en
  contest_date: '2016-11-20'
  description: |-
    Website of NWERC 2016, hosted by the University of Bath, in English. The home page announces the contest on 19-20 November 2016 and links the problem set PDF, a scoreboard page, solution slides, test data and judges' solutions (as tar.bz2 archives), and the problem set, test data and judges' solutions of the practice session. It also points to the open online contest that Kattis ran one hour after the real contest.

    Our copy holds 33 files, of which 16 are HTML pages or PDFs (the home page is saved twice). The pages cover the contest description, the schedule for Friday to Sunday, location and travel, social activities, registration, rules, the machines and software available, organisers and contact, and a news page: a dated log from 16 to 20 November with links to photographs and a timeline of the practice session and contest day. The final scoreboard page, the problem set PDF, an 8-page practice problem set PDF and the solution slides are inside. The problem set PDF is cut off: the cover lists problems A to K, but the file lacks its cross-reference table, statements A to C can be read in full and the text of D breaks off on page 7 after its output description. The tar.bz2 archives linked from the home page and most of the linked photographs are not part of our copy.
