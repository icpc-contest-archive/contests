  description: |-
    Final scoreboard of NWERC 2016 as a DOMjudge scoreboard page, last updated 22 November 2016: 114 teams, eleven problems labelled A to K. Each team row gives rank, country flag, team name with its institution, number solved and total penalty time, and for every problem the number of attempts and the minute of the accepted run (for example 1/30), the number of attempts alone for an unsolved problem that was tried, or 0 for an untried one. Cell colours mark first solves, solved, tried incorrect, tried pending and untried problems. A summary row at the bottom gives per-problem submitted/correct totals and the number of affiliations and countries, and a legend lists the team categories Participants, Observers and Self-Registered. First place is Omogen Heap (KTH - Royal Institute of Technology) with 11 solved.
