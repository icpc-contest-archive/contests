  description: |-
    Problem set of 19 pages in English, a scan of paper pages with no text layer. Each problem starts with the heading 1995-1996 ACM International Collegiate Programming Contest, Western European Regional. It holds eight problems A to H: Modern Art, Bank (Not Quite O.C.R.), Matty's Blocks, Block Voting, Donkey, Islands, Maze and Syntrax, each of two or three pages (A, G and H three pages, the rest two) with a statement, input and output specification and an example input and output. The only date given is the season 1995-1996 in the heading; no place, test data or solutions appear in it.
