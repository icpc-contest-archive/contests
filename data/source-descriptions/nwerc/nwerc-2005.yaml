  title: NWERC 2005 - Northwestern European Programming Contest 2005
  language:
  - en
  contest_date: '2005-11-13'
  description: |-
    Website of the 2005 Northwestern European Programming Contest, hosted by KTH - Royal Institute of Technology, Stockholm, 11-13 November 2005, in English. Our copy holds 22 pages: the front page, news, about the contest, organization, contact, travel, hotels, registration, schedule, rules, reference materials, technical information, an FAQ, links, a page on the NWERC Hockey League side event, a photos page and a page about the site. The results are a final standings page, a problem set PDF of 20 pages and a page of judge data and solutions, and the site has a post-contest report page.

    The report says that 46 teams took part and that nine problems were used and that the winners solved six; it also covers the change of the rules on the team contest reference, the coaches meeting, the contest system and the sponsors. The photos page links to photo albums, some on other servers, and those photos are not part of our copy. The style sheets, logos and banner images of the front page and results page are in our copy; some illustrations on other pages (for example the map, hotels and rules images) and the data and solution files linked from the judge page are not.
