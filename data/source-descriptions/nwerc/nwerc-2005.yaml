    Baekjoon Online Judge page for the source NWERC 2005 (ICPC Regionals, Europe, Northwestern European Regional Contest), in Korean. It lists nine problems labelled A to I with the judge's problem number (3707 to 3714, and 2005 for D), the title, a column of information links, and the number of users who solved it, the number of submissions and the solve ratio. Most titles are in English; problems C, D, F and H appear with Korean titles. Problems A, B, E, G and I show no solvers and no submissions. The site menu and footer are in Korean. The statements are on the linked problem pages, which are not part of our copy.
