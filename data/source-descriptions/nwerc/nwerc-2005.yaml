  description: |-
    Final scoreboard of 46 teams. Each row gives rank, a university logo in an unlabelled column, team name, number of problems solved, total time, and for each of the nine problems A to I the number of attempts and the time of the accepted solution (for example 1/27, or 1/-- when attempted without success, 0/-- when not attempted), with a last column of total attempts and problems solved (for example 13/6). Cells are shaded green for solved and pink for attempted but unsolved problems. Team Interamöba is in first place with six problems solved and a time of 684. The page has no medal marks.
