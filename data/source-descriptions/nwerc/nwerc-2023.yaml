  description: |-
    Final scoreboard of the Northwestern Europe Regional Contest 2023, produced by DOMjudge and last updated Sun 26 Nov 2023 20:25 CET. It lists 150 teams: 143 in the category Contestants and 7 in the category Companies, which are ranked separately from 1 to 7. The contestants show ranks 1 to 130; the last 13 of them, who solved no problem, have no rank shown. Each row gives rank, team name, institution or company, number of problems solved and total time, followed by twelve problem columns A to L showing solve time and number of tries for solved problems and the number of tries for unsolved ones. Twelve rank cells are coloured gold, silver and bronze, four of each, and 21 cells are marked as first solves.

    A summary row at the bottom gives the total solved and, per problem, counts of accepted, rejected and pending submissions, and a legend explains the cell colours. Each team has a details box with name, category, affiliation and location; the contestants' boxes also give the country.
