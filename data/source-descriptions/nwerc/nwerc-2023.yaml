  description: |-
    Problem set of the contest as a PDF of 26 pages, in English. The cover names the 2023 ICPC Northwestern Europe Regional Contest, Official Problem Set, with ICPC and sponsor logos; the second page gives NWERC 2023 and November 26, 2023, lists the twelve problems A to L from Arranging Adapters to Lateral Damage, and has a copyright line of the NWERC 2023 jury under a Creative Commons Attribution-ShareAlike 4.0 licence.

    Pages 3 to 26 hold the twelve statements, each with its time limit. Problems A to K have input and output specifications and sample input and output; problem L is interactive and has a sample interaction instead. Problems A to E, G and I to L take two pages each; F and H take one page each and are followed by a page marked as intentionally left blank. No test data or solutions.
