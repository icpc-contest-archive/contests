  title: NWERC 2023 | NWERC 2023
  language:
  - en
  contest_date: '2023-11-26'
  description: |-
    Website of the 2023 ICPC Northwestern Europe Regional Contest, in English, with a copyright line of the student association W.I.S.V. 'Christiaan Huygens'. The front page says the contest was held from 24 to 26 November 2023 on the Delft University of Technology campus, describes it (five hours; three teams qualify for the ICPC World Finals, ten more for the European Championship), lists the contest material and the test session material, and carries three news items and the sponsors. Our copy holds 150 files, 35 of them pages (HTML and PDF).

    The menu pages cover the contest and earlier NWERC hosts, the schedule, a list of 143 teams grouped under 65 institutions with workstation numbers, rules, jury advice, the contest systems, location, accommodation and contact. The photos page is a Google Photos page whose text is only the album title, NWERC 2023, Nov 24 - 26, 2023.

    Inside are the final scoreboard of the contest, a scoreboard of the online spectator contest, the test session scoreboard, and the problem set, problem slides and solution slides as PDFs for both the contest and the test session. The 9.8 MB test session problem package is in our copy; the 201 MB package of the contest is not. Livestream links lead to YouTube, and some images, scripts and style sheets of the scoreboard pages were not saved.
