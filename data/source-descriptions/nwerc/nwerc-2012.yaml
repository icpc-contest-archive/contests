  title: NWERC 2012 Northwestern European Regional Contest November 23-25 2012
  language:
  - en
  contest_date: '2012-11-25'
  description: |-
    Website of the Northwestern European Regional Contest 2012, hosted by the Delft University of Technology, in English. Our copy holds 19 pages, 17 HTML pages and two PDFs, among 141 saved files (the others are images and a style sheet). The pages cover an introduction to the contest, the schedule of 23 to 25 November, the contest system (software and compiler options), the rules, the teams, four social activities, an online contest for spectator teams, the contest site, travel information, accommodation, and contact details.

    The results pages hold a list of the four top teams, the final scoreboard, a Problems page that links a 24-page contest problem set (problems A to K) and a 14-page jury slide deck, and a media page that links a photo gallery, a video, a newspaper article and team pictures on other servers. The teams page lists 84 teams with institution, team name and a status icon. The online contest page carries its own final standings for 141 spectator teams on problems A to K.

    The archive of test cases and solutions that the Problems page links was not fetched and is not in our copy. The 44 institution logos of the scoreboard page are saved as web pages, not as images, so they do not display. Links to the older NWERC sites, the gallery and the video lead outside it.
