  description: |-
    Final scoreboard of the contest, a page of the contest's own website: 83 teams ranked by problems solved and penalty time, then a separate block of two company teams ranked 1 and 2. Each row gives the affiliation (an institution logo image and a country flag), the team name, the number solved, the total time, and for each of the problems A to K the number of attempts with the solving time and the added penalty, as in 2 (216 + 20). Eight participant teams with no solved problem come last; the first has rank 76 and the other seven carry no rank. The Deepstackers are first with 8 problems.

    Below the table is a summary row with totals (85 teams, 44 affiliations and 10 countries, 275 solved, and per-problem figures) and a legend that separates participants from companies. The country flags and the problem colour markers are in our copy; the 44 institution logos are saved as web pages, not as images, so they do not display.
