  read: '2026-11-16'
  rubric: 1
  copy: nwerc/nwerc-2021/website/2026-09-05-live-b4c51c78
  title: NWERC 2021
  language:
  - en
  description: |-
    Website of the 2021 Northwestern Europe Regional Contest (NWERC), an online contest hosted by Reykjavík University and held on November 20 and 21, 2021, in English. Our copy holds 17 pages (HTML and PDF) among 133 saved files. The front page carries the news items (registration opening, a Friday update on the format, the call for problems, and the announcement that the standings were final after appeals) and links to the contest and practice session material. Further pages cover the contest in general (with the list of previous editions), the rules for the online format, registration, the schedule of the practice day and the contest day, the judging system with compiler commands, the contest virtual machine, the organisation and jury, the call for problems, and the sponsors.

    The contest material is inside: the final standings and the practice session standings as pages, the problem set PDF (26 pages, problems A to L), the practice problem set PDF (8 pages, three problems), the solution slides for the contest (150 pages) and for the practice session (39 pages), and a 7-page Kattis team guide. The packaged problem archives are linked but are not in our copy, and the links to the external live standings and to a hints document lead to other servers.
