    Final standings of the 2021 ICPC Northwestern Europe Regional Contest: 134 teams with rank, team name, institution, problems solved, total time, medal, citation and site citation. Four gold, four silver and four bronze medals go to ranks 1 to 12; the citation column gives the place for ranks 1 to 67 (First Place and so on), and the 67 teams from rank 68 down are labelled Honorable Mention. The site citation column marks the regional champion (NWERC Champions) and the national champions of eleven countries. The first place is Sidney's Cat Tree of the University of Cambridge with 10 problems and a time of 1147. No per-problem detail.
