  description: |-
    Final scoreboard of the contest, titled "The 2017 Northwestern Europe Regional Contest final standings" and produced by DOMjudge: 120 team rows, 119 of them ranked 1 to 119 and one, a University of Bath team at the bottom, without a rank. Each row gives the country flag, team name, institution, number of problems solved and penalty time, then one cell for each of the eleven problems A to K, whose column heads carry the letter and a colour mark (the problem names are in the head's tooltip). A solved cell shows attempts and solve time in minutes (for example 1/230), with nine cells marked as first solves; an unsolved cell shows only a number, 0 for untried or the count of incorrect attempts. First place is Me[N]ta∭ca of the University of Cambridge with 8 problems solved.

    A last row gives the total number of teams (120), affiliations and countries (60 and 10), solves in total (477) and, for each problem, submissions and correct submissions. Below the table are a legend of cell colours (solved first, solved, tried incorrect, tried pending, untried) and a legend of four team categories: Participants, University of Bath, Observers and Self-Registered. The page says it was last updated on 2 February 2018.
