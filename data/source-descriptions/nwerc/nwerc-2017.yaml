  description: |-
    Slides of the jury's presentation of solutions, a PDF of 91 pages in English, credited to The Jury. The opening slides list the twelve jury members with their affiliations and thank four test solvers. The slides then take the eleven problems A to K, Ascending Photo to Knockout Tournament, one after another, in the order B, D, H, G, K, I, A, F, J, C, E. Each problem has a short statement, the solution in steps, for some problems pitfalls, a statistics line from the contest and the name of the problem author. Five problems give the number of submissions and accepted ones; for six the accepted count is a question mark, and one statistics slide of problem J reads FIXME.

    The last slide gives statistics of the jury's work: forum posts, commits, lines of code of the shortest judge solutions and the average number of jury solutions per problem, with the figures for NWERC 2016 alongside.
