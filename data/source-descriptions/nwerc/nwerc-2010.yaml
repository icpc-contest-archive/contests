  description: |-
    Final scoreboard headed 'NWERC 2010 contest final standings': 67 teams and ten problems labelled A to J. Each team row gives rank, team name, number of problems solved, total time, and for each problem the number of attempts; a solved problem also shows two numbers in parentheses (for the first team, 42 + 0 on problem A) which for that team add up to the total time of 1257.

    The affiliation column holds a logo and a country flag for each team as images, which are not in our copy, so the cells show no text. Rank is printed for the first 63 rows; five teams solved nothing, the first of them at rank 63 and the other four without a rank. deFAUlt is first with 8 problems. A final summary row gives the number of teams, 33 / 7 in the affiliation column, 207 problems solved in total, and per problem submissions, correct submissions and the time of the first correct one. A closing line reads Last Update: 21 Nov 2010 16:48.
