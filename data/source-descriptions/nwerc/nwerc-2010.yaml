  description: |-
    Results page of the NWERC 2010 website, headed November 19-21, 2010, which states that the contest was hosted by Jacobs University Bremen. It links to the final standings, the problem set (PDF), the solutions (PDF), example solutions (ZIP), sample input and output (ZIP) and test data (ZIP). The problem texts and solutions are stated to be copyright of the NWERC 2010 jury under a Creative Commons Attribution-Share Alike licence.

    The only result stated on the page is the winner: team deFAUlt from Friedrich-Alexander-University Erlangen-Nuremberg, shown with a photo of the winners. No other teams or places are named. The footer reads last update 2010-11-26. The site menu (home, results, teams, rules, schedule, registration, system, location, organisation, contact) leads to other pages that are not part of our copy, which holds this page only.
