  description: |-
    Standings of the 2010 Northwestern Europe Regional Contest: 67 teams with rank, team name, institution, problems solved, total time and a citation such as First Place or Sixty-third Place. There is no per-problem detail.

    First place is deFAUlt of Friedrich-Alexander-University Erlangen-Nuremberg with 8 problems and a time of 1257; Bubble Sorters of the University of Helsinki and Johan's Angels of Leiden University follow with 7 problems each. Teams with equal results share a place, so the last five teams, all with no problems solved, are listed as sixty-third.
