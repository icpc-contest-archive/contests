  title: ICPC - Asia Kharagpur
  language:
  - en
  description: |-
    Website of the ICPC Asia Kharagpur regional contests hosted by IIT Kharagpur, in English. Our copy holds 76 pages (119 files, including style sheets and images) from several editions, not only this one. The home page has menus for About, ICPC History, People, announcements, selected teams for the onsite contest, problems, ranks and the director's report, plus rules, schedule, registration and FAQ pages.

    For 2018 it holds the problem set of 20 pages, the final standings of 84 teams, a 16-page list of 516 ranked teams and a 4-page list of teams selected for the onsite contest of 15 and 16 December 2018. It also holds material of other years: problem sets of 2012, 2013 and 2017, a 2016 rank list and director's report, a 2017 ranking, and a provisional 2019 list of selected teams. One copy of the 2017 problem set PDF is cut short and does not open.
