  description: |-
    Problem set as a PDF of 20 pages with 12 problem statements in English, each headed by a title and a problem code in parentheses, from AND on Graph (GRAPHAND) to Another Game of Life (VASTLIFE). The problems are not labelled with letters. Each of the 12 statements gives the task, input and output formats, constraints, an example input and output, and an explanation of the example. There is no cover page and no test data or solutions.
