  language:
  - en
  description: |-
    Website of the ACM-ICPC Asia Kharagpur regional contests hosted by IIT Kharagpur, in English. Our copy holds 76 pages (119 files) from several editions, not only this one: the home page with menus for rules, programming environment, schedule, registration, teams selected for the onsite round, FAQ and people, and PDFs from 2012 to 2019.

    For 2016 it holds the contest director's report (one page: online round of 430 teams, 76 teams onsite on 16 and 17 December 2016, 11 problems), the onsite rank list of 76 teams with solved count, total time and last solution, and a waiting list of teams. It also holds the 2017 online ranklist and onsite ranking, the 2017 onsite problem set of 29 pages, problem sets of 2012 and 2013, the 2018 onsite problems, and lists of teams selected for the onsite rounds of later years, one of them with a payment deadline in November 2019. One copy of the onsite problem set PDF is cut short and does not open.
