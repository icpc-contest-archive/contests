    Scoreboard titled Summary - Programming Contest, exported from Microsoft Word to HTML: 39 teams with rank, team name, problems solved and time, and for each of the eight problems A to H two numbers separated by a slash, with -- after the slash where the problem is unsolved. The last column, headed Total att / solv, gives total attempts and problems solved. The table has no institutions. First place: Effort_infinie with 4 problems solved and time 603. The 13 teams with no solved problem all carry rank 27. A header row is repeated at the bottom of the table.

    The file is encoded in UTF-16 and carries a large block of Word style markup.
