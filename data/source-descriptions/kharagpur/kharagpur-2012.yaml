  description: |-
    Website of the 2012 ICPC contest at IIT Kharagpur, in English, with a side menu; the home page states that it was conducted in association with IBM and that IIT Kharagpur plays host to this year's contest. Our copy holds 13 files: 11 page addresses (the home page is saved under two addresses) and two banner images. The pages are the home page, general pages on ICPC, its history, the role of ACM and IBM's commitment, a registration form for teams, registration steps for Indian teams through the ICPC site (team of a coach and three contestants, registration period 23 July to 19 September 2012), a FAQ, contact details and directions for reaching IIT Kharagpur.

    The pages are mostly general text about the ICPC. No schedule, team list, problems or results are in our copy.
