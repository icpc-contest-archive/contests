  description: |-
    Website of the ACM-ICPC Asia Kharagpur regional contests hosted by IIT Kharagpur, in English. Our copy holds 76 pages (119 files) from several editions, not only this one: the home page with menus for rules, programming environment, schedule, registration, teams selected for the onsite round, FAQ and people, and PDFs from 2012 to 2018.

    For 2017 it holds the onsite ranking (2 pages), the online ranklist (12 pages), the list of teams selected for the onsite contest (3 pages) and the official onsite problem set of 29 pages with 11 problems. It also holds a 2016 onsite rank list and contest director's report, problem sets of 2012 and 2013, and lists of teams selected for 2018. One copy of the onsite problem set PDF is cut short and does not open.
