  description: |-
    Final scoreboard titled "Summary - Programming Contest": 79 teams with rank, team name, problems solved and time, then one column per problem A to J showing the number of attempts and the minute of the first accepted run ("--" when none), and a total of attempts and solved. Ranks run from 1 to 62; 18 teams have no problems solved. A last row gives, per problem, runs submitted, minute of the first accepted run and total accepted runs. The top team solved 7 problems with time 544.

    No institutions are given, only team names.
