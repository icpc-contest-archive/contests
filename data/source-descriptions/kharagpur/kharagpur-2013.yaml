  description: |-
    Standings of the Kharagpur regional contest: 79 teams with rank, team name, institution, number of problems solved, time and citation. The citation column gives First Place down to Thirty-ninth Place to the top 39 teams and Honorable Mention to 22 more; the last 18 teams, with no problems solved, have no citation. No per-problem detail. The first place is held by a team from the International Institute of Information Technology - Hyderabad with 7 problems and time 544.
