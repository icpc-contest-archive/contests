  description: |-
    Problem set as handed out at the contest: a PDF of 24 pages with a cover headed "ACM-ICPC 2013 Asia Regional Contest Kharagpur Site", IIT Kharagpur and December 15, 2013, and the line "10 Problems, 24 pages, 300 Minutes". After a page of 16 contest rules come ten problems A to J, from Election Campaign (A) to Nomad Camp (J). Each problem gives its input and output as standard input and output, a statement in English with input and output format, and a sample input and output. No test data or solutions.
