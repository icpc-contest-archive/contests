  title: ACM-ICPC - Asia Kharagpur 2013 Asia Region - Kharagpur Site
  language:
  - en
  description: |-
    Website of the Asia Regional Contest, Kharagpur site, hosted by IIT Kharagpur in association with IBM, in English. The home page announces the contest and lists dates: registration from 5 August, an online invitational contest on 2 November and the regional contest on 14 December. It has sections on the contest, ICPC history, the role of ACM, IBM's commitment, the location (how to reach Kharagpur) and contacts, plus links to the regional results page, a one-page report from the contest director and a PDF of the onsite problems. The report states that 724 teams took part in the online round, that 79 teams competed onsite on 14 and 15 December 2013, and that the contest had 10 problems and lasted five hours.

    Our copy holds 34 pages. The addresses for rules, schedule, updates, registration instructions for Indian teams and the programming-environment page return the home page again, so those sections are not in our copy.

    The site also holds other years. A separate 2012 section has its own about, registration, FAQ, important-dates and contact pages, and a PDF problem set of 25 pages dated 9 December 2012 with eight problems. One FAQ page carries a 2014 copyright line and a registration deadline of 7 October 2014.
