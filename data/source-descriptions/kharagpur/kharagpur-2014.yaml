  description: |-
    Final ranking PDF of three pages headed "Final Ranking of ACM ICPC ASIA Regionals Kharagpur Onsite Contest": 73 teams, one row each, with rank, team name, problems solved and time, then ten cells, one per problem, each of two numbers separated by a slash (the second is "--" when the problem was not solved), and a final cell of two numbers. Ranks run from 1 to 71; three teams solved nothing and share rank 71. The first place is held by a team named Carpe_Diem with 9 problems and time 624.

    The text has no institutions and no column headings; the cells of the ten problems are not labelled.
