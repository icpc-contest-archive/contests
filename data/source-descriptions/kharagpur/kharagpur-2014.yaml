  copy: kharagpur/kharagpur-2014/website/2026-10-20-wayback-940510eb
  title: ACM-ICPC - Asia Kharagpur
  language:
  - en
  description: |-
    Website of the Asia Kharagpur regional contest, hosted by IIT Kharagpur and sponsored by IBM, in English. The home page carries a copyright line of 2014 and has sections on the contest, ICPC history, the role of ACM, IBM's commitment, the location (how to reach Kharagpur, weather, food) and contacts. Its menu links to a PDF of the onsite problems, a PDF of the regional results and the 2013 section of the site. The two PDFs are in our copy, along with a two-page sponsorship brochure for a later contest.

    Our copy holds 28 pages and mixes editions. The addresses for rules, schedule, updates and programming environment show the 2016 edition: practice and online rounds on 21 and 22 October 2016, onsite rounds on 16 and 17 December 2016, and the online-round rules. The 2013 and 2012 sections are also present, with the 2013 results page, the 2013 director's report PDF and the 2013 and 2012 problem sets. The sponsorship brochure also speaks of the 2016 contest.
