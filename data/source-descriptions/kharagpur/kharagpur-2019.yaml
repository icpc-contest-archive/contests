  title: ICPC - Asia Kharagpur
  language:
  - en
  description: |-
    Home page of the ICPC Asia Kharagpur regional site at IIT Kharagpur, in English. A menu lists Home, About, ICPC History, People, Important Announcement, Selected Teams Onsite Contest, Additional Teams Selected, IITKGP Problems, IITKGP Ranks and Director's Report. The announcements say that onsite registration for foreign teams is open, that a provisional list of selected Indian teams is published, that teams are chosen on the decision of a meeting of the regional contest directors of India (with a link to its minutes), that teams must pay a registration fee of Rs. 5000 and confirm before 15 November 2019, and that a waiting list exists.

    The page also gives travel, weather and food information for Kharagpur. The lists and the minutes are linked as PDFs that are not part of this copy, and the menu entries are in-page anchors. It holds no results. Our copy has the style sheets and images.
