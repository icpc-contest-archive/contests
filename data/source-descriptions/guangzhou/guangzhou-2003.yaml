  description: |-
    Website of the 2003 ACM-ICPC Asia regional contest in Guangzhou, hosted by Sun Yat-sen (Zhongshan) University, titled 中山大学ACM竞赛 (Zhōngshān Dàxué ACM jìngsài, "Sun Yat-sen University ACM contest"). It is in Chinese, with team names and the problem set in English. Our copy holds 101 pages and documents, including the problem set PDF and a testdata.rar archive, plus 45 photographs.

    The front page links the contest results, the problem set as a PDF and the test data, followed by news items dated 22 to 24 November 2003: the opening ceremony and the draw, the start of the contest, and photo reports from the contest day. A menu leads to pages for the introduction, organising committee, schedule, rules, contact, results, problems and a report; the report page is an empty placeholder. The introduction says the contest is both the Asia regional and a Guangzhou invitational for mainland universities, with medals for the invitational. The schedule runs from registration on 21 November to the contest on 23 November, 09:30 to 14:30.

    The results page lists the ranked teams with rank, name, solved and score, with gold, silver and bronze marked for the top teams, followed by two further teams in alphabetical order. A page of team photographs is headed by the names of the participating universities.
