    Statement of "New Go Game" as a PDF of 2 pages, in English, headed with the number 2950. It opens with a short introduction to Go, then asks to rebuild a board of black stones from four groups of counts (rows, columns, and two diagonal directions) and to count the enclosed intersections. It has Input, Output, one Sample Input and one Sample Output, and works through a 5x5 example board referred to as a figure. The header under the title reads "Asia - Guangzhou - 2003/2004" and the text ends with the lines "Guangzhou 2003-2004" and a tests-setter credit. The PDF prints no problem letter.
