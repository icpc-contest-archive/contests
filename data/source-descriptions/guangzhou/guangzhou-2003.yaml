    Statement of "Elevator Stopping Plan" as a PDF of 2 pages, in English, headed with the number 2949. An elevator in a 31-floor building takes 4 seconds per floor and 10 seconds per stop, and the task is to choose stopping floors that minimise the time the last person needs to reach their floor. It has Input, Output, one Sample Input and one Sample Output. The header under the title reads "Asia - Guangzhou - 2003/2004" and the text ends with the lines "Guangzhou 2003-2004" and a tests-setter credit. The PDF prints no problem letter.
