    Statement of "Special Experiment" as a PDF of 2 pages, in English, headed with the number 2948. It describes atoms of a new element that can move between energy states only for some pairs of states, and asks for the highest total energy of atoms placed in a container so that no two atoms are "dangerous" (same state, or the same state after one emitted or absorbed photon). It has Input, Output, one Sample Input and one Sample Output. The header under the title reads "Asia - Guangzhou - 2003/2004" and the text ends with the lines "Guangzhou 2003-2004" and a tests-setter credit. The PDF prints no problem letter.
