  description: |-
    Scoreboard of the onsite contest in Chinese, from a Chinese ACM-ICPC board site (acmicpc.info) whose menu links boards of other contests of 2008 to 2014: online rounds, regionals, invitationals and World Finals, some of them marked as missing. It lists 176 team rows with school, rank, team name, number solved and penalty time, followed by one column for each of the eleven problems A to K. Problem cells give attempts and a time; the problem headings carry two counts each, such as 10/114 for A. The first team to solve each problem is marked, and a legend distinguishes first to solve, solved, attempted and pending judgement. The page is stamped 2014/11/23 16:58:54 with the contest start 2014-11-23 09:00, and states the medal numbers as 18, 32 and 52 (gold, silver, bronze).

    Four rows from South China University of Technology carry an asterisk before the school and team name and are ranked in the table (second, seventh, thirteenth and forty-sixth); the other 172 rows have no asterisk. Shanghai Jiao Tong University is first with 10 problems solved. The page's script and style files are in our copy; the menu links lead to boards of other contests that are not part of it.
