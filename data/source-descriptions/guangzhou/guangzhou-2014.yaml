    Final scoreboard on XCPCIO, headed ICPC 2014 广州赛区现场赛 (ICPC 2014 Guǎngzhōu sàiqū xiànchǎngsài, "ICPC 2014 Guangzhou site onsite contest"), for a five-hour contest; the header shows its start and end in CST as 2014-11-22 19:00 and 2014-11-23 00:00, while the page's own description gives 2014-11-23 09:00 to 14:00 (UTC+8). Eleven problems A to K, each column head showing the number of teams that solved it; per team it gives place, institution, team name, problems solved, penalty time, and tries and solve time per problem, with Dirt and SE columns. The three teams of 华南理工大学 (South China University of Technology) are marked with an asterisk, and tabs offer all, official and starred teams. Summary rows at the foot give submissions, attempts, accepted runs and first and last solve times per problem.

