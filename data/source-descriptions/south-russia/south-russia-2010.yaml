  language:
  - ru
  - en
  description: |-
    Website of the Southern Subregion contest of ACM ICPC, NEERC, in Russian with some pages in English. The site is kept from year to year, so our copy mixes editions: it holds pages captured between 2001 and 2023, with front-page news up to 2019, Code Game Challenge pages of 2006 and 2013, and standings pages for the 2010-2011 and 2011-2012 contests. For 2010 it has front-page news posted on 2010-10-23 and 2010-11-02 (top three teams, the 14 teams going on to the semifinal, two extra places, Code Game Challenge 2010 winners) and a standings page for ACM ICPC 2010-2011 with 63 teams and problems A to L, giving solved count, penalty and, per problem, attempts and solve time.

    Other pages cover the organising committee, jury and technical group, programme, contest rules (one page in English), information letters, contracts, a team list, the Code Game Challenge, an archive page linking results of earlier years, and individual team pages. The standings of the regional school team olympiad are also there, 32 teams in 2010 and 68 in 2011, scored per problem.

    Our copy holds 138 pages; many are the same page saved under http and https addresses or on different dates, and a few are server directory listings.
