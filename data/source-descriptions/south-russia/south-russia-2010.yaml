  description: |-
    Dashboard of the contest 2010-2011 ACM-ICPC, NEERC, Southern Subregional Contest on Codeforces Gym, marked Finished. It lists problems A to L with names (Bencoding, 3D City Model, Explode 'Em All, Fire in the Country, Kidnapping, Elevator, Revolutionary Roads, ``North-East'', Oil Wells, Buoys, Running Hero, It's Time to Repair the Roads), file input and output, time limit (1 to 5 seconds), memory limit and a count written as x followed by a number for each.

    A link leads to the English statements as one PDF, and each problem has its own link. Three announcements are shown: a note preferring the PDF statements, and two about problem J being investigated and rejudged. The statements themselves are not in the page; the style sheets and scripts are in our copy.
