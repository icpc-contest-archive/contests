  description: |-
    Website of the Southern and Volga Russia regional contest, in Russian. Our copy holds 53 pages. The front page announces the qualifying stage of the 2026-2027 season, to be held on 11 October 2026, so it belongs to a later edition. The pages of the 2025 edition are the programme (registration, opening ceremony and practice round on 27 October 2025, main round on 28 October 2025, departure on 29 October), the organizing committee, the jury and technical group, a short statement of the rules, a documents page with the information letter, and the scoreboard of the 2025-2026 regional contest. That scoreboard is held as a frozen scoreboard of 86 teams with problems A to M, plus ten coaches' teams and ten Contest Jury test rows marked with *, and again on the 2025 standings page.

    The team list page has its column headers and no team rows. An archive page leads to results by year; our copy holds the regional standings pages for 2010 to 2025, qualification standings for 2017 to 2025 and school olympiad standings for 2010 to 2025, which cover other editions, and a frozen scoreboard of 44 teams of the school olympiad regional stage of 2025.
