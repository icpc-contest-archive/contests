  description: |-
    Codeforces Gym dashboard of 2011-2012 ACM-ICPC, NEERC, Southern Subregional Contest, marked Finished. It lists problems A to L (Bonnie and Clyde, Building Foundation, Dice Tower, Dirty Dishes, Berland Chess, Divisibility, Traffic Lights, BR Privatization, Recruiting, Computer Network, Emoticons, Multiswap Sorting), each with input and output file names, a time limit of 2 to 6 seconds, a 256 MB memory limit and a count written as x followed by a number.

    A note marked on 11 of the 12 problems (all but H) says the package was not updated after a judging server upgrade, so execution times are multiplied by two. Links lead to the English statements and to the problem pages; the statements are not in this page.
