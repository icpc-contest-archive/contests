  title: Northern Eurasia Contests
  language:
  - en
  description: |-
    Archive site of the Northern Eurasia Contests (NEERC, later NERC), in English. Our copy holds one page per year from 1996 to 2018 (the site's year menu runs to 2022), an archive index page and the standings pages of 2011 and 2012. The page for 2011 lists the NEERC final and its regional contests, each with a link to its final standings, among them Southern and Volga Russia; the 2012 page does the same. The Southern and Volga Russia standings of 2011 and 2012 are in our copy. It is the archive of the whole Northern Eurasia series, not a site of this contest alone.

    Besides standings pages for the regions in 2011 and 2012, our copy holds PDFs of the problems of the NEERC finals of 2011 (16 pages) and 2012 (14 pages), of the Northern Subregional contests of 2011 and 2012 and of the 2012 Central Russia quarterfinal, an analysis PDF for 2011 and a review PDF for 2012 (13 pages each, credited to one author), and an XML standings file of the 2012 Northern Subregional contest. It has no problem statements or other pages specific to the Southern contest of 2011 beyond its standings.

    Our copy holds 147 pages under 150 addresses, 67 distinct addresses once http, https and port variants are merged; the front address only redirects to another page that is not in our copy.
