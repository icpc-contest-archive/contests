    Final standings of NEERC Southern Subregional Contest 2011, status over at 5:00:00 of 5:00:00: 71 teams ranked, with rank, team name followed by the names of its three members, problems A to L, number solved and penalty time. Each problem cell shows a plus or minus, the number of extra attempts and, for accepted problems, the time of the accepted run in minutes and seconds; a Show time box hides or shows the times. The first place solved nine problems with a penalty of 1436. One team, ranked sixth, has an asterisk before its name, and the page does not say what it means.

    Summary rows under the table give, per problem, total runs, accepted, rejected, and the time of the first and last accepted run.
