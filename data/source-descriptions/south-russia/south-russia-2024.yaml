  description: |-
    Website of the Southern and Volga Russia regional contest, in Russian. Our copy holds 66 pages, taken at different dates between 2001 and 2026. The pages of the 2024 edition, captured in November and December 2024, are the news page, which lists 24 teams invited to the Northern Eurasia championship and 40 teams invited to the final of the Southern and Volga championship, with notices about the reference document, the information letter and the qualification stage; the list of 98 registered teams with registration status; the organizing committee; the jury and technical group; the programme (registration, opening ceremony and practice round on 11 November 2024, main round on 12 November 2024, problem discussion and closing ceremony the same day, departure on 13 November); a short statement of the rules; a documents page; and an archive page linking results by year from 2010 to 2024.

    The results pages are the scoreboard of the 2024-2025 regional contest with problems A to N (98 teams and ten Contest Jury test rows) and the Codeforces standings of its qualification round. The copy also holds material of the next edition: the 2025-2026 regional scoreboard, its qualification standings, and a PDF of 195 pages with solution slides dated 28 October 2025, which belong to that later contest. School olympiad standings and older pages headed ACM ICPC, NEERC, Southern Subregion are in it too; seven pages are directory listings.
