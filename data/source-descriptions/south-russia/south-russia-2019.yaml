  description: |-
    Codeforces contest page for the 2019-2020 ICPC, NERC, Southern and Volga Russian Regional Contest, run as an online mirror under ICPC rules with teams preferred. It lists 14 problems A to N by name, each with a time limit between 2 and 5 seconds, a memory limit of 512 MB (256 MB for problem F), and a count such as x1043. A general announcement gives a link to the statements as a PDF, and the contest materials menu lists an announcement and the PDF statements.

    The statements are not in our copy: the links to them lead to Codeforces. The page also carries the site's menus and forms for questions.
