  description: |-
    Website of the Northern Eurasia Contests archive, in English, with menus NE Finals, Regional Contests and Archive and a yearly index page for every year from 1996 to 2025. The 2019 index page lists the finals and the regional contests of that year; its entry for Southern and Volga Russia reads that no information is available, although a Southern Subregional 2019 standings page is also in our copy.

    Our copy holds 150 files under 76 distinct addresses, several pages being saved more than once. Besides the Southern standings it holds the standings, statement PDF and tutorial PDF of the 2019 finals, the 2020 finals standings and PDFs, standings of other regional contests of 2019 and 2020, and statements, tutorials and a final page of the Northwestern Russia contests.
