  description: |-
    Final scoreboard of Southern Subregional 2019 in the NEERC archive format, in English: the clock reads 5:00:00 of 5:00:00 with status over. It lists 76 teams, each as an abbreviated institution name with a number followed by the names of its three members, with a column for each of the 14 problems A to N, then a solved count and a total time. A problem cell shows a plus sign with the number of rejected attempts and the time of acceptance, a minus sign with rejected attempts, or a dot when untouched.

    Below the table are rows with total runs, accepted, rejected, first accept and last accept for each problem. Rows are not marked as official or guest teams, and there are no medal or award marks.
