  description: |-
    Website of the Northern Eurasia Contests archive, in English, with menus NE Finals, Regional Contests and Archive. Our copy holds an index page for each year from 1996 to 2025. The 2017 index page lists the finals and the regional contests of that year; for Southern and Volga Russia it offers one item, Standings, the final standings page of Southern Subregional 2017.

    Our copy holds 150 files under 72 distinct addresses, several pages being saved more than once. Besides the Southern 2017 standings it holds the final standings of the 2017 and 2018 finals, standings of other regional contests of 2017 and 2018, and PDFs of statements, analysis and review for the 2017 and 2018 finals and for some regional contests. The 2018 index page says no information is available for Southern and Volga Russia.
