    Codeforces contest page for the 2017-2018 ACM-ICPC, NEERC, Southern Subregional Contest, run as an online mirror under ACM-ICPC rules with teams preferred. It lists 13 problems A to M by name, each with its time limit (1 s for A, 2 s for J, 3 s for the other eleven), a 256 MB memory limit, and a count shown as x225, x43 and so on. A general announcement says a single PDF with the problem statements is available.

    The statements themselves are not in our copy: the links to the PDF and to the problem pages lead to Codeforces. The page also carries the site's menus, forms for questions and announcements, and notes on practice and virtual participation.
