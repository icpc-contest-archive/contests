  description: |-
    Final scoreboard of Southern Subregional 2017 in the NEERC archive format, in English: the clock reads 5:00:00 of 5:00:00 with status over. It lists 72 teams, each as an institution name with a number, with a column for each of the 13 problems A to M, then a solved count and a total time. A problem cell shows a plus sign with the number of rejected attempts and the time of acceptance, a minus sign with rejected attempts, or a dot when untouched.

    Below the table are rows with total runs, accepted, rejected, first accept and last accept for each problem. Rows are not marked as official or guest teams, and there is no medal or award marking.
