    Dashboard of the Codeforces contest "2016-2017 ACM-ICPC, NEERC, Southern Subregional Contest (Online Mirror, ACM-ICPC Rules, Teams Preferred)", shown as finished. It lists 12 problems A to L (Toda 2, Minimum and Maximum, Bulmart, Running Over The Bridges, Award Ceremony, Ber Patio, Car Repair Shop, Delete Them, Olympiad in Programming and Sports, Bottles, Roads Orientation Problem, Expression Queries), each with its time limit (1.5 to 5 seconds), a memory limit of 512 MB and a count printed as x followed by a number. Contest materials are linked: an announcement, a statements PDF in English and three tutorials labelled Chinese, Russian and English.

    The page has the problem list only. The statements, announcement and tutorials are linked and are not part of our copy.
