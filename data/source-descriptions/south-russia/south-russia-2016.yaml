  description: |-
    Contest website of the Southern Subregional contest, written mostly in Russian, kept at one address over many years. Our copy holds 105 pages, saved at dates from 2001 to 2023. The pages of different dates show different years: the front page saved in December 2017 carries news of that year's registration, the front page saved in November 2019 reports the 2019 results, and some pages are of a 2006 Code Game Challenge. The general pages cover news, programme, rules, committee, jury, contracts, team list and photo gallery.

    For 2016 the copy has the page headed "2016-2017 ACM-ICPC, NEERC, Southern Subregional Contest", a scoreboard of 73 team rows with problems A to L, number solved, penalty and tries. A programme page gives the schedule of 16 to 19 October 2016, with the school olympiad on the 16th and the main round of the competition on the 18th, and a team list has 73 teams with a registration status. The site also holds the standings of the 2017-2018 edition (73 team rows, problems A to M), the results of the qualifying round of 2017 (233 team rows, problems A to M), and the standings of the regional stage of the school olympiad for 2016 (64 team rows, problems A to K) and 2017 (68 team rows, problems A to L).
