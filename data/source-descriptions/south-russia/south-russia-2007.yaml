  description: |-
    Archive website of the Northern Eurasia Contests (NEERC), shared by the finals and all regional contests, in English. Our copy holds 150 saved pages (several of them the same page saved under http, https and port-80 addresses), mostly the 2007 and 2008 archive pages and the standings pages of the regional contests of those years. The 2007 page lists, for the finals and each region, links to standings, problem statements and tests; its Southern and Volga Russia section links only to the standings.

    The standings page of the 2007-2008 Southern Subregional Contest is inside, together with the standings of the other subregions and the PDF of the 14-page NEERC finals problem set dated 28 November 2007. Index pages of other years from 1996 to 2025 are saved too, mostly as single pages. The site holds no problem statements of the southern contest itself.
