  description: |-
    Pages of the Northern Eurasia Contests website, in English. Our copy holds 142 pages: a resources page for each finals year from 1996 to 2025, the finals standings for 2000 and 2001, and for the years 2000 and 2001 one page for each regional contest (Central, Eastern, Western, Northern, Southern, Siberian, East Siberian, Far Eastern), some with problem and test archives as RAR files.

    The NEERC 2000 Southern Subregion page names Saratov State University in Saratov as host, lists the regions and republics of the subregion, and gives a results table of 39 teams with rank, team ID, team name, number solved, time and the attempts per problem for eight problems labelled A, B, C, L, P, W, X and Y. The eleven teams with no solved problem share rank 29. The 2001 Southern Subregion page has its own results table (team names in Russian, problems B to H) and a link to a problem archive.

    The site is the NEERC archive, not a site of the subregion; its link to the subregion's own home page leads outside our copy.
