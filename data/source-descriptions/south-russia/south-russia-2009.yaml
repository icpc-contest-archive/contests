  description: |-
    Archive website of the Northern Eurasia Contests (NEERC), shared by the finals and all regional contests, in English. Our copy holds 150 saved pages (several of them the same page saved under http, https and port-80 addresses), mostly the 2009 and 2010 archive pages and the standings pages of the regional contests of those years. The 2009 page lists, for the finals and the regions, links to standings, problem statements, tests and analysis; its Southern and Volga Russia section links only to the standings.

    The standings page of the 2009-2010 Southern Subregional Contest is inside, together with those of the other subregions and the PDF of the 13-page NEERC finals problem set dated 11 November 2009. Index pages of other years from 1996 to 2023 are saved too, mostly as single pages. The site holds no problem statements of the southern contest itself.
