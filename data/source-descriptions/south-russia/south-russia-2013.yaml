    Final standings of Southern Subregional 2013, status over at 5:00:00 of 5:00:00: 59 teams ranked, with rank, team name (for most teams followed by the names of its three members), problems A to M, number solved and penalty time. Each problem cell shows a plus or minus, the number of extra attempts and, for accepted problems, the time of the accepted run in minutes and seconds; a Show time box hides or shows the times. The first place solved nine problems with a penalty of 1184. Five teams have an asterisk before their name and are listed without member names; the page does not say what the asterisk means.

    Summary rows under the table give, per problem, total runs, accepted, rejected, and the time of the first and last accepted run.
