  title: Northern Eurasia Contests
  language:
  - en
  description: |-
    Archive site of the Northern Eurasia Contests (NEERC), in English. Our copy holds one page per year from 1996 to 2014, an archive index page and the standings pages of 2013 and 2014. The page for 2013 lists the NEERC final and its regional contests with a link to final standings for each region, among them Southern and Volga Russia; the 2014 page does the same. The Southern and Volga Russia standings of 2013 and 2014 are in our copy. It is the archive of the whole Northern Eurasia series, not a site of this contest alone.

    Besides the regional standings pages for 2013 and 2014, our copy holds PDFs of the problems or statements of the NEERC final in 2013 and 2014, review PDFs by one author (13 pages for 2013, 21 for 2014), Northern Subregional statements for 2013 and 2014, an analysis PDF of 69 pages for the 2014 Northern Subregional contest, and an XML standings file of the Northern Subregional contest of 2013. One saved copy of that analysis PDF is cut short at 1 MiB and does not open; the others are whole. It has no problem statements or other pages specific to the Southern contest of 2013 beyond its standings.

    Our copy holds 147 pages under 150 addresses, 64 distinct addresses once http, https and port variants are merged; the front address only redirects to another page that is not in our copy.
