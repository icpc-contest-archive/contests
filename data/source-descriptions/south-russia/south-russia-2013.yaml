  description: |-
    Codeforces Gym dashboard of 2013-2014 ACM-ICPC, NEERC, Southern Subregional Contest, marked Finished. It lists problems A to M (TV, Travelling Camera Problem, Equivalent Cards, Grumpy Cat, Scientific Battalion, Judging Time Prediction, Expression Evaluation, Password Service, Plugs and Sockets, Contest, Another Contest and Train, Road Work, Stock Trading Robot, Winnie-the-Pooh Needs Help), each with standard input and output (marked 'standard input/output'), a time limit of 2 to 9 seconds, a 256 MB memory limit and a count written as x followed by a number.

    A note on every problem says the package was not updated after a judging server upgrade, so execution times are multiplied by two. Links lead to the English statements and to the problem pages; the statements are not in this page.
