  contest_date: '2008-10-17'
  description: |-
    Website of the Southern Subregional contest (ACM ICPC, NEERC, Southern Subregion), hosted by Saratov State University, in Russian with a few English pages. Our copy holds 139 pages saved on many different dates, so it mixes editions. The pages from October 2008 to August 2009 carry the news that the contest ended on 17 October 2008 with Saratov State University #1, #2 and #3 as the top three and that the Code Game Challenge ended on 16 October; the programme for 13 to 18 October 2008 with the main round on 17 October; the first information letter; a list of 66 registered teams; the officials page; and an information letter for the school olympiad. The contract and act pages hold only a download link, and those files are not in our copy.

    Other snapshots carry other years: a photo gallery page from 2004/05, Code Game Challenge 2006 pages, news from 2010, the 2011 programme, and pages from 2016 to 2023, among them many individual team pages. The results of the 2008 contest are not in our copy: only a banner image from the monitor directory was saved, not its pages.
