    Final standings of the contest in the Codeforces gym: 200 rows, ranked 1 to 188 with tied entries sharing a rank, of the 221 entries the page counts. Each row gives a team or participant name, problems solved, penalty time and, for each of the eleven problems A to K, the attempts and, for solved problems, the solving time. A closing row gives accepted and tried counts per problem. Original participants are shown as ghost participants in grey (188 of the 200 rows); twelve rows are not ghost entries, among them the first-place team, so ghost and non-ghost entries are mixed in one ranking.

    Entries 201 to 221 are on a second page that is not in our copy.
