    Codeforces gym page of the contest, marked Finished: a list of eleven problems A to K (Cyclic Troubles, Bergamot Problem, Berhatton, ''Binary Cat'' Club, Dance it up!, Text Editor, Friends of Friends, Berodoskar Development, The last hour of the contest, Geologist Dubrovsky, Terrorists in Berland) with time limits of 1, 2 or 5 seconds, a 64 MB memory limit and the number of gym solvers for each. It links a statements PDF in English, a complete problemset page and a statement page per problem; none of these is part of our copy, which holds only this page with its style sheets and scripts. The rest is the gym's menus, virtual participation notice and question and announcement forms.
