  description: |-
    Pages of the Northern Eurasia Contests website, in English. Our copy holds 149 pages, several of them the same page under different addresses: a resources page for each year from 1996 to 2025, the finals standings for 2003 and 2004 with the 2003 and 2004 problem statements as PDF (2003 also as PostScript), and for both years standings pages of regional contests, among them Southern, Northern, Central, Western, Ural, Moscow, West Siberian, East Siberian, Far Eastern, Kazakhstan and Uzbekistan.

    The 2003 resources page lists Southern and Volga Russia under Regional Contests with a link to its standings only. That standings page, which our copy holds, is the board of the 2003-2004 NEERC Southern Subregion. The site is the NEERC archive, not a site of the subregion.
