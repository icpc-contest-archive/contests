  title: Northern Eurasia Contests
  language:
  - en
  description: |-
    Archive site of the Northern Eurasia Contests (NEERC), in English. Our copy holds 150 saved addresses, which are 61 different addresses once the http, https and port variants are merged, saved at dates from 2012 to 2026. It has the archive index, the index pages for the years 1996 to 2008, 2015 and 2016, the final standings of the Northeastern European Regional Contest for 2015 and 2016, and the standings pages of the regional contests of both years (Southern, Northern, Moscow, Ural and others, from Armenia to Uzbekistan).

    The 2015 index page lists the final's standings, problems and tests, and under "Southern and Volga Russia" a single link to the contest's final standings, which our copy holds as the page headed "Southern Subregional 2015". The site also holds the 2016 Southern standings, a different edition. Besides standings the copy has eight PDFs: statements and problem reviews of the 2015 and 2016 finals, and statements and analyses of the Northern subregional contests of both years. It has no problem statements or analysis for the Southern 2015 contest.
