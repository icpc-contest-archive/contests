  description: |-
    Final scoreboard headed "Southern Subregional 2015", with the clock shown as 5:00:00 of 5:00:00 and status over. It lists 72 teams by rank, with team name and its three members, a cell for each of the 13 problems A to M, the number solved and the penalty time. A cell shows a plus for a solved problem with the rejected tries and the minute of the accepted run, a minus with the number of tries for an unsolved problem, and a dot for a problem not tried. Two team names carry an asterisk before them. Nizhny Novgorod State University #1 is first with 11 problems and 1156 minutes.

    Below the table the page gives totals per problem: runs, accepted, rejected, and the times of the first and last accepted run.
