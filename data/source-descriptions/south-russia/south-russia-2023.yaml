  description: |-
    Website of the Southern and Volga Russia regional contest, in Russian. Our copy holds 69 pages, taken at different dates between 2001 and 2025. The pages of the 2023 edition are the news page, which lists the 28 teams going on to NERC and carries notices about the team reference document, the information letter and the qualification stage of 8 October 2023; the list of 83 registered teams with registration status; the organizing committee; the jury and technical group; the programme (registration, opening ceremony and practice round on 31 October 2023, main round on 1 November 2023, problem discussion and closing ceremony the same day); a short statement of the rules; and a documents page with the information letter.

    The results pages are a scoreboard of the 2023-2024 regional contest with problems A to N, the Codeforces standings of its qualification round, the same two for 2024-2025, and the standings of the school olympiad regional stage for 2023 and 2024. An archive page links results by year from 2010 to 2023. Older pages, headed ACM ICPC, NEERC, Southern Subregion, cover earlier editions; seven pages are Apache directory listings from 2001.

    Style sheets and script files are in our copy; the older pages are encoded in windows-1251.
