  description: |-
    Final scoreboard headed "Southern Subregional 2014", with the clock shown as 5:00:00 of 5:00:00 and status over. It lists 53 teams by rank, with the team name and its three members, a cell for each of the 13 problems A to M, the number solved and the penalty time. A cell shows a plus for a solved problem with the number of rejected tries and the minute of the accepted run, a minus with the number of tries for an unsolved problem, and a dot when the team did not try it. Saratov State University #1 is first with 10 problems and 1036 minutes; two teams have no problem solved. Rank 52 is shared by two teams with equal results.

    Below the table the page gives for each problem the total runs, accepted, rejected, and the times of the first and last accepted run.
