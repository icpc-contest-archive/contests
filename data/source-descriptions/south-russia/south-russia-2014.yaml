  language:
  - ru
  - en
  description: |-
    Contest website of the Southern Subregional contest, written mostly in Russian, kept at one address over many years. Our copy holds 122 pages, saved at dates from 2001 to 2023. The pages of different dates show different editions: the copies saved in 2019 show the 2019 contest (front page, schedule), pages saved in 2015 and 2016 show the 2014-2015 and 2015-2016 contests, and some pages are of a 2006 Code Game Challenge. The general pages cover news, schedule, rules, organising committee, jury, team list, information letters, contracts and a photo gallery.

    For 2014 the site has the page headed "ACM ICPC 2014-2015, NEERC, Southern Subregional Contest": a scoreboard of 57 team rows with rank, ID, team name with the three team members, number solved, penalty and a cell for each problem A to M with tries and times in hours and minutes. It also has the 2015-2016 contest's standings with 74 team rows and problems A to M, and the standings of the regional stage of the school team olympiad for 2014 (61 team rows, problems A to K, scores) and 2015 (64 team rows, problems A to K). The archive page links results for the years 2010 to 2019; of these our copy holds only 2014 and 2015, and the other links lead outside it.
