  description: |-
    Dashboard of the Codeforces gym contest "2014-2015 ACM-ICPC, NEERC, Southern Subregional Contest", shown as finished and hosted by Saratov State U. It lists 13 problems A to M (Nasta Rabbara, Colored Blankets, Component Tree, Data Center, Election of a Mayor, Ilya Muromets, FacePalm Accounting, Minimal Agapov Code, Sale in GameStore, Getting Ready for VIPC, Treeland, Useful Roads, Variable Shadowing), each with its time limit (1 to 10 seconds), a memory limit of 512 MB and a count printed as x followed by a number. Contest materials are linked: an announcement, a statements PDF in English, an editorial in Russian, and the contest website.

    The page has the problem list only. The statements, announcement and editorial are linked and are not part of our copy.
