  description: |-
    Codeforces Gym dashboard of 2012-2013 ACM-ICPC, NEERC, Southern Subregional Contest, marked Finished. It lists problems A to L (Cafe, Chess Championship, Cut the rope, another rope and so on!, Divide The Kingdom, Dragons and Princesses, Dumbbells, Database Optimization, Sultan's Pearls, Gena vs Petya, Ternary Password, Tree Queries Online, Preparing Problem), each with input and output file names, a time limit of 2 to 8 seconds, a 256 MB memory limit and a count written as x followed by a number.

    A note on every problem says the package was not updated after a judging server upgrade, so execution times are multiplied by two. Links lead to the English statements and to the problem pages; the statements are not in this page.
