  description: |-
    Archive site of the Northern Eurasia Contests (NEERC), in English. Our copy holds one page per year from 1996 to 2015, an archive index page and the standings pages of 2012 and 2013. The page for 2012 lists the NEERC final and its regional contests with a link to final standings for each region, among them Southern and Volga Russia; the 2013 page does the same. The Southern and Volga Russia standings of 2012 and 2013 are in our copy. It is the archive of the whole Northern Eurasia series, not a site of this contest alone.

    Besides the regional standings pages for 2012 and 2013, our copy holds PDFs of the problems of the NEERC final in 2012 and 2013 (14 pages each), the Central Russia quarterfinal problems and the Northern Subregional problems of 2012, the Northern Subregional statements of 2013, review PDFs of 13 pages for 2012 and 2013 credited to one author, and XML standings files of the Northern Subregional contests of 2012 and 2013. It has no problem statements or other pages specific to the Southern contest of 2012 beyond its standings.

    Our copy holds 144 pages under 150 addresses, 65 distinct addresses once http, https and port variants are merged; the front address only redirects to another page that is not in our copy.
