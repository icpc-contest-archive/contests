  title: The 2019 ICPC Asia Kabul Regional Contest — standings
  language:
  - en
  teams: 50
  description: |-
    Final standings of the 2019 ICPC Asia Kabul Regional Contest: 50 teams with rank, team name, institution in full, problems solved, time, medal and citation. Gold goes to Matrix of Avicenna University, silver to Brute Force of Gharjistan University and bronze to Digits of University of Kabul; no other team has a medal. Ranks run from 1 to 18 with many ties, and 24 teams have no solved problem and share eighteenth place. Teams from institutions outside Afghanistan are listed among them. There is no per-problem detail and no attempt counts.
