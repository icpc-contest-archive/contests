  contest_date: '2019-11-29'
  description: |-
    Website of the Asia-Kabul ICPC Regional Contest 2019 from Kateb University, in English. Our copy holds the home page, held under two addresses, and nothing else of the site. It announces the contest for 29 November 2019 (the text says the contest is held on 28 and 29 November), with registration open from 12 October to 11 November 2019, and states the awards: 150, 100 and 50 dollars for the first three places. Its menu names pages for teams, organisers, gallery, bootcamp and contest registration, FAQ, downloads and results of 2017, 2018 and 2019, but none of those pages is in our copy.

    The style sheets, scripts and logo saved with the page contain an error message instead of their content.
