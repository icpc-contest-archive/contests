  copy: kabul/kabul-2019/standings/2026-09-01-wayback-dcb65575/page.html
  title: 'ICPC :: Results for 2019 Regional Contest :: Asia-Kabul Regional Programming Contest'
  language:
  - en
  teams: 41
  description: |-
    Results page of the Asia-Kabul regional programming contest on the Kateb University site, holding two separate tables. The first is headed Standings for The 2019 ICPC Asia Kabul Regional Contest: 41 teams with rank, institution, team, problems solved, total time and total attempts over solved. The text above it says 50 teams from 8 universities took part, names Matrix of Avicenna University as winner, and thanks the sponsors JetBrains and Fadak Electronic Solutions; the table also ends with an empty row of zeros and has a rank typed as 17 after rank 26.

    The second table is headed Standings for The 2019 ICPC Asia Kabul National Contest: 29 teams in the same columns, first place Hello World of Kabul University with 5 solved. Its text says the national contest was held on 20 September with 30 teams from 8 universities. Only the first table is of the regional contest.
