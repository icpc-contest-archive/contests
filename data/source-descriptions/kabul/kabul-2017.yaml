  description: |-
    Final standings of the 2017 ACM-ICPC Asia Kabul Regional Contest: 12 teams with rank, team name, institution in full, problems solved, time and a citation. Eight teams are ranked, with ties at fifth and sixth place, and carry First Place to Sixth Place as citations. Four teams with no solved problems are listed last without rank or citation. You know izad? of Shahid Beheshti University is first with 4 solved and a time of 209. There is no per-problem detail and no attempt counts.
