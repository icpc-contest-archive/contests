  description: |-
    Standings of the 2017 ACM-ICPC Asia Kabul Regional Contest from the host's results page: 10 teams from six universities in Afghanistan and Iran, with rank, institution with a country code, team, problems solved, total time and last solution. A text above the table gives the day of the contest as 10 November, names the winner and second place, and thanks the sponsor. You know izad? of Shahid Beheshti University is first with 4 solved and total time 209. The last two teams have solved nothing.
