  title: ACM-ICPC Kabul Regional Contest 2017
  language:
  - en
  description: |-
    Website of the 2017 ACM-ICPC Kabul Regional Contest, in English, made by Kateb University, the host. Our copy holds 12 pages, the home page being held twice. They give an introduction to the ICPC and the announcement of a contest held on 8 to 10 November 2017, a list of the committees, registration and eligibility rules, a page of common queries, the schedule of 9 and 10 November (opening ceremony, practice contest, contest from 8:00 to 13:00 on 10 November, closing ceremony), contact details, a short page on the Kabul site, and a gallery page.

    The online contest page describes a first round held on 20 October 2017 on CodeFights. The results page has an account of the contest and a standings table of 10 teams with institution, solved, total time and last solution. The problems page links PDF problem sets for the online contest and the regional contest, and three problems from the 2016 Tehran regional; those PDFs are not in our copy. Style sheets and images are not in our copy either.
