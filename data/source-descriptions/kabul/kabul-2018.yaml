  description: |-
    Final standings of the 2018 ICPC Asia Kabul Regional Contest: 41 teams with rank, team name, institution in full, problems solved, time and a citation. Ranks run from 1 to 8 and several teams share a rank from sixth place on; citations run from First Place to Thirteenth. Doggy Sweat of Shahid Beheshti University is first with 8 solved and a time of 1209, and 29 teams have no solved problem. There is no per-problem detail and no attempt counts.
