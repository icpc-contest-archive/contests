  title: 'ACM-ICPC :: Home (The 2018 ACM-ICPC Asia-Kabul Regional Contest)'
  language:
  - en
  description: |-
    Website of the 2018 ACM-ICPC Asia-Kabul Regional Contest, in English, run by Kateb University. Its home page announces a contest on 15 and 16 November 2018, with registration open from 21 May to 15 October 2018, and the pages around it were written before the contest. They cover the people involved (a list of competing teams with coaches and a list of organisers), a bootcamp of weekly training sessions with registration forms for the bootcamp and for volunteers, a gallery page, a page of frequently asked questions, contact details and a page on the Kabul site.

    The results page and the report page, titled "ACM/ICPC Report and Future Vision in Afghanistan", concern the 2017 contests: the results page has the standings of the 2017 regional contest, 10 teams, and the report tells of the 2017 national, online and regional rounds. The downloads page links three PDFs, which are in our copy: the 2017 regional problem set (12 pages), the 2017 first-round online problem set (8 pages) and a 3-page problem statement titled "Association for Cool Machineries (Part 1)". No results of the 2018 contest are on the site.

    Our copy holds 16 pages and the three PDFs; the home page is held under two addresses. Eleven of the twelve saved style sheet, script, image and icon files contain an error message instead of their content; one script is intact.
