  description: |-
    Standings of the 2025 ICPC Asia Kabul Regional Contest: 67 teams, each with rank, team name, institution, number of problems solved, total time, medal, a place citation and a site citation. Gold, silver and bronze medals go to the first three teams, Enigma (Kateb University), XCode and Runtime Shadows (both Kabul University), each with 6 problems solved; the other 64 teams are marked Ranked. 21 teams solved at least one problem and 46 solved none. Tied teams share a rank. The teams come from ten universities, 36 of them from Kateb University. No per-problem results or attempt counts are given.
