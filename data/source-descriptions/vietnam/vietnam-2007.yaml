    Statement of problem 4005, "Ig-Nobel Prize", as a PDF of 2 pages in English, with the line "Asia - Danang - 2007/2008" under the title. It describes n lengths measured around a point at equal angles, one of them unknown (recorded as 0), asking for the value k from 1 to n for it that minimises the number of measurements to drop so that the rest descend in circular order, smallest k if several, and that minimum. It has Input and Output sections and a sample of one data set, and ends with the line "Danang 2007-2008". The problem carries no letter in the copy.
