  description: |-
    Pages of the Vietnamese ICT-events site itweek.org.vn. One page, headed ACM/ICPC Vietnam, is about this contest: it names the 32nd annual ACM International Collegiate Programming Contest, ICPC 2007 Asia Regional Contest, Asia Region at Danang, November 2007, organized by the Vietnam Association for Information Processing (VAIP) and hosted by Danang University, with a short general paragraph on the ACM ICPC and a link to the ICPC site. It has no schedule, results or problems.

    The other pages of our copy, 149 files in all, are the host site's pages for other events: IT Week 2007 and 2008, the Gặp gỡ ICT meetings of 2007 and 2008, conferences and a 2008 awards page, mostly in Vietnamese. A 2008 events page mentions the ACM/ICPC Asia regional contest in Ho Chi Minh City among planned activities; none of them is about this contest.
