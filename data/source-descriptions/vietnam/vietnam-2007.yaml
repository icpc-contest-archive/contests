    Statement of problem 4001, "Square Painting", as a PDF of 2 pages in English, with the line "Asia - Danang - 2007/2008" under the title. It describes lines drawn across a 10000 by 10000 square that cut it into pieces labelled by binary numbers, asking for the minimum number of colours to paint the pieces so that adjacent pieces differ, and the colour of each piece; a figure shows two lines dividing the square into four pieces. It has Input and Output sections and a sample of two data sets, and ends with the line "Danang 2007-2008". The problem carries no letter in the copy.
