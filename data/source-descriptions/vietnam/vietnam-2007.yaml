    Statement of problem 3997, "Numerical surprises", as a PDF of 1 page in English, with the line "Asia - Danang - 2007/2008" under the title. It describes finding the remainder when a number P of up to 2000 digits is divided by N, as a step towards showing that some number of the form 11...10...0 is divisible by N. It has Input and Output sections and a sample of two data sets, and ends with the line "Danang 2007-2008". The problem carries no letter in the copy.
