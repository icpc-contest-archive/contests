    Statement of problem 4004, "Space Beacon", as a PDF of 2 pages in English, with the line "Asia - Danang - 2007/2008" under the title. It describes beacons whose signals are sequences of 3 to 18 pulse durations from 1 to 9 in which every inner pulse must satisfy one of two alternative conditions, all valid sequences sorted lexicographically and numbered, asking for the number of a given sequence; the two alternative conditions are drawn as images. It has Input and Output sections and a sample of two data sets, and ends with the line "Danang 2007-2008". The problem carries no letter in the copy.
