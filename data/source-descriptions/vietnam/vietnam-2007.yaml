    Statement of problem 4003, "Plagiarism Detection", as a PDF of 2 pages in English, with the line "Asia - Danang - 2007/2008" under the title. It describes comparing two documents by their unique n-grams of words, with rules for what counts as a word and as an email address, and printing a similarity percentage truncated to two decimals; the similarity formula is typeset partly with small images. It has Input and Output sections and a sample of one data set, and ends with the line "Danang 2007-2008". The problem carries no letter in the copy.
