  title: ACM ICPC Vietnam Regional Site
  language:
  - en
  - vi
  description: |-
    Website of the ICPC Vietnam regional site, in English and Vietnamese. It is a series site, so our copy holds pages of several editions: 119 HTML pages, several of them saved under two addresses. The schedule page announces the 2019 ICPC Asia Danang Regional Contest for 5-6 December 2019 at the University of Danang - University of Science and Technology, with the daily programme: registration, opening ceremony and practice session on 5 December, the contest from 08:00 on 6 December, then a city tour and an awards ceremony with dinner. It also announces the 2020 ICPC Asia Can Tho Regional Contest. Other English pages cover rules, registration, hotels and taxi, contest environment, people, about us and contact; the fee page gives US$200 per team plus $30 per guest from institutions outside Vietnam.

    Older material is also in our copy: the front page of the 2016 national contest; a results page for Asia Ho Chi Minh City with links for the 2017 contest and a table of 26 teams for the 2016 Asia Nha Trang contest; a standings page for the 2013 Asia Danang regional contest (109 ranked teams and two honorable mentions); and many Vietnamese-language news and information pages on Vietnamese teams in the ICPC and on student informatics olympiads from 1999 to 2012 and 2018. It holds no results or team list of the 2019 Danang contest.
