  problems: 13
  pages: 23
  description: |-
    Editorial in Vietnamese: a PDF of 23 pages with no cover or title, which does not name the contest. It opens with an overview table, Tổng quan ("Overview"), giving for each problem A to M the number of teams that got it accepted, a difficulty rating from 1 to 5, and who wrote the solution.

    A section per problem follows, from "A. Abstract Painting" to "M. Moscow Dream"; most give a summary of the statement and then the solution, and several end with links to reference code on Ideone or Pastebin. Two pictures illustrate the solutions of problems A and L.
