  description: |-
    Standings of the 2019 ICPC Asia Danang Regional Contest: 112 teams with rank, team name, institution, number of problems solved and total time, a medal column and a citation column. The medal column marks 4 gold, 5 silver and 11 bronze medals; the other teams are marked Ranked (59) or Honorable (33). The citation column gives the place (First Place, Second Place and so on) for the 79 teams that have a rank; the 33 Honorable teams have no rank and no citation. First place is Heno World of Kyoto University with 10 problems solved. The institutions are from Vietnam and other countries. There are no per-problem results.
