  description: |-
    Short index page of past Vietnamese ICPC contests, grouped by year from 2019 back to 2015, with a heading per contest level (Regional, National, Southern, Northern, Central) and links to full information, scoreboards, problems, editorials, solutions and a final report. Under 2019 the Regional heading is empty, with no links; the 2019 links are for the national, southern, northern and central contests. The linked files are not in our copy. Nothing on the page is about the Danang regional contest itself.
