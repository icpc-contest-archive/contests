    Scoreboard of the Kattis contest site for the 2019 ICPC Asia Danang Regional Contest, showing the contest as over: 95 teams ranked by problems solved (Slv.) and penalty time, with 13 problem columns A to M. Each problem cell gives the number of attempts and, for a solved problem, the minute of the accepted run; unsolved attempts show a dash. The first place is Bamboo with 8 problems solved. The page is the view of the contest's own site; a separate Foreign teams view is linked from it and is not in our copy, so teams from outside Vietnam are not shown here. The contest clock on the page shows a five-hour contest.
