  description: |-
    Final standings from Kattis for the 2017 ACM-ICPC Asia Ho Chi Minh City Regional Contest, a scoreboard of 148 teams against twelve problems labelled A to L. Each row gives rank, team name, country flag, institution logo, number solved and total time, then for each problem the number of attempts and the minute of the accepted run; an unsolved problem with attempts shows the attempts and a dash. First solves are marked on eleven problems, and the legend also marks attempted and pending cells. The page shows the contest as over, after a 5 hour contest on 8 December 2017. The first place is the team unsigned with nine problems solved.

    Our copy is the All teams view; the page also links to a Foreign teams view and to a view named after the contest, which are not in our copy.
