  title: ACM ICPC Vietnam Regional Site
  language:
  - en
  - vi
  contest_date: '2017-12-08'
  description: |-
    Website of the ACM ICPC Vietnam regional contests, a Google Sites site whose home page presents the 2017 ACM/ICPC Asia Hochiminh City Regional Contest, 7-8 December 2017, hosted by the Hochiminh City University of Education and supported by the Vietnam Association for Information Processing. The 2017 pages, in English, cover contest rules, important dates (registration from 8 September to 15 November, contest on 8 December), registration, fee detail, the schedule of the practice day and the contest day, contest environment, people, and hotels and taxis. The results page points to the final scoreboard on Kattis, and the problems page lists a problem set PDF for each of six editions (2010, 2012, 2013, 2015, 2016, 2017).

    The site also holds other editions and activities: a results table of 26 teams for the 2016 Nha Trang regional, a standings table of 109 teams for the 2013 Da Nang regional, pages for the 2018 Hanoi, 2019 Da Nang and 2020 Can Tho regionals, archive pages for the Vietnamese student informatics Olympic from 1999 to 2012 and the summer creativity contests (Mua he sang tao), and Vietnamese news items, among them the 2017 registration notices, the 8 December 2017 awards ceremony and the results of the 2018 northern and southern rounds.

    Our copy holds 150 files: 128 HTML pages (one of them empty), 21 images and a robots file. Thirty page addresses are saved two or three times. The attachments named on the results and problems pages (scoreboard file, problem PDFs) are not in our copy.
