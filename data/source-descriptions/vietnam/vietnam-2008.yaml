  description: |-
    Statement of problem 4343, 'Hanoi Subway System Construction': stations joined by subway lines, with speed v1 under resident blocks (convex polygons) and v2 elsewhere; choose the central station that minimises the travel time to the farthest station and output the integer part of that time times 100. It has a figure of a four-station system, input and output sections and a sample with one data set. A PDF of 2 pages in English, with the region line 'Asia - Ho-Chi-Minh-City - 2008/2009' under the title and 'Ho-Chi-Minh-City 2008-2009' at the end.
