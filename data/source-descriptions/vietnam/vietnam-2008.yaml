  description: |-
    Statement of problem 4342, 'Lucky Numbers': for an integer X below 10000, find the smallest number of the form 8...86...6 (eights followed by sixes) with at most 200 digits that is divisible by X, or print -1. It has input and output sections and a sample with four values of X. A PDF of 1 page in English, with the region line 'Asia - Ho-Chi-Minh-City - 2008/2009' under the title and 'Ho-Chi-Minh-City 2008-2009' at the end.
