  description: |-
    Statement of problem 4344, 'Earthquakes': a polygon of cultivable land with a research station inside, cut by M cracks given as lines; compute the area still reachable from the station, as the integer part of the area times 100. It has a figure, input and output sections and a sample with two data sets. A PDF of 3 pages in English, with the region line 'Asia - Ho-Chi-Minh-City - 2008/2009' under the title and 'Ho-Chi-Minh-City 2008-2009' at the end.
