    Scoreboard from VNOJ, the VNOI Online Judge, which describes itself as powered by DMOJ: 125 teams ranked by points and penalty, with thirteen problem columns A to M. Each team row gives the team name, its institution, points and penalty, and for each problem the solve time and the number of tries, or only the tries for an unsolved problem. A final row, Total AC, counts the solves per problem. Cells are colour-coded (first solve, solved, incorrect, pending) with a legend, and a filter by institution is at the top. First place is NewTrend of Seoul National University.

    The page's menu and links lead to the live site and are not part of our copy.
