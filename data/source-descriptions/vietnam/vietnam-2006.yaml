    Statement of problem 3673, "Black-White Grid", as a PDF of 2 pages in English, with the line "Asia - Hanoi - 2006/2007" under the title. It describes an n by n grid of black and white cells and whether swapping rows and columns can make every diagonal cell white, printing YES or NO; Fig. 1 shows a white-colorable grid. It has Input and Output sections and a sample of two data sets, and ends with the line "Hanoi 2006-2007". The problem carries no letter in the copy.
