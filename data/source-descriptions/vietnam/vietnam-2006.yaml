    Statement of problem 3674, "The ACM-ICPC world final hosting", as a PDF of 2 pages in English, with the line "Asia - Hanoi - 2006/2007" under the title. It describes n cities forming a convex polygon, a yearly choice of host city from a shortlist built with a start and a step, picking the northernmost, southernmost, easternmost or westernmost, and the total hosting cost over m years. It has Input and Output sections and a sample of two data sets, and ends with the line "Hanoi 2006-2007". The problem carries no letter in the copy.
