  title: ACM/ICPC Vietnam
  language:
  - vi
  - en
  contest_date: 2006-11
  description: |-
    Pages of the ICT-events site itweek.org.vn, mostly in Vietnamese. One page, headed ACM/ICPC Vietnam and written in English, is about this contest: it names the 31st annual ACM International Collegiate Programming Contest, ICPC 2006 Asia Regional Contest, Asia Region at Hanoi, November 2006, organised by the Vietnam Association for Information Processing (VAIP) and hosted by the College of Technology (Coltech), Vietnam National University, Hanoi, with a short general paragraph on the ACM ICPC and a link to the ICPC site. It has no schedule, results or problems.

    Our copy holds 150 files, 115 of them HTML pages, many of which appear twice under two addresses. The other pages belong to the host site's other events: IT Week 2006 and 2007, the Gặp gỡ ICT new-year meetings of 2006 and 2007, the ADOC Award 2006 and the cooperation and development conferences of 2006 and 2007. The 2006 conference news page mentions the contest among planned activities, giving 26 to 30 November 2006 at the university in Hanoi, and the Gặp gỡ ICT 2006 and conference announcement pages mention it in a line; none holds results or problems.
