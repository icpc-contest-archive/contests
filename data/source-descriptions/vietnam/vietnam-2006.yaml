    Statement of problem 3672, "Inferring Ancestors", as a PDF of 2 pages in English, with the line "Asia - Hanoi - 2006/2007" under the title. It describes an evolutionary tree whose leaves are nucleotide sequences over A, C, G and T, asking for ancestor sequences that minimise the total length of the tree; a figure shows a tree of five species. It has Input and Output sections and a sample of two data sets, and ends with the line "Hanoi 2006-2007". The problem carries no letter in the copy.
