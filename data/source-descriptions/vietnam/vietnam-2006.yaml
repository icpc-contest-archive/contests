  description: |-
    Statement of problem 3669, "String Cutting", as a PDF of 1 page in English, with the line "Asia - Hanoi - 2006/2007" under the title. It describes applying a sequence of cuts to a string of lower-case letters and computing the total cost of the cuts, where each cut splits a substring in two and costs a count taken from the two parts. It has Input and Output sections and a sample of two data sets, and ends with the line "Hanoi 2006-2007". The problem carries no letter in the copy.
