  problems: 1
  pages: 6
  description: |-
    Statement of problem 3676, "Domino", as a PDF of 6 pages in English, with the line "Asia - Hanoi - 2006/2007" under the title. It describes a one-player game with the 28 tiles of a double-six domino set given in a fixed order, each tile played or left out, asking for the highest score, where a turn scores when the open ends add up to a multiple of five. It has Input and Output sections and a sample of two data sets (answers 150 and 145); the notes on how scores are calculated, with figures, run over pages 2 to 4, page 5 shows the game layouts for the two sample sets, and page 6 holds only the closing line "Hanoi 2006-2007". The problem carries no letter in the copy.
