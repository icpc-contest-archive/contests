    Statement of problem 3670, "Patrol Robot", as a PDF of 2 pages in English, with the line "Asia - Hanoi - 2006/2007" under the title. It describes a robot on an m by n grid, with obstacle cells it may not cross more than k in a row, and the shortest path from cell (1, 1) to cell (m, n), printing the number of moves or -1. It has Input and Output sections and a sample of three data sets, and ends with the line "Hanoi 2006-2007". The problem carries no letter in the copy.
