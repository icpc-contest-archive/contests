    Standings of the 2025 ICPC Asia Ho Chi Minh City Regional Contest: 129 teams, each with rank, team name, institution, problems solved and time. Two more columns give a medal and a citation. The medal column has Champion, Gold, Silver and Bronze medals and seven entries of First, Second or Third Prize (non-IT); the citation is a place name (First Place to Seventy-seventh Place) or, for 52 teams, Honorable Mention. First place is Penguin and Tonic of National University of Singapore with 9 solved. There are no per-problem results.
