  description: |-
    Problem set as a PDF of 32 pages, in English. Every page with problem text carries a header naming the 2025 ICPC Asia HCMC Regional Contest, HCMC University of Technology, and 12 December 2025, and a footer with the problem letter, title and page number. It holds thirteen problems labelled A to M, from A, Aquatic Elevator, to M, Matrix Multiplication. Each problem gives a statement with input and output format and a sample, some with figures; problem L, Linked List Loop, is interactive and has a sample interaction in place of a sample input. Pages 4, 8, 12 and 16 are blank, each marked as intentionally left blank.
