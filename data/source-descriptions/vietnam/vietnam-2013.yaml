  title: ACM ICPC Vietnam Regional Site
  language:
  - en
  - vi
  contest_date: '2013-11-29'
  description: |-
    Website of the Vietnam ACM/ICPC and student Olympiad in Informatics (OLP) organisers, in English and Vietnamese. The English pages are those of the 2013 ACM-ICPC Asia Danang Regional Contest, hosted by Duy Tan University: home page, important dates, tentative schedule (registration, opening and practice on 28 November, contest on Friday 29 November 2013), registration, fee details, contest rules, programming environment, people, hotel and restaurant, the host university and the city of Danang, and a media center with photos.

    Three pages of the site are documents of their own: a Results 2013 page with the final scoreboard, a Standings page for the contest, and a Problems page that links the problem-set PDFs. The Vietnamese news items cover registration, results and prizes of OLP'13 and Danang 2013, and the Vietnamese teams that went on to the World Finals.

    Captures from 2012 to 2022 are mixed in, so the site also shows other editions: the Ho Chi Minh City contest of 2014, Hanoi 2015, Danang 2019, and an archive of the Olympiad from 1999 to 2012. Our copy holds 150 files: 127 pages with content, 21 images and a robots file. Style sheets and scripts are not kept, and the problem PDFs are not in it.
