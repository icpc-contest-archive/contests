  title: ACM ICPC Vietnam Regional Site
  language:
  - en
  - vi
  contest_date: '2015-11-27'
  description: |-
    Website of the Vietnam ACM/ICPC and student Olympiad in Informatics (OLP) organisers, in English and Vietnamese. The English pages are those of the 2015 ACM/ICPC Asia Hanoi Regional Contest, held on 26 and 27 November 2015 and hosted by Hanoi University of Business and Technology: home page, important dates, schedule (registration, opening and practice on 26 November, contest from 08:00 to 14:00 on Friday 27 November), registration, fee details, contest rules, programming environment, people, hotel and restaurant, and a media center. Separate pages hold the Results page with the standings and the Problems page.

    The Vietnamese news items cover announcements 1 and 2, registration, the online qualifying rounds for the south (26 September), north (3 October), central (10 October) and the national online round of 31 October 2015, the results of 30 November and the prize announcement of 9 December.

    Pages captured between 2012 and 2022 are mixed in, so the site also shows earlier editions (Danang 2013, Ho Chi Minh City 2014) and an Olympiad archive from 1999 to 2012. Our copy holds 150 files: 130 pages with content, 18 images and a robots file. Style sheets and scripts are not kept, and the problem PDFs and scoreboard file linked from the pages are not in it.
