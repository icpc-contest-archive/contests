  contest_date: '2016-12-02'
  description: |-
    Website of the Vietnam ACM/ICPC and student Olympiad in Informatics (OLP) organisers, in English and Vietnamese. The English pages are those of the 2016 ACM/ICPC Asia Nha Trang Regional Contest, held on 1 and 2 December 2016 and hosted by Nha Trang University: home page, important dates (registration from 8 September to 15 November 2016), schedule (registration, opening and practice on 1 December, contest from 08:00 to 14:00 on Friday 2 December), registration, fee details, contest rules, programming environment, people, hotel and restaurant, and a media center. A Results page and a Problems page belong to the edition.

    Vietnamese news items include the first announcement for OLP'16 and the Nha Trang contest and a report on the two Vietnamese teams at the 2016 World Finals.

    Pages captured between 2011 and 2022 are mixed in, so the site also shows other editions: the 2017 Ho Chi Minh City contest, 2018 Hanoi, 2019 Danang, and older pages. Our copy holds 150 files: 129 pages with content, 19 images and a robots file. Style sheets and scripts are not kept, and the problem PDFs and scoreboard file linked from the pages are not in it.
