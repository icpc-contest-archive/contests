  description: |-
    Final scoreboard produced by PC^2 9.2.3 (CSUS), last updated 30 November 2012 as the page states, shown on the ACM ICPC Vietnam Regional Site. It lists 125 teams with rank, institution and team name, number solved, time, and for each of the problems A to J the number of attempts and the time of the accepted solution, plus total attempts and solved per team. A last row gives, for each problem, the submissions, first-yes time and total yes count. 38 teams solved nothing. First place is University of Hong Kong (GMT) with six solved. The page menu links to the site's rules, schedule, registration and problems pages.
