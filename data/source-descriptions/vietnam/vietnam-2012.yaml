  title: Olympic Tin học 2012 - ACM ICPC Vietnam
  language:
  - vi
  - en
  description: |-
    Website of the ACM ICPC Vietnam Regional Site, built on Google Sites, in Vietnamese and English. The home page announces the 37th Annual ACM International Collegiate Programming Contest, 2012 Hanoi Asia Regional Contest, on 29 and 30 November 2012, hosted by Hanoi University of Industry (HaUI), and the national first round of 27 October 2012, hosted by FPT University, with the Vietnam Association for Information Processing (VAIP) as supporter. The site was reused for later years: it also holds news about the 2013 Danang contest and the 2014 and 2016 World Finals, and a page of 2013 Danang standings.

    The archive section for the Vietnamese student informatics olympiad OLP'12, held together with ACM/ICPC Hanoi 2012, has an electronic handbook of the event (released 25 November 2012), a registration list page (updated 26 November) that refers to 111 Vietnamese and 18 international teams, a photo page of the opening and contest, help pages with maps, hotels and travel information, an open-source library page, a sponsors page and a results page. The results page has the top 10 Vietnamese teams of ACM/ICPC Hanoi 2012 with prizes, a table for non-specialist teams, and the results of the national online round by school. News pages cover registration, the online national round of 27 October 2012 and the prize-giving.

    Our copy holds 149 files, 117 of them pages; photos are saved as image files. The attachments linked from the pages are not in our copy.
