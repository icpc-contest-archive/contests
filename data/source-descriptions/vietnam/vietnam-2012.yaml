    Standings of 125 teams with rank, team name, institution, number of problems solved, total time and a citation. The citation gives Champion to the first team, First Prize to four, Second Prize to four and Third Prize to seven; an asterisk follows four of the prizes and is not explained. The other 109 teams have no citation, and the 38 that solved no problem have no rank. The leading team solved six problems. No per-problem results or attempts.
