  problems: 12
  pages: 27
  description: |-
    Editorial in Vietnamese, a PDF of 27 pages with no cover and no contest name. It opens with an "Overview" table giving, for each problem A to L, the first accepted solution (a number and a team name), the number of accepted solutions and the editorialist (none is named for J); E, F and K have no accepted solution. A page headed "Tổng quan" (overview) gives the organisers' view that the 2018 set was harder than those of 2016 and 2017 and comments on problems A, D, I, J and K.

    Then comes one section per problem, from A Amazing Adventures to L Lazy Learner, most of them opening with the editorialist's name. K takes five pages and F four; several sections have figures, D has pseudocode, and the sections on D and F link to solution code on GitHub.
