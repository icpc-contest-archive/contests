  description: |-
    Final standings from Kattis for the 2018 ICPC Asia Hanoi Regional Contest, a scoreboard of 107 teams against twelve problems labelled A to L. Each row gives rank, team name, country flag, institution logo, number solved and total time, then for each problem the number of attempts and the minute of the accepted run; an unsolved problem with attempts shows the attempts and a dash. First solves are marked on eight problems. The page shows the contest as over, after a 5 hour contest on 30 November 2018. The first place is the team P_not_equal_NP with six problems solved.

    Our copy is the view of the site named 'The 2018 ACM-ICPC Asia Hanoi Regional Contest'. The page also offers an All view and a Foreign teams view, which are not in our copy; the Kattis contest page gives 125 teams in total.
