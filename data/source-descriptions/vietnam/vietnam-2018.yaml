  copy: vietnam/vietnam-2018/website/2026-09-05-wayback-22d5c027
  title: ACM ICPC Vietnam Regional Site
  language:
  - en
  - vi
  contest_date: '2018-11-30'
  description: |-
    Website of the ACM ICPC Vietnam regional contests, a Google Sites site whose home page presents the 2018 ICPC Asia Hanoi Regional Contest, 29-30 November 2018, hosted by the Posts and Telecommunications Institute of Technology (PTIT) and supported by the Vietnam Association for Information Processing. It links the final scoreboard on Kattis and lists the 2018 Vietnam national, northern, southern and central rounds with their dates. The 2018 pages, in English, cover contest rules, important dates (contest on 30 November), registration, fee detail, the schedule of the practice day and the contest day, contest environment, people, and hotels and taxis. Vietnamese news items report on the 2018 northern and southern rounds and the national round registration.

    The site also holds other editions: the 2017 Ho Chi Minh City entry on the results page and a results table of 26 teams for the 2016 Nha Trang regional, a standings table of 109 teams for the 2013 Da Nang regional, archive pages for the Vietnamese student informatics Olympic from 1999 to 2012, and pages captured in 2020 to 2022 for the 2019 Da Nang, 2020 Can Tho and 2021 Hanoi regionals, the last of 24-25 March 2022 at FPT University.

    Our copy holds 150 files: 128 HTML pages (one of them empty), 21 images and a robots file. Thirty-one page addresses are saved two or three times. The attachments named on the results and problems pages (scoreboard file, problem PDFs) are not in our copy.
