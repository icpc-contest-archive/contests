  description: |-
    Single-problem statement PDF of 2 pages, headed "5081 Expansion", in English. From the second page on, a line reading "ACM-ICPC Live Archive" with the number, title and page number is printed. The statement describes N countries with rectangular territories on a grid, each expanding one unit per month in the direction given by a string of L, R, U and D, and asks after how many months the first overlap happens, or -1. It ends with a sample input and sample output.
