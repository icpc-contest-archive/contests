    Single-problem statement PDF of 2 pages, headed "5087 Shuffling cards", in English. From the second page on, a line reading "ACM-ICPC Live Archive" with the number, title and page number is printed. The statement describes a deck of 2N cards put through M shuffling instructions and asks for the minimum number of cards to remove so that the remaining ones are in increasing order from top to bottom. It ends with a sample input and sample output.
