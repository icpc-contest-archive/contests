  language:
  - en
  problems: 1
  pages: 1
  description: |-
    Single-problem statement PDF of 1 page, headed "5078 Fake Fibonacci numbers", in English. The statement defines a sequence that starts from four given numbers with S(i) = S(i-4) + S(i-1) and asks for the middle number of the sorted first N terms, N odd, with a worked example for N = 7. It ends with a sample input and sample output.
