  description: |-
    Standings of 116 teams with rank, team name, institution, number of problems solved and total time, and a citation column. The citation holds a number from 1 to 14 for the first 42 teams and Honorable Mention for the next 70; the last four teams, which solved no problem, have none. The leading team, ArcOfDream of Zhejiang University, solved 10 problems. No per-problem results or attempts.
