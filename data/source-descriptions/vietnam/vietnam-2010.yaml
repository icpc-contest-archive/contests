  description: |-
    Single-problem statement PDF of 1 page, headed "5083 Goldbach’s conjecture", in English. The statement lets G(N) be the number of ways to write 2N as a sum of two primes and asks for F(N) = G(2) + ... + G(N), with N up to 500000. It ends with a sample input and sample output.
