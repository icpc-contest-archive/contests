  description: |-
    Single-problem statement PDF of 1 page, headed "5084 Nice numbers", in English. The statement defines a nice number as repeated 123456789 followed by trailing zeroes and asks for the smallest multiple of N that is a nice number, or -1; the example is N = 342. It ends with a sample input and sample output.
