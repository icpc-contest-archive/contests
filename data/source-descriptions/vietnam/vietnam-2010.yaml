  description: |-
    Single-problem statement PDF of 2 pages, headed "5085 Rendezvous", in English. From the second page on, a line reading "ACM-ICPC Live Archive" with the number, title and page number is printed. The statement describes N cities joined by roads in a tree rooted at city 1 and K missions, each assigning two cities, and asks for the city that is the rendezvous of the most missions, the smallest identifier on a tie. It ends with a sample input and sample output.
