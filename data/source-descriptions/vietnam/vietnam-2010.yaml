    Single-problem statement PDF of 1 page, headed "5086 City Lights", in English. The statement describes an n by n grid of light posts with a power switch for each avenue and each street and asks for the smallest number of switches that turns on all required lights, given as an n by n matrix with n up to 30. It ends with a sample input and sample output.
