  language:
  - en
  problems: 1
  pages: 1
  description: |-
    Single-problem statement PDF of 1 page, headed "5079 Robots", in English. The statement describes robots that duplicate themselves, where a group of R robots needs T time units to build a new one, and asks for the smallest time to grow from R robots to N; it gives a worked example with R = 4 and T = 6. It ends with a sample input and sample output.
