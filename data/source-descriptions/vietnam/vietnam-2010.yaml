  description: |-
    Single-problem statement PDF of 1 page, headed "5077 Chat log analysis", in English. The statement defines four text emoticons (:( , :((, :), :)) ) with the values -1, -5, 2 and 4 and asks for the sum of the values of the emoticons found in each chat-log line. It ends with a sample input and sample output.
