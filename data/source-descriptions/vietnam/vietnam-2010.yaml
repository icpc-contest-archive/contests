- url: http://acm-icpc.olp.vn
  read: '2026-11-16'
  rubric: 1
  copy: vietnam/vietnam-2010/website/2026-09-05-wayback-22d5c027
  title: ACM ICPC Vietnam Regional Site
  language:
  - vi
  - en
  description: |-
    Website of the ACM ICPC Vietnam Regional Site, built on Google Sites, in Vietnamese and English; its home page names the Vietnam Association for Information Processing (VAIP) as supporter. The site was reused for later years: the home page announces the 2012 Hanoi regional (29 and 30 November 2012, hosted by Hanoi University of Industry), and other pages hold the standings of the 2013 Danang regional and news about later World Finals, so it is not specific to 2010.

    The 2010 edition is in an archive section headed Olympic Tin học 2010 (Informatics Olympiad 2010), the student olympiad OLP'10 held together with ACM/ICPC Hanoi. It has the schedule (updated 20 November 2010), running from the opening on Wednesday 24 November to the contest on the morning of Friday 26 November; the final registration list (updated 24 November 2010); a downloads page listing rules, announcements, a registration form, venue maps and the PC^2 user guide; a page of exam papers that lists the ACM Hanoi 2010 problem description as a PDF; and a results page in Vietnamese with prize announcements and a table of prizes won by Vietnamese teams. A separate Results page holds the contest standings. The PDFs, documents and other attachments are not in our copy.

    Our copy holds 150 files, 133 of them pages, many saved more than once.
