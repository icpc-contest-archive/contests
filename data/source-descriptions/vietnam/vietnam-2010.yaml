  description: |-
    Results table from the ACM ICPC Vietnam Regional Site: 117 teams with rank, institution and team name, number solved, time and a prize column (Champion, First Prize, Second Prize, Third Prize). Seven of the eleven Third Prize entries carry an asterisk that the page does not explain. Teams with equal results share a rank, and five teams share rank 113 with no problem solved. First place is Zhejiang University (ArcOfDream) with 10 problems solved. The page's menu links to rules, important dates, schedule and registration pages of the same site.
