  language:
  - en
  problems: 1
  pages: 1
  description: |-
    Single-problem statement PDF of 1 page, headed "5080 M-drugs", in English. The statement defines the efficiency of an M-drug on a virus protein, both strings over the 20 amino-acid letters, as the number of amino acids it can destroy, and asks for the maximum efficiency among n drugs. It ends with a sample input and sample output.
