  description: |-
    Scoreboard of the finals, 274 teams, twelve problems A to L, with status over after 5:00:00 of 5:00:00. Each team row gives rank, team name with its three contestants, a cell per problem, the number solved and the penalty time. A cell shows a plus for a solved problem with the number of rejected tries and the minute of the accepted run, a minus and a count for tries without a solution, and a dot for no attempt. Teams with no problem solved share the last rank, 244.

    Five summary rows close the table with, per problem, total runs, accepted, rejected, and the times of the first and last accepted run. First place is Moscow I of Physics and Technology 1 with 10 solved and penalty time 1275.
