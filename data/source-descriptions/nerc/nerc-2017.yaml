- url: http://neerc.ifmo.ru/information/index.html
  read: '2026-11-16'
  rubric: 1
  copy: nerc/nerc-2017/website/2026-09-04-wayback-88d7fcfd
  title: Northern Eurasia Contests
  language:
  - en
  description: |-
    Archive site of the Northern Eurasia contests. Its 2017 page is headed NEERC 2017 and its 2018 page NERC 2018. The 2017 page links the finals standings, the problems in PDF, the official tests, the jury archive and the problem analysis, and then lists 16 regional contests. Only the Northwestern Russia section goes beyond standings: it also links problem statements, tests and generators, an archive, statement sources, an analysis and all runs. The other 15 regional sections link a standings page only.

    Our copy holds 146 saved pages and documents, which are 60 distinct addresses, most saved up to three times under http, https and port-80 addresses. For 2017 it has the finals standings, the finals statements PDF and analysis PDF, 16 regional standings addresses (the Eastern one repeats the Urals page and is not linked from the 2017 page; the East Siberian standings are missing), two Northern regional statements PDFs, a Northern regional analysis PDF that is cut off at 1 MiB and cannot be opened, and a statements PDF in the Kazakhstan folder that carries the Northern subregional contest header. The test, jury, statement-source and run archives of 2017 are not in our copy.

    It also holds the 2018 pages (finals standings, statements, analysis, a review PDF, nine regional standings, Northern regional PDFs), the archive index with year pages for 1996 to 2005, and statement and tutorial PDFs of 2019 to 2021. The other years of the archive index are not in our copy.
