    Problem set of the finals as a PDF of 14 pages in English. The running header on every page reads ACM ICPC 2017–2018, NEERC – Northern Eurasia Finals, St. Petersburg – Barnaul – Tbilisi – Almaty, December 3, 2017. It holds twelve problems A to L: Archery Tournament, Box, Connections, Designing the Toy, Easy Quest, The Final Level, The Great Wall, Hack, Interactive Sort, Journey from Petersburg to Moscow, Knapsack Cryptosystem and Laminar Family.

    Each problem has a time limit, a statement and examples. Ten problems have input and output sections; Hack and Interactive Sort are interactive and have an interaction protocol instead. No test data or solutions.
