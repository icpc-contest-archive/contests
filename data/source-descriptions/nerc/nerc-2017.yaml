  description: |-
    Analysis of the finals, a PDF of 14 pages in English, headed December 3, 2017. It opens with a summary table of the twelve problems A to L, giving for each the author, the developer, the number of teams that solved it against total runs and the success rate, and the recap of 274 teams, 12 problems and 5 hours.

    Each problem then has its own section, from A Archery Tournament to L Laminar Family, with author and developer, tables of accepted and rejected runs by language, and a written explanation of the solution. For the eleven problems that were solved, a table names the fastest and shortest accepted solution and the team with most attempts.
