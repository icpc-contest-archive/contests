  description: |-
    Final scoreboard of the finals: 276 teams, twelve problems A to L, with the clock shown as 5:00:00 of 5:00:00 and status 'over'. Each row gives rank, the team as 'university: team name' followed by its three members, and for every problem a cell with a plus or minus sign, the number of rejected attempts and the time of the accepted run in minutes and seconds; unattempted problems show a dot. Further columns give problems solved (=), total time (Time) and a column headed Qual with codes: GI, SI and BI for four teams each, I for three, II for 18 and III for 44; the other rows are empty. The first place is MIPT: Yolki-palki with all 12 problems.

    Below the teams, summary rows give per problem the total runs, accepted runs, rejected runs, time of first accept and time of last accept. Every problem has a cell marked as the first solve. A 'Show time' control sits above the table.
- url: https://icpc.global/regionals/finder/Northern-Eurasia-2024/standings
  read: '2026-11-16'
  rubric: 1
  copy: nerc/nerc-2023/standings/api-20261113/standings.html
  title: The 2023 ICPC Northern Eurasia Finals
  language:
  - en
  teams: 276
  description: |-
    Final standings of the finals: 276 teams, as the header states. Each row gives rank, team name, institution, problems solved, time, medal, citation and site citation. Four teams hold gold, four silver and four bronze medals; the site citation is First Degree Diploma for 15 teams, Second Degree Diploma for 18 and Third Degree Diploma for 44. The citation column reads Honorable Mention in every row. Ties share a rank, and the table ends with teams that solved no problem, ranked 269.

    There is no per-problem detail. The first place is Yolki-palki of the Moscow Institute of Physics and Technology with 12 solved and a time of 1266.
