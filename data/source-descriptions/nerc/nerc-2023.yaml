# Written by tools/describe_apply.py from readings of the copies we hold. See README.md in data/source-descriptions.
contest: nerc-2023
sources:
- url: https://nerc.icpc.global
  read: '2026-11-16'
  rubric: 1
  copy: nerc/nerc-2023/website/2026-09-04-wayback-6865bd69
  title: Northern Eurasia Contests
  language:
  - en
  - ru
  description: |-
    Website of the Northern Eurasia Contests (ICPC NERC), in English and Russian. Our copy holds 150 files, 125 of them pages (108 HTML and 17 PDF), taken on different dates. The page 'Northern Eurasia Finals 2023!' gives the timetables of the four sites (St. Petersburg, Novosibirsk, Astana in Kazakhstan, Kutaisi in Georgia) and links to the contest standings, the standings of each site, the problem statements, the problem analysis and a brochure.

    For the 2023 finals the copy holds the final standings (276 teams, problems A to L), the site standings of St. Petersburg, Astana and Siberia, the standings of the Open Championship of Southern Caucasus 2023/2024 (linked as the Kutaisi site), the statements as a PDF of 15 pages and the tutorial as a PDF of 9 pages. It also holds standings of the 2023-2024 regional contests of Armenia, Azerbaijan, Kazakhstan, Northwestern Russia, Taurida and the Urals. Other editions are inside too: 29 yearly archive pages from 1996 to 2025 (none for 2024), the 2024 statements (19 pages) and tutorial (8 pages), and the 2024-2025 Azerbaijan standings.

    Nine of the 17 PDFs cannot be opened: both brochures, the 2020 online and offline tutorials, the 2020 online statement, and the 2024 Azerbaijan handbooks and statements. The pages with the contest rules, selection rules and team reference document, linked from the finals page, are not in our copy. The home page is a Russian page of the ICPC NERC headquarters from 2021.
