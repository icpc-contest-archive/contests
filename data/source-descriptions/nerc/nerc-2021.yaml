  description: |-
    Final scoreboard of the Northern Eurasia Finals, headed ICPC 2021—2022, NERC — Northern Eurasia Finals, with the status 5:00:00 of 5:00:00 over and a Show time switch. It lists 253 teams, each with the university, team name and members, a cell for each of the twelve problems A to L (a plus with the number of extra attempts and the solve time in minutes and seconds; a minus with a number for attempts without a solve; a dot when there was no attempt), the number solved, the time and a medal letter. Ranks run from 1 to 214, with tied teams sharing a rank; four teams carry G, four S and four B. Undertrained+Overpressured of HSE is first with 9 solved and 973. Rows at the foot give totals per problem: total runs, accepted, rejected, first accept and last accept.

    Our copy keeps the table and its figures in full.
