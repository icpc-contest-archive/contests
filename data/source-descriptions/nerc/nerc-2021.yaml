  description: |-
    Final standings of the 2021-2022 ICPC Northern Eurasia Finals: 222 teams with rank, team, institution, problems solved, time, medal, citation and site citation. There is no per-problem detail. Twelve teams hold medals (four gold, four silver, four bronze). The citation column reads First Diploma for 8 teams, Second Diploma for 36, Third Diploma for 44 and Honorable Mention for 112; the other 22 carry place names from Ninetieth to One-hundred Eleventh Place. The site citation column is filled for the first twelve teams (Northern Eurasia Champions, then Second to Twelfth Place). The first place, Undertrained+Overpressured of HSE University, has 9 solved and a time of 973.
