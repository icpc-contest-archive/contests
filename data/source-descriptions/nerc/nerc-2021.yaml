  description: |-
    Archive page for the 2021 edition on the Northern Eurasia Contests website, in English with one line in Russian. Under the heading NERC 2021 it lists the finals resources: contest standings, problems in PDF format, a jury archive with tests, generators and jury solutions, problems analysis, a Codeforces mirror, photos and the runs of all problems. Below it come blocks for the regional contests of that season (Armenia, Azerbaijan, Central Russia, East Siberian, Far Eastern Russia, Georgia, Kazakhstan, Kyrgyzstan, Moscow, Northwestern Russia, Southern and Volga Russia, Tajikistan, Taurida, Turkmenistan, Ural, Uzbekistan, West Siberian, Belarus), eight of them with a link to their standings; the Northwestern Russia block also lists a qualification with standings, statements, tutorial and a full package, and a second set of links with statements, tutorials, a package, a Codeforces mirror and runs. The top menu links to the archive pages of the other years from 1996 to 2025.

    Our copy holds this one page only; the pages and files it links to are not part of it.
