  description: |-
    Final scoreboard of the Northern Eurasia Finals, headed "ICPC 2018-2019, NEERC - Northern Eurasia Finals", with the clock at 5:00:00 of 5:00:00 and status "over". It lists 299 teams against 13 problems A to M. Each team name is followed by its members' surnames. A cell shows a plus sign with the number of rejected attempts and the solve time in minutes, a minus sign with the number of rejected attempts when the problem is unsolved, or a dot for no attempt. Further columns give the number solved, total time and a medal letter; four teams carry G, four S and four B. Moscow SU 3 is first with 11 problems and a time of 1624. Below the teams the page has totals per problem: total runs, accepted, rejected, and the times of first and last accepted run.
