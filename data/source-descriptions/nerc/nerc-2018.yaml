  read: '2026-11-16'
  rubric: 1
  copy: nerc/nerc-2018/website/2026-09-04-wayback-29b909c0
  title: Northern Eurasia Contests
  language:
  - en
  - ru
  contest_date: '2018-12-02'
  description: |-
    Website titled Northern Eurasia Contests, with ITMO University given as the venue in the programme of the 2018 finals. Our copy holds 144 pages. The archive page for 2018 links the finals standings, the problem statements, a jury archive, the problem analysis, review slides and runs, and has a block for the Northwestern Russia regional, whose files are filed as Northern (standings, statements, archive, analysis, runs) and short blocks for other regionals: Ural, Taurida, Kazakhstan, Armenia, Georgia and Azerbaijan list standings, and the others say that no information is available. The regional page for 2018 gives the programme of 1 and 2 December 2018 (registration, opening ceremony, sponsor lectures, practice, the contest on Sunday 2 December, problem analysis, awards ceremony, party) and accommodation information for the St Petersburg site, partly repeated in Russian.

    Inside the copy are the finals standings, the statement PDF, the analysis PDF, the 101-page review slides, the standings pages of eight regional contests of 2018 (Ural, Taurida, Northern, Kazakhstan, Armenia, Georgia, Azerbaijan, Uzbekistan) and the statements and analysis of the Northern regional (the Northwestern Russia block). The site is shared by several editions: the archive and pages of 2019 are in the copy too, with the 2019 regional standings, as are statement and tutorial PDFs of 2020 and 2021, a 2020 handbook, and pages and PDFs of the school olympiad.

    The jury archive and runs files linked from the 2018 page, for the finals and for the Northwestern Russia regional, are not in our copy.
