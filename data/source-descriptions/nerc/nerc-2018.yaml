  description: |-
    Problem analysis of the finals as a PDF of 11 pages in English, headed with the finals' name and the date 2 December 2018. It opens with a summary table of the 13 problems with author, developer, number of accepting teams, runs and success rate. It then gives one section per problem, A to M, with the accepted and rejected runs by language and a description of the solution; ten of the sections also list the fastest, shortest and most-attempts solutions, problem H lists its one accepted solution, and problems B and D, with no accepted run, list none. The text states a recap of 299 teams, 13 problems and 5 hours.
