  description: |-
    Standings of the 2018 Northern Eurasia Contests: 299 teams with rank, team name, institution, number solved, total time, medal, citation and site citation. There are no per-problem results. The first twelve places carry medals (four gold, four silver, four bronze). The citation column names the place for the ranked teams, from First Place on (62 teams carry Ninetieth Place), and 148 teams are listed under Honorable Mention. Eighty-nine teams have a site citation of First, Second or Third Award. First place goes to Moscow SU: Red Panda with 11 problems and a time of 1624.
