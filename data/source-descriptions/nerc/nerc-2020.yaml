  description: |-
    Scoreboard of the Northern Eurasia Finals 2020-2021, marked "5:00:00 of 5:00:00, status: over", so a final board of a five-hour contest. It lists 50 teams, each as institution and team name with the three members, against 11 problems labelled A to K. A cell shows a plus with the number of earlier wrong attempts (if any) and the solve time as minutes and seconds, a minus with the number of failed attempts, or a dot for no attempt; the last columns give problems solved, penalty time and a medal letter G, S or B (four teams each, places 1 to 12). Four teams solved seven problems; the first place has 7 solved with 893 penalty time. Summary rows at the bottom give total runs, accepted, rejected, first accept and last accept per problem; they show no accepted run for A, F and H. The text "Show time" appears above the table.
