    Problem set of the onsite round as a PDF of 14 pages, in English. The running header reads "ICPC 2020-2021, NERC - Northern Eurasia Finals, Onsite" and "St. Petersburg, Minsk, Tbilisi, Riga - April 4th, 2021". There is no cover page: problem A starts on page 1. It holds 11 statements, A ASCII Automata Art to K King's Task. Each gives time limit and memory limit, the text of the problem, the input and output format (problem I, which is interactive, has an interaction protocol instead) and an example; some have a note, and the last page is the note of problem K. No test data or solutions.
