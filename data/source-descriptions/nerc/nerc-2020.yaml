  contest_date: '2020-12-13'
  description: |-
    Website of the Northern Eurasia Contests, in English with Russian passages. Our copy holds 138 files, 128 of them HTML or PDF pages, and covers other editions too. The 2020 pages announce the online round of 13 December 2020, hosted by St Petersburg, Barnaul, Tbilisi and Almaty, and the onsite round of 3 and 4 April 2021 at History Park "Russia - My History" in St Petersburg. Other pages give a calendar, the onsite schedule, accommodation, a map, the special rules for the 2020/2021 season (Russian, with an English version below it on the same page), a contestant handbook PDF and a list of 50 teams.

    The archive page for 2020 links the standings, statements, tutorials, jury archives and runs of both rounds. Our copy holds the statement and tutorial PDFs of both rounds and the standings page of the online round (324 team rows); the onsite standings page, the jury archives and the runs are not in it. Standings pages of regional contests of 2020 and 2021 are included.

    The information home page exists in several versions: one from the time of the online round (team login notes, the handbook, links to the online standings, problems and tutorial), one reporting that the onsite finals took place on 3 and 4 April 2021, and one announcing the 2023 finals for 11 to 13 December 2023. The copy also holds pages for 2021, school olympiad results and university course materials.
