    Scoreboard of the Northern Eurasia Finals, in English, with the clock at 5:00:00 of 5:00:00 and status over. 306 teams are listed with rank, team name (institution, then team name, then the three contestants' surnames), 13 problems A to M, problems solved and penalty time. Each problem cell shows a plus with the number of extra tries and the time of the accepted run, a minus with the number of rejected runs, or a dot for no attempt; a Show time checkbox hides the times. A last column, Qual, holds codes such as Q, G, S, B, I, II and III for some teams (blank for 201 of the 306). Two teams carry an asterisk after their rank. The first place is a team of HSE with 10 problems solved.

    Below the teams the page totals runs, accepted and rejected runs per problem, and the first and last accepted run time of each problem.
