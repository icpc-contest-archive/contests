  title: Northern Eurasia Contests
  language:
  - en
  - ru
  contest_date: '2024-12-15'
  description: |-
    Website of the Northern Eurasia Contests (NERC), run from ITMO University. Our copy holds 57 pages: the Northern Eurasia Finals 2024 page, the archive page for 2024, and the same pages for 2025, plus other material of the site.

    The 2024 finals page announces the contest for 13 to 15 December 2024 at four sites (St. Petersburg, Novosibirsk, Astana, Tbilisi), with links to the team reference document, selection rules and contest rules, a note that tests of problem G were removed and runs rejudged, and the schedule and venue details for the sites. The 2024 archive page links the final standings, the problem statements in PDF, the problem analysis, all runs, the jury archive, team reaction videos and a brochure, and lists the regional contests with their standings, statements and qualification materials. Held in our copy: the final standings page, the English statement PDF of 13 problems, the 8-page analysis PDF, the 31-page brochure in English and Russian, and standings pages of several regional contests (Astana site, Ural, Armenia, Taurida, Northwestern Russia) with some statement and tutorial PDFs.

    The pages are mostly in English with Russian headings and links. The pages of the 2025 edition are in the copy too. The 2025 brochure and one 2024 duplicate of the brochure are cut short and cannot be opened, eight linked pages were not saved, and there are no style sheets and only four SVG images.
