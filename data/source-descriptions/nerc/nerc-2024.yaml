    Dashboard page of a Codeforces contest, marked Finished, titled as an unrated online mirror of the contest with ICPC rules. It lists 13 problems A to M by name, each with its input and output form, a time limit (3 seconds, 6 seconds for H), a 1024 MB memory limit, and a count of accepted solutions. Links lead to the statements and the editorial as PDFs in English, and an announcement dated 2024-12-15 repeats the statements link.

