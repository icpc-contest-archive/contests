    Final scoreboard of the Northern Eurasia Finals, headed "ICPC 2019-2020, NERC - Northern Eurasia Finals", with the clock at 5:00:00 of 5:00:00 and status "over". It lists 301 teams against 12 problems A to L. Each team name is followed by its members' surnames. A cell shows a plus sign with the number of rejected attempts and the solve time in minutes, a minus sign with the number of rejected attempts when the problem is unsolved, or a dot for no attempt. Further columns give the number solved, total time and a medal letter; four teams carry G, four S and four B. SPb SU: 25 is first with 10 problems and a time of 1119. Below the teams the page gives per-problem totals: total runs, accepted, rejected, and the times of the first and last accepted run.
