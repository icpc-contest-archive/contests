- url: https://nerc.itmo.ru
  read: '2026-11-16'
  rubric: 1
  copy: nerc/nerc-2019/website/2026-09-05-wayback-29b909c0
  title: Northern Eurasia Contests
  language:
  - en
  - ru
  contest_date: '2019-12-01'
  description: |-
    Website titled Northern Eurasia Contests, with History Park "Russia - My History" in St Petersburg named as the venue of the 2019 finals. Our copy holds 150 pages. The 2019 archive page links the finals standings, the problem statements, a jury archive and the problem analysis. Its block for the Northwestern Russia regional lists standings, qualifier materials and NWRRC materials; Ural, Taurida, Kazakhstan and Armenia list standings, and the other regionals say that no information is available. The finals page for 2019 gives the programme from Friday 29 November to Sunday 1 December 2019: registration, opening ceremony, talks by sponsors, a quiz game, the practice session, the contest on Sunday 1 December and the awards, with hotel information partly repeated in Russian.

    Inside the copy are the finals standings, the statement PDF, the analysis PDF, standings pages of 16 regional contests of 2019, and statements and tutorials of the Northwestern Russia regional and its qualifier. The site is shared by several editions: it also holds 41 files of 2020 (archive page, standings, statements, tutorials, rules, a handbook), pages of the school olympiad and a few teaching pages.

    The jury archives and run files linked from the 2019 page are not part of our copy.
