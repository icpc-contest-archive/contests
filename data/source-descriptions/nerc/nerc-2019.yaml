    Problem analysis of the finals as a PDF of 10 pages in English, headed with the finals' name and the date 1 December 2019. It opens with a summary table of the 12 problems with author, developer, number of accepting teams, runs and success rate. It then gives one section per problem, A to L, with accepted and rejected runs by language and a description of the solution; ten of the sections also list the fastest, shortest and most-attempts solutions, while problems C and H, which no team solved, list none. The text states a recap of 310 teams, 12 problems and 5 hours.
