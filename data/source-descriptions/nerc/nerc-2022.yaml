  description: |-
    Final scoreboard of the finals: 281 teams, twelve problems A to L, with the clock shown as 5:00:00 of 5:00:00 and status 'over'. Each row gives rank, the team as 'university: team name' followed by its three members, and for every problem a cell showing a plus or minus sign, the number of rejected attempts and the time of the accepted run in minutes and seconds; unattempted problems show a dot. The last columns give problems solved (=), total time (Time) and a medal letter: 5 gold, 3 silver and 4 bronze. The first place is MIPT: Yolki-palki with 10 problems.

    Below the teams, summary rows give per problem the total runs, accepted runs, rejected runs, time of first accept and time of last accept. Eleven problem cells are marked as first solves (problem L has no accepted run). A 'Show time' control sits above the table.
