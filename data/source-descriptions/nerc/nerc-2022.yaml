  description: |-
    One page of the Northern Eurasia Contests website, in English, titled 'Northern Eurasia Contests' and headed 'NERC 2022'. Our copy holds this one page. A menu at the top lists the years 1996 to 2025.

    Under 'Resources' the page lists seven items for the 2022 finals: contest standings, problems in PDF format, problems analysis, jury archive (tests, generators and jury solutions), a Codeforces mirror, photos, and runs for all problems. Under 'Regional Contests' it lists 18 regional and national contests, including Armenia, Azerbaijan, Georgia, Kazakhstan, Moscow and Belarus, several with their own standings, handbook, statements or tutorial entries.

    The page is a list of links; the documents it points to are not part of this page.
