  description: |-
    Final standings of the finals: 281 teams, as the header states. Each row gives rank, team name, institution, problems solved, penalty time, medal, a citation (First Place, Second Place and so on, then Honorable Mention) and a site citation (Northern Eurasia Finals Champions for the winner, First Degree Diploma, Second Degree Diploma and so on). Five teams hold gold, three silver and four bronze medals. Ties share a rank; the table ends with teams that solved no problem, ranked 270.

    There is no per-problem detail. The first place is Yolki-palki of the Moscow Institute of Physics and Technology with 10 solved and a time of 1323.
