  title: 'ACM/ICPC: Fierce competition among students of Vietnam''s leading IT Universities'
  language:
  - en
  contest_date: '2013-10-26'
  description: |-
    News item published by FPT, in English and dated 30/10/2013, reporting on the national round of the 2013 ACM International Collegiate Programming Contest held on 26 October. It states that 164 teams from 56 universities and colleges took part at 7 places, each team of 3 with one networked computer solving 10 problems, with results scored by software and updated on an online system.

    The result is given for the top places only: three teams from FPT University, the University of Technology of the National University of Hanoi and Ho Chi Minh City University of Natural Sciences each solved 8 of 10 problems; Independence of the University of Technology won the championship on time, and the first prize was shared by FPT University, Ho Chi Minh City University of Natural Sciences and Ho Chi Minh City University of Technology. The item also reports the placing of an FPT team at the regional contest in Jakarta, which is another contest. It ends with press contacts and the site's menus and news links.
