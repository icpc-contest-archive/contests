  title: Four DTU Teams Qualify for the 2013 ACM/ICPC Asia Regional Contest
  language:
  - en
  contest_date: '2013-10-26'
  description: |-
    News article from Duy Tan University, in English, about the 2013 ACM/ICPC national online preliminary contest held on 26 October. It states that 165 teams from 56 universities and colleges took part at 4 campuses in Hanoi, Danang, Nha Trang and Ho Chi Minh City, that each team of 3 members and a coach sat a 5-hour computer test, and that 14 teams from six central universities competed at the university's own campus.

    Of the university's five teams, four qualified for the Asia regional contest, which the university was to host on 28 and 29 November; they are named by team name. A team had to solve at least one problem to qualify. The article lists the prizes planned for that later ceremony. There is no ranking of teams.
