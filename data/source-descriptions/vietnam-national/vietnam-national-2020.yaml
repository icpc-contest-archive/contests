  description: |-
    Final scoreboard of the contest as a Kattis standings page: 339 teams against thirteen problems, A to M. Each team has its rank, name, number of problems solved and total penalty time, and each problem cell shows the number of tries and the minute of the accepted run (a dash instead of a time where it was not solved). A key marks first solves, solved, attempted and pending. A site selector offers All and twelve sites. The team in first place, EggCentroy, solved all 13 problems; 321 teams solved at least one problem and 18 solved none, sharing rank 322.

    Each team row also carries an institution logo with the institution name as its tooltip (51 different institutions).
