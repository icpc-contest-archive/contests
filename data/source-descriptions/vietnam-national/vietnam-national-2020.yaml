  description: |-
    Contest site on Kattis for the ICPC Vietnam National Programming Contest 2020, in English. The contest ran on 15 November 2020 from 08:00 to 13:00 (+07), five hours, and the site says the contest is over.

    Our copy holds 96 pages. They include the standings of all 339 teams, with twelve further standings pages filtered to the twelve sites; a problem list; the full statements of all thirteen problems A to M, from Astrological Sign to Malfunctioning Robot; and the Kattis help, language and terms pages. No team list page is in our copy. The capture holds 150 files, 96 of them pages, with three style sheets and 50 icon and image files; the contest's own teams, rules and languages pages and the 339 individual team pages were not fetched.
