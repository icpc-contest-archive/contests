    Problem set of the 2018 Vietnam National contest: a PDF of 23 pages with the statements of 12 problems A to L, from Adventure Begins to Like No One Ever Was. The first page begins directly with Problem A; there is no cover page, and each page carries the footer Vietnam National 2018 with the problem letter, name and page number. Each statement is in English. Eleven have input and output format with sample input and output, and two of them (A and G) also explain their samples; problem C is interactive and has an Interaction section and a communication example instead. No test data or solutions.
