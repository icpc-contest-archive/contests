  description: |-
    Final scoreboard of the contest as a ranking page of the VNOJ (VNOI Online Judge): 377 teams against thirteen problems, A to M. Each row gives the rank, the team name followed by its institution, a cell per problem with the minute and the h:mm:ss time of the accepted run and the number of tries (or only the tries where the problem was not solved), then Points (problems solved) and Penalty. A last row, Total AC, counts accepted solutions per problem (0 for problem B), and a colour key marks first solves, solved, incorrect, pending and untried. The first place solved 10 problems; 375 teams solved at least one and 2 solved none, sharing rank 376.

    The page shows no contest date. The judge's menu and links lead outside our copy.
