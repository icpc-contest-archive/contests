  description: |-
    Contest page on the VNOJ (VNOI Online Judge) for the Vietnamese national round of ICPC 2022, with English wording on the contest page and Vietnamese on the problem list and ranking pages. The contest page states a five-hour ICPC-format contest starting on 13 November 2022 at 08:00 (+07), with a penalty of 20 minutes for each submission before the first maximum-score one, and lists the thirteen problems A to M, from A VCS Problem to Median of Xor Sequence. A second page lists the same problems with time and memory limits and a link to each statement.

    Our copy holds 17 pages: the contest page, the problem list page, the ranking page and 14 pages of the contest's submission list (671 submissions with problem, language, author, time, result and memory, the submission times running from 2022 to January 2026). The ranking table is empty in our copy; only its colour key is present. The statement links (13 PDF files) and the Official Rankings link lead outside our copy.
