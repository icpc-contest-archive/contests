  description: |-
    News article from Duy Tan University, in English, about the national round of the 2012 ACM International Collegiate Programming Contest in Vietnam, which began on 27 October. It states that one hundred and sixty teams took part from Hanoi, Ho Chi Minh City, Danang, Can Tho, Nha Trang, Hung Yen in Hai Duong, Hai Phong and other places, that students of Central Vietnam gathered at the university's campus, that the Vietnam Association for Information Processing marks the first round and selects teams for a final round in Hanoi in November, and that ten Vietnamese teams then go to the Asian finals.

    The results given are those of the local teams: four of the university's teams, four from Danang Polytechnic University, two from the Danang University of Economics and one from Pham Van Dong University finished the three-hour test, and two of the university's teams solved two problems while two solved one. There is no ranking of teams. The page also carries the site's menu and links to other news items.
