    Contest page of the 2024 ICPC national round on the VNOI Online Judge (VNOJ), in Vietnamese. The main page states a five-hour ICPC-format contest starting on 17 November 2024 at 8:00 (+07), with a 20-minute penalty per wrong submission, and lists 12 problems A to L (Assembling Triangles to Lights Off). A second page lists each problem with its time and memory limit and sample input and output.

