  description: |-
    Contest page of the 2023 ICPC national round on the VNOI Online Judge (VNOJ), in Vietnamese. The main page states a five-hour ICPC-format contest starting on 5 November 2023 at 8:05 (+07), with a 20-minute penalty per wrong submission, and lists 13 problems A to M (Angry Birbs to MofK's Mysterious Money Making Machine). A second page lists each problem with its time and memory limit, its sample input and output, and a link to the statement.

    Our copy holds 20 pages: the contest page, the problem list, the ranking page, and 17 pages of the submission list. The ranking page holds only the page frame and filter controls; its table is not in our copy, so no results can be read from it. The submission pages list later submissions to the problems with result, language, time and memory.
