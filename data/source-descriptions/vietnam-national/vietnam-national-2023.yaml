    Final scoreboard of the 2023 ICPC national round on VNOJ: VNOI Online Judge, which is powered by DMOJ: 429 rows of teams with rank, username with institution, points, penalty, and for each of the 13 problems A to M the solve time with the number of tries, or only the number of failed tries. A last row gives the number of accepted solutions per problem; the first row is BKDN.LeaderTurnsBack with 11 points. A legend explains the cell colours: solved first, solved, tried incorrect, tried pending, untried.

    Fifteen of the rows have names beginning '[PRATICE]' and carry -9999 points and rank 415; the other 414 are the ranked teams. Our copy has the page with its style sheets, images and scripts.
