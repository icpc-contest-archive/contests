    Kattis problem page for “Another Query on Array Problem”, in English: the full statement with input and output sections, a Sample Clarification section that follows the array through the sample queries, and one sample input with its output. The side panel gives a CPU time limit of 4 seconds, a memory limit of 256 MB and a difficulty of 6.8 (Hard), links the sample data files, and names the source as The 2017 ACM - ICPC Vietnam National Programming Contest; the page shows no problem letter. The task: for an array of N zeros, process M queries that add or subtract the products (i+1)(i+2)(i+3) along a range, or ask for a range sum modulo 10^9+7.
