  description: |-
    Contest system of the 2017 Asia HCMC Vietnam National Programming Contest, run on Kattis (Powered by Kattis). The front page shows the contest as finished, 5 hours long on 2017-11-05, with a link to the final results. Our copy holds 150 files, 142 of them pages: the final standings, the problems list and the statements of 12 problems (English, each with sample input and output), a rules page giving the ranking and 20-minute penalty rules, the list of 199 teams, 89 individual team pages, language help pages, and login and information pages.

    The 89 team pages show affiliation, competing site and an ICPC Eligible flag (Yes on all 89); the team list covers ten sites such as Hanoi, Ho Chi Minh City, Da Nang, Nha Trang, Can Tho and an online site. Pages at 49 addresses the site links to were not captured: three team pages, three language pages, the problem pages under the contest's own address (the same statements are present under the general problem address), and scripts and fonts. Images are limited to a logo, a banner and a judge icon.
