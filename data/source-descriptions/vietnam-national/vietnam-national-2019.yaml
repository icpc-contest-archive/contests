  description: |-
    Contest site on Kattis for the ICPC Vietnam National Programming Contest 2019, in English. The front page gives the contest window (3 November 2019, 02:00 to 07:00 CET, five hours) and says the contest is over, with a link to the final results.

    Our copy holds 77 pages. They include the standings of all 262 teams, with ten further standings pages filtered to the ten sites (Posts and Telecommunications Institute of Technology, Hanoi University of Science and Technology, University of Engineering and Technology VNU, Ho Chi Minh University of Science, Ho Chi Minh City University of Education, University of Information Technology, Industrial University of Ho Chi Minh City, University of Science and Technology of the University of Danang, Can Tho University, and one called other); a problem list with solve and attempt counts; the full statements of all twelve problems A to L; and the Kattis rules, help and terms pages. No team list page is in our copy. The style sheets and 66 images (mostly language icons) are in our copy; the contest's own teams, rules and languages pages and the individual team pages were not captured.
