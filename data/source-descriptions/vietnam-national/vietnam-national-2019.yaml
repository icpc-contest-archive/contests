  description: |-
    Final scoreboard of the contest as a Kattis standings page: 262 teams against twelve problems, A to L. Each team has its rank, name, number of problems solved and total penalty time, and each problem cell shows the number of tries and the minute of the accepted run (a dash instead of a time where it was not solved). A key marks first solves, solved, attempted and pending. A site selector offers All and the ten sites. The team in first place, Cc, solved 7 problems; 144 teams solved at least one problem and 118 solved none, sharing rank 145.

    Each team row also carries an institution logo with the institution name as its tooltip (53 different institutions); countries are not shown.
