  description: |-
    Kattis page of the Open Division of the contest, run on the same day and hours as the main contest (3 November 2019, 02:00 to 07:00 CET, five hours). It states 12 problems, 151 contestants and 128 teams, 61 languages and 795 submissions, and lists the problems A to L by name.

    It explains the scoring: each problem is pass/fail, and participants are ranked by problems solved, then by penalty time (submission time plus 20 minutes per wrong submission). Links to the standings, problems, teams and rules of this division lead to other pages that are not part of our copy.
