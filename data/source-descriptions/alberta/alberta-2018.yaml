  description: |-
    Contest page of the Alberta Collegiate Programming Contest 2018, in English, published by the Competitive Programming Club. It states that teams are ranked by problems solved within five hours, names Arcurve as sponsor and Kattis as sponsor of the judging platform, and lists prize money for two divisions, eligibility rules, registration deadline (Thursday, October 25th), the schedule of the day in Calgary, the contest rules and some strategy advice.

    Our copy holds this one page and its style sheet. Several of its links (main contest, practice contest, contest page) lead to the 2017 contest site on Kattis, not to the 2018 one.
