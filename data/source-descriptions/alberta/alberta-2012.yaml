  description: |-
    Website of the Alberta Collegiate Programming Contest (ACPC), run by the Problem Solving Club at the University of Calgary. The front page for 2012 gives the mission, the prizes ($1,500, $750, $300), the three prize-winning teams (University of Lethbridge 1, Alberta Green, Alberta Gold), links to an official and a guest scoreboard, a list of downloads (photos, problems, test data, solutions, poster), the registration rules and deadline of October 12, and the time and place of the contest on Saturday, October 13, 2012 at the University of Calgary.

    Our copy holds 133 pages of the contest system for several years: for 2012 the contest page listing problems A to H, the practice contest and its scoreboard, the clarifications page, the official scoreboard and the guest scoreboard, and an archive of test data for the contest; it also holds the corresponding pages of the 2011, 2013 and 2014 contests and of the 2015 contest in two divisions (18 problem statements as PDF files for 2015), a page of a 2013 Calgary Collegiate Programming Contest, and pages of many practice sets run on the same system, one of them built from NWERC 2012 problems.

    The photo, problem and solution downloads linked from the 2012 front page are not in our copy.
