  description: |-
    Problem list of ACPC 2012 on the Baekjoon Online Judge, in Korean. The page names its source as ACM-ICPC Regionals, North America, Rocky Mountain Regional, Alberta Collegiate Programming Contest, and lists eight problems labelled A to H with the judge's problem numbers, Korean titles, the number of users who solved each, the number of submissions and the acceptance ratio. Seven titles are Korean renderings of the original ones (licence plates, bouncing bowling ball, Caesar cipher, ripple effect, logic expression, amazing maze, garbage collection); the title of problem H is Chuck Norris, not Sequential Thinking as on the other judge page. The statements themselves are not on this page. The rest of the page is the judge's menus.
