  description: |-
    Online contest page, headed "Online Contest Page", for the online version of ACPC 2012, a joint effort of the University of Alberta, the University of Calgary and the University of Lethbridge. It lists eight problems A to H (Nice Licence Plates, Bouncing Bowling Ball, Caesar Cipher, Ripple Effect, Evaluating Logic Expressions, Amazing Maze, Garbage Collection, Sequential Thinking), each linked to its own page, and links to the whole problem set as a zipped HTML file (672 kb) and a zipped PDF file (958 kb). The page says the online contest was held on Saturday, March 16, 2013, 9:00 to 14:00 GMT, and thanks the host of the contest at the UVa online judge. Only this list page is in our copy; the linked problem pages and archives are not.
