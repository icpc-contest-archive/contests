  title: Alberta Collegiate Programming Contest 2025
  language:
  - en
  description: |-
    Contest page of the Alberta Collegiate Programming Contest 2025, run by the Competitive Programming Club and sponsored by Arcurve. It covers registration through Eventbrite (deadline October 17th, 2025), prize money for Division 1 ($1200, $600, $300) and Division 2 ($300, $150), eligibility rules, the planned schedule of the day at the University of Calgary, contest rules and preparation tips. Teams of up to three are ranked by problems solved and then by time over five hours, on Kattis, with a link to a practice contest.

    The text still reads 'Saturday, October 18th, 2023' in the time and location section, while the rules give the start as 11:30AM MDT on Saturday, October 18th and the registration deadline names 2025. The practice contest link points to an acpc24 contest. Our copy holds this one page; it has no results or problems.
