  description: |-
    Contest page of the 2007 Alberta Collegiate Programming Contest, dated October 13, 2007, 11:00 to 16:00. It gives the mission of the contest, links to the pages of the other years from 2003 to 2014 and to a list of fall 2007 competitions, the prize amounts (first $1,500, second $750, third $300, open only to teams from Alberta), and the three prize-winning teams with their members: University of Calgary, University of Alberta and University of Lethbridge. A text states that 16 teams took part, each solving at least one problem, and that six guest universities were not eligible for prizes. There is no full results table and no problem list; links to the rules, the main contest and the practice contest lead outside our copy.
