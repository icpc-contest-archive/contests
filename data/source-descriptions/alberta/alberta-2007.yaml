  description: |-
    Online contest page, headed "Online Contest Page", for the Alberta Collegiate Programming Contest 2007, a joint effort of the University of Alberta, the University of Calgary and the University of Lethbridge. It lists ten problems A to J (Satisfying Constraints, The Largest Clique, This Means War!, Laser Pointer, Enumerating Rational Numbers, Drawing Straws at the Office, Curious Fleas, Andy's Shoes, The Joys of Farming, Summing Digits), each linked to its own page, and names the Alberta Informatics Circle of Research Excellence as the funder of the original contest. The page gives the contest day as Saturday, October 27, 2007; its footer names the University of Calgary Programming Contest Control Centre v1.6. Only this list page is in our copy; the linked problem pages are not.
