  description: |-
    Contest page of the Alberta Collegiate Programming Contest 2019, in English, published by the Competitive Programming Club. It states that teams are ranked by problems solved within five hours, names Arcurve as sponsor, and lists prize money for Division 1 and Division 2, eligibility rules, the registration deadline (Wednesday, November 20th), the schedule of the day in Calgary, the contest rules and strategy advice. It has links labelled Div 1 judge, Div 2 judge and Practice. The page has no results table.

    Our copy holds this one page with its assets. Its links to the judge pages and some other links (main contest, practice contest) lead outside the copy, and the main and practice contest links point to the 2017 contest on Kattis.
