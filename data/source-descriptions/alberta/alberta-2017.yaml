  description: |-
    Contest website for the 2017 Alberta Collegiate Programming Contest, a single page in English from the Competitive Programming Club, sponsored by Arcurve, with Kattis named as sponsor of the judging platform. It gives the prizes (Division 1: $1200, $600 and $300 for the first three places; Division 2: $300 and $150), eligibility rules, registration, the schedule for Saturday, October 14th, 2017 (practice contest, official contest from 12:00 to 17:00, solutions to the problem set, awards ceremony with door prizes), contest rules, permitted Internet resources, and preparation and strategy tips. It links the main contest and the practice contest on Kattis.

    Our copy holds one page and its style sheet. The logos on the page are not in our copy.
