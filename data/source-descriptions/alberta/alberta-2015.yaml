  contest_date: '2015-10-17'
  description: |-
    Contest website for the 2015 Alberta Collegiate Programming Contest, a single page in English organized by the Problem Solving Club, sponsored by Arcurve and Petrofeed. It gives the prizes (Division 1: $1500, $750 and $450 for the first three places; Division 2: $300 and $150), eligibility rules, registration, the schedule for Saturday, October 17th, 2015 (practice contest, official contest from 12:00 to 17:00, award ceremony), contest rules, permitted Internet resources, and preparation and strategy tips. It links the Division 1 and Division 2 contest and practice pages on another server.

    Our copy holds one page and its style sheet. The logos and the winners photograph on the page are not in our copy, and the linked contest pages are separate sources.
