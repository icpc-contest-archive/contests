  description: |-
    Final scoreboard of ACPC 2015 Division I from the Ultra Cool Programming Contest Control Centre, for the contest of Saturday, October 17, 2015, 12:00 to 17:00 MDT. It lists 38 teams with rank, team name, problems A to J, number solved and penalty time, where a cell shows the solve minute with penalty minutes added (such as 152+20) or failed attempts in parentheses. All 38 rows are in the emphasized typeface the page uses for official teams. Chocolate truffle is first with seven problems and a penalty of 520.

    Below the table the page lists team names with their members; that list is longer than the 38 ranked teams. Links lead to the problem PDFs, which are not in our copy.
