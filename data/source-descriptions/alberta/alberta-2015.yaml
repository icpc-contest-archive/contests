    Live Contest Page of the Alberta Collegiate Programming Contest for ACPC 2015 Division I, run on Ultra Cool Programming Contest Control Centre v1.8. It states the contest as Saturday, October 17, 2015, 12:00 to 17:00 MDT, calls it a joint effort of the University of Alberta, the University of Calgary and the University of Lethbridge, and lists ten problems A to J, from Cannonball Pyramids to Artificial Intelligence, each linking to a PDF statement. A menu leads to the scoreboard, submissions, clarifications, help and login pages. The page holds no results, and neither those pages nor the statement PDFs are in our copy.
