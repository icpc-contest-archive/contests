    Online contest page, headed "Online Contest Page", for the online version of the Alberta Collegiate Programming Contest 2008, described as a joint effort of the University of Alberta, the University of Calgary and the University of Lethbridge. It lists ten problems A to J (Letter Frequency, Situp Benches, Triangle Trouble, Finding the Transmitter, Grid Successors, Colossal Fibonacci Numbers!, Alien DNA, Partitioning by Palindromes, Nurikabe, Train Tracks), each linked to its own page, and a link to all problems as a zipped set of PDFs. The page says the online contest was held on Saturday, February 21, 2009, 09:00 to 14:00 GMT, and names the Alberta Informatics Circle of Research Excellence as the funder of the original contest. Only this list page is in our copy; the linked problem pages and the zip are not.
