    Final Kattis standings of Division 1: 24 teams, ranked by number solved and total time, with problems A to K. Each team row shows solved count, penalty time and, per problem, the number of attempts and the minute of the accepted run (or attempts only when unsolved); eleven problem cells carry a first-to-solve mark. Twenty of the 24 rows show an institution logo (University of Calgary, University of Alberta, University of Lethbridge or Mount Royal University). First place is the team 'definitely not alberta sapphire or anything like that' with 11 solved. The page gives a contest window of 2024-10-26 19:30 to 2024-10-27 00:30 CEST.
