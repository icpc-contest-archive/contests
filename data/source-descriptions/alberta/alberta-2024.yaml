  rubric: 1
  copy: alberta/alberta-2024/website/2026-09-02-live-902bf809
  title: Alberta Collegiate Programming Contest 2023
  language:
  - en
  description: |-
    Single-page website of the Alberta Collegiate Programming Contest, organised by the Competitive Programming Club and sponsored by Arcurve. The page is still titled "Alberta Collegiate Programming Contest 2023" and states the contest day as Saturday, October 26th, 2023, while it gives the registration deadline as October 23rd, 2024 and links to the 2024 Division 1, Division 2 and Open Division contests on Kattis; the practice contest link is the 2023 one. It covers registration through Eventbrite, prize tables (Division 1: $1200, $600, $300; Division 2: $300, $150), eligibility rules for teams of up to three students, the planned schedule in the CPSC lab at the University of Calgary, contest rules and strategy tips.

    Our copy holds this one page and its style sheet; the poster and club logo images of the page are not in our copy, and the links lead to other servers.
