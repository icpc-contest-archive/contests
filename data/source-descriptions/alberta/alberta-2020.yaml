  description: |-
    Contest page of the Alberta Collegiate Programming Contest 2020, in English, published by the Competitive Programming Club. The contest is held online. The page gives links to a practice contest and to Division 1, Division 2 and Open Division contests on Kattis, prize money for Divisions 1 and 2, eligibility rules, the registration deadline (Thursday, November 12th), the schedule of the day with an Arcurve presentation, the contest rules and strategy advice. Teams are ranked by problems solved within five hours.

    Our copy holds this one page and its style sheet. The contest links lead to other servers and are not part of it; one link, Contest page, points to the 2017 contest on Kattis.
