  title: Alberta Collegiate Programming Contest 2022
  language:
  - en
  contest_date: '2022-11-19'
  description: |-
    Single-page website of the Alberta Collegiate Programming Contest 2022, organised by the Competitive Programming Club and sponsored by Arcurve. It describes a five-hour team contest on Kattis in two divisions plus an open division, with an Eventbrite registration link, prize tables (Division 1: $1200, $600, $300; Division 2: $300, $150), eligibility rules for teams of up to three students enrolled in Alberta institutions, the planned schedule for the day in the CPSC lab at the University of Calgary, contest rules and a section of strategy tips.

    The page states the contest day as Saturday, November 19th, 2022, and links to a practice contest and to the Division 1, Division 2 and Open Division contests on Kattis. Our copy holds this one page and its style sheet; the poster and club logo images of the page are not in our copy, and the links lead to other servers.
