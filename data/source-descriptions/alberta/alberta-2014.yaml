  description: |-
    Live contest page of ACPC 2014, run on the Ultra Cool Programming Contest Control Centre v1.8, in English. The front page states that the contest is a joint effort of the University of Alberta, the University of Calgary and the University of Lethbridge, gives the contest time as Saturday, October 04, 2014, 12:00 to 17:00 MDT, and links nine problems, A to I (Army Ants, Bouncing Beams, Debts, A Knight in the Night, Paint it Red, Arcurve's Party, Pascal's Triangle, Striking Sets, Triangle Graph).

    Our copy holds 15 pages and three images. The nine problems are PDFs of two pages each, with the time limit, input and output format and a sample input and output for every problem. The scoreboard page is the final scoreboard with 30 teams. The clarifications page holds answers on standard input and output, Java class names, compiler versions, the statements being PDFs, a change to problem C, questions on problems B and I, and notes on a backlog of unjudged submissions. The help page describes the contest system, and the submissions and login pages show only a login prompt.
