  contest_date: '2006-10-14'
  description: |-
    Website of the 2006 Alberta Collegiate Programming Contest, held October 14, 2006, 11:00 to 16:00. The front page gives the mission of the contest, the prize money (1st $1,500, 2nd $750, 3rd $300) funded by iCore, the top three teams from the University of Alberta, the University of Calgary and the University of Lethbridge, and a summary saying that 24 teams took part and that 11 of them, from outside Alberta or inside, were guests not eligible for prizes. It links to the other editions from 2003 to 2014, which are not in our copy.

    Our copy holds 13 pages: the front page, the final scoreboard of 24 teams, the problem index, a page of rules (team composition, scoring, submission, judging environment), and the nine problem pages A to I, each with a statement and a sample input and output.

    No images are in our copy: not the three pictures on the front page, not the logos, and not the figures that the problem pages refer to.
