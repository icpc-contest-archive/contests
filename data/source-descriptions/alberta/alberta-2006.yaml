  description: |-
    Final scoreboard of the Alberta Collegiate Programming Contest, contest of Saturday, October 14, 2006, 11:00 to 16:00 MDT: 24 teams ranked 1 to 24 with problems A to I, total solved and penalty. A problem cell gives the solve time, with +20 steps for rejected runs, or the number of failed tries in brackets. Guest teams are mixed in; the page says the official teams are shown in emphasized typeface. The first place, Alberta Guest 1, solved 8 problems.

    Below the table the page gives the member names for 16 of the teams. The footer names the University of Calgary Programming Contest Control Centre.
