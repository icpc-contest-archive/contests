  description: |-
    Final scoreboard of ACPC 2011, for the contest of Saturday, October 15, 2011, 11:00 to 16:00 MDT, produced by the Ultra Cool Programming Contest Control Centre. It lists 42 ranked rows with rank, team name, nine problem columns A to I, total solved and penalty; one row (rank 41) has no team name and no solved problems. A solved cell gives a time, with a "+" amount added where earlier submissions were wrong; an unsolved cell with attempts shows a negative number in parentheses. Stanford Coaches is first with 9 problems solved. A note states that only official teams are shown in emphasized typeface, so unofficial teams are mixed into the ranking, and a list below the table names the members of 15 of the teams. Links lead to the problem pages, submissions, clarifications and login of the contest system, which are not part of our copy.
