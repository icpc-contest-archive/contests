  description: |-
    Announcement page of the 2011 Alberta Collegiate Programming Contest (ACPC), dated October 15, 2011, 11:00 to 16:00. It states the mission of the contest, lists the prizes (iPod Touch for the first team, iPod nano for the second and third, one for each team member up to three per team), gives the registration deadline of 1:00 p.m. on Friday, October 14, says the contest at the University of Calgary is held in the CPSC lab on the main floor of the Math building, and says a practice contest starts one hour before the main contest. Links lead to the rules and the main and practice contest pages and to the pages of the 2003 to 2010 contests; none of them is in our copy. Our copy holds this one page, without images.
