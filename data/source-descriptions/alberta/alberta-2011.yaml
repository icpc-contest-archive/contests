    Contest page for ACPC 2011, titled "Alberta Programming Collegiate Contest", described as a joint effort of the University of Alberta, the University of Calgary and the University of Lethbridge. It lists ten problems A to J (Bits and Pieces, Happy 12, How Many... in 3D!, Pieces and Bits, Casino Advantage, Night Market, SpaceRecon Tournament, Let's call SPaDe a SPaDe, Plants vs. Zombies HD SP, Simulating Billiard Ball), each linked to its own page; problem J is marked as a guest problem. The scoreboard of the contest has columns A to I only. Only this list page is in our copy; the linked problem pages are not.
