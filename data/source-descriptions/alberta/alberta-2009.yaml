    Online contest page, headed "Online Contest Page", for the Alberta Collegiate Programming Contest 2009, described as a joint effort of the University of Alberta, the University of Calgary and the University of Lethbridge. It lists ten problems A to J (Social Constraints, Credit Check, Parallel Carry Adder, Slitherlink, Finding the Transmitter Again, Heavy Cycle Edges, Rigging Elections, Poor Trade Advisor, Red-Blue Tree, Installing Diagnostic Software), each linked to its own page. The page gives Saturday, January 09, 2010, 08:00 to 13:00 GMT as the time of the online contest, an address for questions to the host, and names the Alberta Informatics Circle of Research Excellence as the funder. Only this list page is in our copy; the linked problem pages are not.
