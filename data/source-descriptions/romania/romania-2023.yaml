  description: |-
    Codeforces Gym dashboard of the 2023 Romanian Collegiate Programming Contest (RCPC), marked Finished and described as the 2023 edition of the Romanian Collegiate Programming Contest, with a link to the contest website. The page lists 13 problems A to M: Maximum Distance, The floor is lava!, Basketball, Edenland, Fiboxor, Suceava, Minimize Sum, AI Thoughts, KSumT, Parallelogram, Blabla, Dush and Dragons. Each row gives the time and memory limit and the number of accepted solutions.

    Under contest materials the page links Statements (en) and Editorial (en), two PDFs named "day2 statements" and "RCPC_2023_Day_2_Final_Editorial". The PDF files themselves are not in our copy, and neither are the problem statements. One question and answer is shown, on problem B.
