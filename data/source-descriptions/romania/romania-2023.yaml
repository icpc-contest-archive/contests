  description: |-
    Final standings of the 2023 Romanian Collegiate Programming Contest on Codeforces Gym: 107 rows with place, participant name, problems solved, penalty, and one column for each of the 13 problems A to M. Each problem cell gives the wrong attempts and the time of the accepted run as hours and minutes (for example "+2 03:19"), or the number of rejected attempts for an unsolved problem. A footer row gives the number accepted and tried for each problem. 21 rows add the team members' surnames in brackets after the name.

    Every one of the 107 rows carries the Gym "Ghost participant" mark. The top participant solved 11 problems, the next four solved 9, and 11 rows at the bottom solved none, sharing place 97.
