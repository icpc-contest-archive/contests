  description: |-
    Codeforces Gym dashboard of the 2023 Romanian Collegiate Programming Contest (RCPC), marked Finished and described as the 2023 edition of the Romanian Collegiate Programming Contest, with a link to the contest website. The page lists 13 problems A to M: Maximum Distance, The floor is lava!, Basketball, Edenland, Fiboxor, Suceava, Minimize Sum, AI Thoughts, KSumT, Parallelogram, Blabla, Dush and Dragons. Each row gives the time and memory limit and the number of accepted solutions.

    Under contest materials the page links Statements (en) and Editorial (en), two PDFs named "day2 statements" and "RCPC_2023_Day_2_Final_Editorial". The PDF files themselves are not in our copy, and neither are the problem statements. One question and answer is shown, on problem B.
- url: https://codeforces.com/blog/entry/122235?locale=en
  read: '2026-11-16'
  rubric: 1
  copy: romania/romania-2023/judge-codeforces/20261102-live-750e42c3/page.html
  title: RCPC 2023 on Gym
  language:
  - en
  description: |-
    Short Codeforces blog post titled "RCPC 2023 on Gym", written by the person who coordinated the contest. It says the 2023 Romanian Collegiate Programming Contest took place in Iasi as part of the RCPCamp, an international ICPC camp organised in Romania by the Alexandru Ioan Cuza University of Iasi, and that the contest was posted on Gym. It credits seven problem setters, thanks one person for the chance to set it, and thanks the author of the Kilonova platform, which held the contests on both days of the camp.

    The post links the Day 1 and Day 2 problem sets on Kilonova and adds an update that ghost participants were added to the Gym contest to resemble the results of online and onsite participants. It has one comment. The rest of the page is Codeforces site furniture, such as rating and contributor tables and recent actions, which is unrelated to the contest.
