  description: |-
    Results page of the Romania Programming Contest with four tables: the national final, the Bucharest subregion contest, the Timisoara subregion contest and the Cluj subregion contest. The national final is a scoreboard of 68 teams and the Bucharest subregion one of 60 teams, both with problems A to L: each team has a rank, a user name, problems solved, penalty and, per problem, the time of the solution with further lines of numbers beneath it (in brackets in the national final, such as (-1), and without brackets in the Bucharest table). In the national final the user names link to profile pages on an online judge at another address.

    The Timisoara table lists 14 teams and the Cluj table 22 teams, each with place, institution, team, problems solved, total time and last solution. The page title is "Untitled Document". UNIBUC_BigDawgs is first in the national final with 11 problems and penalty 1226.
