    Standings of 71 teams with rank, team, institution, problems solved, time and a citation. The citations run from First Place to Thirty-eigth Place, then Honorable Mention for ranks 39 to 64; the last teams share rank 65 and have no citation. Unibuc BigDawgs of the University of Bucharest is first with 11 problems and time 1226, followed by Unibuc Smecheria with 8 and The Cod3rs of the Technical University of Cluj-Napoca with 8. There are no per-problem columns.
