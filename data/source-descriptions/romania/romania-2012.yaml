  description: |-
    Website of the Romanian Chapter of the ACM, in English, titled "The ACM International Collegiate Programming Contest - Romania Programming Contest". The front page is a frame set with a navigation menu (for 2012 and 2013: News, Final Report, Sponsors, Standings, Problems). Our copy holds 150 files, 42 of them pages, many saved under more than one address, and 75 image files.

    The pages for 2012 are the news page of the Southeastern European Regional Contest (SEERC) 2012, which lists winners and photo headings, and its final report: the contest ran on October 12 and 13, 2012 on two sites, Politehnica University of Bucharest and Vinnytsia National Technical University, with 83 teams from 47 universities in 8 countries, followed by result tables. The 2013 pages are a welcome news page for SEERC 2013 (registration at the same two sites), a problem page for problems A to J with a link to an archive of all problems with input and output data, a directory listing of that archive (the archive file itself is not in our copy), and a report and a results page for the Romania Programming Contest of June 2013, with national final and subregion results. A 2011 news page is also in it.
