  description: |-
    Contest page on the infoarena judge, in Romanian, for the Romanian Collegiate Programming Contest 2019, described as the national stage of the ICPC. It states that the round runs on Saturday 28 September 2019 at 10:00 for five hours with 9 to 12 algorithmic problems, that each team of three uses one shared account and one computer under a university supervisor, and that the first five teams officially representing a university from an organised site receive prizes of about 1200 euro in total, awarded in Bucharest at UPB after SEERC.

    A table of 11 tasks gives title, author and source: Invinv, Rebus, Joc pe graf, Boltz, Fibsum, Oglinzi, Eqset, Secvzerounu, Siruri duplicat, Sirul infinit and Portofel. Only names are listed, with no statements or test data. Tabs lead to the problem list and the results page.
