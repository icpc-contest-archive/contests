  description: |-
    Contest page on Virtual Judge titled "Romanian Competitive Programming Contest (RCPC) 2021", set to run for five hours. Its announcement tells participants to follow the online SEERC 2020 rules, says each team member may use their own computer and code at the same time, and asks teams to name their account with their institution's initials (for example UB, UPB, UAIC) so the ranking can be imported on icpc.global, with other names for unofficial and high-school entries.

    The page lists 13 problems labelled A to M: Checkpoints, Pandemic mutation, Timon, Sorted Heights, Fair Distribution, Equal or Multiple, Pumba, Sequence S, Mr X, Natural sums, Drinking games, Sorting Chips and Simple Query. Twelve are taken from Kattis and problem F from AtCoder; every entry has time limit and source properties, and ten of the 13 also name an author. Statement texts are not in our copy.

    The status table is empty and no scoreboard rows are present in our copy, so it holds no results.
