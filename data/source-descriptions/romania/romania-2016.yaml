    Standings of the 2016 Romania Programming Contest: 59 teams, each with rank, team name, institution, number of problems solved, total time and a citation. The first 27 rows carry place names from First Place to Twenty-ninth Place and the other 32 are marked Honorable Mention; rank numbers run up to 68 and skip some values, and four teams are listed with no problem solved. First place is Mafia Unibuc of the University of Bucharest with 10 problems and a time of 1371. No per-problem results or attempt counts.
