  contest_date: '2016-06-16'
  description: |-
    Website of the ACM Romania Programming Contest as kept at acm.ro, in English. For this edition it holds the report on the 2016 Romania Programming Contest (2016-2017 ICPC year, sponsored by IBM): four subregional first-stage contests in April to early June 2016 (54 teams in Bucharest, 19 in Iasi, 16 in Cluj, 17 in Timisoara) and a national final on 16 June 2016 on an online judge. It states 11 problems and 23 team slots granted to Romanian universities for the Southeastern European Regional Contest. It ends with the national final scoreboard: 67 team rows, 11 problem columns headed by problem names, each cell a plus or minus attempt count and a solve time, then solved count and penalty; rows give a team name and an account name, no institution. First place solved 10 problems with a penalty of 1371.

    Our copy also holds the 2016 site of the Southeastern European Regional Contest (SEERC), Bucharest and Vinnytsia, 21 and 22 October 2016: news, a schedule and a final report with statistics, and a problems page whose files are not in our copy. Pages of other editions are in it too: the 2011 site pages, the 2012 report and results, and pages and a 16-page problem statement PDF for the 2017 SEERC.

    Our copy has 34 pages among 150 files, with images, style sheets and scripts saved beside them. The front page is an empty frameset shell.
