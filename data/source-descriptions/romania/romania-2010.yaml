  description: |-
    Website of the Romanian Chapter of the ACM, in English, titled "The ACM International Collegiate Programming Contest - Romania Programming Contest". The front page is a frame set with navigation menus (for example News, Call for participation, Registration, Standings, Problems, Final Report) labelled for the 2009-2010, 2010-2011 and 2011-2012 seasons. Our copy holds 150 files, 41 of them pages, many saved under more than one address.

    The pages about 2010 cover the Southeastern European Regional Contest held in Bucharest, October 14 to 17, 2010: a report on the organisation and the 57 registered teams, a results page ranking 51 teams with university, problems solved and time (Taurida V.I. Vernadsky National University first with 9 problems), a photo page, and a problem page linking ten one-page problem PDFs A to J dated October 16, 2010, with a link to an archive of all problems with input and output data (the archive itself is not in our copy). The 2011 pages are a news item on the 2011 Romania Programming Contest, a report on the 2011 regional contest (77 teams on two sites) and the first of its problem PDFs. A report on the 2016-2017 Romania Programming Contest is also in it.

    Our copy has 77 image files.
