  description: |-
    Scoreboard of the Romanian Collegiate Programming Contest of 20 October 2024, kept as a published Google Sheet headed "vjudge ranking" with the address of the vjudge contest. A note says that problem N is problem B, added during the contest on an alternative judge, and apologises to the teams affected by technical issues.

    The table has 95 rows with rank, team name (often with the members' surnames in brackets), and two score columns, "Score minus B=N" and "Score with B=N". It then has one column for each of the problems A to M and a fourteenth, "N = B". A solved problem shows the time of the accepted run as hours:minutes:seconds, and failed attempts are shown in brackets, for example "(-2)". A row under the header gives a pair of numbers for each problem, such as "32 / 342".

    The first place solved 10 problems. 14 rows share rank 78 with one problem solved, and the last three rows share rank 93 with no problem solved. One of the rows is the organisers' own account, named "RCPC Admin". The sheet has no institution column.
