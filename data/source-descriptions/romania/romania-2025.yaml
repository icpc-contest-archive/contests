    Final standings of the Romanian Collegiate Programming Contest of 9 November 2025, kept as a published Google Sheet: 104 teams with rank, university in brackets, team name, the members' Codeforces handles, award, problems solved and penalty time. A statistics line states 104 teams, 9 universities, 5 hours, 13 problems, 238 total solved and 431 submissions, and a note says that problem E had to be adjusted and re-evaluated after the contest. Beside the table are links to the associated workshop, RCAW, and the contest website, and a list of the scientific committee.

    The awards are 4 Gold, 6 Silver, 9 Bronze and 9 Mention; the other 76 teams have none. The first place solved 8 problems, and 26 teams at the bottom solved none. There are no per-problem columns. Team and handle names link to Codeforces pages, which are not part of our copy.
