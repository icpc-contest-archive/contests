  description: |-
    Website of RCPC 2025, the Romanian Collegiate Programming Contest, in English. Our copy holds 3 pages. The front page calls the contest the official national stage of the ICPC and gives the date, 9 November 2025, the location "PRECIS, UPB & Online", teams of 3 students and a five-hour contest, with a link to a Discord community.

    The schedule page lists the day's programme in local time: team registration 09:00 to 09:30, contest 10:00 to 15:00, the RCAW 2025 algorithms workshop 15:30 to 16:30, the award ceremony 16:30 to 17:30 and dinner at 18:00, with notes on arrival, the contest environment and breaks. The about page says the 2025 edition is hosted by the Politehnica University of Bucharest and that the contest is the national qualifier for SEERC. It gives a short history of the ICPC and the rules: ICPC rules apply, one computer per team, AI models are prohibited, a 20-minute penalty per incorrect submission, and ranking by problems solved and then total time.

    The pages hold no results, team list or problems. The menu, sponsor list and footer are loaded by a script from separate files that are not in our copy.
