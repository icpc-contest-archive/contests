    Results page of the 2013 Romania Programming Contest with five tables: the national final and the Bucharest, Iasi, Cluj and Timisoara subregion contests. The national final table has 59 team rows, the Bucharest table 76 and the Iasi table 11; they give rank, location, user, solved, a time with a bracketed number for each problem and penalty, with problems A to K, A to N and A to H respectively. These rows are written by a script from data inside the page, and in those three tables the teams ranked 1 to 15 that solved a problem are marked with cup, gold, silver or copper icons that point to another server. The Cluj table (16 teams) gives number, team name, institution, problems solved and time, led by UBB of Babes-Bolyai University with 7 problems and 1114. The Timisoara table (16 teams) gives rank, institution, team, problems solved and total time. No per-problem results for Cluj and Timisoara.
