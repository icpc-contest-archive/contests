  description: |-
    Website of the 2013 Romania Programming Contest, in English, under the ACM International Collegiate Programming Contest name. Our copy holds 4 pages: a frameset front page, a report page, a results page and a problems page. The frames of the front page (menu, news, header) are not part of our copy.

    The report page is a prose report on the two-stage national contest: local first-stage contests in four subregions (Bucharest, Cluj, Iasi, Timisoara) in April to early June 2013, with 76, 26, 11 and 16 teams, and a second stage held on 16 June 2013 on the online judge system maintained by Tianjin University, with 11 problems. It states that team Vision from Universitatea Tehnica "Gh. Asachi", Iasi, won with 9 problems solved and a penalty of 967, and that 23 team slots at the Southeastern European regional were granted to Romanian universities. It ends with five results tables, the same as on the results page: the national final scoreboard with 59 team rows (solved count, penalty, and a time with a bracketed number for each problem A to K), the Bucharest table with 76 rows and the Iasi table with 11 rows, which are written by a script in the page, and the Cluj and Timisoara tables of 16 teams each. The problems page links problems A to K on the Tianjin judge.
