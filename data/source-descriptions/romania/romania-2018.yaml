    Scoreboard on the infoarena judge, in Romanian: 69 rows, each with position, team or account name with its judge username, one cell per task, score (problems solved) and penalty. The columns are the nine tasks Big Four, Laundering, Cameras, Entropy, Brackets2, Fraud, Unter, Guest and Boring, then a tenth column, "Listare surse [Not a Task!]", which is not a task and is not counted in the score. Each task cell gives the number of wrong attempts and the minute of the accepted run (for example "+2 51"), or a minus sign with a count and a time for an unsolved task ("-2 278").

    The top teams solved 8 problems. 61 rows have at least one problem solved; the last 8 rows have score 0 and share position 62. Some rows are individual names rather than university teams, and nothing in the table marks official against other participants.
