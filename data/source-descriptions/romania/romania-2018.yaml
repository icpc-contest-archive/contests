  description: |-
    Contest page on the infoarena judge, in Romanian, for the ACM Romanian Collegiate Programming Contest 2018. It states that the round runs on Saturday 29 September 2018 at 10:00 for five hours, with 9 to 12 algorithmic problems, that each team of three works from one shared account and one computer, and that teams are supervised by a university staff member.

    A table lists the tasks with author and source (ACM-ICPC national phase 2018): Big Four, Laundering, Cameras, Entropy, Brackets2, Fraud, Unter, Guest and Boring, plus a tenth row, "Listare surse [Not a Task!]". Only names are listed, with no statements or test data. The page also names the problem-setting committee and has links to a results page and the forum.
