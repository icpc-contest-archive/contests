    Final scoreboard of the First National Syrian Collegiate Programming Contest (SCPC 2011) on the contest website, in English: 12 teams, eight problems A to H. Per team it gives rank, name, problems solved, time, attempts and solve time for each problem written as tries/minutes, and total attempts and solves. A last row gives for each problem the number of submissions, the time of the first Yes and the total of Yes. No institution column. The page says it was last updated Sunday, 02 October 2011 12:59. First place is Nitro++ with 4 solved in 295 minutes; the ranking has two teams tied at 11th place.
