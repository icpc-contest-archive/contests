    Standings of the 2011 Syrian Collegiate Programming Contest: 12 teams with rank, team, institution, problems solved, time and a citation. The first six are cited as First to Sixth Place and the other six as Honorable Mention; two teams share rank 11. The institutions are Damascus University, Lattakia University, Wadi International University and Aleppo University. First place is Nitro++ (Damascus University) with 4 solved in 295 minutes. No per-problem results.
