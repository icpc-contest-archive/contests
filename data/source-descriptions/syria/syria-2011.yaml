  description: |-
    Front page of the Syrian Collegiate Programming Contest website, in English. The article announces the First National Syrian Collegiate Programming Contest (SCPC 2011), hosted by Tishreen University, Latakia, Syria, from 28 Sep to 1 Oct and presented, administered and sponsored by the Syrian Computer Society with the Informatics Engineering faculty of Tishreen University. It names the first three places and links to the problem set and the I/O data as zip files and to the final scoreboard. The menu lists rules, gallery, contest environment, links and resources, schedule and pages for the universities Albaath, Aleppo, Damascus and Tishreen.

    Our copy holds only this one page; the menu pages and the two zip files are not in it.
