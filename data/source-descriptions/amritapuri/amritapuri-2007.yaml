  description: |-
    List of registered teams from the Amrita ICPC site, in English. A table of 99 rows, the count the page states as its total, gives for each team a serial number, team name, coach name, coach email, institution address and the details of two bank drafts or cheques (fee payments). The serial numbers are not a clean sequence: some repeat and they are not in order. Eight team names appear more than once, and the last two rows are test entries with placeholder text. It has no results and no contest date.
