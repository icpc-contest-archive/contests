- url: http://icpc.amrita.ac.in/updates/?q=node/20
  read: '2026-11-16'
  rubric: 1
  copy: amritapuri/amritapuri-2007/website/2026-10-20-wayback-53f6541c
  title: ACM - ICPC 2007 Regionals Report | ACM Amritapuri Campus
  language:
  - en
  contest_date: '2007-12-22'
  description: |-
    Website of the 2007 ACM ICPC Asia Region Amritapuri contest, made by the ACM ICPC 2007 Web Administration Team of Amrita Vishwa Vidyapeetham, Amritapuri Campus, in English. Our copy holds 21 pages: the home page, the regionals report, a blog, the onsite schedule, contest rules, registration rules, fees and prizes, an FAQ, directions to the campus, contacts, pages about Amrita University, the sponsors (IBM and Google) and ICPC, related links, a registration form for ICPC teams, a registration form for the South India level contest, and a list of registered teams.

    The report says the contest was held at the Amritapuri Campus on 21 - 22 December 2007, that 48 of the 54 teams selected in an online contest took part, and that the team Colorful Bee from Taiwan University was first with 6 problems solved, ahead of a team from Chennai Mathematical Institute on the same number. The report says 7 problems were posed while the rules page says eight. The home page also announces the online contest of 11 November 2007. The site also holds a page for a separate South India level coding contest, which it says is not related to the ICPC. Our copy has no results table and no problem statements.
- url: http://icpc.baylor.edu/icpc/regionals/ViewRegionalStandings.asp?ContestID=853
  read: '2026-11-16'
  rubric: 1
  copy: amritapuri/amritapuri-2007/standings/2026-09-01-wayback-9aef2721/page.html
  title: The 2007 ACM Asia Programming Contest - Amritapuri sponsored by IBM
  language:
  - en
  contest_date: '2007-12-20'
  teams: 54
  description: |-
    Standings page from the ICPC contest system, titled 'View Standings', with two lists. The Final Round (Asia - Amritapuri On-Site Regional Contest, dated 12/20/2007 on the page) lists 54 teams with rank, team, citation and a number of problems solved, which the page gives without a column heading. Ranks run from 1 to 54 without a rank 50, followed by a row with rank 59; the citations are First Place and so on up to Fifty-fourth Place, then Fifty-ninth Place. Taiwan University's Colorful Bee is first with 6 solved; 11 teams solved none. Each team is shown as institution followed by team name.

    The Preliminary Site list holds 93 teams, all marked Honorable Mention without rank or solved count. There are no times or per-problem results.
