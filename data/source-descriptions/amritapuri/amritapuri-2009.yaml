  title: The 2009 ACM-ICPC Asia Amritapuri Regional Contest
  language:
  - ko
  - en
  problems: 4
  description: |-
    Category page of the Baekjoon Online Judge, a Korean online judge, for this contest, with its interface in Korean. It lists four of the contest's problems: B Interleaved Periodic String, F Visible Lattice, G XOR Sum (titled in Korean) and H Find The Number. For each it gives the judge's problem number, the number of users who solved it, the number of submissions and the acceptance rate. The page marks the contest as ICPC Regionals, Asia West, India.

    It is a list of problems with links, not the statements: the statements are on separate pages that are not in our copy. The other problems of the contest are not listed. The counts are those of the capture.
