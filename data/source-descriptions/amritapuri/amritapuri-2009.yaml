  title: ACM ICPC 2009 Regionals - Asia Site - Amritapuri
  language:
  - en
  contest_date: '2009-11-01'
  problems: 10
  description: |-
    Website of the Asia Amritapuri regional site, run by Amrita University, in English. The front page announces the onsite contest of 1 November 2009 and links to the contest rules, registration, how to reach the campus, a gallery, an about-ICPC page, the blog, and the 2008 and 2007 regional sites. It lists the teams advancing to the 2010 World Finals, a problem set A to J, the final ranking of the onsite contest, rankings of all Amritapuri teams, and the director's report. It names Team Oasis of Sogang University, South Korea, as 2009 winner.

    Our copy holds 72 saved files, 44 of them pages. Of the 2009 material it has five problem statements as web pages (A, C, E, G, J), a 1-page director's report PDF and a 20-page 2009 site cookbook PDF with welcome messages, the activity schedule and contest guidelines. Most other pages belong to the 2008 and 2007 sites: a 2008 teams list, schedule and ranking table, a 2007 team registration list, news posts, and a 2008 cookbook. The pages for the 2009 final ranking and the other five problems are not in our copy; the links to the standings lead to another server.
