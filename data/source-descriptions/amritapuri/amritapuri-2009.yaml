  description: |-
    Standings of the Amritapuri regional: 302 teams with rank, team name, institution, problems solved, total time, and a citation. The 39 ranked teams carry a citation naming the place (First Place, Second Place, and so on) and share ranks in ties; the other 263 teams have no rank, 0 solved and the citation Honorable Mention. First place is Oasis from Sogang University with 7 solved. There is no per-problem detail and no number of attempts.
