- url: http://icpc.amrita.ac.in
  read: '2026-11-16'
  rubric: 1
  copy: amritapuri/amritapuri-2016/website/2026-09-05-wayback-b9e9b56f
  title: ACM ICPC Asia Amritapuri Site
  language:
  - en
  contest_date: '2016-12-23'
  description: |-
    Website of the Amrita University host sites of the ACM ICPC Asia Amritapuri regional, in English. Our copy holds 131 pages and 149 files from several years of the site. The pages of this edition are the ICPC-2016 page (the Amritapuri, Bengaluru, Coimbatore and Mysuru sites, selected teams and their allotted sites), the Cookbook 2016 (sponsors, 21 to 23 December, registration, schedule, how to reach each campus), the FAQ, notices on the online contest, foreign teams, pending registrations and sponsors, and PDFs with selected-team lists, online-round results, site rankings, the final scoreboard, the schedule and a Director's Report.

    The Director's Report gives the contest day as 23 December 2016 and says 388 teams from 250 institutions took part; it names the first three teams and lists issues of the day, among them a late start and two problems added after two hours. The seed page is the 2017 site front page, which announces the 2019 onsite contest; the copy also holds pages of the sites of 2008 to 2015, 2017 and 2019.
