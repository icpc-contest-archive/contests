  pages: 27
  description: |-
    Scoreboard of the 2016 Amritapuri site regional contest, headed 'final standings': a scanned printout of 27 pages dated 12/25/2016, with no text layer, taken from a scoreboard page that names DOMjudge. The table gives rank, country, team and institution, problems solved, time, and tries and minutes for each of the problems A to K. First place is FacelessMen with 10 problems solved. A row of per-problem totals (SUMMARY) and a few test entries close the table; the last page carries a legend of categories (Amritapuri, Bengaluru, Coimbatore, Mysuru, Self-Registered) and cell colours (solved first, solved, tried incorrect, untried).

    The text was read by OCR on a few pages only.
