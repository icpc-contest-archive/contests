  description: |-
    Codeforces blog post by kshitij_sodani, titled 'India ICPC — Amritapuri 2020 Regionals Results'. It announces that the ranklist is released provisionally, subject to plagiarism checks, ahead of the solution discussion and award ceremony of 21 August. It names the winning institutions (IIT Roorkee, IIT Kanpur, DA-IICT, IIIT Hyderabad and Bits Pilani) with the Codeforces handles of their team members, and says that the problem Cat and Dice remained unsolved, that the top team solved 8 problems, 4 teams solved 7 and 10 teams solved 6. It links to a scoreboard hosted on CodeDrills; the ranklist itself is not in the post.

    The comments ask how many teams will qualify for the World Finals, announce the time of the problem discussion, and one links to a page on the selection of Asia West teams for the World Finals.
