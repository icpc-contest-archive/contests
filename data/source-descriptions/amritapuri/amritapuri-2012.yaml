    Detailed ranking of the online round as a PDF of 18 pages: 748 team rows with user ID, team name, institution, rank, a cell for each of the five problems A to E, number solved and points. Each solved problem shows a time and a bracketed number; unsolved problems that were tried show dashes and a bracketed number. Every team listed has solved at least one problem, from one to five. The first rank is held by Segment3 (International Institute of Information Technology - Hyderabad), with five problems solved.
