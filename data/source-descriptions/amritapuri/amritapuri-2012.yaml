  read: '2026-11-16'
  rubric: 1
  copy: amritapuri/amritapuri-2012/website/2026-10-20-wayback-0c6eb576
  title: ACM ICPC 2012
  language:
  - en
  contest_date: '2012-12-20'
  description: |-
    Website of the ACM ICPC 2012 Asia Amritapuri Multisite Regional, maintained by ICPC @ Amrita, in English. The home page announces the contest as held at three sites, Amritapuri, Bengaluru and Coimbatore, and gives contact addresses per site for registration, transportation and accommodation. It carries the onsite registration instructions (site choice, travel and payment details, lists of selected teams), transportation, accommodation and food arrangements, and news items on the online contest of 4 November 2012. A page of important dates gives the online contest on 4 November 2012 and the onsite contest on 19 to 20 December; the tentative schedule on the home page puts the regional contest itself on 20 December. A page on the online round describes the submission procedure and the contest environment (Linux, C, C++ and Java).

    Our copy holds four pages: the home page, the online round page, the important dates page and a PDF with the ranking of the online round. The menu links to further pages (onsite round details, history, sponsors, rules, how to prepare) that are not in our copy.
