    Standings of the 2012 ACM-ICPC Asia Amritapuri Regional Contest: 253 teams with rank, team, institution, number solved, time, citation (the place spelled out, "First Place" and so on) and site citation. Tied teams share a rank, and the ranks run from 1 to 105. The site citation names three teams as champions of Amritapuri, Bengaluru and Coimbatore, the contest's three sites. 22 teams have no problem solved. There is no per-problem detail. First place is Fringe (Indian Institute of Technology - Bombay) with eight problems solved.
