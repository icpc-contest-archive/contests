  description: |-
    Problem set as a PDF of 24 pages headed ICPC Amritapuri Regionals 2025-26, in English. It holds 11 problems labelled B to L: Fair Removals, Path Pair Maximization, Point Mirror, Preventative Measures, Red Green Game, Score Queries, Segment Elimination, Sequence Domination, Varied Subsequences, XOR Product MST and X To Y. Each has a statement, input format, output format, constraints, a sample input and output, and an explanation of the sample. There is no problem A, no cover page with date or place, and no test data or solutions.
