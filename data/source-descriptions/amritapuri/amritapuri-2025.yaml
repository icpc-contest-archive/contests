  title: ICPC Asia Amritapuri Regional Contest
  language:
  - en
  description: |-
    Website of the ICPC Asia Amritapuri Regional Contest for the 2025 edition, in English; its footer names Amrita School of Engineering, Amritapuri. Our copy holds 12 pages. The home page announces the Amritapuri Regionals 2025 with sites at Bengaluru, Coimbatore, Kollam and Mysuru, names Div4Maxxer (Indian Institute of Technology - Kharagpur) as winner, and gives the important dates (registration, online prelims on 8 November, onsite regionals on 2-3 January), registration steps, sponsors and past webinar sessions. It carries buttons to download the ranklist and the problem set.

    The other pages are the hall of fame of winners, the top three teams, a timetable of the onsite programme (breakfast, registration, opening ceremony, a tech talk, practice contest, banquet dinner), the organising team, the 2026 problem solver calendar, and travel directions for the Amritapuri, Bengaluru, Coimbatore and Mysuru campuses.

    The prelims and onsite ranklist pages are in our copy but show only their filter controls and the message "No teams found matching your search", with no table. The ranklist and problem set files behind the download buttons are not among the pages of our copy of the site.
