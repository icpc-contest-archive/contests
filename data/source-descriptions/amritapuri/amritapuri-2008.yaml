  title: ACM ICPC 2008 Regionals - Asia Region, Amrita University, Amritapuri
  language:
  - en
  contest_date: '2008-12-06'
  description: |-
    Home page of the 2008 ICPC regional contest at Amrita University, Amritapuri (Asia region), in English. It gives the important dates (online contest on 2 November, results notification on 5 November, onsite contest on Sunday 6 December 2008, registration closed), contact names for onsite coaches and contestants (travel, accommodation, contest rules, certificates, excursion), and the sponsor banners. Links lead to the onsite results, the onsite problem set in PDF format, a regional contest cookbook PDF, registration, contest rules, photos and a blog.

    Our copy holds one page, this home page. The results page, the problem set PDF and the cookbook are linked but are not part of this copy, and the sponsor images and style files were not saved with it.
