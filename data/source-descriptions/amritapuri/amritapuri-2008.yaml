    Scoreboard of the onsite regional contest: 59 teams ranked 1 to 59, with team name, university, a cell for each of the nine problems A to I, number of problems solved and points. Each solved problem shows a time in hours:minutes:seconds followed by a number in brackets; unsolved problems that were tried show dashes with a bracketed number; untried problems are empty. Seven teams have no problem solved. Teams come from Indian institutions and from universities in Sri Lanka, Singapore, Indonesia, Bangladesh and Kazakhstan. First place is The King's Gambit with seven problems solved. The page is a plain table titled "Untitled Document" with no other text, no medals and no links.
