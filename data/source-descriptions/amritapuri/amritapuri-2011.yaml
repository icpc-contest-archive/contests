  description: |-
    Standings of the 2011 ACM-ICPC Asia Amritapuri Regional Contest: 146 teams with rank, team, institution, number solved, time, medal, citation and site citation. Tied teams share a rank, and the ranks run from 1 to 73. Sixteen teams carry a medal (four gold, seven silver, five bronze). The site citation column names the first two teams as champions of the on-site contest at Amritapuri and at Coimbatore. Six teams have no problem solved. There is no per-problem detail.
