  description: |-
    Onsite contest rankings, 2011, as a web page: 146 teams ranked 1 to 146 with team name, institution, a cell for each of the ten problems A to J, number solved and points. The page's header says each cell gives the solved time with the number of false attempts in brackets; tried but unsolved problems show dashes and the number of attempts. Six teams have no problem solved. Nearly all teams are from Indian institutions; 2 are from Bangladeshi universities. First place is Proof (Indian Institute of Technology - Delhi) with eight problems solved. No medals or other marks.
