  pages: 11
  description: |-
    Scribd page for an uploaded document called ACM ICPC Amritapuri 2014, 11 pages long. The page's own summary says the document summarizes 10 coding problems and names five of them, with the idea of the solution: whether a shortest path tree is also a minimum spanning tree (B), counting numbers in a modulo range with precomputed sums (C), checking for duplicates to decide on nesting dolls (D), counting common substrings by dynamic programming (F) and simulating two players' positions (I).

    Our copy holds only the Scribd page with this summary and the site menus; the pages of the document itself are not in it, so no statements, samples or solutions can be read.
