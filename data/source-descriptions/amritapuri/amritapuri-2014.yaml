  title: ACM ICPC Asia Amritapuri Site 2014
  language:
  - en
  contest_date: '2014-12-16'
  description: |-
    Website of the ACM ICPC Asia Amritapuri Site 2014, run by Amrita University for the regional contest held at its Amritapuri and Coimbatore (Ettimadai) campuses, in English. The front page is one long page of dated notices: the preliminary online round on 11 October 2014 run on CodeChef, the selection of teams and site allotment, demand draft and registration deadlines, the onsite schedule with the contest on 16 December 2014 from 09:00 to 14:00, transport, accommodation, the excursion, the contest software list, and a note that the final scoreboard was published on 17 December 2014.

    Our copy holds nine pages. Besides the front page they are an older home page with general text about the ICPC and sponsor IBM, the registration and online contest rules as a PDF, the team registration status as a PDF, a page listing registered teams with their payment status, and three login or password-reset pages of the registration system. One further page is empty. The front page links the director's report, the onsite problem sets page, the final scoreboard PDF and the cookbook, but those documents are not in our copy. The two map frames lead to another server.
