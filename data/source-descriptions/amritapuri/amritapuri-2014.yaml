    Information sheet of three pages for the onsite round, hosted by Amrita University at Amritapuri and Coimbatore and sponsored by IBM, Infosys and Directi. It lists the important dates from the online contest results on 18 October to the onsite contest on 16 December 2014 (09:00 to 14:00), the policies and procedures (coach-only appeals, three-member teams, student ID at registration, a 25-page reference document, a fee of INR 2500 per team or USD 150 for foreign teams), the event schedule for 14 to 17 December, and short sections on transportation, accommodation and food. It contains no results.
