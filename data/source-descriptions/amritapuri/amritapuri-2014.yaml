    Scoreboard printed from DOMjudge, last updated 17 December 2014 at 09:40, seven pages. It has 267 team rows: 260 in a first ranking (places 1 to 249, ties sharing a place; the last place is shared by teams with no problem solved) and a second group of seven rows ranked again from 1. Per team it gives name, problems solved, total time and, for each of problems A to J, the number of attempts with the solve time and penalty in minutes for solved problems (for example 4 (189 + 60)). There is no institution column. The team in first place is 3Spades with 7 solved and 737 minutes. A last row gives totals per problem, and a legend explains the cell colours (solved first, solved, tried incorrect, untried) and the categories Participants, Observers, Organisation and System.
