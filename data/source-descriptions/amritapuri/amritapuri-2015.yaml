  description: |-
    Public scoreboard of a DOMjudge system for ACM ICPC Asia Amritapuri Site Regionals 2015, headed final standings, last updated Monday 21 December 2015 at 15:10:02 IST. It has 333 teams, all in the Participant colour, shown with rank, country flag (323 of the teams), team name, institution, problems solved and total time. 79 teams have a blank rank cell, each with the same solved count and time as the row above. Ten problems are columns, labelled BDAY, CAM, CAS, COINS, COPRIMES, GIT, JMP, LPALIN, MAM and SS, each linked to a problem page; a solved cell gives attempts and minutes (for example 1/7) and an unsolved cell gives the number of attempts or 0. The best score on the page is 4 problems solved, by TarjanHorse and ntm; 47 teams have none. A summary row gives totals per problem, and a legend lists the cell colours and the categories Participant and Observer.

    Only the page itself is in our copy: its style sheet, scripts and flag images, and the linked problem and team pages, are not.
