    Standings of the 2013 ACM-ICPC Asia Amritapuri Regional Contest: 377 teams with rank, team, institution, number solved, time and a citation column. The top places are spelled out ("First Place" and so on) and 189 teams carry "Honorable Mention". Ranks run without ties from 1 to 377. Every team has at least one problem solved. There is no per-problem detail. First place is illusion (International Institute of Information Technology - Hyderabad) with eight problems solved.
