  title: ACM ICPC 2013 Regional - Amritapuri Site
  language:
  - en
  description: |-
    Website of the ACM ICPC 2013 Regional, Amritapuri Site, run by Amrita University, in English. It is a blog-style site: the home page carries posts on the onsite round, the onsite problem set and contest director's report, the published onsite leaderboard, room allocation and excursion lists, and accommodation contacts, and a table of 400 teams with their institutions. Static pages cover the online contest (a three-hour contest with not more than five problems over the internet), important dates (online contest on 23 October 2013, onsite contest on 18 to 19 December), registration (with a link to the regional rules on the ICPC Baylor site), FAQ, sponsors, links, a feedback form and contact.

    The site links the onsite problem set (PDF), the final result workbook (an Excel file), the contest director's report (2 pages, with registration and onsite figures: 410 teams selected, 377 attended at the three campuses), room allocation and departure lists, the contest cookbook (31 pages) and guidelines for onsite contestants. A later post says 389 teams, which differs from the report.

    Our copy holds 47 pages and 68 files in all, including these documents and the site's style sheets and scripts. The links to the Facebook, Twitter and YouTube pages lead outside the copy; some images (logos), feeds, older posts and the style sheets and scripts of the onsite sub-page were not saved with it.
