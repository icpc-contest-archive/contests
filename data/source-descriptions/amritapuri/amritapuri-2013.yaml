  description: |-
    Final result of the onsite contest, an Excel workbook of one sheet: 377 teams ranked 1 to 377 with team name, registration ID, city, problems solved and total time in seconds. For each of the eleven problems A to K it gives the number of submissions, the time taken in seconds and the penalty in seconds. The city column names the site of each team: Amritapuri (149 teams), Coimbatore (121) and Bengaluru (107, written Bengaluru for 105 and Bangalore for 2). Every team has solved at least one problem; the best have eight. First place is the team named illusion_11590 with eight problems solved. No institution column.
