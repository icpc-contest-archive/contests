  description: |-
    Problem set of the onsite contest as a PDF of 21 pages with no cover page: eleven problems A to K, from Arrows and Quiver to Planetary Alignment, in English. Each problem has a statement with input and output format, constraints, a sample input and output, and a time and memory limit. The statements are themed on stories from the Mahabharata. No test data or solutions.
