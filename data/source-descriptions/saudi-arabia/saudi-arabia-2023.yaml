  description: |-
    Single page in Arabic on the Future Skills portal of the Ministry of Communications and Information Technology, announcing the Saudi CPC programming contest run with Saudi universities, in which teams of three students from the same university solve programming problems and the leading teams go on to the regional and then the world contest. It lists the goals, the registration conditions (Saudi nationality, university or vocational-training student, age 18 or older, a computing, engineering or technical science major), the programming languages C, C++ and Java, and a question-and-answer section stating that there is no fee and that the final selection is held in September. The registration links are shown as closed. The page does not name the contest year; its footer is dated 2023. The rest is the portal's menus and empty course lists.
