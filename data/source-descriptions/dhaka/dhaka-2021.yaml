  title: ICPC Asia Dhaka Regional Contest - BUBT
  language:
  - en
  contest_date: '2022-10-08'
  description: |-
    Website of the ICPC Asia Dhaka Regional Contest 2021, hosted by Bangladesh University of Business and Technology (BUBT), in English. The home page gives the last date of payment for onsite registration (September 20, 2022), links to the program schedule, rules, confirmation letters, accommodation and travel grant, and has a section on the 2014 ICPC Dhaka event at the same university. Other pages cover online and onsite contest rules (the onsite contest is held on CodeMarshal), important dates, the online contest schedule, the contest environment (compilers, editors, IDEs), qualification criteria, a table of university slots, registration and payment, local information, and the organising committees. One page lists 1,744 accepted teams with ID, name and institution. A one-page poster and a one-page PDF schedule of events (6 to 8 October 2022) are included.

    Our copy holds 150 files. 43 of its HTML and PHP pages hold only a "One moment, please" bot-check message, among them the seed address and, under the 2021 path, the accepted teams, selected teams, leaderboard, accommodation and travel grant pages. No results table or problem statements are in our copy.
