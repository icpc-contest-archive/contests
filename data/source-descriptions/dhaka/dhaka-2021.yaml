    Final standings of the contest: 161 teams with rank, team, institution, problems solved, time and a citation. The first ten places are named First Place to Tenth Place; the other citations are Divisional Champion (6 teams), High Honors (7) and Honorable Mention (138). First place is DU_NotStrongEnough of the University of Dhaka with 10 solved and a time of 1411. No per-problem results.
