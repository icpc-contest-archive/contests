  description: |-
    Final scoreboard from CodeMarshal for the contest, headed "The standings is now finalized": 165 teams, 11 problems A to K. Each row gives rank, team name with institution in brackets, number solved and time, and for each problem the number of tries with the time in parentheses where it was solved. A row under the column heads gives a pair of numbers per problem, for example 12/30. Two teams listed under the institution "IOI" are ranked among the others without any mark. The first place is DU_NotStrongEnough of the University of Dhaka with 10 solved. Our copy has its style sheets and scripts beside the page.
