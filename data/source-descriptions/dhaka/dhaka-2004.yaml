  description: |-
    Standings page of The 2004 ACM Asia Programming Contest - Dhaka sponsored by IBM with three tables. The Final Round table, dated 10/8/2004, lists 95 teams as institution and team name with citation: 64 teams carry a rank and place name with problems solved and time, and 31 are listed as Honorable Mention without a score. Fudan University's Fudan U Aladdin is first with 6 problems and 735, ahead of BUET Explorer (5, 735).

    Two further tables are headed Preliminary Site: Asia-Dhaka-Nationwide Preliminaries, with 91 teams, and Preliminary Site: Asia-Dhaka-Foreign Teams, with 4 teams. They repeat the final-round ranks and scores for those subsets. No per-problem detail.
