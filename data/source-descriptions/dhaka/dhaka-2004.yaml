  title: ACM-ICPC 2004 Dhaka Site Event Sponsored by IBM Hosted by North South University 7-8 October 2004 Report
  language:
  - en
  contest_date: '2004-10-08'
  pages: 1
  description: |-
    Report of one page on the ACM-ICPC 2004 Dhaka Site Event, sponsored by IBM and hosted by North South University, 7-8 October 2004. It says that 148 teams registered online and 96, including 4 foreign teams, were accepted and all advanced to the final round instead of holding an internet preliminary; that a practice session on 7 October had 92 teams; and that the final round on 8 October started at 8:20 AM with all 96 teams present.

    It names the top four of the final standing: Fudan University (6 of 8 problems), Bangladesh University of Engineering & Technology (5), the National University of Singapore (4) and a team from North South University (2). It also describes the refreshments, lunch and the awards ceremony in the evening at a Dhaka hotel, where prizes went to the top 13 teams by institution ranking, followed by a cultural programme and dinner. No full results.
