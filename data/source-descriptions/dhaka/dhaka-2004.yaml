    Category page of the Online Judge website, under Browse Problems, in the path ACM-ICPC Dhaka Site Regional Contests, 2004 - Dhaka. It lists eight problems numbered 12060 to 12067: All Integer Average, Overlaying Maps, Reverse Assignment, Zeros and Ones, Count the Points Inside, Permutation Primes, The Fairy Tale of ICPC and Guinea Rats. For each it shows total submissions and solving percentage, and total users and solving percentage. The page also carries the site's login form, menu and sponsor list; the statements are on linked pages that are not part of this copy.
