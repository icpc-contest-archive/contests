  language:
  - en
  description: |-
    Website of the ACM-ICPC Asia Regional Dhaka Site, hosted by North South University, in English. The front page is headed The 2008 ACM International Collegiate Programming Contest - Dhaka, Bangladesh, with a statement of the ICPC mission, Therap (BD) Ltd. as event partner, and links to the 2008 site report, the 2008 final standing and the 2008 problem set, all PDF files that are in our copy.

    Below the 2008 links the page repeats the same set of links (report, final standing, problem set, pictures) for the 2006, 2005 and 2004 events, but the final standing links of those years lead to the ICPC site outside our copy and the pictures links go nowhere; our copy holds the 2006 report as a PDF, the 2005 and 2004 reports as pages, and a problem-set PDF for each of 2006, 2005 and 2004. There is no section for 2007. The problem-set PDFs for 2005 and 2006 are cut short in our copy and do not open. Our copy holds 14 pages, among them a results frame page that shows a scoreboard of the 2011 Dhaka Regional (A to J, produced by PC^2) and a frame reading Rank list has been frozen.
