  pages: 2
  description: |-
    Report by North South University on the 2008 ACM-ICPC Asia Regional Dhaka Site Event, a two-page PDF in English dated 7-8 November 2008. It says the Final Round was held on Saturday 8 November 2008 at North South University with 83 teams from 32 universities, one of them from China, after a practice session on 7 November, and that no Preliminary Round was held. It gives the contest hours, notes that the PC^2 software hung briefly, and describes the opening and award ceremonies.

    It names the three top teams: Fudan University first with 9 of 10 problems, then two teams from the Bangladesh University of Engineering and Technology with 6 and 5 problems. Prizes went to the top 17 teams by university ranking. It has no results table.
