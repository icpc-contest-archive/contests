  description: |-
    Standings in a three-page PDF: 83 teams, each with rank, institution, team name, number of problems solved and total time. 72 teams with at least one problem solved carry a rank, ties sharing a rank, and the 11 teams with 0 solved are listed at the end without rank. Fudan University (HyperHexagon) is first with 9 problems and 1283 minutes. The list has no heading, no per-problem columns and does not name the contest.
