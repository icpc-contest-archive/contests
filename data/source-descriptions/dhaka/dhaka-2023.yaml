  contest_date: '2023-11-04'
  description: |-
    Website of the ICPC Asia Dhaka Regional Contest 2023, hosted by Bangladesh University of Business and Technology (BUBT), in English. The home page gives the last date of payment for onsite contest registration (22 October 2023) and the figures 135 institutions, 2877 registrations and 2461 acceptances, with a menu to contest rules, important dates, qualification criteria, registration and payment, team lists, confirmation letters, local information, committees, accommodation and travel grants. The onsite rules name bapsoj as the judging system.

    Four pages are tables with team ID, team name and institution: selected teams (225), accepted teams of the online preliminary contest (2461, with a vote link per team) and, with date and status, a payment-confirmed list (1355) and an onsite payment list (216). Several individual team pages are vote pages showing the top five teams. A one-page PDF poster gives the preliminary contest on 30 September 2023, the mock contest on 3 November and the onsite contest on 4 November 2023.

    Our copy holds 150 files. 64 of its HTML and PHP pages hold only a "One moment, please" bot-check message, among them the standing, schedule, gallery and onsite teams pages. Nine pages belong to the 2025 edition of the site, and one page is addressed to participants of 2021. No results table or problem statements are in our copy.
