    Contest dashboard on the BAPS judge for "ICPC Dhaka Regional Site 2023 hosted by BUBT", marked as finished. It lists ten problems by letter and name, A Gona Guni to K Strategies in Sequential Games; there is no problem G. Eight of the problems carry a number beside a people icon, without a heading; A and H have none.

    The page gives only the names: the statements, standings and clarifications are on other pages of the judge and are not part of our copy. A disclaimer states that BAPS owns the rights to the problems and the platform.
