  description: |-
    Standings of the online Preliminary Contest of the 2025 edition, from the host's website: 1717 teams from 135 institutions with rank, team name, institution, solved and penalty. The first three rows carry gold, silver and bronze medal marks and places 4 to 10 are highlighted; a legend explains this. The page also states the champion, BUET_Silver_hawks with 6 solved, and offers a CSV download of the full list, which is not part of our copy. These are the results of the preliminary round that selected the teams for the onsite contest, not of the onsite contest itself.
