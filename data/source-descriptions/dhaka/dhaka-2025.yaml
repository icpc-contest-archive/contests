  title: International Collegiate Programming Contest 2025 Asia Dhaka Regional
  language:
  - en
  problems: 10
  pages: 19
  description: |-
    Problem set of the contest: a PDF of 19 pages in English. The cover names Bangladesh University of Business & Technology (BUBT) as host, has Sponsored by and Supported by sections, and states "You get 10 problems, 18 pages and 300 minutes." Ten problems A to J follow: Mission Hexa, Boulevard of Broken Cars, Gas Reservoir, Save the Wonderland, Love Marriage, Morning Walk, Nonogram, Optimal Balancing Strategy, Two Strings Attached and C-Style String Length. Each has a statement with input and output format and a sample input and output; eight of the ten end with a Note section. No test data or solutions.
