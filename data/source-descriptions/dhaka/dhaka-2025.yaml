  language:
  - en
  teams: 309
  description: |-
    Final standings of the contest: 309 teams with rank, team, institution, problems solved, time and three more columns headed Medal, Citation and Site citation. Ranks run to 311; ranks 294 and 307 are not used. The Medal column names First Place to Tenth Place for the first ten, then Divisional Champion (3 teams), High Honors (10) and Honorable Mention (286). The Citation column holds a line such as "Rank 1" with the team and institution, and Site citation reads "ICPC Asia Dhaka Regional Onsite Contest" in every row. First place is BUET_Silver_hawks of Bangladesh University of Engineering and Technology with 7 solved. No per-problem results.
