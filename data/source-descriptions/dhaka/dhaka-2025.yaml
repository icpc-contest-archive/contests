  description: |-
    Codeforces gym page for the replay contest of the onsite round, marked Finished. It lists problems A to J with the names of the problem set, time limits from 1 to 10 seconds, a 1024 MB memory limit, and a count such as x58 beside each. Links to contest materials are given: an announcement, the statements as a PDF and a tutorial, all in English. The page also shows forms for questions and announcements. The statements and the tutorial are on other addresses and are not part of our copy.
