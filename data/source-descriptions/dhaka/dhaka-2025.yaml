- url: http://icpc.bubt.edu.bd
  read: '2026-11-16'
  rubric: 1
  copy: dhaka/dhaka-2025/website/2026-09-05-live-1b83995f
  title: ICPC BUBT - Home - ICPC Asia Dhaka Regional Contest 2025
  language:
  - en
  contest_date: '2025-12-20'
  description: |-
    Website of the ICPC Asia Dhaka Regional Contest 2025, hosted by Bangladesh University of Business and Technology (BUBT), in English. The home page gives the timeline: registration opens 1 October 2025, preliminary mock contest on 14 November, preliminary contest on 15 November, onsite mock contest on 19 December and onsite contest on 20 December. It links to about, host university, previous events gallery, sponsors, director's report, contest rules, schedule, contest environment, slot distribution rules, quota allocation (a table of 134 institutions), preliminary standings, onsite selected teams, problem set, payment forms, team lists, travel grant application and list, confirmation letters, resources and a team vote with a leaderboard. The schedule page covers 19 and 20 December 2025: registration, opening ceremony and mock contest on the first day, the contest from 08:30 to 13:30 and the closing ceremony on the second. The problem set page embeds the 19-page problem set PDF, which is in our copy; the director's report page embeds a PDF that is not.

    Our copy holds 150 files: 52 distinct HTML or PHP pages (the others are repeat copies of the same pages at other addresses), one PDF and images. Counters on the home page read "0+" and its countdown timers read zero. Links to icpc.global, Codeforces and other sites lead outside our copy.
