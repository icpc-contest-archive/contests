  description: |-
    Page of the Online Judge (onlinejudge.org) listing the category ACM-ICPC Dhaka Site Regional Contests, 2009 - Dhaka: eleven problems numbered 12207 to 12217, from That is Your Queue to Integer Game. For each problem it shows the title, total submissions with solving percentage, and total users with solving percentage, and each title links to a problem page on the judge. The problems carry judge numbers, not contest letters.

    The page also holds the judge's menu, login box and sponsor list; the statements themselves are not on this page.
