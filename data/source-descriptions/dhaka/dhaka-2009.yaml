  description: |-
    Final standings of the 2009 ACM-ICPC Asia Dhaka Regional Contest: 89 teams with rank, team name, institution, number of problems solved, total time and citation. The first 19 teams carry citations from 1st Position to 10th Position and the other 70 are marked Honorable Mention; ranks run to 79, shared by the 11 teams with 0 solved. HappyHeaven of Fudan University is first with 7 problems and 1007 minutes. No per-problem results.
