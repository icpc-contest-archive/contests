  description: |-
    Website of the ACM-ICPC Asia Regional Dhaka Site, hosted by North South University, in English. The front page is headed The 2009 ACM International Collegiate Programming Contest - Dhaka, Bangladesh, with a statement of the ICPC mission and Therap (BD) Ltd. as event partner. Its three 2009 links (site report, final standing, problem set) all lead to a one-page PDF that reads Document not available yet, so our copy holds no 2009 results or problems.

    Below them the page repeats the report, final standing, problem set and pictures links for the 2008, 2006, 2005 and 2004 events. Our copy holds 15 pages: the 2008 report, final standing and problem set, the 2006 report, the 2005 and 2004 reports as pages, problem-set PDFs for 2006, 2005 and 2004 (21, 18 and 15 pages), and a results frame page with a scoreboard of the 2011 Dhaka Regional. The final standing links for 2006, 2005 and 2004 lead to the ICPC site outside our copy, and the pictures links go nowhere. There is no section for 2007.
