    Problem statement of 3288, Harmonic Mean, as a two-page PDF in English with the line "Asia - Dhaka - 2005/2006" under the title. The task is to read S sets of N integers (0 < N < 9) and print their harmonic mean as a fraction m/n in lowest terms. It has the input and output format and a sample of two sets with its output, and ends with a line "Dhaka 2005-2006", the problemsetter's name and a special-thanks line. The harmonic mean formulas are drawn as images in the PDF, so its text layer holds only fragments of them.
