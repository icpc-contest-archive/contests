    Category page of the Online Judge website, under Browse Problems, in the path ACM-ICPC Dhaka Site Regional Contests, 2005 - Dhaka. It lists eight problems numbered 12068 to 12075: Harmonic Mean, Robots inside the Labyrinth, Invite Your Friends, Understanding Recursion, Matrissor, Altitude Triangle, The Ultimate Bamboo Eater and Counting Triangles. For each it shows total submissions and solving percentage, and total users and solving percentage. The page also carries the site's login form, menu and sponsor list; the statements are on linked pages that are not part of this copy.
