    Problem statement of 3289, Robots inside the Labyrinth, as a two-page PDF in English with the line "Asia - Dhaka - 2005/2006" under the title. A robot moves horizontally or vertically around non-overlapping rectangular blocks in an infinite labyrinth, and for each query the task is to give the minimum number of turns, or print "Impossible." when the destination cannot be reached. It includes a figure, the input and output format, and a sample with two tests, and ends with "Dhaka 2005-2006", the problemsetter's name and a special-thanks line.
