  description: |-
    Standings page of The 2005 ACM Asia Programming Contest - Dhaka sponsored by IBM with three tables. The Final Round table, dated 9/23/2005, lists 84 teams as institution and team name with citation, problems solved and time. Teams are ranked with place names from First Place down, and 12 teams with 0 solved are listed as Honorable Mention. Fudan University's Fudan Abacus is first with 6 problems and 668.

    Two further tables list teams without rank or score: Preliminary Site: Asia Preliminary Dhaka Nationwide Internet Contest Site with 82 teams, and Preliminary Site: Asia-Foreign Team Dhaka Registration Site with 2 teams, all as Honorable Mention. No per-problem detail.
