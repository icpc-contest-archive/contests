  title: Asia Regional Dhaka Site Event North South University 22-23 September 2005 Report
  language:
  - en
  contest_date: '2005-09-23'
  description: |-
    Report page on the ACM-ICPC 2005 Asia Regional Dhaka Site Event, held at North South University, 22-23 September 2005. It states that the final round took place on Friday 23 September with 85 teams, including teams from China and Malaysia, after a practice session on 22 September; that all 85 registered teams advanced because no preliminary round was held; and that the final round ran from 8:10 AM to 12:40 PM.

    It names Fudan University as champion with 6 of a maximum of 8 problems, Dhaka University Gryffindor as first runner-up and BUET as second runner-up with 4 problems each, and says a North South University team was tenth in the university ranking. It also describes lunch, the awards ceremony at a Dhaka hotel, where prizes went to the top 16 teams by university ranking, and the cultural programme and dinner. Our copy holds this page and the Word file of the same report that it links; the site's other pages are not in it.
