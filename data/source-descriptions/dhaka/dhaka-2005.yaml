    Problem statement of 3291, Understanding Recursion, as a two-page PDF in English with the line "Asia - Dhaka - 2005/2006" under the title. It prints a short recursive C program that reads up to 40000 integers, and the task is to give the output that program would produce for each input set (up to 10 sets per file). It has the input and output format and a sample with two cases, and ends with "Dhaka 2005-2006", the problemsetter's name and a special-thanks line.
