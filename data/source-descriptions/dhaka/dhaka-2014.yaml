  pages: 56
  description: |-
    Website of the 2014 ACM-ICPC Asia Regional Dhaka Site, made by Bangladesh University of Business and Technology (BUBT) as host, sponsored by IBM, in English. Our copy holds 56 pages of the 2014 site: rules for the online and on-site contests, judges, important dates (online contest on 8 November 2014, on-site contest on 6 December 2014), schedules, contest environment, registration, payment and travel information, host university and Dhaka pages, the organising committee and sub-committees, a volunteer list, and a gallery page that only names its photo sets.

    The pages for the problem set, the scoreboard and the director's report hold headings and links only. The problem set page links four PDFs: the on-site and the preliminary problem sets, each with an analysis; the report page links an on-site director's report PDF; the scoreboard page links a preliminary scoreboard on another server. None of these files is in our copy. Five pages (preliminary and on-site standings, team roster, final slot, search) hold only the site menu. Other addresses of the site return the home page of the 2025 edition of the site, and are not counted as pages.
