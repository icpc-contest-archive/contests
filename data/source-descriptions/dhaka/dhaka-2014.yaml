    Online Judge category page "ACM-ICPC Dhaka Site Regional Contests :: 2014 - Dhaka", a list of ten problems numbered 12897 to 12906: Decoding Baby Boos, And Or, A game for kids, Flood in Gridland, Refraction, Reverse Polish Notation, Just Some Permutations, Load Balancing, Volume of Revolution and Maximum Score. For each it gives total submissions with solving percentage and total users with solving percentage. The titles link to the statements, which are not part of our copy.

