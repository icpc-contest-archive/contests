    Scoreboard of the contest on CodeMarshal, marked "Finished": 135 rows ranked 1 to 135, each with the number solved and penalty time and a cell for each of the ten problems A to J giving the number of attempts and, for solved problems, the time in parentheses. 134 of the rows have an institution abbreviation in brackets before the team name. An unlabeled row under the header gives two counts for each problem (for example 66/127 for A). The first place is SUST_DownToTheWire with 7 solved. One row, IOI Team (Unofficial), is marked unofficial and sits at rank 8, between ranks 7 and 9.

    A note above the table says a few teams were penalized for unfair behaviour during the contest and links a file of the final official ranklist, which is not part of our copy.
