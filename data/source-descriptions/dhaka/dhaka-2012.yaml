  contest_date: '2012-12-08'
  pages: 16
  description: |-
    Website of the 2012 ACM-ICPC Dhaka Regional Contest, made by Daffodil International University as host, in English. Our copy holds 16 pages: the home page, committee and executive committee pages, contest information, a gallery page that lists team names, a contact page, two news pages (detail program, and kit collection with the mock contest on Friday 7 December and the contest day on Saturday 8 December 2012 at the Radisson Blu Water Garden Hotel), and eight PDFs.

    The PDFs are the detail program, a list of the qualified teams, the team registration form and contacts, dos and don'ts, the contest environment, the ICPC regional rules for 2011 and the ICPC World Finals 2013 rules. The home page links a final rank list, the problem set, a director's report and preliminary round documents (problem set, rank list, report); the problem set, director's report and preliminary round documents are not part of our copy. It also links the ICPC public standings, which is another server.
