    Online Judge category page "ACM-ICPC Dhaka Site Regional Contests :: 2012 - Dhaka", a list of eleven problems numbered 12581 to 12591: Divisibility, Wedding of Sultan, Memory Overflow, Laptop Chargers, Poker End Games, Overlapping Characters, Reduce the Maintenance Cost, Team Mathematics Olympiad, Learning Vector, Guards II and Beauty of Regular Polyhedron. For each it gives total submissions with solving percentage and total users with solving percentage. The titles link to the statements, which are not part of our copy.

