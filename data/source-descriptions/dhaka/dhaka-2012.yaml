    Standings of the 2012 ACM-ICPC Asia Dhaka Regional Contest: 150 teams with rank (29 share rank 121), institution, number of problems solved and penalty time. Four teams carry gold medals, five silver and five bronze. Each team has a place citation (First Place, Second Place and so on, Honorable Mention for the lower teams), and the winner, Mithril of Shanghai Jiao Tong University, also has a site citation naming it champion of the on-site regional contest. No per-problem results.
