    Final standings of the 2006 ACM Asia Programming Contest - Dhaka, sponsored by IBM, in the ICPC site's View Standings layout. The Final Round (on-site regional contest, 9/23/2006) lists 98 teams with rank, institution and team name, citation (First Place, Second Place and so on), number of problems solved and total time. Fudan University is first with 8 problems; ranks run to sixtieth place, shared by teams with 0 solved, and tied teams share a rank. No per-problem results.

    Three further tables follow: the Preliminary Round Internet Contest of 9/16/2006 with 97 teams, all marked Honorable Mention and without rank, the Foreign Teams Registration list of 9/23/2006 with one team, and an empty table for the EWU Inter-university Programming Contest of 7/29/2006.
