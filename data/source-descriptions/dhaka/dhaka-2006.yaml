  description: |-
    Report by North South University on the 2006 ACM-ICPC Asia Regional Dhaka Site Event, a single PDF page in English headed 22-23 September 2006. It states that 98 teams, one of them from China, took part in the Final Round on Saturday 23 September 2006, after a practice session and an opening ceremony on 22 September, and that the Preliminary Round was not held because registration exceeded the proposed limit.

    It names the three top teams (Fudan University with 8 of a maximum of 10 problems, then teams from BUET and North South University), and describes the award ceremony, a rank correction made afterwards, and an appeal to the ICPC Appeals Committee that reduced one team's penalty time by 47 minutes and led to a joint third place. It has no results table.
