  description: |-
    Home page of the Asia Regional 2002 Dhaka site, held at the Department of Computer Science and Engineering, Bangladesh University of Engineering and Technology, Dhaka. It gives the dates as November 27 and 28, 2002, the registration cost ($50 for foreign teams, Tk. 2500 for local teams), the languages and compilers offered (Turbo C, Borland C, Visual C, Turbo Pascal, Java), the contest software (PC^2 version 6.33), and a line that judging follows ACM competition guidelines. The status line reads "Contest is Over".

    A menu links to registration, registration statistics, the Asian contest rules, past contests, other contests in Bangladesh, the steering committee, the schedule, the final standings, detailed results, the contest problem set, the judge's data sets and contest pictures. Our copy holds this one page only; the linked pages are not part of it, and the banner and photographs are not in it either.
