    Final scoreboard of the ACM ICPC Dhaka Regional 2007 on a page of East West University, produced by CSUS PC^2 8.7 and last updated Sat Dec 08 16:56:25 2007. It lists 87 teams with rank, team name, problems solved, penalty time and, for problems A to J, attempts and the minute of the accepted run (for example 1/7, or 0/-- when not tried), plus a total of attempts and solved per team. A last row gives submissions, first yes and total yes per problem. BUET Sprinter is first with 7 problems; ranks run to 70, shared by 18 teams with 0 solved. There is no institution column; many team names begin with an institution abbreviation.

    The page header links to Selected Teams and Contest Programme, two PDF files that are not part of this page.
