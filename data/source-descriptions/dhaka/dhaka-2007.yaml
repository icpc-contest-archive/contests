  description: |-
    Standings of the 2007 ACM Asia Programming Contest - Dhaka, sponsored by IBM, in the ICPC site's View Standings layout. The main table, headed Preliminary Site: ACM ICPC Regional Contest Site 2007 - 11/11/2007, has 86 teams with rank, institution and team name, citation, solved and time: 45 ranked teams with places First to Twenty Second (ranks 1 to 22, with ties), then 41 unranked teams marked Honorable Mention. BUET Sprinter is first with 7 problems.

    A Final Round table (On Site Regional Contest, 11/11/2007) holds one team. Two more tables list other contests of the preliminary site as Honorable Mention lists without results: the NSU Computer Programming Contest 2007 (11/9/2007, 5 teams) and the Second Daffodil Inter-University Dhaka Contest (7/20/2007, 62 teams). No per-problem results.
