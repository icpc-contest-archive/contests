    Page of the Online Judge (onlinejudge.org) listing the category ACM-ICPC Dhaka Site Regional Contests, 2007 - Dhaka: ten problems numbered 12114 to 12123, from Bachelor Arithmetic to Magnetic Train Tracks. For each problem it shows the title, total submissions with solving percentage, and total users with solving percentage, and each title links to a problem page on the judge. The problems carry judge numbers, not contest letters.

