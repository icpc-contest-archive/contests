  description: |-
    Scoreboard of the Dhaka site, headed 'Last Update: 11-10-2001 13:35:48' with a note that this is the last update and the final result will be declared at the closing ceremony. It lists teams by rank with one column for each of the 8 problems, A to H, plus total solved and penalty. A solved or attempted cell reads attempts and Y or N (for example 1/Y or 4/N); unattempted cells read 0. There are no solve times per problem and no institution column.

    The table has 72 rows below the header: 70 named teams, one row with no team name and only zeros, and a last row labelled Summury that gives one number for each problem. Ranks run from 1 to 41 with two ties; the 27 named teams with 0 solved, the unnamed row and the Summury row all carry rank 42. BUET Ackermanns is first with 6 solved and 773 penalty. A few cells read only a number and a slash, for example 18/.
