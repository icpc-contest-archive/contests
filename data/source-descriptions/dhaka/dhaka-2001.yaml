- url: http://www.buet.ac.bd/acm/
  read: '2026-11-16'
  rubric: 1
  copy: dhaka/dhaka-2001/website/2026-10-20-wayback-225d3e59
  title: Home
  language:
  - en
  description: |-
    Website of the 2001 ACM ICPC Asia Regional Contest held in Bangladesh at the Bangladesh University of Engineering and Technology (BUET) in Dhaka, sponsored by IBM, in English. The home page announces the two Bangladeshi teams invited to the World Finals in Hawaii in March 2002, describes the contest, the venue and the registration rules, and lists important dates from the application deadline of 31 August to the contest on 9 and 10 November 2001. Its last-modified date is 10 November 2001.

    Other pages cover the steering committee and organizers, rules, registration, host information, a contest progress page with photographs, a short report on the contest, the final standings by university and a ranking page. The ranking page is a PC² scoreboard from the last update on the contest day, with tries and a solved flag for each of the eight problems A to H. The problem pages A to H hold the statements, for example Problem A, A Benevolent Josephus.

    Our copy is a crawl of 136 addresses, with 54 files saved, 30 of them pages, taken from the Internet Archive as of September 2002. It also contains unrelated pages of the university site, such as admission notices from 2014 and 2015.
