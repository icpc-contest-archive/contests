  description: |-
    Website of the 2001 ACM International Collegiate Programming Contest Asia Regional Contest held in Dhaka, Bangladesh, on 9 and 10 November 2001, hosted by Bangladesh University of Engineering and Technology (BUET) and sponsored by IBM, in English. The home page announces the two teams invited to the World Finals in Hawaii and links to the rest of the site: steering and organising committees, rules (general and specific to this contest), registration, the venue, an information page with programming languages, operating systems and the schedule of 8 to 10 November, a contest progress page with photograph captions, a team ranking page, a university ranking page, a report, and the problem set.

    The team ranking is a scoreboard of 8 problems, A to H. The report states that 70 teams took part, two of them from China and India, and describes the best teams. The problem set has an index page and one statement page for each of the problems A to H, in English; some of them use images.

    Our copy holds 54 saved files from 136 addresses fetched; 22 distinct pages belong to the contest site, and the rest are unrelated files from other parts of the BUET site (admission notices as PDFs and a root-level page). The 18 photographs on the contest progress page are not saved in our copy.
