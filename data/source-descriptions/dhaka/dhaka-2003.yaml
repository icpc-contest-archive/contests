  contest_date: '2003-11-13'
  problems: 10
  description: |-
    Website of the Dhaka site contest of the ACM ICPC Asia Region, made by the Department of CSE of BUET, in English. The seed page is the Regional Contest Director's report on the 2003 contest: five hours on 13 November, over 163 teams registered online, 77 teams accepted, ten problems, 27 teams with at least one solution, the number of teams that solved each of problems A to J, the champion and runner-up, and a prize ceremony. It links to a one-page PDF version of the report, which is in our copy.

    The acmicpc section of the crawl also holds the contest information page (dates 12 to 13 November 2003, venue, fees, PC^2 judging software, 75 participating teams), a ranking page of 75 teams with total solved, penalty and rank, a university ranking page in which 27 teams carry a rank and the others are marked Honorable Mention, a problem set page with PDF and zip links, a page linking rankings of the contests of 1997, 1998, 1999, 2001 and 2002, a steering committee page, and a picture index page.

    Our copy holds 91 pages and documents, most of them other parts of the BUET website that were reached through links. The problem set PDF and zip, the registered-teams page and the two picture pages linked from the picture index are not in the crawl.
