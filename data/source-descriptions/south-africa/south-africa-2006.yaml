  description: |-
    Report by the Regional Contest Director on the eighth ACM contest in the South African region, held on 14 October 2006 with 49 entries at four sites: Cape Town, Grahamstown, Pietermaritzburg and Pretoria. It names the host university of each site and describes the contest as five hours long. A table lists the top three teams at each site (12 teams) with problems solved and overall place (for nine of them: First to Tenth, with no eighth) and site place. A second table gives for each of the six problems, A to F with their colour names, the judges' rating from 1 to 5, the number of teams that attempted it, submissions and correct solutions. The text continues with thanks to organisers and volunteers and an invitation to send comments on the contest software, Abacus, to the Regional Contest Director.
