  times: true
  tries: false
  description: |-
    Standings page of the South African regional contest with two parts. The first, headed Final Standings, lists 51 teams with university, team name, total solved, placement and time; the placement column is filled only for places 1 to 5, and 23 teams show 0 solved. Teams from the Universities of Cape Town, Stellenbosch, South Africa, Pretoria, the Witwatersrand and Port Elizabeth and from Rhodes University are listed.

    The second part, headed "Standings as the contest was progressing" with the note that it was not updated for about the last hour, has a short table for the top five teams and per-site grids for Cape Town, Grahamstown and Pretoria. The grids cover 50 teams and mark each solved problem 1 to 6 with the word "correct"; the six columns carry balloon colours (pink, yellow, green, purple, blue, red). They give no attempts and no times. The stylesheet is kept in our copy.
