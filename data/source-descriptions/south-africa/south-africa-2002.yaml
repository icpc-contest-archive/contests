  contest_date: '2002-10-05'
  description: |-
    Frameset website of the 2002 ACM South Africa Programming Contest, sponsored by IBM and hosted by the Department of Computer Science, University of Pretoria, in English. Our copy holds 4 small pages: the frameset page, a header frame, a menu frame and the Home page. The Home page names the sponsor and host, lists Cape Town (University of Cape Town) and Eastern Cape (Rhodes University) as additional locations and gives the date of the contest as 5 October 2002.

    The menu links to Background, Registration, Locations, Local Contest Rules, Schedule, Report, Problem Set, Standings and Picture Gallery, and to the current contest; none of those pages is in our copy. The header image and the style sheet are not in our copy either.
