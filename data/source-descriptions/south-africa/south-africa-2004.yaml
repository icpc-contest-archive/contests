    Standings page titled View Standings for the 2004 ACM South Africa Programming Contest sponsored by IBM: 32 teams with rank, university and team name and a citation. The 14 ranked teams (First to Fourteenth Place) also show number solved and time; the top three each solved 4 problems. The other 18 teams are listed without a rank, solved count or time under Honorable Mention. Teams come from the Universities of Cape Town (12), Pretoria (6), the Witwatersrand (6), Stellenbosch (3) and Port Elizabeth (1) and from Rhodes University (4). No per-problem results or attempts.
