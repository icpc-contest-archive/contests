  description: |-
    Problem Set page, in English. It says the problem set will comprise at least 6 problems, that teams are given 5 hours, and that the problems are made available during the contest in zip and pdf formats. It lists six problems A to F, each named with a balloon colour, with a PDF link and a zipped link: A Red Supercluster, B Blue BookShelf, C Purple Wisdom, D Yellow TheCableGuy, E White Powers and F Green RenderingFractalImages.

