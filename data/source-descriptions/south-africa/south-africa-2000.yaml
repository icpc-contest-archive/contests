  title: Report on The 2000 ACM Southern Africa Programming Contest
  language:
  - en
  contest_date: '2000-09-16'
  teams: 6
  problems: 6
  pages: 13
  description: |-
    PDF of 13 pages in two parts. The first page is the organisers' report on the 2000 ACM Southern Africa Programming Contest, sponsored by IBM and hosted by the University of Pretoria, held on Saturday 16 September 2000 at three locations: Pretoria, Grahamstown and Cape Town. It says 50 teams from 5 universities took part and that the contest was ended one hour early at all three sites because of a power failure at the Cape Town site, the standings at that time being final. A table gives the top 6 teams with university, problems solved (4 for the first two, then 3, 3, 3, 2) and total time including penalties; it lists the six problems by title and ends with acknowledgements of helpers and sponsors.

    The other 12 pages are the six problem statements, numbered 1 to 6 and each also named by a balloon colour, after a header for the second Southern African regional programming competition. Each statement has input and output descriptions and one sample input with its output. No solutions or test data.
