  description: |-
    Regional contest information page from the ACM International Collegiate Programming Contest site, for the 2000 ACM South Africa Programming Contest sponsored by IBM, hosted by the Department of Computer Science, University of Pretoria, with the date given as Sep 16, 2000. A short text says the contest drew students from colleges and universities throughout southern Africa and that winners selected from regional contests on six continents advanced to the World Finals in Vancouver.

    Our copy holds 4 pages: the seed page, the team roster (65 teams, listed by site), the standings (5 placed teams and 60 honorable mentions) and Problems.pdf, a 13-page PDF with the organisers' report and the six problem statements. The link to the regional contest's own home page leads to another server and is not part of this copy.
