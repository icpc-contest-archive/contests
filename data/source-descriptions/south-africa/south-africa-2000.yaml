  title: The 2000 ACM South Africa Programming Contest
  language:
  - en
  contest_date: '2000-09-16'
  description: |-
    Home page of the 2000 ACM South Africa Programming Contest sponsored by IBM, hosted by the University of Pretoria with additional locations at Rhodes University and the University of Cape Town still to be confirmed. It gives the contest date as Saturday, 16 September 2000 and an early registration deadline of 31 August 2000, and is the invitation to the second South African regional contest for teams from Southern Africa.

    The single page lists the countries of the region, registration through the international contest's system, software provided by IBM to registered teams, the three locations, no contest fees, and local rules: a five-hour contest, at least six problems, several teams per university allowed, and the languages C, C++, Java and Delphi. It is a pre-contest announcement; it holds no results or problems. Our copy is this one page.
