    Category page of the ICPC Live Archive judge for the 2003 Africa/Middle East regional in South Africa, as it stood on 18 January 2021. It lists six problems numbered 2748 to 2753: Cannon Fodder, Power distribution, Fibonacci codes, FSK Demodulation, No-key Encryption and The Answer. For each it gives total submissions and solving percentage, and total users and solving percentage. Names only: no statements. The page also carries the archive's menu and login form.
