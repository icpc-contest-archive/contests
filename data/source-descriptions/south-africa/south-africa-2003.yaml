  description: |-
    Problem set as a PDF of 14 pages in English, headed 5th Southern Africa Regional ACM International Collegiate Programming Contest with a Sponsored by line at the top of each problem. Six problems follow, each starting on its own page and identified by name and balloon colour: Cannon Fodder (red), Power distribution (yellow), Fibonacci codes (blue), FSK Demodulation (pink), No-key Encryption (green) and The Answer (white). Each has a statement with a sample input and sample output. There is no cover page naming a date or place, and no test data or solutions.
