  description: |-
    Website of the 2003 ACM South Africa Programming Contest, hosted by the Department of Computer Science of the University of Pretoria and sponsored by IBM, in English. It is a frameset of a header image, a menu and a content frame. The home page gives the contest date as 18 October 2003 and lists additional locations as to be confirmed. The menu offers Background, Registration, Locations, Local Contest Rules, Schedule, Report, Problem Set, Standings, Picture Gallery and a link to the current contest.

    Our copy holds only 4 pages: the frameset, the header, the menu and the home page. None of the pages behind the menu entries is in our copy, and the header image and style sheet are missing.
