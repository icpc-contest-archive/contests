  - en
  contest_date: '2019-10-27'
  pages: 1
  description: |-
    Single page of the South African regional website, headed South Africa 2019, announcing the 21st South African ACM ICPC regional for 27 October 2019. It gives the region's local rules: a baccalaureate degree is taken to be a four-year Honours degree, teams come from a single university with a coach, the contest lasts five hours with at least six problems, multiple teams per university are allowed, and the languages are C, C++, Java and Python 3 in a Unix (Linux) environment. It lists the software versions installed on the markers.

    The page has a schedule table from registration at 8:30 to the announcement of results at 15:30 (UTC+2), with a mock contest before the main contest, and links to the rules, the Abacus manual, the mock contest problems, the contest problems, the final standings and a documentation page. It ends with a contact line for the Regional Contest Director.

    Our copy holds only this page and its header image. The linked documents are not part of it, and the page gives no team list or results itself.
