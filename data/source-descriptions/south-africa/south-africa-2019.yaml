  problems: 10
  pages: 19
  description: |-
    Problem set: a PDF of 19 pages, headed 21st South African Regional, International Collegiate Programming Contest, 26 October 2019. It holds ten problems, A to J, each marked with a balloon colour (A Silver, B Pink, C Purple, D Yellow, E Red, F Blue, G Green, H Orange, I Black, J Gold).

    Each problem has a statement in English with input and output format, a sample input with its sample output, and resource constraints (time limit and memory limit). Seven of the ten problems carry an attribution line saying they were adapted from ECPC 2019. The problems are Even Segments, Social Networking, Paladin, Fibo and Prime, Palinmorse, PrimeRose, Moriarty's Password, Black Friday, MEXed sums and Delivery. No test data or solutions.
