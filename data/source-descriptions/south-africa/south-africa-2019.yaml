  description: |-
    Standings of the 2019 South Africa Regional Contest: 71 teams from 12 institutions, each with rank, team name, institution, number of problems solved, total time, a citation and a site citation. No per-problem detail.

    The New Order of Bit of the University of Stellenbosch is first with 8 problems solved and a time of 40073, followed by Andalus and CodeX, both of Adama Science and Technology University, with 6 solved each. The top three carry the citations 1st, 2nd and 3rd Overall, and ten teams carry a site citation such as 1st in Ethiopia. Ranks run from 1 to 50: the 22 teams with 0 solved all have rank 50.
