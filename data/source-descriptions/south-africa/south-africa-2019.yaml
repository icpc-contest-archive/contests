  description: |-
    Final scoreboard as a PDF of 2 pages, headed ICPC 2019 South Africa Regional, 26 October 2019, with 71 teams in placement order: 40 on the first page and 31 on the second. Each team has placement, name, country (the site, such as South Africa - Pretoria, Ethiopia or Zambia), number solved and total time, followed by one column for each of the ten problems, which are named by balloon colours (from left to right Silver, Pink, Purple, Yellow, Red, Blue, Green, Orange, Black, Gold).

    Each team has a signed number in every problem column; the PDF has no legend for them and no solve times per problem. The last two columns hold the overall standing, given as 1st, 2nd and 3rd Overall for the top three teams, and the standing within the team's site. The New Order of Bit, from the Cape Town site, is first with 8 problems solved. Teams with no solved problems share placement 50.
