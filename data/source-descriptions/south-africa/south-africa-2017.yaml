    Problem set: a PDF of 18 pages, headed 19th South African Regional ACM Collegiate Programming Contest, Sponsored by IBM, 21 October 2017. It holds eight problems, A to H, each marked with a balloon colour (A Yellow, B Pink, C Green, D Blue, E Purple, F Red, G White, H Orange).

    Each problem has a statement in English with input and output format, a sample input with its sample output, and a time limit. The problems are Alphabetics, Ancient Collider, Equations, Knots of Fun, Long Division, Pizza, Polygons to Circles and Road Trip. No test data or solutions.
