    Standings of the 2018 South Africa Regional Contest: 87 teams from 19 institutions, each with rank, team name, institution, number of problems solved, total time, medal, citation and site citation. No per-problem detail.

    Dysfunctional Programmers of the University of Cape Town are first with 8 problems solved and a time of 51064, followed by Buggs Buggy and Velociti, both of the University of Witwatersrand. These three carry Gold, Silver and Bronze medals and the citations 1st, 2nd and 3rd overall; the other ranked teams carry citations such as Fourth Place. 56 teams have 0 solved, 49 of them sharing rank 33, and the last 7 teams in the table have no rank and no citation.
