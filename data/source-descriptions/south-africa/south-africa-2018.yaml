  description: |-
    Scoreboard as a PDF of 3 pages with 85 teams, one row per team. The columns are ID, team code, team name, group (a site name), contestant, points (problems solved), time, one column for each of the eight problems named by balloon colour (Green, White, Orange, Red, Pink, Blue, Yellow, Purple), overall placement and site placement.

    In the problem columns each team has a signed number: the number of positive entries equals the team's points, and the other entries are zero or negative; the PDF has no legend for them and no solve times per problem. Teams are listed site by site, not by rank: Angola 12, Cape Town 8, Ethiopia 27, Grahamstown 4, Kenya 3, Pietermaritzburg 8 and Pretoria 23 teams. The top three teams carry an overall placement (Dysfunctional Programmers of Cape Town first, with 8 solved), and the best three teams of each site carry a site placement.
