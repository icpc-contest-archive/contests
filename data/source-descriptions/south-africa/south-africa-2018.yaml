  description: |-
    Problem set: a PDF of 20 pages, headed 20th South African Regional, International Collegiate Programming Contest, 20 October 2018. It holds eight problems, A to H, each marked with a balloon colour (A Green, B White, C Orange, D Red, E Pink, F Blue, G Yellow, H Purple).

    Each problem has a statement in English with input and output format, a sample input with its sample output, and a time limit. The problems are Huff and Puff, Recursive Function, fertiliser, Power2 Game, Labyrinth Chess, The Cable Guy, AfriBucks and Segments. No test data or solutions.
