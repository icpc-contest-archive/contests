  - en
  problems: 1
  pages: 3
  description: |-
    Statement of problem 3950, 'Eclipse': given a star and two celestial bodies as spheres in space, decide whether the first body causes a solar eclipse on the second and, if so, whether it is total or partial and whether it covers the entire body or part of it. It has a figure of the umbra and penumbra, input and output sections and a sample with two cases. A PDF of 3 pages in English, with the region line 'Africa and the Middle East - South Africa - 2007/2008' under the title and 'South Africa 2007-2008' at the end.
