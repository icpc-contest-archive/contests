  - en
  contest_date: '2007-10-20'
  problems: 6
  description: |-
    Website of the South African regional contest, in English. For 2007 our copy holds the menu (background, registration, locations, local rules, schedule, report, problem set, final standings, picture gallery), the schedule for 20 October 2007 (registration at 7:30, competition 9:00 to 14:00, venues in Pretoria, Cape Town, Grahamstown and KwaZulu-Natal), the locations page (no contest fee), the local rules (five hours, at least six problems), and the 2007 standings page with 57 teams and six problems A to F named by colour. The 2007 problem set page says only that the problems will be made available after the contest has commenced; the report, final standings and picture gallery named in the menu are not in our copy.

    The site is reused from year to year: of the 149 files saved, most belong to other years or are unrelated. They include the 2006 report, final standings and problem PDFs; the 2008 home page, rules, schedule, standings, problem list and problem PDFs; problem and mock-contest PDFs from 2011 and from 2014 to 2019; rules, Abacus manuals and standings PDFs of later years; and copies of Python, C++ and JDK documentation.
