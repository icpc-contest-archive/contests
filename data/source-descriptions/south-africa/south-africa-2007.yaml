  problems: 1
  pages: 2
  description: |-
    Statement of problem 3951, 'Anagrams': for each record, which has a dictionary of words ended by -1 and a target list ended by -2, print the anagrams of every target word found in the dictionary in lexicographic order, case-insensitively, followed by a blank line. It has input and output sections and a sample with two records. A PDF of 2 pages in English, with the region line 'Africa and the Middle East - South Africa - 2007/2008' under the title and 'South Africa 2007-2008' at the end.
