  problems: 1
  pages: 3
  description: |-
    Statement of problem 3952, 'Rabbit detector': given population sizes, decide whether each fits the rabbit sequence (1, 1, 2, 3, 5, ...), the rat sequence (1, 1, 3, 5, 11, ...) or their sum, and print the matching labels in a fixed order, ignoring values that match none. It has the recurrence definitions, input and output sections and a sample with seven values. A PDF of 3 pages in English, with the region line 'Africa and the Middle East - South Africa - 2007/2008' under the title and 'South Africa 2007-2008' at the end.
