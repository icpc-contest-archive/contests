  description: |-
    Statement of problem 3948, 'Cut me loose': people sit in a circle on tree branches, each sawing through the right-hand neighbour's branch; given the time each person's own branch takes to cut, list who is still in the tree at the end, or 0 if nobody. It has input and output sections and a sample with two scenarios. A PDF of 1 page in English, with the region line 'Africa and the Middle East - South Africa - 2007/2008' under the title and 'South Africa 2007-2008' at the end.
