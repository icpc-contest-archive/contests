  description: |-
    Statement of problem 3949, 'Supply drop': compute the distance from the target at which cargo must be released from an aeroplane so that it falls through a kinetic hoop, using linear drag equations given in the statement; the result is truncated to one decimal. It has a figure, the position and velocity equations, input and output sections and a sample with two records. A PDF of 3 pages in English, with the region line 'Africa and the Middle East - South Africa - 2007/2008' under the title and 'South Africa 2007-2008' at the end.
