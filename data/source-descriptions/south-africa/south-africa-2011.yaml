  description: |-
    Standings of the 2011 South Africa Regional Contest: 60 teams with rank, team name, institution, problems solved and total time. The best team solved 5 problems and 21 teams solved none; no per-problem detail is given. Three teams carry an overall citation (1st to 3rd Overall) and 15 teams a site citation such as 1st Cape Town, 1st Pretoria or 1st Benin, from sites in South Africa, Nigeria and Benin. Ranks run from 1 to 8 with ties sharing a rank. First place is InsaneCodersPesteringComputers.
