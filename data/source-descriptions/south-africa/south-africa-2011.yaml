  description: |-
    Website of the South African ACM ICPC regional, in English. Our copy holds 148 saved files from one host and covers many editions; its seed page is the 2015 front page. The 2011 pages are the front page announcing the contest of 15 October 2011 (sites in Pretoria, Cape Town, Grahamstown and Pietermaritzburg, plus a site in Benin and Nigeria for West African contestants), a rules page with the regional localisations, a schedule page with the venues and the times of the day, a registration page, and a problems page. The standings page only says that the standings will be published after a full audit. The report link has no page behind it, and the rules and Abacus manual PDFs linked from the rules page are not in our copy.

    The problems page lists six contest problems A to F (Lightning, Wormholes, Parallelogram counting, Prime factors, Basis vectors, Base increment) and two mock contest problems (Long division, Greetings). All eight PDFs are headed 13th South African Regional ACM Collegiate Programming Contest, Sponsored by IBM, 15 October 2011; the contest problems run to two or three pages, with sample input and output. Other pages and PDFs in the copy belong to editions from 2001 to 2007 and from 2014 to 2019, together with mirrored Python, C++ and Java documentation.
