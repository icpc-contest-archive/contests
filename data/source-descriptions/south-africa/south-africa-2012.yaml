  description: |-
    Final standings of the 2012 South Africa Regional Contest: 85 teams from 27 institutions, with rank, team name, institution, problems solved, total time, medal, citation and site citation. The best two teams solved 5 problems each and 18 teams solved none; no per-problem detail is given. The first twelve teams carry a gold (four), silver (four) or bronze (four) medal. In the citation column 40 teams carry a place name from First Place to Forty-second Place and the other 45 are listed as Honorable Mention. Six teams carry a site citation naming them champion of a site (Cape Town, Pretoria, Benin, Pietermaritzburg, Grahamstown, Nigeria). First place is InsaneCodersPesteringComputers.
