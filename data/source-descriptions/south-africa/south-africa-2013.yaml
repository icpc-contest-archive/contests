    List of the eight problems of the Regionals 2013 Africa/Middle East - South Africa category of the ICPC Live Archive, numbered 6416 to 6423: Isle of the birds, Street Lights, Fitness Training, Matchstick Maths, Similarity, Railways, Necklace and Student IDs. For each problem it shows total submissions, the share of them solved, total users and the share of users who solved it; Necklace has no submissions. The page lists titles and statistics; the statements are not on it.
