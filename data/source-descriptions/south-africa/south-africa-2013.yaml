  description: |-
    Standings of the 2013 South Africa Regional Contest: 51 teams from 14 institutions, with rank, team name, institution, problems solved, time, citation and site citation. Two teams solved 6 problems and 45 teams solved none; the time column is 0 for all 45 of those and for three teams that solved 3 to 4 problems, so it is not a penalty total for them. Ranks 1 to 6, 8, 9 and 10 are printed and the other 42 rows have no rank. The first three carry the citations First, Second and Third and six teams carry a site citation such as First in Cape Town or First in Nigeria. First place is If Cats Programmed Computers. No per-problem detail.
