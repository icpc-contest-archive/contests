  description: |-
    Standings of the 1999 ACM Southern Africa Programming Contest, a short page. The header names IBM as sponsor, the University of Pretoria as host and Rhodes University and the University of Cape Town as additional locations, and gives the date as Saturday, 18 September 1999. The text says 31 teams from six universities took part, lists how many came from each, and calls the standings final "in terms of teams", even though some team member names have not been entered.

    The table lists eight teams: position (places 1 to 4, a tie for 5, then 7 and 8), team name, team members, university, problems solved and total time including penalties. The first three teams solved five problems each, the others three. Two member cells hold "???". The 23 other teams are not in the table, and there is no per-problem detail.
