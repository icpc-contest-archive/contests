    Problem set: a PDF of 15 pages, headed 18th South African Regional ACM Collegiate Programming Contest, Sponsored by IBM, 15 October 2016. It holds eight problems, A to H, each marked with a balloon colour (A Orange, B Pink, C Green, D Yellow, E Purple, F Red, G Blue, H White).

    Each problem has a statement in English with input and output format, one sample input with its sample output, and a time limit. The problems are Rice coding, Scrunched, Keeping your balance, Folding Paper, Powers, Generic-mint-toe, Talk in numbers and Juggling Jugs. No test data or solutions.
