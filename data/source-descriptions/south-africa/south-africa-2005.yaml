    Problem Set page of the contest website, in English: a short note that the set comprises at least 6 problems and that teams have 5 hours, followed by links to six PDF files, one per problem: A Prime Concern, B Board Game, C Compactor, D Feeling Lucky, E Snake Pit and F Word Sums. Our copy holds only this page; the six PDF statements are not in it.
