  description: |-
    Category page of the ICPC Live Archive judge for the 2005 Africa/Middle East regional in South Africa, as it stood on 6 December 2021. It lists six problems numbered 3296 to 3301: Prime concern, Board game, Compactor, Feeling lucky, Snake pit and Word sums. For each it gives total submissions and solving percentage, and total users and solving percentage. Names only: no statements. The page also carries the archive's menu and login form.
