  description: |-
    Standings of the 2005 ACM South Africa Programming Contest sponsored by IBM, as shown on a View Standings page of the ICPC website: 48 teams with rank, institution and team name, a citation, and the number of problems solved. The Time column is empty. Some citations give the overall place and the place within the team's university, for example "First overall, 1st at UCT"; others give only the place in words, or only the place within the university. A University of Cape Town team is first with 5 solved. Teams with equal results share a rank, and eleven teams share 38th place with none solved. No per-problem detail.
