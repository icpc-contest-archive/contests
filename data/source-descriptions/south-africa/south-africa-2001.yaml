  description: |-
    Regional contest information page from the ACM International Collegiate Programming Contest site for the 2001 ACM South Africa Programming Contest sponsored by IBM, hosted by the Department of Computer Science, University of Pretoria, with the date given as Sep 15, 2001. A short text says the contest draws students from colleges and universities throughout southern Africa and that winners selected from regional contests on six continents advance to the World Finals in Honolulu. It links the team roster, the standings and the problems.

    Our copy holds 3 pages: the seed page, a problem set page (6 problems, 5 hours, with links to the PDF and test data) and ProblemSet.pdf, a 12-page PDF of the six problem statements. It also holds a style sheet and two zip files of test data, in DOS and UNIX format. The roster and standings links lead to addresses that are not part of our copy.
