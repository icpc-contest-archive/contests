  description: |-
    Statement of problem 4133, 'Fibonacci Triangles': for each number below 2^30, say whether it is a Fibonacci number and, if so, whether it is the hypotenuse of a right-angled triangle with integer sides, printing the pair with the largest a. It gives a test for Fibonacci numbers, pseudocode for an integer square root, input and output sections and a sample with three numbers. A PDF of 3 pages in English, with the region line 'Africa and the Middle East - South Africa - 2008/2009' under the title and 'South Africa 2008-2009' at the end.
