  description: |-
    Statement of problem 4132, 'Bad Barcodes': decode a bar code of narrow and wide bars given as a bit sequence of at most 200 bits, correcting at most one inverted bit, using the rule that the encoded value is a palindrome. It has a figure of a sample bar code, a table mapping digits to narrow and wide bars, input and output sections and a sample with three records. A PDF of 3 pages in English, with the region line 'Africa and the Middle East - South Africa - 2008/2009' under the title and 'South Africa 2008-2009' at the end.
