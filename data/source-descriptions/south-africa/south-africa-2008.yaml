  - en
  problems: 6
  description: |-
    Blog post of 12 October 2008 by Marco Gallotta on his personal blog, an account of the South African regional contest written from the University of Cape Town site, which hosted 22 teams from UCT, Stellenbosch and UWC. It tells of the morning, a delayed start after the Nigerian server went offline, and how a group of students no longer eligible to compete worked through the problems alongside the contest. It gives the course of the contest as seen from that site (about 70 teams overall, 14 of them solving anything) and the final order of the first five teams: UCT's first-placed team, Stellenbosch's Code Red, Tuks3 of Pretoria, UCT's Team LOL and OMG Raptors of UKZN. The post carries 12 photographs, and a closing link leads to the UCT site with problems and detailed standings.

    Only this one post is in our copy, with its images; the rest of the blog is not.
