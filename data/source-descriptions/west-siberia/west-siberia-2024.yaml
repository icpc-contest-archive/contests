    Final scoreboard from the OlympSystem site of Novosibirsk State Technical University (NSTU), headed "Итоговые результаты ACM 2024" ("final results"), with the note that the contest is over and that there are no unofficial or disqualified participants. It lists 38 teams with rank, team name with the members' names, one column for each of the twelve problems labelled 1 to 12, the number solved and the total time. A solved problem shows a plus sign, the number of earlier rejected attempts if any, and a time; an unsolved problem with attempts shows a minus sign, a number and a time. Novosibirsk SU 1: CtrlAltDeFIT is first with 8 problems. The last two teams share places 37 to 38 with no problem solved.

