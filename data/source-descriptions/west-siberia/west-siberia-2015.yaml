  description: |-
    Final results page of the NSTU OlympSystem, headed Результаты ACM 2015 (Results ACM 2015). A line under the heading says the contest is over and that out-of-competition and disqualified participants are left out. The scoreboard lists 42 teams with place (1 to 38, then 39-42 shared by four teams with no problem solved), a participant column giving the team name and the names of the three members, 12 problem columns labelled 1 to 12, the number solved and the total time. Each problem cell shows a plus or minus sign, the number of extra or rejected tries, and a time in hours and minutes; the total time is in hours, minutes and seconds. The first place is Novosibirsk SU 3 with eleven problems solved.

    The page is in Russian. Its style sheets are not in our copy.
