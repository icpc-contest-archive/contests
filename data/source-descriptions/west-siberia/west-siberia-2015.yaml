  description: |-
    Problem set as a PDF of 13 pages in Russian with 12 problems numbered 1 to 12 (Задача 1 to Задача 12), one problem to a page except that problem 4 runs over two pages. Every page repeats the running header Novosibirsk 2015, NSTU and the line naming the ACM ICPC 2015 West Siberian Subregional Contest, Novosibirsk, October 31, 2015. Each problem has input and output file names (standard input and output), time and memory limits (ten problems with 1 second, two with 3 seconds; 256 MiB each), the statement, the input and output format and an examples table. Problem titles are in Russian, from Проверка уравнений (Equation checking) for problem 1 to Номер (Number) for problem 12. The two problems with 3 seconds are 5 and 11. The document holds statements only, with no test data or solutions.
