  copy: west-siberia/west-siberia-2015/website/2026-09-05-wayback-88d7fcfd
  title: Northern Eurasia Contests
  language:
  - en
  description: |-
    Archive site of the Northern Eurasia Contests (NEERC, neerc.ifmo.ru), in English. It is a site for the whole region and many years, not a site of this contest alone. Our copy holds 150 saved pages, which are 61 distinct addresses, each captured up to three times at different dates. They include the archive index, the year pages for 1996 to 2008, 2015 and 2016, and for each of 2015 and 2016 18 standings pages: the final standings plus those of the regional contests.

    The 2015 year page is headed NEERC 2015 and lists Standings, Problems, Official tests and Jury archive for the final, then 16 regional contests, one of them West Siberian, each with a Standings link. The West Siberian Subregional 2015 standings page is in our copy; so is the West Siberian standings page of 2016, which belongs to another edition. Also in our copy are PDFs of the 2015 and 2016 final (problem statements and a problems review) and statements and analysis PDFs of the northern regional contest for both years.
- url: https://nerc.itmo.ru/archive/2015/west-siberian/standings.html
  read: '2026-11-16'
  rubric: 1
  copy: west-siberia/west-siberia-2015/scoreboard/20260904-live-d89a0a7d/standings.html
  title: West Siberian Subregional 2015
  language:
  - en
  - ru
  teams: 54
  problems: 12
  times: true
  tries: true
  description: |-
    Final scoreboard of 54 teams, shown with the clock at 5:00:00 of 5:00:00 and status over. Each row gives the rank (ranks run from 1 to 51, with ties sharing a rank), the team name followed by the names of its three members in Cyrillic, then 12 problem columns labelled 1 to 12, then the number solved and the time. A solved problem shows a plus sign, the number of extra tries and the solve time in minutes; an unsolved problem with attempts shows a minus sign and the number of rejected runs; a dot means no attempt. Twelve team names carry an asterisk, which the page does not explain. The most solved by one team is 11; four teams solved nothing. A checkbox labelled Show time hides or shows the times, and the first accepted run of each of eleven problems is tagged as first to solve. Below the table are totals per problem: total runs, accepted, rejected, first accept and last accept. Problem 2 has no accepted solution.
