  description: |-
    Website of the programming olympiads of Novosibirsk State Technical University (NSTU), a system titled OlympSystem, mainly in Russian. The 1 November 2008 contest appears in its history of olympiads as the regional quarterfinal of the world team programming championship under ACM rules, and in the list of olympiads as "ACM 2008". Two pages in our copy are about it: the list of 58 teams confirmed by the jury, with their institutions and trainers, and the preliminary results with the jury's comments (58 team rows, ten problems, updated 1 November 2008 23:09). The comments say that tests were rerun after the Java and Pascal compilers started late, and that appeals were accepted until 9 in the morning of 3 November.

    Our copy holds 149 saved files, captured at many different dates between 2001 and 2024, so it mixes versions of the site: rules in several editions, news, about, contacts and sponsors pages, the front page of the forum, and pages of other olympiads such as the 2009 and 2010 contests. A PDF of nine pages with problem statements of a different contest is also in it. The results table and statements of the 2008 contest are linked from the list of olympiads but are not in our copy.
