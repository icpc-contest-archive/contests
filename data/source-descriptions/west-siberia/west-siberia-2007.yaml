  description: |-
    Final standings table of the 2007-2008 West Siberian Subregional Contest, status "over" at 5:00:00 of 5:00:00: 80 teams, ranked 1 to 74 with ties, and twelve problems labelled A to L. Each team row gives a cell per problem (a plus with the number of rejected attempts before the accepted one, a minus with the number of rejected attempts, or a dot in the remaining cells), the number solved and the total time. The page has no per-problem times. Team names are in English and Russian.

    Six teams carry the mark "(вне конкурса)" (out of competition) and are ranked among the others; seven teams solved no problem. First place is Novosibirsk SU #1 with 11 problems solved.
