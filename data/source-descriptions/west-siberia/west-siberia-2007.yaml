  description: |-
    Archive page for 2007 of the Northern Eurasia Contests website (NEERC), in English, headed "NEERC 2007". It lists the resources of the 2007 finals (standings, problems in PDF, tests and jury solutions, runs, and a history download for watching the contest in progress) and, under Regional Contests, an entry for each subregion; the West Siberian entry has one link, to the final standings. The menu links to a page for every year from 1996 to 2020.

    Our copy holds 150 saved files, 138 pages and 12 PDFs, many of them the same page saved under different addresses. Besides the 2007 page it has the 2007 and 2008 finals standings, the problem statements of the two finals (PDFs of 14 pages each), the standings pages of the 2007 and 2008 subregional contests, including the West Siberian ones, and problem PDFs of 11 pages for two 2007 subregional contests (Northern, and Georgia with Uzbekistan). The files linked for download (tests, jury solutions, runs, history download) are not in it, and neither are the West Siberian problem statements.
