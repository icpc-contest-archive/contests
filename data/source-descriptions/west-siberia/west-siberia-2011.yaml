    Final standings page of the NEERC West Siberian Subregional Contest 2011, in English: 69 ranked teams. Each row has the team name, followed by the names of the members for 63 of the 69 teams. For each of the 12 problems, labelled 1 to 12, a cell shows whether it was solved, the number of wrong tries and the time; each row ends with the number solved and the total time. The contest clock reads 5:00:00 of 5:00:00 with status over, and Novosibirsk SU 1 is first with 11 problems. Ten team names begin with an asterisk that the page does not explain; they are ranked among the others.

    Below the table are totals per problem: total runs, accepted, rejected, first accept and last accept. A "Show time" switch is part of the page. The style sheet is saved with our copy.
