  description: |-
    Standings of the 2011 West Siberian Subregional Contest: 58 teams with team name, institution, number solved and time, a medal column and a citation column. The first 56 rows carry ranks 1 to 56; two further teams with no solved problems follow without a rank. Gold medals go to the first four teams, silver to the next four and bronze to the next four. The citation column names the place for ranks 1 to 29 (First Place and so on) and Honorable Mention for ranks 30 to 56; the two unranked teams have "Champion of West Siberian Subregional Contest" in the site citation column. Novosibirsk SU 1 is first with 11 problems. The page gives no per-problem results and no attempts. The winner's time is 1516 here and 1511 on the NEERC standings page.
