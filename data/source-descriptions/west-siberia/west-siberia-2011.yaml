  description: |-
    Pages of the Northern Eurasia Contests archive site of the NEERC organisers, in English. The index pages of 2011 and 2012 list the materials of the finals (standings, problems, official tests, analysis or review, test generators and jury solutions) and the regional contests of that year; West Siberian is one of them and its entry links to the standings page. Our copy holds 150 saved files, which are 67 distinct addresses, the http, https and port-80 forms of an address counted as one.

    Besides the index pages of every year from 1996 to 2018, the copy has the finals standings of 2011 and 2012, standings pages of 16 regional addresses for each of 2011 and 2012 (the Ural and Eastern addresses show the same Eastern Subregional contest), problem-statement PDFs of the finals of 2011 and 2012 and of the Northern subregional contests of 2011 and 2012, the Central regional problems of 2012, an XML standings file of the Northern 2012 contest, and two PDF analyses of the finals. The only document of the West Siberian 2011 contest in it is its standings page. The index pages of other years are saved without the pages they link to.
