  title: West Siberian Subregional 2017
  language:
  - en
  - ru
  teams: 57
  problems: 12
  times: true
  tries: true
  description: |-
    Standings page of the West Siberian Subregional 2017: a clock reading 5:00:00 of 5:00:00 and the status "over". 57 teams are ranked by problems solved and penalty time, each shown with its name and its three members in parentheses, written in Cyrillic. The grid has one column for each of the 12 problems, numbered 1 to 12. A plus marks a solved problem, with the number of earlier rejected attempts and the solve time; a minus with a number marks rejected attempts without a solve; a dot marks no attempts. The first solve of each problem is highlighted. The last two columns give the number solved and the penalty time. Two teams solved nothing, and tied teams share a rank.

    Rows below the teams give, for each problem, total runs, accepted, rejected, and the times of the first and last accepted solution. A "Show time" checkbox hides or shows the solve times. Novosibirsk SU 1 is first with 12 problems solved and a penalty of 1073.
