    Results table titled "Результаты ACM 2017" (ACM 2017 results) from the OlympSystem of NSTU, in Russian: 58 teams, each with its team name and its three members. Columns are rank, participant, problems 1 to 12, problems solved, and total time as hours, minutes and seconds. A cell shows a plus for a solved problem with the number of earlier rejected attempts and the solve time in hours and minutes, or a minus with a number for rejected attempts without a solve. First solves are marked. The two teams at the bottom share the rank 57-58, and two teams solved nothing. Novosibirsk SU 1 is first with 12 problems solved. It lists one team, Novosibirsk STU 3: bicycle & crutch, that the other standings of this contest do not have.

    The style sheets and scripts of the page are not in our copy, so it appears without its original styling.
