  copy: west-siberia/west-siberia-2017/website/2026-09-05-wayback-88d7fcfd
  title: NEERC 2017
  language:
  - en
  description: |-
    Pages of the Northern Eurasia Contests (NEERC) archive website, in English, not a site of the West Siberian contest itself. Our copy holds 149 pages: an archive index and a page for each year from 1996 to 2025. Each year page lists the resources of that year's final, and from 2003 on most also list the regional contests, with links to standings, problem statements, tests, jury solutions and analyses.

    For 2017 the copy holds the year page and the standings page of the West Siberian Subregional 2017, a table of 57 teams. It also holds the standings pages of the other regional contests of 2017 and 2018, the NEERC 2017 and 2018 statements and analyses, a 2018 review PDF, and statements and analyses of the Northern subregional contests. Pages of other years and other regions make up most of it.
- url: https://nerc.itmo.ru/archive/2017/west-siberian/standings.html
  read: '2026-11-16'
