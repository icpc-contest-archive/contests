    Final results page headed "Результаты ACM 2019" ("ACM 2019 results") on OlympSystem, whose footer credits НГТУ (NSTU) and its Faculty of Applied Mathematics and Informatics; the page is in Russian. A line under the heading says the contest has ended and the results are without out-of-competition or disqualified participants. 50 teams are listed with place, team name and the three members' names, then eleven problems labelled 1 to 11, then the number solved and the total time as hours, minutes and seconds. A problem cell with a plus sign is an accepted problem, with earlier rejected attempts and the time of the accepted run as hours and minutes; a cell with a minus sign gives rejected attempts with a time. Novosibirsk SU 2: Triton is first with six problems.

    Our copy holds the page alone: the style sheets it links to are not in our copy.
