  description: |-
    Archive part of the Northern Eurasia Contests website, in English, covering the Northern Eurasia finals and the regional contests; it is not the website of the West Siberian contest. Our copy holds 150 files (123 HTML pages and 27 PDFs) under 76 distinct addresses, most captured under both http and https, two of them redirect stubs of the site root. It has the archive menu and an index page for every year from 1996 to 2025, the 2019 index in two versions and the 2020 index in two versions, the final standings and the PDF statements and tutorials of the finals for 2019 and 2020, and standings pages of regional contests for 2019 and 2020. Of the regionals, North-Western Russia, Ural, Taurida, Armenia and Georgia are there for both years, Moscow for 2019 only.

    The 2019 index page lists the West Siberian regional with the words "No information is available", yet our copy holds the page West Siberian Regionals 2019, a final scoreboard of 50 teams with eleven problems.
