  description: |-
    Final scoreboard titled West Siberian Regionals 2019, with the clock at 5:00:00 of 5:00:00 and the status "over": 50 teams and eleven problems labelled 1 to 11. Each team row gives the rank, the team name with its institution prefix and the three members' names in brackets, then one cell per problem, then the number solved and the penalty time in minutes. A cell with a plus sign marks an accepted problem, with the number of earlier rejected attempts if any and the time of the accepted run in minutes and seconds; a cell with a minus sign gives the number of rejected attempts on an unsolved problem; a dot means no attempts. Novosibirsk SU 2: Triton is first with six problems solved and 655 minutes; the last team has none solved.

    Below the teams come summary rows per problem: total runs, accepted, rejected, first accept and last accept. Most members' names are in Russian.
