  description: |-
    Final standings page of the West Siberian Subregional 2013, in English: 57 ranked teams. Each row has the team name, followed by the names of the members for 52 of the 57 teams. For each of the 11 problems, labelled 1 to 11, a cell shows whether it was solved, the number of wrong tries and the time; each row ends with the number solved and the total time. The contest clock reads 5:00:00 of 5:00:00 with status over. Novosibirsk SU 1 is first with 10 problems; the last seven rows share rank 51. Eleven team names begin with an asterisk that the page does not explain; they are ranked among the others, and one of them is second.

    Below the table are totals per problem: total runs, accepted, rejected, first accept and last accept. A "Show time" switch is part of the page. The style sheet is saved with our copy.
