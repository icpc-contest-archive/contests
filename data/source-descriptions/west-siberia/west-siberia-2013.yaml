  description: |-
    Pages of the Northern Eurasia Contests archive site of the NEERC organisers, in English. The year index pages list the materials of the finals (standings, problems, tests, analysis or review) and the regional contests of each year; West Siberian is one of them and its entry links to the standings page. Our copy holds 150 saved files, which are 64 distinct addresses, the http, https and port-80 forms of an address counted as one.

    Besides the index pages for 1996 to 2014, the copy has the finals standings of 2013 and 2014, standings pages of regional contests for 2013 (16 addresses) and 2014 (17 addresses), the Ural and Eastern addresses of each year showing the same Eastern Subregional contest, problem-statement PDFs of the finals and of the Northern subregional contest of 2013 and 2014, an XML standings file of the Northern 2013 contest, and problem reviews of the finals of 2013 and 2014 and an analysis of the Northern 2014 contest. The only document of the West Siberian 2013 contest in it is its standings page. Pages linked from the index pages of other years are not in the copy.
