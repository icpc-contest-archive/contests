  description: |-
    Website of the programming olympiads of Novosibirsk State Technical University (NSTU), a system titled OlympSystem, mainly in Russian. For the 2010 contest it holds a news item of 9 October 2010 announcing the ACM ICPC quarterfinal for 30 October 2010 at 8:00 Moscow time, a news item of 2 November 2010 announcing the results with the alphabetical list of 21 teams that advanced to the semifinal, the list of olympiads with "ACM 2010" dated 30 October 2010, the rules of the quarterfinal competitions, and the front page of the forum with a topic named "ACM 2010 (West Siberian Subregion)".

    Our copy holds 149 saved files, captured at many different dates between 2001 and 2024, so it mixes versions of the site: rules in several editions, news, about, contacts and sponsors pages, and pages of other olympiads, among them the problem list of the 2009 contest and registered-team lists of earlier contests. The results tables and statements of the 2010 contest, linked from the news item and the list of olympiads, are not in our copy, nor are the forum topics.
