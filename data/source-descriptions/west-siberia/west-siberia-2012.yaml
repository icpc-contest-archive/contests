  description: |-
    Pages of the Northern Eurasia Contests archive site of the NEERC organisers, in English. The year index pages list the materials of the finals (standings, problems, official tests, test generators and jury solutions) and the regional contests of each year; West Siberian is one of them and its entry links to the standings page. Our copy holds 150 saved files, which are 65 distinct addresses, the http, https and port-80 forms of an address counted as one.

    Besides the index pages for 1996 to 2015, the copy has the finals standings of 2012 and 2013, standings pages of 16 regional addresses for each of 2012 and 2013 (the Ural and Eastern addresses show the same Eastern Subregional contest), problem-statement PDFs of the finals of 2012 and 2013, of the Northern subregional contests of 2012 and 2013 and of the Central regional contest of 2012, XML standings files of the Northern 2012 and 2013 contests, and problem reviews of the finals of 2012 and 2013. The only document of the West Siberian 2012 contest in it is its standings page. Pages linked from the index pages of other years are not in the copy.
