  description: |-
    Final scoreboard of the 2003-2004 NEERC West-Siberian Subregion contest: 69 teams, problems A to H, with the clock shown as 5:00:00 of 5:00:00 and status over. Each row gives the team name with its university (in Russian or English), a cell per problem with + or a minus sign followed by the number of attempts and, for solved problems, extra attempts as +N, the number solved, the penalty time and the rank. Rank 1 is NovosibirskSU_1 with six problems. Rank 35 is shared by the teams with no problem solved. Teams come from universities in Novosibirsk, Tomsk, Omsk, Kemerovo and Tyumen, and from Altai and Kyrgyz-Russian Slavic universities, among others. No medals or awards are marked.
