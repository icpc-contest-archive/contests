  description: |-
    Pages of the Northern Eurasia Contests archive (NEERC) held as 150 saved files, mostly repeated captures of the same addresses over http and https. The seed page is the NEERC 2003 year page: it lists the 2003 finals resources (final standings, problems in PostScript and PDF, a jury archive, a picture gallery) and the regional contests of that year, among them a West Siberian entry with a link to its final standings. The year pages for 1996 to 2025 are in our copy, as are standings pages of the 2003 and 2004 regional contests, the 2003 and 2004 finals standings, and the finals problem sets: the 2003 set as PDF and PostScript and the 2004 set as PDF.

    The West Siberian material in our copy is the final standings of the 2003-2004 subregional contest (69 teams, problems A to H) and those of the 2004 edition, which is another contest. The problems PDF of 2003 is the finals problem set (13 pages, problems A to K), not a West Siberian one. The site is English, the standings carry Russian team and university names. The style sheets and images are not part of our copy.
