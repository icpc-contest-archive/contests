  description: |-
    Pages of the Northern Eurasia Contests archive (NEERC), held as 150 saved files, mostly repeated captures of the same addresses over http and https. The seed page is the NEERC 2005 year page: it lists the 2005 finals resources (final standings, problems, tests and jury solutions, contest history files) and the regional contests of that year, among them a West Siberian entry with a link to its final standings. The year pages from 1996 to 2025 are in our copy, with standings pages of the 2005 and 2006 regional contests and the 2005 and 2006 finals.

    The West Siberian material in our copy is the final standings of the 2005-2006 subregional contest (63 teams, problems A to J) and those of the 2006 edition, which is another contest. The 2005 problems PDF is the finals problem set (14 pages, headed ACM ICPC 2005-2006, Northeastern European Regional Contest, 30 November 2005), not a West Siberian one. The site is in English; the standings carry Russian university names. The style sheets and images are not part of our copy.
