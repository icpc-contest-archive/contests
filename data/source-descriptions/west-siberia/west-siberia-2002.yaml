  description: |-
    The NEERC archive on the Northern Eurasia Contests site, in English, as it holds the 2002 contest. Our copy has 150 files: archive pages for the years 1996 to 2025, the final standings of 2002 in two layouts, a list of the nine 2002 problems A to I with the statements of four of them (Amusing Numbers, Bricks, Folding, Heroes Of Might And Magic), and rar archives of tests and of the contest history, together with pages for five 2002 subregions (Central, Eastern, Northern, Southern and Middle Asia).

    There is no page of a West Siberian contest of 2002 in our copy. The only West Siberian page is the standings of 2003, a different edition. Teams of Novosibirsk, Altai and Krasnoyarsk universities appear only as rows of the NEERC final standings of 2002.
