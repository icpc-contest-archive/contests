  description: |-
    Pages of the Northern Eurasia Contests archive (NEERC), held as 150 saved files, mostly repeated captures of the same addresses over http and https. The seed page is the NEERC 2006 year page: it lists the 2006 finals resources (final standings, problems in PDF, tests and jury solutions) and the regional contests of that year, among them a West Siberian entry with a link to its final standings. The year pages from 1996 to 2025 are in our copy, with standings pages of the 2006 and 2007 regional contests, the finals standings, and problem PDFs of the 2006 and 2007 finals, of the Northern regional contests of both years and of a 2007 problem set filed under light.

    The West Siberian material in our copy is the final standings page filed under 2006 (74 teams, problems A to I) and that of the 2007 edition, which is another contest. The 2006 West Siberian page is headed ACM ICPC 2005-2006 NEERC, West-Siberian Subregion, although it is filed under 2006 and the 2005 edition has a different page with 63 teams. The site is in English; the standings carry team names, a few of them in Russian. The style sheets and images are not part of our copy.
