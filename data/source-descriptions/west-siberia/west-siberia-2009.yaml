  description: |-
    Archive page for 2009 of the Northern Eurasia Contests website (NEERC), in English, headed "NEERC 2009". It lists the resources of the 2009 finals (standings, problems in PDF and PostScript, statement sources in TeX, tests and jury solutions, monitor program) and, under Regional Contests, an entry for each subregion; the West Siberian entry has one link, to the final standings. The menu links to a page for every year from 1996 to 2020.

    Our copy holds 150 saved files, 128 pages, 20 PDFs and two presentation files, many of them the same page saved under different addresses. Besides the 2009 page it has the finals standings and the finals problem PDF (13 pages) for 2009 and for 2010, the standings pages of the 2009 and 2010 subregional contests, including the West Siberian ones, and for the Northern subregion its problem PDFs (14 pages in 2009, 13 in 2010) and analysis material (a presentation file for 2009, a PDF of 10 pages and one of 80 pages for 2010). The files linked for download (tests, jury solutions, runs, monitor program) are not in it, and neither are the West Siberian problem statements.
