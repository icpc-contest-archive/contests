  description: |-
    Paper in Russian by V. N. Vasiliev, M. A. Kazakov, G. A. Korneev, V. G. Parfenov and A. S. Stankevich, a PDF of 7 pages, about the 2001-2002 ICPC semifinal of the Northeastern European group held in Saint Petersburg. It describes the three stages of the world championship and the sponsors, then the contest itself: the course of the five hours, the order in which teams solved problems, the seven teams that reached the world final, and a table of the first 20 places with problems solved and penalty time.

    The West Siberian quarterfinal group appears in one sentence, in the list of eight quarterfinal groups of the season, with Novosibirsk State Technical University as its organising university. Nothing else in the paper is about the West Siberian contest; Siberian teams are mentioned as taking part in the Saint Petersburg semifinal from a site in Barnaul.
