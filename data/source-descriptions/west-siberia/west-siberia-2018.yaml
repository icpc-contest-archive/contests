  description: |-
    Results table titled "Результаты ACM 2018" (ACM 2018 results) from the OlympSystem of NSTU, in Russian, headed as final results "without out-of-competition and disqualified participants": 49 teams, each with its team name and its three members. Columns are rank, participant, problems 1 to 10, problems solved, and total time as hours, minutes and seconds. A cell shows a plus for a solved problem with the number of earlier rejected attempts and the solve time in hours and minutes, or a minus with a number for rejected attempts without a solve. First solves are marked. Four teams solved nothing and share the rank 46-49. Novosibirsk SU: Dva is first with 9 problems solved.

    The style sheets and scripts of the page are not in our copy, so it appears without its original styling.
