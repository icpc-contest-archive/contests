  title: News - OlympSystem
  language:
  - ru
  - en
  description: |-
    Website of the programming contest system of Novosibirsk State Technical University (NSTU), in Russian with some English. Our copy holds 114 pages of the site (not counting six empty or default-server pages), so it covers several editions and other NSTU contests as well as this one. The pages include news, rules, contacts, sponsors, the list of contests with their results and downloads, and the forum index.

    For the 2018 West Siberian Subregional the site has a news item headed "Результаты четвертьфинала ACM ICPC 2018 (West Siberian Subregional Contest)" (results of the quarterfinal), which announces the results tables and lists the teams that advance to the semifinal under the quota. The list of contests has an entry "ACM 2018", dated 11/10/2018, with links to the participant list, the results tables, the statements and the tests, and the forum index has a topic "ACM 2018".

    The pages those links lead to (results tables, participant list, statements, tests) are not in our copy.
