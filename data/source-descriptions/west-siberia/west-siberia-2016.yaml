- url: http://olymp.nstu.ru
  read: '2026-11-16'
  rubric: 1
  copy: west-siberia/west-siberia-2016/website/2026-09-05-wayback-d4fe4729
  title: News - OlympSystem
  language:
  - ru
  - en
  description: |-
    Website of the programming contest system of Novosibirsk State Technical University (NSTU), in Russian with some English. Our copy holds 114 pages of the site (not counting six empty or default-server pages), so it covers several editions and other NSTU contests as well as this one. The pages include news, rules, contacts, sponsors, the list of contests with their results and downloads, and the forum index.

    For the 2016 West Siberian Subregional the site has a news item headed "Результаты четвертьфинала ACM ICPC 2016 (West Siberian Subregional Contest)" (results of the quarterfinal), which announces the results tables and lists the teams that advance to the semifinal under the quota, and an entry "ACM 2016" in the list of contests, dated 10/29/2016, with links to the participant list, the results tables, the statements and the tests. The forum index has a section for appeals of ACM-2016.

    The pages those links lead to (results tables, participant list, statements, tests) are not in our copy.
