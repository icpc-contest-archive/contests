  description: |-
    The NEERC archive on the Northern Eurasia Contests site, in English, as it holds the 2000 contest. Our copy has 150 files: the archive index and one page for each year from 1996 to 2025, the 2000 final standings, a zip of the 2000 problems in PDF format, and pages for eight 2000 subregional contests (Central, Eastern, Western, Northern, Southern, Far Eastern, East Siberian and Siberian), plus pages of other years and a few rar archives of problems and tests.

    The page headed NEERC 2000 Siberian Subregion names Novosibirsk as the host and Novosibirsk State Technical University as the host university. It has a results table of 34 teams, with team names in Russian, six problem columns N1 to N6 giving attempts and a plus for a solved problem, the number solved and the time. The best team solved six problems; the last team solved none. The regions line is empty and the page has no dates and no problem statements.

    Several files are the same page saved at more than one address.
