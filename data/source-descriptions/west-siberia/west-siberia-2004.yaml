  description: |-
    Pages of the Northern Eurasia Contests archive (NEERC), held as 150 saved files, mostly repeated captures of the same addresses over http and https. The seed page is the NEERC 2004 year page: it lists the 2004 finals resources (final standings, problems, jury archive, contest history files, runs, picture galleries) and the regional contests of that year, among them a West Siberian entry with a link to its final standings. The year pages for 1996 to 2023 are in our copy, together with standings pages of the 2004 and 2005 regional contests, the finals standings of both years and the 2004 and 2005 finals problem PDFs.

    The West Siberian material in our copy is the final standings of the 2004 subregional contest (56 teams, problems A to G) and those of the 2005 edition, which is another contest. The 2004 problems PDF has 14 pages and twelve problems A to L under the heading ACM ICPC 2004-2005, Northeastern European Regional Contest, St Petersburg - Barnaul - Yerevan - Tashkent, December 1, 2004. The site is in English; the standings carry Russian team and university names. The style sheets and images are not part of our copy.
