  description: |-
    Final results page of the NSTU OlympSystem, headed Результаты ACM 2014 (Results ACM 2014). A line under the heading says the contest is over and that out-of-competition and disqualified participants are left out. The scoreboard lists 49 teams with place (1 to 40, then 41-49 shared by the nine teams with no problem solved), a participant column giving institution, team name and the names of the three members, 12 problem columns labelled 1 to 12, the number solved and the total time. Each problem cell shows a plus or minus sign, the number of extra or rejected tries, and a time in hours and minutes; the total time is in hours, minutes and seconds. The first place is Omsk STU: OmSTU_01 with seven problems solved.

    The page is in Russian. Its style sheets are not in our copy.
