  teams: 58
  problems: 12
  times: true
  tries: true
  description: |-
    Final scoreboard of 58 teams, shown with the clock at 5:00:00 of 5:00:00 and status over. Each row gives the rank (ranks run from 1 to 47, with ties sharing a rank), the team name, then 12 problem columns labelled 1 to 12, then the number solved and the time. For 49 teams the name is followed by the names of three members; the nine teams whose names start with an asterisk have no member names. A solved problem shows a plus sign, the number of extra tries and the solve time in minutes; an unsolved problem with attempts shows a minus sign and the number of rejected runs; a dot means no attempt. A checkbox labelled Show time hides or shows the times, and the first accepted run of each of nine problems is tagged as first to solve. Below the table are totals per problem: total runs, accepted, rejected, first accept and last accept.

    The nine asterisked team names are not explained on the page. Nine problem columns hold accepted solutions, three (1, 2 and 10) hold none. Member names of three teams are garbled in the page itself.
