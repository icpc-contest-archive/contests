  copy: west-siberia/west-siberia-2014/website/2026-09-05-wayback-cdd77405
  title: News - OlympSystem
  language:
  - ru
  - en
  description: |-
    Website of the programming-contest system of Novosibirsk State Technical University (NSTU), mostly in Russian, with the 2023 pages also in an English interface. Our copy holds 120 pages (149 saved files) captured at different dates between 2001 and 2024, so it covers many contests and years, not only this one. The front page of our copy is a 2023 news page that reports the 2022 ICPC West Siberian Regional.

    For this edition, a news page captured in May 2015 has three posts. One, dated 14.10.2014, announces the ACM ICPC 2014 West Siberian Subregional Contest for 8 November, start 8:00 Moscow time, with registration steps. One, dated 08.11.2014, says the contest has ended, preliminary results are available and appeals are accepted until 19:00 on 10 November, and gives notices of teams disqualified for identical solutions. One, dated 10.11.2014 and headed quarterfinal results, links a final and an official results table (the latter without out-of-competition and disqualified participants) and lists 23 teams advancing to the semifinal plus three more. Contest lists captured in 2016, 2021 and 2023 show an entry ACM 2014 dated 8 November 2014 with links to participants, standings, statements and tests; those linked pages are not in our copy. The rest is rules, contacts, sponsors, news, task and results pages of other contests and years.
