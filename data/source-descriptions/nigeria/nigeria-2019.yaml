  description: |-
    General website of the National Mathematical Centre, Abuja, as it stood in August 2020. Our copy holds 131 pages (one of them a PDF) and 17 other files (style sheets, images, a script, three spreadsheets). The pages cover the centre itself: decree, history, vision and mission, council, academic programmes, departments, library, linkages, publications, news, gallery, archives and contact details.

    No page is about the 2019 Nigerian Collegiate Programming Contest. A menu on several pages links to a site called Nigerian Universities Computer Programming Contest, which is not part of our copy.
