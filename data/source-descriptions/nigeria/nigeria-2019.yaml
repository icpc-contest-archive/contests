  description: |-
    Standings of the 2019 Nigerian Collegiate Programming Contest: 16 teams from Nigerian universities, each with rank, team name, institution, number of problems solved, total time and a citation. Bowen University (BOWEN 1) is first with 6 problems solved and a time of 819; three teams follow with 5 solved and the rest have 4 to 2. The citations name First to Eighth Place and mark places 9 to 16 as Honorable Mention. There are no per-problem results.
