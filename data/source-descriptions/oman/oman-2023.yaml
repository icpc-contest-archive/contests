    News item of the College of Engineering of National University, dated 1 November 2023, under the heading NU STUDENTS IN OCPC 2023. It reports that six Level 3 students of the Computer Engineering and ITMB programs took part in the 10th Oman Collegiate Programming Contest (OCPC2023) at Sultan Qaboos University, held on 31 October and 1 November 2023 with 95 teams and 195 participants from universities and colleges across Oman. Training and practice took place on the first day and the main contest on 1 November.

    The text says the college teams aimed at a top-20 place and did not win; it gives no results, rankings or problems. The page is wrapped in the university site's menus and footer.
