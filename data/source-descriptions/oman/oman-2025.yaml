  description: |-
    Standings of the 2025 ICPC Oman Collegiate Programming Contest: 53 teams with rank, team name, institution, number of problems solved, total time and a citation. Place names run from First Place to Fiftieth Place, tied teams share a rank, and one team is marked Honorable Mention. Enigma of Sultan Qaboos University is first with 10 solved in time 1224. The table gives no per-problem detail.
