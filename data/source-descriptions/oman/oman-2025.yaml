  title: The Codebreakers Qualify for OCPC 2025 Finals!
  language:
  - en
  contest_date: '2025-04-09'
  description: |-
    Blog post of the Oman College of Management and Technology, dated 11 March 2025, announcing that its team The Codebreakers qualified for the final round of the Oman Collegiate Programming Contest (OCPC) 2025, to be held at Sultan Qaboos University on 8 and 9 April 2025. It gives the final's schedule as a practice contest on 8 April, the actual competition on 9 April, and a closing ceremony, and quotes a college staff member.

    Written before the final: no results, problems or other teams. The page is wrapped in the college site's menus and a monthly archive list.
