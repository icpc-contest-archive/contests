    Codeforces dashboard of the contest "OCPC 2025" in the private group ACPC Scientific Committee Archive, marked Finished and open for practice. It lists 11 problems A to K, from "Game" to "Another Bracket Sequence" (A and I are both called "Game"), each with standard input and output, a time limit of 1 to 3 seconds, 256 MB of memory and the number of participants who solved it, from 118 for K to 238 for A. A sidebar lists other contests of the group, among them "OCPC 2025 (Qualification)" and "Oman Collegiate Programming Contest 2026", and the page offers virtual participation. The questions table is empty, and the links to standings, submissions and the complete problem set lead outside our copy, which holds no style sheets or images.
