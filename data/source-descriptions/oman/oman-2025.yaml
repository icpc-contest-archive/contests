  rubric: 1
  copy: oman/oman-2025/website/2026-11-15-live-0995dcf2
  title: Oman Programming Contest 2025 Concludes with Strong Competition
  language:
  - en
  description: |-
    News item of the Ministry of Transport, Communications and Information Technology, published 10 April 2025, on the conclusion of the Oman Collegiate Programming Contest 2025. It says the contest was organised by the Ministry with Sultan Qaboos University, the University of Technology and Applied Sciences, the Programming Academy and technical partner OQ; that 194 contestants in 65 teams from 21 universities and colleges took part in a five-hour contest; and that OMR 6,750 was awarded to top performers. It reports regional preliminary contests held for the first time in Sohar, Nizwa and Muscat.

    The item names the top three teams: Enigma and Libre, both of Sultan Qaboos University, and Al-Istiqama of the German University of Technology in Oman, with the members of each team. The rest is statements by officials. No scoreboard or problems. The page is wrapped in the ministry site's menus and footer.
- url: https://ocmt.odoo.com/blog/news-and-activities-1/the-codebreakers-qualify-for-ocpc-2025-finals-387
  read: '2026-11-16'
  rubric: 1
  copy: oman-coastline/oman-coastline-2025/web-mirror/20261023-live-bad18d5e/page.html
  title: The Codebreakers Qualify for OCPC 2025 Finals!
  language:
  - en
  contest_date: '2025-04-09'
  description: |-
    Blog post of the Oman College of Management and Technology, dated 11 March 2025, announcing that its team The Codebreakers qualified for the final round of the Oman Collegiate Programming Contest (OCPC) 2025, to be held at Sultan Qaboos University on 8 and 9 April 2025. It gives the final's schedule as a practice contest on 8 April, the actual competition on 9 April, and a closing ceremony, and quotes a college staff member.

    Written before the final: no results, problems or other teams. The page is wrapped in the college site's menus and a monthly archive list.
