  title: The University of Nizwa participated in the event of the 8th Oman Collegiate Programming Contest.
  language:
  - en
  description: |-
    News item on the University of Nizwa website, in English, reporting that the university's Computer Science department entered three teams in the 8th Oman Collegiate Programming Contest (OCPC2021), held at Sultan Qaboos University on 5-6 November 2021. It describes the contest as the official national contest under ICPC supervision, says that it qualifies 4 teams for the Arab and Africa Collegiate Programming Championship in Egypt in the first week of December 2021, gives a short general description of the ICPC, and says in one sentence that the students said the participation gave them a great experience. It gives no results or team list.

    The copy is the full page including the university's site menus.
