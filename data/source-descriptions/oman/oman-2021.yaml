  description: |-
    Standings of the 2021 ICPC Oman Collegiate Programming Contest (OCPC): 30 teams with rank, team name, institution, number of problems solved, total time and a citation. Ranks run from 1 to 29 (two teams share rank 20). The first 15 teams carry a citation from First Place to Fifteenth Place; the other 15 are cited as Honorable Mention. Syntax Error of Sultan Qaboos University is first with 5 solved and a time of 516. There is no per-problem detail and no number of attempts.
