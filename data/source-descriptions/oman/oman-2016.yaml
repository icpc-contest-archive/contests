  description: |-
    Standings of 38 teams, rendered from the ICPC public API archive (OCPC, ICPC year 2017) and not a page of the organisers. Each row gives rank, team name, institution, number of problems solved, total time and a citation. IO-team of Sultan Qaboos University is first with two problems solved in 38 minutes, followed by The 3Coders of the same university and Matrix of Caledonian College of Engineering.

    The first 19 places carry a place name from First Place to Nineteenth Place; the other 19 teams are listed as Honorable Mention, at ranks 20 to 23 and, for the 15 teams with no problem solved, all at rank 24. There is no per-problem detail, and the page does not give the contest date or place.
