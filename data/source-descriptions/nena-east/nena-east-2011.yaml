  description: |-
    Problem set as plain-text files printed together: a PDF of 19 pages. The first page is a problems index, dated 8 October 2011, headed BOSPRE 2011 PROBLEMS, listing eight problems in approximate order of difficulty, easiest first, each with a one-line teaser and the label "Boston Preliminary 2011". The problems are sniffer, vlsicompact, relativeneighbor, boolecipher, delaunay, boolebreak, opttriangulation and abduction; they carry no letters.

