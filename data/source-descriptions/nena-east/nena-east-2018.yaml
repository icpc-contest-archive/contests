  description: |-
    Final scoreboard of BOSPRE 2018, a plain-text page: 30 teams in rank order, each with a cell for each of ten problems and a total in the form solved/penalty. The problems are labelled by short names (alignment, driving, dropstick, flowsecur, goodpath, maxparall, overlap, permutati, positive, walls), not letters. A solved cell gives the solve time and a number after a slash; an unsolved cell with attempts shows dots and a number. MIT NULL is first with 10 solved. Below the board, a list headed 'There were 31 teams from 15 schools' names every team under its school; the one team that solved nothing is in that list only.
