  title: ACM Boston Preliminary (BOSPRE 2018) Programming Contest Home Page
  language:
  - en
  description: |-
    Home page of the ACM Boston Preliminary (BOSPRE 2018) Programming Contest, in English. It announces that the contest is over and links the scoreboard and the problems, each as a page and as a PDF. It links a description of the scoreboard format and explains the scoring that replaced time on the board after the contest (100 points per solved problem, multiplied by 0.95 for each earlier incorrect submission). It names the University of Connecticut, Brandeis University, the University of Rhode Island and Providence College as the host sites, with a photo for each, and Harvard as provider of judging and problems. It also gives contact details for hosting 2019, notes that the Northeastern Region contest is run by the Rochester Institute of Technology, and links the pre-contest page and last year's BOSPRE 2017 page.

    Our copy holds this one page with its images and style sheet; the pages it links to are not part of it.
