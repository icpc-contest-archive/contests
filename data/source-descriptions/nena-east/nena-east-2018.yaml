  pages: 28
  description: |-
    Problem set of BOSPRE 2018 as a PDF of 28 pages, printed from plain-text files. It opens with an index of ten problems, each with a one-line tagline, named by short word: permutation, positive, goodpath, dropstick, alignment, maxparallel, flowsecurity, driving, overlap and walls; the problems have no letters. Each of the ten has its own statement in English with a sample input and output. The index notes that generate programs were introduced this year for many problems, that the problems are in approximate order of difficulty, easiest first, and that Python is fast enough for the first six. No test data or solutions.
