    Problem set as plain-text files printed together: a PDF of 18 pages. The first page is a problems index, dated 10 October 2012, headed BOSPRE 2012 PROBLEMS, listing seven problems in approximate order of difficulty, easiest first, each with a one-line teaser and the label "Boston Preliminary 2012". The problems are spoonerisms, fractals, pagerank, lambdadev, gorillatoe, anglepuzzle and broppers; they carry no letters.

