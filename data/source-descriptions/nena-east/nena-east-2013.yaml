  description: |-
    Problem set as plain-text files printed together: a PDF of 25 pages. The first page is a problems index, dated 15 October 2013, headed BOSPRE 2013 PROBLEMS, listing eight problems in approximate order of difficulty, easiest first, each with a one-line teaser and the label "Boston Preliminary 2013". The problems are soundex, transition, pulleys, crates, onlinestring, localcolor, eulerian and polyellipse; they carry no letters.

    Pages 2 to 25 hold the statements, one text file per problem, in English (soundex 3 pages, transition 5, pulleys 2, crates 3, onlinestring 3, localcolor 4, eulerian 2, polyellipse 2). The statements include sample data. No test data or solutions.
