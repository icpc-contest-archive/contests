  - en
  description: |-
    Website of the ACM Boston Preliminary (BOSPRE 2015) Programming Contest, in English. Our copy holds 2 pages. The home page states that BOSPRE 2015 is over and links the scoreboard (page and PDF), a description of the scoreboard format, the problems (page and PDF), the pre-contest page and the 2014 page. It names three host sites for teams, UMass Boston, Bridgewater State University and Brandeis University, with Harvard providing judging and problems over the net. It adds that judge's input, solutions and output are on a private page for contestants, that Harvard plans to provide judging every year with other schools hosting teams, and that the Northeastern Region contest is run by Rochester Institute of Technology.

    The second page is the problem descriptions index, listing nine problems (asciiart, latin, mirrors, modcalc, reflect, reversedraw, trends, vigenere, xmole), each with a statement text file, a Makefile, sample.in and sample.test. The scoreboard, the PDFs and the linked problem files are not part of our copy.
