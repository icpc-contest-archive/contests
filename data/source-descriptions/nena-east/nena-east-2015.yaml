  description: |-
    Problem set as plain-text files printed together: a PDF of 24 pages. The first page is a problems index, dated 11 October 2015, headed BOSPRE 2015 PROBLEMS, listing nine problems in approximate order of difficulty, easiest first, each with a one-line teaser and the label "Boston Preliminary 2015". The problems are asciiart, modcalc, vigenere, mirrors, trends, xmole, latin, reflect and reversedraw; they carry no letters.

    Pages 2 to 24 hold the statements, one text file per problem, in English (asciiart 2 pages, modcalc 2, vigenere 3, mirrors 3, trends 2, xmole 3, latin 2, reflect 3, reversedraw 3). The statements include sample data, some of it only by reference to a sample file that is not in the PDF. No test data or solutions.
