    Final scoreboard of BOSPRE 2019 as a PDF of 2 pages: 26 teams in rank order, each with a cell for each of eleven problems and a total in the form solved/penalty. The problems are labelled by short names (annual, bubblegra, collatz2, convexpai, cuneiform, flowman, jmaze, railgun, treesearc, trisurvey, whoosh), not letters. A solved cell gives the solve time and a number after a slash; an unsolved cell with attempts shows dots and a number. MIT NULL is first with 11 solved. Below the board, a list headed 'There were 26 teams from 14 schools' names every team under its school.
