  problems: 11
  pages: 42
  description: |-
    Problem set of BOSPRE 2019 as a PDF of 42 pages, printed from plain-text files. It opens with an index of eleven problems, each with a one-line tagline, named by short word: cuneiform, collatz2, bubblegram, annual, convexpainter, jmaze, treesearch, whoosh, flowman, railgun and trisurvey; the problems have no letters. Each of the eleven has its own statement in English with a sample input and output; the statements for treesearch and flowman run to three pages. The index says the problems are in approximate order of difficulty, easiest first, and that Python is fast enough for the first seven. No test data or solutions.
