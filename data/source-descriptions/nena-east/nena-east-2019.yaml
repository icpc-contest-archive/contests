  title: ACM Boston Preliminary (BOSPRE 2019) Programming Contest Home Page
  language:
  - en
  description: |-
    Website of the Harvard Computing Contest Club (HC3), in English, with a section for the ACM Boston Preliminary (BOSPRE) contest. Our copy holds 150 files, 94 of them pages. The BOSPRE section has the 2019 home page, which says the contest is over, names the University of Connecticut, Stonehill College, the University of Rhode Island and Providence College as host sites, and links the scoreboard and the problems, each as a page and as a PDF; it also has the 2019 rules, an annotated index of the 2019 problem files, help pages for contestants, host-site and facility pages, and a manager section. Some captures in our copy are of the 2018 version of the home page and problem index.

    The site also holds the BOSPRE home pages of 2016, 2017 and 2018, scoreboard PDFs for 2014 and 2016 to 2019, problem PDFs for 2016 to 2019, and pages of the Club itself: ACM and ICPC team selection, schedules, members, links, a photo album and prize contests. The Club's front page in our copy still announces the 2018 dates. Several problem data files linked from the problem pages were not fetched.
