  description: |-
    Problem set as plain-text files printed together: a PDF of 26 pages. The first page is a problems index, dated 12 October 2010, headed BOSPRE 2010 PROBLEMS, listing seven problems in approximate order of difficulty, easiest first, each with a one-line teaser and the label "Boston Preliminary 2010". The problems are escape, lexemes, bezier, congruent, escape2, plans and penrosetiling; they carry no letters.

