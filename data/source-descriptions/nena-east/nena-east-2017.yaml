  description: |-
    Problem set of BOSPRE 2017 as a PDF of 31 pages, printed from plain-text files. It opens with an index of ten problems, each with a one-line tagline, named by short word: gmail, friends, clockskew, spacetravel, senplosion, trimare, separation, energy, tourbets and simplepoly; the problems have no letters. Each of the ten has its own statement in English with a sample input and output. The index says the problems are in approximate order of difficulty, easiest first, and that Python is fast enough for the first six. No test data or solutions.
