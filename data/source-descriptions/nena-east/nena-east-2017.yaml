  description: |-
    Home page of the ACM Boston Preliminary (BOSPRE 2017) Programming Contest, in English. It announces that the contest is over and links the scoreboard and the problems, each as a page and as a PDF. It links a description of the scoreboard format and explains the scoring that replaced time on the board after the contest (100 points per solved problem, multiplied by 0.95 for each earlier incorrect submission). It names MIT, the University of Connecticut and Brandeis University as the host sites and Harvard as provider of judging and problems. It also gives contact details for hosting 2018, notes that the Northeastern Region contest is run by the Rochester Institute of Technology, and links the pre-contest page and a page it calls last year's BOSPRE 2015 page.

    Our copy holds this one page only; the pages it links to are not part of it.
