  description: |-
    Home page of the ACM Boston Preliminary (BOSPRE 2014) Programming Contest, in English, as it stood after the contest; our copy holds this one page. It announces that BOSPRE 2014 is over and links the scoreboard (also as PDF), a description of the scoreboard format and the problems (also as PDF), and a separate continuation scoreboard for an untimed continuation of the contest in which teams keep solving the problems with the autojudge. It says the contest was a cooperative effort in which Wellesley and UMass Boston hosted the teams and Harvard provided judging and problems over the net, and it mentions plaques for the winning teams going to the regionals, practice facilities and a regionals practice contest.

    None of the linked pages and files are in our copy, nor are the two photos of the host sites' science centers or the style sheet. No results, team list or problems are on the page itself.
