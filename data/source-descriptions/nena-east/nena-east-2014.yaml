  description: |-
    Final results of BOSPRE 2014 as a plain-text board dated Saturday 18 October 2014, 15:00 EDT. It lists 25 teams in rank order, one two-line entry per team: the team name, one cell for each of the eight problems (binshuffl, gamedraw, grid, markov, shopsign, simplefsm, thue, unitcalc; named, not lettered) and, on the second line, solved count and total time. A solved cell gives the time of the accepted run and the number of attempts; an unsolved cell shows dots, followed by the number of attempts when there were any. MIT 3 is first with 6 solved.

    A note under the board says there were 27 teams from 10 schools and lists the teams by school; two of the Fitchburg teams in that list, FalconBeta and FalconDelta, do not appear on the board.
