  description: |-
    Problem set as plain-text files printed together: a PDF of 26 pages. The first page is a problems index, dated 13 October 2014, headed BOSPRE 2014 PROBLEMS, listing eight problems in approximate order of difficulty, easiest first, each with a one-line teaser and the label "Boston Preliminary 2014". The problems are binshuffle, shopsign, simplefsm, gamedraw, thue, grid, unitcalc and markov; they carry no letters.

    Pages 2 to 26 hold the statements, one text file per problem, in English (binshuffle 2 pages, shopsign 3, simplefsm 4, gamedraw 3, thue 3, grid 4, unitcalc 3, markov 3). The statements include sample data. No test data or solutions.
