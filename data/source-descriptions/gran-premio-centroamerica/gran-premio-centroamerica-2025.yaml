  description: |-
    Standings of the 2025 Gran Premio de Centroamérica: 88 teams with rank, team, institution, problems solved, time, medal, citation and site citation. The table is headed with the contest name, ICPC year 2026 and the number of teams. The top score is 24 problems solved; 13 teams solved none.

    The medal column gives an ordinal place label (first place and so on) to 44 teams and "honorable mention" to the other 44, and the ranks run up to 76. Nine teams have a site citation naming them the first, second or third team of Costa Rica, Guatemala or El Salvador. There are no per-problem results and no number of attempts.
