  description: |-
    Results page of the ICPC Centroamérica website, in Spanish, with a year selector for 2026 and 2025. Our copy holds the tables of both years. For 2025 there is a summary by country and university (31 teams from Costa Rica, 36 from Guatemala, 28 from El Salvador) and a table headed "Clasificatorio Detallado por Equipos 2025" ("Detailed qualifier by teams 2025") with 95 teams.

    Each team row gives rank, country, university, team name, a column headed C that is marked x for 43 teams, total problems solved, and penalty in minutes, followed by problems solved and penalty for each of Fecha 1 to Fecha 4 ("Fecha" means date) and for the Repechaje (repechage), which has values for 26 teams. There is no per-problem detail. A legend explains that green marks teams that qualified and aqua marks teams that qualified through the Repechaje. The qualifier tables for 2026 (124 teams) are on the same page.
