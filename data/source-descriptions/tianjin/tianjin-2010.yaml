  description: |-
    Problem statement of 5034, Jewel, as a two-page PDF in English with the line "Asia - Tianjin - 2010/2011" under the title. A chain of beads grows to the right, and four operations are processed: Insert, Query_1 (k-th smallest between two positions), Query_2 (rank of a size) and Query_3 (k-th smallest size overall). For each case the output is a line "Case T:" followed by the sums of the results of the three query kinds. It has the input and output format, an explanation of the sample and a sample of one case with 10 operations. It ends with the line "Tianjin 2010-2011".
