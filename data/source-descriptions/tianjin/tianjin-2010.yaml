  description: |-
    Problem statement of 5026, Building Roads, as a one-page PDF in English with the line "Asia - Tianjin - 2010/2011" under the title. A country has N cities joined by N - 1 roads so that all are connected, and one road may be moved to join two other cities with its length unchanged; the task is to make the farthest distance between any two cities as small as possible and print it as "Case k: value". It has the input and output format and a sample of two cases. It ends with the line "Tianjin 2010-2011".
