  description: |-
    Problem statement of 5027, Card Game, as a one-page PDF in English with the line "Asia - Tianjin - 2010/2011" under the title. N cards each hold a string and are stuck into circles; the score of sticking two cards is the longest common prefix of the second card and the reverse of the first, and the task is to print the best total score. It lists the six possible stickings of a three-card example, then gives the input and output format and a sample of two cases. It ends with the line "Tianjin 2010-2011".
