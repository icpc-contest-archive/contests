  description: |-
    Problem statement of 5028, Delta Wave, as a two-page PDF in English with the line "Asia - Tianjin - 2010/2011" under the title. The statement opens with a quotation about delta waves from Wikipedia, then asks for the number of polygonal lines from (0, 0) to (N, 0) that move only to the right, up, down or straight, and never dip below the y = 0 axis; the answer is printed modulo a bound given in the statement. It has a picture below the sentence announcing 9 waves for N = 4, the input and output format and a sample of two values of N. It ends with the line "Tianjin 2010-2011".
