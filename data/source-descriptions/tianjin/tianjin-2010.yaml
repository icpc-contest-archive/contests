    Problem statement of 5032, Hyperspace Travel, as a two-page PDF in English with the line "Asia - Tianjin - 2010/2011" under the title. Asteroids each produce a circular gravity area, and a position's abnormality value is the number of areas covering it; the task is to fly from a start to a destination along the boundaries of the areas so that the difference between the largest and smallest abnormality value on the path is minimal, or to print -1 if the destination cannot be reached. It has the input and output format and a sample of two cases. It ends with the line "Tianjin 2010-2011".
