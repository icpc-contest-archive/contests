  description: |-
    Problem statement of 5031, Graph and Queries, as a three-page PDF in English with the line "Asia - Tianjin - 2010/2011" under the title. An undirected graph with vertex weights is processed through operations to delete an edge (D), to query the K-th maximum weight among the vertices connected with a vertex (Q), to change a vertex weight (C) and to end the case (E); the task is to print the average answer of all queries. It has the input and output format, a step-by-step explanation of the first sample and a sample of two cases, with output rounded to six decimals. It ends with the line "Tianjin 2010-2011".
