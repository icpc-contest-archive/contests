  description: |-
    Problem statement of 5029, Encoded Barcodes, as a two-page PDF in English with the line "Asia - Tianjin - 2010/2011" under the title. Each character of a product query is given as eight bar widths, the wider bar meaning 1 and the narrower 0, with measurement error up to 5 percent; the task is to decode each query to a string and print, summed over the queries, the number of product names that start with it. It has the input and output format, an explanation of the sample and one sample case. It ends with the line "Tianjin 2010-2011".
