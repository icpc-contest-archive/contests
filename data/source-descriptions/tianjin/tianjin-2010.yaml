  description: |-
    Problem statement of 5030, Farm, as a two-page PDF in English with the line "Asia - Tianjin - 2010/2011" under the title. Farmer John steals vegetables from a neighbour whose dog gains anger with each theft; the delay of the j-th theft is j times its initial delay, refreshing the page resets the anger and the count, and the total time is limited. The task is to print the lowest possible maximum anger value, or "I have no idea" when the time is not enough. It has the input and output format, an explanation of the first two samples and a sample of three cases. It ends with the line "Tianjin 2010-2011".
