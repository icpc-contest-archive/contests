  description: |-
    Website of the Kuwait Collegiate Programming Contest (KCPC) as a series, in English, not of the 2017 edition alone. Its pages are a welcome page describing KCPC as an annual multi-tier team contest whose winners qualify for the Arab regional contest, an About page (five-hour contest, teams of three, one computer per team, Linux, C, C++ or Java, about ten problems, judging against secret tests), a KCPC Team page, a Gallery, a Contact form and a History page.

    The History page lists the editions 2014 to 2017 with host, number of official and unofficial teams and the names of the winning teams. For KCPC-2017 it gives Gulf University for Science and Technology as host, 25 official teams, 2 unofficial teams and 13 winners and qualified teams, from NameLess first to KTech Aimers. The Gallery holds one post for each of the years 2014 to 2017, with photos and slideshows.

    Our copy holds 118 files, of them 16 distinct pages (47 page addresses, as most pages are also reached under share-link and punctuation variants), plus style sheets, scripts and 30 image files. The KCPC Team page has no content in our copy.
