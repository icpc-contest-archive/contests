  description: |-
    Final standings of the 2017 Kuwait Collegiate Programming Contest: 27 teams with rank, team, institution, number of problems solved and total time, and a Citation column. The first 13 teams carry citations First Place to Thirteenth Place and the other 14 are listed as Honorable Mention. The teams come from five institutions: Arab Open University - Kuwait, Gulf University for Science and Technology, American University of Kuwait, Kuwait Technical College and Kuwait University. First is NameLess of Gulf University for Science and Technology with seven problems solved and a time of 707. No per-problem detail.
