  description: |-
    News item on the website of the American University of Kuwait (AUK) about the 14th Kuwait Collegiate Programming Contest, KCPC 2026, held on 22 and 24 October 2026 and organized by AUK's College of Engineering and Applied Sciences. It states that 47 teams with 141 students and 22 coaches from 10 universities in Kuwait took part, lists the universities, says the contest lasted five hours and followed the ICPC format, and gives the top three teams: first Critical Path and third init1, both from Arab Open University, and second Sharks from Kuwait Technical College. No other places or per-team results are given.

    The page also carries quotes from the contest director and the dean of the college and a short history of the contest since 2010. Our copy holds the article page with its site menus and a list of related news.
