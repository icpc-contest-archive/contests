  description: |-
    Website of the Kuwait Collegiate Programming Contest (KCPC), a WordPress site in English. The home page is a short welcome saying KCPC is an annual team contest between universities and colleges in Kuwait whose winners qualify for the Arab regional contest. The About page gives the rules: five hours, teams of three, a single computer per team, Linux, C, C++ or Java, about ten problems, ranking by problems solved and penalty. The History page lists the earlier contests of 2014 to 2017 with the host university, the number of official and unofficial teams, and the qualified teams. The Gallery page and four posts, one each for KCPC 2014 to 2017, hold images only. The KCPC Team page holds only an under-construction image and the Contact page is a comment form.

    Our copy holds 47 pages, many of them the same page at variant addresses, with style sheets, scripts and 30 images. Nothing in it is about a 2018 contest.
