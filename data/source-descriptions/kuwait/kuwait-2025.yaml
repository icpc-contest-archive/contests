  title: «الأمريكية» تنظم مسابقة الكويت للبرمجة للجامعات
  title_en: The American University organises the Kuwait programming contest for universities
  language:
  - ar
  description: |-
    News article in Arabic in the Kuwaiti newspaper Al-Jarida, published on 27 October 2025 under the title «الأمريكية» تنظم مسابقة الكويت للبرمجة للجامعات ("The American University organises the Kuwait programming contest for universities"), with a photo of the three winning teams. It reports that the American University of Kuwait (AUK) hosted KCPC 2025 on 16 and 18 October, organised by its College of Engineering and Applied Sciences, and that 44 teams from nine Kuwaiti universities took part; it names the nine universities, the programming languages used and the five hours of the contest, and recalls that the contest began at AUK in 2010.

    It gives the first three places with team, institution and problems solved: Strike Force of the Arab Open University with seven, BitByBit of AUK with six and Watermelons of the Kuwait College of Science and Technology with five. It also quotes the organisers, names Sultan Center and Boubyan Bank as sponsors, and says the winners will represent Kuwait at the Arab and African regional contest in Luxor, Egypt, on 12 to 16 December 2025.
