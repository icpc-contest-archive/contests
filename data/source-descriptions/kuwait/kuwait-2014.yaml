    Final standings of the 2014 Kuwait Collegiate Programming Contest: 16 teams with rank, team name, institution, problems solved, total time and a citation. First place is CodeZilla of Arab Open University - Kuwait with 3 problems solved and a time of 327. Places 1 to 8 carry the citations First Place to Eighth Place and the rest are marked Honorable Mention; the last two teams solved nothing. Teams come from five institutions: Arab Open University (Kuwait and Bahrain branches), Gulf University for Science and Technology, Kuwait University and Sultan Qaboos University. There is no per-problem detail.
