- url: http://www.icpckolkata.in
  read: '2026-11-16'
  rubric: 1
  copy: kolkata/kolkata-2015/website/2026-09-05-wayback-bd90008d
  title: ACM-ICPC
  language:
  - en
  description: |-
    Website of the ACM ICPC Asia Region Kolkata Site contest of 2015, hosted by the National Institute of Technical Teachers' Training and Research (NITTTR), Kolkata. The 2015 section has four pages: a home page that announces the winner and gives the important dates (registration from 20 August 2015, preliminary contest on 31 October 2015, site contest on 25-26 December 2015); a People page naming a patron, an honorary co-chair, the contest director and coordinators; a Contact page; and a Registration page describing the two-step registration, marked as over. The home page links four PDFs that are in our copy: the onsite result, the preliminary online contest result, the onsite problem set and the contest director's report.

    The same address later carried the 2016, 2017 and 2018 contests, and our copy holds pages of those: for 2016 an announcement, registration, important dates, preliminary rules and team lists; for 2017 (Kolkata-Kanpur site) PDFs with results, the onsite problem set and a director's report; for 2018 selected teams, a wait list, the preliminary and onsite results, how to reach the two centres and a program schedule. It also holds a default CMS Made Simple home page and bank-details and travel-details forms.

    Our copy holds 150 saved files, 109 of them pages or documents; many are saved under two addresses.
