  description: |-
    Problem set of the onsite contest as handed out, a PDF of 27 pages in English. The cover reads "The 2015 ACM ASIA Region Programming Contest, Kolkata Site, Onsite Contest Problems", sponsored by IBM, hosted by NITTTR Kolkata, 26th December 2015, 11 Problems. An instruction page follows (eleven problems in five hours, submission through the CodeChef platform, ranking and penalty rules, 25 pages of printed material allowed), then eleven problems with codes KOL1501 to KOL1511. Each has a statement, input and output format, at least one example with explanation, a time limit, a source limit and the allowed languages (C, C++14, JAVA). No test data or solutions.
