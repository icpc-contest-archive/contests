  description: |-
    Final standings of the 2015 ACM-ICPC Asia Kolkata Regional Contest: 60 teams with rank, team name, institution, number solved, time and citation. Ranks 1 to 58 are given: 30 teams carry a place citation from First Place to Thirtieth Place and 28 are marked Honorable Mention. Two further teams at the end have no rank, 0 solved and the citation Absent. First place is FacelessMen of Indian Institute of Technology - Kanpur with 8 solved and time 901; a second team also solved 8. No per-problem results are given.
