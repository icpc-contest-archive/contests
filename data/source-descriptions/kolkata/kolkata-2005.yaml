  description: |-
    Results page for the Kolkata site contest from the ACM website of IIT Kanpur, headed "Results of Kolkata Site Contest". A table of 24 ranked teams gives rank, institute name, team name, number solved and time; the top team, SPUTNIK from Indian Institute of Technology Bombay, solved 5 with time 818. Below it are two unranked lists of team and institute names: 19 teams under "Honorable Mention for the Kolkata Site Contest" and 24 under "Honorable Mention for the Preliminary Online Contest". No per-problem results.

    The page was saved from Microsoft Publisher 11. Its seven images point to files on a local Windows disk and are not in our copy. Navigation is an image map linking to eight other pages of the same site and to its index; none of them is part of this source.
