  contest_date: '2005-10-29'
  teams: 45
  description: |-
    Standings page headed "The 2005 ACM Asia Programming Contest - Kolkata sponsored by IBM", with three tables of teams with institution and team name. The Final Round table (Asia-Kolkata On Site Contest, 10/29/2005) lists 45 teams: 24 ranked from First Place to Twenty-fourth Place, each with the number of problems solved and the total time, and 21 more teams marked Honorable Mention without rank, solved count or time. First place is Indian Institute of Technology Bombay with 5 solved and time 818.

    Two preliminary tables follow. The Asia Preliminary Internet Kolkata Site table (9/17/2005) lists 90 teams, 38 marked Qualified and 52 Honorable Mention. The Asia-Foreign Team Kolkata Registration Site table (10/29/2005) lists 15 teams, 8 marked Qualified and 7 Honorable Mention. The preliminary tables carry no solved counts or times, and no per-problem results appear anywhere on the page.
