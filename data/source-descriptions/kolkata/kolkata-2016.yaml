  description: |-
    Ranking of the onsite contest as published on the Kolkata site's own website, a page titled "Result of Onsite Contest": 92 teams in rank order from 1 to 92 with team name and institution. First place is Rocket of Indian Institute of Technology - Bombay. There are no solved counts, times or problem results. The page carries the site's menu and links to neighbouring posts, which lead to pages outside this single document.
