  description: |-
    Final standings of the 2016 ACM-ICPC Asia Kolkata Regional Contest: 92 teams ranked 1 to 92 with team name, institution, number solved, time and citation. The top 18 carry place citations from First Place to Eighteenth Place, and the other 74 are marked Honorable Mention. First place is Rocket of Indian Institute of Technology - Bombay with 10 solved and time 109004; the fewest solved is 2. No per-problem results are given.
