  copy: kolkata/kolkata-2016/website/2026-09-05-wayback-37b694c0
  title: ACM ICPC Asia Region Kolkata Site 2016
  language:
  - en
  description: |-
    Website of the ACM ICPC Asia Region Kolkata Site 2016 contest, in English, organised jointly by the National Institute of Technical Teachers' Training and Research (NITTTR), Kolkata and JIS University, with the onsite round at Guru Nanak Institute of Technology Campus, Kolkata. The home page gives an announcement of the contest, the preliminary online contest of 22 October 2016, registration until 19 October 2016, sponsors, the list of selected teams and the onsite result table. The 2016 pages in our copy include a list of 100 teams selected for the onsite round, a list of 344 registered teams, preliminary rules, important dates (the onsite contest rescheduled to 26-27 December 2016), registration, people and contact pages, a note on printed material, a notice on a travel reimbursement scheme, a page for the Asia director's blog, and the onsite result with 92 teams. The home page links onsite problems and a director's report, which are not in our copy.

    The same address was reused for later contests, and our copy also holds pages and files of 2015, of the 2017 Kolkata-Kanpur site (a results PDF, an onsite problem set of 26 pages, a director's report) and of the 2018 Kolkata-Kanpur site (teams selected, wait list, program schedule, how to reach, result of the onsite round).

    Our copy holds 150 saved files, of which 118 are pages or documents; many are saved under two addresses.
