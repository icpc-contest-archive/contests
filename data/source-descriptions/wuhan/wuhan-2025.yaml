  description: |-
    Contest page on QOJ headed "The 4th Universal Cup. Extra Stage 2: Wuhan", with the line "The contest is also known as: The 2025 ICPC Asia Wuhan Regional Contest". It is filed under ICPC / Regionals / Asia East Continent (both the 2025 Asia East Regionals and Wuhan) and under Universal Cup / The 4th Universal Cup. It lists thirteen problems A to M, from Planting Trees and 77G Network to ICPC and Kingdom of Construction, each linked to its problem page. A side panel marks the contest as ended, gives the ICPC ruleset, a penalty of 20 minutes and a scoreboard frozen after 4:00:00, offers a virtual contest, and under Attachments links "Statements (en)", "Statements (zh-cn)" and "Tutorials (zh-cn)". The notice board and the question lists are empty. The problem pages, standings and attachments are not in our copy.
