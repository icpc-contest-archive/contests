  copy: wuhan/wuhan-2025/editorial/20261123-live-564715d6/tutorials_zh-cn.pdf
  title: 2025 国际大学生程序设计竞赛 亚洲区域赛（武汉） 题目讲解
  title_en: '2025 International Collegiate Programming Contest Asia Regional (Wuhan): Problem Explanations'
  language:
  - zh
  problems: 13
  pages: 66
  description: |-
    Editorial as a slide deck of 66 pages in Chinese, titled 2025 国际大学生程序设计竞赛 亚洲区域赛（武汉） 题目讲解 (2025 Guójì Dàxuéshēng Chéngxù Shèjì Jìngsài Yàzhōu Qūyùsài (Wǔhàn) Tímù Jiǎngjiě, "2025 International Collegiate Programming Contest Asia Regional (Wuhan): Problem Explanations"). The cover names Lin Kai (林恺) of the 黑冰茶命题组 (Hēibīngchá mìngtízǔ, "Black Ice Tea problem-setting group") as author and is dated 2 November 2025; the footer of every slide after the cover repeats author, contest name, that date and the page number.

    It covers all thirteen problems, grouped as easy (F, E, M), medium (C, H, K, A, B) and hard (G, I, L, D, J), each with its letter and a Chinese name. For each problem a first slide restates the task and one to six more slides give the solution; problem I has two slides of proofs and L and J end on a slide on complexity. There is no code.
