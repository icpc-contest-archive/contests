  pages: 15
  description: |-
    Problem set as a PDF of 15 pages in English, headed The 2025 ICPC Asia Tehran Regional Contest on each page. It holds twelve problems A to L, from A (Rayan) and B (MicroMasters) to K (Mini Spreadsheet Engine) and L (Modular Fortress). Each problem has a statement with input and output sections and an example with standard input and output; problems E, K and L run to two pages, and figures appear on pages 1, 7 and 14. The first page starts directly with problem A: there is no cover page and no judging notes.
