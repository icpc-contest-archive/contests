    Scoreboard page titled The 2025 ICPC Asia Tehran Regional Contest - Scoreboard, headed Standings: 86 teams, each shown as a row with rank, institution logo, team name, institution, a chip for each of the twelve problems A to L, and solved count with total time. A problem chip shows the letter when the team did not try it and attempts and time when it did; solved chips are coloured, with eleven marked as first solves. Ranks run to 62 with ties; one team at the bottom, ranked 62, solved no problem. No medals are shown.

    The team rows are data inside the page that a script turns into the display; the script and style files are in our copy, but the institution logos are not.
