  read: '2026-11-16'
  rubric: 1
  copy: tehran/tehran-2025/website/2026-09-05-wayback-da4746d0
  title: ICPC, Asia Region, Tehran Site
  language:
  - en
  description: |-
    Website of the 2025 ICPC Asia Tehran Regional Contest, in English, with the Department of Computer Engineering of Sharif University of Technology named in its footer. The front page announces the 26th Asian Regional Contest in Iran on 25-26 December 2025 and an online regional contest on 12 November 2025, with links to the scoreboard and the problems. Other pages give the registration steps (a limit of 80 teams for the site), general information, the committees, contact details, a page for the online contest, a schedule page, and an archive of the Tehran regional contests from 1999 to 2024 (no 2021 entry) and of internet contests from 2002 to 2007, with links to standings, problems, test cases and photos.

    The site also holds the contest's scoreboard (86 teams, problems A to L), the 15-page problem set PDF of the regional contest with 12 problems, the scoreboard and the 11-page problem set PDF of the online contest (with a 12-page Persian version of the problems), a two-page PDF of team quotas per institution, and two one-page posters.

    Our copy holds 29 files, 18 of them saved pages and documents; two of those, the internet-contest page and a TD25.pdf address, are "Not found" pages. The schedule page shows only a heading, because its schedule image (docs/Schedule.png) is not in our copy.
