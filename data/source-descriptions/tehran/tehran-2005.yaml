    Problem 7286, "Ancient Keyboard", on the Baekjoon Online Judge, with the site's interface in Korean and the statement in English. The page gives a time limit of 1 second and a memory limit of 128 MB, the full statement with input and output sections, one sample input with its output, and a source line crediting it to ICPC > Regionals > Asia West Continent > Iran > Tehran Site 2005 as problem A. The task: simulate a device whose keys toggle LEDs, writing on a tape at each time step the letter whose position in the alphabet equals the number of LEDs on.
