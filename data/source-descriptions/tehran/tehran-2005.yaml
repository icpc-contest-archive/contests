  title: ACM International Collegiate Programming Contest - Asia Region, Tehran Site
  language:
  - en
  description: |-
    Website of the 30th ACM International Collegiate Programming Contest, Asia Region, Tehran Site, hosted by Sharif University of Technology, in English. Our copy holds 20 pages. The front page announces the contest for 1-2 December 2005 and links the problem set, a test data archive, the final ranking, photos and a Persian-language contest blog; it also announces the 3rd Iran Internet Programming Contest of 29 September 2005. Further pages cover registration, contest information, people and committees, local contests, supporters, contact details, an archive of past Tehran contests (2004 back to 1999) and links. The news and schedule pages show only their headings: their content is commented out in the page source.

    Inside our copy are the problem set as a PDF of 15 pages, a team roster as of 29 September 2005 with 178 team entries (four of them under a heading for foreign teams), the contest scoreboard with 74 teams and problems A to J, the full-info standings, a page headed Tehran Site, Dec. 2, 2005 with the letters A to J, a standings page of the Iran Internet Programming Contest with 19 teams and problems A to H, and a 3-page regulations PDF linked from that contest's entry.

    The test data archive linked from the front page is not in our copy.
