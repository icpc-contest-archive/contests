- url: https://icpc.ir/2012/
  read: '2026-11-16'
  rubric: 1
  copy: tehran/tehran-2012/website/2026-09-05-wayback-8ae208c6
  title: ACM ICPC, Asia Region, Tehran Site
  language:
  - en
  description: |-
    Website of the Tehran site of the 2012 Asian regional contest, in English, with the footer of the Department of Computer Engineering, Sharif University of Technology. The front page announces the 37th ACM International Collegiate Programming Contest, 14th Asian Regional Contest in Iran, 20-21 December 2012, with dated news items (registration deadline, the contest schedule, the 10th Iran Internet Programming Contest of 6 December 2012). Further pages give contest information, registration steps and fee, the organizing committee, contact details, the schedule (a link to a Persian version) and an archive page listing past Tehran regional contests from 1999 to 2011 and older internet contests.

    Our copy holds 146 files, of which 20 are pages: the scoreboard (83 teams, last updated 13:40 on 21 December 2012), the regional problem set as a PDF of 12 pages, a one-page schedule PDF in Persian, a PDF of 8 pages with the problems of the internet contest, five photo album pages (Before Contest, Openning Ceremony, Practice Contest, Closing Ceremony, After Contest; the photo index also lists a 2012 Final Contest album whose page is not in our copy) and the site pages. The rest are 114 photo thumbnails, style sheets, two images (a header and a logo), a slide file (pptx) for the internet contest and a truncated zip archive of test data.

    The links on the archive page lead to pages outside our copy. The album pages list 153 pictures but only 114 thumbnails were saved; the full-size photos, the front-page poster and the supporters' logos are not in our copy.
