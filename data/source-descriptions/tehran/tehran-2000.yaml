  contest_date: '2000-11-02'
  description: |-
    Website of the 2000 Tehran Site of the ACM International Collegiate Programming Contest, Asia Region, hosted by Sharif University of Technology, in English. The front page says the contest is over and gives November 1-2, 2000 as the dates. Our copy holds 15 pages (the front page is saved under two addresses): news, information about the contest, the program for 31 October to 2 November, which puts the contest itself on Thursday 2 November, the steering committee, rules, the list of registered teams, an archive page with two software packages and eight earlier problem sets as PostScript files, supporters, contact details and links.

    Results and problems are on three pages: final standings, a page with the results of the Sharif internal contest (rank, team, solved, penalty), and a problems page listing problems A to I with links to Word files and a zip of test data. The linked Word files and zip are not in our copy, nor are the software and PostScript files of the archive page. The front page also links to the previous contest (1999) and to last year's photos.
