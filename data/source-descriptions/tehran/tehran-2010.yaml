  read: '2026-11-16'
  rubric: 1
  copy: tehran/tehran-2010/website/2026-10-20-wayback-65913e90
  title: ACM ICPC, Asia Region, Tehran Site
  language:
  - en
  problems: 11
  description: |-
    Website of the Tehran site of the ACM ICPC Asia Region for 2010, in English. The front page names the 35th ACM International Collegiate Programming Contest, the 12th Asian Regional Contest in Iran, 1st - 3rd December 2010, and carries two news items: the welcome of 14 September 2010 and the report that the 8th Iran Internet Programming Contest was held on 11 November 2010. Its links lead to Final Rankings, Summary, Problems and Photos, and to a Persian version of the site and two blogs.

    Our copy holds 5 pages: the front page, the two scoreboard pages (a four-column final ranking and the per-problem summary), the problem set as a 16-page PDF, and a photo page that links six photo albums (first day opening, practice contest, before the final contest, final contest, after the contest, closing ceremony). The registration, info, schedule, people, contact and archive pages named in the menu, the albums, the Persian pages and the problems of the Iran Internet Programming Contest are not part of it. A PowerPoint file of the contest's solutions, linked from the front page, is saved in our copy.
