  description: |-
    Scoreboard produced by CSUS PC^2 9.1.6: 79 teams, each shown as institution and team name, with rank, problems solved and total time. Problems A to K each have a cell with the number of attempts and, when solved, the minute of the solution, or a dash when unsolved, and a final column gives total attempts and solved. A header row names a balloon colour for each problem, from White for A to Black for I, J and K. First place is Amirkabir University of Technology with 8 solved; 14 teams share rank 66 with no problem solved.

    A bottom row gives submitted, first-yes time and total-yes counts per problem; no team solved J or K. The page footer carries the PC^2 credit and a last-updated stamp of 3 December 2010.
