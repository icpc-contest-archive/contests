  description: |-
    Website of the Tehran site of the ACM ICPC Asia Region for 2008, in English, hosted by Sharif University of Technology. The front page names the 33rd ACM International Collegiate Programming Contest, the 10th Asian Regional Contest in Iran, on 25-26 December 2008, and the 6th Iran internet programming contest on 27 November 2008. Our copy holds 10 pages (the front page is saved under two addresses): the front page, registration steps for Iranian and foreign teams, contest info, a schedule page that holds only a link to a programme PDF on another server, a people page listing the organisers by role, a list of local contests at Iranian universities, a contact page, a final scoreboard page, and the problem set as a PDF.

    The front page links the questions with sample input and output, test cases, photos and the scoreboard. The scoreboard page and the 11-page problem set PDF are in our copy. The photos, the test cases, the Archive page and the pages the menu links to under Links are not part of it.
