  description: |-
    Scoreboard produced by CSUS PC^2 9.0.4: 109 teams, each shown as institution and team name, with rank, problems solved and total time. Problems A to J each have a cell with the number of attempts and, when solved, the minute of the solution, or a dash when unsolved, and a final column gives total attempts and solved. A header row names a balloon colour for each problem, from Orange for A to Black for J. The first place is held by a team from Sharif University of Technology with 9 solved; 20 teams share rank 90 with no problems solved.

    A bottom row gives submitted, first-yes time and total-yes counts per problem. The page footer carries the PC^2 credit and a last-updated stamp of 26 December 2008.
