    Category page of Baekjoon Online Judge for Tehran Site 1999, in Korean. A table lists eight problems labelled A to H with judge problem numbers 7335 to 7342: (Your)((Term)((Project))), Painting A Board, Crossed Matchings, Counting Rectangles, An Old Stone Game, Magazine Delivery, Space Ant and The Erythea Campaign. For each it gives the number of users who solved it, the number of submissions and the acceptance rate. The page holds links to the problems but no statements.
