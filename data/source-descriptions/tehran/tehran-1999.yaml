  title: ACM ICPC Tehran Site
  language:
  - en
  contest_date: '1999-11-21'
  problems: 8
  description: |-
    Website of the Tehran Site of the ACM International Collegiate Programming Contest, Asia Region, hosted by Sharif University of Technology and supported by Information Systems of Iran. Our copy holds 150 files, of which 52 are pages. The address in our copy redirects to the 2007 edition, and the site also holds pages of the 2004 and 2007 contests. The part for the 1999 contest, dated 21 November 1999, has a home page announcing the two teams that qualified for the World Finals, deadlines for registration, general information, a summary of the rules, the steering committee and judging team, supporters, contact details, and a page linking to problem sets of eight other contests as PostScript files, which are in our copy.

    It also has a list of participating Iranian teams by university (total 77), final standings (39 ranked teams, then honorable mentions), tables of submission attempts and submission times for teams 01 to 89 over problems A to H, a 13-page report as a gzipped PDF that the site calls a report in Farsi, a gzipped Word file of the problems A to H, a zip file of test data with 16 files, and ten photographs. The PostScript version of the report and of the problems, the photo index and the software page are not in our copy.
