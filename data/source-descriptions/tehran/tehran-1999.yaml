    Final standings of the Tehran Site, Sharif University of Technology, dated November 21, 1999: 39 ranked teams with rank, team number and name, number of problems solved and penalty. Sharif University of Technology's Arvand team is first with 8 solved and a penalty of 1168. Below the table an Honorable Mention list names 39 further entries, universities and campuses, some marked Team #1 or Team #2, without rank or results. There is no per-problem detail.
