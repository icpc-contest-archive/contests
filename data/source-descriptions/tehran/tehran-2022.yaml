  title: ICPC, Asia Region, Tehran Site
  language:
  - en
  - fa
  description: |-
    Website of the Tehran site of the ICPC Asia region contest, in English, with a footer from the Department of Computer Engineering, Sharif University of Technology. The home page announces the 47th ICPC and the 23rd Asian Regional Contest in Iran, hosted by Sharif University of Technology on 27 and 28 April 2023; the schedule page gives 18 and 19 May 2023 instead. Our copy holds 22 pages.

    The pages cover the registration steps (an internet contest first, then the regional contest, with a limit of 75 teams for the site), the people and committees, contact details, and a list of past Tehran regional contests from 1999 to 2020 and earlier internet contests. A page for the 19th Iran Internet Programming Contest of 16 March 2023 links its problems, rankings and test cases. The regional scoreboard (62 teams, problems A to K), the internet contest scoreboard, the problem PDFs of both contests and a one-page Persian registration form are in our copy; the test data archive is not.

    The schedule page shows its program as an image that is not in our copy. Eight photo albums are listed with 31 to 68 images each, but the photographs themselves are not in our copy.
