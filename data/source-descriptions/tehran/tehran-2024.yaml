  description: |-
    Standings of the 2024 ICPC Asia Tehran Regional Contest: 79 teams in rank order with institution, number of problems solved, total time, medal, citation and site citation. Ranks run from 1 to 56 with ties. Twelve teams carry medals, four gold, four silver and four bronze; the other 67 are marked Ranked (39) or Honorable (28) in the medal column, and the first-place team carries the site citation Champion. The first place went to Ballmer Peak of Sharif University of Technology with 8 problems solved. No per-problem results are given.
