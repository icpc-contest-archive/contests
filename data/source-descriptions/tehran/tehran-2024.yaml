  description: |-
    Scoreboard titled ICPC 2024 - Scoreboard, carrying the time stamp Fri Dec 20 14:06:55 IRST 2024. It lists 81 teams against eleven problems A to K, with ranks up to 57 and ties. Each team row gives rank, team name with its institution, number solved and total time; each problem cell holds a time and a number of tries, and solved cells are coloured, with nine marked as first solves. A last column gives each team's solved and attempt totals, and a footer row gives solved and submitted totals per problem. The two teams at the bottom, both ranked 57, solved no problem. No medals are shown.

    The team rows are data inside the page that a script turns into the table; the script and style files are in our copy.
