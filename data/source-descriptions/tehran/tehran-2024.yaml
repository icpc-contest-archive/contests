  description: |-
    Problem set as a PDF of 18 pages in English. Page 1 holds the judging notes (input and output rules, floating point tolerance, no presentation errors); the problems follow, A to K: Yalda, Divar's Salaries, GPT DarkDown, Electromagnetic Attacks, PCB, I am Sherlocked, Double Radars, Anti-Missile, Conference Rides, Parking Theory and Boat. Each problem starts on a new page with a statement, input and output sections and sample input and output; problem C runs to three pages, and D, E, F and H to two. The first page carries no contest name or date.
