- url: https://icpc.ir/2024/
  read: '2026-11-16'
  rubric: 1
  copy: tehran/tehran-2024/website/2026-09-05-wayback-938f88f8
  title: ICPC, Asia Region, Tehran Site
  language:
  - en
  description: |-
    Website of the 2024 ICPC Asia Tehran Regional Contest, in English, with the Department of Computer Engineering of Sharif University of Technology named in its footer. The front page announces the 25th Asian Regional Contest in Iran on 19-20 December 2024 and an online regional contest on 20 November 2024. Further pages give the registration steps (a limit of 80 teams for the site), general information, a schedule shown as an image, the committees, contact details, and an archive of the Tehran regional contests from 1999 to 2023 (no 2021 entry) and of internet contests from 2002 to 2007, with links to standings, problems, test cases and photos.

    The site also holds the contest's scoreboard (81 teams, problems A to K), the scoreboard and problem set PDF of the online contest (in English, 11 pages, with a 14-page Persian version of the problems), the 18-page problem set PDF of the regional contest, a two-page PDF of team quotas per institution, a two-page registration timetable listing teams by registration time, a one-page poster, and nine photo albums (Preparation, Registration, Talks, Opening Ceremony, Practice, Contest, After Contest, Closing Ceremony, Teams).

    Our copy holds 76 files, 43 of them saved pages and documents; six of those are "Not found" pages (the brochure, a TD24.pdf address and four addresses under the problems folder), and several others are the menu pages repeated under other addresses. The two TD24.zip archives linked from the site were too large to keep, and none of the 451 photos shown in the albums is in our copy.
