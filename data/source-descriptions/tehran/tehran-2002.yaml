  title: ACM International Collegiate Programming Contest - Asia Region, Tehran Site
  language:
  - en
  contest_date: '2002-11-15'
  description: |-
    Website of the ICPC Asia Region Tehran Site in 2002, in English, hosted by the Computer Engineering Department of Sharif University of Technology. The home page covers three events: the Iran Nationwide Internet Programming Contest of 3 October 2002, the Tehran Site Preliminary Contest of 31 October to 1 November, and the Tehran Site Final Contest of 15 November. The final contest page says the final was held because of a PC^2 failure on 1 November, that only teams with a problem solved on 1 November advanced to it, and that the 1 November results do not count.

    Our copy holds 25 pages: 21 HTML pages, three PDFs and one text file. They cover news, information on the ICPC, the contest programs, the steering committee, rules, a teams page, an archive of software and old problems, supporters, contacts and links, the Internet contest page with its regulations, and four results pages: the Internet contest scoreboard, its standings for Sharif teams, the unofficial preliminary standings and the final standings. The text file is a table of universities with the columns Max problem solved and No. of Teams.

    The eight preliminary problem statements (.doc, A to H) are in our copy. The final contest statements, the test data archive linked from the home page, the invitation letter and the English brochure are not. Photo galleries and the pages of the 2001, 2000 and 1999 contests lead outside our copy.
