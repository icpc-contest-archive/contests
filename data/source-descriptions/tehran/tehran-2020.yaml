  description: |-
    Problem set as a PDF of 22 pages in English, every page headed with the address hezardastan.ir and the title 2020 ICPC Asia Tehran Regional Contest. Page 1 holds eight numbered judging notes on clarifications, input and output, floating point tolerance and verdicts. Pages 2 to 22 hold thirteen problems, A to M, each starting on a new page with its letter and title (Covid-19, Statistics, Science Fiction, Necklace Construction, Social Distancing, Hezardastan, JJ Rally, Birds Rituals, Black Family Tree, Vaccination Against Corona, McFly, The Last Supper, Stabbing Number), followed by the statement, input and output format and sample input and output. Problems E, F, G, K, L and M run over two pages and problem H over three. No test data or solutions.
