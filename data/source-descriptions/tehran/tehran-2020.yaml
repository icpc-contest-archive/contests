  description: |-
    Scoreboard of the ICPC 2020 Asia Region, Tehran Site, published by Sharif University of Technology: 121 teams and thirteen problems labelled A to M. Each team has a rank, institution and team name, number solved and time, and for each problem the number of attempts with the time of the accepted run, or attempts alone when unsolved; first solves are marked and a final column gives attempts and solves per team. Three teams with no solved problem are listed with -- in place of a rank. A bottom row totals submissions and solves per problem (1371 submissions, 571 solves in all; problem M was solved by no team). The page carries the stamp Thu Dec 31 14:04:36 IRST 2020.

    The team rows are held in a script inside the page and written into the table when the page is opened in a browser; the page's script and style files are in our copy.
