    Contest page of the 2020-2021 ICPC Asia West - Tehran Regional on QOJ.ac: a list of thirteen problems, A to M (Covid-19, Statistics, Science Fiction, Necklace Construction, Social Distancing, Hezardastan, JJ Rally, Birds Rituals, Black Family Tree, Vaccination Against Corona, McFly, The Last Supper, Stabbing Number). It shows the contest as ended, with the ICPC ruleset, a 20-minute penalty and a limit of 1000 submissions per problem, a virtual contest that can be started, empty notice and question lists, and an attachment line 'Statements (en)' for ICPC Tehran. Tabs link to submissions, standings and external standings.

    The problem statements themselves, the attached statements file and the other tabs are not in our copy; only this page is.
