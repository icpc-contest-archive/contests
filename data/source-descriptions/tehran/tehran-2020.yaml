  title: ICPC, Asia Region, Tehran Site
  language:
  - en
  - fa
  contest_date: '2020-12-31'
  description: |-
    Website of the Tehran site of the ICPC Asia Region contest, run by the Department of Computer Engineering of Sharif University of Technology, in English with some Persian documents. The front page announces the 45th ICPC and the 22nd Asian Regional Contest in Iran, 30-31 December 2020, with links to the scoreboard, the problems and test data, a poster, and the 18th Iran Internet Programming Contest of 10 December 2020 with its rankings. The schedule page puts the opening ceremony and a practice session on Wednesday 30 December and the regional contest, 09:00 to 14:00, and the closing ceremony on Thursday 31 December. Other pages give the contest information, the registration steps (a limit of 100 teams for the site, no foreign teams because of COVID-19), contact details and an archive of past Tehran regional contests from 1999 to 2019 and of earlier Internet and preliminary contests.

    Our copy holds 16 pages: 10 HTML pages and 6 PDF files. The PDFs are the problem set of the regional contest (22 pages, English), two Persian problem sets of the Internet contest (12 pages, dated 7 Azar 1398, and 11 pages, dated 20 Azar 1399), a one-page poster, a one-page registration form and a one-page Internet contest document. The scoreboard of the regional contest and the scoreboard of the Internet contest (420 teams, ten problems) are in the copy; the test data archive is not.
