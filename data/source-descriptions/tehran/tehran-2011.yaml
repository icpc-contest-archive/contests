    Standings of the 2011 ACM-ICPC Asia Tehran Regional Contest: 76 teams with rank, team name, institution, problems solved and total time, plus medal, citation and site citation columns. The first twelve teams carry medals (four gold, four silver, four bronze) and a place citation; first place, Reincarnation of PMP from Sharif University of Technology, is cited as champion of the Tehran on-site regional. Teams from 13th to 38th place have place citations only, and the remaining 38 teams, down to rank 72, are listed as Honorable Mention. No per-problem results.
