  title: ACM/ICPC Tehran Site 2011
  language:
  - en
  description: |-
    Small website of the Tehran site of the 2011 Asian regional contest, in English. The front page gives the contest title (36th ACM International Collegiate Programming Contest, 13th Asian Regional Contest in Iran), the University of Tehran as host and the dates 1-2 December 2011, and links to three things: Final Rankings, Problems and Photos.

    Our copy holds eight files. They are the front page, the Final Rankings page (a PC^2 scoreboard of 76 teams), the problem set as a PDF of 15 pages with problems A to K, and the photo directory listing in five sort orders. The listing names 17 JPEG files dated 2 December 2011; the photos themselves are not in our copy.
