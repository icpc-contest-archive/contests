    Baekjoon Online Judge page of problem "Movie", with a Korean interface and the statement in English. A row gives the time limit of 1 second, the memory limit of 128 MB and the judge's counts of submissions, accepted submissions, solvers and ratio (4, 1, 1, 100.000%). Then come the statement, Input and Output sections and one sample input with its output; the source line credits ICPC > Regionals > Asia West Continent > Iran > Tehran Site 2013, problem A, and a link points to the ACM-ICPC Live Archive. The story has its hero coming home from the Sharif University on 20 December 2013, "the contest day".

    The statement refers to a list of smart phones and tablets with their resolutions and prices given as an image; that image is not in our copy.
