  description: |-
    Scoreboard produced by PC^2 (version 9.3): 76 teams with rank, name given as university and team (for example Sharif UT: Shir-e-Aab), number solved and total time. Eleven problems A to K each have a column, with a colour name under the letter, and each cell gives the number of attempts and the minute of the first solution, with -- where unsolved. A final column gives total attempts and problems solved, and a last row gives submissions, first solution time and total solutions per problem. Sharif UT: Shir-e-Aab is first with 8 problems solved and 1434 minutes. The last 27 rows, all with 0 solved, share rank 50.

    A note on the page says the scoreboard is shut down when one hour of the contest remains. The page states it was last updated on Fri Dec 20 14:12:38 IRST 2013.
