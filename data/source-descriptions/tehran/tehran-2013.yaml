  title: ACM ICPC, Asia Region, Tehran Site
  language:
  - en
  contest_date: '2013-12-19'
  description: |-
    Website of the Tehran site of the ACM ICPC Asia region for 2013, kept by the Department of Computer Engineering of Sharif University of Technology, in English. The front page announces the 38th ACM ICPC and 15th Asian Regional Contest in Iran on 19 and 20 December 2013, with news items from 5 October 2013 to 3 January 2014, and lists sponsors and supporters. Menu pages cover registration, contest information, the schedule of 18 to 20 December (also as English and Persian PDFs), people, contact, and an archive of past Tehran regional contests from 1999 to 2013 and of earlier internet contests, with links to standings, problems and photos for each year and to test cases for some years. Further pages describe the 1st Iranian ICPC Challenge, a game-playing contest held during the regional, and the 11th Iran Internet Programming Contest of 28 November 2013.

    The site holds the regional's scoreboard, a PDF of the problem set, a zip archive of the test data, three photo gallery pages, and a standings page of the internet contest. Our copy has 142 files, 21 of them pages; many photo thumbnails and some linked files are missing, and links to other years and external hosts lead outside the copy.
