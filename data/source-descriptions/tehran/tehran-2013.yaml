    Page of the Baekjoon Online Judge, with the Korean-language interface of that site, listing the category Tehran Site 2013 under ICPC Regionals, Asia West, Iran. A table gives eleven problems A to K with their judge numbers 9670 to 9680 and titles: Movie, SMS Poll, Traitor, Intelligent Traffic Surveillance, BitTorrent, 2D-Solar System, Bowling Ball, a title for problem H in Korean, Mixed Flight Plans, Sweeping Robot and Wedding Hall. It shows the number of users who solved each, the number of submissions and the percentage correct, as of the capture. The statements are on separate pages that are not in our copy.
