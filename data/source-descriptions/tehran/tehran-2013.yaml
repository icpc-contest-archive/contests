  description: |-
    Standings rebuilt by our own tools from data of the ICPC public API archive, not an original page: 76 teams with rank, team name, institution, problems solved and time. Ranks run from 1 to 25 and several teams share a rank although their solved counts differ (rank 2 is printed for four teams with 8, 7, 6 and 6 solved); the 27 teams with no problem solved are listed at the end without a rank. Some times differ from the PC^2 scoreboard, and 32 teams show a time of 0 with problems solved. No per-problem detail.
