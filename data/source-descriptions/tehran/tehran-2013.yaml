  description: |-
    Scoreboard produced by PC^2 (CSUS, version 9.3): 76 teams, eleven problems A to K, each with a colour name listed under its letter. Each row gives rank, team as university and team name, problems solved, penalty time, tries and solve time for each problem, and total attempts over solved; ranks run to 50, with ties. A last row gives submitted runs, first-yes time and total yes per problem. A note at the top says the scoreboard is shut down when one hour of the contest remains. The page is stamped as last updated on Friday 20 December 2013, 14:12 IRST. A Sharif UT team is in first place with 8 problems.
