  read: '2026-11-16'
  rubric: 1
  copy: tehran/tehran-2013/website/2026-09-05-wayback-ae71acab
  title: ACM ICPC, Asia Region, Tehran Site
  language:
  - en
  - fa
  contest_date: '2013-12-20'
  description: |-
    Website of the 2013 Tehran regional contest, in English, made by the Department of Computer Engineering of Sharif University of Technology. The front page announces the 38th ACM ICPC, 15th Asian Regional Contest in Iran, 19-20 December 2013, with news items from October 2013 to January 2014 and links to the final rankings, problems, test data and photos. The program schedule puts the contest itself on Friday 20 December, 8:30 to 13:30, after a practice contest the day before.

    Our copy holds 21 pages: contest information, registration, the program schedule (a page and PDFs in English and Persian), people, contact, an archive page listing earlier Tehran contests from 1999 to 2012, three photo galleries (Series 1 to 3), and pages for the 1st Iranian ICPC Challenge and the 11th Iran Internet Programming Contest. The contest documents are the scoreboard (76 teams, produced by PC^2), a 19-page PDF of the eleven problems A to K, and a zip of test data. The standings page of the Internet contest (223 teams, a different contest held on 28 November 2013) is also inside.

    The earlier years in the archive page are only listed; their pages are not in our copy. The Teams photo gallery, some gallery thumbnails and the pages behind the links to the blog and sponsor sites are not in our copy.
