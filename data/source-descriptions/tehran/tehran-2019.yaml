  description: |-
    Standings of the 2019 ICPC Asia Tehran Regional Contest: 79 teams with rank, team name, institution, problems solved, total time, medal, citation and site citation. Ranks run from 1 to 62 with ties sharing a rank. The medals are four gold, four silver and four bronze; the 24 lowest-ranked teams carry the citation Honorable Mention, and the first place carries the site citation Site Champion (NimRoo, Sharif University of Technology, 10 solved). No per-problem results.
