  rubric: 1
  copy: tehran/tehran-2019/website/2026-09-05-wayback-92e22b29
  title: ICPC, Asia Region, Tehran Site
  language:
  - en
  - fa
  description: |-
    Website of the Tehran site of the ICPC Asia Region contest, run by the Department of Computer Engineering of Sharif University of Technology, in English with some Persian documents. The front page announces the 44th ICPC and the 21st Asian Regional Contest in Iran, 19-20 December 2019, with links to the scoreboard, the problems and test data, and the 17th Iran Internet Programming Contest of 28 November 2019 with its rankings. Further pages cover the contest information, schedule, registration (a limit of 80 teams for the site), organisers, contact details, an archive of past Tehran regional contests from 1999 to 2019 and of earlier Internet and preliminary contests, and photo pages for the teams, the first day, the practice contest, the contest, after the contest and the closing ceremony.

    Our copy holds 23 pages: 17 HTML pages and 6 PDF files, with 92 JPEG photographs. The PDFs are the problem set of the regional contest (15 pages, English), the Persian problem sets of the Internet contest (12 pages) and its practice round (3 pages), a one-page schedule and a one-page registration form in Persian, and a one-page Internet contest document. The regional scoreboard and the scoreboard of the Internet contest (735 teams, ten problems) are in the copy; the test data archive is not. The information page still names the 43rd World Finals of May 2018 in Moscow.
