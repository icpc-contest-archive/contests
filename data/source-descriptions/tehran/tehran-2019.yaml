  description: |-
    Scoreboard of the ICPC 2019 Asia Region, Tehran Site, published by Sharif University of Technology: 79 teams and twelve problems labelled A to L. Each team has a rank, institution and team name, number solved and time, and for each problem the number of attempts with the time of the accepted run, or attempts alone when unsolved; first solves are marked and a final column gives attempts and solves per team. A bottom row totals submissions and solves per problem (827 submissions, 285 solves in all; problem G was solved by no team). The page carries the stamp Fri Dec 20 13:29:01 IRST 2019.

    The team rows are held in a script inside the page and written into the table when the page is opened in a browser; the page's script and style files are in our copy.
