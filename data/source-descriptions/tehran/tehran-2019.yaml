  description: |-
    Problem set as a PDF of 15 pages with twelve problems, A to L, in English. The document has no cover page: problem A, Petrol, starts on page 1, and each problem begins on a new page headed with its letter and title, followed by the statement, input and output format and sample input and output in a two-column table. Problems F, H and L run over two pages. The titles are Petrol, Gold Rush, Valid Emails, Cafebazaar's Chess Tournament, The Big Surprise, Lets Burn and Rob Manhootan, Gift Puzzle, Passport Control Gates, Password, Greedy Termite, Plan B and The Assembly Code. The text of the PDF does not name the contest, host or date, and holds no test data or solutions.
