  title: ICPC, Asia Region, Tehran Site
  language:
  - en
  - fa
  description: |-
    Website of the Tehran site of the ICPC Asia region contest, in English, with a footer from the Department of Computer Engineering, Sharif University of Technology. The home page announces the 48th ICPC and the 24th Asian Regional Contest in Iran, hosted by Sharif University of Technology on 30 and 31 May 2024, and the 20th Iran Internet Programming Contest of 1 May 2024. Our copy holds 27 pages.

    The pages cover the registration steps (an internet contest first, then the regional contest, with a limit of 75 teams for the site), the people and committees, contact details, the schedule, and a list of past Tehran regional contests from 1999 to 2023 and earlier internet contests. The regional scoreboard (81 rows, problems A to M), the internet contest scoreboard, the problem PDFs of both contests, a two-page registration form and two one-page posters are in our copy; the test data archive is not.

    Ten photo albums are listed with 14 to 122 photos each (521 in all), dated 24 May to 4 June 2024; the Contest album is dated 31 May 2024. Only 94 JPEG images are in our copy.
