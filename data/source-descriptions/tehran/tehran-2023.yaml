    Contest page on the Codeforces gym for The 2023 ICPC Asia Tehran Regional Contest, marked Finished. It lists 13 problems A to M by name, from Micromasters to Colorful Intervals, each with standard input and output, a memory limit of 1024 MB and a time limit between 1 and 10 seconds (1 second for A, 5 for D, 10 for K). Each problem has a solved-by counter, which reads x70 for all thirteen. Links lead to the contest website, to the statements (a PDF on the contest website) and to the gym's standings. The statements, standings and submissions themselves are not part of this page.
