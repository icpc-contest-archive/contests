    Scoreboard of the Tehran site of the ICPC 2023 Asia Region, headed "ICPC 2023 - Tehran Site" at Sharif University of Technology, with an update stamp of 31 May 2024. It has 81 team rows, shown as institution and team name, ranked 1 to 53 (tied teams share a rank; the last row, a team with no solved problem, is ranked 53), with solved count and penalty time. For each of problems A to M it gives the time in minutes and the number of attempts; solved cells are marked and 13 of them carry a first-solve mark. A footer row totals solved and submitted runs per problem (324 solved of 729 submitted overall). The team in first place is Ballmer Peak of Sharif University of Technology with eleven problems solved.
