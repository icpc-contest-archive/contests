    Problem page of Baekjoon Online Judge headed "16729번 - Cinema" (problem 16729, Cinema), with the site's menus in Korean and the statement in English. A table gives a time limit of 2 seconds and a memory limit of 512 MB with counts of submissions (48), accepted submissions (21) and users who solved it (13); then come the statement, the input and output sections and three sample inputs with outputs. The source line files it under ICPC > Regionals > Asia West Continent > Iran > Tehran Site 2018, problem C. The task is the largest number of people who can be seated in a theater, under the stated seating rule, after raising seat comfort values by at most k units in total.

