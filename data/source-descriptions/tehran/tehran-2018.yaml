- url: https://icpc.ir/2018/
  read: '2026-11-16'
  rubric: 1
  copy: tehran/tehran-2018/website/2026-09-05-wayback-889f43d1
  title: ACM-ICPC, Asia Region, Tehran Site
  language:
  - en
  description: |-
    Website of the Tehran Site of the ACM-ICPC Asia Region, 2018 edition, by the Department of Computer Engineering of Sharif University of Technology, in English with some Persian documents. It announces the 43rd ACM International Collegiate Programming Contest, 20th Asian Regional Contest in Iran, on 20 and 21 December 2018, hosted by Sharif University of Technology. Pages cover contest information (about 80 teams), registration steps with deadlines and a fee of 700,000 Tomans per team, a schedule page linking a one-page Persian programme, the people, contact details, an archive of past Tehran contests from 1999 to 2018, and the 16th Iran Internet Programming Contest of 29 November 2018.

    Our copy holds 23 pages. Among them are the scoreboard of the regional contest (84 teams, problems A to K), a PDF of the 11-page set of problems A to K in English, the Internet contest's scoreboard (885 teams, problems A to I) and its Persian problem PDF (10 pages), a Persian registration form and a one-page Persian poster of the Internet contest, the photo index and seven gallery pages. The test data archive linked next to the problems is not in our copy, and neither are the archive page's links to other years' material.

    The gallery pages show thumbnails only: 97 are saved, 300 others and the full-size picture pages are not.
