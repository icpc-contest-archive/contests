  description: |-
    Scoreboard of the Tehran Site of the ACM ICPC 2018 Asia Region, headed Sharif University of Technology, Tehran, Iran and stamped Fri Dec 21 15:07:01 IRST 2018. It lists 84 teams with rank (1 to 58, ties share a rank), institution and team name, problems solved (at most 10), and penalty time, then one cell per problem A to K with the number of attempts and the time of the accepted run, and an attempts and solved count per team. Cells are marked as solved, unsolved with attempts, or first solve; ten first-solve marks appear. A totals row above the teams gives total submitted and total solved for each problem. First place is Kolompeh of Sharif University of Technology with 10 solved.

    The team rows are held in a script inside the page, which builds the table in a browser; the table in the page source itself holds only the header and the totals row. The style sheets and scripts are in our copy.
