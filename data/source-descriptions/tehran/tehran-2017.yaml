  description: |-
    Scoreboard of the Tehran Site of the ACM ICPC 2017 Asia Region, headed Sharif University of Technology, Tehran, Iran and stamped Fri Dec 15 13:41:17 IRST 2017. It lists 80 teams with rank (1 to 47, ties share a rank), institution and team name, problems solved (at most 9), and penalty time, then one cell per problem A to K with the number of attempts and the time of the accepted run, and an attempts and solved count per team. Cells are marked as solved, unsolved with attempts, or first solve; nine first-solve marks appear. A totals row above the teams gives submitted runs, time of first accepted run and number of teams solving for each problem. First place is Cliché of Sharif University of Technology with 9 solved.

    The team rows are held in a script inside the page, which builds the table in a browser; the table in the page source itself holds only the header and the totals row. The style sheet and script are in our copy.
