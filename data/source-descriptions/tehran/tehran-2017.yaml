- url: https://icpc.ir/2017/
  read: '2026-11-16'
  rubric: 1
  copy: tehran/tehran-2017/website/2026-09-05-wayback-c9e94551
  title: ACM-ICPC, Asia Region, Tehran Site
  language:
  - en
  description: |-
    Website of the Tehran Site of the ACM-ICPC Asia Region, 2017 edition, by the Department of Computer Engineering of Sharif University of Technology, in English. It announces the 42nd ACM International Collegiate Programming Contest, 19th Asian Regional Contest in Iran, on 14 and 15 December 2017. Pages cover contest information (about 80 teams), registration steps and fees, a schedule page with the dates and a schedule image, the people, contact details, an archive of past Tehran contests from 1999 to 2017 with links to standings, problems and photos, and the 15th Iran Internet Programming Contest of 23 November 2017.

    Our copy holds 20 pages and, besides them, a zip of test data (22 files, an input and an output file for each of problems A to K) and 113 photo thumbnails. The pages include the scoreboard of the regional contest (80 teams, problems A to K), a PDF of the 12-page set of 11 problems, the Internet contest's problem PDF (20 pages, 12 problems) and standing page (252 teams), the photo index and seven gallery pages.

    The gallery pages show thumbnails only: 113 are saved, 369 others and the full-size picture pages are not, and the site's theme images are missing. The archive page's links to other years' material are not in our copy.
