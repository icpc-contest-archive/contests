  description: |-
    Scoreboard produced by CSUS PC^2 9.1.4: 97 teams, each shown as abbreviated institution and team name, with rank, problems solved and total time. Problems A to J each have a cell with the number of attempts and, when solved, the minute of the solution, or a dash when unsolved, and a final column gives total attempts and solved. A header row names a balloon colour for each problem, from Dark Green for A to Black for J. First place is a team from National Taiwan U with all ten problems solved; 8 teams share rank 90 with no problem solved.

    A bottom row gives submitted, first-yes time and total-yes counts per problem. The page footer carries the PC^2 credit and a last-updated stamp of 6 November 2009.
