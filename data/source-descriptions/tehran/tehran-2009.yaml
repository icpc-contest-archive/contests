    Standings of the 2009 ACM-ICPC Asia Tehran Regional Contest: 118 teams, each with team name, institution in full, problems solved and total time. No per-problem detail. A rank is printed for the first 29 rows, shared by tied teams, and the remaining 89 rows, all teams with no problem solved, carry no rank. First place is 120yen Battle Fury of National Taiwan University with ten solved in 874 minutes.

