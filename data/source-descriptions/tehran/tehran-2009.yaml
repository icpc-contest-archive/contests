  problems: 10
  description: |-
    Website of the Tehran site of the ACM ICPC Asia Region for 2009, in English, hosted by Sharif University of Technology. The front page names the 34th ACM International Collegiate Programming Contest, the 11th Asian Regional Contest in Iran, on 5th and 6th November 2009, and the 7th Iran Internet Programming Contest on 30 Mehr 1388. Our copy holds 13 pages (the front page is saved under two addresses, and the archive page is empty): registration steps for Iranian and foreign teams, contest info, a schedule page that holds only a link to a spreadsheet on another server, a people page listing the organisers by role and committee, a list of local contests, a contact page, a photo album page, a scoreboard page, a universities ranking page and the problem set as a PDF.

    The front page is headed Final Ranking and Problems - 2009 Contest and links the problems, the final ranking, the universities ranking and photos. The scoreboard, the ranking page and the 10-page problem set PDF are in our copy. The photo album page holds only two links, to photo sub-pages that are not part of it.
