    Results page headed The 2003 ACM Asia Programming Contest - Tehran sponsored by IBM, with four boards. The Final Round board, dated 11/28/2003, lists 74 teams by full institution name and team name with a citation. The 31 ranked teams also show number solved and score; first place is the Sharif University of Technology team The Stupendous with six solved and a score of 712. The other 43 teams carry the citation Honorable Mention and no rank.

