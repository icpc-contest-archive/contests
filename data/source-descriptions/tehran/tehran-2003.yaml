  pages: 4
  description: |-
    Website of the 28th ACM International Collegiate Programming Contest, 5th Asian Regional Contest in Iran, hosted by Sharif University of Technology, in English. The front page gives the event as November 27-28, 2003 and links to the final standings, the problems, test data, photos and a report from a newspaper, as well as to the Tehran contests of 1999 to 2002 and their photos. A further page describes the Sharif Preliminary Contest of 14 November 2003, held among Sharif University teams to choose three teams for the regional contest, with registration information.

    Our copy holds four pages: the front page, the final standings page (31 ranked teams and a list of honorable mention teams), the problems page, and the Sharif preliminary page, together with eight Word files holding the statements of problems A to H. The menu pages (news, information, program, rules, teams and others), the test data archive, the photos and the newspaper report are not in our copy.
