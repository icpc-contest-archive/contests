  title: ACM International Collegiate Programming Contest - Asia Region, Tehran Site
  language:
  - en
  description: |-
    Website of the 31st ACM International Collegiate Programming Contest, Asia Region, Tehran Site (the front page prints 31th), hosted by Sharif University of Technology, in English. Our copy holds 13 pages. The front page announces the contest for 13-15 December 2006 and links the problems, test cases, final rankings, photos and a Persian-language contest blog; it also announces the 4th Iran Internet Programming Contest of 9 November 2006. Other pages cover registration, contest information, people and committees, local contests, supporters, contact details, an archive of past Tehran contests (2005 back to 1999) and links. The schedule page reads only "Schedule of Events, see the link", and the news page shows only its heading.

    The final standings page of the contest is inside: 41 ranked teams and a list of 46 Honorable Mention teams. The problems and test cases are linked as zip archives that are not in our copy. The style sheet and menu images are present; the four sponsor logos of the supporters page are not.
