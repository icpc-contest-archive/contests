  copy: tehran/tehran-2007/website/2026-10-20-wayback-54701a6c
  title: ACM International Collegiate Programming Contest - Asia Region, Tehran Site
  language:
  - en
  description: |-
    Website of the 32nd ACM International Collegiate Programming Contest, Asia Region, Tehran Site, hosted by Sharif University of Technology, in English. Our copy holds 16 pages. The front page announces the contest for 6-7 December 2007 and links the final standings, problems, test data, a Persian-language contest blog, the 5th Iran Internet Programming Contest of 9 November 2007 and the 1st Iran High-School Programming Contest (problems and standings). Other pages cover registration, contest information, people and committees, local contests, supporters, contact details, an archive of past Tehran contests (1999 to 2006) and of past Sharif preliminary and Internet contests (2002 to 2007), and links. The schedule page only says to see a link, and the news page shows only its heading.

    Inside our copy are the final scoreboard of the contest with 89 teams and problems A to J, the problem set as a PDF of 10 pages, a page for the 5th Iran Internet Programming Contest with its general rules and registration steps, and a standings page of the High-School Programming Contest with 74 teams. The test data and high-school problem archives are linked as zip files that are not in our copy. The style sheet and the menu images of the main pages are present; the sponsor logos, a few other images and the menu images of the Internet Programming Contest page are not.
