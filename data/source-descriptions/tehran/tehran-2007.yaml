  description: |-
    Scoreboard produced by CSUS PC^2 9.0.0: 89 teams, each named as institution and team name, with rank, number solved and total time, followed by ten problems A to J. Each problem cell gives attempts and time, with -- for a problem not solved, and the last column gives total attempts and number solved. A row under the header names the balloon colour of each problem, and the bottom row gives submitted, first yes and total yes per problem. Sharif U. of Tech.'s M'kay is first with 8 solved; nobody solved problem J, and 13 teams solved none and share rank 77. The page is stamped last updated Fri Dec 07 14:20:58 IRST 2007.
