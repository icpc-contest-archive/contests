  title: The 2007 ACM Asia Programming Contest - Tehran sponsored by Sharif University of Technology
  language:
  - en
  contest_date: '2007-12-07'
  teams: 89
  description: |-
    Standings page headed The 2007 ACM Asia Programming Contest - Tehran, sponsored by Sharif University of Technology. The Final Round table, dated 12/7/2007, lists 89 teams as institution and team name with a citation: 16 teams carry a rank and a place citation (First Place to Eleventh Place) with number solved and time, and the other 73 are listed as Honorable Mention without rank or results. Sharif University of Technology's Sharif M'kay is first with 8 solved and a time of 1459.

    Four more tables follow, all of Honorable Mention teams without results: foreign team registrations (3 teams), the 1st Iran High-School Programming Contest (6), the 5th Iran Internet Programming Contest (220) and the Sharif Preliminary Contest of 10/25/2007 (17). No per-problem detail.
