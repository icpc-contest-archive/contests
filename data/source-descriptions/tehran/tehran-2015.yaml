  title: ACM-ICPC, Asia Region, Tehran Site
  language:
  - en
  - fa
  contest_date: '2015-12-25'
  description: |-
    Website of the 2015 Asia Region, Tehran Site contest, published by the Department of Computer Engineering of Sharif University of Technology, in English. The front page announces the contest on 24-25 December 2015 and links to the scoreboard, the problems and test data, and the photos. Further pages give contest information, registration (deadline, fee, limit of 85 teams), the people involved, contact details, the programme schedule, and an archive of past Tehran regional contests since 1999 and of earlier internet contests. The schedule shows practice on Thursday 24 December and the contest on Friday 25 December.

    Inside the site are the scoreboard page, the regional's problem set as a PDF (problems A to J) with a zip of test data (20 files), the 13th Iran Internet Programming Contest page with its problem PDF and a standings page, a page on the 3rd Iranian ICPC Challenge (the Gold Hunters game), schedule PDFs in English and Persian, a registration form in Persian, and photo albums (Teams, Opening, Practice, Contest, Closing, Staff and others).

    Our copy holds 27 pages and 97 photo files, fewer than the albums list. Links to the ACM Persian blog and wiki and to other sites lead outside the copy.
