  description: |-
    Scoreboard page of the Asia Region Tehran Site contest at Sharif University of Technology, stamped Fri Dec 25 13:44:37 IRST 2015: 78 teams and ten problems labelled A to J. Each row gives rank, institution and team name, number solved, time, then for each problem the number of tries and the minute of the accepted run (or a dash when unsolved), with marks for accepted runs, first solutions and unsolved attempts, and a final attempts/solved cell. A footer row gives per problem the totals submitted, the time of the first accepted run and the total solved. First place is a Sharif University of Technology team with 9 problems solved.

    The team rows are held in a script inside the page that fills the table when the page is opened; the style sheet, script and logos are in our copy.
