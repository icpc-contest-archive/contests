  title: The 2016 ACM-ICPC Asia Tehran Regional Contest
  language:
  - en
  teams: 82
  description: |-
    Standings of 82 teams with rank, team name, institution, number of problems solved, total time, a medal column, a citation column and a site citation column. Several teams share a rank although their solved counts and times differ: four teams hold rank 2 and eight hold rank 8. The medal column runs from First Place (Sharif University of Technology team CrockPot, 12 problems solved, time 1538) through Seventeenth Place to Honorable Mention (49 teams); the citation column repeats it for the first ranks, continues with ordinal places up to Fortieth Place and has seven teams at Honorable Mention. The site citation column is empty except for "Contest Champion" on the first team. No per-problem detail and no attempt counts.
