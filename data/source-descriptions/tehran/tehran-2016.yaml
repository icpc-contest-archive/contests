  rubric: 1
  copy: tehran/tehran-2016/website/2026-09-05-wayback-077ae8a0
  title: ACM-ICPC, Asia Region, Tehran Site
  language:
  - en
  - fa
  contest_date: '2016-12-23'
  description: |-
    Website of the 2016 Asia Region, Tehran Site contest, published by the Department of Computer Engineering of Sharif University of Technology, in English. The front page announces the 18th Asian Regional Contest in Iran on 22-23 December 2016 and links to the scoreboard, the problems and test data, the 4th Iranian ICPC Challenge and the 14th Iran Internet Contest. Further pages give contest information, registration (deadline 6 December 2016, a fee per team, a limit of 80 teams), the people involved, contact details, the programme schedule, and an archive of past Tehran regional contests since 1999 and of earlier internet contests. The English schedule shows practice on Thursday 22 December and the contest on Friday 23 December.

    Inside the site are the scoreboard page, the regional's problem set as a PDF (problems A to L) with a zip of test data (24 files), the internet contest page with its problem PDF and a standings page, schedule PDFs in English and Persian, a registration form in Persian, and five photo albums (Staff, Teams, Closing, Contest, First-Day).

    Our copy holds 21 pages and 113 photo files. Links to the ACM Persian blog and wiki and to other sites lead outside the copy.
