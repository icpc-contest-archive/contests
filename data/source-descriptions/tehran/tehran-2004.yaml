  description: |-
    Website of the 29th ACM International Collegiate Programming Contest, 6th Asian Regional Contest in Iran, hosted by Sharif University of Technology, in English. The front page gives the event as December 1-3, 2004 and links to the team list, the problems, test data, the final rankings and the full rankings, photos and news reports from Mehr, Isna and Jam-e-Jam, the 2nd Iran Nationwide Internet Programming Contest of 28 October 2004 (announcement, regulations, problems, test data, rankings, report, photos) and Round 2 of the Sharif Preliminary Contest of 18 November 2004.

    Our copy holds three pages: the front page and two single-page PDFs, linked from the front page as the Jam-e-Jam reports (their text layer does not decode, so their content is not described here). The menu pages, team list, problems page, test data archive and the pages of the other contests are not in our copy; the rankings are separate pages that the front page links to.
