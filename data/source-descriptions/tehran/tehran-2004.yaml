  title: ACM International Collegiate Programming Contest - Asia Region, Tehran Site
  language:
  - en
  contest_date: '2004-12-01'
  description: |-
    Front page of the website of the 2004 ACM ICPC Asia regional contest in Iran, hosted by Sharif University of Technology, in English. It names the 29th ACM International Collegiate Programming Contest, the 6th Asian Regional Contest in Iran, dated December 1 to 3, 2004. Besides a menu (Latest News, Registration, Contest Info, Schedule, People, Local Contests, Supporters, Contact, Archive, Links), it links the team roster, the problems, test data, the final rankings and the full rankings, photos, and news reports. It also lists two other Iranian contests of autumn 2004: the 2nd Iran Nationwide Internet Programming Contest on 28 October 2004 and a Sharif preliminary contest round on 18 November 2004.

    Our copy holds only this front page, its images and style sheet, and two one-page PDFs linked as the Jam-e-Jam reports. The text layer of these PDFs does not extract readably. All other pages named above, including the roster, problems and test data, are not in our copy.
