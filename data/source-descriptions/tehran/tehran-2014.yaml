  description: |-
    Scoreboard of the Asia Region, Tehran Site contest at Sharif University of Technology: 101 teams with rank, team name given as university and team (for example Sharif UT: Saboon), number solved and total time. Eleven problems A to K each give the number of attempts and the minute of the first solution, with solved cells marked and first solutions to a problem marked as first, and a last column gives attempts and problems solved. Sharif UT: Saboon is first with 10 solved and 1080 minutes. Every team solved at least one problem.

    The team rows are held in a script of the page, which builds the table when it runs; the table in the page source holds only the header and a summary row of totals per problem (1023 submissions, 401 solutions). The page is stamped Fri Dec 19 13:47:09 IRST 2014. The script and style sheet are in our copy.
