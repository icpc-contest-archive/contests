- url: http://icpc.sharif.ir/acmicpc14
  read: '2026-11-16'
  rubric: 1
  copy: tehran/tehran-2014/website/2026-10-20-wayback-e96be3e7
  title: ACM-ICPC, Asia Region, Tehran Site
  language:
  - en
  - fa
  contest_date: '2014-12-19'
  description: |-
    Website of the 2014 Tehran regional contest, in English, made by the Department of Computer Engineering of Sharif University of Technology. The front page announces the 39th ACM International Collegiate Programming Contest, 16th Asian Regional Contest in Iran, 18-19 December 2014, with news items from October to November 2014 and links to the final rankings, problems, test data and photos. The program schedule puts the contest itself on Friday 19 December, 8:30 to 13:30, after a practice contest the day before.

    Our copy holds 26 pages: contest information, registration (with a one-page registration form PDF in Persian), the program schedule (a page and PDFs in English and Persian), people, contact, an archive page listing earlier Tehran contests from 1999 to 2014 and earlier internet contests, a page on the 2nd Iranian ICPC Challenge (the Gold Hunters game), and two photo gallery pages (one captioned 244 images, the other 101 images). The contest documents are the scoreboard (101 teams), a 12-page PDF of the eleven problems A to K, and a zip of test data.

    The earlier years in the archive page are only listed; their pages are not in our copy. The photographs of the two galleries are not in our copy, and the pages behind the links to the blog and sponsor sites are not either.
