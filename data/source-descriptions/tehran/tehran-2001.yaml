  contest_date: '2001-11-08'
  problems: 8
  description: |-
    Website of the Tehran site of the ACM International Collegiate Programming Contest, Asia Region, 2001, hosted by Sharif University of Technology, in English. The home page says the contest is over and links to results, problems and photos. Our copy holds 17 pages (the home page is saved under two addresses) and eight problem statements as Word files.

    The pages are news, information, program (headed Registration), steering committee, rules, teams, supporters, contact, links, an archive page about earlier contests and software, a table of participants, a standings page, a problems page, and two small pages for ranks and submission times. The program shows registration on 6 and 7 November, a practice contest on 7 November and the contest on Thursday 8 November, 8:30 to 13:30, with a closing ceremony and dinner in the evening. The participants page is a table of 97 teams with university, team name, contestants and coach. The standings page names only the team that qualified for the World Finals, the second best team and the best all-women team. The problems page lists problems A to H with links to the Word statements, which are in our copy.

    The links to the full standings, the test data, the photos, the brochure and the archive files lead to pages that are not in our copy; the two pages for ranks and submission times hold one line of text with links to lists that are not in our copy.
