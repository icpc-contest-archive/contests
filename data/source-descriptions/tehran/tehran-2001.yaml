    Page of the Tehran site of the 2001 ACM contest titled Standings, in English, with the heading Contest Results. It names three teams only: the team that qualified for the World Finals (Sharif Seniors, Sharif University of Technology), the second best team (Minerva, Amir Kabir University of Technology), whose qualification as a wild card is said to be pending confirmation by the Asia site director until all Asia contests are over (6 December), and the best all-women team (Sharif Dangers, Sharif University of Technology). The three members of each team are listed. Links lead to the final standings, to PC^2 generated rank and submission-time lists, and to the problems; those pages are not part of this copy.
