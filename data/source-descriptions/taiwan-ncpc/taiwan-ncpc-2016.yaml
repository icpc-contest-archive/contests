  description: |-
    News article on the China Times website (中時新聞網), credited in its page title to the Central News Agency (中央社) and dated 2016/07/02 13:10, headlined 程式設計奧林匹亞 虎尾科大躋身10強 (Chéngshì shèjì Àolínpǐyà, Hǔwěi Kēdà jīshēn shí qiáng, "Programming Olympiad: Huwei University of Science and Technology in the top 10"). In Chinese. It reports, from the university, that the ICPC Asia association authorised 虎尾科技大學 (National Formosa University) to hold the first national programming contest of technology universities, in which 30 teams from technology universities took part in a four-hour contest. A top 10 was chosen; first to third were National Kaohsiung First University of Science and Technology, National Chin-Yi University of Technology and National Taipei University of Technology, and the host's team received an honourable mention. The article gives no full results and no contest date.
