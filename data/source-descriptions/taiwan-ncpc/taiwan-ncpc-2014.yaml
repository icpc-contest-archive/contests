  description: |-
    Website of the Ministry of Education National Collegiate Software Design Contest, run by National Taiwan Normal University, in Chinese. Our copy mixes pages from several years rather than one edition: a static site for the 2003 (ROC year 92) contest with group rules and eligibility, regional organisers, dates, prizes, result lists and three problem text files; pages of the 2011 (ROC year 100) contest with a news list from October 2011 and a list of participating teams (group, school, team name, coach, members); a news list with entries from 27 June to 8 October 2014 on helper schools, online registration, test access from 23 September to 4 October and the system environment; and the site as it stood in 2018, 2019 and 2023, with news lists, schedules, prizes, venue and contact pages and an index of past problem files. A two-page PDF lists the prize-winning teams of the 2022 contest.

    Three PDFs named NCPC2015R1, NCPC2015R2 and NCPC2015R3 (files of ROC year 104) were saved cut off at 1,048,576 bytes each and do not open as complete PDFs. The files linked from the past-problems pages are mostly not in our copy. Our copy holds 59 pages, some of them small redirect stubs.
