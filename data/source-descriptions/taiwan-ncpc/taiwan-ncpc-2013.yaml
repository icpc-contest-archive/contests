  description: |-
    Page of past problems on the NCPC website of National Taiwan Normal University, in Chinese, headed 歷年題庫 (lìnián tíkù, "past problem bank"). It is the live page of the 2026 edition of the contest, fetched in October 2026, so the menu and title belong to that edition. It lists links to problem files for each year from year 91 to year 114 of the Republic of China calendar, newest first, with the files of the earlier years grouped by division.

    The entry for year 102 (2013) has three links: a data archive for the application software design division, the application software design division problems as a PDF, and the programming division problems as a PDF. The same list covers other years as well, so the page is not specific to this contest. Our copy holds the page with its style sheets and scripts; the linked PDFs and archives are not in it.
