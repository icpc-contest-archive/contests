  description: |-
    Contest guidelines of the Ministry of Education, a PDF of six pages in Chinese made with Microsoft Word, titled 教育部 101 年度全國大專電腦軟體設計競賽 競賽要點 (Jiàoyùbù 101 niándù Quánguó Dàzhuān Diànnǎo Ruǎntǐ Shèjì Jìngsài jìngsài yàodiǎn, "Ministry of Education 2012 National Collegiate Computer Software Design Contest: contest guidelines"). It names the Ministry as organiser and National Sun Yat-sen University (south region) and National Taiwan Normal University (north region) as hosts, and sets out three divisions: Group A for students of any department and Group B for students of non-computing departments, both under ACM-ICPC eligibility rules, and Group C on using open-source software packages (OpenOffice or LibreOffice and MySQL).

    For Groups A and B the problems are in English, at least six, over five hours, judged with PC2 in GNU C/C++ and scored the ACM way with 20 penalty minutes per rejected submission. Online registration ran from 19 September to 15 October (year 101 of the Republic of China, 2012); Groups A and B compete on 20 October and Group C on 21 October, in both regions at once. Further sections give the timetables of both contest days, directions to both sites, the prize money, and the recommendation of up to 15 teams of Groups A and B to the ICPC Asia Taiwan regional contest. The last page holds two images under an attachment heading that names the northern venue.
