  description: |-
    Detailed results of the 2005-06 Southern California Regional Programming Contest, in plain preformatted text: 66 teams with team ID, team name, solved, penalties and a total time score. The first 45 teams carry a rank; the 21 teams with no problem solved are listed after them without one. Under every team sits a small table for problems 1 to 8 with a solved mark (* or -), the number of runs and a time.

    The page ends with the summary of solutions by problem (117 solutions out of 371 attempts, an overall success rate of 31.5%). Many team names begin with an abbreviated institution name, for example Cal Poly SLO: or UCSD; there is no separate school column. The page is dated 14 November 2005; it gives no contest day.
