    Category page of the ICPC Live Archive for Regionals 2005, North America - Southern California, as it stood on 20 October 2021. It lists eight problems, 3442 to 3449, by title (Grocery Optimization, Credit Card Processing, Power Mean, Mean Median, Distance to Empty, SwampOS Floppy, Triangles, 4square), each with its total submissions and solving percentage and its total users and solving percentage.

