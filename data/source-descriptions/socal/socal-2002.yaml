  description: |-
    Final standings on the contest's own website: 47 ranked teams with rank, team name, school, number solved, penalties and total time in hours, minutes and seconds. Caltech A (California Institute of Technology) is first with six solved. Below the table an Honorable Mention list gives 9 more teams with team name and school only, so 56 teams appear in all.

    There is no per-problem detail. The page is dated 17 November 2002 and does not state the day of the contest.
