  title: 2002/2003 Southern California Regional Contest Results
  language:
  - en
  contest_date: '2002-11-16'
  description: |-
    Results summary page of the Southern California Regional on the organisers' site. It states that the regional was held on 16 November 2002 and that fifty-six teams from twenty-three schools took part, and it links to the standings, the detailed scoreboard and the problem set. It also gives a way to request a team's files from the contest by mail until 28 February 2003, and links to the summaries of the 1997 to 2001 contests and to winners before 1997.

    The page holds no results table of its own. The pages it links to are separate documents, and the links are not part of this copy.
