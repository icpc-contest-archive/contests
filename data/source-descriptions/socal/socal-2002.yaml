  description: |-
    Scoreboard of the regional contest on the contest's own website: 56 teams, each with rank, team ID, team name, number solved, penalties and a score shown as a time, followed by a block for problems 1 to 6 giving a solved mark (an asterisk or a dash), the number of runs and a time. 47 teams carry a rank and nine have none. Caltech A is first with six problems solved. All 56 teams are listed, including those with no problem solved.

    After the teams come a summary of solutions by problem (89 solutions out of 278 attempts, a success rate of 32.0 percent) and a table of attempts by language (C, C++, Java) for each problem, marked as not audited. The page is dated 18 November 2002 and does not state the day of the contest.
