  description: |-
    Detailed results of the 2006-07 Southern California Regional Programming Contest, in plain preformatted text: 73 teams, each with rank, team ID, team name, solved, penalties and a total time score; teams that tie share a rank, and the last teams are ranked 50. Under every team sits a small table for problems 1 to 7 with a solved mark (* or -), the number of runs and a time.

    The page ends with the summary of solutions by problem (135 solutions out of 397 attempts, an overall success rate of 34.0%). Teams are named with an abbreviated institution prefix or none, for example UCSB bender or Pomona College: Code Hunters. The page is dated 14 November 2006; it gives no contest day.
