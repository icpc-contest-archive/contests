  title: SoCal Region ICPC
  language:
  - en
  contest_date: '2024-11-16'
  description: |-
    Website of the Southern California regional, as it stood for the 2024/2025 contest, in English. The home page announces the contest of 16 November 2024 at Riverside City College, with registration at $160 per team, an unattended online rehearsal from 3 to 13 November 2024, a rehearsal appliance and packet, the contest platform and software versions (Fedora 40, DOMjudge 8.2) and a Hall of Champions table that lists every year from 1995-96 to 2024-25 with links to standings, details and problem sets.

    Our copy holds 150 files, 116 of them pages (HTML, PDF and text). For this edition it has four one-page bulletins (welcome, deadlines and food, schedule and lunch, last-minute reminders), a parking sign, the site waiver and the photo release form. The rest is older material kept on the same site: rules, FAQ, schedule, prizes, location and environment pages, some of them versions from earlier years (for example prizes and location pages that speak of 2007 and of 2020), bulletins for 2019-20 to 2023-24, a 10-page DOMjudge team manual, a folder of past problems, and a paper (6 pages) and slides (24 pages) on interactive contest problems with example files.

    The results and problem sets linked from the Hall of Champions are not in our copy, and it mixes versions of the pages from several years.
