  problems: 12
  times: true
  tries: true
  description: |-
    Preliminary scoreboard of the 2024/2025 Southern California Regional, produced by DOMjudge and marked "not final" in its heading: 88 teams against 12 problems labelled 01 to 12. Each team row gives rank, team name, institution, problems solved and total penalty time; the team's category (Four-Year Colleges and Universities or Two-Year Colleges) appears in a pop-up for each team. Each problem cell shows the solve time and number of tries, or only the tries for an unsolved problem, with colours for first solve, solved, tried and untried. A summary row gives the total solved (305) and, per problem, the accepted, rejected and pending submissions and the time of the first solve. Ranks run from 1 to 84; the last four teams carry no rank, and five teams in all have no solves. UCLA Three Musketeers is first with 12 problems. The page ends with a note "Last Update: Sun 17 Nov 2024".

    Style sheets and scripts are kept with our copy.
