  description: |-
    Usenet post to comp.org.acm, shown in the Google Groups viewer, in which the director of the Southern California Region of the ACM International Collegiate Programming Contest gives the results of the 1994/95 regional, sponsored by Microsoft. The table lists the top 15 teams, not all of them: the post says 36 teams from 23 institutions took part. Each row gives rank, team name, number solved (out of six problems), penalty runs and score, the score being the cumulative time to solution in seconds with 20 minutes added for each penalty run. Caltech #2 is first with five problems solved. The post names Caltech and UNLV as the teams advancing to the finals on 1 March 1995 in Nashville.

    The thread continues with 15 replies, which begin with a question about which compilers and operating systems contestants may use.
