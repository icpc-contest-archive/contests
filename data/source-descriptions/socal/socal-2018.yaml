  description: |-
    Final standings of the 2018 Southern California Regional Contest: 98 teams with rank, team name, institution, problems solved, total time, a medal column, a citation column and a site citation column. There is no per-problem detail. In the medal column the first six places read First Place to Sixth Place, three two-year colleges read Top Two-Year College, First Runner-Up Two-Year College and Second Runner-Up Two-Year College, 62 teams read Ranked and 27 read Honorable. The citation column gives the place name (First Place to Forty-ninth Place) for 49 teams and Honorable Mention for 22; it is blank for the 27 teams with no rank. The site citation column is filled only for the winner (Riverside Community College, Riverside City Campus). First place is USC Trojans with 10 problems solved.
