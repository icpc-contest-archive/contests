  description: |-
    Final scoreboard of the 2018-2019 Southern California Regional, a DOMjudge scoreboard page with the contest's header image and a footer reading Last Update Mon 12 Nov 2018 11:40:06 PST using DOMjudge. It lists 98 teams with rank, team name, institution and score (problems solved and total time), and one column for each of eleven problems labelled 01 to 11. Each problem cell gives the solve time, any penalty minutes and the number of tries, or only the number of tries when unsolved. A summary row gives per-problem totals, and a legend explains the cell colours for first solve, solved, tried and untried. Of the 27 teams with no solved problem, 26 have no rank number. First place is USC Trojans with 10 problems solved.
