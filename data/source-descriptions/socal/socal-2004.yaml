    Final standings of the 2004-05 Southern California Regional Programming Contest, a page of two tables. The first ranks 23 teams by rank, team name, school, problems solved, penalties and total time (HH:MM:SS); the first team is Caltech A with five problems solved.

    Under the heading Honorable Mention the second table lists the other 39 teams by name and school, without results, which makes 62 teams in all. There is no per-problem detail. The page is dated 14 November 2004.
