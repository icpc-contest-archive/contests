    Category page of the ICPC Live Archive for Regionals 2004, North America - Southern California, as it stood on 22 October 2021. It lists seven problems, 3159 to 3165, by title (MER Filenames through Escape from Swamp County Park), each with its total submissions and solving percentage and its total users and solving percentage.

    The page gives names only, with no statements; the title of each problem is a link to the site's own problem page, which is not in our copy. Menus and a login form of the site are on the page.
