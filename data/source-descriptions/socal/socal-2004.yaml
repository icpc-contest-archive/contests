  description: |-
    ZIP archive of the 2004 problem set of the Southern California Regional, ten files in all: an index page headed 2004 Problem Set and nine PDFs of 1 to 3 pages, 15 pages together. The index lists a warmup session (Problem 0, Mirrored Pairs, and a handout on programming for interaction with a server) and the contest's seven problems: MER Filenames, Instrument Calibration Effectivity, Temperature Data Compression, Swamptran, Swamp County Vote, Starving Students General Contractor and Escape from Swamp County Park.

    The statements of Problem 0 and Problems 1 to 7 are in English, headed 2004/2005 Southern California Regional ACM International Collegiate Programming Contest. Problems 0 to 6 give input and output format and a sample input and output; Problem 7 is marked as requiring an interactive server and gives a sample maze representation instead. The handout has no such heading. No test data or solutions are in the archive.
