  description: |-
    Detailed results of the 2004-05 Southern California Regional Programming Contest, in plain preformatted text: 62 teams with team ID, team name, solved, penalties and a total time score. The first 23 teams carry a rank; the other 39 are listed after them without one. Under every team sits a small table for problems 1 to 7 with a solved mark (* or -), the number of runs and a time.

    The page ends with the summary of solutions by problem (53 solutions out of 276 attempts, an overall success rate of 19.2%) and a table of attempts by language (C, C++, Java), and notes that the totals have not been audited. Team names carry no separate school column; some of the unranked teams are named with a school prefix, such as Azusa Pacific University: followed by the team name. The page is dated 16 November 2004; it gives no contest day.
