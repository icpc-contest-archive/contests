  description: |-
    Final standings scoreboard of the 2017 Southern California Regional, on the contest's own website: 105 teams with rank, team name, institution, problems solved and total time, and one column for each of ten problems labelled 01 to 10. Each problem cell gives the number of attempts with the solve time and any penalty minutes, or only a count when unsolved. A small image sits beside each team name. A summary row gives per-problem totals, and cells are colour-coded for first solve, solved, tried and untried. Of the 31 teams with no solved problem, 30 are listed without a rank.

    Below the table a legend names the team categories: four-year colleges and universities, two-year colleges, participants, observers, organisation, self-registered, system and jury. First place is USC Cardinal with 10 problems solved. The page's two images (a masthead and the small image beside the teams) are kept with it in our copy; it has no separate style sheet.
