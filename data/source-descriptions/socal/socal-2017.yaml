    Final standings of the 2017 Southern California Regional Contest: 105 teams with rank, team name, institution, problems solved, total time, medal and citation. There is no per-problem detail. Four teams have a gold medal, four silver and four bronze; places 1 to 52 carry a place citation such as First Place, and the 53 teams from place 53 down are marked Honorable Mention (31 of them tied at place 75 with no problems solved). First place is USC Cardinal with 10 problems solved.
