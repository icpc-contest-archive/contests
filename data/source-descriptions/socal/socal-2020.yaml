  description: |-
    Final standings of the 2020 Southern California Regional Contest: 70 teams, each with rank, team name, institution, number of problems solved and total time. The Medal column is filled for the first six places only (Regional Champion, then Second Place to Sixth Place); the Citation column gives a place name for every team, ordinal up to Fiftieth Place, then Honorable Mention for the remaining 20 teams, ten of whom solved one problem (ranks 51 to 60) and ten none (all at rank 61). A site citation column marks 12 teams as Two-Year Colleges. UCSD Team 1 is first with 11 solved. There is no per-problem detail.
