  description: |-
    Final scoreboard of the 2020/2021 Southern California Regional ICPC, a DOMjudge page: 70 teams against eleven problems labelled 01 to 11. Each team row gives rank, team name, institution, number solved and total time, and each problem cell shows the solve time with the number of tries, or only the number of tries for an unsolved problem. The first solve of each problem is marked. Teams belong to one of two categories, Two-Year Colleges (12 teams) and Universities and Four-Year Colleges (58), shown by row colour and named in a legend. Ten teams solved nothing, and nine of them have no rank. A summary row gives, per problem, the accepted, rejected and pending submissions and the time of the first solve. The last update is stamped 2 March 2021.

    Style sheets and scripts are kept with our copy.
