  description: |-
    Final scoreboard of the 2021/2022 Southern California Regional ICPC, a DOMjudge page: 48 teams against ten problems labelled 01 to 10. Each team row gives rank, team name, institution, number solved and total time, and each problem cell shows the solve time with the number of tries, or only the number of tries for an unsolved problem. The first solve of each problem that was solved is marked (nine of the ten). Teams belong to one of two categories, Four-Year Colleges and Universities (42 teams) and Two-Year Colleges (6), shown by row colour and named in a legend. Five teams solved nothing, and four of them have no rank. A summary row gives, per problem, the accepted, rejected and pending submissions and the time of the first solve. The last update is stamped 26 February 2022. The problem column headings link to problem texts on a local server that is not part of our copy.
