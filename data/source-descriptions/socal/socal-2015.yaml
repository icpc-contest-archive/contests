  description: |-
    Final scoreboard of the 2015 Southern California regional, stamped Tue 17 Nov 2015 16:02 with a footer reading Last Update: Mon 16 Nov 2015 10:05 using DOMjudge. It lists 89 teams against ten problems numbered 01 to 10. Columns are rank, team (with its institution), score (the number of problems solved), total time and one column per problem; a problem cell gives the number of tries and, for a solved problem, the solving time; a failed attempt adds a 20-minute penalty shown beside the time. Rank is given to 85 teams, the last of them with no problem solved; the four teams after it, also with none solved, have no rank. A Summary row gives totals per problem, and legends explain the cell colours (solved first, solved, tried and incorrect, untried) and two categories, Two-Year Colleges and Universities and Four-Year Colleges. First place is Caltech Kiss a Wookie with seven problems solved.
