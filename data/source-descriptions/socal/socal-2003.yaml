  description: |-
    Scoreboard of the regional contest on the contest's own website: 59 teams, each with rank, team ID, team name, number solved, penalties and a score shown as a time, followed by a block for problems 1 to 6 giving a solved mark (an asterisk or a dash), the number of runs and a time. Caltech A is first with six problems solved. 48 teams carry a rank and eleven have none. Teams with no problem solved are listed too.

    After the teams come a summary of solutions by problem (90 solutions out of 236 attempts, a success rate of 38.1 percent). The page is dated 16 November 2003 and does not state the day of the contest. Java's Nightmare, an honorable mention team on the standings page, is not among the 59 teams.
