  description: |-
    Standings of the 2016 Southern California Regional Contest: 94 teams with rank, team name, institution, number solved and time, with no per-problem detail. The Medal column marks the first four teams as gold, the next four as silver and the next four as bronze. The Citation column reads First Place through Forty-seventh Place for the first 47 teams and Honorable Mention for the other 47; the last 17 of them solved no problem and share rank 78. First place is filter of the University of California Irvine with nine problems solved.
