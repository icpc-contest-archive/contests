  description: |-
    Final scoreboard of the 2016 Southern California regional; the footer reads Last Update: Sun 13 Nov 2016 22:55 using DOMjudge. It lists 94 teams against ten problems numbered 01 to 10. Columns are rank, team (with a country flag and its institution), score (number solved and total time) and one column per problem; a problem cell gives the number of tries and, for a solved problem, the solving time; a failed attempt adds a 20-minute penalty shown beside the time. Rank is given to 78 teams, the last of them with no problem solved; the 16 teams after it, also with none solved, have no rank. Team names are shaded by category: 62 four-year colleges and universities and 32 two-year colleges. A Summary row gives totals per problem, and legends explain the cell colours and the categories, which also name Observers, Organisation, Self-Registered and System although no team in our copy is shaded for them. First place is filter of the University of California Irvine with nine problems solved.
