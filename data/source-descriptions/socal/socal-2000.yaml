    Home page of the Southern California Regional programming contest, a single page of the series site as it stood in 2000 (page last updated 9/7/2000). It has links to the 11/11/2000 contest results, the Hall of Fame (champions), a call for volunteers, general contest information, local ACM student chapters and the ACM programming contest web page. Our copy holds only this one page; the pages it links to are not in it.
