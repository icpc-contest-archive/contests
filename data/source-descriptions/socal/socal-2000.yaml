  description: |-
    Detailed results of the 2000-01 Southern California Regional Programming Contest: 52 teams, six problems numbered 1 to 6. Each team has a rank (the teams with nothing solved at the end have none), a team ID, team name, number solved, penalties and score, followed by a block of six rows giving for each problem a solved mark, the number of runs and a time.

    The page ends with a summary by problem (solutions, attempts and percentage for each of the six problems) and the totals: 61 solutions out of 226 attempts, 27.0 percent. The first-place team is Caltech 1 with four problems solved.
