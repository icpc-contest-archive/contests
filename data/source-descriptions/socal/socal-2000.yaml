    Problem set of the 2000/2001 ACM Southern California Regional Scholastic Programming Contest, a PDF of 17 pages in English. The first page is an index of seven problems: 0 MET Conversion (warm-up), 1 SPC, 2 Map Corners, 3 Swamp Router, 4 People First, 5 Vote Count and 6 Team Packing. Each problem has a statement with input and output format and a sample input and output; the statements carry the heading of the contest but no date or place. The footer of the first page gives the address of the contest's past-problems web page with the time 1/27/2001.
