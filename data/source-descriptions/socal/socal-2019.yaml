  description: |-
    Scoreboard produced by DOMjudge, headed 2019-2020 Southern California Regional ICPC preliminary results - not final, with a footer reading Last Update Sat 09 Nov 2019 22:10:41 PST using DOMjudge. It lists 88 teams with rank, team name, institution and score (problems solved and total time), and one column for each of ten problems labelled 01 to 10. Each problem cell gives the solve time, any penalty minutes and the number of tries, or only the number of tries when unsolved. A summary row gives per-problem totals; a legend explains the cell colours for first solve, solved, tried and untried, and a second legend names the categories Four-Year Colleges and Universities and Two-Year Colleges. Of the 11 teams with no solved problem, 10 have no rank number. First place is Baltech B with 9 problems solved.
