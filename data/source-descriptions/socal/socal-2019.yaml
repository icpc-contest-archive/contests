  description: |-
    Final standings of the 2019 Southern California Regional Contest: 88 teams with rank, team name, institution, problems solved, total time, a medal column, a citation column and a site citation column. There is no per-problem detail. The winner is marked Regional Champion and the following places carry their place number in the medal column; 33 ranked teams are marked Honorable Mention in the citation column, and 11 teams without a rank, all with no problems solved, are marked Honorable. The site citation column names Four-Year Colleges and Universities for first place and Two-Year Colleges for the team in 21st place. First place is Baltech B with 9 problems solved.
