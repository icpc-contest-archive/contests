  description: |-
    Scoreboard of the 2014 Southern California regional, headed Preliminary Standings and stamped Sat 8 Nov 2014 20:34; the footer says Last Update and names DOMjudge. It lists 86 teams against nine problems numbered 1 to 9. Columns are rank (#), team, score (the number of problems solved), penalties (total time) and one column per problem; a problem cell gives the number of tries and, for a solved problem, the solving time, each failed try adds 20 minutes, shown beside the solving time. Rank is given to the 69 teams that solved at least one problem; the 17 teams with none have no rank. First place is USC Trojans with seven problems solved. The page has no institution column.
