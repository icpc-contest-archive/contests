    Standings of the 2022 ICPC Southern California Regional Contest: 59 teams, each with team name, institution, number of problems solved and total time. The first 46 teams carry a rank and a place name in the Medal column, First Place to Forty-sixth Place; the other 13 have no rank and are labelled Honorable. The Citation and Site citation columns repeat the place names, with Regional Champion for first place; at ranks 32 and 35 they read Top Two-Year College and Runner-Up Two-Year College. UCSD Fallen Star is first with 8 solved. There is no per-problem detail.
