  description: |-
    Preliminary scoreboard of the 2022/2023 Southern California Regional ICPC, a DOMjudge page headed "preliminary results - not final": 59 teams against ten problems labelled 01 to 10. Each team row gives rank, team name, institution, number solved and total time, and each problem cell shows the solve time with the number of tries, or only the number of tries for an unsolved problem. The first solve is marked for nine of the ten problems; problem 03 has no submissions at all. Teams belong to one of two categories, Four-Year Colleges and Universities (50 teams) and Two-Year Colleges (9), shown by row colour and named in a legend. Three teams solved nothing, and two of them have no rank. A summary row gives, per problem, the accepted, rejected and pending submissions and the time of the first solve. The last update is stamped 26 February 2023.
