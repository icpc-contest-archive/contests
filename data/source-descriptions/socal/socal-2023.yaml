  description: |-
    Preliminary scoreboard of the 2023/2024 Southern California Regional, produced by DOMjudge and marked "not final" in its heading: 84 teams against 11 problems labelled 01 to 11. Each team row gives rank, team name, institution, problems solved and total penalty time; the team's category (Four-Year Colleges and Universities or Two-Year Colleges) appears in a pop-up for each team, and in the row of the first team as a badge. Each problem cell shows the solve time and the number of tries, or only the tries for an unsolved problem, and cells are coloured for first solve, solved, tried and untried. A summary row at the bottom gives the total solved (310) and, per problem, the accepted, rejected and pending submissions and the time of the first solve. The top three teams are UCLA Stroopwafel, UCLA Fortune and UCLA Shortbread with 10 problems each; the last three teams have no solves, and the last two of them carry no rank. The page ends with a note "Last Update: Mon 30 Oct 2023".

    Style sheets and scripts are kept with our copy.
