  description: |-
    Problem set of the 2021 German Collegiate Programming Contest: a PDF of 30 pages in English. The cover gives the contest name and the date June 26th and lists the 14 problems A to N, from Amusement Arcade to Natural Navigation.

    Each of the 14 problems has a statement with input and output format and sample input and output, and some have a Notes section. One statement carries a photo credit. Four pages (2, 4, 6 and 28) are marked as intentionally left blank: after the cover and after problems A, B and L. No solutions or test data.
