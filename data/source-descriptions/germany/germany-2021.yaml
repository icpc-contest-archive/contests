  description: |-
    Slide deck of 67 pages presenting the solutions of the 2021 German Collegiate Programming Contest, in English. It opens with thanks to the twelve jury members and one test reader and with submission statistics charts. It then goes through the 14 problems, in the order B, M, A, H, K, C, E, G, L, I, N, D, F, J, each with a statistics chart, a problem summary, the solution idea and the name of the problem author.

    The last slide, in German, announces the scoreboard resolution, the award ceremony, a meeting in WorkAdventure and an extended contest with the contest problems on a judge server.
