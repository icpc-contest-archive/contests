  description: |-
    One-page website of the 2021 German Collegiate Programming Contest, in English. The intro text says the contest was held completely online on 26 June with 85 teams, names the winner, notes that seven universities placed teams in the top ten, and links to the problem set, the solution outlines and a test data archive.

    Below the text is the final scoreboard: 85 teams, each with rank, a flag, team name, institution, a Score column holding the number solved and the total time, and a cell for each of the 14 problems A to N. A solved cell gives the solve time and the number of tries; a cell with attempts but no solution shows only the tries. Two teams share rank 84. The team in first place is Dolores TUMbridge from TU München with 12 problems solved.

    Our copy holds this single page with its scoreboard style sheet, the ICPC logos and the flag image; the site's main style sheet is not in our copy.
