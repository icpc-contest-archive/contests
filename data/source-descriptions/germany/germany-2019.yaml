  description: |-
    Front page of the GCPC 2019 website with the final scoreboard. A short text says the German Collegiate Programming Contest 2019 was held on July 6th, that 94 teams competed at 11 sites in Germany, and that the winner solved all 13 problems in 1526 minutes. It links to the problem set, the solution outlines and the test data (sample, secret and jury submissions).

    The scoreboard lists 94 teams with rank, a flag, team name, the team's university, solved count and penalty time, and one cell for each of the problems A to M that gives the solve time and the number of tries for a solved problem and is empty otherwise; first solves are marked. There is no separate block for online or guest teams.

    Our copy holds this one page. The files it links to are not part of it.
