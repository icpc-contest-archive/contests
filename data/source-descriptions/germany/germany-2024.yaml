  description: |-
    Solution slides of the GCPC jury, a PDF of 131 pages in English, with the date June 22, 2024 on the title slide. The title slides list the jury, test solvers and technical team with their universities. Slides for problems A to M name the problem author, summarise the problem and explain the solution, and the problem slides include a chart of submissions by outcome (correct, wrong answer, time limit, run error, pending) against contest time, followed by a chart of submissions by programming language. The last slides give jury figures: 583 secret test cases, 149 jury solutions and the minimum number of lines and characters needed to solve all problems. Many slides repeat the previous one with one more point added.
