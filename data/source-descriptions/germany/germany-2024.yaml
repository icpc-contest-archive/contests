  problems: 13
  times: true
  tries: true
  description: |-
    Scoreboard of GCPC 2024 produced by DOMjudge, with rank, team, institution, problems solved, total time and one cell per problem A to M giving the solve time and the number of tries. It lists 130 teams in two groups: 94 teams, then a second group of 36 teams numbered again from 1. In each group the lowest teams, which solved nothing, have their rank left blank: 12 of the 14 teams with no problem solved have no rank. One team in the first group carries a Participants label and another a First Time Participants label; the first team of the second group is labelled Out Of Competition, and four teams of that group have External in the institution column. Each group ends with a summary row giving, per problem, the numbers of accepted, rejected and pending submissions and the time of the first solve.

    Top of the first group is Kindergarten Timelimit (Karlsruhe Institute of Technology) with 10 problems solved and a total time of 828.
