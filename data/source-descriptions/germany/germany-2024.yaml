  - en
  contest_date: '2024-06-22'
  description: |-
    Website of the German Collegiate Programming Contest 2024, organised by CPUlm, in English. Our copy holds 9 pages: the home page, a results page, a materials page, rules, a description of the judging system with compilers and limits, an FAQ, an About page, and two PDFs (a primer titled How To GCPC and the solution slides). The home page says the contest took place on June 22, 2024, that the final scoreboard is online, and that the problem set, solution slides, test cases and jury submissions are available.

    The results page is a DOMjudge scoreboard. The About page describes the contest (teams of three, five hours, ranking by problems solved and then total time, 20 minutes per incorrect submission) and links past editions GCPC 2010 to 2023. Partner AltaSigma GmbH is thanked for the judge infrastructure. The problem set PDF and the archive of problems with jury submissions and secret test cases are linked from the materials page but are not part of our copy of the site. The samples ZIP linked there is in our copy.
