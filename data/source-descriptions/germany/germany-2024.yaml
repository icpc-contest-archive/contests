  description: |-
    Solution slides of the GCPC jury, a PDF of 117 pages in English, with the date September 12, 2024 on the title slide; this is a later revision than the slides dated June 22, 2024 held as another source. The title slides list the jury, test solvers and technical team with their universities. Slides for problems A to M name the problem author, summarise the problem and explain the solution. The last slides give jury figures: 583 secret test cases, 149 jury solutions and the minimum number of lines and characters needed to solve all problems. Unlike the June version, this file has no chart of submissions by outcome.
