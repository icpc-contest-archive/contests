  description: |-
    Home page of the German Collegiate Programming Contest series, titled ACM ICPC meets FAU, in English. It explains the ICPC and names the three subregional contests of the North Western European region (BAPC, NCPC and the German contest). A section on GCPC 2014 says the contest was held on 24 May, 64 teams competed at several sites across Germany, and the winner was team JustKITing from KIT with 8 solved problems in a total time of 1100 minutes. The page carries a last-update stamp of 2014-05-26 and a menu with pages for the sites, rules, FAQ and the editions GCPC 2010 to 2014, plus a contact address.

    There is no standings table on the page. Our copy is this one page with its logo image; the linked pages are not part of it.
