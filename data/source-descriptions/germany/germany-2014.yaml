  description: |-
    Scoreboard page of the German Collegiate Programming Contest 2014, with a short report above it: the contest was held on 24 May, 64 teams competed at several sites across Germany, and the winner was team JustKITing from KIT with 8 of 11 problems solved in a total time of 1100 minutes. The scoreboard lists 64 teams with rank, country flag, team name, university, number solved and penalty time, then one column for each of the problems A to K showing the solve time and the number of tries. First solves of a problem are marked in the page's markup. Ranks run from 1 to 60, with the last five teams tied at 60 with no problem solved.

    Links lead to the problem set and the solution outlines; the report notes that the test data is missing. Our copy is this one page with its scoreboard style sheet and images; the site's main style sheet was not captured.
