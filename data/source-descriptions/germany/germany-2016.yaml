  description: |-
    Single page of the contest website for the 2016 German Collegiate Programming Contest. A short news text gives the date, June 4th, says 96 teams competed at several sites allover Germany, names the winner (breaKIT from KIT, ten of twelve problems solved in a total of 941 minutes) and says four universities are in the top ten. Links lead to the problem set, solution outlines and test data; the text notes that the jury solutions are missing.

    Below it is the final scoreboard: 96 teams ranked 1 to 94 (ties share a rank), each with team name, institution, number solved and total time, and for each of the twelve problems A to L a cell with the solve time and number of tries, or the number of tries alone when unsolved; a cell is empty when the team made no attempt. After the list, set off by separator rows, one more team row repeats the format: undeFAUned behaviour (Friedrich-Alexander-Universität Erlangen-Nürnberg), at rank 1 with 12 solved in 1709 minutes; the page does not say why it is set apart. Our copy holds this one page with its style sheet and images.
