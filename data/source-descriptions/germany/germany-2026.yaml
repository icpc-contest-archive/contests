  contest_date: '2026-06-13'
  pages: 10
  description: |-
    Website of the German Collegiate Programming Contest 2026, in English, organised by CPUlm; the home page gives June 13, 2026 as the contest day and thanks AltaSigma GmbH for sponsoring the judge infrastructure. Our copy holds ten pages: home, teams, rules, schedule, system, results, materials, FAQ, about and registration. Its home page still reads as before the contest and says registration starts on May 20, 2026, while the results page holds the final results.

    The schedule gives registration from May 20 to June 11, a practice session from June 5 to June 11 and the contest on June 13 from 11:00 to 16:00 CEST. The teams page lists 104 competing and 25 out-of-competition teams by institution, and the results page is a scoreboard of problems A to M. The rules page gives the ICPC regional contest rules with additions. The system page lists the programming languages (C++, C, Java, Python 3 with PyPy, Haskell, Rust) and the sandbox limits. The materials page links four files on another server: a How to GCPC file, the problem set, the solution slides and an archive of jury submissions and test cases; none of them is in the website copy. The registration page says registration is closed.
