- url: https://2022.gcpc.nwerc.eu/
  read: '2026-11-16'
  rubric: 1
  copy: germany/germany-2022/website/2026-09-04-live-a0a7715e
  title: GCPC 2022
  language:
  - en
  description: |-
    Website of the 2022 German Collegiate Programming Contest (GCPC), in English, organized by CPUlm as the About page says, with infrastructure sponsored by AltaSigma GmbH. Our copy holds 12 pages: eight HTML pages (Home, Teams, Rules, Schedule, System, Results, Materials, About) and four PDFs. The home page carries a statement by the organizers on the war in Ukraine. Rules refer to the ICPC regional contest rules with additions on conduct. The schedule gives registration from June 1 to June 23, a practice session from June 15, and the contest on June 25 from 11:00 to 16:00. The System page lists the languages C++, C, Java and Python 3 (run with PyPy). About describes the contest format and links to the earlier editions GCPC 2010 to 2021.

    The Teams page lists 82 competing teams and 17 out-of-competition teams grouped by institution. The Results page is a scoreboard of problems A to M. Materials links the contest files (problem set, solution slides, a ZIP of samples, a ZIP of problems with test cases, DOMjudge problem packages) and the practice session files, whose problems the page says were taken from NWERC 2021. In our copy are the problem set PDF, the solution slides, the samples ZIP and the practice session problem set and slides. The test case ZIP, the problem packages and the practice session archive are not.
