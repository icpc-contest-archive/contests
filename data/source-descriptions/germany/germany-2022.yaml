  description: |-
    Problem set PDF of 28 pages in English. The cover names the German Collegiate Programming Contest 2022 and June 25th and lists thirteen problems, A Alternative Architecture to M Mirror Madness. Each problem has a time limit and a statement. Ten of them have input and output sections with samples; problem I has input and output sections but no sample; problems D and H are interactive and have an interaction section and sample interactions instead. Six pages (2, 6, 12, 20, 22 and 26) are left almost blank. No test data or solutions.
