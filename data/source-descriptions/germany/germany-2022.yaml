  teams: 100
  problems: 13
  times: true
  tries: true
  description: |-
    Scoreboard of the contest in two groups, each with a summary row. The first group, labelled Participants, has 80 teams: 73 ranked from 1 to 73 (the team at rank 73 solved nothing) and 7 unranked with no problems solved. The second, labelled Out of Competition, has 20 teams: 18 ranked 1 to 18 and 2 unranked. Columns are rank, team, score and problems A to M. Each team row gives team name, institution, number solved and total time; a solved problem shows the solve time in minutes and the number of tries, and an unsolved problem that was attempted shows only the number of tries. Each summary row gives the total solved and, per problem, the numbers of accepted, rejected and pending submissions and the time of the first solve in minutes. First place among the participants is Tzatzikitartare of Karlsruher Institut für Technologie with 11 problems and 1298. The page says nothing about being final or frozen.
