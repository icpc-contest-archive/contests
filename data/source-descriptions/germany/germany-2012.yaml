  description: |-
    Standings of the 2012 German Collegiate Programming Contest: 65 teams with rank, team name, institution, number of problems solved, total time and a citation. The first 32 places carry a citation from First Place to Thirty-second Place; the next 23 teams, ranks 33 to 46, are marked Honorable Mention; the last 10 teams solved nothing and have neither rank nor citation. The first team, easy cheesy peasy from Friedrich-Alexander-University Erlangen-Nuremberg, solved 10 problems in 1478. No per-problem detail and no number of attempts. The page names the contest year and ICPC year 2013 in its header.
