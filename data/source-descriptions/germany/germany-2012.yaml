  description: |-
    Page of the contest's own website for the 2012 edition, in English. It opens with a short text saying the contest was held on 30 June, that the winner was easy cheesy peasy from FAU Erlangen-Nürnberg with 10 of 11 problems solved in a total time of 1478, and that many problems were solved in the last hour, when five more universities entered the top ten. It links to the problem set, the sample input, the secret test data, the solution outlines and some judge solutions.

    Below the text is a scoreboard of 56 teams: rank, a country flag, team name and institution, number solved and total time, then one column for each of problems A to K. A cell shows the solve time in minutes and the number of tries, or only the tries for an unsolved problem. Teams with equal results share a rank; eleven teams that solved nothing share rank 46, the last. Our copy holds this one page with its style sheet, logos and flag image.
