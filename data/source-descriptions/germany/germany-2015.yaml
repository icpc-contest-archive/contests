  description: |-
    Single page of the contest website for the 2015 German Collegiate Programming Contest. A short news text gives the date, June 20th, says 62 teams competed at several sites allover Germany, names the winner (oachkatzlschwoaf++ from TUM, seven of eleven problems solved in a total of 988 minutes) and notes that six universities are in the top ten. Links lead to the problem set, solution outlines, test data and jury solutions.

    Below it is the final scoreboard: 62 teams ranked 1 to 62, each with team name, institution, number solved and total time, and for each of the eleven problems A to K a cell with the solve time and number of tries, or the number of tries alone when unsolved; a cell is empty when the team made no attempt. Our copy holds this one page with its style sheet and images; the linked files are not part of it.
