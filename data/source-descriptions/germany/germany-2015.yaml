  description: |-
    Final standings of the 2015 German Collegiate Programming Contest: 69 teams with rank, team name, institution, number of problems solved, total time, medal and citation. Ranks 1 to 62 are in order, followed by seven teams with no problem solved that share rank 63. Places 1 to 4 carry gold, 5 to 8 silver and 9 to 12 bronze medals. The citation column reads First Place to Thirty-fourth Place for ranks 1 to 34; from rank 35 on, all 35 remaining teams are marked Honorable Mention. First place is oachkatzlschwoaf++ from Technische Universität München with 7 solved in 988 minutes.

    No per-problem results.
