  contest_date: '2025-07-05'
  pages: 9
  description: |-
    Website of the German Collegiate Programming Contest 2025, in English, organised by CPUlm; the home page says the contest took place on July 05, 2025 and thanks AltaSigma GmbH for sponsoring the judge infrastructure. Our copy holds nine pages: home, results, materials, rules, system, FAQ and about pages, plus the problem set and the solution slides as PDFs. It also holds the ZIP of sample files and the style sheets.

    The results page is a scoreboard of 146 teams for problems A to M. The materials page links the problem set, the samples ZIP, the solution slides and an archive of jury submissions and secret test cases; that archive is not in our copy. The rules page gives the ICPC regional contest rules with additions on what may be brought and how to behave. The system page lists the programming languages (C++, C, Java, Python 3 with PyPy, Haskell) and the sandbox limits. The FAQ covers taking part, hosting a contest site and the call for problems; the about page explains the format (teams of three, five hours) and the ranking rules, and links to the sites of other editions. Of the flags and institution logos on the results page, our copy has the German flag and 15 of 27 logos.
