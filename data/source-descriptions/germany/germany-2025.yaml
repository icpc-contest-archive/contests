  description: |-
    Scoreboard for problems A to M: 146 teams in two blocks, each with its own summary row. The first block lists 110 teams with rank, flag, institution logo, team name, institution, problems solved, total penalty time, and for each problem the solve time in minutes and the number of tries, or only the tries when unsolved. Infinite L∞pers (Karlsruhe Institute of Technology) is first with 13 problems solved. Two badges mark the best team of the categories Participants and First Time Participants.

    The second block is headed Out Of Competition and lists 36 teams ranked separately, with Delft University of Technology's Segfault go BRRRR first with 13 solved; three of its teams give External as their institution. The summary rows give totals of solved problems, accepted, rejected and pending submissions and the first solve time per problem. Some teams with no solved problem are listed without a rank. Of the flags and logos, our copy has the German flag and 15 of 27 institution logos.
