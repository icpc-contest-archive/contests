  description: |-
    Page of the German Collegiate Programming Contest 2017 on the contest's own site, in English. A short text says the contest was held on July 1st, that 128 teams competed at several sites in Germany, and that the winner was Hello KITty from KIT with 10 of 11 problems solved in a total time of 1339 minutes; links lead to the problem set, solution outlines, test data and jury solutions.

    Below the text is the scoreboard, with rank, team name and institution, number solved, total time, and one column for each of problems A to K giving the solve time in minutes and the number of tries (an unsolved problem shows tries only). It has 125 team rows in two groups: 117 teams ranked 1 to 113 (the last five share rank 113 with zero solved), and, after a separator row, a second group of 8 teams ranked 1 to 8 on their own. The page does not say why the second group is separate. Style sheets and images are in our copy.
