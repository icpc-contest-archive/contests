  description: |-
    Page of the ICPC@TUM site of the Technical University of Munich, in English, about GCPC 2017. A report says the contest was the largest so far, with 128 teams from 18 universities at 12 contest sites, that the problem set had 11 tasks, and who took the first three prizes. A Photos heading, with a link to a photo set, precedes the results section.

    The results section is a scoreboard of 128 team rows: rank, team and institution, number solved and total time, and columns A to K giving tries/minutes for solved problems (written like 4/230), tries alone for problems attempted but not solved, and 0 for problems not attempted. The rows are in two groups: 117 teams ranked 1 to 113, and a second group of 11 teams ranked 1 to 11 on their own, all highlighted in blue; the page says teams highlighted in blue were not eligible and competed out of competition. Three of these 11 are named Reserve. The page also holds the site's menu and a list of links to other TUMjudge sites.
