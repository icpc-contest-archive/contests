  description: |-
    Page of the contest's own website for the 2011 edition, in English. It opens with a short text saying the contest was held on 2 July, that the winner was segFAUlt from FAU Erlangen-Nürnberg with 9 of 10 problems solved in a total time of 1677, and that Blamage à Trois from Rostock could not hold its top position in the last hour. It links to the problem set, the secret test data and the solution outlines, and notes that the sample input is missing.

    Below the text is a scoreboard of 43 teams: rank, a country flag, team name and institution, number solved and total time, then one column for each of problems A to J. A cell shows the solve time in minutes and the number of tries, or only the tries for an unsolved problem. Ties are ranked together: six teams share rank 38 with no problems solved. Our copy holds this one page with its style sheet, logos and flag image.
