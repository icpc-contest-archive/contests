  contest_date: '2023-06-17'
  description: |-
    Website of the German Collegiate Programming Contest 2023, organised by CPUlm, in English. Our copy holds 10 pages: the home page, a results page, a materials page, rules, a description of the judging system with compilers and limits, an FAQ, an About page, and three PDFs (a primer titled How To GCPC, the problem set and the solution slides). The home page says the contest took place on June 17, 2023 and that the problem set, solution slides, test cases and jury submissions are available.

    The results page is a DOMjudge scoreboard. The About page describes the contest (teams of three, five hours, ranking by problems solved and then total time, 20 minutes per incorrect submission) and links past editions GCPC 2010 to 2022. Partner AltaSigma GmbH is thanked for the judge infrastructure. The materials page also links a samples ZIP, which is in our copy, and an archive of problems with jury submissions and secret test cases, which is not.
