  description: |-
    Scoreboard of GCPC 2023 produced by DOMjudge, with rank, team, institution, problems solved, total time and one cell per problem A to M giving the solve time and the number of tries. It lists 123 teams in two groups: 105 teams ranked 1 to 105 (one row has its rank left blank), then a second group of 18 teams, numbered again from 1. One team in the first group carries a Participants label and another a First Time Participants label; the first team of the second group is labelled Out of Competition, and the last team of that group has External in the institution column. Each group ends with a summary row giving, per problem, the numbers of accepted, rejected and pending submissions and the time of the first solve.

    Top of the first group is Kindergarten Timelimit (Karlsruhe Institute of Technology) with 12 problems solved. The page states it was last updated on 20 June 2023.
