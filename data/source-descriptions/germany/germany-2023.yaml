  description: |-
    Solution slides of the GCPC 2023 jury, a PDF of 125 pages in English, dated June 17, 2023. The title slides list the jury, test solvers and technical team with their universities. Slides for each of the problems A to M, in the order E, G, M, L, D, I, C, B, F, K, J, H, A, name the problem author, summarise the problem, explain the solution and show a chart of submissions by outcome against contest time. A chart of submissions by programming language follows. The last slides give jury figures: 275 commits, 773 secret test cases, 133 jury solutions and the minimum number of lines needed to solve all problems. Many slides repeat the previous one with one more point added, which accounts for the page count.
