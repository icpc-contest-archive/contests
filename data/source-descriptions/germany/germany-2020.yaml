  description: |-
    Problem set of the 2020 German Collegiate Programming Contest: a PDF of 28 pages in English. The cover gives the contest name and the date November 21st and lists the 13 problems A to M, from Adolescent Architecture to Mixtape Management.

    Twelve problems have a statement with input and output format and sample input and output; problem C is interactive and has an interaction protocol and a sample interaction instead. Five statements carry image credits. Three pages, between the cover and A, between A and B, and between F and G, are marked as intentionally left blank. No solutions or test data.
