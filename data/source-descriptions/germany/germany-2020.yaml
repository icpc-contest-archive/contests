  description: |-
    Slide deck of 75 pages presenting the solutions of the 2020 German Collegiate Programming Contest, in English. It opens with thanks to the ten jury members and two test readers and with submission statistics charts. It then goes through all 13 problems, in the order F, A, M, C, B, G, K, D, I, L, J, E, H, each with a statistics chart, a short problem summary, the solution idea and the name of the problem author.

    The last slide, in German, announces the scoreboard resolution, the award ceremony, a voice chat and an extended contest with the contest problems on a judge server.
