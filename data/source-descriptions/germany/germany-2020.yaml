  description: |-
    Final standings of the 2020 German Collegiate Programming Contest: 70 teams with rank, team name, institution, number of problems solved, total time and a citation. No per-problem detail.

    The first 34 rows carry the citations First Place to Thirty-fifth Place (there is no Twenty-fourth Place) and the other 36 teams Honorable Mention. Ranks run to 68, and four teams share the last rank with no problems solved. First place is Dolores TUMbridge from Technische Universität München with 13 solved and time 1720; Karlsruhe Institute of Technology is second with 12 and Saarland University third with 11.
