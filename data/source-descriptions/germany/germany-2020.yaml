  description: |-
    One-page website of the 2020 German Collegiate Programming Contest, in English. The intro text says the contest was held completely online on 21 November with 68 teams, names the winner and links to the problem set, the solution outlines and a test data archive.

    Below the text is the final scoreboard: 68 teams ranked 1 to 68, each with a flag, team name, institution, a score column and a cell for each of the 13 problems A to M. A solved cell gives the solve time and the number of tries; a cell with attempts but no solution shows only the tries. The team in first place is Dolores TUMbridge from TU München with all 13 problems solved.

    Our copy holds this single page with its scoreboard style sheet, the ICPC logos and the flag image; the site's main style sheet is not in our copy.
