  description: |-
    Page in Swedish headed "SVENSKT MÄSTERSKAP 1996" ("Swedish Championship 1996"), a short report followed by a results list. The report says the first Swedish championship for student programmers was held on 28 September in Lund and Luleå in parallel, with teams from six universities and colleges and seven problems, and says which teams are expected to go to the European final.

    The results list (Resultatlista) has 32 rows, each a team named by a surname with an institution and class code, with a time for each solved problem among A to G, a dash for the others, the number solved (ANTAL) and the total time (TID). Two teams share place 30 with no problems solved, and the last row is marked Uteblev (did not show up). A key below the list expands six institution abbreviations. The page links to two photographs, which are in our copy, and to pages about the winners and the placed Lund teams, which are not.
