  description: |-
    Single page in Swedish on the 2000 Swedish student championship, held in parallel in Linköping, Lund, Stockholm and Umeå on 30 September with teams from fifteen universities; Linköping and Stockholm are named as new sites that year. It links to the problem set PDF, to the test data as a zip file, to a poster image, and to a page of photos from the contest.

    The result list is a plain-text table of 58 teams with rank, name, institution code, a time for each solved problem among seven columns A to G, the number solved and the total time; unsolved problems are marked with a dash. Eleven teams with no solved problems share rank 48. A legend expands the institution abbreviations. Our copy holds this page with its logo and poster images; the problem set PDF is a separate source, while the test data and the photo page are not in this copy.
