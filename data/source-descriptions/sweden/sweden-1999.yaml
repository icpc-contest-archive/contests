  description: |-
    Single page in Swedish on the 1999 Swedish student championship, held in parallel in Luleå, Lund and Umeå on 25 September with teams from eight universities. It has a link to the contest poster (A3 PDF), a list of seven problems A to G (Volleyboll, Virus, Jaktstart, Matrix, Play Ball, Korsord, Stitching) linking to a statement page each, and a link to the test data as a zip file.

    The result list is a plain-text table of 42 teams with rank, name, institution code, a time for each solved problem, the number solved and the total time; unsolved problems are marked with a dash. Nine teams with no solved problems share rank 34. A legend expands the institution abbreviations. Our copy holds only this page and its logo image: the poster, the statement pages, the test data and the pages linked from the top teams are not in it.
