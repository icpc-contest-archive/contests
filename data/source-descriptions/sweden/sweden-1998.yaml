  description: |-
    Page in Swedish headed "1998 års tävling" ("the 1998 contest"): a report, a list of the seven problems and a results list. The report says the Swedish championship for students was held on 26 September in Luleå, Lund and Umeå in parallel, with teams from eight universities and colleges, that no team solved all problems and none went unsolved, and that the winning team was the first two-person team to win.

    The problem list gives the letters A to G with a name for each (Souvenir, Ekvation, MEME, Valuta, Simuleringsproblematik, Rektor, Exotica), six of them linked to statement pages, and a link to a file of test data in DOS format. Those linked files are not part of our copy. The results list has 41 rows with a team name, institution and class code, a time for each solved problem, the number solved (ANTAL) and the total time (TID); three teams tie at place 39 with no problems solved. A key expands eight institution abbreviations.
