  description: |-
    Single page in Swedish on the 2001 Swedish student championship, held in parallel in Linköping, Lund and Umeå on 6 October. It links to the eight problems A to H (six as HTML pages, two as PDF files), to the test data as a zip file, to a photo directory from Lund and to a photo page from Umeå on another server.

    The result list is a plain-text table of 52 rows: 50 teams and two rows marked Vakant (Swedish for vacant) with no results. Each row gives rank, team name with institution code, a time for each solved problem among columns A to H, the number solved and the total time; unsolved problems are marked with a dash. Nineteen rows with no solved problems share rank 34, including the two Vakant rows. A legend expands the institution abbreviations.

    Our copy holds this page and its logo and two photographs. The problem statements, test data and photo pages it links to are not in it.
