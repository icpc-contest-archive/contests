    List of problems on Kattis for the source named Swedish Championships 2001: six problems (Antenna Placement, e-Coins, Killing Aliens in a Borg Maze, Rings, Submarines, The Uxuhul Voting System). For each it shows the fastest and shortest accepted submission, number of authors, number of full solves, solve ratio, difficulty rating and the languages of the statement, which is English for all six.

    The figures are those of Kattis on the day our copy was taken. The statements are on linked Kattis problem pages that are not part of this copy.
