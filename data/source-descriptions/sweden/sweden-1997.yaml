  description: |-
    Page in Swedish headed "1997 års tävling" ("the 1997 contest"): a report, a list of the seven problems and a results list. The report says the second Swedish championship for student programmers was held on 27 September in Lund and Luleå in parallel, with teams from eight universities and colleges, and describes how the lead changed during the contest.

    The problem list gives the letters A to G with a name for each (Kanon, Dna, FFT, Press, Sabotage, Frim, Fnutt); five of the names are links to statement pages, which are not part of our copy. The results list has 38 rows with a team name, institution and class code, a time for each solved problem, the number solved (ANTAL) and the total time (TID). Nine teams share place 27 with no problem solved, and the last three rows carry no result: one is marked Avbröt (withdrew) and two Uteblev (did not show up). A key expands eight institution abbreviations. The links to team pages lead outside our copy; the logo and the three linked photographs are in our copy.
