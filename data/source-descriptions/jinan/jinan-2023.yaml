    Editorial slides in Chinese, a PDF of 52 pages titled "The 2nd Universal Cup. Stage 17: Jinan", by SUA 程序设计竞赛命题组 (SUA chéngxù shèjì jìngsài mìngtí zǔ, "SUA Programming Contest Problem-Setting Team"), with 6 January 2024 on the cover. An overview slide sorts the problems into five stages from Easy to Hard, and the slides then take all 13 problems in that order (D, I, A, G, K, M, E, B, H, C, L, F, J), each with the task summed up (题意, tíyì, "problem summary") and its solution; J, Computational Intelligence, takes the most slides. M is headed "Almost Convex Polygon". The last slides point to the SUA wiki for written solutions with annotated reference code, and end with "Thank you!".
