  contest_date: '2013-11-17'
  description: |-
    Website of the 2013 ACM-ICPC Asia Regional Contest at Hunan University, Changsha, in Chinese with English headings. Our copy holds 34 files, 16 of them pages. The home page carries dated notices from 20 September to 23 October 2013: the online qualifier on 22 September on ZOJ, the school ranking and advancement rules with the registration procedure, the move of the on-site dates from 23-24 November to 16-17 November, the invitation letter and hotel booking. Four further pages repeat single notices.

    Downloads in our copy: Word files with the schedule of 15 to 17 November, the advancement rules and registration procedure, and the registration form; an Excel list of 80 universities with English and Chinese names, linked as the school ranking of the online round; an Excel list of hotels and prices; and an image file linked as the invitation letter.

    The site also holds the section of the national invitational held by the same host on 25-26 May 2013, a different contest: its front page, rules, registration notice, login form, travel directions, and a results page saying the contest has not started. Two ranking pages are inside: a summary board of the regional on-site contest, last updated 17 November 2013 14:03, with 192 teams; and a PC^2 summary of the invitational, last updated 26 May 2013, with 150 teams.
