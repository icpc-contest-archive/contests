  description: |-
    Scoreboard of the on-site contest, headed ICPC 2013 长沙赛区现场赛 排行榜 (ICPC 2013 Changsha regional on-site contest ranking list), stamped 2013/11/17 17:10:55 with a start time of 2013-11-17 09:00. It lists 192 teams with school rank (S#), university, rank, team name, number solved and time, and for each of the eleven problems A to K the tries and, for solved problems, the time. Each problem heading also carries two counts, for example 177/482 for A. A legend marks first solves, solved, attempted and pending cells. The page states that 15, 38 and 62 teams receive gold, silver and bronze.

    Five teams carry a star in place of a school rank and are ranked with the others. First place is SuperNova of 上海交通大学 (Shanghai Jiao Tong University) with 8 solved and a time of 938.
