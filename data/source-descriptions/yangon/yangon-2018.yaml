  description: |-
    Website of the 2018 ICPC Asia-Yangon Regional Programming Contest, hosted by the University of Computer Studies, Yangon, Myanmar, in English. Our copy holds one page, which carries the announcement, registration dates and fees, the programming environment (Ubuntu 16.04 PCs, PC 2 as judging system), the regional contest rules, the schedule of the rehearsal day, the contest day and the closing and awarding ceremony, and a sponsors section (a main sponsor, a gold sponsor and a global sponsor, with media partners). It names December 8 as the rehearsal and December 9, 2018 as the contest day. The footer menu links to the 2018 problem set PDF and the 2018 scoreboard page, which are separate documents; the registration section lists the 2016 and 2017 problem sets and previous contests, and a sentence about publishing the scoreboard links to the 2017 scoreboard page.

    The map is an embedded frame that loads from another server and is not part of our copy.
