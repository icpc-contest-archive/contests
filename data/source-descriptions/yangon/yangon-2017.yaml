    Scoreboard produced by PC^2 (version 9.5.0), headed 2017 Asia-Yangon Regional Programming Contest and dated December 9-10, 2017: 46 teams and twelve problems labelled A to L. Each team row gives rank, team name, number solved, total time, and for every problem the attempts and solving time in minutes (a dash instead of a time where unsolved), plus a total of attempts and solved problems. The top four teams solved 9 problems each; HCMUS-NyanCat is first. A last row gives per problem the submissions, the time of the first yes and the total yes. Teams with no solved problems share rank 42. Team names only, no institutions.
