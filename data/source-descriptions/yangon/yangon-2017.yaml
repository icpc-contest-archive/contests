  description: |-
    Website of the 2017 ACM-ICPC Asia-Yangon Regional Programming Contest, hosted by the University of Computer Studies, Yangon, Myanmar, in English. Our copy holds one page, which carries the announcement, registration dates and fees, the programming environment (Ubuntu 16.04 PCs, PC 2 as judging system), the regional contest rules, the schedule of the rehearsal day, the contest day and the closing ceremony, and hotel information. It names December 9 as the rehearsal and December 10, 2017 as the contest day. It links to the problem set PDF and the scoreboard page, which are separate documents, and to the contest's Facebook page and the previous contest's page.

    The map is an embedded frame that loads from another server and is not part of our copy.
